<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How educational psychology emerged as a field</title><desc id="d">A left-to-right timeline of five stages showing how educational psychology emerged, from teachers reasoning from experience alone, through psychology separating from philosophy and beginning to measure, early studies of memory and individual differences, and the move into real classrooms, to an established field with its own methods.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .ax{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}.dot{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5}.tk{stroke:var(--a4);stroke-width:2}.st{font-size:12.5px}.cap{font-size:13px;fill:var(--muted);font-style:italic}</style><rect class="bg" x="0" y="0" width="900" height="362"/><defs><marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><path class="ax" d="M30 232 L866 232" marker-end="url(#m3)"/><line class="tk" x1="110" y1="232" x2="110" y2="200"/><circle class="dot" cx="110" cy="232" r="9"/><text x="110" y="170" text-anchor="middle" class="st">teachers reason from</text><text x="110" y="186" text-anchor="middle" class="st">experience alone</text><line class="tk" x1="290" y1="232" x2="290" y2="248"/><circle class="dot" cx="290" cy="232" r="9"/><text x="290" y="278" text-anchor="middle" class="st">psychology separates</text><text x="290" y="294" text-anchor="middle" class="st">from philosophy and</text><text x="290" y="310" text-anchor="middle" class="st">begins measuring</text><line class="tk" x1="470" y1="232" x2="470" y2="200"/><circle class="dot" cx="470" cy="232" r="9"/><text x="470" y="154" text-anchor="middle" class="st">early studies of memory,</text><text x="470" y="170" text-anchor="middle" class="st">attention and individual</text><text x="470" y="186" text-anchor="middle" class="st">differences</text><line class="tk" x1="650" y1="232" x2="650" y2="248"/><circle class="dot" cx="650" cy="232" r="9"/><text x="650" y="278" text-anchor="middle" class="st">psychologists move into</text><text x="650" y="294" text-anchor="middle" class="st">real classrooms</text><line class="tk" x1="820" y1="232" x2="820" y2="200"/><circle class="dot" cx="820" cy="232" r="9"/><text x="820" y="154" text-anchor="middle" class="st">educational psychology</text><text x="820" y="170" text-anchor="middle" class="st">established, with its</text><text x="820" y="186" text-anchor="middle" class="st">own methods</text><text x="448" y="330" text-anchor="middle" class="cap">from opinion to evidence</text><text class="wm" x="888" y="352" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
