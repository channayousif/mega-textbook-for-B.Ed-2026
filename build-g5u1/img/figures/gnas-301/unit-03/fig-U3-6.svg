<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of the five hazard classes</title><desc id="d">Table of the five hazard classes with one example, health effect and one safety measure for each</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The five hazard classes, with controls</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Class</text><text class="h" x="150" y="75">One example</text><text class="h" x="400" y="75">Health effect</text><text class="h" x="590" y="75">One safety measure</text><rect class="panel-a" x="26" y="88" width="728" height="62"/><text class="sh" x="40" y="114">Physical</text><text class="body" x="150" y="114">a 45-degree classroom;</text><text class="body" x="150" y="134">generator exhaust beside it</text><text class="body" x="400" y="114">heat exhaustion;</text><text class="body" x="400" y="134">carbon monoxide</text><text class="body" x="590" y="114">shade, water, breaks;</text><text class="body" x="590" y="134">exhaust routed away</text><rect class="panel-b" x="26" y="150" width="728" height="62"/><text class="sh" x="40" y="176">Mechanical</text><text class="body" x="150" y="176">a collapsing wall;</text><text class="body" x="150" y="196">unguarded machinery</text><text class="body" x="400" y="176">cuts, crush injuries,</text><text class="body" x="400" y="196">falls</text><text class="body" x="590" y="176">barriers; guards;</text><text class="body" x="590" y="196">tagging out the danger</text><rect class="panel-c" x="26" y="212" width="728" height="62"/><text class="sh" x="40" y="238">Biological</text><text class="body" x="150" y="238">flood water; mould;</text><text class="body" x="150" y="258">insects and scorpions</text><text class="body" x="400" y="238">water-borne disease;</text><text class="body" x="400" y="258">bites; infection</text><text class="body" x="590" y="238">safe water; drying out;</text><text class="body" x="590" y="258">clearing debris</text><rect class="panel-c" x="26" y="274" width="728" height="62"/><text class="sh" x="40" y="300">Chemical</text><text class="body" x="150" y="300">cleaning acids; pesticide</text><text class="body" x="150" y="320">spray; a cylinder by a fire</text><text class="body" x="400" y="300">burns, poisoning;</text><text class="body" x="400" y="320">fire and blast</text><text class="body" x="590" y="300">labels; storage apart;</text><text class="body" x="590" y="320">directions followed</text><rect class="panel-d" x="26" y="336" width="728" height="62"/><text class="sh" x="40" y="362">Psychological</text><text class="body" x="150" y="362">displacement stress;</text><text class="body" x="150" y="382">unmanageable workload</text><text class="body" x="400" y="362">sleeplessness, anxiety,</text><text class="body" x="400" y="382">breakdown</text><text class="body" x="590" y="362">rotation, rest, someone</text><text class="body" x="590" y="382">to talk to</text><text class="small" x="390" y="432" text-anchor="middle">The quiet exposures, heat, dust, noise, stress, carry as much burden as the dramatic accidents.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
