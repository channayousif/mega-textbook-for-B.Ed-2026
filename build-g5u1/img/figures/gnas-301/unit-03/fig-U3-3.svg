<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a decibel ladder</title><desc id="d">Diagram of a decibel ladder from a quiet library at 30 dB to a pressure horn above 110 dB, with the hearing-damage zone marked above 85 dB</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The decibel ladder: how loud is it?</text><rect class="panel-a" x="60" y="62" width="120" height="40" rx="6"/><text class="sh" x="200" y="88">quiet library: 30 dB</text><rect class="panel-a" x="60" y="114" width="220" height="40" rx="6"/><text class="sh" x="300" y="140">normal conversation: 60 dB</text><line class="stroke-a" x1="40" y1="170" x2="740" y2="170" stroke-dasharray="7 5"/><text class="small" x="740" y="164" text-anchor="end">hearing-damage zone begins near 85 dB (sustained exposure)</text><rect class="panel-c" x="60" y="182" width="340" height="40" rx="6"/><text class="sh" x="360" y="208">busy road: 85 to 95 dB</text><rect class="panel-c" x="60" y="234" width="460" height="40" rx="6"/><text class="sh" x="480" y="260">generator: about 95 dB</text><rect class="panel-d" x="60" y="286" width="580" height="40" rx="6"/><text class="sh" x="590" y="312">pressure horn: 110+ dB</text><rect class="panel" x="60" y="356" width="680" height="72" rx="8"/><text class="sh" x="80" y="382">Every 10 dB is a tenfold increase in sound energy.</text><text class="body" x="80" y="408">70 dB at the corridor and 90 dB at the gate is not "a bit louder": it is about</text><text class="body" x="80" y="426">a hundred times the energy. The eye adjusts; the ear is injured.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
