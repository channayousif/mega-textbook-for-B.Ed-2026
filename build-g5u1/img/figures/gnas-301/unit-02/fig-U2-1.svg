<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of global water distribution as 100 droplets</title><desc id="d">Diagram of global water distribution as 100 droplets, 97 salt water, 2 ice and glaciers, under 1 groundwater, with rivers and lakes shown as a fraction of a single droplet</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">All the water on Earth, as 100 droplets</text><rect class="panel-b" x="30" y="60" width="470" height="150" rx="8"/><text class="sh" x="265" y="86" text-anchor="middle">97 droplets: salt water in the seas</text><g class="stroke-a" fill="none"><circle cx="70" cy="115" r="9"/><circle cx="100" cy="115" r="9"/><circle cx="130" cy="115" r="9"/><circle cx="160" cy="115" r="9"/><circle cx="190" cy="115" r="9"/><circle cx="220" cy="115" r="9"/><circle cx="250" cy="115" r="9"/><circle cx="280" cy="115" r="9"/><circle cx="310" cy="115" r="9"/><circle cx="340" cy="115" r="9"/><circle cx="370" cy="115" r="9"/><circle cx="400" cy="115" r="9"/><circle cx="430" cy="115" r="9"/><circle cx="460" cy="115" r="9"/><circle cx="70" cy="145" r="9"/><circle cx="100" cy="145" r="9"/><circle cx="130" cy="145" r="9"/><circle cx="160" cy="145" r="9"/><circle cx="190" cy="145" r="9"/><circle cx="220" cy="145" r="9"/><circle cx="250" cy="145" r="9"/><circle cx="280" cy="145" r="9"/><circle cx="310" cy="145" r="9"/><circle cx="340" cy="145" r="9"/><circle cx="370" cy="145" r="9"/><circle cx="400" cy="145" r="9"/><circle cx="430" cy="145" r="9"/><circle cx="460" cy="145" r="9"/><circle cx="70" cy="175" r="9"/><circle cx="100" cy="175" r="9"/><circle cx="130" cy="175" r="9"/><circle cx="160" cy="175" r="9"/><circle cx="190" cy="175" r="9"/><circle cx="220" cy="175" r="9"/><circle cx="250" cy="175" r="9"/><circle cx="280" cy="175" r="9"/><circle cx="310" cy="175" r="9"/><circle cx="340" cy="175" r="9"/><circle cx="370" cy="175" r="9"/><circle cx="400" cy="175" r="9"/><circle cx="430" cy="175" r="9"/><circle cx="460" cy="175" r="9"/></g><text class="small" x="265" y="200" text-anchor="middle">too salty to drink or irrigate with</text><rect class="panel-a" x="530" y="60" width="226" height="150" rx="8"/><text class="sh" x="643" y="86" text-anchor="middle">3 droplets: all fresh water</text><circle class="stroke" cx="585" cy="125" r="14"/><circle class="stroke" cx="620" cy="125" r="14"/><text class="body" x="602" y="160" text-anchor="middle">2 in ice and glaciers</text><circle class="stroke-a" cx="690" cy="125" r="14"/><text class="body" x="690" y="160" text-anchor="middle">under 1 underground</text><rect class="panel-c" x="30" y="240" width="720" height="150" rx="8"/><text class="sh" x="390" y="266" text-anchor="middle">Zoom in on the last sliver of one droplet</text><circle class="stroke" cx="390" cy="320" r="46"/><path class="stroke" d="M 375 320 a 15 15 0 0 1 30 0 z"/><text class="body" x="390" y="382" text-anchor="middle">rivers, lakes, the water we can see and use:</text><text class="small" x="390" y="400" text-anchor="middle">a fraction of one droplet out of 100</text><line class="stroke" x1="643" y1="215" x2="436" y2="294"/><text class="small" x="390" y="432" text-anchor="middle">There is a great deal of water; very little of it is in the form, place and season a household needs.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
