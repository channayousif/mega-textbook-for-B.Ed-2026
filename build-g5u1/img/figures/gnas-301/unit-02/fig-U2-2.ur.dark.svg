<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے چار پانی کے وسائل کا جدول</title><desc id="d">پاکستان کے چار پانی کے وسائل کا جدول: دریائے سندھ کا نظام، گلیشیئر اور برف کا پگھلنا، زیرِ زمین پانی اور بارش، ہر ایک کے ساتھ یہ کہ وہ کیا فراہم کرتا ہے، اس کی حالت اور ایک چیلنج</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">پاکستان کے پانی کے وسائل</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">وسیلہ</text><text class="h" x="570" y="75" text-anchor="end">کیا فراہم کرتا ہے</text><text class="h" x="360" y="75" text-anchor="end">حالت ایک سطر میں</text><text class="h" x="180" y="75" text-anchor="end">ایک چیلنج</text><rect class="panel-b" x="26" y="88" width="728" height="72"/><text class="sh" x="740" y="114" text-anchor="end">دریائے سندھ کا نظام</text><text class="body" x="570" y="114" text-anchor="end">زیادہ تر سطحی پانی؛</text><text class="body" x="570" y="134" text-anchor="end">دنیا کا سب سے بڑا</text><text class="body" x="570" y="154" text-anchor="end">نہری نظام</text><text class="body" x="360" y="114" text-anchor="end">پہلے ہی شدید دباؤ میں</text><text class="body" x="360" y="134" text-anchor="end">(نکاسی بمقابلہ بہاؤ،</text><text class="body" x="360" y="154" text-anchor="end">فی کس دستیابی)</text><text class="body" x="180" y="114" text-anchor="end">موسمی تبدیلیاں؛</text><text class="body" x="180" y="134" text-anchor="end">اوپری بہاؤ کی تبدیلیاں؛</text><text class="body" x="180" y="154" text-anchor="end">بڑھتی آبادی</text><rect class="panel-a" x="26" y="160" width="728" height="72"/><text class="sh" x="740" y="186" text-anchor="end">گلیشیئر اور</text><text class="sh" x="740" y="204" text-anchor="end">برف کا پگھلنا</text><text class="body" x="570" y="186" text-anchor="end">گرمیوں کے وہ بہاؤ جو</text><text class="body" x="570" y="206" text-anchor="end">بارش نہ ہونے پر دریا</text><text class="body" x="570" y="226" text-anchor="end">بھرتے ہیں</text><text class="body" x="360" y="186" text-anchor="end">پگھل رہے ہیں اور بدل</text><text class="body" x="360" y="206" text-anchor="end">رہے ہیں گرم</text><text class="body" x="360" y="226" text-anchor="end">موسم کے ساتھ</text><text class="body" x="180" y="186" text-anchor="end">بہاؤ کے وقت میں</text><text class="body" x="180" y="206" text-anchor="end">تبدیلی؛ زیادہ سیلاب</text><text class="body" x="180" y="226" text-anchor="end">اور خشک سالی</text><rect class="panel-c" x="26" y="232" width="728" height="72"/><text class="sh" x="740" y="258" text-anchor="end">زیرِ زمین پانی</text><text class="body" x="570" y="258" text-anchor="end">ٹیوب ویل اور ہینڈ</text><text class="body" x="570" y="278" text-anchor="end">پمپ جہاں نہریں</text><text class="body" x="570" y="298" text-anchor="end">نہیں پہنچتیں</text><text class="body" x="360" y="258" text-anchor="end">آہستہ بھرتا ہے؛</text><text class="body" x="360" y="278" text-anchor="end">غیر محفوظ ہو سکتا ہے،</text><text class="body" x="360" y="298" text-anchor="end">جیسا چاچرو کی تحقیق نے دکھایا</text><text class="body" x="180" y="258" text-anchor="end">زیادہ پمپنگ؛</text><text class="body" x="180" y="278" text-anchor="end">گرتا ہوا، نمکین</text><text class="body" x="180" y="298" text-anchor="end">پانی کی سطح</text><rect class="panel-d" x="26" y="304" width="728" height="72"/><text class="sh" x="740" y="330" text-anchor="end">بارش</text><text class="body" x="570" y="330" text-anchor="end">مون سون کا پانی خشک</text><text class="body" x="570" y="350" text-anchor="end">کھیتی اور ٹینک کے</text><text class="body" x="570" y="370" text-anchor="end">لیے</text><text class="body" x="360" y="330" text-anchor="end">غیر یکساں: شمال میں زیادہ،</text><text class="body" x="360" y="350" text-anchor="end">سندھ اور بلوچستان</text><text class="body" x="360" y="370" text-anchor="end">میں تھوڑا</text><text class="body" x="180" y="330" text-anchor="end">سیلاب میں بہہ جاتا ہے</text><text class="body" x="180" y="350" text-anchor="end">بجائے اس کے جہاں</text><text class="body" x="180" y="370" text-anchor="end">ضرورت ہو وہاں جذب ہو</text><text class="small" x="390" y="414" text-anchor="middle">پانی کی سلامتی = قابلِ قبول معیار اور مقدار تک قابلِ بھروسہ رسائی۔</text><text class="small" x="390" y="432" text-anchor="middle">مقدار اور معیار الگ الگ فیل ہوتے ہیں: سندھ دباؤ میں ہے، تھر کا پانی غیر محفوظ ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
