<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the Keenjhar Lake ecosystem</title><desc id="d">Concept map of the Keenjhar Lake ecosystem showing sunlight and water, producers, consumers at two levels, decomposers, and people taking fish and reeds from the system</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">One ecosystem: Keenjhar Lake</text><ellipse class="panel" cx="390" cy="240" rx="112" ry="58"/><text class="h" x="390" y="234" text-anchor="middle">Keenjhar Lake</text><text class="h" x="390" y="256" text-anchor="middle">ecosystem</text><rect class="panel-b" x="40" y="56" width="196" height="62" rx="8"/><text class="sh" x="138" y="80" text-anchor="middle">sunlight and water</text><text class="small" x="138" y="100" text-anchor="middle">abiotic surroundings</text><rect class="panel-a" x="544" y="56" width="196" height="62" rx="8"/><text class="sh" x="642" y="80" text-anchor="middle">plants and algae</text><text class="small" x="642" y="100" text-anchor="middle">producers, food from sunlight</text><rect class="panel-a" x="24" y="196" width="190" height="62" rx="8"/><text class="sh" x="119" y="220" text-anchor="middle">small fish, insects</text><text class="small" x="119" y="240" text-anchor="middle">first-level consumers</text><rect class="panel-a" x="566" y="196" width="190" height="62" rx="8"/><text class="sh" x="661" y="220" text-anchor="middle">large fish, birds</text><text class="small" x="661" y="240" text-anchor="middle">second-level consumers</text><rect class="panel-c" x="120" y="356" width="200" height="62" rx="8"/><text class="sh" x="220" y="380" text-anchor="middle">bacteria and fungi</text><text class="small" x="220" y="400" text-anchor="middle">decomposers, return remains to soil</text><rect class="panel-d" x="440" y="356" width="200" height="62" rx="8"/><text class="sh" x="540" y="380" text-anchor="middle">people</text><text class="small" x="540" y="400" text-anchor="middle">take fish and reeds, add waste</text><line class="stroke" x1="236" y1="118" x2="308" y2="206"/><line class="stroke" x1="544" y1="118" x2="472" y2="206"/><line class="stroke" x1="214" y1="227" x2="278" y2="234"/><line class="stroke" x1="566" y1="227" x2="502" y2="234"/><line class="stroke" x1="250" y1="356" x2="318" y2="290"/><line class="stroke" x1="520" y1="356" x2="462" y2="290"/><line class="stroke-a" x1="320" y1="356" x2="440" y2="386" stroke-dasharray="6 5"/><text class="small" x="390" y="448" text-anchor="middle">Energy flows one way; materials cycle. People connect by a dashed line.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
