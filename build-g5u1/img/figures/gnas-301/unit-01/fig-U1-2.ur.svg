<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ماحولیاتی سائنس کے پانچ شعبوں کی فہرست</title><desc id="d">ماحولیاتی سائنس کے پانچ شعبوں کا جدول: ہوا، پانی، زمین، جاندار اور انسانی نظام، ہر ایک کے ساتھ ایک رہنما سوال اور سندھ کی جماعت کی ایک مثال</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">ماحولیاتی سائنس کیا پڑھتی ہے: پانچ شعبے</text><rect class="panel" x="30" y="56" width="720" height="40"/><text class="h" x="734" y="82" text-anchor="end">شعبہ</text><text class="h" x="580" y="82" text-anchor="end">جو سوال پوچھتی ہے</text><text class="h" x="280" y="82" text-anchor="end">سندھ کی جماعت کی ایک مثال</text><rect class="panel-a" x="30" y="96" width="720" height="62"/><text class="sh" x="734" y="122" text-anchor="end">ہوا</text><text class="body" x="580" y="122" text-anchor="end">جس ہوا میں سانس لیتے ہیں</text><text class="body" x="580" y="142" text-anchor="end">اس میں کیا شامل کیا؟</text><text class="body" x="280" y="122" text-anchor="end">کراچی کے اسکول کے اسپورٹس</text><text class="body" x="280" y="142" text-anchor="end">دن سے پہلے اے کیو آئی پڑھنا</text><rect class="panel-b" x="30" y="158" width="720" height="62"/><text class="sh" x="734" y="184" text-anchor="end">پانی</text><text class="body" x="580" y="184" text-anchor="end">پانی کہاں سے آتا ہے،</text><text class="body" x="580" y="204" text-anchor="end">لوٹتے وقت اس میں کیا ہوتا ہے؟</text><text class="body" x="280" y="184" text-anchor="end">اسکول کے نل کو سندھ یا</text><text class="body" x="280" y="204" text-anchor="end">زیرِ زمین پانی تک پوچھنا</text><rect class="panel-c" x="30" y="220" width="720" height="62"/><text class="sh" x="734" y="246" text-anchor="end">زمین</text><text class="body" x="580" y="246" text-anchor="end">مٹی اور چٹان کیسے استعمال ہوتی ہے،</text><text class="body" x="580" y="266" text-anchor="end">اور اب ان پر کیا ہے؟</text><text class="body" x="280" y="246" text-anchor="end">سندھ کے آبگشتہ کھیت پر</text><text class="body" x="280" y="266" text-anchor="end">سفید نمک کی پرت</text><rect class="panel-d" x="30" y="282" width="720" height="62"/><text class="sh" x="734" y="308" text-anchor="end">جاندار</text><text class="body" x="580" y="308" text-anchor="end">کتنی اقسام یہاں رہتی ہیں، اور</text><text class="body" x="580" y="328" text-anchor="end">مسکن بدلنے پر کیا ہوتا ہے؟</text><text class="body" x="280" y="308" text-anchor="end">کینجھر جھیل کی مچھلیاں اور پرندے</text><rect class="panel" x="30" y="344" width="720" height="62"/><text class="sh" x="734" y="370" text-anchor="end">انسانی نظام</text><text class="body" x="580" y="370" text-anchor="end">قانون، قیمت، شہر اور عادتیں</text><text class="body" x="580" y="390" text-anchor="end">ان سب کو کیسے چلاتے ہیں؟</text><text class="body" x="280" y="370" text-anchor="end">بوتل بند پانی کی قیمت</text><text class="body" x="280" y="390" text-anchor="end">بمقابلہ گھر سے بھری بوتل</text><text class="small" x="390" y="436" text-anchor="middle">ایک چیز، چار کرے، ایک انسانی نظام: موضوع 1.1 کی تجزیاتی عادت۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
