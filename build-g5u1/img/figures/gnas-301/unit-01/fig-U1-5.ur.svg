<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کینجھر جھیل کے ماحولیاتی نظام کا تصوراتی نقشہ</title><desc id="d">کینجھر جھیل کے ماحولیاتی نظام کا نقشہ: سورج کی روشنی اور پانی، پیدا کار، دو درجوں کے صارف، گلانے والے، اور انسان جو نظام سے مچھلی اور سرکنڈے لیتے ہیں</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">ایک ماحولیاتی نظام: کینجھر جھیل</text><ellipse class="panel" cx="390" cy="240" rx="112" ry="58"/><text class="h" x="390" y="234" text-anchor="middle">کینجھر جھیل</text><text class="h" x="390" y="256" text-anchor="middle">ماحولیاتی نظام</text><rect class="panel-b" x="544" y="56" width="196" height="62" rx="8"/><text class="sh" x="642" y="80" text-anchor="middle">روشنی اور پانی</text><text class="small" x="642" y="100" text-anchor="middle">بے جان ماحول</text><rect class="panel-a" x="40" y="56" width="196" height="62" rx="8"/><text class="sh" x="138" y="80" text-anchor="middle">پودے اور الگی</text><text class="small" x="138" y="100" text-anchor="middle">پیدا کار، روشنی سے خوراک</text><rect class="panel-a" x="566" y="196" width="190" height="62" rx="8"/><text class="sh" x="661" y="220" text-anchor="middle">چھوٹی مچھلیاں، کیڑے</text><text class="small" x="661" y="240" text-anchor="middle">پہلے درجے کے صارف</text><rect class="panel-a" x="24" y="196" width="190" height="62" rx="8"/><text class="sh" x="119" y="220" text-anchor="middle">بڑی مچھلیاں، پرندے</text><text class="small" x="119" y="240" text-anchor="middle">دوسرے درجے کے صارف</text><rect class="panel-c" x="460" y="356" width="200" height="62" rx="8"/><text class="sh" x="560" y="380" text-anchor="middle">بیکٹیریا اور فنگس</text><text class="small" x="560" y="400" text-anchor="middle">گلانے والے، باقیات مٹی کو لوٹاتے ہیں</text><rect class="panel-d" x="140" y="356" width="200" height="62" rx="8"/><text class="sh" x="240" y="380" text-anchor="middle">انسان</text><text class="small" x="240" y="400" text-anchor="middle">مچھلی اور سرکنڈے لیتے، کچرا ڈالتے ہیں</text><line class="stroke" x1="544" y1="118" x2="472" y2="206"/><line class="stroke" x1="236" y1="118" x2="308" y2="206"/><line class="stroke" x1="566" y1="227" x2="502" y2="234"/><line class="stroke" x1="214" y1="227" x2="278" y2="234"/><line class="stroke" x1="530" y1="356" x2="462" y2="290"/><line class="stroke" x1="260" y1="356" x2="318" y2="290"/><line class="stroke-a" x1="460" y1="356" x2="340" y2="386" stroke-dasharray="6 5"/><text class="small" x="390" y="448" text-anchor="middle">توانائی ایک راستے پر بہتی ہے؛ مادے چکر لگاتے ہیں۔ انسان ڈاٹڈ لکیر سے جڑے ہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
