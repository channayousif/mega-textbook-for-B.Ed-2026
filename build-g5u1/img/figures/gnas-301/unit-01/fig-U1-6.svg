<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six Pakistani natural resources</title><desc id="d">Table of six Pakistani natural resources, Indus water, lake fish, solar energy, soil, coal and natural gas, each classified as renewable or non-renewable with its main issue and one management response</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Pakistani natural resources: renewable or not?</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Resource</text><text class="h" x="196" y="75">Renewable?</text><text class="h" x="316" y="75">The issue in one line</text><text class="h" x="556" y="75">Management response</text><rect class="panel-a" x="26" y="88" width="728" height="52"/><text class="sh" x="40" y="112">Indus water</text><text class="body" x="196" y="112">yes, at a rate</text><text class="body" x="316" y="112">withdrawals already highly stressed</text><text class="body" x="556" y="112">stay below renewal: quotas</text><rect class="panel-a" x="26" y="140" width="728" height="52"/><text class="sh" x="40" y="164">lake fish</text><text class="body" x="196" y="164">yes, at a rate</text><text class="body" x="316" y="164">catch can exceed breeding</text><text class="body" x="556" y="164">season and mesh limits</text><rect class="panel-a" x="26" y="192" width="728" height="52"/><text class="sh" x="40" y="216">Thar sunlight</text><text class="body" x="196" y="216">yes</text><text class="body" x="316" y="216">collection cost, not supply</text><text class="body" x="556" y="216">solar panels off-grid</text><rect class="panel-a" x="26" y="244" width="728" height="52"/><text class="sh" x="40" y="268">soil</text><text class="body" x="196" y="268">yes, slowly</text><text class="body" x="316" y="268">salinity and erosion strip it faster</text><text class="body" x="556" y="268">drainage, cover crops</text><rect class="panel-c" x="26" y="296" width="728" height="52"/><text class="sh" x="40" y="320">Thar coal</text><text class="body" x="196" y="320">no</text><text class="body" x="316" y="320">fixed stock; burning adds carbon</text><text class="body" x="556" y="320">plan what replaces it</text><rect class="panel-c" x="26" y="348" width="728" height="52"/><text class="sh" x="40" y="372">natural gas</text><text class="body" x="196" y="372">no</text><text class="body" x="316" y="372">wells deplete; imports fill the gap</text><text class="body" x="556" y="372">order use: industry first</text><text class="small" x="390" y="432" text-anchor="middle">The management question: rate of use for renewables (tinted rows),</text><text class="small" x="390" y="448" text-anchor="middle">order and replacement for non-renewables (accent rows).</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
