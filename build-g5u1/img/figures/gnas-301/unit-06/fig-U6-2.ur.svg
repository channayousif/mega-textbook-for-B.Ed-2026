<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زہریلے مادوں کی چھ اقسام</title><desc id="d">زہریلے مادوں کی چھ اقسام کا جدول: مثالیں، اصل اور ایک اہم خصوصیت</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">زہریلے مادوں کی چھ اقسام</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">قسم</text><text class="h" x="580" y="75" text-anchor="end">مثالیں</text><text class="h" x="350" y="75" text-anchor="end">اصل</text><text class="h" x="220" y="75" text-anchor="end">اہم خصوصیت</text><rect class="panel-a" x="26" y="88" width="728" height="52"/><text class="sh" x="740" y="114" text-anchor="end">کیڑے مار</text><text class="body" x="580" y="114" text-anchor="end">کاٹن سپرے، چوہے مار</text><text class="body" x="350" y="114" text-anchor="end">انسانی</text><text class="body" x="220" y="114" text-anchor="end">مارنے کے لیے بنا</text><rect class="panel-b" x="26" y="140" width="728" height="52"/><text class="sh" x="740" y="166" text-anchor="end">بھاری دھاتیں</text><text class="body" x="580" y="166" text-anchor="end">سیسہ، آرسینک، پارا</text><text class="body" x="350" y="166" text-anchor="end">دونوں</text><text class="body" x="220" y="166" text-anchor="end">کبھی نہیں بگڑتے</text><rect class="panel-c" x="26" y="192" width="728" height="52"/><text class="sh" x="740" y="218" text-anchor="end">سالوینٹ</text><text class="body" x="580" y="218" text-anchor="end">پینٹ تھنر، ڈرائی کلیننگ</text><text class="body" x="350" y="218" text-anchor="end">انسانی</text><text class="body" x="220" y="218" text-anchor="end">چربی میں گھلتے</text><rect class="panel-d" x="26" y="244" width="728" height="52"/><text class="sh" x="740" y="270" text-anchor="end">قدری زہر</text><text class="body" x="580" y="270" text-anchor="end">سانپ کا زہر، پودوں کے الکلائیڈ</text><text class="body" x="350" y="270" text-anchor="end">قدری</text><text class="body" x="220" y="270" text-anchor="end">فوراً اثر</text><rect class="panel" x="26" y="296" width="728" height="52"/><text class="sh" x="740" y="322" text-anchor="end">دوائیں</text><text class="body" x="580" y="322" text-anchor="end">غلط خوراک کی دوا</text><text class="body" x="350" y="322" text-anchor="end">انسانی</text><text class="body" x="220" y="322" text-anchor="end">خوراک زہر طے کرتی ہے</text><rect class="panel" x="26" y="348" width="728" height="52"/><text class="sh" x="740" y="374" text-anchor="end">گھریلو کیمیکل</text><text class="body" x="580" y="374" text-anchor="end">صفائی، بلیچ، تیزاب</text><text class="body" x="350" y="374" text-anchor="end">انسانی</text><text class="body" x="220" y="374" text-anchor="end">بچوں کی پہنچ میں</text><text class="small" x="390" y="422" text-anchor="middle">اصل کا محور قابو طے کرتا ہے: بنائے زہر پر پابندی، قدری زہر صرف انتظام۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
