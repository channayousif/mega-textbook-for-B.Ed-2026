<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">گرین ہاؤس اثر کا خاکہ</title><desc id="d">گرین ہاؤس اثر کا خاکہ: مختصر لہر سورج اندر، طویل لہر حرارت باہر، گیسے اس کا حصہ روکتی ہیں، قدرتی اور بڑھے ہوئے پینل کے ساتھ</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">شیشہ اور اضافی شیٹیں</text><circle class="panel-c" cx="690" cy="90" r="34"/><text class="sh" x="690" y="96" text-anchor="middle">سورج</text><rect class="panel" x="40" y="380" width="700" height="40"/><text class="sh" x="390" y="406" text-anchor="middle">زمین کی سطح، سورج سے گرم</text><rect class="panel-a" x="40" y="200" width="700" height="46" rx="10"/><text class="sh" x="390" y="222" text-anchor="middle">گرین ہاؤس گیسے: آبی بخارات، CO2، میتھین، N2O</text><text class="small" x="390" y="240" text-anchor="middle">سورج گزارتی، نکلتی حرارت کا حصہ روکتی</text><line class="stroke" x1="656" y1="110" x2="480" y2="376" marker-end="url(#arrow)"/><text class="small" x="620" y="240" text-anchor="end">مختصر لہر سورج اندر</text><line class="stroke" x1="320" y1="376" x2="220" y2="250" marker-end="url(#arrow)"/><text class="small" x="200" y="300" text-anchor="end">طویل لہر حرارت باہر</text><line class="stroke-a" x1="300" y1="246" x2="360" y2="376" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="small" x="450" y="330" text-anchor="end">حصہ نیچے لوٹتا</text><rect class="panel" x="380" y="60" width="360" height="100" rx="8"/><text class="sh" x="724" y="86" text-anchor="end">قدری توازن (شیشہ)</text><text class="body" x="724" y="110" text-anchor="end">قدری اثر کے بغیر زمین جمتی ہوتی۔</text><text class="body" x="724" y="132" text-anchor="end">شیشہ کمرے کو زندہ رکھتا ہے۔</text><rect class="panel-d" x="25" y="60" width="335" height="100" rx="8"/><text class="sh" x="344" y="86" text-anchor="end">بڑھا ہوا (اضافی شیٹیں)</text><text class="body" x="344" y="110" text-anchor="end">جیواشم ایندھن اور جنگلات کٹائی پٹی موٹی کرتے ہیں:</text><text class="body" x="344" y="132" text-anchor="end">زیادہ گیس، زیادہ حرارت، گرم دنیا۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
