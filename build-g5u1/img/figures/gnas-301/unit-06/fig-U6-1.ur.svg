<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زہریلی مادوں کے علم کے چار سوالوں کا تصوراتی نقشہ</title><desc id="d">زہریلی مادوں کے علم کے چار سوالوں کا نقشہ: مادہ، راستہ، اثر اور خوراک، مرکزی گرہ سے، خوراک نمایاں</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">زہریلی مادوں کا علم چار سوال پوچھتا ہے</text><ellipse class="panel" cx="390" cy="250" rx="102" ry="54"/><text class="h" x="390" y="244" text-anchor="middle">زہریلی مادوں کا علم</text><text class="small" x="390" y="268" text-anchor="middle">نقصان دہ اثرات کا مطالعہ</text><rect class="panel-a" x="566" y="80" width="184" height="64" rx="8"/><text class="sh" x="658" y="106" text-anchor="middle">مادہ</text><text class="small" x="658" y="128" text-anchor="middle">یہ کیا مادہ ہے؟</text><rect class="panel-a" x="30" y="80" width="184" height="64" rx="8"/><text class="sh" x="122" y="106" text-anchor="middle">راستہ</text><text class="small" x="122" y="128" text-anchor="middle">اندر کیسے آتا ہے؟</text><rect class="panel-a" x="566" y="360" width="184" height="64" rx="8"/><text class="sh" x="658" y="386" text-anchor="middle">اثر</text><text class="small" x="658" y="408" text-anchor="middle">کیا کرتا ہے؟</text><rect class="panel-d" x="30" y="360" width="184" height="64" rx="8"/><text class="sh" x="122" y="386" text-anchor="middle">خوراک</text><text class="small" x="122" y="408" text-anchor="middle">کتنی مقدار چاہیے؟</text><line class="stroke" x1="566" y1="130" x2="464" y2="216"/><line class="stroke" x1="214" y1="130" x2="316" y2="216"/><line class="stroke" x1="566" y1="370" x2="464" y2="284"/><line class="stroke" x1="214" y1="370" x2="316" y2="284"/><text class="small" x="122" y="440" text-anchor="middle">بنیادی سوال</text><text class="small" x="390" y="440" text-anchor="middle">خوراک زہر بناتی ہے؛ بعض مادوں کا کوئی محفوظ سطح نہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
