<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of climate change</title><desc id="d">Concept map of climate change, causes on the left feeding a central node, effects on the right, with mitigation and adaptation response branches</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Climate change: causes, effects, responses</text><rect class="panel-c" x="40" y="80" width="150" height="46" rx="8"/><text class="sh" x="115" y="109" text-anchor="middle">fossil energy</text><line class="stroke" x1="190" y1="103" x2="278" y2="240"/><rect class="panel-c" x="40" y="150" width="150" height="46" rx="8"/><text class="sh" x="115" y="179" text-anchor="middle">deforestation</text><line class="stroke" x1="190" y1="173" x2="278" y2="240"/><rect class="panel-c" x="40" y="220" width="150" height="46" rx="8"/><text class="sh" x="115" y="249" text-anchor="middle">industry</text><line class="stroke" x1="190" y1="243" x2="278" y2="240"/><rect class="panel-c" x="40" y="290" width="150" height="46" rx="8"/><text class="sh" x="115" y="319" text-anchor="middle">agriculture</text><line class="stroke" x1="190" y1="313" x2="278" y2="240"/><ellipse class="panel" cx="340" cy="240" rx="62" ry="52"/><text class="h" x="340" y="236" text-anchor="middle">climate</text><text class="h" x="340" y="258" text-anchor="middle">change</text><rect class="panel-b" x="480" y="80" width="150" height="46" rx="8"/><text class="sh" x="555" y="109" text-anchor="middle">heatwaves</text><line class="stroke" x1="402" y1="240" x2="478" y2="103"/><rect class="panel-b" x="480" y="150" width="150" height="46" rx="8"/><text class="sh" x="555" y="179" text-anchor="middle">floods</text><line class="stroke" x1="402" y1="240" x2="478" y2="173"/><rect class="panel-b" x="480" y="220" width="150" height="46" rx="8"/><text class="sh" x="555" y="249" text-anchor="middle">sea level rise</text><line class="stroke" x1="402" y1="240" x2="478" y2="243"/><rect class="panel-b" x="480" y="290" width="150" height="46" rx="8"/><text class="sh" x="555" y="319" text-anchor="middle">health harms</text><line class="stroke" x1="402" y1="240" x2="478" y2="313"/><rect class="panel-a" x="200" y="380" width="170" height="60" rx="8"/><text class="sh" x="285" y="404" text-anchor="middle">mitigation</text><text class="small" x="285" y="426" text-anchor="middle">cut the causes, for the future</text><rect class="panel-d" x="410" y="380" width="170" height="60" rx="8"/><text class="sh" x="495" y="404" text-anchor="middle">adaptation</text><text class="small" x="495" y="426" text-anchor="middle">soften the harms, now</text><path class="stroke" d="M 300 380 L 310 296" marker-end="url(#arrow)"/><path class="stroke" d="M 480 380 L 470 296" marker-end="url(#arrow)"/><text class="small" x="390" y="448" text-anchor="middle">Partners, not alternatives: one answers the future, the other the present.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
