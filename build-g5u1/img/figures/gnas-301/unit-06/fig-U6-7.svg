<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the greenhouse effect</title><desc id="d">Diagram of the greenhouse effect, shortwave sunlight in, longwave heat out, greenhouse gases trapping part of it, with natural and enhanced panels</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The glass and the extra panes</text><circle class="panel-c" cx="90" cy="90" r="34"/><text class="sh" x="90" y="96" text-anchor="middle">sun</text><rect class="panel" x="40" y="380" width="700" height="40"/><text class="sh" x="390" y="406" text-anchor="middle">the Earth surface, warmed by the sunlight</text><rect class="panel-a" x="40" y="200" width="700" height="46" rx="10"/><text class="sh" x="390" y="222" text-anchor="middle">greenhouse gases: water vapour, CO2, methane, N2O</text><text class="small" x="390" y="240" text-anchor="middle">let sunlight through, absorb part of the outgoing heat</text><line class="stroke" x1="124" y1="110" x2="300" y2="376" marker-end="url(#arrow)"/><text class="small" x="160" y="240">short-wave sunlight in</text><line class="stroke" x1="460" y1="376" x2="560" y2="250" marker-end="url(#arrow)"/><text class="small" x="580" y="300">long-wave heat out</text><line class="stroke-a" x1="480" y1="246" x2="420" y2="376" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="small" x="330" y="330">part returned down</text><rect class="panel" x="40" y="60" width="360" height="100" rx="8"/><text class="sh" x="56" y="86">Natural balance (the glass)</text><text class="body" x="56" y="110">Without the natural effect, the Earth would average far below freezing.</text><text class="body" x="56" y="132">The glass keeps the room alive.</text><rect class="panel-d" x="420" y="60" width="335" height="100" rx="8"/><text class="sh" x="436" y="86">Enhanced (the extra panes)</text><text class="body" x="436" y="110">Fossil fuels and deforestation thicken the band:</text><text class="body" x="436" y="132">more gas, more heat, a warmer world.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
