<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جذب کے راستوں کا فلو چارٹ</title><desc id="d">جذب کے راستوں کا فلو چارٹ: سانس، خوراک اور جلد، خون کے ذریعے ہدف عضو تک، کیڑے مار مثال تینوں پر سوار</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">تین دروازے، ایک سفر</text><rect class="panel-a" x="540" y="70" width="200" height="76" rx="8"/><text class="sh" x="640" y="98" text-anchor="middle">سانس</text><text class="small" x="640" y="122" text-anchor="middle">پھیپھڑا، تیز ترین</text><path class="stroke" d="M640 146 L640 200 L390 200 L390 236" marker-end="url(#arrow)"/><rect class="panel-b" x="290" y="70" width="200" height="76" rx="8"/><text class="sh" x="390" y="98" text-anchor="middle">خوراک</text><text class="small" x="390" y="122" text-anchor="middle">آنتیں، کھانا اور پانی</text><path class="stroke" d="M390 146 L390 200 L390 200 L390 236" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="70" width="200" height="76" rx="8"/><text class="sh" x="140" y="98" text-anchor="middle">جلد</text><text class="small" x="140" y="122" text-anchor="middle">چھڑکنے والے کا راستہ</text><path class="stroke" d="M140 146 L140 200 L390 200 L390 236" marker-end="url(#arrow)"/><rect class="panel" x="290" y="240" width="200" height="60" rx="8"/><text class="sh" x="390" y="264" text-anchor="middle">خون</text><text class="small" x="390" y="286" text-anchor="middle">پہنچنے والی خوراک دروازے پر منحصر</text><line class="stroke" x1="390" y1="300" x2="390" y2="330" marker-end="url(#arrow)"/><rect class="panel-d" x="290" y="334" width="200" height="60" rx="8"/><text class="sh" x="390" y="358" text-anchor="middle">ہدف عضو</text><text class="small" x="390" y="380" text-anchor="middle">جہاں نقصان ہوتا ہے</text><rect class="panel" x="540" y="240" width="200" height="154" rx="8"/><text class="sh" x="640" y="266" text-anchor="middle">حلیہ مثال</text><text class="small" x="640" y="290" text-anchor="middle">ایک کسان، ایک کیڑے مار،</text><text class="small" x="640" y="310" text-anchor="middle">تین دروازے: بھیگا سپرے جلد پر،</text><text class="small" x="640" y="330" text-anchor="middle">سانس میں دھند، اور</text><text class="small" x="640" y="350" text-anchor="middle">ہاتھ سے منہ کھانا۔ راستوں کا</text><text class="small" x="640" y="370" text-anchor="middle">میلان خوراک طے کرتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
