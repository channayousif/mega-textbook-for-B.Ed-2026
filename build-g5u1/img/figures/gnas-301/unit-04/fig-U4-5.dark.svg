<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of internal control as five stacked layers</title><desc id="d">Diagram of internal control as five stacked layers, management philosophy, policies, procedures, supervision and records, each catching what the one above misses</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Internal control: five layers, one funnel</text><rect class="panel-d" x="110.0" y="60" width="560" height="52" rx="8"/><text class="sh" x="390" y="82" text-anchor="middle">1. management philosophy</text><text class="small" x="390" y="102" text-anchor="middle">what the owner actually rewards</text><rect class="panel-a" x="140.0" y="122" width="500" height="52" rx="8"/><text class="sh" x="390" y="144" text-anchor="middle">2. policies</text><text class="small" x="390" y="164" text-anchor="middle">the written rules</text><rect class="panel-a" x="170.0" y="184" width="440" height="52" rx="8"/><text class="sh" x="390" y="206" text-anchor="middle">3. procedures</text><text class="small" x="390" y="226" text-anchor="middle">step-by-step practice</text><rect class="panel-b" x="200.0" y="246" width="380" height="52" rx="8"/><text class="sh" x="390" y="268" text-anchor="middle">4. supervision</text><text class="small" x="390" y="288" text-anchor="middle">someone checking, with authority</text><rect class="panel-b" x="230.0" y="308" width="320" height="52" rx="8"/><text class="sh" x="390" y="330" text-anchor="middle">5. records</text><text class="small" x="390" y="350" text-anchor="middle">what is written down and read</text><text class="small" x="390" y="396" text-anchor="middle">Each layer catches what the one above misses; the top layer decides whether the others function.</text><text class="small" x="390" y="416" text-anchor="middle">If the foreman's target is output and the owner ignores reports, the guard stays off, whatever the sheet says.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
