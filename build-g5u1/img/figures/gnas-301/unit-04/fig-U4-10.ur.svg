<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایچ ایس ای کے تین ماپ اور ماڈل</title><desc id="d">ایچ ایس ای کے تین ماپ اور ماڈل کا جدول: واقعات کا ہرم، سوئس پنیر ماڈل، حفاظتی ماحول سروے، ہر ایک کیا دکھاتا ہے اور کس چیز پر خاموش ہے</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">ایچ ایس ای کے تین ماپ اور ماڈل</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">ماڈل یا ماپ</text><text class="h" x="540" y="75" text-anchor="end">کیا دکھاتا ہے</text><text class="h" x="260" y="75" text-anchor="end">کس پر خاموش ہے</text><rect class="panel-a" x="26" y="88" width="728" height="76"/><text class="sh" x="740" y="114" text-anchor="end">واقعات کا ہرم</text><text class="body" x="540" y="114" text-anchor="end">سنگین نقصان ایک وسیع</text><text class="body" x="540" y="133" text-anchor="end">بچے ہوئے واقعات پر بیٹھا ہے</text><text class="body" x="260" y="114" text-anchor="end">درست تناسب (متنازع)</text><rect class="panel-b" x="26" y="164" width="728" height="76"/><text class="sh" x="740" y="190" text-anchor="end">سوئس پنیر ماڈل</text><text class="body" x="540" y="190" text-anchor="end">دفاع تب ناکام ہوتا ہے</text><text class="body" x="540" y="209" text-anchor="end">جب سوراخ ایک لائن میں آئیں</text><text class="body" x="260" y="190" text-anchor="end">اگلا کون سا سوراخ ہلے</text><rect class="panel-c" x="26" y="240" width="728" height="76"/><text class="sh" x="740" y="266" text-anchor="end">حفاظتی ماحول سروے</text><text class="body" x="540" y="266" text-anchor="end">کارکن کیا یقین رکھتے ہیں</text><text class="body" x="540" y="285" text-anchor="end">انتظام انعامت دیتا ہے</text><text class="body" x="260" y="266" text-anchor="end">انتظام کہتا ہے کیا دیتا ہے</text><text class="small" x="390" y="338" text-anchor="middle">بچے ہوئے واقعے کی رپورٹ سب سے سستا ماپ ہے: ہرم کی بنیاد میں اگلا سنگین واقعہ دکھائی دیتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
