<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five worker health challenges</title><desc id="d">Table of five worker health challenges, heat, dust, noise, stress and ergonomics, each with a workplace example, an external-environment interaction and one control</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Five worker health challenges</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Challenge</text><text class="h" x="200" y="75">Workplace example</text><text class="h" x="420" y="75">External interaction</text><text class="h" x="600" y="75">One control</text><rect class="panel-a" x="26" y="88" width="728" height="56"/><text class="sh" x="40" y="114">Heat</text><text class="body" x="200" y="114">uncooled June classroom</text><text class="body" x="420" y="114">the season crosses the gate</text><text class="body" x="600" y="114">water, shade, schedule</text><rect class="panel-b" x="26" y="144" width="728" height="56"/><text class="sh" x="40" y="170">Dust</text><text class="body" x="200" y="170">the cotton mill for years</text><text class="body" x="420" y="170">open yards, dry winds</text><text class="body" x="600" y="170">extraction, masks</text><rect class="panel-c" x="26" y="200" width="728" height="56"/><text class="sh" x="40" y="226">Noise</text><text class="body" x="200" y="226">the machine line all day</text><text class="body" x="420" y="226">the road beside the wall</text><text class="body" x="600" y="226">maintenance, barriers</text><rect class="panel-d" x="26" y="256" width="728" height="56"/><text class="sh" x="40" y="282">Stress</text><text class="body" x="200" y="282">exam-week invigilation</text><text class="body" x="420" y="282">insecurity, thin staffing</text><text class="body" x="600" y="282">rotation, rest, voice</text><rect class="panel" x="26" y="312" width="728" height="56"/><text class="sh" x="40" y="338">Ergonomics</text><text class="body" x="200" y="338">the water drum lifted daily</text><text class="body" x="420" y="338">no lift, no trolley</text><text class="body" x="600" y="338">trolleys, technique</text><text class="small" x="390" y="390" text-anchor="middle">The quiet exposures never make a report; that is why they need a register.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
