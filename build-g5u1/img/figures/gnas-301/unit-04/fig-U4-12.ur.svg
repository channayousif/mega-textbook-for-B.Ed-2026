<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں لاگو ایچ ایس ای قوانین اور ضوابط</title><desc id="d">پاکستان میں لاگو ایچ ایس ای قوانین کی پانچ تہوں کا جدول: ہر ایک کیا چلاتا ہے اور کون نافذ کرتا ہے</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">پاکستان میں لاگو ایچ ایس ای قوانین</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">آلہ</text><text class="h" x="540" y="75" text-anchor="end">کیا چلاتا ہے</text><text class="h" x="220" y="75" text-anchor="end">کون نافذ کرتا ہے</text><rect class="panel-a" x="26" y="88" width="728" height="58"/><text class="sh" x="740" y="114" text-anchor="end">پی ای پی اے 1997 + این ای کیو ایس</text><text class="body" x="540" y="114" text-anchor="end">اخراج، کچرا، گندے پانی کی حدیں</text><text class="body" x="220" y="114" text-anchor="end">وفاقی اور صوبائی ای پی اے</text><rect class="panel-b" x="26" y="146" width="728" height="58"/><text class="sh" x="740" y="172" text-anchor="end">فیکٹریز ایکٹ 1934</text><text class="body" x="540" y="172" text-anchor="end">جالیاں، ہوا، اوقات،</text><text class="body" x="540" y="191" text-anchor="end">بہبود کے نظام</text><text class="body" x="220" y="172" text-anchor="end">صوبائی انسپکٹوریٹ</text><rect class="panel-c" x="26" y="204" width="728" height="58"/><text class="sh" x="740" y="230" text-anchor="end">مزدوری قانون اور کوڈ</text><text class="body" x="540" y="230" text-anchor="end">روزگار کے فرائض</text><text class="body" x="220" y="230" text-anchor="end">صوبائی مزدوری محکمے</text><rect class="panel-d" x="26" y="262" width="728" height="58"/><text class="sh" x="740" y="288" text-anchor="end">شعبے کے قواعد</text><text class="body" x="540" y="288" text-anchor="end">تعمیر، کیڑے مار، ٹرانسپورٹ</text><text class="body" x="540" y="307" text-anchor="end">شعبے کے مخصوص قواعد</text><text class="body" x="220" y="288" text-anchor="end">شعبے کا اپنا محکمہ</text><rect class="panel" x="26" y="320" width="728" height="58"/><text class="sh" x="740" y="346" text-anchor="end">آئی ایل او کنونشن</text><text class="body" x="540" y="346" text-anchor="end">بین الاقوامی نکتہ نظر</text><text class="body" x="220" y="346" text-anchor="end">ریاست کی توثیق سے</text><text class="small" x="390" y="400" text-anchor="middle">18ویں ترمیم (2010) سے زیادہ تر اختیار صوبائی ہے: قومی حد اور صوبائی تفصیل دونوں جانچیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
