<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of four workplace sectors and their characteristic hazards</title><desc id="d">Diagram of four workplace sectors, industry, construction, agriculture and services, each panel with its characteristic hazards labelled</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Four sectors, four hazard portraits</text><rect class="panel-a" x="26" y="60" width="172" height="180" rx="10"/><text class="sh" x="112" y="88" text-anchor="middle">industry</text><text class="small" x="112" y="120" text-anchor="middle">dust and</text><text class="small" x="112" y="134" text-anchor="middle">fumes for years</text><text class="small" x="112" y="164" text-anchor="middle">unguarded machines, noise</text><text class="small" x="112" y="208" text-anchor="middle">heat beside furnaces</text><rect class="panel-b" x="212" y="60" width="172" height="180" rx="10"/><text class="sh" x="298" y="88" text-anchor="middle">construction</text><text class="small" x="298" y="120" text-anchor="middle">falls from height</text><text class="small" x="298" y="164" text-anchor="middle">falling objects, trenches</text><text class="small" x="298" y="208" text-anchor="middle">least formal employment</text><rect class="panel-c" x="398" y="60" width="172" height="180" rx="10"/><text class="sh" x="484" y="88" text-anchor="middle">agriculture</text><text class="small" x="484" y="120" text-anchor="middle">pesticides without protection</text><text class="small" x="484" y="164" text-anchor="middle">machinery injuries</text><text class="small" x="484" y="208" text-anchor="middle">heat in</text><text class="small" x="484" y="222" text-anchor="middle">the fields</text><rect class="panel-d" x="584" y="60" width="172" height="180" rx="10"/><text class="sh" x="670" y="88" text-anchor="middle">services</text><text class="small" x="670" y="120" text-anchor="middle">lifting, long standing</text><text class="small" x="670" y="164" text-anchor="middle">stress and harassment</text><text class="small" x="670" y="208" text-anchor="middle">infection in</text><text class="small" x="670" y="222" text-anchor="middle">health work</text><rect class="panel" x="26" y="268" width="728" height="150" rx="10"/><text class="sh" x="44" y="296">The portrait rule</text><text class="body" x="44" y="322">Controls must match the portrait: extraction and masks answer industry's dust;</text><text class="body" x="44" y="344">guardrails and trench support answer construction; training and protection answer</text><text class="body" x="44" y="366">agriculture's chemicals; staffing and dignity answer services.</text><text class="body" x="44" y="398">Every portrait is a mix of Unit 3's five hazard classes.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
