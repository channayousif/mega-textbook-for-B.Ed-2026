<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">انتظامی افعال کو محفوظ کام کی جگہ سے جوڑنے والا تصوراتی نقشہ</title><desc id="d">تصوراتی نقشہ: انتظام کے چار افعال، منصوبہ، تنظیم، قیادت، کنٹرول، مرکزی محفوظ کام کی جگہ سے جڑے ہوئے، اور نتائج محفوظ انسان، محفوظ پلانٹ، محفوظ طریقے، محفوظ جگہ</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">انتظامی افعال، ایچ ایس ای نتائج</text><ellipse class="panel" cx="390" cy="250" rx="102" ry="54"/><text class="h" x="390" y="244" text-anchor="middle">محفوظ</text><text class="h" x="390" y="266" text-anchor="middle">کام کی جگہ</text><rect class="panel-a" x="566" y="70" width="190" height="62" rx="8"/><text class="sh" x="661" y="96" text-anchor="middle">منصوبہ</text><text class="small" x="661" y="116" text-anchor="middle">مقاصد اور قابو</text><rect class="panel-a" x="24" y="70" width="190" height="62" rx="8"/><text class="sh" x="119" y="96" text-anchor="middle">تنظیم</text><text class="small" x="119" y="116" text-anchor="middle">لوگ، سامان، اختیار</text><rect class="panel-b" x="566" y="350" width="190" height="62" rx="8"/><text class="sh" x="661" y="376" text-anchor="middle">قیادت</text><text class="small" x="661" y="396" text-anchor="middle">جو انعامت پاتا ہے</text><rect class="panel-b" x="24" y="350" width="190" height="62" rx="8"/><text class="sh" x="119" y="376" text-anchor="middle">کنٹرول</text><text class="small" x="119" y="396" text-anchor="middle">ناپنا اور درست کرنا</text><text class="body" x="480" y="130" text-anchor="middle">محفوظ انسان</text><text class="body" x="300" y="130" text-anchor="middle">محفوظ پلانٹ</text><text class="body" x="480" y="370" text-anchor="middle">محفوظ طریقے</text><text class="body" x="300" y="370" text-anchor="middle">محفوظ جگہ</text><line class="stroke" x1="566" y1="120" x2="472" y2="212"/><line class="stroke" x1="214" y1="120" x2="308" y2="212"/><line class="stroke" x1="566" y1="380" x2="472" y2="288"/><line class="stroke" x1="214" y1="380" x2="308" y2="288"/><text class="small" x="390" y="452" text-anchor="middle">حفاظت ذمہ داری ہے، محکمہ نہیں؛ ہر خطرے کا ایک مالک ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
