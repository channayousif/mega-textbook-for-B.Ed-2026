<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">HSE statutes and regulations applicable in Pakistan</title><desc id="d">Table of five layers of HSE statutes and regulations applicable in Pakistan with what each governs and who enforces it</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">HSE statutes and regulations applicable in Pakistan</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Instrument</text><text class="h" x="240" y="75">What it governs</text><text class="h" x="560" y="75">Who enforces</text><rect class="panel-a" x="26" y="88" width="728" height="58"/><text class="sh" x="40" y="114">PEPA 1997 + NEQS</text><text class="body" x="240" y="114">discharges, waste, effluent limits</text><text class="body" x="560" y="114">federal and provincial EPAs</text><rect class="panel-b" x="26" y="146" width="728" height="58"/><text class="sh" x="40" y="172">Factories Act 1934</text><text class="body" x="240" y="172">guarding, ventilation, hours,</text><text class="body" x="240" y="191">welfare provisions</text><text class="body" x="560" y="172">provincial inspectorates</text><rect class="panel-c" x="26" y="204" width="728" height="58"/><text class="sh" x="40" y="230">Labour law and codes</text><text class="body" x="240" y="230">employment-side duties</text><text class="body" x="560" y="230">provincial labour departments</text><rect class="panel-d" x="26" y="262" width="728" height="58"/><text class="sh" x="40" y="288">Sector rules</text><text class="body" x="240" y="288">building, pesticide, transport</text><text class="body" x="240" y="307">sector-specific rules</text><text class="body" x="560" y="288">the sector's own authority</text><rect class="panel" x="26" y="320" width="728" height="58"/><text class="sh" x="40" y="346">ILO conventions</text><text class="body" x="240" y="346">the international reference</text><text class="body" x="560" y="346">ratified by the state</text><text class="small" x="390" y="400" text-anchor="middle">Since the 18th Amendment (2010), much competence is provincial: know your national floor and your provincial detail.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
