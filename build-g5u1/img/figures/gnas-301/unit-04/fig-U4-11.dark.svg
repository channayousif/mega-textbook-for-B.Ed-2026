<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the six steps of establishing an HSE plan</title><desc id="d">Flowchart of the six steps of establishing an HSE plan, scope, hazards, objectives, controls and resources, training and communication, monitoring and review, as a loop</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Establishing an HSE plan: six fixed steps</text><rect class="panel-a" x="26" y="100" width="112" height="90" rx="8"/><text class="sh" x="82" y="130" text-anchor="middle">1. scope</text><text class="small" x="82" y="152" text-anchor="middle">one activity,</text><text class="small" x="82" y="168" text-anchor="middle">site, period</text><line class="stroke" x1="138" y1="145" x2="152" y2="145" marker-end="url(#arrow)"/><rect class="panel-a" x="152" y="100" width="112" height="90" rx="8"/><text class="sh" x="208" y="130" text-anchor="middle">2. hazards</text><text class="small" x="208" y="152" text-anchor="middle">the walk</text><text class="small" x="208" y="168" text-anchor="middle">and register</text><line class="stroke" x1="264" y1="145" x2="278" y2="145" marker-end="url(#arrow)"/><rect class="panel-b" x="278" y="100" width="112" height="90" rx="8"/><text class="sh" x="334" y="130" text-anchor="middle">3. objectives</text><text class="small" x="334" y="152" text-anchor="middle">measurable,</text><text class="small" x="334" y="168" text-anchor="middle">with dates</text><line class="stroke" x1="390" y1="145" x2="404" y2="145" marker-end="url(#arrow)"/><rect class="panel-b" x="404" y="100" width="112" height="90" rx="8"/><text class="sh" x="460" y="130" text-anchor="middle">4. controls</text><text class="small" x="460" y="152" text-anchor="middle">named</text><text class="small" x="460" y="168" text-anchor="middle">people, budget</text><line class="stroke" x1="516" y1="145" x2="530" y2="145" marker-end="url(#arrow)"/><rect class="panel-c" x="530" y="100" width="112" height="90" rx="8"/><text class="sh" x="586" y="130" text-anchor="middle">5. training</text><text class="small" x="586" y="152" text-anchor="middle">who is</text><text class="small" x="586" y="168" text-anchor="middle">told what, when</text><line class="stroke" x1="642" y1="145" x2="656" y2="145" marker-end="url(#arrow)"/><rect class="panel-c" x="656" y="100" width="112" height="90" rx="8"/><text class="sh" x="712" y="130" text-anchor="middle">6. monitoring</text><text class="small" x="712" y="152" text-anchor="middle">who checks,</text><text class="small" x="712" y="168" text-anchor="middle">and review</text><path class="stroke" d="M 714 190 L 714 260 L 82 260 L 82 192" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text class="small" x="390" y="252" text-anchor="middle">the plan is re-read on its review date</text><rect class="panel" x="26" y="300" width="728" height="120" rx="10"/><text class="sh" x="44" y="328">The test of a plan</text><text class="body" x="44" y="354">"Safety first" is a poster. "Zero locked exits during operating hours, checked</text><text class="body" x="44" y="376">hourly" is an objective. A page with names and dates is a plan; a folder nobody</text><text class="body" x="44" y="398">signed is a wish.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
