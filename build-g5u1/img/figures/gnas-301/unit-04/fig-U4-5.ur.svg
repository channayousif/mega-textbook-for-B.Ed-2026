<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اندرونی کنٹرول کی پانچ تہوں کا خاکہ</title><desc id="d">اندرونی کنٹرول کی پانچ تہوں کا خاکہ: انتظامی فلسفہ، پالیسیاں، طریقہ کار، نگرانی، ریکارڈ، ہر تہ اوپر والی سے چھوٹی ہوئی چیز پکڑتی ہے</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">اندرونی کنٹرول: پانچ تہیں، ایک قیف</text><rect class="panel-d" x="110" y="60" width="560" height="52" rx="8"/><text class="sh" x="390" y="82" text-anchor="middle">1. انتظامی فلسفہ</text><text class="small" x="390" y="102" text-anchor="middle">مالک اصل میں کیا انعامت دیتا ہے</text><rect class="panel-a" x="140" y="122" width="500" height="52" rx="8"/><text class="sh" x="390" y="144" text-anchor="middle">2. پالیسیاں</text><text class="small" x="390" y="164" text-anchor="middle">لکھے ہوئے قواعد</text><rect class="panel-a" x="170" y="184" width="440" height="52" rx="8"/><text class="sh" x="390" y="206" text-anchor="middle">3. طریقہ کار</text><text class="small" x="390" y="226" text-anchor="middle">قدم بہ قدم عمل</text><rect class="panel-b" x="200" y="246" width="380" height="52" rx="8"/><text class="sh" x="390" y="268" text-anchor="middle">4. نگرانی</text><text class="small" x="390" y="288" text-anchor="middle">اختیار کے ساتھ جانچنے والا</text><rect class="panel-b" x="230" y="308" width="320" height="52" rx="8"/><text class="sh" x="390" y="330" text-anchor="middle">5. ریکارڈ</text><text class="small" x="390" y="350" text-anchor="middle">جو لکھا جائے اور پڑھا جائے</text><text class="small" x="390" y="396" text-anchor="middle">ہر تہ اوپر والی سے چھوٹی ہوئی چیز پکڑتی ہے؛ اوپر والی تہ باقی سب کا فیصلہ کرتی ہے۔</text><text class="small" x="390" y="416" text-anchor="middle">اگر فورمین کا ہدف پیداوار ہو اور مالک رپورٹوں کو نظر انداز کرے، جالی ہٹی رہتی ہے، دیوار کا کاغذ کچھ نہیں کرتا۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
