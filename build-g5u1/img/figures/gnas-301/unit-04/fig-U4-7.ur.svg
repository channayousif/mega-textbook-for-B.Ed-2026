<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فرائض اور حقوق کا مثلث</title><desc id="d">فرائض اور حقوق کے مثلث کا جدول: مالک، کارکن، حکومت، ہر ایک کے فرائض اور حقوق یا اختیارات</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">فرائض اور حقوق کا مثلث</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">کون</text><text class="h" x="570" y="75" text-anchor="end">فرائض ایک سطر میں</text><text class="h" x="260" y="75" text-anchor="end">حقوق یا اختیارات ایک سطر میں</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="740" y="114" text-anchor="end">مالک</text><text class="body" x="570" y="114" text-anchor="end">بغیر ناگزیر نقصان کی</text><text class="body" x="570" y="133" text-anchor="end">جگہ؛ معلومات، تربیت،</text><text class="body" x="570" y="152" text-anchor="end">سامان</text><text class="body" x="260" y="114" text-anchor="end">نگہداشت کا فرض رکھتا ہے</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="740" y="202" text-anchor="end">کارکن</text><text class="body" x="570" y="202" text-anchor="end">محفوظ طریقے ماننا، تحفظ</text><text class="body" x="570" y="221" text-anchor="end">استعمال کرنا، خطرے بتانا</text><text class="body" x="260" y="202" text-anchor="end">جاننا، تحفظ، انکار،</text><text class="body" x="260" y="221" text-anchor="end">آواز، بغیر سزا کے</text><rect class="panel-c" x="26" y="264" width="728" height="88"/><text class="sh" x="740" y="290" text-anchor="end">حکومت</text><text class="body" x="570" y="290" text-anchor="end">قانون بنانا، معائنہ،</text><text class="body" x="570" y="309" text-anchor="end">نافذ کرنا</text><text class="body" x="260" y="290" text-anchor="end">اصلاحی احکام،</text><text class="body" x="260" y="309" text-anchor="end">جرمانے، مقدمہ</text><text class="small" x="390" y="374" text-anchor="middle">حقوق اس لیے ہیں کہ کمزور ترین فریق حفاظت کا سودا نہیں کر سکتا: دروازے کے باہر پچاس آدمی انتظار میں ہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
