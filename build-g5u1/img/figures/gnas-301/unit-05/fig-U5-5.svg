<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of natural detoxification</title><desc id="d">Flowchart of natural detoxification, the liver two phases then exits by kidneys, lungs and gut, with a storage branch to fat and bone</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The body waste system: no box required</text><rect class="panel-a" x="40" y="80" width="300" height="80" rx="10"/><text class="sh" x="190" y="108" text-anchor="middle">liver phase 1: chemical rework</text><text class="small" x="190" y="132" text-anchor="middle">biotransformation, the workshop of Topic 5.2</text><rect class="panel-a" x="440" y="80" width="300" height="80" rx="10"/><text class="sh" x="590" y="108" text-anchor="middle">liver phase 2: attach for export</text><text class="small" x="590" y="132" text-anchor="middle">a handle that makes it water-soluble</text><line class="stroke" x1="340" y1="120" x2="438" y2="120" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="250" width="200" height="70" rx="8"/><text class="sh" x="140" y="276" text-anchor="middle">kidneys</text><text class="small" x="140" y="298" text-anchor="middle">urine: the busiest exit</text><path class="stroke" d="M 590 160 L 590 200 L 140 200 L 140 248" marker-end="url(#arrow)"/><rect class="panel-b" x="280" y="250" width="200" height="70" rx="8"/><text class="sh" x="380" y="276" text-anchor="middle">lungs</text><text class="small" x="380" y="298" text-anchor="middle">breath: CO leaves here</text><path class="stroke" d="M 590 160 L 590 200 L 380 200 L 380 248" marker-end="url(#arrow)"/><rect class="panel-b" x="520" y="250" width="200" height="70" rx="8"/><text class="sh" x="620" y="276" text-anchor="middle">gut</text><text class="small" x="620" y="298" text-anchor="middle">bile and stool</text><path class="stroke" d="M 590 160 L 590 200 L 620 200 L 620 248" marker-end="url(#arrow)"/><rect class="panel-d" x="280" y="370" width="220" height="56" rx="8"/><text class="sh" x="390" y="392" text-anchor="middle">storage: fat and bone</text><text class="small" x="390" y="412" text-anchor="middle">the stubborn ones, sometimes for years</text><path class="stroke" d="M 390 320 L 390 368" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="small" x="390" y="452" text-anchor="middle">Helps: hydration, nutrition, avoidance, time. Hinders: exposure, malnutrition, disease.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
