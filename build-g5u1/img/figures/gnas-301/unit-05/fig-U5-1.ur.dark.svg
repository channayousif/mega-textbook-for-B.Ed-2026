<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فضائی زہریلے عنصر کے نقصان تک پہنچنے کا خاکہ</title><desc id="d">فضائی زہریلے عنصر کے سفر کا خاکہ: اخراج سے ہوا، خون اور ہدف عضو سے اثر تک، کاربن مونو آکسائیڈ مثال کے طور پر</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">نقصان تک راستہ: ایک فضائی عنصر</text><rect class="panel-c" x="26" y="80" width="128" height="96" rx="8"/><text class="sh" x="90" y="106" text-anchor="middle">1. اخراج</text><text class="small" x="90" y="130+0" text-anchor="middle">جنریٹر، بھٹہ،</text><text class="small" x="90" y="130+20" text-anchor="middle">ٹریفک، کچرا جلانا</text><line class="stroke" x1="154" y1="128" x2="170" y2="128" marker-end="url(#arrow)"/><rect class="panel-b" x="176" y="80" width="128" height="96" rx="8"/><text class="sh" x="240" y="106" text-anchor="middle">2. ہوا</text><text class="small" x="240" y="130+0" text-anchor="middle">سانس اسے اندر لے جاتی ہے؛</text><text class="small" x="240" y="130+20" text-anchor="middle">حراستی ضرب وقت</text><line class="stroke" x1="304" y1="128" x2="320" y2="128" marker-end="url(#arrow)"/><rect class="panel-a" x="326" y="80" width="128" height="96" rx="8"/><text class="sh" x="390" y="106" text-anchor="middle">3. خون</text><text class="small" x="390" y="130+0" text-anchor="middle">خون کی دریا میں سوار</text><text class="small" x="390" y="130+20" text-anchor="middle">اس کی جگہ تک</text><line class="stroke" x1="454" y1="128" x2="470" y2="128" marker-end="url(#arrow)"/><rect class="panel-d" x="476" y="80" width="128" height="96" rx="8"/><text class="sh" x="540" y="106" text-anchor="middle">4. ہدف</text><text class="small" x="540" y="130+0" text-anchor="middle">پھیپھڑے، خون، دماغ:</text><text class="small" x="540" y="130+20" text-anchor="middle">وہ عضو جسے نقصان</text><line class="stroke" x1="604" y1="128" x2="620" y2="128" marker-end="url(#arrow)"/><rect class="panel-c" x="626" y="80" width="128" height="96" rx="8"/><text class="sh" x="690" y="106" text-anchor="middle">5. اثر</text><text class="small" x="690" y="130+0" text-anchor="middle">سر درد سے بیماری تک:</text><text class="small" x="690" y="130+20" text-anchor="middle">نقصان پہنچتا ہے</text><rect class="panel" x="26" y="216" width="728" height="196" rx="10"/><text class="sh" x="44" y="244" text-anchor="start">حلیہ مثال: سیڑھیوں پر جنریٹر</text><text class="body" x="44" y="272" text-anchor="start">اخراج: بند سیڑھیاں میں ناکم احتراق، چوری سے بچنے کے لیے دروازہ بند۔</text><text class="body" x="44" y="294" text-anchor="start">ہوا: زیادہ CO حراستی، کئی گھنٹے، آدھی رات سے صبح۔</text><text class="body" x="44" y="316" text-anchor="start">خون: CO آکسیجن کی سیٹ سیکڑوں گنا مضبوطی سے لیتا ہے۔</text><text class="body" x="44" y="338" text-anchor="start">ہدف: آکسیجن کا پیاسا دماغ۔ اثر: سر درد، متلی، بے ہوشی۔</text><text class="body" x="44" y="368" text-anchor="start">وصول کنندہ پر: کبھی اندر نہیں۔ ذریعے پر: ہوا والا جنریٹر۔</text><text class="small" x="390" y="440" text-anchor="middle">یونٹ 2 کی آلودگی کی زنجیر، جسم کے اندر چلائی گئی۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
