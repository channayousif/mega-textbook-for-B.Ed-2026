<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 534" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three demands of teaching held in balance on a shared base</title><desc id="d">A triangle whose three corners are accountability, autonomy and collegiality, resting on a base labelled specialised knowledge and training - the caption reads "held in balance".</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .tri { fill: none; stroke: var(--a1); stroke-width: 2.5; stroke-linejoin: round; } .dot { fill: var(--a1); } .base { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } text { font-size: 16px; fill: var(--ink); } .h { font-weight: 700; } .cap { font-size: 14px; fill: var(--muted); font-style: italic; } .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="420" height="100%"/><polygon class="tri" points="210,78 66,326 354,326"/><circle class="dot" cx="210" cy="78" r="5"/><circle class="dot" cx="66" cy="326" r="5"/><circle class="dot" cx="354" cy="326" r="5"/><text class="h" x="210" y="52" text-anchor="middle">accountability</text><text class="h" x="60" y="352" text-anchor="middle">autonomy</text><text class="h" x="360" y="352" text-anchor="middle">collegiality</text><rect class="base" x="44" y="382" width="332" height="48"/><text x="210" y="392" text-anchor="middle"><tspan x="210" dy="0">specialised</tspan><tspan x="210" dy="20">knowledge and</tspan><tspan x="210" dy="20">training</tspan></text><text class="cap" x="210" y="462" text-anchor="middle">held in balance</text><text class="wm" x="408" y="524" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
