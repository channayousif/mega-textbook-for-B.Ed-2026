<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How teaching in Pakistan moved toward being a profession</title><desc id="d">A left-to-right timeline with five stages: teaching held as an occupation and learnt on the job; teacher training institutions open; a teaching qualification becomes required; a written code of conduct is adopted; national professional standards for teachers are set. The arrow shows direction of travel, not exact dates.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .axis { stroke: var(--ink); stroke-width: 2.5; fill: none; } .tick { stroke: var(--ink); stroke-width: 2.5; } .dot { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .ah { fill: var(--ink); } text { font-size: 14px; fill: var(--ink); } .h { font-weight: 700; font-size: 15px; } .cap { font-size: 13px; fill: var(--muted); font-style: italic; } .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="100%"/><path class="axis" d="M48 196 L852 196" marker-end="url(#a7)"/><g class="tick"><path d="M120 186 L120 206"/><path d="M290 186 L290 206"/><path d="M456 186 L456 206"/><path d="M622 186 L622 206"/><path d="M788 186 L788 206"/></g><circle class="dot" cx="120" cy="196" r="6"/><circle class="dot" cx="290" cy="196" r="6"/><circle class="dot" cx="456" cy="196" r="6"/><circle class="dot" cx="622" cy="196" r="6"/><circle class="dot" cx="788" cy="196" r="6"/><text class="h" x="120" y="96" text-anchor="middle">an occupation</text><text x="120" y="116" text-anchor="middle">learnt on the job</text><text class="h" x="290" y="262" text-anchor="middle"><tspan x="290" dy="0">training</tspan><tspan x="290" dy="20">institutions</tspan></text><text x="290" y="282" text-anchor="middle"><tspan x="290" dy="0">colleges prepare</tspan><tspan x="290" dy="20">teachers</tspan></text><text class="h" x="456" y="96" text-anchor="middle">a qualification</text><text x="456" y="106" text-anchor="middle"><tspan x="456" dy="0">now required to</tspan><tspan x="456" dy="20">teach</tspan></text><text class="h" x="622" y="272" text-anchor="middle">a code of conduct</text><text x="622" y="292" text-anchor="middle">shared ethical rules</text><text class="h" x="788" y="96" text-anchor="middle">national standards</text><text x="788" y="116" text-anchor="middle">what every teacher</text><text x="788" y="134" text-anchor="middle">must know and do</text><text class="cap" x="450" y="342" text-anchor="middle"><tspan x="450" dy="0">direction of travel, not exact</tspan><tspan x="450" dy="20">dates</tspan></text><text class="wm" x="888" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
