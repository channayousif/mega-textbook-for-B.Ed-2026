<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four classroom dilemma types</title><desc id="d">Table of four classroom dilemma types - grading fairness, confidentiality, social media and equity - each showing the two goods that conflict, what makes it hard, and a defensible first move.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="780" height="100%"/><rect class="cellhdr" x="16" y="16" width="748" height="54"/><rect class="grid" x="16" y="16" width="748" height="376"/><line class="grid" x1="170" y1="16" x2="170" y2="392"/><line class="grid" x1="404" y1="16" x2="404" y2="392"/><line class="grid" x1="590" y1="16" x2="590" y2="392"/><line class="grid" x1="16" y1="70" x2="764" y2="70"/><line class="grid" x1="16" y1="150" x2="764" y2="150"/><line class="grid" x1="16" y1="230" x2="764" y2="230"/><line class="grid" x1="16" y1="310" x2="764" y2="310"/><text class="h" x="28" y="48">Dilemma</text><text class="h" x="180" y="38"><tspan x="180" dy="0">The two goods in</tspan><tspan x="180" dy="20">conflict</tspan></text><text class="h" x="414" y="48">What makes it hard</text><text class="h" x="600" y="38"><tspan x="600" dy="0">A defensible first</tspan><tspan x="600" dy="20">move</tspan></text><text class="h" x="28" y="115">Grading</text><text class="h" x="28" y="133">fairness</text><text x="180" y="95"><tspan x="180" dy="0">honesty in</tspan><tspan x="180" dy="20">assessment</tspan></text><text x="180" y="125">against duty of care</text><text class="m" x="414" y="105"><tspan x="414" dy="0">both are owed, and</tspan><tspan x="414" dy="20">to</tspan></text><text class="m" x="414" y="135">different people</text><text x="600" y="105">separate the mark</text><text x="600" y="125">from the response</text><text class="h" x="28" y="195">Confidentiality</text><text x="180" y="185">keeping a confidence</text><text x="180" y="195"><tspan x="180" dy="0">against protecting a</tspan><tspan x="180" dy="20">pupil</tspan></text><text class="m" x="414" y="185"><tspan x="414" dy="0">the limit is</tspan><tspan x="414" dy="20">discovered</tspan></text><text class="m" x="414" y="215">at the worst moment</text><text x="600" y="185">state the limit in</text><text x="600" y="205">advance, not after</text><text class="h" x="28" y="275">Social media</text><text x="180" y="265">a teacher's privacy</text><text x="180" y="275"><tspan x="180" dy="0">against public</tspan><tspan x="180" dy="20">standing</tspan></text><text class="m" x="414" y="265">the medium changed,</text><text class="m" x="414" y="275"><tspan x="414" dy="0">the power gap did</tspan><tspan x="414" dy="20">not</tspan></text><text x="600" y="265">no private threads</text><text x="600" y="285">with pupils</text><text class="h" x="28" y="355">Equity</text><text x="180" y="345">identical treatment</text><text x="180" y="355"><tspan x="180" dy="0">against fair</tspan><tspan x="180" dy="20">outcomes</tspan></text><text class="m" x="414" y="345">sameness is easy to</text><text class="m" x="414" y="355"><tspan x="414" dy="0">defend and often</tspan><tspan x="414" dy="20">unfair</tspan></text><text x="600" y="345">adjust conditions,</text><text x="600" y="365">not the standard</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
