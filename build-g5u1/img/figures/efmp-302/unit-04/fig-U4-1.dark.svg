<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Standard, code of conduct and curriculum compared</title><desc id="d">Table comparing a professional standard, a code of conduct and a curriculum by the question each answers, what each governs, who enforces it, and what each cannot do.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .h1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .h2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .h3{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="rl" x="20" y="30" width="180" height="46"/><rect class="h1" x="200" y="30" width="230" height="46"/><rect class="h2" x="430" y="30" width="230" height="46"/><rect class="h3" x="660" y="30" width="220" height="46"/><text class="h" x="315" y="48" text-anchor="middle"><tspan x="315" dy="0">Professional</tspan><tspan x="315" dy="20">standard</tspan></text><text class="h" x="545" y="58" text-anchor="middle">Code of conduct</text><text class="h" x="770" y="58" text-anchor="middle">Curriculum</text><rect class="rl" x="20" y="76" width="180" height="66"/><rect class="cl" x="200" y="76" width="230" height="66"/><rect class="cl" x="430" y="76" width="230" height="66"/><rect class="cl" x="660" y="76" width="220" height="66"/><text class="rh" x="30" y="106">The question it</text><text class="rh" x="30" y="124">answers</text><text x="210" y="96"><tspan x="210" dy="0">What should a</tspan><tspan x="210" dy="20">teacher</tspan></text><text x="210" y="114"><tspan x="210" dy="0">know and be able to</tspan><tspan x="210" dy="20">do?</tspan></text><text x="440" y="106">How must a teacher</text><text x="440" y="124">behave?</text><text x="670" y="106">What should pupils</text><text x="670" y="124">be taught?</text><rect class="rl" x="20" y="142" width="180" height="60"/><rect class="cl" x="200" y="142" width="230" height="60"/><rect class="cl" x="430" y="142" width="230" height="60"/><rect class="cl" x="660" y="142" width="220" height="60"/><text class="rh" x="30" y="178">What it governs</text><text x="210" y="172">Competence</text><text x="440" y="172">Conduct and ethics</text><text x="670" y="172">Content and sequence</text><rect class="rl" x="20" y="202" width="180" height="60"/><rect class="cl" x="200" y="202" width="230" height="60"/><rect class="cl" x="430" y="202" width="230" height="60"/><rect class="cl" x="660" y="202" width="220" height="60"/><text class="rh" x="30" y="238">Who enforces it</text><text x="210" y="222"><tspan x="210" dy="0">Trainers,</tspan><tspan x="210" dy="20">appraisers,</tspan></text><text x="210" y="250">licensing bodies</text><text x="440" y="232">Employers and</text><text x="440" y="250">registration bodies</text><text x="670" y="232">Boards and</text><text x="670" y="250">examination systems</text><rect class="rl" x="20" y="262" width="180" height="66"/><rect class="cl" x="200" y="262" width="230" height="66"/><rect class="cl" x="430" y="262" width="230" height="66"/><rect class="cl" x="660" y="262" width="220" height="66"/><text class="rh" x="30" y="292">What it cannot do</text><text x="210" y="292">Make a teacher want</text><text x="210" y="310">to meet it</text><text x="440" y="292">Describe good</text><text x="440" y="310">teaching</text><text x="670" y="292">Say who is fit</text><text x="670" y="310">to teach it</text><text class="m" x="20" y="318"><tspan x="20" dy="0">The three are routinely confused.</tspan><tspan x="20" dy="20">A code will not tell you how to</tspan><tspan x="20" dy="20">explain fractions, and a</tspan><tspan x="20" dy="20">curriculum will not tell you who</tspan><tspan x="20" dy="20">should be in front of the class.</tspan></text><text class="m" x="20" y="368"><tspan x="20" dy="0">Each answers a different question,</tspan><tspan x="20" dy="20">and none substitutes for another.</tspan></text><text class="wm" x="888" y="436" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
