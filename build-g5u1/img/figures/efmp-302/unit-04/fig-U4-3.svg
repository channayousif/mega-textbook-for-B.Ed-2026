<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How one standard is built</title><desc id="d">Nesting diagram of a professional standard containing knowledge, dispositions and performance bands, with indicators beneath the parts, shown here for the performance band, each pointing to an example of classroom evidence.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .out{fill:none;stroke:var(--ink);stroke-width:3} .b1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .b3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .ind{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .ev{fill:var(--a3-fill);stroke:var(--a3);stroke-width:1.5} .ar{stroke:var(--a3);stroke-width:1.8;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .s{font-size:10.5px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="100%"/><rect class="out" x="30" y="30" width="820" height="230" rx="6"/><text class="h" x="46" y="54">Standard</text><rect class="b1" x="50" y="66" width="780" height="54" rx="5"/><text class="h" x="64" y="78"><tspan x="64" dy="0">Knowledge and</tspan><tspan x="64" dy="20">understanding</tspan></text><text class="m" x="64" y="88"><tspan x="64" dy="0">what the teacher knows: subject</tspan><tspan x="64" dy="20">content, how pupils learn it,</tspan><tspan x="64" dy="20">where it is usually misunderstood</tspan></text><rect class="b2" x="50" y="126" width="780" height="54" rx="5"/><text class="h" x="64" y="148">Dispositions</text><text class="m" x="64" y="148"><tspan x="64" dy="0">attitudes and values the teacher</tspan><tspan x="64" dy="20">holds: that every pupil can learn,</tspan><tspan x="64" dy="20">that errors are information</tspan></text><rect class="b3" x="50" y="186" width="780" height="60" rx="5"/><text class="h" x="64" y="198"><tspan x="64" dy="0">Performance and</tspan><tspan x="64" dy="20">skills</tspan></text><text class="m" x="64" y="208"><tspan x="64" dy="0">what the teacher can do: the part</tspan><tspan x="64" dy="20">that can be seen, and therefore</tspan><tspan x="64" dy="20">the part that is assessed</tspan></text><rect class="ind" x="50" y="290" width="240" height="40" rx="5"/><text class="s" x="62" y="305"><tspan x="62" dy="0">Indicator: plans for</tspan><tspan x="62" dy="20">misconceptions</tspan></text><rect class="ind" x="320" y="290" width="240" height="40" rx="5"/><text class="s" x="332" y="305"><tspan x="332" dy="0">Indicator: checks understanding</tspan><tspan x="332" dy="20">mid-lesson</tspan></text><rect class="ind" x="590" y="290" width="240" height="40" rx="5"/><text class="s" x="602" y="305"><tspan x="602" dy="0">Indicator: adapts when a check</tspan><tspan x="602" dy="20">fails</tspan></text><path class="ar" d="M170 330 L170 360" marker-end="url(#a)"/><path class="ar" d="M440 330 L440 360" marker-end="url(#a)"/><path class="ar" d="M710 330 L710 360" marker-end="url(#a)"/><rect class="ev" x="50" y="364" width="240" height="46" rx="5"/><text class="s" x="62" y="374"><tspan x="62" dy="0">Evidence: a plan</tspan><tspan x="62" dy="20">naming the</tspan></text><text class="s" x="62" y="390"><tspan x="62" dy="0">wrong answer pupils</tspan><tspan x="62" dy="20">give</tspan></text><rect class="ev" x="320" y="364" width="240" height="46" rx="5"/><text class="s" x="332" y="374"><tspan x="332" dy="0">Evidence: observed</tspan><tspan x="332" dy="20">question that</tspan></text><text class="s" x="332" y="390"><tspan x="332" dy="0">was not answered by</tspan><tspan x="332" dy="20">one pupil</tspan></text><rect class="ev" x="590" y="364" width="240" height="46" rx="5"/><text class="s" x="602" y="374"><tspan x="602" dy="0">Evidence: the second</tspan><tspan x="602" dy="20">explanation,</tspan></text><text class="s" x="602" y="390"><tspan x="602" dy="0">different from the</tspan><tspan x="602" dy="20">first</tspan></text><line class="ar" x1="440" y1="246" x2="440" y2="286" marker-end="url(#a)"/><text class="m" x="30" y="414"><tspan x="30" dy="0">Indicators sit beneath the parts,</tspan><tspan x="30" dy="20">and only indicators produce</tspan><tspan x="30" dy="20">evidence. The three shown below</tspan><tspan x="30" dy="20">are drawn from performance</tspan></text><text class="m" x="30" y="432"><tspan x="30" dy="0">and skills, the part that can be</tspan><tspan x="30" dy="20">seen; what a teacher knows and</tspan><tspan x="30" dy="20">values is inferred from what</tspan><tspan x="30" dy="20">performance shows.</tspan></text><text class="wm" x="868" y="494" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
