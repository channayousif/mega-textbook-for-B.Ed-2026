<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The ten National Professional Standards, in summary</title><desc id="d">Table listing the ten National Professional Standards for Teachers in Pakistan, each with its focus and an example of classroom evidence, marked as a summary that directs the reader to the primary document.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .n{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="940" height="100%"/><rect class="hd" x="20" y="28" width="300" height="38"/><rect class="hd" x="320" y="28" width="280" height="38"/><rect class="hd" x="600" y="28" width="280" height="38"/><text class="h" x="170" y="52" text-anchor="middle">Standard</text><text class="h" x="460" y="52" text-anchor="middle">Focus</text><text class="h" x="740" y="42" text-anchor="middle"><tspan x="740" dy="0">Example of classroom</tspan><tspan x="740" dy="20">evidence</tspan></text><g><rect class="rl" x="20" y="66" width="300" height="40"/><rect class="cl" x="320" y="66" width="280" height="40"/><rect class="cl" x="600" y="66" width="280" height="40"/><text class="n" x="30" y="81"><tspan x="30" dy="0">1 Subject matter</tspan><tspan x="30" dy="20">knowledge</tspan></text><text x="330" y="81"><tspan x="330" dy="0">Knowing what is</tspan><tspan x="330" dy="20">taught</tspan></text><text x="610" y="81"><tspan x="610" dy="0">A correct answer to an unplanned</tspan><tspan x="610" dy="20">question</tspan></text></g><g><rect class="rl" x="20" y="106" width="300" height="40"/><rect class="cl" x="320" y="106" width="280" height="40"/><rect class="cl" x="600" y="106" width="280" height="40"/><text class="n" x="30" y="121"><tspan x="30" dy="0">2 Human growth and</tspan><tspan x="30" dy="20">development</tspan></text><text x="330" y="131">How pupils change</text><text x="610" y="121"><tspan x="610" dy="0">Task pitched to the age, not the</tspan><tspan x="610" dy="20">syllabus</tspan></text></g><g><rect class="rl" x="20" y="146" width="300" height="40"/><rect class="cl" x="320" y="146" width="280" height="40"/><rect class="cl" x="600" y="146" width="280" height="40"/><text class="n" x="30" y="155"><tspan x="30" dy="0">3 Islamic ethical</tspan><tspan x="30" dy="20">values and</tspan></text><text class="n" x="30" y="180">social life skills</text><text x="330" y="171">Values in practice</text><text x="610" y="161"><tspan x="610" dy="0">How a dispute between pupils is</tspan><tspan x="610" dy="20">settled</tspan></text></g><g><rect class="rl" x="20" y="186" width="300" height="40"/><rect class="cl" x="320" y="186" width="280" height="40"/><rect class="cl" x="600" y="186" width="280" height="40"/><text class="n" x="30" y="201"><tspan x="30" dy="0">4 Instructional planning and</tspan><tspan x="30" dy="20">strategies</tspan></text><text x="330" y="211">Designing the lesson</text><text x="610" y="201"><tspan x="610" dy="0">A plan naming the likely</tspan><tspan x="610" dy="20">misconception</tspan></text></g><g><rect class="rl" x="20" y="226" width="300" height="40"/><rect class="cl" x="320" y="226" width="280" height="40"/><rect class="cl" x="600" y="226" width="280" height="40"/><text class="n" x="30" y="251">5 Assessment</text><text x="330" y="241"><tspan x="330" dy="0">Finding out what was</tspan><tspan x="330" dy="20">learned</tspan></text><text x="610" y="241"><tspan x="610" dy="0">What changed after</tspan><tspan x="610" dy="20">the marking</tspan></text></g><g><rect class="rl" x="20" y="266" width="300" height="40"/><rect class="cl" x="320" y="266" width="280" height="40"/><rect class="cl" x="600" y="266" width="280" height="40"/><text class="n" x="30" y="281"><tspan x="30" dy="0">6 Learning</tspan><tspan x="30" dy="20">environment</tspan></text><text x="330" y="281"><tspan x="330" dy="0">The room as a place</tspan><tspan x="330" dy="20">to learn</tspan></text><text x="610" y="281"><tspan x="610" dy="0">Who is willing to risk a wrong</tspan><tspan x="610" dy="20">answer</tspan></text></g><g><rect class="rl" x="20" y="306" width="300" height="46"/><rect class="cl" x="320" y="306" width="280" height="46"/><rect class="cl" x="600" y="306" width="280" height="46"/><text class="n" x="30" y="316"><tspan x="30" dy="0">7 Effective</tspan><tspan x="30" dy="20">communication and</tspan></text><text class="n" x="30" y="331"><tspan x="30" dy="0">proficient use of</tspan><tspan x="30" dy="20">ICT</tspan></text><text x="330" y="334">Being understood</text><text x="610" y="324"><tspan x="610" dy="0">A second explanation, unlike the</tspan><tspan x="610" dy="20">first</tspan></text></g><g><rect class="rl" x="20" y="352" width="300" height="40"/><rect class="cl" x="320" y="352" width="280" height="40"/><rect class="cl" x="600" y="352" width="280" height="40"/><text class="n" x="30" y="367"><tspan x="30" dy="0">8 Collaboration and</tspan><tspan x="30" dy="20">partnership</tspan></text><text x="330" y="377">Working with others</text><text x="610" y="367"><tspan x="610" dy="0">Something a</tspan><tspan x="610" dy="20">colleague adopted</tspan></text></g><g><rect class="rl" x="20" y="392" width="300" height="46"/><rect class="cl" x="320" y="392" width="280" height="46"/><rect class="cl" x="600" y="392" width="280" height="46"/><text class="n" x="30" y="402"><tspan x="30" dy="0">9 Continuous professional</tspan><tspan x="30" dy="20">development</tspan></text><text class="n" x="30" y="427">and code of conduct</text><text x="330" y="420">Staying fit to teach</text><text x="610" y="410"><tspan x="610" dy="0">Practice that changed, not hours</tspan><tspan x="610" dy="20">attended</tspan></text></g><g><rect class="rl" x="20" y="438" width="300" height="46"/><rect class="cl" x="320" y="438" width="280" height="46"/><rect class="cl" x="600" y="438" width="280" height="46"/><text class="n" x="30" y="448"><tspan x="30" dy="0">10 Teaching of</tspan><tspan x="30" dy="20">English as a second</tspan></text><text class="n" x="30" y="473">or foreign language</text><text x="330" y="456"><tspan x="330" dy="0">Language as a</tspan><tspan x="330" dy="20">barrier</tspan></text><text x="610" y="456"><tspan x="610" dy="0">A pupil who understood the maths,</tspan><tspan x="610" dy="20">not just the words</tspan></text></g><rect class="note" x="20" y="498" width="860" height="42" rx="5"/><text class="m" x="32" y="486"><tspan x="32" dy="0">This is a navigational summary,</tspan><tspan x="32" dy="20">not the standards themselves. Each</tspan><tspan x="32" dy="20">standard has a full text with its</tspan><tspan x="32" dy="20">own indicators.</tspan></text><text class="m" x="32" y="512"><tspan x="32" dy="0">Read it in the primary document</tspan><tspan x="32" dy="20">before using it to judge anyone,</tspan><tspan x="32" dy="20">including yourself.</tspan></text><text class="wm" x="928" y="604" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
