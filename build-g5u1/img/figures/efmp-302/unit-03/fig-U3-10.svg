<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five roles, each as one Monday-morning act</title><desc id="d">Concept map of a teacher at the centre with five branches - facilitator, researcher, change agent, moral agent and life-long learner - each ending in one concrete classroom act that expresses that role.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .r{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .act{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .e{stroke:var(--a2);stroke-width:2;fill:none} .e2{stroke:var(--muted);stroke-width:1.5;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="ctr" x="30" y="200" width="150" height="60" rx="8"/><text class="h" x="105" y="226" text-anchor="middle">The teacher</text><text class="m" x="105" y="246" text-anchor="middle">on Monday</text><rect class="r" x="250" y="26" width="190" height="42" rx="6"/><text class="h" x="345" y="52" text-anchor="middle">Facilitator</text><rect class="act" x="470" y="26" width="410" height="42" rx="5"/><text x="482" y="42"><tspan x="482" dy="0">Sets a task pupils can get wrong</tspan><tspan x="482" dy="20">safely</tspan></text><path class="e" d="M180 212 L230 60 L246 47" marker-end="url(#a)"/><path class="e2" d="M440 47 L466 47" marker-end="url(#b)"/><rect class="r" x="250" y="108" width="190" height="42" rx="6"/><text class="h" x="345" y="134" text-anchor="middle">Researcher</text><rect class="act" x="470" y="108" width="410" height="42" rx="5"/><text x="482" y="124"><tspan x="482" dy="0">Keeps last year's marks, to</tspan><tspan x="482" dy="20">compare with this year's</tspan></text><path class="e" d="M180 218 L230 132 L246 129" marker-end="url(#a)"/><path class="e2" d="M440 129 L466 129" marker-end="url(#b)"/><rect class="r" x="250" y="190" width="190" height="42" rx="6"/><text class="h" x="345" y="216" text-anchor="middle">Change agent</text><rect class="act" x="470" y="190" width="410" height="42" rx="5"/><text x="482" y="206"><tspan x="482" dy="0">Raises one workable change at the</tspan><tspan x="482" dy="20">staff meeting</tspan></text><path class="e" d="M180 226 L246 214" marker-end="url(#a)"/><path class="e2" d="M440 211 L466 211" marker-end="url(#b)"/><rect class="r" x="250" y="272" width="190" height="42" rx="6"/><text class="h" x="345" y="298" text-anchor="middle">Moral agent</text><rect class="act" x="470" y="272" width="410" height="42" rx="5"/><text x="482" y="288"><tspan x="482" dy="0">Admits an error in front of the</tspan><tspan x="482" dy="20">class, and corrects it</tspan></text><path class="e" d="M180 242 L230 288 L246 293" marker-end="url(#a)"/><path class="e2" d="M440 293 L466 293" marker-end="url(#b)"/><rect class="r" x="250" y="354" width="190" height="42" rx="6"/><text class="h" x="345" y="380" text-anchor="middle">Life-long learner</text><rect class="act" x="470" y="354" width="410" height="42" rx="5"/><text x="482" y="370"><tspan x="482" dy="0">Reads one thing about a topic they</tspan><tspan x="482" dy="20">teach badly</tspan></text><path class="e" d="M180 250 L230 370 L246 375" marker-end="url(#a)"/><path class="e2" d="M440 375 L466 375" marker-end="url(#b)"/><text class="m" x="30" y="406"><tspan x="30" dy="0">Each role is named by an act, not</tspan><tspan x="30" dy="20">an attitude. An act can be</tspan><tspan x="30" dy="20">planned, observed, and done again</tspan><tspan x="30" dy="20">next Monday.</tspan></text><text class="wm" x="888" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
