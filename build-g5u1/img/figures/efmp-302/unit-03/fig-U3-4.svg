<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The layers of professional image</title><desc id="d">Layered diagram of professional image with appearance as a thin outer band, then conduct, then reliability, and competence as the large core, each labelled with what it signals.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .b1{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .b3{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b4{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .ld{stroke:var(--muted);stroke-width:1.5;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="800" height="100%"/><circle class="b1" cx="280" cy="230" r="180"/><circle class="b2" cx="280" cy="230" r="152"/><circle class="b3" cx="280" cy="230" r="116"/><circle class="b4" cx="280" cy="230" r="76"/><text class="h" x="280" y="226" text-anchor="middle">Competence</text><text class="m" x="280" y="246" text-anchor="middle">the core</text><text class="h" x="280" y="180" text-anchor="middle">Reliability</text><text class="h" x="280" y="128" text-anchor="middle">Conduct</text><text class="h" x="280" y="72" text-anchor="middle">Appearance</text><line class="ld" x1="460" y1="62" x2="540" y2="62"/><line class="ld" x1="280" y1="58" x2="280" y2="40"/><line class="ld" x1="280" y1="40" x2="540" y2="40"/><rect class="b1" x="545" y="24" width="235" height="62" rx="5"/><text class="h" x="555" y="44">Appearance</text><text class="m" x="555" y="50"><tspan x="555" dy="0">Signals: I take this</tspan><tspan x="555" dy="20">seriously</tspan></text><text class="m" x="555" y="76">Changed in: a day</text><line class="ld" x1="398" y1="128" x2="540" y2="118"/><rect class="b2" x="545" y="96" width="235" height="62" rx="5"/><text class="h" x="555" y="116">Conduct</text><text class="m" x="555" y="122"><tspan x="555" dy="0">Signals: I am safe</tspan><tspan x="555" dy="20">to be near</tspan></text><text class="m" x="555" y="148">Changed in: weeks</text><line class="ld" x1="380" y1="182" x2="540" y2="190"/><rect class="b3" x="545" y="168" width="235" height="62" rx="5"/><text class="h" x="555" y="188">Reliability</text><text class="m" x="555" y="194"><tspan x="555" dy="0">Signals: my word</tspan><tspan x="555" dy="20">holds</tspan></text><text class="m" x="555" y="220">Changed in: a term</text><line class="ld" x1="356" y1="230" x2="540" y2="262"/><rect class="b4" x="545" y="240" width="235" height="62" rx="5"/><text class="h" x="555" y="260">Competence</text><text class="m" x="555" y="266"><tspan x="555" dy="0">Signals: you will</tspan><tspan x="555" dy="20">actually learn</tspan></text><text class="m" x="555" y="292">Changed in: years</text><text class="m" x="545" y="330"><tspan x="545" dy="0">Band thickness shows</tspan><tspan x="545" dy="20">how much each</tspan></text><text class="m" x="545" y="346"><tspan x="545" dy="0">carries over a career. The fastest</tspan><tspan x="545" dy="20">to</tspan></text><text class="m" x="545" y="362"><tspan x="545" dy="0">change is the thinnest, and the</tspan><tspan x="545" dy="20">slowest</tspan></text><text class="m" x="545" y="388">is the core.</text><text class="m" x="20" y="410"><tspan x="20" dy="0">Appearance opens the first lesson.</tspan><tspan x="20" dy="20">Competence is what is left after a</tspan><tspan x="20" dy="20">year, and it is the only band a</tspan><tspan x="20" dy="20">pupil can rely on.</tspan></text><text class="wm" x="788" y="506" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
