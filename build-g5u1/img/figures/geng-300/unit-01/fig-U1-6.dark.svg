<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Pronunciation challenges for Urdu speakers</title><desc id="d">Table comparing common pronunciation challenges for Urdu speakers with the Urdu-influenced pronunciation, the correct English sound and a practice strategy.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700} .sh{font-size:13px;font-weight:700} .body{font-size:12px;fill:var(--ink)} .small{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">Pronunciation challenges for Urdu speakers</text><text class="small" x="390" y="54" text-anchor="middle">the challenge, the common error and a practice strategy</text><rect class="panel-a" x="20" y="74" width="180" height="44"/><text class="sh" x="110" y="100" text-anchor="middle">Challenge</text><rect class="panel-b" x="200" y="74" width="270" height="44"/><text class="sh" x="335" y="100" text-anchor="middle">Urdu-influenced error</text><rect class="panel-c" x="470" y="74" width="290" height="44"/><text class="sh" x="615" y="100" text-anchor="middle">Correct sound and strategy</text><rect class="panel" x="20" y="118" width="180" height="56"/><text class="body" x="110" y="142" text-anchor="middle">th sounds</text><text class="small" x="110" y="160" text-anchor="middle">voice and no voice</text><rect class="panel" x="200" y="118" width="270" height="56"/><text class="body" x="335" y="142" text-anchor="middle">thin said as tin</text><text class="body" x="335" y="160" text-anchor="middle">this said as dis</text><rect class="panel" x="470" y="118" width="290" height="56"/><text class="body" x="615" y="136" text-anchor="middle">tongue between the teeth</text><text class="body" x="615" y="154" text-anchor="middle">breathe out for thin, hum for this</text><rect class="panel" x="20" y="174" width="180" height="56"/><text class="body" x="110" y="198" text-anchor="middle">v / w</text><text class="small" x="110" y="216" text-anchor="middle">both become one</text><rect class="panel" x="200" y="174" width="270" height="56"/><text class="body" x="335" y="198" text-anchor="middle">vine said as wine</text><text class="body" x="335" y="216" text-anchor="middle">wine said as vine</text><rect class="panel" x="470" y="174" width="290" height="56"/><text class="body" x="615" y="192" text-anchor="middle">v: teeth on the lower lip</text><text class="body" x="615" y="210" text-anchor="middle">w: round the lips, no touch</text><rect class="panel" x="20" y="230" width="180" height="56"/><text class="body" x="110" y="254" text-anchor="middle">p / f</text><text class="small" x="110" y="272" text-anchor="middle">often swapped</text><rect class="panel" x="200" y="230" width="270" height="56"/><text class="body" x="335" y="254" text-anchor="middle">park said as fark</text><text class="body" x="335" y="272" text-anchor="middle">food said as pood</text><rect class="panel" x="470" y="230" width="290" height="56"/><text class="body" x="615" y="248" text-anchor="middle">p: pop air through the lips</text><text class="body" x="615" y="266" text-anchor="middle">f: bite the lower lip, blow</text><rect class="panel" x="20" y="286" width="180" height="56"/><text class="body" x="110" y="310" text-anchor="middle">final clusters</text><text class="small" x="110" y="328" text-anchor="middle">end consonants dropped</text><rect class="panel" x="200" y="286" width="270" height="56"/><text class="body" x="335" y="310" text-anchor="middle">desk said as des</text><text class="body" x="335" y="328" text-anchor="middle">asked said as ask-ed</text><rect class="panel" x="470" y="286" width="290" height="56"/><text class="body" x="615" y="304" text-anchor="middle">say the full cluster slowly</text><text class="body" x="615" y="322" text-anchor="middle">then speed up to a natural pace</text><rect class="panel" x="20" y="342" width="180" height="56"/><text class="body" x="110" y="366" text-anchor="middle">vowel length</text><text class="small" x="110" y="384" text-anchor="middle">long and short merge</text><rect class="panel" x="200" y="342" width="270" height="56"/><text class="body" x="335" y="366" text-anchor="middle">ship and sheep sound the same</text><text class="body" x="335" y="384" text-anchor="middle">full and fool sound the same</text><rect class="panel" x="470" y="342" width="290" height="56"/><text class="body" x="615" y="360" text-anchor="middle">long vowel: stretch the sound</text><text class="body" x="615" y="378" text-anchor="middle">short vowel: cut it short</text><rect class="panel" x="20" y="398" width="180" height="56"/><text class="body" x="110" y="422" text-anchor="middle">stress patterns</text><text class="small" x="110" y="440" text-anchor="middle">even weight on syllables</text><rect class="panel" x="200" y="398" width="270" height="56"/><text class="body" x="335" y="422" text-anchor="middle">PHOtoGRAPH stress on every part</text><rect class="panel" x="470" y="398" width="290" height="56"/><text class="body" x="615" y="416" text-anchor="middle">one syllable carries the beat</text><text class="body" x="615" y="434" text-anchor="middle">PHOtograph, phoTOGraphy</text><line class="grid" x1="200" y1="74" x2="200" y2="454"/><line class="grid" x1="470" y1="74" x2="470" y2="454"/><line class="grid" x1="20" y1="118" x2="760" y2="118"/><line class="grid" x1="20" y1="174" x2="760" y2="174"/><line class="grid" x1="20" y1="230" x2="760" y2="230"/><line class="grid" x1="20" y1="286" x2="760" y2="286"/><line class="grid" x1="20" y1="342" x2="760" y2="342"/><line class="grid" x1="20" y1="398" x2="760" y2="398"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
