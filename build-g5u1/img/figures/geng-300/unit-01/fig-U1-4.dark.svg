<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Common grammatical errors compared</title><desc id="d">Table comparing common grammatical errors with corrections and explanations: subject-verb agreement, verb tenses, fragments, run-ons, modifiers and articles.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700} .sh{font-size:13px;font-weight:700} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">Common grammatical errors</text><text class="small" x="390" y="54" text-anchor="middle">six frequent error types with an example and the correction</text><rect class="panel-a" x="20" y="70" width="170" height="46"/><text class="sh" x="105" y="98" text-anchor="middle">Error type</text><rect class="panel-b" x="190" y="70" width="290" height="46"/><text class="sh" x="335" y="98" text-anchor="middle">Mistake example</text><rect class="panel-c" x="480" y="70" width="280" height="46"/><text class="sh" x="620" y="98" text-anchor="middle">Correction</text><rect class="panel" x="20" y="116" width="170" height="54"/><text class="body" x="105" y="140" text-anchor="middle">subject-verb</text><text class="body" x="105" y="158" text-anchor="middle">agreement</text><rect class="panel" x="190" y="116" width="290" height="54"/><text class="body" x="335" y="148" text-anchor="middle">The list of items are long.</text><rect class="panel" x="480" y="116" width="280" height="54"/><text class="body" x="620" y="148" text-anchor="middle">The list of items is long.</text><rect class="panel" x="20" y="170" width="170" height="54"/><text class="body" x="105" y="194" text-anchor="middle">verb tenses</text><text class="body" x="105" y="212" text-anchor="middle">wrong past form</text><rect class="panel" x="190" y="170" width="290" height="54"/><text class="body" x="335" y="200" text-anchor="middle">Yesterday I go to the market.</text><rect class="panel" x="480" y="170" width="280" height="54"/><text class="body" x="620" y="200" text-anchor="middle">Yesterday I went to the market.</text><rect class="panel" x="20" y="224" width="170" height="54"/><text class="body" x="105" y="248" text-anchor="middle">sentence</text><text class="body" x="105" y="266" text-anchor="middle">fragments</text><rect class="panel" x="190" y="224" width="290" height="54"/><text class="body" x="335" y="254" text-anchor="middle">Because it was raining.</text><rect class="panel" x="480" y="224" width="280" height="54"/><text class="body" x="620" y="246" text-anchor="middle">We stayed in</text><text class="body" x="620" y="264" text-anchor="middle">because it was raining.</text><rect class="panel" x="20" y="278" width="170" height="54"/><text class="body" x="105" y="302" text-anchor="middle">run-on</text><text class="body" x="105" y="320" text-anchor="middle">sentences</text><rect class="panel" x="190" y="278" width="290" height="54"/><text class="body" x="335" y="308" text-anchor="middle">It was late we went home.</text><rect class="panel" x="480" y="278" width="280" height="54"/><text class="body" x="620" y="300" text-anchor="middle">It was late, so we</text><text class="body" x="620" y="318" text-anchor="middle">went home.</text><rect class="panel" x="20" y="332" width="170" height="54"/><text class="body" x="105" y="356" text-anchor="middle">misplaced</text><text class="body" x="105" y="374" text-anchor="middle">modifiers</text><rect class="panel" x="190" y="332" width="290" height="54"/><text class="body" x="335" y="354" text-anchor="middle">She almost drove the kids</text><text class="body" x="335" y="372" text-anchor="middle">to school every day.</text><rect class="panel" x="480" y="332" width="280" height="54"/><text class="body" x="620" y="354" text-anchor="middle">She drove the kids to</text><text class="body" x="620" y="372" text-anchor="middle">school almost every day.</text><rect class="panel" x="20" y="386" width="170" height="54"/><text class="body" x="105" y="419" text-anchor="middle">articles</text><rect class="panel" x="190" y="386" width="290" height="54"/><text class="body" x="335" y="419" text-anchor="middle">He is a honest man.</text><rect class="panel" x="480" y="386" width="280" height="54"/><text class="body" x="620" y="419" text-anchor="middle">He is an honest man.</text><line class="grid" x1="190" y1="70" x2="190" y2="440"/><line class="grid" x1="480" y1="70" x2="480" y2="440"/><line class="grid" x1="20" y1="116" x2="760" y2="116"/><line class="grid" x1="20" y1="170" x2="760" y2="170"/><line class="grid" x1="20" y1="224" x2="760" y2="224"/><line class="grid" x1="20" y1="278" x2="760" y2="278"/><line class="grid" x1="20" y1="332" x2="760" y2="332"/><line class="grid" x1="20" y1="386" x2="760" y2="386"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
