<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Motivation strategies and what they cost</title><desc id="d">Table comparing motivation strategies against what each costs in time and materials: a hook question, a real-world problem, a competition, and a pupil choice.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="220" height="75"/><text class="h" x="110" y="30" text-anchor="middle">Strategy</text><text class="small" x="110" y="52" text-anchor="middle">how you open the lesson</text><rect class="panel-b" x="220" y="0" width="280" height="75"/><text class="h" x="360" y="30" text-anchor="middle">What it costs in time</text><text class="small" x="360" y="52" text-anchor="middle">prep + minutes in the period</text><rect class="panel-c" x="500" y="0" width="280" height="75"/><text class="h" x="640" y="30" text-anchor="middle">What it costs in materials</text><text class="small" x="640" y="52" text-anchor="middle">and the management price</text><rect class="panel" x="0" y="75" width="220" height="95"/><text class="sh" x="110" y="125" text-anchor="middle">A hook question</text><rect class="panel" x="0" y="170" width="220" height="95"/><text class="sh" x="110" y="220" text-anchor="middle">A real-world problem</text><rect class="panel" x="0" y="265" width="220" height="95"/><text class="sh" x="110" y="315" text-anchor="middle">A competition</text><rect class="panel" x="0" y="360" width="220" height="95"/><text class="sh" x="110" y="410" text-anchor="middle">A pupil choice</text><text class="body" x="360" y="115" text-anchor="middle">almost none;</text><text class="body" x="360" y="135" text-anchor="middle">two minutes</text><text class="body" x="360" y="210" text-anchor="middle">real prep;</text><text class="body" x="360" y="230" text-anchor="middle">ten to fifteen minutes</text><text class="body" x="360" y="305" text-anchor="middle">fast to run;</text><text class="body" x="360" y="325" text-anchor="middle">three to five minutes</text><text class="body" x="360" y="395" text-anchor="middle">slows the start;</text><text class="body" x="360" y="415" text-anchor="middle">needs clear boundaries</text><text class="body" x="640" y="115" text-anchor="middle">nothing</text><text class="body" x="640" y="210" text-anchor="middle">materials to investigate;</text><text class="body" x="640" y="230" text-anchor="middle">deeper engagement</text><text class="body" x="640" y="305" text-anchor="middle">winners and losers -</text><text class="body" x="640" y="325" text-anchor="middle">a management cost</text><text class="body" x="640" y="395" text-anchor="middle">can become noise</text><text class="body" x="640" y="415" text-anchor="middle">without boundaries</text><line class="grid" x1="220" y1="0" x2="220" y2="470"/><line class="grid" x1="500" y1="0" x2="500" y2="470"/><line class="grid" x1="0" y1="75" x2="780" y2="75"/><line class="grid" x1="0" y1="170" x2="780" y2="170"/><line class="grid" x1="0" y1="265" x2="780" y2="265"/><line class="grid" x1="0" y1="360" x2="780" y2="360"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
