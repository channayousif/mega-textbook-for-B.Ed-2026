<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Strong feedback compared with weak feedback</title><desc id="d">Table comparing strong feedback against weak feedback: strong feedback names a specific criterion and cites a passage, weak feedback is vague; strong feedback suggests a revision, weak feedback only praises or criticises.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="160" height="70"/><text class="h" x="80" y="30" text-anchor="middle">Aspect</text><text class="small" x="80" y="52" text-anchor="middle">what we compare</text><rect class="panel-b" x="160" y="0" width="300" height="70"/><text class="h" x="310" y="30" text-anchor="middle">Strong feedback</text><text class="small" x="310" y="52" text-anchor="middle">what helps the author improve</text><rect class="panel-c" x="460" y="0" width="320" height="70"/><text class="h" x="620" y="30" text-anchor="middle">Weak feedback</text><text class="small" x="620" y="52" text-anchor="middle">what does not help</text><rect class="panel" x="0" y="70" width="160" height="100"/><text class="sh" x="80" y="115" text-anchor="middle">Specificity</text><rect class="panel" x="0" y="170" width="160" height="100"/><text class="sh" x="80" y="215" text-anchor="middle">Evidence</text><rect class="panel" x="0" y="270" width="160" height="100"/><text class="sh" x="80" y="315" text-anchor="middle">Suggestion</text><rect class="panel" x="0" y="370" width="160" height="100"/><text class="sh" x="80" y="415" text-anchor="middle">Tone</text><text class="body" x="310" y="115" text-anchor="middle">Names a specific</text><text class="body" x="310" y="135" text-anchor="middle">criterion and passage</text><text class="body" x="310" y="215" text-anchor="middle">Cites the exact part</text><text class="body" x="310" y="235" text-anchor="middle">of the plan</text><text class="body" x="310" y="315" text-anchor="middle">Proposes a concrete</text><text class="body" x="310" y="335" text-anchor="middle">revision</text><text class="body" x="310" y="415" text-anchor="middle">Respectful, focused</text><text class="body" x="310" y="435" text-anchor="middle">on the plan</text><text class="body" x="620" y="115" text-anchor="middle">Vague ("I liked it")</text><text class="body" x="620" y="215" text-anchor="middle">No evidence cited</text><text class="body" x="620" y="315" text-anchor="middle">Only praises or</text><text class="body" x="620" y="335" text-anchor="middle">criticises</text><text class="body" x="620" y="415" text-anchor="middle">Judgemental or</text><text class="body" x="620" y="435" text-anchor="middle">dismissive</text><line class="grid" x1="160" y1="0" x2="160" y2="470"/><line class="grid" x1="460" y1="0" x2="460" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="170" x2="780" y2="170"/><line class="grid" x1="0" y1="270" x2="780" y2="270"/><line class="grid" x1="0" y1="370" x2="780" y2="370"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
