<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What an ethic of care is built from</title><desc id="d">Concept map showing what an ethic of care is built from: at the centre 'an ethic of care', with branches to attentiveness, responsiveness, competence, and mutual respect.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="panel-a" cx="390" cy="235" rx="140" ry="55"/><text class="h" x="390" y="230" text-anchor="middle">An ethic</text><text class="h" x="390" y="252" text-anchor="middle">of care</text><rect class="panel-b" x="40" y="40" width="200" height="90" rx="6"/><text class="sh" x="140" y="75" text-anchor="middle">Attentiveness</text><text class="small" x="140" y="100" text-anchor="middle">noticing what is</text><text class="small" x="140" y="118" text-anchor="middle">happening in the room</text><rect class="panel-c" x="540" y="40" width="200" height="90" rx="6"/><text class="sh" x="640" y="75" text-anchor="middle">Responsiveness</text><text class="small" x="640" y="100" text-anchor="middle">acting on what</text><text class="small" x="640" y="118" text-anchor="middle">you notice</text><rect class="panel-d" x="40" y="350" width="200" height="90" rx="6"/><text class="sh" x="140" y="385" text-anchor="middle">Competence</text><text class="small" x="140" y="410" text-anchor="middle">the care is effective,</text><text class="small" x="140" y="428" text-anchor="middle">not just well-meaning</text><rect class="panel-a" x="540" y="350" width="200" height="90" rx="6"/><text class="sh" x="640" y="385" text-anchor="middle">Mutual respect</text><text class="small" x="640" y="410" text-anchor="middle">care flows in both</text><text class="small" x="640" y="428" text-anchor="middle">directions</text><line class="stroke" x1="180" y1="130" x2="310" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="600" y1="130" x2="470" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="180" y1="350" x2="310" y2="285" marker-end="url(#arrow)"/><line class="stroke" x1="600" y1="350" x2="470" y2="285" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
