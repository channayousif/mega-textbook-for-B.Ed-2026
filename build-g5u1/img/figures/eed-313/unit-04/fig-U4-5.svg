<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Participation against involvement</title><desc id="d">Table comparing participation against involvement with an example of each: participation is attending a school event, involvement is helping to decide what happens there.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="160" height="70"/><text class="h" x="80" y="30" text-anchor="middle">Practice</text><text class="small" x="80" y="52" text-anchor="middle">what happens</text><rect class="panel-b" x="160" y="0" width="280" height="70"/><text class="h" x="300" y="30" text-anchor="middle">Participation</text><text class="small" x="300" y="52" text-anchor="middle">being present</text><rect class="panel-c" x="440" y="0" width="340" height="70"/><text class="h" x="610" y="30" text-anchor="middle">Involvement</text><text class="small" x="610" y="52" text-anchor="middle">having a voice</text><rect class="panel" x="0" y="70" width="160" height="80"/><text class="sh" x="80" y="115" text-anchor="middle">Attending a</text><text class="sh" x="80" y="135" text-anchor="middle">parent meeting</text><rect class="panel" x="0" y="150" width="160" height="80"/><text class="sh" x="80" y="195" text-anchor="middle">Helping design</text><text class="sh" x="80" y="215" text-anchor="middle">the science fair</text><rect class="panel" x="0" y="230" width="160" height="80"/><text class="sh" x="80" y="275" text-anchor="middle">Contributing</text><text class="sh" x="80" y="295" text-anchor="middle">to a water tap</text><rect class="panel" x="0" y="310" width="160" height="80"/><text class="sh" x="80" y="355" text-anchor="middle">Sitting on the</text><text class="sh" x="80" y="375" text-anchor="middle">management committee</text><text class="body" x="300" y="115" text-anchor="middle">present, listens</text><text class="body" x="300" y="195" text-anchor="middle">present, helps plan</text><text class="body" x="300" y="275" text-anchor="middle">gives money</text><text class="body" x="300" y="355" text-anchor="middle">present, receives report</text><text class="body" x="610" y="115" text-anchor="middle">present, no voice in agenda</text><text class="body" x="610" y="195" text-anchor="middle">present, helps decide</text><text class="body" x="610" y="275" text-anchor="middle">gives money, no say in use</text><text class="body" x="610" y="355" text-anchor="middle">present, votes on budget</text><line class="grid" x1="160" y1="0" x2="160" y2="470"/><line class="grid" x1="440" y1="0" x2="440" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="150" x2="780" y2="150"/><line class="grid" x1="0" y1="230" x2="780" y2="230"/><line class="grid" x1="0" y1="310" x2="780" y2="310"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
