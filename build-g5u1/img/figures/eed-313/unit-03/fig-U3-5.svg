<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A week's recovered minutes transition by transition</title><desc id="d">Table showing a week's recovered minutes, transition by transition: before a routine and after, for handing out materials, moving between activities, and settling at the start of a lesson.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="220" height="70"/><text class="h" x="110" y="30" text-anchor="middle">Transition</text><text class="small" x="110" y="52" text-anchor="middle">the moment</text><rect class="panel-b" x="220" y="0" width="280" height="70"/><text class="h" x="360" y="30" text-anchor="middle">Minutes lost (before)</text><text class="small" x="360" y="52" text-anchor="middle">no routine</text><rect class="panel-c" x="500" y="0" width="280" height="70"/><text class="h" x="640" y="30" text-anchor="middle">Minutes lost (after)</text><text class="small" x="640" y="52" text-anchor="middle">with a routine</text><rect class="panel" x="0" y="70" width="220" height="80"/><text class="sh" x="110" y="115" text-anchor="middle">Handing out materials</text><rect class="panel" x="0" y="150" width="220" height="80"/><text class="sh" x="110" y="195" text-anchor="middle">Moving between activities</text><rect class="panel" x="0" y="230" width="220" height="80"/><text class="sh" x="110" y="275" text-anchor="middle">Settling at the start</text><rect class="panel" x="0" y="310" width="220" height="80"/><text class="sh" x="110" y="355" text-anchor="middle">Handing in work</text><rect class="panel" x="0" y="390" width="220" height="80"/><text class="sh" x="110" y="435" text-anchor="middle">Ending the lesson</text><text class="body" x="360" y="115" text-anchor="middle">5 min per lesson</text><text class="body" x="360" y="195" text-anchor="middle">4 min per lesson</text><text class="body" x="360" y="275" text-anchor="middle">3 min per lesson</text><text class="body" x="360" y="355" text-anchor="middle">4 min per lesson</text><text class="body" x="360" y="435" text-anchor="middle">3 min per lesson</text><text class="body" x="640" y="115" text-anchor="middle">30 sec per lesson</text><text class="body" x="640" y="195" text-anchor="middle">30 sec per lesson</text><text class="body" x="640" y="275" text-anchor="middle">10 sec per lesson</text><text class="body" x="640" y="355" text-anchor="middle">30 sec per lesson</text><text class="body" x="640" y="435" text-anchor="middle">10 sec per lesson</text><line class="grid" x1="220" y1="0" x2="220" y2="470"/><line class="grid" x1="500" y1="0" x2="500" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="150" x2="780" y2="150"/><line class="grid" x1="0" y1="230" x2="780" y2="230"/><line class="grid" x1="0" y1="310" x2="780" y2="310"/><line class="grid" x1="0" y1="390" x2="780" y2="390"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.