<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Routines matched to specific special needs</title><desc id="d">Table matching routines to specific special needs: a routine for a pupil who needs extra time, a routine for a pupil who is easily distracted, a routine for a pupil who finishes early, and a routine for a pupil who needs help but will not ask.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="180" height="70"/><text class="h" x="90" y="30" text-anchor="middle">The need</text><text class="small" x="90" y="52" text-anchor="middle">what the pupil requires</text><rect class="panel-b" x="180" y="0" width="320" height="70"/><text class="h" x="340" y="30" text-anchor="middle">The routine it needs</text><text class="small" x="340" y="52" text-anchor="middle">the repeated practice</text><rect class="panel-c" x="500" y="0" width="280" height="70"/><text class="h" x="640" y="30" text-anchor="middle">What it protects</text><text class="small" x="640" y="52" text-anchor="middle">the risk it guards against</text><rect class="panel" x="0" y="70" width="180" height="90"/><text class="sh" x="90" y="115" text-anchor="middle">Needs extra time</text><rect class="panel" x="0" y="160" width="180" height="90"/><text class="sh" x="90" y="205" text-anchor="middle">Easily distracted</text><rect class="panel" x="0" y="250" width="180" height="90"/><text class="sh" x="90" y="295" text-anchor="middle">Finishes early</text><rect class="panel" x="0" y="340" width="180" height="90"/><text class="sh" x="90" y="385" text-anchor="middle">Needs help but</text><text class="sh" x="90" y="405" text-anchor="middle">will not ask</text><text class="body" x="340" y="115" text-anchor="middle">Continuation task and a</text><text class="body" x="340" y="135" text-anchor="middle">signal card (not finished yet)</text><text class="body" x="340" y="205" text-anchor="middle">Seating routine, timer,</text><text class="body" x="340" y="225" text-anchor="middle">task broken into steps</text><text class="body" x="340" y="295" text-anchor="middle">Reading corner, peer-tutoring</text><text class="body" x="340" y="315" text-anchor="middle">role, self-check extension</text><text class="body" x="340" y="385" text-anchor="middle">Coloured card on desk,</text><text class="body" x="340" y="405" text-anchor="middle">predictable check-in point</text><text class="body" x="640" y="115" text-anchor="middle">Pupil left behind when</text><text class="body" x="640" y="135" text-anchor="middle">the class moves on</text><text class="body" x="640" y="205" text-anchor="middle">Loss of focus, disruption</text><text class="body" x="640" y="225" text-anchor="middle">to others</text><text class="body" x="640" y="295" text-anchor="middle">Early finisher becomes</text><text class="body" x="640" y="315" text-anchor="middle">the source of disruption</text><text class="body" x="640" y="385" text-anchor="middle">Pupil struggles silently,</text><text class="body" x="640" y="405" text-anchor="middle">falls further behind</text><line class="grid" x1="180" y1="0" x2="180" y2="470"/><line class="grid" x1="500" y1="0" x2="500" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="160" x2="780" y2="160"/><line class="grid" x1="0" y1="250" x2="780" y2="250"/><line class="grid" x1="0" y1="340" x2="780" y2="340"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
