<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One routine per subject with what it protects</title><desc id="d">Table showing one routine per subject with what it protects: mathematics has a materials routine and a checking routine, science has a safety routine and a cleanup routine, literacy has a reading routine and a response routine.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="160" height="70"/><text class="h" x="80" y="30" text-anchor="middle">Subject</text><text class="small" x="80" y="52" text-anchor="middle">the area</text><rect class="panel-b" x="160" y="0" width="320" height="70"/><text class="h" x="320" y="30" text-anchor="middle">The routine</text><text class="small" x="320" y="52" text-anchor="middle">the repeated practice</text><rect class="panel-c" x="480" y="0" width="300" height="70"/><text class="h" x="630" y="30" text-anchor="middle">What it protects</text><text class="small" x="630" y="52" text-anchor="middle">the risk it guards against</text><rect class="panel" x="0" y="70" width="160" height="100"/><text class="sh" x="80" y="115" text-anchor="middle">Mathematics</text><rect class="panel" x="0" y="170" width="160" height="100"/><text class="sh" x="80" y="215" text-anchor="middle">Science</text><rect class="panel" x="0" y="270" width="160" height="100"/><text class="sh" x="80" y="315" text-anchor="middle">Literacy</text><text class="body" x="320" y="115" text-anchor="middle">Materials routine and</text><text class="body" x="320" y="135" text-anchor="middle">checking routine</text><text class="body" x="320" y="215" text-anchor="middle">Safety routine and</text><text class="body" x="320" y="235" text-anchor="middle">cleanup routine</text><text class="body" x="320" y="315" text-anchor="middle">Reading routine and</text><text class="body" x="320" y="335" text-anchor="middle">response routine</text><text class="body" x="630" y="115" text-anchor="middle">Lost time handing out</text><text class="body" x="630" y="135" text-anchor="middle">materials; idle pupils</text><text class="body" x="630" y="215" text-anchor="middle">Accidents; chaos at</text><text class="body" x="630" y="235" text-anchor="middle">the end of a lesson</text><text class="body" x="630" y="315" text-anchor="middle">Lost concentration;</text><text class="body" x="630" y="335" text-anchor="middle">no transfer of learning</text><line class="grid" x1="160" y1="0" x2="160" y2="470"/><line class="grid" x1="480" y1="0" x2="480" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="170" x2="780" y2="170"/><line class="grid" x1="0" y1="270" x2="780" y2="270"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
