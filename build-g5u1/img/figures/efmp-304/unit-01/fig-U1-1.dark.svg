<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Thinking and its functions</title><desc id="d">A concept map placing "thinking" at the centre with its functions branching off (remembering, imagining, believing, deciding, reasoning), and critical thinking marked as the branch that evaluates the others.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted);text-anchor:middle} .ah{fill:var(--ink)} .eval{stroke:var(--a1);stroke-width:3;fill:none}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="are" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="92" ry="48" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="232">Thinking</text><text class="m" x="390" y="252">mental functions</text><rect class="panel" x="30" y="40" width="150" height="60" rx="6"/><text class="h" x="105" y="76">remembering</text><rect class="panel" x="600" y="40" width="150" height="60" rx="6"/><text class="h" x="675" y="76">imagining</text><rect class="panel" x="30" y="370" width="150" height="60" rx="6"/><text class="h" x="105" y="406">believing</text><rect class="panel" x="600" y="370" width="150" height="60" rx="6"/><text class="h" x="675" y="406">deciding</text><rect class="panel" x="315" y="410" width="150" height="50" rx="6"/><text class="h" x="390" y="440">reasoning</text><line class="link" x1="230" y1="155" x2="160" y2="105" marker-end="url(#ar)"/><line class="link" x1="550" y1="155" x2="620" y2="105" marker-end="url(#ar)"/><line class="link" x1="230" y1="320" x2="160" y2="370" marker-end="url(#ar)"/><line class="link" x1="550" y1="320" x2="620" y2="370" marker-end="url(#ar)"/><line class="link" x1="390" y1="285" x2="390" y2="405" marker-end="url(#ar)"/><rect x="290" y="105" width="200" height="50" rx="25" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2.5"/><text class="h" x="390" y="127" fill="var(--a3)">critical thinking</text><text class="m" x="390" y="145" fill="var(--a3)">evaluates the others</text><line class="eval" x1="390" y1="155" x2="390" y2="185" marker-end="url(#are)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>