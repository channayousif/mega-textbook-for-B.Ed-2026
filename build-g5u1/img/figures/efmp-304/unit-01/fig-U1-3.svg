<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The critical-thinking standards</title><desc id="d">Table listing the eight critical-thinking standards with a failing example and a passing rewrite of the same classroom claim for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .yes{font-weight:700} .no{fill:var(--a3)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="16" y="16" width="110" height="50" fill="var(--a1-fill)"/><rect x="126" y="16" width="310" height="50" fill="var(--a1-fill)"/><rect x="436" y="16" width="328" height="50" fill="var(--a1-fill)"/><text class="h" x="71" y="40" text-anchor="middle">Standard</text><text class="h" x="281" y="32" text-anchor="middle">A failing example</text><text class="m" x="281" y="50" text-anchor="middle">(claim that misses it)</text><text class="h" x="600" y="32" text-anchor="middle">A passing rewrite</text><text class="m" x="600" y="50" text-anchor="middle">(of the same claim)</text><line x1="16" y1="66" x2="764" y2="66" stroke="var(--ink)" stroke-width="2"/><line x1="126" y1="16" x2="126" y2="454" stroke="var(--ink)" stroke-width="1.5"/><line x1="436" y1="16" x2="436" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="71" y="96">clear</text><text x="136" y="90">"this class cannot do</text><text x="136" y="106">word problems"</text><text x="446" y="90">"fewer than half the class can</text"><text x="446" y="106">solve a two-step word problem"</text><line x1="16" y1="120" x2="764" y2="120" stroke="var(--ink)" stroke-width="1"/><text class="h" x="71" y="150">accurate</text><text x="136" y="144">"results will go up"</text><text x="446" y="144">"punctuation errors fell by a</text><text x="446" y="160">quarter over one term"</text><line x1="16" y1="170" x2="764" y2="170" stroke="var(--ink)" stroke-width="1"/><text class="h" x="71" y="200">precise</text><text x="136" y="194">"teach them better"</text><text x="446" y="194">"use a five-minute error check</text"><text x="446" y="210">at the start of each writing lesson"</text><line x1="16" y1="220" x2="764" y2="220" stroke="var(--ink)" stroke-width="1"/><text class="h" x="71" y="250">relevant</text><text x="136" y="244">"pupils who eat breakfast do well"</text><text x="446" y="244">"the reason they struggle is the</text><text x="446" y="260">gap in fraction knowledge, not breakfast"</text><line x1="16" y1="270" x2="764" y2="270" stroke="var(--ink)" stroke-width="1"/><text class="h" x="71" y="300">deep</text><text x="136" y="294">"they failed because they did not revise"</text><text x="446" y="294">"they failed because the teaching</text"><text x="446" y="310">assumed prior knowledge they lacked"</text><line x1="16" y1="320" x2="764" y2="320" stroke="var(--ink)" stroke-width="1"/><text class="h" x="71" y="350">logical</text><text x="136" y="344">"she is a good teacher, so her</text><text x="136" y="360">results must be high"</text><text x="446" y="344">"her results are high, and a possible</text"><text x="446" y="360">reason is her clear explanations"</text><line x1="16" y1="370" x2="764" y2="370" stroke="var(--ink)" stroke-width="1"/><text class="h" x="71" y="400">fair</text><text x="136" y="394">"group work never works here"</text><text x="446" y="394">"group work failed in my class when</text><text x="446" y="410">I gave no structure - I will try again"</text><line x1="16" y1="420" x2="764" y2="420" stroke="var(--ink)" stroke-width="1"/><text class="h" x="71" y="448">broad</text><text x="136" y="442">"the only way is direct instruction"</text><text x="446" y="442">"direct instruction works for this;</text><text x="446" y="458">let me also try a guided inquiry task"</text><rect x="16" y="66" width="748" height="388" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>