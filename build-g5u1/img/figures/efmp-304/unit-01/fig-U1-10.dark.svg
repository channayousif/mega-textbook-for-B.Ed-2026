<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The teacher as critical thinker: evaluating claims from three sources</title><desc id="d">A diagram showing a claim arriving from a workshop, a textbook and a colleague, each routed through the same critical evaluation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted);text-anchor:middle} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="16" y="20" width="180" height="80" rx="6"/><text class="h" x="106" y="46">workshop</text><text x="106" y="66">"raises results</text><text x="106" y="82">by 30 per cent"</text><rect class="panel" x="16" y="190" width="180" height="80" rx="6"/><text class="h" x="106" y="216">textbook</text><text x="106" y="236">"pupils learn best</text><text x="106" y="252">when they discover"</text><rect class="panel" x="16" y="360" width="180" height="80" rx="6"/><text class="h" x="106" y="386">colleague</text><text x="106" y="406">"this method worked</text><text x="106" y="422">brilliantly in my class"</text><rect x="260" y="190" width="260" height="100" rx="8" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="216" fill="var(--a1)">the same evaluation</text><text x="390" y="242">is it clear? is it accurate?</text><text x="390" y="260">is it relevant to my pupils?</text><text x="390" y="278">does the evidence hold up?</text><line class="link" x1="196" y1="60" x2="258" y2="210" marker-end="url(#ar)"/><line class="link" x1="196" y1="230" x2="258" y2="240" marker-end="url(#ar)"/><line class="link" x1="196" y1="400" x2="258" y2="270" marker-end="url(#ar)"/><rect class="panel" x="584" y="120" width="180" height="70" rx="6"/><text class="h" x="674" y="148">adopt</text><text x="674" y="168">the evidence holds up</text><text x="674" y="184">and fits my class</text><rect class="panel" x="584" y="280" width="180" height="70" rx="6"/><text class="h" x="674" y="308">adapt or set aside</text><text x="674" y="328">the evidence is weak,</text><text x="674" y="344">vague or off-point</text><line class="link" x1="520" y1="220" x2="582" y2="160" stroke="var(--a1)" marker-end="url(#ar)"/><line class="link" x1="520" y1="260" x2="582" y2="310" stroke="var(--a3)" marker-end="url(#ar)"/><text class="yes" x="552" y="188">passes</text><text class="no" x="552" y="290">fails</text><text class="m" x="674" y="100">the source does not decide -</text><text class="m" x="674" y="114">the evidence does</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>