<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشے میں علیحدگی، انضمام اور شمولیت کو ایک سلسلے میں دکھایا گیا ہے: الگ تعلیمی ماحول، جزوی شرکت کے لیے بچے کی موافقت، اور نظام میں تبدیلی سے سب کی مکمل شرکت۔</title><desc id="d">تصوری نقشے میں علیحدگی، انضمام اور شمولیت کو ایک سلسلے میں دکھایا گیا ہے: الگ تعلیمی ماحول، جزوی شرکت کے لیے بچے کی موافقت، اور نظام میں تبدیلی سے سب کی مکمل شرکت۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.edge{fill:none;stroke:var(--ink);stroke-width:2.5}.head{fill:var(--ink)}text{fill:var(--ink);font-size:23px}.h{font-weight:700}.wm{fill:var(--wm);font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="510"/><text class="h" x="480" y="45" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">سیکھنے والوں کے فرق کے بارے میں رویے</tspan></text><rect class="accent" x="655" y="100" width="280" height="80" rx="12"/><text class="" x="795" y="140" text-anchor="middle"><tspan text-anchor="middle" x="795" dy="0">علیحدگی</tspan></text><line class="edge" x1="795" y1="180" x2="795" y2="235" marker-end="url(#a)"/><rect class="box" x="655" y="240" width="280" height="120" rx="12"/><text class="" x="795" y="280" text-anchor="middle"><tspan text-anchor="middle" x="795" dy="0">الگ تعلیمی ماحول</tspan><tspan text-anchor="middle" x="795" dy="36">الگ نصاب</tspan></text><line class="edge" x1="655" y1="140" x2="625" y2="140" marker-end="url(#a)"/><rect class="accent" x="340" y="100" width="280" height="80" rx="12"/><text class="" x="480" y="140" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">انضمام</tspan></text><line class="edge" x1="480" y1="180" x2="480" y2="235" marker-end="url(#a)"/><rect class="box" x="340" y="240" width="280" height="120" rx="12"/><text class="" x="480" y="280" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">عام جماعت میں جگہ</tspan><tspan text-anchor="middle" x="480" dy="36">بچہ خود کو ڈھالے</tspan></text><line class="edge" x1="340" y1="140" x2="310" y2="140" marker-end="url(#a)"/><rect class="accent" x="25" y="100" width="280" height="80" rx="12"/><text class="" x="165" y="140" text-anchor="middle"><tspan text-anchor="middle" x="165" dy="0">شمولیت</tspan></text><line class="edge" x1="165" y1="180" x2="165" y2="235" marker-end="url(#a)"/><rect class="box" x="25" y="240" width="280" height="120" rx="12"/><text class="" x="165" y="280" text-anchor="middle"><tspan text-anchor="middle" x="165" dy="0">سب کی مکمل شرکت</tspan><tspan text-anchor="middle" x="165" dy="36">نظام میں تبدیلی</tspan></text><text class="" x="480" y="415" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">ہر بچے کی شرکت کی طرف پیش قدمی</tspan></text><text class="wm" x="15" y="495" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
