<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خاکہ محرومی کا چکر دکھاتا ہے: رکاوٹ شرکت کو روکتی ہے اور محرومی رکاوٹ کو برقرار رکھتی ہے؛ کسی ایک کڑی کو توڑنے سے شمولیت ممکن ہوتی ہے۔</title><desc id="d">خاکہ محرومی کا چکر دکھاتا ہے: رکاوٹ شرکت کو روکتی ہے اور محرومی رکاوٹ کو برقرار رکھتی ہے؛ کسی ایک کڑی کو توڑنے سے شمولیت ممکن ہوتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.edge{fill:none;stroke:var(--ink);stroke-width:2.5}.head{fill:var(--ink)}text{fill:var(--ink);font-size:23px}.h{font-weight:700}.wm{fill:var(--wm);font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="650"/><text class="h" x="480" y="45" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">محرومی کا چکر توڑیں</tspan></text><rect class="box" x="550" y="100" width="360" height="155" rx="12"/><text class="" x="730" y="140" text-anchor="middle"><tspan text-anchor="middle" x="730" dy="0">رکاوٹ</tspan><tspan text-anchor="middle" x="730" dy="36">جسمانی، رویے کی</tspan><tspan text-anchor="middle" x="730" dy="36">یا تدریسی</tspan></text><rect class="box" x="50" y="100" width="360" height="155" rx="12"/><text class="" x="230" y="140" text-anchor="middle"><tspan text-anchor="middle" x="230" dy="0">شرکت رک جاتی ہے</tspan><tspan text-anchor="middle" x="230" dy="36">بچہ شامل نہیں ہو پاتا</tspan></text><rect class="box" x="300" y="365" width="360" height="130" rx="12"/><text class="" x="480" y="405" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">محرومی برقرار</tspan><tspan text-anchor="middle" x="480" dy="36">رکاوٹ بھی برقرار</tspan></text><line class="edge" x1="550" y1="175" x2="410" y2="175" marker-end="url(#a)"/><line class="edge" x1="230" y1="255" x2="360" y2="365" marker-end="url(#a)"/><line class="edge" x1="600" y1="365" x2="745" y2="255" marker-end="url(#a)"/><rect class="accent" x="45" y="525" width="870" height="75" rx="12"/><text class="" x="480" y="565" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">رکاوٹ دور کریں، شرکت ممکن بنائیں، چکر توڑیں</tspan></text><text class="wm" x="15" y="635" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
