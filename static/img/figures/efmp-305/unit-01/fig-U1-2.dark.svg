<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A three-column table comparing segregation, integration and inclusion across these criteria: setting, who adjusts, goal, and a one-line classroom example.</title><desc id="d">A three-column table comparing segregation, integration and inclusion across these criteria: setting, who adjusts, goal, and a one-line classroom example.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.edge{fill:none;stroke:var(--ink);stroke-width:2.5}.head{fill:var(--ink)}text{fill:var(--ink);font-size:23px}.h{font-weight:700}.wm{fill:var(--wm);font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1080" height="690"/><text class="h" x="540" y="45" text-anchor="middle"><tspan text-anchor="middle" x="540" dy="0">Three approaches compared</tspan></text><rect class="accent" x="20" y="85" width="260" height="85"/><text class="h" x="150" y="135" text-anchor="middle"><tspan text-anchor="middle" x="150" dy="0">Criterion</tspan></text><rect class="accent" x="280" y="85" width="260" height="85"/><text class="h" x="410" y="135" text-anchor="middle"><tspan text-anchor="middle" x="410" dy="0">Segregation</tspan></text><rect class="accent" x="540" y="85" width="260" height="85"/><text class="h" x="670" y="135" text-anchor="middle"><tspan text-anchor="middle" x="670" dy="0">Integration</tspan></text><rect class="accent" x="800" y="85" width="260" height="85"/><text class