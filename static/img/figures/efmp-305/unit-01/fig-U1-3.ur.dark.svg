<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشے میں شمولیتی اسکول کے مرکزی خانے سے شمولیت کے چھ اصول جڑے ہیں، اور ہر اصول کے ساتھ جماعت میں اس کی ایک عملی علامت دی گئی ہے۔</title><desc id="d">تصوری نقشے میں شمولیتی اسکول کے مرکزی خانے سے شمولیت کے چھ اصول جڑے ہیں، اور ہر اصول کے ساتھ جماعت میں اس کی ایک عملی علامت دی گئی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.edge{fill:none;stroke:var(--ink);stroke-width:2.5}.head{fill:var(--ink)}text{fill:var(--ink);font-size:23px}.h{font-weight:700}.wm{fill:var(--wm);font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="790"/><text class="h" x="500" y="60" text-anchor="middle"><tspan text-anchor="middle" x="500" dy="0">جماعت میں شمولیت کے اصول</tspan></text><line class="edge" x1="655" y1="160" x2="605" y2="370" marker-end="url(#a)"/><rect class="box" x="655" y="95" width="320" height="140" rx="12"/><text class="" x="815" y="135" text-anchor="middle"><tspan text-anchor="middle" x="815" dy="0">تنوع کی قدر</tspan><tspan text-anchor="middle" x="815" dy="36">گھریلو زبان کی مثالیں</tspan></text><line class="edge" x1="655" y1="365" x2="605" y2="370" marker-end="url(#a)"/><rect class="box" x="655" y="300" width="320" height="140" rx="12"/><text class="" x="815" y="340" text-anchor="middle"><tspan text-anchor="middle" x="815" dy="0">سب کی شرکت</tspan><tspan text-anchor="middle" x="815" dy="36">ہر بچہ وضاحت کرے</tspan></text><line class="edge" x1="655" y1="570" x2="605" y2="370" marker-end="url(#a)"/><rect class="box" x="655" y="505" width="320" height="140" rx="12"/><text class="" x="815" y="545" text-anchor="middle"><tspan text-anchor="middle" x="815" dy="0">نظام میں موافقت</tspan><tspan text-anchor="middle" x="815" dy="36">قابل رسائی مواد دیں</tspan></text><line class="edge" x1="345" y1="160" x2="395" y2="370" marker-end="url(#a)"/><rect class="box" x="25" y="95" width="320" height="140" rx="12"/><text class="" x="185" y="135" text-anchor="middle"><tspan text-anchor="middle" x="185" dy="0">تعاون ضروری ہے</tspan><tspan text-anchor="middle" x="185" dy="36">خاندان کے ساتھ منصوبہ</tspan></text><line class="edge" x1="345" y1="365" x2="395" y2="370" marker-end="url(#a)"/><rect class="box" x="25" y="300" width="320" height="140" rx="12"/><text class="" x="185" y="340" text-anchor="middle"><tspan text-anchor="middle" x="185" dy="0">رکاوٹیں دور ہوں</tspan><tspan text-anchor="middle" x="185" dy="36">نشست تک راستہ صاف</tspan></text><line class="edge" x1="345" y1="570" x2="395" y2="370" marker-end="url(#a)"/><rect class="box" x="25" y="505" width="320" height="140" rx="12"/><text class="" x="185" y="545" text-anchor="middle"><tspan text-anchor="middle" x="185" dy="0">ہر بچہ کامیاب ہو سکتا ہے</tspan><tspan text-anchor="middle" x="185" dy="36">توقعات بلند رکھیں</tspan></text><rect class="accent" x="395" y="310" width="210" height="150" rx="12"/><text class="" x="500" y="350" text-anchor="middle"><tspan text-anchor="middle" x="500" dy="0">شمولیتی</tspan><tspan text-anchor="middle" x="500" dy="36">اسکول</tspan></text><text class="wm" x="15" y="775" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
