<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول میں علیحدگی، انضمام اور شمولیت کا تعلیمی ماحول، موافقت کی ذمہ داری، مقصد اور ایک جماعتی مثال کی بنیاد پر موازنہ ہے۔</title><desc id="d">ایک تین ستون جدول جس میں علیحدگی، یکجائی اور شمولیت کا ان معیارات پر موازنہ کیا گیا ہے: ماحول، کون موزاں ہوتا ہے، ہدف، اور ایک جماعتی مثال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.edge{fill:none;stroke:var(--ink);stroke-width:2.5}.head{fill:var(--ink)}text{fill:var(--ink);font-size:23px}.h{font-weight:700}.wm{fill:var(--wm);font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1080" height="690"/><text class="h" x="540" y="45" text-anchor="middle"><tspan text-anchor="middle" x="540" dy="0">تین رویوں کا موازنہ</tspan></text><rect class="accent" x="800" y="85" width="260" height="85"/><text class="h" x="930" y="135" text-anchor="middle"><tspan text-anchor="middle" x="930" dy="0">پہلو</tspan></text><rect class="accent" x="540" y="85" width="260" height="85"/><text class="h" x="670" y="135" text-anchor="middle"><tspan text-anchor="middle" x="670" dy="0">علیحدگی</tspan></text><rect class="accent" x="280" y="85" width="260" height="85"/><text class="h" x="410" y="135" text-anchor="middle"><tspan text-anchor="middle" x="410" dy="0">انضمام</tspan></text><rect class="accent" x="20" y="85" width="260" height="85"/><text class="h" x="150" y="135" 