<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A diagram showing a cycle of exclusion and how breaking any one link enables inclusion.</title><desc id="d">A diagram showing a cycle of exclusion and how breaking any one link enables inclusion.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.edge{fill:none;stroke:var(--ink);stroke-width:2.5}.head{fill:var(--ink)}text{fill:var(--ink);font-size:23px}.h{font-weight:700}.wm{fill:var(--wm);font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="650"/><text class="h" x="480" y="45" text-anchor="middle"><tspan text-anchor="middle" x="480" dy="0">Break the cycle of exclusion</tspan></text><rect class="box" x="50" y="100" width="360" height="155" rx="12"/><text class="" x="230.0" y="140" text-anchor="middle"><tspan text-anchor="middle" x="230.0" dy="0">Barrier</tspan><tspan text-anchor="middle" x="230.0" dy="36">Physical, attitudinal</tspan><tspan text-anchor="middle" x="230.0" dy="36">or instructional</tspan></text><rect class="box" x="550" y="100" width="360" height="155" rx="12"/><text class="" x="730.0" y="140" text-anchor="middle"><tspan text-anchor="middle" x="730.0" dy="0">Participation blocked</tspan><tspan text-anchor="middle" x="730.0" dy="36">The pupil cannot join</tspan></text><rect class="box" x="300" y="365" width="360" height="130" rx="12"/><text class="" x="480.0" y="405" text-anchor="middle"><tspan text-anchor="middle" x="480.0" dy="0">Exclusion persists</tspan><tspan text-anchor="middle" x="480.0" dy="36">The barrier remains</tspan></text><line class="edge" x1="410" y1="175" x2="550" y2="175" marker-end="url(#a)"/><line class="edge" x1="730" y1="255" x2="600" y2="365" marker-end="url(#a)"/><line class="edge" x1="360" y1="365" x2="215" y2="255" marker-end="url(#a)"/><rect class="accent" x="45" y="525" width="870" height="75" rx="12"/><text class="" x="480.0" y="565" text-anchor="middle"><tspan text-anchor="middle" x="480.0" dy="0">Remove a barrier, enable participation, interrupt the cycle</tspan></text><text class="wm" x="945" y="635" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
