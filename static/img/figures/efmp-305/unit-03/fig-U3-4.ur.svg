s="" x="1035" y="815" text-anchor="middle">مقابل مثال: موضوعات کم</text><text class="" x="1035" y="849" text-anchor="middle">کرنا</text><rect class="box" x="600" y="779" width="290" height="104" rx="0"/><text class="" x="745" y="815" text-anchor="middle">جانچے جانے والے مواد</text><text class="" x="745" y="849" text-anchor="middle">میں کمی</text><rect class="box" x="310" y="779" width="290" height="104" rx="0"/><text class="" x="455" y="815" text-anchor="middle">مطلوبہ معیار</text><rect class="box" x="20" y="779" width="290" height="104" rx="0"/><text class="" x="165" y="815" text-anchor="middle">ترمیم (Modification)</text><text class="muted" x="600" y="933" text-anchor="middle">دیکھیں کہ سہولت وہی مہارت فراہم تو نہیں کر رہی جسے سوال جانچتا ہے۔</text><text class="wm" x="15" y="1027" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
