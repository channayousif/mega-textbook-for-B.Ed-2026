<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1042" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ جماعتی رکاوٹوں کو ایک مخصوص تشخیصی سہولت کاری سے مmatched کرتی جدول: اضافی وقت، بڑا کاغذ، سوال زبانی پڑھنا، دو نشستیں، اہم اصطلاحیں دو لسانی وضاحت، مانوس ماحول، آخری ستون تصدیق کرتا ہے کہ ہر ایک معیار کو برقرار رکھتا ہے، اور ایک تقابلی قطار ترمیم دکھاتی ہے۔</title><desc id="d">چھ جماعتی رکاوٹوں کو ایک مخصوص تشخیصی سہولت کاری سے مmatched کرتی جدول: اضافی وقت، بڑا کاغذ، سوال زبانی پڑھنا، دو نشستیں، اہم اصطلاحیں دو لسانی وضاحت، مانوس ماحول، آخری ستون تصدیق کرتا ہے کہ ہر ایک معیار کو برقرار رکھتا ہے، اور ایک تقابلی قطار ترمیم دکھاتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1042" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">رسائی بدلیں، معیار برقرار رکھیں</text><rect class="accent" x="890" y="115" width="290" height="74" rx="0"/><text class="h" x="1035" y="153" text-anchor="middle">رکاوٹ</text><rect class="accent" x="600" y="115" width="290" height="74" rx="0"/><text class="h" x="745" y="153" text-anchor="middle">آزمانے کی سہولت</text><rect class="accent" x="310" y="115" width="290" height="74" rx="0"/><text class="h" x="455" y="153" text-anchor="middle">کیا بدلتا ہے</text><rect class="accent" x="20" y="115" width="290" height="74" rx="0"/><text class="h" x="165" y="153" text-anchor="middle">قسم</text><rect class="box" x="890" y="189" width="290" height="104" rx="0"/><text class="" x="1035" y="225" text-anchor="middle">آہستہ لکھنا</text><rect class="box" x="600" y="189" width="290" height="104" rx="0"/><text class="" x="745" y="225" text-anchor="middle">اضافی وقت</text><rect class="box" x="310" y="189" width="290" height="104" rx="0"/><text class="" x="455" y="225" text-anchor="middle">وقت</text><rect class="box" x="20" y="189" width="290" height="104" rx="0"/><text class="" x="165" y="225" text-anchor="middle">سہولت کاری</text><text class="" x="165" y="259" text-anchor="middle">(Accommodation)</text><rect class="box" x="890" y="293" width="290" height="70" rx="0"/><text class="" x="1035" y="329" text-anchor="middle">کم بصارت</text><rect class="box" x="600" y="293" width="290" height="70" rx="0"/><text class="" x="745" y="329" text-anchor="middle">بڑے حروف والا پرچہ</text><rect class="box" x="310" y="293" width="290" height="70" rx="0"/><text class="" x="455" y="329" text-anchor="middle">چھپائی کا حجم</text><rect class="box" x="20" y="293" width="290" height="70" rx="0"/><text class="" x="165" y="329" text-anchor="middle">سہولت کاری</text><rect class="box" x="890" y="363" width="290" height="104" rx="0"/><text class="" x="1035" y="399" text-anchor="middle">سوال پڑھ نہیں سکتا،</text><text class="" x="1035" y="433" text-anchor="middle">مضمون سمجھتا ہے</text><rect class="box" x="600" y="363" width="290" height="104" rx="0"/><text class="" x="745" y="399" text-anchor="middle">سوال پڑھ کر سنانا</text><rect class="box" x="310" y="363" width="290" height="104" rx="0"/><text class="" x="455" y="399" text-anchor="middle">سوال تک رسائی</text><rect class="box" x="20" y="363" width="290" height="104" rx="0"/><text class="" x="165" y="399" text-anchor="middle">سہولت کاری</text><rect class="box" x="890"