<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1380" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A flowchart of six ordered lesson-planning decisions - objective, barriers, content and process, cooperative structure, evidence and criteria, then a final check that the objective is identical for every pupil - with a loop back from the check to the route-choosing step if the objective has moved.</title><desc id="d">A flowchart of six ordered lesson-planning decisions - objective, barriers, content and process, cooperative structure, evidence and criteria, then a final check that the objective is identical for every pupil - with a loop back from the check to the route-choosing step if the objective has moved.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="820" height="1380" fill="var(--bg)"/><path class="line" d="M110 1102.5 H65 V507.5 H110" marker-end="url(#a)" stroke-dasharray="8 6"/><text class="h" x="410" y="60" text-anchor="middle">Plan an inclusive lesson</text><rect class="accent" x="110" y="110" width="600" height="115" rx="12"/><text class="h" x="410.0" y="149" text-anchor="middle">1. Objective</text><text class="" x="410.0" y="183" text-anchor="middle">What must every pupil be able to do?</text><line class="line" x1="410" y1="225" x2="410" y2="275" marker-end="url(#a)"/><rect class="box" x="110" y="280" width="600" height="115" rx="12"/><text class="h" x="410.0" y="319" text-anchor="middle">2. Barriers</text><text class="" x="410.0" y="353" text-anchor="middle">Name the pupils and what is in their way.</text><line class="line" x1="410" y1="395" x2="410" y2="445" marker-end="url(#a)"/><rect class="box" x="110" y="450" width="600" height="115" rx="12"/><text class="h" x="410.0" y="489" text-anchor="middle">3. Content and process</text><text class="" x="410.0" y="523" text-anchor="middle">Choose routes in and ways of working.</text><line class="line" x1="410" y1="565" x2="410" y2="615" marker-end="url(#a)"/><rect class="box" x="110" y="620" width="600" height="149" rx="12"/><text class="h" x="410.0" y="659" text-anchor="middle">4. Cooperative structure</text><text class="" x="410.0" y="693" text-anchor="middle">Choose the structure carrying the main</text><text class="" x="410.0" y="727" text-anchor="middle">activity.</text><line class="line" x1="410" y1="769" x2="410" y2="819" marker-end="url(#a)"/><rect class="box" x="110" y="824" width="600" height="149" rx="12"/><text class="h" x="410.0" y="863" text-anchor="middle">5. Evidence and criteria</text><text class="" x="410.0" y="897" text-anchor="middle">What will each pupil produce, and how is it</text><text class="" x="410.0" y="931" text-anchor="middle">judged?</text><line class="line" x1="410" y1="973" x2="410" y2="1023" marker-end="url(#a)"/><rect class="box" x="110" y="1028" width="600" height="149" rx="12"/><text class="h" x="410.0" y="1067" text-anchor="middle">6. Final check</text><text class="" x="410.0" y="1101" text-anchor="middle">Is the objective still identical for every</text><text class="" x="410.0" y="1135" text-anchor="middle">pupil?</text><text class="muted" x="410" y="1267" text-anchor="middle">If the objective moved, return to step 3: change the</text><text class="muted" x="410" y="1301" text-anchor="middle">route, not the destination.</text><text class="wm" x="805" y="1365" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
