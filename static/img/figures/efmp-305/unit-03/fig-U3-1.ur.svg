<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1301" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بہاؤ کا خاکہ مشترک مقصد سے شروع ہوتا ہے، رکاوٹ پہچان کر مواد، عمل یا حاصلِ کار میں تنوع کا راستہ چنتا ہے، اور سب راستوں کو اسی مقصد اور معیار پر ملاتا ہے۔</title><desc id="d">بہاؤ کا خاکہ مشترک مقصد سے شروع ہوتا ہے، رکاوٹ پہچان کر مواد، عمل یا حاصلِ کار میں تنوع کا راستہ چنتا ہے، اور سب راستوں کو اسی مقصد اور معیار پر ملاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1100" height="1301" fill="var(--bg)"/><text class="h" x="550" y="60" text-anchor="middle">مقصد اور معیار ایک، راستے مختلف</text><rect class="accent" x="300" y="110" width="500" height="115" rx="12"/><text class="h" x="550" y="149" text-anchor="middle">مشترک مقصد لکھیں</text><text class="" x="550" y="183" text-anchor="middle">ہر بچہ کیا کرنے کے قابل ہو؟</text><line class="line" x1="550" y1="225" x2="550" y2="280" marker-end="url(#a)"/><polygon class="accent" points="550,280 250,375 550,470 850,375"/><text class="h" x="550" y="365" text-anchor="middle">کون موجودہ سبق سے مقصد تک نہیں پہنچے</text><text class="h" x="550" y="399" text-anchor="middle">گا؟</text><line class="line" x1="550" y1="470" x2="550" y2="525" marker-end="url(#a)"/><polygon class="accent" points="550,525 250,620 550,715 850,620"/><text class="h" x="550" y="610" text-anchor="middle">رکاوٹ کیا ہے؟</text><path class="line" d="M550 715 V740 H910 V770" marker-end="url(#a)"/><rect class="box" x="750" y="770" width="320" height="149" rx="12"/><text class="h" x="910" y="809" text-anchor="middle">مواد تک رسائی نہیں</text><text class="" x="910" y="843" text-anchor="middle">مواد (Content) میں تنوع</text><text class="" x="910" y="877" text-anchor="middle">رسائی بدلیں، منزل نہیں۔</text><path class="line" d="M550 715 V740 H550 V770" marker-end="url(#a)"/><rect class="box" x="390" y="770" width="320" height="183" rx="12"/><text class="h" x="550" y="809" text-anchor="middle">مطلوبہ طریقے سے کام</text><text class="h" x="550" y="843" text-anchor="middle">نہیں کر سکتا</text><text class="" x="550" y="877" text-anchor="middle">عمل (Process) میں تنوع</text><text class="" x="550" y="911" text-anchor="middle">سرگرمی بدلیں، مقصد نہیں۔</text><path class="line" d="M550 715 V740 H190 V770" marker-end="url(#a)"/><rect class="box" x="30" y="770" width="320" height="251" rx="12"/><text class="h" x="190" y="809" text-anchor="middle">مطلوبہ انداز میں اظہار</text><text class="h" x="190" y="843" text-anchor="middle">نہیں کر سکتا</text><text class="" x="190" y="877" text-anchor="middle">حاصلِ کار (Product) میں</text><text class="" x="190" y="911" text-anchor="middle">تنوع</text><text class="" x="190" y="945" text-anchor="middle">ثبوت کا انداز بدلیں،</text><text class="" x="190" y="979" text-anchor="middle">معیار نہیں۔</text><path class="line" d="M910 919 V1086 H550 V1121" marker-end="url(#a)"/><path class="line" d="M550 953 V1086 H550 V1121" marker-end="url(#a)"/><path class="line" d="M190 1021 V1086 H550 V1121" marker-end="url(#a)"/><rect class="accent" x="300" y="1121" width="500" height="115" rx="12"/><text class="h" x="550" y="1160" text-anchor="middle">مشترک منزل</text><text class="" x="550" y="1194" text-anchor="middle">مقصد ایک، معیار ایک، راستہ مختلف۔</text><text class="wm" x="15" y="1286" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
