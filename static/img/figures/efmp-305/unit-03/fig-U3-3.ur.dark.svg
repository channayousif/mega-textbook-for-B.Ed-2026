<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 831" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشے میں اشتراکی تعلم کی پانچ شرائط اور چار عملی طریقے دکھائے گئے ہیں؛ ہر طریقہ اس جماعتی رکاوٹ سے جڑا ہے جسے وہ کم کرتا ہے۔</title><desc id="d">تصوری نقشے میں اشتراکی تعلم کی پانچ شرائط اور چار عملی طریقے دکھائے گئے ہیں؛ ہر طریقہ اس جماعتی رکاوٹ سے جڑا ہے جسے وہ کم کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="831" fill="var(--bg)"/><path class="line" d="M500 181 V231 H245 V261" marker-end="url(#a)"/><path class="line" d="M500 181 V231 H755 V261" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">اشتراکی تعلم (Cooperative learning)</text><rect class="accent" x="300" y="100" width="400" height="81" rx="12"/><text class="h" x="500" y="139" text-anchor="middle">اشتراکی تعلم</text><rect class="box" x="550" y="261" width="410" height="251" rx="12"/><text class="h" x="755" y="300" text-anchor="middle">پانچ شرائط</text><text class="" x="755" y="334" text-anchor="middle">مثبت باہمی انحصار۔</text><text class="" x="755" y="368" text-anchor="middle">انفرادی جواب دہی۔</text><text class="" x="755" y="402" text-anchor="middle">روبرو تبادلہ۔</text><text class="" x="755" y="436" text-anchor="middle">سماجی مہارتوں کی تدریس۔</text><text class="" x="755" y="470" text-anchor="middle">گروہی کام کا جائزہ۔</text><rect class="box" x="40" y="261" width="410" height="455" rx="12"/><text class="h" x="245" y="300" text-anchor="middle">چار طریقے اور ان کا مقصد</text><text class="" x="245" y="334" text-anchor="middle">سوچیں، جوڑا بنائیں، بتائیں →</text><text class="" x="245" y="368" text-anchor="middle">پچاس بچوں کے سامنے جھجھک: پہلے</text><text class="" x="245" y="402" text-anchor="middle">ساتھی سے بات۔</text><text class="" x="245" y="436" text-anchor="middle">جگ سا → گروہ میں حصہ نہ لینے</text><text class="" x="245" y="470" text-anchor="middle">والا بچہ: ہر ایک کے پاس ضروری</text><text class="" x="245" y="504" text-anchor="middle">حصہ۔</text><text class="" x="245" y="538" text-anchor="middle">نمبر والے سر ملائیں → جسے کبھی</text><text class="" x="245" y="572" text-anchor="middle">نہیں بلاتے: کسی بھی نمبر سے</text><text class="" x="245" y="606" text-anchor="middle">جواب۔</text><text class="" x="245" y="640" text-anchor="middle">جوڑوں میں جانچ → فوری رائے کی</text><text class="" x="245" y="674" text-anchor="middle">ضرورت: ساتھی کام دیکھے۔</text><text class="wm" x="15" y="816" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
