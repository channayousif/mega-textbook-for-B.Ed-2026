<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1278" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">شمولیتی سبق کی منصوبہ بندی کے چھ فیصلوں کا فلوچارٹ: ہدف، رکاوٹیں، مواد اور عمل، اشتراکی ساخت، شہادت اور معیار، پھر آخری جانچ کہ ہدف ہر شاگرد کے لیے ایک جیسا ہے، اگر ہدف پھر جائے تو جانچ سے راستے کے انتخاب کی طرف واپسی کا ہمراہ۔</title><desc id="d">شمولیتی سبق کی منصوبہ بندی کے چھ فیصلوں کا فلوچارٹ: ہدف، رکاوٹیں، مواد اور عمل، اشتراکی ساخت، شہادت اور معیار، پھر آخری جانچ کہ ہدف ہر شاگرد کے لیے ایک جیسا ہے، اگر ہدف پھر جائے تو جانچ سے راستے کے انتخاب کی طرف واپسی کا ہمراہ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="820" height="1278" fill="var(--bg)"/><path class="line" d="M710 1017.5 H755 V507.5 H710" marker-end="url(#a)" stroke-dasharray="8 6"/><text class="h" x="410" y="60" text-anchor="middle">شمولیتی سبق کی منصوبہ بندی</text><rect class="accent" x="110" y="110" width="600" height="115" rx="12"/><text class="h" x="410" y="149" text-anchor="middle">1۔ مقصد</text><text class="" x="410" y="183" text-anchor="middle">ہر بچہ کیا کرنے کے قابل ہو؟</text><line class="line" x1="410" y1="225" x2="410" y2="275" marker-end="url(#a)"/><rect class="box" x="110" y="280" width="600" height="115" rx="12"/><text class="h" x="410" y="319" text-anchor="middle">2۔ رکاوٹیں</text><text class="" x="410" y="353" text-anchor="middle">بچوں اور ان کی رکاوٹوں کا نام لیں۔</text><line class="line" x1="410" y1="395" x2="410" y2="445" marker-end="url(#a)"/><rect class="box" x="110" y="450" width="600" height="115" rx="12"/><text class="h" x="410" y="489" text-anchor="middle">3۔ مواد اور عمل</text><text class="" x="410" y="523" text-anchor="middle">رسائی اور کام کے طریقے چنیں۔</text><line class="line" x1="410" y1="565" x2="410" y2="615" marker-end="url(#a)"/><rect class="box" x="110" y="620" width="600" height="115" rx="12"/><text class="h" x="410" y="659" text-anchor="middle">4۔ اشتراکی طریقہ</text><text class="" x="410" y="693" text-anchor="middle">مرکزی سرگرمی کا منظم طریقہ چنیں۔</text><line class="line" x1="410" y1="735" x2="410" y2="785" marker-end="url(#a)"/><rect class="box" x="110" y="790" width="600" height="115" rx="12"/><text class="h" x="410" y="829" text-anchor="middle">5۔ ثبوت اور معیار</text><text class="" x="410" y="863" text-anchor="middle">ہر بچہ کیا پیش کرے گا، اور اسے کیسے جانچیں گے؟</text><line class="line" x1="410" y1="905" x2="410" y2="955" marker-end="url(#a)"/><rect class="box" x="110" y="960" width="600" height="115" rx="12"/><text class="h" x="410" y="999" text-anchor="middle">6۔ آخری جانچ</text><text class="" x="410" y="1033" text-anchor="middle">کیا مقصد اب بھی ہر بچے کے لیے ایک ہے؟</text><text class="muted" x="410" y="1165" text-anchor="middle">مقصد بدل گیا ہو تو مرحلہ 3 پر لوٹیں: راستہ بدلیں،</text><text class="muted" x="410" y="1199" text-anchor="middle">منزل نہیں۔</text><text class="wm" x="15" y="1263" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
