<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1004" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A completed one-page lesson plan for a Grade 6 photosynthesis lesson in a class of fifty, with five phases down the side and three columns showing what the teacher does, the differentiation in each phase, and the cooperative structure and evidence, under a banner stating the single objective that is identical for all fifty pupils.</title><desc id="d">A completed one-page lesson plan for a Grade 6 photosynthesis lesson in a class of fifty, with five phases down the side and three columns showing what the teacher does, the differentiation in each phase, and the cooperative structure and evidence, under a banner stating the single objective that is identical for all fifty pupils.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1004" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">Grade 6 photosynthesis: fifty pupils</text><rect class="accent" x="20" y="115" width="290" height="108" rx="0"/><text class="h" x="165.0" y="153" text-anchor="middle">Phase</text><rect class="accent" x="310" y="115" width="290" height="108" rx="0"/><text class="h" x="455.0" y="153" text-anchor="middle">Teacher action</text><rect class="accent" x="600" y="115" width="290" height="108" rx="0"/><text class="h" x="745.0" y="153" text-anchor="middle">Differentiation</text><rect class="accent" x="890" y="115" width="290" height="108" rx="0"/><text class="h" x="1035.0" y="153" text-anchor="middle">Cooperation and</text><text class="h" x="1035.0" y="187" text-anchor="middle">evidence</text><rect class="box" x="20" y="223" width="290" height="104" rx="0"/><text class="" x="165.0" y="259" text-anchor="middle">Opening: 5 min</text><rect class="box" x="310" y="223" width="290" height="104" rx="0"/><text class="" x="455.0" y="259" text-anchor="middle">Ask what a leaf needs</text><rect class="box" x="600" y="223" width="290" height="104" rx="0"/><text class="" x="745.0" y="259" text-anchor="middle">Key words spoken and</text><text class="" x="745.0" y="293" text-anchor="middle">written</text><rect class="box" x="890" y="223" width="290" height="104" rx="0"/><text class="" x="1035.0" y="259" text-anchor="middle">All pupils rehearse</text><text class="" x="1035.0" y="293" text-anchor="middle">with a partner</text><rect class="box" x="20" y="327" width="290" height="104" rx="0"/><text class="" x="165.0" y="363" text-anchor="middle">Input: 10 min</text><rect class="box" x="310" y="327" width="290" height="104" rx="0"/><text class="" x="455.0" y="363" text-anchor="middle">Explain using a leaf</text><text class="" x="455.0" y="397" text-anchor="middle">diagram</text><rect class="box" x="600" y="327" width="290" height="104" rx="0"/><text class="" x="745.0" y="363" text-anchor="middle">Diagram with or</text><text class="" x="745.0" y="397" text-anchor="middle">without word bank</text><rect class="box" x="890" y="327" width="290" height="104" rx="0"/><text class="" x="1035.0" y="363" text-anchor="middle">Partners check the key</text><text class="" x="1035.0" y="397" text-anchor="middle">sentence</text><rect class="box" x="20" y="431" width="290" height="104" rx="0"/><text class="" x="165.0" y="467" text-anchor="middle">Main activity: 15 min</text><rect class="box" x="310" y="431" width="290" height="104" rx="0"/><text class="" x="455.0" y="467" text-anchor="middle">Pose three questions</text><rect class="box" x="600" y="431" width="290" height="104" rx="0"/><text class="" x="745.0" y="467" text-anchor="middle">Reading support;</text><text class="" x="745.0" y="501" text-anchor="middle">extension prediction</text><rect class="box" x="890" y="431" width="290" height="104" rx="0"/><text class="" x="1035.0" y="467" text-anchor="middle">Numbered heads</text><text class="" x="1035.0" y="501" text-anchor="middle">together</text><rect class="box" x="20" y="535" width="290" height="138" rx="0"/><text class="" x="165.0" y="571" text-anchor="middle">Evidence: 8 min</text><rect class="box" x="310" y="535" width="290" height="138" rx="0"/><text class="" x="455.0" y="571" text-anchor="middle">Collect an explanation</text><rect class="box" x="600" y="535" width="290" height="138" rx="0"/><text class="" x="745.0" y="571" text-anchor="middle">Accept oral response</text><text class="" x="745.0" y="605" text-anchor="middle">from two named pupils</text><rect class="box" x="890" y="535" width="290" height="138" rx="0"/><text class="" x="1035.0" y="571" text-anchor="middle">Every pupil gives</text><text class="" x="1035.0" y="605" text-anchor="middle">evidence against the</text><text class="" x="1035.0" y="639" text-anchor="middle">same criteria</text><rect class="box" x="20" y="673" width="290" height="138" rx="0"/><text class="" x="165.0" y="709" text-anchor="middle">Close: 2 min</text><rect class="box" x="310" y="673" width="290" height="138" rx="0"/><text class="" x="455.0" y="709" text-anchor="middle">Review the common</text><text class="" x="455.0" y="743" text-anchor="middle">objective</text><rect class="box" x="600" y="673" width="290" height="138" rx="0"/><text class="" x="745.0" y="709" text-anchor="middle">Exit slip with</text><text class="" x="745.0" y="743" text-anchor="middle">accessible response</text><text class="" x="745.0" y="777" text-anchor="middle">route</text><rect class="box" x="890" y="673" width="290" height="138" rx="0"/><text class="" x="1035.0" y="709" text-anchor="middle">Exit slip from all</text><text class="" x="1035.0" y="743" text-anchor="middle">fifty</text><text class="muted" x="600.0" y="861" text-anchor="middle">Objective for all 50: explain that green leaves use sunlight, water and carbon</text><text class="muted" x="600.0" y="895" text-anchor="middle">dioxide to make plant food and release oxygen.</text><text class="wm" x="1185" y="989" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
