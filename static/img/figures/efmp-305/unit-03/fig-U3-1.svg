<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1301" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A flowchart of the differentiation decision path: state the objective, identify which pupils will not reach it, then ask what is in the way, with three branches leading to differentiating content, process or product, all converging on one outcome - same objective and standard reached by a different path.</title><desc id="d">A flowchart of the differentiation decision path: state the objective, identify which pupils will not reach it, then ask what is in the way, with three branches leading to differentiating content, process or product, all converging on one outcome - same objective and standard reached by a different path.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1100" height="1301" fill="var(--bg)"/><text class="h" x="550" y="60" text-anchor="middle">One objective and standard, different paths</text><rect class="accent" x="300" y="110" width="500" height="115" rx="12"/><text class="h" x="550.0" y="149" text-anchor="middle">State the common objective</text><text class="" x="550.0" y="183" text-anchor="middle">What must every pupil be able to do?</text><line class="line" x1="550" y1="225" x2="550" y2="280" marker-end="url(#a)"/><polygon class="accent" points="550,280 850,375 550,470 250,375"/><text class="h" x="550" y="365" text-anchor="middle">Who will not reach it as taught?</text><line class="line" x1="550" y1="470" x2="550" y2="525" marker-end="url(#a)"/><polygon class="accent" points="550,525 850,620 550,715 250,620"/><text class="h" x="550" y="610" text-anchor="middle">What is in their way?</text><path class="line" d="M550 715 V740 H190 V770" marker-end="url(#a)"/><rect class="box" x="30" y="770" width="320" height="183" rx="12"/><text class="h" x="190.0" y="809" text-anchor="middle">Cannot access material</text><text class="" x="190.0" y="843" text-anchor="middle">Differentiate CONTENT</text><text class="" x="190.0" y="877" text-anchor="middle">Change the route in, not</text><text class="" x="190.0" y="911" text-anchor="middle">the destination.</text><path class="line" d="M550 715 V740 H550 V770" marker-end="url(#a)"/><rect class="box" x="390" y="770" width="320" height="183" rx="12"/><text class="h" x="550.0" y="809" text-anchor="middle">Cannot work this way</text><text class="" x="550.0" y="843" text-anchor="middle">Differentiate PROCESS</text><text class="" x="550.0" y="877" text-anchor="middle">Change activity, keep</text><text class="" x="550.0" y="911" text-anchor="middle">objective.</text><path class="line" d="M550 715 V740 H910 V770" marker-end="url(#a)"/><rect class="box" x="750" y="770" width="320" height="217" rx="12"/><text class="h" x="910.0" y="809" text-anchor="middle">Cannot show learning</text><text class="h" x="910.0" y="843" text-anchor="middle">this way</text><text class="" x="910.0" y="877" text-anchor="middle">Differentiate PRODUCT</text><text class="" x="910.0" y="911" text-anchor="middle">Change evidence, keep</text><text class="" x="910.0" y="945" text-anchor="middle">standard.</text><path class="line" d="M190 953 V1052 H550 V1087" marker-end="url(#a)"/><path class="line" d="M550 953 V1052 H550 V1087" marker-end="url(#a)"/><path class="line" d="M910 987 V1052 H550 V1087" marker-end="url(#a)"/><rect class="accent" x="300" y="1087" width="500" height="149" rx="12"/><text class="h" x="550.0" y="1126" text-anchor="middle">All paths converge</text><text class="" x="550.0" y="1160" text-anchor="middle">Same objective, same standard,</text><text class="" x="550.0" y="1194" text-anchor="middle">different path.</text><text class="wm" x="1085" y="1286" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
