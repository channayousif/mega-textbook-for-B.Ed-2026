<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 902" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول میں پچاس بچوں کی چھٹی جماعت کے ضیائی تالیف کے سبق کے پانچ مرحلے، استاد کا کام، متنوع تدریس، اشتراکی طریقہ اور سیکھنے کے ثبوت دکھائے گئے ہیں؛ مقصد سب کے لیے ایک ہے۔</title><desc id="d">جدول میں پچاس بچوں کی چھٹی جماعت کے ضیائی تالیف کے سبق کے پانچ مرحلے، استاد کا کام، متنوع تدریس، اشتراکی طریقہ اور سیکھنے کے ثبوت دکھائے گئے ہیں؛ مقصد سب کے لیے ایک ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="902" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">چھٹی جماعت: ضیائی تالیف، پچاس بچے</text><rect class="accent" x="890" y="115" width="290" height="74" rx="0"/><text class="h" x="1035" y="153" text-anchor="middle">مرحلہ</text><rect class="accent" x="600" y="115" width="290" height="74" rx="0"/><text class="h" x="745" y="153" text-anchor="middle">استاد کا کام</text><rect class="accent" x="310" y="115" width="290" height="74" rx="0"/><text class="h" x="455" y="153" text-anchor="middle">تدریس میں تنوع</text><rect class="accent" x="20" y="115" width="290" height="74" rx="0"/><text class="h" x="165" y="153" text-anchor="middle">اشتراک اور ثبوت</text><rect class="box" x="890" y="189" width="290" height="104" rx="0"/><text class="" x="1035" y="225" text-anchor="middle">آغاز: 5 منٹ</text><rect class="box" x="600" y="189" width="290" height="104" rx="0"/><text class="" x="745" y="225" text-anchor="middle">پتے کی ضرورتیں پوچھیں</text><rect class="box" x="310" y="189" width="290" height="104" rx="0"/><text class="" x="455" y="225" text-anchor="middle">اہم الفاظ زبانی اور</text><text class="" x="455" y="259" text-anchor="middle">تحریری</text><rect class="box" x="20" y="189" width="290" height="104" rx="0"/><text class="" x="165" y="225" text-anchor="middle">سب ساتھی سے بات کریں</text><rect class="box" x="890" y="293" width="290" height="104" rx="0"/><text class="" x="1035" y="329" text-anchor="middle">تعارف: 10 منٹ</text><rect class="box" x="600" y="293" width="290" height="104" rx="0"/><text class="" x="745" y="329" text-anchor="middle">پتے کے خاکے سے وضاحت</text><rect class="box" x="310" y="293" width="290" height="104" rx="0"/><text class="" x="455" y="329" text-anchor="middle">الفاظ کی فہرست کے ساتھ</text><text class="" x="455" y="363" text-anchor="middle">یا بغیر خاکہ</text><rect class="box" x="20" y="293" width="290" height="104" rx="0"/><text class="" x="165" y="329" text-anchor="middle">ساتھی اہم جملہ جانچیں</text><rect class="box" x="890" y="397" width="290" height="104" rx="0"/><text class="" x="1035" y="433" text-anchor="middle">مرکزی سرگرمی: 15 منٹ</text><rect class="box" x="600" y="397" width="290" height="104" rx="0"/><text class="" x="745" y="433" text-anchor="middle">تین سوال دیں</text><rect class="box" x="310" y="397" width="290" height="104" rx="0"/><text class="" x="455" y="433" text-anchor="middle">پڑھنے میں مدد؛ آگے کے</text><text class="" x="455" y="467" text-anchor="middle">لیے پیش گوئی</text><rect class="box" x="20" y="397" width="290" height="104" rx="0"/><text class="" x="165" y="433" text-anchor="middle">نمبر والے سر ملائیں</text><rect class="box" x="890" y="501" width="290" height="104" rx="0"/><text class="" x="1035" y="537" text-anchor="middle">ثبوت: 8 منٹ</text><rect class="box" x="600" y="501" width="290" height="104" rx="0"/><text class="" x="745" y="537" text-anchor="middle">وضاحت حاصل کریں</text><rect class="box" x="310" y="501" width="290" height="104" rx="0"/><text class="" x="455" y="537" text-anchor="middle">دو نامزد بچوں کا زبانی</text><text class="" x="455" y="571" text-anchor="middle">جواب قبول</text><rect class="box" x="20" y="501" width="290" height="104" rx="0"/><text class="" x="165" y="537" text-anchor="middle">ہر بچے کا ثبوت، ایک ہی</text><text class="" x="165" y="571" text-anchor="middle">معیار</text><rect class="box" x="890" y="605" width="290" height="104" rx="0"/><text class="" x="1035" y="641" text-anchor="middle">اختتام: 2 منٹ</text><rect class="box" x="600" y="605" width="290" height="104" rx="0"/><text class="" x="745" y="641" text-anchor="middle">مشترک مقصد دہرائیں</text><rect class="box" x="310" y="605" width="290" height="104" rx="0"/><text class="" x="455" y="641" text-anchor="middle">قابل رسائی انداز میں</text><text class="" x="455" y="675" text-anchor="middle">مختصر آخری جواب</text><rect class="box" x="20" y="605" width="290" height="104" rx="0"/><text class="" x="165" y="641" text-anchor="middle">تمام پچاس بچوں کی آخری</text><text class="" x="165" y="675" text-anchor="middle">پرچی</text><text class="muted" x="600" y="759" text-anchor="middle">سب کا مقصد: سبز پتے روشنی، پانی اور کاربن ڈائی آکسائیڈ سے پودے کی غذا بناتے اور</text><text class="muted" x="600" y="793" text-anchor="middle">آکسیجن خارج کرتے ہیں۔</text><text class="wm" x="15" y="887" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
