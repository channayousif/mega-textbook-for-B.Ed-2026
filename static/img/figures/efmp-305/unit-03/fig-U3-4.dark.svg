<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1008" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A table matching six classroom barriers to a concrete assessment accommodation for each - extra time, enlarged paper, question read aloud, two sittings, key terms glossed bilingually, familiar setting - with a final column confirming each keeps the standard intact, and one contrasting row showing a modification.</title><desc id="d">A table matching six classroom barriers to a concrete assessment accommodation for each - extra time, enlarged paper, question read aloud, two sittings, key terms glossed bilingually, familiar setting - with a final column confirming each keeps the standard intact, and one contrasting row showing a modification.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1008" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">Change access, preserve the standard</text><rect class="accent" x="20" y="115" width="290" height="74" rx="0"/><text class="h" x="165.0" y="153" text-anchor="middle">Barrier</text><rect class="accent" x="310" y="115" width="290" height="74" rx="0"/><text class="h" x="455.0" y="153" text-anchor="middle">Accommodation to try</text><rect class="accent" x="600" y="115" width="290" height="74" rx="0"/><text class="h" x="745.0" y="153" text-anchor="middle">What changes</text><rect class="accent" x="890" y="115" width="290" height="74" rx="0"/><text class="h" x="1035.0" y="153" text-anchor="middle">Classification</text><rect class="box" x="20" y="189" width="290" height="70" rx="0"/><text class="" x="165.0" y="225" text-anchor="middle">Slow writing</text><rect class="box" x="310" y="189" width="290" height="70" rx="0"/><text class="" x="455.0" y="225" text-anchor="middle">Extra time</text><rect class="box" x="600" y="189" width="290" height="70" rx="0"/><text class="" x="745.0" y="225" text-anchor="middle">Time</text><rect class="box" x="890" y="189" width="290" height="70" rx="0"/><text class="" x="1035.0" y="225" text-anchor="middle">Accommodation</text><rect class="box" x="20" y="259" width="290" height="70" rx="0"/><text class="" x="165.0" y="295" text-anchor="middle">Low vision</text><rect class="box" x="310" y="259" width="290" height="70" rx="0"/><text class="" x="455.0" y="295" text-anchor="middle">Enlarged paper</text><rect class="box" x="600" y="259" width="290" height="70" rx="0"/><text class="" x="745.0" y="295" text-anchor="middle">Print size</text><rect class="box" x="890" y="259" width="290" height="70" rx="0"/><text class="" x="1035.0" y="295" text-anchor="middle">Accommodation</text><rect class="box" x="20" y="329" width="290" height="104" rx="0"/><text class="" x="165.0" y="365" text-anchor="middle">Cannot read question;</text><text class="" x="165.0" y="399" text-anchor="middle">knows content</text><rect class="box" x="310" y="329" width="290" height="104" rx="0"/><text class="" x="455.0" y="365" text-anchor="middle">Read the question</text><text class="" x="455.0" y="399" text-anchor="middle">aloud</text><rect class="box" x="600" y="329" width="290" height="104" rx="0"/><text class="" x="745.0" y="365" text-anchor="middle">Route into question</text><rect class="box" x="890" y="329" width="290" height="104" rx="0"/><text class="" x="1035.0" y="365" text-anchor="middle">Accommodation</text><rect class="box" x="20" y="433" width="290" height="104" rx="0"/><text class="" x="165.0" y="469" text-anchor="middle">Cannot sustain forty</text><text class="" x="165.0" y="503" text-anchor="middle">minutes</text><rect class="box" x="310" y="433" width="290" height="104" rx="0"/><text class="" x="455.0" y="469" text-anchor="middle">Two sittings</text><rect class="box" x="600" y="433" width="290" height="104" rx="0"/><text class="" x="745.0" y="469" text-anchor="middle">Timing of sittings</text><rect class="box" x="890" y="433" width="290" height="104" rx="0"/><text class="" x="1035.0" y="469" text-anchor="middle">Accommodation</text><rect class="box" x="20" y="537" width="290" height="104" rx="0"/><text class="" x="165.0" y="573" text-anchor="middle">Different home</text><text class="" x="165.0" y="607" text-anchor="middle">language</text><rect class="box" x="310" y="537" width="290" height="104" rx="0"/><text class="" x="455.0" y="573" text-anchor="middle">Bilingual glossary of</text><text class="" x="455.0" y="607" text-anchor="middle">key terms</text><rect class="box" x="600" y="537" width="290" height="104" rx="0"/><text class="" x="745.0" y="573" text-anchor="middle">Access to key</text><text class="" x="745.0" y="607" text-anchor="middle">vocabulary</text><rect class="box" x="890" y="537" width="290" height="104" rx="0"/><text class="" x="1035.0" y="573" text-anchor="middle">Accommodation</text><rect class="box" x="20" y="641" width="290" height="104" rx="0"/><text class="" x="165.0" y="677" text-anchor="middle">Severe test anxiety</text><rect class="box" x="310" y="641" width="290" height="104" rx="0"/><text class="" x="455.0" y="677" text-anchor="middle">Familiar room and</text><text class="" x="455.0" y="711" text-anchor="middle">adult</text><rect class="box" x="600" y="641" width="290" height="104" rx="0"/><text class="" x="745.0" y="677" text-anchor="middle">Setting</text><rect class="box" x="890" y="641" width="290" height="104" rx="0"/><text class="" x="1035.0" y="677" text-anchor="middle">Accommodation</text><rect class="box" x="20" y="745" width="290" height="104" rx="0"/><text class="" x="165.0" y="781" text-anchor="middle">Contrast: fewer topics</text><text class="" x="165.0" y="815" text-anchor="middle">examined</text><rect class="box" x="310" y="745" width="290" height="104" rx="0"/><text class="" x="455.0" y="781" text-anchor="middle">Reduce assessed</text><text class="" x="455.0" y="815" text-anchor="middle">content</text><rect class="box" x="600" y="745" width="290" height="104" rx="0"/><text class="" x="745.0" y="781" text-anchor="middle">The required standard</text><rect class="box" x="890" y="745" width="290" height="104" rx="0"/><text class="" x="1035.0" y="781" text-anchor="middle">Modification</text><text class="muted" x="600.0" y="899" text-anchor="middle">Check that the adaptation does not supply the skill the question assesses.</text><text class="wm" x="1185" y="993" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
