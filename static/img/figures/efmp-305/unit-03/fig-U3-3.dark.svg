<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 899" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A concept-map of cooperative learning with two branches - the five conditions that make it cooperative (positive interdependence, individual accountability, face-to-face interaction, taught social skills, group processing) and four structures (think-pair-share, jigsaw, numbered heads together, pairs-check), each structure linked to the specific inclusion problem it solves.</title><desc id="d">A concept-map of cooperative learning with two branches - the five conditions that make it cooperative (positive interdependence, individual accountability, face-to-face interaction, taught social skills, group processing) and four structures (think-pair-share, jigsaw, numbered heads together, pairs-check), each structure linked to the specific inclusion problem it solves.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="899" fill="var(--bg)"/><path class="line" d="M500 181 V231 H755 V261" marker-end="url(#a)"/><path class="line" d="M500 181 V231 H245 V261" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">Cooperative learning</text><rect class="accent" x="300" y="100" width="400" height="81" rx="12"/><text class="h" x="500.0" y="139" text-anchor="middle">Cooperative learning</text><rect class="box" x="40" y="261" width="410" height="251" rx="12"/><text class="h" x="245.0" y="300" text-anchor="middle">Five conditions</text><text class="" x="245.0" y="334" text-anchor="middle">Positive interdependence.</text><text class="" x="245.0" y="368" text-anchor="middle">Individual accountability.</text><text class="" x="245.0" y="402" text-anchor="middle">Face-to-face interaction.</text><text class="" x="245.0" y="436" text-anchor="middle">Social skills taught.</text><text class="" x="245.0" y="470" text-anchor="middle">Group processing.</text><rect class="box" x="550" y="261" width="410" height="523" rx="12"/><text class="h" x="755.0" y="300" text-anchor="middle">Four structures and their</text><text class="h" x="755.0" y="334" text-anchor="middle">purpose</text><text class="" x="755.0" y="368" text-anchor="middle">Think-pair-share → pupil afraid</text><text class="" x="755.0" y="402" text-anchor="middle">to speak before fifty: rehearse</text><text class="" x="755.0" y="436" text-anchor="middle">with one partner.</text><text class="" x="755.0" y="470" text-anchor="middle">Jigsaw → pupil contributing</text><text class="" x="755.0" y="504" text-anchor="middle">nothing: everyone holds a</text><text class="" x="755.0" y="538" text-anchor="middle">necessary piece.</text><text class="" x="755.0" y="572" text-anchor="middle">Numbered heads together → pupil</text><text class="" x="755.0" y="606" text-anchor="middle">never chosen: any number may</text><text class="" x="755.0" y="640" text-anchor="middle">answer.</text><text class="" x="755.0" y="674" text-anchor="middle">Pairs-check → pupil needing</text><text class="" x="755.0" y="708" text-anchor="middle">immediate feedback: check with</text><text class="" x="755.0" y="742" text-anchor="middle">a partner.</text><text class="wm" x="985" y="884" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
