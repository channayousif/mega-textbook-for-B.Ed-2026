<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 866" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک پھوٹو نتھیس کے ہدف کو چار سیکھنے والوں کے لیے متنوع کرتی جدول: ایک شاگرد جو درجے سے نیچے پڑھتا ہے، ایک شاگرد جو پہلے ہی مواد جانتا ہے، ایک شاگرد جس کی نظر کمزور ہے، اور ایک شاگرد جو تدریسی زبان میں نیا ہے، جدول آخری ستون یہ دکھاتی ہے کہ چاروں کے لیے ہدف ایک جیسا ہے۔</title><desc id="d">ایک پھوٹو نتھیس کے ہدف کو چار سیکھنے والوں کے لیے متنوع کرتی جدول: ایک شاگرد جو درجے سے نیچے پڑھتا ہے، ایک شاگرد جو پہلے ہی مواد جانتا ہے، ایک شاگرد جس کی نظر کمزور ہے، اور ایک شاگرد جو تدریسی زبان میں نیا ہے، جدول آخری ستون یہ دکھاتی ہے کہ چاروں کے لیے ہدف ایک جیسا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="866" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">ضیائی تالیف کا ایک مقصد، چار راستے</text><rect class="accent" x="948" y="115" width="232" height="74" rx="0"/><text class="h" x="1064" y="153" text-anchor="middle">بچہ اور رکاوٹ</text><rect class="accent" x="716" y="115" width="232" height="74" rx="0"/><text class="h" x="832" y="153" text-anchor="middle">مواد تک رسائی</text><rect class="accent" x="484" y="115" width="232" height="74" rx="0"/><text class="h" x="600" y="153" text-anchor="middle">کام کا طریقہ</text><rect class="accent" x="252" y="115" width="232" height="74" rx="0"/><text class="h" x="368" y="153" text-anchor="middle">سیکھنے کا ثبوت</text><rect class="accent" x="20" y="115" width="232" height="74" rx="0"/><text class="h" x="136" y="153" text-anchor="middle">مشترک مقصد</text><rect class="box" x="948" y="189" width="232" height="104" rx="0"/><text class="" x="1064" y="225" text-anchor="middle">ثنا: پڑھنے میں</text><text class="" x="1064" y="259" text-anchor="middle">پیچھے</text><rect class="box" x="716" y="189" width="232" height="104" rx="0"/><text class="" x="832" y="225" text-anchor="middle">خاکہ اور الفاظ کی</text><text class="" x="832" y="259" text-anchor="middle">فہرست</text><rect class="box" x="484" y="189" width="232" height="104" rx="0"/><text class="" x="600" y="225" text-anchor="middle">ساتھی سے رہنمائی</text><text class="" x="600" y="259" text-anchor="middle">والی گفتگو</text><rect class="box" x="252" y="189" width="232" height="104" rx="0"/><text class="" x="368" y="225" text-anchor="middle">زبانی وضاحت</text><rect class="box" x="20" y="189" width="232" height="104" rx="0"/><text class="" x="136" y="225" text-anchor="middle">پتے غذا کیسے</text><text class="" x="136" y="259" text-anchor="middle">بناتے ہیں</text><rect class="box" x="948" y="293" width="232" height="104" rx="0"/><text class="" x="1064" y="329" text-anchor="middle">کائنات: پہلے سے</text><text class="" x="1064" y="363" text-anchor="middle">جانتی ہے</text><rect class="box" x="716" y="293" width="232" height="104" rx="0"/><text class="" x="832" y="329" text-anchor="middle">وہی تصور؛ مزید</text><text class="" x="832" y="363" text-anchor="middle">اطلاق</text><rect class="box" x="484" y="293" width="232" height="104" rx="0"/><text class="" x="600" y="329" text-anchor="middle">روشنی بدلنے کا</text><text class="" x="600" y="363" text-anchor="middle">اثر بتائے</text><rect class="box" x="252" y="293" width="232" height="104" rx="0"/><text class="" x="368" y="329" text-anchor="middle">پیش گوئی کی دلیل</text><text class="" x="368" y="363" text-anchor="middle">دے</text><rect class="box" x="20" y="293" width="232" height="104" rx="0"/><text class="" x="136" y="329" text-anchor="middle">پتے غذا کیسے</text><text class="" x="136" y="363" text-anchor="middle">بناتے ہیں</text><rect class="box" x="948" y="397" width="232" height="138" rx="0"/><text class="" x="1064" y="433" text-anchor="middle">کم بصارت والا بچہ</text><rect class="box" x="716" y="397" width="232" height="138" rx="0"/><text class="" x="832" y="433" text-anchor="middle">بڑا، واضح خاکہ</text><rect class="box" x="484" y="397" width="232" height="138" rx="0"/><text class="" x="600" y="433" text-anchor="middle">قریب سے دیکھنا؛</text><text class="" x="600" y="467" text-anchor="middle">زبانی یا لمسی</text><text class="" x="600" y="501" text-anchor="middle">اشارے</text><rect class="box" x="252" y="397" width="232" height="138" rx="0"/><text class="" x="368" y="433" text-anchor="middle">زبانی وضاحت</text><rect class="box" x="20" y="397" width="232" height="138" rx="0"/><text class="" x="136" y="433" text-anchor="middle">پتے غذا کیسے</text><text class="" x="136" y="467" text-anchor="middle">بناتے ہیں</text><rect class="box" x="948" y="535" width="232" height="138" rx="0"/><text class="" x="1064" y="571" text-anchor="middle">سندھی بولنے والا،</text><text class="" x="1064" y="605" text-anchor="middle">اردو میں نیا</text><rect class="box" x="716" y="535" width="232" height="138" rx="0"/><text class="" x="832" y="571" text-anchor="middle">دو زبانوں میں</text><text class="" x="832" y="605" text-anchor="middle">اصطلاحیں اور خاکہ</text><rect class="box" x="484" y="535" width="232" height="138" rx="0"/><text class="" x="600" y="571" text-anchor="middle">پہلے سندھی میں</text><text class="" x="600" y="605" text-anchor="middle">بات، پھر اردو سے</text><text class="" x="600" y="639" text-anchor="middle">ربط</text><rect class="box" x="252" y="535" width="232" height="138" rx="0"/><text class="" x="368" y="571" text-anchor="middle">مانوس الفاظ اور</text><text class="" x="368" y="605" text-anchor="middle">خاکے سے وضاحت</text><rect class="box" x="20" y="535" width="232" height="138" rx="0"/><text class="" x="136" y="571" text-anchor="middle">پتے غذا کیسے</text><text class="" x="136" y="605" text-anchor="middle">بناتے ہیں</text><text class="muted" x="600" y="723" text-anchor="middle">سائنسی بات ایک: روشنی، پانی اور کاربن ڈائی آکسائیڈ سے پودے کی غذا بنتی اور</text><text class="muted" x="600" y="757" text-anchor="middle">آکسیجن خارج ہوتی ہے۔</text><text class="wm" x="15" y="851" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
