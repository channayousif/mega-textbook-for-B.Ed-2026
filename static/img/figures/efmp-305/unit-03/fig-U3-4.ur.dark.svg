<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1042" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول چھ رکاوٹوں کے لیے امتحانی سہولت کاری دکھاتا ہے جو معیار برقرار رکھتی ہے، اور اس کے مقابل موضوعات کم کرنے کو معیار میں ترمیم بتاتا ہے۔</title><desc id="d">جدول چھ رکاوٹوں کے لیے امتحانی سہولت کاری دکھاتا ہے جو معیار برقرار رکھتی ہے، اور اس کے مقابل موضوعات کم کرنے کو معیار میں ترمیم بتاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1042" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">رسائی بدلیں، معیار برقرار رکھیں</text><rect class="accent" x="890" y="115" width="290" height="74" rx="0"/><text class="h" x="1035" y="153" text-anchor="middle">رکاوٹ</text><rect class="accent" x="600" y="115" width="290" height="74" rx="0"/><text class="h" x="745" y="153" text-anchor="middle">آزمانے کی سہولت</text><rect class="accent" x="310" y="115" width="290" height="74" rx="0"/><text class="h" x="455" y="153" text-anchor="middle">کیا بدلتا ہے</text><rect class="accent" x="20" y="115" width="290" height="74" rx="0"/><text class="h" x="165" y="153" text-anchor="middle">قسم</text><rect class="box" x="890" y="189" width="290" height="104" rx="0"/><text class="" x="1035" y="225" text-anchor="middle">آہستہ لکھنا</text><rect class="box" x="600" y="189" width="290" height="104" rx="0"/><text class="" x="745" y="225" text-anchor="middle">اضافی وقت</text><rect class="box" x="310" y="189" width="290" height="104" rx="0"/><text class="" x="455" y="225" text-anchor="middle">وقت</text><rect class="box" x="20" y="189" width="290" height="104" rx="0"/><text class="" x="165" y="225" text-anchor="middle">سہولت کاری</text><text class="" x="165" y="259" text-anchor="middle">(Accommodation)</text><rect class="box" x="890" y="293" width="290" height="70" rx="0"/><text class="" x="1035" y="329" text-anchor="middle">کم بصارت</text><rect class="box" x="600" y="293" width="290" height="70" rx="0"/><text class="" x="745" y="329" text-anchor="middle">بڑے حروف والا پرچہ</text><rect class="box" x="310" y="293" width="290" height="70" rx="0"/><text class="" x="455" y="329" text-anchor="middle">چھپائی کا حجم</text><rect class="box" x="20" y="293" width="290" height="70" rx="0"/><text class="" x="165" y="329" text-anchor="middle">سہولت کاری</text><rect class="box" x="890" y="363" width="290" height="104" rx="0"/><text class="" x="1035" y="399" text-anchor="middle">سوال پڑھ نہیں سکتا،</text><text class="" x="1035" y="433" text-anchor="middle">مضمون سمجھتا ہے</text><rect class="box" x="600" y="363" width="290" height="104" rx="0"/><text class="" x="745" y="399" text-anchor="middle">سوال پڑھ کر سنانا</text><rect class="box" x="310" y="363" width="290" height="104" rx="0"/><text class="" x="455" y="399" text-anchor="middle">سوال تک رسائی</text><rect class="box" x="20" y="363" width="290" height="104" rx="0"/><text class="" x="165" y="399" text-anchor="middle">سہولت کاری</text><rect class="box" x="890" y="467" width="290" height="104" rx="0"/><text class="" x="1035" y="503" text-anchor="middle">چالیس منٹ مسلسل کام</text><text class="" x="1035" y="537" text-anchor="middle">مشکل</text><rect class="box" x="600" y="467" width="290" height="104" 