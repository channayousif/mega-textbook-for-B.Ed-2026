<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1278" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بہاؤ کا خاکہ چھ تدریسی فیصلے ترتیب سے دکھاتا ہے: مقصد، رکاوٹیں، مواد اور عمل، اشتراکی طریقہ، ثبوت اور معیار، پھر سب کے لیے یکساں مقصد کی جانچ؛ مقصد بدل جائے تو تیسرے مرحلے پر واپسی ہے۔</title><desc id="d">بہاؤ کا خاکہ چھ تدریسی فیصلے ترتیب سے دکھاتا ہے: مقصد، رکاوٹیں، مواد اور عمل، اشتراکی طریقہ، ثبوت اور معیار، پھر سب کے لیے یکساں مقصد کی جانچ؛ مقصد بدل جائے تو تیسرے مرحلے پر واپسی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="820" height="1278" fill="var(--bg)"/><path class="line" d="M710 1017.5 H755 V507.5 H710" marker-end="url(#a)" stroke-dasharray="8 6"/><text class="h" x="410" y="60" text-anchor="middle">شمولیتی سبق کی منصوبہ بندی</text><rect class="accent" x="110" y="110" width="600" height="115" rx="12"/><text class="h" x="410" y="149" text-anchor="middle">1۔ مقصد</text><text class="" x="410" y="183" text-anchor="middle">ہر بچہ کیا کرنے کے قابل ہو؟</text><line class="line" x1="410" y1="225" x2="410" y2="275" marker-end="url(#a)"/><rect class="box" x="110" y="280" width="600" height="115" rx="12"/><text class="h" x="410" y="319" text-anchor="middle">2۔ رکاوٹیں</text><text class="" x="410" y="353" text-anchor="middle">بچوں اور ان کی رکاوٹوں کا نام لیں۔</text><line class="line" x1="410" y1="395" x2="410" y2="445" marker-end="url(#a)"/><rect class="box" x="110" y="450" width="600" height="115" rx="12"/><text class="h" x="410" y="489" text-anchor="middle">3۔ مواد اور عمل</text><text class="" x="410" y="523" text-anchor="middle">رسائی اور کام کے طریقے چنیں۔</text><line class="line" x1="410" y1="565" x2="410" y2="615" marker-end="url(#a)"/><rect class="box" x="110" y="620" width="600" height="115" rx="12"/><text class="h" x="410" y="659" text-anchor="middle">4۔ اشتراکی طریقہ</text><text class="" x="410" y="693" text-anchor="middle">مرکزی سرگرمی کا منظم طریقہ چنیں۔</text><line class="line" x1="410" y1="735" x2="410" y2="785" marker-end="url(#a)"/><rect class="box" x="110" y="790" width="600" height="115" rx="12"/><text class="h" x="410" y="829" text-anchor="middle">5۔ ثبوت اور معیار</text><text class="" x="410" y="863" text-anchor="middle">ہر بچہ کیا پیش کرے گا، اور اسے کیسے جانچیں گے؟</text><line class="line" x1="410" y1="905" x2="410" y2="955" marker-end="url(#a)"/><rect class="box" x="110" y="960" width="600" height="115" rx="12"/><text class="h" x="410" y="999" text-anchor="middle">6۔ آخری جانچ</text><text class="" x="410" y="1033" text-anchor="middle">کیا مقصد اب بھی ہر بچے کے لیے ایک ہے؟</text><text class="muted" x="410" y="1165" text-anchor="middle">مقصد بدل گیا ہو تو مرحلہ 3 پر لوٹیں: راستہ بدلیں،</text><text class="muted" x="410" y="1199" text-anchor="middle">منزل نہیں۔</text><text class="wm" x="15" y="1263" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
