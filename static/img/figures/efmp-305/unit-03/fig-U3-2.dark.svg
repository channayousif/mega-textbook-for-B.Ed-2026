<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 866" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A table differentiating one photosynthesis objective for four learner profiles - a pupil reading below level, a pupil who already knows the content, a pupil with low vision, and a pupil new to the language of instruction - across content, process and product, with the final column showing the objective stays identical for all four.</title><desc id="d">A table differentiating one photosynthesis objective for four learner profiles - a pupil reading below level, a pupil who already knows the content, a pupil with low vision, and a pupil new to the language of instruction - across content, process and product, with the final column showing the objective stays identical for all four.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="866" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">One photosynthesis objective, four routes</text><rect class="accent" x="20" y="115" width="232" height="74" rx="0"/><text class="h" x="136.0" y="153" text-anchor="middle">Pupil and barrier</text><rect class="accent" x="252" y="115" width="232" height="74" rx="0"/><text class="h" x="368.0" y="153" text-anchor="middle">Content: route in</text><rect class="accent" x="484" y="115" width="232" height="74" rx="0"/><text class="h" x="600.0" y="153" text-anchor="middle">Process: working</text><rect class="accent" x="716" y="115" width="232" height="74" rx="0"/><text class="h" x="832.0" y="153" text-anchor="middle">Product: evidence</text><rect class="accent" x="948" y="115" width="232" height="74" rx="0"/><text class="h" x="1064.0" y="153" text-anchor="middle">Same objective</text><rect class="box" x="20" y="189" width="232" height="104" rx="0"/><text class="" x="136.0" y="225" text-anchor="middle">Sana: reading</text><text class="" x="136.0" y="259" text-anchor="middle">below level</text><rect class="box" x="252" y="189" width="232" height="104" rx="0"/><text class="" x="368.0" y="225" text-anchor="middle">Diagram and word</text><text class="" x="368.0" y="259" text-anchor="middle">bank</text><rect class="box" x="484" y="189" width="232" height="104" rx="0"/><text class="" x="600.0" y="225" text-anchor="middle">Guided partner</text><text class="" x="600.0" y="259" text-anchor="middle">talk</text><rect class="box" x="716" y="189" width="232" height="104" rx="0"/><text class="" x="832.0" y="225" text-anchor="middle">Oral explanation</text><rect class="box" x="948" y="189" width="232" height="104" rx="0"/><text class="" x="1064.0" y="225" text-anchor="middle">Explain how</text><text class="" x="1064.0" y="259" text-anchor="middle">leaves make food</text><rect class="box" x="20" y="293" width="232" height="138" rx="0"/><text class="" x="136.0" y="329" text-anchor="middle">Kainat: already</text><text class="" x="136.0" y="363" text-anchor="middle">knows it</text><rect class="box" x="252" y="293" width="232" height="138" rx="0"/><text class="" x="368.0" y="329" text-anchor="middle">Same concept;</text><text class="" x="368.0" y="363" text-anchor="middle">extension case</text><rect class="box" x="484" y="293" width="232" height="138" rx="0"/><text class="" x="600.0" y="329" text-anchor="middle">Predict a change</text><text class="" x="600.0" y="363" text-anchor="middle">in light</text><rect class="box" x="716" y="293" width="232" height="138" rx="0"/><text class="" x="832.0" y="329" text-anchor="middle">Explain and</text><text class="" x="832.0" y="363" text-anchor="middle">justify</text><text class="" x="832.0" y="397" text-anchor="middle">prediction</text><rect class="box" x="948" y="293" width="232" height="138" rx="0"/><text class="" x="1064.0" y="329" text-anchor="middle">Explain how</text><text class="" x="1064.0" y="363" text-anchor="middle">leaves make food</text><rect class="box" x="20" y="431" width="232" height="138" rx="0"/><text class="" x="136.0" y="467" text-anchor="middle">Pupil with low</text><text class="" x="136.0" y="501" text-anchor="middle">vision</text><rect class="box" x="252" y="431" width="232" height="138" rx="0"/><text class="" x="368.0" y="467" text-anchor="middle">Large, clear</text><text class="" x="368.0" y="501" text-anchor="middle">diagram</text><rect class="box" x="484" y="431" width="232" height="138" rx="0"/><text class="" x="600.0" y="467" text-anchor="middle">Close viewing;</text><text class="" x="600.0" y="501" text-anchor="middle">tactile or verbal</text><text class="" x="600.0" y="535" text-anchor="middle">cues</text><rect class="box" x="716" y="431" width="232" height="138" rx="0"/><text class="" x="832.0" y="467" text-anchor="middle">Oral explanation</text><rect class="box" x="948" y="431" width="232" height="138" rx="0"/><text class="" x="1064.0" y="467" text-anchor="middle">Explain how</text><text class="" x="1064.0" y="501" text-anchor="middle">leaves make food</text><rect class="box" x="20" y="569" width="232" height="138" rx="0"/><text class="" x="136.0" y="605" text-anchor="middle">Sindhi speaker</text><text class="" x="136.0" y="639" text-anchor="middle">new to Urdu</text><rect class="box" x="252" y="569" width="232" height="138" rx="0"/><text class="" x="368.0" y="605" text-anchor="middle">Bilingual key</text><text class="" x="368.0" y="639" text-anchor="middle">terms and diagram</text><rect class="box" x="484" y="569" width="232" height="138" rx="0"/><text class="" x="600.0" y="605" text-anchor="middle">Rehearse in</text><text class="" x="600.0" y="639" text-anchor="middle">Sindhi, then link</text><text class="" x="600.0" y="673" text-anchor="middle">Urdu</text><rect class="box" x="716" y="569" width="232" height="138" rx="0"/><text class="" x="832.0" y="605" text-anchor="middle">Explain with</text><text class="" x="832.0" y="639" text-anchor="middle">diagram and</text><text class="" x="832.0" y="673" text-anchor="middle">familiar words</text><rect class="box" x="948" y="569" width="232" height="138" rx="0"/><text class="" x="1064.0" y="605" text-anchor="middle">Explain how</text><text class="" x="1064.0" y="639" text-anchor="middle">leaves make food</text><text class="muted" x="600.0" y="757" text-anchor="middle">Same science: sunlight + water + carbon dioxide → plant food + oxygen.</text><text class="wm" x="1185" y="851" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
