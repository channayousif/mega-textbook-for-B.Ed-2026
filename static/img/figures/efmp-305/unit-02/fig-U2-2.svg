<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 832" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A table listing common disabilities, their classroom signs and practical implications for teachers in Pakistani schools.</title><desc id="d">A table listing common disabilities, their classroom signs and practical implications for teachers in Pakistani schools.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="832" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">Observe a barrier, choose a response</text><rect class="accent" x="20" y="115" width="386" height="74" rx="0"/><text class="h" x="213.0" y="153" text-anchor="middle">Disability</text><rect class="accent" x="406" y="115" width="386" height="74" rx="0"/><text class="h" x="599.0" y="153" text-anchor="middle">Classroom sign</text><rect class="accent" x="792" y="115" width="388" height="74" rx="0"/><text class="h" x="986.0" y="153" text-anchor="middle">Teacher response</text><rect class="box" x="20" y="189" width="386" height="138" rx="0"/><text class="" x="213.0" y="225" text-anchor="middle">Visual impairment</text><rect class="box" x="406" y="189" width="386" height="138" rx="0"/><text class="" x="599.0" y="225" text-anchor="middle">Cannot read the board or</text><text class="" x="599.0" y="259" text-anchor="middle">small print</text><rect class="box" x="792" y="189" width="388" height="138" rx="0"/><text class="" x="986.0" y="225" text-anchor="middle">Check from the pupil’s seat;</text><text class="" x="986.0" y="259" text-anchor="middle">enlarge print and improve</text><text class="" x="986.0" y="293" text-anchor="middle">seating</text><rect class="box" x="20" y="327" width="386" height="104" rx="0"/><text class="" x="213.0" y="363" text-anchor="middle">Hearing impairment</text><rect class="box" x="406" y="327" width="386" height="104" rx="0"/><text class="" x="599.0" y="363" text-anchor="middle">Misses spoken instructions in</text><text class="" x="599.0" y="397" text-anchor="middle">noise</text><rect class="box" x="792" y="327" width="388" height="104" rx="0"/><text class="" x="986.0" y="363" text-anchor="middle">Face the class; write the key</text><text class="" x="986.0" y="397" text-anchor="middle">instruction; reduce noise</text><rect class="box" x="20" y="431" width="386" height="138" rx="0"/><text class="" x="213.0" y="467" text-anchor="middle">Physical disability</text><rect class="box" x="406" y="431" width="386" height="138" rx="0"/><text class="" x="599.0" y="467" text-anchor="middle">Cannot reach a desk or cross</text><text class="" x="599.0" y="501" text-anchor="middle">a step</text><rect class="box" x="792" y="431" width="388" height="138" rx="0"/><text class="" x="986.0" y="467" text-anchor="middle">Clear the route; use an</text><text class="" x="986.0" y="501" text-anchor="middle">accessible room and suitable</text><text class="" x="986.0" y="535" text-anchor="middle">desk</text><rect class="box" x="20" y="569" width="386" height="104" rx="0"/><text class="" x="213.0" y="605" text-anchor="middle">Intellectual disability</text><rect class="box" x="406" y="569" width="386" height="104" rx="0"/><text class="" x="599.0" y="605" text-anchor="middle">Needs more time, repetition</text><text class="" x="599.0" y="639" text-anchor="middle">and concrete examples</text><rect class="box" x="792" y="569" width="388" height="104" rx="0"/><text class="" x="986.0" y="605" text-anchor="middle">Break the task into steps;</text><text class="" x="986.0" y="639" text-anchor="middle">model, practise and check</text><text class="muted" x="600.0" y="723" text-anchor="middle">Signs guide support, not a medical diagnosis.</text><text class="wm" x="1185" y="817" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
