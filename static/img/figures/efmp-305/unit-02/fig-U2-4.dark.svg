<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 833" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A diagram showing how labelling creates a self-fulfilling cycle and how respect breaks that cycle.</title><desc id="d">A diagram showing how labelling creates a self-fulfilling cycle and how respect breaks that cycle.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1100" height="833" fill="var(--bg)"/><line class="line" x1="480" y1="180" x2="620" y2="180" marker-end="url(#a)"/><line class="line" x1="830" y1="235" x2="830" y2="430" marker-end="url(#a)"/><line class="line" x1="620" y1="500" x2="480" y2="500" marker-end="url(#a)"/><line class="line" x1="270" y1="430" x2="270" y2="235" marker-end="url(#a)"/><text class="h" x="550" y="60" text-anchor="middle">How a label becomes a cycle</text><rect class="box" x="60" y="120" width="420" height="115" rx="12"/><text class="h" x="270.0" y="159" text-anchor="middle">1. Teacher labels the pupil</text><text class="" x="270.0" y="193" text-anchor="middle">“Lazy” or “cannot learn”</text><rect class="box" x="620" y="120" width="420" height="115" rx="12"/><text class="h" x="830.0" y="159" text-anchor="middle">2. Pupil accepts the label</text><text class="" x="830.0" y="193" text-anchor="middle">“There is no point trying”</text><rect class="box" x="620" y="430" width="420" height="183" rx="12"/><text class="h" x="830.0" y="469" text-anchor="middle">3. Behaviour seems to confirm</text><text class="h" x="830.0" y="503" text-anchor="middle">it</text><text class="" x="830.0" y="537" text-anchor="middle">Fewer attempts; less</text><text class="" x="830.0" y="571" text-anchor="middle">participation</text><rect class="box" x="60" y="430" width="420" height="115" rx="12"/><text class="h" x="270.0" y="469" text-anchor="middle">4. Expectations fall</text><text class="" x="270.0" y="503" text-anchor="middle">Fewer questions and chances</text><text class="muted" x="550" y="700" text-anchor="middle">Respect breaks the first link: name the barrier, offer support, and expect</text><text class="muted" x="550" y="734" text-anchor="middle">progress.</text><text class="wm" x="1085" y="818" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
