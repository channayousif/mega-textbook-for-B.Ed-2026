<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1105" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A flowchart showing a four-step decision path for identifying and responding to individual learner needs: observe, assess, adapt, evaluate.</title><desc id="d">A flowchart showing a four-step decision path for identifying and responding to individual learner needs: observe, assess, adapt, evaluate.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="820" height="1105" fill="var(--bg)"/><path class="line" d="M110 745.5 H65 V167.5 H110" marker-end="url(#a)" stroke-dasharray="8 6"/><text class="h" x="410" y="60" text-anchor="middle">Respond to an individual need</text><rect class="accent" x="110" y="110" width="600" height="115" rx="12"/><text class="h" x="410.0" y="149" text-anchor="middle">1. Observe</text><text class="" x="410.0" y="183" text-anchor="middle">When does this pupil join in or get stuck?</text><line class="line" x1="410" y1="225" x2="410" y2="275" marker-end="url(#a)"/><rect class="box" x="110" y="280" width="600" height="149" rx="12"/><text class="h" x="410.0" y="319" text-anchor="middle">2. Assess informally</text><text class="" x="410.0" y="353" text-anchor="middle">What can the pupil already do, and what is in</text><text class="" x="410.0" y="387" text-anchor="middle">the way?</text><line class="line" x1="410" y1="429" x2="410" y2="479" marker-end="url(#a)"/><rect class="box" x="110" y="484" width="600" height="149" rx="12"/><text class="h" x="410.0" y="523" text-anchor="middle">3. Adapt</text><text class="" x="410.0" y="557" text-anchor="middle">Which change to teaching, material or seating</text><text class="" x="410.0" y="591" text-anchor="middle">removes the barrier?</text><line class="line" x1="410" y1="633" x2="410" y2="683" marker-end="url(#a)"/><rect class="box" x="110" y="688" width="600" height="115" rx="12"/><text class="h" x="410.0" y="727" text-anchor="middle">4. Evaluate</text><text class="" x="410.0" y="761" text-anchor="middle">Did participation and learning improve?</text><text class="muted" x="410" y="893" text-anchor="middle">If the support did not help, observe again; do not</text><text class="muted" x="410" y="927" text-anchor="middle">blame the pupil.</text><text class="muted" x="410" y="1011" text-anchor="middle">Keep observations; revise the support when needed.</text><text class="wm" x="805" y="1090" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
