<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 833" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خاکہ دکھاتا ہے کہ استاد کا منفی ٹھپا، بچے کا اسے قبول کرنا، اس کے مطابق رویہ اور کم توقعات ایک چکر بناتے ہیں؛ احترام اور عملی مدد پہلی کڑی توڑ سکتے ہیں۔</title><desc id="d">خاکہ دکھاتا ہے کہ استاد کا منفی ٹھپا، بچے کا اسے قبول کرنا، اس کے مطابق رویہ اور کم توقعات ایک چکر بناتے ہیں؛ احترام اور عملی مدد پہلی کڑی توڑ سکتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1100" height="833" fill="var(--bg)"/><line class="line" x1="620" y1="180" x2="480" y2="180" marker-end="url(#a)"/><line class="line" x1="270" y1="235" x2="270" y2="430" marker-end="url(#a)"/><line class="line" x1="480" y1="500" x2="620" y2="500" marker-end="url(#a)"/><line class="line" x1="830" y1="430" x2="830" y2="235" marker-end="url(#a)"/><text class="h" x="550" y="60" text-anchor="middle">منفی ٹھپا کیسے چکر بناتا ہے</text><rect class="box" x="620" y="120" width="420" height="115" rx="12"/><text class="h" x="830" y="159" text-anchor="middle">1۔ استاد ٹھپا لگاتا ہے</text><text class="" x="830" y="193" text-anchor="middle">“سست” یا “سیکھ نہیں سکتا”</text><rect class="box" x="60" y="120" width="420" height="115" rx="12"/><text class="h" x="270" y="159" text-anchor="middle">2۔ بچہ ٹھپا قبول کرتا ہے</text><text class="" x="270" y="193" text-anchor="middle">“کوشش کا فائدہ نہیں”</text><rect class="box" x="60" y="430" width="420" height="115" rx="12"/><text class="h" x="270" y="469" text-anchor="middle">3۔ رویہ ٹھپے کی تائید لگتا ہے</text><text class="" x="270" y="503" text-anchor="middle">کوشش اور شرکت کم ہو جاتی ہے</text><rect class="box" x="620" y="430" width="420" height="115" rx="12"/><text class="h" x="830" y="469" text-anchor="middle">4۔ توقعات کم ہو جاتی ہیں</text><text class="" x="830" y="503" text-anchor="middle">سوال اور مواقع کم ملتے ہیں</text><text class="muted" x="550" y="700" text-anchor="middle">احترام پہلی کڑی توڑتا ہے: رکاوٹ کا نام لیں، مدد دیں اور پیش رفت کی توقع</text><text class="muted" x="550" y="734" text-anchor="middle">رکھیں۔</text><text class="wm" x="15" y="818" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
