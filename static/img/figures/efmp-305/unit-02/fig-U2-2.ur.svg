<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 764" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول میں بصارت، سماعت، جسمانی اور ذہنی معذوری سے متعلق جماعتی علامات اور پاکستانی اسکول میں استاد کے لیے ایک عملی تدبیر دی گئی ہے۔</title><desc id="d">جدول میں بصارت، سماعت، جسمانی اور ذہنی معذوری سے متعلق جماعتی علامات اور پاکستانی اسکول میں استاد کے لیے ایک عملی تدبیر دی گئی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="764" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">رکاوٹ پہچانیں، عملی تدبیر چنیں</text><rect class="accent" x="794" y="115" width="386" height="74" rx="0"/><text class="h" x="987" y="153" text-anchor="middle">معذوری</text><rect class="accent" x="408" y="115" width="386" height="74" rx="0"/><text class="h" x="601" y="153" text-anchor="middle">جماعت میں نظر آنے والی علامت</text><rect class="accent" x="20" y="115" width="388" height="74" rx="0"/><text class="h" x="214" y="153" text-anchor="middle">استاد کی تدبیر</text><rect class="box" x="794" y="189" width="386" height="104" rx="0"/><text class="" x="987" y="225" text-anchor="middle">بصارت کی معذوری</text><rect class="box" x="408" y="189" width="386" height="104" rx="0"/><text class="" x="601" y="225" text-anchor="middle">تختہ یا باریک چھپائی پڑھنے</text><text class="" x="601" y="259" text-anchor="middle">میں دقت</text><rect class="box" x="20" y="189" width="388" height="104" rx="0"/><text class="" x="214" y="225" text-anchor="middle">بچے کی نشست سے خود دیکھیں؛</text><text class="" x="214" y="259" text-anchor="middle">حروف بڑے کریں، نشست بہتر کریں</text><rect class="box" x="794" y="293" width="386" height="104" rx="0"/><text class="" x="987" y="329" text-anchor="middle">سماعت کی معذوری</text><rect class="box" x="408" y="293" width="386" height="104" rx="0"/><text class="" x="601" y="329" text-anchor="middle">شور میں زبانی ہدایت سمجھ نہیں</text><text class="" x="601" y="363" text-anchor="middle">آتی</text><rect class="box" x="20" y="293" width="388" height="104" rx="0"/><text class="" x="214" y="329" text-anchor="middle">سامنے منہ کر کے بولیں؛ اہم</text><text class="" x="214" y="363" text-anchor="middle">ہدایت لکھیں؛ شور کم کریں</text><rect class="box" x="794" y="397" width="386" height="104" rx="0"/><text class="" x="987" y="433" text-anchor="middle">جسمانی معذوری</text><rect class="box" x="408" y="397" width="386" height="104" rx="0"/><text class="" x="601" y="433" text-anchor="middle">میز تک پہنچنے یا سیڑھی پار</text><text class="" x="601" y="467" text-anchor="middle">کرنے میں مشکل</text><rect class="box" x="20" y="397" width="388" height="104" rx="0"/><text class="" x="214" y="433" text-anchor="middle">راستہ صاف کریں؛ قابل رسائی</text><text class="" x="214" y="467" text-anchor="middle">کمرہ اور مناسب میز دیں</text><rect class="box" x="794" y="501" width="386" height="104" rx="0"/><text class="" x="987" y="537" text-anchor="middle">ذہنی معذوری</text><rect class="box" x="408" y="501" width="386" height="104" rx="0"/><text class="" x="601" y="537" text-anchor="middle">زیادہ وقت، تکرار اور ٹھوس</text><text class="" x="601" y="571" text-anchor="middle">مثال درکار</text><rect class="box" x="20" y="501" width="388" height="104" rx="0"/><text class="" x="214" y="537" text-anchor="middle">کام کے مرحلے بنائیں؛ نمونہ،</text><text class="" x="214" y="571" text-anchor="middle">مشق اور جانچ دیں</text><text class="muted" x="600" y="655" text-anchor="middle">علامت مدد کا راستہ دکھاتی ہے؛ طبی تشخیص نہیں کرتی۔</text><text class="wm" x="15" y="749" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
