<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1212" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A concept-map showing three categories of learner diversity (disability, learning difficulty, social difference) branching into subcategories with a classroom example for each.</title><desc id="d">A concept-map showing three categories of learner diversity (disability, learning difficulty, social difference) branching into subcategories with a classroom example for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="1212" fill="var(--bg)"/><path class="line" d="M500 181 V586 H245 V616" marker-end="url(#a)"/><path class="line" d="M500 181 V231 H755 V261" marker-end="url(#a)"/><path class="line" d="M500 181 V231 H245 V261" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">Learner diversity</text><rect class="accent" x="300" y="100" width="400" height="81" rx="12"/><text class="h" x="500.0" y="139" text-anchor="middle">Three overlapping categories</text><rect class="box" x="40" y="261" width="410" height="285" rx="12"/><text class="h" x="245.0" y="300" text-anchor="middle">Disability</text><text class="" x="245.0" y="334" text-anchor="middle">Sensory: cannot see the board</text><text class="" x="245.0" y="368" text-anchor="middle">or hear instructions.</text><text class="" x="245.0" y="402" text-anchor="middle">Physical: a step blocks a pupil</text><text class="" x="245.0" y="436" text-anchor="middle">using crutches.</text><text class="" x="245.0" y="470" text-anchor="middle">Intellectual: needs repetition</text><text class="" x="245.0" y="504" text-anchor="middle">and concrete examples.</text><rect class="box" x="550" y="261" width="410" height="285" rx="12"/><text class="h" x="755.0" y="300" text-anchor="middle">Learning difficulty</text><text class="" x="755.0" y="334" text-anchor="middle">Reading: struggles to decode a</text><text class="" x="755.0" y="368" text-anchor="middle">word.</text><text class="" x="755.0" y="402" text-anchor="middle">Number: struggles with place</text><text class="" x="755.0" y="436" text-anchor="middle">value.</text><text class="" x="755.0" y="470" text-anchor="middle">Attention: needs a shorter task</text><text class="" x="755.0" y="504" text-anchor="middle">and a check-in.</text><rect class="box" x="40" y="616" width="410" height="353" rx="12"/><text class="h" x="245.0" y="655" text-anchor="middle">Social difference</text><text class="" x="245.0" y="689" text-anchor="middle">Language: Sindhi at home, Urdu</text><text class="" x="245.0" y="723" text-anchor="middle">at school.</text><text class="" x="245.0" y="757" text-anchor="middle">Gender: unequal chances to</text><text class="" x="245.0" y="791" text-anchor="middle">answer.</text><text class="" x="245.0" y="825" text-anchor="middle">Poverty: hunger or no study</text><text class="" x="245.0" y="859" text-anchor="middle">space.</text><text class="" x="245.0" y="893" text-anchor="middle">Ethnicity or caste: excluded</text><text class="" x="245.0" y="927" text-anchor="middle">from groups.</text><text class="muted" x="500" y="1074" text-anchor="middle">Categories can overlap. Observe the barrier; do not diagnose from a</text><text class="muted" x="500" y="1108" text-anchor="middle">classroom sign.</text><text class="wm" x="985" y="1197" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
