<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1246" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشے میں سیکھنے والوں کے تنوع کی تین قسمیں، معذوری، سیکھنے کی دشواری اور سماجی فرق، ان کی ذیلی قسموں اور جماعتی مثالوں کے ساتھ دکھائی گئی ہیں۔</title><desc id="d">تصوری نقشے میں سیکھنے والوں کے تنوع کی تین قسمیں، معذوری، سیکھنے کی دشواری اور سماجی فرق، ان کی ذیلی قسموں اور جماعتی مثالوں کے ساتھ دکھائی گئی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="1246" fill="var(--bg)"/><path class="line" d="M500 215 V620 H755 V650" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H245 V295" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H755 V295" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">سیکھنے والوں میں تنوع</text><rect class="accent" x="300" y="100" width="400" height="115" rx="12"/><text class="h" x="500" y="139" text-anchor="middle">تین قسمیں، جو ایک ساتھ بھی</text><text class="h" x="500" y="173" text-anchor="middle">ہو سکتی ہیں</text><rect class="box" x="550" y="295" width="410" height="285" rx="12"/><text class="h" x="755" y="334" text-anchor="middle">معذوری</text><text class="" x="755" y="368" text-anchor="middle">حواس: تختہ نظر نہیں آتا یا</text><text class="" x="755" y="402" text-anchor="middle">ہدایت سنائی نہیں دیتی۔</text><text class="" x="755" y="436" text-anchor="middle">جسمانی: بیساکھی استعمال کرنے</text><text class="" x="755" y="470" text-anchor="middle">والے بچے کے لیے سیڑھی رکاوٹ ہے۔</text><text class="" x="755" y="504" text-anchor="middle">ذہنی: تکرار اور ٹھوس مثالوں کی</text><text class="" x="755" y="538" text-anchor="middle">ضرورت۔</text><rect class="box" x="40" y="295" width="410" height="285" rx="12"/><text class="h" x="245" y="334" text-anchor="middle">سیکھنے کی دشواری</text><text class="" x="245" y="368" text-anchor="middle">پڑھنا: لفظ کے حروف ملا کر پڑھنے</text><text class="" x="245" y="402" text-anchor="middle">میں دقت۔</text><text class="" x="245" y="436" text-anchor="middle">اعداد: مقامی قیمت سمجھنے میں</text><text class="" x="245" y="470" text-anchor="middle">دقت۔</text><text class="" x="245" y="504" text-anchor="middle">توجہ: مختصر کام اور دوران کام</text><text class="" x="245" y="538" text-anchor="middle">جانچ درکار۔</text><rect class="box" x="550" y="650" width="410" height="353" rx="12"/><text class="h" x="755" y="689" text-anchor="middle">سماجی فرق</text><text class="" x="755" y="723" text-anchor="middle">زبان: گھر میں سندھی، اسکول میں</text><text class="" x="755" y="757" text-anchor="middle">اردو۔</text><text class="" x="755" y="791" text-anchor="middle">صنف: جواب دینے کے غیر مساوی</text><text class="" x="755" y="825" text-anchor="middle">مواقع۔</text><text class="" x="755" y="859" text-anchor="middle">غربت: بھوک یا پڑھنے کی جگہ</text><text class="" x="755" y="893" text-anchor="middle">نہیں۔</text><text class="" x="755" y="927" text-anchor="middle">نسل یا ذات: گروہ سے باہر رکھا</text><text class="" x="755" y="961" text-anchor="middle">جانا۔</text><text class="muted" x="500" y="1108" text-anchor="middle">قسمیں ایک ساتھ بھی ہو سکتی ہیں۔ رکاوٹ دیکھیں؛ جماعتی علامت سے تشخیص</text><text class="muted" x="500" y="1142" text-anchor="middle">نہ کریں۔</text><text class="wm" x="15" y="1231" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
