<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1071" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بہاؤ کا خاکہ چار مرحلے دکھاتا ہے: مشاہدہ، غیر رسمی جانچ، تدریسی موافقت اور نتیجے کی جانچ؛ ہر مرحلے میں استاد کے لیے ایک سوال ہے۔</title><desc id="d">بہاؤ کا خاکہ چار مرحلے دکھاتا ہے: مشاہدہ، غیر رسمی جانچ، تدریسی موافقت اور نتیجے کی جانچ؛ ہر مرحلے میں استاد کے لیے ایک سوال ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="820" height="1071" fill="var(--bg)"/><path class="line" d="M710 711.5 H755 V167.5 H710" marker-end="url(#a)" stroke-dasharray="8 6"/><text class="h" x="410" y="60" text-anchor="middle">انفرادی ضرورت کے مطابق مدد</text><rect class="accent" x="110" y="110" width="600" height="115" rx="12"/><text class="h" x="410" y="149" text-anchor="middle">1۔ مشاہدہ</text><text class="" x="410" y="183" text-anchor="middle">بچہ کب شریک ہوتا ہے اور کہاں رک جاتا ہے؟</text><line class="line" x1="410" y1="225" x2="410" y2="275" marker-end="url(#a)"/><rect class="box" x="110" y="280" width="600" height="115" rx="12"/><text class="h" x="410" y="319" text-anchor="middle">2۔ غیر رسمی جانچ</text><text class="" x="410" y="353" text-anchor="middle">بچہ کیا کر سکتا ہے اور رکاوٹ کیا ہے؟</text><line class="line" x1="410" y1="395" x2="410" y2="445" marker-end="url(#a)"/><rect class="box" x="110" y="450" width="600" height="149" rx="12"/><text class="h" x="410" y="489" text-anchor="middle">3۔ موافقت</text><text class="" x="410" y="523" text-anchor="middle">تدریس، مواد یا نشست میں کون سی تبدیلی رکاوٹ</text><text class="" x="410" y="557" text-anchor="middle">ہٹائے گی؟</text><line class="line" x1="410" y1="599" x2="410" y2="649" marker-end="url(#a)"/><rect class="box" x="110" y="654" width="600" height="115" rx="12"/><text class="h" x="410" y="693" text-anchor="middle">4۔ نتیجے کی جانچ</text><text class="" x="410" y="727" text-anchor="middle">کیا شرکت اور سیکھنے میں بہتری آئی؟</text><text class="muted" x="410" y="859" text-anchor="middle">مدد مؤثر نہ ہو تو دوبارہ مشاہدہ کریں؛ بچے کو الزام</text><text class="muted" x="410" y="893" text-anchor="middle">نہ دیں۔</text><text class="muted" x="410" y="977" text-anchor="middle">مشاہدات لکھیں؛ ضرورت کے مطابق مدد بدلیں۔</text><text class="wm" x="15" y="1056" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
