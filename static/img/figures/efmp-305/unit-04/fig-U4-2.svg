<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1038" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A table matching six common classroom situations to the response they usually get, what each probably means, the first management change to try, and its cost in rupees - with every cost between zero and forty rupees.</title><desc id="d">A table matching six common classroom situations to the response they usually get, what each probably means, the first management change to try, and its cost in rupees - with every cost between zero and forty rupees.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1038" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">Classroom management: change the conditions</text><rect class="accent" x="20" y="115" width="232" height="74" rx="0"/><text class="h" x="136.0" y="153" text-anchor="middle">What happens</text><rect class="accent" x="252" y="115" width="232" height="74" rx="0"/><text class="h" x="368.0" y="153" text-anchor="middle">Usual response</text><rect class="accent" x="484" y="115" width="232" height="74" rx="0"/><text class="h" x="600.0" y="153" text-anchor="middle">Possible meaning</text><rect class="accent" x="716" y="115" width="232" height="74" rx="0"/><text class="h" x="832.0" y="153" text-anchor="middle">Try first</text><rect class="accent" x="948" y="115" width="232" height="74" rx="0"/><text class="h" x="1064.0" y="153" text-anchor="middle">Cost</text><rect class="box" x="20" y="189" width="232" height="138" rx="0"/><text class="" x="136.0" y="225" text-anchor="middle">Leaves seat at</text><text class="" x="136.0" y="259" text-anchor="middle">the same point</text><rect class="box" x="252" y="189" width="232" height="138" rx="0"/><text class="" x="368.0" y="225" text-anchor="middle">Name on board</text><rect class="box" x="484" y="189" width="232" height="138" rx="0"/><text class="" x="600.0" y="225" text-anchor="middle">Stillness or task</text><text class="" x="600.0" y="259" text-anchor="middle">is too hard</text><rect class="box" x="716" y="189" width="232" height="138" rx="0"/><text class="" x="832.0" y="225" text-anchor="middle">Movement job;</text><text class="" x="832.0" y="259" text-anchor="middle">shorter task and</text><text class="" x="832.0" y="293" text-anchor="middle">check</text><rect class="box" x="948" y="189" width="232" height="138" rx="0"/><text class="" x="1064.0" y="225" text-anchor="middle">Rs 0</text><rect class="box" x="20" y="327" width="232" height="104" rx="0"/><text class="" x="136.0" y="363" text-anchor="middle">Only four answer</text><rect class="box" x="252" y="327" width="232" height="104" rx="0"/><text class="" x="368.0" y="363" text-anchor="middle">Praise for four</text><rect class="box" x="484" y="327" width="232" height="104" rx="0"/><text class="" x="600.0" y="363" text-anchor="middle">Participation is</text><text class="" x="600.0" y="397" text-anchor="middle">concentrated</text><rect class="box" x="716" y="327" width="232" height="104" rx="0"/><text class="" x="832.0" y="363" text-anchor="middle">Number calling;</text><text class="" x="832.0" y="397" text-anchor="middle">think-pair-share</text><rect class="box" x="948" y="327" width="232" height="104" rx="0"/><text class="" x="1064.0" y="363" text-anchor="middle">Rs 0–30</text><rect class="box" x="20" y="431" width="232" height="138" rx="0"/><text class="" x="136.0" y="467" text-anchor="middle">Copies neighbour</text><text class="" x="136.0" y="501" text-anchor="middle">neatly</text><rect class="box" x="252" y="431" width="232" height="138" rx="0"/><text class="" x="368.0" y="467" text-anchor="middle">Praise for</text><text class="" x="368.0" y="501" text-anchor="middle">neatness</text><rect class="box" x="484" y="431" width="232" height="138" rx="0"/><text class="" x="600.0" y="467" text-anchor="middle">Cannot see board</text><text class="" x="600.0" y="501" text-anchor="middle">or read print</text><rect class="box" x="716" y="431" width="232" height="138" rx="0"/><text class="" x="832.0" y="467" text-anchor="middle">Move seat; clean</text><text class="" x="832.0" y="501" text-anchor="middle">board; enlarge</text><text class="" x="832.0" y="535" text-anchor="middle">print</text><rect class="box" x="948" y="431" width="232" height="138" rx="0"/><text class="" x="1064.0" y="467" text-anchor="middle">Rs 0</text><rect class="box" x="20" y="569" width="232" height="138" rx="0"/><text class="" x="136.0" y="605" text-anchor="middle">Silent; no</text><text class="" x="136.0" y="639" text-anchor="middle">questions</text><rect class="box" x="252" y="569" width="232" height="138" rx="0"/><text class="" x="368.0" y="605" text-anchor="middle">Head teacher</text><text class="" x="368.0" y="639" text-anchor="middle">praises</text><rect class="box" x="484" y="569" width="232" height="138" rx="0"/><text class="" x="600.0" y="605" text-anchor="middle">Questions feel</text><text class="" x="600.0" y="639" text-anchor="middle">forbidden</text><rect class="box" x="716" y="569" width="232" height="138" rx="0"/><text class="" x="832.0" y="605" text-anchor="middle">Teach “ask when</text><text class="" x="832.0" y="639" text-anchor="middle">unsure” as rule</text><text class="" x="832.0" y="673" text-anchor="middle">two</text><rect class="box" x="948" y="569" width="232" height="138" rx="0"/><text class="" x="1064.0" y="605" text-anchor="middle">Rs 40</text><rect class="box" x="20" y="707" width="232" height="138" rx="0"/><text class="" x="136.0" y="743" text-anchor="middle">Never goes to</text><text class="" x="136.0" y="777" text-anchor="middle">water or toilet</text><rect class="box" x="252" y="707" width="232" height="138" rx="0"/><text class="" x="368.0" y="743" text-anchor="middle">Not noticed</text><rect class="box" x="484" y="707" width="232" height="138" rx="0"/><text class="" x="600.0" y="743" text-anchor="middle">Route from bench</text><text class="" x="600.0" y="777" text-anchor="middle">blocked</text><rect class="box" x="716" y="707" width="232" height="138" rx="0"/><text class="" x="832.0" y="743" text-anchor="middle">Aisle seat; two</text><text class="" x="832.0" y="777" text-anchor="middle">per bench; clear</text><text class="" x="832.0" y="811" text-anchor="middle">route</text><rect class="box" x="948" y="707" width="232" height="138" rx="0"/><text class="" x="1064.0" y="743" text-anchor="middle">Rs 0</text><rect class="box" x="20" y="845" width="232" height="138" rx="0"/><text class="" x="136.0" y="881" text-anchor="middle">Instructions</text><text class="" x="136.0" y="915" text-anchor="middle">repeated five</text><text class="" x="136.0" y="949" text-anchor="middle">times</text><rect class="box" x="252" y="845" width="232" height="138" rx="0"/><text class="" x="368.0" y="881" text-anchor="middle">Raised voice</text><rect class="box" x="484" y="845" width="232" height="138" rx="0"/><text class="" x="600.0" y="881" text-anchor="middle">One instruction</text><text class="" x="600.0" y="915" text-anchor="middle">lost in</text><text class="" x="600.0" y="949" text-anchor="middle">transition noise</text><rect class="box" x="716" y="845" width="232" height="138" rx="0"/><text class="" x="832.0" y="881" text-anchor="middle">Taught signal;</text><text class="" x="832.0" y="915" text-anchor="middle">two pupils repeat</text><text class="" x="832.0" y="949" text-anchor="middle">it</text><rect class="box" x="948" y="845" width="232" height="138" rx="0"/><text class="" x="1064.0" y="881" text-anchor="middle">Rs 0</text><text class="wm" x="1185" y="1023" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
