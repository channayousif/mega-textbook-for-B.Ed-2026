<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1509" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A before-and-after plan of a fixed-bench classroom: the before panel shows a blocked narrow aisle, the teacher&#x27;s table beside the door, sun glare on the blackboard and six pupils seated where their barriers are worst; the after panel keeps the same benches but moves the table to the far wall, marks one wide clear route, seats each of the six pupils where a named barrier is removed, adds a back-corner learning corner, and shows the teacher&#x27;s walking route and the evacuation partners.</title><desc id="d">A before-and-after plan of a fixed-bench classroom: the before panel shows a blocked narrow aisle, the teacher&#x27;s table beside the door, sun glare on the blackboard and six pupils seated where their barriers are worst; the after panel keeps the same benches but moves the table to the far wall, marks one wide clear route, seats each of the six pupils where a named barrier is removed, adds a back-corner learning corner, and shows the teacher&#x27;s walking route and the evacuation partners.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1509" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">Room 4: same benches, changed access</text><text class="h" x="295" y="115" text-anchor="middle">BEFORE</text><rect class="box" x="40" y="145" width="510" height="650" rx="0"/><rect class="accent" x="160" y="160" width="280" height="30" rx="0"/><text class="" x="300" y="215" text-anchor="middle">Board</text><rect class="box" x="115" y="320" width="112" height="45" rx="3"/><rect class="box" x="255" y="320" width="112" height="45" rx="3"/><rect class="box" x="395" y="320" width="112" height="45" rx="3"/><rect class="box" x="115" y="398" width="112" height="45" rx="3"/><rect class="box" x="255" y="398" width="112" height="45" rx="3"/><rect class="box" x="395" y="398" width="112" height="45" rx="3"/><rect class="box" x="115" y="476" width="112" height="45" rx="3"/><rect class="box" x="255" y="476" width="112" height="45" rx="3"/><rect class="box" x="395" y="476" width="112" height="45" rx="3"/><rect class="box" x="115" y="554" width="112" height="45" rx="3"/><rect class="box" x="255" y="554" width="112" height="45" rx="3"/><rect class="box" x="395" y="554" width="112" height="45" rx="3"/><rect class="box" x="115" y="632" width="112" height="45" rx="3"/><rect class="box" x="255" y="632" width="112" height="45" rx="3"/><rect class="box" x="395" y="632" width="112" height="45" rx="3"/><rect class="accent" x="52" y="240" width="135" height="50" rx="0"/><text class="" x="120" y="272" text-anchor="middle">Desk</text><rect class="accent" x="80" y="395" width="30" height="30" rx="0"/><rect class="accent" x="80" y="440" width="30" height="30" rx="0"/><rect class="accent" x="80" y="485" width="30" height="30" rx="0"/><text class="" x="75" y="535" text-anchor="start">40 cm</text><rect class="accent" x="32" y="260" width="16" height="55" rx="0"/><rect class="accent" x="32" y="430" width="16" height="55" rx="0"/><rect class="accent" x="32" y="600" width="16" height="55" rx="0"/><line class="line" x1="40" y1="285" x2="220" y2="175" marker-end="url(#a)"/><text class="h" x="311" y="506" text-anchor="middle">R</text><text class="h" x="171" y="506" text-anchor="middle">S</text><text class="h" x="451" y="506" text-anchor="middle">K ←</text><text class="h" x="171" y="584" text-anchor="middle">H</text><text class="h" x="451" y="662" text-anchor="middle">Z</text><text class="h" x="311" y="662" text-anchor="middle">B</text><text class="" x="78" y="760" text-anchor="start">Door</text><text class="h" x="905" y="115" text-anchor="middle">AFTER</text><rect class="box" x="650" y="145" width="510" height="650" rx="0"/><rect class="accent" x="770" y="160" width="280" height="30" rx="0"/><text class="" x="910" y="215" text-anchor="middle">Clean board</text><rect class="box" x="725" y="320" width="112" height="45" rx="3"/><rect class="box" x="865" y="320" width="112" height="45" rx="3"/><rect class="box" x="1005" y="320" width="112" height="45" rx="3"/><rect class="box" x="725" y="398" width="112" height="45" rx="3"/><rect class="box" x="865" y="398" width="112" height="45" rx="3"/><rect class="box" x="1005" y="398" width="112" height="45" rx="3"/><rect class="box" x="725" y="476" width="112" height="45" rx="3"/><rect class="box" x="865" y="476" width="112" height="45" rx="3"/><rect class="box" x="1005" y="476" width="112" height="45" rx="3"/><rect class="box" x="725" y="554" width="112" height="45" rx="3"/><rect class="box" x="865" y="554" width="112" height="45" rx="3"/><rect class="box" x="1005" y="554" width="112" height="45" rx="3"/><rect class="box" x="725" y="632" width="112" height="45" rx="3"/><rect class="box" x="865" y="632" width="112" height="45" rx="3"/><rect class="box" x="1005" y="632" width="112" height="45" rx="3"/><rect class="accent" x="1030" y="245" width="110" height="45" rx="0"/><text class="" x="1085" y="273" text-anchor="middle">Desk</text><path class="line" d="M685 770 V270 H705" marker-end="url(#a)" stroke-dasharray="8 6"/><path class="line" d="M781 400 H685 V770" marker-end="url(#a)"/><text class="" x="682" y="305" text-anchor="start">75 cm</text><rect class="accent" x="975" y="720" width="165" height="55" rx="0"/><text class="" x="1057" y="752" text-anchor="middle">Learning corner</text><path class="line" d="M780 290 H1120 V382 H720 V459 H1120 V537 H720 V615 H1120" marker-end="url(#a)" stroke-dasharray="8 6"/><text class="h" x="781" y="428" text-anchor="middle">R</text><text class="h" x="921" y="350" text-anchor="middle">S</text><text class="h" x="1061" y="350" text-anchor="middle">K →</text><text class="h" x="781" y="584" text-anchor="middle">H</text><text class="h" x="1061" y="428" text-anchor="middle">Z</text><text class="h" x="921" y="662" text-anchor="middle">B</text><text class="" x="688" y="760" text-anchor="start">Door</text><text class="" x="600" y="855" text-anchor="middle">R: Rameen, crutch. Before: row 3 middle. After: row 2 aisle, two pupils on the bench.</text><text class="" x="600" y="914" text-anchor="middle">S: Shabana, low vision. Front centre; clean board; enlarged print.</text><text class="" x="600" y="973" text-anchor="middle">K: Komal, hearing loss on left. Turn so the right ear faces the room.</text><text class="" x="600" y="1032" text-anchor="middle">H: Hina. Near slate stack; movement job at minute 10.</text><text class="" x="600" y="1091" text-anchor="middle">Z: Zoya. Front right, outside the former dead zone.</text><text class="" x="600" y="1150" text-anchor="middle">B: Saba. Row 5; keep access to the made learning aids.</text><text class="" x="600" y="1209" text-anchor="middle">Before: three windows cast glare on the board; three bags block the narrow aisle.</text><text class="" x="600" y="1268" text-anchor="middle">After: bags under benches; clear 75 cm chalk-marked route. Mat and low shelf at back</text><text class="" x="600" y="1302" text-anchor="middle">right.</text><text class="" x="600" y="1361" text-anchor="middle">Dashed route: teacher passes every bench. Evacuation: rehearse R leaving first with</text><text class="" x="600" y="1395" text-anchor="middle">two named partners.</text><text class="wm" x="1185" y="1494" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
