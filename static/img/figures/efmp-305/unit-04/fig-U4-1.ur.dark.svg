<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 984" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشے میں شمولیتی جماعت کے ماحول کے چار عناصر، پیش بینی، رسائی، شرکت اور ردعمل، ہر ایک کی تین عملی علامتوں کے ساتھ دکھائے گئے ہیں؛ گھیرے کا متن بتاتا ہے کہ خاموشی ان کی پیمائش نہیں ہے۔</title><desc id="d">تصوری نقشے میں شمولیتی جماعت کے ماحول کے چار عناصر، پیش بینی، رسائی، شرکت اور ردعمل، ہر ایک کی تین عملی علامتوں کے ساتھ دکھائے گئے ہیں؛ گھیرے کا متن بتاتا ہے کہ خاموشی ان کی پیمائش نہیں ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="984" fill="var(--bg)"/><rect x="15" y="85" width="970" height="760" rx="45" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 7"/><path class="line" d="M500 181 V518 H245 V548" marker-end="url(#a)"/><path class="line" d="M500 181 V518 H755 V548" marker-end="url(#a)"/><path class="line" d="M500 181 V231 H245 V261" marker-end="url(#a)"/><path class="line" d="M500 181 V231 H755 V261" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">شمولیتی جماعت کا ماحول</text><rect class="accent" x="300" y="100" width="400" height="81" rx="12"/><text class="h" x="500" y="139" text-anchor="middle">شمولیتی جماعت کا ماحول</text><rect class="box" x="550" y="261" width="410" height="183" rx="12"/><text class="h" x="755" y="300" text-anchor="middle">پیش بینی</text><text class="" x="755" y="334" text-anchor="middle">معمولات سکھائے جائیں۔</text><text class="" x="755" y="368" text-anchor="middle">اشارہ سب کو معلوم ہو۔</text><text class="" x="755" y="402" text-anchor="middle">ہر بار ایک جیسا نتیجہ ہو۔</text><rect class="box" x="40" y="261" width="410" height="217" rx="12"/><text class="h" x="245" y="300" text-anchor="middle">رسائی</text><text class="" x="245" y="334" text-anchor="middle">سبق نظر آئے اور سنائی دے۔</text><text class="" x="245" y="368" text-anchor="middle">نشست، تختہ اور دروازہ قابل</text><text class="" x="245" y="402" text-anchor="middle">رسائی ہوں۔</text><text class="" x="245" y="436" text-anchor="middle">چھپائی، زبان اور وقت موزوں ہوں۔</text><rect class="box" x="550" y="548" width="410" height="217" rx="12"/><text class="h" x="755" y="587" text-anchor="middle">شرکت</text><text class="" x="755" y="621" text-anchor="middle">ہر بچے سے پوچھا جائے۔</text><text class="" x="755" y="655" text-anchor="middle">گفتگو منظم ہو؛ صرف رضاکار نہ</text><text class="" x="755" y="689" text-anchor="middle">بولیں۔</text><text class="" x="755" y="723" text-anchor="middle">اگلی قطار کی نشستیں بدلیں۔</text><rect class="box" x="40" y="548" width="410" height="183" rx="12"/><text class="h" x="245" y="587" text-anchor="middle">ردعمل</text><text class="" x="245" y="621" text-anchor="middle">رویے کو پیغام سمجھیں۔</text><text class="" x="245" y="655" text-anchor="middle">پہلے ماحول بدلیں۔</text><text class="" x="245" y="689" text-anchor="middle">مطلوبہ رویہ سکھائیں۔</text><text class="muted" x="500" y="880" text-anchor="middle">خاموشی ان میں سے کسی کی پیمائش نہیں ہے۔</text><text class="wm" x="15" y="969" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
