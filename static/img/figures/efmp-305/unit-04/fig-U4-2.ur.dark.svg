<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 936" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول جماعت کی چھ صورتوں، معمول کے ردعمل، ممکنہ رکاوٹ، پہلے آزمانے والی انتظامی تبدیلی اور صفر سے چالیس روپے کی لاگت کا موازنہ کرتا ہے۔</title><desc id="d">جدول جماعت کی چھ صورتوں، معمول کے ردعمل، ممکنہ رکاوٹ، پہلے آزمانے والی انتظامی تبدیلی اور صفر سے چالیس روپے کی لاگت کا موازنہ کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="936" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">انتظام جماعت: حالات بدلیں</text><rect class="accent" x="948" y="115" width="232" height="74" rx="0"/><text class="h" x="1064" y="153" text-anchor="middle">صورت حال</text><rect class="accent" x="716" y="115" width="232" height="74" rx="0"/><text class="h" x="832" y="153" text-anchor="middle">معمول کا ردعمل</text><rect class="accent" x="484" y="115" width="232" height="74" rx="0"/><text class="h" x="600" y="153" text-anchor="middle">ممکنہ مطلب</text><rect class="accent" x="252" y="115" width="232" height="74" rx="0"/><text class="h" x="368" y="153" text-anchor="middle">پہلے کیا آزمائیں</text><rect class="accent" x="20" y="115" width="232" height="74" rx="0"/><text class="h" x="136" y="153" text-anchor="middle">لاگت</text><rect class="box" x="948" y="189" width="232" height="138" rx="0"/><text class="" x="1064" y="225" text-anchor="middle">ہر سبق میں ایک</text><text class="" x="1064" y="259" text-anchor="middle">وقت نشست چھوڑنا</text><rect class="box" x="716" y="189" width="232" height="138" rx="0"/><text class="" x="832" y="225" text-anchor="middle">تختے پر نام</text><rect class="box" x="484" y="189" width="232" height="138" rx="0"/><text class="" x="600" y="225" text-anchor="middle">بیٹھنا یا کام</text><text class="" x="600" y="259" text-anchor="middle">جاری رکھنا مشکل</text><rect class="box" x="252" y="189" width="232" height="138" rx="0"/><text class="" x="368" y="225" text-anchor="middle">حرکت کا کام؛</text><text class="" x="368" y="259" text-anchor="middle">مختصر سرگرمی اور</text><text class="" x="368" y="293" text-anchor="middle">جانچ</text><rect class="box" x="20" y="189" width="232" height="138" rx="0"/><text class="" x="136" y="225" text-anchor="middle">صفر</text><rect class="box" x="948" y="327" width="232" height="138" rx="0"/><text class="" x="1064" y="363" text-anchor="middle">چار ہی بچے جواب</text><text class="" x="1064" y="397" text-anchor="middle">دیں</text><rect class="box" x="716" y="327" width="232" height="138" rx="0"/><text class="" x="832" y="363" text-anchor="middle">ان چار کی تعریف</text><rect class="box" x="484" y="327" width="232" height="138" rx="0"/><text class="" x="600" y="363" text-anchor="middle">شرکت چند بچوں تک</text><text class="" x="600" y="397" text-anchor="middle">محدود</text><rect class="box" x="252" y="327" width="232" height="138" rx="0"/><text class="" x="368" y="363" text-anchor="middle">نمبر سے بلائیں؛</text><text class="" x="368" y="397" text-anchor="middle">پہلے ساتھی سے</text><text class="" x="368" y="431" text-anchor="middle">گفتگو</text><rect class="box" x="20" y="327" width="232" height="138" rx="0"/><text class="" x="136" y="363" text-anchor="middle">صفر تا 30 روپے</text><rect class="box" x="948" y="465" width="232" height="104" rx="0"/><text class="" x="1064" y="501" text-anchor="middle">ساتھی کی صاف نقل</text><rect class="box" x="716" y="465" width="232" height="104" rx="0"/><text class="" x="832" y="501" text-anchor="middle">صفائی کی تعریف</text><rect class="box" x="484" y="465" width="232" height="104" rx="0"/><text class="" x="600" y="501" text-anchor="middle">تختہ یا چھپائی</text><text class="" x="600" y="535" text-anchor="middle">دکھائی نہیں دیتی</text><rect class="box" x="252" y="465" width="232" height="104" rx="0"/><text class="" x="368" y="501" text-anchor="middle">نشست بدلیں؛ تختہ</text><text class="" x="368" y="535" text-anchor="middle">صاف، حروف بڑے</text><rect class="box" x="20" y="465" width="232" height="104" rx="0"/><text class="" x="136" y="501" text-anchor="middle">صفر</text><rect class="box" x="948" y="569" width="232" height="104" rx="0"/><text class="" x="1064" y="605" text-anchor="middle">خاموشی؛ کوئی سوال</text><text class="" x="1064" y="639" text-anchor="middle">نہیں</text><rect class="box" x="716" y="569" width="232" height="104" rx="0"/><text class="" x="832" y="605" text-anchor="middle">صدر مدرس کی تعریف</text><rect class="box" x="484" y="569" width="232" height="104" rx="0"/><text class="" x="600" y="605" text-anchor="middle">سوال پوچھنا ممنوع</text><text class="" x="600" y="639" text-anchor="middle">محسوس ہوتا ہے</text><rect class="box" x="252" y="569" width="232" height="104" rx="0"/><text class="" x="368" y="605" text-anchor="middle">نہ سمجھنے پر سوال</text><text class="" x="368" y="639" text-anchor="middle">کا اصول سکھائیں</text><rect class="box" x="20" y="569" width="232" height="104" rx="0"/><text class="" x="136" y="605" text-anchor="middle">40 روپے</text><rect class="box" x="948" y="673" width="232" height="104" rx="0"/><text class="" x="1064" y="709" text-anchor="middle">پانی یا بیت الخلا</text><text class="" x="1064" y="743" text-anchor="middle">نہیں جاتا</text><rect class="box" x="716" y="673" width="232" height="104" rx="0"/><text class="" x="832" y="709" text-anchor="middle">دھیان نہیں دیا</text><text class="" x="832" y="743" text-anchor="middle">جاتا</text><rect class="box" x="484" y="673" width="232" height="104" rx="0"/><text class="" x="600" y="709" text-anchor="middle">بینچ سے نکلنے کا</text><text class="" x="600" y="743" text-anchor="middle">راستہ بند</text><rect class="box" x="252" y="673" width="232" height="104" rx="0"/><text class="" x="368" y="709" text-anchor="middle">کنارے کی نشست؛ دو</text><text class="" x="368" y="743" text-anchor="middle">بچے؛ صاف راستہ</text><rect class="box" x="20" y="673" width="232" height="104" rx="0"/><text class="" x="136" y="709" text-anchor="middle">صفر</text><rect class="box" x="948" y="777" width="232" height="104" rx="0"/><text class="" x="1064" y="813" text-anchor="middle">ہدایت پانچ بار</text><text class="" x="1064" y="847" text-anchor="middle">دہرانی پڑے</text><rect class="box" x="716" y="777" width="232" height="104" rx="0"/><text class="" x="832" y="813" text-anchor="middle">اونچی آواز</text><rect class="box" x="484" y="777" width="232" height="104" rx="0"/><text class="" x="600" y="813" text-anchor="middle">شور اور انتقال</text><text class="" x="600" y="847" text-anchor="middle">میں ہدایت گم</text><rect class="box" x="252" y="777" width="232" height="104" rx="0"/><text class="" x="368" y="813" text-anchor="middle">اشارہ سکھائیں؛ دو</text><text class="" x="368" y="847" text-anchor="middle">بچے ہدایت دہرائیں</text><rect class="box" x="20" y="777" width="232" height="104" rx="0"/><text class="" x="136" y="813" text-anchor="middle">صفر</text><text class="wm" x="15" y="921" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
