<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1543" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کمرہ 4 کے پہلے اور بعد کے نقشوں میں وہی بینچ دکھائے گئے ہیں؛ میز، راستہ، بستوں، چھ بچوں کی نشستوں، تعلیمی گوشے اور استاد کے گزرنے کے راستے میں تبدیلی سے رکاوٹیں کم ہوتی ہیں؛ انخلا میں رامین دو نامزد ساتھیوں کے ساتھ پہلے نکلتی ہے۔</title><desc id="d">کمرہ 4 کے پہلے اور بعد کے نقشوں میں وہی بینچ دکھائے گئے ہیں؛ میز، راستہ، بستوں، چھ بچوں کی نشستوں، تعلیمی گوشے اور استاد کے گزرنے کے راستے میں تبدیلی سے رکاوٹیں کم ہوتی ہیں؛ انخلا میں رامین دو نامزد ساتھیوں کے ساتھ پہلے نکلتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1543" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">کمرہ 4: وہی بینچ، رسائی میں تبدیلی</text><text class="h" x="905" y="115" text-anchor="middle">پہلے</text><rect class="box" x="650" y="145" width="510" height="650" rx="0"/><rect class="accent" x="760" y="160" width="280" height="30" rx="0"/><text class="" x="900" y="215" text-anchor="middle">تختہ</text><rect class="box" x="973" y="320" width="112" height="45" rx="3"/><rect class="box" x="833" y="320" width="112" height="45" rx="3"/><rect class="box" x="693" y="320" width="112" height="45" rx="3"/><rect class="box" x="973" y="398" width="112" height="45" rx="3"/><rect class="box" x="833" y="398" width="112" height="45" rx="3"/><rect class="box" x="693" y="398" width="112" height="45" rx="3"/><rect class="box" x="973" y="476" width="112" height="45" rx="3"/><rect class="box" x="833" y="476" width="112" height="45" rx="3"/><rect class="box" x="693" y="476" width="112" height="45" rx="3"/><rect class="box" x="973" y="554" width="112" height="45" rx="3"/><rect class="box" x="833" y="554" width="112" height="45" rx="3"/><rect class="box" x="693" y="554" width="112" height="45" rx="3"/><rect class="box" x="973" y="632" width="112" height="45" rx="3"/><rect class="box" x="833" y="632" width="112" height="45" rx="3"/><rect class="box" x="693" y="632" width="112" height="45" rx="3"/><rect class="accent" x="1013" y="240" width="135" height="50" rx="0"/><text class="" x="1080" y="272" text-anchor="middle">میز</text><rect class="accent" x="1090" y="395" width="30" height="30" rx="0"/><rect class="accent" x="1090" y="440" width="30" height="30" rx="0"/><rect class="accent" x="1090" y="485" width="30" height="30" rx="0"/><text class="" x="1125" y="535" text-anchor="end">40 cm</text><rect class="accent" x="1152" y="260" width="16" height="55" rx="0"/><rect class="accent" x="1152" y="430" width="16" height="55" rx="0"/><rect class="accent" x="1152" y="600" width="16" height="55" rx="0"/><line class="line" x1="1160" y1="285" x2="980" y2="175" marker-end="url(#a)"/><text class="h" x="889" y="506" text-anchor="middle">R</text><text class="h" x="1029" y="506" text-anchor="middle">S</text><text class="h" x="749" y="506" text-anchor="middle">K ←</text><text class="h" x="1029" y="584" text-anchor="middle">H</text><text class="h" x="749" y="662" text-anchor="middle">Z</text><text class="h" x="889" y="662" text-anchor="middle">B</text><text class="" x="1122" y="760" text-anchor="end">دروازہ</text><text class="h" x="295" y="115" text-anchor="middle">بعد</text><rect class="box" x="40" y="145" width="510" height="650" rx="0"/><rect class="accent" x="150" y="160" width="280" height="30" rx="0"/><text class="" x="290" y="215" text-anchor="middle">صاف تختہ</text><rect class="box" x="363" y="320" width="112" height="45" rx="3"/><rect class="box" x="223" y="320" width="112" height="45" rx="3"/><rect class="box" x="83" y="320" width="112" height="45" rx="3"/><rect class="box" x="363" y="398" width="112" height="45" rx="3"/><rect class="box" x="223" y="398" width="112" height="45" rx="3"/><rect class="box" x="83" y="398" width="112" height="45" rx="3"/><rect class="box" x="363" y="476" width="112" height="45" rx="3"/><rect class="box" x="223" y="476" width="112" height="45" rx="3"/><rect class="box" x="83" y="476" width="112" height="45" rx="3"/><rect class="box" x="363" y="554" width="112" height="45" rx="3"/><rect class="box" x="223" y="554" width="112" height="45" rx="3"/><rect class="box" x="83" y="554" width="112" height="45" rx="3"/><rect class="box" x="363" y="632" width="112" height="45" rx="3"/><rect class="box" x="223" y="632" width="112" height="45" rx="3"/><rect class="box" x="83" y="632" width="112" height="45" rx="3"/><rect class="accent" x="60" y="245" width="110" height="45" rx="0"/><text class="" x="115" y="273" text-anchor="middle">میز</text><path class="line" d="M515 770 V270 H495" marker-end="url(#a)" stroke-dasharray="8 6"/><path class="line" d="M419 400 H515 V770" marker-end="url(#a)"/><text class="" x="518" y="305" text-anchor="end">75 cm</text><rect class="accent" x="60" y="720" width="165" height="55" rx="0"/><text class="" x="143" y="752" text-anchor="middle">تعلم کا گوشہ</text><path class="line" d="M420 290 H80 V382 H480 V459 H80 V537 H480 V615 H80" marker-end="url(#a)" stroke-dasharray="8 6"/><text class="h" x="419" y="428" text-anchor="middle">R</text><text class="h" x="279" y="350" text-anchor="middle">S</text><text class="h" x="139" y="350" text-anchor="middle">K →</text><text class="h" x="419" y="584" text-anchor="middle">H</text><text class="h" x="139" y="428" text-anchor="middle">Z</text><text class="h" x="279" y="662" text-anchor="middle">B</text><text class="" x="512" y="760" text-anchor="end">دروازہ</text><text class="" x="600" y="855" text-anchor="middle">R: رامین، بیساکھی۔ پہلے تیسری قطار کے درمیان؛ بعد میں دوسری قطار کے کنارے، بینچ پر دو</text><text class="" x="600" y="889" text-anchor="middle">بچے۔</text><text class="" x="600" y="948" text-anchor="middle">S: شبانہ، کم بصارت۔ آگے درمیان؛ صاف تختہ اور بڑے حروف۔</text><text class="" x="600" y="1007" text-anchor="middle">K: کومل، بائیں کان سے کم سنتی ہے۔ رخ بدلیں تاکہ دایاں کان جماعت کی طرف ہو۔</text><text class="" x="600" y="1066" text-anchor="middle">H: حنا، تختیوں کے قریب؛ دسویں منٹ میں حرکت کا کام۔</text><text class="" x="600" y="1125" text-anchor="middle">Z: زویا، آگے دائیں جانب؛ پہلے نظر سے اوجھل کونے سے باہر۔</text><text class="" x="600" y="1184" text-anchor="middle">B: صبا، پانچویں قطار؛ بنائے گئے تعلیمی سامان تک رسائی برقرار۔</text><text class="" x="600" y="1243" text-anchor="middle">پہلے: تین کھڑکیوں سے تختے پر چکاچوند؛ تنگ راستے میں تین بستے۔</text><text class="" x="600" y="1302" text-anchor="middle">بعد میں: بستے بینچ کے نیچے؛ چاک سے نشان زدہ 75 سینٹی میٹر صاف راستہ؛ پیچھے چٹائی اور</text><text class="" x="600" y="1336" text-anchor="middle">نیچی الماری۔</text><text class="" x="600" y="1395" text-anchor="middle">ٹوٹے خط: استاد ہر بینچ تک جائے۔ انخلا: دو نامزد ساتھیوں کے ساتھ رامین پہلے نکلے؛ مشق</text><text class="" x="600" y="1429" text-anchor="middle">کریں۔</text><text class="wm" x="15" y="1528" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
