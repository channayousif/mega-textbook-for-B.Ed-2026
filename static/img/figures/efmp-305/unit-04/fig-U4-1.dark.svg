<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1018" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A concept-map of the inclusive classroom environment with a central node and four branches - predictability, access, participation and response - each carrying three concrete elements, surrounded by a dotted ring labelled to note that silence measures none of them.</title><desc id="d">A concept-map of the inclusive classroom environment with a central node and four branches - predictability, access, participation and response - each carrying three concrete elements, surrounded by a dotted ring labelled to note that silence measures none of them.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="1018" fill="var(--bg)"/><rect x="15" y="85" width="970" height="794" rx="45" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 7"/><path class="line" d="M500 215 V552 H755 V582" marker-end="url(#a)"/><path class="line" d="M500 215 V552 H245 V582" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H755 V295" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H245 V295" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">An inclusive classroom environment</text><rect class="accent" x="300" y="100" width="400" height="115" rx="12"/><text class="h" x="500.0" y="139" text-anchor="middle">Inclusive classroom</text><text class="h" x="500.0" y="173" text-anchor="middle">environment</text><rect class="box" x="40" y="295" width="410" height="183" rx="12"/><text class="h" x="245.0" y="334" text-anchor="middle">Predictability</text><text class="" x="245.0" y="368" text-anchor="middle">Taught routines.</text><text class="" x="245.0" y="402" text-anchor="middle">A signal everyone knows.</text><text class="" x="245.0" y="436" text-anchor="middle">The same consequence each time.</text><rect class="box" x="550" y="295" width="410" height="217" rx="12"/><text class="h" x="755.0" y="334" text-anchor="middle">Access</text><text class="" x="755.0" y="368" text-anchor="middle">See and hear the lesson.</text><text class="" x="755.0" y="402" text-anchor="middle">Reach the seat, board and door.</text><text class="" x="755.0" y="436" text-anchor="middle">Use the print, language and</text><text class="" x="755.0" y="470" text-anchor="middle">time available.</text><rect class="box" x="40" y="582" width="410" height="217" rx="12"/><text class="h" x="245.0" y="621" text-anchor="middle">Participation</text><text class="" x="245.0" y="655" text-anchor="middle">Everyone is called on.</text><text class="" x="245.0" y="689" text-anchor="middle">Talk is structured, not only</text><text class="" x="245.0" y="723" text-anchor="middle">volunteered.</text><text class="" x="245.0" y="757" text-anchor="middle">The front row rotates.</text><rect class="box" x="550" y="582" width="410" height="183" rx="12"/><text class="h" x="755.0" y="621" text-anchor="middle">Response</text><text class="" x="755.0" y="655" text-anchor="middle">Read behaviour as a message.</text><text class="" x="755.0" y="689" text-anchor="middle">Change the environment first.</text><text class="" x="755.0" y="723" text-anchor="middle">Teach the behaviour wanted.</text><text class="muted" x="500" y="914" text-anchor="middle">None of these is measured by silence.</text><text class="wm" x="985" y="1003" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
