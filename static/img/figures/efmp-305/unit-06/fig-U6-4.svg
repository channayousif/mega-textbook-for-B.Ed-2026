le">for lip-reading; family’s attention</text><text class="" x="480" y="1867" text-anchor="middle">method</text><rect class="box" x="20" y="1900" width="200" height="103" rx="0"/><rect class="box" x="220" y="1900" width="520" height="103" rx="0"/><text class="h" x="120" y="1936" text-anchor="middle">Funded action</text><text class="h" x="120" y="1970" text-anchor="middle">/ who to ask</text><text class="" x="480" y="1936" text-anchor="middle">Request trained post naming child</text><text class="" x="480" y="1970" text-anchor="middle">and clause; keep copy</text><rect class="accent" x="20" y="2038" width="720" height="69" rx="0"/><text class="h" x="380" y="2074" text-anchor="middle">Mother never visits; cannot read note</text><rect class="box" x="20" y="2107" width="200" height="69" rx="0"/><rect class="box" x="220" y="2107" width="520" height="69" rx="0"/><text class="h" x="120" y="2143" text-anchor="middle">Level</text><text class="" x="480" y="2143" text-anchor="middle">3 and 4</text><rect class="box" x="20" y="2176" width="200" height="69" rx="0"/><rect class="box" x="220" y="2176" width="520" height="69" rx="0"/><text class="h" x="120" y="2212" text-anchor="middle">Who holds it</text><text class="" x="480" y="2212" text-anchor="middle">School-created barrier</text><rect class="box" x="20" y="2245" width="200" height="137" rx="0"/><rect class="box" x="220" y="2245" width="520" height="137" rx="0"/><text class="h" x="120" y="2281" text-anchor="middle">Free action</text><text class="h" x="120" y="2315" text-anchor="middle">this term</text><text class="" x="480" y="2281" text-anchor="middle">Trusted messenger; home-language</text><text class="" x="480" y="2315" text-anchor="middle">visit about strengths; voice-note</text><text class="" x="480" y="2349" text-anchor="middle">channel</text><rect class="box" x="20" y="2382" width="200" height="103" rx="0"/><rect class="box" x="220" y="2382" width="520" height="103" rx="0"/><text class="h" x="120" y="2418" text-anchor="middle">Funded action</text><text class="h" x="120" y="2452" text-anchor="middle">/ who to ask</text><text class="" x="480" y="2418" text-anchor="middle">Nothing</text><rect class="accent" x="20" y="2520" width="720" height="69" rx="0"/><text class="h" x="380" y="2556" text-anchor="middle">Family fears community stigma</text><rect class="box" x="20" y="2589" width="200" height="69" rx="0"/><rect class="box" x="220" y="2589" width="520" height="69" rx="0"/><text class="h" x="120" y="2625" text-anchor="middle">Level</text><text class="" x="480" y="2625" text-anchor="middle">Community: outside four levels</text><rect class="box" x="20" y="2658" width="200" height="69" rx="0"/><rect class="box" x="220" y="2658" width="520" height="69" rx="0"/><text class="h" x="120" y="2694" text-anchor="middle">Who holds it</text><text class="" x="480" y="2694" text-anchor="middle">No single employee controls it</text><rect class="box" x="20" y="2727" width="200" height="103" rx="0"/><rect class="box" x="220" y="2727" width="520" height="103" rx="0"/><text class="h" x="120" y="2763" text-anchor="middle">Free action</text><text class="h" x="120" y="2797" text-anchor="middle">this term</text><text class="" x="480" y="2763" text-anchor="middle">Make classroom safe from stigma;</text><text class="" x="480" y="2797" text-anchor="middle">family hears it from child</text><rect class="box" x="20" y="2830" width="200" height="137" rx="0"/><rect class="box" x="220" y="2830" width="520" height="137" rx="0"/><text class="h" x="120" y="2866" text-anchor="middle">Funded action</text><text class="h" x="120" y="2900" text-anchor="middle">/ who to ask</text><text class="" x="480" y="2866" text-anchor="middle">Sustained partnership with willing</text><text class="" x="480" y="2900" text-anchor="middle">families and advocates; no quick</text><text class="" x="480" y="2934" text-anchor="middle">promise</text><rect class="accent" x="20" y="3002" width="720" height="69" rx="0"/><text class="h" x="380" y="303