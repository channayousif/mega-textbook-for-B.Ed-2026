<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 5064" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A five-column table of ten concretely stated barriers in Pakistani schools, each assigned to one of Unit 5&#x27;s four levels plus one assigned to the community, with who holds it, the free action available this term, and what costs money and who to ask, with a footer noting that each barrier has an immediate action, some need external resources, and community stigma needs sustained partnership.</title><desc id="d">A five-column table of ten concretely stated barriers in Pakistani schools, each assigned to one of Unit 5&#x27;s four levels plus one assigned to the community, with who holds it, the free action available this term, and what costs money and who to ask, with a footer noting that each barrier has an immediate action, some need external resources, and community stigma needs sustained partnership.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="760" height="5064" fill="var(--bg)"/><text class="h" x="380" y="60" text-anchor="middle">Barriers: owner, free action, funded action</text><rect class="accent" x="20" y="110" width="720" height="69" rx="0"/><text class="h" x="380" y="146" text-anchor="middle">81 children, one Grade 3 teacher</text><rect class="box" x="20" y="179" width="200" height="69" rx="0"/><rect class="box" x="220" y="179" width="520" height="69" rx="0"/><text class="h" x="120" y="215" text-anchor="middle">Level</text><text class="" x="480" y="215" text-anchor="middle">2 and 3</text><rect class="box" x="20" y="248" width="200" height="69" rx="0"/><rect class="box" x="220" y="248" width="520" height="69" rx="0"/><text class="h" x="120" y="284" text-anchor="middle">Who holds it</text><text class="" x="480" y="284" text-anchor="middle">District; head for room/timetable</text><rect class="box" x="20" y="317" width="200" height="103" rx="0"/><rect class="box" x="220" y="317" width="520" height="103" rx="0"/><text class="h" x="120" y="353" text-anchor="middle">Free action</text><text class="h" x="120" y="387" text-anchor="middle">this term</text><text class="" x="480" y="353" text-anchor="middle">Assigned study pairs; fifteen-minute</text><text class="" x="480" y="387" text-anchor="middle">training; jigsaw for important work</text><rect class="box" x="20" y="420" width="200" height="137" rx="0"/><rect class="box" x="220" y="420" width="520" height="137" rx="0"/><text class="h" x="120" y="456" text-anchor="middle">Funded action</text><text class="h" x="120" y="490" text-anchor="middle">/ who to ask</text><text class="" x="480" y="456" text-anchor="middle">Sanctioned second post; written</text><text class="" x="480" y="490" text-anchor="middle">request via head to taluka education</text><text class="" x="480" y="524" text-anchor="middle">officer</text><rect class="accent" x="20" y="592" width="720" height="69" rx="0"/><text class="h" x="380" y="628" text-anchor="middle">Three pupils miss spoken instructions</text><rect class="box" x="20" y="661" width="200" height="69" rx="0"/><rect class="box" x="220" y="661" width="520" height="69" rx="0"/><text class="h" x="120" y="697" text-anchor="middle">Level</text><text class="" x="480" y="697" text-anchor="middle">4</text><rect c