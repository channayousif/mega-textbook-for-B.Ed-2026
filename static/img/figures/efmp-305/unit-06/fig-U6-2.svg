<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 3998" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A five-column table of eight empathy and culture-building activities for a class of sixty, giving what the class does, the time needed, the cost and which of the four culture markers each activity moves, with every row costed for a school with no budget and a footer noting the eight together cost one sheet of chart paper and about an hour of preparation.</title><desc id="d">A five-column table of eight empathy and culture-building activities for a class of sixty, giving what the class does, the time needed, the cost and which of the four culture markers each activity moves, with every row costed for a school with no budget and a footer noting the eight together cost one sheet of chart paper and about an hour of preparation.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="760" height="3998" fill="var(--bg)"/><text class="h" x="380" y="60" text-anchor="middle">Eight activities for a class of sixty</text><rect class="accent" x="20" y="110" width="720" height="69" rx="0"/><text class="h" x="380" y="146" text-anchor="middle">Muffled instruction</text><rect class="box" x="20" y="179" width="200" height="137" rx="0"/><rect class="box" x="220" y="179" width="520" height="137" rx="0"/><text class="h" x="120" y="215" text-anchor="middle">What the</text><text class="h" x="120" y="249" text-anchor="middle">class does</text><text class="" x="480" y="215" text-anchor="middle">Teacher faces away and speaks</text><text class="" x="480" y="249" text-anchor="middle">quietly; pupils write what they</text><text class="" x="480" y="283" text-anchor="middle">heard, then list improvements.</text><rect class="box" x="20" y="316" width="200" height="69" rx="0"/><rect class="box" x="220" y="316" width="520" height="69" rx="0"/><text class="h" x="120" y="352" text-anchor="middle">Time</text><text class="" x="480" y="352" text-anchor="middle">10 min once; revisit all year</text><rect class="box" x="20" y="385" width="200" height="69" rx="0"/><rect class="box" x="220" y="385" width="520" height="69" rx="0"/><text class="h" x="120" y="421" text-anchor="middle">Cost</text><text class="" x="480" y="421" text-anchor="middle">Nothing</text><rect class="box" x="20" y="454" width="200" height="103" rx="0"/><rect class="box" x="220" y="454" width="520" height="103" rx="0"/><text class="h" x="120" y="490" text-anchor="middle">Culture</text><text class="h" x="120" y="524" text-anchor="middle">marker</text><text class="" x="480" y="490" text-anchor="middle">Who speaks</text><rect class="accent" x="20" y="592" width="720" height="69" rx="0"/><text class="h" x="380" y="628" text-anchor="middle">Class charter</text><rect class="box" x="20" y="661" width="200" height="103" rx="0"/><rect class="box" x="220" y="661" width="520" height="103" rx="0"/><text class="h" x="120" y="697" text-anchor="middle">What the</text><text class="h" x="120" y="731" text-anchor="middle">class does</text><text class="" x="480" y="697" text-anchor="middle">Six rules in children’s words and</text><text class="" x="480" y="731" text-anchor="middle">home language; everyone signs.</text><rect class="box" x="20" y="764" width="200" height="69" rx="0"/><rect class="box" x="220" y="764" width="520" height="69" rx="0"/><text class="h" x="120" y="800" text-anchor="middle">Time</text><text class="" x="480" y="800" text-anchor="middle">40 min; 5 min monthly review</text><rect class="box" x="20" y="833" width="200" height="69" rx="0"/><rect class="box" x="220" y="833" width="520" height="69" rx="0"/><text class="h" x="120" y="869" text-anchor="middle">Cost</text><text class="" x="480" y="869" text-anchor="middle">One chart sheet</text><rect class="box" x="20" y="902" width="200" height="103" rx="0"/><rect class="box" x="220" y="902" width="520" height="103" rx="0"/><text class="h" x="120" y="938" text-anchor="middle">Culture</text><text class="h" x="120" y="972" text-anchor="middle">marker</text><text class="" x="480" y="938" text-anchor="middle">All four</text><rect class="accent" x="20" y="1040" width="720" height="69" rx="0"/><text class="h" x="380" y="1076" text-anchor="middle">Assigned pairs</text><rect class="box" x="20" y="1109" width="200" height="103" rx="0"/><rect class="box" x="220" y="1109" width="520" height="103" rx="0"/><text class="h" x="120" y="1145" text-anchor="middle">What the</text><text class="h" x="120" y="1179" text-anchor="middle">class does</text><text class="" x="480" y="1145" text-anchor="middle">Teacher assigns short-task partners;</text><text class="" x="480" y="1179" text-anchor="middle">written weekly rotation.</text><rect class="box" x="20" y="1212" width="200" height="69" rx="0"/><rect class="box" x="220" y="1212" width="520" height="69" rx="0"/><text class="h" x="120" y="1248" text-anchor="middle">Time</text><text class="" x="480" y="1248" text-anchor="middle">No extra time</text><rect class="box" x="20" y="1281" width="200" height="69" rx="0"/><rect class="box" x="220" y="1281" width="520" height="69" rx="0"/><text class="h" x="120" y="1317" text-anchor="middle">Cost</text><text class="" x="480" y="1317" text-anchor="middle">Nothing</text><rect class="box" x="20" y="1350" width="200" height="103" rx="0"/><rect class="box" x="220" y="1350" width="520" height="103" rx="0"/><text class="h" x="120" y="1386" text-anchor="middle">Culture</text><text class="h" x="120" y="1420" text-anchor="middle">marker</text><text class="" x="480" y="1386" text-anchor="middle">Who is chosen</text><rect class="accent" x="20" y="1488" width="720" height="69" rx="0"/><text class="h" x="380" y="1524" text-anchor="middle">Jigsaw: a necessary piece</text><rect class="box" x="20" y="1557" width="200" height="137" rx="0"/><rect class="box" x="220" y="1557" width="520" height="137" rx="0"/><text class="h" x="120" y="1593" text-anchor="middle">What the</text><text class="h" x="120" y="1627" text-anchor="middle">class does</text><text class="" x="480" y="1593" text-anchor="middle">Each pupil holds information the</text><text class="" x="480" y="1627" text-anchor="middle">group needs, including the pupil</text><text class="" x="480" y="1661" text-anchor="middle">others avoid.</text><rect class="box" x="20" y="1694" width="200" height="69" rx="0"/><rect class="box" x="220" y="1694" width="520" height="69" rx="0"/><text class="h" x="120" y="1730" text-anchor="middle">Time</text><text class="" x="480" y="1730" text-anchor="middle">25–30 min each use</text><rect class="box" x="20" y="1763" width="200" height="69" rx="0"/><rect class="box" x="220" y="1763" width="520" height="69" rx="0"/><text class="h" x="120" y="1799" text-anchor="middle">Cost</text><text class="" x="480" y="1799" text-anchor="middle">Chalk only</text><rect class="box" x="20" y="1832" width="200" height="103" rx="0"/><rect class="box" x="220" y="1832" width="520" height="103" rx="0"/><text class="h" x="120" y="1868" text-anchor="middle">Culture</text><text class="h" x="120" y="1902" text-anchor="middle">marker</text><text class="" x="480" y="1868" text-anchor="middle">Who is chosen; who is helped</text><rect class="accent" x="20" y="1970" width="720" height="69" rx="0"/><text class="h" x="380" y="2006" text-anchor="middle">Buddy rota</text><rect class="box" x="20" y="2039" width="200" height="137" rx="0"/><rect class="box" x="220" y="2039" width="520" height="137" rx="0"/><text class="h" x="120" y="2075" text-anchor="middle">What the</text><text class="h" x="120" y="2109" text-anchor="middle">class does</text><text class="" x="480" y="2075" text-anchor="middle">Two buddies for a bounded task;</text><text class="" x="480" y="2109" text-anchor="middle">everyone rotates, including the</text><text class="" x="480" y="2143" text-anchor="middle">supported pupil.</text><rect class="box" x="20" y="2176" width="200" height="69" rx="0"/><rect class="box" x="220" y="2176" width="520" height="69" rx="0"/><text class="h" x="120" y="2212" text-anchor="middle">Time</text><text class="" x="480" y="2212" text-anchor="middle">15 min training; 2 min weekly</text><rect class="box" x="20" y="2245" width="200" height="69" rx="0"/><rect class="box" x="220" y="2245" width="520" height="69" rx="0"/><text class="h" x="120" y="2281" text-anchor="middle">Cost</text><text class="" x="480" y="2281" text-anchor="middle">Nothing</text><rect class="box" x="20" y="2314" width="200" height="103" rx="0"/><rect class="box" x="220" y="2314" width="520" height="103" rx="0"/><text class="h" x="120" y="2350" text-anchor="middle">Culture</text><text class="h" x="120" y="2384" text-anchor="middle">marker</text><text class="" x="480" y="2350" text-anchor="middle">Who is helped, and how</text><rect class="accent" x="20" y="2452" width="720" height="69" rx="0"/><text class="h" x="380" y="2488" text-anchor="middle">Name it in one sentence</text><rect class="box" x="20" y="2521" width="200" height="103" rx="0"/><rect class="box" x="220" y="2521" width="520" height="103" rx="0"/><text class="h" x="120" y="2557" text-anchor="middle">What the</text><text class="h" x="120" y="2591" text-anchor="middle">class does</text><text class="" x="480" y="2557" text-anchor="middle">Correct laughter or exclusion</text><text class="" x="480" y="2591" text-anchor="middle">specifically; continue the lesson.</text><rect class="box" x="20" y="2624" width="200" height="69" rx="0"/><rect class="box" x="220" y="2624" width="520" height="69" rx="0"/><text class="h" x="120" y="2660" text-anchor="middle">Time</text><text class="" x="480" y="2660" text-anchor="middle">7 seconds as needed</text><rect class="box" x="20" y="2693" width="200" height="69" rx="0"/><rect class="box" x="220" y="2693" width="520" height="69" rx="0"/><text class="h" x="120" y="2729" text-anchor="middle">Cost</text><text class="" x="480" y="2729" text-anchor="middle">Nothing</text><rect class="box" x="20" y="2762" width="200" height="103" rx="0"/><rect class="box" x="220" y="2762" width="520" height="103" rx="0"/><text class="h" x="120" y="2798" text-anchor="middle">Culture</text><text class="h" x="120" y="2832" text-anchor="middle">marker</text><text class="" x="480" y="2798" text-anchor="middle">What happens after failure</text><rect class="accent" x="20" y="2900" width="720" height="69" rx="0"/><text class="h" x="380" y="2936" text-anchor="middle">Three ordinary-voice questions</text><rect class="box" x="20" y="2969" width="200" height="137" rx="0"/><rect class="box" x="220" y="2969" width="520" height="137" rx="0"/><text class="h" x="120" y="3005" text-anchor="middle">What the</text><text class="h" x="120" y="3039" text-anchor="middle">class does</text><text class="" x="480" y="3005" text-anchor="middle">Name the pupil seen as fragile; ask</text><text class="" x="480" y="3039" text-anchor="middle">an answerable question publicly</text><text class="" x="480" y="3073" text-anchor="middle">three times a week.</text><rect class="box" x="20" y="3106" width="200" height="69" rx="0"/><rect class="box" x="220" y="3106" width="520" height="69" rx="0"/><text class="h" x="120" y="3142" text-anchor="middle">Time</text><text class="" x="480" y="3142" text-anchor="middle">90 seconds weekly</text><rect class="box" x="20" y="3175" width="200" height="69" rx="0"/><rect class="box" x="220" y="3175" width="520" height="69" rx="0"/><text class="h" x="120" y="3211" text-anchor="middle">Cost</text><text class="" x="480" y="3211" text-anchor="middle">Nothing</text><rect class="box" x="20" y="3244" width="200" height="103" rx="0"/><rect class="box" x="220" y="3244" width="520" height="103" rx="0"/><text class="h" x="120" y="3280" text-anchor="middle">Culture</text><text class="h" x="120" y="3314" text-anchor="middle">marker</text><text class="" x="480" y="3280" text-anchor="middle">Who speaks; teacher signal</text><rect class="accent" x="20" y="3382" width="720" height="69" rx="0"/><text class="h" x="380" y="3418" text-anchor="middle">Ask before helping</text><rect class="box" x="20" y="3451" width="200" height="103" rx="0"/><rect class="box" x="220" y="3451" width="520" height="103" rx="0"/><text class="h" x="120" y="3487" text-anchor="middle">What the</text><text class="h" x="120" y="3521" text-anchor="middle">class does</text><text class="" x="480" y="3487" text-anchor="middle">Ask first, accept refusal; teacher</text><text class="" x="480" y="3521" text-anchor="middle">models accepting no.</text><rect class="box" x="20" y="3554" width="200" height="69" rx="0"/><rect class="box" x="220" y="3554" width="520" height="69" rx="0"/><text class="h" x="120" y="3590" text-anchor="middle">Time</text><text class="" x="480" y="3590" text-anchor="middle">One demonstration, then ongoing</text><rect class="box" x="20" y="3623" width="200" height="69" rx="0"/><rect class="box" x="220" y="3623" width="520" height="69" rx="0"/><text class="h" x="120" y="3659" text-anchor="middle">Cost</text><text class="" x="480" y="3659" text-anchor="middle">Nothing</text><rect class="box" x="20" y="3692" width="200" height="103" rx="0"/><rect class="box" x="220" y="3692" width="520" height="103" rx="0"/><text class="h" x="120" y="3728" text-anchor="middle">Culture</text><text class="h" x="120" y="3762" text-anchor="middle">marker</text><text class="" x="480" y="3728" text-anchor="middle">Who is helped, and how</text><text class="muted" x="380" y="3865" text-anchor="middle">All eight: one chart sheet; about one hour of</text><text class="muted" x="380" y="3899" text-anchor="middle">new preparation, once.</text><text class="wm" x="745" y="3983" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
