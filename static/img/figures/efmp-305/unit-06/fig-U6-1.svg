<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A concept-map with a central node for a supportive classroom culture and four branches for the observable markers an outsider can check - who speaks, who is chosen, who is helped and how, and what happens when someone fails - each with four concrete practices, surrounded by a ring naming the teacher&#x27;s own micro-behaviour as the strongest signal, and a footer noting that every marker is countable in one lesson and none of them is a feeling.</title><desc id="d">A concept-map with a central node for a supportive classroom culture and four branches for the observable markers an outsider can check - who speaks, who is chosen, who is helped and how, and what happens when someone fails - each with four concrete practices, surrounded by a ring naming the teacher&#x27;s own micro-behaviour as the strongest signal, and a footer noting that every marker is countable in one lesson and none of them is a feeling.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="1350" fill="var(--bg)"/><rect x="15" y="85" width="970" height="964" rx="45" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 7"/><path class="line" d="M500 215 V620 H755 V650" marker-end="url(#a)"/><path class="line" d="M500 215 V620 H245 V650" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H755 V295" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H245 V295" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">A supportive classroom culture</text><rect class="accent" x="300" y="100" width="400" height="115" rx="12"/><text class="h" x="500.0" y="139" text-anchor="middle">What reliably happens in</text><text class="h" x="500.0" y="173" text-anchor="middle">this room</text><rect class="box" x="40" y="295" width="410" height="285" rx="12"/><text class="h" x="245.0" y="334" text-anchor="middle">Who speaks</text><text class="" x="245.0" y="368" text-anchor="middle">Every pupil asked by name each</text><text class="" x="245.0" y="402" text-anchor="middle">week.</text><text class="" x="245.0" y="436" text-anchor="middle">Wait long enough.</text><text class="" x="245.0" y="470" text-anchor="middle">“I did not understand” is safe.</text><text class="" x="245.0" y="504" text-anchor="middle">Check the teacher’s question</text><text class="" x="245.0" y="538" text-anchor="middle">tally.</text><rect class="box" x="550" y="295" width="410" height="285" rx="12"/><text class="h" x="755.0" y="334" text-anchor="middle">Who is chosen</text><text class="" x="755.0" y="368" text-anchor="middle">Assign important-task groups.</text><text class="" x="755.0" y="402" text-anchor="middle">No team-picking captains.</text><text class="" x="755.0" y="436" text-anchor="middle">Read the register before trip,</text><text class="" x="755.0" y="470" text-anchor="middle">debate or form.</text><text class="" x="755.0" y="504" text-anchor="middle">Rotation is a rule, not a</text><text class="" x="755.0" y="538" text-anchor="middle">favour.</text><rect class="box" x="40" y="650" width="410" height="251" rx="12"/><text class="h" x="245.0" y="689" text-anchor="middle">Who is helped, and how</text><text class="" x="245.0" y="723" text-anchor="middle">Help is a timed task, not</text><text class="" x="245.0" y="757" text-anchor="middle">charge over a person.</text><text class="" x="245.0" y="791" text-anchor="middle">Helpers rotate.</text><text class="" x="245.0" y="825" text-anchor="middle">The supported pupil also helps.</text><text class="" x="245.0" y="859" text-anchor="middle">Only as much help as needed.</text><rect class="box" x="550" y="650" width="410" height="319" rx="12"/><text class="h" x="755.0" y="689" text-anchor="middle">What happens after failure</text><text class="" x="755.0" y="723" text-anchor="middle">Errors are ordinary and</text><text class="" x="755.0" y="757" text-anchor="middle">visible.</text><text class="" x="755.0" y="791" text-anchor="middle">Teacher corrections are</text><text class="" x="755.0" y="825" text-anchor="middle">visible.</text><text class="" x="755.0" y="859" text-anchor="middle">Do not protect anyone out of</text><text class="" x="755.0" y="893" text-anchor="middle">participating.</text><text class="" x="755.0" y="927" text-anchor="middle">A second attempt is normal.</text><text class="muted" x="500" y="1084" text-anchor="middle">Teacher micro-behaviour surrounds all four: the class copies who</text><text class="muted" x="500" y="1118" text-anchor="middle">gets five minutes after the bell.</text><text class="muted" x="500" y="1212" text-anchor="middle">An observer can count these in one lesson. They are practices, not</text><text class="muted" x="500" y="1246" text-anchor="middle">feelings.</text><text class="wm" x="985" y="1335" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
