<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2037" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین ہم مرکز دائروں میں ایک بچے کے گرد روزمرہ جماعتی مدد، اسکول کی ٹرم کی ذمہ داری اور دروازے سے باہر کی خدمات دکھائی گئی ہیں؛ موٹا تیر تحریری درخواست، اور ٹوٹا تیر استاد کے ذریعے بچے تک آنے والی بیرونی مدد ہے۔</title><desc id="d">تین ہم مرکز دائروں میں ایک بچے کے گرد روزمرہ جماعتی مدد، اسکول کی ٹرم کی ذمہ داری اور دروازے سے باہر کی خدمات دکھائی گئی ہیں؛ موٹا تیر تحریری درخواست، اور ٹوٹا تیر استاد کے ذریعے بچے تک آنے والی بیرونی مدد ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1100" height="2037" fill="var(--bg)"/><text class="h" x="550" y="60" text-anchor="middle">پورے اسکول کا شمولیتی نمونہ</text><circle class="box" cx="550" cy="550" r="430"/><circle class="box" cx="550" cy="550" r="330"/><circle class="box" cx="550" cy="550" r="220"/><text class="h" x="550" y="165" text-anchor="middle">3: دروازے سے باہر</text><text class="h" x="550" y="275" text-anchor="middle">2: اسکول</text><text class="h" x="550" y="385" text-anchor="middle">1: کمرہ</text><text class="h" x="550" y="720" text-anchor="middle">1</text><text class="h" x="715" y="550" text-anchor="middle">1</text><text class="h" x="385" y="550" text-anchor="middle">1</text><text class="h" x="550" y="830" text-anchor="middle">2</text><text class="h" x="825" y="550" text-anchor="middle">2</text><text class="h" x="275" y="550" text-anchor="middle">2</text><text class="h" x="550" y="940" text-anchor="middle">3</text><text class="h" x="935" y="550" text-anchor="middle">3</text><text class="h" x="165" y="550" text-anchor="middle">3</text><circle class="accent" cx="550" cy="550" r="100"/><text class="h" x="550" y="520" text-anchor="middle">ایک نامزد بچہ</text><text class="h" x="550" y="554" text-anchor="middle">ایک عام منگل</text><text class="h" x="550" y="588" text-anchor="middle">ایک جماعت</text><line class="line" x1="120" y1="550" x2="30" y2="550" marker-end="url(#a)"/><path class="line" d="M120 650 H100 V750 H370 V630 H450" marker-end="url(#a)" stroke-dasharray="8 6"/><rect class="box" x="60" y="1030" width="980" height="217" rx="12"/><text class="h" x="550" y="1069" text-anchor="middle">1۔ کمرہ: روزانہ، مفت</text><text class="" x="550" y="1103" text-anchor="middle">استاد: نشست، توجہ کا معمول، تختے پر اہم لفظ، توقع۔</text><text class="" x="550" y="1137" text-anchor="middle">جماعت: عہدنامہ، مدد کی باری، مقرر جوڑے، ہدایت کی جانچ۔</text><text class="" x="550" y="1171" text-anchor="middle">بچہ: پوچھیں کیا مددگار ہے، یقین کریں۔</text><text class="" x="550" y="1205" text-anchor="middle">خاندان: چار سوال، ہفتے کا ایک مفت کام، پڑھنے کے بغیر رابطہ۔</text><rect class="box" x="60" y="1287" width="980" height="217" rx="12"/><text class="h" x="550" y="1326" text-anchor="middle">2۔ اسکول: ہر ٹرم، کم خرچ</text><text class="" x="550" y="1360" text-anchor="middle">صدر مدرس: رجسٹر، کمرہ، وقت، درخواست پر دستخط۔</text><text class="" x="550" y="1394" text-anchor="middle">پچھلے استاد کا بیس منٹ تعارفی تبادلہ۔</text><text class="" x="550" y="1428" text-anchor="middle">شرکت اور حصولِ تعلم کا دو سطری ریکارڈ، 9(1)۔</text><text class="" x="550" y="1462" text-anchor="middle">اساتذہ کا کمرہ: سات سیکنڈ کی اصلاح؛ خاندان کو بے دلچسپ نہ کہیں۔</text><rect class="box" x="60" y="1544" width="980" height="251" rx="12"/><text class="h" x="550" y="1583" text-anchor="middle">3۔ دروازے سے باہر: تحریری درخواست</text><text class="" x="550" y="1617" text-anchor="middle">ماہر: پہلے دیکھنا، منصوبہ، پھر مختصر کام۔</text><text class="" x="550" y="1651" text-anchor="middle">صحت خدمات اور لیڈی ہیلتھ ورکر: جانچ اور آلات کی معلومات؛ خاندان سے رابطے کی</text><text class="" x="550" y="1685" text-anchor="middle">رضامندی۔</text><text class="" x="550" y="1719" text-anchor="middle">تعلیمی دفتر: اہل آسامیاں، تعمیر، سروے۔</text><text class="" x="550" y="1753" text-anchor="middle">معذوری کی تنظیمیں اور خاندان: معلومات، وکالت، باہمی مدد۔</text><text class="muted" x="550" y="1870" text-anchor="middle">باہر کا موٹا تیر: بچے اور دفعہ کا نام، درخواست کی نقل۔ اندر کا ٹوٹا تیر:</text><text class="muted" x="550" y="1904" text-anchor="middle">بیرونی مدد استاد کے ذریعے بچے تک۔ دائرے 1–2 ابھی شروع کریں؛ دائرہ 3 مانگیں،</text><text class="muted" x="550" y="1938" text-anchor="middle">انتظار میں نہ رکیں۔</text><text class="wm" x="15" y="2022" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
