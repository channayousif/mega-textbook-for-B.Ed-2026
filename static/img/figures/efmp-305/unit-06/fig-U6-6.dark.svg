<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 3442" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A five-column table of the six members of a shared support plan - class teacher, parent or guardian, head teacher, visiting special educator, last year&#x27;s teacher and the class - giving for each what knowledge they uniquely hold, what they do, what they must not be asked to do, and the communication channel that actually reaches them, with a footer noting locally available members should be identified and the plan should work between specialist visits.</title><desc id="d">A five-column table of the six members of a shared support plan - class teacher, parent or guardian, head teacher, visiting special educator, last year&#x27;s teacher and the class - giving for each what knowledge they uniquely hold, what they do, what they must not be asked to do, and the communication channel that actually reaches them, with a footer noting locally available members should be identified and the plan should work between specialist visits.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="760" height="3442" fill="var(--bg)"/><text class="h" x="380" y="60" text-anchor="middle">Shared support: roles and workable channels</text><rect class="accent" x="20" y="110" width="720" height="69" rx="0"/><text class="h" x="380" y="146" text-anchor="middle">Class teacher</text><rect class="box" x="20" y="179" width="200" height="103" rx="0"/><rect class="box" x="220" y="179" width="520" height="103" rx="0"/><text class="h" x="120" y="215" text-anchor="middle">Unique</text><text class="h" x="120" y="249" text-anchor="middle">knowledge</text><text class="" x="480" y="215" text-anchor="middle">Child across subjects, six daily</text><text class="" x="480" y="249" text-anchor="middle">hours, sixty classmates</text><rect class="box" x="20" y="282" width="200" height="103" rx="0"/><rect class="box" x="220" y="282" width="520" height="103" rx="0"/><text class="h" x="120" y="318" text-anchor="middle">What they do</text><text class="" x="480" y="318" text-anchor="middle">Holds plan; weekly change; termly</text><text class="" x="480" y="352" text-anchor="middle">record; named-pupil/clause request</text><rect class="box" x="20" y="385" width="200" height="103" rx="0"/><rect class="box" x="220" y="385" width="520" height="103" rx="0"/><text class="h" x="120" y="421" text-anchor="middle">Do not ask</text><text class="h" x="120" y="455" text-anchor="middle">them to</text><text class="" x="480" y="421" text-anchor="middle">Diagnose, prescribe, or personally</text><text class="" x="480" y="455" text-anchor="middle">carry system failures</text><rect class="box" x="20" y="488" width="200" height="103" rx="0"/><rect class="box" x="220" y="488" width="520" height="103" rx="0"/><text class="h" x="120" y="524" text-anchor="middle">Working</text><text class="h" x="120" y="558" text-anchor="middle">channel</text><text class="" x="480" y="524" text-anchor="middle">Hub: everyone reaches teacher</text><rect class="accent" x="20" y="626" width="720" height="69" rx="0"/><text class="h" x="380" y="662" text-anchor="middle">Parent or guardian</text><rect class="box" x="20" y="695" width="200" height="103" rx="0"/><rect class="box" x="220" y="695" width="520" height="103" rx="0"/><text class="h" x="120" y="731" text-anchor="middle">Unique</text><text class="h" x="120" y="765" text-anchor="middle">knowledge</text><text class="" x="480" y="731" text-anchor="middle">History, home strengths, signals of</text><text class="" x="480" y="765" text-anchor="middle">confusion, hopes</text><rect class="box" x="20" y="798" width="200" height="103" rx="0"/><rect class="box" x="220" y="798" width="520" height="103" rx="0"/><text class="h" x="120" y="834" text-anchor="middle">What they do</text><text class="" x="480" y="834" text-anchor="middle">Four questions; one free action;</text><text class="" x="480" y="868" text-anchor="middle">weekly report in any form</text><rect class="box" x="20" y="901" width="200" height="103" rx="0"/><rect class="box" x="220" y="901" width="520" height="103" rx="0"/><text class="h" x="120" y="937" text-anchor="middle">Do not ask</text><text class="h" x="120" y="971" text-anchor="middle">them to</text><text class="" x="480" y="937" text-anchor="middle">Read a note, fixed-hour attendance,</text><text class="" x="480" y="971" text-anchor="middle">travel to office, pay</text><rect class="box" x="20" y="1004" width="200" height="103" rx="0"/><rect class="box" x="220" y="1004" width="520" height="103" rx="0"/><text class="h" x="120" y="1040" text-anchor="middle">Working</text><text class="h" x="120" y="1074" text-anchor="middle">channel</text><text class="" x="480" y="1040" text-anchor="middle">Relative’s voice note, older cousin</text><text class="" x="480" y="1074" text-anchor="middle">messenger, female teacher visit</text><rect class="accent" x="20" y="1142" width="720" height="69" rx="0"/><text class="h" x="380" y="1178" text-anchor="middle">Head teacher</text><rect class="box" x="20" y="1211" width="200" height="103" rx="0"/><rect class="box" x="220" y="1211" width="520" height="103" rx="0"/><text class="h" x="120" y="1247" text-anchor="middle">Unique</text><text class="h" x="120" y="1281" text-anchor="middle">knowledge</text><text class="" x="480" y="1247" text-anchor="middle">Register, timetable, room</text><text class="" x="480" y="1281" text-anchor="middle">allocation, signature</text><rect class="box" x="20" y="1314" width="200" height="103" rx="0"/><rect class="box" x="220" y="1314" width="520" height="103" rx="0"/><text class="h" x="120" y="1350" text-anchor="middle">What they do</text><text class="" x="480" y="1350" text-anchor="middle">Ground-floor room; signed</text><text class="" x="480" y="1384" text-anchor="middle">escalation; termly seating review</text><rect class="box" x="20" y="1417" width="200" height="103" rx="0"/><rect class="box" x="220" y="1417" width="520" height="103" rx="0"/><text class="h" x="120" y="1453" text-anchor="middle">Do not ask</text><text class="h" x="120" y="1487" text-anchor="middle">them to</text><text class="" x="480" y="1453" text-anchor="middle">Find money not held, or act alone</text><rect class="box" x="20" y="1520" width="200" height="103" rx="0"/><rect class="box" x="220" y="1520" width="520" height="103" rx="0"/><text class="h" x="120" y="1556" text-anchor="middle">Working</text><text class="h" x="120" y="1590" text-anchor="middle">channel</text><text class="" x="480" y="1556" text-anchor="middle">One page, in person: named pupil,</text><text class="" x="480" y="1590" text-anchor="middle">stated cost</text><rect class="accent" x="20" y="1658" width="720" height="69" rx="0"/><text class="h" x="380" y="1694" text-anchor="middle">Visiting special educator</text><rect class="box" x="20" y="1727" width="200" height="103" rx="0"/><rect class="box" x="220" y="1727" width="520" height="103" rx="0"/><text class="h" x="120" y="1763" text-anchor="middle">Unique</text><text class="h" x="120" y="1797" text-anchor="middle">knowledge</text><text class="" x="480" y="1763" text-anchor="middle">Impairment-specific strategies;</text><text class="" x="480" y="1797" text-anchor="middle">district resources</text><rect class="box" x="20" y="1830" width="200" height="137" rx="0"/><rect class="box" x="220" y="1830" width="520" height="137" rx="0"/><text class="h" x="120" y="1866" text-anchor="middle">What they do</text><text class="" x="480" y="1866" text-anchor="middle">Watch class, plan with teacher,</text><text class="" x="480" y="1900" text-anchor="middle">brief child check; leave two changes</text><text class="" x="480" y="1934" text-anchor="middle">for 29 days</text><rect class="box" x="20" y="1967" width="200" height="103" rx="0"/><rect class="box" x="220" y="1967" width="520" height="103" rx="0"/><text class="h" x="120" y="2003" text-anchor="middle">Do not ask</text><text class="h" x="120" y="2037" text-anchor="middle">them to</text><text class="" x="480" y="2003" text-anchor="middle">Routine withdrawal or take ownership</text><text class="" x="480" y="2037" text-anchor="middle">of inclusion</text><rect class="box" x="20" y="2070" width="200" height="103" rx="0"/><rect class="box" x="220" y="2070" width="520" height="103" rx="0"/><text class="h" x="120" y="2106" text-anchor="middle">Working</text><text class="h" x="120" y="2140" text-anchor="middle">channel</text><text class="" x="480" y="2106" text-anchor="middle">Next date written before leaving;</text><text class="" x="480" y="2140" text-anchor="middle">messages via head</text><rect class="accent" x="20" y="2208" width="720" height="69" rx="0"/><text class="h" x="380" y="2244" text-anchor="middle">Last year’s teacher</text><rect class="box" x="20" y="2277" width="200" height="103" rx="0"/><rect class="box" x="220" y="2277" width="520" height="103" rx="0"/><text class="h" x="120" y="2313" text-anchor="middle">Unique</text><text class="h" x="120" y="2347" text-anchor="middle">knowledge</text><text class="" x="480" y="2313" text-anchor="middle">Two hundred days of child-specific</text><text class="" x="480" y="2347" text-anchor="middle">experience</text><rect class="box" x="20" y="2380" width="200" height="137" rx="0"/><rect class="box" x="220" y="2380" width="520" height="137" rx="0"/><text class="h" x="120" y="2416" text-anchor="middle">What they do</text><text class="" x="480" y="2416" text-anchor="middle">Twenty-minute start-of-year</text><text class="" x="480" y="2450" text-anchor="middle">handover: what worked/failed, seat,</text><text class="" x="480" y="2484" text-anchor="middle">missed chances</text><rect class="box" x="20" y="2517" width="200" height="103" rx="0"/><rect class="box" x="220" y="2517" width="520" height="103" rx="0"/><text class="h" x="120" y="2553" text-anchor="middle">Do not ask</text><text class="h" x="120" y="2587" text-anchor="middle">them to</text><text class="" x="480" y="2553" text-anchor="middle">Accept blame for last year</text><rect class="box" x="20" y="2620" width="200" height="103" rx="0"/><rect class="box" x="220" y="2620" width="520" height="103" rx="0"/><text class="h" x="120" y="2656" text-anchor="middle">Working</text><text class="h" x="120" y="2690" text-anchor="middle">channel</text><text class="" x="480" y="2656" text-anchor="middle">Free staff-room conversation</text><rect class="accent" x="20" y="2758" width="720" height="69" rx="0"/><text class="h" x="380" y="2794" text-anchor="middle">Class</text><rect class="box" x="20" y="2827" width="200" height="103" rx="0"/><rect class="box" x="220" y="2827" width="520" height="103" rx="0"/><text class="h" x="120" y="2863" text-anchor="middle">Unique</text><text class="h" x="120" y="2897" text-anchor="middle">knowledge</text><text class="" x="480" y="2863" text-anchor="middle">Sixty pairs of hands; daily social</text><text class="" x="480" y="2897" text-anchor="middle">reality</text><rect class="box" x="20" y="2930" width="200" height="103" rx="0"/><rect class="box" x="220" y="2930" width="520" height="103" rx="0"/><text class="h" x="120" y="2966" text-anchor="middle">What they do</text><text class="" x="480" y="2966" text-anchor="middle">Buddy rota, structured pairs, check</text><text class="" x="480" y="3000" text-anchor="middle">instructions understood</text><rect class="box" x="20" y="3033" width="200" height="103" rx="0"/><rect class="box" x="220" y="3033" width="520" height="103" rx="0"/><text class="h" x="120" y="3069" text-anchor="middle">Do not ask</text><text class="h" x="120" y="3103" text-anchor="middle">them to</text><text class="" x="480" y="3069" text-anchor="middle">Permanent charge over a peer, or</text><text class="" x="480" y="3103" text-anchor="middle">vague “be kind”</text><rect class="box" x="20" y="3136" width="200" height="103" rx="0"/><rect class="box" x="220" y="3136" width="520" height="103" rx="0"/><text class="h" x="120" y="3172" text-anchor="middle">Working</text><text class="h" x="120" y="3206" text-anchor="middle">channel</text><text class="" x="480" y="3172" text-anchor="middle">Charter and rota on wall</text><text class="muted" x="380" y="3309" text-anchor="middle">Identify locally available members. Support</text><text class="muted" x="380" y="3343" text-anchor="middle">continues between specialist visits.</text><text class="wm" x="745" y="3427" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
