<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 3102" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول مشترک مدد کے منصوبے کے چھ شرکا کا علم، کام، وہ ذمہ داری جو ان پر نہیں ڈالنی، اور مؤثر رابطہ محفوظ رکھتا ہے؛ ہر ریکارڈ میں یہ پانچ اصل پہلو فون پر پڑھنے کے لیے عمودی رکھے گئے ہیں۔</title><desc id="d">جدول مشترک مدد کے منصوبے کے چھ شرکا کا علم، کام، وہ ذمہ داری جو ان پر نہیں ڈالنی، اور مؤثر رابطہ محفوظ رکھتا ہے؛ ہر ریکارڈ میں یہ پانچ اصل پہلو فون پر پڑھنے کے لیے عمودی رکھے گئے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="760" height="3102" fill="var(--bg)"/><text class="h" x="380" y="60" text-anchor="middle">مشترکہ معاونت منصوبہ: کردار اور رابطہ</text><rect class="accent" x="20" y="110" width="720" height="69" rx="0"/><text class="h" x="380" y="146" text-anchor="middle">جماعت کا استاد</text><rect class="box" x="540" y="179" width="200" height="103" rx="0"/><rect class="box" x="20" y="179" width="520" height="103" rx="0"/><text class="h" x="640" y="215" text-anchor="middle">خاص معلومات</text><text class="" x="280" y="215" text-anchor="middle">مختلف مضامین میں روز چھ گھنٹے، ساٹھ</text><text class="" x="280" y="249" text-anchor="middle">ساتھیوں کے ساتھ بچہ</text><rect class="box" x="540" y="282" width="200" height="103" rx="0"/><rect class="box" x="20" y="282" width="520" height="103" rx="0"/><text class="h" x="640" y="318" text-anchor="middle">اس کا کام</text><text class="" x="280" y="318" text-anchor="middle">منصوبہ رکھے؛ ہفتے کی تبدیلی؛ ٹرم کا</text><text class="" x="280" y="352" text-anchor="middle">ریکارڈ؛ بچے اور دفعہ والی درخواست</text><rect class="box" x="540" y="385" width="200" height="103" rx="0"/><rect class="box" x="20" y="385" width="520" height="103" rx="0"/><text class="h" x="640" y="421" text-anchor="middle">یہ ذمہ داری</text><text class="h" x="640" y="455" text-anchor="middle">نہ ڈالیں</text><text class="" x="280" y="421" text-anchor="middle">تشخیص، دوا، یا نظام کی ناکامی کا</text><text class="" x="280" y="455" text-anchor="middle">ذاتی بوجھ</text><rect class="box" x="540" y="488" width="200" height="69" rx="0"/><rect class="box" x="20" y="488" width="520" height="69" rx="0"/><text class="h" x="640" y="524" text-anchor="middle">مؤثر رابطہ</text><text class="" x="280" y="524" text-anchor="middle">مرکز: سب استاد تک پہنچیں</text><rect class="accent" x="20" y="592" width="720" height="69" rx="0"/><text class="h" x="380" y="628" text-anchor="middle">والد یا نگہداشت کرنے والا</text><rect class="box" x="540" y="661" width="200" height="103" rx="0"/><rect class="box" x="20" y="661" width="520" height="103" rx="0"/><text class="h" x="640" y="697" text-anchor="middle">خاص معلومات</text><text class="" x="280" y="697" text-anchor="middle">تاریخ، گھریلو خوبیاں، نہ سمجھنے کے</text><text class="" x="280" y="731" text-anchor="middle">اشارے، امیدیں</text><rect class="box" x="540" y="764" width="200" height="103" rx="0"/><rect class="box" x="20" y="764" width="520" height="103" rx="0"/><text class="h" x="640" y="800" text-anchor="middle">اس کا کام</text><text class="" x="280" y="800" text-anchor="middle">چار سوال؛ ایک مفت کام؛ ہفتہ وار کسی</text><text class="" x="280" y="834" text-anchor="middle">بھی صورت خبر</text><rect class="box" x="540" y="867" width="200" height="103" rx="0"/><rect class="box" x="20" y="867" width="520" height="103" rx="0"/><text class="h" x="640" y="903" text-anchor="middle">یہ ذمہ داری</text><text class="h" x="640" y="937" text-anchor="middle">نہ ڈالیں</text><text class="" x="280" y="903" text-anchor="middle">خط پڑھنا، مقرر وقت حاضری، دفتر کا</text><text class="" x="280" y="937" text-anchor="middle">سفر، ادائیگی</text><rect class="box" x="540" y="970" width="200" height="103" rx="0"/><rect class="box" x="20" y="970" width="520" height="103" rx="0"/><text class="h" x="640" y="1006" text-anchor="middle">مؤثر رابطہ</text><text class="" x="280" y="1006" text-anchor="middle">رشتہ دار کا صوتی پیغام، بڑا کزن،</text><text class="" x="280" y="1040" text-anchor="middle">خاتون استاد کا دورہ</text><rect class="accent" x="20" y="1108" width="720" height="69" rx="0"/><text class="h" x="380" y="1144" text-anchor="middle">صدر مدرس</text><rect class="box" x="540" y="1177" width="200" height="69" rx="0"/><rect class="box" x="20" y="1177" width="520" height="69" rx="0"/><text class="h" x="640" y="1213" text-anchor="middle">خاص معلومات</text><text class="" x="280" y="1213" text-anchor="middle">رجسٹر، وقت، کمرہ، دستخط</text><rect class="box" x="540" y="1246" width="200" height="103" rx="0"/><rect class="box" x="20" y="1246" width="520" height="103" rx="0"/><text class="h" x="640" y="1282" text-anchor="middle">اس کا کام</text><text class="" x="280" y="1282" text-anchor="middle">نچلی منزل، دستخط شدہ درخواست، ٹرم کی</text><text class="" x="280" y="1316" text-anchor="middle">نشست کا جائزہ</text><rect class="box" x="540" y="1349" width="200" height="103" rx="0"/><rect class="box" x="20" y="1349" width="520" height="103" rx="0"/><text class="h" x="640" y="1385" text-anchor="middle">یہ ذمہ داری</text><text class="h" x="640" y="1419" text-anchor="middle">نہ ڈالیں</text><text class="" x="280" y="1385" text-anchor="middle">جو رقم نہیں وہ ڈھونڈنا، یا اکیلے سب</text><text class="" x="280" y="1419" text-anchor="middle">کرنا</text><rect class="box" x="540" y="1452" width="200" height="69" rx="0"/><rect class="box" x="20" y="1452" width="520" height="69" rx="0"/><text class="h" x="640" y="1488" text-anchor="middle">مؤثر رابطہ</text><text class="" x="280" y="1488" text-anchor="middle">ایک صفحہ بالمشافہ: بچے کا نام، خرچ</text><rect class="accent" x="20" y="1556" width="720" height="69" rx="0"/><text class="h" x="380" y="1592" text-anchor="middle">دورے پر خصوصی استاد</text><rect class="box" x="540" y="1625" width="200" height="69" rx="0"/><rect class="box" x="20" y="1625" width="520" height="69" rx="0"/><text class="h" x="640" y="1661" text-anchor="middle">خاص معلومات</text><text class="" x="280" y="1661" text-anchor="middle">مخصوص معذوری کی تدابیر؛ ضلع کے وسائل</text><rect class="box" x="540" y="1694" width="200" height="103" rx="0"/><rect class="box" x="20" y="1694" width="520" height="103" rx="0"/><text class="h" x="640" y="1730" text-anchor="middle">اس کا کام</text><text class="" x="280" y="1730" text-anchor="middle">پہلے جماعت، پھر استاد سے منصوبہ، پھر</text><text class="" x="280" y="1764" text-anchor="middle">مختصر جانچ؛ 29 دن کے لیے دو تدابیر</text><rect class="box" x="540" y="1797" width="200" height="103" rx="0"/><rect class="box" x="20" y="1797" width="520" height="103" rx="0"/><text class="h" x="640" y="1833" text-anchor="middle">یہ ذمہ داری</text><text class="h" x="640" y="1867" text-anchor="middle">نہ ڈالیں</text><text class="" x="280" y="1833" text-anchor="middle">معمول کے طور پر بچے کو باہر لے جانا،</text><text class="" x="280" y="1867" text-anchor="middle">یا شمولیت کا اکیلا مالک بننا</text><rect class="box" x="540" y="1900" width="200" height="103" rx="0"/><rect class="box" x="20" y="1900" width="520" height="103" rx="0"/><text class="h" x="640" y="1936" text-anchor="middle">مؤثر رابطہ</text><text class="" x="280" y="1936" text-anchor="middle">جانے سے پہلے اگلی تاریخ؛ درمیان میں</text><text class="" x="280" y="1970" text-anchor="middle">صدر مدرس کے ذریعے پیغام</text><rect class="accent" x="20" y="2038" width="720" height="69" rx="0"/><text class="h" x="380" y="2074" text-anchor="middle">پچھلے سال کا استاد</text><rect class="box" x="540" y="2107" width="200" height="69" rx="0"/><rect class="box" x="20" y="2107" width="520" height="69" rx="0"/><text class="h" x="640" y="2143" text-anchor="middle">خاص معلومات</text><text class="" x="280" y="2143" text-anchor="middle">بچے کے بارے میں دو سو دن کا علم</text><rect class="box" x="540" y="2176" width="200" height="103" rx="0"/><rect class="box" x="20" y="2176" width="520" height="103" rx="0"/><text class="h" x="640" y="2212" text-anchor="middle">اس کا کام</text><text class="" x="280" y="2212" text-anchor="middle">سال کے آغاز میں بیس منٹ: کامیابی،</text><text class="" x="280" y="2246" text-anchor="middle">ناکامی، نشست، چھوٹے مواقع</text><rect class="box" x="540" y="2279" width="200" height="103" rx="0"/><rect class="box" x="20" y="2279" width="520" height="103" rx="0"/><text class="h" x="640" y="2315" text-anchor="middle">یہ ذمہ داری</text><text class="h" x="640" y="2349" text-anchor="middle">نہ ڈالیں</text><text class="" x="280" y="2315" text-anchor="middle">پچھلے سال کا الزام</text><rect class="box" x="540" y="2382" width="200" height="69" rx="0"/><rect class="box" x="20" y="2382" width="520" height="69" rx="0"/><text class="h" x="640" y="2418" text-anchor="middle">مؤثر رابطہ</text><text class="" x="280" y="2418" text-anchor="middle">اساتذہ کے کمرے میں مفت گفتگو</text><rect class="accent" x="20" y="2486" width="720" height="69" rx="0"/><text class="h" x="380" y="2522" text-anchor="middle">جماعت</text><rect class="box" x="540" y="2555" width="200" height="69" rx="0"/><rect class="box" x="20" y="2555" width="520" height="69" rx="0"/><text class="h" x="640" y="2591" text-anchor="middle">خاص معلومات</text><text class="" x="280" y="2591" text-anchor="middle">ساٹھ جوڑی ہاتھ؛ روزمرہ سماجی حقیقت</text><rect class="box" x="540" y="2624" width="200" height="103" rx="0"/><rect class="box" x="20" y="2624" width="520" height="103" rx="0"/><text class="h" x="640" y="2660" text-anchor="middle">اس کا کام</text><text class="" x="280" y="2660" text-anchor="middle">مدد کی باری، منظم جوڑے، ہدایت سمجھنے</text><text class="" x="280" y="2694" text-anchor="middle">کی جانچ</text><rect class="box" x="540" y="2727" width="200" height="103" rx="0"/><rect class="box" x="20" y="2727" width="520" height="103" rx="0"/><text class="h" x="640" y="2763" text-anchor="middle">یہ ذمہ داری</text><text class="h" x="640" y="2797" text-anchor="middle">نہ ڈالیں</text><text class="" x="280" y="2763" text-anchor="middle">ساتھی کی مستقل ذمہ داری یا صرف</text><text class="" x="280" y="2797" text-anchor="middle">“مہربان بنو”</text><rect class="box" x="540" y="2830" width="200" height="69" rx="0"/><rect class="box" x="20" y="2830" width="520" height="69" rx="0"/><text class="h" x="640" y="2866" text-anchor="middle">مؤثر رابطہ</text><text class="" x="280" y="2866" text-anchor="middle">دیوار پر عہدنامہ اور باری کی فہرست</text><text class="muted" x="380" y="2969" text-anchor="middle">مقامی طور پر دستیاب شرکا پہچانیں۔ ماہر کے دوروں</text><text class="muted" x="380" y="3003" text-anchor="middle">کے درمیان بھی مدد جاری رہے۔</text><text class="wm" x="15" y="3087" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
