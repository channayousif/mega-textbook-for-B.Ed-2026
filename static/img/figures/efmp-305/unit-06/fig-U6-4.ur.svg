<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 4792" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دس عملی رکاوٹوں کا جدول ہر رکاوٹ کی سطح، ذمہ دار، اسی ٹرم کی مفت تدبیر اور رقم مانگنے کے راستے کو محفوظ رکھتا ہے؛ برادری کا داغ مستقل شراکت مانگتا ہے۔</title><desc id="d">دس عملی رکاوٹوں کا جدول ہر رکاوٹ کی سطح، ذمہ دار، اسی ٹرم کی مفت تدبیر اور رقم مانگنے کے راستے کو محفوظ رکھتا ہے؛ برادری کا داغ مستقل شراکت مانگتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="760" height="4792" fill="var(--bg)"/><text class="h" x="380" y="60" text-anchor="middle">رکاوٹ: ذمہ دار، مفت تدبیر، وسائل</text><rect class="accent" x="20" y="110" width="720" height="69" rx="0"/><text class="h" x="380" y="146" text-anchor="middle">تیسری جماعت میں 81 بچے، ایک استاد</text><rect class="box" x="540" y="179" width="200" height="69" rx="0"/><rect class="box" x="20" y="179" width="520" height="69" rx="0"/><text class="h" x="640" y="215" text-anchor="middle">سطح</text><text class="" x="280" y="215" text-anchor="middle">2 اور 3</text><rect class="box" x="540" y="248" width="200" height="69" rx="0"/><rect class="box" x="20" y="248" width="520" height="69" rx="0"/><text class="h" x="640" y="284" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="284" text-anchor="middle">ضلع؛ کمرہ اور وقت صدر مدرس</text><rect class="box" x="540" y="317" width="200" height="103" rx="0"/><rect class="box" x="20" y="317" width="520" height="103" rx="0"/><text class="h" x="640" y="353" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="387" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="353" text-anchor="middle">طے شدہ جوڑے؛ پندرہ منٹ تربیت؛ اہم</text><text class="" x="280" y="387" text-anchor="middle">کام میں جگ سا</text><rect class="box" x="540" y="420" width="200" height="103" rx="0"/><rect class="box" x="20" y="420" width="520" height="103" rx="0"/><text class="h" x="640" y="456" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="490" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="456" text-anchor="middle">دوسری منظور شدہ آسامی؛ صدر مدرس کے</text><text class="" x="280" y="490" text-anchor="middle">ذریعے تعلقہ افسر کو درخواست</text><rect class="accent" x="20" y="558" width="720" height="69" rx="0"/><text class="h" x="380" y="594" text-anchor="middle">تین بچے زبانی ہدایت کھو دیتے ہیں</text><rect class="box" x="540" y="627" width="200" height="69" rx="0"/><rect class="box" x="20" y="627" width="520" height="69" rx="0"/><text class="h" x="640" y="663" text-anchor="middle">سطح</text><text class="" x="280" y="663" text-anchor="middle">4</text><rect class="box" x="540" y="696" width="200" height="69" rx="0"/><rect class="box" x="20" y="696" width="520" height="69" rx="0"/><text class="h" x="640" y="732" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="732" text-anchor="middle">جماعت کا استاد</text><rect class="box" x="540" y="765" width="200" height="103" rx="0"/><rect class="box" x="20" y="765" width="520" height="103" rx="0"/><text class="h" x="640" y="801" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="835" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="801" text-anchor="middle">اہم لفظ لکھیں؛ دو بار کہیں؛ سامنے</text><text class="" x="280" y="835" text-anchor="middle">منہ؛ تین بچے ہدایت جانچیں</text><rect class="box" x="540" y="868" width="200" height="103" rx="0"/><rect class="box" x="20" y="868" width="520" height="103" rx="0"/><text class="h" x="640" y="904" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="938" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="904" text-anchor="middle">کچھ نہیں</text><rect class="accent" x="20" y="1006" width="720" height="69" rx="0"/><text class="h" x="380" y="1042" text-anchor="middle">دو بچے تختہ نہیں دیکھ پاتے</text><rect class="box" x="540" y="1075" width="200" height="69" rx="0"/><rect class="box" x="20" y="1075" width="520" height="69" rx="0"/><text class="h" x="640" y="1111" text-anchor="middle">سطح</text><text class="" x="280" y="1111" text-anchor="middle">4، کچھ 3</text><rect class="box" x="540" y="1144" width="200" height="69" rx="0"/><rect class="box" x="20" y="1144" width="520" height="69" rx="0"/><text class="h" x="640" y="1180" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="1180" text-anchor="middle">استاد؛ ٹرم کی نشست کا جائزہ صدر مدرس</text><rect class="box" x="540" y="1213" width="200" height="103" rx="0"/><rect class="box" x="20" y="1213" width="520" height="103" rx="0"/><text class="h" x="640" y="1249" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="1283" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="1249" text-anchor="middle">قریب کی بدلتی نشست؛ ہر ٹرم نامزد</text><text class="" x="280" y="1283" text-anchor="middle">ضرورتوں کا جائزہ</text><rect class="box" x="540" y="1316" width="200" height="137" rx="0"/><rect class="box" x="20" y="1316" width="520" height="137" rx="0"/><text class="h" x="640" y="1352" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="1386" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="1352" text-anchor="middle">نشست مفت؛ جانچ، آلات اور مالی مدد</text><text class="" x="280" y="1386" text-anchor="middle">صحت ادارے سے پوچھیں؛ سفر سے پہلے</text><text class="" x="280" y="1420" text-anchor="middle">تصدیق</text><rect class="accent" x="20" y="1488" width="720" height="69" rx="0"/><text class="h" x="380" y="1524" text-anchor="middle">اشاروں یا بریل کا اہل استاد نہیں</text><rect class="box" x="540" y="1557" width="200" height="69" rx="0"/><rect class="box" x="20" y="1557" width="520" height="69" rx="0"/><text class="h" x="640" y="1593" text-anchor="middle">سطح</text><text class="" x="280" y="1593" text-anchor="middle">2</text><rect class="box" x="540" y="1626" width="200" height="69" rx="0"/><rect class="box" x="20" y="1626" width="520" height="69" rx="0"/><text class="h" x="640" y="1662" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="1662" text-anchor="middle">حکومت، دفعہ 9(2)</text><rect class="box" x="540" y="1695" width="200" height="103" rx="0"/><rect class="box" x="20" y="1695" width="520" height="103" rx="0"/><text class="h" x="640" y="1731" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="1765" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="1731" text-anchor="middle">دس اشارے؛ لب خوانی کے لیے پہلے</text><text class="" x="280" y="1765" text-anchor="middle">الفاظ؛ خاندان کا توجہ لینے کا طریقہ</text><rect class="box" x="540" y="1798" width="200" height="103" rx="0"/><rect class="box" x="20" y="1798" width="520" height="103" rx="0"/><text class="h" x="640" y="1834" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="1868" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="1834" text-anchor="middle">بچے اور دفعہ کے نام سے تربیت یافتہ</text><text class="" x="280" y="1868" text-anchor="middle">آسامی مانگیں؛ نقل رکھیں</text><rect class="accent" x="20" y="1936" width="720" height="69" rx="0"/><text class="h" x="380" y="1972" text-anchor="middle">ماں کبھی نہیں آئی؛ خط نہیں پڑھ سکتی</text><rect class="box" x="540" y="2005" width="200" height="69" rx="0"/><rect class="box" x="20" y="2005" width="520" height="69" rx="0"/><text class="h" x="640" y="2041" text-anchor="middle">سطح</text><text class="" x="280" y="2041" text-anchor="middle">3 اور 4</text><rect class="box" x="540" y="2074" width="200" height="69" rx="0"/><rect class="box" x="20" y="2074" width="520" height="69" rx="0"/><text class="h" x="640" y="2110" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="2110" text-anchor="middle">اسکول کی بنائی رکاوٹ</text><rect class="box" x="540" y="2143" width="200" height="103" rx="0"/><rect class="box" x="20" y="2143" width="520" height="103" rx="0"/><text class="h" x="640" y="2179" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="2213" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="2179" text-anchor="middle">مانوس پیغام رساں؛ گھر کی زبان، خوبی</text><text class="" x="280" y="2213" text-anchor="middle">سے آغاز؛ صوتی پیغام</text><rect class="box" x="540" y="2246" width="200" height="103" rx="0"/><rect class="box" x="20" y="2246" width="520" height="103" rx="0"/><text class="h" x="640" y="2282" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="2316" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="2282" text-anchor="middle">کچھ نہیں</text><rect class="accent" x="20" y="2384" width="720" height="69" rx="0"/><text class="h" x="380" y="2420" text-anchor="middle">خاندان برادری کی باتوں سے ڈرتا ہے</text><rect class="box" x="540" y="2453" width="200" height="69" rx="0"/><rect class="box" x="20" y="2453" width="520" height="69" rx="0"/><text class="h" x="640" y="2489" text-anchor="middle">سطح</text><text class="" x="280" y="2489" text-anchor="middle">برادری؛ چار سطحوں سے باہر</text><rect class="box" x="540" y="2522" width="200" height="69" rx="0"/><rect class="box" x="20" y="2522" width="520" height="69" rx="0"/><text class="h" x="640" y="2558" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="2558" text-anchor="middle">کوئی ایک ملازم قابو نہیں رکھتا</text><rect class="box" x="540" y="2591" width="200" height="103" rx="0"/><rect class="box" x="20" y="2591" width="520" height="103" rx="0"/><text class="h" x="640" y="2627" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="2661" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="2627" text-anchor="middle">جماعت میں داغ نہ چلنے دیں؛ خاندان</text><text class="" x="280" y="2661" text-anchor="middle">بچے سے یہ سنے</text><rect class="box" x="540" y="2694" width="200" height="103" rx="0"/><rect class="box" x="20" y="2694" width="520" height="103" rx="0"/><text class="h" x="640" y="2730" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="2764" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="2730" text-anchor="middle">خواہش مند خاندانوں اور حامیوں سے</text><text class="" x="280" y="2764" text-anchor="middle">مستقل شراکت؛ فوری وعدہ نہیں</text><rect class="accent" x="20" y="2832" width="720" height="69" rx="0"/><text class="h" x="380" y="2868" text-anchor="middle">ماہر ماہانہ بچے کو باہر لے جائے</text><rect class="box" x="540" y="2901" width="200" height="69" rx="0"/><rect class="box" x="20" y="2901" width="520" height="69" rx="0"/><text class="h" x="640" y="2937" text-anchor="middle">سطح</text><text class="" x="280" y="2937" text-anchor="middle">3</text><rect class="box" x="540" y="2970" width="200" height="69" rx="0"/><rect class="box" x="20" y="2970" width="520" height="69" rx="0"/><text class="h" x="640" y="3006" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="3006" text-anchor="middle">صدر مدرس دورہ طے کرے</text><rect class="box" x="540" y="3039" width="200" height="103" rx="0"/><rect class="box" x="20" y="3039" width="520" height="103" rx="0"/><text class="h" x="640" y="3075" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="3109" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="3075" text-anchor="middle">پہلے دیکھنا، پھر منصوبہ، پھر مختصر</text><text class="" x="280" y="3109" text-anchor="middle">کام؛ اگلی تاریخ لکھیں</text><rect class="box" x="540" y="3142" width="200" height="103" rx="0"/><rect class="box" x="20" y="3142" width="520" height="103" rx="0"/><text class="h" x="640" y="3178" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="3212" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="3178" text-anchor="middle">کچھ نہیں</text><rect class="accent" x="20" y="3280" width="720" height="69" rx="0"/><text class="h" x="380" y="3316" text-anchor="middle">کھیل یا وظیفے میں معذور بچے کا نام نہیں</text><rect class="box" x="540" y="3349" width="200" height="69" rx="0"/><rect class="box" x="20" y="3349" width="520" height="69" rx="0"/><text class="h" x="640" y="3385" text-anchor="middle">سطح</text><text class="" x="280" y="3385" text-anchor="middle">4</text><rect class="box" x="540" y="3418" width="200" height="69" rx="0"/><rect class="box" x="20" y="3418" width="520" height="69" rx="0"/><text class="h" x="640" y="3454" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="3454" text-anchor="middle">فارم بھرنے والا</text><rect class="box" x="540" y="3487" width="200" height="103" rx="0"/><rect class="box" x="20" y="3487" width="520" height="103" rx="0"/><text class="h" x="640" y="3523" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="3557" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="3523" text-anchor="middle">ہر انتخابی فارم کے ساتھ رجسٹر پڑھیں</text><rect class="box" x="540" y="3590" width="200" height="103" rx="0"/><rect class="box" x="20" y="3590" width="520" height="103" rx="0"/><text class="h" x="640" y="3626" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="3660" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="3626" text-anchor="middle">کچھ نہیں</text><rect class="accent" x="20" y="3728" width="720" height="69" rx="0"/><text class="h" x="380" y="3764" text-anchor="middle">سیڑھیاں، ناقابل رسائ