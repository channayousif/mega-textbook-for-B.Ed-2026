"4314" width="520" height="69" rx="0"/><text class="h" x="640" y="4350" text-anchor="middle">ذمہ دار</text><text class="" x="280" y="4350" text-anchor="middle">حکومت کا سہ سالہ سروے</text><rect class="box" x="540" y="4383" width="200" height="103" rx="0"/><rect class="box" x="20" y="4383" width="520" height="103" rx="0"/><text class="h" x="640" y="4419" text-anchor="middle">اسی ٹرم کی</text><text class="h" x="640" y="4453" text-anchor="middle">مفت تدبیر</text><text class="" x="280" y="4419" text-anchor="middle">اپنی جماعت کی درست گنتی اور مشاہدات</text><text class="" x="280" y="4453" text-anchor="middle">لکھیں</text><rect class="box" x="540" y="4486" width="200" height="103" rx="0"/><rect class="box" x="20" y="4486" width="520" height="103" rx="0"/><text class="h" x="640" y="4522" text-anchor="middle">رقم یا وسائل</text><text class="h" x="640" y="4556" text-anchor="middle">کس سے مانگیں</text><text class="" x="280" y="4522" text-anchor="middle">کچھ نہیں</text><text class="muted" x="380" y="4659" text-anchor="middle">ہر رکاوٹ پر فوری اقدام ہے؛ بعض میں بیرونی وسائل؛</text><text class="muted" x="380" y="4693" text-anchor="middle">برادری کے داغ کے لیے مستقل شراکت۔</text><text class="wm" x="15" y="4777" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
