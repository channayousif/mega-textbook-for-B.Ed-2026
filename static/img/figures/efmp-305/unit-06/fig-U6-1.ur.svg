<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1214" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشے میں معاون جماعتی ثقافت کے چار قابل مشاہدہ پہلو ہیں: کون بولتا، کون چنا جاتا، کس کی کیسے مدد ہوتی، اور غلطی پر کیا ہوتا ہے؛ استاد کا اپنا چھوٹا رویہ ان سب کو گھیرتا ہے۔</title><desc id="d">تصوری نقشے میں معاون جماعتی ثقافت کے چار قابل مشاہدہ پہلو ہیں: کون بولتا، کون چنا جاتا، کس کی کیسے مدد ہوتی، اور غلطی پر کیا ہوتا ہے؛ استاد کا اپنا چھوٹا رویہ ان سب کو گھیرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="1214" fill="var(--bg)"/><rect x="15" y="85" width="970" height="862" rx="45" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 7"/><path class="line" d="M500 215 V586 H245 V616" marker-end="url(#a)"/><path class="line" d="M500 215 V586 H755 V616" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H245 V295" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H755 V295" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">معاون جماعتی ثقافت</text><rect class="accent" x="300" y="100" width="400" height="115" rx="12"/><text class="h" x="500" y="139" text-anchor="middle">اس کمرے میں باقاعدگی سے کیا</text><text class="h" x="500" y="173" text-anchor="middle">ہوتا ہے؟</text><rect class="box" x="550" y="295" width="410" height="251" rx="12"/><text class="h" x="755" y="334" text-anchor="middle">کون بولتا ہے؟</text><text class="" x="755" y="368" text-anchor="middle">ہر ہفتے ہر بچے سے نام لے کر</text><text class="" x="755" y="402" text-anchor="middle">سوال۔</text><text class="" x="755" y="436" text-anchor="middle">جواب کے لیے کافی مہلت۔</text><text class="" x="755" y="470" text-anchor="middle">“سمجھ نہیں آیا” کہنا محفوظ۔</text><text class="" x="755" y="504" text-anchor="middle">استاد کے سوالوں کی گنتی دیکھیں۔</text><rect class="box" x="40" y="295" width="410" height="251" rx="12"/><text class="h" x="245" y="334" text-anchor="middle">کون چنا جاتا ہے؟</text><text class="" x="245" y="368" text-anchor="middle">اہم کام کے گروہ استاد بنائے۔</text><text class="" x="245" y="402" text-anchor="middle">کپتان ٹیمیں نہ چنیں۔</text><text class="" x="245" y="436" text-anchor="middle">دورے، مباحثے یا فارم سے پہلے</text><text class="" x="245" y="470" text-anchor="middle">رجسٹر پڑھیں۔</text><text class="" x="245" y="504" text-anchor="middle">باری بدلنا اصول ہو، احسان نہیں۔</text><rect class="box" x="550" y="616" width="410" height="251" rx="12"/><text class="h" x="755" y="655" text-anchor="middle">کس کی، کیسے مدد ہوتی ہے؟</text><text class="" x="755" y="689" text-anchor="middle">مدد محدود وقت کا کام ہو، کسی</text><text class="" x="755" y="723" text-anchor="middle">بچے کا مستقل چارج نہیں۔</text><text class="" x="755" y="757" text-anchor="middle">مددگار بدلیں۔</text><text class="" x="755" y="791" text-anchor="middle">مدد لینے والا بھی مدد دے۔</text><text class="" x="755" y="825" text-anchor="middle">صرف بقدر ضرورت مدد۔</text><rect class="box" x="40" y="616" width="410" height="251" rx="12"/><text class="h" x="245" y="655" text-anchor="middle">ناکامی پر کیا ہوتا ہے؟</text><text class="" x="245" y="689" text-anchor="middle">غلطی معمول ہو، چھپائی نہ جائے۔</text><text class="" x="245" y="723" text-anchor="middle">استاد اپنی اصلاح دکھائے۔</text><text class="" x="245" y="757" text-anchor="middle">بچانے کے لیے شرکت سے باہر نہ</text><text class="" x="245" y="791" text-anchor="middle">کریں۔</text><text class="" x="245" y="825" text-anchor="middle">دوسری کوشش معمول ہو۔</text><text class="muted" x="500" y="982" text-anchor="middle">استاد کا اپنا رویہ چاروں کو گھیرتا ہے: گھنٹی کے بعد کسے پانچ منٹ</text><text class="muted" x="500" y="1016" text-anchor="middle">ملتے ہیں، جماعت وہی سیکھتی ہے۔</text><text class="muted" x="500" y="1110" text-anchor="middle">مبصر ایک سبق میں ان کی گنتی کر سکتا ہے؛ یہ عمل ہیں، احساسات نہیں۔</text><text class="wm" x="15" y="1199" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
