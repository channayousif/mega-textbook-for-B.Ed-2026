<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 3624" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول ساٹھ بچوں کی جماعت کے لیے آٹھ ہمدردی اور ثقافت کی سرگرمیاں دکھاتا ہے؛ ہر سرگرمی کا کام، وقت، خرچ اور متعلقہ ثقافتی پہلو محفوظ ہے؛ کل سامان ایک چارٹ ہے۔</title><desc id="d">جدول ساٹھ بچوں کی جماعت کے لیے آٹھ ہمدردی اور ثقافت کی سرگرمیاں دکھاتا ہے؛ ہر سرگرمی کا کام، وقت، خرچ اور متعلقہ ثقافتی پہلو محفوظ ہے؛ کل سامان ایک چارٹ ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="760" height="3624" fill="var(--bg)"/><text class="h" x="380" y="60" text-anchor="middle">ہمدردی (Empathy): ساٹھ بچوں کی سرگرمیاں</text><rect class="accent" x="20" y="110" width="720" height="69" rx="0"/><text class="h" x="380" y="146" text-anchor="middle">دبی ہوئی ہدایت</text><rect class="box" x="540" y="179" width="200" height="103" rx="0"/><rect class="box" x="20" y="179" width="520" height="103" rx="0"/><text class="h" x="640" y="215" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="215" text-anchor="middle">استاد پشت کر کے آہستہ بولے؛ بچے سنی</text><text class="" x="280" y="249" text-anchor="middle">بات لکھیں، پھر بہتری کی فہرست دیں۔</text><rect class="box" x="540" y="282" width="200" height="69" rx="0"/><rect class="box" x="20" y="282" width="520" height="69" rx="0"/><text class="h" x="640" y="318" text-anchor="middle">وقت</text><text class="" x="280" y="318" text-anchor="middle">ایک بار 10 منٹ؛ سال بھر حوالہ</text><rect class="box" x="540" y="351" width="200" height="69" rx="0"/><rect class="box" x="20" y="351" width="520" height="69" rx="0"/><text class="h" x="640" y="387" text-anchor="middle">خرچ</text><text class="" x="280" y="387" text-anchor="middle">کچھ نہیں</text><rect class="box" x="540" y="420" width="200" height="69" rx="0"/><rect class="box" x="20" y="420" width="520" height="69" rx="0"/><text class="h" x="640" y="456" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="456" text-anchor="middle">کون بولتا ہے</text><rect class="accent" x="20" y="524" width="720" height="69" rx="0"/><text class="h" x="380" y="560" text-anchor="middle">جماعتی عہدنامہ</text><rect class="box" x="540" y="593" width="200" height="103" rx="0"/><rect class="box" x="20" y="593" width="520" height="103" rx="0"/><text class="h" x="640" y="629" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="629" text-anchor="middle">بچوں کے الفاظ اور گھریلو زبان میں چھ</text><text class="" x="280" y="663" text-anchor="middle">اصول؛ سب دستخط کریں۔</text><rect class="box" x="540" y="696" width="200" height="69" rx="0"/><rect class="box" x="20" y="696" width="520" height="69" rx="0"/><text class="h" x="640" y="732" text-anchor="middle">وقت</text><text class="" x="280" y="732" text-anchor="middle">40 منٹ؛ ماہانہ 5 منٹ جائزہ</text><rect class="box" x="540" y="765" width="200" height="69" rx="0"/><rect class="box" x="20" y="765" width="520" height="69" rx="0"/><text class="h" x="640" y="801" text-anchor="middle">خرچ</text><text class="" x="280" y="801" text-anchor="middle">ایک چارٹ</text><rect class="box" x="540" y="834" width="200" height="69" rx="0"/><rect class="box" x="20" y="834" width="520" height="69" rx="0"/><text class="h" x="640" y="870" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="870" text-anchor="middle">چاروں پہلو</text><rect class="accent" x="20" y="938" width="720" height="69" rx="0"/><text class="h" x="380" y="974" text-anchor="middle">طے شدہ جوڑے</text><rect class="box" x="540" y="1007" width="200" height="103" rx="0"/><rect class="box" x="20" y="1007" width="520" height="103" rx="0"/><text class="h" x="640" y="1043" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="1043" text-anchor="middle">استاد مختصر کام کے ساتھی مقرر کرے؛</text><text class="" x="280" y="1077" text-anchor="middle">ہفتہ وار تحریری باری۔</text><rect class="box" x="540" y="1110" width="200" height="69" rx="0"/><rect class="box" x="20" y="1110" width="520" height="69" rx="0"/><text class="h" x="640" y="1146" text-anchor="middle">وقت</text><text class="" x="280" y="1146" text-anchor="middle">اضافی وقت نہیں</text><rect class="box" x="540" y="1179" width="200" height="69" rx="0"/><rect class="box" x="20" y="1179" width="520" height="69" rx="0"/><text class="h" x="640" y="1215" text-anchor="middle">خرچ</text><text class="" x="280" y="1215" text-anchor="middle">کچھ نہیں</text><rect class="box" x="540" y="1248" width="200" height="69" rx="0"/><rect class="box" x="20" y="1248" width="520" height="69" rx="0"/><text class="h" x="640" y="1284" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="1284" text-anchor="middle">کون چنا جاتا ہے</text><rect class="accent" x="20" y="1352" width="720" height="69" rx="0"/><text class="h" x="380" y="1388" text-anchor="middle">جگ سا: ضروری حصہ</text><rect class="box" x="540" y="1421" width="200" height="103" rx="0"/><rect class="box" x="20" y="1421" width="520" height="103" rx="0"/><text class="h" x="640" y="1457" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="1457" text-anchor="middle">ہر بچے کے پاس ضروری معلومات، اس کے</text><text class="" x="280" y="1491" text-anchor="middle">پاس بھی جس سے دوسرے کتراتے ہیں۔</text><rect class="box" x="540" y="1524" width="200" height="69" rx="0"/><rect class="box" x="20" y="1524" width="520" height="69" rx="0"/><text class="h" x="640" y="1560" text-anchor="middle">وقت</text><text class="" x="280" y="1560" text-anchor="middle">ہر بار 25–30 منٹ</text><rect class="box" x="540" y="1593" width="200" height="69" rx="0"/><rect class="box" x="20" y="1593" width="520" height="69" rx="0"/><text class="h" x="640" y="1629" text-anchor="middle">خرچ</text><text class="" x="280" y="1629" text-anchor="middle">صرف چاک</text><rect class="box" x="540" y="1662" width="200" height="69" rx="0"/><rect class="box" x="20" y="1662" width="520" height="69" rx="0"/><text class="h" x="640" y="1698" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="1698" text-anchor="middle">کون چنا؛ کس کی مدد</text><rect class="accent" x="20" y="1766" width="720" height="69" rx="0"/><text class="h" x="380" y="1802" text-anchor="middle">مددگاروں کی باری</text><rect class="box" x="540" y="1835" width="200" height="103" rx="0"/><rect class="box" x="20" y="1835" width="520" height="103" rx="0"/><text class="h" x="640" y="1871" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="1871" text-anchor="middle">دو ساتھی، محدود کام؛ سب کی باری، مدد</text><text class="" x="280" y="1905" text-anchor="middle">لینے والے کی بھی۔</text><rect class="box" x="540" y="1938" width="200" height="69" rx="0"/><rect class="box" x="20" y="1938" width="520" height="69" rx="0"/><text class="h" x="640" y="1974" text-anchor="middle">وقت</text><text class="" x="280" y="1974" text-anchor="middle">15 منٹ تربیت؛ ہفتہ وار 2 منٹ</text><rect class="box" x="540" y="2007" width="200" height="69" rx="0"/><rect class="box" x="20" y="2007" width="520" height="69" rx="0"/><text class="h" x="640" y="2043" text-anchor="middle">خرچ</text><text class="" x="280" y="2043" text-anchor="middle">کچھ نہیں</text><rect class="box" x="540" y="2076" width="200" height="69" rx="0"/><rect class="box" x="20" y="2076" width="520" height="69" rx="0"/><text class="h" x="640" y="2112" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="2112" text-anchor="middle">کس کی کیسے مدد</text><rect class="accent" x="20" y="2180" width="720" height="69" rx="0"/><text class="h" x="380" y="2216" text-anchor="middle">ایک جملے میں نشان دہی</text><rect class="box" x="540" y="2249" width="200" height="103" rx="0"/><rect class="box" x="20" y="2249" width="520" height="103" rx="0"/><text class="h" x="640" y="2285" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="2285" text-anchor="middle">ہنسی یا اخراج کی متعین اصلاح؛ پھر</text><text class="" x="280" y="2319" text-anchor="middle">سبق جاری۔</text><rect class="box" x="540" y="2352" width="200" height="69" rx="0"/><rect class="box" x="20" y="2352" width="520" height="69" rx="0"/><text class="h" x="640" y="2388" text-anchor="middle">وقت</text><text class="" x="280" y="2388" text-anchor="middle">حسب ضرورت 7 سیکنڈ</text><rect class="box" x="540" y="2421" width="200" height="69" rx="0"/><rect class="box" x="20" y="2421" width="520" height="69" rx="0"/><text class="h" x="640" y="2457" text-anchor="middle">خرچ</text><text class="" x="280" y="2457" text-anchor="middle">کچھ نہیں</text><rect class="box" x="540" y="2490" width="200" height="69" rx="0"/><rect class="box" x="20" y="2490" width="520" height="69" rx="0"/><text class="h" x="640" y="2526" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="2526" text-anchor="middle">ناکامی پر ردعمل</text><rect class="accent" x="20" y="2594" width="720" height="69" rx="0"/><text class="h" x="380" y="2630" text-anchor="middle">عام لہجے میں تین سوال</text><rect class="box" x="540" y="2663" width="200" height="137" rx="0"/><rect class="box" x="20" y="2663" width="520" height="137" rx="0"/><text class="h" x="640" y="2699" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="2699" text-anchor="middle">جسے نازک سمجھتے ہیں، اسے نام سے بلا</text><text class="" x="280" y="2733" text-anchor="middle">کر جواب کے قابل سوال؛ ہفتے میں تین</text><text class="" x="280" y="2767" text-anchor="middle">بار۔</text><rect class="box" x="540" y="2800" width="200" height="69" rx="0"/><rect class="box" x="20" y="2800" width="520" height="69" rx="0"/><text class="h" x="640" y="2836" text-anchor="middle">وقت</text><text class="" x="280" y="2836" text-anchor="middle">ہفتہ وار 90 سیکنڈ</text><rect class="box" x="540" y="2869" width="200" height="69" rx="0"/><rect class="box" x="20" y="2869" width="520" height="69" rx="0"/><text class="h" x="640" y="2905" text-anchor="middle">خرچ</text><text class="" x="280" y="2905" text-anchor="middle">کچھ نہیں</text><rect class="box" x="540" y="2938" width="200" height="69" rx="0"/><rect class="box" x="20" y="2938" width="520" height="69" rx="0"/><text class="h" x="640" y="2974" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="2974" text-anchor="middle">کون بولتا؛ استاد کا اشارہ</text><rect class="accent" x="20" y="3042" width="720" height="69" rx="0"/><text class="h" x="380" y="3078" text-anchor="middle">مدد سے پہلے پوچھیں</text><rect class="box" x="540" y="3111" width="200" height="103" rx="0"/><rect class="box" x="20" y="3111" width="520" height="103" rx="0"/><text class="h" x="640" y="3147" text-anchor="middle">جماعت کیا کرے</text><text class="" x="280" y="3147" text-anchor="middle">پوچھیں، انکار قبول کریں؛ استاد بھی</text><text class="" x="280" y="3181" text-anchor="middle">اس کا نمونہ دے۔</text><rect class="box" x="540" y="3214" width="200" height="69" rx="0"/><rect class="box" x="20" y="3214" width="520" height="69" rx="0"/><text class="h" x="640" y="3250" text-anchor="middle">وقت</text><text class="" x="280" y="3250" text-anchor="middle">ایک بار نمونہ؛ پھر معمول</text><rect class="box" x="540" y="3283" width="200" height="69" rx="0"/><rect class="box" x="20" y="3283" width="520" height="69" rx="0"/><text class="h" x="640" y="3319" text-anchor="middle">خرچ</text><text class="" x="280" y="3319" text-anchor="middle">کچھ نہیں</text><rect class="box" x="540" y="3352" width="200" height="69" rx="0"/><rect class="box" x="20" y="3352" width="520" height="69" rx="0"/><text class="h" x="640" y="3388" text-anchor="middle">ثقافتی پہلو</text><text class="" x="280" y="3388" text-anchor="middle">کس کی کیسے مدد</text><text class="muted" x="380" y="3491" text-anchor="middle">آٹھوں کا کل سامان ایک چارٹ؛ نئی تیاری تقریباً</text><text class="muted" x="380" y="3525" text-anchor="middle">ایک گھنٹہ، صرف ایک بار۔</text><text class="wm" x="15" y="3609" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
