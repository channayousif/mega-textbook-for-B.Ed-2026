<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1072" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A side-by-side table comparing the 2009 policy with section 9 of the Sindh Act on five questions - who is addressed, how strong the verb is, whether inclusive education is defined, whether accommodation is addressed, and whether any mechanism exists - showing the policy silent or passive on four of the five and the Act specific on all five, with a footer noting that only the Act gives a parent something to bring to a head teacher.</title><desc id="d">A side-by-side table comparing the 2009 policy with section 9 of the Sindh Act on five questions - who is addressed, how strong the verb is, whether inclusive education is defined, whether accommodation is addressed, and whether any mechanism exists - showing the policy silent or passive on four of the five and the Act specific on all five, with a footer noting that only the Act gives a parent something to bring to a head teacher.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1072" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">A policy promise and a legal duty</text><rect class="accent" x="20" y="115" width="386" height="74" rx="0"/><text class="h" x="213.0" y="153" text-anchor="middle">Question</text><rect class="accent" x="406" y="115" width="386" height="74" rx="0"/><text class="h" x="599.0" y="153" text-anchor="middle">NEP 2009, s.2.4 actions 4–5</text><rect class="accent" x="792" y="115" width="388" height="74" rx="0"/><text class="h" x="986.0" y="153" text-anchor="middle">Sindh Act 2018, s.9</text><rect class="box" x="20" y="189" width="386" height="138" rx="0"/><text class="" x="213.0" y="225" text-anchor="middle">Who is addressed?</text><rect class="box" x="406" y="189" width="386" height="138" rx="0"/><text class="" x="599.0" y="225" text-anchor="middle">Government and</text><text class="" x="599.0" y="259" text-anchor="middle">provincial/area governments;</text><text class="" x="599.0" y="293" text-anchor="middle">no named school or pupil</text><rect class="box" x="792" y="189" width="388" height="138" rx="0"/><text class="" x="986.0" y="225" text-anchor="middle">Government and institutions</text><text class="" x="986.0" y="259" text-anchor="middle">funded or recognised by it</text><rect class="box" x="20" y="327" width="386" height="138" rx="0"/><text class="" x="213.0" y="363" text-anchor="middle">What verb?</text><rect class="box" x="406" y="327" width="386" height="138" rx="0"/><text class="" x="599.0" y="363" text-anchor="middle">Inclusion shall be promoted;</text><text class="" x="599.0" y="397" text-anchor="middle">special measures adopted</text><rect class="box" x="792" y="327" width="388" height="138" rx="0"/><text class="" x="986.0" y="363" text-anchor="middle">Shall endeavour ... and</text><text class="" x="986.0" y="397" text-anchor="middle">towards that end shall: ten</text><text class="" x="986.0" y="431" text-anchor="middle">duties</text><rect class="box" x="20" y="465" width="386" height="138" rx="0"/><text class="" x="213.0" y="501" text-anchor="middle">Definition?</text><rect class="box" x="406" y="465" width="386" height="138" rx="0"/><text class="" x="599.0" y="501" text-anchor="middle">No definition in these</text><text class="" x="599.0" y="535" text-anchor="middle">actions</text><rect class="box" x="792" y="465" width="388" height="138" rx="0"/><text class="" x="986.0" y="501" text-anchor="middle">s.2: pupils with and without</text><text class="" x="986.0" y="535" text-anchor="middle">disabilities learn together;</text><text class="" x="986.0" y="569" text-anchor="middle">teaching adapts</text><rect class="box" x="20" y="603" width="386" height="138" rx="0"/><text class="" x="213.0" y="639" text-anchor="middle">Accommodation?</text><rect class="box" x="406" y="603" width="386" height="138" rx="0"/><text class="" x="599.0" y="639" text-anchor="middle">Not addressed in the</text><text class="" x="599.0" y="673" text-anchor="middle">inclusion actions</text><rect class="box" x="792" y="603" width="388" height="138" rx="0"/><text class="" x="986.0" y="639" text-anchor="middle">Individual requirements;</text><text class="" x="986.0" y="673" text-anchor="middle">denial is discrimination</text><text class="" x="986.0" y="707" text-anchor="middle">(s.2)</text><rect class="box" x="20" y="741" width="386" height="172" rx="0"/><text class="" x="213.0" y="777" text-anchor="middle">Mechanism and route?</text><rect class="box" x="406" y="741" width="386" height="172" rx="0"/><text class="" x="599.0" y="777" text-anchor="middle">No date, reporting duty or</text><text class="" x="599.0" y="811" text-anchor="middle">complaint route in these</text><text class="" x="599.0" y="845" text-anchor="middle">actions</text><rect class="box" x="792" y="741" width="388" height="172" rx="0"/><text class="" x="986.0" y="777" text-anchor="middle">Authority, Council, Fund,</text><text class="" x="986.0" y="811" text-anchor="middle">special courts; three-yearly</text><text class="" x="986.0" y="845" text-anchor="middle">survey; access deadline</text><text class="" x="986.0" y="879" text-anchor="middle">s.6(11)</text><text class="muted" x="600.0" y="963" text-anchor="middle">Both point towards inclusion. The Act gives a parent a school duty to cite.</text><text class="wm" x="1185" y="1057" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
