<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1386" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول نو پالیسی اور عمل کے فرق کو دستاویز، نظام، اسکول یا جماعت کی سطح سے جوڑتا ہے؛ وجہ اور استاد کی عملی تدبیر ساتھ دی گئی ہیں، اور چھ صورتوں میں فوری مفت اقدام ممکن ہے۔</title><desc id="d">جدول نو پالیسی اور عمل کے فرق کو دستاویز، نظام، اسکول یا جماعت کی سطح سے جوڑتا ہے؛ وجہ اور استاد کی عملی تدبیر ساتھ دی گئی ہیں، اور چھ صورتوں میں فوری مفت اقدام ممکن ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1386" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">پالیسی اور عمل: اقدام کی سطح پہچانیں</text><rect class="accent" x="890" y="115" width="290" height="74" rx="0"/><text class="h" x="1035" y="153" text-anchor="middle">فرق</text><rect class="accent" x="600" y="115" width="290" height="74" rx="0"/><text class="h" x="745" y="153" text-anchor="middle">سطح</text><rect class="accent" x="310" y="115" width="290" height="74" rx="0"/><text class="h" x="455" y="153" text-anchor="middle">وہاں کی وجہ</text><rect class="accent" x="20" y="115" width="290" height="74" rx="0"/><text class="h" x="165" y="153" text-anchor="middle">استاد کیا کرے</text><rect class="box" x="890" y="189" width="290" height="104" rx="0"/><text class="" x="1035" y="225" text-anchor="middle">پالیسی کا وعدہ، متعین</text><text class="" x="1035" y="259" text-anchor="middle">فرض نہیں</text><rect class="box" x="600" y="189" width="290" height="104" rx="0"/><text class="" x="745" y="225" text-anchor="middle">1: دستاویز</text><rect class="box" x="310" y="189" width="290" height="104" rx="0"/><text class="" x="455" y="225" text-anchor="middle">تعریف، فرض، اعداد یا</text><text class="" x="455" y="259" text-anchor="middle">طریقہ نہیں</text><rect class="box" x="20" y="189" width="290" height="104" rx="0"/><text class="" x="165" y="225" text-anchor="middle">پالیسی کے ساتھ سندھ</text><text class="" x="165" y="259" text-anchor="middle">ایکٹ دفعہ 9 دیں</text><rect class="box" x="890" y="293" width="290" height="138" rx="0"/><text class="" x="1035" y="329" text-anchor="middle">اشاروں یا بریل کا اہل</text><text class="" x="1035" y="363" text-anchor="middle">استاد نہیں</text><rect class="box" x="600" y="293" width="290" height="138" rx="0"/><text class="" x="745" y="329" text-anchor="middle">2: نظام</text><rect class="box" x="310" y="293" width="290" height="138" rx="0"/><text class="" x="455" y="329" text-anchor="middle">تربیت یافتہ آسامی</text><text class="" x="455" y="363" text-anchor="middle">منظور نہیں؛ 9(2)</text><rect class="box" x="20" y="293" width="290" height="138" rx="0"/><text class="" x="165" y="329" text-anchor="middle">بچے اور دفعہ کے نام سے</text><text class="" x="165" y="363" text-anchor="middle">درخواست، نقل رکھیں؛ دس</text><text class="" x="165" y="397" text-anchor="middle">اشارے شروع</text><rect class="box" x="890" y="431" width="290" height="138" rx="0"/><text class="" x="1035" y="467" text-anchor="middle">علاقے میں بچوں کی</text><text class="" x="1035" y="501" text-anchor="middle">تعداد نامعلوم</text><rect class="box" x="600" y="431" width="290" height="138" rx="0"/><text class="" x="745" y="467" text-anchor="middle">2: نظام</text><rect class="box" x="310" y="431" width="290" height="138" rx="0"/><text class="" x="455" y="467" text-anchor="middle">سہ سالہ سروے اسکول تک</text><text class="" x="455" y="501" text-anchor="middle">نہیں آیا</text><rect class="box" x="20" y="431" width="290" height="138" rx="0"/><text class="" x="165" y="467" text-anchor="middle">اپنی جماعت کی دیانت</text><text class="" x="165" y="501" text-anchor="middle">دار گنتی؛ صدر مدرس سے</text><text class="" x="165" y="535" text-anchor="middle">سروے پوچھیں</text><rect class="box" x="890" y="569" width="290" height="104" rx="0"/><text class="" x="1035" y="605" text-anchor="middle">سیڑھیاں، ناقابل رسائی</text><text class="" x="1035" y="639" text-anchor="middle">بیت الخلا</text><rect class="box" x="600" y="569" width="290" height="104" rx="0"/><text class="" x="745" y="605" text-anchor="middle">2–3: نظام، اسکول</text><rect class="box" x="310" y="569" width="290" height="104" rx="0"/><text class="" x="455" y="605" text-anchor="middle">تخمینہ نہیں؛ رسائی</text><text class="" x="455" y="639" text-anchor="middle">دفعہ 6(11)</text><rect class="box" x="20" y="569" width="290" height="104" rx="0"/><text class="" x="165" y="605" text-anchor="middle">رسائی کا جائزہ، لاگت</text><text class="" x="165" y="639" text-anchor="middle">والی فہرست، نچلی منزل</text><rect class="box" x="890" y="673" width="290" height="138" rx="0"/><text class="" x="1035" y="709" text-anchor="middle">داخلہ ہے، حاضری کی</text><text class="" x="1035" y="743" text-anchor="middle">توقع نہیں</text><rect class="box" x="600" y="673" width="290" height="138" rx="0"/><text class="" x="745" y="709" text-anchor="middle">3: اسکول</text><rect class="box" x="310" y="673" width="290" height="138" rx="0"/><text class="" x="455" y="709" text-anchor="middle">داخلے کی گنتی؛ شرکت</text><text class="" x="455" y="743" text-anchor="middle">نظر انداز</text><rect class="box" x="20" y="673" width="290" height="138" rx="0"/><text class="" x="165" y="709" text-anchor="middle">شرکت اور حصولِ تعلم پر</text><text class="" x="165" y="743" text-anchor="middle">دو سطری سہ ماہی</text><text class="" x="165" y="777" text-anchor="middle">ریکارڈ، 9(1)</text><rect class="box" x="890" y="811" width="290" height="104" rx="0"/><text class="" x="1035" y="847" text-anchor="middle">املا سے پرچہ، وقت یا</text><text class="" x="1035" y="881" text-anchor="middle">کاتب نہیں</text><rect class="box" x="600" y="811" width="290" height="104" rx="0"/><text class="" x="745" y="847" text-anchor="middle">3: اسکول</text><rect class="box" x="310" y="811" width="290" height="104" rx="0"/><text class="" x="455" y="847" text-anchor="middle">پرچہ بنانے والے 9(2)</text><text class="" x="455" y="881" text-anchor="middle">سے ناواقف</text><rect class="box" x="20" y="811" width="290" height="104" rx="0"/><text class="" x="165" y="847" text-anchor="middle">امتحان سے پہلے تحریری</text><text class="" x="165" y="881" text-anchor="middle">سہولت مانگیں</text><rect class="box" x="890" y="915" width="290" height="104" rx="0"/><text class="" x="1035" y="951" text-anchor="middle">کم بصارت والا چوتھی</text><text class="" x="1035" y="985" text-anchor="middle">قطار میں</text><rect class="box" x="600" y="915" width="290" height="104" rx="0"/><text class="" x="745" y="951" text-anchor="middle">4: جماعت</text><rect class="box" x="310" y="915" width="290" height="104" rx="0"/><text class="" x="455" y="951" text-anchor="middle">نشست کا منصوبہ نہیں</text><text class="" x="455" y="985" text-anchor="middle">بدلا</text><rect class="box" x="20" y="915" width="290" height="104" rx="0"/><text class="" x="165" y="951" text-anchor="middle">اسی ہفتے نشست بدلیں؛</text><text class="" x="165" y="985" text-anchor="middle">ہر ٹرم جائزہ</text><rect class="box" x="890" y="1019" width="290" height="104" rx="0"/><text class="" x="1035" y="1055" text-anchor="middle">کمزور قاری سے کبھی نہ</text><text class="" x="1035" y="1089" text-anchor="middle">پڑھوانا</text><rect class="box" x="600" y="1019" width="290" height="104" rx="0"/><text class="" x="745" y="1055" text-anchor="middle">4: جماعت</text><rect class="box" x="310" y="1019" width="290" height="104" rx="0"/><text class="" x="455" y="1055" text-anchor="middle">کم توقع کو مہربانی</text><text class="" x="455" y="1089" text-anchor="middle">سمجھنا</text><rect class="box" x="20" y="1019" width="290" height="104" rx="0"/><text class="" x="165" y="1055" text-anchor="middle">دو جملے پہلے تیار؛ ہر</text><text class="" x="165" y="1089" text-anchor="middle">پندرہ دن؛ تبدیلی لکھیں</text><rect class="box" x="890" y="1123" width="290" height="104" rx="0"/><text class="" x="1035" y="1159" text-anchor="middle">کھیل یا وظیفے سے باہر</text><rect class="box" x="600" y="1123" width="290" height="104" rx="0"/><text class="" x="745" y="1159" text-anchor="middle">4: جماعت</text><rect class="box" x="310" y="1123" width="290" height="104" rx="0"/><text class="" x="455" y="1159" text-anchor="middle">فارم بھرتے وقت بچہ ذہن</text><text class="" x="455" y="1193" text-anchor="middle">میں نہیں</text><rect class="box" x="20" y="1123" width="290" height="104" rx="0"/><text class="" x="165" y="1159" text-anchor="middle">رجسٹر ساتھ رکھیں؛ نام</text><text class="" x="165" y="1193" text-anchor="middle">درج کریں</text><text class="muted" x="600" y="1277" text-anchor="middle">نو میں سے چھ میں اسی ہفتے مفت تدبیر ممکن ہے؛ صرف افسوس فرق ختم نہیں کرتا۔</text><text class="wm" x="15" y="1371" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
