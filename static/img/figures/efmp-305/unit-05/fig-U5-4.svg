<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1479" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A concept-map of the duties section 9 of the Sindh Act places on a government-funded school, with a central node and five branches - admission without discrimination, an accessible building and campus, case-by-case reasonable accommodation, individualised support and appropriate modes of communication, and monitoring of participation, attainment and completion - plus a side box listing what section 9(2) obliges the Government to supply to the school, and a footer noting that nine of the ten duties are available to a village school immediately while the tenth is a written request.</title><desc id="d">A concept-map of the duties section 9 of the Sindh Act places on a government-funded school, with a central node and five branches - admission without discrimination, an accessible building and campus, case-by-case reasonable accommodation, individualised support and appropriate modes of communication, and monitoring of participation, attainment and completion - plus a side box listing what section 9(2) obliges the Government to supply to the school, and a footer noting that nine of the ten duties are available to a village school immediately while the tenth is a written request.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="1479" fill="var(--bg)"/><path class="line" d="M755.0 867.0 H975 V1281 H920" marker-end="url(#a)" stroke-dasharray="8 6"/><path class="line" d="M245.0 799.0 H25 V1281 H80" marker-end="url(#a)" stroke-dasharray="8 6"/><path class="line" d="M500 215 V907 H245 V937" marker-end="url(#a)"/><path class="line" d="M500 215 V586 H755 V616" marker-end="url(#a)"/><path class="line" d="M500 215 V586 H245 V616" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H755 V295" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H245 V295" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">Sindh Act 2018: school responsibilities</text><rect class="accent" x="300" y="100" width="400" height="115" rx="12"/><text class="h" x="500.0" y="139" text-anchor="middle">Government-funded or</text><text class="h" x="500.0" y="173" text-anchor="middle">recognised institution: s.9</text><rect class="box" x="40" y="295" width="410" height="251" rx="12"/><text class="h" x="245.0" y="334" text-anchor="middle">Admission without</text><text class="h" x="245.0" y="368" text-anchor="middle">discrimination</text><text class="" x="245.0" y="402" text-anchor="middle">No disability refusal; no</text><text class="" x="245.0" y="436" text-anchor="middle">distant special school as</text><text class="" x="245.0" y="470" text-anchor="middle">substitute. Equal sport and</text><text class="" x="245.0" y="504" text-anchor="middle">recreation.</text><rect class="box" x="550" y="295" width="410" height="183" rx="12"/><text class="h" x="755.0" y="334" text-anchor="middle">Accessible campus</text><text class="" x="755.0" y="368" text-anchor="middle">Gate, classroom, aisle, seat,</text><text class="" x="755.0" y="402" text-anchor="middle">toilet and water. Code 2006;</text><text class="" x="755.0" y="436" text-anchor="middle">deadline s.6(11).</text><rect class="box" x="40" y="616" width="410" height="183" rx="12"/><text class="h" x="245.0" y="655" text-anchor="middle">Reasonable accommodation</text><text class="" x="245.0" y="689" text-anchor="middle">Necessary, appropriate, case by</text><text class="" x="245.0" y="723" text-anchor="middle">case. Individual requirements.</text><text class="" x="245.0" y="757" text-anchor="middle">Denial is discrimination, s.2.</text><rect class="box" x="550" y="616" width="410" height="251" rx="12"/><text class="h" x="755.0" y="655" text-anchor="middle">Individual support and modes</text><text class="" x="755.0" y="689" text-anchor="middle">Individualised support;</text><text class="" x="755.0" y="723" text-anchor="middle">appropriate language and modes</text><text class="" x="755.0" y="757" text-anchor="middle">for blind/deaf pupils; early</text><text class="" x="755.0" y="791" text-anchor="middle">identification of specific</text><text class="" x="755.0" y="825" text-anchor="middle">learning disabilities.</text><rect class="box" x="40" y="937" width="410" height="149" rx="12"/><text class="h" x="245.0" y="976" text-anchor="middle">Monitor each pupil</text><text class="" x="245.0" y="1010" text-anchor="middle">Participation; attainment;</text><text class="" x="245.0" y="1044" text-anchor="middle">completion.</text><rect class="accent" x="80" y="1231" width="840" height="183" rx="12"/><text class="h" x="500.0" y="1270" text-anchor="middle">What Government owes the school: s.9(2)</text><text class="" x="500.0" y="1304" text-anchor="middle">Teacher training; sign/Braille teachers; free</text><text class="" x="500.0" y="1338" text-anchor="middle">books/materials/devices to 18; examination time, scribe,</text><text class="" x="500.0" y="1372" text-anchor="middle">language exemption and age relaxation.</text><text class="wm" x="985" y="1464" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
