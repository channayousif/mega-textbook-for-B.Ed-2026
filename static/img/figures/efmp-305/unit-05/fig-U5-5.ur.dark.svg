<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1285" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ خانوں کا چکر یقین، فیصلے، بچے کے تجربے، رویے اور استاد کو نظر آنے والے ثبوت کو ملاتا ہے؛ قانونی ذمہ داری فیصلے پر، اور بچے کی کامیابی کا مشاہدہ ثبوت پر اثر ڈالتا ہے۔</title><desc id="d">پانچ خانوں کا چکر یقین، فیصلے، بچے کے تجربے، رویے اور استاد کو نظر آنے والے ثبوت کو ملاتا ہے؛ قانونی ذمہ داری فیصلے پر، اور بچے کی کامیابی کا مشاہدہ ثبوت پر اثر ڈالتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1100" height="1285" fill="var(--bg)"/><line class="line" x1="620" y1="180" x2="480" y2="180" marker-end="url(#a)"/><line class="line" x1="270" y1="269" x2="270" y2="430" marker-end="url(#a)"/><path class="line" d="M270 579 V824.5 H340" marker-end="url(#a)"/><path class="line" d="M760 824.5 H830 V579" marker-end="url(#a)"/><line class="line" x1="830" y1="430" x2="830" y2="235" marker-end="url(#a)"/><path class="line" d="M480 145 H570 V95 H830 V120" marker-end="url(#a)" stroke-dasharray="8 6"/><line class="line" x1="20" y1="210" x2="60" y2="210" marker-end="url(#a)"/><line class="line" x1="1080" y1="500" x2="1040" y2="500" marker-end="url(#a)"/><text class="h" x="550" y="60" text-anchor="middle">رویے اور عمل کا چکر</text><rect class="box" x="620" y="120" width="420" height="115" rx="12"/><text class="h" x="830" y="159" text-anchor="middle">1۔ یقین</text><text class="" x="830" y="193" text-anchor="middle">یہ بچہ کیا کر سکتا ہے؟</text><rect class="box" x="60" y="120" width="420" height="149" rx="12"/><text class="h" x="270" y="159" text-anchor="middle">2۔ فیصلہ</text><text class="" x="270" y="193" text-anchor="middle">کس سے سوال، کہاں نشست، کس کا</text><text class="" x="270" y="227" text-anchor="middle">اندراج، کس سے کوشش کی توقع؟</text><rect class="box" x="60" y="430" width="420" height="149" rx="12"/><text class="h" x="270" y="469" text-anchor="middle">3۔ بچے کا تجربہ</text><text class="" x="270" y="503" text-anchor="middle">بلایا یا چھوڑا گیا؛ دیکھا یا نظر</text><text class="" x="270" y="537" text-anchor="middle">انداز کیا گیا۔</text><rect class="box" x="340" y="750" width="420" height="149" rx="12"/><text class="h" x="550" y="789" text-anchor="middle">4۔ بچے کا رویہ</text><text class="" x="550" y="823" text-anchor="middle">شریک ہو یا پیچھے ہٹے؛ کوشش کرے</text><text class="" x="550" y="857" text-anchor="middle">یا چھوڑ دے۔</text><rect class="box" x="620" y="430" width="420" height="149" rx="12"/><text class="h" x="830" y="469" text-anchor="middle">5۔ استاد کو نظر آنے والا ثبوت</text><text class="" x="830" y="503" text-anchor="middle">اب بچہ کیا کرنے کے قابل دکھائی</text><text class="" x="830" y="537" text-anchor="middle">دیتا ہے؟</text><text class="muted" x="550" y="989" text-anchor="middle">فیصلہ سے یقین کی طرف اندرونی چکر پہلے ہفتے سے چلتا ہے۔</text><text class="muted" x="550" y="1073" text-anchor="middle">قانونی ذمہ داری فیصلے پر اثر ڈالتی ہے؛ کامیاب ہوتے بچے کا مشاہدہ ثبوت</text><text class="muted" x="550" y="1107" text-anchor="middle">پر۔</text><text class="muted" x="550" y="1186" text-anchor="middle">کوئی نتیجہ چاہتا نہیں؛ سب اسے بنانے میں حصہ لیتے ہیں۔</text><text class="wm" x="15" y="1270" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
