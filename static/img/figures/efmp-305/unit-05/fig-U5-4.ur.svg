<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1377" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشہ سندھ ایکٹ کی دفعہ 9 کی پانچ اسکولی ذمہ داریاں دکھاتا ہے؛ الگ مربوط خانہ حکومت کی تربیت، اہل اساتذہ، مفت مواد اور امتحانی سہولتوں کی ذمہ داریاں بتاتا ہے۔</title><desc id="d">تصوری نقشہ سندھ ایکٹ کی دفعہ 9 کی پانچ اسکولی ذمہ داریاں دکھاتا ہے؛ الگ مربوط خانہ حکومت کی تربیت، اہل اساتذہ، مفت مواد اور امتحانی سہولتوں کی ذمہ داریاں بتاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1000" height="1377" fill="var(--bg)"/><path class="line" d="M245 765 H25 V1179 H80" marker-end="url(#a)" stroke-dasharray="8 6"/><path class="line" d="M755 765 H975 V1179 H920" marker-end="url(#a)" stroke-dasharray="8 6"/><path class="line" d="M500 215 V805 H755 V835" marker-end="url(#a)"/><path class="line" d="M500 215 V552 H245 V582" marker-end="url(#a)"/><path class="line" d="M500 215 V552 H755 V582" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H245 V295" marker-end="url(#a)"/><path class="line" d="M500 215 V265 H755 V295" marker-end="url(#a)"/><text class="h" x="500" y="60" text-anchor="middle">سندھ ایکٹ 2018: اسکول کے فرائض</text><rect class="accent" x="300" y="100" width="400" height="115" rx="12"/><text class="h" x="500" y="139" text-anchor="middle">سرکاری مدد یا تسلیم شدہ</text><text class="h" x="500" y="173" text-anchor="middle">ادارہ: دفعہ 9</text><rect class="box" x="550" y="295" width="410" height="183" rx="12"/><text class="h" x="755" y="334" text-anchor="middle">بلا امتیاز داخلہ</text><text class="" x="755" y="368" text-anchor="middle">معذوری پر انکار نہیں؛ دور خصوصی</text><text class="" x="755" y="402" text-anchor="middle">اسکول متبادل نہیں۔ کھیل اور</text><text class="" x="755" y="436" text-anchor="middle">تفریح میں مساوات۔</text><rect class="box" x="40" y="295" width="410" height="217" rx="12"/><text class="h" x="245" y="334" text-anchor="middle">عمارت تک رسائی</text><text class="h" x="245" y="368" text-anchor="middle">(Accessibility)</text><text class="" x="245" y="402" text-anchor="middle">دروازہ، جماعت، راستہ، نشست، بیت</text><text class="" x="245" y="436" text-anchor="middle">الخلا اور پانی۔ ضابطہ 2006؛</text><text class="" x="245" y="470" text-anchor="middle">مہلت 6(11)۔</text><rect class="box" x="550" y="582" width="410" height="183" rx="12"/><text class="h" x="755" y="621" text-anchor="middle">معقول سہولت کاری (Reasonable</text><text class="h" x="755" y="655" text-anchor="middle">accommodation)</text><text class="" x="755" y="689" text-anchor="middle">ضروری، مناسب، ہر فرد کی ضرورت؛</text><text class="" x="755" y="723" text-anchor="middle">انکار امتیاز ہے، دفعہ 2۔</text><rect class="box" x="40" y="582" width="410" height="183" rx="12"/><text class="h" x="245" y="621" text-anchor="middle">انفرادی مدد اور موزوں طریقے</text><text class="" x="245" y="655" text-anchor="middle">انفرادی مدد؛ نابینا اور بہرے</text><text class="" x="245" y="689" text-anchor="middle">بچوں کی موزوں زبانیں اور طریقے؛</text><text class="" x="245" y="723" text-anchor="middle">مخصوص دشواری کی جلد شناخت۔</text><rect class="box" x="550" y="835" width="410" height="149" rx="12"/><text class="h" x="755" y="874" text-anchor="middle">ہر بچے کی پیش رفت</text><text class="" x="755" y="908" text-anchor="middle">شرکت، حصولِ تعلم، تعلیم کی</text><text class="" x="755" y="942" text-anchor="middle">تکمیل۔</text><rect class="accent" x="80" y="1129" width="840" height="183" rx="12"/><text class="h" x="500" y="1168" text-anchor="middle">حکومت اسکول کو کیا دے: دفعہ 9(2)</text><text class="" x="500" y="1202" text-anchor="middle">اساتذہ کی تربیت؛ اشاروں اور بریل کے اہل استاد؛ 18 سال تک مفت</text><text class="" x="500" y="1236" text-anchor="middle">کتابیں، مواد، آلات؛ امتحانی وقت، کاتب، زبان کا استثنا، عمر کی</text><text class="" x="500" y="1270" text-anchor="middle">رعایت۔</text><text class="wm" x="15" y="1362" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
