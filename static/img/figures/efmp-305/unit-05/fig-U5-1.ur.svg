<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زمانی لکیر 1981 سے 2020 تک چھ سنگ میل دکھاتی ہے؛ 2010 کی اٹھارہویں ترمیم صوبائی اختیار کی حد واضح کرتی ہے، 2011 کی توثیق الگ درج ہے، اور پالیسی کے وعدے کو قانونی ذمہ داری سے الگ کیا گیا ہے۔</title><desc id="d">زمانی لکیر 1981 سے 2020 تک چھ سنگ میل دکھاتی ہے؛ 2010 کی اٹھارہویں ترمیم صوبائی اختیار کی حد واضح کرتی ہے، 2011 کی توثیق الگ درج ہے، اور پالیسی کے وعدے کو قانونی ذمہ داری سے الگ کیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1040" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">قانونی سنگ میل اور علاقائی دائرہ</text><line class="line" x1="1155" y1="150" x2="45" y2="150" marker-end="url(#a)"/><line class="line" x1="1085" y1="135" x2="1085" y2="180"/><text class="h" x="1085" y="118" text-anchor="middle">1981</text><rect class="box" x="995" y="200" width="180" height="217" rx="12"/><text class="h" x="1085" y="239" text-anchor="middle">1981</text><text class="" x="1085" y="273" text-anchor="middle">روزگار کا</text><text class="" x="1085" y="307" text-anchor="middle">کوٹہ؛ فلاحی</text><text class="" x="1085" y="341" text-anchor="middle">رخ؛ اسکول کی</text><text class="" x="1085" y="375" text-anchor="middle">ذمہ داری نہیں</text><line class="line" x1="890" y1="135" x2="890" y2="180"/><text class="h" x="890" y="118" text-anchor="middle">2006</text><rect class="box" x="800" y="200" width="180" height="285" rx="12"/><text class="h" x="890" y="239" text-anchor="middle">2006</text><text class="" x="890" y="273" text-anchor="middle">معذور افراد</text><text class="" x="890" y="307" text-anchor="middle">کے حقوق کا</text><text class="" x="890" y="341" text-anchor="middle">اقوام متحدہ</text><text class="" x="890" y="375" text-anchor="middle">کا کنونشن؛</text><text class="" x="890" y="409" text-anchor="middle">دفعہ 24</text><text class="" x="890" y="443" text-anchor="middle">شمولیتی نظام</text><line class="line" x1="695" y1="135" x2="695" y2="180"/><text class="h" x="695" y="118" text-anchor="middle">2009</text><rect class="box" x="605" y="200" width="180" height="319" rx="12"/><text class="h" x="695" y="239" text-anchor="middle">2009</text><text class="" x="695" y="273" text-anchor="middle">قومی تعلیمی</text><text class="" x="695" y="307" text-anchor="middle">پالیسی؛ دو</text><text class="" x="695" y="341" text-anchor="middle">شمولیتی</text><text class="" x="695" y="375" text-anchor="middle">اقدامات،</text><text class="" x="695" y="409" text-anchor="middle">اسکول کی</text><text class="" x="695" y="443" text-anchor="middle">متعین ذمہ</text><text class="" x="695" y="477" text-anchor="middle">داری نہیں</text><line class="line" x1="500" y1="135" x2="500" y2="180"/><text class="h" x="500" y="118" text-anchor="middle">2010</text><rect class="box" x="410" y="200" width="180" height="285" rx="12"/><text class="h" x="500" y="239" text-anchor="middle">2010</text><text class="" x="500" y="273" text-anchor="middle">اٹھارہویں</text><text class="" x="500" y="307" text-anchor="middle">ترمیم؛ تعلیم</text><text class="" x="500" y="341" text-anchor="middle">اور معذور</text><text class="" x="500" y="375" text-anchor="middle">افراد کی</text><text class="" x="500" y="409" text-anchor="middle">بہبود صوبائی</text><text class="" x="500" y="443" text-anchor="middle">امور</text><line class="line" x1="305" y1="135" x2="305" y2="180"/><text class="h" x="305" y="118" text-anchor="middle">2018</text><rect class="box" x="215" y="200" width="180" height="285" rx="12"/><text class="h" x="305" y="239" text-anchor="middle">2018</text><text class="" x="305" y="273" text-anchor="middle">سندھ ایکٹ؛</text><text class="" x="305" y="307" text-anchor="middle">دفعہ 9،</text><text class="" x="305" y="341" text-anchor="middle">سرکاری مدد یا</text><text class="" x="305" y="375" text-anchor="middle">تسلیم شدہ</text><text class="" x="305" y="409" text-anchor="middle">اداروں کی ذمہ</text><text class="" x="305" y="443" text-anchor="middle">داریاں</text><line class="line" x1="110" y1="135" x2="110" y2="180"/><text class="h" x="110" y="118" text-anchor="middle">2020</text><rect class="box" x="20" y="200" width="180" height="217" rx="12"/><text class="h" x="110" y="239" text-anchor="middle">2020</text><text class="" x="110" y="273" text-anchor="middle">آئی سی ٹی</text><text class="" x="110" y="307" text-anchor="middle">ایکٹ؛ صرف</text><text class="" x="110" y="341" text-anchor="middle">اسلام آباد کی</text><text class="" x="110" y="375" text-anchor="middle">حدود</text><line class="line" x1="590" y1="80" x2="590" y2="690" stroke-dasharray="8 6"/><rect class="box" x="600" y="715" width="575" height="80" rx="0"/><rect class="accent" x="25" y="715" width="565" height="80" rx="0"/><text class="" x="890" y="755" text-anchor="middle">وفاقی و بین الاقوامی سنگ میل</text><text class="" x="310" y="750" text-anchor="middle">اختیارات کی منتقلی کے بعد: صوبائی قوانین</text><text class="" x="600" y="850" text-anchor="middle">2011: پاکستان نے 25 اکتوبر کو کنونشن کی توثیق کی۔</text><text class="" x="600" y="925" text-anchor="middle">پالیسی وعدہ کرتی ہے؛ ایکٹ ذمہ داری عائد کرتا ہے۔ متعلقہ قانون صوبائی دائرے سے طے</text><text class="" x="600" y="959" text-anchor="middle">ہوتا ہے۔</text><text class="wm" x="15" y="1025" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
