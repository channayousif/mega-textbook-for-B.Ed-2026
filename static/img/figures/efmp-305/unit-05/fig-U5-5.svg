<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1285" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A closed five-box cycle diagram showing belief leading to everyday decisions, decisions shaping a pupil&#x27;s experience, experience shaping the pupil&#x27;s behaviour, and that behaviour becoming the evidence that confirms the original belief, with two arrows from outside showing that a legal duty intervenes at the decision stage while contact with a pupil succeeding intervenes at the evidence stage, and a footer noting that nobody intends the outcome while everybody produces it.</title><desc id="d">A closed five-box cycle diagram showing belief leading to everyday decisions, decisions shaping a pupil&#x27;s experience, experience shaping the pupil&#x27;s behaviour, and that behaviour becoming the evidence that confirms the original belief, with two arrows from outside showing that a legal duty intervenes at the decision stage while contact with a pupil succeeding intervenes at the evidence stage, and a footer noting that nobody intends the outcome while everybody produces it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1100" height="1285" fill="var(--bg)"/><line class="line" x1="480" y1="180" x2="620" y2="180" marker-end="url(#a)"/><line class="line" x1="830" y1="269" x2="830" y2="430" marker-end="url(#a)"/><path class="line" d="M830 579 V824.5 H760" marker-end="url(#a)"/><path class="line" d="M340 824.5 H270 V579" marker-end="url(#a)"/><line class="line" x1="270" y1="430" x2="270" y2="235" marker-end="url(#a)"/><path class="line" d="M620 145 H530 V95 H270 V120" marker-end="url(#a)" stroke-dasharray="8 6"/><line class="line" x1="1080" y1="210" x2="1040" y2="210" marker-end="url(#a)"/><line class="line" x1="20" y1="500" x2="60" y2="500" marker-end="url(#a)"/><text class="h" x="550" y="60" text-anchor="middle">The attitude-action cycle</text><rect class="box" x="60" y="120" width="420" height="115" rx="12"/><text class="h" x="270.0" y="159" text-anchor="middle">1. Belief</text><text class="" x="270.0" y="193" text-anchor="middle">What can this pupil do?</text><rect class="box" x="620" y="120" width="420" height="149" rx="12"/><text class="h" x="830.0" y="159" text-anchor="middle">2. Decision</text><text class="" x="830.0" y="193" text-anchor="middle">Who answers, sits where, is</text><text class="" x="830.0" y="227" text-anchor="middle">entered and is expected to try?</text><rect class="box" x="620" y="430" width="420" height="149" rx="12"/><text class="h" x="830.0" y="469" text-anchor="middle">3. Pupil’s experience</text><text class="" x="830.0" y="503" text-anchor="middle">Asked or skipped; seen or</text><text class="" x="830.0" y="537" text-anchor="middle">overlooked.</text><rect class="box" x="340" y="750" width="420" height="149" rx="12"/><text class="h" x="550.0" y="789" text-anchor="middle">4. Pupil’s behaviour</text><text class="" x="550.0" y="823" text-anchor="middle">Participates or withdraws;</text><text class="" x="550.0" y="857" text-anchor="middle">attempts or stops.</text><rect class="box" x="60" y="430" width="420" height="149" rx="12"/><text class="h" x="270.0" y="469" text-anchor="middle">5. Evidence the teacher sees</text><text class="" x="270.0" y="503" text-anchor="middle">What the pupil now appears able</text><text class="" x="270.0" y="537" text-anchor="middle">to do.</text><text class="muted" x="550" y="989" text-anchor="middle">Decision → Belief: the inner loop is already running from week one.</text><text class="muted" x="550" y="1073" text-anchor="middle">A declared legal duty enters at Decision. Contact with a pupil</text><text class="muted" x="550" y="1107" text-anchor="middle">succeeding enters at Evidence.</text><text class="muted" x="550" y="1186" text-anchor="middle">Nobody intends the outcome; everybody helps produce it.</text><text class="wm" x="1085" y="1270" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
