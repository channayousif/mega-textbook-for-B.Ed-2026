<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1112" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول سندھ 2018 اور آئی سی ٹی 2020 کے قوانین کو آٹھ تعلیمی سوالوں پر ملاتا ہے؛ سہولت کاری کی یکساں تعریف کے باوجود علاقہ، ذمہ داری اور طریقہ مختلف ہیں، اور سندھ کے اسکول پر سندھ کا قانون لاگو ہوتا ہے۔</title><desc id="d">جدول سندھ 2018 اور آئی سی ٹی 2020 کے قوانین کو آٹھ تعلیمی سوالوں پر ملاتا ہے؛ سہولت کاری کی یکساں تعریف کے باوجود علاقہ، ذمہ داری اور طریقہ مختلف ہیں، اور سندھ کے اسکول پر سندھ کا قانون لاگو ہوتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1112" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">دو قوانین: اسکول کی ذمہ داریاں</text><rect class="accent" x="794" y="115" width="386" height="108" rx="0"/><text class="h" x="987" y="153" text-anchor="middle">سوال</text><rect class="accent" x="408" y="115" width="386" height="108" rx="0"/><text class="h" x="601" y="153" text-anchor="middle">سندھ ایکٹ 2018: سندھ</text><rect class="accent" x="20" y="115" width="388" height="108" rx="0"/><text class="h" x="214" y="153" text-anchor="middle">آئی سی ٹی ایکٹ 2020: صرف</text><text class="h" x="214" y="187" text-anchor="middle">اسلام آباد</text><rect class="box" x="794" y="223" width="386" height="70" rx="0"/><text class="" x="987" y="259" text-anchor="middle">علاقہ، دفعہ 1</text><rect class="box" x="408" y="223" width="386" height="70" rx="0"/><text class="" x="601" y="259" text-anchor="middle">پورا صوبہ سندھ</text><rect class="box" x="20" y="223" width="388" height="70" rx="0"/><text class="" x="214" y="259" text-anchor="middle">اسلام آباد کی وفاقی حدود</text><rect class="box" x="794" y="293" width="386" height="70" rx="0"/><text class="" x="987" y="329" text-anchor="middle">ادارے، دفعہ 9</text><rect class="box" x="408" y="293" width="386" height="70" rx="0"/><text class="" x="601" y="329" text-anchor="middle">سرکاری مدد یا تسلیم شدہ ادارے</text><rect class="box" x="20" y="293" width="388" height="70" rx="0"/><text class="" x="214" y="329" text-anchor="middle">سرکاری اور نجی ادارے</text><rect class="box" x="794" y="363" width="386" height="104" rx="0"/><text class="" x="987" y="399" text-anchor="middle">داخلہ</text><rect class="box" x="408" y="363" width="386" height="104" rx="0"/><text class="" x="601" y="399" text-anchor="middle">بلا امتیاز؛ کھیل اور تفریح</text><text class="" x="601" y="433" text-anchor="middle">میں مساوی مواقع</text><rect class="box" x="20" y="363" width="388" height="104" rx="0"/><text class="" x="214" y="399" text-anchor="middle">معذوری کی بنا پر داخلے سے</text><text class="" x="214" y="433" text-anchor="middle">انکار نہیں</text><rect class="box" x="794" y="467" width="386" height="104" rx="0"/><text class="" x="987" y="503" text-anchor="middle">ذمہ داری کی قوت</text><rect class="box" x="408" y="467" width="386" height="104" rx="0"/><text class="" x="601" y="503" text-anchor="middle">کوشش کرے گی؛ اس غرض سے دس</text><text class="" x="601" y="537" text-anchor="middle">متعین فرائض</text><rect class="box" x="20" y="467" width="388" height="104" rx="0"/><text class="" x="214" y="503" text-anchor="middle">تمام ضروری اقدامات؛ تعلیمی</text><text class="" x="214" y="537" text-anchor="middle">امتیاز قابل سزا، 9(5)</text><rect class="box" x="794" y="571" width="386" height="104" rx="0"/><text class="" x="987" y="607" text-anchor="middle">معقول سہولت کاری (Reasonable</text><text class="" x="987" y="641" text-anchor="middle">accommodation)</text><rect class="box" x="408" y="571" width="386" height="104" rx="0"/><text class="" x="601" y="607" text-anchor="middle">انفرادی ضروریات، 9(1)؛ تعریف</text><text class="" x="601" y="641" text-anchor="middle">دفعہ 2</text><rect class="box" x="20" y="571" width="388" height="104" rx="0"/><text class="" x="214" y="607" text-anchor="middle">مناسب سہولت، حسب موقع ہاسٹل</text><text class="" x="214" y="641" text-anchor="middle">بھی، 9(7)</text><rect class="box" x="794" y="675" width="386" height="70" rx="0"/><text class="" x="987" y="711" text-anchor="middle">سہولت سے انکار</text><rect class="box" x="408" y="675" width="386" height="70" rx="0"/><text class="" x="601" y="711" text-anchor="middle">دفعہ 2 کے تحت امتیاز</text><rect class="box" x="20" y="675" width="388" height="70" rx="0"/><text class="" x="214" y="711" text-anchor="middle">دفعہ 2 کے تحت امتیاز</text><rect class="box" x="794" y="745" width="386" height="104" rx="0"/><text class="" x="987" y="781" text-anchor="middle">عمارت تک رسائی</text><rect class="box" x="408" y="745" width="386" height="104" rx="0"/><text class="" x="601" y="781" text-anchor="middle">9(1)؛ سرکاری عمارت کی پانچ</text><text class="" x="601" y="815" text-anchor="middle">سالہ مہلت، 6(11)</text><rect class="box" x="20" y="745" width="388" height="104" rx="0"/><text class="" x="214" y="781" text-anchor="middle">ایکٹ کی رسائی کی دفعات، دفعہ</text><text class="" x="214" y="815" text-anchor="middle">9 سے باہر</text><rect class="box" x="794" y="849" width="386" height="104" rx="0"/><text class="" x="987" y="885" text-anchor="middle">مفت تعلیم</text><rect class="box" x="408" y="849" width="386" height="104" rx="0"/><text class="" x="601" y="885" text-anchor="middle">دفعہ 9 میں نہیں؛ 18 سال تک</text><text class="" x="601" y="919" text-anchor="middle">مفت مواد اور آلات؛ بعض وظائف</text><rect class="box" x="20" y="849" width="388" height="104" rx="0"/><text class="" x="214" y="885" text-anchor="middle">قبل ابتدائی تا اعلیٰ تعلیم</text><text class="" x="214" y="919" text-anchor="middle">مفت، 9(2)</text><text class="muted" x="600" y="1003" text-anchor="middle">تعریف ملتی ہے، علاقہ نہیں۔ سندھ کے اسکول کے لیے سندھ کا ایکٹ پڑھیں۔</text><text class="wm" x="15" y="1097" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
