<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1282" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A three-column table comparing the Sindh Act of 2018 with the federal ICT Act of 2020 across eight questions that touch a school - territory, who is bound, admission, how strong the duty is, reasonable accommodation, denial of accommodation, accessible buildings and free education - showing the two Acts sharing an almost identical definition of reasonable accommodation while differing in territory, verb strength and mechanism, with a note that only the Sindh Act governs a Sindh school.</title><desc id="d">A three-column table comparing the Sindh Act of 2018 with the federal ICT Act of 2020 across eight questions that touch a school - territory, who is bound, admission, how strong the duty is, reasonable accommodation, denial of accommodation, accessible buildings and free education - showing the two Acts sharing an almost identical definition of reasonable accommodation while differing in territory, verb strength and mechanism, with a note that only the Sindh Act governs a Sindh school.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1282" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">Two Acts: duties touching a school</text><rect class="accent" x="20" y="115" width="386" height="74" rx="0"/><text class="h" x="213.0" y="153" text-anchor="middle">Question</text><rect class="accent" x="406" y="115" width="386" height="74" rx="0"/><text class="h" x="599.0" y="153" text-anchor="middle">Sindh Act 2018: Sindh</text><rect class="accent" x="792" y="115" width="388" height="74" rx="0"/><text class="h" x="986.0" y="153" text-anchor="middle">ICT Act 2020: Islamabad only</text><rect class="box" x="20" y="189" width="386" height="70" rx="0"/><text class="" x="213.0" y="225" text-anchor="middle">Territory, s.1</text><rect class="box" x="406" y="189" width="386" height="70" rx="0"/><text class="" x="599.0" y="225" text-anchor="middle">Whole province of Sindh</text><rect class="box" x="792" y="189" width="388" height="70" rx="0"/><text class="" x="986.0" y="225" text-anchor="middle">Islamabad Capital Territory</text><rect class="box" x="20" y="259" width="386" height="104" rx="0"/><text class="" x="213.0" y="295" text-anchor="middle">Institutions, s.9</text><rect class="box" x="406" y="259" width="386" height="104" rx="0"/><text class="" x="599.0" y="295" text-anchor="middle">Government-funded or</text><text class="" x="599.0" y="329" text-anchor="middle">recognised institutions</text><rect class="box" x="792" y="259" width="388" height="104" rx="0"/><text class="" x="986.0" y="295" text-anchor="middle">Government and private</text><text class="" x="986.0" y="329" text-anchor="middle">institutions</text><rect class="box" x="20" y="363" width="386" height="104" rx="0"/><text class="" x="213.0" y="399" text-anchor="middle">Admission</text><rect class="box" x="406" y="363" width="386" height="104" rx="0"/><text class="" x="599.0" y="399" text-anchor="middle">Without discrimination; equal</text><text class="" x="599.0" y="433" text-anchor="middle">sport and recreation</text><rect class="box" x="792" y="363" width="388" height="104" rx="0"/><text class="" x="986.0" y="399" text-anchor="middle">Cannot deny admission because</text><text class="" x="986.0" y="433" text-anchor="middle">of disability</text><rect class="box" x="20" y="467" width="386" height="138" rx="0"/><text class="" x="213.0" y="503" text-anchor="middle">Strength of duty</text><rect class="box" x="406" y="467" width="386" height="138" rx="0"/><text class="" x="599.0" y="503" text-anchor="middle">Shall endeavour ... towards</text><text class="" x="599.0" y="537" text-anchor="middle">that end shall: ten duties</text><rect class="box" x="792" y="467" width="388" height="138" rx="0"/><text class="" x="986.0" y="503" text-anchor="middle">All necessary measures;</text><text class="" x="986.0" y="537" text-anchor="middle">education discrimination</text><text class="" x="986.0" y="571" text-anchor="middle">punishable, s.9(5)</text><rect class="box" x="20" y="605" width="386" height="138" rx="0"/><text class="" x="213.0" y="641" text-anchor="middle">Reasonable accommodation</text><rect class="box" x="406" y="605" width="386" height="138" rx="0"/><text class="" x="599.0" y="641" text-anchor="middle">Individual requirements,</text><text class="" x="599.0" y="675" text-anchor="middle">s.9(1); definition s.2</text><rect class="box" x="792" y="605" width="388" height="138" rx="0"/><text class="" x="986.0" y="641" text-anchor="middle">Reasonable and appropriate,</text><text class="" x="986.0" y="675" text-anchor="middle">including hostels where</text><text class="" x="986.0" y="709" text-anchor="middle">applicable, s.9(7)</text><rect class="box" x="20" y="743" width="386" height="70" rx="0"/><text class="" x="213.0" y="779" text-anchor="middle">Denial of accommodation</text><rect class="box" x="406" y="743" width="386" height="70" rx="0"/><text class="" x="599.0" y="779" text-anchor="middle">Discrimination under s.2</text><rect class="box" x="792" y="743" width="388" height="70" rx="0"/><text class="" x="986.0" y="779" text-anchor="middle">Discrimination under s.2</text><rect class="box" x="20" y="813" width="386" height="138" rx="0"/><text class="" x="213.0" y="849" text-anchor="middle">Accessible buildings</text><rect class="box" x="406" y="813" width="386" height="138" rx="0"/><text class="" x="599.0" y="849" text-anchor="middle">s.9(1); five-year</text><text class="" x="599.0" y="883" text-anchor="middle">public-building deadline</text><text class="" x="599.0" y="917" text-anchor="middle">s.6(11)</text><rect class="box" x="792" y="813" width="388" height="138" rx="0"/><text class="" x="986.0" y="849" text-anchor="middle">Act’s access provisions,</text><text class="" x="986.0" y="883" text-anchor="middle">outside s.9</text><rect class="box" x="20" y="951" width="386" height="138" rx="0"/><text class="" x="213.0" y="987" text-anchor="middle">Free education</text><rect class="box" x="406" y="951" width="386" height="138" rx="0"/><text class="" x="599.0" y="987" text-anchor="middle">Not stated in s.9; materials</text><text class="" x="599.0" y="1021" text-anchor="middle">and devices free to age 18;</text><text class="" x="599.0" y="1055" text-anchor="middle">some scholarships</text><rect class="box" x="792" y="951" width="388" height="138" rx="0"/><text class="" x="986.0" y="987" text-anchor="middle">Free pre-primary to higher</text><text class="" x="986.0" y="1021" text-anchor="middle">education, s.9(2)</text><text class="muted" x="600.0" y="1139" text-anchor="middle">Shared definition does not mean shared territory. Use the Sindh Act for a Sindh</text><text class="muted" x="600.0" y="1173" text-anchor="middle">school.</text><text class="wm" x="1185" y="1267" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
