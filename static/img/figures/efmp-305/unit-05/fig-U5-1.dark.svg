</text><text class="" x="700.0" y="273" text-anchor="middle">18th</text><text class="" x="700.0" y="307" text-anchor="middle">Amendment:</text><text class="" x="700.0" y="341" text-anchor="middle">education and</text><text class="" x="700.0" y="375" text-anchor="middle">disability</text><text class="" x="700.0" y="409" text-anchor="middle">welfare</text><text class="" x="700.0" y="443" text-anchor="middle">devolved</text><line class="line" x1="895" y1="135" x2="895" y2="180"/><text class="h" x="895" y="118" text-anchor="middle">2018</text><rect class="box" x="805" y="200" width="180" height="285" rx="12"/><text class="h" x="895.0" y="239" text-anchor="middle">2018</text><text class="" x="895.0" y="273" text-anchor="middle">Sindh Act,</text><text class="" x="895.0" y="307" text-anchor="middle">s.9: duties</text><text class="" x="895.0" y="341" text-anchor="middle">on</text><text class="" x="895.0" y="375" text-anchor="middle">government-funded</text><text class="" x="895.0" y="409" text-anchor="middle">or recognised</text><text class="" x="895.0" y="443" text-anchor="middle">institutions</text><line class="line" x1="1090" y1="135" x2="1090" y2="180"/><text class="h" x="1090" y="118" text-anchor="middle">2020</text><rect class="box" x="1000" y="200" width="180" height="251" rx="12"/><text class="h" x="1090.0" y="239" text-anchor="middle">2020</text><text class="" x="1090.0" y="273" text-anchor="middle">ICT Act:</text><text class="" x="1090.0" y="307" text-anchor="middle">Islamabad</text><text class="" x="1090.0" y="341" text-anchor="middle">Capital</text><text class="" x="1090.0" y="375" text-anchor="middle">Territory</text><text class="" x="1090.0" y="409" text-anchor="middle">only</text><line class="line" x1="610" y1="80" x2="610" y2="690" stroke-dasharray="8 6"/><rect class="box" x="25" y="715" width="575" height="80" rx="0"/><rect class="accent" x="610" y="715" width="565" height="80" rx="0"/><text class="" x="310" y="755" text-anchor="middle">Federal / international instruments</text><text class="" x="890" y="750" text-anchor="middle">After devolution: provincial instruments</text><text class="" x="600" y="850" text-anchor="middle">2011 sub-marker: Pakistan ratified CRPD on 25 October 2011.</text><text class="" x="600" y="925" text-anchor="middle">A policy promises; an Act imposes a duty. Devolution determines which Act</text><text class="" x="600" y="959" text-anchor="middle">applies.</text><text class="wm" x="1185" y="1025" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
