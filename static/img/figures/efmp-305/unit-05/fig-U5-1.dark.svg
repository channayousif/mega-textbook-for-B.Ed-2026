<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A left-to-right timeline of six Pakistani and international milestones from the 1981 Disabled Persons Ordinance to the federal ICT Act of 2020, with the 18th Amendment of 2010 marked as a dividing line after which the instruments that bind a Sindh school are provincial, and a caption distinguishing a policy promise from a legal duty.</title><desc id="d">A left-to-right timeline of six Pakistani and international milestones from the 1981 Disabled Persons Ordinance to the federal ICT Act of 2020, with the 18th Amendment of 2010 marked as a dividing line after which the instruments that bind a Sindh school are provincial, and a caption distinguishing a policy promise from a legal duty.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1040" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">Milestones and jurisdiction</text><line class="line" x1="45" y1="150" x2="1155" y2="150" marker-end="url(#a)"/><line class="line" x1="115" y1="135" x2="115" y2="180"/><text class="h" x="115" y="118" text-anchor="middle">1981</text><rect class="box" x="25" y="200" width="180" height="251" rx="12"/><text class=