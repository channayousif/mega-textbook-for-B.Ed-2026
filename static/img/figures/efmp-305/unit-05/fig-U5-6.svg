<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1488" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif"><title id="t">A four-column table of nine common policy-to-practice gaps, each assigned to one of four levels - document, system, school or classroom - with the cause at that level and a concrete action available to a classroom teacher, and a footer noting that six of the nine have a free teacher-level action available immediately.</title><desc id="d">A four-column table of nine common policy-to-practice gaps, each assigned to one of four levels - document, system, school or classroom - with the cause at that level and a concrete action available to a classroom teacher, and a footer noting that six of the nine have a free teacher-level action available immediately.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1488" fill="var(--bg)"/><text class="h" x="600.0" y="60" text-anchor="middle">Policy-to-practice gaps: locate the action</text><rect class="accent" x="20" y="115" width="290" height="74" rx="0"/><text class="h" x="165.0" y="153" text-anchor="middle">Gap</text><rect class="accent" x="310" y="115" width="290" height="74" rx="0"/><text class="h" x="455.0" y="153" text-anchor="middle">Level</text><rect class="accent" x="600" y="115" width="290" height="74" rx="0"/><text class="h" x="745.0" y="153" text-anchor="middle">Cause there</text><rect class="accent" x="890" y="115" width="290" height="74" rx="0"/><text class="h" x="1035.0" y="153" text-anchor="middle">Teacher action</text><rect class="box" x="20" y="189" width="290" height="104" rx="0"/><text class="" x="165.0" y="225" text-anchor="middle">Policy promises</text><text class="" x="165.0" y="259" text-anchor="middle">without duty</text><rect class="box" x="310" y="189" width="290" height="104" rx="0"/><text class="" x="455.0" y="225" text-anchor="middle">1: document</text><rect class="box" x="600" y="189" width="290" height="104" rx="0"/><text class="" x="745.0" y="225" text-anchor="middle">No definition, duty,</text><text class="" x="745.0" y="259" text-anchor="middle">data or mechanism</text><rect class="box" x="890" y="189" width="290" height="104" rx="0"/><text class="" x="1035.0" y="225" text-anchor="middle">Cite Sindh Act s.9</text><text class="" x="1035.0" y="259" text-anchor="middle">beside the policy</text><rect class="box" x="20" y="293" width="290" height="138" rx="0"/><text class="" x="165.0" y="329" text-anchor="middle">No</text><text class="" x="165.0" y="363" text-anchor="middle">sign/Braille-qualified</text><text class="" x="165.0" y="397" text-anchor="middle">teacher</text><rect class="box" x="310" y="293" width="290" height="138" rx="0"/><text class="" x="455.0" y="329" text-anchor="middle">2: system</text><rect class="box" x="600" y="293" width="290" height="138" rx="0"/><text class="" x="745.0" y="329" text-anchor="middle">No sanctioned trained</text><text class="" x="745.0" y="363" text-anchor="middle">post; s.9(2)</text><rect class="box" x="890" y="293" width="290" height="138" rx="0"/><text class="" x="1035.0" y="329" text-anchor="middle">Name pupil and clause</text><text class="" x="1035.0" y="363" text-anchor="middle">in request; keep copy;</text><text class="" x="1035.0" y="397" text-anchor="middle">begin ten signs</text><rect class="box" x="20" y="431" width="290" height="138" rx="0"/><text class="" x="165.0" y="467" text-anchor="middle">No catchment</text><text class="" x="165.0" y="501" text-anchor="middle">disability count</text><rect class="box" x="310" y="431" width="290" height="138" rx="0"/><text class="" x="455.0" y="467" text-anchor="middle">2: system</text><rect class="box" x="600" y="431" width="290" height="138" rx="0"/><text class="" x="745.0" y="467" text-anchor="middle">Three-yearly survey</text><text class="" x="745.0" y="501" text-anchor="middle">not reaching school</text><rect class="box" x="890" y="431" width="290" height="138" rx="0"/><text class="" x="1035.0" y="467" text-anchor="middle">Count own class</text><text class="" x="1035.0" y="501" text-anchor="middle">honestly; ask head</text><text class="" x="1035.0" y="535" text-anchor="middle">about survey</text><rect class="box" x="20" y="569" width="290" height="138" rx="0"/><text class="" x="165.0" y="605" text-anchor="middle">Steps and inaccessible</text><text class="" x="165.0" y="639" text-anchor="middle">toilet</text><rect class="box" x="310" y="569" width="290" height="138" rx="0"/><text class="" x="455.0" y="605" text-anchor="middle">2–3: system/school</text><rect class="box" x="600" y="569" width="290" height="138" rx="0"/><text class="" x="745.0" y="605" text-anchor="middle">No estimate; access</text><text class="" x="745.0" y="639" text-anchor="middle">duty s.6(11)</text><rect class="box" x="890" y="569" width="290" height="138" rx="0"/><text class="" x="1035.0" y="605" text-anchor="middle">Accessibility walk;</text><text class="" x="1035.0" y="639" text-anchor="middle">costed list;</text><text class="" x="1035.0" y="673" text-anchor="middle">ground-floor room</text><rect class="box" x="20" y="707" width="290" height="138" rx="0"/><text class="" x="165.0" y="743" text-anchor="middle">Enrolled, not expected</text><text class="" x="165.0" y="777" text-anchor="middle">to attend</text><rect class="box" x="310" y="707" width="290" height="138" rx="0"/><text class="" x="455.0" y="743" text-anchor="middle">3: school</text><rect class="box" x="600" y="707" width="290" height="138" rx="0"/><text class="" x="745.0" y="743" text-anchor="middle">Enrolment counted,</text><text class="" x="745.0" y="777" text-anchor="middle">participation ignored</text><rect class="box" x="890" y="707" width="290" height="138" rx="0"/><text class="" x="1035.0" y="743" text-anchor="middle">Two lines each term on</text><text class="" x="1035.0" y="777" text-anchor="middle">participation and</text><text class="" x="1035.0" y="811" text-anchor="middle">attainment, s.9(1)</text><rect class="box" x="20" y="845" width="290" height="104" rx="0"/><text class="" x="165.0" y="881" text-anchor="middle">Dictated exams, no</text><text class="" x="165.0" y="915" text-anchor="middle">time or scribe</text><rect class="box" x="310" y="845" width="290" height="104" rx="0"/><text class="" x="455.0" y="881" text-anchor="middle">3: school</text><rect class="box" x="600" y="845" width="290" height="104" rx="0"/><text class="" x="745.0" y="881" text-anchor="middle">Exam setters unaware</text><text class="" x="745.0" y="915" text-anchor="middle">of s.9(2)</text><rect class="box" x="890" y="845" width="290" height="104" rx="0"/><text class="" x="1035.0" y="881" text-anchor="middle">Request arrangement in</text><text class="" x="1035.0" y="915" text-anchor="middle">writing before exam</text><rect class="box" x="20" y="949" width="290" height="104" rx="0"/><text class="" x="165.0" y="985" text-anchor="middle">Low vision pupil in</text><text class="" x="165.0" y="1019" text-anchor="middle">row four</text><rect class="box" x="310" y="949" width="290" height="104" rx="0"/><text class="" x="455.0" y="985" text-anchor="middle">4: classroom</text><rect class="box" x="600" y="949" width="290" height="104" rx="0"/><text class="" x="745.0" y="985" text-anchor="middle">Seating plan never</text><text class="" x="745.0" y="1019" text-anchor="middle">revisited</text><rect class="box" x="890" y="949" width="290" height="104" rx="0"/><text class="" x="1035.0" y="985" text-anchor="middle">Move this week; review</text><text class="" x="1035.0" y="1019" text-anchor="middle">each term</text><rect class="box" x="20" y="1053" width="290" height="138" rx="0"/><text class="" x="165.0" y="1089" text-anchor="middle">Weak reader never</text><text class="" x="165.0" y="1123" text-anchor="middle">asked aloud</text><rect class="box" x="310" y="1053" width="290" height="138" rx="0"/><text class="" x="455.0" y="1089" text-anchor="middle">4: classroom</text><rect class="box" x="600" y="1053" width="290" height="138" rx="0"/><text class="" x="745.0" y="1089" text-anchor="middle">Low expectation</text><text class="" x="745.0" y="1123" text-anchor="middle">disguised as kindness</text><rect class="box" x="890" y="1053" width="290" height="138" rx="0"/><text class="" x="1035.0" y="1089" text-anchor="middle">Prepare two sentences</text><text class="" x="1035.0" y="1123" text-anchor="middle">fortnightly; record</text><text class="" x="1035.0" y="1157" text-anchor="middle">change</text><rect class="box" x="20" y="1191" width="290" height="104" rx="0"/><text class="" x="165.0" y="1227" text-anchor="middle">Excluded from sports</text><text class="" x="165.0" y="1261" text-anchor="middle">or scholarship</text><rect class="box" x="310" y="1191" width="290" height="104" rx="0"/><text class="" x="455.0" y="1227" text-anchor="middle">4: classroom</text><rect class="box" x="600" y="1191" width="290" height="104" rx="0"/><text class="" x="745.0" y="1227" text-anchor="middle">Selection form filled</text><text class="" x="745.0" y="1261" text-anchor="middle">without pupil in mind</text><rect class="box" x="890" y="1191" width="290" height="104" rx="0"/><text class="" x="1035.0" y="1227" text-anchor="middle">Read register beside</text><text class="" x="1035.0" y="1261" text-anchor="middle">form; enter pupil</text><text class="muted" x="600.0" y="1345" text-anchor="middle">Six of nine have a free teacher-level action this week; deploring a gap does not</text><text class="muted" x="600.0" y="1379" text-anchor="middle">close it.</text><text class="wm" x="1185" y="1473" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
