<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1004" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول قومی تعلیمی پالیسی 2009 اور سندھ ایکٹ 2018 کی دفعہ 9 کو پانچ سوالوں پر ملاتا ہے: مخاطب، قانونی فعل، تعریف، سہولت کاری اور عمل کا طریقہ؛ پالیسی کے وعدے اور متعین ذمہ داری کا فرق نمایاں ہے۔</title><desc id="d">جدول قومی تعلیمی پالیسی 2009 اور سندھ ایکٹ 2018 کی دفعہ 9 کو پانچ سوالوں پر ملاتا ہے: مخاطب، قانونی فعل، تعریف، سہولت کاری اور عمل کا طریقہ؛ پالیسی کے وعدے اور متعین ذمہ داری کا فرق نمایاں ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:22px}.h{font-weight:700}.muted{fill:var(--muted);font-size:19px}.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.wm{fill:var(--wm);font-size:12px}.head{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect x="0" y="0" width="1200" height="1004" fill="var(--bg)"/><text class="h" x="600" y="60" text-anchor="middle">پالیسی کا وعدہ اور قانونی ذمہ داری</text><rect class="accent" x="794" y="115" width="386" height="108" rx="0"/><text class="h" x="987" y="153" text-anchor="middle">سوال</text><rect class="accent" x="408" y="115" width="386" height="108" rx="0"/><text class="h" x="601" y="153" text-anchor="middle">قومی پالیسی 2009، حصہ 2.4،</text><text class="h" x="601" y="187" text-anchor="middle">اقدامات 4–5</text><rect class="accent" x="20" y="115" width="388" height="108" rx="0"/><text class="h" x="214" y="153" text-anchor="middle">سندھ ایکٹ 2018، دفعہ 9</text><rect class="box" x="794" y="223" width="386" height="138" rx="0"/><text class="" x="987" y="259" text-anchor="middle">مخاطب کون؟</text><rect class="box" x="408" y="223" width="386" height="138" rx="0"/><text class="" x="601" y="259" text-anchor="middle">حکومت اور صوبائی یا علاقائی</text><text class="" x="601" y="293" text-anchor="middle">حکومتیں؛ اسکول یا بچہ متعین</text><text class="" x="601" y="327" text-anchor="middle">نہیں</text><rect class="box" x="20" y="223" width="388" height="138" rx="0"/><text class="" x="214" y="259" text-anchor="middle">حکومت اور اس کی مالی مدد یا</text><text class="" x="214" y="293" text-anchor="middle">تسلیم شدہ ادارے</text><rect class="box" x="794" y="361" width="386" height="104" rx="0"/><text class="" x="987" y="397" text-anchor="middle">فعل کتنا پابند؟</text><rect class="box" x="408" y="361" width="386" height="104" rx="0"/><text class="" x="601" y="397" text-anchor="middle">شمولیت کو فروغ؛ خصوصی اقدامات</text><text class="" x="601" y="431" text-anchor="middle">اپنائے جائیں</text><rect class="box" x="20" y="361" width="388" height="104" rx="0"/><text class="" x="214" y="397" text-anchor="middle">کوشش کرے گی، اور اس غرض سے دس</text><text class="" x="214" y="431" text-anchor="middle">متعین فرائض</text><rect class="box" x="794" y="465" width="386" height="138" rx="0"/><text class="" x="987" y="501" text-anchor="middle">تعریف؟</text><rect class="box" x="408" y="465" width="386" height="138" rx="0"/><text class="" x="601" y="501" text-anchor="middle">ان اقدامات میں تعریف نہیں</text><rect class="box" x="20" y="465" width="388" height="138" rx="0"/><text class="" x="214" y="501" text-anchor="middle">دفعہ 2: معذوری کے ساتھ اور</text><text class="" x="214" y="535" text-anchor="middle">بغیر بچے ساتھ پڑھیں؛ تدریس</text><text class="" x="214" y="569" text-anchor="middle">موزوں ہو</text><rect class="box" x="794" y="603" width="386" height="104" rx="0"/><text class="" x="987" y="639" text-anchor="middle">سہولت کاری؟</text><rect class="box" x="408" y="603" width="386" height="104" rx="0"/><text class="" x="601" y="639" text-anchor="middle">شمولیت کے ان اقدامات میں ذکر</text><text class="" x="601" y="673" text-anchor="middle">نہیں</text><rect class="box" x="20" y="603" width="388" height="104" rx="0"/><text class="" x="214" y="639" text-anchor="middle">انفرادی ضرورت؛ انکار بھی</text><text class="" x="214" y="673" text-anchor="middle">امتیاز ہے، دفعہ 2</text><rect class="box" x="794" y="707" width="386" height="138" rx="0"/><text class="" x="987" y="743" text-anchor="middle">عمل کا طریقہ؟</text><rect class="box" x="408" y="707" width="386" height="138" rx="0"/><text class="" x="601" y="743" text-anchor="middle">ان اقدامات میں تاریخ، رپورٹ</text><text class="" x="601" y="777" text-anchor="middle">یا شکایت کا راستہ نہیں</text><rect class="box" x="20" y="707" width="388" height="138" rx="0"/><text class="" x="214" y="743" text-anchor="middle">اتھارٹی، کونسل، فنڈ، خصوصی</text><text class="" x="214" y="777" text-anchor="middle">عدالتیں؛ سہ سالہ سروے؛ رسائی</text><text class="" x="214" y="811" text-anchor="middle">دفعہ 6(11)</text><text class="muted" x="600" y="895" text-anchor="middle">سمت ایک ہے؛ والدین اسکول کے سامنے ایکٹ کی متعین ذمہ داری رکھ سکتے ہیں۔</text><text class="wm" x="15" y="989" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
