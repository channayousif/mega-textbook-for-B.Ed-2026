<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے تعلیمی نظام میں نگرانی اور جائزہ کے عام آلات</title><desc id="d">تین کالموں کی جدول: نگرانی اور جائزہ کا آلہ، وہ کیا ناپتا ہے، اور اسے کب استعمال کریں۔ قطاروں میں حاضری رجسٹر، ٹیسٹ کے نتائج، اسکول کے دورے، بجٹ رپورٹیں اور متعلقہ فریقوں کے انٹرویو ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470" /><text class="h" x="390" y="30" text-anchor="middle">پاکستان میں نگرانی اور جائزہ کے عام آلات</text><rect class="panel" x="560" y="50" width="170" height="36" rx="4" /><text class="sh" x="645" y="73" text-anchor="middle">نگرانی اور جائزہ کا آلہ</text><rect class="panel" x="240" y="50" width="310" height="36" rx="4" /><text class="sh" x="395" y="73" text-anchor="middle">یہ کیا ناپتا ہے</text><rect class="panel" x="50" y="50" width="180" height="36" rx="4" /><text class="sh" x="140" y="73" text-anchor="middle">کب استعمال کریں</text><rect class="panel-a" x="560" y="90" width="170" height="52" rx="4" /><text class="body" x="645" y="113" text-anchor="middle">حاضری رجسٹر</text><text class="small" x="645" y="132" text-anchor="middle">داخلے اور اسکول چھوڑنا</text><rect class="panel-a" x="240" y="90" width="310" height="52" rx="4" /><text class="body" x="395" y="113" text-anchor="middle">داخلے، حاضری اور اسکول چھوڑنا</text><text class="small" x="395" y="132" text-anchor="middle">اسکول کا روزانہ یا ماہانہ ریکارڈ</text><rect class="panel-a" x="50" y="90" width="180" height="52" rx="4" /><text class="body" x="140" y="113" text-anchor="middle">ماہانہ</text><text class="small" x="140" y="132" text-anchor="middle">معمول کی نگرانی</text><rect class="panel-a" x="560" y="146" width="170" height="52" rx="4" /><text class="body" x="645" y="169" text-anchor="middle">ٹیسٹ کے نتائج</text><text class="small" x="645" y="188" text-anchor="middle">سیکھنے کے نتائج</text><rect class="panel-a" x="240" y="146" width="310" height="52" rx="4" /><text class="body" x="395" y="169" text-anchor="middle">شاگردوں نے کیا سیکھا</text><text class="small" x="395" y="188" text-anchor="middle">ایک وقت کی تصویر، وجہ نہیں بتاتی</text><rect class="panel-a" x="50" y="146" width="180" height="52" rx="4" /><text class="body" x="140" y="169" text-anchor="middle">سالانہ</text><text class="small" x="140" y="188" text-anchor="middle">وقفوں پر تشخیص</text><rect class="panel-a" x="560" y="202" width="170" height="52" rx="4" /><text class="body" x="645" y="225" text-anchor="middle">اسکول کے دورے</text><text class="small" x="645" y="244" text-anchor="middle">اساتذہ کی موجودگی اور حالات</text><rect class="panel-a" x="240" y="202" width="310" height="52" rx="4" /><text class="body" x="395" y="225" text-anchor="middle">اساتذہ کی موجودگی، جماعت کی حالت</text><text class="small" x="395" y="244" text-anchor="middle">اور مواد کی دستیابی</text><rect class="panel-a" x="50" y="202" width="180" height="52" rx="4" /><text class="body" x="140" y="225" text-anchor="middle">سہ ماہی</text><text class="small" x="140" y="244" text-anchor="middle">معائنے کے دورے</text><rect class="panel-a" x="560" y="258" width="170" height="52" rx="4" /><text class="body" x="645" y="281" text-anchor="middle">بجٹ رپورٹیں</text><text class="small" x="645" y="300" text-anchor="middle">مالی وسائل</text><rect class="panel-a" x="240" y="258" width="310" height="52" rx="4" /><text class="body" x="395" y="281" text-anchor="middle">رقم مختص، جاری اور خرچ ہونا</text><text class="small" x="395" y="300" text-anchor="middle">کیا رقم اسکول تک پہنچی</text><rect class="panel-a" x="50" y="258" width="180" height="52" rx="4" /><text class="body" x="140" y="281" text-anchor="middle">ماہانہ</text><text class="small" x="140" y="300" text-anchor="middle">مالی حساب</text><rect class="panel-a" x="560" y="314" width="170" height="52" rx="4" /><text class="body" x="645" y="337" text-anchor="middle">متعلقہ فریقوں کے انٹرویو</text><text class="small" x="645" y="356" text-anchor="middle">تجربات اور رکاوٹیں</text><rect class="panel-a" x="240" y="314" width="310" height="52" rx="4" /><text class="body" x="395" y="337" text-anchor="middle">وہ تجربات جو اعداد نہیں بتاتے</text><text class="small" x="395" y="356" text-anchor="middle">اساتذہ اور والدین کی آرا</text><rect class="panel-a" x="50" y="314" width="180" height="52" rx="4" /><text class="body" x="140" y="337" text-anchor="middle">وسط مدت</text><text class="small" x="140" y="356" text-anchor="middle">کیفی سمجھ</text><text class="small" x="390" y="400" text-anchor="middle">کوئی ایک آلہ پوری بات نہیں بتاتا۔ اچھی نگرانی اور جائزہ کئی آلات یکجا کرتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
