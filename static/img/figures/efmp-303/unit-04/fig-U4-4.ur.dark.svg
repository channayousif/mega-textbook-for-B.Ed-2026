<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چیلنجز مل کر نفاذ کی ناکامی کیسے پیدا کرتے ہیں</title><desc id="d">تین باہم متداخل دائروں کا خاکہ جن پر مالی، سیاسی اور بیوکریٹک لکھا ہے۔ مشترک حصے پر نفاذ کی ناکامی لکھا ہے۔ تیر دکھاتے ہیں کہ ہر چیلنج دوسرے چیلنجز کو کیسے تقویت دیتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><text class="h" x="390" y="36" text-anchor="middle">چیلنجز کا باہمی عمل</text><circle cx="510" cy="170" r="120" class="panel-a" opacity="0.7" /><circle cx="270" cy="170" r="120" class="panel-b" opacity="0.7" /><circle cx="390" cy="320" r="120" class="panel-c" opacity="0.7" /><text class="sh" x="580" y="95" text-anchor="end">مالی</text><text class="small" x="580" y="115" text-anchor="end">ناکافی رقم</text><text class="small" x="580" y="135" text-anchor="end">اجرا میں تاخیر</text><text class="small" x="580" y="155" text-anchor="end">ضیاع</text><text class="sh" x="250" y="95" text-anchor="end">سیاسی</text><text class="small" x="250" y="115" text-anchor="end">حکومت کی تبدیلی</text><text class="small" x="250" y="135" text-anchor="end">وزرا کی تبدیلی</text><text class="small" x="250" y="155" text-anchor="end">پالیسی کا تسلسل ٹوٹنا</text><text class="sh" x="390" y="430" text-anchor="middle">بیوکریٹک</text><text class="small" x="390" y="450" text-anchor="middle">پیچیدہ منظوری، کمزور ہم آہنگی، صلاحیت کی کمی</text><rect class="panel" x="320" y="215" width="140" height="40" rx="6" opacity="0.95" /><text class="sh" x="390" y="229" text-anchor="middle" style="font-size:11px">نفاذ کی</text><text class="sh" x="390" y="249" text-anchor="middle" style="font-size:11px">ناکامی</text><line x1="480" y1="175" x2="415" y2="220" class="stroke-a" marker-end="url(#arrow)" /><line x1="300" y1="175" x2="365" y2="220" class="stroke-a" marker-end="url(#arrow)" /><line x1="390" y1="295" x2="390" y2="258" class="stroke-a" marker-end="url(#arrow)" /><text class="small" x="475" y="198" text-anchor="middle">رقم کی کمی کمزور کرتی ہے</text><text class="small" x="305" y="198" text-anchor="middle">قیادت کی تبدیلی</text><text class="small" x="390" y="285" text-anchor="middle">صلاحیت کی کمی</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
