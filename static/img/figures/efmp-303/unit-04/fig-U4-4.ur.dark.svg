<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چیلنجز مل کر نفاذ کی ناکامی کیسے پیدا کرتے ہیں</title><desc id="d">تین باہم متداخل دائروں کا خاکہ جن پر مالی، سیاسی اور بیوکریٹک لکھا ہے۔ مشترک حصے پر نفاذ کی ناکامی لکھا ہے۔ تیر دکھاتے ہیں کہ ہر چیلنج دوسرے چیلنجز کو کیسے تقویت دیتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .ink{fill:var(--ink);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .on{font-size:13px;fill:var(--ink);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"><circle id="region-financial" class="panel-a" cx="480" cy="180" r="140" fill-opacity="0.5"/><circle id="region-political" class="panel-b" cx="300" cy="180" r="140" fill-opacity="0.5"/><circle id="region-bureaucratic" class="panel-c" cx="390" cy="310" r="140" fill-opacity="0.5"/></g><g id="layer-edges"><path id="edge-financial-failure" class="stroke-a" d="M534 224 L455 224" marker-end="url(#arrow)"/><path id="edge-political-failure" class="stroke-a" d="M246 224 L325 224" marker-end="url(#arrow)"/><path id="edge-bureaucratic-failure" class="stroke-a" d="M390 310 L390 248" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-financial"><text class="sh" x="592" y="94" text-anchor="end">مالی</text><text class="on" x="592" y="121" text-anchor="end">ناکافی رقم</text><text class="on" x="592" y="146" text-anchor="end">اجرا میں تاخیر</text><text class="on" x="592" y="171" text-anchor="end">ضیاع</text></g><g id="node-political"><text class="sh" x="314" y="94" text-anchor="end">سیاسی</text><text class="on" x="314" y="121" text-anchor="end">حکومت کی تبدیلی</text><text class="on" x="314" y="146" text-anchor="end">وزرا کی تبدیلی</text><text class="on" x="314" y="171" text-anchor="end">پالیسی کا تسلسل ٹوٹنا</text></g><g id="node-bureaucratic"><text class="sh" x="390" y="348" text-anchor="middle">بیوکریٹک</text><text class="on" x="390" y="376" text-anchor="middle">پیچیدہ منظوری،‏</text><text class="on" x="390" y="400" text-anchor="middle">کمزور ہم آہنگی،‏</text><text class="on" x="390" y="424" text-anchor="middle">صلاحیت کی کمی</text></g><g id="node-failure"><rect class="panel" x="325" y="200" width="130" height="48" rx="8"/><text class="sh" x="390" y="218" text-anchor="middle">نفاذ کی</text><text class="sh" x="390" y="242" text-anchor="middle">ناکامی</text></g></g><g id="layer-labels"><text class="h" x="390" y="28" text-anchor="middle">چیلنجز کا باہمی عمل</text><text class="on" x="533" y="212" text-anchor="middle">رقم کی کمی کمزور کرتی ہے</text><text class="on" x="247" y="212" text-anchor="middle">قیادت کی تبدیلی</text><text class="on" x="382" y="284" text-anchor="end">صلاحیت کی کمی</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
