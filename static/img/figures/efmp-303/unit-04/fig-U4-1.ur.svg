<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نگرانی اور جائزہ کا دور</title><desc id="d">پانچ مراحل کا ایک دوری بہاؤ خاکہ: اشاریے مقرر کریں، معلومات جمع کریں، تجزیہ کریں، رپورٹ دیں، نتائج استعمال کریں۔ ہر مرحلے کے نیچے مختصر نوٹ ہے اور تیر نتائج کے استعمال سے دوبارہ اشاریے مقرر کرنے کی طرف لوٹتے ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="450" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><text class="h" x="390" y="36" text-anchor="middle">نگرانی اور جائزہ کا دور</text><rect class="panel-a" x="325" y="46" width="130" height="48" rx="6" /><text class="sh" x="390" y="74" text-anchor="middle">اشاریے مقرر کریں</text><rect class="panel-a" x="166" y="161" width="130" height="48" rx="6" /><text class="sh" x="231" y="189" text-anchor="middle">معلومات جمع کریں</text><rect class="panel-a" x="227" y="335" width="130" height="48" rx="6" /><text class="sh" x="292" y="363" text-anchor="middle">تجزیہ کریں</text><rect class="panel-a" x="423" y="335" width="130" height="48" rx="6" /><text class="sh" x="488" y="363" text-anchor="middle">رپورٹ دیں</text><rect class="panel-a" x="484" y="161" width="130" height="48" rx="6" /><text class="sh" x="549" y="189" text-anchor="middle">نتائج استعمال کریں</text><line x1="330" y1="94" x2="296" y2="161" class="stroke-a" marker-end="url(#arrow)" /><line x1="241" y1="209" x2="292" y2="335" class="stroke-a" marker-end="url(#arrow)" /><line x1="357" y1="359" x2="423" y2="359" class="stroke-a" marker-end="url(#arrow)" /><line x1="488" y1="335" x2="549" y2="209" class="stroke-a" marker-end="url(#arrow)" /><line x1="549" y1="161" x2="455" y2="70" class="stroke-a" marker-end="url(#arrow)" /><text class="small" x="390" y="110" text-anchor="middle">کامیابی کی صورت متعین کریں</text><text class="small" x="160" y="225" text-anchor="start">معمول کی اور وقفوں کی معلومات لیں</text><text class="small" x="222" y="420" text-anchor="start">حقیقت اور منصوبے کا موازنہ کریں</text><text class="small" x="558" y="399" text-anchor="end">نتائج فیصلہ سازوں تک پہنچائیں</text><text class="small" x="619" y="225" text-anchor="end">منصوبہ بندی اور ردوبدل میں مدد</text><text class="wm" x="768" y="438" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
