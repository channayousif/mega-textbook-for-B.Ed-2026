<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Challenges in policy implementation</title><desc id="d">A concept map placing 'Challenges in policy implementation' at the centre with three branches: financial constraints (insufficient funds, late release of funds, leakage through multiple levels), political instability (government change, ministerial turnover, policy discontinuity), and bureaucratic and administrative issues (complex approval processes, weak coordination between departments).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .ink{fill:var(--ink);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .on{font-size:13px;fill:var(--ink);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-challenges-financial" class="stroke-a" d="M285,242 Q170,242 170,174"/><path id="edge-challenges-political" class="stroke-a" d="M495,242 Q610,242 610,174"/><path id="edge-challenges-bureaucratic" class="stroke-a" d="M390,274 L390,320"/></g><g id="layer-nodes"><g id="node-challenges"><rect class="panel" x="285" y="210" width="210" height="64" rx="32"/><text class="sh" x="390" y="237" text-anchor="middle">Challenges in policy</text><text class="sh" x="390" y="256" text-anchor="middle">implementation</text></g><g id="node-financial"><rect class="panel-a" x="30" y="50" width="280" height="124" rx="8"/><text class="sh" x="170" y="76" text-anchor="middle">Financial constraints</text><circle class="ink" cx="50" cy="101" r="3"/><text class="body" x="62" y="106">Insufficient funds</text><circle class="ink" cx="50" cy="125" r="3"/><text class="body" x="62" y="130">Late release of funds</text><circle class="ink" cx="50" cy="149" r="3"/><text class="body" x="62" y="154">Leakage through multiple levels</text></g><g id="node-political"><rect class="panel-b" x="470" y="50" width="280" height="124" rx="8"/><text class="sh" x="610" y="76" text-anchor="middle">Political instability</text><circle class="ink" cx="490" cy="101" r="3"/><text class="body" x="502" y="106">Government change</text><circle class="ink" cx="490" cy="125" r="3"/><text class="body" x="502" y="130">Ministerial turnover</text><circle class="ink" cx="490" cy="149" r="3"/><text class="body" x="502" y="154">Policy discontinuity</text></g><g id="node-bureaucratic"><rect class="panel-c" x="220" y="320" width="340" height="100" rx="8"/><text class="sh" x="390" y="346" text-anchor="middle">Bureaucratic and administrative issues</text><circle class="ink" cx="240" cy="371" r="3"/><text class="body" x="252" y="376">Complex approval processes</text><circle class="ink" cx="240" cy="395" r="3"/><text class="body" x="252" y="400">Weak coordination between departments</text></g></g><g id="layer-labels"><text class="h" x="390" y="26" text-anchor="middle">Challenges in Policy Implementation</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
