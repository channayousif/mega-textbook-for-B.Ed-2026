<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Challenges in policy implementation</title><desc id="d">A concept map placing Challenges in policy implementation at the centre with three branches: Financial constraints, Political instability, Bureaucratic and administrative issues; each branch with sub-points showing specific examples from Pakistan education system.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="22" text-anchor="middle">Challenges in Policy Implementation</text><rect class="panel" x="300" y="200" width="180" height="50" rx="8"/><text class="sh" x="390" y="230" text-anchor="middle">Challenges in policy</text><text class="sh" x="390" y="246" text-anchor="middle">implementation</text><rect class="panel-a" x="50" y="60" width="210" height="40" rx="6"/><text class="sh" x="155" y="85" text-anchor="middle">Financial constraints</text><rect class="panel-b" x="520" y="60" width="210" height="40" rx="6"/><text class="sh" x="625" y="85" text-anchor="middle">Political instability</text><rect class="panel-c" x="265" y="360" width="250" height="40" rx="6"/><text class="sh" x="390" y="385" text-anchor="middle">Bureaucratic and administrative issues</text><line x1="300" y1="225" x2="260" y2="80" class="stroke-a"/><line x1="480" y1="225" x2="520" y2="80" class="stroke-a"/><line x1="390" y1="250" x2="390" y2="360" class="stroke-a"/><circle cx="100" cy="130" r="4" class="ink"/><text class="body" x="110" y="135">Insufficient funds</text><circle cx="100" cy="155" r="4" class="ink"/><text class="body" x="110" y="160">Late release of funds</text><circle cx="100" cy="180" r="4" class="ink"/><text class="body" x="110" y="185">Leakage through multiple levels</text><circle cx="570" cy="130" r="4" class="ink"/><text class="body" x="580" y="135">Government change</text><circle cx="570" cy="155" r="4" class="ink"/><text class="body" x="580" y="160">Ministerial turnover</text><circle cx="570" cy="180" r="4" class="ink"/><text class="body" x="580" y="185">Policy discontinuity</text><circle cx="310" cy="430" r="4" class="ink"/><text class="body" x="320" y="435">Complex approval processes</text><circle cx="310" cy="452" r="4" class="ink"/><text class="body" x="320" y="457">Weak coordination between departments</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
