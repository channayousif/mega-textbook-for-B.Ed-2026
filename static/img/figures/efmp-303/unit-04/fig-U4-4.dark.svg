<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How challenges interact to produce implementation failure</title><desc id="d">A diagram showing three overlapping circles (Financial, Political, Bureaucratic) with the overlap region labelled Implementation failure; arrows showing how each challenge reinforces the others.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="22" text-anchor="middle">How Challenges Interact</text><circle cx="270" cy="170" r="120" class="panel-a" opacity="0.7"/><circle cx="510" cy="170" r="120" class="panel-b" opacity="0.7"/><circle cx="390" cy="320" r="120" class="panel-c" opacity="0.7"/><text class="sh" x="200" y="95">Financial</text><text class="small" x="200" y="115">Insufficient funds</text><text class="small" x="200" y="135">Late release</text><text class="small" x="200" y="155">Leakage</text><text class="sh" x="530" y="95">Political</text><text class="small" x="530" y="115">Government change</text><text class="small" x="530" y="135">Ministerial turnover</text><text class="small" x="530" y="155">Policy discontinuity</text><text class="sh" x="390" y="430" text-anchor="middle">Bureaucratic</text><text class="small" x="390" y="450" text-anchor="middle">Complex approvals, weak coordination, capacity gaps</text><rect class="panel" x="320" y="215" width="140" height="40" rx="6" opacity="0.95"/><text class="sh" x="390" y="240" text-anchor="middle">Implementation</text><text class="sh" x="390" y="254" text-anchor="middle">failure</text><line x1="300" y1="175" x2="365" y2="220" class="stroke-a" marker-end="url(#arrow)"/><line x1="480" y1="175" x2="415" y2="220" class="stroke-a" marker-end="url(#arrow)"/><line x1="390" y1="295" x2="390" y2="258" class="stroke-a" marker-end="url(#arrow)"/><text class="small" x="305" y="198" text-anchor="middle">Funding gaps weaken</text><text class="small" x="475" y="198" text-anchor="middle">Leadership change</text><text class="small" x="390" y="285" text-anchor="middle">Capacity gaps</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
