<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نگرانی اور جائزہ کا دور</title><desc id="d">پانچ مراحل کا ایک دوری بہاؤ خاکہ: اشاریے مقرر کریں، معلومات جمع کریں، تجزیہ کریں، رپورٹ دیں، نتائج استعمال کریں۔ ہر مرحلے کے نیچے مختصر نوٹ ہے اور تیر نتائج کے استعمال سے دوبارہ اشاریے مقرر کرنے کی طرف لوٹتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .ink{fill:var(--ink);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .on{font-size:13px;fill:var(--ink);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);}</style><rect class="bg" x="0" y="0" width="780" height="450"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-indicators-collect" class="stroke-a" d="M262 72 Q150 72 150 150" marker-end="url(#arrow)"/><path id="edge-collect-analyse" class="stroke-a" d="M150 214 Q150 290 220 320" marker-end="url(#arrow)"/><path id="edge-analyse-report" class="stroke-a" d="M368 352 L412 352" marker-end="url(#arrow)"/><path id="edge-report-use" class="stroke-a" d="M560 320 Q630 290 630 214" marker-end="url(#arrow)"/><path id="edge-use-indicators" class="stroke-a" d="M630 150 Q630 72 518 72" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-indicators"><rect class="panel-a" x="262" y="40" width="256" height="64" rx="8"/><text class="sh" x="390" y="66" text-anchor="middle">اشاریے مقرر کریں</text><text class="on" x="390" y="93" text-anchor="middle">کامیابی کی صورت متعین کریں</text></g><g id="node-collect"><rect class="panel-a" x="22" y="150" width="256" height="64" rx="8"/><text class="sh" x="150" y="176" text-anchor="middle">معلومات جمع کریں</text><text class="on" x="150" y="203" text-anchor="middle">معمول کی اور وقفوں کی معلومات لیں</text></g><g id="node-analyse"><rect class="panel-a" x="112" y="320" width="256" height="64" rx="8"/><text class="sh" x="240" y="346" text-anchor="middle">تجزیہ کریں</text><text class="on" x="240" y="373" text-anchor="middle">حقیقت اور منصوبے کا موازنہ کریں</text></g><g id="node-report"><rect class="panel-a" x="412" y="320" width="256" height="64" rx="8"/><text class="sh" x="540" y="346" text-anchor="middle">رپورٹ دیں</text><text class="on" x="540" y="373" text-anchor="middle">نتائج فیصلہ سازوں تک پہنچائیں</text></g><g id="node-use"><rect class="panel-a" x="502" y="150" width="256" height="64" rx="8"/><text class="sh" x="630" y="176" text-anchor="middle">نتائج استعمال کریں</text><text class="on" x="630" y="203" text-anchor="middle">منصوبہ بندی اور ردوبدل میں مدد</text></g></g><g id="layer-labels"><text class="h" x="390" y="30" text-anchor="middle">نگرانی اور جائزہ کا دور</text></g><text class="wm" x="12" y="440" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
