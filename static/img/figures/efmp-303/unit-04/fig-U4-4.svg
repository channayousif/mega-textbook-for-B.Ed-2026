<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How challenges interact to produce implementation failure</title><desc id="d">A diagram showing three overlapping circles (Financial, Political, Bureaucratic) with the overlap region labelled 'Implementation failure'; arrows showing how each challenge reinforces the others.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .ink{fill:var(--ink);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .on{font-size:13px;fill:var(--ink);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"><circle id="region-financial" class="panel-a" cx="300" cy="180" r="140" fill-opacity="0.5"/><circle id="region-political" class="panel-b" cx="480" cy="180" r="140" fill-opacity="0.5"/><circle id="region-bureaucratic" class="panel-c" cx="390" cy="310" r="140" fill-opacity="0.5"/></g><g id="layer-edges"><path id="edge-financial-failure" class="stroke-a" d="M246,224 L325,224" marker-end="url(#arrow)"/><path id="edge-political-failure" class="stroke-a" d="M534,224 L455,224" marker-end="url(#arrow)"/><path id="edge-bureaucratic-failure" class="stroke-a" d="M390,310 L390,248" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-financial"><text class="sh" x="188" y="94">Financial</text><text class="on" x="188" y="114">Insufficient funds</text><text class="on" x="188" y="134">Late release</text><text class="on" x="188" y="154">Leakage</text></g><g id="node-political"><text class="sh" x="466" y="94">Political</text><text class="on" x="466" y="114">Government change</text><text class="on" x="466" y="134">Ministerial turnover</text><text class="on" x="466" y="154">Policy discontinuity</text></g><g id="node-bureaucratic"><text class="sh" x="390" y="348" text-anchor="middle">Bureaucratic</text><text class="on" x="390" y="370" text-anchor="middle">Complex approvals,</text><text class="on" x="390" y="389" text-anchor="middle">weak coordination,</text><text class="on" x="390" y="408" text-anchor="middle">capacity gaps</text></g><g id="node-failure"><rect class="panel" x="325" y="200" width="130" height="48" rx="8"/><text class="sh" x="390" y="220" text-anchor="middle">Implementation</text><text class="sh" x="390" y="238" text-anchor="middle">failure</text></g></g><g id="layer-labels"><text class="h" x="390" y="24" text-anchor="middle">How Challenges Interact</text><text class="on" x="247" y="214" text-anchor="middle">Funding gaps weaken</text><text class="on" x="533" y="214" text-anchor="middle">Leadership change</text><text class="on" x="398" y="284">Capacity gaps</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
