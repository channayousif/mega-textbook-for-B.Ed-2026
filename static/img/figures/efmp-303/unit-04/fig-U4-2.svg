<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Common M and E tools in Pakistan education system</title><desc id="d">A table with three columns: monitoring and evaluation tool, what it measures, and when to use it; rows for attendance registers, test results, school visits, budget reports and stakeholder interviews.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .ink{fill:var(--ink);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .on{font-size:13px;fill:var(--ink);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .cell{fill:var(--bg);stroke:var(--ink);stroke-width:1;} .cell-h{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect class="panel" x="30" y="50" width="240" height="40" rx="0"/><text class="sh" x="150" y="75" text-anchor="middle">M&amp;E tool</text><rect class="panel" x="270" y="50" width="310" height="40" rx="0"/><text class="sh" x="425" y="75" text-anchor="middle">What it measures</text><rect class="panel" x="580" y="50" width="170" height="40" rx="0"/><text class="sh" x="665" y="75" text-anchor="middle">When to use it</text></g><g id="node-attendance"><rect class="cell-h" x="30" y="90" width="240" height="56" rx="0"/><text class="sh" x="150" y="114" text-anchor="middle">Attendance registers</text><text class="on" x="150" y="133" text-anchor="middle">enrolment and dropout</text><rect class="cell" x="270" y="90" width="310" height="56" rx="0"/><text class="body" x="425" y="114" text-anchor="middle">Enrolment, attendance and dropout</text><text class="on" x="425" y="133" text-anchor="middle">tracked daily or monthly by the school</text><rect class="cell" x="580" y="90" width="170" height="56" rx="0"/><text class="body" x="665" y="114" text-anchor="middle">Monthly</text><text class="on" x="665" y="133" text-anchor="middle">routine monitoring</text></g><g id="node-tests"><rect class="cell-h" x="30" y="146" width="240" height="56" rx="0"/><text class="sh" x="150" y="170" text-anchor="middle">Test results</text><text class="on" x="150" y="189" text-anchor="middle">learning outcomes</text><rect class="cell" x="270" y="146" width="310" height="56" rx="0"/><text class="body" x="425" y="170" text-anchor="middle">What pupils have learned</text><text class="on" x="425" y="189" text-anchor="middle">snapshot, does not explain why</text><rect class="cell" x="580" y="146" width="170" height="56" rx="0"/><text class="body" x="665" y="170" text-anchor="middle">Annually</text><text class="on" x="665" y="189" text-anchor="middle">periodic assessment</text></g><g id="node-visits"><rect class="cell-h" x="30" y="202" width="240" height="56" rx="0"/><text class="sh" x="150" y="226" text-anchor="middle">School visits</text><text class="on" x="150" y="245" text-anchor="middle">teacher presence and conditions</text><rect class="cell" x="270" y="202" width="310" height="56" rx="0"/><text class="body" x="425" y="226" text-anchor="middle">Teacher presence, classroom conditions</text><text class="on" x="425" y="245" text-anchor="middle">and availability of materials</text><rect class="cell" x="580" y="202" width="170" height="56" rx="0"/><text class="body" x="665" y="226" text-anchor="middle">Quarterly</text><text class="on" x="665" y="245" text-anchor="middle">inspection visits</text></g><g id="node-budget"><rect class="cell-h" x="30" y="258" width="240" height="56" rx="0"/><text class="sh" x="150" y="282" text-anchor="middle">Budget reports</text><text class="on" x="150" y="301" text-anchor="middle">financial inputs</text><rect class="cell" x="270" y="258" width="310" height="56" rx="0"/><text class="body" x="425" y="282" text-anchor="middle">Allocation, release and spending</text><text class="on" x="425" y="301" text-anchor="middle">tracks whether funds reach schools</text><rect class="cell" x="580" y="258" width="170" height="56" rx="0"/><text class="body" x="665" y="282" text-anchor="middle">Monthly</text><text class="on" x="665" y="301" text-anchor="middle">financial tracking</text></g><g id="node-interviews"><rect class="cell-h" x="30" y="314" width="240" height="56" rx="0"/><text class="sh" x="150" y="338" text-anchor="middle">Stakeholder interviews</text><text class="on" x="150" y="357" text-anchor="middle">experiences and barriers</text><rect class="cell" x="270" y="314" width="310" height="56" rx="0"/><text class="body" x="425" y="338" text-anchor="middle">Experiences that numbers miss</text><text class="on" x="425" y="357" text-anchor="middle">captures views of teachers, parents</text><rect class="cell" x="580" y="314" width="170" height="56" rx="0"/><text class="body" x="665" y="338" text-anchor="middle">Mid-term</text><text class="on" x="665" y="357" text-anchor="middle">qualitative insight</text></g></g><g id="layer-labels"><text class="h" x="390" y="30" text-anchor="middle">Common M&amp;E Tools in Pakistan</text><text class="small" x="390" y="410" text-anchor="middle">No single tool tells the whole story. Good M&amp;E combines several tools.</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
