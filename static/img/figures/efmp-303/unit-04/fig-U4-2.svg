<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Common M and E tools in Pakistan education system</title><desc id="d">A table with three columns: M&amp;E tool, what it measures, and when to use it; rows for attendance records, test results, school visits, budget reports and stakeholder interviews.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Common M&amp;E Tools in Pakistan</text><rect class="panel" x="50" y="50" width="170" height="36" rx="4"/><text class="sh" x="135" y="73" text-anchor="middle">M&amp;E tool</text><rect class="panel" x="230" y="50" width="310" height="36" rx="4"/><text class="sh" x="385" y="73" text-anchor="middle">What it measures</text><rect class="panel" x="550" y="50" width="180" height="36" rx="4"/><text class="sh" x="640" y="73" text-anchor="middle">When to use it</text><rect class="panel-a" x="50" y="90" width="170" height="52" rx="4"/><text class="body" x="135" y="113" text-anchor="middle">Attendance registers</text><text class="small" x="135" y="132" text-anchor="middle">enrolment and dropout</text><rect class="panel-a" x="230" y="90" width="310" height="52" rx="4"/><text class="body" x="385" y="113" text-anchor="middle">Enrolment, attendance and dropout</text><text class="small" x="385" y="132" text-anchor="middle">tracked daily or monthly by the school</text><rect class="panel-a" x="550" y="90" width="180" height="52" rx="4"/><text class="body" x="640" y="113" text-anchor="middle">Monthly</text><text class="small" x="640" y="132" text-anchor="middle">routine monitoring</text><rect class="panel-a" x="50" y="146" width="170" height="52" rx="4"/><text class="body" x="135" y="169" text-anchor="middle">Test results</text><text class="small" x="135" y="188" text-anchor="middle">learning outcomes</text><rect class="panel-a" x="230" y="146" width="310" height="52" rx="4"/><text class="body" x="385" y="169" text-anchor="middle">What pupils have learned</text><text class="small" x="385" y="188" text-anchor="middle">snapshot, does not explain why</text><rect class="panel-a" x="550" y="146" width="180" height="52" rx="4"/><text class="body" x="640" y="169" text-anchor="middle">Annually</text><text class="small" x="640" y="188" text-anchor="middle">periodic assessment</text><rect class="panel-a" x="50" y="202" width="170" height="52" rx="4"/><text class="body" x="135" y="225" text-anchor="middle">School visits</text><text class="small" x="135" y="244" text-anchor="middle">teacher presence and conditions</text><rect class="panel-a" x="230" y="202" width="310" height="52" rx="4"/><text class="body" x="385" y="225" text-anchor="middle">Teacher presence, classroom conditions</text><text class="small" x="385" y="244" text-anchor="middle">and availability of materials</text><rect class="panel-a" x="550" y="202" width="180" height="52" rx="4"/><text class="body" x="640" y="225" text-anchor="middle">Quarterly</text><text class="small" x="640" y="244" text-anchor="middle">inspection visits</text><rect class="panel-a" x="50" y="258" width="170" height="52" rx="4"/><text class="body" x="135" y="281" text-anchor="middle">Budget reports</text><text class="small" x="135" y="300" text-anchor="middle">financial inputs</text><rect class="panel-a" x="230" y="258" width="310" height="52" rx="4"/><text class="body" x="385" y="281" text-anchor="middle">Allocation, release and spending</text><text class="small" x="385" y="300" text-anchor="middle">tracks whether funds reach schools</text><rect class="panel-a" x="550" y="258" width="180" height="52" rx="4"/><text class="body" x="640" y="281" text-anchor="middle">Monthly</text><text class="small" x="640" y="300" text-anchor="middle">financial tracking</text><rect class="panel-a" x="50" y="314" width="170" height="52" rx="4"/><text class="body" x="135" y="337" text-anchor="middle">Stakeholder interviews</text><text class="small" x="135" y="356" text-anchor="middle">experiences and barriers</text><rect class="panel-a" x="230" y="314" width="310" height="52" rx="4"/><text class="body" x="385" y="337" text-anchor="middle">Experiences that numbers miss</text><text class="small" x="385" y="356" text-anchor="middle">captures views of teachers, parents</text><rect class="panel-a" x="550" y="314" width="180" height="52" rx="4"/><text class="body" x="640" y="337" text-anchor="middle">Mid-term</text><text class="small" x="640" y="356" text-anchor="middle">qualitative insight</text><text class="small" x="390" y="400" text-anchor="middle">No single tool tells the whole story. Good M&amp;E combines several tools.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
