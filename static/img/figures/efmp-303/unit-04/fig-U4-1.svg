<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The monitoring and evaluation cycle</title><desc id="d">A flowchart showing five stages arranged in a cycle: Set indicators, Collect data, Analyse, Report, Use findings, with arrows looping from Use findings back to Set indicators.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="22" text-anchor="middle">The M&amp;E Cycle</text><rect class="panel-a" x="325" y="46" width="130" height="48" rx="6"/><text class="sh" x="390" y="74" text-anchor="middle">Set indicators</text><rect class="panel-a" x="484" y="161" width="130" height="48" rx="6"/><text class="sh" x="549" y="189" text-anchor="middle">Collect data</text><rect class="panel-a" x="423" y="335" width="130" height="48" rx="6"/><text class="sh" x="488" y="363" text-anchor="middle">Analyse</text><rect class="panel-a" x="227" y="335" width="130" height="48" rx="6"/><text class="sh" x="292" y="363" text-anchor="middle">Report</text><rect class="panel-a" x="166" y="161" width="130" height="48" rx="6"/><text class="sh" x="231" y="189" text-anchor="middle">Use findings</text><line x1="450" y1="94" x2="484" y2="161" class="stroke-a" marker-end="url(#arrow)"/><line x1="539" y1="209" x2="488" y2="335" class="stroke-a" marker-end="url(#arrow)"/><line x1="423" y1="359" x2="357" y2="359" class="stroke-a" marker-end="url(#arrow)"/><line x1="292" y1="335" x2="231" y2="209" class="stroke-a" marker-end="url(#arrow)"/><line x1="231" y1="161" x2="325" y2="70" class="stroke-a" marker-end="url(#arrow)"/><text class="small" x="390" y="110" text-anchor="middle">Define what success looks like</text><text class="small" x="620" y="225" text-anchor="end">Gather routine and periodic data</text><text class="small" x="558" y="399" text-anchor="end">Compare actual against planned</text><text class="small" x="222" y="399" text-anchor="start">Share findings with decision makers</text><text class="small" x="161" y="225" text-anchor="start">Inform planning and redesign</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
