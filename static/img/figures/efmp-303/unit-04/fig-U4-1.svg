<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The monitoring and evaluation cycle</title><desc id="d">A flowchart of five stages arranged in a cycle - set indicators, collect data, analyse, report, use findings - with a short note under each stage and arrows looping from use findings back to set indicators.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .ink{fill:var(--ink);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .on{font-size:13px;fill:var(--ink);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);}</style><rect class="bg" x="0" y="0" width="780" height="450"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-indicators-collect" class="stroke-a" d="M518,72 Q630,72 630,150" marker-end="url(#arrow)"/><path id="edge-collect-analyse" class="stroke-a" d="M630,214 Q630,290 560,320" marker-end="url(#arrow)"/><path id="edge-analyse-report" class="stroke-a" d="M412,352 L368,352" marker-end="url(#arrow)"/><path id="edge-report-use" class="stroke-a" d="M220,320 Q150,290 150,214" marker-end="url(#arrow)"/><path id="edge-use-indicators" class="stroke-a" d="M150,150 Q150,72 262,72" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-indicators"><rect class="panel-a" x="262" y="40" width="256" height="64" rx="8"/><text class="sh" x="390" y="67" text-anchor="middle">Set indicators</text><text class="on" x="390" y="88" text-anchor="middle">Define what success looks like</text></g><g id="node-collect"><rect class="panel-a" x="502" y="150" width="256" height="64" rx="8"/><text class="sh" x="630" y="177" text-anchor="middle">Collect data</text><text class="on" x="630" y="198" text-anchor="middle">Gather routine and periodic data</text></g><g id="node-analyse"><rect class="panel-a" x="412" y="320" width="256" height="64" rx="8"/><text class="sh" x="540" y="347" text-anchor="middle">Analyse</text><text class="on" x="540" y="368" text-anchor="middle">Compare actual against planned</text></g><g id="node-report"><rect class="panel-a" x="112" y="320" width="256" height="64" rx="8"/><text class="sh" x="240" y="347" text-anchor="middle">Report</text><text class="on" x="240" y="368" text-anchor="middle">Share findings with decision makers</text></g><g id="node-use"><rect class="panel-a" x="22" y="150" width="256" height="64" rx="8"/><text class="sh" x="150" y="177" text-anchor="middle">Use findings</text><text class="on" x="150" y="198" text-anchor="middle">Inform planning and redesign</text></g></g><g id="layer-labels"><text class="h" x="390" y="26" text-anchor="middle">The M&amp;E Cycle</text></g><text class="wm" x="768" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
