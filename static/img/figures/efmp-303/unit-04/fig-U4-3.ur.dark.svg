<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پالیسی کے نفاذ میں چیلنجز</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں پالیسی کے نفاذ میں چیلنجز ہیں۔ تین شاخیں ہیں: مالی پابندیاں، یعنی ناکافی رقم، رقم کے اجرا میں تاخیر اور مختلف سطحوں پر رقم کا ضیاع؛ عدم سیاسی استحکام، یعنی حکومت کی تبدیلی، وزرا کی تبدیلی اور پالیسی کا تسلسل ٹوٹنا؛ اور بیوکریٹک اور انتظامی مسائل، یعنی منظوری کے پیچیدہ طریقے اور محکموں کے درمیان کمزور ہم آہنگی۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470" /><text class="h" x="390" y="36" text-anchor="middle">پالیسی کے نفاذ میں چیلنجز</text><rect class="panel" x="300" y="200" width="180" height="50" rx="8" /><text class="sh" x="390" y="222" text-anchor="middle" style="font-size:11px">پالیسی کے نفاذ میں</text><text class="sh" x="390" y="244" text-anchor="middle" style="font-size:11px">چیلنجز</text><rect class="panel-a" x="520" y="60" width="210" height="40" rx="6" /><text class="sh" x="625" y="85" text-anchor="middle">مالی پابندیاں</text><rect class="panel-b" x="50" y="60" width="210" height="40" rx="6" /><text class="sh" x="155" y="85" text-anchor="middle">عدم سیاسی استحکام</text><rect class="panel-c" x="265" y="360" width="250" height="40" rx="6" /><text class="sh" x="390" y="385" text-anchor="middle">بیوکریٹک اور انتظامی مسائل</text><line x1="480" y1="225" x2="520" y2="80" class="stroke-a" /><line x1="300" y1="225" x2="260" y2="80" class="stroke-a" /><line x1="390" y1="250" x2="390" y2="360" class="stroke-a" /><circle cx="680" cy="130" r="4" class="ink" /><text class="body" x="670" y="135" text-anchor="end">ناکافی رقم</text><circle cx="680" cy="155" r="4" class="ink" /><text class="body" x="670" y="160" text-anchor="end">رقم کے اجرا میں تاخیر</text><circle cx="680" cy="180" r="4" class="ink" /><text class="body" x="670" y="185" text-anchor="end">مختلف سطحوں پر رقم کا ضیاع</text><circle cx="210" cy="130" r="4" class="ink" /><text class="body" x="200" y="135" text-anchor="end">حکومت کی تبدیلی</text><circle cx="210" cy="155" r="4" class="ink" /><text class="body" x="200" y="160" text-anchor="end">وزرا کی تبدیلی</text><circle cx="210" cy="180" r="4" class="ink" /><text class="body" x="200" y="185" text-anchor="end">پالیسی کا تسلسل ٹوٹنا</text><circle cx="470" cy="430" r="4" class="ink" /><text class="body" x="460" y="435" text-anchor="end">منظوری کے پیچیدہ طریقے</text><circle cx="470" cy="452" r="4" class="ink" /><text class="body" x="460" y="457" text-anchor="end">محکموں میں کمزور ہم آہنگی</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
