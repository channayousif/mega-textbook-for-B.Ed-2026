<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پالیسی کے نفاذ میں چیلنجز</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں پالیسی کے نفاذ میں چیلنجز ہیں۔ تین شاخیں ہیں: مالی پابندیاں، یعنی ناکافی رقم، رقم کے اجرا میں تاخیر اور مختلف سطحوں پر رقم کا ضیاع؛ عدم سیاسی استحکام، یعنی حکومت کی تبدیلی، وزرا کی تبدیلی اور پالیسی کا تسلسل ٹوٹنا؛ اور بیوکریٹک اور انتظامی مسائل، یعنی منظوری کے پیچیدہ طریقے اور محکموں کے درمیان کمزور ہم آہنگی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .ink{fill:var(--ink);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .on{font-size:13px;fill:var(--ink);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-challenges-financial" class="stroke-a" d="M495 242 Q610 242 610 186"/><path id="edge-challenges-political" class="stroke-a" d="M285 242 Q170 242 170 186"/><path id="edge-challenges-bureaucratic" class="stroke-a" d="M390 274 L390 320"/></g><g id="layer-nodes"><g id="node-challenges"><rect class="panel" x="285" y="210" width="210" height="64" rx="32"/><text class="sh" x="390" y="235" text-anchor="middle">پالیسی کے نفاذ میں</text><text class="sh" x="390" y="262" text-anchor="middle">چیلنجز</text></g><g id="node-financial"><rect class="panel-a" x="470" y="50" width="280" height="136" rx="8"/><text class="sh" x="610" y="76" text-anchor="middle">مالی پابندیاں</text><circle class="ink" cx="730" cy="101" r="3"/><text class="body" x="718" y="106" text-anchor="end">ناکافی رقم</text><circle class="ink" cx="730" cy="129" r="3"/><text class="body" x="718" y="134" text-anchor="end">رقم کے اجرا میں تاخیر</text><circle class="ink" cx="730" cy="157" r="3"/><text class="body" x="718" y="162" text-anchor="end">مختلف سطحوں پر رقم کا ضیاع</text></g><g id="node-political"><rect class="panel-b" x="30" y="50" width="280" height="136" rx="8"/><text class="sh" x="170" y="76" text-anchor="middle">عدم سیاسی استحکام</text><circle class="ink" cx="290" cy="101" r="3"/><text class="body" x="278" y="106" text-anchor="end">حکومت کی تبدیلی</text><circle class="ink" cx="290" cy="129" r="3"/><text class="body" x="278" y="134" text-anchor="end">وزرا کی تبدیلی</text><circle class="ink" cx="290" cy="157" r="3"/><text class="body" x="278" y="162" text-anchor="end">پالیسی کا تسلسل ٹوٹنا</text></g><g id="node-bureaucratic"><rect class="panel-c" x="220" y="320" width="340" height="108" rx="8"/><text class="sh" x="390" y="346" text-anchor="middle">بیوکریٹک اور انتظامی مسائل</text><circle class="ink" cx="540" cy="371" r="3"/><text class="body" x="528" y="376" text-anchor="end">منظوری کے پیچیدہ طریقے</text><circle class="ink" cx="540" cy="399" r="3"/><text class="body" x="528" y="404" text-anchor="end">محکموں میں کمزور ہم آہنگی</text></g></g><g id="layer-labels"><text class="h" x="390" y="30" text-anchor="middle">پالیسی کے نفاذ میں چیلنجز</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
