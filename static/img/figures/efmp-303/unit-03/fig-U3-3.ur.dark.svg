<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی خاکہ: تعلیمی منصوبہ بندی کے مراحل</title><desc id="d">چھ مراحل ترتیب سے: ضروریات کا جائزہ، اہداف، وسائل کی منصوبہ بندی، عمل کی تشکیل، نفاذ، نگرانی اور جائزہ۔ فیڈ بیک چھٹے مرحلے سے پہلے کی طرف لوٹتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-needs-goals" d="M520 105 L480 105" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-goals-resources" d="M280 105 L240 105" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-resources-design" d="M140 140 L140 170 L620 170 L620 200" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-design-implementation" d="M520 235 L480 235" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-implementation-monitoring" d="M280 235 L240 235" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-monitoring-needs" d="M140 270 L140 300 L760 300 L760 105 L720 105" class="stroke-a dash" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-needs"><rect x="520" y="70" width="200" height="70" rx="8" class="panel-a"/><text x="620" y="97" text-anchor="middle" class="sh">‫1. ضروریات کا جائزہ‬</text><text x="620" y="123" text-anchor="middle" class="small">‫موجودہ صورت حال کیا ہے؟‬</text></g><g id="node-goals"><rect x="280" y="70" width="200" height="70" rx="8" class="panel-b"/><text x="380" y="97" text-anchor="middle" class="sh">‫2. اہداف کا تعین‬</text><text x="380" y="123" text-anchor="middle" class="small">‫قابل پیمائش اہداف طے کریں‬</text></g><g id="node-resources"><rect x="40" y="70" width="200" height="70" rx="8" class="panel-c"/><text x="140" y="97" text-anchor="middle" class="sh">‫3. وسائل کی منصوبہ بندی‬</text><text x="140" y="123" text-anchor="middle" class="small">‫رقم، افراد، سامان‬</text></g><g id="node-design"><rect x="520" y="200" width="200" height="70" rx="8" class="panel-a"/><text x="620" y="227" text-anchor="middle" class="sh">‫4. عملی اقدامات کی ترتیب‬</text><text x="620" y="253" text-anchor="middle" class="small">‫کون، کیا، کب کرے گا‬</text></g><g id="node-implementation"><rect x="280" y="200" width="200" height="70" rx="8" class="panel-b"/><text x="380" y="227" text-anchor="middle" class="sh">‫5. نفاذ‬</text><text x="380" y="253" text-anchor="middle" class="small">‫منصوبے پر عمل کریں‬</text></g><g id="node-monitoring"><rect x="40" y="200" width="200" height="70" rx="8" class="panel-c"/><text x="140" y="227" text-anchor="middle" class="sh">‫6. نگرانی اور جانچ‬</text><text x="140" y="253" text-anchor="middle" class="small">‫پیش رفت دیکھیں، تبدیلی کریں‬</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">‫تعلیمی منصوبہ بندی کے مراحل‬</text><text id="label-feedback" x="390" y="326" text-anchor="middle" class="small">‫بازخورد: جانچ اگلے ضروریات کے جائزے کی رہنمائی کرتی ہے‬</text><g id="label-note"><text x="740" y="370" text-anchor="end" class="body">‫منصوبہ بندی مسلسل عمل ہے۔ ہر مرحلہ اگلے سے جڑتا ہے،‬</text><text x="740" y="396" text-anchor="end" class="body">‫اور مرحلہ 6 کی جانچ اگلے منصوبہ بندی دور کی رہنمائی کرتی ہے۔‬</text></g></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
