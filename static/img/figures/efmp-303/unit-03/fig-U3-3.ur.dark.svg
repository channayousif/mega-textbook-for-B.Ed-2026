<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی خاکہ: تعلیمی منصوبہ بندی کے مراحل</title><desc id="d">ضروریات کے جائزے، اہداف کے تعین، وسائل کی تقسیم، نفاذ، نگرانی اور جانچ کا سلسلہ۔ جانچ سے اگلے ضروریات کے جائزے تک بازخورد کا حلقہ ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="390" y="38" text-anchor="middle" class="h" transform="translate(780 0) scale(-1 1)">تعلیمی منصوبہ بندی کے مراحل</text><rect x="40" y="70" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="100" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">1. ضروریات کا جائزہ</text><text x="140" y="118" text-anchor="middle" class="small" transform="translate(280 0) scale(-1 1)">موجودہ صورت حال کیا ہے؟</text><rect x="290" y="70" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="100" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">2. اہداف کا تعین</text><text x="390" y="118" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">قابل پیمائش اہداف طے کریں</text><rect x="540" y="70" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="100" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">3. وسائل کی منصوبہ بندی</text><text x="640" y="118" text-anchor="middle" class="small" transform="translate(1280 0) scale(-1 1)">رقم، افراد، سامان</text><line x1="240" y1="100" x2="288" y2="100" class="stroke-a" marker-end="url(#arrow)"/><line x1="490" y1="100" x2="538" y2="100" class="stroke-a" marker-end="url(#arrow)"/><rect x="540" y="200" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="230" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">6. نگرانی اور جانچ</text><text x="640" y="248" text-anchor="middle" class="small" transform="translate(1280 0) scale(-1 1)">پیش رفت دیکھیں، تبدیلی کریں</text><rect x="290" y="200" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="230" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">5. نفاذ</text><text x="390" y="248" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">منصوبے پر عمل کریں</text><rect x="40" y="200" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="230" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">4. عملی اقدامات کی ترتیب</text><text x="140" y="248" text-anchor="middle" class="small" transform="translate(280 0) scale(-1 1)">کون، کیا، کب کرے گا</text><line x1="540" y1="230" x2="492" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="290" y1="230" x2="242" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="640" y1="130" x2="640" y2="198" class="stroke-a" marker-end="url(#arrow)"/><line x1="140" y1="200" x2="140" y2="132" class="stroke-a" marker-end="url(#arrow)"/><path d="M40,230 L10,230 L10,300 L640,300 L640,262" class="stroke-a" marker-end="url(#arrow)"/><text x="300" y="318" text-anchor="middle" class="small" transform="translate(600 0) scale(-1 1)">بازخورد کا حلقہ: جانچ اگلے ضروریات کے جائزے کی رہنمائی کرتی ہے</text><text x="40" y="360" class="body" transform="translate(80 0) scale(-1 1)" text-anchor="end">منصوبہ بندی مسلسل عمل ہے۔ ہر مرحلہ اگلے سے جڑتا ہے،</text><text x="40" y="380" class="body" transform="translate(80 0) scale(-1 1)" text-anchor="end">اور مرحلہ 6 کی جانچ اگلے منصوبہ بندی دور کی رہنمائی کرتی ہے۔</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
