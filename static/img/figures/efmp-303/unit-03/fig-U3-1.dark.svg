<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map: Development plan and its branches</title><desc id="d">A concept map showing 'Development plan' at the centre with branches for education chapter, health chapter, infrastructure chapter, resource allocation, and education outcomes, with arrows showing how resource allocation feeds into education outcomes.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-health-plan" d="M240,90 L306,141" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-education-plan" d="M240,270 L306,219" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-infrastructure-plan" d="M540,90 L474,141" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-resources-plan" d="M540,270 L474,219" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-plan-outcomes" d="M390,240 L390,360" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-resources-outcomes" d="M640,300 C640,360 580,390 500,390" class="stroke-a" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-plan"><ellipse cx="390" cy="180" rx="110" ry="60" class="panel-a"/><text x="390" y="174" text-anchor="middle" class="sh">Development plan</text><text x="390" y="196" text-anchor="middle" class="small">multi-sector document</text></g><g id="node-health"><rect x="40" y="60" width="200" height="60" rx="8" class="panel"/><text x="140" y="95" text-anchor="middle" class="sh">Health chapter</text></g><g id="node-education"><rect x="40" y="240" width="200" height="60" rx="8" class="panel"/><text x="140" y="275" text-anchor="middle" class="sh">Education chapter</text></g><g id="node-infrastructure"><rect x="540" y="60" width="200" height="60" rx="8" class="panel"/><text x="640" y="95" text-anchor="middle" class="sh">Infrastructure chapter</text></g><g id="node-resources"><rect x="540" y="240" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="275" text-anchor="middle" class="sh">Resource allocation</text></g><g id="node-outcomes"><rect x="280" y="360" width="220" height="60" rx="8" class="panel-d"/><text x="390" y="395" text-anchor="middle" class="sh">Education outcomes</text></g></g><g id="layer-labels"><text id="label-feeds" x="632" y="380" text-anchor="start" class="small">feeds into</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
