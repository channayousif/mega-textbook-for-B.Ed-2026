<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table: Pakistan Vision 2025, education baseline and targets</title><desc id="d">A table quoting the education section and goals of Pakistan Vision 2025 (Planning Commission, 2014). Public spending on education: barely 2% of GDP reported; target 4% of GDP by 2018. Literacy rate: 57%, rural 50% reported; target 90%. Primary enrolment and completion: low net enrolment reported; target 100%. Gender parity at primary and secondary level: much lower female enrolment reported; target parity index of 1. Printed page numbers are 33 and 101.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text x="390" y="38" text-anchor="middle" class="h">Pakistan Vision 2025: education baseline and targets</text><line x1="50" y1="60" x2="730" y2="60" class="stroke"/><rect x="50" y="60" width="200" height="44" class="panel-a"/><text x="150" y="87" text-anchor="middle" class="sh">Indicator</text><rect x="250" y="60" width="240" height="44" class="panel-a"/><text x="370" y="87" text-anchor="middle" class="sh">Baseline reported (2014)</text><rect x="490" y="60" width="240" height="44" class="panel-a"/><text x="610" y="87" text-anchor="middle" class="sh">Vision 2025 target</text><rect x="50" y="104" width="200" height="56" class="panel"/><text x="150" y="128" text-anchor="middle" class="body">Public spending</text><text x="150" y="147" text-anchor="middle" class="body">on education</text><rect x="250" y="104" width="240" height="56" class="panel"/><text x="370" y="128" text-anchor="middle" class="body">Barely 2% of GDP</text><text x="370" y="147" text-anchor="middle" class="small">p. 33</text><rect x="490" y="104" width="240" height="56" class="panel"/><text x="610" y="128" text-anchor="middle" class="body">4% of GDP by 2018</text><text x="610" y="147" text-anchor="middle" class="small">p. 33</text><rect x="50" y="160" width="200" height="56" class="panel-b"/><text x="150" y="193" text-anchor="middle" class="body">Literacy rate</text><rect x="250" y="160" width="240" height="56" class="panel-b"/><text x="370" y="184" text-anchor="middle" class="body">57% (rural 50%)</text><text x="370" y="203" text-anchor="middle" class="small">p. 33</text><rect x="490" y="160" width="240" height="56" class="panel-b"/><text x="610" y="184" text-anchor="middle" class="body">90%</text><text x="610" y="203" text-anchor="middle" class="small">Goal 1, p. 101</text><rect x="50" y="216" width="200" height="56" class="panel"/><text x="150" y="240" text-anchor="middle" class="body">Primary enrolment</text><text x="150" y="259" text-anchor="middle" class="body">and completion</text><rect x="250" y="216" width="240" height="56" class="panel"/><text x="370" y="240" text-anchor="middle" class="body">Low net enrolment</text><text x="370" y="259" text-anchor="middle" class="small">p. 33</text><rect x="490" y="216" width="240" height="56" class="panel"/><text x="610" y="240" text-anchor="middle" class="body">100%</text><text x="610" y="259" text-anchor="middle" class="small">Goal 1, p. 101</text><rect x="50" y="272" width="200" height="56" class="panel-b"/><text x="150" y="296" text-anchor="middle" class="body">Gender parity</text><text x="150" y="315" text-anchor="middle" class="body">primary and secondary</text><rect x="250" y="272" width="240" height="56" class="panel-b"/><text x="370" y="296" text-anchor="middle" class="body">Much lower female</text><text x="370" y="315" text-anchor="middle" class="small">enrolment, p. 33</text><rect x="490" y="272" width="240" height="56" class="panel-b"/><text x="610" y="296" text-anchor="middle" class="body">Parity index of 1</text><text x="610" y="315" text-anchor="middle" class="small">Goal 3, p. 101</text><line x1="50" y1="104" x2="730" y2="104" class="grid"/><line x1="50" y1="160" x2="730" y2="160" class="grid"/><line x1="50" y1="216" x2="730" y2="216" class="grid"/><line x1="50" y1="272" x2="730" y2="272" class="grid"/><line x1="50" y1="328" x2="730" y2="328" class="grid"/><line x1="250" y1="60" x2="250" y2="328" class="grid"/><line x1="490" y1="60" x2="490" y2="328" class="grid"/><line x1="50" y1="328" x2="730" y2="328" class="stroke"/><text x="50" y="358" class="small">Source: Planning Commission of Pakistan (2014), Pakistan Vision 2025,</text><text x="50" y="376" class="small">printed pages 3, 33 and 101. Baseline figures are those the document reports</text><text x="50" y="394" class="small">for 2014, not current data. The Vision is put into effect through five-year</text><text x="50" y="412" class="small">and annual plans (p. 3).</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>