<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table: Pakistan Vision 2025, education baseline and targets</title><desc id="d">Pakistan Vision 2025 (2014): reported baselines and historical education targets, including spending as a share of GDP, not a share of the plan budget. Sources: printed pages 33 and 101.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect x="40" y="60" width="200" height="40" class="panel-a"/><rect x="240" y="60" width="260" height="40" class="panel-a"/><rect x="500" y="60" width="240" height="40" class="panel-a"/><text x="140" y="85" text-anchor="middle" class="sh">Indicator</text><text x="370" y="85" text-anchor="middle" class="sh">Baseline reported (2014)</text><text x="620" y="85" text-anchor="middle" class="sh">Vision 2025 target</text></g><g id="node-spending"><rect x="40" y="100" width="200" height="64" class="panel"/><rect x="240" y="100" width="260" height="64" class="panel"/><rect x="500" y="100" width="240" height="64" class="panel"/><text x="140" y="128" text-anchor="middle" class="body">Public spending</text><text x="140" y="149" text-anchor="middle" class="body">on education</text><text x="370" y="128" text-anchor="middle" class="body">Barely 2% of GDP</text><text x="370" y="149" text-anchor="middle" class="small">p. 33</text><text x="620" y="128" text-anchor="middle" class="body">4% of GDP by 2018</text><text x="620" y="149" text-anchor="middle" class="small">p. 33</text></g><g id="node-literacy"><rect x="40" y="164" width="200" height="64" class="panel"/><rect x="240" y="164" width="260" height="64" class="panel"/><rect x="500" y="164" width="240" height="64" class="panel"/><text x="140" y="201" text-anchor="middle" class="body">Literacy rate</text><text x="370" y="192" text-anchor="middle" class="body">57% (rural 50%)</text><text x="370" y="213" text-anchor="middle" class="small">p. 33</text><text x="620" y="192" text-anchor="middle" class="body">90%</text><text x="620" y="213" text-anchor="middle" class="small">Goal 1, p. 101</text></g><g id="node-enrolment"><rect x="40" y="228" width="200" height="64" class="panel"/><rect x="240" y="228" width="260" height="64" class="panel"/><rect x="500" y="228" width="240" height="64" class="panel"/><text x="140" y="256" text-anchor="middle" class="body">Primary enrolment</text><text x="140" y="277" text-anchor="middle" class="body">and completion</text><text x="370" y="256" text-anchor="middle" class="body">Low net enrolment</text><text x="370" y="277" text-anchor="middle" class="small">p. 33</text><text x="620" y="256" text-anchor="middle" class="body">100%</text><text x="620" y="277" text-anchor="middle" class="small">Goal 1, p. 101</text></g><g id="node-parity"><rect x="40" y="292" width="200" height="64" class="panel"/><rect x="240" y="292" width="260" height="64" class="panel"/><rect x="500" y="292" width="240" height="64" class="panel"/><text x="140" y="320" text-anchor="middle" class="body">Gender parity</text><text x="140" y="341" text-anchor="middle" class="body">primary and secondary</text><text x="370" y="320" text-anchor="middle" class="body">Much lower female</text><text x="370" y="341" text-anchor="middle" class="body">enrolment, p. 33</text><text x="620" y="320" text-anchor="middle" class="body">Parity index of 1</text><text x="620" y="341" text-anchor="middle" class="small">Goal 3, p. 101</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">Pakistan Vision 2025: education baseline and targets</text><g id="label-source"><text x="40" y="380" text-anchor="start" class="small">Source: Planning Commission of Pakistan (2014), Pakistan Vision 2025,</text><text x="40" y="398" text-anchor="start" class="small">printed pages 3, 33 and 101. Baseline figures are those the document reports</text><text x="40" y="416" text-anchor="start" class="small">in its 2014 edition, not current data. The Vision is put into effect through five-year</text><text x="40" y="434" text-anchor="start" class="small">and annual plans (p. 3).</text></g></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
