<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table: Types of educational planning</title><desc id="d">A table comparing micro, macro and strategic planning across columns for scope, who does it, time frame and example.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text x="390" y="38" text-anchor="middle" class="h">Types of educational planning</text><line x1="50" y1="60" x2="730" y2="60" class="stroke"/><rect x="50" y="60" width="130" height="44" class="panel-a"/><rect x="180" y="60" width="150" height="44" class="panel-a"/><rect x="330" y="60" width="150" height="44" class="panel-a"/><rect x="480" y="60" width="120" height="44" class="panel-a"/><rect x="600" y="60" width="130" height="44" class="panel-a"/><text x="115" y="87" text-anchor="middle" class="sh">Type</text><text x="255" y="87" text-anchor="middle" class="sh">Scope</text><text x="405" y="87" text-anchor="middle" class="sh">Who does it</text><text x="540" y="87" text-anchor="middle" class="sh">Time frame</text><text x="665" y="87" text-anchor="middle" class="sh">Example</text><rect x="50" y="104" width="130" height="70" class="panel-b"/><rect x="180" y="104" width="150" height="70" class="panel-b"/><rect x="330" y="104" width="150" height="70" class="panel-b"/><rect x="480" y="104" width="120" height="70" class="panel-b"/><rect x="600" y="104" width="130" height="70" class="panel-b"/><text x="115" y="131" text-anchor="middle" class="sh">Micro planning</text><text x="255" y="126" text-anchor="middle" class="body">School level</text><text x="255" y="144" text-anchor="middle" class="small">narrow, detailed</text><text x="255" y="162" text-anchor="middle" class="small">focus</text><text x="405" y="131" text-anchor="middle" class="body">Head teacher</text><text x="405" y="149" text-anchor="middle" class="small">School staff</text><text x="540" y="131" text-anchor="middle" class="body">1 year</text><text x="540" y="149" text-anchor="middle" class="small">or less</text><text x="665" y="126" text-anchor="middle" class="body">Timetable</text><text x="665" y="144" text-anchor="middle" class="small">planning</text><text x="665" y="162" text-anchor="middle" class="small">School improvement</text><rect x="50" y="174" width="130" height="70" class="panel"/><rect x="180" y="174" width="150" height="70" class="panel"/><rect x="330" y="174" width="150" height="70" class="panel"/><rect x="480" y="174" width="120" height="70" class="panel"/><rect x="600" y="174" width="130" height="70" class="panel"/><text x="115" y="201" text-anchor="middle" class="sh">Macro planning</text><text x="255" y="196" text-anchor="middle" class="body">District,</text><text x="255" y="214" text-anchor="middle" class="body">provincial or</text><text x="255" y="232" text-anchor="middle" class="body">national</text><text x="405" y="201" text-anchor="middle" class="body">Education</text><text x="405" y="219" text-anchor="middle" class="small">department</text><text x="540" y="201" text-anchor="middle" class="body">3-5 years</text><text x="665" y="196" text-anchor="middle" class="body">Teacher</text><text x="665" y="214" text-anchor="middle" class="small">recruitment plan</text><text x="665" y="232" text-anchor="middle" class="small">Budget planning</text><rect x="50" y="244" width="130" height="70" class="panel-c"/><rect x="180" y="244" width="150" height="70" class="panel-c"/><rect x="330" y="244" width="150" height="70" class="panel-c"/><rect x="480" y="244" width="120" height="70" class="panel-c"/><rect x="600" y="244" width="130" height="70" class="panel-c"/><text x="115" y="271" text-anchor="middle" class="sh">Strategic planning</text><text x="255" y="266" text-anchor="middle" class="body">Focused scope</text><text x="255" y="284" text-anchor="middle" class="small">specific problem</text><text x="255" y="302" text-anchor="middle" class="small">or goal</text><text x="405" y="271" text-anchor="middle" class="body">District or</text><text x="405" y="289" text-anchor="middle" class="small">provincial authority</text><text x="540" y="271" text-anchor="middle" class="body">2-4 years</text><text x="540" y="289" text-anchor="middle" class="small">time-bound</text><text x="665" y="266" text-anchor="middle" class="body">Girls' enrolment</text><text x="665" y="284" text-anchor="middle" class="small">strategy</text><text x="665" y="302" text-anchor="middle" class="small">Turnaround plan</text><line x1="50" y1="104" x2="730" y2="104" class="grid"/><line x1="50" y1="174" x2="730" y2="174" class="grid"/><line x1="50" y1="244" x2="730" y2="244" class="grid"/><line x1="50" y1="314" x2="730" y2="314" class="grid"/><line x1="180" y1="60" x2="180" y2="314" class="grid"/><line x1="330" y1="60" x2="330" y2="314" class="grid"/><line x1="480" y1="60" x2="480" y2="314" class="grid"/><line x1="600" y1="60" x2="600" y2="314" class="grid"/><line x1="50" y1="314" x2="730" y2="314" class="stroke"/><text x="50" y="350" class="body">All three types operate simultaneously in Pakistan's education system.</text><text x="50" y="370" class="body">A teacher may encounter all three during a single school year.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
