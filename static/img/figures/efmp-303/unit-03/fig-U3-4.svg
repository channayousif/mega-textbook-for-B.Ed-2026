<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table: Types of educational planning</title><desc id="d">A table comparing micro, macro and strategic planning across columns for scope, who does it, time frame and example.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect x="30" y="60" width="130" height="40" class="panel-a"/><rect x="160" y="60" width="150" height="40" class="panel-a"/><rect x="310" y="60" width="160" height="40" class="panel-a"/><rect x="470" y="60" width="120" height="40" class="panel-a"/><rect x="590" y="60" width="160" height="40" class="panel-a"/><text x="95" y="85" text-anchor="middle" class="sh">Type</text><text x="235" y="85" text-anchor="middle" class="sh">Scope</text><text x="390" y="85" text-anchor="middle" class="sh">Who does it</text><text x="530" y="85" text-anchor="middle" class="sh">Time frame</text><text x="670" y="85" text-anchor="middle" class="sh">Example</text></g><g id="node-micro"><rect x="30" y="100" width="130" height="90" class="panel"/><rect x="160" y="100" width="150" height="90" class="panel"/><rect x="310" y="100" width="160" height="90" class="panel"/><rect x="470" y="100" width="120" height="90" class="panel"/><rect x="590" y="100" width="160" height="90" class="panel"/><text x="95" y="150" text-anchor="middle" class="sh">Micro planning</text><text x="235" y="131" text-anchor="middle" class="body">School level</text><text x="235" y="150" text-anchor="middle" class="small">narrow, detailed</text><text x="235" y="169" text-anchor="middle" class="small">focus</text><text x="390" y="141" text-anchor="middle" class="body">Head teacher</text><text x="390" y="160" text-anchor="middle" class="body">School staff</text><text x="530" y="141" text-anchor="middle" class="body">Often one</text><text x="530" y="160" text-anchor="middle" class="body">school year</text><text x="670" y="141" text-anchor="middle" class="body">Timetable planning</text><text x="670" y="160" text-anchor="middle" class="body">School improvement</text></g><g id="node-macro"><rect x="30" y="190" width="130" height="90" class="panel"/><rect x="160" y="190" width="150" height="90" class="panel"/><rect x="310" y="190" width="160" height="90" class="panel"/><rect x="470" y="190" width="120" height="90" class="panel"/><rect x="590" y="190" width="160" height="90" class="panel"/><text x="95" y="240" text-anchor="middle" class="sh">Macro planning</text><text x="235" y="221" text-anchor="middle" class="body">District,</text><text x="235" y="240" text-anchor="middle" class="body">provincial or</text><text x="235" y="259" text-anchor="middle" class="body">national</text><text x="390" y="231" text-anchor="middle" class="body">Education</text><text x="390" y="250" text-anchor="middle" class="body">department</text><text x="530" y="231" text-anchor="middle" class="body">Often</text><text x="530" y="250" text-anchor="middle" class="body">several years</text><text x="670" y="221" text-anchor="middle" class="body">Teacher</text><text x="670" y="240" text-anchor="middle" class="body">recruitment plan</text><text x="670" y="259" text-anchor="middle" class="body">Budget planning</text></g><g id="node-strategic"><rect x="30" y="280" width="130" height="90" class="panel-c"/><rect x="160" y="280" width="150" height="90" class="panel-c"/><rect x="310" y="280" width="160" height="90" class="panel-c"/><rect x="470" y="280" width="120" height="90" class="panel-c"/><rect x="590" y="280" width="160" height="90" class="panel-c"/><text x="95" y="311" text-anchor="middle" class="sh">Strategic</text><text x="95" y="330" text-anchor="middle" class="sh">planning</text><text x="95" y="349" text-anchor="middle" class="small">an approach</text><text x="235" y="311" text-anchor="middle" class="body">Any scale</text><text x="235" y="330" text-anchor="middle" class="small">one problem or goal,</text><text x="235" y="349" text-anchor="middle" class="small">school to province</text><text x="390" y="321" text-anchor="middle" class="body">Head teacher or</text><text x="390" y="340" text-anchor="middle" class="body">education authority</text><text x="530" y="321" text-anchor="middle" class="body">Fixed period</text><text x="530" y="340" text-anchor="middle" class="body">set in the plan</text><text x="670" y="311" text-anchor="middle" class="body">Girls' enrolment</text><text x="670" y="330" text-anchor="middle" class="body">strategy (district)</text><text x="670" y="349" text-anchor="middle" class="body">Pass-rate target</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">Types of educational planning</text><g id="label-note"><text x="30" y="400" text-anchor="start" class="body">Micro and macro describe scale. Strategic describes an approach used at</text><text x="30" y="428" text-anchor="start" class="body">either scale, so one plan can be both macro and strategic, or micro and strategic.</text></g></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
