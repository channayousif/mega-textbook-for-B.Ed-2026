<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول: تعلیمی منصوبہ بندی کی اقسام</title><desc id="d">مائکرو، میکرو اور استراتیجی منصوبہ بندی کا موازنہ: دائرہ، ذمہ دار، مدت اور مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect x="620" y="60" width="130" height="40" class="panel-a"/><rect x="470" y="60" width="150" height="40" class="panel-a"/><rect x="310" y="60" width="160" height="40" class="panel-a"/><rect x="190" y="60" width="120" height="40" class="panel-a"/><rect x="30" y="60" width="160" height="40" class="panel-a"/><text x="685" y="85" text-anchor="middle" class="sh">‫قسم‬</text><text x="545" y="85" text-anchor="middle" class="sh">‫دائرہ‬</text><text x="390" y="85" text-anchor="middle" class="sh">‫کون کرتا ہے‬</text><text x="250" y="85" text-anchor="middle" class="sh">‫مدت‬</text><text x="110" y="85" text-anchor="middle" class="sh">‫مثال‬</text></g><g id="node-micro"><rect x="620" y="100" width="130" height="90" class="panel"/><rect x="470" y="100" width="150" height="90" class="panel"/><rect x="310" y="100" width="160" height="90" class="panel"/><rect x="190" y="100" width="120" height="90" class="panel"/><rect x="30" y="100" width="160" height="90" class="panel"/><text x="685" y="137" text-anchor="middle" class="sh">‫مائکرو‬</text><text x="685" y="163" text-anchor="middle" class="sh">‫منصوبہ بندی‬</text><text x="545" y="124" text-anchor="middle" class="body">‫اسکول کی سطح‬</text><text x="545" y="150" text-anchor="middle" class="small">‫محدود، تفصیلی‬</text><text x="545" y="176" text-anchor="middle" class="small">‫توجہ‬</text><text x="390" y="137" text-anchor="middle" class="body">‫صدر مدرس‬</text><text x="390" y="163" text-anchor="middle" class="body">‫اسکول کا عملہ‬</text><text x="250" y="137" text-anchor="middle" class="body">‫عموماً ایک‬</text><text x="250" y="163" text-anchor="middle" class="body">‫تعلیمی سال‬</text><text x="110" y="124" text-anchor="middle" class="body">‫نظام الاوقات کی‬</text><text x="110" y="150" text-anchor="middle" class="body">‫منصوبہ بندی‬</text><text x="110" y="176" text-anchor="middle" class="body">‫اسکول کی بہتری‬</text></g><g id="node-macro"><rect x="620" y="190" width="130" height="90" class="panel"/><rect x="470" y="190" width="150" height="90" class="panel"/><rect x="310" y="190" width="160" height="90" class="panel"/><rect x="190" y="190" width="120" height="90" class="panel"/><rect x="30" y="190" width="160" height="90" class="panel"/><text x="685" y="240" text-anchor="middle" class="sh">‫میکرو منصوبہ بندی‬</text><text x="545" y="214" text-anchor="middle" class="body">‫ضلعی،‬</text><text x="545" y="240" text-anchor="middle" class="body">‫صوبائی یا‬</text><text x="545" y="266" text-anchor="middle" class="body">‫قومی‬</text><text x="390" y="227" text-anchor="middle" class="body">‫محکمہ‬</text><text x="390" y="253" text-anchor="middle" class="body">‫تعلیم‬</text><text x="250" y="227" text-anchor="middle" class="body">‫عموماً‬</text><text x="250" y="253" text-anchor="middle" class="body">‫کئی سال‬</text><text x="110" y="214" text-anchor="middle" class="body">‫اساتذہ کی‬</text><text x="110" y="240" text-anchor="middle" class="body">‫بھرتی کا منصوبہ‬</text><text x="110" y="266" text-anchor="middle" class="body">‫بجٹ کی منصوبہ بندی‬</text></g><g id="node-strategic"><rect x="620" y="280" width="130" height="90" class="panel-c"/><rect x="470" y="280" width="150" height="90" class="panel-c"/><rect x="310" y="280" width="160" height="90" class="panel-c"/><rect x="190" y="280" width="120" height="90" class="panel-c"/><rect x="30" y="280" width="160" height="90" class="panel-c"/><text x="685" y="304" text-anchor="middle" class="sh">‫استراتیجی‬</text><text x="685" y="330" text-anchor="middle" class="sh">‫منصوبہ بندی‬</text><text x="685" y="356" text-anchor="middle" class="small">‫ایک طریقہ کار‬</text><text x="545" y="304" text-anchor="middle" class="body">‫کسی بھی سطح پر‬</text><text x="545" y="330" text-anchor="middle" class="small">‫ایک مسئلہ یا ہدف،‬</text><text x="545" y="356" text-anchor="middle" class="small">‫اسکول سے صوبے تک‬</text><text x="390" y="317" text-anchor="middle" class="body">‫صدر مدرس یا‬</text><text x="390" y="343" text-anchor="middle" class="body">‫تعلیمی ادارہ‬</text><text x="250" y="317" text-anchor="middle" class="body">‫مقررہ مدت‬</text><text x="250" y="343" text-anchor="middle" class="body">‫منصوبے میں طے‬</text><text x="110" y="304" text-anchor="middle" class="body">‫لڑکیوں کے داخلے کی‬</text><text x="110" y="330" text-anchor="middle" class="body">‫حکمت عملی (ضلع)‬</text><text x="110" y="356" text-anchor="middle" class="body">‫نتائج کا ہدف (اسکول)‬</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">‫تعلیمی منصوبہ بندی کی اقسام‬</text><g id="label-note"><text x="750" y="400" text-anchor="end" class="body">‫مائکرو اور میکرو سطح بتاتے ہیں۔ استراتیجی ایک طریقہ ہے جو دونوں سطحوں پر‬</text><text x="750" y="428" text-anchor="end" class="body">‫استعمال ہوتا ہے، اس لیے ایک منصوبہ میکرو اور استراتیجی دونوں ہو سکتا ہے۔‬</text></g></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
