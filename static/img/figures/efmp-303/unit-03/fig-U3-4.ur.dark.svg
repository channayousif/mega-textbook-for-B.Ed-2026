<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول: تعلیمی منصوبہ بندی کی اقسام</title><desc id="d">مائکرو، میکرو اور استراتیجی منصوبہ بندی کا موازنہ: دائرہ، ذمہ دار، مدت اور مثال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><text x="390" y="38" text-anchor="middle" class="h" transform="translate(780 0) scale(-1 1)">تعلیمی منصوبہ بندی کی اقسام</text><line x1="50" y1="60" x2="730" y2="60" class="stroke"/><rect x="50" y="60" width="130" height="44" class="panel-a"/><rect x="180" y="60" width="150" height="44" class="panel-a"/><rect x="330" y="60" width="150" height="44" class="panel-a"/><rect x="480" y="60" width="120" height="44" class="panel-a"/><rect x="600" y="60" width="130" height="44" class="panel-a"/><text x="115" y="87" text-anchor="middle" class="sh" transform="translate(230 0) scale(-1 1)">قسم</text><text x="255" y="87" text-anchor="middle" class="sh" transform="translate(510 0) scale(-1 1)">دائرہ</text><text x="405" y="87" text-anchor="middle" class="sh" transform="translate(810 0) scale(-1 1)">کون کرتا ہے</text><text x="540" y="87" text-anchor="middle" class="sh" transform="translate(1080 0) scale(-1 1)">مدت</text><text x="665" y="87" text-anchor="middle" class="sh" transform="translate(1330 0) scale(-1 1)">مثال</text><rect x="50" y="104" width="130" height="70" class="panel-b"/><rect x="180" y="104" width="150" height="70" class="panel-b"/><rect x="330" y="104" width="150" height="70" class="panel-b"/><rect x="480" y="104" width="120" height="70" class="panel-b"/><rect x="600" y="104" width="130" height="70" class="panel-b"/><text x="115" y="131" text-anchor="middle" class="sh" transform="translate(230 0) scale(-1 1)">مائکرو منصوبہ بندی</text><text x="255" y="126" text-anchor="middle" class="body" transform="translate(510 0) scale(-1 1)">اسکول کی سطح</text><text x="255" y="144" text-anchor="middle" class="small" transform="translate(510 0) scale(-1 1)">محدود، تفصیلی</text><text x="255" y="162" text-anchor="middle" class="small" transform="translate(510 0) scale(-1 1)">توجہ</text><text x="405" y="131" text-anchor="middle" class="body" transform="translate(810 0) scale(-1 1)">صدر مدرس</text><text x="405" y="149" text-anchor="middle" class="small" transform="translate(810 0) scale(-1 1)">اسکول کا عملہ</text><text x="540" y="131" text-anchor="middle" class="body" transform="translate(1080 0) scale(-1 1)">1 سال</text><text x="540" y="149" text-anchor="middle" class="small" transform="translate(1080 0) scale(-1 1)">یا اس سے کم</text><text x="665" y="126" text-anchor="middle" class="body" transform="translate(1330 0) scale(-1 1)">نظام الاوقات کی</text><text x="665" y="144" text-anchor="middle" class="small" transform="translate(1330 0) scale(-1 1)">منصوبہ بندی</text><text x="665" y="162" text-anchor="middle" class="small" transform="translate(1330 0) scale(-1 1)">اسکول کی بہتری</text><rect x="50" y="174" width="130" height="70" class="panel"/><rect x="180" y="174" width="150" height="70" class="panel"/><rect x="330" y="174" width="150" height="70" class="panel"/><rect x="480" y="174" width="120" height="70" class="panel"/><rect x="600" y="174" width="130" height="70" class="panel"/><text x="115" y="201" text-anchor="middle" class="sh" transform="translate(230 0) scale(-1 1)">میکرو منصوبہ بندی</text><text x="255" y="196" text-anchor="middle" class="body" transform="translate(510 0) scale(-1 1)">ضلعی،</text><text x="255" y="214" text-anchor="middle" class="body" transform="translate(510 0) scale(-1 1)">صوبائی یا</text><text x="255" y="232" text-anchor="middle" class="body" transform="translate(510 0) scale(-1 1)">قومی</text><text x="405" y="201" text-anchor="middle" class="body" transform="translate(810 0) scale(-1 1)">محکمہ</text><text x="405" y="219" text-anchor="middle" class="small" transform="translate(810 0) scale(-1 1)">تعلیم</text><text x="540" y="201" text-anchor="middle" class="body" transform="translate(1080 0) scale(-1 1)">3-5 سال</text><text x="665" y="196" text-anchor="middle" class="body" transform="translate(1330 0) scale(-1 1)">اساتذہ کی</text><text x="665" y="214" text-anchor="middle" class="small" transform="translate(1330 0) scale(-1 1)">بھرتی کا منصوبہ</text><text x="665" y="232" text-anchor="middle" class="small" transform="translate(1330 0) scale(-1 1)">بجٹ کی منصوبہ بندی</text><rect x="50" y="244" width="130" height="70" class="panel-c"/><rect x="180" y="244" width="150" height="70" class="panel-c"/><rect x="330" y="244" width="150" height="70" class="panel-c"/><rect x="480" y="244" width="120" height="70" class="panel-c"/><rect x="600" y="244" width="130" height="70" class="panel-c"/><text x="115" y="271" text-anchor="middle" class="sh" transform="translate(230 0) scale(-1 1)">استراتیجی منصوبہ بندی</text><text x="255" y="266" text-anchor="middle" class="body" transform="translate(510 0) scale(-1 1)">مخصوص دائرہ</text><text x="255" y="284" text-anchor="middle" class="small" transform="translate(510 0) scale(-1 1)">خاص مسئلہ</text><text x="255" y="302" text-anchor="middle" class="small" transform="translate(510 0) scale(-1 1)">یا ہدف</text><text x="405" y="271" text-anchor="middle" class="body" transform="translate(810 0) scale(-1 1)">ضلعی یا</text><text x="405" y="289" text-anchor="middle" class="small" transform="translate(810 0) scale(-1 1)">صوبائی ادارہ</text><text x="540" y="271" text-anchor="middle" class="body" transform="translate(1080 0) scale(-1 1)">2-4 سال</text><text x="540" y="289" text-anchor="middle" class="small" transform="translate(1080 0) scale(-1 1)">مقررہ مدت</text><text x="665" y="266" text-anchor="middle" class="body" transform="translate(1330 0) scale(-1 1)">لڑکیوں کے داخلے کی</text><text x="665" y="284" text-anchor="middle" class="small" transform="translate(1330 0) scale(-1 1)">حکمت عملی</text><text x="665" y="302" text-anchor="middle" class="small" transform="translate(1330 0) scale(-1 1)">بحالی کا منصوبہ</text><line x1="50" y1="104" x2="730" y2="104" class="grid"/><line x1="50" y1="174" x2="730" y2="174" class="grid"/><line x1="50" y1="244" x2="730" y2="244" class="grid"/><line x1="50" y1="314" x2="730" y2="314" class="grid"/><line x1="180" y1="60" x2="180" y2="314" class="grid"/><line x1="330" y1="60" x2="330" y2="314" class="grid"/><line x1="480" y1="60" x2="480" y2="314" class="grid"/><line x1="600" y1="60" x2="600" y2="314" class="grid"/><line x1="50" y1="314" x2="730" y2="314" class="stroke"/><text x="50" y="350" class="body" transform="translate(100 0) scale(-1 1)" text-anchor="end">پاکستان کے تعلیمی نظام میں تینوں اقسام بیک وقت کام کرتی ہیں۔</text><text x="50" y="370" class="body" transform="translate(100 0) scale(-1 1)" text-anchor="end">ایک استاد کو ایک تعلیمی سال میں تینوں سے واسطہ پڑ سکتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="start" aria-hidden="true" transform="translate(1536 0) scale(-1 1)">textbook.com.pk</text></g></svg>
