<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram: Rational vs iterative planning models</title><desc id="d">A side-by-side diagram comparing the rational planning model (linear, data-driven, top-down) and the iterative planning model (cyclical, participatory, feedback-driven).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"><rect id="region-rational" x="20" y="50" width="360" height="370" rx="12" class="panel-a"/><rect id="region-iterative" x="400" y="50" width="360" height="370" rx="12" class="panel-c"/></g><g id="layer-edges"><path id="edge-analysis-goals" d="M200,160 L200,180" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-goals-options" d="M200,220 L200,240" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-options-implementation" d="M200,280 L200,300" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-implementation-evaluation" d="M200,340 L200,360" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-plan-act" d="M660,140 C680,140 680,170 680,220" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-act-review" d="M680,260 C680,310 680,340 660,340" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-review-adjust" d="M500,340 C480,340 480,310 480,260" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-adjust-plan" d="M480,220 C480,170 480,140 500,140" class="stroke-a" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-analysis"><rect x="80" y="120" width="240" height="40" rx="8" class="panel"/><text x="200" y="145" text-anchor="middle" class="sh">Problem analysis</text></g><g id="node-goals"><rect x="80" y="180" width="240" height="40" rx="8" class="panel"/><text x="200" y="205" text-anchor="middle" class="sh">Goal setting</text></g><g id="node-options"><rect x="80" y="240" width="240" height="40" rx="8" class="panel"/><text x="200" y="265" text-anchor="middle" class="sh">Option selection</text></g><g id="node-implementation"><rect x="80" y="300" width="240" height="40" rx="8" class="panel"/><text x="200" y="325" text-anchor="middle" class="sh">Implementation</text></g><g id="node-evaluation"><rect x="80" y="360" width="240" height="40" rx="8" class="panel"/><text x="200" y="385" text-anchor="middle" class="sh">Evaluation</text></g><g id="node-plan"><rect x="500" y="120" width="160" height="40" rx="8" class="panel"/><text x="580" y="145" text-anchor="middle" class="sh">Plan</text></g><g id="node-act"><rect x="620" y="220" width="120" height="40" rx="8" class="panel"/><text x="680" y="245" text-anchor="middle" class="sh">Act</text></g><g id="node-review"><rect x="500" y="320" width="160" height="40" rx="8" class="panel"/><text x="580" y="345" text-anchor="middle" class="sh">Review</text></g><g id="node-adjust"><rect x="420" y="220" width="120" height="40" rx="8" class="panel"/><text x="480" y="245" text-anchor="middle" class="sh">Adjust</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="32" text-anchor="middle" class="h">Two planning models compared</text><text id="label-rational" x="200" y="80" text-anchor="middle" class="h">Rational model</text><text x="200" y="102" text-anchor="middle" class="small">Linear, data-driven, top-down</text><text id="label-iterative" x="580" y="80" text-anchor="middle" class="h">Iterative model</text><text x="580" y="102" text-anchor="middle" class="small">Cyclical, participatory, feedback-driven</text><g id="label-cycle"><text x="580" y="236" text-anchor="middle" class="small">continuous</text><text x="580" y="254" text-anchor="middle" class="small">cycle</text></g><text id="label-rational-use" x="200" y="444" text-anchor="middle" class="small">Used for: five-year plans, national frameworks</text><text id="label-iterative-use" x="580" y="444" text-anchor="middle" class="small">Used for: school improvement, local programs</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
