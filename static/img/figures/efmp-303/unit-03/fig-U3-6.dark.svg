<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram: Rational vs iterative planning models</title><desc id="d">A side-by-side diagram comparing the rational planning model (linear, data-driven, top-down) and the iterative planning model (cyclical, participatory, feedback-driven).</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="390" y="32" text-anchor="middle" class="h">Two planning models compared</text><rect x="30" y="50" width="350" height="380" rx="10" class="panel-a"/><text x="205" y="78" text-anchor="middle" class="h">Rational model</text><text x="205" y="98" text-anchor="middle" class="small">Linear, data-driven, top-down</text><rect x="80" y="120" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="145" text-anchor="middle" class="sh">Problem analysis</text><line x1="205" y1="160" x2="205" y2="178" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="180" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="205" text-anchor="middle" class="sh">Goal setting</text><line x1="205" y1="220" x2="205" y2="238" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="240" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="265" text-anchor="middle" class="sh">Option selection</text><line x1="205" y1="280" x2="205" y2="298" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="300" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="325" text-anchor="middle" class="sh">Implementation</text><line x1="205" y1="340" x2="205" y2="358" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="360" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="385" text-anchor="middle" class="sh">Evaluation</text><rect x="400" y="50" width="350" height="380" rx="10" class="panel-c"/><text x="575" y="78" text-anchor="middle" class="h">Iterative model</text><text x="575" y="98" text-anchor="middle" class="small">Cyclical, participatory, feedback-driven</text><rect x="480" y="120" width="190" height="44" rx="6" class="panel-d"/><text x="575" y="147" text-anchor="middle" class="sh">Plan</text><rect x="620" y="210" width="110" height="44" rx="6" class="panel-d"/><text x="675" y="237" text-anchor="middle" class="sh">Act</text><rect x="480" y="300" width="190" height="44" rx="6" class="panel-d"/><text x="575" y="327" text-anchor="middle" class="sh">Review</text><rect x="440" y="210" width="110" height="44" rx="6" class="panel-d"/><text x="495" y="237" text-anchor="middle" class="sh">Adjust</text><path d="M670,142 L675,160 L675,208" class="stroke-a" marker-end="url(#arrow)"/><path d="M675,254 L675,280 L640,298" class="stroke-a" marker-end="url(#arrow)"/><path d="M485,298 L485,280 L485,254" class="stroke-a" marker-end="url(#arrow)"/><path d="M485,210 L485,180 L510,162" class="stroke-a" marker-end="url(#arrow)"/><text x="575" y="240" text-anchor="middle" class="small">continuous</text><text x="575" y="255" text-anchor="middle" class="small">cycle</text><text x="205" y="445" text-anchor="middle" class="small">Used for: five-year plans, national frameworks</text><text x="575" y="445" text-anchor="middle" class="small">Used for: school improvement, local programs</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
