<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول: پاکستان وژن 2025، تعلیم کی بنیادی صورت حال اور اہداف</title><desc id="d">پاکستان ویژن 2025 (2014) میں بیان کردہ بنیادی حالت اور تاریخی تعلیمی اہداف۔ تعلیمی خرچ GDP کا حصہ ہے، منصوبے کے بجٹ کا حصہ نہیں۔ ماخذ: مطبوعہ صفحات 33 اور 101۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><text x="390" y="38" text-anchor="middle" class="h" transform="translate(780 0) scale(-1 1)">پاکستان وژن 2025: تعلیم کی صورت حال اور اہداف</text><line x1="50" y1="60" x2="730" y2="60" class="stroke"/><rect x="50" y="60" width="200" height="44" class="panel-a"/><text x="150" y="87" text-anchor="middle" class="sh" transform="translate(300 0) scale(-1 1)">اشاریہ</text><rect x="250" y="60" 