<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول: پاکستان وژن 2025، تعلیم کی بنیادی صورت حال اور اہداف</title><desc id="d">پاکستان ویژن 2025 (2014) میں بیان کردہ بنیادی حالت اور تاریخی تعلیمی اہداف۔ تعلیمی خرچ GDP کا حصہ ہے، منصوبے کے بجٹ کا حصہ نہیں۔ ماخذ: مطبوعہ صفحات 33 اور 101۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect x="540" y="60" width="200" height="40" class="panel-a"/><rect x="280" y="60" width="260" height="40" class="panel-a"/><rect x="40" y="60" width="240" height="40" class="panel-a"/><text x="640" y="85" text-anchor="middle" class="sh">‫اشاریہ‬</text><text x="410" y="85" text-anchor="middle" class="sh">‫بیان کردہ صورت حال (2014)‬</text><text x="160" y="85" text-anchor="middle" class="sh">‫وژن 2025 کا ہدف‬</text></g><g id="node-spending"><rect x="540" y="100" width="200" height="64" class="panel"/><rect x="280" y="100" width="260" height="64" class="panel"/><rect x="40" y="100" width="240" height="64" class="panel"/><text x="640" y="127" text-anchor="middle" class="body">‫تعلیم پر سرکاری‬</text><text x="640" y="153" text-anchor="middle" class="body">‫اخراجات‬</text><text x="410" y="127" text-anchor="middle" class="body">‫بمشکل جی ڈی پی کا 2%‬</text><text x="410" y="153" text-anchor="middle" class="small">‫صفحہ 33‬</text><text x="160" y="127" text-anchor="middle" class="body">‫2018 تک جی ڈی پی کا 4%‬</text><text x="160" y="153" text-anchor="middle" class="small">‫صفحہ 33‬</text></g><g id="node-literacy"><rect x="540" y="164" width="200" height="64" class="panel"/><rect x="280" y="164" width="260" height="64" class="panel"/><rect x="40" y="164" width="240" height="64" class="panel"/><text x="640" y="201" text-anchor="middle" class="body">‫شرح خواندگی‬</text><text x="410" y="191" text-anchor="middle" class="body">‫57% (دیہی 50%)‬</text><text x="410" y="217" text-anchor="middle" class="small">‫صفحہ 33‬</text><text x="160" y="191" text-anchor="middle" class="body">90%</text><text x="160" y="217" text-anchor="middle" class="small">‫ہدف 1، صفحہ 101‬</text></g><g id="node-enrolment"><rect x="540" y="228" width="200" height="64" class="panel"/><rect x="280" y="228" width="260" height="64" class="panel"/><rect x="40" y="228" width="240" height="64" class="panel"/><text x="640" y="255" text-anchor="middle" class="body">‫پرائمری داخلہ‬</text><text x="640" y="281" text-anchor="middle" class="body">‫اور تکمیل‬</text><text x="410" y="255" text-anchor="middle" class="body">‫کم خالص داخلہ‬</text><text x="410" y="281" text-anchor="middle" class="small">‫صفحہ 33‬</text><text x="160" y="255" text-anchor="middle" class="body">100%</text><text x="160" y="281" text-anchor="middle" class="small">‫ہدف 1، صفحہ 101‬</text></g><g id="node-parity"><rect x="540" y="292" width="200" height="64" class="panel"/><rect x="280" y="292" width="260" height="64" class="panel"/><rect x="40" y="292" width="240" height="64" class="panel"/><text x="640" y="319" text-anchor="middle" class="body">‫صنفی برابری‬</text><text x="640" y="345" text-anchor="middle" class="body">‫پرائمری اور ثانوی‬</text><text x="410" y="319" text-anchor="middle" class="body">‫لڑکیوں کا داخلہ کافی کم‬</text><text x="410" y="345" text-anchor="middle" class="small">‫صفحہ 33‬</text><text x="160" y="319" text-anchor="middle" class="body">‫برابری اشاریہ 1‬</text><text x="160" y="345" text-anchor="middle" class="small">‫ہدف 3، صفحہ 101‬</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">‫پاکستان وژن 2025: تعلیم کی صورت حال اور اہداف‬</text><g id="label-source"><text x="740" y="380" text-anchor="end" class="small">‫ماخذ: منصوبہ بندی کمیشن پاکستان (2014)، پاکستان وژن 2025،‬</text><text x="740" y="402" text-anchor="end" class="small">‫چھپے ہوئے صفحات 3، 33 اور 101۔ بنیادی اعداد وہ ہیں جو دستاویز‬</text><text x="740" y="424" text-anchor="end" class="small">‫نے 2014 کی اشاعت میں بتائے؛ موجودہ اعداد نہیں۔ وژن پر عمل‬</text><text x="740" y="446" text-anchor="end" class="small">‫پانچ سالہ اور سالانہ منصوبوں کے ذریعے ہوتا ہے (صفحہ 3)۔‬</text></g></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
