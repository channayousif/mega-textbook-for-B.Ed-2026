"50" y1="328" x2="730" y2="328" class="grid"/><line x1="250" y1="60" x2="250" y2="328" class="grid"/><line x1="490" y1="60" x2="490" y2="328" class="grid"/><line x1="50" y1="328" x2="730" y2="328" class="stroke"/><text x="50" y="358" text-anchor="end" class="small" transform="translate(100 0) scale(-1 1)">ماخذ: منصوبہ بندی کمیشن پاکستان (2014)، پاکستان وژن 2025،</text><text x="50" y="376" text-anchor="end" class="small" transform="translate(100 0) scale(-1 1)">چھپے ہوئے صفحات 3، 33 اور 101۔ بنیادی اعداد وہ ہیں جو دستاویز</text><text x="50" y="394" text-anchor="end" class="small" transform="translate(100 0) scale(-1 1)">نے 2014 کی اشاعت میں بتائے؛ موجودہ اعداد نہیں۔ وژن پر عمل</text><text x="50" y="412" text-anchor="end" class="small" transform="translate(100 0) scale(-1 1)">پانچ سالہ اور سالانہ منصوبوں کے ذریعے ہوتا ہے (صفحہ 3)۔</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>