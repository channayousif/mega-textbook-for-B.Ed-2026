<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی خاکہ: ضروریات کے جائزے سے وسائل کی تقسیم تک</title><desc id="d">اعداد و شمار جمع کرنے، کمی کے تجزیے، ترجیحات کے تعین، اہداف کی تشکیل، بجٹ کی ترتیب اور وسائل کی تقسیم کا سلسلہ، ہر مرحلہ تیر سے جڑا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="390" y="38" text-anchor="middle" class="h" transform="translate(780 0) scale(-1 1)">ضروریات کے جائزے سے وسائل کی تقسیم تک</text><rect x="40" y="70" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="95" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">1. اعداد و شمار جمع کرنا</text><text x="140" y="113" text-anchor="middle" class="small" transform="translate(280 0) scale(-1 1)">داخلے، اساتذہ، عمارتیں</text><rect x="290" y="70" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="95" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">2. کمی کا تجزیہ</text><text x="390" y="113" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">نظام میں کہاں کمی ہے؟</text><rect x="540" y="70" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="95" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">3. ترجیحات کا تعین</text><text x="640" y="113" text-anchor="middle" class="small" transform="translate(1280 0) scale(-1 1)">کون سی ضرورت فوری ہے؟</text><line x1="240" y1="100" x2="288" y2="100" class="stroke-a" marker-end="url(#arrow)"/><line x1="490" y1="100" x2="538" y2="100" class="stroke-a" marker-end="url(#arrow)"/><rect x="540" y="200" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="225" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">6. وسائل کی تقسیم</text><text x="640" y="243" text-anchor="middle" class="small" transform="translate(1280 0) scale(-1 1)">رقم اور افراد تقسیم کریں</text><rect x="290" y="200" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="225" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">5. بجٹ کی ترتیب</text><text x="390" y="243" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">ہر ہدف کے لیے کتنی رقم؟</text><rect x="40" y="200" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="225" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">4. اہداف کی تشکیل</text><text x="140" y="243" text-anchor="middle" class="small" transform="translate(280 0) scale(-1 1)">واضح، قابل پیمائش اہداف</text><line x1="540" y1="230" x2="492" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="290" y1="230" x2="242" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="640" y1="130" x2="640" y2="198" class="stroke-a" marker-end="url(#arrow)"/><line x1="140" y1="200" x2="140" y2="132" class="stroke-a" marker-end="url(#arrow)"/><text x="140" y="320" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">ضروریات کے جائزے کا مرحلہ</text><text x="140" y="340" text-anchor="middle" class="small" transform="translate(280 0) scale(-1 1)">مراحل 1-3</text><line x1="40" y1="300" x2="240" y2="300" class="stroke-a"/><text x="640" y="320" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">وسائل کی تقسیم کا مرحلہ</text><text x="640" y="340" text-anchor="middle" class="small" transform="translate(1280 0) scale(-1 1)">مراحل 4-6</text><line x1="540" y1="300" x2="740" y2="300" class="stroke-a"/><line x1="390" y1="150" x2="390" y2="290" class="stroke"/><text x="390" y="175" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">پھر</text><text x="390" y="400" text-anchor="middle" class="body" transform="translate(780 0) scale(-1 1)">ہر مرحلہ پچھلے پر قائم ہوتا ہے۔ مرحلہ 1 کے کمزور اعداد و شمار</text><text x="390" y="420" text-anchor="middle" class="body" transform="translate(780 0) scale(-1 1)">مرحلہ 4 میں ناقص اہداف اور مرحلہ 6 میں وسائل کا ضیاع پیدا کرتے ہیں۔</text><text class="wm" x="768" y="460" text-anchor="start" aria-hidden="true" transform="translate(1536 0) scale(-1 1)">textbook.com.pk</text></g></svg>
