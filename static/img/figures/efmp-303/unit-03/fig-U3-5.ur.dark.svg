<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی خاکہ: ضروریات کے جائزے سے وسائل کی تقسیم تک</title><desc id="d">اعداد و شمار جمع کرنے، کمی کے تجزیے، ترجیحات کے تعین، اہداف کی تشکیل، بجٹ کی ترتیب اور وسائل کی تقسیم کا سلسلہ، ہر مرحلہ تیر سے جڑا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"><rect id="region-needs" x="20" y="60" width="740" height="120" rx="12" class="panel"/><rect id="region-allocation" x="20" y="220" width="740" height="120" rx="12" class="panel"/></g><g id="layer-edges"><path id="edge-data-gaps" d="M535 131 L495 131" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-gaps-priorities" d="M285 131 L245 131" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-priorities-goals" d="M140 166 L140 200 L640 200 L640 256" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-goals-budget" d="M535 291 L495 291" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-budget-assignment" d="M285 291 L245 291" class="stroke-a" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-data"><rect x="535" y="96" width="210" height="70" rx="8" class="panel-a"/><text x="640" y="123" text-anchor="middle" class="sh">‫1. اعداد و شمار جمع کرنا‬</text><text x="640" y="149" text-anchor="middle" class="small">‫داخلے، اساتذہ، عمارتیں‬</text></g><g id="node-gaps"><rect x="285" y="96" width="210" height="70" rx="8" class="panel-a"/><text x="390" y="123" text-anchor="middle" class="sh">‫2. کمی کا تجزیہ‬</text><text x="390" y="149" text-anchor="middle" class="small">‫نظام میں کہاں کمی ہے؟‬</text></g><g id="node-priorities"><rect x="35" y="96" width="210" height="70" rx="8" class="panel-a"/><text x="140" y="123" text-anchor="middle" class="sh">‫3. ترجیحات کا تعین‬</text><text x="140" y="149" text-anchor="middle" class="small">‫کون سی ضرورت فوری ہے؟‬</text></g><g id="node-goals"><rect x="535" y="256" width="210" height="70" rx="8" class="panel-b"/><text x="640" y="283" text-anchor="middle" class="sh">‫4. اہداف کی تشکیل‬</text><text x="640" y="309" text-anchor="middle" class="small">‫واضح، قابل پیمائش اہداف‬</text></g><g id="node-budget"><rect x="285" y="256" width="210" height="70" rx="8" class="panel-b"/><text x="390" y="283" text-anchor="middle" class="sh">‫5. بجٹ کی ترتیب‬</text><text x="390" y="309" text-anchor="middle" class="small">‫ہر ہدف کے لیے کتنی رقم؟‬</text></g><g id="node-assignment"><rect x="35" y="256" width="210" height="70" rx="8" class="panel-b"/><text x="140" y="283" text-anchor="middle" class="sh">‫6. وسائل کی تقسیم‬</text><text x="140" y="309" text-anchor="middle" class="small">‫رقم اور افراد تقسیم کریں‬</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">‫ضروریات کے جائزے سے وسائل کی تقسیم تک‬</text><text id="label-needs-phase" x="380" y="84" text-anchor="middle" class="sh">‫اوپر کی قطار (مراحل 1-3): ضروریات کے جائزے کا مرحلہ‬</text><text id="label-allocation-phase" x="380" y="244" text-anchor="middle" class="sh">‫نیچے کی قطار (مراحل 4-6): وسائل کی تقسیم کا مرحلہ‬</text><g id="label-note"><text x="390" y="385" text-anchor="middle" class="body">‫ہر مرحلہ پچھلے پر قائم ہوتا ہے۔ مرحلہ 1 کے کمزور اعداد و شمار‬</text><text x="390" y="411" text-anchor="middle" class="body">‫مرحلہ 4 میں ناقص اہداف اور مرحلہ 6 میں وسائل کا ضیاع پیدا کرتے ہیں۔‬</text></g></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
