<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خاکہ: عقلی اور تکراری منصوبہ بندی ماڈلز</title><desc id="d">عقلی ماڈل خطی، اعداد و شمار پر مبنی اور اوپر سے نیچے ہے۔ تکراری ماڈل دوری، شراکتی اور بازخورد پر مبنی ہے۔ دونوں ساتھ دکھائے گئے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"><rect id="region-rational" x="400" y="50" width="360" height="370" rx="12" class="panel-a"/><rect id="region-iterative" x="20" y="50" width="360" height="370" rx="12" class="panel-c"/></g><g id="layer-edges"><path id="edge-analysis-goals" d="M580 160 L580 180" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-goals-options" d="M580 220 L580 240" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-options-implementation" d="M580 280 L580 300" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-implementation-evaluation" d="M580 340 L580 360" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-plan-act" d="M120 140 C100 140 100 170 100 220" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-act-review" d="M100 260 C100 310 100 340 120 340" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-review-adjust" d="M280 340 C300 340 300 310 300 260" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-adjust-plan" d="M300 220 C300 170 300 140 280 140" class="stroke-a" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-analysis"><rect x="460" y="120" width="240" height="40" rx="8" class="panel"/><text x="580" y="145" text-anchor="middle" class="sh">‫مسئلے کا تجزیہ‬</text></g><g id="node-goals"><rect x="460" y="180" width="240" height="40" rx="8" class="panel"/><text x="580" y="205" text-anchor="middle" class="sh">‫اہداف کا تعین‬</text></g><g id="node-options"><rect x="460" y="240" width="240" height="40" rx="8" class="panel"/><text x="580" y="265" text-anchor="middle" class="sh">‫متبادل کا انتخاب‬</text></g><g id="node-implementation"><rect x="460" y="300" width="240" height="40" rx="8" class="panel"/><text x="580" y="325" text-anchor="middle" class="sh">‫نفاذ‬</text></g><g id="node-evaluation"><rect x="460" y="360" width="240" height="40" rx="8" class="panel"/><text x="580" y="385" text-anchor="middle" class="sh">‫جانچ‬</text></g><g id="node-plan"><rect x="120" y="120" width="160" height="40" rx="8" class="panel"/><text x="200" y="145" text-anchor="middle" class="sh">‫منصوبہ بنائیں‬</text></g><g id="node-act"><rect x="40" y="220" width="120" height="40" rx="8" class="panel"/><text x="100" y="245" text-anchor="middle" class="sh">‫عمل کریں‬</text></g><g id="node-review"><rect x="120" y="320" width="160" height="40" rx="8" class="panel"/><text x="200" y="345" text-anchor="middle" class="sh">‫جائزہ لیں‬</text></g><g id="node-adjust"><rect x="240" y="220" width="120" height="40" rx="8" class="panel"/><text x="300" y="245" text-anchor="middle" class="sh">‫تبدیلی کریں‬</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="32" text-anchor="middle" class="h">‫منصوبہ بندی کے دو ماڈلز کا موازنہ‬</text><text id="label-rational" x="580" y="80" text-anchor="middle" class="h">‫عقلی ماڈل‬</text><text x="580" y="102" text-anchor="middle" class="small">‫خطی، اعداد و شمار پر مبنی، اوپر سے نیچے‬</text><text id="label-iterative" x="200" y="80" text-anchor="middle" class="h">‫تکراری ماڈل‬</text><text x="200" y="102" text-anchor="middle" class="small">‫دوری، شراکتی، بازخورد پر مبنی‬</text><g id="label-cycle"><text x="200" y="236" text-anchor="middle" class="small">‫مسلسل‬</text><text x="200" y="260" text-anchor="middle" class="small">‫دور‬</text></g><text id="label-rational-use" x="580" y="444" text-anchor="middle" class="small">‫استعمال: پانچ سالہ منصوبے، قومی خاکے‬</text><text id="label-iterative-use" x="200" y="444" text-anchor="middle" class="small">‫استعمال: اسکول کی بہتری، مقامی پروگرام‬</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
