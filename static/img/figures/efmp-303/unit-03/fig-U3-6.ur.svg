<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خاکہ: عقلی اور تکراری منصوبہ بندی ماڈلز</title><desc id="d">عقلی ماڈل خطی، اعداد و شمار پر مبنی اور اوپر سے نیچے ہے۔ تکراری ماڈل دوری، شراکتی اور بازخورد پر مبنی ہے۔ دونوں ساتھ دکھائے گئے ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="390" y="32" text-anchor="middle" class="h" transform="translate(780 0) scale(-1 1)">منصوبہ بندی کے دو ماڈلز کا موازنہ</text><rect x="30" y="50" width="350" height="380" rx="10" class="panel-a"/><text x="205" y="78" text-anchor="middle" class="h" transform="translate(410 0) scale(-1 1)">عقلی ماڈل</text><text x="205" y="98" text-anchor="middle" class="small" transform="translate(410 0) scale(-1 1)">خطی، اعداد و شمار پر مبنی، اوپر سے نیچے</text><rect x="80" y="120" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="145" text-anchor="middle" class="sh" transform="translate(410 0) scale(-1 1)">مسئلے کا تجزیہ</text><line x1="205" y1="160" x2="205" y2="178" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="180" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="205" text-anchor="middle" class="sh" transform="translate(410 0) scale(-1 1)">اہداف کا تعین</text><line x1="205" y1="220" x2="205" y2="238" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="240" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="265" text-anchor="middle" class="sh" transform="translate(410 0) scale(-1 1)">متبادل کا انتخاب</text><line x1="205" y1="280" x2="205" y2="298" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="300" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="325" text-anchor="middle" class="sh" transform="translate(410 0) scale(-1 1)">نفاذ</text><line x1="205" y1="340" x2="205" y2="358" class="stroke-a" marker-end="url(#arrow)"/><rect x="80" y="360" width="250" height="40" rx="6" class="panel-b"/><text x="205" y="385" text-anchor="middle" class="sh" transform="translate(410 0) scale(-1 1)">جانچ</text><rect x="400" y="50" width="350" height="380" rx="10" class="panel-c"/><text x="575" y="78" text-anchor="middle" class="h" transform="translate(1150 0) scale(-1 1)">تکراری ماڈل</text><text x="575" y="98" text-anchor="middle" class="small" transform="translate(1150 0) scale(-1 1)">دوری، شراکتی، بازخورد پر مبنی</text><rect x="480" y="120" width="190" height="44" rx="6" class="panel-d"/><text x="575" y="147" text-anchor="middle" class="sh" transform="translate(1150 0) scale(-1 1)">منصوبہ بنائیں</text><rect x="620" y="210" width="110" height="44" rx="6" class="panel-d"/><text x="675" y="237" text-anchor="middle" class="sh" transform="translate(1350 0) scale(-1 1)">عمل کریں</text><rect x="480" y="300" width="190" height="44" rx="6" class="panel-d"/><text x="575" y="327" text-anchor="middle" class="sh" transform="translate(1150 0) scale(-1 1)">جائزہ لیں</text><rect x="440" y="210" width="110" height="44" rx="6" class="panel-d"/><text x="495" y="237" text-anchor="middle" class="sh" transform="translate(990 0) scale(-1 1)">تبدیلی کریں</text><path d="M670,142 L675,160 L675,208" class="stroke-a" marker-end="url(#arrow)"/><path d="M675,254 L675,280 L640,298" class="stroke-a" marker-end="url(#arrow)"/><path d="M485,298 L485,280 L485,254" class="stroke-a" marker-end="url(#arrow)"/><path d="M485,210 L485,180 L510,162" class="stroke-a" marker-end="url(#arrow)"/><text x="575" y="240" text-anchor="middle" class="small" transform="translate(1150 0) scale(-1 1)">مسلسل</text><text x="575" y="255" text-anchor="middle" class="small" transform="translate(1150 0) scale(-1 1)">دور</text><text x="205" y="445" text-anchor="middle" class="small" transform="translate(410 0) scale(-1 1)">استعمال: پانچ سالہ منصوبے، قومی خاکے</text><text x="575" y="445" text-anchor="middle" class="small" transform="translate(1150 0) scale(-1 1)">استعمال: اسکول کی بہتری، مقامی پروگرام</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
