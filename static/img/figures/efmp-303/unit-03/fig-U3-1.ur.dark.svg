<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوری نقشہ: ترقیاتی منصوبہ اور اس کی شاخیں</title><desc id="d">ترقیاتی منصوبے کے مرکز سے تعلیم، صحت، بنیادی ڈھانچے، وسائل کی تقسیم اور تعلیمی نتائج کی شاخیں نکلتی ہیں۔ تیر وسائل کی تقسیم کا تعلیمی نتائج سے تعلق دکھاتے ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><ellipse cx="390" cy="235" rx="110" ry="48" class="panel-a"/><text x="390" y="232" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">ترقیاتی منصوبہ</text><text x="390" y="250" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">کئی شعبوں کی دستاویز</text><rect x="50" y="140" width="180" height="50" rx="6" class="panel-b"/><text x="140" y="170" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">تعلیم کا باب</text><line x1="230" y1="165" x2="278" y2="215" class="stroke-a" marker-end="url(#arrow)"/><rect x="50" y="50" width="180" height="50" rx="6" class="panel"/><text x="140" y="80" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">صحت کا باب</text><line x1="230" y1="75" x2="310" y2="200" class="stroke-a" marker-end="url(#arrow)"/><rect x="550" y="50" width="180" height="50" rx="6" class="panel"/><text x="640" y="80" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">بنیادی ڈھانچے کا باب</text><line x1="550" y1="75" x2="470" y2="200" class="stroke-a" marker-end="url(#arrow)"/><rect x="550" y="140" width="180" height="50" rx="6" class="panel-c"/><text x="640" y="170" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">وسائل کی تقسیم</text><line x1="550" y1="165" x2="470" y2="220" class="stroke-a" marker-end="url(#arrow)"/><rect x="280" y="360" width="220" height="50" rx="6" class="panel-d"/><text x="390" y="390" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">تعلیمی نتائج</text><line x1="390" y1="283" x2="390" y2="358" class="stroke-a" marker-end="url(#arrow)"/><path d="M550,165 C500,280 460,340 420,362" class="stroke-a" marker-end="url(#arrow)"/><text x="510" y="290" class="small" text-anchor="middle" transform="translate(1020 0) scale(-1 1)">میں حصہ ڈالتا ہے</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
