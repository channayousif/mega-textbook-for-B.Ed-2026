<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map: Development plan and its branches</title><desc id="d">A concept map showing "Development plan" at the centre with branches for education chapter, health chapter, infrastructure chapter, resource allocation, and education outcomes, with arrows showing how resource allocation feeds into education outcomes.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><ellipse cx="390" cy="235" rx="110" ry="48" class="panel-a"/><text x="390" y="232" text-anchor="middle" class="sh">Development plan</text><text x="390" y="250" text-anchor="middle" class="small">multi-sector document</text><rect x="50" y="140" width="180" height="50" rx="6" class="panel-b"/><text x="140" y="170" text-anchor="middle" class="sh">Education chapter</text><line x1="230" y1="165" x2="278" y2="215" class="stroke-a" marker-end="url(#arrow)"/><rect x="50" y="50" width="180" height="50" rx="6" class="panel"/><text x="140" y="80" text-anchor="middle" class="sh">Health chapter</text><line x1="230" y1="75" x2="310" y2="200" class="stroke-a" marker-end="url(#arrow)"/><rect x="550" y="50" width="180" height="50" rx="6" class="panel"/><text x="640" y="80" text-anchor="middle" class="sh">Infrastructure chapter</text><line x1="550" y1="75" x2="470" y2="200" class="stroke-a" marker-end="url(#arrow)"/><rect x="550" y="140" width="180" height="50" rx="6" class="panel-c"/><text x="640" y="170" text-anchor="middle" class="sh">Resource allocation</text><line x1="550" y1="165" x2="470" y2="220" class="stroke-a" marker-end="url(#arrow)"/><rect x="280" y="360" width="220" height="50" rx="6" class="panel-d"/><text x="390" y="390" text-anchor="middle" class="sh">Education outcomes</text><line x1="390" y1="283" x2="390" y2="358" class="stroke-a" marker-end="url(#arrow)"/><path d="M550,165 C500,280 460,340 420,362" class="stroke-a" marker-end="url(#arrow)"/><text x="510" y="290" class="small" text-anchor="middle">feeds into</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
