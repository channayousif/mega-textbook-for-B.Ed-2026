<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart: Stages of educational planning</title><desc id="d">Six stages in order: needs assessment, goal setting, resource planning, action design, implementation, monitoring and evaluation; feedback returns from stage 6 to stage 1.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-needs-goals" d="M260,105 L300,105" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-goals-resources" d="M500,105 L540,105" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-resources-design" d="M640,140 L640,170 L160,170 L160,200" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-design-implementation" d="M260,235 L300,235" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-implementation-monitoring" d="M500,235 L540,235" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-monitoring-needs" d="M640,270 L640,300 L20,300 L20,105 L60,105" class="stroke-a dash" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-needs"><rect x="60" y="70" width="200" height="70" rx="8" class="panel-a"/><text x="160" y="100" text-anchor="middle" class="sh">1. Needs assessment</text><text x="160" y="118" text-anchor="middle" class="small">What is the current state?</text></g><g id="node-goals"><rect x="300" y="70" width="200" height="70" rx="8" class="panel-b"/><text x="400" y="100" text-anchor="middle" class="sh">2. Goal setting</text><text x="400" y="118" text-anchor="middle" class="small">Set measurable targets</text></g><g id="node-resources"><rect x="540" y="70" width="200" height="70" rx="8" class="panel-c"/><text x="640" y="100" text-anchor="middle" class="sh">3. Resource planning</text><text x="640" y="118" text-anchor="middle" class="small">Funds, people, materials</text></g><g id="node-design"><rect x="60" y="200" width="200" height="70" rx="8" class="panel-a"/><text x="160" y="230" text-anchor="middle" class="sh">4. Action design</text><text x="160" y="248" text-anchor="middle" class="small">Who does what, when</text></g><g id="node-implementation"><rect x="300" y="200" width="200" height="70" rx="8" class="panel-b"/><text x="400" y="230" text-anchor="middle" class="sh">5. Implementation</text><text x="400" y="248" text-anchor="middle" class="small">Put the plan into action</text></g><g id="node-monitoring"><rect x="540" y="200" width="200" height="70" rx="8" class="panel-c"/><text x="640" y="222" text-anchor="middle" class="sh">6. Monitoring and</text><text x="640" y="239" text-anchor="middle" class="sh">evaluation</text><text x="640" y="257" text-anchor="middle" class="small">Track progress, adjust</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">Stages of educational planning</text><text id="label-feedback" x="390" y="326" text-anchor="middle" class="small">Feedback: evaluation informs the next needs assessment</text><g id="label-note"><text x="40" y="370" text-anchor="start" class="body">The planning process is continuous. Each stage feeds into the next,</text><text x="40" y="396" text-anchor="start" class="body">and evaluation at stage 6 feeds back into the next cycle of planning.</text></g></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
