<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart: Stages of educational planning</title><desc id="d">A flowchart showing the stages of educational planning end to end: needs assessment, goal setting, resource allocation, implementation, monitoring and evaluation, with arrows connecting each stage in sequence and a feedback loop from evaluation back to needs assessment.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="390" y="38" text-anchor="middle" class="h">Stages of educational planning</text><rect x="40" y="70" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="100" text-anchor="middle" class="sh">1. Needs assessment</text><text x="140" y="118" text-anchor="middle" class="small">What is the current state?</text><rect x="290" y="70" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="100" text-anchor="middle" class="sh">2. Goal setting</text><text x="390" y="118" text-anchor="middle" class="small">Set measurable targets</text><rect x="540" y="70" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="100" text-anchor="middle" class="sh">3. Resource planning</text><text x="640" y="118" text-anchor="middle" class="small">Funds, people, materials</text><line x1="240" y1="100" x2="288" y2="100" class="stroke-a" marker-end="url(#arrow)"/><line x1="490" y1="100" x2="538" y2="100" class="stroke-a" marker-end="url(#arrow)"/><rect x="540" y="200" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="230" text-anchor="middle" class="sh">6. Monitoring and evaluation</text><text x="640" y="248" text-anchor="middle" class="small">Track progress, adjust</text><rect x="290" y="200" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="230" text-anchor="middle" class="sh">5. Implementation</text><text x="390" y="248" text-anchor="middle" class="small">Put the plan into action</text><rect x="40" y="200" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="230" text-anchor="middle" class="sh">4. Action design</text><text x="140" y="248" text-anchor="middle" class="small">Who does what, when</text><line x1="540" y1="230" x2="492" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="290" y1="230" x2="242" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="640" y1="130" x2="640" y2="198" class="stroke-a" marker-end="url(#arrow)"/><line x1="140" y1="200" x2="140" y2="132" class="stroke-a" marker-end="url(#arrow)"/><path d="M40,230 L10,230 L10,300 L640,300 L640,262" class="stroke-a" marker-end="url(#arrow)"/><text x="300" y="318" text-anchor="middle" class="small">Feedback loop: evaluation informs next needs assessment</text><text x="40" y="360" class="body">The planning process is continuous. Each stage feeds into the next,</text><text x="40" y="380" class="body">and evaluation at stage 6 feeds back into the next cycle of planning.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
