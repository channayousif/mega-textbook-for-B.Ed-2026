<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جدول: پاکستان کے پانچ سالہ منصوبے اور تعلیم</title><desc id="d">پاکستان کے پانچ سالہ منصوبوں کا جدول: منصوبے کی مدت، منصوبے کے بجٹ کا اندازاً حصہ اور اہم تعلیمی اہداف۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><text x="390" y="38" text-anchor="middle" class="h" transform="translate(780 0) scale(-1 1)">پاکستان کے پانچ سالہ منصوبے اور تعلیم</text><line x1="50" y1="60" x2="730" y2="60" class="stroke"/><rect x="50" y="60" width="220" height="44" class="panel-a"/><rect x="270" y="60" width="200" height="44" class="panel-a"/><rect x="470" y="60" width="260" height="44" class="panel-a"/><text x="160" y="87" text-anchor="middle" class="sh" transform="translate(320 0) scale(-1 1)">منصوبے کی مدت</text><text x="370" y="87" text-anchor="middle" class="sh" transform="translate(740 0) scale(-1 1)">بجٹ کا اندازاً حصہ</text><text x="600" y="87" text-anchor="middle" class="sh" transform="translate(1200 0) scale(-1 1)">اہم تعلیمی اہداف</text><rect x="50" y="104" width="220" height="50" class="panel"/><rect x="270" y="104" width="200" height="50" class="panel"/><rect x="470" y="104" width="260" height="50" class="panel"/><text x="160" y="126" text-anchor="middle" class="body" transform="translate(320 0) scale(-1 1)">پہلا پانچ سالہ منصوبہ</text><text x="160" y="144" text-anchor="middle" class="small" transform="translate(320 0) scale(-1 1)">1955-1960</text><text x="370" y="133" text-anchor="middle" class="body" transform="translate(740 0) scale(-1 1)">~</text><text x="600" y="126" text-anchor="middle" class="body" transform="translate(1200 0) scale(-1 1)">اسکول نظام کی توسیع</text><text x="600" y="144" text-anchor="middle" class="small" transform="translate(1200 0) scale(-1 1)">جامعات کی تعمیر</text><rect x="50" y="154" width="220" height="50" class="panel-b"/><rect x="270" y="154" width="200" height="50" class="panel-b"/><rect x="470" y="154" width="260" height="50" class="panel-b"/><text x="160" y="176" text-anchor="middle" class="body" transform="translate(320 0) scale(-1 1)">پانچواں پانچ سالہ منصوبہ</text><text x="160" y="194" text-anchor="middle" class="small" transform="translate(320 0) scale(-1 1)">1978-1983</text><text x="370" y="183" text-anchor="middle" class="body" transform="translate(740 0) scale(-1 1)">~</text><text x="600" y="176" text-anchor="middle" class="body" transform="translate(1200 0) scale(-1 1)">خواندگی کی مہم</text><text x="600" y="194" text-anchor="middle" class="small" transform="translate(1200 0) scale(-1 1)">اساتذہ کی تربیت</text><rect x="50" y="204" width="220" height="50" class="panel"/><rect x="270" y="204" width="200" height="50" class="panel"/><rect x="470" y="204" width="260" height="50" class="panel"/><text x="160" y="226" text-anchor="middle" class="body" transform="translate(320 0) scale(-1 1)">آٹھواں پانچ سالہ منصوبہ</text><text x="160" y="244" text-anchor="middle" class="small" transform="translate(320 0) scale(-1 1)">1993-1998</text><text x="370" y="233" text-anchor="middle" class="body" transform="translate(740 0) scale(-1 1)">~</text><text x="600" y="226" text-anchor="middle" class="body" transform="translate(1200 0) scale(-1 1)">سائنس کی تعلیم</text><text x="600" y="244" text-anchor="middle" class="small" transform="translate(1200 0) scale(-1 1)">معیار پر توجہ</text><rect x="50" y="254" width="220" height="50" class="panel-b"/><rect x="270" y="254" width="200" height="50" class="panel-b"/><rect x="470" y="254" width="260" height="50" class="panel-b"/><text x="160" y="276" text-anchor="middle" class="body" transform="translate(320 0) scale(-1 1)">گیارہواں پانچ سالہ منصوبہ</text><text x="160" y="294" text-anchor="middle" class="small" transform="translate(320 0) scale(-1 1)">2013-2018</text><text x="370" y="283" text-anchor="middle" class="body" transform="translate(740 0) scale(-1 1)">~</text><text x="600" y="276" text-anchor="middle" class="body" transform="translate(1200 0) scale(-1 1)">صنفی مساوات</text><text x="600" y="294" text-anchor="middle" class="small" transform="translate(1200 0) scale(-1 1)">فنی تعلیم</text><rect x="50" y="304" width="220" height="50" class="panel-c"/><rect x="270" y="304" width="200" height="50" class="panel-c"/><rect x="470" y="304" width="260" height="50" class="panel-c"/><text x="160" y="326" text-anchor="middle" class="body" transform="translate(320 0) scale(-1 1)">وژن 2025</text><text x="160" y="344" text-anchor="middle" class="small" transform="translate(320 0) scale(-1 1)">درمیانی مدت</text><text x="370" y="333" text-anchor="middle" class="body" transform="translate(740 0) scale(-1 1)">~</text><text x="600" y="326" text-anchor="middle" class="body" transform="translate(1200 0) scale(-1 1)">سب کے لیے ابتدائی تعلیم</text><text x="600" y="344" text-anchor="middle" class="small" transform="translate(1200 0) scale(-1 1)">انسانی سرمائے پر توجہ</text><line x1="50" y1="104" x2="730" y2="104" class="grid"/><line x1="50" y1="154" x2="730" y2="154" class="grid"/><line x1="50" y1="204" x2="730" y2="204" class="grid"/><line x1="50" y1="254" x2="730" y2="254" class="grid"/><line x1="50" y1="304" x2="730" y2="304" class="grid"/><line x1="50" y1="354" x2="730" y2="354" class="grid"/><line x1="270" y1="60" x2="270" y2="354" class="grid"/><line x1="470" y1="60" x2="470" y2="354" class="grid"/><line x1="50" y1="354" x2="730" y2="354" class="stroke"/><text x="50" y="390" class="small" transform="translate(100 0) scale(-1 1)" text-anchor="end">نوٹ: بجٹ کے حصے اندازاً ہیں۔ درست مقدار ماخذ کے لحاظ سے بدلتی ہے، یہاں آزادانہ تصدیق نہیں کی گئی۔</text><text x="50" y="410" class="small" transform="translate(100 0) scale(-1 1)" text-anchor="end">ماخذ: پاکستان کا منصوبہ بندی کمیشن (مختلف منصوبوں کی دستاویزات)۔</text><text class="wm" x="768" y="460" text-anchor="start" aria-hidden="true" transform="translate(1536 0) scale(-1 1)">textbook.com.pk</text></g></svg>
