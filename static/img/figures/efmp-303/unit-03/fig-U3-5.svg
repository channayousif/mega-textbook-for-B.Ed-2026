<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart: Needs assessment to resource allocation</title><desc id="d">A flowchart showing the needs assessment to resource allocation process: data collection, gap analysis, priority setting, goal formulation, budget design and resource assignment, with arrows connecting each step.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .dash{stroke-dasharray:6 4;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"><rect id="region-needs" x="20" y="60" width="740" height="120" rx="12" class="panel"/><rect id="region-allocation" x="20" y="220" width="740" height="120" rx="12" class="panel"/></g><g id="layer-edges"><path id="edge-data-gaps" d="M245,131 L285,131" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-gaps-priorities" d="M495,131 L535,131" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-priorities-goals" d="M640,166 L640,200 L140,200 L140,256" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-goals-budget" d="M245,291 L285,291" class="stroke-a" marker-end="url(#arrow)"/><path id="edge-budget-assignment" d="M495,291 L535,291" class="stroke-a" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-data"><rect x="35" y="96" width="210" height="70" rx="8" class="panel-a"/><text x="140" y="126" text-anchor="middle" class="sh">1. Data collection</text><text x="140" y="144" text-anchor="middle" class="small">Enrolment, teachers, buildings</text></g><g id="node-gaps"><rect x="285" y="96" width="210" height="70" rx="8" class="panel-a"/><text x="390" y="126" text-anchor="middle" class="sh">2. Gap analysis</text><text x="390" y="144" text-anchor="middle" class="small">Where are the gaps?</text></g><g id="node-priorities"><rect x="535" y="96" width="210" height="70" rx="8" class="panel-a"/><text x="640" y="126" text-anchor="middle" class="sh">3. Priority setting</text><text x="640" y="144" text-anchor="middle" class="small">Which needs are most urgent?</text></g><g id="node-goals"><rect x="35" y="256" width="210" height="70" rx="8" class="panel-b"/><text x="140" y="286" text-anchor="middle" class="sh">4. Goal formulation</text><text x="140" y="304" text-anchor="middle" class="small">Set specific, measurable goals</text></g><g id="node-budget"><rect x="285" y="256" width="210" height="70" rx="8" class="panel-b"/><text x="390" y="286" text-anchor="middle" class="sh">5. Budget design</text><text x="390" y="304" text-anchor="middle" class="small">How much for each goal?</text></g><g id="node-assignment"><rect x="535" y="256" width="210" height="70" rx="8" class="panel-b"/><text x="640" y="286" text-anchor="middle" class="sh">6. Resource assignment</text><text x="640" y="304" text-anchor="middle" class="small">Distribute funds and people</text></g></g><g id="layer-labels"><text id="label-title" x="390" y="38" text-anchor="middle" class="h">From needs assessment to resource allocation</text><text id="label-needs-phase" x="400" y="84" text-anchor="middle" class="sh">Steps 1-3: needs assessment phase</text><text id="label-allocation-phase" x="400" y="244" text-anchor="middle" class="sh">Steps 4-6: resource allocation phase</text><g id="label-note"><text x="390" y="385" text-anchor="middle" class="body">Each step builds on the previous one. Weak data at step 1</text><text x="390" y="411" text-anchor="middle" class="body">leads to poor goals at step 4 and wasted resources at step 6.</text></g></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
