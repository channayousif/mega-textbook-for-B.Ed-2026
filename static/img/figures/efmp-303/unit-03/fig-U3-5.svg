<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart: Needs assessment to resource allocation</title><desc id="d">A flowchart showing the needs assessment to resource allocation process: data collection, gap analysis, priority setting, goal formulation, budget design and resource assignment, with arrows connecting each step.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="390" y="38" text-anchor="middle" class="h">From needs assessment to resource allocation</text><rect x="40" y="70" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="95" text-anchor="middle" class="sh">1. Data collection</text><text x="140" y="113" text-anchor="middle" class="small">Enrolment, teachers, buildings</text><rect x="290" y="70" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="95" text-anchor="middle" class="sh">2. Gap analysis</text><text x="390" y="113" text-anchor="middle" class="small">Where does the system fall short?</text><rect x="540" y="70" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="95" text-anchor="middle" class="sh">3. Priority setting</text><text x="640" y="113" text-anchor="middle" class="small">Which needs are most urgent?</text><line x1="240" y1="100" x2="288" y2="100" class="stroke-a" marker-end="url(#arrow)"/><line x1="490" y1="100" x2="538" y2="100" class="stroke-a" marker-end="url(#arrow)"/><rect x="540" y="200" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="225" text-anchor="middle" class="sh">6. Resource assignment</text><text x="640" y="243" text-anchor="middle" class="small">Distribute funds and people</text><rect x="290" y="200" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="225" text-anchor="middle" class="sh">5. Budget design</text><text x="390" y="243" text-anchor="middle" class="small">How much for each goal?</text><rect x="40" y="200" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="225" text-anchor="middle" class="sh">4. Goal formulation</text><text x="140" y="243" text-anchor="middle" class="small">Set specific, measurable goals</text><line x1="540" y1="230" x2="492" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="290" y1="230" x2="242" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="640" y1="130" x2="640" y2="198" class="stroke-a" marker-end="url(#arrow)"/><line x1="140" y1="200" x2="140" y2="132" class="stroke-a" marker-end="url(#arrow)"/><text x="140" y="320" text-anchor="middle" class="sh">Needs assessment phase</text><text x="140" y="340" text-anchor="middle" class="small">Steps 1-3</text><line x1="40" y1="300" x2="240" y2="300" class="stroke-a"/><text x="640" y="320" text-anchor="middle" class="sh">Resource allocation phase</text><text x="640" y="340" text-anchor="middle" class="small">Steps 4-6</text><line x1="540" y1="300" x2="740" y2="300" class="stroke-a"/><line x1="390" y1="150" x2="390" y2="290" class="stroke"/><text x="390" y="175" text-anchor="middle" class="small">then</text><text x="390" y="400" text-anchor="middle" class="body">Each step builds on the previous one. Weak data at step 1</text><text x="390" y="420" text-anchor="middle" class="body">leads to poor goals at step 4 and wasted resources at step 6.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
