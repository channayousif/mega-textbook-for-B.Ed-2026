<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی خاکہ: تعلیمی منصوبہ بندی کے مراحل</title><desc id="d">چھ مراحل ترتیب سے: ضروریات کا جائزہ، اہداف، وسائل کی منصوبہ بندی، عمل کی تشکیل، نفاذ، نگرانی اور جائزہ۔ فیڈ بیک چھٹے مرحلے سے پہلے کی طرف لوٹتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="390" y="38" text-anchor="middle" class="h" transform="translate(780 0) scale(-1 1)">تعلیمی منصوبہ بندی کے مراحل</text><rect x="40" y="70" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="100" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">1. ضروریات کا جائزہ</text><text x="140" y="118" text-anchor="middle" class="small" transform="translate(280 0) scale(-1 1)">موجودہ صورت حال کیا ہے؟</text><rect x="290" y="70" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="100" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">2. اہداف کا تعین</text><text x="390" y="118" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">قابل پیمائش اہداف طے کریں</text><rect x="540" y="70" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="100" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">3. وسائل کی منصوبہ بندی</text><text x="640" y="118" text-anchor="middle" class="small" transform="translate(1280 0) scale(-1 1)">رقم، افراد، سامان</text><line x1="240" y1="100" x2="288" y2="100" class="stroke-a" marker-end="url(#arrow)"/><line x1="490" y1="100" x2="538" y2="100" class="stroke-a" marker-end="url(#arrow)"/><path d="M640 130 L640 160 L140 160 L140 198" class="stroke-a" fill="none" marker-end="url(#arrow)"/><rect x="40" y="200" width="200" height="60" rx="8" class="panel-a"/><text x="140" y="230" text-anchor="middle" class="sh" transform="translate(280 0) scale(-1 1)">4. عملی اقدامات کی ترتیب</text><text x="140" y="248" text-anchor="middle" class="small" transform="translate(280 0) scale(-1 1)">کون، کیا، کب کرے گا</text><rect x="290" y="200" width="200" height="60" rx="8" class="panel-b"/><text x="390" y="230" text-anchor="middle" class="sh" transform="translate(780 0) scale(-1 1)">5. نفاذ</text><text x="390" y="248" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">منصوبے پر عمل کریں</text><rect x="540" y="200" width="200" height="60" rx="8" class="panel-c"/><text x="640" y="230" text-anchor="middle" class="sh" transform="translate(1280 0) scale(-1 1)">6. نگرانی اور جانچ</text><text x="640" y="248" text-anchor="middle" class="small" transform="translate(1280 0) scale(-1 1)">پیش رفت دیکھیں، تبدیلی کریں</text><line x1="240" y1="230" x2="288" y2="230" class="stroke-a" marker-end="url(#arrow)"/><line x1="490" y1="230" x2="538" y2="230" class="stroke-a" marker-end="url(#arrow)"/><path d="M640 260 L640 300 L20 300 L20 100 L38 100" class="stroke-a" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="390" y="320" text-anchor="middle" class="small" transform="translate(780 0) scale(-1 1)">بازخورد: جانچ اگلے ضروریات کے جائزے کی رہنمائی کرتی ہے</text><text x="40" y="360" class="body" transform="translate(80 0) scale(-1 1)" text-anchor="end">منصوبہ بندی مسلسل عمل ہے۔ ہر مرحلہ اگلے سے جڑتا ہے،</text><text x="40" y="380" class="body" transform="translate(80 0) scale(-1 1)" text-anchor="end">اور مرحلہ 6 کی جانچ اگلے منصوبہ بندی دور کی رہنمائی کرتی ہے۔</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>