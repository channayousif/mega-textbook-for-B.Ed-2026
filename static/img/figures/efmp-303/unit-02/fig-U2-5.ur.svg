<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قومی تعلیمی پالیسی 2017 کی ترجیحات کا تصوراتی نقشہ</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں 'قومی تعلیمی پالیسی 2017 کی ترجیحات' ہے اور اس کی چھ شاخیں ہیں: خواندگی اور غیر رسمی تعلیم، اعلیٰ تعلیم کی اصلاح، فنی و پیشہ ورانہ تعلیم، نصابی اصلاح، معیار کی ضمانت اور اساتذہ کی ترقی، نیز تین مزید لکیریں خواندگی کو اعلیٰ تعلیم سے، فنی تعلیم کو نصابی اصلاح سے، اور معیار کی ضمانت کو اساتذہ کی ترقی سے جوڑتی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-priorities-literacy" class="stroke-a" x1="490" y1="168" x2="540" y2="116"/><line id="edge-priorities-higher-education" class="stroke-a" x1="490" y1="224" x2="540" y2="250"/><line id="edge-priorities-technical" class="stroke-a" x1="290" y1="168" x2="240" y2="116"/><line id="edge-priorities-curriculum" class="stroke-a" x1="290" y1="224" x2="240" y2="250"/><line id="edge-priorities-quality-assurance" class="stroke-a" x1="436" y1="248" x2="530" y2="356"/><line id="edge-priorities-teacher-development" class="stroke-a" x1="344" y1="248" x2="250" y2="356"/><line id="edge-technical-curriculum" class="stroke-a" x1="140" y1="136" x2="140" y2="236"/><line id="edge-literacy-higher-education" class="stroke-a" x1="640" y1="136" x2="640" y2="236"/><line id="edge-quality-assurance-teacher-development" class="stroke-a" x1="450" y1="386" x2="330" y2="386"/></g><g id="layer-nodes"><g id="node-priorities"><ellipse class="panel-a" cx="390" cy="196" rx="116" ry="56"/><text class="sh" x="390" y="190" text-anchor="middle">‏قومی تعلیمی پالیسی 2017‏</text><text class="sh" x="390" y="212" text-anchor="middle">‏کی ترجیحات‏</text></g><g id="node-literacy"><rect class="panel" x="540" y="76" width="200" height="60" rx="8"/><text class="body" x="640" y="99" text-anchor="middle">‏خواندگی اور‏</text><text class="body" x="640" y="123" text-anchor="middle">‏غیر رسمی تعلیم‏</text></g><g id="node-higher-education"><rect class="panel" x="540" y="236" width="200" height="60" rx="8"/><text class="body" x="640" y="259" text-anchor="middle">‏اعلیٰ تعلیم‏</text><text class="body" x="640" y="283" text-anchor="middle">‏کی اصلاح‏</text></g><g id="node-technical"><rect class="panel" x="40" y="76" width="200" height="60" rx="8"/><text class="body" x="140" y="99" text-anchor="middle">‏فنی و پیشہ ورانہ‏</text><text class="body" x="140" y="123" text-anchor="middle">‏تعلیم‏</text></g><g id="node-curriculum"><rect class="panel" x="40" y="236" width="200" height="60" rx="8"/><text class="body" x="140" y="259" text-anchor="middle">‏نصابی‏</text><text class="body" x="140" y="283" text-anchor="middle">‏اصلاح‏</text></g><g id="node-quality-assurance"><rect class="panel" x="450" y="356" width="200" height="60" rx="8"/><text class="body" x="550" y="379" text-anchor="middle">‏معیار کی‏</text><text class="body" x="550" y="403" text-anchor="middle">‏ضمانت‏</text></g><g id="node-teacher-development"><rect class="panel" x="130" y="356" width="200" height="60" rx="8"/><text class="body" x="230" y="379" text-anchor="middle">‏اساتذہ کی‏</text><text class="body" x="230" y="403" text-anchor="middle">‏ترقی‏</text></g></g><g id="layer-labels"><text class="h" x="390" y="36" text-anchor="middle">‏قومی تعلیمی پالیسی 2017 کی ترجیحات‏</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
