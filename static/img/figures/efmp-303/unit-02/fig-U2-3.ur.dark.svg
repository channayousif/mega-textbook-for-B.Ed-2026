<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قومی تعلیمی پالیسی 2009 کا بہاؤ خاکہ</title><desc id="d">ایک بہاؤ خاکہ تین پٹیوں میں: قومی تعلیمی پالیسی 2009 کے اہداف (مفت اور لازمی تعلیم، معیار کی بہتری، نصابی اصلاح، اساتذہ کا معیار، انتظامی اختیارات کی صوبوں کو منتقلی)، ان کے نیچے نفاذ کی حکمتِ عملی (نصاب کی ترمیم، اساتذہ کی تربیت، صوبوں کو اختیارات کی منتقلی، سرکاری اور نجی شراکت، خرچ میں اضافہ)، اور سب سے نیچے نتائج (داخلے میں اضافہ، آرٹیکل 25-الف کا اضافہ، معیار کے خلا باقی، خرچ کا ہدف پورا نہ ہوا، غیر ہموار نفاذ)۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">قومی تعلیمی پالیسی 2009: منصوبے سے نتیجے تک</text><rect class="panel-a" x="40" y="48" width="700" height="100" rx="6"/><text class="sh" x="390" y="68" text-anchor="middle">اہداف</text><rect class="panel" x="605" y="80" width="90" height="40" rx="4"/><text class="body" x="650" y="104" text-anchor="middle">مفت اور لازمی</text><text class="small" x="650" y="118" text-anchor="middle">تعلیم</text><rect class="panel" x="475" y="80" width="90" height="40" rx="4"/><text class="body" x="520" y="104" text-anchor="middle">معیار کی</text><text class="small" x="520" y="118" text-anchor="middle">بہتری</text><rect class="panel" x="345" y="80" width="90" height="40" rx="4"/><text class="body" x="390" y="104" text-anchor="middle">نصابی</text><text class="small" x="390" y="118" text-anchor="middle">اصلاح</text><rect class="panel" x="215" y="80" width="90" height="40" rx="4"/><text class="body" x="260" y="104" text-anchor="middle">اساتذہ کا</text><text class="small" x="260" y="118" text-anchor="middle">معیار</text><rect class="panel" x="85" y="80" width="90" height="40" rx="4"/><text class="body" x="130" y="104" text-anchor="middle">انتظامی اختیارات</text><text class="small" x="130" y="118" text-anchor="middle">کی منتقلی</text><line class="stroke-a" marker-end="url(#arrow)" x1="650" y1="122" x2="650" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="520" y1="122" x2="520" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="390" y1="122" x2="390" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="260" y1="122" x2="260" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="130" y1="122" x2="130" y2="162"/><rect class="panel-b" x="40" y="170" width="700" height="110" rx="6"/><text class="sh" x="390" y="190" text-anchor="middle">نفاذ کی حکمتِ عملی</text><rect class="panel" x="605" y="200" width="120" height="55" rx="4"/><text class="body" x="665" y="222" text-anchor="middle">نصاب کی</text><text class="body" x="665" y="238" text-anchor="middle">ترمیم</text><rect class="panel" x="465" y="200" width="120" height="55" rx="4"/><text class="body" x="525" y="222" text-anchor="middle">اساتذہ کی</text><text class="body" x="525" y="238" text-anchor="middle">تربیت</text><rect class="panel" x="325" y="200" width="120" height="55" rx="4"/><text class="body" x="385" y="222" text-anchor="middle">اختیارات کی</text><text class="small" x="385" y="238" text-anchor="middle">صوبوں کو منتقلی</text><rect class="panel" x="185" y="200" width="120" height="55" rx="4"/><text class="body" x="245" y="222" text-anchor="middle">سرکاری اور نجی</text><text class="small" x="245" y="238" text-anchor="middle">شراکت</text><rect class="panel" x="45" y="200" width="120" height="55" rx="4"/><text class="body" x="105" y="222" text-anchor="middle">خرچ میں</text><text class="body" x="105" y="238" text-anchor="middle">اضافہ</text><line class="stroke-a" marker-end="url(#arrow)" x1="665" y1="257" x2="665" y2="295"/><line class="stroke-a" marker-end="url(#arrow)" x1="525" y1="257" x2="525" y2="295"/><line class="stroke-a" marker-end="url(#arrow)" x1="385" y1="257" x2="385" y2="295"/><line class="stroke-a" marker-end="url(#arrow)" x1="245" y1="257" x2="245" y2="295"/><line class="stroke-a" marker-end="url(#arrow)" x1="105" y1="257" x2="105" y2="295"/><rect class="panel-c" x="40" y="305" width="700" height="110" rx="6"/><text class="sh" x="390" y="325" text-anchor="middle">نتائج</text><rect class="panel" x="605" y="335" width="120" height="55" rx="4"/><text class="body" x="665" y="357" text-anchor="middle">داخلے میں</text><text class="body" x="665" y="373" text-anchor="middle">اضافہ</text><rect class="panel" x="465" y="335" width="120" height="55" rx="4"/><text class="body" x="525" y="357" text-anchor="middle">آرٹیکل 25-الف</text><text class="body" x="525" y="373" text-anchor="middle">کا اضافہ</text><rect class="panel" x="325" y="335" width="120" height="55" rx="4"/><text class="body" x="385" y="357" text-anchor="middle">معیار کے</text><text class="body" x="385" y="373" text-anchor="middle">خلا باقی</text><rect class="panel" x="185" y="335" width="120" height="55" rx="4"/><text class="body" x="245" y="357" text-anchor="middle">خرچ کا ہدف</text><text class="body" x="245" y="373" text-anchor="middle">پورا نہ ہوا</text><rect class="panel" x="45" y="335" width="120" height="55" rx="4"/><text class="body" x="105" y="357" text-anchor="middle">غیر ہموار</text><text class="body" x="105" y="373" text-anchor="middle">نفاذ</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
