<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قومی تعلیمی پالیسی 2009 اور 2017 کا موازنہ</title><desc id="d">قومی تعلیمی پالیسی 2009 اور قومی تعلیمی پالیسی 2017 کا سات پہلوؤں پر موازنہ کرنے والا جدول: رسائی، نصاب، اساتذہ کا معیار، انتظام، معیار کی ضمانت، خواندگی اور اعلیٰ تعلیم۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect class="panel-a" x="40" y="52" width="700" height="42" rx="4"/><line class="grid" x1="580" y1="52" x2="580" y2="94"/><line class="grid" x1="310" y1="52" x2="310" y2="94"/><text class="sh" x="660" y="78" text-anchor="middle">‏پہلو‏</text><text class="sh" x="445" y="78" text-anchor="middle">‏پالیسی 2009‏</text><text class="sh" x="175" y="78" text-anchor="middle">‏پالیسی 2017‏</text></g><g id="node-access"><rect class="panel" x="40" y="97" width="700" height="46" rx="4"/><line class="grid" x1="580" y1="97" x2="580" y2="143"/><line class="grid" x1="310" y1="97" x2="310" y2="143"/><text class="body" x="660" y="125" text-anchor="middle">‏رسائی‏</text><text class="body" x="445" y="125" text-anchor="middle">‏داخلہ بڑھانا، مفت تعلیم‏</text><text class="body" x="175" y="125" text-anchor="middle">‏مساوات پر زور، اسکول سے باہر بچے‏</text></g><g id="node-curriculum"><rect class="panel" x="40" y="146" width="700" height="46" rx="4"/><line class="grid" x1="580" y1="146" x2="580" y2="192"/><line class="grid" x1="310" y1="146" x2="310" y2="192"/><text class="body" x="660" y="174" text-anchor="middle">‏نصاب‏</text><text class="body" x="445" y="174" text-anchor="middle">‏قومی نصاب میں ترمیم‏</text><text class="body" x="175" y="174" text-anchor="middle">‏رٹا کم، مہارتیں زیادہ‏</text></g><g id="node-teacher-quality"><rect class="panel" x="40" y="195" width="700" height="46" rx="4"/><line class="grid" x1="580" y1="195" x2="580" y2="241"/><line class="grid" x1="310" y1="195" x2="310" y2="241"/><text class="body" x="660" y="223" text-anchor="middle">‏اساتذہ کا معیار‏</text><text class="body" x="445" y="223" text-anchor="middle">‏دورانِ اور قبل از ملازمت تربیت‏</text><text class="body" x="175" y="223" text-anchor="middle">‏توجہ جاری، جواب دہی‏</text></g><g id="node-governance"><rect class="panel" x="40" y="244" width="700" height="46" rx="4"/><line class="grid" x1="580" y1="244" x2="580" y2="290"/><line class="grid" x1="310" y1="244" x2="310" y2="290"/><text class="body" x="660" y="272" text-anchor="middle">‏انتظام‏</text><text class="body" x="445" y="272" text-anchor="middle">‏اختیارات صوبوں کو منتقلی‏</text><text class="body" x="175" y="272" text-anchor="middle">‏صوبائی صلاحیت مضبوط کرنا‏</text></g><g id="node-quality-assurance"><rect class="panel" x="40" y="293" width="700" height="46" rx="4"/><line class="grid" x1="580" y1="293" x2="580" y2="339"/><line class="grid" x1="310" y1="293" x2="310" y2="339"/><text class="body" x="660" y="321" text-anchor="middle">‏معیار کی ضمانت‏</text><text class="body" x="445" y="321" text-anchor="middle">‏وسائل پر مرکوز معیارات‏</text><text class="body" x="175" y="321" text-anchor="middle">‏تصدیق اور جانچیں‏</text></g><g id="node-literacy"><rect class="panel" x="40" y="342" width="700" height="46" rx="4"/><line class="grid" x1="580" y1="342" x2="580" y2="388"/><line class="grid" x1="310" y1="342" x2="310" y2="388"/><text class="body" x="660" y="370" text-anchor="middle">‏خواندگی‏</text><text class="body" x="445" y="370" text-anchor="middle">‏ایک ہدف کے طور پر مذکور‏</text><text class="body" x="175" y="370" text-anchor="middle">‏بالغ خواندگی کے پروگرام‏</text></g><g id="node-higher-education"><rect class="panel" x="40" y="391" width="700" height="46" rx="4"/><line class="grid" x1="580" y1="391" x2="580" y2="437"/><line class="grid" x1="310" y1="391" x2="310" y2="437"/><text class="body" x="660" y="419" text-anchor="middle">‏اعلیٰ تعلیم‏</text><text class="body" x="445" y="419" text-anchor="middle">‏تفصیل محدود‏</text><text class="body" x="175" y="419" text-anchor="middle">‏محنت کی منڈی کی ضروریات سے جوڑنا‏</text></g></g><g id="layer-labels"><text class="h" x="390" y="36" text-anchor="middle">‏قومی تعلیمی پالیسی 2009 اور 2017 کا موازنہ‏</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
