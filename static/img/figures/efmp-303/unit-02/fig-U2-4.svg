<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">NEP 2009 objectives matched with implementation strategies</title><desc id="d">A table matching NEP 2009 objectives with their implementation strategies.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">NEP 2009: objectives and strategies</text><rect class="panel" x="40" y="55" width="700" height="50" rx="4"/><line class="grid" x1="390" y1="55" x2="390" y2="105"/><text class="sh" x="215" y="85" text-anchor="middle">Objective</text><text class="sh" x="565" y="85" text-anchor="middle">Implementation strategy</text><rect class="panel-a" x="40" y="108" width="700" height="62" rx="4"/><line class="grid" x1="390" y1="108" x2="390" y2="170"/><text class="body" x="215" y="135" text-anchor="middle">Free and compulsory</text><text class="body" x="215" y="152" text-anchor="middle">education</text><text class="body" x="565" y="135" text-anchor="middle">Constitutional guarantee</text><text class="body" x="565" y="152" text-anchor="middle">and stipend programmes</text><rect class="panel-b" x="40" y="173" width="700" height="62" rx="4"/><line class="grid" x1="390" y1="173" x2="390" y2="235"/><text class="body" x="215" y="200" text-anchor="middle">Curriculum reform</text><text class="body" x="565" y="200" text-anchor="middle">National curriculum</text><text class="body" x="565" y="217" text-anchor="middle">revision</text><rect class="panel-a" x="40" y="238" width="700" height="62" rx="4"/><line class="grid" x1="390" y1="238" x2="390" y2="300"/><text class="body" x="215" y="265" text-anchor="middle">Teacher quality</text><text class="body" x="565" y="265" text-anchor="middle">In-service training and</text><text class="body" x="565" y="282" text-anchor="middle">pre-service strengthening</text><rect class="panel-c" x="40" y="303" width="700" height="62" rx="4"/><line class="grid" x1="390" y1="303" x2="390" y2="365"/><text class="body" x="215" y="330" text-anchor="middle">Governance</text><text class="body" x="565" y="330" text-anchor="middle">Devolution to</text><text class="body" x="565" y="347" text-anchor="middle">provinces</text><rect class="panel-a" x="40" y="368" width="700" height="62" rx="4"/><line class="grid" x1="390" y1="368" x2="390" y2="430"/><text class="body" x="215" y="395" text-anchor="middle">Quality improvement</text><text class="body" x="565" y="395" text-anchor="middle">Public-private</text><text class="body" x="565" y="412" text-anchor="middle">partnerships</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
