<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">NEP 2017 policy priorities concept map</title><desc id="d">A concept map with 'NEP 2017 priorities' at the centre and six branches: literacy and non-formal education, higher education reform, technical and vocational education, curriculum reform, quality assurance and teacher development, with three further lines linking literacy to higher education, technical education to curriculum reform, and quality assurance to teacher development.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-priorities-literacy" class="stroke-a" x1="290" y1="168" x2="240" y2="116"/><line id="edge-priorities-higher-education" class="stroke-a" x1="290" y1="224" x2="240" y2="250"/><line id="edge-priorities-technical" class="stroke-a" x1="490" y1="168" x2="540" y2="116"/><line id="edge-priorities-curriculum" class="stroke-a" x1="490" y1="224" x2="540" y2="250"/><line id="edge-priorities-quality-assurance" class="stroke-a" x1="344" y1="248" x2="250" y2="356"/><line id="edge-priorities-teacher-development" class="stroke-a" x1="436" y1="248" x2="530" y2="356"/><line id="edge-technical-curriculum" class="stroke-a" x1="640" y1="136" x2="640" y2="236"/><line id="edge-literacy-higher-education" class="stroke-a" x1="140" y1="136" x2="140" y2="236"/><line id="edge-quality-assurance-teacher-development" class="stroke-a" x1="330" y1="386" x2="450" y2="386"/></g><g id="layer-nodes"><g id="node-priorities"><ellipse class="panel-a" cx="390" cy="196" rx="116" ry="56"/><text class="sh" x="390" y="191.5" text-anchor="middle">NEP 2017</text><text class="sh" x="390" y="210.5" text-anchor="middle">Priorities</text></g><g id="node-literacy"><rect class="panel" x="40" y="76" width="200" height="60" rx="8"/><text class="body" x="140" y="102.5" text-anchor="middle">Literacy and</text><text class="body" x="140" y="119.5" text-anchor="middle">non-formal education</text></g><g id="node-higher-education"><rect class="panel" x="40" y="236" width="200" height="60" rx="8"/><text class="body" x="140" y="262.5" text-anchor="middle">Higher education</text><text class="body" x="140" y="279.5" text-anchor="middle">reform</text></g><g id="node-technical"><rect class="panel" x="540" y="76" width="200" height="60" rx="8"/><text class="body" x="640" y="102.5" text-anchor="middle">Technical and vocational</text><text class="body" x="640" y="119.5" text-anchor="middle">education</text></g><g id="node-curriculum"><rect class="panel" x="540" y="236" width="200" height="60" rx="8"/><text class="body" x="640" y="262.5" text-anchor="middle">Curriculum</text><text class="body" x="640" y="279.5" text-anchor="middle">reform</text></g><g id="node-quality-assurance"><rect class="panel" x="130" y="356" width="200" height="60" rx="8"/><text class="body" x="230" y="382.5" text-anchor="middle">Quality</text><text class="body" x="230" y="399.5" text-anchor="middle">assurance</text></g><g id="node-teacher-development"><rect class="panel" x="450" y="356" width="200" height="60" rx="8"/><text class="body" x="550" y="382.5" text-anchor="middle">Teacher</text><text class="body" x="550" y="399.5" text-anchor="middle">development</text></g></g><g id="layer-labels"><text class="h" x="390" y="36" text-anchor="middle">NEP 2017 policy priorities</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
