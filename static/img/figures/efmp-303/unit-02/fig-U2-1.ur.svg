<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کی تعلیمی پالیسیوں کا زمانی خاکہ، 1947 تا 2000</title><desc id="d">ایک زمانی خاکہ جو 1947 سے 2000 تک پاکستان کی بڑی تعلیمی پالیسیاں دکھاتا ہے: 1947 کی تعلیمی کانفرنس، 1959 کا شریف کمیشن، 1970 کی قومی تعلیمی پالیسی، 1972 کی تعلیمی پالیسی، 1979 کی تعلیمی پالیسی، 1992 کی تعلیمی پالیسی، 1998 کی قومی تعلیمی پالیسی۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} .node{fill:var(--a1);stroke:var(--ink);stroke-width:2;} .year{font-size:12px;font-weight:700;fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">پاکستان میں تعلیمی پالیسیاں: 1947 تا 2000</text><line class="stroke" x1="720" y1="240" x2="60" y2="240"/><circle class="node" cx="680" cy="240" r="9"/><text class="year" x="680" y="210" text-anchor="middle">1947</text><rect class="panel-a" x="635" y="95" width="90" height="50" rx="6"/><text class="sh" x="680" y="113" text-anchor="middle">تعلیمی</text><text class="sh" x="680" y="130" text-anchor="middle">کانفرنس</text><line class="stroke-a" x1="680" y1="230" x2="680" y2="148"/><circle class="node" cx="580" cy="240" r="9"/><text class="year" x="580" y="278" text-anchor="middle">1959</text><rect class="panel-b" x="530" y="285" width="100" height="50" rx="6"/><text class="sh" x="580" y="303" text-anchor="middle">شریف</text><text class="sh" x="580" y="320" text-anchor="middle">کمیشن</text><line class="stroke-a" x1="580" y1="250" x2="580" y2="285"/><circle class="node" cx="480" cy="240" r="9"/><text class="year" x="480" y="210" text-anchor="middle">1970</text><rect class="panel-a" x="425" y="80" width="110" height="50" rx="6"/><text class="sh" x="480" y="98" text-anchor="middle">قومی تعلیمی</text><text class="sh" x="480" y="115" text-anchor="middle">پالیسی</text><line class="stroke-a" x1="480" y1="230" x2="480" y2="130"/><circle class="node" cx="380" cy="240" r="9"/><text class="year" x="380" y="278" text-anchor="middle">1972</text><rect class="panel-c" x="325" y="285" width="110" height="50" rx="6"/><text class="sh" x="380" y="303" text-anchor="middle">تعلیمی پالیسی</text><text class="body small" x="380" y="320" text-anchor="middle">قومی ملکیت</text><line class="stroke-a" x1="380" y1="250" x2="380" y2="285"/><circle class="node" cx="280" cy="240" r="9"/><text class="year" x="280" y="210" text-anchor="middle">1979</text><rect class="panel-a" x="225" y="80" width="110" height="50" rx="6"/><text class="sh" x="280" y="98" text-anchor="middle">تعلیمی پالیسی</text><text class="body small" x="280" y="115" text-anchor="middle">اسلامی تشکیل</text><line class="stroke-a" x1="280" y1="230" x2="280" y2="130"/><circle class="node" cx="180" cy="240" r="9"/><text class="year" x="180" y="278" text-anchor="middle">1992</text><rect class="panel-b" x="130" y="285" width="100" height="50" rx="6"/><text class="sh" x="180" y="303" text-anchor="middle">تعلیمی</text><text class="sh" x="180" y="320" text-anchor="middle">پالیسی</text><line class="stroke-a" x1="180" y1="250" x2="180" y2="285"/><circle class="node" cx="80" cy="240" r="9"/><text class="year" x="80" y="210" text-anchor="middle">1998</text><rect class="panel-a" x="25" y="80" width="110" height="50" rx="6"/><text class="sh" x="80" y="98" text-anchor="middle">قومی تعلیمی</text><text class="sh" x="80" y="115" text-anchor="middle">پالیسی</text><line class="stroke-a" x1="80" y1="230" x2="80" y2="130"/><text class="small" x="720" y="440" aria-hidden="true" text-anchor="end">محور کے اوپر: پالیسی کا نام۔ محور کے نیچے: تناظر کا مختصر عنوان۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
