nel" x="475" y="335" width="120" height="55" rx="4"/><text class="body" x="535" y="357" text-anchor="middle">Spending</text><text class="body" x="535" y="373" text-anchor="middle">target missed</text><rect class="panel" x="615" y="335" width="120" height="55" rx="4"/><text class="body" x="675" y="357" text-anchor="middle">Uneven</text><text class="body" x="675" y="373" text-anchor="middle">implementation</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
