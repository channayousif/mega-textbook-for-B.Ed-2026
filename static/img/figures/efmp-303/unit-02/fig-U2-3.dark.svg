<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">National Education Policy 2009 flowchart</title><desc id="d">A flowchart showing the National Education Policy 2009: from objectives through implementation strategies to outcomes.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">National Education Policy 2009: from plan to result</text><rect class="panel-a" x="40" y="48" width="700" height="100" rx="6"/><text class="sh" x="390" y="68" text-anchor="middle">OBJECTIVES</text><text class="body" x="130" y="92" text-anchor="middle">Free and compulsory</text><text class="body" x="130" y="108" text-anchor="middle">education</text><rect class="panel" x="85" y="80" width="90" height="40" rx="4"/><text class="body" x="130" y="104" text-anchor="middle">Free and compulsory</text><text class="small" x="130" y="118" text-anchor="middle">education</text><rect class="panel" x="215" y="80" width="90" height="40" rx="4"/><text class="body" x="260" y="104" text-anchor="middle">Quality</text><text class="small" x="260" y="118" text-anchor="middle">improvement</text><rect class="panel" x="345" y="80" width="90" height="40" rx="4"/><text class="body" x="390" y="104" text-anchor="middle">Curriculum</text><text class="small" x="390" y="118" text-anchor="middle">reform</text><rect class="panel" x="475" y="80" width="90" height="40" rx="4"/><text class="body" x="520" y="104" text-anchor="middle">Teacher</text><text class="small" x="520" y="118" text-anchor="middle">quality</text><rect class="panel" x="605" y="80" width="90" height="40" rx="4"/><text class="body" x="650" y="104" text-anchor="middle">Governance</text><text class="small" x="650" y="118" text-anchor="middle">devolution</text><line class="stroke-a" marker-end="url(#arrow)" x1="130" y1="122" x2="130" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="260" y1="122" x2="260" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="390" y1="122" x2="390" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="520" y1="122" x2="520" y2="162"/><line class="stroke-a" marker-end="url(#arrow)" x1="650" y1="122" x2="650" y2="162"/><rect class="panel-b" x="40" y="170" width="700" height="110" rx="6"/><text class="sh" x="390" y="190" text-anchor="middle">IMPLEMENTATION STRATEGIES</text><rect class="panel" x="55" y="200" width="120" height="55" rx="4"/><text class="body" x="115" y="222" text-anchor="middle">Curriculum</text><text class="body" x="115" y="238" text-anchor="middle">revision</text><rect class="panel" x="195" y="200" width="120" height="55" rx="4"/><t