<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کی تعلیمی پالیسیوں کا زمانی خاکہ، 1947 تا 2000</title><desc id="d">ایک زمانی خاکہ جو 1947 سے 2000 تک پاکستان کی بڑی تعلیمی پالیسیاں دکھاتا ہے: 1947 کی تعلیمی کانفرنس، 1959 کا شریف کمیشن، 1970 کی قومی تعلیمی پالیسی، 1972 کی تعلیمی پالیسی، 1979 کی تعلیمی پالیسی، 1992 کی تعلیمی پالیسی، 1998 کی قومی تعلیمی پالیسی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="740" y1="270" x2="40" y2="270"/><line id="edge-conference-1947-axis" class="stroke-a" x1="690" y1="146" x2="690" y2="261"/><line id="edge-sharif-1959-axis" class="stroke-a" x1="590" y1="246" x2="590" y2="261"/><line id="edge-policy-1970-axis" class="stroke-a" x1="490" y1="146" x2="490" y2="261"/><line id="edge-policy-1972-axis" class="stroke-a" x1="390" y1="246" x2="390" y2="261"/><line id="edge-policy-1979-axis" class="stroke-a" x1="290" y1="146" x2="290" y2="261"/><line id="edge-policy-1992-axis" class="stroke-a" x1="190" y1="246" x2="190" y2="261"/><line id="edge-policy-1998-axis" class="stroke-a" x1="90" y1="146" x2="90" y2="261"/></g><g id="layer-nodes"><g id="node-conference-1947"><rect class="panel-a" x="630" y="80" width="120" height="66" rx="6"/><text class="sh" x="690" y="106" text-anchor="middle">‏تعلیمی‏</text><text class="sh" x="690" y="130" text-anchor="middle">‏کانفرنس‏</text><circle class="panel" cx="690" cy="270" r="9"/><text class="sh" x="690" y="302" text-anchor="middle">‏1947‏</text></g><g id="node-sharif-1959"><rect class="panel-a" x="530" y="180" width="120" height="66" rx="6"/><text class="sh" x="590" y="206" text-anchor="middle">‏شریف‏</text><text class="sh" x="590" y="230" text-anchor="middle">‏کمیشن‏</text><circle class="panel" cx="590" cy="270" r="9"/><text class="sh" x="590" y="302" text-anchor="middle">‏1959‏</text></g><g id="node-policy-1970"><rect class="panel-a" x="430" y="80" width="120" height="66" rx="6"/><text class="sh" x="490" y="106" text-anchor="middle">‏قومی تعلیمی‏</text><text class="sh" x="490" y="130" text-anchor="middle">‏پالیسی‏</text><circle class="panel" cx="490" cy="270" r="9"/><text class="sh" x="490" y="302" text-anchor="middle">‏1970‏</text></g><g id="node-policy-1972"><rect class="panel-a" x="330" y="180" width="120" height="66" rx="6"/><text class="sh" x="390" y="218" text-anchor="middle">‏تعلیمی پالیسی‏</text><circle class="panel" cx="390" cy="270" r="9"/><text class="sh" x="390" y="302" text-anchor="middle">‏1972‏</text><text class="small" x="390" y="337" text-anchor="middle">‏قومی ملکیت‏</text></g><g id="node-policy-1979"><rect class="panel-a" x="230" y="80" width="120" height="66" rx="6"/><text class="sh" x="290" y="118" text-anchor="middle">‏تعلیمی پالیسی‏</text><circle class="panel" cx="290" cy="270" r="9"/><text class="sh" x="290" y="302" text-anchor="middle">‏1979‏</text><text cl