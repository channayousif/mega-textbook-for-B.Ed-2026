<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قومی تعلیمی پالیسی 2017 کی ترجیحات کا تصوراتی نقشہ</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں 'قومی تعلیمی پالیسی 2017 کی ترجیحات' ہے اور اس کی چھ شاخیں ہیں: خواندگی اور غیر رسمی تعلیم، اعلیٰ تعلیم کی اصلاح، فنی و پیشہ ورانہ تعلیم، نصابی اصلاح، معیار کی ضمانت اور اساتذہ کی ترقی، نیز تین مزید لکیریں خواندگی کو اعلیٰ تعلیم سے، فنی تعلیم کو نصابی اصلاح سے، اور معیار کی ضمانت کو اساتذہ کی ترقی سے جوڑتی ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">قومی تعلیمی پالیسی 2017 کی ترجیحات</text><ellipse class="panel-a" cx="390" cy="235" rx="130" ry="55"/><text class="sh" x="390" y="230" text-anchor="middle">قومی تعلیمی پالیسی 2017</text><text class="sh" x="390" y="248" text-anchor="middle">کی ترجیحات</text><rect class="panel-b" x="530" y="60" width="170" height="50" rx="6"/><text class="body" x="615" y="82" text-anchor="middle">خواندگی اور</text><text class="body" x="615" y="98" text-anchor="middle">غیر رسمی تعلیم</text><rect class="panel-c" x="80" y="60" width="170" height="50" rx="6"/><text class="body" x="165" y="82" text-anchor="middle">اعلیٰ تعلیم</text><text class="body" x="165" y="98" text-anchor="middle">کی اصلاح</text><rect class="panel-d" x="540" y="360" width="180" height="50" rx="6"/><text class="body" x="630" y="382" text-anchor="middle">فنی و پیشہ ورانہ</text><text class="body" x="630" y="398" text-anchor="middle">تعلیم</text><rect class="panel-b" x="70" y="360" width="170" height="50" rx="6"/><text class="body" x="155" y="382" text-anchor="middle">نصابی</text><text class="body" x="155" y="398" text-anchor="middle">اصلاح</text><rect class="panel-c" x="550" y="170" width="150" height="50" rx="6"/><text class="body" x="625" y="192" text-anchor="middle">معیار کی</text><text class="body" x="625" y="208" text-anchor="middle">ضمانت</text><rect class="panel-d" x="70" y="170" width="160" height="50" rx="6"/><text class="body" x="150" y="192" text-anchor="middle">اساتذہ کی</text><text class="body" x="150" y="208" text-anchor="middle">ترقی</text><line class="stroke-a" x1="560" y1="85" x2="500" y2="200"/><line class="stroke-a" x1="220" y1="85" x2="280" y2="200"/><line class="stroke-a" x1="605" y1="360" x2="500" y2="265"/><line class="stroke-a" x1="160" y1="360" x2="280" y2="265"/><line class="stroke-a" x1="625" y1="170" x2="510" y2="220"/><line class="stroke-a" x1="150" y1="170" x2="270" y2="220"/><line class="stroke-a" x1="615" y1="110" x2="165" y2="60"/><line class="stroke-a" x1="630" y1="360" x2="155" y2="410"/><path class="stroke-a" d="M 625 220 C 520 360 260 360 150 170"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
