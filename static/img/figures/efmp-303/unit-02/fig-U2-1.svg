<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of education policies in Pakistan 1947 to 2000</title><desc id="d">A timeline showing major education policies in Pakistan from 1947 to 2000: 1947 Education Conference, 1959 Sharif Commission, 1970 National Education Policy, 1972 Education Policy, 1979 Education Policy, 1992 Education Policy, 1998 National Education Policy.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} .node{fill:var(--a1);stroke:var(--ink);stroke-width:2;} .year{font-size:13px;font-weight:700;fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="major">Education policies in Pakistan: 1947 to 2000</text><line class="stroke" x1="60" y1="240" x2="720" y2="240"/><circle class="node" cx="100" cy="240" r="9"/><text class="year" x="100" y="210" text-anchor="middle">1947</text><rect class="panel-a" x="55" y="95" width="90" height="50" rx="6"/><text class="sh" x="100" y="113" text-anchor="middle">Education</text><text class="sh" x="100" y="130" text-anchor="middle">Conference</text><line class="stroke-a" x1="100" y1="230" x2="100" y2="148"/><circle class="node" cx="200" cy="240" r="9"/><text class="year" x="200" y="278" text-anchor="middle">1959</text><rect class="panel-b" x="150" y="285" width="100" height="50" rx="6"/><text class="sh" x="200" y="303" text-anchor="middle">Sharif</text><text class="sh" x="200" y="320" text-anchor="middle">Commission</text><line class="stroke-a" x1="200" y1="250" x2="200" y2="285"/><circle class="node" cx="300" cy="240" r="9"/><text class="year" x="300" y="210" text-anchor="middle">1970</text><rect class="panel-a" x="245" y="80" width="110" height="50" rx="6"/><text class="sh" x="300" y="98" text-anchor="middle">National Education</text><text class="sh" x="300" y="115" text-anchor="middle">Policy</text><line class="stroke-a" x1="300" y1="230" x2="300" y2="130"/><circle class="node" cx="400" cy="240" r="9"/><text class="year" x="400" y="278" text-anchor="middle">1972</text><rect class="panel-c" x="345" y="285" width="110" height="50" rx="6"/><text class="sh" x="400" y="303" text-anchor="middle">Education Policy</text><text class="body small" x="400" y="320" text-anchor="middle">Nationalisation</text><line class="stroke-a" x1="400" y1="250" x2="400" y2="285"/><circle class="node" cx="500" cy="240" r="9"/><text class="year" x="500" y="210" text-anchor="middle">1979</text><rect class="panel-a" x="445" y="80" width="110" height="50" rx="6"/><text class="sh" x="500" y="98" text-anchor="middle">Education Policy</text><text class="body small" x="500" y="115" text-anchor="middle">Islamization focus</text><line class="stroke-a" x1="500" y1="230" x2="500" y2="130"/><circle class="node" cx="600" cy="240" r="9"/><text class="year" x="600" y="278" text-anchor="middle">1992</text><rect class="panel-b" x="550" y="285" width="100" height="50" rx="6"/><text class="sh" x="600" y="303" text-anchor="middle">Education</text><text class="sh" x="600" y="320" text-anchor="middle">Policy</text><line class="stroke-a" x1="600" y1="250" x2="600" y2="285"/><circle class="node" cx="700" cy="240" r="9"/><text class="year" x="700" y="210" text-anchor="middle">1998</text><rect class="panel-a" x="645" y="80" width="110" height="50" rx="6"/><text class="sh" x="700" y="98" text-anchor="middle">National Education</text><text class="sh" x="700" y="115" text-anchor="middle">Policy</text><line class="stroke-a" x1="700" y1="230" x2="700" y2="130"/><text class="small" x="60" y="440" aria-hidden="true">Above axis: policy name. Below axis: brief context label.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
