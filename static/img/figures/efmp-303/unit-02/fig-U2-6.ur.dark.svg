<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قومی تعلیمی پالیسی 2009 اور 2017 کا موازنہ</title><desc id="d">قومی تعلیمی پالیسی 2009 اور قومی تعلیمی پالیسی 2017 کا سات پہلوؤں پر موازنہ کرنے والا جدول: رسائی، نصاب، اساتذہ کا معیار، انتظام، معیار کی ضمانت، خواندگی اور اعلیٰ تعلیم۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">قومی تعلیمی پالیسی 2009 اور 2017 کا موازنہ</text><rect class="panel" x="40" y="50" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="50" x2="600" y2="96"/><line class="grid" x1="320" y1="50" x2="320" y2="96"/><text class="sh" x="670" y="78" text-anchor="middle">پہلو</text><text class="sh" x="460" y="78" text-anchor="middle">پالیسی 2009</text><text class="sh" x="170" y="78" text-anchor="middle">پالیسی 2017</text><rect class="panel-a" x="40" y="99" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="99" x2="600" y2="145"/><line class="grid" x1="320" y1="99" x2="320" y2="145"/><text class="body" x="670" y="127" text-anchor="middle">رسائی</text><text class="body" x="460" y="127" text-anchor="middle">داخلہ بڑھانا، مفت تعلیم</text><text class="body" x="170" y="127" text-anchor="middle">مساوات پر زور، اسکول سے باہر بچے</text><rect class="panel-b" x="40" y="148" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="148" x2="600" y2="194"/><line class="grid" x1="320" y1="148" x2="320" y2="194"/><text class="body" x="670" y="176" text-anchor="middle">نصاب</text><text class="body" x="460" y="176" text-anchor="middle">قومی نصاب میں ترمیم</text><text class="body" x="170" y="176" text-anchor="middle">رٹا کم، مہارتیں زیادہ</text><rect class="panel-a" x="40" y="197" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="197" x2="600" y2="243"/><line class="grid" x1="320" y1="197" x2="320" y2="243"/><text class="body" x="670" y="225" text-anchor="middle">اساتذہ کا معیار</text><text class="body" x="460" y="225" text-anchor="middle">دورانِ اور قبل از ملازمت تربیت</text><text class="body" x="170" y="225" text-anchor="middle">توجہ جاری، جواب دہی</text><rect class="panel-c" x="40" y="246" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="246" x2="600" y2="292"/><line class="grid" x1="320" y1="246" x2="320" y2="292"/><text class="body" x="670" y="274" text-anchor="middle">انتظام</text><text class="body" x="460" y="274" text-anchor="middle">اختیارات صوبوں کو منتقلی</text><text class="body" x="170" y="274" text-anchor="middle">صوبائی صلاحیت مضبوط کرنا</text><rect class="panel-a" x="40" y="295" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="295" x2="600" y2="341"/><line class="grid" x1="320" y1="295" x2="320" y2="341"/><text class="body" x="670" y="323" text-anchor="middle">معیار کی ضمانت</text><text class="body" x="460" y="323" text-anchor="middle">وسائل پر مرکوز معیارات</text><text class="body" x="170" y="323" text-anchor="middle">تصدیق اور جانچیں</text><rect class="panel-b" x="40" y="344" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="344" x2="600" y2="390"/><line class="grid" x1="320" y1="344" x2="320" y2="390"/><text class="body" x="670" y="372" text-anchor="middle">خواندگی</text><text class="body" x="460" y="372" text-anchor="middle">ایک ہدف کے طور پر مذکور</text><text class="body" x="170" y="372" text-anchor="middle">بالغ خواندگی کے پروگرام</text><rect class="panel-a" x="40" y="393" width="700" height="46" rx="4"/><line class="grid" x1="600" y1="393" x2="600" y2="439"/><line class="grid" x1="320" y1="393" x2="320" y2="439"/><text class="body" x="670" y="421" text-anchor="middle">اعلیٰ تعلیم</text><text class="body" x="460" y="421" text-anchor="middle">تفصیل محدود</text><text class="body" x="170" y="421" text-anchor="middle">محنت کی منڈی کی ضروریات سے جوڑنا</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
