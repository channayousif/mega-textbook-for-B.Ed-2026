<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of NEP 2009 and NEP 2017</title><desc id="d">A comparison table of NEP 2009 and NEP 2017 across seven dimensions: access, curriculum, teacher quality, governance, quality assurance, literacy and higher education.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect class="panel-a" x="40" y="52" width="700" height="42" rx="4"/><line class="grid" x1="200" y1="52" x2="200" y2="94"/><line class="grid" x1="470" y1="52" x2="470" y2="94"/><text class="sh" x="120.0" y="78" text-anchor="middle">Dimension</text><text class="sh" x="335.0" y="78" text-anchor="middle">NEP 2009</text><text class="sh" x="605.0" y="78" text-anchor="middle">NEP 2017</text></g><g id="node-access"><rect class="panel" x="40" y="97" width="700" height="46" rx="4"/><line class="grid" x1="200" y1="97" x2="200" y2="143"/><line class="grid" x1="470" y1="97" x2="470" y2="143"/><text class="body" x="120.0" y="125" text-anchor="middle">Access</text><text class="body" x="335.0" y="125" text-anchor="middle">Expand enrolment, free education</text><text class="body" x="605.0" y="116.5" text-anchor="middle">Equity focus, out-of-school</text><text class="body" x="605.0" y="133.5" text-anchor="middle">children</text></g><g id="node-curriculum"><rect class="panel" x="40" y="146" width="700" height="46" rx="4"/><line class="grid" x1="200" y1="146" x2="200" y2="192"/><line class="grid" x1="470" y1="146" x2="470" y2="192"/><text class="body" x="120.0" y="174" text-anchor="middle">Curriculum</text><text class="body" x="335.0" y="174" text-anchor="middle">Revise national curriculum</text><text class="body" x="605.0" y="174" text-anchor="middle">Less memorisation, more skills</text></g><g id="node-teacher-quality"><rect class="panel" x="40" y="195" width="700" height="46" rx="4"/><line class="grid" x1="200" y1="195" x2="200" y2="241"/><line class="grid" x1="470" y1="195" x2="470" y2="241"/><text class="body" x="120.0" y="223" text-anchor="middle">Teacher quality</text><text class="body" x="335.0" y="223" text-anchor="middle">In-service and pre-service training</text><text class="body" x="605.0" y="223" text-anchor="middle">Continued focus, accountability</text></g><g id="node-governance"><rect class="panel" x="40" y="244" width="700" height="46" rx="4"/><line class="grid" x1="200" y1="244" x2="200" y2="290"/><line class="grid" x1="470" y1="244" x2="470" y2="290"/><text class="body" x="120.0" y="272" text-anchor="middle">Governance</text><text class="body" x="335.0" y="272" text-anchor="middle">Devolution to provinces</text><text class="body" x="605.0" y="272" text-anchor="middle">Strengthen provincial capacity</text></g><g id="node-quality-assurance"><rect class="panel" x="40" y="293" width="700" height="46" rx="4"/><line class="grid" x1="200" y1="293" x2="200" y2="339"/><line class="grid" x1="470" y1="293" x2="470" y2="339"/><text class="body" x="120.0" y="321" text-anchor="middle">Quality assurance</text><text class="body" x="335.0" y="321" text-anchor="middle">Input-focused standards</text><text class="body" x="605.0" y="321" text-anchor="middle">Accreditation and assessments</text></g><g id="node-literacy"><rect class="panel" x="40" y="342" width="700" height="46" rx="4"/><line class="grid" x1="200" y1="342" x2="200" y2="388"/><line class="grid" x1="470" y1="342" x2="470" y2="388"/><text class="body" x="120.0" y="370" text-anchor="middle">Literacy</text><text class="body" x="335.0" y="370" text-anchor="middle">Mentioned as a goal</text><text class="body" x="605.0" y="370" text-anchor="middle">Adult literacy programmes</text></g><g id="node-higher-education"><rect class="panel" x="40" y="391" width="700" height="46" rx="4"/><line class="grid" x1="200" y1="391" x2="200" y2="437"/><line class="grid" x1="470" y1="391" x2="470" y2="437"/><text class="body" x="120.0" y="419" text-anchor="middle">Higher education</text><text class="body" x="335.0" y="419" text-anchor="middle">Limited detail</text><text class="body" x="605.0" y="419" text-anchor="middle">Link to labour market needs</text></g></g><g id="layer-labels"><text class="h" x="390" y="36" text-anchor="middle">Comparing NEP 2009 and NEP 2017</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
