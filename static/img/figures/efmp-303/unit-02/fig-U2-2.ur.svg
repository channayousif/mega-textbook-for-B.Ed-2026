<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کی ابتدائی تعلیمی پالیسیاں، 1947 تا 2000</title><desc id="d">ایک جدول جو 1947 سے 2000 تک کی ہر ابتدائی پالیسی کو سال، بنیادی توجہ اور اہم نتیجہ کے خانوں کے ساتھ درج کرتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">ابتدائی تعلیمی پالیسیاں: ایک نظر میں</text><rect class="panel" x="40" y="55" width="700" height="50" rx="4"/><line class="grid" x1="620" y1="55" x2="620" y2="105"/><line class="grid" x1="320" y1="55" x2="320" y2="105"/><text class="sh" x="680" y="85" text-anchor="middle">سال</text><text class="sh" x="470" y="85" text-anchor="middle">بنیادی توجہ</text><text class="sh" x="170" y="85" text-anchor="middle">اہم نتیجہ</text><rect class="panel-a" x="40" y="108" width="700" height="50" rx="4"/><line class="grid" x1="620" y1="108" x2="620" y2="158"/><line class="grid" x1="320" y1="108" x2="320" y2="158"/><text class="body" x="680" y="136" text-anchor="middle">1947</text><text class="body" x="470" y="136" text-anchor="middle">مفت ابتدائی تعلیم، اسلامی رجحان</text><text class="body" x="170" y="136" text-anchor="middle">اہداف طے ہوئے؛ پیروی محدود رہی</text><rect class="panel-b" x="40" y="161" width="700" height="50" rx="4"/><line class="grid" x1="620" y1="161" x2="620" y2="211"/><line class="grid" x1="320" y1="161" x2="320" y2="211"/><text class="body" x="680" y="189" text-anchor="middle">1959</text><text class="body" x="470" y="189" text-anchor="middle">درجاتی ڈھانچے کی اصلاح، سائنس پر زور</text><text class="body" x="170" y="189" text-anchor="middle">5 تا 3 تا 2 تا 2 کا ڈھانچہ اختیار ہوا</text><rect class="panel-a" x="40" y="214" width="700" height="50" rx="4"/><line class="grid" x1="620" y1="214" x2="620" y2="264"/><line class="grid" x1="320" y1="214" x2="320" y2="264"/><text class="body" x="680" y="242" text-anchor="middle">1970</text><text class="body" x="470" y="242" text-anchor="middle">بجٹ میں اضافہ، ہمہ گیر داخلے کا وعدہ</text><text class="body" x="170" y="242" text-anchor="middle">داخلہ آہستہ بڑھا</text><rect class="panel-c" x="40" y="267" width="700" height="50" rx="4"/><line class="grid" x1="620" y1="267" x2="620" y2="317"/><line class="grid" x1="320" y1="267" x2="320" y2="317"/><text class="body" x="680" y="295" text-anchor="middle">1972</text><text class="body" x="470" y="295" text-anchor="middle">نجی اسکولوں کی قومی ملکیت</text><text class="body" x="170" y="295" text-anchor="middle">رسائی بڑھی، معیار پر بوجھ</text><rect class="panel-a" x="40" y="320" width="700" height="50" rx="4"/><line class="grid" x1="620" y1="320" x2="620" y2="370"/><line class="grid" x1="320" y1="320" x2="320" y2="370"/><text class="body" x="680" y="348" text-anchor="middle">1979</text><text class="body" x="470" y="348" text-anchor="middle">نصاب اور درسی کتابوں کی اسلامی تشکیل</text><text class="body" x="170" y="348" text-anchor="middle">نئی درسی کتابیں اسکولوں تک پہنچیں</text><rect class="panel-b" x="40" y="373" width="700" height="50" rx="4"/><line class="grid" x1="620" y1="373" x2="620" y2="423"/><line class="grid" x1="320" y1="373" x2="320" y2="423"/><text class="body" x="680" y="401" text-anchor="middle">1992 اور 1998</text><text class="body" x="470" y="401" text-anchor="middle">معیار کی بہتری، خرچ کا ہدف 4 فیصد</text><text class="body" x="170" y="401" text-anchor="middle">خرچ کا ہدف پورا نہ ہوا</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
