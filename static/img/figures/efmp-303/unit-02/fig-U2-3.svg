<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">National Education Policy 2009 flowchart</title><desc id="d">A flowchart in three bands: NEP 2009 objectives (free and compulsory education, quality improvement, curriculum reform, teacher quality, governance devolution), the implementation strategies below them (curriculum revision, teacher training, devolution to provinces, public-private partnerships, increased spending), and the outcomes at the bottom (enrolment increase, Article 25-A added, quality gaps remain, spending target missed, uneven implementation).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect id="region-objectives" class="panel-a" x="30" y="42" width="720" height="104" rx="6"/><rect id="region-strategies" class="panel-b" x="30" y="180" width="720" height="104" rx="6"/><rect id="region-outcomes" class="panel-c" x="30" y="318" width="720" height="104" rx="6"/></g><g id="layer-edges"><line id="edge-objectives-strategies" class="stroke-a" x1="390" y1="146" x2="390" y2="180" marker-end="url(#arrow)"/><line id="edge-strategies-outcomes" class="stroke-a" x1="390" y1="284" x2="390" y2="318" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-obj-free-education"><rect class="panel" x="40" y="72" width="132" height="66" rx="8"/><text class="body" x="106" y="93" text-anchor="middle">Free and</text><text class="body" x="106" y="110" text-anchor="middle">compulsory</text><text class="body" x="106" y="127" text-anchor="middle">education</text></g><g id="node-obj-quality"><rect class="panel" x="182" y="72" width="132" height="66" rx="8"/><text class="body" x="248" y="101.5" text-anchor="middle">Quality</text><text class="body" x="248" y="118.5" text-anchor="middle">improvement</text></g><g id="node-obj-curriculum"><rect class="panel" x="324" y="72" width="132" height="66" rx="8"/><text class="body" x="390" y="101.5" text-anchor="middle">Curriculum</text><text class="body" x="390" y="118.5" text-anchor="middle">reform</text></g><g id="node-obj-teacher-quality"><rect class="panel" x="466" y="72" width="132" height="66" rx="8"/><text class="body" x="532" y="101.5" text-anchor="middle">Teacher</text><text class="body" x="532" y="118.5" text-anchor="middle">quality</text></g><g id="node-obj-governance"><rect class="panel" x="608" y="72" width="132" height="66" rx="8"/><text class="body" x="674" y="101.5" text-anchor="middle">Governance</text><text class="body" x="674" y="118.5" text-anchor="middle">devolution</text></g><g id="node-str-curriculum"><rect class="panel" x="40" y="210" width="132" height="66" rx="8"/><text class="body" x="106" y="239.5" text-anchor="middle">Curriculum</text><text class="body" x="106" y="256.5" text-anchor="middle">revision</text></g><g id="node-str-training"><rect class="panel" x="182" y="210" width="132" height="66" rx="8"/><text class="body" x="248" y="239.5" text-anchor="middle">Teacher</text><text class="body" x="248" y="256.5" text-anchor="middle">training</text></g><g id="node-str-devolution"><rect class="panel" x="324" y="210" width="132" height="66" rx="8"/><text class="body" x="390" y="239.5" text-anchor="middle">Devolution</text><text class="body" x="390" y="256.5" text-anchor="middle">to provinces</text></g><g id="node-str-partnerships"><rect class="panel" x="466" y="210" width="132" height="66" rx="8"/><text class="body" x="532" y="239.5" text-anchor="middle">Public-private</text><text class="body" x="532" y="256.5" text-anchor="middle">partnerships</text></g><g id="node-str-spending"><rect class="panel" x="608" y="210" width="132" height="66" rx="8"/><text class="body" x="674" y="239.5" text-anchor="middle">Increased</text><text class="body" x="674" y="256.5" text-anchor="middle">spending</text></g><g id="node-out-enrolment"><rect class="panel" x="40" y="348" width="132" height="66" rx="8"/><text class="body" x="106" y="377.5" text-anchor="middle">Enrolment</text><text class="body" x="106" y="394.5" text-anchor="middle">increase</text></g><g id="node-out-article-25a"><rect class="panel" x="182" y="348" width="132" height="66" rx="8"/><text class="body" x="248" y="377.5" text-anchor="middle">Article 25-A</text><text class="body" x="248" y="394.5" text-anchor="middle">added</text></g><g id="node-out-quality-gaps"><rect class="panel" x="324" y="348" width="132" height="66" rx="8"/><text class="body" x="390" y="377.5" text-anchor="middle">Quality</text><text class="body" x="390" y="394.5" text-anchor="middle">gaps remain</text></g><g id="node-out-spending"><rect class="panel" x="466" y="348" width="132" height="66" rx="8"/><text class="body" x="532" y="377.5" text-anchor="middle">Spending</text><text class="body" x="532" y="394.5" text-anchor="middle">target missed</text></g><g id="node-out-uneven"><rect class="panel" x="608" y="348" width="132" height="66" rx="8"/><text class="body" x="674" y="377.5" text-anchor="middle">Uneven</text><text class="body" x="674" y="394.5" text-anchor="middle">implementation</text></g></g><g id="layer-labels"><text class="h" x="390" y="30" text-anchor="middle">National Education Policy 2009: from plan to result</text><text class="sh" x="390" y="63" text-anchor="middle">OBJECTIVES</text><text class="sh" x="390" y="201" text-anchor="middle">IMPLEMENTATION STRATEGIES</text><text class="sh" x="390" y="339" text-anchor="middle">OUTCOMES</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
