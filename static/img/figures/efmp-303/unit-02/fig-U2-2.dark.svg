<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Early education policies of Pakistan 1947 to 2000</title><desc id="d">A table listing each early policy from 1947 to 2000 with columns for year, main focus and key outcome.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--a1);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><rect class="panel-a" x="40" y="56" width="700" height="44" rx="4"/><line class="grid" x1="170" y1="56" x2="170" y2="100"/><line class="grid" x1="470" y1="56" x2="470" y2="100"/><text class="sh" x="105.0" y="83" text-anchor="middle">Year</text><text class="sh" x="320.0" y="83" text-anchor="middle">Main focus</text><text class="sh" x="605.0" y="83" text-anchor="middle">Key outcome</text></g><g id="node-year-1947"><rect class="panel" x="40" y="103" width="700" height="52" rx="4"/><line class="grid" x1="170" y1="103" x2="170" y2="155"/><line class="grid" x1="470" y1="103" x2="470" y2="155"/><text class="body" x="105.0" y="134" text-anchor="middle">1947</text><text class="body" x="320.0" y="125.5" text-anchor="middle">Free primary education,</text><text class="body" x="320.0" y="142.5" text-anchor="middle">Islamic orientation</text><text class="body" x="605.0" y="125.5" text-anchor="middle">Goals set;</text><text class="body" x="605.0" y="142.5" text-anchor="middle">limited follow-through</text></g><g id="node-year-1959"><rect class="panel" x="40" y="158" width="700" height="52" rx="4"/><line class="grid" x1="170" y1="158" x2="170" y2="210"/><line class="grid" x1="470" y1="158" x2="470" y2="210"/><text class="body" x="105.0" y="189" text-anchor="middle">1959</text><text class="body" x="320.0" y="180.5" text-anchor="middle">Grade structure reform,</text><text class="body" x="320.0" y="197.5" text-anchor="middle">science emphasis</text><text class="body" x="605.0" y="189" text-anchor="middle">5-3-2-2 structure adopted</text></g><g id="node-year-1970"><rect class="panel" x="40" y="213" width="700" height="52" rx="4"/><line class="grid" x1="170" y1="213" x2="170" y2="265"/><line class="grid" x1="470" y1="213" x2="470" y2="265"/><text class="body" x="105.0" y="244" text-anchor="middle">1970</text><text class="body" x="320.0" y="235.5" text-anchor="middle">Budget increase,</text><text class="body" x="320.0" y="252.5" text-anchor="middle">universal enrolment pledge</text><text class="body" x="605.0" y="244" text-anchor="middle">Enrolment rose slowly</text></g><g id="node-year-1972"><rect class="panel" x="40" y="268" width="700" height="52" rx="4"/><line class="grid" x1="170" y1="268" x2="170" y2="320"/><line class="grid" x1="470" y1="268" x2="470" y2="320"/><text class="body" x="105.0" y="299" text-anchor="middle">1972</text><text class="body" x="320.0" y="299" text-anchor="middle">Nationalisation of private schools</text><text class="body" x="605.0" y="299" text-anchor="middle">Expanded access, strained quality</text></g><g id="node-year-1979"><rect class="panel" x="40" y="323" width="700" height="52" rx="4"/><line class="grid" x1="170" y1="323" x2="170" y2="375"/><line class="grid" x1="470" y1="323" x2="470" y2="375"/><text class="body" x="105.0" y="354" text-anchor="middle">1979</text><text class="body" x="320.0" y="354" text-anchor="middle">Islamization of curriculum and textbooks</text><text class="body" x="605.0" y="354" text-anchor="middle">New textbooks reached schools</text></g><g id="node-year-1992-1998"><rect class="panel" x="40" y="378" width="700" height="52" rx="4"/><line class="grid" x1="170" y1="378" x2="170" y2="430"/><line class="grid" x1="470" y1="378" x2="470" y2="430"/><text class="body" x="105.0" y="409" text-anchor="middle">1992 and 1998</text><text class="body" x="320.0" y="400.5" text-anchor="middle">Quality improvement,</text><text class="body" x="320.0" y="417.5" text-anchor="middle">spending target of 4%</text><text class="body" x="605.0" y="409" text-anchor="middle">Spending target missed</text></g></g><g id="layer-labels"><text class="h" x="390" y="36" text-anchor="middle">Early education policies at a glance</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
