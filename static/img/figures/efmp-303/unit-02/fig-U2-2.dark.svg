<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Early education policies of Pakistan 1947 to 2000</title><desc id="d">A table listing each early policy from 1947 to 2000 with columns for year, main focus and key outcome.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">Early education policies at a glance</text><rect class="panel" x="40" y="55" width="700" height="50" rx="4"/><line class="grid" x1="160" y1="55" x2="160" y2="105"/><line class="grid" x1="460" y1="55" x2="460" y2="105"/><text class="sh" x="100" y="85" text-anchor="middle">Year</text><text class="sh" x="310" y="85" text-anchor="middle">Main focus</text><text class="sh" x="610" y="85" text-anchor="middle">Key outcome</text><rect class="panel-a" x="40" y="108" width="700" height="50" rx="4"/><line class="grid" x1="160" y1="108" x2="160" y2="158"/><line class="grid" x1="460" y1="108" x2="460" y2="158"/><text class="body" x="100" y="136" text-anchor="middle">1947</text><text class="body" x="310" y="136" text-anchor="middle">Free primary education, Islamic orientation</text><text class="body" x="610" y="136" text-anchor="middle">Goals set; limited follow-through</text><rect class="panel-b" x="40" y="161" width="700" height="50" rx="4"/><line class="grid" x1="160" y1="161" x2="160" y2="211"/><line class="grid" x1="460" y1="161" x2="460" y2="211"/><text class="body" x="100" y="189" text-anchor="middle">1959</text><text class="body" x="310" y="189" text-anchor="middle">Grade structure reform, science emphasis</text><text class="body" x="610" y="189" text-anchor="middle">5-3-2-2 structure adopted</text><rect class="panel-a" x="40" y="214" width="700" height="50" rx="4"/><line class="grid" x1="160" y1="214" x2="160" y2="264"/><line class="grid" x1="460" y1="214" x2="460" y2="264"/><text class="body" x="100" y="242" text-anchor="middle">1970</text><text class="body" x="310" y="242" text-anchor="middle">Budget increase, universal enrolment pledge</text><text class="body" x="610" y="242" text-anchor="middle">Enrolment rose slowly</text><rect class="panel-c" x="40" y="267" width="700" height="50" rx="4"/><line class="grid" x1="160" y1="267" x2="160" y2="317"/><line class="grid" x1="460" y1="267" x2="460" y2="317"/><text class="body" x="100" y="295" text-anchor="middle">1972</text><text class="body" x="310" y="295" text-anchor="middle">Nationalisation of private schools</text><text class="body" x="610" y="295" text-anchor="middle">Expanded access, strained quality</text><rect class="panel-a" x="40" y="320" width="700" height="50" rx="4"/><line class="grid" x1="160" y1="320" x2="160" y2="370"/><line class="grid" x1="460" y1="320" x2="460" y2="370"/><text class="body" x="100" y="348" text-anchor="middle">1979</text><text class="body" x="310" y="348" text-anchor="middle">Islamization of curriculum and textbooks</text><text class="body" x="610" y="348" text-anchor="middle">New textbooks reached schools</text><rect class="panel-b" x="40" y="373" width="700" height="50" rx="4"/><line class="grid" x1="160" y1="373" x2="160" y2="423"/><line class="grid" x1="460" y1="373" x2="460" y2="423"/><text class="body" x="100" y="401" text-anchor="middle">1992 and 1998</text><text class="body" x="310" y="401" text-anchor="middle">Quality improvement, spending target of 4%</text><text class="body" x="610" y="401" text-anchor="middle">Spending target missed</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
