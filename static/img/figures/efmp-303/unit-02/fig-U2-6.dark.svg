<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of NEP 2009 and NEP 2017</title><desc id="d">A comparison table of NEP 2009 and NEP 2017 across key dimensions: access, curriculum, teacher quality, governance, quality assurance, literacy, higher education and technical education.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">Comparing NEP 2009 and NEP 2017</text><rect class="panel" x="40" y="50" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="50" x2="180" y2="96"/><line class="grid" x1="460" y1="50" x2="460" y2="96"/><text class="sh" x="110" y="78" text-anchor="middle">Dimension</text><text class="sh" x="320" y="78" text-anchor="middle">NEP 2009</text><text class="sh" x="610" y="78" text-anchor="middle">NEP 2017</text><rect class="panel-a" x="40" y="99" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="99" x2="180" y2="145"/><line class="grid" x1="460" y1="99" x2="460" y2="145"/><text class="body" x="110" y="127" text-anchor="middle">Access</text><text class="body" x="320" y="127" text-anchor="middle">Expand enrolment, free education</text><text class="body" x="610" y="127" text-anchor="middle">Equity focus, out-of-school children</text><rect class="panel-b" x="40" y="148" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="148" x2="180" y2="194"/><line class="grid" x1="460" y1="148" x2="460" y2="194"/><text class="body" x="110" y="176" text-anchor="middle">Curriculum</text><text class="body" x="320" y="176" text-anchor="middle">Revise national curriculum</text><text class="body" x="610" y="176" text-anchor="middle">Less memorisation, more skills</text><rect class="panel-a" x="40" y="197" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="197" x2="180" y2="243"/><line class="grid" x1="460" y1="197" x2="460" y2="243"/><text class="body" x="110" y="225" text-anchor="middle">Teacher quality</text><text class="body" x="320" y="225" text-anchor="middle">In-service and pre-service training</text><text class="body" x="610" y="225" text-anchor="middle">Continued focus, accountability</text><rect class="panel-c" x="40" y="246" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="246" x2="180" y2="292"/><line class="grid" x1="460" y1="246" x2="460" y2="292"/><text class="body" x="110" y="274" text-anchor="middle">Governance</text><text class="body" x="320" y="274" text-anchor="middle">Devolution to provinces</text><text class="body" x="610" y="274" text-anchor="middle">Strengthen provincial capacity</text><rect class="panel-a" x="40" y="295" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="295" x2="180" y2="341"/><line class="grid" x1="460" y1="295" x2="460" y2="341"/><text class="body" x="110" y="323" text-anchor="middle">Quality assurance</text><text class="body" x="320" y="323" text-anchor="middle">Input-focused standards</text><text class="body" x="610" y="323" text-anchor="middle">Accreditation and assessments</text><rect class="panel-b" x="40" y="344" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="344" x2="180" y2="390"/><line class="grid" x1="460" y1="344" x2="460" y2="390"/><text class="body" x="110" y="372" text-anchor="middle">Literacy</text><text class="body" x="320" y="372" text-anchor="middle">Mentioned as a goal</text><text class="body" x="610" y="372" text-anchor="middle">Adult literacy programmes</text><rect class="panel-a" x="40" y="393" width="700" height="46" rx="4"/><line class="grid" x1="180" y1="393" x2="180" y2="439"/><line class="grid" x1="460" y1="393" x2="460" y2="439"/><text class="body" x="110" y="421" text-anchor="middle">Higher education</text><text class="body" x="320" y="421" text-anchor="middle">Limited detail</text><text class="body" x="610" y="421" text-anchor="middle">Link to labour market needs</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
