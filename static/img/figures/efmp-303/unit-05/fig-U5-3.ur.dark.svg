<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم اور ترقی کا تصوراتی خاکہ</title><desc id="d">ایک تصوراتی خاکہ جس کے مرکز میں 'تعلیم' ہے، جس کی شاخیں انسانی سرمایہ (مہارتیں، علم، پیداواری صلاحیت)، سماجی ترقی (صحت، مساوات، شہری شرکت) اور معاشی ترقی (آمدنی، معاشی نمو، روزگار) کی طرف جاتی ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{font-size:14px;fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-education-human-capital" class="stroke-a" d="M450 210 L560 160"/><path id="edge-education-social" class="stroke-a" d="M330 210 L220 160"/><path id="edge-education-economic" class="stroke-a" d="M390 280 L390 360"/><path id="edge-human-capital-social" class="stroke-a" d="M500 120 L280 120" stroke-dasharray="6,4"/><path id="edge-human-capital-economic" class="stroke-a" d="M680 160 C680 300 630 400 520 400" stroke-dasharray="6,4"/><path id="edge-social-economic" class="stroke-a" d="M100 160 C100 300 150 400 260 400" stroke-dasharray="6,4"/></g><g id="layer-nodes"><g id="node-education"><ellipse class="panel-a" cx="390" cy="240" rx="90" ry="40"/><text class="h" x="390" y="246" text-anchor="middle">تعلیم</text></g><g id="node-human-capital"><rect class="panel-b" x="500" y="80" width="240" height="80" rx="8"/><text class="sh" x="620" y="114" text-anchor="middle">انسانی سرمایہ</text><text class="small" x="620" y="140" text-anchor="middle">‏مہارتیں، علم، پیداواری صلاحیت‏</text></g><g id="node-social"><rect class="panel-b" x="40" y="80" width="240" height="80" rx="8"/><text class="sh" x="160" y="114" text-anchor="middle">سماجی ترقی</text><text class="small" x="160" y="140" text-anchor="middle">‏صحت، مساوات، شہری شرکت‏</text></g><g id="node-economic"><rect class="panel-b" x="260" y="360" width="260" height="80" rx="8"/><text class="sh" x="390" y="394" text-anchor="middle">معاشی ترقی</text><text class="small" x="390" y="420" text-anchor="middle">‏آمدنی، نمو، روزگار‏</text></g></g><g id="layer-labels"><text class="h" x="390" y="34" text-anchor="middle">تعلیم اور ترقی</text><g id="label-interconnected"><text class="small" x="390" y="108" text-anchor="middle">باہم مربوط</text></g><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
