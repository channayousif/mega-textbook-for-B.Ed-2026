<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم، عدم مساوات اور رکاوٹوں کا خاکہ</title><desc id="d">ایک خاکہ جو یہ دکھاتا ہے کہ تعلیم عدم مساوات کو کیسے کم کرتی ہے: تعلیم سے بہتر مہارتیں پیدا ہوتی ہیں، جو بہتر روزگار کی طرف لے جاتی ہیں، جس سے غربت کم ہوتی ہے؛ لیکن فاصلہ، لاگت اور صنفی روایات جیسی رکاوٹیں اس راستے کو روک سکتی ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{font-size:14px;fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="390"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-ideal-education-ideal-skills" class="stroke-a" d="M656 110 L548 110" marker-end="url(#arrow)"/><path id="edge-ideal-skills-ideal-employment" class="stroke-a" d="M444 110 L336 110" marker-end="url(#arrow)"/><path id="edge-ideal-employment-ideal-poverty" class="stroke-a" d="M232 110 L124 110" marker-end="url(#arrow)"/><path id="edge-blocked-education-barrier-distance" class="stroke" d="M656 230 L640 230"/><path id="edge-barrier-distance-blocked-skills" class="stroke-a" d="M564 230 L548 230" marker-end="url(#arrow)"/><path id="edge-blocked-skills-barrier-cost" class="stroke" d="M444 230 L428 230"/><path id="edge-barrier-cost-blocked-employment" class="stroke-a" d="M352 230 L336 230" marker-end="url(#arrow)"/><path id="edge-blocked-employment-barrier-gender-norms" class="stroke" d="M232 230 L216 230"/><path id="edge-barrier-gender-norms-blocked-poverty" class="stroke" d="M140 230 L124 230" stroke-dasharray="6,4"/></g><g id="layer-nodes"><g id="node-ideal-education"><rect class="panel-a" x="656" y="80" width="104" height="60" rx="8"/><text class="sh" x="708" y="115" text-anchor="middle">تعلیم</text></g><g id="node-ideal-skills"><rect class="panel-a" x="444" y="80" width="104" height="60" rx="8"/><text class="sh" x="496" y="104" text-anchor="middle">بہتر</text><text class="sh" x="496" y="126" text-anchor="middle">مہارتیں</text></g><g id="node-ideal-employment"><rect class="panel-a" x="232" y="80" width="104" height="60" rx="8"/><text class="sh" x="284" y="104" text-anchor="middle">بہتر</text><text class="sh" x="284" y="126" text-anchor="middle">روزگار</text></g><g id="node-ideal-poverty"><rect class="panel-a" x="20" y="80" width="104" height="60" rx="8"/><text class="sh" x="72" y="104" text-anchor="middle">غربت میں</text><text class="sh" x="72" y="126" text-anchor="middle">کمی</text></g><g id="node-blocked-education"><rect class="panel-a" x="656" y="200" width="104" height="60" rx="8"/><text class="sh" x="708" y="235" text-anchor="middle">تعلیم</text></g><g id="node-blocked-skills"><rect class="panel-a" x="444" y="200" width="104" height="60" rx="8"/><text class="sh" x="496" y="224" text-anchor="middle">بہتر</text><text class="sh" x="496" y="246" text-anchor="middle">مہارتیں</text></g><g id="node-blocked-employment"><rect class="panel-a" x="232" y="200" width="104" height="60" rx="8"/><text class="sh" x="284" y="224" text-anchor="middle">بہتر</text><text class="sh" x="284" y="246" text-anchor="middle">روزگار</text></g><g id="node-blocked-poverty"><rect class="panel" x="20" y="200" width="104" height="60" rx="8" stroke-dasharray="6,4"/><text class="sh" x="72" y="224" text-anchor="middle">غربت میں</text><text class="sh" x="72" y="246" text-anchor="middle">کمی</text></g><g id="node-barrier-distance"><polygon class="panel-c" points="628,204 576,204 564,216 564,244 576,256 628,256 640,244 640,216"/><text class="sh" x="602" y="235" text-anchor="middle">فاصلہ</text></g><g id="node-barrier-cost"><polygon class="panel-c" points="416,204 364,204 352,216 352,244 364,256 416,256 428,244 428,216"/><text class="sh" x="390" y="235" text-anchor="middle">لاگت</text></g><g id="node-barrier-gender-norms"><polygon class="panel-c" points="204,204 152,204 140,216 140,244 152,256 204,256 216,244 216,216"/><text class="sh" x="178" y="224" text-anchor="middle">صنفی</text><text class="sh" x="178" y="246" text-anchor="middle">روایات</text></g></g><g id="layer-labels"><text class="h" x="390" y="32" text-anchor="middle">تعلیم اور عدم مساوات میں کمی</text><text class="small" x="390" y="62" text-anchor="middle">‏مثالی راستہ (رکاوٹوں کے بغیر)‏</text><text class="small" x="390" y="180" text-anchor="middle">‏مسدود راستہ (رکاوٹوں کے ساتھ)‏</text><g id="label-distance"><text class="small" x="602" y="286" text-anchor="middle">اسکول بہت دور ہے</text></g><g id="label-cost"><text class="small" x="390" y="286" text-anchor="middle">اخراجات زیادہ ہیں</text></g><g id="label-gender-norms"><text class="small" x="178" y="286" text-anchor="middle">لڑکیاں گھر پر</text></g><g id="label-legend-step"><rect class="panel-a" x="702" y="334" width="18" height="18" rx="3"/><text class="body" x="694" y="348" text-anchor="end">راستے کا مرحلہ</text></g><g id="label-legend-barrier"><polygon class="panel-c" points="495,334 487,334 482,339 482,347 487,352 495,352 500,347 500,339"/><text class="body" x="474" y="348" text-anchor="end">رکاوٹ جو عمل کو روک سکتی ہے</text></g><g id="label-legend-not-reached"><rect class="panel" x="202" y="334" width="18" height="18" rx="3" stroke-dasharray="6,4"/><text class="body" x="194" y="348" text-anchor="end">ہدف حاصل نہیں ہوا</text></g><text class="wm" x="12" y="380" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
