<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education, inequality and barriers diagram</title><desc id="d">A diagram showing how education reduces inequality: education leads to better skills, which lead to better employment, which reduces poverty; but barriers like distance, cost and gender norms can block this path.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="32" text-anchor="middle">Education and Inequality Reduction</text><text class="small" x="390" y="58" text-anchor="middle">Ideal pathway (without barriers)</text><rect class="panel-a" x="30" y="75" width="140" height="55" rx="8"/><text class="sh" x="100" y="108" text-anchor="middle">Education</text><line class="stroke-a" x1="170" y1="102" x2="220" y2="102" marker-end="url(#arrow)"/><rect class="panel-a" x="220" y="75" width="150" height="55" rx="8"/><text class="sh" x="295" y="108" text-anchor="middle">Better skills</text><line class="stroke-a" x1="370" y1="102" x2="430" y2="102" marker-end="url(#arrow)"/><rect class="panel-a" x="430" y="75" width="160" height="55" rx="8"/><text class="sh" x="510" y="108" text-anchor="middle">Better employment</text><line class="stroke-a" x1="590" y1="102" x2="640" y2="102" marker-end="url(#arrow)"/><rect class="panel-a" x="640" y="75" width="120" height="55" rx="8"/><text class="sh" x="700" y="108" text-anchor="middle">Reduced</text><text class="sh" x="700" y="124" text-anchor="middle">poverty</text><text class="small" x="390" y="178" text-anchor="middle">Blocked pathway (with barriers)</text><rect class="panel-b" x="30" y="200" width="140" height="55" rx="8"/><text class="sh" x="100" y="233" text-anchor="middle">Education</text><line class="stroke" x1="170" y1="227" x2="220" y2="227"/><rect class="panel-c" x="178" y="210" width="84" height="34" rx="6"/><text class="sh" x="220" y="232" text-anchor="middle">Distance</text><line class="stroke-a" x1="262" y1="227" x2="280" y2="227" marker-end="url(#arrow)"/><rect class="panel-b" x="280" y="200" width="150" height="55" rx="8"/><text class="sh" x="355" y="233" text-anchor="middle">Better skills</text><line class="stroke" x1="430" y1="227" x2="450" y2="227"/><rect class="panel-c" x="430" y="210" width="70" height="34" rx="6"/><text class="sh" x="465" y="232" text-anchor="middle">Cost</text><line class="stroke-a" x1="500" y1="227" x2="520" y2="227" marker-end="url(#arrow)"/><rect class="panel-b" x="520" y="200" width="160" height="55" rx="8"/><text class="sh" x="600" y="233" text-anchor="middle">Better employment</text><line class="stroke" x1="680" y1="227" x2="700" y2="227"/><rect class="panel-c" x="660" y="210" width="100" height="34" rx="6"/><text class="sh" x="710" y="232" text-anchor="middle">Gender norms</text><line class="stroke" x1="760" y1="227" x2="760" y2="280" stroke-dasharray="6,4"/><rect class="panel" x="640" y="280" width="120" height="55" rx="8" stroke-dasharray="6,4"/><text class="sh" x="700" y="308" text-anchor="middle">Reduced</text><text class="sh" x="700" y="324" text-anchor="middle">poverty</text><text class="small" x="220" y="265" text-anchor="middle">School too far</text><text class="small" x="465" y="265" text-anchor="middle">Fees too high</text><text class="small" x="710" y="265" text-anchor="middle">Girls kept home</text><rect class="panel-a" x="30" y="370" width="16" height="16" rx="3"/><text class="body" x="52" y="383">Step in the pathway</text><rect class="panel-c" x="220" y="370" width="16" height="16" rx="3"/><text class="body" x="242" y="383">Barrier that can block progress</text><rect class="panel" x="480" y="370" width="16" height="16" rx="3" stroke-dasharray="6,4"/><text class="body" x="502" y="383">Outcome not reached</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
