<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education, inequality and barriers diagram</title><desc id="d">A diagram showing how education reduces inequality: education leads to better skills, which lead to better employment, which reduces poverty; but barriers like distance, cost and gender norms can block this path.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{font-size:14px;fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="390"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-ideal-education-ideal-skills" class="stroke-a" d="M124,110 L232,110" marker-end="url(#arrow)"/><path id="edge-ideal-skills-ideal-employment" class="stroke-a" d="M336,110 L444,110" marker-end="url(#arrow)"/><path id="edge-ideal-employment-ideal-poverty" class="stroke-a" d="M548,110 L656,110" marker-end="url(#arrow)"/><path id="edge-blocked-education-barrier-distance" class="stroke" d="M124,230 L140,230"/><path id="edge-barrier-distance-blocked-skills" class="stroke-a" d="M216,230 L232,230" marker-end="url(#arrow)"/><path id="edge-blocked-skills-barrier-cost" class="stroke" d="M336,230 L352,230"/><path id="edge-barrier-cost-blocked-employment" class="stroke-a" d="M428,230 L444,230" marker-end="url(#arrow)"/><path id="edge-blocked-employment-barrier-gender-norms" class="stroke" d="M548,230 L564,230"/><path id="edge-barrier-gender-norms-blocked-poverty" class="stroke" d="M640,230 L656,230" stroke-dasharray="6,4"/></g><g id="layer-nodes"><g id="node-ideal-education"><rect class="panel-a" x="20" y="80" width="104" height="60" rx="8"/><text class="sh" x="72" y="115" text-anchor="middle">Education</text></g><g id="node-ideal-skills"><rect class="panel-a" x="232" y="80" width="104" height="60" rx="8"/><text class="sh" x="284" y="106" text-anchor="middle">Better</text><text class="sh" x="284" y="124" text-anchor="middle">skills</text></g><g id="node-ideal-employment"><rect class="panel-a" x="444" y="80" width="104" height="60" rx="8"/><text class="sh" x="496" y="106" text-anchor="middle">Better</text><text class="sh" x="496" y="124" text-anchor="middle">employment</text></g><g id="node-ideal-poverty"><rect class="panel-a" x="656" y="80" width="104" height="60" rx="8"/><text class="sh" x="708" y="106" text-anchor="middle">Reduced</text><text class="sh" x="708" y="124" text-anchor="middle">poverty</text></g><g id="node-blocked-education"><rect class="panel-a" x="20" y="200" width="104" height="60" rx="8"/><text class="sh" x="72" y="235" text-anchor="middle">Education</text></g><g id="node-blocked-skills"><rect class="panel-a" x="232" y="200" width="104" height="60" rx="8"/><text class="sh" x="284" y="226" text-anchor="middle">Better</text><text class="sh" x="284" y="244" text-anchor="middle">skills</text></g><g id="node-blocked-employment"><rect class="panel-a" x="444" y="200" width="104" height="60" rx="8"/><text class="sh" x="496" y="226" text-anchor="middle">Better</text><text class="sh" x="496" y="244" text-anchor="middle">employment</text></g><g id="node-blocked-poverty"><rect class="panel" x="656" y="200" width="104" height="60" rx="8" stroke-dasharray="6,4"/><text class="sh" x="708" y="226" text-anchor="middle">Reduced</text><text class="sh" x="708" y="244" text-anchor="middle">poverty</text></g><g id="node-barrier-distance"><polygon class="panel-c" points="152,204 204,204 216,216 216,244 204,256 152,256 140,244 140,216"/><text class="sh" x="178" y="235" text-anchor="middle">Distance</text></g><g id="node-barrier-cost"><polygon class="panel-c" points="364,204 416,204 428,216 428,244 416,256 364,256 352,244 352,216"/><text class="sh" x="390" y="235" text-anchor="middle">Cost</text></g><g id="node-barrier-gender-norms"><polygon class="panel-c" points="576,204 628,204 640,216 640,244 628,256 576,256 564,244 564,216"/><text class="sh" x="602" y="226" text-anchor="middle">Gender</text><text class="sh" x="602" y="244" text-anchor="middle">norms</text></g></g><g id="layer-labels"><text class="h" x="390" y="32" text-anchor="middle">Education and Inequality Reduction</text><text class="small" x="390" y="62" text-anchor="middle">Ideal pathway (without barriers)</text><text class="small" x="390" y="180" text-anchor="middle">Blocked pathway (with barriers)</text><g id="label-distance"><text class="small" x="178" y="286" text-anchor="middle">School too far</text></g><g id="label-cost"><text class="small" x="390" y="286" text-anchor="middle">Fees too high</text></g><g id="label-gender-norms"><text class="small" x="602" y="286" text-anchor="middle">Girls kept home</text></g><g id="label-legend-step"><rect class="panel-a" x="60" y="334" width="18" height="18" rx="3"/><text class="body" x="86" y="348">Step in the pathway</text></g><g id="label-legend-barrier"><polygon class="panel-c" points="285,334 293,334 298,339 298,347 293,352 285,352 280,347 280,339"/><text class="body" x="306" y="348">Barrier that can block progress</text></g><g id="label-legend-not-reached"><rect class="panel" x="560" y="334" width="18" height="18" rx="3" stroke-dasharray="6,4"/><text class="body" x="586" y="348">Outcome not reached</text></g><text class="wm" x="768" y="380" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
