<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم اور ترقی کا تصوراتی خاکہ</title><desc id="d">ایک تصوراتی خاکہ جس کے مرکز میں 'تعلیم' ہے، جس کی شاخیں انسانی سرمایہ (مہارتیں، علم، پیداواری صلاحیت)، سماجی ترقی (صحت، مساوات، شہری شرکت) اور معاشی ترقی (آمدنی، معاشی نمو، روزگار) کی طرف جاتی ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">تعلیم اور ترقی</text><ellipse class="panel-a" cx="390" cy="230" rx="90" ry="50"/><text class="h" x="390" y="236" text-anchor="middle">تعلیم</text><rect class="panel-b" x="520" y="70" width="200" height="70" rx="8"/><text class="sh" x="620" y="98" text-anchor="middle">انسانی سرمایہ</text><text class="small" x="620" y="118" text-anchor="middle">مہارتیں، علم، پیداواری صلاحیت</text><rect class="panel-c" x="50" y="70" width="210" height="70" rx="8"/><text class="sh" x="155" y="98" text-anchor="middle">سماجی ترقی</text><text class="small" x="155" y="118" text-anchor="middle">صحت، مساوات، شہری شرکت</text><rect class="panel-d" x="280" y="370" width="220" height="70" rx="8"/><text class="sh" x="390" y="398" text-anchor="middle">معاشی ترقی</text><text class="small" x="390" y="418" text-anchor="middle">آمدنی، نمو، روزگار</text><line class="stroke-a" x1="460" y1="200" x2="580" y2="140"/><line class="stroke-a" x1="320" y1="200" x2="200" y2="140"/><line class="stroke-a" x1="390" y1="280" x2="390" y2="370"/><line class="stroke-a" x1="260" y1="100" x2="520" y2="100"/><text class="small" x="390" y="92" text-anchor="middle">باہم مربوط</text><line class="stroke-a" x1="660" y1="140" x2="460" y2="370"/><line class="stroke-a" x1="120" y1="140" x2="320" y2="370"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
