<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معیار کی ضمانت کے چکر کا فلو چارٹ</title><desc id="d">معیار کی ضمانت کا چکر دکھانے والا ایک فلو چارٹ: معیارات کا تعین، اسکول کا خود جائزہ، بیرونی جائزہ، تاثرات اور بہتری کی منصوبہ بندی، اور پھر دوبارہ معیارات کی طرف واپسی۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{font-size:14px;fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="440"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-standards-self-evaluation" class="stroke-a" d="M280 90 C190 90 140 120 140 180" marker-end="url(#arrow)"/><path id="edge-self-evaluation-external-review" class="stroke-a" d="M140 260 C140 320 190 360 270 360" marker-end="url(#arrow)"/><path id="edge-external-review-feedback" class="stroke-a" d="M510 360 C590 360 640 320 640 260" marker-end="url(#arrow)"/><path id="edge-feedback-standards" class="stroke-a" d="M640 180 C640 120 590 90 500 90" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-standards"><rect class="panel-a" x="280" y="60" width="220" height="60" rx="8"/><text class="sh" x="390" y="95" text-anchor="middle">معیارات کا تعین</text></g><g id="node-self-evaluation"><rect class="panel-a" x="20" y="180" width="240" height="80" rx="8"/><text class="sh" x="140" y="213" text-anchor="middle">اسکول کا خود جائزہ</text><text class="small" x="140" y="237" text-anchor="middle">عملے کا اندرونی جائزہ</text></g><g id="node-external-review"><rect class="panel-a" x="270" y="320" width="240" height="80" rx="8"/><text class="sh" x="390" y="353" text-anchor="middle">بیرونی جائزہ</text><text class="small" x="390" y="377" text-anchor="middle">معائنہ یا ایکریڈیشن کا دورہ</text></g><g id="node-feedback"><rect class="panel-a" x="520" y="180" width="240" height="80" rx="8"/><text class="sh" x="640" y="213" text-anchor="middle">تاثرات اور بہتری</text><text class="small" x="640" y="237" text-anchor="middle">نتائج پر مبنی لائحہ عمل</text></g></g><g id="layer-labels"><text class="h" x="390" y="32" text-anchor="middle">معیار کی ضمانت کا چکر</text><g id="label-continuous"><text class="small" x="390" y="214" text-anchor="middle">مسلسل</text><text class="small" x="390" y="236" text-anchor="middle">بہتری</text></g><text class="wm" x="12" y="430" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
