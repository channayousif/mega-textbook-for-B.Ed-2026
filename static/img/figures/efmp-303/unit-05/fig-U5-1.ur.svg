<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معیار کی ضمانت کے چکر کا فلو چارٹ</title><desc id="d">معیار کی ضمانت کا چکر دکھانے والا ایک فلو چارٹ: معیارات کا تعین، اسکول کا خود جائزہ، بیرونی جائزہ، تاثرات اور بہتری کی منصوبہ بندی، اور پھر دوبارہ معیارات کی طرف واپسی۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="36" text-anchor="middle">معیار کی ضمانت کا چکر</text><rect class="panel-a" x="270" y="60" width="240" height="60" rx="8"/><text class="sh" x="390" y="96" text-anchor="middle">معیارات کا تعین</text><line class="stroke-a" x1="270" y1="90" x2="140" y2="130" marker-end="url(#arrow)"/><rect class="panel-b" x="20" y="130" width="200" height="60" rx="8"/><text class="sh" x="120" y="155" text-anchor="middle">اسکول کا خود جائزہ</text><text class="small" x="120" y="173" text-anchor="middle">عملے کا اندرونی جائزہ</text><line class="stroke-a" x1="120" y1="190" x2="120" y2="270" marker-end="url(#arrow)"/><rect class="panel-c" x="20" y="270" width="200" height="60" rx="8"/><text class="sh" x="120" y="295" text-anchor="middle">بیرونی جائزہ</text><text class="small" x="120" y="313" text-anchor="middle">معائنہ یا ایکریڈیشن کا دورہ</text><line class="stroke-a" x1="220" y1="300" x2="540" y2="300" marker-end="url(#arrow)"/><rect class="panel-d" x="540" y="270" width="220" height="60" rx="8"/><text class="sh" x="650" y="295" text-anchor="middle">تاثرات اور بہتری</text><text class="small" x="650" y="313" text-anchor="middle">نتائج پر مبنی لائحہ عمل</text><path class="stroke-a" d="M 650,270 C 650,160 510,120 510,90" marker-end="url(#arrow)"/><text class="small" x="700" y="180" text-anchor="middle">مسلسل</text><text class="small" x="700" y="198" text-anchor="middle">بہتری</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
