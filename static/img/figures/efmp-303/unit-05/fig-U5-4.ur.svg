<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم، عدم مساوات اور رکاوٹوں کا خاکہ</title><desc id="d">ایک خاکہ جو یہ دکھاتا ہے کہ تعلیم عدم مساوات کو کیسے کم کرتی ہے: تعلیم سے بہتر مہارتیں پیدا ہوتی ہیں، جو بہتر روزگار کی طرف لے جاتی ہیں، جس سے غربت کم ہوتی ہے؛ لیکن فاصلہ، لاگت اور صنفی روایات جیسی رکاوٹیں اس راستے کو روک سکتی ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="32" text-anchor="middle">تعلیم اور عدم مساوات میں کمی</text><text class="small" x="390" y="58" text-anchor="middle">مثالی راستہ (رکاوٹوں کے بغیر)</text><rect class="panel-a" x="610" y="75" width="140" height="55" rx="8"/><text class="sh" x="680" y="108" text-anchor="middle">تعلیم</text><line class="stroke-a" x1="610" y1="102" x2="560" y2="102" marker-end="url(#arrow)"/><rect class="panel-a" x="410" y="75" width="150" height="55" rx="8"/><text class="sh" x="485" y="108" text-anchor="middle">بہتر مہارتیں</text><line class="stroke-a" x1="410" y1="102" x2="350" y2="102" marker-end="url(#arrow)"/><rect class="panel-a" x="190" y="75" width="160" height="55" rx="8"/><text class="sh" x="270" y="108" text-anchor="middle">بہتر روزگار</text><line class="stroke-a" x1="190" y1="102" x2="140" y2="102" marker-end="url(#arrow)"/><rect class="panel-a" x="20" y="75" width="120" height="55" rx="8"/><text class="sh" x="80" y="108" text-anchor="middle">غربت میں کمی</text><text class="small" x="390" y="178" text-anchor="middle">مسدود راستہ (رکاوٹوں کے ساتھ)</text><rect class="panel-b" x="610" y="200" width="140" height="55" rx="8"/><text class="sh" x="680" y="233" text-anchor="middle">تعلیم</text><line class="stroke" x1="610" y1="227" x2="560" y2="227"/><rect class="panel-c" x="518" y="210" width="84" height="34" rx="6"/><text class="sh" x="560" y="232" text-anchor="middle">فاصلہ</text><line class="stroke-a" x1="518" y1="227" x2="500" y2="227" marker-end="url(#arrow)"/><rect class="panel-b" x="350" y="200" width="150" height="55" rx="8"/><text class="sh" x="425" y="233" text-anchor="middle">بہتر مہارتیں</text><line class="stroke" x1="350" y1="227" x2="330" y2="227"/><rect class="panel-c" x="280" y="210" width="70" height="34" rx="6"/><text class="sh" x="315" y="232" text-anchor="middle">لاگت</text><line class="stroke-a" x1="280" y1="227" x2="260" y2="227" marker-end="url(#arrow)"/><rect class="panel-b" x="100" y="200" width="160" height="55" rx="8"/><text class="sh" x="180" y="233" text-anchor="middle">بہتر روزگار</text><line class="stroke" x1="100" y1="227" x2="80" y2="227"/><rect class="panel-c" x="20" y="210" width="100" height="34" rx="6"/><text class="s