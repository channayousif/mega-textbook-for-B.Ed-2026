<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education and development concept map</title><desc id="d">A concept map placing Education at the centre, branching to human capital (skills, knowledge, productivity), social development (health, equity, civic participation), and economic development (income, growth, employment).</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Education and Development</text><ellipse class="panel-a" cx="390" cy="230" rx="90" ry="50"/><text class="h" x="390" y="236" text-anchor="middle">Education</text><rect class="panel-b" x="60" y="70" width="200" height="70" rx="8"/><text class="sh" x="160" y="98" text-anchor="middle">Human Capital</text><text class="small" x="160" y="118" text-anchor="middle">skills, knowledge, productivity</text><rect class="panel-c" x="520" y="70" width="210" height="70" rx="8"/><text class="sh" x="625" y="98" text-anchor="middle">Social Development</text><text class="small" x="625" y="118" text-anchor="middle">health, equity, civic participation</text><rect class="panel-d" x="280" y="370" width="220" height="70" rx="8"/><text class="sh" x="390" y="398" text-anchor="middle">Economic Development</text><text class="small" x="390" y="418" text-anchor="middle">income, growth, employment</text><line class="stroke-a" x1="320" y1="200" x2="200" y2="140"/><line class="stroke-a" x1="460" y1="200" x2="580" y2="140"/><line class="stroke-a" x1="390" y1="280" x2="390" y2="370"/><line class="stroke-a" x1="260" y1="100" x2="520" y2="100"/><text class="small" x="390" y="92" text-anchor="middle">interconnected</text><line class="stroke-a" x1="120" y1="140" x2="320" y2="370"/><line class="stroke-a" x1="680" y1="140" x2="480" y2="370"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
