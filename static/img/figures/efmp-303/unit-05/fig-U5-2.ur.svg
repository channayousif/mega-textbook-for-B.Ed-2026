<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معیار کی ضمانت کے طریقہ ہائے کار کا موازنہ</title><desc id="d">معیار کی ضمانت کے چار طریقہ ہائے کار (ایکریڈیشن، معائنہ، معیاری جانچ، استاد کا جائزہ) کا موازنہ کرنے والا ایک جدول، جس میں یہ دکھایا گیا ہے کہ ہر طریقہ کیا ناپتا ہے اور اسے کون انجام دیتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">پاکستان میں معیار کی ضمانت کے طریقہ ہائے کار</text><rect class="panel-a" x="600" y="55" width="160" height="50"/><text class="sh" x="680" y="85" text-anchor="middle">طریقہ کار</text><rect class="panel-a" x="410" y="55" width="190" height="50"/><text class="sh" x="505" y="85" text-anchor="middle">یہ کیا ناپتا ہے</text><rect class="panel-a" x="230" y="55" width="180" height="50"/><text class="sh" x="320" y="85" text-anchor="middle">یہ کون کرتا ہے</text><rect class="panel-a" x="20" y="55" width="210" height="50"/><text class="sh" x="125" y="85" text-anchor="middle">مثال</text><rect class="panel" x="600" y="105" width="160" height="80"/><text class="sh" x="680" y="135" text-anchor="middle">ایکریڈیشن</text><text class="small" x="680" y="155" text-anchor="middle">(ادارہ جاتی</text><text class="small" x="680" y="171" text-anchor="middle">معیارات)</text><rect class="panel" x="410" y="105" width="190" height="80"/><text class="body" x="505" y="138" text-anchor="middle">متعین معیارات کے مطابق</text><text class="body" x="505" y="156" text-anchor="middle">ادارہ جاتی معیار</text><text class="small" x="505" y="174" text-anchor="middle">عمارتیں، عملہ، نصاب</text><rect class="panel" x="230" y="105" width="180" height="80"/><text class="body" x="320" y="140" text-anchor="middle">نیکٹے (NACTE) /</text><text class="body" x="320" y="158" text-anchor="middle">ایچ ای سی (HEC)</text><rect class="panel" x="20" y="105" width="210" height="80"/><text class="body" x="125" y="140" text-anchor="middle">بی ایڈ پروگرام کی</text><text class="body" x="125" y="158" text-anchor="middle">ایکریڈیشن (نیکٹے)</text><rect class="panel" x="600" y="185" width="160" height="80"/><text class="sh" x="680" y="215" text-anchor="middle">اسکول معائنہ</text><text class="small" x="680" y="235" text-anchor="middle">(حالت اور ضابطوں</text><text class="small" x="680" y="251" text-anchor="middle">کی پابندی)</text><rect class="panel" x="410" y="185" width="190" height="80"/><text class="body" x="505" y="220" text-anchor="middle">جسمانی حالت، داخلہ،</text><text class="body" x="505" y="238" text-anchor="middle">رجسٹر اور ضوابط</text><rect class="panel" x="230" y="185" width="180" height="80"/><text class="body" x="320" y="220" text-anchor="middle">ڈسٹرکٹ ایجوکیشن</text><text class="body" x="320" y="238" text-anchor="middle">آفیسر</text><rect class="panel" x="20" y="185" width="210" height="80"/><text class="body" x="125" y="220" text-anchor="middle">سالانہ اسکول</text><text class="body" x="125" y="238" text-anchor="middle">معائنہ کا دورہ</text><rect class="panel" x="600" y="265" width="160" height="80"/><text class="sh" x="680" y="295" text-anchor="middle">معیاری</text><text class="sh" x="680" y="313" text-anchor="middle">جانچ (ٹیسٹنگ)</text><rect class="panel" x="410" y="265" width="190" height="80"/><text class="body" x="505" y="300" text-anchor="middle">طلبہ کے نتائج ہائے</text><text class="body" x="505" y="318" text-anchor="middle">تعلم</text><rect class="panel" x="230" y="265" width="180" height="80"/><text class="body" x="320" y="300" text-anchor="middle">امتحانی بورڈ</text><rect class="panel" x="20" y="265" width="210" height="80"/><text class="body" x="125" y="300" text-anchor="middle">پانچویں یا آٹھویں جماعت</text><text class="body" x="125" y="318" text-anchor="middle">کے امتحانی نتائج</text><rect class="panel" x="600" y="345" width="160" height="80"/><text class="sh" x="680" y="375" text-anchor="middle">استاد کی کارکردگی</text><text class="sh" x="680" y="393" text-anchor="middle">کا جائزہ</text><rect class="panel" x="410" y="345" width="190" height="80"/><text class="body" x="505" y="380" text-anchor="middle">استاد کی کارکردگی</text><text class="body" x="505" y="398" text-anchor="middle">اور تدریسی عمل</text><rect class="panel" x="230" y="345" width="180" height="80"/><text class="body" x="320" y="380" text-anchor="middle">اسکول ہیڈ یا</text><text class="body" x="320" y="398" text-anchor="middle">سپروائزر</text><rect class="panel" x="20" y="345" width="210" height="80"/><text class="body" x="125" y="380" text-anchor="middle">کمرہ جماعت کا مشاہدہ</text><text class="body" x="125" y="398" text-anchor="middle">اور تاثرات</text><line class="grid" x1="20" y1="105" x2="760" y2="105"/><line class="grid" x1="20" y1="185" x2="760" y2="185"/><line class="grid" x1="20" y1="265" x2="760" y2="265"/><line class="grid" x1="20" y1="345" x2="760" y2="345"/><line class="grid" x1="230" y1="55" x2="230" y2="425"/><line class="grid" x1="410" y1="55" x2="410" y2="425"/><line class="grid" x1="600" y1="55" x2="600" y2="425"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
