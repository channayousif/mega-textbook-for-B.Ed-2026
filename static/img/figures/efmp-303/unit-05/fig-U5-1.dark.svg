<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Quality assurance cycle flowchart</title><desc id="d">A flowchart showing the quality assurance cycle: standards set, school self-evaluation, external review, feedback and improvement planning, then back to standards.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{font-size:14px;fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="440"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><path id="edge-standards-self-evaluation" class="stroke-a" d="M500,90 C590,90 640,120 640,180" marker-end="url(#arrow)"/><path id="edge-self-evaluation-external-review" class="stroke-a" d="M640,260 C640,320 590,360 510,360" marker-end="url(#arrow)"/><path id="edge-external-review-feedback" class="stroke-a" d="M270,360 C190,360 140,320 140,260" marker-end="url(#arrow)"/><path id="edge-feedback-standards" class="stroke-a" d="M140,180 C140,120 190,90 280,90" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-standards"><rect class="panel-a" x="280" y="60" width="220" height="60" rx="8"/><text class="sh" x="390" y="95" text-anchor="middle">Standards set</text></g><g id="node-self-evaluation"><rect class="panel-a" x="520" y="180" width="240" height="80" rx="8"/><text class="sh" x="640" y="216" text-anchor="middle">School self-evaluation</text><text class="small" x="640" y="234" text-anchor="middle">Internal review by staff</text></g><g id="node-external-review"><rect class="panel-a" x="270" y="320" width="240" height="80" rx="8"/><text class="sh" x="390" y="356" text-anchor="middle">External review</text><text class="small" x="390" y="374" text-anchor="middle">Inspection or accreditation visit</text></g><g id="node-feedback"><rect class="panel-a" x="20" y="180" width="240" height="80" rx="8"/><text class="sh" x="140" y="216" text-anchor="middle">Feedback and improvement</text><text class="small" x="140" y="234" text-anchor="middle">Action plan based on findings</text></g></g><g id="layer-labels"><text class="h" x="390" y="32" text-anchor="middle">Quality Assurance Cycle</text><g id="label-continuous"><text class="small" x="390" y="214" text-anchor="middle">Continuous</text><text class="small" x="390" y="232" text-anchor="middle">improvement</text></g><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
