<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Quality assurance cycle flowchart</title><desc id="d">A flowchart showing the quality assurance cycle: standards set, school self-evaluation, external review, feedback and improvement planning, then back to standards.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="36" text-anchor="middle">Quality Assurance Cycle</text><rect class="panel-a" x="270" y="60" width="240" height="60" rx="8"/><text class="sh" x="390" y="96" text-anchor="middle">Standards set</text><line class="stroke-a" x1="510" y1="90" x2="640" y2="130" marker-end="url(#arrow)"/><rect class="panel-b" x="560" y="130" width="200" height="60" rx="8"/><text class="sh" x="660" y="156" text-anchor="middle">School self-evaluation</text><text class="small" x="660" y="174" text-anchor="middle">Internal review by staff</text><line class="stroke-a" x1="660" y1="190" x2="660" y2="270" marker-end="url(#arrow)"/><rect class="panel-c" x="560" y="270" width="200" height="60" rx="8"/><text class="sh" x="660" y="296" text-anchor="middle">External review</text><text class="small" x="660" y="314" text-anchor="middle">Inspection or accreditation visit</text><line class="stroke-a" x1="560" y1="300" x2="200" y2="300" marker-end="url(#arrow)"/><rect class="panel-d" x="20" y="270" width="220" height="60" rx="8"/><text class="sh" x="130" y="296" text-anchor="middle">Feedback and improvement</text><text class="small" x="130" y="314" text-anchor="middle">Action plan based on findings</text><path class="stroke-a" d="M 130,270 C 130,160 270,120 270,90" marker-end="url(#arrow)"/><text class="small" x="80" y="180" text-anchor="middle">Continuous</text><text class="small" x="80" y="196" text-anchor="middle">improvement</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
