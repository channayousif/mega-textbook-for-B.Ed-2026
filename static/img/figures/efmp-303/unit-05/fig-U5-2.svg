<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Quality assurance mechanisms comparison table</title><desc id="d">A table comparing four quality assurance mechanisms (accreditation, inspection, standardized testing, teacher appraisal) with what each measures and who conducts it.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{font-size:14px;fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-mechanism"><rect class="panel-a" x="20" y="55" width="160" height="50"/><text class="sh" x="100" y="85" text-anchor="middle">Mechanism</text></g><g id="node-head-measures"><rect class="panel-a" x="180" y="55" width="200" height="50"/><text class="sh" x="280" y="85" text-anchor="middle">What it measures</text></g><g id="node-head-conductor"><rect class="panel-a" x="380" y="55" width="180" height="50"/><text class="sh" x="470" y="85" text-anchor="middle">Who conducts it</text></g><g id="node-head-example"><rect class="panel-a" x="560" y="55" width="200" height="50"/><text class="sh" x="660" y="85" text-anchor="middle">Example</text></g><g id="node-accreditation-mechanism"><rect class="panel" x="20" y="105" width="160" height="90"/><text class="sh" x="100" y="137" text-anchor="middle">Accreditation</text><text class="small" x="100" y="155" text-anchor="middle">(institutional</text><text class="small" x="100" y="173" text-anchor="middle">standards)</text></g><g id="node-accreditation-measures"><rect class="panel" x="180" y="105" width="200" height="90"/><text class="body" x="280" y="137" text-anchor="middle">Institutional quality</text><text class="body" x="280" y="155" text-anchor="middle">against defined standards</text><text class="small" x="280" y="173" text-anchor="middle">buildings, staff, curriculum</text></g><g id="node-accreditation-conductor"><rect class="panel" x="380" y="105" width="180" height="90"/><text class="body" x="470" y="146" text-anchor="middle">NACTE (programmes);</text><text class="body" x="470" y="164" text-anchor="middle">HEC (framework)</text></g><g id="node-accreditation-example"><rect class="panel" x="560" y="105" width="200" height="90"/><text class="body" x="660" y="146" text-anchor="middle">B.Ed. programme</text><text class="body" x="660" y="164" text-anchor="middle">accreditation (NACTE)</text></g><g id="node-inspection-mechanism"><rect class="panel" x="20" y="195" width="160" height="80"/><text class="sh" x="100" y="222" text-anchor="middle">Inspection</text><text class="small" x="100" y="240" text-anchor="middle">(school conditions</text><text class="small" x="100" y="258" text-anchor="middle">and compliance)</text></g><g id="node-inspection-measures"><rect class="panel" x="180" y="195" width="200" height="80"/><text class="body" x="280" y="231" text-anchor="middle">Physical conditions,</text><text class="body" x="280" y="249" text-anchor="middle">enrolment, compliance</text></g><g id="node-inspection-conductor"><rect class="panel" x="380" y="195" width="180" height="80"/><text class="body" x="470" y="231" text-anchor="middle">District education</text><text class="body" x="470" y="249" text-anchor="middle">officer</text></g><g id="node-inspection-example"><rect class="panel" x="560" y="195" width="200" height="80"/><text class="body" x="660" y="231" text-anchor="middle">Annual school</text><text class="body" x="660" y="249" text-anchor="middle">inspection visit</text></g><g id="node-testing-mechanism"><rect class="panel" x="20" y="275" width="160" height="80"/><text class="sh" x="100" y="311" text-anchor="middle">Standardized</text><text class="sh" x="100" y="329" text-anchor="middle">testing</text></g><g id="node-testing-measures"><rect class="panel" x="180" y="275" width="200" height="80"/><text class="body" x="280" y="311" text-anchor="middle">Student learning</text><text class="body" x="280" y="329" text-anchor="middle">outcomes</text></g><g id="node-testing-conductor"><rect class="panel" x="380" y="275" width="180" height="80"/><text class="body" x="470" y="320" text-anchor="middle">Examination board</text></g><g id="node-testing-example"><rect class="panel" x="560" y="275" width="200" height="80"/><text class="body" x="660" y="311" text-anchor="middle">Grade 5 or Grade 8</text><text class="body" x="660" y="329" text-anchor="middle">examination results</text></g><g id="node-appraisal-mechanism"><rect class="panel" x="20" y="355" width="160" height="80"/><text class="sh" x="100" y="391" text-anchor="middle">Teacher</text><text class="sh" x="100" y="409" text-anchor="middle">appraisal</text></g><g id="node-appraisal-measures"><rect class="panel" x="180" y="355" width="200" height="80"/><text class="body" x="280" y="391" text-anchor="middle">Teacher performance</text><text class="body" x="280" y="409" text-anchor="middle">and practice</text></g><g id="node-appraisal-conductor"><rect class="panel" x="380" y="355" width="180" height="80"/><text class="body" x="470" y="391" text-anchor="middle">School head or</text><text class="body" x="470" y="409" text-anchor="middle">supervisor</text></g><g id="node-appraisal-example"><rect class="panel" x="560" y="355" width="200" height="80"/><text class="body" x="660" y="391" text-anchor="middle">Classroom observation</text><text class="body" x="660" y="409" text-anchor="middle">and feedback</text></g></g><g id="layer-labels"><text class="h" x="390" y="34" text-anchor="middle">Quality Assurance Mechanisms in Pakistan</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
