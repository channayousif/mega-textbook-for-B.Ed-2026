<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Quality assurance mechanisms comparison table</title><desc id="d">A table comparing four quality assurance mechanisms (accreditation, inspection, standardized testing, teacher appraisal) with what each measures and who conducts it.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">Quality Assurance Mechanisms in Pakistan</text><rect class="panel-a" x="20" y="55" width="160" height="50"/><text class="sh" x="100" y="85" text-anchor="middle">Mechanism</text><rect class="panel-a" x="180" y="55" width="190" height="50"/><text class="sh" x="275" y="85" text-anchor="middle">What it measures</text><rect class="panel-a" x="370" y="55" width="180" height="50"/><text class="sh" x="460" y="85" text-anchor="middle">Who conducts it</text><rect class="panel-a" x="550" y="55" width="210" height="50"/><text class="sh" x="655" y="85" text-anchor="middle">Example</text><rect class="panel" x="20" y="105" width="160" height="80"/><text class="sh" x="100" y="135" text-anchor="middle">Accreditation</text><text class="small" x="100" y="155" text-anchor="middle">(institutional</text><text class="small" x="100" y="171" text-anchor="middle">standards)</text><rect class="panel" x="180" y="105" width="190" height="80"/><text class="body" x="275" y="140" text-anchor="middle">Institutional quality</text><text class="body" x="275" y="158" text-anchor="middle">against defined standards</text><text class="small" x="275" y="176" text-anchor="middle">buildings, staff, curriculum</text><rect class="panel" x="370" y="105" width="180" height="80"/><text class="body" x="460" y="140" text-anchor="middle">HEC or provincial</text><text class="body" x="460" y="158" text-anchor="middle">accreditation body</text><rect class="panel" x="550" y="105" width="210" height="80"/><text class="body" x="655" y="140" text-anchor="middle">Teacher education</text><text class="body" x="655" y="158" text-anchor="middle">programme accreditation</text><rect class="panel" x="20" y="185" width="160" height="80"/><text class="sh" x="100" y="215" text-anchor="middle">Inspection</text><text class="small" x="100" y="235" text-anchor="middle">(school conditions</text><text class="small" x="100" y="251" text-anchor="middle">and compliance)</text><rect class="panel" x="180" y="185" width="190" height="80"/><text class="body" x="275" y="220" text-anchor="middle">Physical conditions,</text><text class="body" x="275" y="238" text-anchor="middle">enrolment, compliance</text><rect class="panel" x="370" y="185" width="180" height="80"/><text class="body" x="460" y="220" text-anchor="middle">District education</text><text class="body" x="460" y="238" text-anchor="middle">officer</text><rect class="panel" x="550" y="185" width="210" height="80"/><text class="body" x="655" y="220" text-anchor="middle">Annual school</text><text class="body" x="655" y="238" text-anchor="middle">inspection visit</text><rect class="panel" x="20" y="265" width="160" height="80"/><text class="sh" x="100" y="295" text-anchor="middle">Standardized</text><text class="sh" x="100" y="313" text-anchor="middle">testing</text><rect class="panel" x="180" y="265" width="190" height="80"/><text class="body" x="275" y="300" text-anchor="middle">Student learning</text><text class="body" x="275" y="318" text-anchor="middle">outcomes</text><rect class="panel" x="370" y="265" width="180" height="80"/><text class="body" x="460" y="300" text-anchor="middle">Examination board</text><rect class="panel" x="550" y="265" width="210" height="80"/><text class="body" x="655" y="300" text-anchor="middle">Grade 5 or Grade 8</text><text class="body" x="655" y="318" text-anchor="middle">examination results</text><rect class="panel" x="20" y="345" width="160" height="80"/><text class="sh" x="100" y="375" text-anchor="middle">Teacher</text><text class="sh" x="100" y="393" text-anchor="middle">appraisal</text><rect class="panel" x="180" y="345" width="190" height="80"/><text class="body" x="275" y="380" text-anchor="middle">Teacher performance</text><text class="body" x="275" y="398" text-anchor="middle">and practice</text><rect class="panel" x="370" y="345" width="180" height="80"/><text class="body" x="460" y="380" text-anchor="middle">School head or</text><text class="body" x="460" y="398" text-anchor="middle">supervisor</text><rect class="panel" x="550" y="345" width="210" height="80"/><text class="body" x="655" y="380" text-anchor="middle">Classroom observation</text><text class="body" x="655" y="398" text-anchor="middle">and feedback</text><line class="grid" x1="20" y1="105" x2="760" y2="105"/><line class="grid" x1="20" y1="185" x2="760" y2="185"/><line class="grid" x1="20" y1="265" x2="760" y2="265"/><line class="grid" x1="20" y1="345" x2="760" y2="345"/><line class="grid" x1="180" y1="55" x2="180" y2="425"/><line class="grid" x1="370" y1="55" x2="370" y2="425"/><line class="grid" x1="550" y1="55" x2="550" y2="425"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
