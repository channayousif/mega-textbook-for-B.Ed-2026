<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education and development concept map</title><desc id="d">A concept map placing 'Education' at the centre, branching to human capital (skills, knowledge, productivity), social development (health, equity, civic participation), and economic development (income, growth, employment).</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{font-size:14px;fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-education-human-capital" class="stroke-a" d="M330,210 L220,160"/><path id="edge-education-social" class="stroke-a" d="M450,210 L560,160"/><path id="edge-education-economic" class="stroke-a" d="M390,280 L390,360"/><path id="edge-human-capital-social" class="stroke-a" d="M280,120 L500,120" stroke-dasharray="6,4"/><path id="edge-human-capital-economic" class="stroke-a" d="M100,160 C100,300 150,400 260,400" stroke-dasharray="6,4"/><path id="edge-social-economic" class="stroke-a" d="M680,160 C680,300 630,400 520,400" stroke-dasharray="6,4"/></g><g id="layer-nodes"><g id="node-education"><ellipse class="panel-a" cx="390" cy="240" rx="90" ry="40"/><text class="h" x="390" y="246" text-anchor="middle">Education</text></g><g id="node-human-capital"><rect class="panel-b" x="40" y="80" width="240" height="80" rx="8"/><text class="sh" x="160" y="114" text-anchor="middle">Human Capital</text><text class="small" x="160" y="140" text-anchor="middle">skills, knowledge, productivity</text></g><g id="node-social"><rect class="panel-b" x="500" y="80" width="240" height="80" rx="8"/><text class="sh" x="620" y="114" text-anchor="middle">Social Development</text><text class="small" x="620" y="140" text-anchor="middle">health, equity, civic participation</text></g><g id="node-economic"><rect class="panel-b" x="260" y="360" width="260" height="80" rx="8"/><text class="sh" x="390" y="394" text-anchor="middle">Economic Development</text><text class="small" x="390" y="420" text-anchor="middle">income, growth, employment</text></g></g><g id="layer-labels"><text class="h" x="390" y="34" text-anchor="middle">Education and Development</text><g id="label-interconnected"><text class="small" x="390" y="108" text-anchor="middle">interconnected</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
