<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معیار اور انصاف کے لیے تزویراتی منصوبہ بندی</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں معیار اور انصاف کے لیے تزویراتی منصوبہ بندی ہے۔ اس کی شاخیں شہادت پر مبنی اہداف، شمولیتی ڈیزائن، مقامی ملکیت، وسائل کی ہم آہنگی، نگرانی اور فیڈبیک کے چکر دکھاتی ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle" transform="translate(780 0) scale(-1 1)">معیار اور انصاف کے لیے تزویراتی منصوبہ بندی</text><text class="small" x="390" y="50" text-anchor="middle" transform="translate(780 0) scale(-1 1)">مربوط منصوبہ بندی کے چھ باہم مربوط عناصر</text><ellipse class="panel-a" cx="390" cy="230" rx="120" ry="50"/><text class="sh" x="390" y="224" text-anchor="middle" transform="translate(780 0) scale(-1 1)">تزویراتی منصوبہ بندی</text><text class="sh" x="390" y="242" text-anchor="middle" transform="translate(780 0) scale(-1 1)">معیار اور انصاف کے لیے</text><rect class="panel-b" x="310" y="70" width="160" height="50" rx="8"/><text class="sh" x="390" y="92" text-anchor="middle" transform="translate(780 0) scale(-1 1)">شواہد پر مبنی</text><text class="sh" x="390" y="108" text-anchor="middle" transform="translate(780 0) scale(-1 1)">اہداف</text><line class="stroke-a" x1="390" y1="120" x2="390" y2="180"/><rect class="panel-c" x="580" y="130" width="160" height="50" rx="8"/><text class="sh" x="660" y="152" text-anchor="middle" transform="translate(1320 0) scale(-1 1)">شمولیتی</text><text class="sh" x="660" y="168" text-anchor="middle" transform="translate(1320 0) scale(-1 1)">ڈیزائن</text><line class="stroke-a" x1="580" y1="155" x2="510" y2="215"/><rect class="panel-d" x="580" y="290" width="160" height="50" rx="8"/><text class="sh" x="660" y="312" text-anchor="middle" transform="translate(1320 0) scale(-1 1)">مقامی</text><text class="sh" x="660" y="328" text-anchor="middle" transform="translate(1320 0) scale(-1 1)">ملکیت</text><line class="stroke-a" x1="580" y1="315" x2="510" y2="255"/><rect class="panel-b" x="310" y="360" width="160" height="50" rx="8"/><text class="sh" x="390" y="382" text-anchor="middle" transform="translate(780 0) scale(-1 1)">وسائل کی</text><text class="sh" x="390" y="398" text-anchor="middle" transform="translate(780 0) scale(-1 1)">ہم آہنگی</text><line class="stroke-a" x1="390" y1="360" x2="390" y2="280"/><rect class="panel-c" x="40" y="290" width="160" height="50" rx="8"/><text class="sh" x="120" y="312" text-anchor="middle" transform="translate(240 0) scale(-1 1)">نگرانی</text><text class="small" x="120" y="330" text-anchor="middle" transform="translate(240 0) scale(-1 1)">(پیش رفت دیکھیں)</text><line class="stroke-a" x1="200" y1="315" x2="270" y2="255"/><rect class="panel-d" x="40" y="130" width="160" height="50" rx="8"/><text class="sh" x="120" y="152" text-anchor="middle" transform="translate(240 0) scale(-1 1)">آرا کے</text><text class="sh" x="120" y="168" text-anchor="middle" transform="translate(240 0) scale(-1 1)">چکر</text><line class="stroke-a" x1="200" y1="155" x2="270" y2="215"/><line class="stroke-a" x1="470" y1="95" x2="580" y2="145" stroke-dasharray="4 3"/><line class="stroke-a" x1="660" y1="180" x2="660" y2="290" stroke-dasharray="4 3"/><line class="stroke-a" x1="580" y1="325" x2="470" y2="375" stroke-dasharray="4 3"/><line class="stroke-a" x1="310" y1="375" x2="200" y2="325" stroke-dasharray="4 3"/><line class="stroke-a" x1="120" y1="290" x2="120" y2="180" stroke-dasharray="4 3"/><line class="stroke-a" x1="200" y1="145" x2="310" y2="95" stroke-dasharray="4 3"/><text class="small" x="390" y="445" text-anchor="middle" transform="translate(780 0) scale(-1 1)">ہر عنصر دوسروں پر منحصر ہے: وسائل کے بغیر اہداف بے معنی ہیں؛ نگرانی کے بغیر وسائل ضائع ہوتے ہیں۔</text><text class="wm" x="768" y="460" text-anchor="start" aria-hidden="true" transform="translate(1536 0) scale(-1 1)">textbook.com.pk</text></g></svg>
