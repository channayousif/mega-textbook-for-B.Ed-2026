<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Innovations in education policy: timeline 2000 to 2030</title><desc id="d">A timeline showing innovations in education policy from 2000 to 2030: community schools movement, EMIS introduction, SDG adoption, data-driven planning, AI-assisted diagnostics, and local policy co-design.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Innovations in Education Policy</text><text class="small" x="390" y="50" text-anchor="middle">Key milestones from 2000 to 2030</text><line class="stroke" x1="60" y1="230" x2="720" y2="230"/><path class="ah" d="M 714 224 L 722 230 L 714 236 Z" fill="var(--ink)"/><text class="small" x="60" y="260" text-anchor="middle">2000</text><text class="small" x="170" y="260" text-anchor="middle">2005</text><text class="small" x="280" y="260" text-anchor="middle">2015</text><text class="small" x="390" y="260" text-anchor="middle">2018</text><text class="small" x="500" y="260" text-anchor="middle">2025</text><text class="small" x="610" y="260" text-anchor="middle">2030</text><circle class="panel-a" cx="60" cy="230" r="10"/><rect class="panel-a" x="15" y="120" width="140" height="55" rx="8"/><text class="sh" x="85" y="142" text-anchor="middle">Community</text><text class="sh" x="85" y="158" text-anchor="middle">schools movement</text><text class="small" x="85" y="172" text-anchor="middle">Grassroots access</text><line class="stroke-a" x1="60" y1="175" x2="60" y2="220"/><circle class="panel-b" cx="170" cy="230" r="10"/><rect class="panel-b" x="115" y="290" width="140" height="55" rx="8"/><text class="sh" x="185" y="312" text-anchor="middle">EMIS</text><text class="sh" x="185" y="328" text-anchor="middle">introduction</text><text class="small" x="185" y="342" text-anchor="middle">Digital data systems</text><line class="stroke-a" x1="170" y1="290" x2="170" y2="240"/><circle class="panel-c" cx="280" cy="230" r="10"/><rect class="panel-c" x="225" y="120" width="140" height="55" rx="8"/><text class="sh" x="295" y="142" text-anchor="middle">SDG</text><text class="sh" x="295" y="158" text-anchor="middle">adoption</text><text class="small" x="295" y="172" text-anchor="middle">Global education goals</text><line class="stroke-a" x1="280" y1="175" x2="280" y2="220"/><circle class="panel-d" cx="390" cy="230" r="10"/><rect class="panel-d" x="335" y="290" width="140" height="55" rx="8"/><text class="sh" x="405" y="312" text-anchor="middle">Data-driven</text><text class="sh" x="405" y="328" text-anchor="middle">planning</text><text class="small" x="405" y="342" text-anchor="middle">Evidence-based targets</text><line class="stroke-a" x1="390" y1="290" x2="390" y2="240"/><circle class="panel-a" cx="500" cy="230" r="10"/><rect class="panel-a" x=