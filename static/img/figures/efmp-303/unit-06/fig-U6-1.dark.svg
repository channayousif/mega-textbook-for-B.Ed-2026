<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education indicators: Pakistan compared with Bangladesh, Sri Lanka and Nepal</title><desc id="d">A table comparing Pakistan with Bangladesh, Sri Lanka and Nepal on literacy rate, primary enrolment, girls' enrolment, pupil-teacher ratio and education spending as a share of GDP.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="36" text-anchor="middle">Education Indicators: Regional Comparison</text><text class="small" x="390" y="56" text-anchor="middle">Selected developing countries in South Asia</text><rect class="panel-a" x="30" y="72" width="150" height="48"/><rect class="panel-b" x="180" y="72" width="150" height="48"/><rect class="panel-c" x="330" y="72" width="150" height="48"/><rect class="panel-d" x="480" y="72" width="150" height="48"/><rect class="panel" x="630" y="72" width="120" height="48"/><text class="sh" x="105" y="96" text-anchor="middle">Indicator</text><text class="sh" x="255" y="96" text-anchor="middle">Pakistan</text><text class="sh" x="405" y="96" text-anchor="middle">Bangladesh</text><text class="sh" x="555" y="96" text-anchor="middle">Sri Lanka</text><text class="sh" x="690" y="96" text-anchor="middle">Nepal</text><rect class="panel" x="30" y="120" width="150" height="52"/><rect class="bg" x="180" y="120" width="150" height="52"/><rect class="bg" x="330" y="120" width="150" height="52"/><rect class="bg" x="480" y="120" width="150" height="52"/><rect class="bg" x="630" y="120" width="120" height="52"/><text class="body" x="42" y="148">Literacy rate</text><text class="body" x="255" y="148" text-anchor="middle">60%</text><text class="body" x="405" y="148" text-anchor="middle">74%</text><text class="body" x="555" y="148" text-anchor="middle">92%</text><text class="body" x="690" y="148" text-anchor="middle">68%</text><rect class="panel" x="30" y="172" width="150" height="52"/><rect class="bg" x="180" y="172" width="150" height="52"/><rect class="bg" x="330" y="172" width="150" height="52"/><rect class="bg" x="480" y="172" width="150" height="52"/><rect class="bg" x="630" y="172" width="120" height="52"/><text class="body" x="42" y="200">Primary enrolment</text><text class="body" x="255" y="200" text-anchor="middle">74%</text><text class="body" x="405" y="200" text-anchor="middle">98%</text><text class="body" x="555" y="200" text-anchor="middle">99%</text><text class="body" x="690" y="200" text-anchor="middle">94%</text><rect class="panel" x="30" y="224" width="150" height="52"/><rect class="bg" x="180" y="224" width="150" height="52"/><rect class="bg" x="330" y="224" width="150" height="52"/><rect class="bg" x="480" y="224" width="150" height="52"/><rect class="bg" x="630" y="224" width="120" height="52"/><text class="body" x="42" y="252">Girls' enrolment</text><text class="body" x="255" y="252" text-anchor="middle">65%</text><text class="body" x="405" y="252" text-anchor="middle">99%</text><text class="body" x="555" y="252" text-anchor="middle">98%</text><text class="body" x="690" y="252" text-anchor="middle">90%</text><rect class="panel" x="30" y="276" width="150" height="52"/><rect class="bg" x="180" y="276" width="150" height="52"/><rect class="bg" x="330" y="276" width="150" height="52"/><rect class="bg" x="480" y="276" width="150" height="52"/><rect class="bg" x="630" y="276" width="120" height="52"/><text class="body" x="42" y="304">Pupil-teacher ratio</text><text class="body" x="255" y="304" text-anchor="middle">44:1</text><text class="body" x="405" y="304" text-anchor="middle">30:1</text><text class="body" x="555" y="304" text-anchor="middle">18:1</text><text class="body" x="690" y="304" text-anchor="middle">28:1</text><rect class="panel" x="30" y="328" width="150" height="52"/><rect class="bg" x="180" y="328" width="150" height="52"/><rect class="bg" x="330" y="328" width="150" height="52"/><rect class="bg" x="480" y="328" width="150" height="52"/><rect class="bg" x="630" y="328" width="120" height="52"/><text class="body" x="42" y="356">Education spending</text><text class="small" x="42" y="370">(% of GDP)</text><text class="body" x="255" y="356" text-anchor="middle">2.7%</text><text class="body" x="405" y="356" text-anchor="middle">2.1%</text><text class="body" x="555" y="356" text-anchor="middle">3.1%</text><text class="body" x="690" y="356" text-anchor="middle">4.2%</text><line class="grid" x1="30" y1="120" x2="750" y2="120"/><line class="grid" x1="30" y1="172" x2="750" y2="172"/><line class="grid" x1="30" y1="224" x2="750" y2="224"/><line class="grid" x1="30" y1="276" x2="750" y2="276"/><line class="grid" x1="30" y1="328" x2="750" y2="328"/><line class="grid" x1="180" y1="72" x2="180" y2="380"/><line class="grid" x1="330" y1="72" x2="330" y2="380"/><line class="grid" x1="480" y1="72" x2="