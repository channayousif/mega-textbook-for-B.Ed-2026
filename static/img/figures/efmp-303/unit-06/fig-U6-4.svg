<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The data-driven planning cycle</title><desc id="d">A flowchart showing the data-driven planning cycle: collect data, clean and organise, analyse patterns, set targets, allocate resources, implement, monitor, and feedback to collection.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The Data-Driven Planning Cycle</text><text class="small" x="390" y="50" text-anchor="middle">Eight stages that repeat as evidence improves</text><rect class="panel-a" x="30" y="70" width="155" height="55" rx="8"/><text class="sh" x="107" y="94" text-anchor="middle">1. Collect</text><text class="sh" x="107" y="110" text-anchor="middle">data</text><rect class="panel-b" x="215" y="70" width="155" height="55" rx="8"/><text class="sh" x="292" y="94" text-anchor="middle">2. Clean and</text><text class="sh" x="292" y="110" text-anchor="middle">organise</text><rect class="panel-c" x="400" y="70" width="155" height="55" rx="8"/><text class="sh" x="477" y="94" text-anchor="middle">3. Analyse</text><text class="sh" x="477" y="110" text-anchor="middle">patterns</text><rect class="panel-d" x="585" y="70" width="165" height="55" rx="8"/><text class="sh" x="667" y="94" text-anchor="middle">4. Set</text><text class="sh" x="667" y="110" text-anchor="middle">targets</text><rect class="panel-d" x="585" y="320" width="165" height="55" rx="8"/><text class="sh" x="667" y="344" text-anchor="middle">5. Allocate</text><text class="sh" x="667" y="360" text-anchor="middle">resources</text><rect class="panel-c" x="400" y="320" width="155" height="55" rx="8"/><text class="sh" x="477" y="344" text-anchor="middle">6. Implement</text><text class="small" x="477" y="366" text-anchor="middle">(action)</text><rect class="panel-b" x="215" y="320" width="155" height="55" rx="8"/><text class="sh" x="292" y="344" text-anchor="middle">7. Monitor</text><text class="small" x="292" y="366" text-anchor="middle">(track progress)</text><rect class="panel-a" x="30" y="320" width="155" height="55" rx="8"/><text class="sh" x="107" y="344" text-anchor="middle">8. Feedback</text><text class="small" x="107" y="366" text-anchor="middle">(to collection)</text><line class="stroke-a" x1="185" y1="97" x2="215" y2="97" marker-end="url(#arrow)"/><line class="stroke-a" x1="370" y1="97" x2="400" y2="97" marker-end="url(#arrow)"/><line class="stroke-a" x1="555" y1="97" x2="585" y2="97" marker-end="url(#arrow)"/><line class="stroke-a" x1="667" y1="125" x2="667" y2="320" marker-end="url(#arrow)"/><line class="stroke-a" x1="585" y1="347" x2="555" y2="347" marker-end="url(#arrow)"/><line class="stroke-a" x2="400" y1="347" x2="370" y2="347" marker-end="url(#arrow)"/><line class="stroke-a" x1="215" y1="347" x2="185" y2="347" marker-end="url(#arrow)"/><line class="stroke-a" x1="107" y1="320" x2="107" y2="125" marker-end="url(#arrow)"/><text class="small" x="390" y="210" text-anchor="middle">Evidence-based</text><text class="small" x="390" y="226" text-anchor="middle">continuous improvement</text><path class="stroke-a" d="M 350 180 A 40 40 0 1 1 350 260" fill="none"/><path class="ah" d="M 344 254 L 350 262 L 356 254" fill="var(--ink)"/><text class="small" x="390" y="420" text-anchor="middle">Source: National Education Policy 2017; Khan (2018)</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
