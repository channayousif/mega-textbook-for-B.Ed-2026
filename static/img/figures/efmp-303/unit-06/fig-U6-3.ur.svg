<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی انتظام میں ICT</title><desc id="d">ایک خاکہ جو ICT کو مرکز میں دکھاتا ہے جس کی پانچ تعلیمی انتظام کے کاموں سے رابطہ ہے: داخلے کی نشاندہی، اساتذہ کی تعیناتی، بجٹ کی تقسیم، نگرانی و جائزہ، اور پالیسی کا فیڈبیک۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle" transform="translate(780 0) scale(-1 1)">تعلیمی انتظام میں ICT</text><text class="small" x="390" y="50" text-anchor="middle" transform="translate(780 0) scale(-1 1)">معلوماتی و مواصلاتی ٹیکنالوجی سے معاونت پانے والے پانچ انتظامی کام</text><ellipse class="panel-a" cx="390" cy="230" rx="100" ry="48"/><text class="sh" x="390" y="224" text-anchor="middle" transform="translate(780 0) scale(-1 1)">تعلیمی</text><text class="sh" x="390" y="242" text-anchor="middle" transform="translate(780 0) scale(-1 1)">انتظام میں</text><text class="sh" x="390" y="260" text-anchor="middle" transform="translate(780 0) scale(-1 1)">ICT</text><rect class="panel-b" x="305" y="70" width="170" height="50" rx="8"/><text class="sh" x="390" y="92" text-anchor="middle" transform="translate(780 0) scale(-1 1)">داخلے کی</text><text class="sh" x="390" y="108" text-anchor="middle" transform="translate(780 0) scale(-1 1)">نگرانی</text><rect x="440" y="74" width="6" height="14" class="ah"/><rect x="449" y="80" width="6" height="8" class="ah"/><rect x="458" y="76" width="6" height="12" class="ah"/><line class="stroke-a" x1="390" y1="120" x2="390" y2="182"/><rect class="panel-c" x="600" y="130" width="160" height="50" rx="8"/><text class="sh" x="680" y="152" text-anchor="middle" transform="translate(1360 0) scale(-1 1)">اساتذہ کی</text><text class="sh" x="680" y="168" text-anchor="middle" transform="translate(1360 0) scale(-1 1)">تعیناتی</text><circle cx="740" cy="138" r="5" class="ah"/><rect x="735" y="144" width="10" height="8" class="ah"/><line class="stroke-a" x1="600" y1="155" x2="490" y2="215"/><rect class="panel-d" x="600" y="300" width="160" height="50" rx="8"/><text class="sh" x="680" y="322" text-anchor="middle" transform="translate(1360 0) scale(-1 1)">بجٹ کی</text><text class="sh" x="680" y="338" text-anchor="middle" transform="translate(1360 0) scale(-1 1)">تقسیم</text><rect x="732" y="306" width="14" height="6" class="ah"/><rect x="732" y="314" width="14" height="6" class="ah"/><line class="stroke-a" x1="600" y1="325" x2="490" y2="260"/><rect class="panel-b" x="20" y="300" width="160" height="50" rx="8"/><text class="sh" x="100" y="322" text-anchor="middle" transform="translate(200 0) scale(-1 1)">نگرانی اور</text><text class="sh" x="100" y="338" text-anchor="middle" transform="translate(200 0) scale(-1 1)">جائزہ</text><circle cx="160" cy="310" r="5" class="stroke-a"/><line class="stroke-a" x1="164" y1="314" x2="170" y2="320"/><line class="stroke-a" x1="180" y1="325" x2="290" y2="260"/><rect class="panel-c" x="20" y="130" width="160" height="50" rx="8"/><text class="sh" x="100" y="152" text-anchor="middle" transform="translate(200 0) scale(-1 1)">پالیسی پر</text><text class="sh" x="100" y="168" text-anchor="middle" transform="translate(200 0) scale(-1 1)">آرا</text><path class="stroke-a" d="M 155 138 A 8 8 0 1 1 155 154"/><path class="ah" d="M 149 150 L 155 156 L 161 150" fill="var(--ink)"/><line class="stroke-a" x1="180" y1="155" x2="290" y2="215"/><text class="small" x="390" y="420" text-anchor="middle" transform="translate(780 0) scale(-1 1)">ماخذ: Khan (2018)؛ قومی تعلیمی پالیسی 2017</text><text class="wm" x="768" y="460" text-anchor="start" aria-hidden="true" transform="translate(1536 0) scale(-1 1)">textbook.com.pk</text></g></svg>
