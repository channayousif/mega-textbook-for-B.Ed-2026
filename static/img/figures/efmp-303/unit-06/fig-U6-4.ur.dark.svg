<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ڈیٹا پر مبنی منصوبہ بندی کا چکر</title><desc id="d">ایک بہاؤ کا نقشہ جو ڈیٹا پر مبنی منصوبہ بندی کا چکر دکھاتا ہے: اعداد و شمار جمع کرنا، صاف اور منظم کرنا، رجحانات کا تجزیہ کرنا، اہداف طے کرنا، وسائل مختص کرنا، نفاذ، نگرانی، اور فیڈبیک کے ذریعے دوبارہ اعداد و شمار جمع کرنے کی طرف لوٹنا۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><g transform="translate(780 0) scale(-1 1)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle" transform="translate(780 0) scale(-1 1)">ڈیٹا پر مبنی منصوبہ بندی کا چکر</text><text class="small" x="390" y="50" text-anchor="middle" transform="translate(780 0) scale(-1 1)">شواہد بہتر ہونے کے ساتھ دہرائے جانے والے آٹھ مراحل</text><rect class="panel-a" x="30" y="70" width="155" height="55" rx="8"/><text class="sh" x="107" y="94" text-anchor="middle" transform="translate(214 0) scale(-1 1)">1. ڈیٹا</text><text class="sh" x="107" y="110" text-anchor="middle" transform="translate(214 0) scale(-1 1)">جمع کریں</text><rect class="panel-b" x="215" y="70" width="155" height="55" rx="8"/><text class="sh" x="292" y="94" text-anchor="middle" transform="translate(584 0) scale(-1 1)">2. صاف اور</text><text class="sh" x="292" y="110" text-anchor="middle" transform="translate(584 0) scale(-1 1)">منظم کریں</text><rect class="panel-c" x="400" y="70" width="155" height="55" rx="8"/><text class="sh" x="477" y="94" text-anchor="middle" transform="translate(954 0) scale(-1 1)">3. رجحانات کا</text><text class="sh" x="477" y="110" text-anchor="middle" transform="translate(954 0) scale(-1 1)">تجزیہ کریں</text><rect class="panel-d" x="585" y="70" width="165" height="55" rx="8"/><text class="sh" x="667" y="94" text-anchor="middle" transform="translate(1334 0) scale(-1 1)">4. اہداف</text><text class="sh" x="667" y="110" text-anchor="middle" transform="translate(1334 0) scale(-1 1)">مقرر کریں</text><rect class="panel-d" x="585" y="320" width="165" height="55" rx="8"/><text class="sh" x="667" y="344" text-anchor="middle" transform="translate(1334 0) scale(-1 1)">5. وسائل</text><text class="sh" x="667" y="360" text-anchor="middle" transform="translate(1334 0) scale(-1 1)">مختص کریں</text><rect class="panel-c" x="400" y="320" width="155" height="55" rx="8"/><text class="sh" x="477" y="344" text-anchor="middle" transform="translate(954 0) scale(-1 1)">6. نفاذ</text><text class="small" x="477" y="366" text-anchor="middle" transform="translate(954 0) scale(-1 1)">(عمل کریں)</text><rect class="panel-b" x="215" y="320" width="155" height="55" rx="8"/><text class="sh" x="292" y="344" text-anchor="middle" transform="translate(584 0) scale(-1 1)">7. نگرانی</text><text class="small" x="292" y="366" text-anchor="middle" transform="translate(584 0) scale(-1 1)">(پیش رفت دیکھیں)</text><rect class="panel-a" x="30" y="320" width="155" height="55" rx="8"/><text class="sh" x="107" y="344" text-anchor="middle" transform="translate(214 0) scale(-1 1)">8. آرا</text><text class="small" x="107" y="366" text-anchor="middle" transform="translate(214 0) scale(-1 1)">(واپس جمع کرنا)</text><line class="stroke-a" x1="185" y1="97" x2="215" y2="97" marker-end="url(#arrow)"/><line class="stroke-a" x1="370" y1="97" x2="400" y2="97" marker-end="url(#arrow)"/><line class="stroke-a" x1="555" y1="97" x2="585" y2="97" marker-end="url(#arrow)"/><line class="stroke-a" x1="667" y1="125" x2="667" y2="320" marker-end="url(#arrow)"/><line class="stroke-a" x1="585" y1="347" x2="555" y2="347" marker-end="url(#arrow)"/><line class="stroke-a" x2="400" y1="347" x2="370" y2="347" marker-end="url(#arrow)"/><line class="stroke-a" x1="215" y1="347" x2="185" y2="347" marker-end="url(#arrow)"/><line class="stroke-a" x1="107" y1="320" x2="107" y2="125" marker-end="url(#arrow)"/><text class="small" x="390" y="210" text-anchor="middle" transform="translate(780 0) scale(-1 1)">شواہد پر مبنی</text><text class="small" x="390" y="226" text-anchor="middle" transform="translate(780 0) scale(-1 1)">مسلسل بہتری</text><path class="stroke-a" d="M 350 180 A 40 40 0 1 1 350 260" fill="none"/><path class="ah" d="M 344 254 L 350 262 L 356 254" fill="var(--ink)"/><text class="small" x="390" y="420" text-anchor="middle" transform="translate(780 0) scale(-1 1)">ماخذ: قومی تعلیمی پالیسی 2017؛ Khan (2018)</text><text class="wm" x="768" y="460" text-anchor="start" aria-hidden="true" transform="translate(1536 0) scale(-1 1)">textbook.com.pk</text></g></svg>
