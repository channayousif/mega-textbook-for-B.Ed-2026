<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">SDG4: معیاری تعلیم</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں SDG4 ہے۔ اس کی شاخیں سات منتخب اہداف (4.1، 4.2، 4.4، 4.5، 4.6، 4.7، 4.c) دکھاتی ہیں، جن میں سے ہر ایک پاکستان کی قومی تعلیمی پالیسی کے ڈھانچے کے متعلقہ عنصر سے جڑا ہے۔ اہداف 4.3، 4.a اور 4.b نہیں دکھائے گئے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="390" y="32" text-anchor="middle">SDG4: معیاری تعلیم</text><text class="small" x="390" y="50" text-anchor="middle">SDG4 کے منتخب اہداف اور پاکستان کی قومی تعلیمی پالیسی 2017</text><ellipse class="panel-a" cx="390" cy="230" rx="110" ry="50"/><text class="sh" x="390" y="226" text-anchor="middle">SDG4:</text><text class="sh" x="390" y="244" text-anchor="middle">معیاری تعلیم</text><rect class="panel-b" x="30" y="70" width="190" height="40" rx="6"/><text class="body" x="208" y="88" text-anchor="end">ہدف 4.2: ابتدائی</text><text class="body" x="208" y="102" text-anchor="end">بچپن کی نشوونما</text><line class="stroke-a" x1="220" y1="90" x2="280" y2="200"/><rect class="panel-c" x="560" y="70" width="190" height="40" rx="6"/><text class="body" x="738" y="88" text-anchor="end">قومی پالیسی: ابتدائی</text><text class="body" x="738" y="102" text-anchor="end">تعلیم کی توسیع</text><line class="stroke-a" x1="560" y1="90" x2="500" y2="200"/><rect class="panel-b" x="30" y="130" width="190" height="40" rx="6"/><text class="body" x="208" y="148" text-anchor="end">ہدف 4.1: سب کے لیے</text><text class="body" x="208" y="162" text-anchor="end">ابتدائی و ثانوی تعلیم</text><line class="stroke-a" x1="220" y1="150" x2="280" y2="215"/><rect class="panel-c" x="560" y="130" width="190" height="40" rx="6"/><text class="body" x="738" y="148" text-anchor="end">قومی پالیسی: مفت</text><text class="body" x="738" y="162" text-anchor="end">اور لازمی تعلیم</text><line class="stroke-a" x1="560" y1="150" x2="500" y2="215"/><rect class="panel-b" x="30" y="190" width="190" height="40" rx="6"/><text class="body" x="208" y="208" text-anchor="end">ہدف 4.4: تکنیکی</text><text class="body" x="208" y="222" text-anchor="end">اور پیشہ ورانہ مہارتیں</text><line class="stroke-a" x1="220" y1="210" x2="280" y2="230"/><rect class="panel-c" x="560" y="190" width="190" height="40" rx="6"/><text class="body" x="738" y="208" text-anchor="end">قومی پالیسی: TVET</text><text class="body" x="738" y="222" text-anchor="end">کی توسیع</text><line class="stroke-a" x1="560" y1="210" x2="500" y2="230"/><rect class="panel-b" x="30" y="250" width="190" height="40" rx="6"/><text class="body" x="208" y="268" text-anchor="end">ہدف 4.6: خواندگی</text><text class="body" x="208" y="282" text-anchor="end">اور حساب دانی</text><line class="stroke-a" x1="220" y1="270" x2="280" y2="245"/><rect class="panel-c" x="560" y="250" width="190" height="40" rx="6"/><text class="body" x="738" y="268" text-anchor="end">قومی پالیسی: بالغوں</text><text class="body" x="738" y="282" text-anchor="end">کی خواندگی کے پروگرام</text><line class="stroke-a" x1="560" y1="270" x2="500" y2="245"/><rect class="panel-b" x="30" y="310" width="190" height="40" rx="6"/><text class="body" x="208" y="328" text-anchor="end">ہدف 4.5: شمولیت</text><text class="body" x="208" y="342" text-anchor="end">اور انصاف</text><line class="stroke-a" x1="220" y1="330" x2="280" y2="260"/><rect class="panel-c" x="560" y="310" width="190" height="40" rx="6"/><text class="body" x="738" y="328" text-anchor="end">قومی پالیسی: صنفی</text><text class="body" x="738" y="342" text-anchor="end">انصاف اور شمولیت</text><line class="stroke-a" x1="560" y1="330" x2="500" y2="260"/><rect class="panel-b" x="30" y="370" width="190" height="40" rx="6"/><text class="body" x="208" y="388" text-anchor="end">ہدف 4.7: عالمی</text><text class="body" x="208" y="402" text-anchor="end">شہریت</text><line class="stroke-a" x1="220" y1="390" x2="280" y2="275"/><rect class="panel-c" x="560" y="370" width="190" height="40" rx="6"/><text class="body" x="738" y="388" text-anchor="end">قومی پالیسی: اقدار</text><text class="body" x="738" y="402" text-anchor="end">کے لیے نصابی اصلاح</text><line class="stroke-a" x1="560" y1="390" x2="500" y2="275"/><rect class="panel-b" x="30" y="420" width="190" height="40" rx="6"/><text class="body" x="208" y="438" text-anchor="end">ہدف 4.c: اساتذہ</text><text class="body" x="208" y="452" text-anchor="end">کی تربیت</text><line class="stroke-a" x1="220" y1="440" x2="280" y2="285"/><rect class="panel-c" x="560" y="420" width="190" height="40" rx="6"/><text class="body" x="738" y="438" text-anchor="end">قومی پالیسی: اساتذہ</text><text class="body" x="738" y="452" text-anchor="end">کی پیشہ ورانہ ترقی</text><line class="stroke-a" x1="560" y1="440" x2="500" y2="285"/><rect class="panel-b" x="270" y="420" width="14" height="14" rx="3"/><text class="small" x="290" y="431" text-anchor="start">SDG4 کا ہدف</text><rect class="panel-c" x="380" y="420" width="14" height="14" rx="3"/><text class="small" x="400" y="431" text-anchor="start">قومی پالیسی کا جزو</text><text class="small" x="390" y="490" text-anchor="middle">انتخاب: 10 میں سے 7 اہداف دکھائے گئے ہیں (4.3، 4.a، 4.b شامل نہیں)۔</text><text class="wm" x="768" y="528" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>