<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">SDG4 targets linked to Pakistan's National Education Policy</title><desc id="d">A concept map showing SDG4 at the centre with branches for its seven targets, each linked to a corresponding element of Pakistan's National Education Policy framework.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">SDG4: Quality Education</text><text class="small" x="390" y="50" text-anchor="middle">Seven targets linked to Pakistan's National Education Policy 2017</text><ellipse class="panel-a" cx="390" cy="230" rx="110" ry="50"/><text class="sh" x="390" y="226" text-anchor="middle">SDG4:</text><text class="sh" x="390" y="244" text-anchor="middle">Quality Education</text><rect class="panel-b" x="30" y="70" width="170" height="40" rx="6"/><text class="body" x="42" y="88">Target 1: Early</text><text class="body" x="42" y="102">childhood development</text><line class="stroke-a" x1="200" y1="90" x2="280" y2="200"/><rect class="panel-c" x="580" y="70" width="170" height="40" rx="6"/><text class="body" x="592" y="88">NEP: Early childhood</text><text class="body" x="592" y="102">education expansion</text><line class="stroke-a" x1="580" y1="90" x2="500" y2="200"/><rect class="panel-b" x="30" y="130" width="170" height="40" rx="6"/><text class="body" x="42" y="148">Target 2: Universal</text><text class="body" x="42" y="162">primary and secondary</text><line class="stroke-a" x1="200" y1="150" x2="280" y2="215"/><rect class="panel-c" x="580" y="130" width="170" height="40" rx="6"/><text class="body" x="592" y="148">NEP: Free and</text><text class="body" x="592" y="162">compulsory education</text><line class="stroke-a" x1="580" y1="150" x2="500" y2="215"/><rect class="panel-b" x="30" y="190" width="170" height="40" rx="6"/><text class="body" x="42" y="208">Target 3: Technical</text><text class="body" x="42" y="222">and vocational skills</text><line class="stroke-a" x1="200" y1="210" x2="280" y2="230"/><rect class="panel-c" x="580" y="190" width="170" height="40" rx="6"/><text class="body" x="592" y="208">NEP: TVET</text><text class="body" x="592" y="222">expansion</text><line class="stroke-a" x1="580" y1="210" x2="500" y2="230"/><rect class="panel-b" x="30" y="250" width="170" height="40" rx="6"/><text class="body" x="42" y="268">Target 4: Literacy</text><text class="body" x="42" y="282">and numeracy</text><line class="stroke-a" x1="200" y1="270" x2="280" y2="245"/><rect class="panel-c" x="580" y="250" width="170" height="40" rx="6"/><text class="body" x="592" y="268">NEP: Adult literacy</text><text class="body" x="592" y="282">programmes</text><line class="stroke-a" x1="580" y1="270" x2="500" y2="245"/><rect class="panel-b" x="30" y="310" width="170" height="40" rx="6"/><text class="body" x="42" y="328">Target 5: Inclusion</text><text class="body" x="42" y="342">and equity</text><line class="stroke-a" x1="200" y1="330" x2="280" y2="260"/><rect class="panel-c" x="580" y="310" width="170" height="40" rx="6"/><text class="body" x="592" y="328">NEP: Gender equity</text><text class="body" x="592" y="342">and inclusion</text><line class="stroke-a" x1="580" y1="330" x2="500" y2="260"/><rect class="panel-b" x="30" y="370" width="170" height="40" rx="6"/><text class="body" x="42" y="388">Target 6: Global</text><text class="body" x="42" y="402">citizenship</text><line class="stroke-a" x1="200" y1="390" x2="280" y2="275"/><rect class="panel-c" x="580" y="370" width="170" height="40" rx="6"/><text class="body" x="592" y="388">NEP: Curriculum</text><text class="body" x="592" y="402">reform for values</text><line class="stroke-a" x1="580" y1="390" x2="500" y2="275"/><rect class="panel-b" x="30" y="420" width="170" height="40" rx="6"/><text class="body" x="42" y="438">Target 7: Teacher</text><text class="body" x="42" y="452">training</text><line class="stroke-a" x1="200" y1="440" x2="280" y2="285"/><rect class="panel-c" x="580" y="420" width="170" height="40" rx="6"/><text class="body" x="592" y="438">NEP: Teacher</text><text class="body" x="592" y="452">professional development</text><line class="stroke-a" x1="580" y1="440" x2="500" y2="285"/><rect class="panel-b" x="270" y="420" width="14" height="14" rx="3"/><text class="small" x="290" y="431">SDG4 Target</text><rect class="panel-c" x="380" y="420" width="14" height="14" rx="3"/><text class="small" x="400" y="431">NEP Element</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
