<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">SDG4 targets linked to Pakistan's National Education Policy</title><desc id="d">A concept map showing SDG4 at the centre with branches for seven selected targets (4.1, 4.2, 4.4, 4.5, 4.6, 4.7, 4.c), each linked to a corresponding element of Pakistan's National Education Policy framework. Targets 4.3, 4.a and 4.b are not shown.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="390" y="32" text-anchor="middle">SDG4: Quality Education</text><text class="small" x="390" y="50" text-anchor="middle">Selected SDG4 targets (official UN IDs) linked to Pakistan's National Education Policy 2017</text><ellipse class="panel-a" cx="390" cy="230" rx="110" ry="50"/><text class="sh" x="390" y="226" text-anchor="middle">SDG4:</text><text class="sh" x="390" y="244" text-anchor="middle">Quality Education</text><rect class="panel-b" x="30" y="70" width="190" height="40" rx="6"/><text class="body" x="42" y="88">Target 4.2: Early</text><text class="body" x="42" y="102">childhood development</text><line class="stroke-a" x1="220" y1="90" x2="280" y2="200"/><rect class="panel-c" x="560" y="70" width="190" height="40" rx="6"/><text class="body" x="572" y="88">NEP: Early childhood</text><text class="body" x="572" y="102">education expansion</text><line class="stroke-a" x1="560" y1="90" x2="500" y2="200"/><rect class="panel-b" x="30" y="130" width="190" height="40" rx="6"/><text class="body" x="42" y="148">Target 4.1: Universal</text><text class="body" x="42" y="162">primary and secondary</text><line class="stroke-a" x1="220" y1="150" x2="280" y2="215"/><rect class="panel-c" x="560" y="130" width="190" height="40" rx="6"/><text class="body" x="572" y="148">NEP: Free and</text><text class="body" x="572" y="162">compulsory education</text><line class="stroke-a" x1="560" y1="150" x2="500" y2="215"/><rect class="panel-b" x="30" y="190" width="190" height="40" rx="6"/><text class="body" x="42" y="208">Target 4.4: Technical</text><text class="body" x="42" y="222">and vocational skills</text><line class="stroke-a" x1="220" y1="210" x2="280" y2="230"/><rect class="panel-c" x="560" y="190" width="190" height="40" rx="6"/><text class="body" x="572" y="208">NEP: TVET</text><text class="body" x="572" y="222">expansion</text><line class="stroke-a" x1="560" y1="210" x2="500" y2="230"/><rect class="panel-b" x="30" y="250" width="190" height="40" rx="6"/><text class="body" x="42" y="268">Target 4.6: Literacy</text><text class="body" x="42" y="282">and numeracy</text><line class="stroke-a" x1="220" y1="270" x2="280" y2="245"/><rect class="panel-c" x="560" y="250" width="190" height="40" rx="6"/><text class="body" x="572" y="268">NEP: Adult literacy</text><text class="body" x="572" y="282">programmes</text><line class="stroke-a" x1="560" y1="270" x2="500" y2="245"/><rect class="panel-b" x="30" y="310" width="190" height="40" rx="6"/><text class="body" x="42" y="328">Target 4.5: Inclusion</text><text class="body" x="42" y="342">and equity</text><line class="stroke-a" x1="220" y1="330" x2="280" y2="260"/><rect class="panel-c" x="560" y="310" width="190" height="40" rx="6"/><text class="body" x="572" y="328">NEP: Gender equity</text><text class="body" x="572" y="342">and inclusion</text><line class="stroke-a" x1="560" y1="330" x2="500" y2="260"/><rect class="panel-b" x="30" y="370" width="190" height="40" rx="6"/><text class="body" x="42" y="388">Target 4.7: Global</text><text class="body" x="42" y="402">citizenship</text><line class="stroke-a" x1="220" y1="390" x2="280" y2="275"/><rect class="panel-c" x="560" y="370" width="190" height="40" rx="6"/><text class="body" x="572" y="388">NEP: Curriculum</text><text class="body" x="572" y="402">reform for values</text><line class="stroke-a" x1="560" y1="390" x2="500" y2="275"/><rect class="panel-b" x="30" y="420" width="190" height="40" rx="6"/><text class="body" x="42" y="438">Target 4.c: Teacher</text><text class="body" x="42" y="452">training</text><line class="stroke-a" x1="220" y1="440" x2="280" y2="285"/><rect class="panel-c" x="560" y="420" width="190" height="60" rx="6"/><text class="body" x="572" y="438">NEP: Teacher</text><text class="body" x="572" y="456">professional</text><text class="body" x="572" y="474">development</text><line class="stroke-a" x1="560" y1="440" x2="500" y2="285"/><rect class="panel-b" x="270" y="420" width="14" height="14" rx="3"/><text class="small" x="290" y="431">SDG4 Target</text><rect class="panel-c" x="380" y="420" width="14" height="14" rx="3"/><text class="small" x="400" y="431">NEP Element</text><text class="small" x="390" y="510" text-anchor="middle">Selection: 7 of 10 SDG4 targets shown (4.3, 4.a, 4.b not shown).</text><text class="wm" x="768" y="528" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
