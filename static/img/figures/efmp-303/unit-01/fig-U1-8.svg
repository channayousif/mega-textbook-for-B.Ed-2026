<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Milestones in Pakistan's education system</title><desc id="d">A table listing each milestone with its year, event and significance for the education system.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="520"/><rect class="panel-a" x="20" y="20" width="740" height="45" rx="6"/><text class="h" x="50" y="48">Year</text><text class="h" x="140" y="48">Milestone</text><text class="h" x="400" y="48">Significance</text><rect class="panel" x="20" y="75" width="740" height="50" rx="4"/><text class="sh" x="50" y="98">1947</text><text class="body" x="140" y="98">Education Conference</text><text class="small" x="400" y="93">Set direction for the new nation:</text><text class="small" x="400" y="110">free primary, national languages</text><rect class="panel" x="20" y="135" width="740" height="50" rx="4"/><text class="sh" x="50" y="158">1959</text><text class="body" x="140" y="158">Sharif Commission</text><text class="small" x="400" y="153">Recommended the 5-3-2-2 grade</text><text class="small" x="400" y="170">structure still used today</text><rect class="panel" x="20" y="195" width="740" height="50" rx="4"/><text class="sh" x="50" y="218">1970</text><text class="body" x="140" y="218">National Education Policy</text><text class="small" x="400" y="213">Curriculum reform and primary</text><text class="small" x="400" y="230">expansion; interrupted by 1971 war</text><rect class="panel" x="20" y="255" width="740" height="50" rx="4"/><text class="sh" x="50" y="278">1972</text><text class="body" x="140" y="278">Education Policy</text><text class="small" x="400" y="273">Nationalised private schools;</text><text class="small" x="400" y="290">expanded government control</text><rect class="panel" x="20" y="315" width="740" height="50" rx="4"/><text class="sh" x="50" y="338">1979</text><text class="body" x="140" y="338">Education Policy</text><text class="small" x="400" y="333">Islamization of curriculum;</text><text class="small" x="400" y="350">Pakistan studies made compulsory</text><rect class="panel" x="20" y="375" width="740" height="50" rx="4"/><text class="sh" x="50" y="398">1992</text><text class="body" x="140" y="398">Education Policy</text><text class="small" x="400" y="393">Addressed low literacy, gender</text><text class="small" x="400" y="410">gaps; targets but weak follow-through</text><rect class="panel" x="20" y="435" width="740" height="30" rx="4"/><text class="sh" x="50" y="453">1998</text><text class="body" x="140" y="453">National Education Policy</text><text class="small" x="400" y="453">Expanded access; quality focus</text><rect class="panel" x="20" y="475" width="740" height="30" rx="4"/><text class="sh" x="50" y="493">2009 / 2017</text><text class="body" x="140" y="493">National Education Policies</text><text class="small" x="400" y="493">Curriculum reform, quality assurance, SDG alignment</text><line class="grid" x1="120" y1="20" x2="120" y2="500"/><line class="grid" x1="370" y1="20" x2="370" y2="500"/><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
