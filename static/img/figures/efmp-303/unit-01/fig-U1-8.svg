<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Milestones in Pakistan's education system</title><desc id="d">A table of milestones in Pakistan's education system with columns for year, milestone and significance, covering 1947, 1959, 1970, 1972, 1979, 1992, 1998 and the 2009 and 2017 policies.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="20" y="12" width="740" height="40" rx="6"/></g><g id="layer-edges"><line id="edge-rule-year-milestone" class="grid" x1="130" y1="12" x2="130" y2="501"/><line id="edge-rule-milestone-significance" class="grid" x1="360" y1="12" x2="360" y2="501"/></g><g id="layer-nodes"><g id="node-header"><text class="h" x="75" y="38" text-anchor="middle">Year</text><text class="h" x="245" y="38" text-anchor="middle">Milestone</text><text class="h" x="560" y="38" text-anchor="middle">Significance</text></g><g id="node-year-1947"><rect class="panel" x="20" y="58" width="740" height="51" rx="4"/><text class="sh" x="75" y="89" text-anchor="middle">1947</text><text class="body" x="245" y="89" text-anchor="middle">Education Conference</text><text class="small" x="560" y="79" text-anchor="middle">Set direction for the new nation:</text><text class="small" x="560" y="101" text-anchor="middle">free primary, national languages</text></g><g id="node-year-1959"><rect class="panel" x="20" y="114" width="740" height="51" rx="4"/><text class="sh" x="75" y="145" text-anchor="middle">1959</text><text class="body" x="245" y="145" text-anchor="middle">Sharif Commission</text><text class="small" x="560" y="135" text-anchor="middle">Recommended the 5-3-2-2 grade</text><text class="small" x="560" y="157" text-anchor="middle">structure still used today</text></g><g id="node-year-1970"><rect class="panel" x="20" y="170" width="740" height="51" rx="4"/><text class="sh" x="75" y="201" text-anchor="middle">1970</text><text class="body" x="245" y="201" text-anchor="middle">National Education Policy</text><text class="small" x="560" y="191" text-anchor="middle">Curriculum reform and primary</text><text class="small" x="560" y="213" text-anchor="middle">expansion; interrupted by 1971 war</text></g><g id="node-year-1972"><rect class="panel" x="20" y="226" width="740" height="51" rx="4"/><text class="sh" x="75" y="257" text-anchor="middle">1972</text><text class="body" x="245" y="257" text-anchor="middle">Education Policy</text><text class="small" x="560" y="247" text-anchor="middle">Nationalised private schools;</text><text class="small" x="560" y="269" text-anchor="middle">expanded government control</text></g><g id="node-year-1979"><rect class="panel" x="20" y="282" width="740" height="51" rx="4"/><text class="sh" x="75" y="313" text-anchor="middle">1979</text><text class="body" x="245" y="313" text-anchor="middle">Education Policy</text><text class="small" x="560" y="303" text-anchor="middle">Islamization of curriculum;</text><text class="small" x="560" y="325" text-anchor="middle">Pakistan studies made compulsory</text></g><g id="node-year-1992"><rect class="panel" x="20" y="338" width="740" height="51" rx="4"/><text class="sh" x="75" y="369" text-anchor="middle">1992</text><text class="body" x="245" y="369" text-anchor="middle">Education Policy</text><text class="small" x="560" y="359" text-anchor="middle">Addressed low literacy, gender</text><text class="small" x="560" y="381" text-anchor="middle">gaps; targets but weak follow-through</text></g><g id="node-year-1998"><rect class="panel" x="20" y="394" width="740" height="51" rx="4"/><text class="sh" x="75" y="425" text-anchor="middle">1998</text><text class="body" x="245" y="425" text-anchor="middle">National Education Policy</text><text class="small" x="560" y="425" text-anchor="middle">Expanded access; quality focus</text></g><g id="node-year-2009-2017"><rect class="panel" x="20" y="450" width="740" height="51" rx="4"/><text class="sh" x="75" y="481" text-anchor="middle">2009 / 2017</text><text class="body" x="245" y="481" text-anchor="middle">National Education Policies</text><text class="small" x="560" y="481" text-anchor="middle">Curriculum reform, quality assurance, SDG alignment</text></g><line class="grid" x1="130" y1="58" x2="130" y2="501"/><line class="grid" x1="360" y1="58" x2="360" y2="501"/></g><g id="layer-labels"><text class="wm" x="768" y="513" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
