<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے تعلیمی نظام کے سنگ میل</title><desc id="d">ایک خط زمانی جو پاکستان کے تعلیمی نظام کے سنگ میل دکھاتا ہے: 1947 تعلیمی کانفرنس، 1959 شریف کمیشن، 1970 قومی تعلیمی پالیسی، 1972 تعلیمی پالیسی، 1979 تعلیمی پالیسی، 1992 تعلیمی پالیسی، 1998 تعلیمی پالیسی، 2009 قومی تعلیمی پالیسی، 2017 قومی تعلیمی پالیسی۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .body{font-size:11px;fill:var(--ink);} .small{font-size:10px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .node{fill:var(--a1);} </style><rect class="bg" x="0" y="0" width="900" height="400"/><text class="h" x="860" y="40" text-anchor="end">پاکستان کے تعلیمی سنگ میل (1947 تا 2017)</text><line class="stroke" x1="860" y1="220" x2="20" y2="220"/><circle class="node" cx="800" cy="220" r="8"/><rect class="panel-a" x="750" y="80" width="100" height="60" rx="6"/><text class="sh" x="800" y="100" text-anchor="middle">تعلیمی</text><text class="sh" x="800" y="115" text-anchor="middle">کانفرنس</text><text class="small" x="800" y="132" text-anchor="middle">سمت طے ہوئی</text><text class="body" x="800" y="245" text-anchor="middle">1947</text><line class="grid" x1="800" y1="140" x2="800" y2="220"/><circle class="node" cx="700" cy="220" r="8"/><rect class="panel-a" x="650" y="270" width="100" height="60" rx="6"/><text class="sh" x="700" y="290" text-anchor="middle">شریف</text><text class="sh" x="700" y="305" text-anchor="middle">کمیشن</text><text class="small" x="700" y="322" text-anchor="middle">5 تا 3 تا 2 تا 2 ڈھانچہ</text><text class="body" x="700" y="195" text-anchor="middle">1959</text><line class="grid" x1="700" y1="220" x2="700" y2="270"/><circle class="node" cx="590" cy="220" r="8"/><rect class="panel-a" x="535" y="80" width="110" height="60" rx="6"/><text class="sh" x="590" y="100" text-anchor="middle">قومی تعلیمی</text><text class="sh" x="590" y="115" text-anchor="middle">پالیسی</text><text class="small" x="590" y="132" text-anchor="middle">نصابی اصلاح</text><text class="body" x="590" y="245" text-anchor="middle">1970</text><line class="grid" x1="590" y1="140" x2="590" y2="220"/><circle class="node" cx="480" cy="220" r="8"/><rect class="panel-a" x="425" y="270" width="110" height="60" rx="6"/><text class="sh" x="480" y="290" text-anchor="middle">تعلیمی</text><text class="sh" x="480" y="305" text-anchor="middle">پالیسی</text><text class="small" x="480" y="322" text-anchor="middle">قومیانا</text><text class="body" x="480" y="195" text-anchor="middle">1972</text><line class="grid" x1="480" y1="220" x2="480" y2="270"/><circle class="node" cx="370" cy="220" r="8"/><rect class="panel-a" x="315" y="80" width="110" height="60" rx="6"/><text class="sh" x="370" y="100" text-anchor="middle">تعلیمی</text><text class="sh" x="370" y="115" text-anchor="middle">پالیسی</text><text class="small" x="370" y="132" text-anchor="middle">اسلامی تشکیل</text><text class="body" x="370" y="245" text-anchor="middle">1979</text><line class="grid" x1="370" y1="140" x2="370" y2="220"/><circle class="node" cx="270" cy="220" r="8"/><rect class="panel-a" x="220" y="270" width="100" height="60" rx="6"/><text class="sh" x="270" y="290" text-anchor="middle">تعلیمی</text><text class="sh" x="270" y="305" text-anchor="middle">پالیسی</text><text class="small" x="270" y="322" text-anchor="middle">خواندگی، صنف</text><text class="body" x="270" y="195" text-anchor="middle">1992</text><line class="grid" x1="270" y1="220" x2="270" y2="270"/><circle class="node" cx="180" cy="220" r="8"/><rect class="panel-a" x="135" y="80" width="90" height="60" rx="6"/><text class="sh" x="180" y="100" text-anchor="middle">قومی تعلیمی</text><text class="sh" x="180" y="115" text-anchor="middle">پالیسی</text><text class="small" x="180" y="132" text-anchor="middle">رسائی اور معیار</text><text class="body" x="180" y="245" text-anchor="middle">1998</text><line class="grid" x1="180" y1="140" x2="180" y2="220"/><circle class="node" cx="70" cy="220" r="8" fill="var(--a3)"/><rect class="panel-a" x="15" y="270" width="110" height="60" rx="6"/><text class="sh" x="70" y="290" text-anchor="middle">قومی تعلیمی</text><text class="sh" x="70" y="305" text-anchor="middle">پالیسیاں</text><text class="small" x="70" y="322" text-anchor="middle">2009 اور 2017</text><text class="body" x="70" y="195" text-anchor="middle">2009/2017</text><line class="grid" x1="70" y1="220" x2="70" y2="270"/><text class="wm" x="888" y="390" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
