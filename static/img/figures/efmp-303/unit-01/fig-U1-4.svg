<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education feeding social and economic development</title><desc id="d">A concept map showing how education feeds social development (health, gender equity, civic participation) and economic development (productivity, income, growth), with arrows showing two-way influence.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="panel-a" cx="390" cy="235" rx="110" ry="50" stroke-width="3" stroke="var(--a1)"/><text class="h" x="390" y="230" text-anchor="middle">Education</text><text class="small" x="390" y="250" text-anchor="middle">knowledge and skills</text><rect class="panel-b" x="30" y="100" width="170" height="55" rx="8"/><text class="sh" x="115" y="122" text-anchor="middle">Social Development</text><text class="small" x="115" y="142" text-anchor="middle">health, gender, civics</text><line class="stroke-a" x1="200" y1="127" x2="280" y2="215"/><rect class="panel" x="30" y="30" width="80" height="40" rx="5"/><text class="small" x="70" y="55" text-anchor="middle">Health</text><line class="grid" x1="70" y1="70" x2="115" y2="100"/><rect class="panel" x="120" y="30" width="80" height="40" rx="5"/><text class="small" x="160" y="55" text-anchor="middle">Gender equity</text><line class="grid" x1="160" y1="70" x2="115" y2="100"/><rect class="panel" x="75" y="370" width="90" height="40" rx="5"/><text class="small" x="120" y="395" text-anchor="middle">Civic participation</text><line class="grid" x1="120" y1="370" x2="115" y2="155"/><rect class="panel-b" x="570" y="100" width="180" height="55" rx="8"/><text class="sh" x="660" y="122" text-anchor="middle">Economic Development</text><text class="small" x="660" y="142" text-anchor="middle">productivity, income, growth</text><line class="stroke-a" x1="570" y1="127" x2="500" y2="215"/><rect class="panel" x="580" y="30" width="100" height="40" rx="5"/><text class="small" x="630" y="55" text-anchor="middle">Productivity</text><line class="grid" x1="630" y1="70" x2="660" y2="100"/><rect class="panel" x="690" y="30" width="70" height="40" rx="5"/><text class="small" x="725" y="55" text-anchor="middle">Income</text><line class="grid" x1="725" y1="70" x2="660" y2="100"/><rect class="panel" x="630" y="370" width="120" height="40" rx="5"/><text class="small" x="690" y="395" text-anchor="middle">Economic growth</text><line class="grid" x1="690" y1="370" x2="660" y2="155"/><rect class="panel" x="250" y="380" width="280" height="50" rx="8"/><text class="body" x="390" y="400" text-anchor="middle">Two-way influence: development also</text><text class="body" x="390" y="418" text-anchor="middle">funds and shapes education</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
