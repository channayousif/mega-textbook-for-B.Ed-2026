<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education feeding social and economic development</title><desc id="d">A concept map showing how education feeds social development (health, gender equity, civic participation) and economic development (productivity, income, growth), with arrows showing two-way influence.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><line id="edge-social-education" class="stroke-a" x1="200" y1="180" x2="300" y2="230" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-economic-education" class="stroke-a" x1="580" y1="180" x2="480" y2="230" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-health-social" class="grid" x1="80" y1="74" x2="100" y2="110"/><line id="edge-gender-social" class="grid" x1="200" y1="74" x2="180" y2="110"/><line id="edge-civic-social" class="grid" x1="100" y1="320" x2="100" y2="180"/><line id="edge-productivity-economic" class="grid" x1="600" y1="74" x2="620" y2="110"/><line id="edge-income-economic" class="grid" x1="720" y1="74" x2="700" y2="110"/><line id="edge-growth-economic" class="grid" x1="680" y1="320" x2="680" y2="180"/></g><g id="layer-nodes"><g id="node-education"><ellipse class="panel-a" cx="390" cy="260" rx="110" ry="54"/><text class="h" x="390" y="254" text-anchor="middle">Education</text><text class="small" x="390" y="283" text-anchor="middle">knowledge and skills</text></g><g id="node-social"><rect class="panel-b" x="40" y="110" width="220" height="70" rx="8"/><text class="sh" x="150" y="138" text-anchor="middle">Social Development</text><text class="small" x="150" y="164" text-anchor="middle">health, gender, civics</text></g><g id="node-health"><rect class="panel" x="30" y="30" width="100" height="44" rx="5"/><text class="small" x="80" y="57" text-anchor="middle">Health</text></g><g id="node-gender"><rect class="panel" x="150" y="30" width="110" height="44" rx="5"/><text class="small" x="205" y="57" text-anchor="middle">Gender equity</text></g><g id="node-civic"><rect class="panel" x="30" y="320" width="140" height="44" rx="5"/><text class="small" x="100" y="347" text-anchor="middle">Civic participation</text></g><g id="node-economic"><rect class="panel-b" x="520" y="110" width="220" height="70" rx="8"/><text class="sh" x="630" y="138" text-anchor="middle">Economic Development</text><text class="small" x="630" y="164" text-anchor="middle">productivity, income, growth</text></g><g id="node-productivity"><rect class="panel" x="540" y="30" width="110" height="44" rx="5"/><text class="small" x="595" y="57" text-anchor="middle">Productivity</text></g><g id="node-income"><rect class="panel" x="670" y="30" width="90" height="44" rx="5"/><text class="small" x="715" y="57" text-anchor="middle">Income</text></g><g id="node-growth"><rect class="panel" x="610" y="320" width="140" height="44" rx="5"/><text class="small" x="680" y="347" text-anchor="middle">Economic growth</text></g><g id="node-feedback"><rect class="panel" x="230" y="382" width="320" height="66" rx="8"/><text class="body" x="390" y="408" text-anchor="middle">Two-way influence: development also</text><text class="body" x="390" y="434" text-anchor="middle">funds and shapes education</text></g></g><g id="layer-labels"><text class="wm" x="768" y="463" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
