<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 346.67" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے تعلیمی نظام کے سنگ میل</title><desc id="d">ایک خط زمانی جو پاکستان کے تعلیمی نظام کے سنگ میل دکھاتا ہے: 1947 تعلیمی کانفرنس، 1959 شریف کمیشن، 1970 قومی تعلیمی پالیسی، 1972 تعلیمی پالیسی، 1979 تعلیمی پالیسی، 1992 تعلیمی پالیسی، 1998 تعلیمی پالیسی، 2009 قومی تعلیمی پالیسی، 2017 قومی تعلیمی پالیسی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="346.67"/><g id="layer-regions"><text class="h" x="770" y="28" text-anchor="end">&#x200F;پاکستان کے تعلیمی سنگ میل (1947 تا 2017)&#x200F;</text></g><g id="layer-edges"><line id="edge-axis-start-end" class="stroke" x1="770" y1="180" x2="10" y2="180"/><line id="edge-axis-milestone-1947" class="grid" x1="700" y1="180" x2="700" y2="130"/><line id="edge-axis-milestone-1959" class="grid" x1="611.5" y1="180" x2="611.5" y2="230"/><line id="edge-axis-milestone-1970" class="grid" x1="523" y1="180" x2="523" y2="130"/><line id="edge-axis-milestone-1972" class="grid" x1="434.5" y1="180" x2="434.5" y2="230"/><line id="edge-axis-milestone-1979" class="grid" x1="346" y1="180" x2="346" y2="130"/><line id="edge-axis-milestone-1992" class="grid" x1="257.5" y1="180" x2="257.5" y2="230"/><line id="edge-axis-milestone-1998" class="grid" x1="169" y1="180" x2="169" y2="130"/><line id="edge-axis-milestone-2009-2017" class="grid" x1="80.5" y1="180" x2="80.5" y2="230"/></g><g id="layer-nodes"><g id="node-milestone-1947"><rect class="panel-a" x="630" y="44" width="140" height="86" rx="6"/><text class="sh" x="700" y="68" text-anchor="middle">&#x200F;تعلیمی&#x200F;</text><text class="sh" x="700" y="92" text-anchor="middle">&#x200F;کانفرنس&#x200F;</text><text class="small" x="700" y="118" text-anchor="middle">&#x200F;سمت طے ہوئی&#x200F;</text><circle class="node" cx="700" cy="180" r="7"/></g><g id="node-milestone-1959"><rect class="panel-a" x="541.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="611.5" y="254" text-anchor="middle">&#x200F;شریف&#x200F;</text><text class="sh" x="611.5" y="278" text-anchor="middle">&#x200F;کمیشن&#x200F;</text><text class="small" x="611.5" y="304" text-anchor="middle">&#x200F;5 تا 3 تا 2 تا 2 ڈھانچہ&#x200F;</text><circle class="node" cx="611.5" cy="180" r="7"/></g><g id="node-milestone-1970"><rect class="panel-a" x="453" y="44" width="140" height="86" rx="6"/><text class="sh" x="523" y="68" text-anchor="middle">&#x200F;قومی تعلیمی&#x200F;</text><text class="sh" x="523" y="92" text-anchor="middle">&#x200F;پالیسی&#x200F;</text><text class="small" x="523" y="118" text-anchor="middle">&#x200F;نصابی اصلاح&#x200F;</text><circle class="node" cx="523" cy="180" r="7"/></g><g id="node-milestone-1972"><rect class="panel-a" x="364.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="434.5" y="254" text-anchor="middle">&#x200F;تعلیمی&#x200F;</text><text class="sh" x="434.5" y="278" text-anchor="middle">&#x200F;پالیسی&#x200F;</text><text class="small" x="434.5" y="304" text-anchor="middle">&#x200F;قومیانا&#x200F;</text><circle class="node" cx="434.5" cy="180" r="7"/></g><g id="node-milestone-1979"><rect class="panel-a" x="276" y="44" width="140" height="86" rx="6"/><text class="sh" x="346" y="68" text-anchor="middle">&#x200F;تعلیمی&#x200F;</text><text class="sh" x="346" y="92" text-anchor="middle">&#x200F;پالیسی&#x200F;</text><text class="small" x="346" y="118" text-anchor="middle">&#x200F;اسلامی تشکیل&#x200F;</text><circle class="node" cx="346" cy="180" r="7"/></g><g id="node-milestone-1992"><rect class="panel-a" x="187.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="257.5" y="254" text-anchor="middle">&#x200F;تعلیمی&#x200F;</text><text class="sh" x="257.5" y="278" text-anchor="middle">&#x200F;پالیسی&#x200F;</text><text class="small" x="257.5" y="304" text-anchor="middle">&#x200F;خواندگی، صنف&#x200F;</text><circle class="node" cx="257.5" cy="180" r="7"/></g><g id="node-milestone-1998"><rect class="panel-a" x="99" y="44" width="140" height="86" rx="6"/><text class="sh" x="169" y="68" text-anchor="middle">&#x200F;قومی تعلیمی&#x200F;</text><text class="sh" x="169" y="92" text-anchor="middle">&#x200F;پالیسی&#x200F;</text><text class="small" x="169" y="118" text-anchor="middle">&#x200F;رسائی اور معیار&#x200F;</text><circle class="node" cx="169" cy="180" r="7"/></g><g id="node-milestone-2009-2017"><rect class="panel-c" x="10.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="80.5" y="254" text-anchor="middle">&#x200F;قومی تعلیمی&#x200F;</text><text class="sh" x="80.5" y="278" text-anchor="middle">&#x200F;پالیسیاں&#x200F;</text><text class="small" x="80.5" y="304" text-anchor="middle">&#x200F;2009 اور 2017&#x200F;</text><circle class="node-end" cx="80.5" cy="180" r="9"/></g></g><g id="layer-labels"><text class="body" x="700" y="205" text-anchor="middle">1947</text><text class="body" x="611.5" y="164" text-anchor="middle">1959</text><text class="body" x="523" y="205" text-anchor="middle">1970</text><text class="body" x="434.5" y="164" text-anchor="middle">1972</text><text class="body" x="346" y="205" text-anchor="middle">1979</text><text class="body" x="257.5" y="164" text-anchor="middle">1992</text><text class="body" x="169" y="205" text-anchor="middle">1998</text><text class="body" x="80.5" y="164" text-anchor="middle">2009/2017</text><text class="wm" x="12" y="340" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
