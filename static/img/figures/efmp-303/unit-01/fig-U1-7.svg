<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 346.67" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Milestones in Pakistan's education system</title><desc id="d">A timeline showing milestones in Pakistan's education system: 1947 Education Conference, 1959 Sharif Commission, 1970 National Education Policy, 1972 Education Policy, 1979 Education Policy, 1992 Education Policy, 1998 Education Policy, 2009 National Education Policy, 2017 National Education Policy.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="346.67"/><g id="layer-regions"><text class="h" x="10" y="28" text-anchor="start">Pakistan Education Milestones (1947-2017)</text></g><g id="layer-edges"><line id="edge-axis-start-end" class="stroke" x1="10" y1="180" x2="770" y2="180"/><line id="edge-axis-milestone-1947" class="grid" x1="80" y1="180" x2="80" y2="130"/><line id="edge-axis-milestone-1959" class="grid" x1="168.5" y1="180" x2="168.5" y2="230"/><line id="edge-axis-milestone-1970" class="grid" x1="257" y1="180" x2="257" y2="130"/><line id="edge-axis-milestone-1972" class="grid" x1="345.5" y1="180" x2="345.5" y2="230"/><line id="edge-axis-milestone-1979" class="grid" x1="434" y1="180" x2="434" y2="130"/><line id="edge-axis-milestone-1992" class="grid" x1="522.5" y1="180" x2="522.5" y2="230"/><line id="edge-axis-milestone-1998" class="grid" x1="611" y1="180" x2="611" y2="130"/><line id="edge-axis-milestone-2009-2017" class="grid" x1="699.5" y1="180" x2="699.5" y2="230"/></g><g id="layer-nodes"><g id="node-milestone-1947"><rect class="panel-a" x="10" y="44" width="140" height="86" rx="6"/><text class="sh" x="80" y="68" text-anchor="middle">Education</text><text class="sh" x="80" y="92" text-anchor="middle">Conference</text><text class="small" x="80" y="118" text-anchor="middle">Direction set</text><circle class="node" cx="80" cy="180" r="7"/></g><g id="node-milestone-1959"><rect class="panel-a" x="98.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="168.5" y="254" text-anchor="middle">Sharif</text><text class="sh" x="168.5" y="278" text-anchor="middle">Commission</text><text class="small" x="168.5" y="304" text-anchor="middle">5-3-2-2 structure</text><circle class="node" cx="168.5" cy="180" r="7"/></g><g id="node-milestone-1970"><rect class="panel-a" x="187" y="44" width="140" height="86" rx="6"/><text class="sh" x="257" y="68" text-anchor="middle">National Ed</text><text class="sh" x="257" y="92" text-anchor="middle">Policy</text><text class="small" x="257" y="118" text-anchor="middle">Curriculum reform</text><circle class="node" cx="257" cy="180" r="7"/></g><g id="node-milestone-1972"><rect class="panel-a" x="275.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="345.5" y="254" text-anchor="middle">Education</text><text class="sh" x="345.5" y="278" text-anchor="middle">Policy</text><text class="small" x="345.5" y="304" text-anchor="middle">Nationalisation</text><circle class="node" cx="345.5" cy="180" r="7"/></g><g id="node-milestone-1979"><rect class="panel-a" x="364" y="44" width="140" height="86" rx="6"/><text class="sh" x="434" y="68" text-anchor="middle">Education</text><text class="sh" x="434" y="92" text-anchor="middle">Policy</text><text class="small" x="434" y="118" text-anchor="middle">Islamization</text><circle class="node" cx="434" cy="180" r="7"/></g><g id="node-milestone-1992"><rect class="panel-a" x="452.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="522.5" y="254" text-anchor="middle">Education</text><text class="sh" x="522.5" y="278" text-anchor="middle">Policy</text><text class="small" x="522.5" y="304" text-anchor="middle">Literacy, gender</text><circle class="node" cx="522.5" cy="180" r="7"/></g><g id="node-milestone-1998"><rect class="panel-a" x="541" y="44" width="140" height="86" rx="6"/><text class="sh" x="611" y="68" text-anchor="middle">National Ed</text><text class="sh" x="611" y="92" text-anchor="middle">Policy</text><text class="small" x="611" y="118" text-anchor="middle">Access + quality</text><circle class="node" cx="611" cy="180" r="7"/></g><g id="node-milestone-2009-2017"><rect class="panel-c" x="629.5" y="230" width="140" height="86" rx="6"/><text class="sh" x="699.5" y="254" text-anchor="middle">National Ed</text><text class="sh" x="699.5" y="278" text-anchor="middle">Policies</text><text class="small" x="699.5" y="304" text-anchor="middle">2009 and 2017</text><circle class="node-end" cx="699.5" cy="180" r="9"/></g></g><g id="layer-labels"><text class="body" x="80" y="205" text-anchor="middle">1947</text><text class="body" x="168.5" y="164" text-anchor="middle">1959</text><text class="body" x="257" y="205" text-anchor="middle">1970</text><text class="body" x="345.5" y="164" text-anchor="middle">1972</text><text class="body" x="434" y="205" text-anchor="middle">1979</text><text class="body" x="522.5" y="164" text-anchor="middle">1992</text><text class="body" x="611" y="205" text-anchor="middle">1998</text><text class="body" x="699.5" y="164" text-anchor="middle">2009/2017</text><text class="wm" x="768" y="340" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
