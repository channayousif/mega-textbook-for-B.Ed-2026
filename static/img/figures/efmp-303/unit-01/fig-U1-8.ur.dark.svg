<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے تعلیمی نظام کے سنگ میل</title><desc id="d">پاکستان کے تعلیمی نظام کے سنگ میلوں کا ایک جدول جس کے کالم سال، سنگ میل اور اہمیت ہیں، اور جو 1947، 1959، 1970، 1972، 1979، 1992، 1998 اور 2009 و 2017 کی پالیسیوں کا احاطہ کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="20" y="12" width="740" height="40" rx="6"/></g><g id="layer-edges"><line id="edge-rule-year-milestone" class="grid" x1="650" y1="12" x2="650" y2="501"/><line id="edge-rule-milestone-significance" class="grid" x1="420" y1="12" x2="420" y2="501"/></g><g id="layer-nodes"><g id="node-header"><text class="h" x="705" y="38" text-anchor="middle">&#x200F;سال&#x200F;</text><text class="h" x="535" y="38" text-anchor="middle">&#x200F;سنگ میل&#x200F;</text><text class="h" x="220" y="38" text-anchor="middle">&#x200F;اہمیت&#x200F;</text></g><g id="node-year-1947"><rect class="panel" x="20" y="58" width="740" height="51" rx="4"/><text class="sh" x="705" y="89" text-anchor="middle">1947</text><text class="body" x="535" y="89" text-anchor="middle">&#x200F;تعلیمی کانفرنس&#x200F;</text><text class="small" x="220" y="79" text-anchor="middle">&#x200F;نئی قوم کی سمت طے کی: مفت ابتدائی&#x200F;</text><text class="small" x="220" y="101" text-anchor="middle">&#x200F;تعلیم، قومی زبانیں&#x200F;</text></g><g id="node-year-1959"><rect class="panel" x="20" y="114" width="740" height="51" rx="4"/><text class="sh" x="705" y="145" text-anchor="middle">1959</text><text class="body" x="535" y="145" text-anchor="middle">&#x200F;شریف کمیشن&#x200F;</text><text class="small" x="220" y="135" text-anchor="middle">&#x200F;5 تا 3 تا 2 تا 2 درجاتی ڈھانچہ تجویز کیا&#x200F;</text><text class="small" x="220" y="157" text-anchor="middle">&#x200F;جو آج بھی استعمال ہوتا ہے&#x200F;</text></g><g id="node-year-1970"><rect class="panel" x="20" y="170" width="740" height="51" rx="4"/><text class="sh" x="705" y="201" text-anchor="middle">1970</text><text class="body" x="535" y="201" text-anchor="middle">&#x200F;قومی تعلیمی پالیسی&#x200F;</text><text class="small" x="220" y="191" text-anchor="middle">&#x200F;نصابی اصلاح اور ابتدائی توسیع؛&#x200F;</text><text class="small" x="220" y="213" text-anchor="middle">&#x200F;1971 کی جنگ سے منقطع&#x200F;</text></g><g id="node-year-1972"><rect class="panel" x="20" y="226" width="740" height="51" rx="4"/><text class="sh" x="705" y="257" text-anchor="middle">1972</text><text class="body" x="535" y="257" text-anchor="middle">&#x200F;تعلیمی پالیسی&#x200F;</text><text class="small" x="220" y="247" text-anchor="middle">&#x200F;نجی اسکول قومی ملکیت میں لیے؛&#x200F;</text><text class="small" x="220" y="269" text-anchor="middle">&#x200F;حکومتی اختیار بڑھایا&#x200F;</text></g><g id="node-year-1979"><rect class="panel" x="20" y="282" width="740" height="51" rx="4"/><text class="sh" x="705" y="313" text-anchor="middle">1979</text><text class="body" x="535" y="313" text-anchor="middle">&#x200F;تعلیمی پالیسی&#x200F;</text><text class="small" x="220" y="303" text-anchor="middle">&#x200F;نصاب کی اسلامی تشکیل؛&#x200F;</text><text class="small" x="220" y="325" text-anchor="middle">&#x200F;مطالعہ پاکستان لازمی کیا گیا&#x200F;</text></g><g id="node-year-1992"><rect class="panel" x="20" y="338" width="740" height="51" rx="4"/><text class="sh" x="705" y="369" text-anchor="middle">1992</text><text class="body" x="535" y="369" text-anchor="middle">&#x200F;تعلیمی پالیسی&#x200F;</text><text class="small" x="220" y="359" text-anchor="middle">&#x200F;کم خواندگی اور صنفی فرق کو موضوع بنایا؛&#x200F;</text><text class="small" x="220" y="381" text-anchor="middle">&#x200F;اہداف مقرر ہوئے مگر پیروی کمزور رہی&#x200F;</text></g><g id="node-year-1998"><rect class="panel" x="20" y="394" width="740" height="51" rx="4"/><text class="sh" x="705" y="425" text-anchor="middle">1998</text><text class="body" x="535" y="425" text-anchor="middle">&#x200F;قومی تعلیمی پالیسی&#x200F;</text><text class="small" x="220" y="425" text-anchor="middle">&#x200F;رسائی بڑھائی؛ معیار پر توجہ&#x200F;</text></g><g id="node-year-2009-2017"><rect class="panel" x="20" y="450" width="740" height="51" rx="4"/><text class="sh" x="705" y="481" text-anchor="middle">2009 / 2017</text><text class="body" x="535" y="481" text-anchor="middle">&#x200F;قومی تعلیمی پالیسیاں&#x200F;</text><text class="small" x="220" y="481" text-anchor="middle">&#x200F;نصابی اصلاح، معیار کی ضمانت، پائیدار ترقی کے اہداف سے ہم آہنگی&#x200F;</text></g><line class="grid" x1="650" y1="58" x2="650" y2="501"/><line class="grid" x1="420" y1="58" x2="420" y2="501"/></g><g id="layer-labels"><text class="wm" x="12" y="513" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
