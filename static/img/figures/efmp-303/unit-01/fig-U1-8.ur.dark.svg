<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے تعلیمی نظام کے سنگ میل</title><desc id="d">پاکستان کے تعلیمی نظام کے سنگ میلوں کا ایک جدول جس کے کالم سال، سنگ میل اور اہمیت ہیں، اور جو 1947، 1959، 1970، 1972، 1979، 1992، 1998 اور 2009 و 2017 کی پالیسیوں کا احاطہ کرتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:12px;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="520"/><rect class="panel-a" x="20" y="20" width="740" height="45" rx="6"/><text class="h" x="730" y="48" text-anchor="end">سال</text><text class="h" x="640" y="48" text-anchor="end">سنگ میل</text><text class="h" x="380" y="48" text-anchor="end">اہمیت</text><rect class="panel" x="20" y="75" width="740" height="50" rx="4"/><text class="sh" x="730" y="98" text-anchor="end">1947</text><text class="body" x="640" y="98" text-anchor="end">تعلیمی کانفرنس</text><text class="small" x="380" y="93" text-anchor="end">نئی قوم کی سمت طے کی: مفت ابتدائی</text><text class="small" x="380" y="110" text-anchor="end">تعلیم، قومی زبانیں</text><rect class="panel" x="20" y="135" width="740" height="50" rx="4"/><text class="sh" x="730" y="158" text-anchor="end">1959</text><text class="body" x="640" y="158" text-anchor="end">شریف کمیشن</text><text class="small" x="380" y="153" text-anchor="end">5 تا 3 تا 2 تا 2 درجاتی ڈھانچہ تجویز کیا</text><text class="small" x="380" y="170" text-anchor="end">جو آج بھی استعمال ہوتا ہے</text><rect class="panel" x="20" y="195" width="740" height="50" rx="4"/><text class="sh" x="730" y="218" text-anchor="end">1970</text><text class="body" x="640" y="218" text-anchor="end">قومی تعلیمی پالیسی</text><text class="small" x="380" y="213" text-anchor="end">نصابی اصلاح اور ابتدائی توسیع؛</text><text class="small" x="380" y="230" text-anchor="end">1971 کی جنگ سے منقطع</text><rect class="panel" x="20" y="255" width="740" height="50" rx="4"/><text class="sh" x="730" y="278" text-anchor="end">1972</text><text class="body" x="640" y="278" text-anchor="end">تعلیمی پالیسی</text><text class="small" x="380" y="273" text-anchor="end">نجی اسکول قومی ملکیت میں لیے؛</text><text class="small" x="380" y="290" text-anchor="end">حکومتی اختیار بڑھایا</text><rect class="panel" x="20" y="315" width="740" height="50" rx="4"/><text class="sh" x="730" y="338" text-anchor="end">1979</text><text class="body" x="640" y="338" text-anchor="end">تعلیمی پالیسی</text><text class="small" x="380" y="333" text-anchor="end">نصاب کی اسلامی تشکیل؛</text><text class="small" x="380" y="350" text-anchor="end">مطالعہ پاکستان لازمی کیا گیا</text><rect class="panel" x="20" y="375" width="740" height="50" rx="4"/><text class="sh" x="730" y="398" text-anchor="end">1992</text><text class="body" x="640" y="398" text-anchor="end">تعلیمی پالیسی</text><text class="small" x="380" y="393" text-anchor="end">کم خواندگی اور صنفی فرق کو موضوع بنایا؛</text><text class="small" x="380" y="410" text-anchor="end">اہداف مقرر ہوئے مگر پیروی کمزور رہی</text><rect class="panel" x="20" y="435" width="740" height="30" rx="4"/><text class="sh" x="730" y="453" text-anchor="end">1998</text><text class="body" x="640" y="453" text-anchor="end">قومی تعلیمی پالیسی</text><text class="small" x="380" y="453" text-anchor="end">رسائی بڑھائی؛ معیار پر توجہ</text><rect class="panel" x="20" y="475" width="740" height="30" rx="4"/><text class="sh" x="730" y="491" text-anchor="end">2009 / 2017</text><text class="body" x="640" y="493" text-anchor="end">قومی تعلیمی پالیسیاں</text><text class="small" x="380" y="493" text-anchor="end">نصابی اصلاح، معیار کی ضمانت، پائیدار ترقی کے اہداف سے ہم آہنگی</text><line class="grid" x1="660" y1="20" x2="660" y2="500"/><line class="grid" x1="410" y1="20" x2="410" y2="500"/><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
