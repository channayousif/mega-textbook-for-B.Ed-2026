<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی پالیسی کے اجزا</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں 'تعلیمی پالیسی' ہے اور اس کی شاخیں مقاصد، حکمتِ عملی، وسائل، نفاذ اور جانچ ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:12px;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .node-centre{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="node-centre" cx="390" cy="235" rx="120" ry="55"/><text class="h" x="390" y="230" text-anchor="middle">تعلیمی</text><text class="h" x="390" y="250" text-anchor="middle">پالیسی</text><rect class="panel-a" x="570" y="60" width="160" height="55" rx="8"/><text class="sh" x="650" y="85" text-anchor="middle">مقاصد</text><text class="small" x="650" y="102" text-anchor="middle">ہم کیا حاصل کرنا چاہتے ہیں</text><line class="stroke-a" x1="570" y1="87" x2="510" y2="210"/><rect class="panel-b" x="50" y="60" width="170" height="55" rx="8"/><text class="sh" x="135" y="85" text-anchor="middle">حکمتِ عملی</text><text class="small" x="135" y="102" text-anchor="middle">وسیع طریقے</text><line class="stroke-a" x1="220" y1="87" x2="270" y2="210"/><rect class="panel-a" x="580" y="350" width="170" height="55" rx="8"/><text class="sh" x="665" y="375" text-anchor="middle">وسائل</text><text class="small" x="665" y="392" text-anchor="middle">فنڈ، عملہ، مواد</text><line class="stroke-a" x1="580" y1="377" x2="480" y2="270"/><rect class="panel-b" x="30" y="350" width="180" height="55" rx="8"/><text class="sh" x="120" y="375" text-anchor="middle">نفاذ</text><text class="small" x="120" y="392" text-anchor="middle">پالیسی کو عمل میں لانا</text><line class="stroke-a" x1="210" y1="377" x2="300" y2="270"/><rect class="panel-a" x="300" y="410" width="180" height="50" rx="8"/><text class="sh" x="390" y="432" text-anchor="middle">جانچ</text><text class="small" x="390" y="450" text-anchor="middle">کیا یہ کام کر گئی؟</text><line class="stroke-a" x1="390" y1="410" x2="390" y2="290"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
