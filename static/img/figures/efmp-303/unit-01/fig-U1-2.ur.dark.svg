<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پالیسی اور منصوبہ بندی کا موازنہ</title><desc id="d">ایک خاکہ جو پالیسی اور منصوبہ بندی کا موازنہ کرتا ہے: پالیسی 'کیا' ہے اور منصوبہ بندی 'کیسے'، اور ایک تیر دکھاتا ہے کہ پالیسی منصوبہ بندی کو چلاتی ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:17px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="440" y="80" width="280" height="280" rx="12"/><text class="h" x="580" y="130" text-anchor="middle">پالیسی</text><text class="sh" x="580" y="170" text-anchor="middle">"کیا"</text><rect class="panel" x="470" y="200" width="220" height="40" rx="6"/><text class="body" x="580" y="225" text-anchor="middle">مقاصد اور سمت طے کرتی ہے</text><rect class="panel" x="470" y="250" width="220" height="40" rx="6"/><text class="body" x="580" y="275" text-anchor="middle">اصول بیان کرتی ہے</text><rect class="panel" x="470" y="300" width="220" height="40" rx="6"/><text class="body" x="580" y="325" text-anchor="middle">جواب: ہم کیا چاہتے ہیں؟</text><defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><line class="stroke-a" x1="430" y1="220" x2="350" y2="220" marker-end="url(#arrow1)"/><text class="small" x="390" y="205" text-anchor="middle">چلاتی ہے</text><rect class="panel-a" x="60" y="80" width="280" height="280" rx="12"/><text class="h" x="200" y="130" text-anchor="middle">منصوبہ بندی</text><text class="sh" x="200" y="170" text-anchor="middle">"کیسے"</text><rect class="panel" x="90" y="200" width="220" height="40" rx="6"/><text class="body" x="200" y="225" text-anchor="middle">اقدامات اور وقت کی حد طے کرتی ہے</text><rect class="panel" x="90" y="250" width="220" height="40" rx="6"/><text class="body" x="200" y="275" text-anchor="middle">بجٹ اور وسائل مقرر کرتی ہے</text><rect class="panel" x="90" y="300" width="220" height="40" rx="6"/><text class="body" x="200" y="325" text-anchor="middle">جواب: کیسے، کب، کس کے ذریعے؟</text><rect class="panel" x="150" y="390" width="480" height="50" rx="8"/><text class="body" x="390" y="420" text-anchor="middle">منصوبہ بندی کے بغیر پالیسی کاغذ پر رہ جاتی ہے۔ پالیسی کے بغیر منصوبہ بندی کی کوئی سمت نہیں۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
