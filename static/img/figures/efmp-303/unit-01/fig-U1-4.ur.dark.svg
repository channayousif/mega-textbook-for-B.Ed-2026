<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم سماجی اور معاشی ترقی کو پروان چڑھاتی ہے</title><desc id="d">ایک تصوراتی نقشہ جو دکھاتا ہے کہ تعلیم سماجی ترقی (صحت، صنفی برابری، شہری شرکت) اور معاشی ترقی (پیداواریت، آمدنی، نمو) کو کیسے پروان چڑھاتی ہے، اور تیر دو طرفہ اثر دکھاتے ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:12px;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="panel-a" cx="390" cy="235" rx="110" ry="50" stroke-width="3" stroke="var(--a1)"/><text class="h" x="390" y="230" text-anchor="middle">تعلیم</text><text class="small" x="390" y="250" text-anchor="middle">علم اور مہارتیں</text><rect class="panel-b" x="580" y="100" width="170" height="55" rx="8"/><text class="sh" x="665" y="122" text-anchor="middle">سماجی ترقی</text><text class="small" x="665" y="142" text-anchor="middle">صحت، صنف، شہریت</text><line class="stroke-a" x1="580" y1="127" x2="500" y2="215"/><rect class="panel" x="670" y="30" width="80" height="40" rx="5"/><text class="small" x="710" y="55" text-anchor="middle">صحت</text><line class="grid" x1="710" y1="70" x2="665" y2="100"/><rect class="panel" x="580" y="30" width="80" height="40" rx="5"/><text class="small" x="620" y="55" text-anchor="middle">صنفی برابری</text><line class="grid" x1="620" y1="70" x2="665" y2="100"/><rect class="panel" x="615" y="370" width="90" height="40" rx="5"/><text class="small" x="660" y="395" text-anchor="middle">شہری شرکت</text><line class="grid" x1="660" y1="370" x2="665" y2="155"/><rect class="panel-b" x="30" y="100" width="180" height="55" rx="8"/><text class="sh" x="120" y="122" text-anchor="middle">معاشی ترقی</text><text class="small" x="120" y="142" text-anchor="middle">پیداواریت، آمدنی، نمو</text><line class="stroke-a" x1="210" y1="127" x2="280" y2="215"/><rect class="panel" x="100" y="30" width="100" height="40" rx="5"/><text class="small" x="150" y="55" text-anchor="middle">پیداواریت</text><line class="grid" x1="150" y1="70" x2="120" y2="100"/><rect class="panel" x="20" y="30" width="70" height="40" rx="5"/><text class="small" x="55" y="55" text-anchor="middle">آمدنی</text><line class="grid" x1="55" y1="70" x2="120" y2="100"/><rect class="panel" x="30" y="370" width="120" height="40" rx="5"/><text class="small" x="90" y="395" text-anchor="middle">معاشی نمو</text><line class="grid" x1="90" y1="370" x2="120" y2="155"/><rect class="panel" x="250" y="380" width="280" height="50" rx="8"/><text class="body" x="390" y="400" text-anchor="middle">دو طرفہ اثر: ترقی بھی تعلیم کو</text><text class="body" x="390" y="418" text-anchor="middle">فنڈ دیتی ہے اور شکل دیتی ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
