<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم سماجی اور معاشی ترقی کو پروان چڑھاتی ہے</title><desc id="d">ایک تصوراتی نقشہ جو دکھاتا ہے کہ تعلیم سماجی ترقی (صحت، صنفی برابری، شہری شرکت) اور معاشی ترقی (پیداواریت، آمدنی، نمو) کو کیسے پروان چڑھاتی ہے، اور تیر دو طرفہ اثر دکھاتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><line id="edge-social-education" class="stroke-a" x1="580" y1="180" x2="480" y2="230" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-economic-education" class="stroke-a" x1="200" y1="180" x2="300" y2="230" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-health-social" class="grid" x1="700" y1="74" x2="680" y2="110"/><line id="edge-gender-social" class="grid" x1="580" y1="74" x2="600" y2="110"/><line id="edge-civic-social" class="grid" x1="680" y1="320" x2="680" y2="180"/><line id="edge-productivity-economic" class="grid" x1="180" y1="74" x2="160" y2="110"/><line id="edge-income-economic" class="grid" x1="60" y1="74" x2="80" y2="110"/><line id="edge-growth-economic" class="grid" x1="100" y1="320" x2="100" y2="180"/></g><g id="layer-nodes"><g id="node-education"><ellipse class="panel-a" cx="390" cy="260" rx="110" ry="54"/><text class="h" x="390" y="254" text-anchor="middle">&#x200F;تعلیم&#x200F;</text><text class="small" x="390" y="283" text-anchor="middle">&#x200F;علم اور مہارتیں&#x200F;</text></g><g id="node-social"><rect class="panel-b" x="520" y="110" width="220" height="70" rx="8"/><text class="sh" x="630" y="138" text-anchor="middle">&#x200F;سماجی ترقی&#x200F;</text><text class="small" x="630" y="164" text-anchor="middle">&#x200F;صحت، صنف، شہریت&#x200F;</text></g><g id="node-health"><rect class="panel" x="650" y="30" width="100" height="44" rx="5"/><text class="small" x="700" y="57" text-anchor="middle">&#x200F;صحت&#x200F;</text></g><g id="node-gender"><rect class="panel" x="520" y="30" width="110" height="44" rx="5"/><text class="small" x="575" y="57" text-anchor="middle">&#x200F;صنفی برابری&#x200F;</text></g><g id="node-civic"><rect class="panel" x="610" y="320" width="140" height="44" rx="5"/><text class="small" x="680" y="347" text-anchor="middle">&#x200F;شہری شرکت&#x200F;</text></g><g id="node-economic"><rect class="panel-b" x="40" y="110" width="220" height="70" rx="8"/><text class="sh" x="150" y="138" text-anchor="middle">&#x200F;معاشی ترقی&#x200F;</text><text class="small" x="150" y="164" text-anchor="middle">&#x200F;پیداواریت، آمدنی، نمو&#x200F;</text></g><g id="node-productivity"><rect class="panel" x="130" y="30" width="110" height="44" rx="5"/><text class="small" x="185" y="57" text-anchor="middle">&#x200F;پیداواریت&#x200F;</text></g><g id="node-income"><rect class="panel" x="20" y="30" width="90" height="44" rx="5"/><text class="small" x="65" y="57" text-anchor="middle">&#x200F;آمدنی&#x200F;</text></g><g id="node-growth"><rect class="panel" x="30" y="320" width="140" height="44" rx="5"/><text class="small" x="100" y="347" text-anchor="middle">&#x200F;معاشی نمو&#x200F;</text></g><g id="node-feedback"><rect class="panel" x="230" y="382" width="320" height="66" rx="8"/><text class="body" x="390" y="408" text-anchor="middle">&#x200F;دو طرفہ اثر: ترقی بھی تعلیم کو&#x200F;</text><text class="body" x="390" y="434" text-anchor="middle">&#x200F;فنڈ دیتی ہے اور شکل دیتی ہے&#x200F;</text></g></g><g id="layer-labels"><text class="wm" x="12" y="463" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
