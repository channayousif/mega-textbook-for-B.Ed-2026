<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education, society and development</title><desc id="d">A triangle diagram showing education, society and development at the three corners with bidirectional arrows between each pair, labelled with how each influences the others.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:18px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="290" y="50" width="200" height="70" rx="10"/><text class="h" x="390" y="85" text-anchor="middle">Education</text><text class="small" x="390" y="105" text-anchor="middle">Knowledge, skills, values</text><rect class="panel-a" x="50" y="330" width="200" height="70" rx="10"/><text class="h" x="150" y="365" text-anchor="middle">Society</text><text class="small" x="150" y="385" text-anchor="middle">Norms, expectations, conditions</text><rect class="panel-a" x="530" y="330" width="200" height="70" rx="10"/><text class="h" x="630" y="365" text-anchor="middle">Development</text><text class="small" x="630" y="385" text-anchor="middle">Improved living conditions</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><line class="stroke-a" x1="220" y1="330" x2="330" y2="120" marker-end="url(#ar)"/><line class="stroke-a" x1="330" y1="120" x2="220" y2="330" marker-end="url(#al)"/><text class="small" x="230" y="220">shapes demand</text><text class="small" x="260" y="240">changes norms</text><line class="stroke-a" x1="550" y1="330" x2="450" y2="120" marker-end="url(#ar)"/><line class="stroke-a" x1="450" y1="120" x2="550" y2="330" marker-end="url(#al)"/><text class="small" x="510" y="220">builds human</text><text class="small" x="520" y="240">capital</text><line class="stroke-a" x1="250" y1="365" x2="530" y2="365" marker-end="url(#ar)"/><line class="stroke-a" x1="530" y1="365" x2="250" y2="365" marker-end="url(#al)"/><text class="small" x="340" y="355">context for</text><text class="small" x="400" y="390">resources for</text><text class="small" x="390" y="260" text-anchor="middle">Mutual influence:</text><text class="small" x="390" y="278" text-anchor="middle">each shapes the other two</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
