<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم، سماج اور ترقی</title><desc id="d">ایک مثلثی خاکہ جس کے تین کونوں پر تعلیم، سماج اور ترقی ہیں، ہر جوڑے کے درمیان دو طرفہ تیر ہیں، اور ہر تیر پر لکھا ہے کہ ایک دوسرے پر کیسے اثر ڈالتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:17px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:12px;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="290" y="50" width="200" height="70" rx="10"/><text class="h" x="390" y="85" text-anchor="middle">تعلیم</text><text class="small" x="390" y="105" text-anchor="middle">علم، مہارتیں، اقدار</text><rect class="panel-a" x="530" y="330" width="200" height="70" rx="10"/><text class="h" x="630" y="365" text-anchor="middle">سماج</text><text class="small" x="630" y="385" text-anchor="middle">روایات، توقعات، حالات</text><rect class="panel-a" x="50" y="330" width="200" height="70" rx="10"/><text class="h" x="150" y="365" text-anchor="middle">ترقی</text><text class="small" x="150" y="385" text-anchor="middle">بہتر حالاتِ زندگی</text><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><line class="stroke-a" x1="560" y1="330" x2="450" y2="120" marker-end="url(#ar)"/><line class="stroke-a" x1="450" y1="120" x2="560" y2="330" marker-end="url(#al)"/><text class="small" x="550" y="220" text-anchor="end">طلب کو شکل دیتا ہے</text><text class="small" x="520" y="240" text-anchor="end">روایات بدلتی ہے</text><line class="stroke-a" x1="230" y1="330" x2="330" y2="120" marker-end="url(#ar)"/><line class="stroke-a" x1="330" y1="120" x2="230" y2="330" marker-end="url(#al)"/><text class="small" x="270" y="220" text-anchor="end">انسانی سرمایہ</text><text class="small" x="260" y="240" text-anchor="end">بناتی ہے</text><line class="stroke-a" x1="530" y1="365" x2="250" y2="365" marker-end="url(#ar)"/><line class="stroke-a" x1="250" y1="365" x2="530" y2="365" marker-end="url(#al)"/><text class="small" x="440" y="355" text-anchor="end">تناظر دیتا ہے</text><text class="small" x="380" y="390" text-anchor="end">وسائل دیتی ہے</text><text class="small" x="390" y="260" text-anchor="middle">باہمی اثر:</text><text class="small" x="390" y="278" text-anchor="middle">ہر ایک باقی دونوں کو شکل دیتا ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
