<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education, society and development</title><desc id="d">A triangle diagram showing education, society and development at the three corners with bidirectional arrows between each pair, labelled with how each influences the others.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><line id="edge-education-society" class="stroke-a" x1="320" y1="120" x2="180" y2="320" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-education-development" class="stroke-a" x1="460" y1="120" x2="600" y2="320" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-society-development" class="stroke-a" x1="260" y1="360" x2="520" y2="360" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-education"><rect class="panel-a" x="280" y="40" width="220" height="80" rx="10"/><text class="h" x="390" y="72" text-anchor="middle">Education</text><text class="small" x="390" y="102" text-anchor="middle">Knowledge, skills, values</text></g><g id="node-society"><rect class="panel-a" x="40" y="320" width="220" height="80" rx="10"/><text class="h" x="150" y="352" text-anchor="middle">Society</text><text class="small" x="150" y="382" text-anchor="middle">Norms, expectations, conditions</text></g><g id="node-development"><rect class="panel-a" x="520" y="320" width="220" height="80" rx="10"/><text class="h" x="630" y="352" text-anchor="middle">Development</text><text class="small" x="630" y="382" text-anchor="middle">Improved living conditions</text></g></g><g id="layer-labels"><text class="small" x="224" y="204" text-anchor="end">shapes demand</text><text class="small" x="224" y="232" text-anchor="end">changes norms</text><text class="small" x="556" y="204" text-anchor="start">builds human</text><text class="small" x="556" y="232" text-anchor="start">capital</text><text class="small" x="332" y="342" text-anchor="middle">context for</text><text class="small" x="448" y="388" text-anchor="middle">resources for</text><text class="small" x="390" y="258" text-anchor="middle">Mutual influence:</text><text class="small" x="390" y="288" text-anchor="middle">each shapes the other two</text><text class="wm" x="768" y="463" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
