<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 277.33" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education landmarks before independence</title><desc id="d">A timeline showing key landmarks in education before independence: 1854 Wood's Dispatch, 1882 Hunter Commission, 1913 Calcutta University Commission, 1947 independence.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="277.33"/><g id="layer-regions"><text class="h" x="15" y="34" text-anchor="start">Education in Pakistan: Pre-1947 Landmarks</text></g><g id="layer-edges"><line id="edge-axis-start-end" class="stroke" x1="15" y1="206" x2="765" y2="206"/><line id="edge-axis-landmark-1854" class="grid" x1="105" y1="206" x2="105" y2="176"/><line id="edge-axis-landmark-1882" class="grid" x1="295" y1="206" x2="295" y2="176"/><line id="edge-axis-landmark-1913" class="grid" x1="485" y1="206" x2="485" y2="176"/><line id="edge-axis-landmark-1947" class="grid" x1="675" y1="206" x2="675" y2="176"/></g><g id="layer-nodes"><g id="node-landmark-1854"><rect class="panel-a" x="15" y="58" width="180" height="118" rx="8"/><text class="sh" x="105" y="88" text-anchor="middle">Wood's Dispatch</text><text class="small" x="105" y="118" text-anchor="middle">Hierarchical system:</text><text class="small" x="105" y="142" text-anchor="middle">primary, secondary,</text><text class="small" x="105" y="166" text-anchor="middle">university</text><circle class="node" cx="105" cy="206" r="8"/></g><g id="node-landmark-1882"><rect class="panel-a" x="205" y="58" width="180" height="118" rx="8"/><text class="sh" x="295" y="88" text-anchor="middle">Hunter Commission</text><text class="small" x="295" y="118" text-anchor="middle">Examined state of</text><text class="small" x="295" y="142" text-anchor="middle">primary education</text><circle class="node" cx="295" cy="206" r="8"/></g><g id="node-landmark-1913"><rect class="panel-a" x="395" y="58" width="180" height="118" rx="8"/><text class="sh" x="485" y="84" text-anchor="middle">Calcutta University</text><text class="sh" x="485" y="108" text-anchor="middle">Commission</text><text class="small" x="485" y="138" text-anchor="middle">Higher education reform</text><circle class="node" cx="485" cy="206" r="8"/></g><g id="node-landmark-1947"><rect class="panel-c" x="585" y="58" width="180" height="118" rx="8"/><text class="sh" x="675" y="88" text-anchor="middle">Independence</text><text class="small" x="675" y="118" text-anchor="middle">Pakistan inherits</text><text class="small" x="675" y="142" text-anchor="middle">colonial education system</text><circle class="node-end" cx="675" cy="206" r="11"/></g></g><g id="layer-labels"><text class="body" x="105" y="238" text-anchor="middle">1854</text><text class="body" x="295" y="238" text-anchor="middle">1882</text><text class="body" x="485" y="238" text-anchor="middle">1913</text><text class="body" x="675" y="238" text-anchor="middle">1947</text><text class="wm" x="768" y="270" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
