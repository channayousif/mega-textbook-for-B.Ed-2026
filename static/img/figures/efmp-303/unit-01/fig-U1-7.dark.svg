<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Milestones in Pakistan's education system</title><desc id="d">A timeline showing milestones in Pakistan's education system: 1947 Education Conference, 1959 Sharif Commission, 1970 National Education Policy, 1972 Education Policy, 1979 Education Policy, 1992 Education Policy, 1998 Education Policy, 2009 National Education Policy, 2017 National Education Policy.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:12px;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .node{fill:var(--a1);} </style><rect class="bg" x="0" y="0" width="900" height="400"/><text class="h" x="40" y="40">Pakistan Education Milestones (1947-2017)</text><line class="stroke" x1="40" y1="220" x2="880" y2="220"/><circle class="node" cx="100" cy="220" r="8"/><rect class="panel-a" x="50" y="80" width="100" height="60" rx="6"/><text class="sh" x="100" y="100" text-anchor="middle">Education</text><text class="sh" x="100" y="115" text-anchor="middle">Conference</text><text class="small" x="100" y="132" text-anchor="middle">Direction set</text><text class="body" x="100" y="245" text-anchor="middle">1947</text><line class="grid" x1="100" y1="140" x2="100" y2="220"/><circle class="node" cx="200" cy="220" r="8"/><rect class="panel-a" x="150" y="270" width="100" height="60" rx="6"/><text class="sh" x="200" y="290" text-anchor="middle">Sharif</text><text class="sh" x="200" y="305" text-anchor="middle">Commission</text><text class="small" x="200" y="322" text-anchor="middle">5-3-2-2 structure</text><text class="body" x="200" y="195" text-anchor="middle">1959</text><line class="grid" x1="200" y1="220" x2="200" y2="270"/><circle class="node" cx="310" cy="220" r="8"/><rect class="panel-a" x="255" y="80" width="110" height="60" rx="6"/><text class="sh" x="310" y="100" text-anchor="middle">National Ed</text><text class="sh" x="310" y="115" text-anchor="middle">Policy</text><text class="small" x="310" y="132" text-anchor="middle">Curriculum reform</text><text class="body" x="310" y="245" text-anchor="middle">1970</text><line class="grid" x1="310" y1="140" x2="310" y2="220"/><circle class="node" cx="420" cy="220" r="8"/><rect class="panel-a" x="365" y="270" width="110" height="60" rx="6"/><text class="sh" x="420" y="290" text-anchor="middle">Education</text><text class="sh" x="420" y="305" text-anchor="middle">Policy</text><text class="small" x="420" y="322" text-anchor="middle">Nationalisation</text><text class="body" x="420" y="195" text-anchor="middle">1972</text><line class="grid" x1="420" y1="220" x2="420" y2="270"/><circle class="node" cx="530" cy="220" r="8"/><rect class="panel-a" x="475" y="80" width="110" height="60" rx="6"/><text class="sh" x="530" y="100" text-anchor="middle">Education</text><text class="sh" x="530" y="115" text-anchor="middle">Policy</text><text class="small" x="530" y="132" text-anchor="middle">Islamization</text><text class="body" x="530" y="245" text-anchor="middle">1979</text><line class="grid" x1="530" y1="140" x2="530" y2="220"/><circle class="node" cx="630" cy="220" r="8"/><rect class="panel-a" x="580" y="270" width="100" height="60" rx="6"/><text class="sh" x="630" y="290" text-anchor="middle">Education</text><text class="sh" x="630" y="305" text-anchor="middle">Policy</text><text class="small" x="630" y="322" text-anchor="middle">Literacy, gender</text><text class="body" x="630" y="195" text-anchor="middle">1992</text><line class="grid" x1="630" y1="220" x2="630" y2="270"/><circle class="node" cx="720" cy="220" r="8"/><rect class="panel-a" x="675" y="80" width="90" height="60" rx="6"/><text class="sh" x="720" y="100" text-anchor="middle">National Ed</text><text class="sh" x="720" y="115" text-anchor="middle">Policy</text><text class="small" x="720" y="132" text-anchor="middle">Access + quality</text><text class="body" x="720" y="245" text-anchor="middle">1998</text><line class="grid" x1="720" y1="140" x2="720" y2="220"/><circle class="node" cx="830" cy="220" r="8" fill="var(--a3)"/><rect class="panel-a" x="775" y="270" width="110" height="60" rx="6"/><text class="sh" x="830" y="290" text-anchor="middle">National Ed</text><text class="sh" x="830" y="305" text-anchor="middle">Policies</text><text class="small" x="830" y="322" text-anchor="middle">2009 and 2017</text><text class="body" x="830" y="195" text-anchor="middle">2009/2017</text><line class="grid" x1="830" y1="220" x2="830" y2="270"/><text class="wm" x="888" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
