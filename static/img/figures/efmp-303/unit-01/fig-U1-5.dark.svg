<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education landmarks before independence</title><desc id="d">A timeline showing key landmarks in education before independence: 1854 Wood's Dispatch, 1882 Hunter Commission, 1913 Calcutta University Commission, 1947 independence.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} .node{fill:var(--a1);} </style><rect class="bg" x="0" y="0" width="900" height="320"/><text class="h" x="40" y="45">Education in Pakistan: Pre-1947 Landmarks</text><line class="stroke" x1="60" y1="200" x2="860" y2="200"/><circle class="node" cx="150" cy="200" r="10"/><rect class="panel-a" x="80" y="80" width="150" height="70" rx="8"/><text class="sh" x="155" y="105" text-anchor="middle">Wood's Dispatch</text><text class="small" x="155" y="125" text-anchor="middle">Hierarchical system:</text><text class="small" x="155" y="140" text-anchor="middle">primary, secondary, university</text><text class="body" x="155" y="225" text-anchor="middle">1854</text><circle class="node" cx="360" cy="200" r="10"/><rect class="panel-a" x="290" y="80" width="150" height="70" rx="8"/><text class="sh" x="365" y="105" text-anchor="middle">Hunter Commission</text><text class="small" x="365" y="125" text-anchor="middle">Examined state of</text><text class="small" x="365" y="140" text-anchor="middle">primary education</text><text class="body" x="365" y="225" text-anchor="middle">1882</text><circle class="node" cx="570" cy="200" r="10"/><rect class="panel-a" x="500" y="80" width="150" height="70" rx="8"/><text class="sh" x="575" y="105" text-anchor="middle">Calcutta University</text><text class="small" x="575" y="125" text-anchor="middle">Commission</text><text class="small" x="575" y="140" text-anchor="middle">Higher education reform</text><text class="body" x="575" y="225" text-anchor="middle">1913</text><circle class="node" cx="780" cy="200" r="12" fill="var(--a3)"/><rect class="panel-a" x="710" y="80" width="150" height="70" rx="8"/><text class="sh" x="785" y="105" text-anchor="middle">Independence</text><text class="small" x="785" y="125" text-anchor="middle">Pakistan inherits</text><text class="small" x="785" y="140" text-anchor="middle">colonial education system</text><text class="body" x="785" y="225" text-anchor="middle">1947</text><line class="grid" x1="150" y1="150" x2="150" y2="200"/><line class="grid" x1="360" y1="150" x2="360" y2="200"/><line class="grid" x1="570" y1="150" x2="570" y2="200"/><line class="grid" x1="780" y1="150" x2="780" y2="200"/><text class="wm" x="888" y="308" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
