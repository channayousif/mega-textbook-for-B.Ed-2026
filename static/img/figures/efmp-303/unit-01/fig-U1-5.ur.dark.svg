<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آزادی سے پہلے تعلیم کے سنگ میل</title><desc id="d">ایک خط زمانی جو آزادی سے پہلے تعلیم کے بنیادی سنگ میل دکھاتا ہے: 1854 ووڈز ڈسپیچ، 1882 ہنٹر کمیشن، 1913 کلکتہ یونیورسٹی کمیشن، 1947 آزادی۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:12px;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} .node{fill:var(--a1);} </style><rect class="bg" x="0" y="0" width="900" height="320"/><text class="h" x="860" y="45" text-anchor="end">پاکستان میں تعلیم: 1947 سے پہلے کے سنگ میل</text><line class="stroke" x1="840" y1="200" x2="40" y2="200"/><circle class="node" cx="750" cy="200" r="10"/><rect class="panel-a" x="670" y="80" width="150" height="70" rx="8"/><text class="sh" x="745" y="105" text-anchor="middle">ووڈز ڈسپیچ</text><text class="small" x="745" y="125" text-anchor="middle">درجہ بندی والا نظام:</text><text class="small" x="745" y="140" text-anchor="middle">ابتدائی، ثانوی، یونیورسٹی</text><text class="body" x="745" y="225" text-anchor="middle">1854</text><circle class="node" cx="540" cy="200" r="10"/><rect class="panel-a" x="460" y="80" width="150" height="70" rx="8"/><text class="sh" x="535" y="105" text-anchor="middle">ہنٹر کمیشن</text><text class="small" x="535" y="125" text-anchor="middle">ابتدائی تعلیم کی</text><text class="small" x="535" y="140" text-anchor="middle">حالت کا جائزہ</text><text class="body" x="535" y="225" text-anchor="middle">1882</text><circle class="node" cx="330" cy="200" r="10"/><rect class="panel-a" x="250" y="80" width="150" height="70" rx="8"/><text class="sh" x="325" y="105" text-anchor="middle">کلکتہ یونیورسٹی</text><text class="small" x="325" y="125" text-anchor="middle">کمیشن</text><text class="small" x="325" y="140" text-anchor="middle">اعلیٰ تعلیم کی اصلاح</text><text class="body" x="325" y="225" text-anchor="middle">1913</text><circle class="node" cx="120" cy="200" r="12" fill="var(--a3)"/><rect class="panel-a" x="40" y="80" width="150" height="70" rx="8"/><text class="sh" x="115" y="105" text-anchor="middle">آزادی</text><text class="small" x="115" y="125" text-anchor="middle">پاکستان کو نوآبادیاتی</text><text class="small" x="115" y="140" text-anchor="middle">تعلیمی نظام ورثے میں ملا</text><text class="body" x="115" y="225" text-anchor="middle">1947</text><line class="grid" x1="750" y1="150" x2="750" y2="200"/><line class="grid" x1="540" y1="150" x2="540" y2="200"/><line class="grid" x1="330" y1="150" x2="330" y2="200"/><line class="grid" x1="120" y1="150" x2="120" y2="200"/><text class="wm" x="888" y="308" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
