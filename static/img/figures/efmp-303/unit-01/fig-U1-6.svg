<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education before and after independence</title><desc id="d">A table comparing education before and after independence across four rows: purpose, language of instruction, access, and structure.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="420"/><g id="layer-regions"><rect class="panel-a" x="20" y="16" width="740" height="46" rx="6"/></g><g id="layer-edges"><line id="edge-rule-aspect-before" class="grid" x1="160" y1="16" x2="160" y2="392"/><line id="edge-rule-before-after" class="grid" x1="460" y1="16" x2="460" y2="392"/></g><g id="layer-nodes"><g id="node-header"><text class="h" x="90" y="45" text-anchor="middle">Aspect</text><text class="h" x="310" y="45" text-anchor="middle">Before 1947</text><text class="h" x="610" y="45" text-anchor="middle">After 1947</text></g><g id="node-purpose"><rect class="panel" x="20" y="70" width="740" height="74" rx="4"/><text class="sh" x="90" y="113" text-anchor="middle">Purpose</text><text class="body" x="310" y="100" text-anchor="middle">Produce clerks and administrators</text><text class="body" x="310" y="128" text-anchor="middle">for the colonial government</text><text class="body" x="610" y="100" text-anchor="middle">Build national development</text><text class="body" x="610" y="128" text-anchor="middle">and an educated citizenry</text></g><g id="node-language"><rect class="panel" x="20" y="152" width="740" height="74" rx="4"/><text class="sh" x="90" y="195" text-anchor="middle">Language</text><text class="body" x="310" y="182" text-anchor="middle">English for higher education;</text><text class="body" x="310" y="210" text-anchor="middle">vernacular at primary level</text><text class="body" x="610" y="182" text-anchor="middle">Urdu promoted as national</text><text class="body" x="610" y="210" text-anchor="middle">language; English retains prestige</text></g><g id="node-access"><rect class="panel" x="20" y="234" width="740" height="74" rx="4"/><text class="sh" x="90" y="277" text-anchor="middle">Access</text><text class="body" x="310" y="264" text-anchor="middle">Narrow; literacy around 15 per</text><text class="body" x="310" y="292" text-anchor="middle">cent; urban and male focused</text><text class="body" x="610" y="264" text-anchor="middle">Expanded; free and compulsory</text><text class="body" x="610" y="292" text-anchor="middle">primary education promised</text></g><g id="node-structure"><rect class="panel" x="20" y="316" width="740" height="74" rx="4"/><text class="sh" x="90" y="359" text-anchor="middle">Structure</text><text class="body" x="310" y="346" text-anchor="middle">Layered: vernacular primary, English</text><text class="body" x="310" y="374" text-anchor="middle">high schools, few universities</text><text class="body" x="610" y="346" text-anchor="middle">5-3-2-2 grade structure</text><text class="body" x="610" y="374" text-anchor="middle">(Sharif Commission, 1959)</text></g><line class="grid" x1="160" y1="70" x2="160" y2="390"/><line class="grid" x1="460" y1="70" x2="460" y2="390"/></g><g id="layer-labels"><text class="wm" x="768" y="413" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
