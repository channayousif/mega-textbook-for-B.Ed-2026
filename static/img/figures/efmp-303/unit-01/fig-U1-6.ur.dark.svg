<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آزادی سے پہلے اور بعد کی تعلیم</title><desc id="d">ایک جدول جو آزادی سے پہلے اور بعد کی تعلیم کا چار سطروں میں موازنہ کرتا ہے: مقصد، ذریعہ تعلیم، رسائی اور ڈھانچہ۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:10px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="420"/><rect class="panel-a" x="20" y="20" width="740" height="50" rx="6"/><text class="h" x="720" y="52" text-anchor="end">پہلو</text><text class="h" x="500" y="52" text-anchor="end">1947 سے پہلے</text><text class="h" x="240" y="52" text-anchor="end">1947 کے بعد</text><rect class="panel" x="20" y="80" width="740" height="70" rx="6"/><text class="sh" x="720" y="110" text-anchor="end">مقصد</text><text class="body" x="500" y="105" text-anchor="end">نوآبادیاتی حکومت کے لیے</text><text class="body" x="500" y="125" text-anchor="end">کلرک اور منتظمین</text><text class="body" x="500" y="145" text-anchor="end">پیدا کرنا</text><text class="body" x="240" y="105" text-anchor="end">قومی ترقی اور پڑھا</text><text class="body" x="240" y="125" text-anchor="end">ہوا شہری طبقہ</text><text class="body" x="240" y="145" text-anchor="end">تعمیر کرنا</text><rect class="panel" x="20" y="160" width="740" height="70" rx="6"/><text class="sh" x="720" y="190" text-anchor="end">زبان</text><text class="body" x="500" y="185" text-anchor="end">اعلیٰ تعلیم میں انگریزی؛</text><text class="body" x="500" y="205" text-anchor="end">ابتدائی سطح پر</text><text class="body" x="500" y="225" text-anchor="end">مقامی زبانیں</text><text class="body" x="240" y="185" text-anchor="end">اردو قومی زبان کے</text><text class="body" x="240" y="205" text-anchor="end">طور پر؛ انگریزی کا</text><text class="body" x="240" y="225" text-anchor="end">رتبہ برقرار</text><rect class="panel" x="20" y="240" width="740" height="70" rx="6"/><text class="sh" x="720" y="270" text-anchor="end">رسائی</text><text class="body" x="500" y="265" text-anchor="end">محدود؛ خواندگی تقریباً</text><text class="body" x="500" y="285" text-anchor="end">15 فیصد؛ شہری اور</text><text class="body" x="500" y="305" text-anchor="end">مردوں پر مرکوز</text><text class="body" x="240" y="265" text-anchor="end">وسیع؛ مفت اور لازمی</text><text class="body" x="240" y="285" text-anchor="end">ابتدائی تعلیم کا</text><text class="body" x="240" y="305" text-anchor="end">وعدہ</text><rect class="panel" x="20" y="320" width="740" height="70" rx="6"/><text class="sh" x="720" y="350" text-anchor="end">ڈھانچہ</text><text class="body" x="500" y="345" text-anchor="end">تہ در تہ: مقامی زبان کے</text><text class="body" x="500" y="365" text-anchor="end">ابتدائی، انگریزی ہائی</text><text class="body" x="500" y="385" text-anchor="end">اسکول، چند یونیورسٹیاں</text><text class="body" x="240" y="345" text-anchor="end">5 تا 3 تا 2 تا 2 درجاتی</text><text class="body" x="240" y="365" text-anchor="end">ڈھانچہ (شریف کمیشن،</text><text class="body" x="240" y="385" text-anchor="end">1959)</text><line class="grid" x1="540" y1="20" x2="540" y2="390"/><line class="grid" x1="280" y1="20" x2="280" y2="390"/><text class="wm" x="768" y="408" text-anchor="end" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></svg>
