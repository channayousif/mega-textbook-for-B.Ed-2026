<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Policy and planning compared</title><desc id="d">A diagram comparing policy and planning: policy is the "what", planning is the "how", connected by an arrow showing policy drives planning.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:18px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="60" y="80" width="280" height="280" rx="12"/><text class="h" x="200" y="130" text-anchor="middle">Policy</text><text class="sh" x="200" y="170" text-anchor="middle">The "what"</text><rect class="panel" x="90" y="200" width="220" height="40" rx="6"/><text class="body" x="200" y="225" text-anchor="middle">Sets goals and direction</text><rect class="panel" x="90" y="250" width="220" height="40" rx="6"/><text class="body" x="200" y="275" text-anchor="middle">States principles</text><rect class="panel" x="90" y="300" width="220" height="40" rx="6"/><text class="body" x="200" y="325" text-anchor="middle">Answers: what do we want?</text><defs><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><line class="stroke-a" x1="350" y1="220" x2="430" y2="220" marker-end="url(#arrow1)"/><text class="small" x="390" y="205" text-anchor="middle">drives</text><rect class="panel-a" x="440" y="80" width="280" height="280" rx="12"/><text class="h" x="580" y="130" text-anchor="middle">Planning</text><text class="sh" x="580" y="170" text-anchor="middle">The "how"</text><rect class="panel" x="470" y="200" width="220" height="40" rx="6"/><text class="body" x="580" y="225" text-anchor="middle">Works out actions and timeline</text><rect class="panel" x="470" y="250" width="220" height="40" rx="6"/><text class="body" x="580" y="275" text-anchor="middle">Allocates budget and resources</text><rect class="panel" x="470" y="300" width="220" height="40" rx="6"/><text class="body" x="580" y="325" text-anchor="middle">Answers: how, when, by whom?</text><rect class="panel" x="150" y="390" width="480" height="50" rx="8"/><text class="body" x="390" y="420" text-anchor="middle">Policy without planning stays on paper. Planning without policy has no direction.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
