<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی پالیسی کے اجزا</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں 'تعلیمی پالیسی' ہے اور اس کی شاخیں مقاصد، حکمتِ عملی، وسائل، نفاذ اور جانچ ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-policy-goals" class="stroke-a" x1="480" y1="200" x2="640" y2="130"/><line id="edge-policy-strategies" class="stroke-a" x1="300" y1="200" x2="140" y2="130"/><line id="edge-policy-resources" class="stroke-a" x1="480" y1="270" x2="640" y2="340"/><line id="edge-policy-implementation" class="stroke-a" x1="300" y1="270" x2="140" y2="340"/><line id="edge-policy-evaluation" class="stroke-a" x1="390" y1="295" x2="390" y2="370"/></g><g id="layer-nodes"><g id="node-policy"><ellipse class="panel-a" cx="390" cy="235" rx="120" ry="60"/><text class="h" x="390" y="228" text-anchor="middle">&#x200F;تعلیمی&#x200F;</text><text class="h" x="390" y="256" text-anchor="middle">&#x200F;پالیسی&#x200F;</text></g><g id="node-goals"><rect class="panel-a" x="540" y="60" width="200" height="70" rx="8"/><text class="sh" x="640" y="88" text-anchor="middle">&#x200F;مقاصد&#x200F;</text><text class="small" x="640" y="114" text-anchor="middle">&#x200F;ہم کیا حاصل کرنا چاہتے ہیں&#x200F;</text></g><g id="node-strategies"><rect class="panel-b" x="40" y="60" width="200" height="70" rx="8"/><text class="sh" x="140" y="88" text-anchor="middle">&#x200F;حکمتِ عملی&#x200F;</text><text class="small" x="140" y="114" text-anchor="middle">&#x200F;وسیع طریقے&#x200F;</text></g><g id="node-resources"><rect class="panel-a" x="540" y="340" width="200" height="70" rx="8"/><text class="sh" x="640" y="368" text-anchor="middle">&#x200F;وسائل&#x200F;</text><text class="small" x="640" y="394" text-anchor="middle">&#x200F;فنڈ، عملہ، مواد&#x200F;</text></g><g id="node-implementation"><rect class="panel-b" x="40" y="340" width="200" height="70" rx="8"/><text class="sh" x="140" y="368" text-anchor="middle">&#x200F;نفاذ&#x200F;</text><text class="small" x="140" y="394" text-anchor="middle">&#x200F;پالیسی کو عمل میں لانا&#x200F;</text></g><g id="node-evaluation"><rect class="panel-a" x="290" y="370" width="200" height="70" rx="8"/><text class="sh" x="390" y="398" text-anchor="middle">&#x200F;جانچ&#x200F;</text><text class="small" x="390" y="424" text-anchor="middle">&#x200F;کیا یہ کام کر گئی؟&#x200F;</text></g></g><g id="layer-labels"><text class="wm" x="12" y="463" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
