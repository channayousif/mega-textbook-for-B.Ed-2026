<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آزادی سے پہلے اور بعد کی تعلیم</title><desc id="d">ایک جدول جو آزادی سے پہلے اور بعد کی تعلیم کا چار سطروں میں موازنہ کرتا ہے: مقصد، ذریعہ تعلیم، رسائی اور ڈھانچہ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="420"/><g id="layer-regions"><rect class="panel-a" x="20" y="16" width="740" height="46" rx="6"/></g><g id="layer-edges"><line id="edge-rule-aspect-before" class="grid" x1="620" y1="16" x2="620" y2="392"/><line id="edge-rule-before-after" class="grid" x1="320" y1="16" x2="320" y2="392"/></g><g id="layer-nodes"><g id="node-header"><text class="h" x="690" y="45" text-anchor="middle">&#x200F;پہلو&#x200F;</text><text class="h" x="470" y="45" text-anchor="middle">&#x200F;1947 سے پہلے&#x200F;</text><text class="h" x="170" y="45" text-anchor="middle">&#x200F;1947 کے بعد&#x200F;</text></g><g id="node-purpose"><rect class="panel" x="20" y="70" width="740" height="74" rx="4"/><text class="sh" x="690" y="113" text-anchor="middle">&#x200F;مقصد&#x200F;</text><text class="body" x="470" y="100" text-anchor="middle">&#x200F;نوآبادیاتی حکومت کے لیے&#x200F;</text><text class="body" x="470" y="128" text-anchor="middle">&#x200F;کلرک اور منتظمین پیدا کرنا&#x200F;</text><text class="body" x="170" y="100" text-anchor="middle">&#x200F;قومی ترقی اور پڑھا ہوا&#x200F;</text><text class="body" x="170" y="128" text-anchor="middle">&#x200F;شہری طبقہ تعمیر کرنا&#x200F;</text></g><g id="node-language"><rect class="panel" x="20" y="152" width="740" height="74" rx="4"/><text class="sh" x="690" y="195" text-anchor="middle">&#x200F;زبان&#x200F;</text><text class="body" x="470" y="182" text-anchor="middle">&#x200F;اعلیٰ تعلیم میں انگریزی؛&#x200F;</text><text class="body" x="470" y="210" text-anchor="middle">&#x200F;ابتدائی سطح پر مقامی زبانیں&#x200F;</text><text class="body" x="170" y="182" text-anchor="middle">&#x200F;اردو قومی زبان کے طور پر؛&#x200F;</text><text class="body" x="170" y="210" text-anchor="middle">&#x200F;انگریزی کا رتبہ برقرار&#x200F;</text></g><g id="node-access"><rect class="panel" x="20" y="234" width="740" height="74" rx="4"/><text class="sh" x="690" y="277" text-anchor="middle">&#x200F;رسائی&#x200F;</text><text class="body" x="470" y="264" text-anchor="middle">&#x200F;محدود؛ خواندگی تقریباً 15&#x200F;</text><text class="body" x="470" y="292" text-anchor="middle">&#x200F;فیصد؛ شہری اور مردوں پر مرکوز&#x200F;</text><text class="body" x="170" y="264" text-anchor="middle">&#x200F;وسیع؛ مفت اور لازمی&#x200F;</text><text class="body" x="170" y="292" text-anchor="middle">&#x200F;ابتدائی تعلیم کا وعدہ&#x200F;</text></g><g id="node-structure"><rect class="panel" x="20" y="316" width="740" height="74" rx="4"/><text class="sh" x="690" y="359" text-anchor="middle">&#x200F;ڈھانچہ&#x200F;</text><text class="body" x="470" y="346" text-anchor="middle">&#x200F;تہ در تہ: مقامی زبان کے ابتدائی،&#x200F;</text><text class="body" x="470" y="374" text-anchor="middle">&#x200F;انگریزی ہائی اسکول، چند یونیورسٹیاں&#x200F;</text><text class="body" x="170" y="346" text-anchor="middle">&#x200F;5 تا 3 تا 2 تا 2 درجاتی&#x200F;</text><text class="body" x="170" y="374" text-anchor="middle">&#x200F;ڈھانچہ (شریف کمیشن، 1959)&#x200F;</text></g><line class="grid" x1="620" y1="70" x2="620" y2="390"/><line class="grid" x1="320" y1="70" x2="320" y2="390"/></g><g id="layer-labels"><text class="wm" x="12" y="413" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
