<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Elements of educational policy</title><desc id="d">A concept map placing "educational policy" at the centre with branches for goals, strategies, resources, implementation and evaluation.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .node-centre{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="node-centre" cx="390" cy="235" rx="120" ry="55"/><text class="h" x="390" y="230" text-anchor="middle">Educational</text><text class="h" x="390" y="250" text-anchor="middle">Policy</text><rect class="panel-a" x="50" y="60" width="160" height="55" rx="8"/><text class="sh" x="130" y="85" text-anchor="middle">Goals</text><text class="small" x="130" y="102" text-anchor="middle">What we aim to achieve</text><line class="stroke-a" x1="210" y1="87" x2="270" y2="210"/><rect class="panel-b" x="560" y="60" width="170" height="55" rx="8"/><text class="sh" x="645" y="85" text-anchor="middle">Strategies</text><text class="small" x="645" y="102" text-anchor="middle">Broad approaches</text><line class="stroke-a" x1="560" y1="87" x2="510" y2="210"/><rect class="panel-a" x="30" y="350" width="170" height="55" rx="8"/><text class="sh" x="115" y="375" text-anchor="middle">Resources</text><text class="small" x="115" y="392" text-anchor="middle">Funding, staff, materials</text><line class="stroke-a" x1="200" y1="377" x2="300" y2="270"/><rect class="panel-b" x="570" y="350" width="180" height="55" rx="8"/><text class="sh" x="660" y="375" text-anchor="middle">Implementation</text><text class="small" x="660" y="392" text-anchor="middle">Putting policy into practice</text><line class="stroke-a" x1="570" y1="377" x2="480" y2="270"/><rect class="panel-a" x="300" y="410" width="180" height="50" rx="8"/><text class="sh" x="390" y="432" text-anchor="middle">Evaluation</text><text class="small" x="390" y="450" text-anchor="middle">Did it work?</text><line class="stroke-a" x1="390" y1="410" x2="390" y2="290"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
