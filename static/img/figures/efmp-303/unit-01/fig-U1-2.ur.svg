<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پالیسی اور منصوبہ بندی کا موازنہ</title><desc id="d">ایک خاکہ جو پالیسی اور منصوبہ بندی کا موازنہ کرتا ہے: پالیسی 'کیا' ہے اور منصوبہ بندی 'کیسے'، اور ایک تیر دکھاتا ہے کہ پالیسی منصوبہ بندی کو چلاتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><line id="edge-policy-planning" class="stroke-a" x1="460" y1="200" x2="320" y2="200" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-policy"><rect class="panel-a" x="460" y="40" width="280" height="320" rx="12"/><text class="h" x="600" y="84" text-anchor="middle">&#x200F;پالیسی&#x200F;</text><text class="sh" x="600" y="128" text-anchor="middle">&#x200F;"کیا"&#x200F;</text><rect class="panel" x="480" y="160" width="240" height="48" rx="6"/><text class="body" x="600" y="189" text-anchor="middle">&#x200F;مقاصد اور سمت طے کرتی ہے&#x200F;</text><rect class="panel" x="480" y="224" width="240" height="48" rx="6"/><text class="body" x="600" y="253" text-anchor="middle">&#x200F;اصول بیان کرتی ہے&#x200F;</text><rect class="panel" x="480" y="288" width="240" height="48" rx="6"/><text class="body" x="600" y="317" text-anchor="middle">&#x200F;جواب: ہم کیا چاہتے ہیں؟&#x200F;</text></g><g id="node-planning"><rect class="panel-b" x="40" y="40" width="280" height="320" rx="12"/><text class="h" x="180" y="84" text-anchor="middle">&#x200F;منصوبہ بندی&#x200F;</text><text class="sh" x="180" y="128" text-anchor="middle">&#x200F;"کیسے"&#x200F;</text><rect class="panel" x="60" y="160" width="240" height="48" rx="6"/><text class="body" x="180" y="189" text-anchor="middle">&#x200F;اقدامات اور وقت کی حد طے کرتی ہے&#x200F;</text><rect class="panel" x="60" y="224" width="240" height="48" rx="6"/><text class="body" x="180" y="253" text-anchor="middle">&#x200F;بجٹ اور وسائل مقرر کرتی ہے&#x200F;</text><rect class="panel" x="60" y="288" width="240" height="48" rx="6"/><text class="body" x="180" y="317" text-anchor="middle">&#x200F;جواب: کیسے، کب، کس کے ذریعے؟&#x200F;</text></g><g id="node-summary"><rect class="panel" x="140" y="376" width="500" height="66" rx="8"/><text class="body" x="390" y="402" text-anchor="middle">&#x200F;منصوبہ بندی کے بغیر پالیسی کاغذ پر رہ جاتی ہے۔&#x200F;</text><text class="body" x="390" y="428" text-anchor="middle">&#x200F;پالیسی کے بغیر منصوبہ بندی کی کوئی سمت نہیں۔&#x200F;</text></g></g><g id="layer-labels"><text class="small" x="390" y="186" text-anchor="middle">&#x200F;چلاتی ہے&#x200F;</text><text class="wm" x="12" y="463" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
