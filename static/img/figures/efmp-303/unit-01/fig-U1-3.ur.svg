<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم، سماج اور ترقی</title><desc id="d">ایک مثلثی خاکہ جس کے تین کونوں پر تعلیم، سماج اور ترقی ہیں، ہر جوڑے کے درمیان دو طرفہ تیر ہیں، اور ہر تیر پر لکھا ہے کہ ایک دوسرے پر کیسے اثر ڈالتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3;}
text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);}
.body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;}
.ah{fill:var(--a1);} .node{fill:var(--a1);} .node-end{fill:var(--a3);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g id="layer-regions"></g><g id="layer-edges"><line id="edge-education-society" class="stroke-a" x1="460" y1="120" x2="600" y2="320" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-education-development" class="stroke-a" x1="320" y1="120" x2="180" y2="320" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-society-development" class="stroke-a" x1="520" y1="360" x2="260" y2="360" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-education"><rect class="panel-a" x="280" y="40" width="220" height="80" rx="10"/><text class="h" x="390" y="72" text-anchor="middle">&#x200F;تعلیم&#x200F;</text><text class="small" x="390" y="102" text-anchor="middle">&#x200F;علم، مہارتیں، اقدار&#x200F;</text></g><g id="node-society"><rect class="panel-a" x="520" y="320" width="220" height="80" rx="10"/><text class="h" x="630" y="352" text-anchor="middle">&#x200F;سماج&#x200F;</text><text class="small" x="630" y="382" text-anchor="middle">&#x200F;روایات، توقعات، حالات&#x200F;</text></g><g id="node-development"><rect class="panel-a" x="40" y="320" width="220" height="80" rx="10"/><text class="h" x="150" y="352" text-anchor="middle">&#x200F;ترقی&#x200F;</text><text class="small" x="150" y="382" text-anchor="middle">&#x200F;بہتر حالاتِ زندگی&#x200F;</text></g></g><g id="layer-labels"><text class="small" x="556" y="204" text-anchor="start">&#x200F;طلب کو شکل دیتا ہے&#x200F;</text><text class="small" x="556" y="232" text-anchor="start">&#x200F;روایات بدلتی ہے&#x200F;</text><text class="small" x="224" y="204" text-anchor="end">&#x200F;انسانی سرمایہ&#x200F;</text><text class="small" x="224" y="232" text-anchor="end">&#x200F;بناتی ہے&#x200F;</text><text class="small" x="448" y="342" text-anchor="middle">&#x200F;تناظر دیتا ہے&#x200F;</text><text class="small" x="332" y="388" text-anchor="middle">&#x200F;وسائل دیتی ہے&#x200F;</text><text class="small" x="390" y="258" text-anchor="middle">&#x200F;باہمی اثر:&#x200F;</text><text class="small" x="390" y="288" text-anchor="middle">&#x200F;ہر ایک باقی دونوں کو شکل دیتا ہے&#x200F;</text><text class="wm" x="12" y="463" text-anchor="start" aria-hidden="true" direction="ltr" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">textbook.com.pk</text></g></svg>
