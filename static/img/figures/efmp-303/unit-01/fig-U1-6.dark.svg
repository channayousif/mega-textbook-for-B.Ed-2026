<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Education before and after independence</title><desc id="d">A table comparing education before and after independence across four rows: purpose, language of instruction, access, and structure.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="420"/><rect class="panel-a" x="20" y="20" width="740" height="50" rx="6"/><text class="h" x="60" y="52">Aspect</text><text class="h" x="280" y="52">Before 1947</text><text class="h" x="540" y="52">After 1947</text><rect class="panel" x="20" y="80" width="740" height="70" rx="6"/><text class="sh" x="60" y="110">Purpose</text><text class="body" x="280" y="105">Produce clerks and</text><text class="body" x="280" y="125">administrators for the</text><text class="body" x="280" y="145">colonial government</text><text class="body" x="540" y="105">Build national</text><text class="body" x="540" y="125">development and an</text><text class="body" x="540" y="145">educated citizenry</text><rect class="panel" x="20" y="160" width="740" height="70" rx="6"/><text class="sh" x="60" y="190">Language</text><text class="body" x="280" y="185">English for higher</text><text class="body" x="280" y="205">education; vernacular</text><text class="body" x="280" y="225">at primary level</text><text class="body" x="540" y="185">Urdu promoted as</text><text class="body" x="540" y="205">national language;</text><text class="body" x="540" y="225">English retains prestige</text><rect class="panel" x="20" y="240" width="740" height="70" rx="6"/><text class="sh" x="60" y="270">Access</text><text class="body" x="280" y="265">Narrow; literacy</text><text class="body" x="280" y="285">around 15 per cent;</text><text class="body" x="280" y="305">urban and male focused</text><text class="body" x="540" y="265">Expanded; free and</text><text class="body" x="540" y="285">compulsory primary</text><text class="body" x="540" y="305">education promised</text><rect class="panel" x="20" y="320" width="740" height="70" rx="6"/><text class="sh" x="60" y="350">Structure</text><text class="body" x="280" y="345">Layered: vernacular</text><text class="body" x="280" y="365">primary, English high</text><text class="body" x="280" y="385">schools, few universities</text><text class="body" x="540" y="345">5-3-2-2 grade</text><text class="body" x="540" y="365">structure (Sharif</text><text class="body" x="540" y="385">Commission, 1959)</text><line class="grid" x1="240" y1="20" x2="240" y2="390"/><line class="grid" x1="500" y1="20" x2="500" y2="390"/><text class="wm" x="768" y="408" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
