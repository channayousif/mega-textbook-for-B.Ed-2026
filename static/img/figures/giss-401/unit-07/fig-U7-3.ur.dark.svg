<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول میں اخلاقی فیصلے کا فلو چارٹ</title><desc id="d">فلو چارٹ: اسکول میں اخلاقی فیصلے کے پانچ مرحلے۔ مسئلہ اور متاثرہ افراد پہچانیں، قرآن، سنت اور اسکول کے قواعد سے اصول دیکھیں، ہیڈ ٹیچر یا کسی بااعتماد ساتھی جیسے لوگوں سے مشورہ کریں، عمل کریں، پھر غور کریں۔ اگر عمل سے امانت نہ نبھی ہو تو ایک تیر واپس آغاز کی طرف جاتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="360"/><rect class="panel-a" x="628" y="70" width="128" height="150" rx="10"/><line class="stroke" x1="626" y1="145.0" x2="605" y2="145.0" marker-end="url(#arrow)"/><rect class="panel" x="475" y="70" width="128" height="150" rx="10"/><line class="stroke" x1="473" y1="145.0" x2="452" y2="145.0" marker-end="url(#arrow)"/><rect class="panel" x="322" y="70" width="128" height="150" rx="10"/><line class="stroke" x1="320" y1="145.0" x2="299" y2="145.0" marker-end="url(#arrow)"/><rect class="panel" x="169" y="70" width="128" height="150" rx="10"/><line class="stroke" x1="167" y1="145.0" x2="146" y2="145.0" marker-end="url(#arrow)"/><rect class="panel-a" x="16" y="70" width="128" height="150" rx="10"/><path class="stroke" d="M80 222 L80 270 L692 270 L692 226" marker-end="url(#arrow)"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">موضوع 7.1: اسکول میں اخلاقی فیصلہ</tspan></text><text class="row" x="692" y="98" text-anchor="middle"><tspan x="692" dy="0">‏1. پہچانیں</tspan></text><text class="ink" x="692" y="130" text-anchor="middle"><tspan x="692" dy="0">کیا ہو رہا ہے؟</tspan><tspan x="692" dy="24">کس کی امانت</tspan><tspan x="692" dy="24">داؤ پر ہے؟</tspan></text><text class="row" x="539" y="98" text-anchor="middle"><tspan x="539" dy="0">‏2. اصولوں سے</tspan><tspan x="539" dy="23">رجوع</tspan></text><text class="ink" x="539" y="148" text-anchor="middle"><tspan x="539" dy="0">قرآن، سنت</tspan><tspan x="539" dy="24">اور اسکول کے</tspan><tspan x="539" dy="24">جائز قواعد</tspan></text><text class="row" x="386" y="98" text-anchor="middle"><tspan x="386" dy="0">‏3. لوگوں سے</tspan><tspan x="386" dy="23">مشورہ</tspan></text><text class="ink" x="386" y="148" text-anchor="middle"><tspan x="386" dy="0">ہیڈ ٹیچر یا</tspan><tspan x="386" dy="24">بااعتماد ساتھی</tspan><tspan x="386" dy="24">‏(شوریٰ)‏</tspan></text><text class="row" x="233" y="98" text-anchor="middle"><tspan x="233" dy="0">‏4. عمل</tspan></text><text class="ink" x="233" y="130" text-anchor="middle"><tspan x="233" dy="0">نرمی اور کھلے</tspan><tspan x="233" dy="24">طور پر امانت</tspan><tspan x="233" dy="24">نبھائیں</tspan></text><text class="row" x="80" y="98" text-anchor="middle"><tspan x="80" dy="0">‏5. غور</tspan></text><text class="ink" x="80" y="130" text-anchor="middle"><tspan x="80" dy="0">کیا امانت نبھی؟</tspan><tspan x="80" dy="24">اگلی بار</tspan><tspan x="80" dy="24">کیا مختلف؟</tspan></text><text class="ink" x="390" y="298" text-anchor="middle"><tspan x="390" dy="0">اگر امانت نہ نبھی ہو، یا مسئلہ باقی ہو، تو مرحلوں سے دوبارہ گزریں۔</tspan></text><text class="muted" x="756" y="330" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">مرحلہ 2 اور 3 عمل سے پہلے آتے ہیں: پہلے اصول، پھر لوگ۔</tspan></text><text class="wm" x="12" y="350" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
