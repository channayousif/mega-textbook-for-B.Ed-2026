<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد کی امانت کے چار دائروں کا تصوراتی نقشہ</title><desc id="d">تصوراتی نقشہ: مرکز میں استاد کی امانت ہے، جو ان چار گروہوں سے جڑی ہے جن کے سامنے استاد ذمہ دار ہے: شاگرد، ساتھی اساتذہ، والدین اور ادارہ۔ ہر گروہ کے ساتھ اس کے واجب فرائض کی دو مثالیں ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><line class="stroke" x1="442" y1="226" x2="580" y2="144" marker-end="url(#arrow)"/><line class="stroke" x1="338" y1="226" x2="200" y2="144" marker-end="url(#arrow)"/><line class="stroke" x1="442" y1="298" x2="580" y2="392" marker-end="url(#arrow)"/><line class="stroke" x1="338" y1="298" x2="200" y2="392" marker-end="url(#arrow)"/><rect class="panel" x="524" y="52" width="220" height="92" rx="10"/><rect class="panel" x="36" y="52" width="220" height="92" rx="10"/><rect class="panel" x="524" y="392" width="220" height="92" rx="10"/><rect class="panel" x="36" y="392" width="220" height="92" rx="10"/><rect class="panel-a" x="270" y="226" width="240" height="72" rx="14"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">موضوع 7.1: استاد کی امانت کے چار دائرے</tspan></text><text class="row" x="634" y="76" text-anchor="middle"><tspan x="634" dy="0">شاگرد</tspan></text><text class="ink" x="634" y="104" text-anchor="middle"><tspan x="634" dy="0">تیار شدہ سبق، منصفانہ</tspan><tspan x="634" dy="23">نمبر دہی</tspan></text><text class="row" x="146" y="76" text-anchor="middle"><tspan x="146" dy="0">ساتھی اساتذہ</tspan></text><text class="ink" x="146" y="104" text-anchor="middle"><tspan x="146" dy="0">کام کی منصفانہ تقسیم،‏</tspan><tspan x="146" dy="23">افواہ کی تصدیق</tspan></text><text class="row" x="634" y="416" text-anchor="middle"><tspan x="634" dy="0">والدین</tspan></text><text class="ink" x="634" y="444" text-anchor="middle"><tspan x="634" dy="0">دیانت دارانہ رپورٹ، رعایت</tspan><tspan x="634" dy="23">کے لیے تحفہ نہیں</tspan></text><text class="row" x="146" y="416" text-anchor="middle"><tspan x="146" dy="0">ادارہ</tspan></text><text class="ink" x="146" y="444" text-anchor="middle"><tspan x="146" dy="0">وقت کی پابندی، اسکول کی</tspan><tspan x="146" dy="23">املاک کی حفاظت</tspan></text><text class="h" x="390" y="254" text-anchor="middle"><tspan x="390" dy="0">استاد کی امانت</tspan><tspan x="390" dy="23">‏(سونپی ہوئی ذمہ داری)‏</tspan></text><text class="muted" x="756" y="512" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">امانتیں ان کے حق داروں کو لوٹا دو (4:58)۔ ہر دائرے کا ایک مخصوص حق ہے۔</tspan></text><text class="wm" x="12" y="530" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
