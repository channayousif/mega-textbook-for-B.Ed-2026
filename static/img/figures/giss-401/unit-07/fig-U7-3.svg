<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of an ethical decision in school</title><desc id="d">Flowchart of an ethical decision in school in five steps: identify the issue and who is affected, consult principles from the Qur'an, Sunnah and school rules, consult people such as the head or a trusted colleague, act, then reflect, with a loop back to the start if the action did not keep the trust.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="360"/><text class="h" x="24" y="32">7.1 An ethical decision in school</text><rect class="panel-a" x="24" y="70" width="128" height="150" rx="10"/><text class="row" x="88.0" y="98" text-anchor="middle">1. Identify</text><text class="ink" x="88.0" y="123" text-anchor="middle">What is<tspan x="88.0" dy="17">happening?</tspan><tspan x="88.0" dy="17">Whose trust</tspan><tspan x="88.0" dy="17">is at stake?</tspan></text><line class="stroke" x1="154" y1="145.0" x2="175" y2="145.0" marker-end="url(#arrow)"/><rect class="panel" x="177" y="70" width="128" height="150" rx="10"/><text class="row" x="241.0" y="98" text-anchor="middle">2. Consult<tspan x="241.0" dy="17">principles</tspan></text><text class="ink" x="241.0" y="140" text-anchor="middle">Qur'an,<tspan x="241.0" dy="17">Sunnah and</tspan><tspan x="241.0" dy="17">the school's</tspan><tspan x="241.0" dy="17">lawful rules</tspan></text><line class="stroke" x1="307" y1="145.0" x2="328" y2="145.0" marker-end="url(#arrow)"/><rect class="panel" x="330" y="70" width="128" height="150" rx="10"/><text class="row" x="394.0" y="98" text-anchor="middle">3. Consult<tspan x="394.0" dy="17">people</tspan></text><text class="ink" x="394.0" y="140" text-anchor="middle">the head or a<tspan x="394.0" dy="17">trusted</tspan><tspan x="394.0" dy="17">colleague</tspan><tspan x="394.0" dy="17">(shura)</tspan></text><line class="stroke" x1="460" y1="145.0" x2="481" y2="145.0" marker-end="url(#arrow)"/><rect class="panel" x="483" y="70" width="128" height="150" rx="10"/><text class="row" x="547.0" y="98" text-anchor="middle">4. Act</text><text class="ink" x="547.0" y="123" text-anchor="middle">keep the<tspan x="547.0" dy="17">trust, kindly</tspan><tspan x="547.0" dy="17">and openly</tspan></text><line class="stroke" x1="613" y1="145.0" x2="634" y2="145.0" marker-end="url(#arrow)"/><rect class="panel-a" x="636" y="70" width="128" height="150" rx="10"/><text class="row" x="700.0" y="98" text-anchor="middle">5. Reflect</text><text class="ink" x="700.0" y="123" text-anchor="middle">Was the trust<tspan x="700.0" dy="17">kept? What</tspan><tspan x="700.0" dy="17">next time?</tspan></text><path class="stroke" d="M700.0,222 L700.0,270 L88.0,270 L88.0,226" marker-end="url(#arrow)"/><text class="ink" x="390" y="296" text-anchor="middle">If the trust was not kept, or the problem remains, go round the steps again.</text><text class="muted" x="24" y="326">Steps 2 and 3 come before acting: principles first, then people.</text><text class="wm" x="768" y="350" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
