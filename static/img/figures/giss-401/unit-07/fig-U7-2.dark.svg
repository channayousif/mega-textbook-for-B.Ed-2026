<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 426" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of Islamic values in school leadership</title><desc id="d">Table of five Islamic values in school leadership, justice, consultation, trustworthiness, mercy and accountability, each paired with a school decision that shows the value in practice.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="426"/><text class="h" x="24" y="32">7.1 Islamic values in school leadership</text><rect class="panel-a" x="24" y="56" width="732" height="36"/><text class="row" x="32" y="79">Value</text><text class="row" x="222" y="79">Reference</text><text class="row" x="352" y="79">A school decision that shows it</text><rect class="panel" x="24" y="92" width="732" height="54"/><text class="row" x="32" y="116">Justice (adl)</text><text class="ink" x="222" y="116">16:90; 4:135</text><text class="ink" x="352" y="116">Duties are shared by one clear rule, the same<tspan x="352" dy="17">for the head's own relatives</tspan></text><rect class="panel" x="24" y="146" width="732" height="54"/><text class="row" x="32" y="170">Consultation (shura)</text><text class="ink" x="222" y="170">42:38; 3:159</text><text class="ink" x="352" y="170">Teachers are asked for their views before the<tspan x="352" dy="17">exam timetable is fixed</tspan></text><rect class="panel" x="24" y="200" width="732" height="54"/><text class="row" x="32" y="224">Trustworthiness</text><text class="ink" x="222" y="224">28:26; 4:58</text><text class="ink" x="352" y="224">School council funds are spent as agreed, and<tspan x="352" dy="17">the accounts are shown to the council</tspan></text><rect class="panel" x="24" y="254" width="732" height="54"/><text class="row" x="32" y="278">Mercy</text><text class="ink" x="222" y="278">3:159</text><text class="ink" x="352" y="278">A teacher with a pressing family<tspan x="352" dy="17">circumstance gets a lighter week;</tspan></text><rect class="panel" x="24" y="308" width="732" height="54"/><text class="row" x="32" y="332">Accountability</text><text class="ink" x="222" y="332">Bukhari 893</text><text class="ink" x="352" y="332">The head admits a timetable error in the staff<tspan x="352" dy="17">meeting and corrects it</tspan></text><line class="grid" x1="214" y1="56" x2="214" y2="362"/><line class="grid" x1="344" y1="56" x2="344" y2="362"/><text class="muted" x="24" y="392">Leadership is a trust held for service: each value shows in how a decision is made.</text><text class="wm" x="768" y="416" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
