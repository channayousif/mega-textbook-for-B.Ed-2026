<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the four circles of a teacher's amanah</title><desc id="d">Concept map with the teacher's amanah at the centre, linked to four groups the teacher is responsible to: learners, colleagues, parents and the institution, each with two examples of the duties owed.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="32">7.1 The four circles of a teacher's amanah</text><line class="stroke" x1="338" y1="226" x2="200" y2="144" marker-end="url(#arrow)"/><line class="stroke" x1="442" y1="226" x2="580" y2="144" marker-end="url(#arrow)"/><line class="stroke" x1="338" y1="298" x2="200" y2="392" marker-end="url(#arrow)"/><line class="stroke" x1="442" y1="298" x2="580" y2="392" marker-end="url(#arrow)"/><rect class="panel" x="36" y="52" width="220" height="92" rx="10"/><text class="row" x="146.0" y="80" text-anchor="middle">Learners</text><text class="ink" x="146.0" y="102" text-anchor="middle">prepared lessons, fair<tspan x="146.0" dy="17">marking</tspan></text><rect class="panel" x="524" y="52" width="220" height="92" rx="10"/><text class="row" x="634.0" y="80" text-anchor="middle">Colleagues</text><text class="ink" x="634.0" y="102" text-anchor="middle">fair share of work,<tspan x="634.0" dy="17">check rumours</tspan></text><rect class="panel" x="36" y="392" width="220" height="92" rx="10"/><text class="row" x="146.0" y="420" text-anchor="middle">Parents</text><text class="ink" x="146.0" y="442" text-anchor="middle">honest reports, no<tspan x="146.0" dy="17">gifts for favour</tspan></text><rect class="panel" x="524" y="392" width="220" height="92" rx="10"/><text class="row" x="634.0" y="420" text-anchor="middle">The institution</text><text class="ink" x="634.0" y="442" text-anchor="middle">punctuality, care of<tspan x="634.0" dy="17">school property</tspan></text><rect class="panel-a" x="270" y="226" width="240" height="72" rx="14"/><text class="h" x="390" y="256" text-anchor="middle">The teacher's amanah<tspan x="390" dy="20">(trust)</tspan></text><text class="muted" x="24" y="508">Render trusts to whom they are due (4:58). Each circle is owed something specific.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
