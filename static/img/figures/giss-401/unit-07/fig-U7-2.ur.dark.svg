<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 426" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کی قیادت میں اسلامی اقدار کا جدول</title><desc id="d">جدول: اسکول کی قیادت میں پانچ اسلامی اقدار، یعنی عدل، مشاورت، امانت داری، رحم اور جواب دہی۔ ہر قدر کے ساتھ اسکول کا ایک ایسا فیصلہ ہے جو اسے عملی طور پر دکھاتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="426"/><rect class="panel-a" x="24" y="56" width="732" height="36"/><rect class="panel" x="24" y="92" width="732" height="54"/><rect class="panel" x="24" y="146" width="732" height="54"/><rect class="panel" x="24" y="200" width="732" height="54"/><rect class="panel" x="24" y="254" width="732" height="54"/><rect class="panel" x="24" y="308" width="732" height="54"/><line class="grid" x1="566" y1="56" x2="566" y2="362"/><line class="grid" x1="436" y1="56" x2="436" y2="362"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">موضوع 7.1: اسکول کی قیادت میں اسلامی اقدار</tspan></text><text class="row" x="748" y="79" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">قدر</tspan></text><text class="row" x="558" y="79" text-anchor="end"><tspan x="558" dy="0" text-anchor="end">حوالہ</tspan></text><text class="row" x="428" y="79" text-anchor="end"><tspan x="428" dy="0" text-anchor="end">اسکول کا فیصلہ جو اسے دکھاتا ہے</tspan></text><text class="row" x="748" y="114" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">انصاف (عدل)‏</tspan></text><text class="ink" x="558" y="114" text-anchor="end"><tspan x="558" dy="0" text-anchor="end">‏16:90؛ 4:135</tspan></text><text class="ink" x="428" y="114" text-anchor="end"><tspan x="428" dy="0" text-anchor="end">ڈیوٹیاں ایک واضح قاعدے سے بٹتی ہیں، ہیڈ ٹیچر</tspan><tspan x="428" dy="22" text-anchor="end">کے اپنے رشتہ داروں کے لیے بھی یہی قاعدہ</tspan></text><text class="row" x="748" y="168" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">مشاورت (شوریٰ)‏</tspan></text><text class="ink" x="558" y="168" text-anchor="end"><tspan x="558" dy="0" text-anchor="end">‏42:38؛ 3:159</tspan></text><text class="ink" x="428" y="168" text-anchor="end"><tspan x="428" dy="0" text-anchor="end">امتحانی ٹائم ٹیبل طے ہونے سے پہلے اساتذہ سے</tspan><tspan x="428" dy="22" text-anchor="end">ان کی رائے پوچھی جاتی ہے</tspan></text><text class="row" x="748" y="222" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">امانت داری</tspan></text><text class="ink" x="558" y="222" text-anchor="end"><tspan x="558" dy="0" text-anchor="end">‏28:26؛ 4:58</tspan></text><text class="ink" x="428" y="222" text-anchor="end"><tspan x="428" dy="0" text-anchor="end">اسکول کونسل کے فنڈز طے شدہ طریقے سے خرچ</tspan><tspan x="428" dy="22" text-anchor="end">ہوتے ہیں، اور حساب کونسل کو دکھایا جاتا ہے</tspan></text><text class="row" x="748" y="276" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">رحم</tspan></text><text class="ink" x="558" y="276" text-anchor="end"><tspan x="558" dy="0" text-anchor="end">‏3:159</tspan></text><text class="ink" x="428" y="276" text-anchor="end"><tspan x="428" dy="0" text-anchor="end">کسی اہم خاندانی مجبوری میں مبتلا استاد کو</tspan><tspan x="428" dy="22" text-anchor="end">ہلکا ہفتہ ملتا ہے؛ تفصیل راز میں رہتی ہے</tspan></text><text class="row" x="748" y="330" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">جواب دہی</tspan></text><text class="ink" x="558" y="330" text-anchor="end"><tspan x="558" dy="0" text-anchor="end">بخاری 893</tspan></text><text class="ink" x="428" y="330" text-anchor="end"><tspan x="428" dy="0" text-anchor="end">ہیڈ ٹیچر عملے کے اجلاس میں ٹائم ٹیبل کی غلطی</tspan><tspan x="428" dy="22" text-anchor="end">مان کر اسے درست کرتے ہیں</tspan></text><text class="muted" x="756" y="396" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">قیادت خدمت کے لیے رکھی گئی امانت ہے: ہر قدر اس میں ظاہر ہوتی ہے کہ فیصلہ کیسے کیا جاتا ہے۔</tspan></text><text class="wm" x="12" y="416" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
