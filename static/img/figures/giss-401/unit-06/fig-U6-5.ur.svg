<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 446" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جزوی موازنہ حجۃ الوداع کے منتخب تحفظات کو جدید حقوق کے موضوعات سے جوڑتا ہے؛ ساتھ واضح کرتا ہے کہ مصادر اور قانونی نظام مختلف ہیں۔</title><desc id="d">جزوی موازنہ حجۃ الوداع کے منتخب تحفظات کو جدید حقوق کے موضوعات سے جوڑتا ہے؛ ساتھ واضح کرتا ہے کہ مصادر اور قانونی نظام مختلف ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="446" /><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">حقوق کی منتخب مماثلتیں: الگ متون اور نظام</tspan></text><rect x="510" y="55" width="246" height="48" rx="8" class="accent" /><text x="744" y="85" class="h" text-anchor="end"><tspan x="744" dy="0">حج کی روایت</tspan></text><rect x="264" y="55" width="246" height="48" rx="8" class="accent" /><text x="498" y="85" class="h" text-anchor="end"><tspan x="498" dy="0">جدید موضوع</tspan></text><rect x="24" y="55" width="240" height="48" rx="8" class="accent" /><text x="252" y="85" class="h" text-anchor="end"><tspan x="252" dy="0">حد</tspan></text><rect x="510" y="103" width="246" height="85" rx="8" class="panel" /><text x="744" y="129" text-anchor="end"><tspan x="744" dy="0">جان کا تحفظ</tspan></text><rect x="264" y="103" width="246" height="85" rx="8" class="panel" /><text x="498" y="129" text-anchor="end"><tspan x="498" dy="0">UDHR 3: زندگی اور سلامتی</tspan></text><rect x="24" y="103" width="240" height="85" rx="8" class="panel" /><text x="252" y="129" text-anchor="end"><tspan x="252" dy="0">متعلقہ فکر؛ وسیع</tspan><tspan x="252" dy="32">جدید الفاظ</tspan></text><rect x="510" y="188" width="246" height="85" rx="8" class="panel" /><text x="744" y="214" text-anchor="end"><tspan x="744" dy="0">مال کا تحفظ</tspan></text><rect x="264" y="188" width="246" height="85" rx="8" class="panel" /><text x="498" y="214" text-anchor="end"><tspan x="498" dy="0">UDHR 17: ملکیت</tspan></text><rect x="24" y="188" width="240" height="85" rx="8" class="panel" /><text x="252" y="214" text-anchor="end"><tspan x="252" dy="0">حقوق کی الگ</tspan><tspan x="252" dy="32">صورت بندی</tspan></text><rect x="510" y="273" width="246" height="85" rx="8" class="panel" /><text x="744" y="299" text-anchor="end"><tspan x="744" dy="0">عورتوں کے لیے فرائض؛</tspan><tspan x="744" dy="32">نان و نفقہ</tspan></text><rect x="264" y="273" width="246" height="85" rx="8" class="panel" /><text x="498" y="299" text-anchor="end"><tspan x="498" dy="0">UDHR 1-2: مساوی وقار؛</tspan><tspan x="498" dy="32">عدم امتیاز</tspan></text><rect x="24" y="273" width="240" height="85" rx="8" class="panel" /><text x="252" y="299" text-anchor="end"><tspan x="252" dy="0">جزوی موازنہ؛ یکساں</tspan><tspan x="252" dy="32">شقیں نہیں</tspan></text><text x="756" y="388" class="support" text-anchor="end"><tspan x="756" dy="0">مصادر: صحیح مسلم ⁦1218a⁩؛ ⁦UDHR⁩۔ موازنہ قانونی برابری نہیں۔</tspan></text><text class="wm" x="12" y="434" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
