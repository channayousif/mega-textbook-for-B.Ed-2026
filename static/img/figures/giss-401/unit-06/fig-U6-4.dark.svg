<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three selected scholars are linked to mathematical or astronomical contributions, with evidence and collaborative settings shown alongside their names</title><desc id="d">Three selected scholars are linked to mathematical or astronomical contributions, with evidence and collaborative settings shown alongside their names.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="446"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Selected Muslim scholars: contributions and evidence</tspan></text><rect x="24" y="55" width="216" height="48" rx="8" class="accent"/><text x="36" y="85" class="h" text-anchor="start"><tspan x="36" dy="0">Scholar / setting</tspan></text><rect x="240" y="55" width="310" height="48" rx="8" class="accent"/><text x="252" y="85" class="h" text-anchor="start"><tspan x="252" dy="0">Field and contribution</tspan></text><rect x="550" y="55" width="206" height="48" rx="8" class="accent"/><text x="562" y="85" class="h" text-anchor="start"><tspan x="562" dy="0">Evidence</tspan></text><rect x="24" y="103" width="216" height="85" rx="8" class="panel"/><text x="36" y="129" class="" text-anchor="start"><tspan x="36" dy="0">Al-Sufi, Isfahan</tspan></text><rect x="240" y="103" width="310" height="85" rx="8" class="panel"/><text x="252" y="129" class="" text-anchor="start"><tspan x="252" dy="0">Astronomy: new star observations</tspan></text><rect x="550" y="103" width="206" height="85" rx="8" class="panel"/><text x="562" y="129" class="" text-anchor="start"><tspan x="562" dy="0">Sardar (2011)</tspan></text><rect x="24" y="188" width="216" height="85" rx="8" class="panel"/><text x="36" y="214" class="" text-anchor="start"><tspan x="36" dy="0">Ulugh Beg and team</tspan></text><rect x="240" y="188" width="310" height="85" rx="8" class="panel"/><text x="252" y="214" class="" text-anchor="start"><tspan x="252" dy="0">Astronomy: observations and</tspan><tspan x="252" dy="23">tables</tspan></text><rect x="550" y="188" width="206" height="85" rx="8" class="panel"/><text x="562" y="214" class="" text-anchor="start"><tspan x="562" dy="0">UNESCO Samarkand</tspan></text><rect x="24" y="273" width="216" height="85" rx="8" class="panel"/><text x="36" y="299" class="" text-anchor="start"><tspan x="36" dy="0">Al-Kashi, Samarkand</tspan></text><rect x="240" y="273" width="310" height="85" rx="8" class="panel"/><text x="252" y="299" class="" text-anchor="start"><tspan x="252" dy="0">Mathematics: refined calculation</tspan></text><rect x="550" y="273" width="206" height="85" rx="8" class="panel"/><text x="562" y="299" class="" text-anchor="start"><tspan x="562" dy="0">UNESCO Samarkand</tspan></text><text x="24" y="388" class="support" text-anchor="start"><tspan x="24" dy="0">Name a contribution and its evidence; do not claim a single inventor of science.</tspan></text><text class="wm" x="768" y="434" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
