<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منتخب خط زمانی بغداد کی ترجمانی اور ریاضی کی خدمات کو مراغہ اور سمرقند سے جوڑتا ہے؛ ایک لمحے کے بجائے صدیوں میں کئی مراکز دکھاتا ہے۔</title><desc id="d">منتخب خط زمانی بغداد کی ترجمانی اور ریاضی کی خدمات کو مراغہ اور سمرقند سے جوڑتا ہے؛ ایک لمحے کے بجائے صدیوں میں کئی مراکز دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="600" /><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">سیکھنے کے منتخب سنگ میل، آٹھویں تا پندرھویں صدی</tspan></text><text x="756" y="65" class="support" text-anchor="end"><tspan x="756" dy="0">صدیوں کو اوپر سے نیچے پڑھیں؛ وسیع ادوار عین واقعاتی تاریخیں نہیں۔</tspan></text><path d="M715,104 V480" class="link" marker-end="url(#arrow)" /><circle cx="715" cy="129" r="7" class="ah" /><rect x="24" y="94" width="653" height="82" rx="8" class="panel" /><text x="657" y="124" class="h" text-anchor="end"><tspan x="657" dy="0">آٹھویں تا نویں صدی</tspan></text><text x="415" y="124" class="h" text-anchor="end"><tspan x="415" dy="0">بغداد</tspan></text><text x="415" y="154" text-anchor="end"><tspan x="415" dy="0">ترجمہ اور مطالعہ</tspan></text><circle cx="715" cy="227" r="7" class="ah" /><rect x="24" y="192" width="653" height="82" rx="8" class="panel" /><text x="657" y="222" class="h" text-anchor="end"><tspan x="657" dy="0">دسویں صدی</tspan></text><text x="415" y="222" class="h" text-anchor="end"><tspan x="415" dy="0">الصوفی، اصفہان</tspan></text><text x="415" y="252" text-anchor="end"><tspan x="415" dy="0">ستاروں کے نئے مشاہدات</tspan></text><circle cx="715" cy="325" r="7" class="ah" /><rect x="24" y="290" width="653" height="82" rx="8" class="panel" /><text x="657" y="320" class="h" text-anchor="end"><tspan x="657" dy="0">تیرھویں صدی</tspan></text><text x="415" y="320" class="h" text-anchor="end"><tspan x="415" dy="0">مراغہ</tspan></text><text x="415" y="350" text-anchor="end"><tspan x="415" dy="0">رصدگاہ میں سیکھنا</tspan></text><circle cx="715" cy="423" r="7" class="ah" /><rect x="24" y="388" width="653" height="82" rx="8" class="panel" /><text x="657" y="418" class="h" text-anchor="end"><tspan x="657" dy="0">⁦1420⁩ اور ⁦1424⁩</tspan></text><text x="415" y="418" class="h" text-anchor="end"><tspan x="415" dy="0">الغ بیگ، سمرقند</tspan></text><text x="415" y="448" text-anchor="end"><tspan x="415" dy="0">مدرسہ، پھر رصدگاہ</tspan></text><text x="756" y="522" class="support" text-anchor="end"><tspan x="756" dy="0">مصادر: سردار (2011)؛ یونیسکو کا فلکیاتی ورثے کا مطالعہ۔</tspan></text><text x="756" y="550" class="support" text-anchor="end"><tspan x="756" dy="0">یہ انتخاب علمی کام کا آغاز یا اختتام متعین نہیں کرتا۔</tspan></text><text class="wm" x="12" y="588" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
