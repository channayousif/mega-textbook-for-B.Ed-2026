<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 531" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد احترام سے سمجھاتے اور اصلاح کرتے ہیں، جبکہ طالب علم تضحیک کے بغیر پوچھتے، سنتے اور مشق کرتے ہیں؛ حوالوں اور جماعتی اطلاق کو الگ دکھایا گیا ہے۔</title><desc id="d">استاد احترام سے سمجھاتے اور اصلاح کرتے ہیں، جبکہ طالب علم تضحیک کے بغیر پوچھتے، سنتے اور مشق کرتے ہیں؛ حوالوں اور جماعتی اطلاق کو الگ دکھایا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="531" /><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">استاد اور طالب علم: عملی ذمہ داریاں</tspan></text><rect x="638" y="55" width="118" height="48" rx="8" class="accent" /><text x="744" y="85" class="h" text-anchor="end"><tspan x="744" dy="0">کردار</tspan></text><rect x="448" y="55" width="190" height="48" rx="8" class="accent" /><text x="626" y="85" class="h" text-anchor="end"><tspan x="626" dy="0">فرض</tspan></text><rect x="293" y="55" width="155" height="48" rx="8" class="accent" /><text x="436" y="85" class="h" text-anchor="end"><tspan x="436" dy="0">بنیاد</tspan></text><rect x="24" y="55" width="269" height="48" rx="8" class="accent" /><text x="281" y="85" class="h" text-anchor="end"><tspan x="281" dy="0">اطلاق</tspan></text><rect x="638" y="103" width="118" height="85" rx="8" class="panel" /><text x="744" y="129" text-anchor="end"><tspan x="744" dy="0">استاد</tspan></text><rect x="448" y="103" width="190" height="85" rx="8" class="panel" /><text x="626" y="129" text-anchor="end"><tspan x="626" dy="0">حکیمانہ نصیحت</tspan></text><rect x="293" y="103" width="155" height="85" rx="8" class="panel" /><text x="436" y="129" text-anchor="end"><tspan x="436" dy="0">قرآن 16:125</tspan></text><rect x="24" y="103" width="269" height="85" rx="8" class="panel" /><text x="281" y="129" text-anchor="end"><tspan x="281" dy="0">سمجھائیں؛ سوال کی دعوت</tspan></text><rect x="638" y="188" width="118" height="85" rx="8" class="panel" /><text x="744" y="214" text-anchor="end"><tspan x="744" dy="0">استاد</tspan></text><rect x="448" y="188" width="190" height="85" rx="8" class="panel" /><text x="626" y="214" text-anchor="end"><tspan x="626" dy="0">باادب</tspan><tspan x="626" dy="40">اصلاح</tspan></text><rect x="293" y="188" width="155" height="85" rx="8" class="panel" /><text x="436" y="214" text-anchor="end"><tspan x="436" dy="0">قرآن 49:11</tspan></text><rect x="24" y="188" width="269" height="85" rx="8" class="panel" /><text x="281" y="214" text-anchor="end"><tspan x="281" dy="0">تضحیک کے بغیر اصلاح</tspan></text><rect x="638" y="273" width="118" height="85" rx="8" class="panel" /><text x="744" y="299" text-anchor="end"><tspan x="744" dy="0">طالب علم</tspan></text><rect x="448" y="273" width="190" height="85" rx="8" class="panel" /><text x="626" y="299" text-anchor="end"><tspan x="626" dy="0">باادب</tspan><tspan x="626" dy="40">گفتگو</tspan></text><rect x="293" y="273" width="155" height="85" rx="8" class="panel" /><text x="436" y="299" text-anchor="end"><tspan x="436" dy="0">قرآن 16:125</tspan></text><rect x="24" y="273" width="269" height="85" rx="8" class="panel" /><text x="281" y="299" text-anchor="end"><tspan x="281" dy="0">دلیل کے بارے میں پوچھیں</tspan></text><rect x="638" y="358" width="118" height="85" rx="8" class="panel" /><text x="744" y="384" text-anchor="end"><tspan x="744" dy="0">طالب علم</tspan></text><rect x="448" y="358" width="190" height="85" rx="8" class="panel" /><text x="626" y="384" text-anchor="end"><tspan x="626" dy="0">ساتھیوں کا خیال</tspan></text><rect x="293" y="358" width="155" height="85" rx="8" class="panel" /><text x="436" y="384" text-anchor="end"><tspan x="436" dy="0">قرآن 49:11</tspan></text><rect x="24" y="358" width="269" height="85" rx="8" class="panel" /><text x="281" y="384" text-anchor="end"><tspan x="281" dy="0">مذاق کے بغیر سنیں</tspan></text><text x="756" y="473" class="support" text-anchor="end"><tspan x="756" dy="0">اطلاق تعلیمی استنباط ہیں، نقل کردہ جماعتی ضابطہ نہیں۔</tspan></text><text class="wm" x="12" y="519" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
