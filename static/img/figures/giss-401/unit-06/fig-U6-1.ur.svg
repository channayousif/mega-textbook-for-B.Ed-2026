<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">علم کا تعلق تلاش، تدریس، عمل اور اشتراک سے ہے؛ ہر تعلق کے ساتھ ذمہ داری وابستہ ہے۔</title><desc id="d">علم کا تعلق تلاش، تدریس، عمل اور اشتراک سے ہے؛ ہر تعلق کے ساتھ ذمہ داری وابستہ ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="510" /><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">اسلام میں علم: باہم جڑی ذمہ داریاں</tspan></text><rect x="270" y="190" width="240" height="85" rx="8" class="accent" /><text x="390" y="222" class="h" text-anchor="middle"><tspan x="390" dy="0">علم</tspan><tspan x="390" dy="32">ذمہ داری کے ساتھ</tspan></text><rect x="526" y="65" width="230" height="85" rx="8" class="panel" /><text x="641" y="95" class="h" text-anchor="middle"><tspan x="641" dy="0">تلاش</tspan></text><text x="641" y="125" text-anchor="middle"><tspan x="641" dy="0">پوچھیں اور جانچیں</tspan></text><path d="M510,210 L575,146" class="link" marker-end="url(#arrow)" /><text x="600" y="178" class="support" text-anchor="middle"><tspan x="600" dy="0">پوچھیں</tspan></text><rect x="24" y="65" width="230" height="85" rx="8" class="panel" /><text x="139" y="95" class="h" text-anchor="middle"><tspan x="139" dy="0">تدریس</tspan></text><text x="139" y="125" text-anchor="middle"><tspan x="139" dy="0">سمجھائیں اور سنیں</tspan></text><path d="M270,210 L204,146" class="link" marker-end="url(#arrow)" /><text x="180" y="178" class="support" text-anchor="middle"><tspan x="180" dy="0">سمجھائیں</tspan></text><rect x="526" y="335" width="230" height="85" rx="8" class="panel" /><text x="641" y="365" class="h" text-anchor="middle"><tspan x="641" dy="0">عمل</tspan></text><text x="641" y="395" text-anchor="middle"><tspan x="641" dy="0">احتیاط سے مشق</tspan></text><path d="M510,254 L575,335" class="link" marker-end="url(#arrow)" /><text x="600" y="305" class="support" text-anchor="middle"><tspan x="600" dy="0">مشق</tspan></text><rect x="24" y="335" width="230" height="85" rx="8" class="panel" /><text x="139" y="365" class="h" text-anchor="middle"><tspan x="139" dy="0">اشتراک</tspan></text><text x="139" y="395" text-anchor="middle"><tspan x="139" dy="0">دوسروں کو سکھائیں</tspan></text><path d="M270,254 L204,335" class="link" marker-end="url(#arrow)" /><text x="180" y="305" class="support" text-anchor="middle"><tspan x="180" dy="0">خدمت</tspan></text><text x="756" y="459" class="support" text-anchor="end"><tspan x="756" dy="0">تلاش، وضاحت، مشق اور اشتراک: ہر ایک میں فیصلہ ضروری ہے۔</tspan></text><text class="wm" x="12" y="498" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
