<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">محفوظ شرکت منصفانہ سماعت، احترام کے ساتھ اختلاف، مشترک سیکھنے اور ازالے سے جڑتی ہے؛ بچوں کے یکساں دینی عقائد ضروری نہیں۔</title><desc id="d">محفوظ شرکت منصفانہ سماعت، احترام کے ساتھ اختلاف، مشترک سیکھنے اور ازالے سے جڑتی ہے؛ بچوں کے یکساں دینی عقائد ضروری نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="510" /><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">متنوع اسکول میں پُرامن بقائے باہمی</tspan></text><rect x="240" y="185" width="300" height="86" rx="8" class="accent" /><text x="390" y="220" class="h" text-anchor="middle"><tspan x="390" dy="0">مشترک سیکھنا</tspan><tspan x="390" dy="32">جبری اتفاق کے بغیر</tspan></text><rect x="526" y="65" width="230" height="85" rx="8" class="panel" /><text x="641" y="95" class="h" text-anchor="middle"><tspan x="641" dy="0">حفاظت</tspan></text><text x="641" y="126" text-anchor="middle"><tspan x="641" dy="0">نقصان روکیں</tspan></text><path d="M510,185 L575,146" class="link" marker-end="url(#arrow)" /><rect x="24" y="65" width="230" height="85" rx="8" class="panel" /><text x="139" y="95" class="h" text-anchor="middle"><tspan x="139" dy="0">منصفانہ سماعت</tspan></text><text x="139" y="126" text-anchor="middle"><tspan x="139" dy="0">الزام سے پہلے جانچ</tspan></text><path d="M270,185 L204,146" class="link" marker-end="url(#arrow)" /><rect x="526" y="330" width="230" height="85" rx="8" class="panel" /><text x="641" y="360" class="h" text-anchor="middle"><tspan x="641" dy="0">باادب اختلاف</tspan></text><text x="641" y="391" text-anchor="middle"><tspan x="641" dy="0">وقار برقرار</tspan></text><path d="M510,271 L575,330" class="link" marker-end="url(#arrow)" /><rect x="24" y="330" width="230" height="85" rx="8" class="panel" /><text x="139" y="360" class="h" text-anchor="middle"><tspan x="139" dy="0">ازالہ</tspan></text><text x="139" y="391" text-anchor="middle"><tspan x="139" dy="0">شرکت بحال کریں</tspan></text><path d="M270,271 L204,330" class="link" marker-end="url(#arrow)" /><text x="756" y="459" class="support" text-anchor="end"><tspan x="756" dy="0">صرف خاموشی نہیں، شرکت جانچیں۔ شناخت جانچے بغیر عمل کا حل کریں۔</tspan></text><text class="wm" x="12" y="498" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
