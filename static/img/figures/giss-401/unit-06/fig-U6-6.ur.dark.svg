<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">محفوظ شرکت منصفانہ سماعت، احترام کے ساتھ اختلاف، مشترک سیکھنے اور ازالے سے جڑتی ہے؛ بچوں کے یکساں دینی عقائد ضروری نہیں۔</title><desc id="d">محفوظ شرکت منصفانہ سماعت، احترام کے ساتھ اختلاف، مشترک سیکھنے اور ازالے سے جڑتی ہے؛ بچوں کے یکساں دینی عقائد ضروری نہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="510" /><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">متنوع اسکول میں پُرامن بقائے باہمی</tspan></text><rect x="240" y="185" width="300" height="86" rx="8" class="accent" /><text x="390" y="220" class="h" text-anchor="middle"><tspan x="390" dy="0">مشترک سیکھنا</tspan><tspan x="390" dy="32">جبری اتفاق کے بغیر</tspan></text><rect x="526" y="65" width="230" height="85" rx="8" class="panel" /><text x="641" y="95" class="h" text-anchor="middle"><tspan x="641" dy="0">حفاظت</tspan></text><text x="641" y="126" text-anchor="middle"><tspan x="641" dy="0">نقصان روکیں</tspan></text><path d="M510,185 L575,146" class="link" marker-end="url(#arrow)" /><rect x="24" y="65" width="230" height="85" rx="8" class="panel" /><text x="139" y="95" class="h" text-anchor="middle"><tspan x="139" dy="0">منصفانہ سماعت</tspan></text><text x="139" y="126" text-anchor="middle"><tspan x="139" dy="0">الزام سے پہلے جانچ</tspan></text><path d="M270,185 L204,146" class="link" marker-end="url(#arrow)" /><rect x="526" y="330" width="230" height="85" rx="8" class="panel" /><text x="641" y="360" class="h" text-anchor="middle"><tspan x="641" dy="0">باادب اختلاف</tspan></text><text x="641" y="391" text-anchor="middle"><tspan x="641" dy="0">وقار برقرار</tspan></text><path d="M510,271 L575,330" class="link" marker-end="url(#arrow)" /><rect x="24" y="330" width="230" height="85" rx="8" class="panel" /><text x="139" y="360" class="h" text-anchor="middle"><tspan x="139" dy="0">ازالہ</tspan></text><text x="139" y="391" text-anchor="middle"><tspan x="139" dy="0">شرکت بحال کریں</tspan></text><path d="M270,271 L204,330" class="link" marker-end="url(#arrow)" /><text x="756" y="459" class="support" text-anchor="end"><tspan x="756" dy="0">صرف خاموشی نہیں، شرکت جانچیں۔ شناخت جانچے بغیر عمل کا حل کریں۔</tspan></text><text class="wm" x="12" y="498" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
