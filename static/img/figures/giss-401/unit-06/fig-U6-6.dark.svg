<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Safe participation connects fair hearing, respectful difference, shared learning and repair without requiring pupils to share the same religious beliefs</title><desc id="d">Safe participation connects fair hearing, respectful difference, shared learning and repair without requiring pupils to share the same religious beliefs.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="510"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Peaceful coexistence in a diverse school</tspan></text><rect x="240" y="185" width="300" height="86" rx="8" class="accent"/><text x="390" y="220" class="h" text-anchor="middle"><tspan x="390" dy="0">Shared learning</tspan><tspan x="390" dy="23">without forced agreement</tspan></text><rect x="24" y="65" width="230" height="85" rx="8" class="panel"/><text x="139" y="95" class="h" text-anchor="middle"><tspan x="139" dy="0">Safety</tspan></text><text x="139" y="126" class="" text-anchor="middle"><tspan x="139" dy="0">Stop harm</tspan></text><path d="M270,185 L205,146" class="link" marker-end="url(#arrow)"/><rect x="526" y="65" width="230" height="85" rx="8" class="panel"/><text x="641" y="95" class="h" text-anchor="middle"><tspan x="641" dy="0">Fair hearing</tspan></text><text x="641" y="126" class="" text-anchor="middle"><tspan x="641" dy="0">Check before blame</tspan></text><path d="M510,185 L576,146" class="link" marker-end="url(#arrow)"/><rect x="24" y="330" width="230" height="85" rx="8" class="panel"/><text x="139" y="360" class="h" text-anchor="middle"><tspan x="139" dy="0">Respectful difference</tspan></text><text x="139" y="391" class="" text-anchor="middle"><tspan x="139" dy="0">Keep dignity</tspan></text><path d="M270,271 L205,330" class="link" marker-end="url(#arrow)"/><rect x="526" y="330" width="230" height="85" rx="8" class="panel"/><text x="641" y="360" class="h" text-anchor="middle"><tspan x="641" dy="0">Repair</tspan></text><text x="641" y="391" class="" text-anchor="middle"><tspan x="641" dy="0">Restore participation</tspan></text><path d="M510,271 L576,330" class="link" marker-end="url(#arrow)"/><text x="24" y="459" class="support" text-anchor="start"><tspan x="24" dy="0">Check participation, not only silence. Address actions without judging identity.</tspan></text><text class="wm" x="768" y="498" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
