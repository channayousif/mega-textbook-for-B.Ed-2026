<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Knowledge connects seeking, teaching, action and sharing, with responsibility attached to every connection</title><desc id="d">Knowledge connects seeking, teaching, action and sharing, with responsibility attached to every connection.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="510"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Knowledge in Islam: connected responsibilities</tspan></text><rect x="270" y="190" width="240" height="85" rx="8" class="accent"/><text x="390" y="222" class="h" text-anchor="middle"><tspan x="390" dy="0">Knowledge</tspan><tspan x="390" dy="23">with responsibility</tspan></text><rect x="24" y="65" width="230" height="85" rx="8" class="panel"/><text x="139" y="95" class="h" text-anchor="middle"><tspan x="139" dy="0">Seeking</tspan></text><text x="139" y="125" class="" text-anchor="middle"><tspan x="139" dy="0">Ask and check</tspan></text><path d="M270,210 L205,146" class="link" marker-end="url(#arrow)"/><text x="194" y="178" class="support" text-anchor="middle"><tspan x="194" dy="0">ask</tspan></text><rect x="526" y="65" width="230" height="85" rx="8" class="panel"/><text x="641" y="95" class="h" text-anchor="middle"><tspan x="641" dy="0">Teaching</tspan></text><text x="641" y="125" class="" text-anchor="middle"><tspan x="641" dy="0">Explain and listen</tspan></text><path d="M510,210 L576,146" class="link" marker-end="url(#arrow)"/><text x="545" y="178" class="support" text-anchor="middle"><tspan x="545" dy="0">explain</tspan></text><rect x="24" y="335" width="230" height="85" rx="8" class="panel"/><text x="139" y="365" class="h" text-anchor="middle"><tspan x="139" dy="0">Acting</tspan></text><text x="139" y="395" class="" text-anchor="middle"><tspan x="139" dy="0">Practise with care</tspan></text><path d="M270,254 L205,335" class="link" marker-end="url(#arrow)"/><text x="182" y="305" class="support" text-anchor="middle"><tspan x="182" dy="0">practise</tspan></text><rect x="526" y="335" width="230" height="85" rx="8" class="panel"/><text x="641" y="365" class="h" text-anchor="middle"><tspan x="641" dy="0">Sharing</tspan></text><text x="641" y="395" class="" text-anchor="middle"><tspan x="641" dy="0">Help others learn</tspan></text><path d="M510,254 L576,335" class="link" marker-end="url(#arrow)"/><text x="547" y="305" class="support" text-anchor="middle"><tspan x="547" dy="0">serve</tspan></text><text x="24" y="459" class="support" text-anchor="start"><tspan x="24" dy="0">Seek, explain, practise and share: each calls for judgement.</tspan></text><text class="wm" x="768" y="498" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
