<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 531" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Teachers explain and correct respectfully while learners ask, listen and practise without ridicule, with references distinguished from classroom applications</title><desc id="d">Teachers explain and correct respectfully while learners ask, listen and practise without ridicule, with references distinguished from classroom applications.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="531"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Teacher and learner: duties in practice</tspan></text><rect x="24" y="55" width="118" height="48" rx="8" class="accent"/><text x="36" y="85" class="h" text-anchor="start"><tspan x="36" dy="0">Role</tspan></text><rect x="142" y="55" width="190" height="48" rx="8" class="accent"/><text x="154" y="85" class="h" text-anchor="start"><tspan x="154" dy="0">Duty</tspan></text><rect x="332" y="55" width="155" height="48" rx="8" class="accent"/><text x="344" y="85" class="h" text-anchor="start"><tspan x="344" dy="0">Basis</tspan></text><rect x="487" y="55" width="269" height="48" rx="8" class="accent"/><tex