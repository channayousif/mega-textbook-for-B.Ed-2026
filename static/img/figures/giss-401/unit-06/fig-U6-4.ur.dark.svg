<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 446" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین منتخب علما کو ریاضی یا فلکیات کی خدمات سے جوڑا گیا ہے؛ ناموں کے ساتھ شواہد اور اشتراکی ماحول دکھائے گئے ہیں۔</title><desc id="d">تین منتخب علما کو ریاضی یا فلکیات کی خدمات سے جوڑا گیا ہے؛ ناموں کے ساتھ شواہد اور اشتراکی ماحول دکھائے گئے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="446" /><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">منتخب مسلم علما: خدمات اور شواہد</tspan></text><rect x="540" y="55" width="216" height="48" rx="8" class="accent" /><text x="744" y="85" class="h" text-anchor="end"><tspan x="744" dy="0">عالم / ماحول</tspan></text><rect x="230" y="55" width="310" height="48" rx="8" class="accent" /><text x="528" y="85" class="h" text-anchor="end"><tspan x="528" dy="0">شعبہ اور خدمت</tspan></text><rect x="24" y="55" width="206" height="48" rx="8" class="accent" /><text x="218" y="85" class="h" text-anchor="end"><tspan x="218" dy="0">شواہد</tspan></text><rect x="540" y="103" width="216" height="85" rx="8" class="panel" /><text x="744" y="129" text-anchor="end"><tspan x="744" dy="0">الصوفی، 