<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A partial comparison links selected Farewell Pilgrimage protections with modern rights themes while stating that the sources and legal frameworks differ</title><desc id="d">A partial comparison links selected Farewell Pilgrimage protections with modern rights themes while stating that the sources and legal frameworks differ.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="446"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Selected rights parallels: different texts and frameworks</tspan></text><rect x="24" y="55" width="246" height="48" rx="8" class="accent"/><text x="36" y="85" class="h" text-anchor="start"><tspan x="36" dy="0">Pilgrimage report</tspan></text><rect x="270" y="55" width="246" height="48" rx="8" class="accent"/><text x="282" y="85" class="h" text-anchor="start"><tspan x="282" dy="0">Modern theme</tspan></text><rect x="516" y="55" width="240" height="48" rx="8" class="accent"/><text x="528" y="85" class="h" text-anchor="start"><tspan x="528" dy="0">Limit</tspan></text><rect x="24" y="103" width="246" height="85" rx="8" class="panel"/><text x="36" y="129" class="" text-anchor="start"><tspan x="36" dy="0">Protection of life</tspan></text><rect x="270" y="103" width="246" height="85" rx="8" class="panel"/><text x="282" y="129" class="" text-anchor="start"><tspan x="282" dy="0">UDHR 3: life and security</tspan></text><rect x="516" y="103" width="240" height="85" rx="8" class="panel"/><text x="528" y="129" class="" text-anchor="start"><tspan x="528" dy="0">Related concern; wider</tspan><tspan x="528" dy="23">modern wording</tspan></text><rect x="24" y="188" width="246" height="85" rx="8" class="panel"/><text x="36" y="214" class="" text-anchor="start"><tspan x="36" dy="0">Protection of property</tspan></text><rect x="270" y="188" width="246" height="85" rx="8" class="panel"/><text x="282" y="214" class="" text-anchor="start"><tspan x="282" dy="0">UDHR 17: property</tspan></text><rect x="516" y="188" width="240" height="85" rx="8" class="panel"/><text x="528" y="214" class="" text-anchor="start"><tspan x="528" dy="0">Distinct rights</tspan><tspan x="528" dy="23">formulation</tspan></text><rect x="24" y="273" width="246" height="85" rx="8" class="panel"/><text x="36" y="299" class="" text-anchor="start"><tspan x="36" dy="0">Duties towards women;</tspan><tspan x="36" dy="23">maintenance</tspan></text><rect x="270" y="273" width="246" height="85" rx="8" class="panel"/><text x="282" y="299" class="" text-anchor="start"><tspan x="282" dy="0">UDHR 1-2: equal dignity;</tspan><tspan x="282" dy="23">non-discrimination</tspan></text><rect x="516" y="273" width="240" height="85" rx="8" class="panel"/><text x="528" y="299" class="" text-anchor="start"><tspan x="528" dy="0">Partial comparison; not</tspan><tspan x="528" dy="23">equivalent provisions</tspan></text><text x="24" y="388" class="support" text-anchor="start"><tspan x="24" dy="0">Sources: Sahih Muslim 1218a; UDHR. A comparison is not legal equivalence.</tspan></text><text class="wm" x="768" y="434" text-anchor="end" aria-hidden="tr