<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A selective timeline connects Baghdad translation and mathematical scholarship with Maragha and Samarkand, showing several centres across centuries rather than a single moment</title><desc id="d">A selective timeline connects Baghdad translation and mathematical scholarship with Maragha and Samarkand, showing several centres across centuries rather than a single moment.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Selected learning landmarks, 8th-15th centuries</tspan></text><text x="24" y="65" class="support" text-anchor="start"><tspan x="24" dy="0">Read down the centuries; broad periods are not exact event dates.</tspan></text><path d="M65,104 V480" class="link" marker-end="url(#arrow)"/><circle cx="65" cy="129" r="7" class="ah"/><rect x="103" y="94" width="653" height="82" rx="8" class="panel"/><text x="123" y="124" class="h" text-anchor="start"><tspan x="123" dy="0">8th-9th centuries</tspan></text><text x="365" y="124" class="h" text-anchor="start"><tspan x="365" dy="0">Baghdad</tspan></text><text x="365" y="154" class="" text-anchor="start"><tspan x="365" dy="0">Translation and study</tspan></text><circle cx="65" cy="227" r="7" class="ah"/><rect x="103" y="192" width="653" height="82" rx="8" class="panel"/><text x="123" y="222" class="h" text-anchor="start"><tspan x="123" dy="0">10th century</tspan></text><text x="365" y="222" class="h" text-anchor="start"><tspan x="365" dy="0">Al-Sufi, Isfahan</tspan></text><text x="365" y="252" class="" text-anchor="start"><tspan x="365" dy="0">New star observations</tspan></text><circle cx="65" cy="325" r="7" class="ah"/><rect x="103" y="290" width="653" height="82" rx="8" class="panel"/><text x="123" y="320" class="h" text-anchor="start"><tspan x="123" dy="0">13th century</tspan></text><text x="365" y="320" class="h" text-anchor="start"><tspan x="365" dy="0">Maragha</tspan></text><text x="365" y="350" class="" text-anchor="start"><tspan x="365" dy="0">Observatory learning</tspan></text><circle cx="65" cy="423" r="7" class="ah"/><rect x="103" y="388" width="653" height="82" rx="8" class="panel"/><text x="123" y="418" class="h" text-anchor="start"><tspan x="123" dy="0">1420 and 1424</tspan></text><text x="365" y="418" class="h" text-anchor="start"><tspan x="365" dy="0">Ulugh Beg, Samarkand</tspan></text><text x="365" y="448" class="" text-anchor="start"><tspan x="365" dy="0">School, then observatory</tspan></text><text x="24" y="522" class="support" text-anchor="start"><tspan x="24" dy="0">Sources: Sardar (2011); UNESCO astronomy heritage case study.</tspan></text><text x="24" y="550" class="support" text-anchor="start"><tspan x="24" dy="0">This selection does not mark the beginning or end of scholarship.</tspan></text><text class="wm" x="768" y="588" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
