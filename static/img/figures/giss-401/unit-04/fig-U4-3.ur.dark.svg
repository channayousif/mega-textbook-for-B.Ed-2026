<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 534" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلامی عوامی اختیار کی بنیادیں</title><desc id="d">چار بنیادیں عوامی اختیار کو اللہ کی حاکمیت، انسانی ذمہ داری، مشاورت اور انصاف سے جوڑتی ہیں اور دکھاتی ہیں کہ عہدہ جواب دہی ختم نہیں کرتا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .link{fill:none;stroke:var(--ink);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .note{font-size:14px} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="640" height="534"/><text class="h" x="616" y="34" text-anchor="end"><tspan x="616" dy="0" text-anchor="end">اسلامی عوامی اختیار کی بنیادیں</tspan></text><rect class="panel" x="120" y="68" width="400" height="74" rx="8"/><text class="body" x="320" y="99" text-anchor="middle"><tspan x="320" dy="0" text-anchor="end">عوامی اختیار</tspan><tspan x="320" dy="24" text-anchor="end">سونپی طاقت کا جواب دہ استعمال</tspan></text><path class="link" d="M490 142 L490 186"/><path class="link" d="M150 142 L150 186"/><path class="link" d="M490 294 L490 336"/><path class="link" d="M150 294 L150 336"/><rect class="panel" x="336" y="186" width="280" height="108" rx="8"/><text class="body" x="476" y="220" text-anchor="middle"><tspan x="476" dy="0" text-anchor="end">اللہ کی حاکمیت</tspan><tspan x="476" dy="24" text-anchor="end">حتمی اخلاقی اختیار</tspan></text><rect class="panel" x="24" y="186" width="280" height="108" rx="8"/><text class="body" x="164" y="220" text-anchor="middle"><tspan x="164" dy="0" text-anchor="end">خلافت</tspan><tspan x="164" dy="24" text-anchor="end">سونپی ہوئی ذمہ داری</tspan></text><rect class="panel" x="336" y="336" width="280" height="108" rx="8"/><text class="body" x="476" y="370" text-anchor="middle"><tspan x="476" dy="0" text-anchor="end">مشاورت</tspan><tspan x="476" dy="24" text-anchor="end">متعلقہ آرا سنیں</tspan></text><rect class="panel" x="24" y="336" width="280" height="108" rx="8"/><text class="body" x="164" y="358" text-anchor="middle"><tspan x="164" dy="0" text-anchor="end">انصاف</tspan><tspan x="164" dy="24" text-anchor="end">منصفانہ وجوہ</tspan><tspan x="164" dy="24">استعمال کریں</tspan></text><text class="note" x="616" y="480" text-anchor="end"><tspan x="616" dy="0" text-anchor="end">عہدہ فیصلوں کی وضاحت کی ذمہ داری ختم نہیں کرتا۔</tspan></text><text class="wm" x="20" y="520" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
