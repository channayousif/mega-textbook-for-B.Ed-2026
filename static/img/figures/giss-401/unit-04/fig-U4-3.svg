<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 534" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Foundations of Islamic public authority</title><desc id="d">Four foundations link public authority with Allah's sovereignty, human responsibility, consultation and justice, showing that holding office does not remove accountability.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .link{fill:none;stroke:var(--ink);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .note{font-size:14px} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="640" height="534"/><text class="h" x="24" y="34" text-anchor="start"><tspan x="24" dy="0">Foundations of Islamic public authority</tspan></text><rect class="panel" x="120" y="68" width="400" height="74" rx="8"/><text class="body" x="320" y="99" text-anchor="middle"><tspan x="320" dy="0">Public authority</tspan><tspan x="320" dy="24">Accountable use of entrusted power</tspan></text><path class="link" d="M150 142 L150 186"/><path class="link" d="M490 142 L490 186"/><path class="link" d="M150 294 L150 336"/><path class="link" d="M490 294 L490 336"/><rect class="panel" x="24" y="186" width="280" height="108" rx="8"/><text class="body" x="164" y="220" text-anchor="middle"><tspan x="164" dy="0">Allah's sovereignty</tspan><tspan x="164" dy="24">Ultimate moral authority</tspan></text><rect class="panel" x="336" y="186" width="280" height="108" rx="8"/><text class="body" x="476" y="220" text-anchor="middle"><tspan x="476" dy="0">Khilafat</tspan><tspan x="476" dy="24">Entrusted responsibility</tspan></text><rect class="panel" x="24" y="336" width="280" height="108" rx="8"/><text class="body" x="164" y="370" text-anchor="middle"><tspan x="164" dy="0">Consultation</tspan><tspan x="164" dy="24">Hear relevant views</tspan></text><rect class="panel" x="336" y="336" width="280" height="108" rx="8"/><text class="body" x="476" y="370" text-anchor="middle"><tspan x="476" dy="0">Justice</tspan><tspan x="476" dy="24">Use fair reasons</tspan></text><text class="note" x="24" y="480" text-anchor="start"><tspan x="24" dy="0">Holding office does not remove the duty to explain decisions.</tspan></text><text class="wm" x="620" y="520" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
