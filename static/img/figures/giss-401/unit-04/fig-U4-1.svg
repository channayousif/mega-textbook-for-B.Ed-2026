<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 498" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Family care and responsibilities</title><desc id="d">Family relationships connect spouses, parents, children and relatives through responsibilities of care and kindness, with children receiving care rather than earning it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .link{fill:none;stroke:var(--ink);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .note{font-size:14px} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="640" height="498"/><text class="h" x="24" y="34" text-anchor="start"><tspan x="24" dy="0">Family care and responsibilities</tspan></text><path class="link" d="M320 148 L320 194"/><path class="link" d="M320 280 L320 326"/><path class="link" d="M198 236 L176 236"/><path class="link" d="M442 236 L464 236"/><rect class="panel" x="206" y="70" width="228" height="78" rx="8"/><text class="body" x="320" y="100" text-anchor="middle"><tspan x="320" dy="0">Spouses</tspan><tspan x="320" dy="24">Affection and mercy</tspan></text><rect class="panel" x="22" y="194" width="154" height="86" rx="8"/><text class="body" x="99" y="226" text-anchor="middle"><tspan x="99" dy="0">Parents</tspan><tspan x="99" dy="24">Care and support</tspan></text><rect class="panel" x="198" y="194" width="244" height="86" rx="8"/><text class="body" x="320" y="226" text-anchor="middle"><tspan x="320" dy="0">Family relationships</tspan><tspan x="320" dy="24">Kindness and child care</tspan></text><rect class="panel" x="464" y="194" width="154" height="86" rx="8"/><text class="body" x="541" y="226" text-anchor="middle"><tspan x="541" dy="0">Children</tspan><tspan x="541" dy="24">Receive care</tspan></text><rect class="panel" x="206" y="326" width="228" height="78" rx="8"/><text class="body" x="320" y="356" text-anchor="middle"><tspan x="320" dy="0">Relatives</tspan><tspan x="320" dy="24">Support and kindness</tspan></text><text class="note" x="24" y="444" text-anchor="start"><tspan x="24" dy="0">Care is a responsibility, not a reward children must earn.</tspan></text><text class="wm" x="620" y="484" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
