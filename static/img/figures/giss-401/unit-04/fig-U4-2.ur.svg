<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 502" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حقوق اور ذمہ داریاں</title><desc id="d">جدول اللہ کے لیے فرائض اور لوگوں کے لیے ذمہ داریوں میں فرق کرتا ہے اور بتاتا ہے کہ دیانت اور نگہداشت کا طرزِ عمل اللہ کی اطاعت بھی ظاہر کر سکتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .link{fill:none;stroke:var(--ink);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .note{font-size:14px} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="640" height="502"/><text class="h" x="616" y="34" text-anchor="end"><tspan x="616" dy="0" text-anchor="end">حقوق اور ذمہ داریاں</tspan></text><rect class="panel" x="20" y="64" width="600" height="70" rx="8"/><text class="h" x="604" y="92" text-anchor="end"><tspan x="604" dy="0" text-anchor="end">زمرہ</tspan></text><text class="h" x="392" y="92" text-anchor="end"><tspan x="392" dy="0" text-anchor="end">مفہوم اور اسکولی مثال</tspan></text><rect class="panel" x="20" y="148" width="600" height="112" rx="8"/><text class="body" x="604" y="181" text-anchor="end"><tspan x="604" dy="0" text-anchor="end">حقوق اللہ</tspan></text><text class="body" x="392" y="181" text-anchor="end"><tspan x="392" dy="0" text-anchor="end">اللہ کے لیے فرائض</tspan><tspan x="392" dy="24" text-anchor="end">عبادت اور خلوصِ نیت</tspan></text><rect class="panel" x="20" y="274" width="600" height="112" rx="8"/><text class="body" x="604" y="307" text-anchor="end"><tspan x="604" dy="0" text-anchor="end">حقوق العباد</tspan></text><text class="body" x="392" y="307" text-anchor="end"><tspan x="392" dy="0" text-anchor="end">لوگوں کے لیے ذمہ داریاں</tspan><tspan x="392" dy="24" text-anchor="end">مال واپس کریں؛ انصاف سے پیش آئیں</tspan></text><text class="note" x="616" y="428" text-anchor="end"><tspan x="616" dy="0" text-anchor="end">زمرے باہم مل سکتے ہیں: دیانت دار سلوک دوسرے کا حق</tspan><tspan x="616" dy="24" text-anchor="end">نبھانے کے ساتھ اللہ کی اطاعت بھی ظاہر کر سکتا ہے۔</tspan></text><text class="wm" x="20" y="488" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
