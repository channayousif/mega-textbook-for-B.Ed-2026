<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Governance and democracy: compare questions</title><desc id="d">Comparison table links consultation and accountability with democratic participation while distinguishing majority procedures from the question of ultimate moral authority.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .link{fill:none;stroke:var(--ink);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .note{font-size:14px} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="640" height="626"/><text class="h" x="24" y="34" text-anchor="start"><tspan x="24" dy="0">Governance and democracy: compare questions</tspan></text><rect class="panel" x="16" y="62" width="608" height="68" rx="8"/><text class="h" x="30" y="90" text-anchor="start"><tspan x="30" dy="0">Question</tspan></text><text class="h" x="192" y="90" text-anchor="start"><tspan x="192" dy="0">Possible agreement</tspan></text><text class="h" x="404" y="90" text-anchor="start"><tspan x="404" dy="0">Still to examine</tspan></text><rect class="panel" x="16" y="144" width="608" height="86" rx="8"/><text class="note" x="30" y="178" text-anchor="start"><tspan x="30" dy="0">Participation</tspan></text><text class="note" x="192" y="178" text-anchor="start"><tspan x="192" dy="0">Hear affected people</tspan></text><text class="note" x="404" y="178" text-anchor="start"><tspan x="404" dy="0">Who is included?</tspan></text><rect class="panel" x="16" y="244" width="608" height="86" rx="8"/><text class="note" x="30" y="278" text-anchor="start"><tspan x="30" dy="0">Accountability</tspan></text><text class="note" x="192" y="278" text-anchor="start"><tspan x="192" dy="0">Require explanations</tspan></text><text class="note" x="404" y="278" text-anchor="start"><tspan x="404" dy="0">How are errors fixed?</tspan></text><rect class="panel" x="16" y="344" width="608" height="86" rx="8"/><text class="note" x="30" y="378" text-anchor="start"><tspan x="30" dy="0">Majority choice</tspan></text><text class="note" x="192" y="378" text-anchor="start"><tspan x="192" dy="0">A decision procedure</tspan></text><text class="note" x="404" y="378" text-anchor="start"><tspan x="404" dy="0">Are rights protected?</tspan></text><rect class="panel" x="16" y="444" width="608" height="86" rx="8"/><text class="note" x="30" y="478" text-anchor="start"><tspan x="30" dy="0">Ultimate authority</tspan></text><text class="note" x="192" y="478" text-anchor="start"><tspan x="192" dy="0">Human power has limits</tspan></text><text class="note" x="404" y="478" text-anchor="start"><tspan x="404" dy="0">How are moral limits</tspan><tspan x="404" dy="24">understood?</tspan></text><text class="note" x="24" y="576" text-anchor="start"><tspan x="24" dy="0">A comparison aid, not a claim that all scholars agree.</tspan></text><text class="wm" x="620" y="612" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
