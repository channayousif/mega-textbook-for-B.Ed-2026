<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حکمرانی اور جمہوریت: سوالات کا موازنہ</title><desc id="d">تقابلی جدول مشاورت اور جواب دہی کو جمہوری شرکت سے جوڑتا ہے، جبکہ اکثریتی طریقوں کو حتمی اخلاقی اختیار کے سوال سے الگ کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .link{fill:none;stroke:var(--ink);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .note{font-size:14px} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="640" height="626"/><text class="h" x="616" y="34" text-anchor="end"><tspan x="616" dy="0" text-anchor="end">حکمرانی اور جمہوریت: سوالات کا موازنہ</tspan></text><rect class="panel" x="16" y="62" width="608" height="68" rx="8"/><text class="h" x="610" y="90" text-anchor="end"><tspan x="610" dy="0" text-anchor="end">سوال</tspan></text><text class="h" x="448" y="90" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">ممکنہ اتفاق</tspan></text><text class="h" x="236" y="90" text-anchor="end"><tspan x="236" dy="0" text-anchor="end">مزید جانچ</tspan></text><rect class="panel" x="16" y="144" width="608" height="86" rx="8"/><text class="note" x="610" y="178" text-anchor="end"><tspan x="610" dy="0" text-anchor="end">شرکت</tspan></text><text class="note" x="448" y="178" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">متاثرہ لوگوں کو سنیں</tspan></text><text class="note" x="236" y="178" text-anchor="end"><tspan x="236" dy="0" text-anchor="end">کون شامل ہے؟</tspan></text><rect class="panel" x="16" y="244" width="608" height="86" rx="8"/><text class="note" x="610" y="278" text-anchor="end"><tspan x="610" dy="0" text-anchor="end">جواب دہی</tspan></text><text class="note" x="448" y="278" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">وضاحت لازم کریں</tspan></text><text class="note" x="236" y="278" text-anchor="end"><tspan x="236" dy="0" text-anchor="end">غلطی کیسے درست ہو؟</tspan></text><rect class="panel" x="16" y="344" width="608" height="86" rx="8"/><text class="note" x="610" y="378" text-anchor="end"><tspan x="610" dy="0" text-anchor="end">اکثریتی انتخاب</tspan></text><text class="note" x="448" y="378" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">فیصلے کا طریقہ</tspan></text><text class="note" x="236" y="378" text-anchor="end"><tspan x="236" dy="0" text-anchor="end">کیا حقوق محفوظ ہیں؟</tspan></text><rect class="panel" x="16" y="444" width="608" height="86" rx="8"/><text class="note" x="610" y="478" text-anchor="end"><tspan x="610" dy="0" text-anchor="end">حتمی اختیار</tspan></text><text class="note" x="448" y="478" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">انسانی طاقت محدود ہے</tspan></text><text class="note" x="236" y="478" text-anchor="end"><tspan x="236" dy="0" text-anchor="end">اخلاقی حدود کیسے</tspan><tspan x="236" dy="24" text-anchor="end">سمجھی جاتی ہیں؟</tspan></text><text class="note" x="616" y="576" text-anchor="end"><tspan x="616" dy="0" text-anchor="end">موازنے کی مدد، تمام علما کے اتفاق کا دعویٰ نہیں۔</tspan></text><text class="wm" x="20" y="612" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
