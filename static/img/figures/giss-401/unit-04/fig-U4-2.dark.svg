<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 502" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Rights and responsibilities</title><desc id="d">Table distinguishes duties towards Allah from responsibilities towards people and notes that honest and caring conduct can also express obedience to Allah.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .link{fill:none;stroke:var(--ink);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .note{font-size:14px} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="640" height="502"/><text class="h" x="24" y="34" text-anchor="start"><tspan x="24" dy="0">Rights and responsibilities</tspan></text><rect class="panel" x="20" y="64" width="600" height="70" rx="8"/><text class="h" x="36" y="92" text-anchor="start"><tspan x="36" dy="0">Category</tspan></text><text class="h" x="248" y="92" text-anchor="start"><tspan x="248" dy="0">Meaning and school example</tspan></text><rect class="panel" x="20" y="148" width="600" height="112" rx="8"/><text class="body" x="36" y="181" text-anchor="start"><tspan x="36" dy="0">Rights of Allah</tspan></text><text class="body" x="248" y="181" text-anchor="start"><tspan x="248" dy="0">Duties towards Allah</tspan><tspan x="248" dy="24">Worship and sincere intention</tspan></text><rect class="panel" x="20" y="274" width="600" height="112" rx="8"/><text class="body" x="36" y="307" text-anchor="start"><tspan x="36" dy="0">Rights of people</tspan></text><text class="body" x="248" y="307" text-anchor="start"><tspan x="248" dy="0">Responsibilities towards people</tspan><tspan x="248" dy="24">Return property; treat people fairly</tspan></text><text class="note" x="24" y="428" text-anchor="start"><tspan x="24" dy="0">Categories can overlap: honest conduct can express</tspan><tspan x="24" dy="24">obedience to Allah while respecting another person.</tspan></text><text class="wm" x="620" y="488" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
