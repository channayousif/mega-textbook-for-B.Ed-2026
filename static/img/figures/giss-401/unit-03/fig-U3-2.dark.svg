<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Islamic worship linking individual, family, and society</title><desc id="d">Concept map illustrating how Ibadat links the individual's spiritual consciousness to the family and wider society through shared discipline and community responsibility.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3}.panel1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel3{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.ph{font-size:16px;font-weight:700}.label{font-size:14px;font-weight:600}.support{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="20" y="32" text-anchor="start"><tspan x="20" dy="0">Social Dimensions of Islamic Worship (Ibadat)</tspan></text><rect class="center" x="260" y="60" width="260" height="80" rx="16"/><text class="ph" x="390" y="95" text-anchor="middle"><tspan x="390" dy="0">Islamic Worship (Ibadat)</tspan></text><text class="support" x="390" y="120" text-anchor="middle"><tspan x="390" dy="0">Rooted in devotion to Allah</tspan></text><path class="link" d="M300,140 L160,200" marker-end="url(#arrow)"/><path class="link" d="M390,140 L390,200" marker-end="url(#arrow)"/><path class="link" d="M480,140 L620,200" marker-end="url(#arrow)"/><rect class="panel1" x="30" y="210" width="220" height="200" rx="12"/><text class="ph" x="140" y="240" text-anchor="middle"><tspan x="140" dy="0">1. Individual Domain</tspan></text><text class="label" x="50" y="275" text-anchor="start"><tspan x="50" dy="0">Spiritual Purification:</tspan></text><text class="support" x="50" y="295" text-anchor="start"><tspan x="50" dy="0">Cultivating taqwa</tspan><tspan x="50" dy="18">and moral awareness</tspan></text><text class="label" x="50" y="340" text-anchor="start"><tspan x="50" dy="0">Personal Self-Control:</tspan></text><text class="support" x="50" y="360" text-anchor="start"><tspan x="50" dy="0">Overcoming greed,</tspan><tspan x="50" dy="18">anger, and vanity</tspan></text><rect class="panel2" x="280" y="210" width="220" height="200" rx="12"/><text class="ph" x="390" y="240" text-anchor="middle"><tspan x="390" dy="0">2. Family Domain</tspan></text><text class="label" x="300" y="275" text-anchor="start"><tspan x="300" dy="0">Household Discipline:</tspan></text><text class="support" x="300" y="295" text-anchor="start"><tspan x="300" dy="0">Shared prayer times,</tspan><tspan x="300" dy="18">meals, and punctuality</tspan></text><text class="label" x="300" y="340" text-anchor="start"><tspan x="300" dy="0">Mutual Responsibility:</tspan></text><text class="support" x="300" y="360" text-anchor="start"><tspan x="300" dy="0">Rights of parents, children,</tspan><tspan x="300" dy="18">and compassionate care</tspan></text><rect class="panel3" x="530" y="210" width="220" height="200" rx="12"/><text class="ph" x="640" y="240" text-anchor="middle"><tspan x="640" dy="0">3. Societal Domain</tspan></text><text class="label" x="550" y="275" text-anchor="start"><tspan x="550" dy="0">Civic Equality:</tspan></text><text class="support" x="550" y="295" text-anchor="start"><tspan x="550" dy="0">Eradicating caste and</tspan><tspan x="550" dy="18">class in public prayer</tspan></text><text class="label" x="550" y="340" text-anchor="start"><tspan x="550" dy="0">Economic Solidarity:</tspan></text><text class="support" x="550" y="360" text-anchor="start"><tspan x="550" dy="0">Zakat eradicates poverty;</tspan><tspan x="550" dy="18">shared care for all</tspan></text><text class="support" x="30" y="440" text-anchor="start"><tspan x="30" dy="0">Worship unites individual conscience, domestic ethics, and public social justice.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
