<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four acts of worship in Islam compared</title><desc id="d">Table comparing Salat, Zakat, Saum and Hajj across their primary requirement, individual spiritual objective and direct social significance.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.cell{fill:var(--panel);stroke:var(--line);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.th{font-size:15px;font-weight:700;fill:var(--ink)}.label{font-size:14px;font-weight:600}.support{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="20" y="32" text-anchor="start"><tspan x="20" dy="0">The Four Acts of Worship (Ibadat) in Islam</tspan></text><rect class="panel" x="20" y="50" width="130" height="45" rx="8"/><text class="th" x="30" y="68" text-anchor="start"><tspan x="30" dy="0">Act of</tspan><tspan x="30" dy="16">Worship</tspan></text><rect class="panel" x="155" y="50" width="190" height="45" rx="8"/><text class="th" x="165" y="68" text-anchor="start"><tspan x="165" dy="0">Primary</tspan><tspan x="165" dy="16">Requirement</tspan></text><rect class="panel" x="350" y="50" width="200" height="45" rx="8"/><text class="th" x="360" y="78" text-anchor="start"><tspan x="360" dy="0">Individual Objective</tspan></text><rect class="panel" x="555" y="50" width="205" height="45" rx="8"/><text class="th" x="565" y="78" text-anchor="start"><tspan x="565" dy="0">Social Significance</tspan></text><rect class="cell" x="20" y="105" width="130" height="75" rx="6"/><text class="label" x="30" y="135" text-anchor="start"><tspan x="30" dy="0">Salat (Prayer)</tspan></text><text class="support" x="30" y="155" text-anchor="start"><tspan x="30" dy="0">Daily rhythm</tspan></text><rect class="cell" x="155" y="105" width="190" height="75" rx="6"/><text class="support" x="165" y="132" text-anchor="start"><tspan x="165" dy="0">Five daily prayers at</tspan><tspan x="165" dy="18">prescribed times with</tspan><tspan x="165" dy="18">physical purity (taharah)</tspan></text><rect class="cell" x="350" y="105" width="200" height="75" rx="6"/><text class="support" x="360" y="132" text-anchor="start"><tspan x="360" dy="0">Spiritual mindfulness,</tspan><tspan x="360" dy="18">remembrance of Allah,</tspan><tspan x="360" dy="18">and moral restraint (29:45)</tspan></text><rect class="cell" x="555" y="105" width="205" height="75" rx="6"/><text class="support" x="565" y="132" text-anchor="start"><tspan x="565" dy="0">Eradicates social rank;</tspan><tspan x="565" dy="18">congregational rows unite</tspan><tspan x="565" dy="18">all citizens in equality</tspan></text><rect class="cell" x="20" y="190" width="130" height="75" rx="6"/><text class="label" x="30" y="220" text-anchor="start"><tspan x="30" dy="0">Saum (Fasting)</tspan></text><text class="support" x="30" y="240" text-anchor="start"><tspan x="30" dy="0">Ramadan fast</tspan></text><rect class="cell" x="155" y="190" width="190" height="75" rx="6"/><text class="support" x="165" y="217" text-anchor="start"><tspan x="165" dy="0">Abstaining from food,</tspan><tspan x="165" dy="18">drink, and base desires</tspan><tspan x="165" dy="18">from dawn to sunset</tspan></text><rect class="cell" x="350" y="190" width="200" height="75" rx="6"/><text class="support" x="360" y="217" text-anchor="start"><tspan x="360" dy="0">Cultivating taqwa (2:183),</tspan><tspan x="360" dy="18">patience, self-discipline,</tspan><tspan x="360" dy="18">and mastery over ego</tspan></text><rect class="cell" x="555" y="190" width="205" height="75" rx="6"/><text class="support" x="565" y="217" text-anchor="start"><tspan x="565" dy="0">Direct empathy with the</tspan><tspan x="565" dy="18">hungry; communal iftar</tspan><tspan x="565" dy="18">and mutual generosity</tspan></text><rect class="cell" x="20" y="275" width="130" height="75" rx="6"/><text class="label" x="30" y="305" text-anchor="start"><tspan x="30" dy="0">Zakat (Alms)</tspan></text><text class="support" x="30" y="325" text-anchor="start"><tspan x="30" dy="0">Annual wealth</tspan><tspan x="30" dy="16">due</tspan></text><rect class="cell" x="155" y="275" width="190" height="75" rx="6"/><text class="support" x="165" y="302" text-anchor="start"><tspan x="165" dy="0">2.5% annual levy on</tspan><tspan x="165" dy="18">surplus wealth exceeding</tspan><tspan x="165" dy="18">nisab threshold</tspan></text><rect class="cell" x="350" y="275" width="200" height="75" rx="6"/><text class="support" x="360" y="302" text-anchor="start"><tspan x="360" dy="0">Purification of wealth,</tspan><tspan x="360" dy="18">curbing greed, and</tspan><tspan x="360" dy="18">acknowledging stewardship</tspan></text><rect class="cell" x="555" y="275" width="205" height="75" rx="6"/><text class="support" x="565" y="302" text-anchor="start"><tspan x="565" dy="0">Economic justice; social</tspan><tspan x="565" dy="18">security for vulnerable</tspan><tspan x="565" dy="18">groups per Surah 9:60</tspan></text><rect class="cell" x="20" y="360" width="130" height="75" rx="6"/><text class="label" x="30" y="382" text-anchor="start"><tspan x="30" dy="0">Hajj</tspan><tspan x="30" dy="16">(Pilgrimage)</tspan></text><text class="support" x="30" y="421" text-anchor="start"><tspan x="30" dy="0">Once in lifetime</tspan></text><rect class="cell" x="155" y="360" width="190" height="75" rx="6"/><text class="support" x="165" y="387" text-anchor="start"><tspan x="165" dy="0">Pilgrimage to Makkah</tspan><tspan x="165" dy="18">for those with physical</tspan><tspan x="165" dy="18">and financial ability</tspan></text><rect class="cell" x="350" y="360" width="200" height="75" rx="6"/><text class="support" x="360" y="387" text-anchor="start"><tspan x="360" dy="0">Ultimate devotion to God,</tspan><tspan x="360" dy="18">stripping worldly vanity,</tspan><tspan x="360" dy="18">and spiritual renewal</tspan></text><rect class="cell" x="555" y="360" width="205" height="75" rx="6"/><text class="support" x="565" y="387" text-anchor="start"><tspan x="565" dy="0">Universal brotherhood;</tspan><tspan x="565" dy="18">demonstration of human</tspan><tspan x="565" dy="18">equality before Allah</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
