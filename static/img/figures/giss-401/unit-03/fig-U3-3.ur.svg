<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلام کی چار بنیادی خوبیاں اور اسکول میں ان کا اطلاق</title><desc id="d">جدول: چار بنیادی خوبیاں (سچائی، عدل، دیانت، صبر)، ان کی بنیادی اسلامی نصوص اور اسکول کی قیادت میں ان کا عملی اطلاق۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.cell{fill:var(--panel);stroke:var(--line);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.th{font-size:15px;font-weight:700;fill:var(--ink)}.label{font-size:14px;font-weight:600}.support{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="760" y="32" text-anchor="end"><tspan x="760" dy="0">تعلیمی عمل میں اسلام کی بنیادی خوبیاں (اخلاق)‏</tspan></text><rect class="panel" x="620" y="50" width="140" height="45" rx="8"/><text class="th" x="750" y="78" text-anchor="end"><tspan x="750" dy="0">بنیادی خوبی</tspan></text><rect class="panel" x="470" y="50" width="145" height="45" rx="8"/><text class="th" x="605" y="78" text-anchor="end"><tspan x="605" dy="0">نصوص کی بنیاد</tspan></text><rect class="panel" x="245" y="50" width="220" height="45" rx="8"/><text class="th" x="455" y="78" text-anchor="end"><tspan x="455" dy="0">اخلاقی مفہوم</tspan></text><rect class="panel" x="20" y="50" width="220" height="45" rx="8"/><text class="th" x="230" y="78" text-anchor="end"><tspan x="230" dy="0">جماعت میں اطلاق</tspan></text><rect class="cell" x="620" y="105" width="140" height="75" rx="6"/><text class="label" x="750" y="135" text-anchor="end"><tspan x="750" dy="0">سچائی (صدق)‏</tspan></text><text class="support" x="750" y="160" text-anchor="end"><tspan x="750" dy="0">کلام میں دیانت</tspan></text><rect class="cell" x="470" y="105" width="145" height="75" rx="6"/><text class="support" x="605" y="127" text-anchor="end"><tspan x="605" dy="0">سورۂ توبہ 9:119‏</tspan><tspan x="605" dy="20">‏(”سچے لوگوں کے</tspan><tspan x="605" dy="20">ساتھ رہو“)‏</tspan></text><rect class="cell" x="245" y="105" width="220" height="75" rx="6"/><text class="support" x="455" y="127" text-anchor="end"><tspan x="455" dy="0">کلام، دل اور عمل میں</tspan><tspan x="455" dy="20">مطابقت؛ دھوکے اور جھوٹے</tspan><tspan x="455" dy="20">دعووں کو رد کرنا</tspan></text><rect class="cell" x="20" y="105" width="220" height="75" rx="6"/><text class="support" x="230" y="127" text-anchor="end"><tspan x="230" dy="0">نمبروں کا درست ریکارڈ؛‏</tspan><tspan x="230" dy="20">معلوم نہ ہونے کا اعتراف؛‏</tspan><tspan x="230" dy="20">دیانت دار تحقیق کا فروغ</tspan></text><rect class="cell" x="620" y="190" width="140" height="75" rx="6"/><text class="label" x="750" y="220" text-anchor="end"><tspan x="750" dy="0">انصاف (عدل)‏</tspan></text><text class="support" x="750" y="245" text-anchor="end"><tspan x="750" dy="0">غیر جانب دار انصاف</tspan></text><rect class="cell" x="470" y="190" width="145" height="75" rx="6"/><text class="support" x="605" y="212" text-anchor="end"><tspan x="605" dy="0">سورۂ نساء 4:135 اور</tspan><tspan x="605" dy="20">‏5:8 (”عدل پر مضبوطی</tspan><tspan x="605" dy="20">سے قائم رہو“)‏</tspan></text><rect class="cell" x="245" y="190" width="220" height="75" rx="6"/><text class="support" x="455" y="212" text-anchor="end"><tspan x="455" dy="0">ہر شخص کو جانب داری،‏</tspan><tspan x="455" dy="20">طرف داری یا تعصب کے</tspan><tspan x="455" dy="20">بغیر اس کا حق دینا</tspan></text><rect class="cell" x="20" y="190" width="220" height="75" rx="6"/><text class="support" x="230" y="212" text-anchor="end"><tspan x="230" dy="0">یکساں تعریف اور رائے؛‏</tspan><tspan x="230" dy="20">خاندانی حیثیت سے قطع نظر</tspan><tspan x="230" dy="20">نشستوں تک منصفانہ رسائی</tspan></text><rect class="cell" x="620" y="275" width="140" height="75" rx="6"/><text class="label" x="750" y="305" text-anchor="end"><tspan x="750" dy="0">دیانت (امانت)‏</tspan></text><text class="support" x="750" y="330" text-anchor="end"><tspan x="750" dy="0">امانت کی ادائیگی</tspan></text><rect class="cell" x="470" y="275" width="145" height="75" rx="6"/><text class="support" x="605" y="297" text-anchor="end"><tspan x="605" dy="0">سورۂ نساء 4:58‏</tspan><tspan x="605" dy="20">‏(”امانتیں ان کے حق</tspan><tspan x="605" dy="20">داروں کو پہنچاؤ“)‏</tspan></text><rect class="cell" x="245" y="275" width="220" height="75" rx="6"/><text class="support" x="455" y="297" text-anchor="end"><tspan x="455" dy="0">اللہ اور لوگوں کے سونپے</tspan><tspan x="455" dy="20">ہوئے فرائض، رازوں اور</tspan><tspan x="455" dy="20">وسائل کی حفاظت</tspan></text><rect class="cell" x="20" y="275" width="220" height="75" rx="6"/><text class="support" x="230" y="297" text-anchor="end"><tspan x="230" dy="0">طلبہ کو امانت سمجھنا؛‏</tspan><tspan x="230" dy="20">ٹیسٹ کے پرچوں کی حفاظت؛‏</tspan><tspan x="230" dy="20">اسکول کے وسائل کا تحفظ</tspan></text><rect class="cell" x="620" y="360" width="140" height="75" rx="6"/><text class="label" x="750" y="390" text-anchor="end"><tspan x="750" dy="0">صبر</tspan></text><text class="support" x="750" y="415" text-anchor="end"><tspan x="750" dy="0">ثابت قدم برداشت</tspan></text><rect class="cell" x="470" y="360" width="145" height="75" rx="6"/><text class="support" x="605" y="382" text-anchor="end"><tspan x="605" dy="0">سورۂ بقرہ 2:153‏</tspan><tspan x="605" dy="20">‏(”اللہ صبر کرنے والوں</tspan><tspan x="605" dy="20">کے ساتھ ہے“)‏</tspan></text><rect class="cell" x="245" y="360" width="220" height="75" rx="6"/><text class="support" x="455" y="382" text-anchor="end"><tspan x="455" dy="0">جذباتی خود انضباطی؛‏</tspan><tspan x="455" dy="20">سختی میں ثابت قدمی؛‏</tspan><tspan x="455" dy="20">بدلے سے پرہیز</tspan></text><rect class="cell" x="20" y="360" width="220" height="75" rx="6"/><text class="support" x="230" y="382" text-anchor="end"><tspan x="230" dy="0">پُرسکون تادیبی ردِ عمل؛‏</tspan><tspan x="230" dy="20">کمزور طلبہ کی مسلسل رہنمائی؛‏</tspan><tspan x="230" dy="20">غصے سے پرہیز</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
