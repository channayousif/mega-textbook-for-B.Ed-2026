<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The character building cycle in Islamic education</title><desc id="d">Diagram illustrating character building as a four-stage cyclical process: moral knowledge (ilm), reflective practice (amal), formed habit (istiqamah), and stable character (khuluq).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.stage1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.stage2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.stage3{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.stage4{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sh{font-size:15px;font-weight:700}.label{font-size:13px;font-weight:600}.support{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="20" y="32" text-anchor="start"><tspan x="20" dy="0">Character Building Cycle (Akhlaq Formation) in Education</tspan></text><rect class="center" x="280" y="190" width="220" height="90" rx="12"/><text class="sh" x="390" y="225" text-anchor="middle"><tspan x="390" dy="0">Role Modelling</tspan></text><text class="support" x="390" y="248" text-anchor="middle"><tspan x="390" dy="0">Qudwah Hasanah</tspan><tspan x="390" dy="16">(Teacher example in school)</tspan></text><rect class="stage1" x="270" y="55" width="240" height="85" rx="10"/><text class="sh" x="390" y="80" text-anchor="middle"><tspan x="390" dy="0">1. Moral Knowledge (Ilm)</tspan></text><text class="support" x="390" y="102" text-anchor="middle"><tspan x="390" dy="0">Understanding ethical rules, virtues,</tspan><tspan x="390" dy="16">and divine principles of right and wrong</tspan></text><rect class="stage2" x="510" y="195" width="240" height="85" rx="10"/><text class="sh" x="630" y="220" text-anchor="middle"><tspan x="630" dy="0">2. Reflective Practice (Amal)</tspan></text><text class="support" x="630" y="242" text-anchor="middle"><tspan x="630" dy="0">Applying values in real classroom choices;</tspan><tspan x="630" dy="16">deliberate moral action with intention (niyyah)</tspan></text><rect class="stage3" x="270" y="335" width="240" height="85" rx="10"/><text class="sh" x="390" y="360" text-anchor="middle"><tspan x="390" dy="0">3. Formed Habit (Istiqamah)</tspan></text><text class="support" x="390" y="382" text-anchor="middle"><tspan x="390" dy="0">Continuous practice, self-monitoring,</tspan><tspan x="390" dy="16">and steadfast repetition across school routines</tspan></text><rect class="stage4" x="30" y="195" width="240" height="85" rx="10"/><text class="sh" x="150" y="220" text-anchor="middle"><tspan x="150" dy="0">4. Stable Character (Khuluq)</tspan></text><text class="support" x="150" y="242" text-anchor="middle"><tspan x="150" dy="0">Internalised moral identity; virtues flow</tspan><tspan x="150" dy="16">spontaneously without forced deliberation</tspan></text><path class="link" d="M510,97 Q630,97 630,195" marker-end="url(#arrow)"/><path class="link" d="M630,280 Q630,377 510,377" marker-end="url(#arrow)"/><path class="link" d="M270,377 Q150,377 150,280" marker-end="url(#arrow)"/><path class="link" d="M150,195 Q150,97 270,97" marker-end="url(#arrow)"/><text class="support" x="20" y="445" text-anchor="start"><tspan x="20" dy="0">Character develops through a continuous cycle of knowledge, intentional practice, and habituation.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
