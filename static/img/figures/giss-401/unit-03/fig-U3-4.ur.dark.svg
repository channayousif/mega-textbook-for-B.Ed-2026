<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلامی تعلیم میں کردار سازی کا چکر</title><desc id="d">خاکہ: کردار سازی چار مراحل کا ایک چکر ہے: اخلاقی علم (علم)، تاملی مشق (عمل)، پختہ عادت (استقامت) اور مستحکم کردار (خُلق)۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.stage1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.stage2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.stage3{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.stage4{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sh{font-size:15px;font-weight:700}.label{font-size:13px;font-weight:600}.support{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="760" y="32" text-anchor="end"><tspan x="760" dy="0">تعلیم میں کردار سازی کا چکر (اخلاق کی تشکیل)‏</tspan></text><rect class="center" x="280" y="190" width="220" height="90" rx="12"/><text class="sh" x="390" y="217" text-anchor="middle"><tspan x="390" dy="0">عملی نمونہ</tspan></text><text class="support" x="390" y="243" text-anchor="middle"><tspan x="390" dy="0">قدوۂ حسنہ</tspan><tspan x="390" dy="20">‏(اسکول میں استاد کی مثال)‏</tspan></text><rect class="stage1" x="270" y="55" width="240" height="85" rx="10"/><text class="sh" x="390" y="80" text-anchor="middle"><tspan x="390" dy="0">‏1. اخلاقی علم (علم)‏</tspan></text><text class="support" x="390" y="104" text-anchor="middle"><tspan x="390" dy="0">اخلاقی قواعد، خوبیوں اور صحیح و غلط</tspan><tspan x="390" dy="20">کے الٰہی اصولوں کی سمجھ</tspan></text><rect class="stage2" x="30" y="195" width="240" height="85" rx="10"/><text class="sh" x="150" y="226" text-anchor="middle"><tspan x="150" dy="0">‏2. تاملی مشق (عمل)‏</tspan></text><text class="support" x="150" y="248" text-anchor="middle"><tspan x="150" dy="0">جماعت کے حقیقی انتخاب میں اقدار کا اطلاق؛‏</tspan><tspan x="150" dy="20">نیت کے ساتھ بامقصد اخلاقی عمل</tspan></text><rect class="stage3" x="270" y="335" width="240" height="85" rx="10"/><text class="sh" x="390" y="360" text-anchor="middle"><tspan x="390" dy="0">‏3. پختہ عادت (استقامت)‏</tspan></text><text class="support" x="390" y="384" text-anchor="middle"><tspan x="390" dy="0">مسلسل مشق، خود نگرانی اور اسکول کے</tspan><tspan x="390" dy="20">معمولات میں ثابت قدم تکرار</tspan></text><rect class="stage4" x="510" y="195" width="240" height="85" rx="10"/><text class="sh" x="630" y="226" text-anchor="middle"><tspan x="630" dy="0">‏4. مستحکم کردار (خُلق)‏</tspan></text><text class="support" x="630" y="248" text-anchor="middle"><tspan x="630" dy="0">اندر رچی بسی اخلاقی شناخت؛ خوبیاں جبری</tspan><tspan x="630" dy="20">سوچ بچار کے بغیر بے ساختہ ظاہر ہوتی ہیں</tspan></text><path class="link" d="M270 97 Q150 97 150 195" marker-end="url(#arrow)"/><path class="link" d="M150 280 Q150 377 270 377" marker-end="url(#arrow)"/><path class="link" d="M510 377 Q630 377 630 280" marker-end="url(#arrow)"/><path class="link" d="M630 195 Q630 97 510 97" marker-end="url(#arrow)"/><text class="support" x="760" y="445" text-anchor="end"><tspan x="760" dy="0">کردار علم، بامقصد مشق اور عادت سازی کے مسلسل چکر سے بنتا ہے۔</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
