<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلامی عبادت: فرد، خاندان اور معاشرے کا ربط</title><desc id="d">تصوراتی نقشہ: عبادات کس طرح مشترک نظم و ضبط اور اجتماعی ذمہ داری کے ذریعے فرد کے روحانی شعور کو خاندان اور وسیع تر معاشرے سے جوڑتی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3}.panel1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel3{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.ph{font-size:16px;font-weight:700}.label{font-size:14px;font-weight:600}.support{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="760" y="32" text-anchor="end"><tspan x="760" dy="0">اسلامی عبادت (عبادات) کے سماجی پہلو</tspan></text><rect class="center" x="260" y="60" width="260" height="80" rx="16"/><text class="ph" x="390" y="92" text-anchor="middle"><tspan x="390" dy="0">اسلامی عبادت (عبادات)‏</tspan></text><text class="support" x="390" y="122" text-anchor="middle"><tspan x="390" dy="0">اللہ کی بندگی میں پیوست</tspan></text><path class="link" d="M480 140 L620 200" marker-end="url(#arrow)"/><path class="link" d="M390 140 L390 200" marker-end="url(#arrow)"/><path class="link" d="M300 140 L160 200" marker-end="url(#arrow)"/><rect class="panel1" x="530" y="210" width="220" height="200" rx="12"/><text class="ph" x="640" y="240" text-anchor="middle"><tspan x="640" dy="0">‏1. انفرادی دائرہ</tspan></text><text class="label" x="730" y="268" text-anchor="end"><tspan x="730" dy="0">روحانی پاکیزگی:‏</tspan></text><text class="support" x="730" y="290" text-anchor="end"><tspan x="730" dy="0">تقویٰ کی پرورش</tspan><tspan x="730" dy="20">اور اخلاقی شعور</tspan></text><text class="label" x="730" y="345" text-anchor="end"><tspan x="730" dy="0">ذاتی ضبطِ نفس:‏</tspan></text><text class="support" x="730" y="367" text-anchor="end"><tspan x="730" dy="0">لالچ، غصے اور تکبر</tspan><tspan x="730" dy="20">پر قابو پانا</tspan></text><rect class="panel2" x="280" y="210" width="220" height="200" rx="12"/><text class="ph" x="390" y="240" text-anchor="middle"><tspan x="390" dy="0">‏2. خاندانی دائرہ</tspan></text><text class="label" x="480" y="268" text-anchor="end"><tspan x="480" dy="0">گھریلو نظم و ضبط:‏</tspan></text><text class="support" x="480" y="290" text-anchor="end"><tspan x="480" dy="0">نماز کے مشترک اوقات،‏</tspan><tspan x="480" dy="20">کھانا اور وقت کی پابندی</tspan></text><text class="label" x="480" y="345" text-anchor="end"><tspan x="480" dy="0">باہمی ذمہ داری:‏</tspan></text><text class="support" x="480" y="367" text-anchor="end"><tspan x="480" dy="0">والدین اور بچوں کے حقوق</tspan><tspan x="480" dy="20">اور شفقت بھری نگہداشت</tspan></text><rect class="panel3" x="30" y="210" width="220" height="200" rx="12"/><text class="ph" x="140" y="240" text-anchor="middle"><tspan x="140" dy="0">‏3. معاشرتی دائرہ</tspan></text><text class="label" x="230" y="268" text-anchor="end"><tspan x="230" dy="0">شہری مساوات:‏</tspan></text><text class="support" x="230" y="290" text-anchor="end"><tspan x="230" dy="0">عوامی نماز میں ذات اور</tspan><tspan x="230" dy="20">طبقے کا خاتمہ</tspan></text><text class="label" x="230" y="345" text-anchor="end"><tspan x="230" dy="0">معاشی یکجہتی:‏</tspan></text><text class="support" x="230" y="367" text-anchor="end"><tspan x="230" dy="0">زکوٰۃ غربت مٹاتی ہے؛‏</tspan><tspan x="230" dy="20">سب کی مشترک نگہداشت</tspan></text><text class="support" x="750" y="440" text-anchor="end"><tspan x="750" dy="0">عبادت فرد کے ضمیر، گھریلو اخلاق اور عوامی سماجی انصاف کو یکجا کرتی ہے۔</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
