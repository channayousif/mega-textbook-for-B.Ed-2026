<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four core virtues in Islam and their school applications</title><desc id="d">Table of four core virtues (truthfulness, justice, honesty, patience) showing their foundational Islamic textual basis and practical application in school leadership.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.cell{fill:var(--panel);stroke:var(--line);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.th{font-size:15px;font-weight:700;fill:var(--ink)}.label{font-size:14px;font-weight:600}.support{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="20" y="32" text-anchor="start"><tspan x="20" dy="0">Core Islamic Virtues (Akhlaq) in Educational Practice</tspan></text><rect class="panel" x="20" y="50" width="140" height="45" rx="8"/><text class="th" x="30" y="78" text-anchor="start"><tspan x="30" dy="0">Core Virtue</tspan></text><rect class="panel" x="165" y="50" width="145" height="45" rx="8"/><text class="th" x="175" y="78" text-anchor="start"><tspan x="175" dy="0">Textual Basis</tspan></text><rect class="panel" x="315" y="50" width="220" height="45" rx="8"/><text class="th" x="325" y="78" text-anchor="start"><tspan x="325" dy="0">Moral Meaning</tspan></text><rect class="panel" x="540" y="50" width="220" height="45" rx="8"/><text class="th" x="550" y="78" text-anchor="start"><tspan x="550" dy="0">Classroom Application</tspan></text><rect class="cell" x="20" y="105" width="140" height="75" rx="6"/><text class="label" x="30" y="135" text-anchor="start"><tspan x="30" dy="0">Truthfulness (Sidq)</tspan></text><text class="support" x="30" y="155" text-anchor="start"><tspan x="30" dy="0">Integrity in speech</tspan></text><rect class="cell" x="165" y="105" width="145" height="75" rx="6"/><text class="support" x="175" y="135" text-anchor="start"><tspan x="175" dy="0">Surah At-Tawbah</tspan><tspan x="175" dy="18">9:119 ("Be with</tspan><tspan x="175" dy="18">those who are true")</tspan></text><rect class="cell" x="315" y="105" width="220" height="75" rx="6"/><text class="support" x="325" y="132" text-anchor="start"><tspan x="325" dy="0">Conformity of word,</tspan><tspan x="325" dy="18">heart, and action; rejecting</tspan><tspan x="325" dy="18">deception and false claims</tspan></text><rect class="cell" x="540" y="105" width="220" height="75" rx="6"/><text class="support" x="550" y="132" text-anchor="start"><tspan x="550" dy="0">Accurate grading records;</tspan><tspan x="550" dy="18">admitting when unsure;</tspan><tspan x="550" dy="18">fostering honest enquiry</tspan></text><rect class="cell" x="20" y="190" width="140" height="75" rx="6"/><text class="label" x="30" y="220" text-anchor="start"><tspan x="30" dy="0">Justice (Adl)</tspan></text><text class="support" x="30" y="240" text-anchor="start"><tspan x="30" dy="0">Impartial fairness</tspan></text><rect class="cell" x="165" y="190" width="145" height="75" rx="6"/><text class="support" x="175" y="220" text-anchor="start"><tspan x="175" dy="0">Surah An-Nisa</tspan><tspan x="175" dy="18">4:135 and 5:8</tspan><tspan x="175" dy="18">("Stand firm in justice")</tspan></text><rect class="cell" x="315" y="190" width="220" height="75" rx="6"/><text class="support" x="325" y="217" text-anchor="start"><tspan x="325" dy="0">Rendering every person</tspan><tspan x="325" dy="18">their due without bias,</tspan><tspan x="325" dy="18">favouritism, or prejudice</tspan></text><rect class="cell" x="540" y="190" width="220" height="75" rx="6"/><text class="support" x="550" y="217" text-anchor="start"><tspan x="550" dy="0">Equal praise and feedback;</tspan><tspan x="550" dy="18">equitable access to seats</tspan><tspan x="550" dy="18">regardless of family status</tspan></text><rect class="cell" x="20" y="275" width="140" height="75" rx="6"/><text class="label" x="30" y="305" text-anchor="start"><tspan x="30" dy="0">Honesty (Amanah)</tspan></text><text class="support" x="30" y="325" text-anchor="start"><tspan x="30" dy="0">Fulfilling trust</tspan></text><rect class="cell" x="165" y="275" width="145" height="75" rx="6"/><text class="support" x="175" y="305" text-anchor="start"><tspan x="175" dy="0">Surah An-Nisa</tspan><tspan x="175" dy="18">4:58 ("Render trusts</tspan><tspan x="175" dy="18">to whom they are due")</tspan></text><rect class="cell" x="315" y="275" width="220" height="75" rx="6"/><text class="support" x="325" y="302" text-anchor="start"><tspan x="325" dy="0">Safeguarding duties,</tspan><tspan x="325" dy="18">confidences, and resources</tspan><tspan x="325" dy="18">entrusted by God and people</tspan></text><rect class="cell" x="540" y="275" width="220" height="75" rx="6"/><text class="support" x="550" y="302" text-anchor="start"><tspan x="550" dy="0">Viewing learners as a trust;</tspan><tspan x="550" dy="18">safeguarding test papers;</tspan><tspan x="550" dy="18">protecting school resources</tspan></text><rect class="cell" x="20" y="360" width="140" height="75" rx="6"/><text class="label" x="30" y="390" text-anchor="start"><tspan x="30" dy="0">Patience (Sabr)</tspan></text><text class="support" x="30" y="410" text-anchor="start"><tspan x="30" dy="0">Steadfast endurance</tspan></text><rect class="cell" x="165" y="360" width="145" height="75" rx="6"/><text class="support" x="175" y="390" text-anchor="start"><tspan x="175" dy="0">Surah Al-Baqarah</tspan><tspan x="175" dy="18">2:153 ("Allah is with</tspan><tspan x="175" dy="18">the patient")</tspan></text><rect class="cell" x="315" y="360" width="220" height="75" rx="6"/><text class="support" x="325" y="387" text-anchor="start"><tspan x="325" dy="0">Emotional self-regulation;</tspan><tspan x="325" dy="18">perseverance under hardship;</tspan><tspan x="325" dy="18">restraint from retaliation</tspan></text><rect class="cell" x="540" y="360" width="220" height="75" rx="6"/><text class="support" x="550" y="387" text-anchor="start"><tspan x="550" dy="0">Calm disciplinary response;</tspan><tspan x="550" dy="18">persistent coaching of slow</tspan><tspan x="550" dy="18">learners; avoiding anger</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
