<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلام کی چار بنیادی عبادات کا موازنہ</title><desc id="d">جدول: نماز، زکوٰۃ، صوم اور حج کا موازنہ ان کے بنیادی تقاضے، فرد کے روحانی مقصد اور براہِ راست سماجی اہمیت کے لحاظ سے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.cell{fill:var(--panel);stroke:var(--line);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.th{font-size:15px;font-weight:700;fill:var(--ink)}.label{font-size:14px;font-weight:600}.support{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="760" y="32" text-anchor="end"><tspan x="760" dy="0">اسلام کی چار بنیادی عبادات</tspan></text><rect class="panel" x="630" y="50" width="130" height="45" rx="8"/><text class="th" x="750" y="78" text-anchor="end"><tspan x="750" dy="0">عبادت</tspan></text><rect class="panel" x="435" y="50" width="190" height="45" rx="8"/><text class="th" x="615" y="78" text-anchor="end"><tspan x="615" dy="0">بنیادی تقاضا</tspan></text><rect class="panel" x="230" y="50" width="200" height="45" rx="8"/><text class="th" x="420" y="78" text-anchor="end"><tspan x="420" dy="0">فرد کا مقصد</tspan></text><rect class="panel" x="20" y="50" width="205" height="45" rx="8"/><text class="th" x="215" y="78" text-anchor="end"><tspan x="215" dy="0">سماجی اہمیت</tspan></text><rect class="cell" x="630" y="105" width="130" height="75" rx="6"/><text class="label" x="750" y="135" text-anchor="end"><tspan x="750" dy="0">نماز</tspan></text><text class="support" x="750" y="160" text-anchor="end"><tspan x="750" dy="0">روزانہ کا معمول</tspan></text><rect class="cell" x="435" y="105" width="190" height="75" rx="6"/><text class="support" x="615" y="127" text-anchor="end"><tspan x="615" dy="0">مقررہ اوقات میں پانچ روزانہ</tspan><tspan x="615" dy="20">نمازیں، جسمانی پاکیزگی</tspan><tspan x="615" dy="20">‏(طہارت) کے ساتھ</tspan></text><rect class="cell" x="230" y="105" width="200" height="75" rx="6"/><text class="support" x="420" y="135" text-anchor="end"><tspan x="420" dy="0">روحانی بیداری، اللہ کی یاد</tspan><tspan x="420" dy="20">اور اخلاقی ضبط (29:45)‏</tspan></text><rect class="cell" x="20" y="105" width="205" height="75" rx="6"/><text class="support" x="215" y="127" text-anchor="end"><tspan x="215" dy="0">سماجی درجے مٹاتی ہے؛‏</tspan><tspan x="215" dy="20">باجماعت صفیں تمام شہریوں</tspan><tspan x="215" dy="20">کو مساوات میں جوڑتی ہیں</tspan></text><rect class="cell" x="630" y="190" width="130" height="75" rx="6"/><text class="label" x="750" y="220" text-anchor="end"><tspan x="750" dy="0">صوم (روزہ)‏</tspan></text><text class="support" x="750" y="245" text-anchor="end"><tspan x="750" dy="0">رمضان کے روزے</tspan></text><rect class="cell" x="435" y="190" width="190" height="75" rx="6"/><text class="support" x="615" y="212" text-anchor="end"><tspan x="615" dy="0">صبح سے غروبِ آفتاب تک کھانے،‏</tspan><tspan x="615" dy="20">پینے اور پست خواہشات</tspan><tspan x="615" dy="20">سے پرہیز</tspan></text><rect class="cell" x="230" y="190" width="200" height="75" rx="6"/><text class="support" x="420" y="212" text-anchor="end"><tspan x="420" dy="0">تقویٰ کی پرورش (2:183)،‏</tspan><tspan x="420" dy="20">صبر، ضبطِ نفس اور انا</tspan><tspan x="420" dy="20">پر قابو</tspan></text><rect class="cell" x="20" y="190" width="205" height="75" rx="6"/><text class="support" x="215" y="212" text-anchor="end"><tspan x="215" dy="0">بھوکوں سے براہِ راست ہمدردی؛‏</tspan><tspan x="215" dy="20">اجتماعی افطار اور</tspan><tspan x="215" dy="20">باہمی سخاوت</tspan></text><rect class="cell" x="630" y="275" width="130" height="75" rx="6"/><text class="label" x="750" y="305" text-anchor="end"><tspan x="750" dy="0">زکوٰۃ</tspan></text><text class="support" x="750" y="330" text-anchor="end"><tspan x="750" dy="0">سالانہ مالی حق</tspan></text><rect class="cell" x="435" y="275" width="190" height="75" rx="6"/><text class="support" x="615" y="305" text-anchor="end"><tspan x="615" dy="0">نصاب کی حد سے زائد مال</tspan><tspan x="615" dy="20">پر 2.5% سالانہ</tspan></text><rect class="cell" x="230" y="275" width="200" height="75" rx="6"/><text class="support" x="420" y="305" text-anchor="end"><tspan x="420" dy="0">مال کی پاکیزگی، لالچ پر قابو</tspan><tspan x="420" dy="20">اور امانت داری کا اعتراف</tspan></text><rect class="cell" x="20" y="275" width="205" height="75" rx="6"/><text class="support" x="215" y="297" text-anchor="end"><tspan x="215" dy="0">معاشی انصاف؛ سورۃ 9:60 کے</tspan><tspan x="215" dy="20">مطابق کمزور گروہوں کے</tspan><tspan x="215" dy="20">لیے سماجی تحفظ</tspan></text><rect class="cell" x="630" y="360" width="130" height="75" rx="6"/><text class="label" x="750" y="390" text-anchor="end"><tspan x="750" dy="0">حج</tspan></text><text class="support" x="750" y="415" text-anchor="end"><tspan x="750" dy="0">زندگی میں ایک بار</tspan></text><rect class="cell" x="435" y="360" width="190" height="75" rx="6"/><text class="support" x="615" y="382" text-anchor="end"><tspan x="615" dy="0">جسمانی اور مالی استطاعت</tspan><tspan x="615" dy="20">رکھنے والوں کے لیے مکہ</tspan><tspan x="615" dy="20">کی زیارت</tspan></text><rect class="cell" x="230" y="360" width="200" height="75" rx="6"/><text class="support" x="420" y="382" text-anchor="end"><tspan x="420" dy="0">اللہ کی اعلیٰ ترین بندگی،‏</tspan><tspan x="420" dy="20">دنیاوی غرور سے نجات اور</tspan><tspan x="420" dy="20">روحانی تجدید</tspan></text><rect class="cell" x="20" y="360" width="205" height="75" rx="6"/><text class="support" x="215" y="382" text-anchor="end"><tspan x="215" dy="0">عالمگیر اخوت؛ اللہ کے سامنے</tspan><tspan x="215" dy="20">انسانی مساوات کا</tspan><tspan x="215" dy="20">مظاہرہ</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
