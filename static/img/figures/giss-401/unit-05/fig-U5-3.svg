<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The System of Shura (Consultation) in Islamic Governance</title>
  <desc id="d">Diagram of Shura in Islamic governance showing consultative interaction between executive leadership, people of knowledge, and citizens under the rule of divine law.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .panel { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-blue { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-amber { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .cell { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .link { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
    .arrow { fill: var(--line); }
    text { fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; }
    .th { font-size: 14px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 600; }
    .support { font-size: 12px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>

  <rect class="bg" x="0" y="0" width="800" height="480" />

  <!-- Title -->
  <text class="h" x="25" y="32" text-anchor="start">Foundations of Shura (Consultative Governance) in Islam</text>

  <!-- Top Banner: Divine Sovereignty -->
  <rect class="panel" x="25" y="52" width="750" height="50" rx="8" />
  <text class="th" x="400" y="74" text-anchor="middle">Supreme Moral &amp; Legal Framework: Sovereignty of Allah (Hakimiyyah)</text>
  <text class="support" x="400" y="92" text-anchor="middle">Constitutional foundation: Revealed values of justice, human dignity, and protection of public welfare</text>

  <!-- Connective stem down from Sovereignty -->
  <path class="link" d="M 400 102 L 400 130" />
  <polygon class="arrow" points="395,130 400,140 405,130" />

  <!-- Central Box: Executive Leadership -->
  <rect class="panel-blue" x="250" y="140" width="300" height="85" rx="8" />
  <text class="th" x="400" y="165" text-anchor="middle">Executive Leadership (Ameer / Khalifah)</text>
  <text class="support" x="400" y="185" text-anchor="middle">Authority held as a sacred trust (Amanah, 4:58)</text>
  <text class="support" x="400" y="203" text-anchor="middle">Required to consult community (Qur'an 3:159; 42:38)</text>

  <!-- Left Consultation Node: Ahl al-Hall wal-Aqd -->
  <rect class="panel-amber" x="25" y="140" width="195" height="85" rx="8" />
  <text class="th" x="122" y="165" text-anchor="middle">Council of Experts</text>
  <text class="label" x="122" y="185" text-anchor="middle">(Ahl al-Hall wal-Aqd)</text>
  <text class="support" x="122" y="203" text-anchor="middle">Jurists &amp; specialists</text>

  <!-- Right Consultation Node: Public & Community -->
  <rect class="panel-amber" x="580" y="140" width="195" height="85" rx="8" />
  <text class="th" x="677" y="165" text-anchor="middle">Citizens &amp; Public</text>
  <text class="label" x="677" y="185" text-anchor="middle">(General Community)</text>
  <text class="support" x="677" y="203" text-anchor="middle">Feedback &amp; petitions</text>

  <!-- Bidirectional Arrows Left <-> Center -->
  <path class="link" d="M 220 175 L 250 175" />
  <polygon class="arrow" points="225,170 215,175 225,180" />
  <polygon class="arrow" points="245,170 255,175 245,180" />

  <!-- Bidirectional Arrows Center <-> Right -->
  <path class="link" d="M 550 175 L 580 175" />
  <polygon class="arrow" points="555,170 545,175 555,180" />
  <polygon class="arrow" points="575,170 585,175 575,180" />

  <!-- Connector down to Core Principles -->
  <path class="link" d="M 400 225 L 400 255" />
  <polygon class="arrow" points="395,255 400,265 405,255" />

  <!-- Three Columns of Governance Principles -->
  <!-- Pillar 1: Impartial Justice -->
  <rect class="cell" x="25" y="270" width="235" height="150" rx="8" />
  <text class="th" x="35" y="295" text-anchor="start">1. Impartial Justice (Adl)</text>
  <text class="support" x="35" y="320" text-anchor="start">• Rule of law binds rulers and citizens</text>
  <text class="support" x="35" y="340" text-anchor="start">• Independent judiciary with no executive</text>
  <text class="support" x="35" y="358" text-anchor="start">  immunity from prosecution</text>
  <text class="support" x="35" y="378" text-anchor="start">• Equal protection regardless of religion,</text>
  <text class="support" x="35" y="396" text-anchor="start">  ethnicity, or social background (5:8)</text>

  <!-- Pillar 2: Mutual Consultation -->
  <rect class="cell" x="282" y="270" width="236" height="150" rx="8" />
  <text class="th" x="292" y="295" text-anchor="start">2. Consultation (Shura)</text>
  <text class="support" x="292" y="320" text-anchor="start">• Collaborative decision-making on</text>
  <text class="support" x="292" y="340" text-anchor="start">  unregulated public policy (ijtihad)</text>
  <text class="support" x="292" y="358" text-anchor="start">• Valuing knowledge and diverse views</text>
  <text class="support" x="292" y="378" text-anchor="start">• Institutional councils prevent autocracy</text>
  <text class="support" x="292" y="396" text-anchor="start">  and executive despotism</text>

  <!-- Pillar 3: Public Accountability -->
  <rect class="cell" x="540" y="270" width="235" height="150" rx="8" />
  <text class="th" x="550" y="295" text-anchor="start">3. Accountability (Muhasabah)</text>
  <text class="support" x="550" y="320" text-anchor="start">• Leaders directly answerable to public</text>
  <text class="support" x="550" y="340" text-anchor="start">• Transparent management of public funds</text>
  <text class="support" x="550" y="358" text-anchor="start">  and institutional resources</text>
  <text class="support" x="550" y="378" text-anchor="start">• Civic right to question administrative</text>
  <text class="support" x="550" y="396" text-anchor="start">  decisions and propose improvements</text>

  <!-- Wordmark -->
  <text class="wm" x="785" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>