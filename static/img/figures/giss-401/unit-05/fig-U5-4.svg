<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Rights of Minorities: Islamic Teaching and Pakistan's Constitution</title>
  <desc id="d">Table comparing the rights of religious minorities in Islamic jurisprudence and under the 1973 Constitution of Pakistan.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .panel { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .cell { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    text { fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; }
    .th { font-size: 15px; font-weight: 700; fill: var(--ink); }
    .label { font-size: 14px; font-weight: 600; }
    .support { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>

  <rect class="bg" x="0" y="0" width="780" height="470" />

  <!-- Title -->
  <text class="h" x="20" y="32" text-anchor="start">Rights of Minorities in Islamic Teaching and Pakistan's Constitution</text>

  <!-- Table Header -->
  <rect class="panel" x="20" y="50" width="160" height="45" rx="8" />
  <text class="th" x="30" y="78" text-anchor="start">Rights Dimension</text>

  <rect class="panel" x="185" y="50" width="280" height="45" rx="8" />
  <text class="th" x="195" y="78" text-anchor="start">Islamic Jurisprudence Basis</text>

  <rect class="panel" x="470" y="50" width="290" height="45" rx="8" />
  <text class="th" x="480" y="78" text-anchor="start">Pakistan 1973 Constitution</text>

  <!-- Row 1: Freedom of Conscience -->
  <rect class="cell" x="20" y="105" width="160" height="65" rx="6" />
  <text class="label" x="30" y="132" text-anchor="start">Religious Freedom</text>
  <text class="support" x="30" y="152" text-anchor="start">Freedom of belief</text>

  <rect class="cell" x="185" y="105" width="280" height="65" rx="6" />
  <text class="support" x="195" y="132" text-anchor="start">No compulsion in religion (2:256);</text>
  <text class="support" x="195" y="152" text-anchor="start">non-Muslims retain complete personal faith</text>

  <rect class="cell" x="470" y="105" width="290" height="65" rx="6" />
  <text class="support" x="480" y="132" text-anchor="start">Article 20: Every citizen has the right</text>
  <text class="support" x="480" y="152" text-anchor="start">to profess, practise, and propagate religion</text>

  <!-- Row 2: Educational Safeguards -->
  <rect class="cell" x="20" y="175" width="160" height="65" rx="6" />
  <text class="label" x="30" y="202" text-anchor="start">School Safeguards</text>
  <text class="support" x="30" y="222" text-anchor="start">Classroom rights</text>

  <rect class="cell" x="185" y="175" width="280" height="65" rx="6" />
  <text class="support" x="195" y="202" text-anchor="start">Forbids compelling non-Muslims into Islamic</text>
  <text class="support" x="195" y="222" text-anchor="start">worship rituals; protects communal autonomy</text>

  <rect class="cell" x="470" y="175" width="290" height="65" rx="6" />
  <text class="support" x="480" y="202" text-anchor="start">Article 22: No pupil required to receive</text>
  <text class="support" x="480" y="222" text-anchor="start">instruction in a religion other than their own</text>

  <!-- Row 3: Places of Worship -->
  <rect class="cell" x="20" y="245" width="160" height="65" rx="6" />
  <text class="label" x="30" y="272" text-anchor="start">Sacred Places</text>
  <text class="support" x="30" y="292" text-anchor="start">Sanctuary protection</text>

  <rect class="cell" x="185" y="245" width="280" height="65" rx="6" />
  <text class="support" x="195" y="272" text-anchor="start">State commanded to protect churches,</text>
  <text class="support" x="195" y="292" text-anchor="start">synagogues, and temples (Qur'an 22:40)</text>

  <rect class="cell" x="470" y="245" width="290" height="65" rx="6" />
  <text class="support" x="480" y="272" text-anchor="start">Article 20(b): Right to establish, maintain,</text>
  <text class="support" x="480" y="292" text-anchor="start">and manage religious places and institutions</text>

  <!-- Row 4: Equal Protection of Law -->
  <rect class="cell" x="20" y="315" width="160" height="65" rx="6" />
  <text class="label" x="30" y="342" text-anchor="start">Equal Justice</text>
  <text class="support" x="30" y="362" text-anchor="start">Legal standing</text>

  <rect class="cell" x="185" y="315" width="280" height="65" rx="6" />
  <text class="support" x="195" y="342" text-anchor="start">Life, honor, and property sacred; treaty</text>
  <text class="support" x="195" y="362" text-anchor="start">protection (dhimmah) guarantees civil safety</text>

  <rect class="cell" x="470" y="315" width="290" height="65" rx="6" />
  <text class="support" x="480" y="342" text-anchor="start">Article 25: All citizens equal before the law</text>
  <text class="support" x="480" y="362" text-anchor="start">and entitled to equal protection of law</text>

  <!-- Row 5: Civic Representation -->
  <rect class="cell" x="20" y="385" width="160" height="65" rx="6" />
  <text class="label" x="30" y="412" text-anchor="start">Representation</text>
  <text class="support" x="30" y="432" text-anchor="start">Public participation</text>

  <rect class="cell" x="185" y="385" width="280" height="65" rx="6" />
  <text class="support" x="195" y="412" text-anchor="start">Mithaq al-Madinah established civic unity;</text>
  <text class="support" x="195" y="432" text-anchor="start">all non-Muslim groups partner in security</text>

  <rect class="cell" x="470" y="385" width="290" height="65" rx="6" />
  <text class="support" x="480" y="412" text-anchor="start">Article 36: State shall safeguard legitimate</text>
  <text class="support" x="480" y="432" text-anchor="start">rights and due representation of minorities</text>

  <!-- Wordmark -->
  <text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>