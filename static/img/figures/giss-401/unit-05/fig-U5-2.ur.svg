<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">زکوٰۃ (لازمی حق) اور صدقہ (نفلی خیرات) کا موازنہ</title>
  <desc id="d">جدول: زکوٰۃ اور نفلی خیرات (صدقہ) کا شرعی حیثیت، شرح و نصاب، مستحقین کی حدود، وقت اور دائرۂ عمل کے لحاظ سے موازنہ۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .panel { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .cell { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    text { fill: var(--ink); }
    .h { font-size: 16px; font-weight: 700; }
    .th { font-size: 14px; font-weight: 700; fill: var(--ink); }
    .label { font-size: 12px; font-weight: 600; }
    .support { font-size: 11px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>

  <rect class="bg" x="0" y="0" width="780" height="470" />

  <!-- Title -->
  <text class="h" x="760" y="32" text-anchor="end">زکوٰۃ (لازمی حق) اور صدقہ (نفلی خیرات) کا موازنہ</text>

  <!-- Table Header -->
  <rect class="panel" x="600" y="50" width="160" height="45" rx="8" />
  <text class="th" x="750" y="78" text-anchor="end">پہلو</text>

  <rect class="panel" x="310" y="50" width="280" height="45" rx="8" />
  <text class="th" x="580" y="78" text-anchor="end">زکوٰۃ (لازمی حق)</text>

  <rect class="panel" x="20" y="50" width="280" height="45" rx="8" />
  <text class="th" x="290" y="78" text-anchor="end">صدقہ (نفلی خیرات)</text>

  <!-- Row 1: Legal Status -->
  <rect class="cell" x="600" y="105" width="160" height="65" rx="6" />
  <text class="label" x="750" y="132" text-anchor="end">شرعی حیثیت</text>
  <text class="support" x="750" y="152" text-anchor="end">ذمہ داری کی قسم</text>

  <rect class="cell" x="310" y="105" width="280" height="65" rx="6" />
  <text class="support" x="580" y="132" text-anchor="end">اسلام کا لازمی رکن (فرضِ عین)؛</text>
  <text class="support" x="580" y="152" text-anchor="end">قانونی اور دینی جوابدہی کے ساتھ الٰہی حکم</text>

  <rect class="cell" x="20" y="105" width="280" height="65" rx="6" />
  <text class="support" x="290" y="132" text-anchor="end">نفلی سخاوت (نفل / مستحب)؛</text>
  <text class="support" x="290" y="152" text-anchor="end">باعثِ اجر و ثواب مگر قانونی طور پر لازم نہیں</text>

  <!-- Row 2: Rate & Threshold -->
  <rect class="cell" x="600" y="175" width="160" height="65" rx="6" />
  <text class="label" x="750" y="202" text-anchor="end">شرح اور نصاب</text>
  <text class="support" x="750" y="222" text-anchor="end">حساب کی بنیاد</text>

  <rect class="cell" x="310" y="175" width="280" height="65" rx="6" />
  <text class="support" x="580" y="202" text-anchor="end">شرعاً مقررہ شرح (عموماً 2.5%)؛</text>
  <text class="support" x="580" y="222" text-anchor="end">نصاب کی حد سے زائد خالص مال ہونا ضروری ہے</text>

  <rect class="cell" x="20" y="175" width="280" height="65" rx="6" />
  <text class="support" x="290" y="202" text-anchor="end">کوئی مقررہ حد نہیں؛ خرچ کرنے والا</text>
  <text class="support" x="290" y="222" text-anchor="end">اپنی ذاتی گنجائش کے مطابق رقم دیتا ہے</text>

  <!-- Row 3: Eligible Recipients -->
  <rect class="cell" x="600" y="245" width="160" height="65" rx="6" />
  <text class="label" x="750" y="272" text-anchor="end">مستحقین کی حدود</text>
  <text class="support" x="750" y="292" text-anchor="end">ہدف گروہ</text>

  <rect class="cell" x="310" y="245" width="280" height="65" rx="6" />
  <text class="support" x="580" y="272" text-anchor="end">قرآن کی 8 مقررہ اصناف (9:60) تک محدود؛</text>
  <text class="support" x="580" y="292" text-anchor="end">عمارتوں یا عام تعمیرات پر خرچ نہیں ہو سکتی</text>

  <rect class="cell" x="20" y="245" width="280" height="65" rx="6" />
  <text class="support" x="290" y="272" text-anchor="end">ہر ضرورت مند، غیر مسلم، رشتہ داروں اور</text>
  <text class="support" x="290" y="292" text-anchor="end">اسکول و اسپتال کی تعمیر کے لیے بھی جائز</text>

  <!-- Row 4: Timing & Recurrence -->
  <rect class="cell" x="600" y="315" width="160" height="65" rx="6" />
  <text class="label" x="750" y="342" text-anchor="end">وقت اور میعاد</text>
  <text class="support" x="750" y="362" text-anchor="end">ادائیگی کا شیڈول</text>

  <rect class="cell" x="310" y="315" width="280" height="65" rx="6" />
  <text class="support" x="580" y="342" text-anchor="end">قمری سال میں ایک بار، جب مال پورا</text>
  <text class="support" x="580" y="362" text-anchor="end">ایک سال تک ملکیت میں رہے (حول)</text>

  <rect class="cell" x="20" y="315" width="280" height="65" rx="6" />
  <text class="support" x="290" y="342" text-anchor="end">کسی بھی وقت؛ ضرورت پر فوری ردِ عمل یا</text>
  <text class="support" x="290" y="362" text-anchor="end">مسلسل روزمرہ سخاوت اور خیر سگالی</text>

  <!-- Row 5: Scope of Action -->
  <rect class="cell" x="600" y="385" width="160" height="65" rx="6" />
  <text class="label" x="750" y="412" text-anchor="end">دائرۂ عمل</text>
  <text class="support" x="750" y="432" text-anchor="end">مادی اور اخلاقی وسعت</text>

  <rect class="cell" x="310" y="385" width="280" height="65" rx="6" />
  <text class="support" x="580" y="412" text-anchor="end">مخصوص اثاثوں پر مالی حق (نقدی، سونا،</text>
  <text class="support" x="580" y="432" text-anchor="end">چاندی، مویشی، مالِ تجارت اور فصل)</text>

  <rect class="cell" x="20" y="385" width="280" height="65" rx="6" />
  <text class="support" x="290" y="412" text-anchor="end">مال کے علاوہ مسکرا کر ملنا، خیر خواہی،</text>
  <text class="support" x="290" y="432" text-anchor="end">اور راستے سے تکلیف دہ چیز ہٹانا بھی صدقہ ہے</text>

  <!-- Wordmark -->
  <text class="wm" x="12" y="462" text-anchor="start" aria-hidden="true">textbook.com.pk</text>
</svg>
