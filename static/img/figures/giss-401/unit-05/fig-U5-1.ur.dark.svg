<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">زکوٰۃ دولت کو کیسے گردش میں لاتی ہے: جانچ، شرح اور تقسیم</title>
  <desc id="d">فلو چارٹ: زکوٰۃ کس طرح نصاب سے زائد مال رکھنے والوں سے ادارہ جاتی وصولی کے ذریعے قرآن کے بیان کردہ آٹھ مستحقین تک منتقل ہوتی ہے۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .panel { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-blue { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-amber { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .cell { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .link { fill: none; stroke: var(--line); stroke-width: 2; stroke-linecap: round; }
    .arrow { fill: var(--line); }
    text { fill: var(--ink); }
    .h { font-size: 16px; font-weight: 700; }
    .th { font-size: 13px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .support { font-size: 11px; fill: var(--muted); }
    .note { font-size: 11px; font-weight: 500; fill: var(--ink); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>

  <rect class="bg" x="0" y="0" width="780" height="480" />

  <!-- Title -->
  <text class="h" x="760" y="32" text-anchor="end">زکوٰۃ دولت کو کیسے گردش میں لاتی ہے: جانچ، شرح اور تقسیم</text>

  <!-- Stage 1 (Right): Wealth Holders -->
  <rect class="panel" x="524" y="55" width="236" height="80" rx="8" />
  <text class="th" x="748" y="78" text-anchor="end">1. صاحبِ نصاب افراد</text>
  <text class="support" x="748" y="98" text-anchor="end">ایک قمری سال (حول) تک زائد مال</text>
  <text class="support" x="748" y="118" text-anchor="end">نصاب: 87.48 گرام سونا / 612.36 گرام چاندی</text>

  <!-- Arrow 1 to 2 (Right to Left) -->
  <path class="link" d="M 524 95 L 518 95" />
  <polygon class="arrow" points="518,90 508,95 518,100" />

  <!-- Stage 2 (Middle): Prescribed Rates -->
  <rect class="panel-blue" x="272" y="55" width="236" height="80" rx="8" />
  <text class="th" x="496" y="78" text-anchor="end">2. زکوٰۃ کی شرعی شرح</text>
  <text class="support" x="496" y="98" text-anchor="end">نقدی، سونا، چاندی، مالِ تجارت: 2.5%</text>
  <text class="support" x="496" y="118" text-anchor="end">عشر: 5% مصنوعی آبپاشی، 10% بارانی</text>

  <!-- Arrow 2 to 3 (Right to Left) -->
  <path class="link" d="M 272 95 L 266 95" />
  <polygon class="arrow" points="266,90 256,95 266,100" />

  <!-- Stage 3 (Left): Institutional Purpose -->
  <rect class="panel-amber" x="20" y="55" width="236" height="80" rx="8" />
  <text class="th" x="244" y="78" text-anchor="end">3. وصولی اور مقصد</text>
  <text class="support" x="244" y="98" text-anchor="end">ضرورت مندوں کا الٰہی حق (حق، 51:19)</text>
  <text class="support" x="244" y="118" text-anchor="end">سرمائے کی گردش؛ ارتکاز کا خاتمہ (59:7)</text>

  <!-- Flow down to Beneficiaries -->
  <path class="link" d="M 390 135 L 390 165" />
  <polygon class="arrow" points="385,165 390,175 395,165" />

  <!-- Beneficiary Group Header -->
  <rect class="panel" x="20" y="175" width="740" height="35" rx="6" />
  <text class="th" x="390" y="198" text-anchor="middle">آٹھ شرعی مستحقین کے گروہ (سورۂ توبہ 9:60)</text>

  <!-- Beneficiary Card 1 (Right): Fuqara & Masakin -->
  <rect class="cell" x="524" y="225" width="236" height="115" rx="6" />
  <text class="label" x="748" y="248" text-anchor="end">براہِ راست غربت کا خاتمہ</text>
  <text class="support" x="748" y="270" text-anchor="end">• الفقراء: نادار جن کے پاس مال نہ ہو</text>
  <text class="support" x="748" y="290" text-anchor="end">• المساکین: وہ جن کی آمدنی</text>
  <text class="support" x="748" y="308" text-anchor="end">بنیادی گزر اوقات سے کم ہو</text>
  <text class="support" x="748" y="328" text-anchor="end">عزتِ نفس اور کفالت کی ضمانت</text>

  <!-- Beneficiary Card 2 (Middle): Administrative & Social -->
  <rect class="cell" x="272" y="225" width="236" height="115" rx="6" />
  <text class="label" x="496" y="248" text-anchor="end">ادارہ جاتی اور سماجی ضروریات</text>
  <text class="support" x="496" y="270" text-anchor="end">• العاملین علیہا: وصولی کا مجاز عملہ</text>
  <text class="support" x="496" y="290" text-anchor="end">• مؤلفۃ القلوب: دل جوئی کے لیے</text>
  <text class="support" x="496" y="308" text-anchor="end">• فی الرقاب: قیدیوں کو چھڑانا</text>
  <text class="support" x="496" y="328" text-anchor="end">شفاف اداروں کا قیام اور مدد</text>

  <!-- Beneficiary Card 3 (Left): Debt & Community -->
  <rect class="cell" x="20" y="225" width="236" height="115" rx="6" />
  <text class="label" x="244" y="248" text-anchor="end">ہنگامی حالات اور مفادِ عامہ</text>
  <text class="support" x="244" y="270" text-anchor="end">• الغارمین: دباؤ کے شکار مقروض</text>
  <text class="support" x="244" y="290" text-anchor="end">• فی سبیل اللہ: اجتماعی بھلائی</text>
  <text class="support" x="244" y="308" text-anchor="end">• ابن السبیل: مسافر کی مدد</text>
  <text class="support" x="244" y="328" text-anchor="end">ناگہانی تنگی میں سماجی تحفظ</text>

  <!-- Bottom Summary Panel -->
  <rect class="panel-blue" x="20" y="355" width="740" height="75" rx="8" />
  <text class="th" x="748" y="380" text-anchor="end">معاشی چکر اور سماجی اثرات</text>
  <text class="note" x="748" y="400" text-anchor="end">زکوٰۃ بیکار پڑے سرمائے کو کم آمدنی والے گھرانوں کی فعال قوتِ خرید میں بدلتی ہے۔</text>
  <text class="note" x="748" y="418" text-anchor="end">غیر فعال دولت پر کٹوتی اور سود کی ممانعت سے اسلام پیداواری تجارت اور سماجی مساوات کو ابھارتا ہے۔</text>

  <!-- Wordmark -->
  <text class="wm" x="20" y="465" text-anchor="start" aria-hidden="true">textbook.com.pk</text>
</svg>
