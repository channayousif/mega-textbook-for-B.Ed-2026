<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 426" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Sahih, hasan and daif, and an unsourced card</title><desc id="d">Sahih and hasan are accepted reliability categories, daif indicates unmet acceptance conditions, and an unsourced card still needs checking rather than a guessed grade.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="426"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Introductory hadith grades and how a learner responds</tspan></text><rect class="hd" x="22" y="52" width="150" height="40" rx="0"/><text class="label inv" x="32" y="76.8" text-anchor="start"><tspan x="32" dy="0">Grade</tspan></text><rect class="hd" x="172" y="52" width="230" height="40" rx="0"/><text class="label inv" x="182" y="76.8" text-anchor="start"><tspan x="182" dy="0">Introductory meaning</tspan></text><rect class="hd" x="402" y="52" width="220" height="40" rx="0"/><text class="label inv" x="412" y="76.8" text-anchor="start"><tspan x="412" dy="0">Evidence use</tspan></text><rect class="hd" x="622" y="52" width="216" height="40" rx="0"/><text class="label inv" x="632" y="76.8" text-anchor="start"><tspan x="632" dy="0">Learner response</tspan></text><rect class="p1" x="22" y="92" width="150" height="74" rx="0"/><text class="label" x="32" y="116.8" text-anchor="start"><tspan x="32" dy="0">Sahih (sound)</tspan></text><rect class="pn" x="172" y="92" width="230" height="74" rx="0"/><text class="support" x="182" y="115.2" text-anchor="start"><tspan x="182" dy="0">Connected chain of reliable,</tspan><tspan x="182" dy="18">precise narrators; no hidden</tspan><tspan x="182" dy="18">defect or contradiction</tspan></text><rect class="pn" x="402" y="92" width="220" height="74" rx="0"/><text class="support" x="412" y="115.2" text-anchor="start"><tspan x="412" dy="0">Accepted as evidence</tspan></text><rect class="pn" x="622" y="92" width="216" height="74" rx="0"/><text class="support" x="632" y="115.2" text-anchor="start"><tspan x="632" dy="0">Cite collection, number and</tspan><tspan x="632" dy="18">the grader named</tspan></text><rect class="p1" x="22" y="166" width="150" height="56" rx="0"/><text class="label" x="32" y="190.8" text-anchor="start"><tspan x="32" dy="0">Hasan (good)</tspan></text><rect class="pn" x="172" y="166" width="230" height="56" rx="0"/><text class="support" x="182" y="189.2" text-anchor="start"><tspan x="182" dy="0">Meets acceptance conditions,</tspan><tspan x="182" dy="18">with lower narrator precision</tspan></text><rect class="pn" x="402" y="166" width="220" height="56" rx="0"/><text class="support" x="412" y="189.2" text-anchor="start"><tspan x="412" dy="0">Generally accepted as</tspan><tspan x="412" dy="18">evidence</tspan></text><rect class="pn" x="622" y="166" width="216" height="56" rx="0"/><text class="support" x="632" y="189.2" text-anchor="start"><tspan x="632" dy="0">Cite it with its grade and</tspan><tspan x="632" dy="18">grader</tspan></text><rect class="p3" x="22" y="222" width="150" height="74" rx="0"/><text class="label" x="32" y="246.8" text-anchor="start"><tspan x="32" dy="0">Daif (weak)</tspan></text><rect class="pn" x="172" y="222" width="230" height="74" rx="0"/><text class="support" x="182" y="245.2" text-anchor="start"><tspan x="182" dy="0">Fails one or more acceptance</tspan><tspan x="182" dy="18">conditions; not automatically</tspan><tspan x="182" dy="18">fabricated</tspan></text><rect class="pn" x="402" y="222" width="220" height="74" rx="0"/><text class="support" x="412" y="245.2" text-anchor="start"><tspan x="412" dy="0">Not presented as certain;</tspan><tspan x="412" dy="18">use depends on scholarly</tspan><tspan x="412" dy="18">conditions</tspan></text><rect class="pn" x="622" y="222" width="216" height="74" rx="0"/><text class="support" x="632" y="245.2" text-anchor="start"><tspan x="632" dy="0">Do not present as certain;</tspan><tspan x="632" dy="18">consult a qualified scholar</tspan></text><rect class="p4" x="22" y="296" width="150" height="74" rx="0"/><text class="label" x="32" y="320.8" text-anchor="start"><tspan x="32" dy="0">No reference</tspan><tspan x="32" dy="20">on the card</tspan></text><rect class="pn" x="172" y="296" width="230" height="74" rx="0"/><text class="support" x="182" y="319.2" text-anchor="start"><tspan x="182" dy="0">Not a grade: the attribution is</tspan><tspan x="182" dy="18">unverified</tspan></text><rect class="pn" x="402" y="296" width="220" height="74" rx="0"/><text class="support" x="412" y="319.2" text-anchor="start"><tspan x="412" dy="0">Not used until checked</tspan></text><rect class="pn" x="622" y="296" width="216" height="74" rx="0"/><text class="support" x="632" y="319.2" text-anchor="start"><tspan x="632" dy="0">Write "attribution not yet</tspan><tspan x="632" dy="18">verified" and look for the</tspan><tspan x="632" dy="18">source</tspan></text><text class="support" x="24" y="396" text-anchor="start"><tspan x="24" dy="0">Fabrication is a separate judgment. Scholars can differ, so keep the grader's name with the grade.</tspan></text><text class="wm" x="848" y="416" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>