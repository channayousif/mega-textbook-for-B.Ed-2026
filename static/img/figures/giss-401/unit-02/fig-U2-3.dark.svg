<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four Qur'anic themes with references and possible school applications</title><desc id="d">Four themes link to precise Qur'anic references, with paraphrased meanings separated from possible school applications.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="446"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Four Qur'anic themes: reference, meaning and possible application</tspan></text><rect class="hd" x="22" y="52" width="120" height="60" rx="0"/><text class="label inv" x="32" y="76.8" text-anchor="start"><tspan x="32" dy="0">Theme</tspan></text><rect class="hd" x="142" y="52" width="170" height="60" rx="0"/><text class="label inv" x="152" y="76.8" text-anchor="start"><tspan x="152" dy="0">Reference</tspan></text><rect class="hd" x="312" y="52" width="270" height="60" rx="0"/><text class="label inv" x="322" y="76.8" text-anchor="start"><tspan x="322" dy="0">Paraphrased principle</tspan></text><rect class="hd" x="582" y="52" width="256" height="60" rx="0"/><text class="label inv" x="592" y="76.8" text-anchor="start"><tspan x="592" dy="0">Possible school</tspan><tspan x="592" dy="20">application</tspan></text><rect class="p1" x="22" y="112" width="120" height="74" rx="0"/><text class="label" x="32" y="136.8" text-anchor="start"><tspan x="32" dy="0">Knowledge</tspan></text><rect class="pn" x="142" y="112" width="170" height="74" rx="0"/><text class="support" x="152" y="135.2" text-anchor="start"><tspan x="152" dy="0">Al-'Alaq 96:1–5</tspan></text><rect class="pn" x="312" y="112" width="270" height="74" rx="0"/><text class="support" x="322" y="135.2" text-anchor="start"><tspan x="322" dy="0">Reading or reciting is linked with</tspan><tspan x="322" dy="18">the Creator, who taught by the</tspan><tspan x="322" dy="18">pen; learning is a gift</tspan></text><rect class="pn" x="582" y="112" width="256" height="74" rx="0"/><text class="support" x="592" y="135.2" text-anchor="start"><tspan x="592" dy="0">Possible: support a child learning</tspan><tspan x="592" dy="18">letters patiently, without</tspan><tspan x="592" dy="18">mockery</tspan></text><rect class="p1" x="22" y="186" width="120" height="74" rx="0"/><text class="label" x="32" y="210.8" text-anchor="start"><tspan x="32" dy="0">Justice</tspan></text><rect class="pn" x="142" y="186" width="170" height="74" rx="0"/><text class="support" x="152" y="209.2" text-anchor="start"><tspan x="152" dy="0">An-Nisa 4:135</tspan></text><rect class="pn" x="312" y="186" width="270" height="74" rx="0"/><text class="support" x="322" y="209.2" text-anchor="start"><tspan x="322" dy="0">Stand firmly for justice and truthful</tspan><tspan x="322" dy="18">witness, even against yourself or</tspan><tspan x="322" dy="18">relatives</tspan></text><rect class="pn" x="582" y="186" width="256" height="74" rx="0"/><text class="support" x="592" y="209.2" text-anchor="start"><tspan x="592" dy="0">Possible: mark a relative's script</tspan><tspan x="592" dy="18">with the same criteria as others</tspan></text><rect class="p1" x="22" y="260" width="120" height="74" rx="0"/><text class="label" x="32" y="284.8" text-anchor="start"><tspan x="32" dy="0">Kindness</tspan></text><rect class="pn" x="142" y="260" width="170" height="74" rx="0"/><text class="support" x="152" y="283.2" text-anchor="start"><tspan x="152" dy="0">Al-Isra 17:23–24</tspan></text><rect class="pn" x="312" y="260" width="270" height="74" rx="0"/><text class="support" x="322" y="283.2" text-anchor="start"><tspan x="322" dy="0">Worship Allah and treat parents</tspan><tspan x="322" dy="18">well, with respectful speech and</tspan><tspan x="322" dy="18">care in old age</tspan></text><rect class="pn" x="582" y="260" width="256" height="74" rx="0"/><text class="support" x="592" y="283.2" text-anchor="start"><tspan x="592" dy="0">Possible: practise respectful</tspan><tspan x="592" dy="18">speech; the passage itself</tspan><tspan x="592" dy="18">concerns parents</tspan></text><rect class="p1" x="22" y="334" width="120" height="56" rx="0"/><text class="label" x="32" y="358.8" text-anchor="start"><tspan x="32" dy="0">Honesty</tspan></text><rect class="pn" x="142" y="334" width="170" height="56" rx="0"/><text class="support" x="152" y="357.2" text-anchor="start"><tspan x="152" dy="0">Al-Ahzab 33:70</tspan></text><rect class="pn" x="312" y="334" width="270" height="56" rx="0"/><text class="support" x="322" y="357.2" text-anchor="start"><tspan x="322" dy="0">Be mindful of Allah and speak</tspan><tspan x="322" dy="18">uprightly</tspan></text><rect class="pn" x="582" y="334" width="256" height="56" rx="0"/><text class="support" x="592" y="357.2" text-anchor="start"><tspan x="592" dy="0">Possible: record attendance as it</tspan><tspan x="592" dy="18">actually happened</tspan></text><text class="support" x="24" y="416" text-anchor="start"><tspan x="24" dy="0">Principles are paraphrases, not quotations. Applications are a teacher's proposals, open to revision.</tspan></text><text class="wm" x="848" y="436" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>