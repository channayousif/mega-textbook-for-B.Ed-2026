<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 434" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Hadith assessment by scholars and the learner's role</title><desc id="d">Scholars examine transmission and text together before judging reliability, while learners locate and consult the assessment rather than assigning their own grade.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="840" height="434"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Specialist hadith assessment, and what a learner does</tspan></text><text class="label" x="24" y="66" text-anchor="start"><tspan x="24" dy="0">Specialist assessment (qualified scholars)</tspan></text><rect class="p1" x="24" y="80" width="180" height="150" rx="8"/><text class="label" x="36" y="129.8" text-anchor="start"><tspan x="36" dy="0">1. Locate the</tspan><tspan x="36" dy="20">report</tspan></text><text class="support" x="36" y="172.2" text-anchor="start"><tspan x="36" dy="0">Collection, number,</tspan><tspan x="36" dy="18">full wording</tspan></text><rect class="p2" x="250" y="80" width="170" height="150" rx="8"/><text class="label" x="262" y="130.8" text-anchor="start"><tspan x="262" dy="0">Isnad</tspan></text><text class="support" x="262" y="153.2" text-anchor="start"><tspan x="262" dy="0">Chain: continuous?</tspan><tspan x="262" dy="18">narrators reliable</tspan><tspan x="262" dy="18">and precise?</tspan></text><rect class="p2" x="440" y="80" width="170" height="150" rx="8"/><text class="label" x="452" y="130.8" text-anchor="start"><tspan x="452" dy="0">Matn</tspan></text><text class="support" x="452" y="153.2" text-anchor="start"><tspan x="452" dy="0">Text: hidden defect?</tspan><tspan x="452" dy="18">conflict with</tspan><tspan x="452" dy="18">stronger reports?</tspan></text><path class="link" d="M420,155 L440,155"/><text class="support" x="435" y="252" text-anchor="middle"><tspan x="435" dy="0">2. Examined together</tspan></text><rect class="p1" x="636" y="80" width="180" height="150" rx="8"/><text class="label" x="648" y="129.8" text-anchor="start"><tspan x="648" dy="0">3. Compare and</tspan><tspan x="648" dy="20">judge</tspan></text><text class="support" x="648" y="172.2" text-anchor="start"><tspan x="648" dy="0">Sahih, hasan or daif;</tspan><tspan x="648" dy="18">scholars may differ</tspan></text><path class="link" d="M204,155 L248,155" marker-end="url(#arrow)"/><path class="link" d="M610,155 L634,155" marker-end="url(#arrow)"/><path class="dash" d="M24,276 L816,276"/><text class="label" x="24" y="306" text-anchor="start"><tspan x="24" dy="0">Learner action (this unit)</tspan></text><rect class="p3" x="24" y="320" width="380" height="78" rx="8"/><text class="support" x="36" y="345.2" text-anchor="start"><tspan x="36" dy="0">Record collection, number and exact wording.</tspan><tspan x="36" dy="18">Consult a recognised assessment or a qualified</tspan><tspan x="36" dy="18">scholar.</tspan></text><rect class="p3" x="436" y="320" width="380" height="60" rx="8"/><text class="support" x="448" y="345.2" text-anchor="start"><tspan x="448" dy="0">Do not assign a grade yourself. No reference</tspan><tspan x="448" dy="18">found: write "attribution not yet verified".</tspan></text><path class="link" d="M404,359.0 L434,359.0" marker-end="url(#arrow)"/><text class="wm" x="828" y="424" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>