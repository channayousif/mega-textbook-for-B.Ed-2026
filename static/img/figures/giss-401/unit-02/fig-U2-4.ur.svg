<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 396" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قرآن کی ساخت اور مکی و مدني فرق</title><desc id="d">قرآن سورتوں اور آیات پر مشتمل ہے، جبکہ مکی اور مدني سورتوں کی ترتیب سے الگ نزول کے عہد کا فرق بیان کرتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="396"//><text class="h" x="796" y="32" text-anchor="end"><tspan x="796" dy="0">قرآن کی ترتیب، اور وقت کا الگ سوال</tspan></text><text class="label" x="630" y="66" text-anchor="middle"><tspan x="630" dy="0">ترتیب (سورتوں کی ترتیب)</tspan></text><rect class="p1" x="480" y="80" width="300" height="50" rx="8"//><text class="label" x="630" y="109.8" text-anchor="middle"><tspan x="630" dy="0">قرآن</tspan></text><path class="link" d="M630,130 L630,154" marker-end="url(#arrow)"/><rect class="p1" x="480" y="156" width="300" height="70" rx="8"//><text class="label" x="630" y="184.8" text-anchor="middle"><tspan x="630" dy="0">114 سورتیں (ابواب)</tspan></text><text class="support" x="630" y="207.2" text-anchor="middle"><tspan x="630" dy="0">الفاتحہ (1) سے الناس (114)</tspan></text><path class="link" d="M630,226 L630,250" marker-end="url(#arrow)"/><rect class="p1" x="480" y="252" width="300" height="70" rx="8"//><text class="label" x="630" y="280.8" text-anchor="middle"><tspan x="630" dy="0">ہر سورہ میں آیات</tspan></text><text class="support" x="630" y="303.2" text-anchor="middle"><tspan x="630" dy="0">96:1-5: سورہ 96، آیات 1 سے 5</tspan></text><text class="label" x="220" y="66" text-anchor="middle"><tspan x="220" dy="0">نزول کا عہد (وقت)</tspan></text><path class="link" d="M400,140 L30,140" marker-end="url(#arrow)"/><path class="link" d="M220,126 L220,154"/><text class="support" x="220" y="118" text-anchor="middle"><tspan x="220" dy="0">ہجرت: مدینہ کی ہجرت</tspan></text><rect class="p2" x="230" y="170" width="170" height="84" rx="8"//><text class="label" x="315" y="196.8" text-anchor="middle"><tspan x="315" dy="0">مکی</tspan></text><text class="support" x="315" y="219.2" text-anchor="middle"><tspan x="315" dy="0">ہجرت سے پہلے</tspan><tspan x="315" dy="18">نازل ہونے والا</tspan></text><rect class="p3" x="38" y="170" width="170" height="84" rx="8"//><text class="label" x="123" y="196.8" text-anchor="middle"><tspan x="123" dy="0">مدني</tspan></text><text class="support" x="123" y="219.2" text-anchor="middle"><tspan x="123" dy="0">ہجرت کے بعد</tspan><tspan x="123" dy="18">نازل ہونے والا</tspan></text><rect class="pn" x="38" y="260" width="362" height="78" rx="8"//><text class="support" x="388" y="285.2" text-anchor="end"><tspan x="388" dy="0">سورتوں کی ترتیب نزول کی ترتیب نہیں۔ العلق</tspan><tspan x="388" dy="18">سورہ 96 ہے، مگر اس کی ابتدائی آیات نزول کے</tspan><tspan x="388" dy="18">آغاز سے جڑی ہیں۔</tspan></text><text class="support" x="796" y="368" text-anchor="end"><tspan x="796" dy="0">مکی اور مدني وقت کے وسیع لیبل ہیں؛ تفصیلات جگہ کی سطح پر جانچیں۔</tspan></text><text class="wm" x="12" y="386" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>