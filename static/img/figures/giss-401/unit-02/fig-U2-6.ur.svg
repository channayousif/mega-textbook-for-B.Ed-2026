<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 426" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">صحیح، حسن اور ضعیف، اور بلا حوالہ کارڈ</title><desc id="d">صحیح اور حسن قبول شدہ صحت کی درجہ بندی ہیں، ضعیف غیر پورے ہوئے قبولیت کے شرائط کی نشاندہی کرتا ہے، اور بلا حوالہ کارڈ کو گمانی درجہ بندی کے بجائے ابھی جانچنے کی ضرورت ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="426"//><text class="h" x="836" y="32" text-anchor="end"><tspan x="836" dy="0">تعارفی حدیث درجہ بندی اور سیکھنے والے کا جواب</tspan></text><rect class="hd" x="688" y="52" width="150" height="40" rx="0"//><text class="label inv" x="828" y="76.8" text-anchor="end"><tspan x="828" dy="0">درجہ بندی</tspan></text><rect class="hd" x="458" y="52" width="230" height="40" rx="0"//><text class="label inv" x="678" y="76.8" text-anchor="end"><tspan x="678" dy="0">تعارفی معنی</tspan></text><rect class="hd" x="238" y="52" width="220" height="40" rx="0"//><text class="label inv" x="448" y="76.8" text-anchor="end"><tspan x="448" dy="0">شہادت کا استعمال</tspan></text><rect class="hd" x="22" y="52" width="216" height="40" rx="0"//><text class="label inv" x="228" y="76.8" text-anchor="end"><tspan x="228" dy="0">سیکھنے والے کا جواب</tspan></text><rect class="p1" x="688" y="92" width="150" height="74" rx="0"//><text class="label" x="828" y="116.8" text-anchor="end"><tspan x="828" dy="0">صحیح (درست)</tspan></text><rect class="pn" x="458" y="92" width="230" height="74" rx="0"//><text class="support" x="678" y="115.2" text-anchor="end"><tspan x="678" dy="0">قابلِ اعتماد، درست راویوں کی</tspan><tspan x="678" dy="18">مسلسل زنجیر؛ کوئی پوشیدہ</tspan><tspan x="678" dy="18">عیب یا تناقض نہیں</tspan></text><rect class="pn" x="238" y="92" width="220" height="74" rx="0"//><text class="support" x="448" y="115.2" text-anchor="end"><tspan x="448" dy="0">شہادت کے طور پر قبول</tspan></text><rect class="pn" x="22" y="92" width="216" height="74" rx="0"//><text class="support" x="228" y="115.2" text-anchor="end"><tspan x="228" dy="0">مجموعہ، نمبر اور درجہ بندی</tspan><tspan x="228" dy="18">کرنے والے کا نام دیں</tspan></text><rect class="p1" x="688" y="166" width="150" height="56" rx="0"//><text class="label" x="828" y="190.8" text-anchor="end"><tspan x="828" dy="0">حسن (اچھی)</tspan></text><rect class="pn" x="458" y="166" width="230" height="56" rx="0"//><text class="support" x="678" y="189.2" text-anchor="end"><tspan x="678" dy="0">قبولیت کے شرائط پورے</tspan><tspan x="678" dy="18">کرتی ہے، راوی درستگی کم</tspan></text><rect class="pn" x="238" y="166" width="220" height="56" rx="0"//><text class="support" x="448" y="189.2" text-anchor="end"><tspan x="448" dy="0">عموماً شہادت کے طور پر</tspan><tspan x="448" dy="18">قبول</tspan></text><rect class="pn" x="22" y="166" width="216" height="56" rx="0"//><text class="support" x="228" y="189.2" text-anchor="end"><tspan x="228" dy="0">اس کا حوالہ اس کی درجہ بندی اور</tspan><tspan x="228" dy="18">درجہ بندی کرنے والے کے ساتھ دیں</tspan></text><rect class="p3" x="688" y="222" width="150" height="74" rx="0"//><text class="label" x="828" y="246.8" text-anchor="end"><tspan x="828" dy="0">ضعیف (کمزور)</tspan></text><rect class="pn" x="458" y="222" width="230" height="74" rx="0"//><text class="support" x="678" y="245.2" text-anchor="end"><tspan x="678" dy="0">ایک یا زیادہ قبولیت کے</tspan><tspan x="678" dy="18">شرائط پر پورا نہیں اترتی؛</tspan><tspan x="678" dy="18">خودکار طور پر گھڑا ہوا نہیں</tspan></text><rect class="pn" x="238" y="222" width="220" height="74" rx="0"//><text class="support" x="448" y="245.2" text-anchor="end"><tspan x="448" dy="0">یقینی طور پر پیش نہیں کیا</tspan><tspan x="448" dy="18">جاتا؛ استعمال علمی شرائط پر</tspan><tspan x="448" dy="18">منحصر ہے</tspan></text><rect class="pn" x="22" y="222" width="216" height="74" rx="0"//><text class="support" x="228" y="245.2" text-anchor="end"><tspan x="228" dy="0">یقینی طور پر پیش نہ کریں؛</tspan><tspan x="228" dy="18">اہل عالم سے رجوع کریں</tspan></text><rect class="p4" x="688" y="296" width="150" height="74" rx="0"//><text class="label" x="828" y="320.8" text-anchor="end"><tspan x="828" dy="0">کارڈ پر حوالہ</tspan><tspan x="828" dy="20">نہیں</tspan></text><rect class="pn" x="458" y="296" width="230" height="74" rx="0"//><text class="support" x="678" y="319.2" text-anchor="end"><tspan x="678" dy="0">یہ کوئی درجہ بندی نہیں: انتساب</tspan><tspan x="678" dy="18">تصدیق نشدہ ہے</tspan></text><rect class="pn" x="238" y="296" width="220" height="74" rx="0"//><text class="support" x="448" y="319.2" text-anchor="end"><tspan x="448" dy="0">جانچ تک استعمال نہیں</tspan></text><rect class="pn" x="22" y="296" width="216" height="74" rx="0"//><text class="support" x="228" y="319.2" text-anchor="end"><tspan x="228" dy="0">"انتساب ابھی تصدیق نشدہ ہے"</tspan><tspan x="228" dy="18">لکھیں اور ماخذ</tspan><tspan x="228" dy="18">تلاش کریں</tspan></text><text class="support" x="836" y="396" text-anchor="end"><tspan x="836" dy="0">گھڑ کرنا الگ فیصلہ ہے۔ علماء اختلاف کر سکتے ہیں، اس لیے درجہ بندی کرنے والے کا نام درجہ بندی کے ساتھ رکھیں۔</tspan></text><text class="wm" x="12" y="416" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>