<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 444" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Qur'an, Sunnah, Ijma and Qiyas compared</title><desc id="d">Four sources are compared by definition and use, separating revelation and the Prophetic example from dependent scholarly consensus and analogy.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="444"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Comparing the four sources</tspan></text><rect class="hd" x="22" y="52" width="120" height="40" rx="0"/><text class="label inv" x="32" y="76.8" text-anchor="start"><tspan x="32" dy="0">Source</tspan></text><rect class="hd" x="142" y="52" width="230" height="40" rx="0"/><text class="label inv" x="152" y="76.8" text-anchor="start"><tspan x="152" dy="0">What it is</tspan></text><rect class="hd" x="372" y="52" width="230" height="40" rx="0"/><text class="label inv" x="382" y="76.8" text-anchor="start"><tspan x="382" dy="0">Authority</tspan></text><rect class="hd" x="602" y="52" width="236" height="40" rx="0"/><text class="label inv" x="612" y="76.8" text-anchor="start"><tspan x="612" dy="0">Labelled example</tspan></text><rect class="p1" x="22" y="92" width="120" height="74" rx="0"/><text class="label" x="32" y="116.8" text-anchor="start"><tspan x="32" dy="0">Qur'an</tspan></text><rect class="pn" x="142" y="92" width="230" height="74" rx="0"/><text class="support" x="152" y="115.2" text-anchor="start"><tspan x="152" dy="0">Allah's revelation to the</tspan><tspan x="152" dy="18">Prophet Muhammad, peace</tspan><tspan x="152" dy="18">be upon him</tspan></text><rect class="pn" x="372" y="92" width="230" height="74" rx="0"/><text class="support" x="382" y="115.2" text-anchor="start"><tspan x="382" dy="0">The foundational source of</tspan><tspan x="382" dy="18">Islamic guidance</tspan></text><rect class="pn" x="602" y="92" width="236" height="74" rx="0"/><text class="support" x="612" y="115.2" text-anchor="start"><tspan x="612" dy="0">Qur'anic reference: 4:58 on</tspan><tspan x="612" dy="18">returning trusts and judging</tspan><tspan x="612" dy="18">fairly</tspan></text><rect class="p1" x="22" y="166" width="120" height="74" rx="0"/><text class="label" x="32" y="190.8" text-anchor="start"><tspan x="32" dy="0">Sunnah</tspan></text><rect class="pn" x="142" y="166" width="230" height="74" rx="0"/><text class="support" x="152" y="189.2" text-anchor="start"><tspan x="152" dy="0">The Prophet's authoritative</tspan><tspan x="152" dy="18">example, learned through</tspan><tspan x="152" dy="18">Hadith reports</tspan></text><rect class="pn" x="372" y="166" width="230" height="74" rx="0"/><text class="support" x="382" y="189.2" text-anchor="start"><tspan x="382" dy="0">Explains and demonstrates</tspan><tspan x="382" dy="18">the Qur'an's guidance</tspan></text><rect class="pn" x="602" y="166" width="236" height="74" rx="0"/><text class="support" x="612" y="189.2" text-anchor="start"><tspan x="612" dy="0">Reported Prophetic practice:</tspan><tspan x="612" dy="18">Bukhari 631, pray as you have</tspan><tspan x="612" dy="18">seen me pray</tspan></text><rect class="p2" x="22" y="240" width="120" height="74" rx="0"/><text class="label" x="32" y="264.8" text-anchor="start"><tspan x="32" dy="0">Ijma</tspan></text><rect class="pn" x="142" y="240" width="230" height="74" rx="0"/><text class="support" x="152" y="263.2" text-anchor="start"><tspan x="152" dy="0">Agreement of qualified jurists</tspan><tspan x="152" dy="18">of an era after the Prophet</tspan></text><rect class="pn" x="372" y="240" width="230" height="74" rx="0"/><text class="support" x="382" y="263.2" text-anchor="start"><tspan x="382" dy="0">Depends on the Qur'an and</tspan><tspan x="382" dy="18">Sunnah; identified by</tspan><tspan x="382" dy="18">scholars</tspan></text><rect class="pn" x="602" y="240" width="236" height="74" rx="0"/><text class="support" x="612" y="263.2" text-anchor="start"><tspan x="612" dy="0">Scholarly consensus: not a</tspan><tspan x="612" dy="18">class, village or online group</tspan><tspan x="612" dy="18">agreeing</tspan></text><rect class="p2" x="22" y="314" width="120" height="74" rx="0"/><text class="label" x="32" y="338.8" text-anchor="start"><tspan x="32" dy="0">Qiyas</tspan></text><rect class="pn" x="142" y="314" width="230" height="74" rx="0"/><text class="support" x="152" y="337.2" text-anchor="start"><tspan x="152" dy="0">Analogy relating a new case</tspan><tspan x="152" dy="18">to an established case</tspan></text><rect class="pn" x="372" y="314" width="230" height="74" rx="0"/><text class="support" x="382" y="337.2" text-anchor="start"><tspan x="382" dy="0">Depends on a ruling already</tspan><tspan x="382" dy="18">found in revealed sources</tspan></text><rect class="pn" x="602" y="314" width="236" height="74" rx="0"/><text class="support" x="612" y="337.2" text-anchor="start"><tspan x="612" dy="0">Analogy through a relevant</tspan><tspan x="612" dy="18">shared cause, such as</tspan><tspan x="612" dy="18">intoxication, not mere likeness</tspan></text><text class="support" x="24" y="414" text-anchor="start"><tspan x="24" dy="0">Rows 1-2: revealed sources. Rows 3-4: dependent scholarly reasoning.</tspan></text><text class="wm" x="848" y="434" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>