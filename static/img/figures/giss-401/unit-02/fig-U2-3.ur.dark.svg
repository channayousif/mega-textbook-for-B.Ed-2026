<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 446" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار قرآنی موضوعات: حوالہ، معنی اور ممکنہ اطلاق</title><desc id="d">چار موضوعات عین قرآنی حوالوں سے جڑے ہیں، جس میں مفہوم پر مبنی معانی ممکنہ اسکولی اطلاقوں سے الگ کیے گئے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="446"//><text class="h" x="836" y="32" text-anchor="end"><tspan x="836" dy="0">چار قرآنی موضوعات: حوالہ، معنی اور ممکنہ اطلاق</tspan></text><rect class="hd" x="718" y="52" width="120" height="60" rx="0"//><text class="label inv" x="828" y="76.8" text-anchor="end"><tspan x="828" dy="0">موضوع</tspan></text><rect class="hd" x="548" y="52" width="170" height="60" rx="0"//><text class="label inv" x="708" y="76.8" text-anchor="end"><tspan x="708" dy="0">حوالہ</tspan></text><rect class="hd" x="278" y="52" width="270" height="60" rx="0"//><text class="label inv" x="538" y="76.8" text-anchor="end"><tspan x="538" dy="0">مفہوم پر مبنی اصول</tspan></text><rect class="hd" x="22" y="52" width="256" height="60" rx="0"//><text class="label inv" x="268" y="76.8" text-anchor="end"><tspan x="268" dy="0">ممکنہ اسکولی</tspan><tspan x="268" dy="20">اطلاق</tspan></text><rect class="p1" x="718" y="112" width="120" height="74" rx="0"//><text class="label" x="828" y="136.8" text-anchor="end"><tspan x="828" dy="0">علم</tspan></text><rect class="pn" x="548" y="112" width="170" height="74" rx="0"//><text class="support" x="708" y="135.2" text-anchor="end"><tspan x="708" dy="0">العلق 96:1-5</tspan></text><rect class="pn" x="278" y="112" width="270" height="74" rx="0"//><text class="support" x="538" y="135.2" text-anchor="end"><tspan x="538" dy="0">پڑھنا یا تلاوت خالق اور قلم کے</tspan><tspan x="538" dy="18">ذریعے پڑھانے سے جڑا ہے؛</tspan><tspan x="538" dy="18">سیکھنا نعمت ہے</tspan></text><rect class="pn" x="22" y="112" width="256" height="74" rx="0"//><text class="support" x="268" y="135.2" text-anchor="end"><tspan x="268" dy="0">ممکنہ: بچے کو حروف سیکھنے میں</tspan><tspan x="268" dy="18">صبر سے مدد، بغیر</tspan><tspan x="268" dy="18">ٹھٹھے کے</tspan></text><rect class="p1" x="718" y="186" width="120" height="74" rx="0"//><text class="label" x="828" y="210.8" text-anchor="end"><tspan x="828" dy="0">انصاف</tspan></text><rect class="pn" x="548" y="186" width="170" height="74" rx="0"//><text class="support" x="708" y="209.2" text-anchor="end"><tspan x="708" dy="0">النساء 4:135</tspan></text><rect class="pn" x="278" y="186" width="270" height="74" rx="0"//><text class="support" x="538" y="209.2" text-anchor="end"><tspan x="538" dy="0">انصاف اور سچی گواہی کے لیے</tspan><tspan x="538" dy="18">مضبوطی سے کھڑے رہو، چاہے</tspan><tspan x="538" dy="18">اپنے یا رشتہ داروں کے خلاف ہو</tspan></text><rect class="pn" x="22" y="186" width="256" height="74" rx="0"//><text class="support" x="268" y="209.2" text-anchor="end"><tspan x="268" dy="0">ممکنہ: رشتہ دار کی اسکرپٹ کو</tspan><tspan x="268" dy="18">ہر دوسرے کے مطابق معیار سے نمبر دو</tspan></text><rect class="p1" x="718" y="260" width="120" height="74" rx="0"//><text class="label" x="828" y="284.8" text-anchor="end"><tspan x="828" dy="0">محبت</tspan></text><rect class="pn" x="548" y="260" width="170" height="74" rx="0"//><text class="support" x="708" y="283.2" text-anchor="end"><tspan x="708" dy="0">الإسراء 17:23-24</tspan></text><rect class="pn" x="278" y="260" width="270" height="74" rx="0"//><text class="support" x="538" y="283.2" text-anchor="end"><tspan x="538" dy="0">اللہ کی عبادت اور والدین کے ساتھ</tspan><tspan x="538" dy="18">اچھا سلوک، احترام آمیز گفتگو</tspan><tspan x="538" dy="18">اور بوڑھاپے میں دیکھ بھال</tspan></text><rect class="pn" x="22" y="260" width="256" height="74" rx="0"//><text class="support" x="268" y="283.2" text-anchor="end"><tspan x="268" dy="0">ممکنہ: احترام آمیز گفتگو کی</tspan><tspan x="268" dy="18">مشق؛ جگہ خود</tspan><tspan x="268" dy="18">والدین سے متعلق ہے</tspan></text><rect class="p1" x="718" y="334" width="120" height="56" rx="0"//><text class="label" x="828" y="358.8" text-anchor="end"><tspan x="828" dy="0">ایمانداری</tspan></text><rect class="pn" x="548" y="334" width="170" height="56" rx="0"//><text class="support" x="708" y="357.2" text-anchor="end"><tspan x="708" dy="0">الأحزاب 33:70</tspan></text><rect class="pn" x="278" y="334" width="270" height="56" rx="0"//><text class="support" x="538" y="357.2" text-anchor="end"><tspan x="538" dy="0">اللہ کے خوف میں رہو اور سیدھی</tspan><tspan x="538" dy="18">گفتگو کرو</tspan></text><rect class="pn" x="22" y="334" width="256" height="56" rx="0"//><text class="support" x="268" y="357.2" text-anchor="end"><tspan x="268" dy="0">ممکنہ: حاضری اسی طرح ریکارڈ کرو</tspan><tspan x="268" dy="18">جیسا واقعہ ہوا</tspan></text><text class="support" x="836" y="416" text-anchor="end"><tspan x="836" dy="0">اصول مفہوم پر مبنی ہیں، اقتباس نہیں۔ اطلاق استاد کے تجاویز ہیں، نظرثانی کے لیے کھلے ہیں۔</tspan></text><text class="wm" x="12" y="436" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>