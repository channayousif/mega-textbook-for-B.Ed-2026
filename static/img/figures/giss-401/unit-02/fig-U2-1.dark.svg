<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 414" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Qur'an, Sunnah, Ijma and Qiyas: order and dependence</title><desc id="d">Qur'an and Sunnah ground the framework, while Ijma and Qiyas depend on revealed guidance rather than replacing it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="414"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Four sources in the teaching order used in this unit</tspan></text><text class="label" x="125" y="70" text-anchor="middle"><tspan x="125" dy="0">Revealed sources</tspan></text><text class="label" x="595" y="70" text-anchor="middle"><tspan x="595" dy="0">Dependent scholarly reasoning</tspan></text><path class="brk b1" d="M24,82 L24,92 L392,92 L392,82"/><path class="brk b2" d="M428,82 L428,92 L796,92 L796,82"/><rect class="p1" x="24" y="110" width="180" height="120" rx="8"/><text class="label" x="36" y="154.8" text-anchor="start"><tspan x="36" dy="0">1. Qur'an</tspan></text><text class="support" x="36" y="177.2" text-anchor="start"><tspan x="36" dy="0">Allah's revelation; the</tspan><tspan x="36" dy="18">foundational source</tspan></text><rect class="p1" x="212" y="110" width="180" height="120" rx="8"/><text class="label" x="224" y="136.8" text-anchor="start"><tspan x="224" dy="0">2. Sunnah</tspan></text><text class="support" x="224" y="159.2" text-anchor="start"><tspan x="224" dy="0">The Prophet's</tspan><tspan x="224" dy="18">example, known</tspan><tspan x="224" dy="18">through Hadith</tspan><tspan x="224" dy="18">reports</tspan></text><rect class="p2" x="428" y="110" width="180" height="120" rx="8"/><text class="label" x="440" y="145.8" text-anchor="start"><tspan x="440" dy="0">3. Ijma</tspan></text><text class="support" x="440" y="168.2" text-anchor="start"><tspan x="440" dy="0">Consensus of</tspan><tspan x="440" dy="18">qualified jurists on a</tspan><tspan x="440" dy="18">legal matter</tspan></text><rect class="p2" x="616" y="110" width="180" height="120" rx="8"/><text class="label" x="628" y="136.8" text-anchor="start"><tspan x="628" dy="0">4. Qiyas</tspan></text><text class="support" x="628" y="159.2" text-anchor="start"><tspan x="628" dy="0">Analogy from an</tspan><tspan x="628" dy="18">established case</tspan><tspan x="628" dy="18">through a relevant</tspan><tspan x="628" dy="18">shared cause</tspan></text><path class="link" d="M204,170.0 L210,170.0" marker-end="url(#arrow)"/><path class="link" d="M392,170.0 L426,170.0" marker-end="url(#arrow)"/><path class="link" d="M608,170.0 L614,170.0" marker-end="url(#arrow)"/><path class="dash" d="M518,230 L518,280 L302,280 L302,232" marker-end="url(#arrow2)"/><path class="dash" d="M706,230 L706,310 L114,310 L114,232" marker-end="url(#arrow2)"/><text class="support" x="410" y="300" text-anchor="middle"><tspan x="410" dy="0">Ijma rests on the Qur'an and Sunnah</tspan></text><text class="support" x="410" y="332" text-anchor="middle"><tspan x="410" dy="0">Qiyas rests on a ruling found in revealed sources</tspan></text><text class="support" x="24" y="366" text-anchor="start"><tspan x="24" dy="0">Solid arrows show the teaching order. Dashed arrows show dependence: Ijma and Qiyas apply</tspan></text><text class="support" x="24" y="386" text-anchor="start"><tspan x="24" dy="0">revealed guidance and do not replace it.</tspan></text><text class="wm" x="808" y="404" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>