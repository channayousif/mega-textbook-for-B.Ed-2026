<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 444" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قرآن، سنت، اجماع اور قیاس کا موازنہ</title><desc id="d">چار ماخذ تعریف اور استعمال کے لحاظ سے موازنے میں ہیں، جس میں وحی اور نبوی نمونہ کو وابستہ علماء کے اجماع اور مثال سے الگ کیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="444"//><text class="h" x="836" y="32" text-anchor="end"><tspan x="836" dy="0">چار ماخذوں کا موازنہ</tspan></text><rect class="hd" x="718" y="52" width="120" height="40" rx="0"//><text class="label inv" x="828" y="76.8" text-anchor="end"><tspan x="828" dy="0">ماخذ</tspan></text><rect class="hd" x="488" y="52" width="230" height="40" rx="0"//><text class="label inv" x="708" y="76.8" text-anchor="end"><tspan x="708" dy="0">یہ کیا ہے</tspan></text><rect class="hd" x="258" y="52" width="230" height="40" rx="0"//><text class="label inv" x="478" y="76.8" text-anchor="end"><tspan x="478" dy="0">اختیار</tspan></text><rect class="hd" x="22" y="52" width="236" height="40" rx="0"//><text class="label inv" x="248" y="76.8" text-anchor="end"><tspan x="248" dy="0">بیان کردہ مثال</tspan></text><rect class="p1" x="718" y="92" width="120" height="74" rx="0"//><text class="label" x="828" y="116.8" text-anchor="end"><tspan x="828" dy="0">قرآن</tspan></text><rect class="pn" x="488" y="92" width="230" height="74" rx="0"//><text class="support" x="708" y="115.2" text-anchor="end"><tspan x="708" dy="0">نبی پر نازل ہونے والی</tspan><tspan x="708" dy="18">اللہ کی وحی، حضرت محمد</tspan><tspan x="708" dy="18">صلی اللہ علیہ وسلم پر</tspan></text><rect class="pn" x="258" y="92" width="230" height="74" rx="0"//><text class="support" x="478" y="115.2" text-anchor="end"><tspan x="478" dy="0">اسلامی ہدایت کا</tspan><tspan x="478" dy="18">بنیادی ماخذ</tspan></text><rect class="pn" x="22" y="92" width="236" height="74" rx="0"//><text class="support" x="248" y="115.2" text-anchor="end"><tspan x="248" dy="0">قرآنی حوالہ: 4:58 پر</tspan><tspan x="248" dy="18">امانت لوٹانا اور</tspan><tspan x="248" dy="18">منصفانہ فیصلہ</tspan></text><rect class="p1" x="718" y="166" width="120" height="74" rx="0"//><text class="label" x="828" y="190.8" text-anchor="end"><tspan x="828" dy="0">سنت</tspan></text><rect class="pn" x="488" y="166" width="230" height="74" rx="0"//><text class="support" x="708" y="189.2" text-anchor="end"><tspan x="708" dy="0">نبی کریم کا معتبر</tspan><tspan x="708" dy="18">نمونہ، جو حدیث</tspan><tspan x="708" dy="18">روایات کے ذریعے معلوم ہے</tspan></text><rect class="pn" x="258" y="166" width="230" height="74" rx="0"//><text class="support" x="478" y="189.2" text-anchor="end"><tspan x="478" dy="0">وضاحت اور مظہر</tspan><tspan x="478" dy="18">قرآن کی ہدایت کا</tspan></text><rect class="pn" x="22" y="166" width="236" height="74" rx="0"//><text class="support" x="248" y="189.2" text-anchor="end"><tspan x="248" dy="0">روایت شدہ نبوی عمل:</tspan><tspan x="248" dy="18">بخاری 631، اسی طرح نماز پڑھو</tspan><tspan x="248" dy="18">جیسے مجھے پڑھتے دیکھا</tspan></text><rect class="p2" x="718" y="240" width="120" height="74" rx="0"//><text class="label" x="828" y="264.8" text-anchor="end"><tspan x="828" dy="0">اجماع</tspan></text><rect class="pn" x="488" y="240" width="230" height="74" rx="0"//><text class="support" x="708" y="263.2" text-anchor="end"><tspan x="708" dy="0">اہل فقہاء کا اتفاق،</tspan><tspan x="708" dy="18">نبی کے بعد کسی عہد کا</tspan></text><rect class="pn" x="258" y="240" width="230" height="74" rx="0"//><text class="support" x="478" y="263.2" text-anchor="end"><tspan x="478" dy="0">قرآن اور سنت پر انحصار</tspan><tspan x="478" dy="18">کرتا ہے؛ علماء کی طرف سے</tspan><tspan x="478" dy="18">نشاندہی ہوتا ہے</tspan></text><rect class="pn" x="22" y="240" width="236" height="74" rx="0"//><text class="support" x="248" y="263.2" text-anchor="end"><tspan x="248" dy="0">علمی اجماع: یہ کلاس،</tspan><tspan x="248" dy="18">گاؤں یا آن لائن گروہ کا</tspan><tspan x="248" dy="18">اتفاق نہیں</tspan></text><rect class="p2" x="718" y="314" width="120" height="74" rx="0"//><text class="label" x="828" y="338.8" text-anchor="end"><tspan x="828" dy="0">قیاس</tspan></text><rect class="pn" x="488" y="314" width="230" height="74" rx="0"//><text class="support" x="708" y="337.2" text-anchor="end"><tspan x="708" dy="0">نئے معاملے کو قائم شدہ</tspan><tspan x="708" dy="18">معاملے سے جوڑنے والی مثال</tspan></text><rect class="pn" x="258" y="314" width="230" height="74" rx="0"//><text class="support" x="478" y="337.2" text-anchor="end"><tspan x="478" dy="0">وحی کے ماخذ میں پہلے سے موجود</tspan><tspan x="478" dy="18">حکم پر انحصار کرتی ہے</tspan></text><rect class="pn" x="22" y="314" width="236" height="74" rx="0"//><text class="support" x="248" y="337.2" text-anchor="end"><tspan x="248" dy="0">متعلقہ مشترک سبب کے ذریعے</tspan><tspan x="248" dy="18">مثال، جیسے</tspan><tspan x="248" dy="18">نشہ، صرف ظاہری مشابت نہیں</tspan></text><text class="support" x="836" y="414" text-anchor="end"><tspan x="836" dy="0">قطار 1-2: وحی کے ماخذ۔ قطار 3-4: وابستہ علمی استدلال۔</tspan></text><text class="wm" x="12" y="434" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>