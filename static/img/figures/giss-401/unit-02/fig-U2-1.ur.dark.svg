<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 414" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قرآن، سنت، اجماع اور قیاس: ترتیب اور انحصار</title><desc id="d">قرآن اور سنت ڈھانچے کی بنیاد ہیں، جبکہ اجماع اور قیاس وحی کی ہدایت پر انحصار کرتے ہیں اور اسے نہیں بدلتے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="414"//><text class="h" x="796" y="32" text-anchor="end"><tspan x="796" dy="0">چار ماخذ اس یونٹ میں استعمال ہونے والی تدریسی ترتیب میں</tspan></text><text class="label" x="695" y="70" text-anchor="middle"><tspan x="695" dy="0">وحی کے ماخذ</tspan></text><text class="label" x="225" y="70" text-anchor="middle"><tspan x="225" dy="0">وابستہ علمی استدلال</tspan></text><path class="brk b1" d="M796,82 L796,92 L428,92 L428,82"/><path class="brk b2" d="M392,82 L392,92 L24,92 L24,82"/><rect class="p1" x="616" y="110" width="180" height="120" rx="8"//><text class="label" x="784" y="154.8" text-anchor="end"><tspan x="784" dy="0">1۔ قرآن</tspan></text><text class="support" x="784" y="177.2" text-anchor="end"><tspan x="784" dy="0">اللہ کی وحی؛</tspan><tspan x="784" dy="18">بنیادی ماخذ</tspan></text><rect class="p1" x="428" y="110" width="180" height="120" rx="8"//><text class="label" x="596" y="136.8" text-anchor="end"><tspan x="596" dy="0">2۔ سنت</tspan></text><text class="support" x="596" y="159.2" text-anchor="end"><tspan x="596" dy="0">نبی کریم کا</tspan><tspan x="596" dy="18">نمونہ، جو</tspan><tspan x="596" dy="18">حدیث روایات کے</tspan><tspan x="596" dy="18">ذریعے معلوم ہے</tspan></text><rect class="p2" x="212" y="110" width="180" height="120" rx="8"//><text class="label" x="380" y="145.8" text-anchor="end"><tspan x="380" dy="0">3۔ اجماع</tspan></text><text class="support" x="380" y="168.2" text-anchor="end"><tspan x="380" dy="0">اہل فقہاء کا</tspan><tspan x="380" dy="18">اتفاق، ایک</tspan><tspan x="380" dy="18">قانونی معاملے پر</tspan></text><rect class="p2" x="24" y="110" width="180" height="120" rx="8"//><text class="label" x="192" y="136.8" text-anchor="end"><tspan x="192" dy="0">4۔ قیاس</tspan></text><text class="support" x="192" y="159.2" text-anchor="end"><tspan x="192" dy="0">قائم شدہ معاملے سے</tspan><tspan x="192" dy="18">متعلقہ سبب کے</tspan><tspan x="192" dy="18">ذریعے نیا</tspan><tspan x="192" dy="18">معاملہ جوڑنا</tspan></text><path class="link" d="M616,170.0 L610,170.0" marker-end="url(#arrow)"/><path class="link" d="M428,170.0 L394,170.0" marker-end="url(#arrow)"/><path class="link" d="M212,170.0 L206,170.0" marker-end="url(#arrow)"/><path class="dash" d="M302,230 L302,280 L518,280 L518,232" marker-end="url(#arrow2)"/><path class="dash" d="M114,230 L114,310 L706,310 L706,232" marker-end="url(#arrow2)"/><text class="support" x="410" y="300" text-anchor="middle"><tspan x="410" dy="0">اجماع قرآن اور سنت پر قائم ہے</tspan></text><text class="support" x="410" y="332" text-anchor="middle"><tspan x="410" dy="0">قیاس وحی کے ماخذ میں ملنے والے حکم پر قائم ہے</tspan></text><text class="support" x="796" y="366" text-anchor="end"><tspan x="796" dy="0">مضبوط تیر تدریسی ترتیب دکھاتے ہیں۔ ڈیش والے تیر انحصار دکھاتے ہیں: اجماع اور قیاس</tspan></text><text class="support" x="796" y="386" text-anchor="end"><tspan x="796" dy="0">وحی کی ہدایت پر لاگو ہوتے ہیں اور اسے نہیں بدلتے۔</tspan></text><text class="wm" x="12" y="404" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>