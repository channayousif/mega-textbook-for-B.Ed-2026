<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 434" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">علماء کی حدیث درجہ بندی اور سیکھنے والے کا کردار</title><desc id="d">علماء صحت کے فیصلے سے پہلے روایت اور متن کی جانچ باہم کرتے ہیں، جبکہ سیکھنے والے درجہ بندی خود نہیں کرتے بلکہ حوالہ تلاش کرتے اور جانچ کے نتیجے سے رجوع کرتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="840" height="434"//><text class="h" x="816" y="32" text-anchor="end"><tspan x="816" dy="0">ماہرانہ حدیث درجہ بندی، اور سیکھنے والا کیا کرتا ہے</tspan></text><text class="label" x="816" y="66" text-anchor="end"><tspan x="816" dy="0">ماہرانہ درجہ بندی (اہل علماء)</tspan></text><rect class="p1" x="636" y="80" width="180" height="150" rx="8"//><text class="label" x="804" y="129.8" text-anchor="end"><tspan x="804" dy="0">1۔ روایت تلاش</tspan><tspan x="804" dy="20">کریں</tspan></text><text class="support" x="804" y="172.2" text-anchor="end"><tspan x="804" dy="0">مجموعہ، نمبر،</tspan><tspan x="804" dy="18">مکمل الفاظ</tspan></text><rect class="p2" x="420" y="80" width="170" height="150" rx="8"//><text class="label" x="578" y="130.8" text-anchor="end"><tspan x="578" dy="0">اسناد</tspan></text><text class="support" x="578" y="153.2" text-anchor="end"><tspan x="578" dy="0">زنجیر: مسلسل؟</tspan><tspan x="578" dy="18">راوی قابلِ اعتماد</tspan><tspan x="578" dy="18">اور درست؟</tspan></text><rect class="p2" x="230" y="80" width="170" height="150" rx="8"//><text class="label" x="388" y="130.8" text-anchor="end"><tspan x="388" dy="0">متن</tspan></text><text class="support" x="388" y="153.2" text-anchor="end"><tspan x="388" dy="0">متن: پوشیدہ عیب؟</tspan><tspan x="388" dy="18">مضبوط روایات کے</tspan><tspan x="388" dy="18">خلاف تناقض؟</tspan></text><path class="link" d="M420,155 L400,155"/><text class="support" x="405" y="252" text-anchor="middle"><tspan x="405" dy="0">2۔ باہم جانچا جاتا ہے</tspan></text><rect class="p1" x="24" y="80" width="180" height="150" rx="8"//><text class="label" x="192" y="129.8" text-anchor="end"><tspan x="192" dy="0">3۔ موازنہ کریں اور</tspan><tspan x="192" dy="20">فیصلہ کریں</tspan></text><text class="support" x="192" y="172.2" text-anchor="end"><tspan x="192" dy="0">صحیح، حسن یا ضعیف؛</tspan><tspan x="192" dy="18">علماء اختلاف کر سکتے ہیں</tspan></text><path class="link" d="M636,155 L592,155" marker-end="url(#arrow)"/><path class="link" d="M230,155 L206,155" marker-end="url(#arrow)"/><path class="dash" d="M816,276 L24,276"/><text class="label" x="816" y="306" text-anchor="end"><tspan x="816" dy="0">سیکھنے والے کا عمل (یہ یونٹ)</tspan></text><rect class="p3" x="436" y="320" width="380" height="78" rx="8"//><text class="support" x="804" y="345.2" text-anchor="end"><tspan x="804" dy="0">مجموعہ، نمبر اور عین الفاظ ریکارڈ کریں۔</tspan><tspan x="804" dy="18">کسی معترف درجہ بندی یا اہل عالم سے</tspan><tspan x="804" dy="18">رجوع کریں۔</tspan></text><rect class="p3" x="24" y="320" width="380" height="60" rx="8"//><text class="support" x="392" y="345.2" text-anchor="end"><tspan x="392" dy="0">خود درجہ بندی نہ کریں۔ حوالہ نہ ملنے پر</tspan><tspan x="392" dy="18">"انتساب ابھی تصدیق نشدہ ہے" لکھیں۔</tspan></text><path class="link" d="M436,359.0 L406,359.0" marker-end="url(#arrow)"/><text class="wm" x="12" y="424" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>