<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 396" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Qur'an structure and the Makki and Madani distinction</title><desc id="d">The Qur'an contains surahs and ayat, while Makki and Madani describe a revelation-period distinction separate from chapter order.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.p1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.p2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.p3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.p4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.pn{fill:var(--panel);stroke:var(--muted);stroke-width:1}.hd{fill:var(--a1);stroke:var(--a1);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2}.dash{fill:none;stroke:var(--a2);stroke-width:2;stroke-dasharray:6 5}.brk{fill:none;stroke-width:3}.b1{stroke:var(--a1)}.b2{stroke:var(--a2)}.ah{fill:var(--ink)}.ah2{fill:var(--a2)}text{fill:var(--ink)}.inv{fill:var(--bg)}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.support{font-size:14px}.note{font-size:14px;font-style:italic}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah2" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="396"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">How the Qur'an is arranged, and a separate question of time</tspan></text><text class="label" x="190" y="66" text-anchor="middle"><tspan x="190" dy="0">Arrangement (chapter order)</tspan></text><rect class="p1" x="40" y="80" width="300" height="50" rx="8"/><text class="label" x="190.0" y="109.8" text-anchor="middle"><tspan x="190.0" dy="0">The Qur'an</tspan></text><path class="link" d="M190,130 L190,154" marker-end="url(#arrow)"/><rect class="p1" x="40" y="156" width="300" height="70" rx="8"/><text class="label" x="190.0" y="184.8" text-anchor="middle"><tspan x="190.0" dy="0">114 surahs (chapters)</tspan></text><text class="support" x="190.0" y="207.2" text-anchor="middle"><tspan x="190.0" dy="0">Al-Fatihah (1) to An-Nas (114)</tspan></text><path class="link" d="M190,226 L190,250" marker-end="url(#arrow)"/><rect class="p1" x="40" y="252" width="300" height="70" rx="8"/><text class="label" x="190.0" y="280.8" text-anchor="middle"><tspan x="190.0" dy="0">Ayat (verses) in each surah</tspan></text><text class="support" x="190.0" y="303.2" text-anchor="middle"><tspan x="190.0" dy="0">96:1–5: surah 96, ayat 1 to 5</tspan></text><text class="label" x="600" y="66" text-anchor="middle"><tspan x="600" dy="0">Revelation period (time)</tspan></text><path class="link" d="M420,140 L790,140" marker-end="url(#arrow)"/><path class="link" d="M600,126 L600,154"/><text class="support" x="600" y="118" text-anchor="middle"><tspan x="600" dy="0">Hijrah: migration to Madinah</tspan></text><rect class="p2" x="420" y="170" width="170" height="84" rx="8"/><text class="label" x="505.0" y="196.8" text-anchor="middle"><tspan x="505.0" dy="0">Makki</tspan></text><text class="support" x="505.0" y="219.2" text-anchor="middle"><tspan x="505.0" dy="0">Revealed before the</tspan><tspan x="505.0" dy="18">Hijrah</tspan></text><rect class="p3" x="612" y="170" width="170" height="84" rx="8"/><text class="label" x="697.0" y="196.8" text-anchor="middle"><tspan x="697.0" dy="0">Madani</tspan></text><text class="support" x="697.0" y="219.2" text-anchor="middle"><tspan x="697.0" dy="0">Revealed after the</tspan><tspan x="697.0" dy="18">Hijrah</tspan></text><rect class="pn" x="420" y="260" width="362" height="78" rx="8"/><text class="support" x="432" y="285.2" text-anchor="start"><tspan x="432" dy="0">Chapter order is not revelation order. Al-'Alaq is</tspan><tspan x="432" dy="18">surah 96, yet its opening ayat are linked with</tspan><tspan x="432" dy="18">the beginning of revelation.</tspan></text><text class="support" x="24" y="368" text-anchor="start"><tspan x="24" dy="0">Makki and Madani are broad labels for time; check details passage by passage.</tspan></text><text class="wm" x="808" y="386" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>