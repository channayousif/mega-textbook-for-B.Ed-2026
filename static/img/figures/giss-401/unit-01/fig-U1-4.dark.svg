<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of Tauheed, Risalat and Akhirat as three pillars of belief</title><desc id="d">Diagram of Tauheed, Risalat and Akhirat as three pillars standing on faith and holding up a believer's life and conduct, showing whom we worship, how we live and why it matters.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="32">1.2 The three foundations of belief</text><polygon class="panel" points="60,150 390,52 720,150"/><text class="row" x="390" y="128" text-anchor="middle">A believer's life and conduct</text><rect class="panel-a" x="80" y="160" width="190" height="210"/><text class="h" x="175.0" y="192" text-anchor="middle">Tauheed</text><text class="ink" x="175.0" y="220" text-anchor="middle">Allah is One</text><line class="link" x1="100" y1="322" x2="250" y2="322"/><text class="row" x="175.0" y="348" text-anchor="middle">whom we worship</text><rect class="panel-a" x="295" y="160" width="190" height="210"/><text class="h" x="390.0" y="192" text-anchor="middle">Risalat</text><text class="ink" x="390.0" y="220" text-anchor="middle">Guidance through the<tspan x="390.0" dy="17">prophets, ending with</tspan><tspan x="390.0" dy="17">Muhammad (peace be</tspan><tspan x="390.0" dy="17">upon him)</tspan></text><line class="link" x1="315" y1="322" x2="465" y2="322"/><text class="row" x="390.0" y="348" text-anchor="middle">how we live</text><rect class="panel-a" x="510" y="160" width="190" height="210"/><text class="h" x="605.0" y="192" text-anchor="middle">Akhirat</text><text class="ink" x="605.0" y="220" text-anchor="middle">Life after death<tspan x="605.0" dy="17">and accountability</tspan></text><line class="link" x1="530" y1="322" x2="680" y2="322"/><text class="row" x="605.0" y="348" text-anchor="middle">why it matters</text><rect class="panel-b" x="50" y="380" width="680" height="48"/><text class="h" x="390" y="410" text-anchor="middle">Iman (faith)</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
