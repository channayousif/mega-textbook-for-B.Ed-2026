<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 502" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of the six articles of faith</title><desc id="d">Table of the six articles of faith: Allah, the angels, the books, the messengers, the Last Day and the divine decree, each with its meaning and a Qur'anic or hadith reference.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="502"/><text class="h" x="24" y="32">1.2 The six articles of faith</text><rect class="panel" x="24" y="54" width="732" height="44"/><text class="h" x="36" y="82">Article</text><text class="h" x="212" y="82">What it means</text><text class="h" x="608" y="82">Reference</text><rect class="panel" x="24" y="98" width="176" height="39"/><text class="row" x="36" y="122">Belief in Allah</text><text class="ink" x="212" y="122">Allah is One, with perfect attributes</text><text class="ink" x="608" y="122">112:1-4</text><rect class="panel" x="24" y="137" width="176" height="73"/><text class="row" x="36" y="161">Belief in the<tspan x="36" dy="17">angels</tspan></text><text class="ink" x="212" y="161">Created beings who obey Allah and carry<tspan x="212" dy="17">out His commands, such as Jibril who</tspan><tspan x="212" dy="17">brought revelation</tspan></text><text class="ink" x="608" y="161">2:97; 82:10-12</text><rect class="panel" x="24" y="210" width="176" height="73"/><text class="row" x="36" y="234">Belief in the<tspan x="36" dy="17">books</tspan></text><text class="ink" x="212" y="234">Allah sent books to His messengers: the<tspan x="212" dy="17">Tawrat, the Zabur, the Injil and finally</tspan><tspan x="212" dy="17">the Qur'an, which He preserves</tspan></text><text class="ink" x="608" y="234">3:3; 4:163;<tspan x="608" dy="17">15:9</tspan></text><rect class="panel" x="24" y="283" width="176" height="56"/><text class="row" x="36" y="307">Belief in the<tspan x="36" dy="17">messengers</tspan></text><text class="ink" x="212" y="307">Allah sent prophets to every nation,<tspan x="212" dy="17">ending with Muhammad, peace be upon him</tspan></text><text class="ink" x="608" y="307">16:36; 33:40</text><rect class="panel" x="24" y="339" width="176" height="56"/><text class="row" x="36" y="363">Belief in the<tspan x="36" dy="17">Last Day</tspan></text><text class="ink" x="212" y="363">All people will be raised and judged</text><text class="ink" x="608" y="363">99:7-8</text><rect class="panel" x="24" y="395" width="176" height="73"/><text class="row" x="36" y="419">Belief in the<tspan x="36" dy="17">divine decree</tspan></text><text class="ink" x="212" y="419">Allah knows and has measured all things,<tspan x="212" dy="17">and people remain responsible for their</tspan><tspan x="212" dy="17">choices</tspan></text><text class="ink" x="608" y="419">54:49; 2:286;<tspan x="608" dy="17">Sahih Muslim 8a</tspan></text><path class="link" d="M200 54V468 M596 54V468 M756 54V468H200 M24 468H200 M200 137H756 M200 210H756 M200 283H756 M200 339H756 M200 395H756 M24 54V468"/><text class="wm" x="768" y="492" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
