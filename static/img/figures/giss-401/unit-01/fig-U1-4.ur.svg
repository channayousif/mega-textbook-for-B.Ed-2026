<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عقیدے کے تین ستون: توحید، رسالت اور آخرت</title><desc id="d">توحید، رسالت اور آخرت کے تین ستون ایمان کی بنیاد پر کھڑے ہوکر مومن کی زندگی اور عمل کو سہارا دیتے ہیں؛ یہ دکھاتے ہیں کہ ہم کس کی عبادت کریں، کیسے جئیں اور یہ کیوں اہم ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="756" y="32" text-anchor="end">1.2 عقیدے کی تین بنیادیں</text><polygon class="panel" points="60,150 390,52 720,150" transform="translate(780 0) scale(-1 1)"/><text class="row" x="390" y="128" text-anchor="middle">مومن کی زندگی اور عمل</text><rect class="panel-a" x="510" y="160" width="190" height="210"/><text class="h" x="605" y="192" text-anchor="middle">توحید</text><text class="ink" x="605" y="220" text-anchor="middle">اللہ ایک ہے</text><line class="link" x1="100" y1="322" x2="250" y2="322" transform="translate(780 0) scale(-1 1)"/><text class="row" x="605" y="348" text-anchor="middle">کس کی عبادت کریں</text><rect class="panel-a" x="295" y="160" width="190" height="210"/><text class="h" x="390" y="192" text-anchor="middle">رسالت</text><text class="ink" x="390" y="220" text-anchor="middle">انبیا کے ذریعے ہدایت،<tspan x="390" dy="20">جن کا سلسلہ</tspan><tspan x="390" dy="20">محمد صلی اللہ</tspan><tspan x="390" dy="20">علیہ وسلم پر ختم ہوا</tspan></text><line class="link" x1="315" y1="322" x2="465" y2="322" transform="translate(780 0) scale(-1 1)"/><text class="row" x="390" y="348" text-anchor="middle">کیسے جئیں</text><rect class="panel-a" x="80" y="160" width="190" height="210"/><text class="h" x="175" y="192" text-anchor="middle">آخرت</text><text class="ink" x="175" y="220" text-anchor="middle">موت کے بعد زندگی<tspan x="175" dy="20">اور جواب دہی</tspan></text><line class="link" x1="530" y1="322" x2="680" y2="322" transform="translate(780 0) scale(-1 1)"/><text class="row" x="175" y="348" text-anchor="middle">یہ کیوں اہم ہے</text><rect class="panel-b" x="50" y="380" width="680" height="48"/><text class="h" x="390" y="410" text-anchor="middle">ایمان</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
