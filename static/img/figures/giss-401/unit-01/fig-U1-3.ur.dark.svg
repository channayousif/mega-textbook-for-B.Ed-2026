<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 502" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایمان کے چھ ارکان کا جدول</title><desc id="d">ایمان کے چھ ارکان کا جدول: اللہ، فرشتوں، کتابوں، رسولوں، آخرت اور تقدیر پر ایمان، ہر ایک کے مفہوم اور قرآنی یا حدیث کے حوالے کے ساتھ۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="502"/><text class="h" x="756" y="32" text-anchor="end">1.2 ایمان کے چھ ارکان</text><rect class="panel" x="24" y="54" width="732" height="44"/><text class="h" x="744" y="82" text-anchor="end">رکن</text><text class="h" x="568" y="82" text-anchor="end">مفہوم</text><text class="h" x="172" y="82" text-anchor="end">حوالہ</text><rect class="panel" x="580" y="98" width="176" height="39"/><text class="row" x="744" y="122" text-anchor="end">اللہ پر ایمان</text><text class="ink" x="568" y="122" text-anchor="end">اللہ ایک ہے، اس کی صفات کامل ہیں</text><text class="ink" x="172" y="122" text-anchor="end">112:1-4</text><rect class="panel" x="580" y="137" width="176" height="73"/><text class="row" x="744" y="161" text-anchor="end">فرشتوں پر<tspan x="744" dy="20">ایمان</tspan></text><text class="ink" x="568" y="161" text-anchor="end">اللہ کی اطاعت اور اس کے احکام پر عمل<tspan x="568" dy="20">کرنے والی مخلوق، جیسے جبرائیل</tspan><tspan x="568" dy="20">جو وحی لائے</tspan></text><text class="ink" x="172" y="161" text-anchor="end">2:97; 82:10-12</text><rect class="panel" x="580" y="210" width="176" height="73"/><text class="row" x="744" y="234" text-anchor="end">کتابوں پر<tspan x="744" dy="20">ایمان</tspan></text><text class="ink" x="568" y="234" text-anchor="end">اللہ نے رسولوں پر کتابیں نازل کیں:<tspan x="568" dy="20">تورات، زبور، انجیل اور آخر میں قرآن،</tspan><tspan x="568" dy="20">جس کی وہ حفاظت کرتا ہے</tspan></text><text class="ink" x="172" y="234" text-anchor="end">3:3; 4:163;<tspan x="172" dy="20">15:9</tspan></text><rect class="panel" x="580" y="283" width="176" height="56"/><text class="row" x="744" y="307" text-anchor="end">رسولوں پر<tspan x="744" dy="20">ایمان</tspan></text><text class="ink" x="568" y="307" text-anchor="end">اللہ نے ہر قوم میں نبی بھیجے، سلسلہ<tspan x="568" dy="20">محمد صلی اللہ علیہ وسلم پر ختم ہوا</tspan></text><text class="ink" x="172" y="307" text-anchor="end">16:36; 33:40</text><rect class="panel" x="580" y="339" width="176" height="56"/><text class="row" x="744" y="363" text-anchor="end">آخرت پر<tspan x="744" dy="20">ایمان</tspan></text><text class="ink" x="568" y="363" text-anchor="end">سب انسان دوبارہ اٹھائے اور جانچے جائیں گے</text><text class="ink" x="172" y="363" text-anchor="end">99:7-8</text><rect class="panel" x="580" y="395" width="176" height="73"/><text class="row" x="744" y="419" text-anchor="end">تقدیر پر<tspan x="744" dy="20">ایمان</tspan></text><text class="ink" x="568" y="419" text-anchor="end">اللہ سب جانتا اور ہر چیز کی مقدار مقرر کرتا ہے،<tspan x="568" dy="20">اور انسان اپنے انتخاب کے</tspan><tspan x="568" dy="20">ذمہ دار رہتے ہیں</tspan></text><text class="ink" x="172" y="419" text-anchor="end">54:49; 2:286;<tspan x="172" dy="20">Sahih Muslim 8a</tspan></text><path class="link" d="M200 54V468 M596 54V468 M756 54V468H200 M24 468H200 M200 137H756 M200 210H756 M200 283H756 M200 339H756 M200 395H756 M24 54V468" transform="translate(780 0) scale(-1 1)"/><text class="wm" x="12" y="492" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
