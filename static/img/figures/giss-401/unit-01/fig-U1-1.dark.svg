<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of Islam as a complete code of life</title><desc id="d">Concept map with Islam as a complete code of life at the centre, linked to six connected areas of life: belief, worship, morals, society, economy and the state.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="32">1.1 Islam as a complete code of life</text><line class="thin" x1="256" y1="92" x2="524" y2="92"/><line class="thin" x1="637" y1="132" x2="643" y2="222"/><line class="thin" x1="643" y1="302" x2="637" y2="392"/><line class="thin" x1="524" y1="432" x2="256" y2="432"/><line class="thin" x1="143" y1="392" x2="137" y2="302"/><line class="thin" x1="137" y1="222" x2="143" y2="132"/><line class="stroke" x1="338" y1="226" x2="203" y2="132" marker-end="url(#arrow)"/><line class="stroke" x1="442" y1="226" x2="577" y2="132" marker-end="url(#arrow)"/><line class="stroke" x1="270" y1="262" x2="244" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="510" y1="262" x2="536" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="338" y1="298" x2="203" y2="392" marker-end="url(#arrow)"/><line class="stroke" x1="442" y1="298" x2="577" y2="392" marker-end="url(#arrow)"/><rect class="panel" x="36" y="52" width="220" height="80" rx="10"/><text class="row" x="146.0" y="78" text-anchor="middle">Belief</text><text class="ink" x="146.0" y="98" text-anchor="middle">Tauheed, Risalat, Akhirat</text><rect class="panel" x="524" y="52" width="220" height="80" rx="10"/><text class="row" x="634.0" y="78" text-anchor="middle">Worship</text><text class="ink" x="634.0" y="98" text-anchor="middle">Salat, Zakat, Saum, Hajj</text><rect class="panel" x="24" y="222" width="220" height="80" rx="10"/><text class="row" x="134.0" y="244" text-anchor="middle">Morals</text><text class="ink" x="134.0" y="264" text-anchor="middle">truthfulness, justice,<tspan x="134.0" dy="17">patience</tspan></text><rect class="panel" x="536" y="222" width="220" height="80" rx="10"/><text class="row" x="646.0" y="244" text-anchor="middle">State</text><text class="ink" x="646.0" y="264" text-anchor="middle">justice, consultation,<tspan x="646.0" dy="17">accountability</tspan></text><rect class="panel" x="36" y="392" width="220" height="80" rx="10"/><text class="row" x="146.0" y="418" text-anchor="middle">Society</text><text class="ink" x="146.0" y="438" text-anchor="middle">family, rights of others</text><rect class="panel" x="524" y="392" width="220" height="80" rx="10"/><text class="row" x="634.0" y="414" text-anchor="middle">Economy</text><text class="ink" x="634.0" y="434" text-anchor="middle">halal earning, zakat,<tspan x="634.0" dy="17">no riba</tspan></text><rect class="panel-a" x="270" y="226" width="240" height="72" rx="14"/><text class="h" x="390.0" y="256" text-anchor="middle">Islam: a complete<tspan x="390.0" dy="20">code of life (din)</tspan></text><text class="muted" x="24" y="508">Belief at the root; every area of life guided by it. Dashed lines: the areas are connected.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
