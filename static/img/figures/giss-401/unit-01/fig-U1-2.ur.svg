<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلامیات کی آٹھ شاخوں کا جدول</title><desc id="d">اسلامیات کی آٹھ شاخوں کا جدول، علوم القرآن اور علوم الحدیث سے عقائد، فقہ، تاریخ، اخلاق، معاشرتی فکر اور تقابلِ ادیان تک، ہر شاخ کے مطالعے کے موضوع کے ساتھ۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="512"/><text class="h" x="756" y="32" text-anchor="end">1.1 اسلامیات کی شاخیں</text><rect class="panel" x="24" y="54" width="732" height="44"/><text class="h" x="744" y="82" text-anchor="end">شاخ</text><text class="h" x="474" y="82" text-anchor="end">مطالعے کا موضوع</text><rect class="panel" x="486" y="98" width="270" height="39"/><text class="row" x="744" y="122" text-anchor="end">علوم القرآن اور تفسیر</text><text class="ink" x="474" y="122" text-anchor="end">قرآن، اس کا نزول اور مفہوم</text><rect class="panel" x="486" y="137" width="270" height="56"/><text class="row" x="744" y="161" text-anchor="end">علوم الحدیث</text><text class="ink" x="474" y="161" text-anchor="end">نبی کریم کے اقوال و عمل، اور<tspan x="474" dy="20">روایات کی جانچ کا طریقہ</tspan></text><rect class="panel" x="486" y="193" width="270" height="39"/><text class="row" x="744" y="217" text-anchor="end">عقیدہ</text><text class="ink" x="474" y="217" text-anchor="end">اسلام کے عقائد</text><rect class="panel" x="486" y="232" width="270" height="56"/><text class="row" x="744" y="256" text-anchor="end">فقہ اور اصولِ فقہ</text><text class="ink" x="474" y="256" text-anchor="end">عبادات اور روزمرہ معاملات کے احکام، اور<tspan x="474" dy="20">ان کے اخذ کرنے کا طریقہ</tspan></text><rect class="panel" x="486" y="288" width="270" height="56"/><text class="row" x="744" y="312" text-anchor="end">سیرت اور اسلامی تاریخ</text><text class="ink" x="474" y="312" text-anchor="end">نبی کریم کی زندگی اور<tspan x="474" dy="20">مسلمانوں کی تاریخ</tspan></text><rect class="panel" x="486" y="344" width="270" height="39"/><text class="row" x="744" y="368" text-anchor="end">اخلاق</text><text class="ink" x="474" y="368" text-anchor="end">اخلاقی کردار اور عمل</text><rect class="panel" x="486" y="383" width="270" height="56"/><text class="row" x="744" y="407" text-anchor="end">اسلامی معاشرتی، معاشی<tspan x="744" dy="20">اور سیاسی فکر</tspan></text><text class="ink" x="474" y="407" text-anchor="end">خاندان، معیشت اور ریاست</text><rect class="panel" x="486" y="439" width="270" height="39"/><text class="row" x="744" y="463" text-anchor="end">تقابلِ ادیان</text><text class="ink" x="474" y="463" text-anchor="end">دوسرے ادیان سے اسلام کا تعلق</text><path class="link" d="M294 54V478 M756 54V478H294 M24 478H294 M294 137H756 M294 193H756 M294 232H756 M294 288H756 M294 344H756 M294 383H756 M294 439H756 M24 54V478" transform="translate(780 0) scale(-1 1)"/><text class="wm" x="12" y="502" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
