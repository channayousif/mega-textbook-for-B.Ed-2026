<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلام بطور مکمل ضابطۂ حیات: تصوراتی نقشہ</title><desc id="d">تصوراتی نقشے کے مرکز میں اسلام بطور مکمل ضابطۂ حیات ہے، جس سے زندگی کے چھ باہم مربوط شعبے جڑے ہیں: عقیدہ، عبادت، اخلاق، معاشرہ، معیشت اور ریاست۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" transform="translate(780 0) scale(-1 1)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="756" y="32" text-anchor="end">1.1 اسلام بطور مکمل ضابطۂ حیات</text><line class="thin" x1="256" y1="92" x2="524" y2="92" transform="translate(780 0) scale(-1 1)"/><line class="thin" x1="637" y1="132" x2="643" y2="222" transform="translate(780 0) scale(-1 1)"/><line class="thin" x1="643" y1="302" x2="637" y2="392" transform="translate(780 0) scale(-1 1)"/><line class="thin" x1="524" y1="432" x2="256" y2="432" transform="translate(780 0) scale(-1 1)"/><line class="thin" x1="143" y1="392" x2="137" y2="302" transform="translate(780 0) scale(-1 1)"/><line class="thin" x1="137" y1="222" x2="143" y2="132" transform="translate(780 0) scale(-1 1)"/><line class="stroke" x1="338" y1="226" x2="203" y2="132" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><line class="stroke" x1="442" y1="226" x2="577" y2="132" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><line class="stroke" x1="270" y1="262" x2="244" y2="262" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><line class="stroke" x1="510" y1="262" x2="536" y2="262" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><line class="stroke" x1="338" y1="298" x2="203" y2="392" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><line class="stroke" x1="442" y1="298" x2="577" y2="392" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><rect class="panel" x="524" y="52" width="220" height="80" rx="10"/><text class="row" x="634" y="78" text-anchor="middle">عقیدہ</text><text class="ink" x="634" y="98" text-anchor="middle">توحید، رسالت، آخرت</text><rect class="panel" x="36" y="52" width="220" height="80" rx="10"/><text class="row" x="146" y="78" text-anchor="middle">عبادت</text><text class="ink" x="146" y="98" text-anchor="middle">نماز، زکوٰۃ، روزہ، حج</text><rect class="panel" x="536" y="222" width="220" height="80" rx="10"/><text class="row" x="646" y="244" text-anchor="middle">اخلاق</text><text class="ink" x="646" y="264" text-anchor="middle">سچائی، انصاف،<tspan x="646" dy="20">صبر</tspan></text><rect class="panel" x="24" y="222" width="220" height="80" rx="10"/><text class="row" x="134" y="244" text-anchor="middle">ریاست</text><text class="ink" x="134" y="264" text-anchor="middle">انصاف، مشاورت،<tspan x="134" dy="20">جواب دہی</tspan></text><rect class="panel" x="524" y="392" width="220" height="80" rx="10"/><text class="row" x="634" y="418" text-anchor="middle">معاشرہ</text><text class="ink" x="634" y="438" text-anchor="middle">خاندان، دوسروں کے حقوق</text><rect class="panel" x="36" y="392" width="220" height="80" rx="10"/><text class="row" x="146" y="414" text-anchor="middle">معیشت</text><text class="ink" x="146" y="434" text-anchor="middle">حلال کمائی، زکوٰۃ،<tspan x="146" dy="20">سود سے اجتناب</tspan></text><rect class="panel-a" x="270" y="226" width="240" height="72" rx="14"/><text class="h" x="390" y="256" text-anchor="middle">اسلام: مکمل<tspan x="390" dy="20">ضابطۂ حیات (دین)</tspan></text><text class="muted" x="756" y="508" text-anchor="end">عقیدہ جڑ ہے؛ ہر شعبے کو رہنمائی ملتی ہے۔ ٹوٹی لکیریں: شعبے باہم جڑے ہیں۔</text><text class="wm" x="12" y="530" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
