<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of eight branches of Islamic Studies</title><desc id="d">Table of eight branches of Islamic Studies, from Qur'anic studies and Hadith studies to belief, law, history, morals, social thought and comparative religion, with what each branch studies.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="512"/><text class="h" x="24" y="32">1.1 Branches of Islamic Studies</text><rect class="panel" x="24" y="54" width="732" height="44"/><text class="h" x="36" y="82">Branch</text><text class="h" x="306" y="82">What it studies</text><rect class="panel" x="24" y="98" width="270" height="39"/><text class="row" x="36" y="122">Ulum al-Qur'an and Tafsir</text><text class="ink" x="306" y="122">The Qur'an, its revelation and its meaning</text><rect class="panel" x="24" y="137" width="270" height="56"/><text class="row" x="36" y="161">Ulum al-Hadith</text><text class="ink" x="306" y="161">The sayings and practice of the Prophet, and how<tspan x="306" dy="17">reports are checked</tspan></text><rect class="panel" x="24" y="193" width="270" height="39"/><text class="row" x="36" y="217">Aqidah</text><text class="ink" x="306" y="217">The beliefs of Islam</text><rect class="panel" x="24" y="232" width="270" height="56"/><text class="row" x="36" y="256">Fiqh and Usul al-Fiqh</text><text class="ink" x="306" y="256">Rulings on worship and daily dealings, and the<tspan x="306" dy="17">method for deriving them</tspan></text><rect class="panel" x="24" y="288" width="270" height="56"/><text class="row" x="36" y="312">Seerah and Islamic history</text><text class="ink" x="306" y="312">The life of the Prophet and the history of<tspan x="306" dy="17">Muslims</tspan></text><rect class="panel" x="24" y="344" width="270" height="39"/><text class="row" x="36" y="368">Akhlaq</text><text class="ink" x="306" y="368">Moral character and conduct</text><rect class="panel" x="24" y="383" width="270" height="56"/><text class="row" x="36" y="407">Islamic social, economic<tspan x="36" dy="17">and political thought</tspan></text><text class="ink" x="306" y="407">Family, economy and state</text><rect class="panel" x="24" y="439" width="270" height="39"/><text class="row" x="36" y="463">Comparative religion</text><text class="ink" x="306" y="463">Islam in relation to other faiths</text><path class="link" d="M294 54V478 M756 54V478H294 M24 478H294 M294 137H756 M294 193H756 M294 232H756 M294 288H756 M294 344H756 M294 383H756 M294 439H756 M24 54V478"/><text class="wm" x="768" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
