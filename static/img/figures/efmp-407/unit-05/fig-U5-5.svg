<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of traditional ecological knowledge across Pakistan's regions</title><desc id="d">Table of traditional ecological knowledge examples from Pakistan's regions, describing the practice, scientific principle and sustainability lesson.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 12px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="25" y="32">5.3 Traditional ecological knowledge systems in Pakistan</text><rect class="panel" x="25" y="52" width="730" height="365" rx="8"/><line class="grid" x1="25" y1="96" x2="755" y2="96"/><line class="grid" x1="25" y1="172" x2="755" y2="172"/><line class="grid" x1="25" y1="252" x2="755" y2="252"/><line class="grid" x1="25" y1="334" x2="755" y2="334"/><line class="grid" x1="155" y1="52" x2="155" y2="417"/><line class="grid" x1="335" y1="52" x2="335" y2="417"/><line class="grid" x1="545" y1="52" x2="545" y2="417"/><text class="row" x="35" y="80">Region</text><text class="row" x="165" y="80">Traditional practice</text><text class="row" x="345" y="80">Scientific principle</text><text class="row" x="555" y="80">Sustainability lesson</text><text class="row" x="35" y="122">Balochistan</text><text class="ink" x="165" y="122">Karez subterranean</text><text class="ink" x="165" y="142">water channel system</text><text class="ink" x="345" y="122">Gravity flow tapping</text><text class="ink" x="345" y="142">alluvial aquifers</text><text class="ink" x="555" y="122">Zero-energy water harvest</text><text class="ink" x="555" y="142">within natural recharge limits</text><text class="row" x="35" y="198">Sindh &amp;</text><text class="row" x="35" y="218">Punjab</text><text class="ink" x="165" y="198">Legume crop rotation</text><text class="ink" x="165" y="218">(chickpeas with wheat)</text><text class="ink" x="345" y="198">Biological nitrogen</text><text class="ink" x="345" y="218">fixation in root nodules</text><text class="ink" x="555" y="198">Soil health without heavy</text><text class="ink" x="555" y="218">chemical fertilizer dependency</text><text class="row" x="35" y="278">KP &amp;</text><text class="row" x="35" y="298">Sindh</text><text class="ink" x="165" y="278">Rod-Kohi / Sailaba</text><text class="ink" x="165" y="298">spate flood irrigation</text><text class="ink" x="345" y="278">Earthen bund diversion</text><text class="ink" x="345" y="298">trapping silt and moisture</text><text class="ink" x="555" y="278">Turning flash flood risks</text><text class="ink" x="555" y="298">into fertile food production</text><text class="row" x="35" y="360">Gilgit-</text><text class="row" x="35" y="380">Baltistan</text><text class="ink" x="165" y="360">Glacier grafting</text><text class="ink" x="165" y="380">and contour channels</text><text class="ink" x="345" y="360">Micro-climate ice growth</text><text class="ink" x="345" y="380">and gravity melt diversion</text><text class="ink" x="555" y="360">Local climate adaptation</text><text class="ink" x="555" y="380">and shared water rights</text><text class="wm" x="768" y="445" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>