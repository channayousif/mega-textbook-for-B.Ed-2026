<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram showing the convergence of indigenous knowledge and modern science</title><desc id="d">Diagram showing indigenous ecological knowledge and modern scientific inquiry converging as two complementary streams into integrated sustainability education.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 12px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="25" y="32">5.3 Two-eyed seeing: bridging indigenous wisdom and modern science</text><rect class="panel" x="30" y="55" width="330" height="175" rx="10"/><text class="row" x="50" y="82">Indigenous ecological knowledge</text><text class="ink" x="50" y="107">• Generational empirical observation</text><text class="ink" x="50" y="130">• Place-based local ecosystem adaptations</text><text class="ink" x="50" y="153">• Circular, reciprocal relationship with nature</text><text class="ink" x="50" y="176">• Community-governed resource conservation</text><text class="small" x="50" y="208">Rooted in local culture and lived memory</text><rect class="panel" x="420" y="55" width="330" height="175" rx="10"/><text class="row" x="440" y="82">Modern scientific inquiry</text><text class="ink" x="440" y="107">• Controlled testing and systematic data</text><text class="ink" x="440" y="130">• Global comparative ecological models</text><text class="ink" x="440" y="153">• Technological measurement and sensors</text><text class="ink" x="440" y="176">• Formal laboratory analysis and documentation</text><text class="small" x="440" y="208">Rooted in broad empirical generalisation</text><line class="stroke" x1="195" y1="230" x2="280" y2="283" marker-end="url(#arrow)"/><line class="stroke" x1="585" y1="230" x2="500" y2="283" marker-end="url(#arrow)"/><rect class="panel-a" x="140" y="285" width="500" height="98" rx="12"/><text class="h" x="390" y="315" text-anchor="middle">Two-eyed seeing: integrated sustainability education</text><text class="ink" x="390" y="340" text-anchor="middle">Culturally rooted, scientifically sound environmental action</text><text class="small" x="390" y="365" text-anchor="middle">Respects local community heritage while applying rigorous scientific inquiry</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>