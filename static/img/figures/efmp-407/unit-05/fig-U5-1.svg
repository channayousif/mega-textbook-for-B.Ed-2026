<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of peace, gender equality and social justice in sustainable development</title><desc id="d">Concept map showing peace, gender equality and social justice as three interconnected pillars supporting sustainable development, linked to each other by mutual reinforcement.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .dash { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="24" y="32">5.1 Social foundations of sustainable development</text><rect class="panel" x="250" y="52" width="280" height="76" rx="8"/><text class="row" x="390" y="76" text-anchor="middle">peace</text><text class="ink" x="390" y="96" text-anchor="middle">positive peace and non-violent</text><text class="ink" x="390" y="113" text-anchor="middle">conflict resolution</text><rect class="panel-a" x="270" y="180" width="240" height="74" rx="12"/><text class="h" x="390" y="212" text-anchor="middle">sustainable</text><text class="h" x="390" y="234" text-anchor="middle">development</text><rect class="panel" x="24" y="290" width="260" height="76" rx="8"/><text class="row" x="154" y="314" text-anchor="middle">gender equality</text><text class="ink" x="154" y="334" text-anchor="middle">equal voice, rights and</text><text class="ink" x="154" y="351" text-anchor="middle">care responsibilities</text><rect class="panel" x="496" y="290" width="260" height="76" rx="8"/><text class="row" x="626" y="314" text-anchor="middle">social justice</text><text class="ink" x="626" y="334" text-anchor="middle">fair distribution of resources</text><text class="ink" x="626" y="351" text-anchor="middle">and protection of the vulnerable</text><line class="stroke" x1="390" y1="130" x2="390" y2="178" marker-end="url(#arrow)"/><line class="stroke" x1="286" y1="290" x2="330" y2="256" marker-end="url(#arrow)"/><line class="stroke" x1="494" y1="290" x2="450" y2="256" marker-end="url(#arrow)"/><path class="dash" d="M 284 340 L 496 340"/><path class="dash" d="M 154 290 Q 200 130 250 100"/><path class="dash" d="M 626 290 Q 580 130 530 100"/><text class="small" x="400" y="156" text-anchor="start">resolves resource tension</text><text class="small" x="270" y="260" text-anchor="end">equal participation</text><text class="small" x="510" y="260" text-anchor="start">equitable sharing</text><text class="small" x="390" y="334" text-anchor="middle">fairness across all groups</text><text class="small" x="175" y="195" text-anchor="middle">cooperation</text><text class="small" x="605" y="195" text-anchor="middle">rule of law</text><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>