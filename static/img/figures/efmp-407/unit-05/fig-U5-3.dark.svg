<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of fundamental rights, school obligations and inclusive classroom practices</title><desc id="d">Table outlining selected fundamental rights relevant to education, institutional requirements for schools, and inclusive classroom practices in Pakistan.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="25" y="32">5.2 Rights framework for inclusive schooling</text><rect class="panel" x="25" y="52" width="730" height="350" rx="8"/><line class="grid" x1="25" y1="96" x2="755" y2="96"/><line class="grid" x1="25" y1="198" x2="755" y2="198"/><line class="grid" x1="25" y1="300" x2="755" y2="300"/><line class="grid" x1="190" y1="52" x2="190" y2="402"/><line class="grid" x1="370" y1="52" x2="370" y2="402"/><line class="grid" x1="555" y1="52" x2="555" y2="402"/><text class="row" x="35" y="80">Legal framework</text><text class="row" x="200" y="80">Fundamental right</text><text class="row" x="380" y="80">School obligation</text><text class="row" x="565" y="80">Inclusive practice</text><text class="row" x="35" y="125">Constitution of</text><text class="row" x="35" y="145">Pakistan (Art. 25A)</text><text class="ink" x="200" y="125">Free and compulsory</text><text class="ink" x="200" y="145">education for all</text><text class="ink" x="200" y="165">children aged 5 to 16</text><text class="ink" x="380" y="125">Remove economic,</text><text class="ink" x="380" y="145">physical and systemic</text><text class="ink" x="380" y="165">barriers to enrollment</text><text class="ink" x="565" y="125">Provide free books and</text><text class="ink" x="565" y="145">flexible hours for working</text><text class="ink" x="565" y="165">or rural farm children</text><text class="row" x="35" y="227">UN Convention on</text><text class="row" x="35" y="247">the Rights of the</text><text class="row" x="35" y="267">Child (Art. 28-29)</text><text class="ink" x="200" y="227">Equal opportunity and</text><text class="ink" x="200" y="247">education directed to</text><text class="ink" x="200" y="267">peace and environment</text><text class="ink" x="380" y="227">Foster dignity, non-</text><text class="ink" x="380" y="247">discrimination and</text><text class="ink" x="380" y="267">environmental care</text><text class="ink" x="565" y="227">Include minority language</text><text class="ink" x="565" y="247">support and cooperative</text><text class="ink" x="565" y="267">eco-learning activities</text><text class="row" x="35" y="329">Constitution of</text><text class="row" x="35" y="349">Pakistan (Art. 25)</text><text class="ink" x="200" y="329">Equality before law;</text><text class="ink" x="200" y="349">zero discrimination</text><text class="ink" x="200" y="369">on the basis of sex</text><text class="ink" x="380" y="329">Ensure safe facilities,</text><text class="ink" x="380" y="349">privacy and equal</text><text class="ink" x="380" y="369">educational resources</text><text class="ink" x="565" y="329">Build boundary walls and</text><text class="ink" x="565" y="349">toilets; give equal time</text><text class="ink" x="565" y="369">and attention to girls</text><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>