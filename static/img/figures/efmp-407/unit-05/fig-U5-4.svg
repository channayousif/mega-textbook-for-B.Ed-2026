<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the inclusive classroom: access, participation and achievement</title><desc id="d">Diagram of the inclusive classroom showing three concentric layers: access at the foundation, participation in the process, and achievement at the centre for every learner.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="25" y="32">5.2 The inclusive classroom: access, participation and achievement</text><rect class="panel" x="25" y="55" width="730" height="340" rx="16"/><text class="row" x="45" y="82">1. Access (presence and entry)</text><text class="small" x="45" y="100">Physical ramps, safe routes, fee-free enrolment, boundary walls and local language bridges</text><rect class="panel-b" x="95" y="115" width="590" height="230" rx="12"/><text class="row" x="120" y="142">2. Participation (engagement and belonging)</text><text class="small" x="120" y="160">Active voice in discussions, collaborative group work, anti-bias culture and mutual dignity</text><rect class="panel-a" x="165" y="175" width="450" height="130" rx="10"/><text class="h" x="390" y="210" text-anchor="middle">3. Achievement (learning success)</text><text class="ink" x="390" y="235" text-anchor="middle">Mastery of sustainability knowledge, critical thinking</text><text class="ink" x="390" y="255" text-anchor="middle">and community action competencies for every child</text><text class="small" x="390" y="285" text-anchor="middle">Differentiated tasks matching diverse learning strengths</text><text class="small" x="390" y="325" text-anchor="middle">No child is an observer; every learner contributes</text><text class="small" x="390" y="375" text-anchor="middle">All means all: disability, gender, poverty, language and minority status</text><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>