<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing peace, gender equality and social justice in education for sustainability</title><desc id="d">Table comparing peace, gender equality and social justice across core meaning, SDG connection and practical classroom actions in a Pakistani school.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="25" y="32">5.1 Peace, gender equality and social justice in the classroom</text><rect class="panel" x="25" y="52" width="730" height="340" rx="8"/><line class="grid" x1="25" y1="96" x2="755" y2="96"/><line class="grid" x1="25" y1="194" x2="755" y2="194"/><line class="grid" x1="25" y1="292" x2="755" y2="292"/><line class="grid" x1="165" y1="52" x2="165" y2="392"/><line class="grid" x1="380" y1="52" x2="380" y2="392"/><line class="grid" x1="550" y1="52" x2="550" y2="392"/><text class="row" x="35" y="80">Dimension</text><text class="row" x="175" y="80">Core meaning in ESD</text><text class="row" x="390" y="80">SDG connection</text><text class="row" x="560" y="80">Classroom practice</text><text class="row" x="35" y="125">Peace</text><text class="ink" x="175" y="125">Positive peace: dialogue,</text><text class="ink" x="175" y="145">trust and non-violent</text><text class="ink" x="175" y="165">conflict resolution</text><text class="ink" x="390" y="125">SDG 16 (Peace,</text><text class="ink" x="390" y="145">Justice and Strong</text><text class="ink" x="390" y="165">Institutions)</text><text class="ink" x="560" y="125">Pupil mediation teams</text><text class="ink" x="560" y="145">for sharing water, space</text><text class="ink" x="560" y="165">and learning resources</text><text class="row" x="35" y="223">Gender</text><text class="row" x="35" y="243">equality</text><text class="ink" x="175" y="223">Equal voice, learning</text><text class="ink" x="175" y="243">opportunities and shared</text><text class="ink" x="175" y="263">environmental care</text><text class="ink" x="390" y="223">SDG 5 (Gender</text><text class="ink" x="390" y="243">Equality) and</text><text class="ink" x="390" y="263">Constitution Art. 25</text><text class="ink" x="560" y="223">Equal leadership for</text><text class="ink" x="560" y="243">girls and boys in green</text><text class="ink" x="560" y="263">clubs and science tasks</text><text class="row" x="35" y="321">Social</text><text class="row" x="35" y="341">justice</text><text class="ink" x="175" y="321">Fair distribution of</text><text class="ink" x="175" y="341">burdens; protection for</text><text class="ink" x="175" y="361">vulnerable families</text><text class="ink" x="390" y="321">SDG 10 (Reduced</text><text class="ink" x="390" y="341">Inequalities) and</text><text class="ink" x="390" y="361">Constitution Art. 37</text><text class="ink" x="560" y="321">Targeted support and</text><text class="ink" x="560" y="341">learning aids so poor</text><text class="ink" x="560" y="361">pupils join all activities</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>