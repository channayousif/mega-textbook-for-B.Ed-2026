<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 822" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خریداری سے پہلے اخلاقی صارف کے چار سوال</title><desc id="d">عملی بہاؤ کا خاکہ۔ کچھ خریدنے کی خواہش سے شروع ہو کر پہلا سوال ہے کہ کیا مجھے اس کی ضرورت ہے؛ نہیں تو ادھار لیں، مرمت کریں یا موجودہ چیز سے کام چلائیں۔ ہاں تو پوچھیں کہ کس نے بنایا، کیسے بنایا اور استعمال کے بعد کیا ہو گا۔ آخری مرحلہ معلوم باتوں پر فیصلہ اور نامعلوم باتوں کو لکھنا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="822"/><text class="h" x="756" y="48" text-anchor="end">6.3 خریداری سے پہلے چار سوال</text><rect class="panel" x="250" y="75" width="280" height="60" rx="20"/><text class="row" x="390" y="112.5" text-anchor="middle">میں کچھ خریدنا چاہتا ہوں</text><line class="link" x1="390" y1="135" x2="390" y2="165" marker-end="url(#arrow)"/><polygon class="panel-a" points="390,168 260,228 390,288 520,228"/><text class="row" x="390" y="235.5" text-anchor="middle">1. کیا ضرورت ہے؟</text><line class="link" x1="520" y1="228" x2="566" y2="228" marker-end="url(#arrow)"/><text class="row" x="542" y="214.5" text-anchor="middle">نہیں</text><rect class="plain" x="568" y="189" width="188" height="78" rx="6"/><text class="ink" x="662" y="222" text-anchor="middle">ادھار لیں، مرمت کریں</text><text class="ink" x="662" y="247.5" text-anchor="middle">یا کام چلائیں</text><line class="link" x1="390" y1="288" x2="390" y2="324" marker-end="url(#arrow)"/><text class="row" x="360" y="315" text-anchor="middle">ہاں</text><rect class="plain" x="190" y="327" width="400" height="84" rx="6"/><text class="row" x="390" y="363" text-anchor="middle">2. یہ کس نے بنایا؟</text><text class="small" x="390" y="393" text-anchor="middle">کیا بنانے والے کا نام ہے؟</text><line class="link" x1="390" y1="411" x2="390" y2="444" marker-end="url(#arrow)"/><rect class="plain" x="190" y="447" width="400" height="84" rx="6"/><text class="row" x="390" y="483" text-anchor="middle">3. یہ کیسے بنایا گیا؟</text><text class="small" x="390" y="513" text-anchor="middle">مواد، توانائی، کارکن: دعویٰ کیا ہے؟</text><line class="link" x1="390" y1="531" x2="390" y2="564" marker-end="url(#arrow)"/><rect class="plain" x="190" y="567" width="400" height="84" rx="6"/><text class="row" x="390" y="603" text-anchor="middle">4. استعمال کے بعد کیا ہو گا؟</text><text class="small" x="390" y="633" text-anchor="middle">دوبارہ استعمال، مرمت، باز یافت یا نہر؟</text><line class="link" x1="390" y1="651" x2="390" y2="684" marker-end="url(#arrow)"/><rect class="panel-b" x="190" y="687" width="400" height="78" rx="6"/><text class="row" x="390" y="720" text-anchor="middle">معلوم باتوں پر فیصلہ کریں،</text><text class="row" x="390" y="745.5" text-anchor="middle">اور نامعلوم باتیں لکھیں</text><text class="wm" x="12" y="807" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
