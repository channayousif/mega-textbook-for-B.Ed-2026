<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 425" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Corporate social responsibility and the four groups it concerns</title><desc id="d">Concept map with corporate social responsibility at the centre, joined by arrows to workers, community, environment and customers, each with what the company owes them. A note says that a donation is only one part of the question.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="425"/><text class="h" x="24" y="32">6.2 Who a company's work affects</text><rect class="panel-a" x="270" y="170" width="240" height="84" rx="10"/><text class="row" x="390" y="197" text-anchor="middle">Corporate social</text><text class="row" x="390" y="214" text-anchor="middle">responsibility:</text><text class="small" x="390" y="235" text-anchor="middle">how the business affects others</text><rect class="panel" x="24" y="54" width="232" height="92" rx="6"/><text class="h" x="140" y="78" text-anchor="middle">Workers</text><text class="ink" x="140" y="99" text-anchor="middle">safe conditions, fair pay and</text><text class="ink" x="140" y="116" text-anchor="middle">treatment, steady work</text><rect class="panel" x="524" y="54" width="232" height="92" rx="6"/><text class="h" x="640" y="78" text-anchor="middle">Community</text><text class="ink" x="640" y="99" text-anchor="middle">noise, traffic, water</text><text class="ink" x="640" y="116" text-anchor="middle">and local jobs</text><rect class="panel" x="24" y="276" width="232" height="92" rx="6"/><text class="h" x="140" y="300" text-anchor="middle">Environment</text><text class="ink" x="140" y="321" text-anchor="middle">air, water, land and</text><text class="ink" x="140" y="338" text-anchor="middle">resources used or polluted</text><rect class="panel" x="524" y="276" width="232" height="92" rx="6"/><text class="h" x="640" y="300" text-anchor="middle">Customers</text><text class="ink" x="640" y="321" text-anchor="middle">safe products and</text><text class="ink" x="640" y="338" text-anchor="middle">honest information</text><line class="link" x1="300" y1="170" x2="258" y2="148" marker-end="url(#arrow)"/><line class="link" x1="480" y1="170" x2="522" y2="148" marker-end="url(#arrow)"/><line class="link" x1="300" y1="254" x2="258" y2="276" marker-end="url(#arrow)"/><line class="link" x1="480" y1="254" x2="522" y2="276" marker-end="url(#arrow)"/><text class="row" x="390" y="390" text-anchor="middle">A donation is only one part of the question.</text><text class="wm" x="768" y="415" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
