<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 485" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Labels a consumer can check, what each claims and how far to trust it</title><desc id="d">Table of five labels and signs, with what each claims, who checks it and how far to trust it. The Pakistan Energy Label is strong on energy, the PS mark is good for its standard, the halal logo is serious on its own question, the Fairtrade mark covers certified products only, and words like eco-friendly are weak until there is evidence. None of the labels says everything about a product.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="485"/><text class="h" x="24" y="32">6.3 What a label claims and who checks it</text><rect class="panel" x="24" y="54" width="732" height="40"/><text class="h" x="32" y="78">Label or sign</text><text class="h" x="190" y="78">What it claims</text><text class="h" x="368" y="78">Who checks</text><text class="h" x="546" y="78">How far to trust it</text><rect class="plain" x="24" y="94" width="158" height="73"/><text class="row" x="32" y="117">Pakistan Energy</text><text class="row" x="32" y="134">Label on a fan</text><rect class="plain" x="182" y="94" width="178" height="73"/><text class="ink" x="190" y="117">Energy use, 1 to 5</text><text class="ink" x="190" y="134">stars</text><rect class="plain" x="360" y="94" width="178" height="73"/><text class="ink" x="368" y="117">NEECA registers</text><text class="ink" x="368" y="134">tested models; QR</text><text class="ink" x="368" y="151">code to verify</text><rect class="plain" x="538" y="94" width="218" height="73"/><text class="ink" x="546" y="117">Strong on energy; silent</text><text class="ink" x="546" y="134">on workers</text><rect class="plain" x="24" y="167" width="158" height="56"/><text class="row" x="32" y="190">PS mark</text><rect class="plain" x="182" y="167" width="178" height="56"/><text class="ink" x="190" y="190">Meets a Pakistan</text><text class="ink" x="190" y="207">Standard</text><rect class="plain" x="360" y="167" width="178" height="56"/><text class="ink" x="368" y="190">PSQCA</text><rect class="plain" x="538" y="167" width="218" height="56"/><text class="ink" x="546" y="190">Good for that standard;</text><text class="ink" x="546" y="207">silent on workers</text><rect class="plain" x="24" y="223" width="158" height="73"/><text class="row" x="32" y="246">Halal logo</text><rect class="plain" x="182" y="223" width="178" height="73"/><text class="ink" x="190" y="246">Conforms to the</text><text class="ink" x="190" y="263">Pakistan Halal</text><text class="ink" x="190" y="280">Standard</text><rect class="plain" x="360" y="223" width="178" height="73"/><text class="ink" x="368" y="246">Accredited</text><text class="ink" x="368" y="263">certification body</text><rect class="plain" x="538" y="223" width="218" height="73"/><text class="ink" x="546" y="246">Serious on that question;</text><text class="ink" x="546" y="263">not about wages or</text><text class="ink" x="546" y="280">packaging</text><rect class="plain" x="24" y="296" width="158" height="56"/><text class="row" x="32" y="319">Fairtrade mark</text><rect class="plain" x="182" y="296" width="178" height="56"/><text class="ink" x="190" y="319">Minimum price and</text><text class="ink" x="190" y="336">premium for producers</text><rect class="plain" x="360" y="296" width="178" height="56"/><text class="ink" x="368" y="319">Fairtrade</text><text class="ink" x="368" y="336">certification</text><rect class="plain" x="538" y="296" width="218" height="56"/><text class="ink" x="546" y="319">Covers certified products</text><text class="ink" x="546" y="336">only</text><rect class="plain" x="24" y="352" width="158" height="73"/><text class="row" x="32" y="375">Words like "eco-</text><text class="row" x="32" y="392">friendly" or</text><text class="row" x="32" y="409">"natural"</text><rect class="plain" x="182" y="352" width="178" height="73"/><text class="ink" x="190" y="375">No clear meaning</text><rect class="plain" x="360" y="352" width="178" height="73"/><text class="ink" x="368" y="375">Nobody named</text><rect class="plain" x="538" y="352" width="218" height="73"/><text class="ink" x="546" y="375">Weak until there is</text><text class="ink" x="546" y="392">evidence</text><text class="small" x="24" y="445">No label says everything about a product. Ask what it claims, and who checked it.</text><text class="wm" x="768" y="475" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
