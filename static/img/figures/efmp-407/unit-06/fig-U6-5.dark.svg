<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 548" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four questions an ethical consumer asks before buying</title><desc id="d">Flowchart. Starting from wanting to buy something, the first question is whether I need it; if not, borrow, repair or make do. If yes, ask who made it, how it was made and what happens after use. The last step is to decide on what I know and note what I do not know.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="548"/><text class="h" x="24" y="32">6.3 Four questions before buying</text><rect class="panel" x="250" y="50" width="280" height="40" rx="20"/><text class="row" x="390" y="75" text-anchor="middle">I want to buy something</text><line class="link" x1="390" y1="90" x2="390" y2="110" marker-end="url(#arrow)"/><polygon class="panel-a" points="390,112 520,152 390,192 260,152"/><text class="row" x="390" y="157" text-anchor="middle">1. Do I need it?</text><line class="link" x1="260" y1="152" x2="214" y2="152" marker-end="url(#arrow)"/><text class="row" x="238" y="143" text-anchor="middle">no</text><rect class="plain" x="24" y="126" width="188" height="52" rx="6"/><text class="ink" x="118" y="148" text-anchor="middle">Borrow, repair</text><text class="ink" x="118" y="165" text-anchor="middle">or make do</text><line class="link" x1="390" y1="192" x2="390" y2="216" marker-end="url(#arrow)"/><text class="row" x="420" y="210" text-anchor="middle">yes</text><rect class="plain" x="190" y="218" width="400" height="56" rx="6"/><text class="row" x="390" y="242" text-anchor="middle">2. Who made it?</text><text class="small" x="390" y="262" text-anchor="middle">Is there a named maker?</text><line class="link" x1="390" y1="274" x2="390" y2="296" marker-end="url(#arrow)"/><rect class="plain" x="190" y="298" width="400" height="56" rx="6"/><text class="row" x="390" y="322" text-anchor="middle">3. How was it made?</text><text class="small" x="390" y="342" text-anchor="middle">Materials, energy, workers: what is claimed?</text><line class="link" x1="390" y1="354" x2="390" y2="376" marker-end="url(#arrow)"/><rect class="plain" x="190" y="378" width="400" height="56" rx="6"/><text class="row" x="390" y="402" text-anchor="middle">4. What happens after use?</text><text class="small" x="390" y="422" text-anchor="middle">Reuse, repair, recycle, or the canal?</text><line class="link" x1="390" y1="434" x2="390" y2="456" marker-end="url(#arrow)"/><rect class="panel-b" x="190" y="458" width="400" height="52" rx="6"/><text class="row" x="390" y="480" text-anchor="middle">Decide on what I know,</text><text class="row" x="390" y="497" text-anchor="middle">and note what I do not know</text><text class="wm" x="768" y="538" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
