<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 305" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Real CSR effort and greenwashing compared</title><desc id="d">Table comparing a real CSR effort with greenwashing. On evidence, real effort gives figures and checks while greenwashing uses broad words with no proof. On scale, real effort is large beside what the business does while greenwashing is one small act. On who benefits, real effort reaches workers, neighbours and the environment while greenwashing mainly serves the company's image.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="305"/><text class="h" x="24" y="32">6.2 Real effort or greenwashing?</text><rect class="panel" x="24" y="54" width="732" height="40"/><text class="h" x="32" y="78">Test</text><text class="h" x="164" y="78">Real CSR effort</text><text class="h" x="464" y="78">Greenwashing</text><rect class="plain" x="24" y="94" width="132" height="56"/><text class="row" x="32" y="117">Evidence</text><rect class="plain" x="156" y="94" width="300" height="56"/><text class="ink" x="164" y="117">Figures, reports and checks that</text><text class="ink" x="164" y="134">others can look at</text><rect class="plain" x="456" y="94" width="300" height="56"/><text class="ink" x="464" y="117">Broad words such as "eco-friendly",</text><text class="ink" x="464" y="134">with no proof</text><rect class="plain" x="24" y="150" width="132" height="39"/><text class="row" x="32" y="173">Scale</text><rect class="plain" x="156" y="150" width="300" height="39"/><text class="ink" x="164" y="173">Large beside what the business does</text><rect class="plain" x="456" y="150" width="300" height="39"/><text class="ink" x="464" y="173">One small act beside a large effect</text><rect class="plain" x="24" y="189" width="132" height="56"/><text class="row" x="32" y="212">Who benefits</text><rect class="plain" x="156" y="189" width="300" height="56"/><text class="ink" x="164" y="212">Workers, neighbours and the</text><text class="ink" x="164" y="229">environment, as well as the company</text><rect class="plain" x="456" y="189" width="300" height="56"/><text class="ink" x="464" y="212">Mainly the company's image</text><text class="small" x="24" y="265">Compare the claim, not the people. A judgement can change when new evidence appears.</text><text class="wm" x="768" y="295" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
