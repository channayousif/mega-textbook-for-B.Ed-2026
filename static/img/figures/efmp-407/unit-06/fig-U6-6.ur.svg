<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 727.5" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قابلِ جانچ لیبل، ان کے دعوے اور بھروسے کی حد</title><desc id="d">پانچ لیبلوں اور نشانیوں کا جدول، جس میں ہر ایک کا دعویٰ، جانچ کرنے والا اور بھروسے کی حد ہے۔ پاکستان انرجی لیبل توانائی پر مضبوط ہے، PS نشان اپنے معیار کے لیے معتبر ہے، حلال نشان اپنے سوال پر سنجیدہ یقین دہانی ہے، فیئرٹریڈ نشان صرف تصدیق شدہ مصنوعات پر لاگو ہے، اور ماحول دوست جیسے الفاظ ثبوت ملنے تک کمزور ہیں۔ کوئی لیبل مصنوعات کے بارے میں سب کچھ نہیں بتاتا۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="727.5"/><text class="h" x="756" y="48" text-anchor="end">6.3 لیبل کا دعویٰ اور جانچ کنندہ</text><rect class="panel" x="24" y="81" width="732" height="60"/><text class="h" x="748" y="117" text-anchor="end">لیبل یا نشان</text><text class="h" x="590" y="117" text-anchor="end">دعویٰ کیا ہے</text><text class="h" x="412" y="117" text-anchor="end">جانچ کنندہ</text><text class="h" x="234" y="117" text-anchor="end">بھروسے کی حد</text><rect class="plain" x="598" y="141" width="158" height="109.5"/><text class="row" x="748" y="175.5" text-anchor="end">پنکھے پر پاکستان</text><text class="row" x="748" y="201" text-anchor="end">انرجی لیبل</text><rect class="plain" x="420" y="141" width="178" height="109.5"/><text class="ink" x="590" y="175.5" text-anchor="end">توانائی کا استعمال،</text><text class="ink" x="590" y="201" text-anchor="end">1 سے 5 ستارے</text><rect class="plain" x="242" y="141" width="178" height="109.5"/><text class="ink" x="412" y="175.5" text-anchor="end">NEECA جانچے ماڈل</text><text class="ink" x="412" y="201" text-anchor="end">درج کرتا ہے؛ تصدیق</text><text class="ink" x="412" y="226.5" text-anchor="end">کے لیے QR کوڈ</text><rect class="plain" x="24" y="141" width="218" height="109.5"/><text class="ink" x="234" y="175.5" text-anchor="end">توانائی پر مضبوط؛ کارکنوں</text><text class="ink" x="234" y="201" text-anchor="end">پر خاموش</text><rect class="plain" x="598" y="250.5" width="158" height="84"/><text class="row" x="748" y="285" text-anchor="end">PS نشان</text><rect class="plain" x="420" y="250.5" width="178" height="84"/><text class="ink" x="590" y="285" text-anchor="end">پاکستانی معیار</text><text class="ink" x="590" y="310.5" text-anchor="end">پورا کرنا</text><rect class="plain" x="242" y="250.5" width="178" height="84"/><text class="ink" x="412" y="285" text-anchor="end">PSQCA</text><rect class="plain" x="24" y="250.5" width="218" height="84"/><text class="ink" x="234" y="285" text-anchor="end">اسی معیار کے لیے معتبر؛</text><text class="ink" x="234" y="310.5" text-anchor="end">کارکنوں پر خاموش</text><rect class="plain" x="598" y="334.5" width="158" height="109.5"/><text class="row" x="748" y="369" text-anchor="end">حلال نشان</text><rect class="plain" x="420" y="334.5" width="178" height="109.5"/><text class="ink" x="590" y="369" text-anchor="end">پاکستان حلال</text><text class="ink" x="590" y="394.5" text-anchor="end">معیار کی</text><text class="ink" x="590" y="420" text-anchor="end">پابندی</text><rect class="plain" x="242" y="334.5" width="178" height="109.5"/><text class="ink" x="412" y="369" text-anchor="end">منظور شدہ</text><text class="ink" x="412" y="394.5" text-anchor="end">تصدیقی ادارہ</text><rect class="plain" x="24" y="334.5" width="218" height="109.5"/><text class="ink" x="234" y="369" text-anchor="end">اپنے سوال پر سنجیدہ؛</text><text class="ink" x="234" y="394.5" text-anchor="end">اجرت یا پیکنگ سے</text><text class="ink" x="234" y="420" text-anchor="end">متعلق نہیں</text><rect class="plain" x="598" y="444" width="158" height="84"/><text class="row" x="748" y="478.5" text-anchor="end">فیئرٹریڈ نشان</text><rect class="plain" x="420" y="444" width="178" height="84"/><text class="ink" x="590" y="478.5" text-anchor="end">پیدا کنندگان کی کم از کم</text><text class="ink" x="590" y="504" text-anchor="end">قیمت اور اضافی رقم</text><rect class="plain" x="242" y="444" width="178" height="84"/><text class="ink" x="412" y="478.5" text-anchor="end">فیئرٹریڈ</text><text class="ink" x="412" y="504" text-anchor="end">تصدیق</text><rect class="plain" x="24" y="444" width="218" height="84"/><text class="ink" x="234" y="478.5" text-anchor="end">صرف تصدیق شدہ</text><text class="ink" x="234" y="504" text-anchor="end">مصنوعات کا احاطہ</text><rect class="plain" x="598" y="528" width="158" height="109.5"/><text class="row" x="748" y="562.5" text-anchor="end">«ماحول دوست» یا</text><text class="row" x="748" y="588" text-anchor="end">«قدرتی» جیسے</text><text class="row" x="748" y="613.5" text-anchor="end">الفاظ</text><rect class="plain" x="420" y="528" width="178" height="109.5"/><text class="ink" x="590" y="562.5" text-anchor="end">واضح مطلب نہیں</text><rect class="plain" x="242" y="528" width="178" height="109.5"/><text class="ink" x="412" y="562.5" text-anchor="end">کوئی نام نہیں</text><rect class="plain" x="24" y="528" width="218" height="109.5"/><text class="ink" x="234" y="562.5" text-anchor="end">ثبوت ملنے تک</text><text class="ink" x="234" y="588" text-anchor="end">کمزور</text><text class="small" x="756" y="667.5" text-anchor="end">کوئی لیبل مصنوعات کے بارے میں سب نہیں بتاتا۔ پوچھیں: دعویٰ کیا ہے اور کس نے جانچا؟</text><text class="wm" x="12" y="712.5" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
