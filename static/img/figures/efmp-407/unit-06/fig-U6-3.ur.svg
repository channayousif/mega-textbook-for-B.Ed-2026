<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 637.5" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کارپوریٹ سماجی ذمہ داری اور متعلقہ چار گروہ</title><desc id="d">تصوری نقشے کے مرکز میں کارپوریٹ سماجی ذمہ داری ہے، جس سے تیر کارکنوں، مقامی آبادی، ماحول اور گاہکوں کو جوڑتے ہیں۔ ہر ایک کے ساتھ کمپنی کی ذمہ داری لکھی ہے۔ نوٹ بتاتا ہے کہ عطیہ اس سوال کا صرف ایک حصہ ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="637.5"/><text class="h" x="756" y="48" text-anchor="end">6.2 کمپنی کا کام کس پر اثر ڈالتا ہے</text><rect class="panel-a" x="270" y="255" width="240" height="126" rx="10"/><text class="row" x="390" y="295.5" text-anchor="middle">کارپوریٹ سماجی</text><text class="row" x="390" y="321" text-anchor="middle">ذمہ داری:</text><text class="small" x="390" y="352.5" text-anchor="middle">کاروبار دوسروں پر کیسے اثر ڈالتا ہے</text><rect class="panel" x="524" y="81" width="232" height="138" rx="6"/><text class="h" x="640" y="117" text-anchor="middle">کارکن</text><text class="ink" x="640" y="148.5" text-anchor="middle">محفوظ حالات، منصفانہ اجرت و</text><text class="ink" x="640" y="174" text-anchor="middle">برتاؤ، مستقل کام</text><rect class="panel" x="24" y="81" width="232" height="138" rx="6"/><text class="h" x="140" y="117" text-anchor="middle">مقامی آبادی</text><text class="ink" x="140" y="148.5" text-anchor="middle">شور، ٹریفک، پانی</text><text class="ink" x="140" y="174" text-anchor="middle">اور مقامی روزگار</text><rect class="panel" x="524" y="414" width="232" height="138" rx="6"/><text class="h" x="640" y="450" text-anchor="middle">ماحول</text><text class="ink" x="640" y="481.5" text-anchor="middle">ہوا، پانی، زمین اور استعمال</text><text class="ink" x="640" y="507" text-anchor="middle">یا آلودہ ہونے والے وسائل</text><rect class="panel" x="24" y="414" width="232" height="138" rx="6"/><text class="h" x="140" y="450" text-anchor="middle">گاہک</text><text class="ink" x="140" y="481.5" text-anchor="middle">محفوظ مصنوعات اور</text><text class="ink" x="140" y="507" text-anchor="middle">سچی معلومات</text><line class="link" x1="480" y1="255" x2="522" y2="222" marker-end="url(#arrow)"/><line class="link" x1="300" y1="255" x2="258" y2="222" marker-end="url(#arrow)"/><line class="link" x1="480" y1="381" x2="522" y2="414" marker-end="url(#arrow)"/><line class="link" x1="300" y1="381" x2="258" y2="414" marker-end="url(#arrow)"/><text class="row" x="390" y="585" text-anchor="middle">عطیہ اس سوال کا صرف ایک حصہ ہے۔</text><text class="wm" x="12" y="622.5" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
