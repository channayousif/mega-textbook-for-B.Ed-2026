<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 425" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Linear economy compared with a circular, green economy</title><desc id="d">Two-panel diagram. On the left, a linear economy runs in a straight line from take to make to dispose, ending in waste. On the right, a circular, green economy is a loop of reduce, reuse, recycle and regenerate, where materials stay in use and nature recovers. A note adds that a green economy must also be fair to people.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="425"/><text class="h" x="24" y="32">6.1 From a line to a circle</text><rect class="panel-b" x="24" y="50" width="340" height="350" rx="8"/><text class="h" x="194" y="78" text-anchor="middle">Linear economy</text><rect class="plain" x="124" y="98" width="140" height="44" rx="6"/><text class="row" x="194" y="125" text-anchor="middle">take</text><line class="link" x1="194" y1="142" x2="194" y2="168" marker-end="url(#arrow)"/><rect class="plain" x="124" y="170" width="140" height="44" rx="6"/><text class="row" x="194" y="197" text-anchor="middle">make</text><line class="link" x1="194" y1="214" x2="194" y2="240" marker-end="url(#arrow)"/><rect class="plain" x="124" y="242" width="140" height="44" rx="6"/><text class="row" x="194" y="269" text-anchor="middle">dispose</text><line class="link" x1="194" y1="286" x2="194" y2="312" marker-end="url(#arrow)"/><rect class="panel" x="124" y="314" width="140" height="44" rx="6"/><text class="row" x="194" y="341" text-anchor="middle">waste</text><text class="small" x="194" y="384" text-anchor="middle">materials end up thrown away</text><rect class="panel-a" x="392" y="50" width="364" height="350" rx="8"/><text class="h" x="574" y="78" text-anchor="middle">Circular, green economy</text><rect class="plain" x="504" y="94" width="140" height="40" rx="6"/><text class="row" x="574" y="119" text-anchor="middle">reduce</text><rect class="plain" x="636" y="184" width="108" height="40" rx="6"/><text class="row" x="690" y="209" text-anchor="middle">reuse</text><rect class="plain" x="504" y="274" width="140" height="40" rx="6"/><text class="row" x="574" y="299" text-anchor="middle">recycle</text><rect class="plain" x="404" y="184" width="108" height="40" rx="6"/><text class="row" x="458" y="209" text-anchor="middle">regenerate</text><line class="link" x1="644" y1="124" x2="690" y2="182" marker-end="url(#arrow)"/><line class="link" x1="690" y1="224" x2="644" y2="284" marker-end="url(#arrow)"/><line class="link" x1="504" y1="284" x2="458" y2="226" marker-end="url(#arrow)"/><line class="link" x1="458" y1="182" x2="504" y2="124" marker-end="url(#arrow)"/><text class="small" x="574" y="190" text-anchor="middle">materials</text><text class="small" x="574" y="206" text-anchor="middle">stay in use;</text><text class="small" x="574" y="222" text-anchor="middle">nature recovers</text><text class="row" x="574" y="348" text-anchor="middle">A green economy must also</text><text class="row" x="574" y="365" text-anchor="middle">be fair to people.</text><text class="wm" x="768" y="415" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
