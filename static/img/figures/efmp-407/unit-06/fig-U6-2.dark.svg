<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 454" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Everyday household choices, alternatives and their cost</title><desc id="d">Table of five household choices with a more sustainable alternative and its cost. A cloth bag has a small first cost, a fan with a higher star rating costs more at first and lowers bills, refilling a bottle costs less if safe water is at hand, repair usually costs less than buying new, and planning food saves money at once.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="454"/><text class="h" x="24" y="32">6.1 What the more sustainable choice costs</text><rect class="panel" x="24" y="54" width="732" height="60"/><text class="h" x="32" y="78">Everyday choice in a</text><text class="h" x="32" y="98">Pakistani household</text><text class="h" x="302" y="78">More sustainable</text><text class="h" x="302" y="98">alternative</text><text class="h" x="542" y="78">Cost</text><rect class="plain" x="24" y="114" width="270" height="56"/><text class="row" x="32" y="137">New polythene bag on each trip</text><rect class="plain" x="294" y="114" width="240" height="56"/><text class="ink" x="302" y="137">A cloth bag used again and</text><text class="ink" x="302" y="154">again</text><rect class="plain" x="534" y="114" width="222" height="56"/><text class="ink" x="542" y="137">Small first cost, then</text><text class="ink" x="542" y="154">nothing</text><rect class="plain" x="24" y="170" width="270" height="56"/><text class="row" x="32" y="193">An old, inefficient ceiling</text><text class="row" x="32" y="210">fan</text><rect class="plain" x="294" y="170" width="240" height="56"/><text class="ink" x="302" y="193">A fan with a higher star</text><text class="ink" x="302" y="210">rating</text><rect class="plain" x="534" y="170" width="222" height="56"/><text class="ink" x="542" y="193">Higher first price, lower</text><text class="ink" x="542" y="210">bills</text><rect class="plain" x="24" y="226" width="270" height="56"/><text class="row" x="32" y="249">Bottled water when away from</text><text class="row" x="32" y="266">home</text><rect class="plain" x="294" y="226" width="240" height="56"/><text class="ink" x="302" y="249">Refilling a bottle from a</text><text class="ink" x="302" y="266">safe source</text><rect class="plain" x="534" y="226" width="222" height="56"/><text class="ink" x="542" y="249">Lower, if safe water is at</text><text class="ink" x="542" y="266">hand</text><rect class="plain" x="24" y="282" width="270" height="56"/><text class="row" x="32" y="305">Throwing away a broken bag or</text><text class="row" x="32" y="322">pressure cooker</text><rect class="plain" x="294" y="282" width="240" height="56"/><text class="ink" x="302" y="305">Repair at a local shop</text><rect class="plain" x="534" y="282" width="222" height="56"/><text class="ink" x="542" y="305">Usually lower than buying</text><text class="ink" x="542" y="322">new</text><rect class="plain" x="24" y="338" width="270" height="56"/><text class="row" x="32" y="361">Cooking more food than is</text><text class="row" x="32" y="378">eaten</text><rect class="plain" x="294" y="338" width="240" height="56"/><text class="ink" x="302" y="361">Planning amounts and using</text><text class="ink" x="302" y="378">leftovers</text><rect class="plain" x="534" y="338" width="222" height="56"/><text class="ink" x="542" y="361">Saves money at once</text><text class="small" x="24" y="414">A guide only: check prices in your own bazaar. A later saving still needs money at the start.</text><text class="wm" x="768" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
