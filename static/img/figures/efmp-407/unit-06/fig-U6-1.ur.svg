<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 637.5" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خطی اور دائری، سبز معیشت کا موازنہ</title><desc id="d">دو حصوں کا خاکہ۔ دائیں جانب خطی معیشت میں لینا، بنانا اور پھینکنا سیدھی ترتیب میں ہیں جس کا انجام فضلہ ہے۔ بائیں جانب دائری، سبز معیشت میں کم استعمال، دوبارہ استعمال، باز یافت اور بحالی ایک چکر بناتے ہیں جس میں مواد استعمال میں رہتا ہے اور قدرت بحال ہوتی ہے۔ نوٹ واضح کرتا ہے کہ معیشتِ سبز کو لوگوں کے لیے منصفانہ بھی ہونا چاہیے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="637.5"/><text class="h" x="756" y="48" text-anchor="end">6.1 لکیر سے دائرے کی طرف</text><rect class="panel-b" x="416" y="75" width="340" height="525" rx="8"/><text class="h" x="586" y="117" text-anchor="middle">خطی معیشت</text><rect class="plain" x="516" y="147" width="140" height="66" rx="6"/><text class="row" x="586" y="187.5" text-anchor="middle">لینا</text><line class="link" x1="586" y1="213" x2="586" y2="252" marker-end="url(#arrow)"/><rect class="plain" x="516" y="255" width="140" height="66" rx="6"/><text class="row" x="586" y="295.5" text-anchor="middle">بنانا</text><line class="link" x1="586" y1="321" x2="586" y2="360" marker-end="url(#arrow)"/><rect class="plain" x="516" y="363" width="140" height="66" rx="6"/><text class="row" x="586" y="403.5" text-anchor="middle">پھینکنا</text><line class="link" x1="586" y1="429" x2="586" y2="468" marker-end="url(#arrow)"/><rect class="panel" x="516" y="471" width="140" height="66" rx="6"/><text class="row" x="586" y="511.5" text-anchor="middle">فضلہ</text><text class="small" x="586" y="576" text-anchor="middle">مواد آخر پھینک دیا جاتا ہے</text><rect class="panel-a" x="24" y="75" width="364" height="525" rx="8"/><text class="h" x="206" y="117" text-anchor="middle">دائری، سبز معیشت</text><rect class="plain" x="136" y="141" width="140" height="60" rx="6"/><text class="row" x="206" y="178.5" text-anchor="middle">کم استعمال</text><rect class="plain" x="36" y="276" width="108" height="60" rx="6"/><text class="row" x="90" y="313.5" text-anchor="middle">دوبارہ استعمال</text><rect class="plain" x="136" y="411" width="140" height="60" rx="6"/><text class="row" x="206" y="448.5" text-anchor="middle">باز یافت</text><rect class="plain" x="268" y="276" width="108" height="60" rx="6"/><text class="row" x="322" y="313.5" text-anchor="middle">بحالی</text><line class="link" x1="136" y1="186" x2="90" y2="273" marker-end="url(#arrow)"/><line class="link" x1="90" y1="336" x2="136" y2="426" marker-end="url(#arrow)"/><line class="link" x1="276" y1="426" x2="322" y2="339" marker-end="url(#arrow)"/><line class="link" x1="322" y1="273" x2="276" y2="186" marker-end="url(#arrow)"/><text class="small" x="206" y="285" text-anchor="middle">مواد</text><text class="small" x="206" y="309" text-anchor="middle">استعمال میں رہتا ہے؛</text><text class="small" x="206" y="333" text-anchor="middle">قدرت بحال ہوتی ہے</text><text class="row" x="206" y="522" text-anchor="middle">معیشتِ سبز کو لوگوں کے لیے</text><text class="row" x="206" y="547.5" text-anchor="middle">منصفانہ بھی ہونا چاہیے۔</text><text class="wm" x="12" y="622.5" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
