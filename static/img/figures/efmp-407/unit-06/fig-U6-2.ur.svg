<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 681" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">روزمرہ گھریلو انتخاب، متبادل اور لاگت</title><desc id="d">پانچ گھریلو انتخاب، ان کے زیادہ پائیدار متبادل اور لاگت کا جدول۔ کپڑے کے تھیلے کی ابتدائی لاگت تھوڑی ہے، زیادہ ستاروں والا پنکھا شروع میں مہنگا ہے مگر بل کم کرتا ہے، محفوظ پانی دستیاب ہو تو بوتل دوبارہ بھرنا کم خرچ ہے، مرمت عموماً نئی چیز خریدنے سے سستی ہے اور کھانے کی منصوبہ بندی فوراً پیسے بچاتی ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="681"/><text class="h" x="756" y="48" text-anchor="end">6.1 زیادہ پائیدار انتخاب کی لاگت</text><rect class="panel" x="24" y="81" width="732" height="90"/><text class="h" x="748" y="117" text-anchor="end">پاکستانی گھرانے میں</text><text class="h" x="748" y="147" text-anchor="end">روزمرہ انتخاب</text><text class="h" x="478" y="117" text-anchor="end">زیادہ پائیدار</text><text class="h" x="478" y="147" text-anchor="end">متبادل</text><text class="h" x="238" y="117" text-anchor="end">لاگت</text><rect class="plain" x="486" y="171" width="270" height="84"/><text class="row" x="748" y="205.5" text-anchor="end">ہر بار نئی پولی تھین تھیلی</text><rect class="plain" x="246" y="171" width="240" height="84"/><text class="ink" x="478" y="205.5" text-anchor="end">بار بار استعمال ہونے والا</text><text class="ink" x="478" y="231" text-anchor="end">کپڑے کا تھیلا</text><rect class="plain" x="24" y="171" width="222" height="84"/><text class="ink" x="238" y="205.5" text-anchor="end">تھوڑی ابتدائی لاگت، پھر</text><text class="ink" x="238" y="231" text-anchor="end">کوئی خرچ نہیں</text><rect class="plain" x="486" y="255" width="270" height="84"/><text class="row" x="748" y="289.5" text-anchor="end">پرانا، غیر مؤثر چھت کا</text><text class="row" x="748" y="315" text-anchor="end">پنکھا</text><rect class="plain" x="246" y="255" width="240" height="84"/><text class="ink" x="478" y="289.5" text-anchor="end">زیادہ ستاروں کی درجہ بندی</text><text class="ink" x="478" y="315" text-anchor="end">والا پنکھا</text><rect class="plain" x="24" y="255" width="222" height="84"/><text class="ink" x="238" y="289.5" text-anchor="end">ابتدائی قیمت زیادہ،</text><text class="ink" x="238" y="315" text-anchor="end">بل کم</text><rect class="plain" x="486" y="339" width="270" height="84"/><text class="row" x="748" y="373.5" text-anchor="end">گھر سے باہر بوتل بند</text><text class="row" x="748" y="399" text-anchor="end">پانی</text><rect class="plain" x="246" y="339" width="240" height="84"/><text class="ink" x="478" y="373.5" text-anchor="end">محفوظ ذریعے سے بوتل</text><text class="ink" x="478" y="399" text-anchor="end">دوبارہ بھرنا</text><rect class="plain" x="24" y="339" width="222" height="84"/><text class="ink" x="238" y="373.5" text-anchor="end">محفوظ پانی دستیاب ہو</text><text class="ink" x="238" y="399" text-anchor="end">تو کم</text><rect class="plain" x="486" y="423" width="270" height="84"/><text class="row" x="748" y="457.5" text-anchor="end">ٹوٹا تھیلا یا پریشر ککر</text><text class="row" x="748" y="483" text-anchor="end">پھینک دینا</text><rect class="plain" x="246" y="423" width="240" height="84"/><text class="ink" x="478" y="457.5" text-anchor="end">مقامی دکان پر مرمت</text><rect class="plain" x="24" y="423" width="222" height="84"/><text class="ink" x="238" y="457.5" text-anchor="end">عموماً نیا خریدنے سے</text><text class="ink" x="238" y="483" text-anchor="end">کم</text><rect class="plain" x="486" y="507" width="270" height="84"/><text class="row" x="748" y="541.5" text-anchor="end">کھائی جانے والی مقدار سے</text><text class="row" x="748" y="567" text-anchor="end">زیادہ کھانا پکانا</text><rect class="plain" x="246" y="507" width="240" height="84"/><text class="ink" x="478" y="541.5" text-anchor="end">مقدار کی منصوبہ بندی اور</text><text class="ink" x="478" y="567" text-anchor="end">بچا کھانا استعمال کرنا</text><rect class="plain" x="24" y="507" width="222" height="84"/><text class="ink" x="238" y="541.5" text-anchor="end">فوراً پیسے بچتے ہیں</text><text class="small" x="756" y="621" text-anchor="end">صرف رہنما: اپنے بازار کی قیمتیں جانچیں۔ بعد کی بچت کے لیے بھی شروع میں پیسے چاہییں۔</text><text class="wm" x="12" y="666" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
