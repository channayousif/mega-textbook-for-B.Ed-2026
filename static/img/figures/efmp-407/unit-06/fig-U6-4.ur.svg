<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 457.5" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حقیقی کارپوریٹ سماجی ذمہ داری اور گرین واشنگ کا موازنہ</title><desc id="d">حقیقی کارپوریٹ سماجی ذمہ داری کی کوشش اور گرین واشنگ کا تقابلی جدول۔ ثبوت میں حقیقی کوشش اعداد اور جانچ دیتی ہے جبکہ گرین واشنگ بغیر ثبوت کے وسیع الفاظ استعمال کرتی ہے۔ پیمانے میں حقیقی کوشش کاروبار کے اثرات کے مقابلے میں بڑی ہوتی ہے جبکہ گرین واشنگ ایک چھوٹا عمل ہے۔ فائدے میں حقیقی کوشش کارکنوں، پڑوسیوں اور ماحول تک پہنچتی ہے جبکہ گرین واشنگ زیادہ تر کمپنی کی ساکھ سنوارتی ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 8 4; } .link { fill: none; stroke: var(--ink); stroke-width: 2; } .dash { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="457.5"/><text class="h" x="756" y="48" text-anchor="end">6.2 حقیقی کوشش یا گرین واشنگ؟</text><rect class="panel" x="24" y="81" width="732" height="60"/><text class="h" x="748" y="117" text-anchor="end">کسوٹی</text><text class="h" x="616" y="117" text-anchor="end">حقیقی CSR کوشش</text><text class="h" x="316" y="117" text-anchor="end">گرین واشنگ</text><rect class="plain" x="624" y="141" width="132" height="84"/><text class="row" x="748" y="175.5" text-anchor="end">ثبوت</text><rect class="plain" x="324" y="141" width="300" height="84"/><text class="ink" x="616" y="175.5" text-anchor="end">اعداد، رپورٹیں اور جانچ جنہیں</text><text class="ink" x="616" y="201" text-anchor="end">دوسرے دیکھ سکیں</text><rect class="plain" x="24" y="141" width="300" height="84"/><text class="ink" x="316" y="175.5" text-anchor="end">«ماحول دوست» جیسے وسیع الفاظ،</text><text class="ink" x="316" y="201" text-anchor="end">بغیر ثبوت</text><rect class="plain" x="624" y="225" width="132" height="58.5"/><text class="row" x="748" y="259.5" text-anchor="end">پیمانہ</text><rect class="plain" x="324" y="225" width="300" height="58.5"/><text class="ink" x="616" y="259.5" text-anchor="end">کاروبار کے اثرات کے مقابلے میں بڑی</text><rect class="plain" x="24" y="225" width="300" height="58.5"/><text class="ink" x="316" y="259.5" text-anchor="end">بڑے اثر کے مقابلے میں ایک چھوٹا عمل</text><rect class="plain" x="624" y="283.5" width="132" height="84"/><text class="row" x="748" y="318" text-anchor="end">کس کو فائدہ</text><rect class="plain" x="324" y="283.5" width="300" height="84"/><text class="ink" x="616" y="318" text-anchor="end">کمپنی کے ساتھ کارکنوں، پڑوسیوں</text><text class="ink" x="616" y="343.5" text-anchor="end">اور ماحول کو بھی</text><rect class="plain" x="24" y="283.5" width="300" height="84"/><text class="ink" x="316" y="318" text-anchor="end">زیادہ تر کمپنی کی ساکھ کو</text><text class="small" x="756" y="397.5" text-anchor="end">لوگوں کے بجائے دعوے کو پرکھیں۔ نیا ثبوت سامنے آنے پر رائے بدل سکتی ہے۔</text><text class="wm" x="12" y="442.5" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
