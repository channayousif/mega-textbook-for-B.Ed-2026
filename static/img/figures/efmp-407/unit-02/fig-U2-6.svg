<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Village water supply: stock, flows and feedback</title><desc id="d">Water enters a village tank and leaves through use and leaks. A low level prompts a report and delayed adult delivery that restores the level, forming a balancing loop.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="630"/><text class="h" x="30" y="35" text-anchor="start">Village water supply: stock, flows and feedback</text><rect class="outer" x="25" y="65" width="730" height="445" rx="16"/><text class="small" x="45" y="93" text-anchor="start">Model boundary: tank, users and reporting response</text><rect class="panel" x="45" y="140" width="170" height="85" rx="10"/><text class="label" x="130" y="168" text-anchor="middle">Delivery</text><text class="body" x="130" y="193" text-anchor="middle">Inflow</text><rect class="panel" x="300" y="140" width="180" height="85" rx="10"/><text class="label" x="390" y="168" text-anchor="middle">Tank water</text><text class="body" x="390" y="193" text-anchor="middle">Stock</text><rect class="panel" x="565" y="140" width="170" height="85" rx="10"/><text class="label" x="650" y="168" text-anchor="middle">Use</text><text class="body" x="650" y="193" text-anchor="middle">Outflow</text><rect class="panel" x="300" y="295" width="180" height="75" rx="10"/><text class="label" x="390" y="323" text-anchor="middle">Leak</text><text class="body" x="390" y="348" text-anchor="middle">Outflow</text><line class="link" x1="215" y1="183" x2="300" y2="183" marker-end="url(#arrow)"/><line class="link" x1="480" y1="183" x2="565" y2="183" marker-end="url(#arrow)"/><line class="link" x1="390" y1="225" x2="390" y2="295" marker-end="url(#arrow)"/><rect class="panel" x="550" y="390" width="180" height="80" rx="10"/><text class="label" x="640" y="418" text-anchor="middle">Low-level report</text><text class="body" x="640" y="443" text-anchor="middle">Shortage noticed</text><rect class="panel" x="50" y="390" width="210" height="80" rx="10"/><text class="label" x="155" y="418" text-anchor="middle">Adult response</text><text class="body" x="155" y="443" text-anchor="middle">Arrange delivery</text><path class="link" d="M480,210 H520 V330 H640 V390" marker-end="url(#arrow)"/><line class="link" x1="550" y1="430" x2="260" y2="430" marker-end="url(#arrow)"/><path class="link" d="M125,390 V225" marker-end="url(#arrow)"/><text class="small" x="285" y="410" text-anchor="start">Response delay</text><text class="small" x="390" y="493" text-anchor="middle">Delivery raises the level, reducing the shortage.</text><text class="small" x="30" y="555" text-anchor="start">Fictional model, not a village survey or an engineering plan.</text><text class="small" x="30" y="577" text-anchor="start">Solid arrows trace flows and the reporting-response balancing loop.</text><text aria-hidden="true" class="wm" x="768" y="618" text-anchor="end">textbook.com.pk</text></svg>
