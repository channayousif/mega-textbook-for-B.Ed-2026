<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تبدیلی لانے والے سیکھنے کا سہارا</title><desc id="d">تدریسی چکر تجربے سے مفروضوں پر سوال، تامل اور بدلے عمل تک جاتا ہے، پھر نئے تجربے کی طرف لوٹتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z" /></marker></defs><rect class="bg" x="0.0" y="0" width="780" height="430" /><text class="h" x="750.0" y="35" text-anchor="end">تبدیلی لانے والے سیکھنے کا سہارا</text><rect class="panel" x="590.0" y="100" width="160" height="110" rx="10" /><text class="label" x="670.0" y="128" text-anchor="middle">تجربہ</text><text class="body" x="670.0" y="153" text-anchor="middle">الجھن دیکھیں</text><rect class="panel" x="405.0" y="100" width="160" height="110" rx="10" /><text class="label" x="485.0" y="128" text-anchor="middle">سوال کریں</text><text class="body" x="485.0" y="153" text-anchor="middle">کسی مفروضے پر</text><rect class="panel" x="220.0" y="100" width="160" height="110" rx="10" /><text class="label" x="300.0" y="128" text-anchor="middle">تامل کریں</text><text class="body" x="300.0" y="153" text-anchor="middle">شواہد لیں</text><rect class="panel" x="30.0" y="100" width="165" height="110" rx="10" /><text class="label" x="112.5" y="128" text-anchor="middle">مختلف عمل</text><text class="body" x="112.5" y="153" text-anchor="middle">آزمائیں اور جانچیں</text><line class="link" x1="590.0" y1="155" x2="565.0" y2="155" marker-end="url(#arrow)" /><line class="link" x1="405.0" y1="155" x2="380.0" y2="155" marker-end="url(#arrow)" /><line class="link" x1="220.0" y1="155" x2="195.0" y2="155" marker-end="url(#arrow)" /><path class="link" d="M668,210 V290 H110 V210" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><text class="body" x="390.0" y="275" text-anchor="middle">نیا تجربہ سوال دوبارہ کھول سکتا ہے</text><text class="small" x="750.0" y="355" text-anchor="end">مصنف کا بنایا چکر، یونیسکو (2024) کی بنیاد پر۔</text><text class="small" x="750.0" y="377" text-anchor="end">سیکھنے والا وجہ سے رائے بدل یا رکھ سکتا ہے؛ اتفاق کسوٹی نہیں۔</text><text aria-hidden="true" class="wm" x="12.0" y="418" text-anchor="start">textbook.com.pk</text></svg>
