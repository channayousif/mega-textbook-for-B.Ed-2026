<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One planning model, not a fixed hierarchy</title><desc id="d">One planning model places environmental learning inside wider ESD work with social and economic learning, while noting that EE also crosses these boundaries.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550"/><text class="h" x="30" y="35" text-anchor="start">One planning model, not a fixed hierarchy</text><ellipse class="panel" cx="390" cy="250" rx="345" ry="185"/><text class="h" x="390" y="106" text-anchor="middle">Wider ESD planning</text><ellipse class="panel" cx="230" cy="245" rx="150" ry="95"/><text class="label" x="230" y="215" text-anchor="middle">Environmental</text><text class="label" x="230" y="242" text-anchor="middle">learning / EE</text><text class="small" x="230" y="273" text-anchor="middle">Water, soil, living things</text><text class="label" x="545" y="210" text-anchor="middle">Social learning</text><text class="body" x="545" y="238" text-anchor="middle">Access and fairness</text><text class="label" x="545" y="295" text-anchor="middle">Economic learning</text><text class="body" x="545" y="323" text-anchor="middle">Costs and resources</text><text class="small" x="30" y="475" text-anchor="start">EE can also address society, values and decisions.</text><text class="small" x="30" y="497" text-anchor="start">The nested model is a teaching aid; boundaries are debated.</text><text aria-hidden="true" class="wm" x="768" y="538" text-anchor="end">textbook.com.pk</text></svg>
