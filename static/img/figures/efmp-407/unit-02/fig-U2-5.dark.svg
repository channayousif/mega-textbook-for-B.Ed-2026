<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A scaffold for transformative learning</title><desc id="d">A teaching cycle moves from experience to questioning assumptions, reflection and changed action, then returns to new experience.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="30" y="35" text-anchor="start">A scaffold for transformative learning</text><rect class="panel" x="30" y="100" width="160" height="110" rx="10"/><text class="label" x="110" y="128" text-anchor="middle">Experience</text><text class="body" x="110" y="153" text-anchor="middle">Notice a puzzle</text><rect class="panel" x="215" y="100" width="160" height="110" rx="10"/><text class="label" x="295" y="128" text-anchor="middle">Question</text><text class="body" x="295" y="153" text-anchor="middle">An assumption</text><rect class="panel" x="400" y="100" width="160" height="110" rx="10"/><text class="label" x="480" y="128" text-anchor="middle">Reflect</text><text class="body" x="480" y="153" text-anchor="middle">Use evidence</text><rect class="panel" x="585" y="100" width="165" height="110" rx="10"/><text class="label" x="667.5" y="128" text-anchor="middle">Act differently</text><text class="body" x="667.5" y="153" text-anchor="middle">Try and review</text><line class="link" x1="190" y1="155" x2="215" y2="155" marker-end="url(#arrow)"/><line class="link" x1="375" y1="155" x2="400" y2="155" marker-end="url(#arrow)"/><line class="link" x1="560" y1="155" x2="585" y2="155" marker-end="url(#arrow)"/><path class="link" d="M668,210 V290 H110 V210" marker-end="url(#arrow)"/><text class="body" x="390" y="275" text-anchor="middle">New experience can reopen the question</text><text class="small" x="30" y="355" text-anchor="start">Author-created cycle, informed by UNESCO (2024).</text><text class="small" x="30" y="377" text-anchor="start">A learner may revise or retain a view with reasons; agreement is not the test.</text><text aria-hidden="true" class="wm" x="768" y="418" text-anchor="end">textbook.com.pk</text></svg>
