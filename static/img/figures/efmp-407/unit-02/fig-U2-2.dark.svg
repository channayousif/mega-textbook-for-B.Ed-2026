<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Eight competencies in a water lesson</title><desc id="d">Eight sustainability competencies connect tracing water relationships, considering futures and values, planning, collaboration, questioning, reflection and combined problem-solving.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="630"/><text class="h" x="30" y="35" text-anchor="start">Eight competencies in a water lesson</text><rect class="panel" x="25" y="65" width="730" height="48" rx="10"/><text class="label" x="37" y="96" text-anchor="start">Competency</text><text class="label" x="312" y="96" text-anchor="start">Original classroom example</text><rect class="grid" x="25" y="113" width="730" height="48"/><text class="body" x="37" y="141" text-anchor="start">Systems thinking</text><text class="body" x="312" y="141" text-anchor="start">Trace inlet, level and overflow.</text><rect class="grid" x="25" y="161" width="730" height="48"/><text class="body" x="37" y="189" text-anchor="start">Anticipatory</text><text class="body" x="312" y="189" text-anchor="start">Compare dry-week and normal-week plans.</text><rect class="grid" x="25" y="209" width="730" height="48"/><text class="body" x="37" y="237" text-anchor="start">Normative</text><text class="body" x="312" y="237" text-anchor="start">Explain younger children's access needs.</text><rect class="grid" x="25" y="257" width="730" height="48"/><text class="body" x="37" y="285" text-anchor="start">Strategic</text><text class="body" x="312" y="285" text-anchor="start">Plan a report and a follow-up date.</text><rect class="grid" x="25" y="305" width="730" height="48"/><text class="body" x="37" y="333" text-anchor="start">Collaboration</text><text class="body" x="312" y="333" text-anchor="start">Revise after hearing another role.</text><rect class="grid" x="25" y="353" width="730" height="48"/><text class="body" x="37" y="381" text-anchor="start">Critical thinking</text><text class="body" x="312" y="381" text-anchor="start">Question a ban on washing.</text><rect class="grid" x="25" y="401" width="730" height="48"/><text class="body" x="37" y="429" text-anchor="start">Self-awareness</text><text class="body" x="312" y="429" text-anchor="start">Explain your first assumption.</text><rect class="grid" x="25" y="449" width="730" height="48"/><text class="body" x="37" y="477" text-anchor="start">Integrated problem-solving</text><text class="body" x="312" y="477" text-anchor="start">Combine evidence, fairness and action.</text><line class="grid" x1="300" y1="65" x2="300" y2="497"/><text class="small" x="30" y="555" text-anchor="start">Competency names: UNESCO (2017), p. 10. Examples: author-created.</text><text aria-hidden="true" class="wm" x="768" y="618" text-anchor="end">textbook.com.pk</text></svg>
