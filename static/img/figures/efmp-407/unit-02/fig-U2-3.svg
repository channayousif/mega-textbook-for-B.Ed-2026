<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">EE and ESD: differences of emphasis</title><desc id="d">EE begins with environmental relationships and protection while ESD explicitly connects environmental, social and economic choices, with inquiry and action shared by both.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><text class="h" x="30" y="35" text-anchor="start">EE and ESD: differences of emphasis</text><rect class="panel" x="25" y="65" width="730" height="48" rx="10"/><text class="label" x="37" y="96" text-anchor="start">Feature</text><text class="label" x="162" y="96" text-anchor="start">EE emphasis</text><text class="label" x="437" y="96" text-anchor="start">ESD emphasis</text><rect class="grid" x="25" y="113" width="730" height="48"/><text class="body" x="37" y="141" text-anchor="start">Focus</text><text class="body" x="162" y="141" text-anchor="start">Environment and people</text><text class="body" x="437" y="141" text-anchor="start">Linked sustainability concerns</text><rect class="grid" x="25" y="161" width="730" height="72"/><text class="body" x="37" y="189" text-anchor="start">Scope</text><text class="body" x="162" y="189" text-anchor="start">Human-environment</text><text class="body" x="162" y="213" text-anchor="start">relationships</text><text class="body" x="437" y="189" text-anchor="start">Environmental, social</text><text class="body" x="437" y="213" text-anchor="start">and economic connections</text><rect class="grid" x="25" y="233" width="730" height="72"/><text class="body" x="37" y="261" text-anchor="start">Aim</text><text class="body" x="162" y="261" text-anchor="start">Responsible environmental</text><text class="body" x="162" y="285" text-anchor="start">participation</text><text class="body" x="437" y="261" text-anchor="start">Informed choices about</text><text class="body" x="437" y="285" text-anchor="start">shared needs and futures</text><rect class="grid" x="25" y="305" width="730" height="72"/><text class="body" x="37" y="333" text-anchor="start">Activity</text><text class="body" x="162" y="333" text-anchor="start">Explain litter harm;</text><text class="body" x="162" y="357" text-anchor="start">investigate prevention</text><text class="body" x="437" y="333" text-anchor="start">Compare harm, cost and</text><text class="body" x="437" y="357" text-anchor="start">access before deciding</text><line class="grid" x1="150" y1="65" x2="150" y2="377"/><line class="grid" x1="425" y1="65" x2="425" y2="377"/><text class="small" x="30" y="455" text-anchor="start">Both can include inquiry, values, participation and action.</text><text class="small" x="30" y="477" text-anchor="start">Planning comparison informed by Maurer and Bogner (2019).</text><text aria-hidden="true" class="wm" x="768" y="518" text-anchor="end">textbook.com.pk</text></svg>
