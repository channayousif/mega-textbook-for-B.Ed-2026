<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three connected learning domains</title><desc id="d">ESD connects knowledge about water loss, concern for fair access and a safe action to report a leak.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="30" y="35" text-anchor="start">Three connected learning domains</text><rect class="panel" x="265" y="170" width="250" height="80" rx="10"/><text class="label" x="390" y="198" text-anchor="middle">ESD</text><text class="body" x="390" y="223" text-anchor="middle">Connected learning</text><rect class="panel" x="25" y="65" width="225" height="80" rx="10"/><text class="label" x="137.5" y="93" text-anchor="middle">Cognitive</text><text class="body" x="137.5" y="118" text-anchor="middle">Explain water loss</text><rect class="panel" x="530" y="65" width="225" height="80" rx="10"/><text class="label" x="642.5" y="93" text-anchor="middle">Socio-emotional</text><text class="body" x="642.5" y="118" text-anchor="middle">Consider fair access</text><rect class="panel" x="265" y="300" width="250" height="80" rx="10"/><text class="label" x="390" y="328" text-anchor="middle">Behavioural</text><text class="body" x="390" y="353" text-anchor="middle">Report a leak safely</text><line class="link" x1="250" y1="145" x2="300" y2="170" marker-end="url(#arrow)"/><line class="link" x1="530" y1="145" x2="480" y2="170" marker-end="url(#arrow)"/><line class="link" x1="390" y1="250" x2="390" y2="300" marker-end="url(#arrow)"/><text class="small" x="30" y="425" text-anchor="start">Author-created school-water example, based on UNESCO (2017).</text><text class="small" x="30" y="447" text-anchor="start">Each domain needs its own evidence of learning.</text><text aria-hidden="true" class="wm" x="768" y="488" text-anchor="end">textbook.com.pk</text></svg>
