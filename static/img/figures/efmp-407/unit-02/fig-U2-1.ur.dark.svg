<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سیکھنے کے تین مربوط شعبے</title><desc id="d">پائیدار ترقی کے لیے تعلیم پانی کے ضیاع کے علم، منصفانہ رسائی کے خیال اور رساؤ کی محفوظ اطلاع کے عمل کو جوڑتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z" /></marker></defs><rect class="bg" x="0.0" y="0" width="780" height="500" /><text class="h" x="750.0" y="35" text-anchor="end">سیکھنے کے تین مربوط شعبے</text><rect class="panel" x="265.0" y="170" width="250" height="80" rx="10" /><text class="label" x="390.0" y="198" text-anchor="middle">ESD</text><text class="body" x="390.0" y="223" text-anchor="middle">مربوط سیکھنا</text><rect class="panel" x="530.0" y="65" width="225" height="80" rx="10" /><text class="label" x="642.5" y="93" text-anchor="middle">ادراکی</text><text class="body" x="642.5" y="118" text-anchor="middle">پانی کا ضیاع سمجھائیں</text><rect class="panel" x="25.0" y="65" width="225" height="80" rx="10" /><text class="label" x="137.5" y="93" text-anchor="middle">معاشرتی و جذباتی</text><text class="body" x="137.5" y="118" text-anchor="middle">منصفانہ رسائی دیکھیں</text><rect class="panel" x="265.0" y="300" width="250" height="80" rx="10" /><text class="label" x="390.0" y="328" text-anchor="middle">عملی</text><text class="body" x="390.0" y="353" text-anchor="middle">رساؤ کی محفوظ اطلاع دیں</text><line class="link" x1="530.0" y1="145" x2="480.0" y2="170" marker-end="url(#arrow)" /><line class="link" x1="250.0" y1="145" x2="300.0" y2="170" marker-end="url(#arrow)" /><line class="link" x1="390.0" y1="250" x2="390.0" y2="300" marker-end="url(#arrow)" /><text class="small" x="750.0" y="425" text-anchor="end">مصنف کی اسکولی پانی کی مثال، بنیاد: یونیسکو (2017)۔</text><text class="small" x="750.0" y="447" text-anchor="end">ہر شعبے کو سیکھنے کے الگ شواہد چاہیے۔</text><text aria-hidden="true" class="wm" x="12.0" y="488" text-anchor="start">textbook.com.pk</text></svg>
