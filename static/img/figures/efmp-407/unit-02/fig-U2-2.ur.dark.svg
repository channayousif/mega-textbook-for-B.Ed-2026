<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانی کے سبق میں آٹھ صلاحیتیں</title><desc id="d">پائیداری کی آٹھ صلاحیتیں پانی کے تعلقات کا سراغ لگانے، مستقبل اور اقدار پر غور، منصوبہ بندی، تعاون، سوال، تامل اور مربوط مسئلہ حل کرنے کو جوڑتی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z" /></marker></defs><rect class="bg" x="0.0" y="0" width="780" height="630" /><text class="h" x="750.0" y="35" text-anchor="end">پانی کے سبق میں آٹھ صلاحیتیں</text><rect class="panel" x="25.0" y="65" width="730" height="48" rx="10" /><text class="label" x="743.0" y="96" text-anchor="end">صلاحیت</text><text class="label" x="468.0" y="96" text-anchor="end">مصنف کی جماعتی مثال</text><rect class="grid" x="25.0" y="113" width="730" height="48" /><text class="body" x="743.0" y="141" text-anchor="end">نظامی سوچ</text><text class="body" x="468.0" y="141" text-anchor="end">آمد، سطح اور بہنے کا سراغ لگائیں۔</text><rect class="grid" x="25.0" y="161" width="730" height="48" /><text class="body" x="743.0" y="189" text-anchor="end">پیش بینی</text><text class="body" x="468.0" y="189" text-anchor="end">خشک اور معمول کے ہفتے کے منصوبے ملائیں۔</text><rect class="grid" x="25.0" y="209" width="730" height="48" /><text class="body" x="743.0" y="237" text-anchor="end">اقدار پر مبنی سوچ</text><text class="body" x="468.0" y="237" text-anchor="end">چھوٹے بچوں کی رسائی کی ضرورت سمجھائیں۔</text><rect class="grid" x="25.0" y="257" width="730" height="48" /><text class="body" x="743.0" y="285" text-anchor="end">حکمت عملی کی سوچ</text><text class="body" x="468.0" y="285" text-anchor="end">رپورٹ اور بعد کی جانچ کی تاریخ طے کریں۔</text><rect class="grid" x="25.0" y="305" width="730" height="48" /><text class="body" x="743.0" y="333" text-anchor="end">تعاون</text><text class="body" x="468.0" y="333" text-anchor="end">دوسرا کردار سن کر ترمیم کریں۔</text><rect class="grid" x="25.0" y="353" width="730" height="48" /><text class="body" x="743.0" y="381" text-anchor="end">تنقیدی سوچ</text><text class="body" x="468.0" y="381" text-anchor="end">دھونے پر پابندی پر سوال کریں۔</text><rect class="grid" x="25.0" y="401" width="730" height="48" /><text class="body" x="743.0" y="429" text-anchor="end">خود آگاہی</text><text class="body" x="468.0" y="429" text-anchor="end">اپنا پہلا مفروضہ سمجھائیں۔</text><rect class="grid" x="25.0" y="449" width="730" height="48" /><text class="body" x="743.0" y="477" text-anchor="end">مربوط مسئلہ حل کرنا</text><text class="body" x="468.0" y="477" text-anchor="end">شواہد، انصاف اور عمل جوڑیں۔</text><line class="grid" x1="480.0" y1="65" x2="480.0" y2="497" /><text class="small" x="750.0" y="555" text-anchor="end">صلاحیتوں کے نام: یونیسکو (2017)، صفحہ 10۔ مثالیں: مصنف کی۔</text><text aria-hidden="true" class="wm" x="12.0" y="618" text-anchor="start">textbook.com.pk</text></svg>
