<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">EE اور ESD: زور کا فرق</title><desc id="d">ماحولیاتی تعلیم کا آغاز ماحولیاتی تعلقات اور تحفظ سے ہوتا ہے جبکہ پائیدار ترقی کے لیے تعلیم ماحولیاتی، معاشرتی اور معاشی انتخاب کو واضح طور پر جوڑتی ہے؛ تحقیق اور عمل دونوں میں مشترک ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z" /></marker></defs><rect class="bg" x="0.0" y="0" width="780" height="530" /><text class="h" x="750.0" y="35" text-anchor="end">EE اور ESD: زور کا فرق</text><rect class="panel" x="25.0" y="65" width="730" height="48" rx="10" /><text class="label" x="743.0" y="96" text-anchor="end">پہلو</text><text class="label" x="618.0" y="96" text-anchor="end">EE میں زور</text><text class="label" x="343.0" y="96" text-anchor="end">ESD میں زور</text><rect class="grid" x="25.0" y="113" width="730" height="48" /><text class="body" x="743.0" y="141" text-anchor="end">توجہ</text><text class="body" x="618.0" y="141" text-anchor="end">ماحول اور لوگ</text><text class="body" x="343.0" y="141" text-anchor="end">پائیداری کی مربوط فکریں</text><rect class="grid" x="25.0" y="161" width="730" height="72" /><text class="body" x="743.0" y="189" text-anchor="end">دائرہ</text><text class="body" x="618.0" y="189" text-anchor="end">انسان اور ماحول کے</text><text class="body" x="618.0" y="213" text-anchor="end">تعلقات</text><text class="body" x="343.0" y="189" text-anchor="end">ماحولیاتی، معاشرتی</text><text class="body" x="343.0" y="213" text-anchor="end">اور معاشی تعلقات</text><rect class="grid" x="25.0" y="233" width="730" height="72" /><text class="body" x="743.0" y="261" text-anchor="end">مقصد</text><text class="body" x="618.0" y="261" text-anchor="end">ذمہ دار ماحولیاتی</text><text class="body" x="618.0" y="285" text-anchor="end">شرکت</text><text class="body" x="343.0" y="261" text-anchor="end">مشترک ضرورت اور مستقبل</text><text class="body" x="343.0" y="285" text-anchor="end">پر باخبر انتخاب</text><rect class="grid" x="25.0" y="305" width="730" height="72" /><text class="body" x="743.0" y="333" text-anchor="end">سرگرمی</text><text class="body" x="618.0" y="333" text-anchor="end">کچرے کا نقصان سمجھائیں؛</text><text class="body" x="618.0" y="357" text-anchor="end">بچاؤ کی تحقیق کریں</text><text class="body" x="343.0" y="333" text-anchor="end">فیصلے سے پہلے نقصان،</text><text class="body" x="343.0" y="357" text-anchor="end">لاگت اور رسائی ملائیں</text><line class="grid" x1="630.0" y1="65" x2="630.0" y2="377" /><line class="grid" x1="355.0" y1="65" x2="355.0" y2="377" /><text class="small" x="750.0" y="455" text-anchor="end">دونوں میں تحقیق، اقدار، شرکت اور عمل شامل ہو سکتے ہیں۔</text><text class="small" x="750.0" y="477" text-anchor="end">منصوبہ بندی کا موازنہ: Maurer اور Bogner (2019) کی بنیاد پر۔</text><text aria-hidden="true" class="wm" x="12.0" y="518" text-anchor="start">textbook.com.pk</text></svg>
