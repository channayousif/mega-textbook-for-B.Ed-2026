<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">گاؤں کا پانی: ذخیرہ، بہاؤ اور باز اثر</title><desc id="d">پانی گاؤں کی ٹینکی میں آتا اور استعمال اور رساؤ سے نکلتا ہے۔ کم سطح اطلاع کا باعث بنتی ہے اور تاخیر سے بالغ کی فراہم کردہ رسد سطح بحال کرکے متوازن کرنے والا چکر بناتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.outer{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:8 5}.grid{fill:none;stroke:var(--ink);stroke-width:1}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.ah{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z" /></marker></defs><rect class="bg" x="0.0" y="0" width="780" height="630" /><text class="h" x="750.0" y="35" text-anchor="end">گاؤں کا پانی: ذخیرہ، بہاؤ اور باز اثر</text><rect class="outer" x="25.0" y="65" width="730" height="445" rx="16" /><text class="small" x="735.0" y="93" text-anchor="end">نمونے کی حد: ٹینکی، صارفین اور اطلاع کا جواب</text><rect class="panel" x="565.0" y="140" width="170" height="85" rx="10" /><text class="label" x="650.0" y="168" text-anchor="middle">فراہمی</text><text class="body" x="650.0" y="193" text-anchor="middle">اندر آنے والا بہاؤ</text><rect class="panel" x="300.0" y="140" width="180" height="85" rx="10" /><text class="label" x="390.0" y="168" text-anchor="middle">ٹینکی کا پانی</text><text class="body" x="390.0" y="193" text-anchor="middle">ذخیرہ</text><rect class="panel" x="45.0" y="140" width="170" height="85" rx="10" /><text class="label" x="130.0" y="168" text-anchor="middle">استعمال</text><text class="body" x="130.0" y="193" text-anchor="middle">باہر جانے والا بہاؤ</text><rect class="panel" x="300.0" y="295" width="180" height="75" rx="10" /><text class="label" x="390.0" y="323" text-anchor="middle">رساؤ</text><text class="body" x="390.0" y="348" text-anchor="middle">باہر جانے والا بہاؤ</text><line class="link" x1="565.0" y1="183" x2="480.0" y2="183" marker-end="url(#arrow)" /><line class="link" x1="300.0" y1="183" x2="215.0" y2="183" marker-end="url(#arrow)" /><line class="link" x1="390.0" y1="225" x2="390.0" y2="295" marker-end="url(#arrow)" /><rect class="panel" x="50.0" y="390" width="180" height="80" rx="10" /><text class="label" x="140.0" y="418" text-anchor="middle">کم سطح کی اطلاع</text><text class="body" x="140.0" y="443" text-anchor="middle">کمی نظر آئی</text><rect class="panel" x="520.0" y="390" width="210" height="80" rx="10" /><text class="label" x="625.0" y="418" text-anchor="middle">بالغ کا جواب</text><text class="body" x="625.0" y="443" text-anchor="middle">فراہمی کا بندوبست</text><path class="link" d="M480,210 H520 V330 H640 V390" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><line class="link" x1="230.0" y1="430" x2="520.0" y2="430" marker-end="url(#arrow)" /><path class="link" d="M125,390 V225" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><text class="small" x="495.0" y="410" text-anchor="end">جواب میں تاخیر</text><text class="small" x="390.0" y="493" text-anchor="middle">فراہمی سطح بڑھاتی اور کمی گھٹاتی ہے۔</text><text class="small" x="750.0" y="555" text-anchor="end">فرضی نمونہ، گاؤں کا سروے یا انجینئرنگ منصوبہ نہیں۔</text><text class="small" x="750.0" y="577" text-anchor="end">ٹھوس تیر بہاؤ اور اطلاع و جواب کا متوازن کرنے والا چکر دکھاتے ہیں۔</text><text aria-hidden="true" class="wm" x="12.0" y="618" text-anchor="start">textbook.com.pk</text></svg>
