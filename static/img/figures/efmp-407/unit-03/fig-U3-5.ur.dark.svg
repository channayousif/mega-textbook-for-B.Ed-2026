<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عالمی شہریت کی تعلیم: دائرہ کار اور مقامی و عالمی عمل</title><desc id="d">ایک تصوراتی نقشہ جو عالمی شہریت کی تعلیم کے ادراکی، سماجی و جذباتی اور کرداری دائرہ کار کو دکھاتا ہے جو مقامی برادری عمل اور عالمی مشغولیت کو جوڑتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0">عالمی شہریت کی تعلیم: دائرہ کار اور مقامی و عالمی عمل</tspan></text><line class="link" x1="500" y1="180" x2="620" y2="150" marker-end="url(#arrow)"/><line class="link" x1="280" y1="180" x2="160" y2="150" marker-end="url(#arrow)"/><line class="link" x1="390" y1="230" x2="390" y2="280" marker-end="url(#arrow)"/><line class="link" x1="560" y1="410" x2="220" y2="410" marker-end="url(#arrow)"/><line class="link" x1="220" y1="420" x2="560" y2="420" marker-end="url(#arrow)"/><rect class="accent" x="260" y="145" width="260" height="85" rx="8"/><text class="label" x="390" y="180" text-anchor="middle"><tspan x="390" dy="0">عالمی شہریت</tspan><tspan x="390" dy="22">تعلیم (GCED)</tspan><tspan x="390" dy="20">ہدف 4.7 کا بنیادی ستون</tspan></text><rect class="accent2" x="520" y="90" width="220" height="95" rx="6"/><text class="label" x="630" y="118" text-anchor="middle"><tspan x="630" dy="0">ادراکی دائرہ کار</tspan></text><text class="body" x="630" y="142" text-anchor="middle"><tspan x="630" dy="0">عالمی مسائل کا علم</tspan><tspan x="630" dy="18">باہم منسلک دنیا کے نظام</tspan><tspan x="630" dy="18">تنقیدی میڈیا تجزیہ</tspan></text><rect class="accent3" x="40" y="90" width="220" height="95" rx="6"/><text class="label" x="150" y="118" text-anchor="middle"><tspan x="150" dy="0">سماجی و جذباتی دائرہ کار</tspan></text><text class="body" x="150" y="142" text-anchor="middle"><tspan x="150" dy="0">مشترکہ انسانی عزت</tspan><tspan x="150" dy="18">ثقافتوں کے درمیان ہمدردی</tspan><tspan x="150" dy="18">منصفانہ رویے کا عہد</tspan></text><rect class="accent4" x="260" y="280" width="260" height="85" rx="6"/><text class="label" x="390" y="308" text-anchor="middle"><tspan x="390" dy="0">کرداری دائرہ کار</tspan></text><text class="body" x="390" y="330" text-anchor="middle"><tspan x="390" dy="0">باہمی مسئلہ حل</tspan><tspan x="390" dy="18">محدد برادری شہری عمل</tspan></text><rect class="panel" x="430" y="390" width="310" height="66" rx="6"/><text class="label" x="585" y="418" text-anchor="middle"><tspan x="585" dy="0">مقامی جڑیں: سندھ میں برادری</tspan></text><text class="small" x="585" y="440" text-anchor="middle"><tspan x="585" dy="0">محلے، اسکول اور گاؤں کی فعال دیکھ بھال</tspan></text><rect class="panel" x="40" y="390" width="310" height="66" rx="6"/><text class="label" x="195" y="418" text-anchor="middle"><tspan x="195" dy="0">عالمی یکجہتی: مشترکہ سیارہ</tspan></text><text class="small" x="195" y="440" text-anchor="middle"><tspan x="195" dy="0">عالمی انسانی حقوق، موسمیات اور امن</tspan></text><text class="wm" x="24" y="488" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
