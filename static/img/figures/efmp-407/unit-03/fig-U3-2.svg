<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">SDG Target 4.7: Core Thematic Strands and Learning Dimensions</title><desc id="d">Concept map of SDG Target 4.7 showing the central target linked to its six thematic strands and three learning dimensions.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">SDG Target 4.7: Core Thematic Strands and Learning Dimensions</tspan></text><line class="link" x1="390" y1="180" x2="160" y2="105" marker-end="url(#arrow)"/><line class="link" x1="390" y1="180" x2="620" y2="105" marker-end="url(#arrow)"/><line class="link" x1="300" y1="210" x2="160" y2="210" marker-end="url(#arrow)"/><line class="link" x1="480" y1="210" x2="620" y2="210" marker-end="url(#arrow)"/><line class="link" x1="390" y1="240" x2="160" y2="315" marker-e