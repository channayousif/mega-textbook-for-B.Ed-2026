<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">درجہ جاتی سطح کے مطابق عالمی شہریت کی تعلیم کی سرگرمیاں</title><desc id="d">ایک جدول جس میں ابتدائی، متوسط اور ثانوی درجہ جاتی سطح پر عالمی شہریت کی تعلیم کی کلاس روم سرگرمیاں، مقاصد اور تدریسی حکمت عملی پیش کی گئی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:12px}.h{font-size:18px;font-weight:700}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0">درجہ جاتی سطح کے مطابق عالمی شہریت کی تعلیم کی سرگرمیاں</tspan></text><rect class="accent" x="626" y="56" width="130" height="34" rx="4"/><text class="label" x="746" y="78" text-anchor="end"><tspan x="746" dy="0">درجہ جاتی سطح</tspan></text><rect class="accent" x="440" y="56" width="180" height="34" rx="4"/><text class="label" x="610" y="78" text-anchor="end"><tspan x="610" dy="0">سیکھنے کا مقصد</tspan></text><rect class="accent" x="244" y="56" width="190" height="34" rx="4"/><text class="label" x="424" y="78" text-anchor="end"><tspan x="424" dy="0">تدریسی حکمت عملی</tspan></text><rect class="accent" x="24" y="56" width="214" height="34" rx="4"/><text class="label" x="228" y="78" text-anchor="end"><tspan x="228" dy="0">کلاس روم سرگرمی</tspan></text><rect class="panel" x="626" y="96" width="130" height="110" rx="4"/><text class="label" x="746" y="140" text-anchor="end"><tspan x="746" dy="0">ابتدائی</tspan><tspan x="746" dy="20">جماعت 1-5</tspan></text><rect class="panel" x="440" y="96" width="180" height="110" rx="4"/><text class="body" x="610" y="124" text-anchor="end"><tspan x="610" dy="0">منصفانہ رویے کی پہچان،</tspan><tspan x="610" dy="18">تنوع کی قدر، اور</tspan><tspan x="610" dy="18">باہمی دیکھ بھال کی مشق</tspan><tspan x="610" dy="18">روزمرہ تعامل</tspan></text><rect class="panel" x="244" y="96" width="190" height="110" rx="4"/><text class="body" x="424" y="132" text-anchor="end"><tspan x="424" dy="0">کہانی سنانا، منظم</tspan><tspan x="424" dy="20">رول پلے، اور کلاس روم</tspan><tspan x="424" dy="20">حلقہ بحث</tspan></text><rect class="panel" x="24" y="96" width="214" height="110" rx="4"/><text class="body" x="228" y="124" text-anchor="end"><tspan x="228" dy="0">ثقافتی شو اینڈ ٹیل،</tspan><tspan x="228" dy="18">کلاس روم کے منصفانہ قواعد پر اتفاق</tspan><tspan x="228" dy="18">قواعد، مختلف کہانیاں</tspan><tspan x="228" dy="18">پاکستان میں امن ساز</tspan></text><rect class="panel" x="626" y="212" width="130" height="110" rx="4"/><text class="label" x="746" y="256" text-anchor="end"><tspan x="746" dy="0">متوسط</tspan><tspan x="746" dy="20">جماعت 6-8</tspan></text><rect class="panel" x="440" y="212" width="180" height="110" rx="4"/><text class="body" x="610" y="240" text-anchor="end"><tspan x="610" dy="0">مقامی و عالمی رشتے</tspan><tspan x="610" dy="18">وسائل، پانی میں رشتے</tspan><tspan x="610" dy="18">اور برادری کی بہبود</tspan></text><rect class="panel" x="244" y="212" width="190" height="110" rx="4"/><text class="body" x="424" y="248" text-anchor="end"><tspan x="424" dy="0">رہنمائی میں تحقیق، جگسو</tspan><tspan x="424" dy="20">پڑھنا، اور چھوٹے گروہ</tspan><tspan x="424" dy="20">مسئلہ حل</tspan></text><rect class="panel" x="24" y="212" width="214" height="110" rx="4"/><text class="body" x="228" y="240" text-anchor="end"><tspan x="228" dy="0">مقامی پینے کے پانی کی تحقیق</tspan><tspan x="228" dy="18">کے ذرائع، اسکول کا نقشہ</tspan><tspan x="228" dy="18">کچرا، پانی بچانے والے</tspan><tspan x="228" dy="18">بلیٹن بورڈ ڈیزائن</tspan></text><rect class="panel" x="626" y="328" width="130" height="130" rx="4"/><text class="label" x="746" y="378" text-anchor="end"><tspan x="746" dy="0">ثانوی</tspan><tspan x="746" dy="20">جماعت 9-10</tspan></text><rect class="panel" x="440" y="328" width="180" height="130" rx="4"/><text class="body" x="610" y="356" text-anchor="end"><tspan x="610" dy="0">نظامی محرکوں کا تجزیہ</tspan><tspan x="610" dy="18">عدم مساویت کے محرکات،</tspan><tspan x="610" dy="18">موسمیاتی خطرہ، اور پالیسی</tspan><tspan x="610" dy="18">انتخابات کا جائزہ</tspan></text><rect class="panel" x="244" y="328" width="190" height="130" rx="4"/><text class="body" x="424" y="364" text-anchor="end"><tspan x="424" dy="0">منظم تنازعہ،</tspan><tspan x="424" dy="20">برادری عمل تحقیق،</tspan><tspan x="424" dy="20">اور منصوبے پر مبنی سیکھنا</tspan></text><rect class="panel" x="24" y="328" width="214" height="130" rx="4"/><text class="body" x="228" y="356" text-anchor="end"><tspan x="228" dy="0">شاگرد سرپرست اسکول آڈٹ</tspan><tspan x="228" dy="18">پلاسٹک فضلہ، گفتگو</tspan><tspan x="228" dy="18">موسمیاتی تبدیلی کے اثرات</tspan><tspan x="228" dy="18">سندھ زراعت، برادری</tspan><tspan x="228" dy="18">وکالت مہمات</tspan></text><text class="wm" x="24" y="488" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
