<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کا قومی ایس ڈی جی فریم ورک: پالیسی کا سلسلہ</title><desc id="d">ایک خاکہ جو پاکستان کے قومی ایس ڈی جی فریم ورک کے کثیر سطحی حکمرانی کے سلسلے کو وفاقی پالیسی سے صوبائی محکمہ جات اور مقامی اسکولوں تک دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0">پاکستان کا قومی ایس ڈی جی فریم ورک: پالیسی کا سلسلہ</tspan></text><rect class="accent" x="80" y="60" width="620" height="95" rx="6"/><text class="label" x="680" y="90" text-anchor="end"><tspan x="680" dy="0">1. وفاقی رہنمائی: پاکستان پلاننگ کمیشن</tspan></text><text class="body" x="680" y="115" text-anchor="end"><tspan x="680" dy="0">- قومی ایس ڈی جی فریم ورک: 169 ہدافوں میں 3 ترجیحی سطحات کی تعریف</tspan><tspan x="680" dy="20">- بین الصوبائی ہم آہنگی، وفاقی رپورٹنگ اور قومی بنیادی سطح کا تعین</tspan></text><line class="link" x1="390" y1="155" x2="390" y2="195" marker-end="url(#arrow)"/><rect class="accent2" x="80" y="195" width="620" height="105" rx="6"/><text class="label" x="680" y="225" text-anchor="end"><tspan x="680" dy="0">2. صوبائی مقامی سازی: پلاننگ اور ترقی بورڈ (سندھ)</tspan></text><text class="body" x="680" y="250" text-anchor="end"><tspan x="680" dy="0">- صوبائی ایس ڈی جی سپورٹ یونٹس: مقامی صوبائی ضروریات سے بجٹ کی ہم آہنگی</tspan><tspan x="680" dy="20">- اسکول تعلیم و خواندگی محکمہ (SELD) اور نصابی فریم ورک</tspan><tspan x="680" dy="20">- استاد تربیتی نصاب اور پیشہ ورانہ معیارات کی ہم آہنگی</tspan></text><line class="link" x1="390" y1="300" x2="390" y2="340" marker-end="url(#arrow)"/><rect class="panel" x="80" y="340" width="620" height="110" rx="6"/><text class="label" x="680" y="370" text-anchor="end"><tspan x="680" dy="0">3. مقامی اسکول اور کلاس روم عمل: اساتذہ اور سیکھنے والے</tspan></text><text class="body" x="680" y="395" text-anchor="end"><tspan x="680" dy="0">- اسکولی ترقیاتی منصوبے: پانی کی صفائی، شجرکاری اور توانائی کی بچت</tspan><tspan x="680" dy="20">- کلاس رومی تدریس: تحقیقی اسباق جو نصابی موضوعات کو SDGs سے جوڑتے ہیں</tspan><tspan x="680" dy="20">- برادری تک پہنچ: شاگرد سرپرست سروے اور باہمی صفائی مہمات</tspan></text><text class="wm" x="24" y="488" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
