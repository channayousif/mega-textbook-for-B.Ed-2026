<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">17 پائیدار ترقی کے اہداف: پانچ پی کا فریم ورک</title><desc id="d">ایک جدول جس میں 17 پائیدار ترقی کے اہداف کو پانچ پی کے فریم ورک میں گروہ بندی کی گئی ہے: لوگ، سیارہ، خوشحالی، امن اور شراکت، جن کے ساتھ اسکول سطح کے رشتے بھی شامل ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><rect class="bg" x="0" y="0" width="780" height="520" rx="6"/><text class="h" x="756" y="36" text-anchor="end"><tspan x="756" dy="0">17 پائیدار ترقی کے اہداف: پانچ پی کا فریم ورک</tspan></text><rect class="accent" x="626" y="56" width="130" height="34" rx="4"/><text class="label" x="746" y="78" text-anchor="end"><tspan x="746" dy="0">ستون (پانچ پی)</tspan></text><rect class="accent" x="490" y="56" width="130" height="34" rx="4"/><text class="label" x="610" y="78" text-anchor="end"><tspan x="610" dy="0">ایس ڈی جی نمبر</tspan></text><rect class="accent" x="264" y="56" width="220" height="34" rx="4"/><text class="label" x="474" y="78" text-anchor="end"><tspan x="474" dy="0">عالمی توجہ</tspan></text><rect class="accent" x="24" y="56" width="234" height="34" rx="4"/><text class="label" x="248" y="78" text-anchor="end"><tspan x="248" dy="0">کلاس روم اور اسکول کا رشتہ</tspan></text><rect class="panel" x="626" y="96" width="130" height="74" rx="4"/><text class="label" x="746" y="138" text-anchor="end"><tspan x="746" dy="0">لوگ</tspan></text><rect class="panel" x="490" y="96" width="130" height="74" rx="4"/><text class="body" x="610" y="138" text-anchor="end"><tspan x="610" dy="0">SDGs 1، 2، 3، 4، 5</tspan></text><rect class="panel" x="264" y="96" width="220" height="74" rx="4"/><text class="body" x="474" y="126" text-anchor="end"><tspan x="474" dy="0">غربت، بھوک، صحت،</tspan><tspan x="474" dy="20">تعلیم، جنسی مساویت</tspan></text><rect class="panel" x="24" y="96" width="234" height="74" rx="4"/><text class="body" x="248" y="126" text-anchor="end"><tspan x="248" dy="0">برابر حصہ لینا، شاگرد</tspan><tspan x="248" dy="20">بہبود، لڑکیوں کی تعلیم</tspan></text><rect class="panel" x="626" y="176" width="130" height="74" rx="4"/><text class="label" x="746" y="218" text-anchor="end"><tspan x="746" dy="0">سیارہ</tspan></text><rect class="panel" x="490" y="176" width="130" height="74" rx="4"/><text class="body" x="610" y="206" text-anchor="end"><tspan x="610" dy="0">SDGs 6، 12، 13،</tspan><tspan x="610" dy="20">14، 15</tspan></text><rect class="panel" x="264" y="176" width="220" height="74" rx="4"/><text class="body" x="474" y="206" text-anchor="end"><tspan x="474" dy="0">پانی، موسمیاتی عمل، زندگی</tspan><tspan x="474" dy="20">زمین اور پانی کے نیچے</tspan></text><rect class="panel" x="24" y="176" width="234" height="74" rx="4"/><text class="body" x="248" y="206" text-anchor="end"><tspan x="248" dy="0">پانی کی بچت، فضلہ آڈٹ،</tspan><tspan x="248" dy="20">اسکول سبزہ کاری منصوبے</tspan></text><rect class="panel" x="626" y="256" width="130" height="74" rx="4"/><text class="label" x="746" y="298" text-anchor="end"><tspan x="746" dy="0">خوشحالی</tspan></text><rect class="panel" x="490" y="256" width="130" height="74" rx="4"/><text class="body" x="610" y="286" text-anchor="end"><tspan x="610" dy="0">SDGs 7، 8، 9،</tspan><tspan x="610" dy="20">10، 11</tspan></text><rect class="panel" x="264" y="256" width="220" height="74" rx="4"/><text class="body" x="474" y="286" text-anchor="end"><tspan x="474" dy="0">صاف توانائی، اچھا کام،</tspan><tspan x="474" dy="20">جدت، کم ہونے والی عدم مساویت</tspan></text><rect class="panel" x="24" y="256" width="234" height="74" rx="4"/><text class="body" x="248" y="286" text-anchor="end"><tspan x="248" dy="0">عملی مہارتیں، توانائی کی بچت،</tspan><tspan x="248" dy="20">منصفانہ برادری تعاون</tspan></text><rect class="panel" x="626" y="336" width="130" height="74" rx="4"/><text class="label" x="746" y="378" text-anchor="end"><tspan x="746" dy="0">امن</tspan></text><rect class="panel" x="490" y="336" width="130" height="74" rx="4"/><text class="body" x="610" y="378" text-anchor="end"><tspan x="610" dy="0">SDG 16</tspan></text><rect class="panel" x="264" y="336" width="220" height="74" rx="4"/><text class="body" x="474" y="366" text-anchor="end"><tspan x="474" dy="0">امن، انصاف اور مضبوط</tspan><tspan x="474" dy="20">شمولیت پسنداندہ ادارے</tspan></text><rect class="panel" x="24" y="336" width="234" height="74" rx="4"/><text class="body" x="248" y="366" text-anchor="end"><tspan x="248" dy="0">پرامن تنازعہ حل،</tspan><tspan x="248" dy="20">منصفانہ کلاس رومی قواعد، گفتگو</tspan></text><rect class="panel" x="626" y="416" width="130" height="66" rx="4"/><text class="label" x="746" y="454" text-anchor="end"><tspan x="746" dy="0">شراکت</tspan></text><rect class="panel" x="490" y="416" width="130" height="66" rx="4"/><text class="body" x="610" y="454" text-anchor="end"><tspan x="610" dy="0">SDG 17</tspan></text><rect class="panel" x="264" y="416" width="220" height="66" rx="4"/><text class="body" x="474" y="444" text-anchor="end"><tspan x="474" dy="0">عالمی شراکت اور</tspan><tspan x="474" dy="18">عبر شعبہ تعاون</tspan></text><rect class="panel" x="24" y="416" width="234" height="66" rx="4"/><text class="body" x="248" y="444" text-anchor="end"><tspan x="248" dy="0">والدین و اساتذہ اتحاد،</tspan><tspan x="248" dy="18">برادری رشتہ منصوبے</tspan></text><text class="wm" x="24" y="508" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
