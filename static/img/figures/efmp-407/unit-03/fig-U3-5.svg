<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">Global Citizenship Education: Domains and Local-Global Action</title><desc id="d">Concept map showing the cognitive, socio-emotional, and behavioural domains of global citizenship education bridging local community action and global engagement.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">Global Citizenship Education: Domains and Local-Global Action</tspan></text><line class="link" x1="280" y1="180" x2="160" y2="150" marker-end="url(#arrow)"/><line class="link" x1="500" y1="180" x2="620" y2="150" marker-end="url(#arrow)"/><line class="link" x1="390" y1="230" x2="390" y2="280" marker-end="url(#arrow)"/><line class="link" x1="220" y1="410" x2="560" y2="410" marker-end="url(#arrow)"/><line class="link" x1="560" y1="420" x2="220" y2="420" marker-end="url(#arrow)"/><rect class="accent" x="260" y="145" width="260" height="85" rx="8"/><text class="label" x="390" y="180" text-anchor="middle"><tspan x="390" dy="0">Global Citizenship</tspan><tspan x="390" dy="22">Education (GCED)</tspan><tspan x="390" dy="20">Target 4.7 Core Pillar</tspan></text><rect class="accent2" x="40" y="90" width="220" height="95" rx="6"/><text class="label" x="150" y="118" text-anchor="middle"><tspan x="150" dy="0">Cognitive Domain</tspan></text><text class="body" x="150" y="142" text-anchor="middle"><tspan x="150" dy="0">Global issues knowledge</tspan><tspan x="150" dy="18">Interconnected world systems</tspan><tspan x="150" dy="18">Critical media analysis</tspan></text><rect class="accent3" x="520" y="90" width="220" height="95" rx="6"/><text class="label" x="630" y="118" text-anchor="middle"><tspan x="630" dy="0">Socio-Emotional Domain</tspan></text><text class="body" x="630" y="142" text-anchor="middle"><tspan x="630" dy="0">Shared human dignity</tspan><tspan x="630" dy="18">Empathy across cultures</tspan><tspan x="630" dy="18">Commitment to fairness</tspan></text><rect class="accent4" x="260" y="280" width="260" height="85" rx="6"/><text class="label" x="390" y="308" text-anchor="middle"><tspan x="390" dy="0">Behavioural Domain</tspan></text><text class="body" x="390" y="330" text-anchor="middle"><tspan x="390" dy="0">Collaborative problem solving</tspan><tspan x="390" dy="18">Tangible community civic action</tspan></text><rect class="panel" x="40" y="390" width="310" height="66" rx="6"/><text class="label" x="195" y="418" text-anchor="middle"><tspan x="195" dy="0">Local Roots: Community in Sindh</tspan></text><text class="small" x="195" y="440" text-anchor="middle"><tspan x="195" dy="0">Active care for neighbourhood, school, and village</tspan></text><rect class="panel" x="430" y="390" width="310" height="66" rx="6"/><text class="label" x="585" y="418" text-anchor="middle"><tspan x="585" dy="0">