<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">Selected Priority SDGs in Pakistan: School Actions</title><desc id="d">Table displaying selected priority Sustainable Development Goals in Pakistan and actionable school-level interventions for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">Selected Priority SDGs in Pakistan: School Actions</tspan></text><rect class="accent" x="24" y="56" width="170" height="34" rx="4"/><text class="label" x="34" y="78"><tspan x="34" dy="0">Priority Goal</tspan></text><rect class="accent" x="202" y="56" width="260" height="34" rx="4"/><text class="label" x="212" y="78"><tspan x="212" dy="0">National Challenge</tspan></text><rect class="accent" x="470" y="56" width="286" height="34" rx="4"/><text class="label" x="480" y="78"><tspan x="480" dy="0">Actionable School Practice</tspan></text><rect class="panel" x="24" y="96" width="170" height="70" rx="4"/><text class="label" x="34" y="126"><tspan x="34" dy="0">SDG 3: Good Health</tspan><tspan x="34" dy="20">and Well-being</tspan></text><rect class="panel" x="202" y="96" width="260" height="70" rx="4"/><text class="body" x="212" y="124"><tspan x="212" dy="0">Malnutrition, water-borne</tspan><tspan x="212" dy="20">disease, preventable illness</tspan></text><rect class="panel" x="470" y="96" width="286" height="70" rx="4"/><text class="body" x="480" y="124"><tspan x="480" dy="0">Daily handwashing routines, clean water</tspan><tspan x="480" dy="20">checks, student hygiene monitors</tspan></text><rect class="panel" x="24" y="172" width="170" height="70" rx="4"/><text class="label" x="34" y="202"><tspan x="34" dy="0">SDG 4: Quality</tspan><tspan x="34" dy="20">Education</tspan></text><rect class="panel" x="202" y="172" width="260" height="70" rx="4"/><text class="body" x="212" y="200"><tspan x="212" dy="0">Out-of-school children, rote</tspan><tspan x="212" dy="20">learning, low foundational skills</tspan></text><rect class="panel" x="470" y="172" width="286" height="70" rx="4"/><text class="body" x="480" y="200"><tspan x="480" dy="0">Inquiry lessons, Target 4.7 integration,</tspan><tspan x="480" dy="20">support for struggling readers</tspan></text><rect class="panel" x="24" y="248" width="170" height="70" rx="4"/><text class="label" x="34" y="278"><tspan x="34" dy="0">SDG 5: Gender</tspan><tspan x="34" dy="20">Equality</tspan></text><rect class="panel" x="202" y="248" width="260" height="70" rx="4"/><text class="body" x="212" y="276"><tspan x="212" dy="0">Gender disparity in secondary</tspan><tspan x="212" dy="20">enrolment and leadership</tspan></text><rect class="panel" x="470" y="248" width="286" height="70" rx="4"/><text class="body" x="480" y="276"><tspan x="480" dy="0">Equal speaking turns, mixed pair work,</tspan><tspan x="480" dy="20">female student leadership roles</tspan></text><rect class="panel" x="24" y="324" width="170" height="70" rx="4"/><text class="label" x="34" y="354"><tspan x="34" dy="0">SDG 6: Clean Water</tspan><tspan x="34" dy="20">and Sanitation</tspan></text><rect class="panel" x="202" y="324" width="260" height="70" rx="4"/><text class="body" x="212" y="352"><tspan x="212" dy="0">Unsafe drinking water and</tspan><tspan x="212" dy="20">inadequate sanitation facilities</tspan></text><rect class="panel" x="470" y="324" width="286" height="70" rx="4"/><text class="body" x="480" y="352"><tspan x="480" dy="0">Fixing leaking taps, clean toilet upkeep,</tspan><tspan x="480" dy="20">safe drinking water storage</tspan></text><rect class="panel" x="24" y="400" width="170" height="66" rx="4"/><text class="label" x="34" y="430"><tspan x="34" dy="0">SDG 13: Climate</tspan><tspan x="34" dy="20">Action</tspan></text><rect class="panel" x="202" y="400" width="260" height="66" rx="4"/><text class="body" x="212" y="428"><tspan x="212" dy="0">Extreme heatwaves, floods,</tspan><tspan x="212" dy="18">and environmental vulnerability</tspan></text><rect class="panel" x="470" y="400" width="286" height="66" rx="4"/><text class="body" x="480" y="428"><tspan x="480" dy="0">Schoolyard tree planting, energy saving,</tspan><tspan x="480" dy="18">disaster and heatwave safety drills</tspan></text><text class="wm" x="756" y="488" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>