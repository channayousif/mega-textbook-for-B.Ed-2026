<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">The 17 Sustainable Development Goals: The 5 Ps Framework</title><desc id="d">Table grouping the 17 Sustainable Development Goals across the five Ps framework: People, Planet, Prosperity, Peace, and Partnership, with school-level connections.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:15px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><rect class="bg" x="0" y="0" width="780" height="520" rx="6"/><text class="h" x="24" y="36"><tspan x="24" dy="0">The 17 Sustainable Development Goals: The 5 Ps Framework</tspan></text><rect class="accent" x="24" y="56" width="130" height="34" rx="4"/><text class="label" x="34" y="78"><tspan x="34" dy="0">Pillar (5 Ps)</tspan></text><rect class="accent" x="160" y="56" width="130" height="34" rx="4"/><text class="label" x="170" y="78"><tspan x="170" dy="0">SDG Numbers</tspan></text><rect class="accent" x="296" y="56" width="220" height="34" rx="4"/><text class="label" x="306" y="78"><tspan x="306" dy="0">Global Focus</tspan></text><rect class="accent" x="522" y="56" width="234" height="34" rx="4"/><text class="label" x="532" y="78"><tspan x="532" dy="0">Classroom and School Link</tspan></text><rect class="panel" x="24" y="96" width="130" height="74" rx="4"/><text class="label" x="34" y="138"><tspan x="34" dy="0">People</tspan></text><rect class="panel" x="160" y="96" width="130" height="74" rx="4"/><text class="body" x="170" y="138"><tspan x="170" dy="0">SDGs 1, 2, 3, 4, 5</tspan></text><rect class="panel" x="296" y="96" width="220" height="74" rx="4"/><text class="body" x="306" y="126"><tspan x="306" dy="0">Poverty, hunger, health,</tspan><tspan x="306" dy="20">education, gender equity</tspan></text><rect class="panel" x="522" y="96" width="234" height="74" rx="4"/><text class="body" x="532" y="126"><tspan x="532" dy="0">Equal participation, student</tspan><tspan x="532" dy="20">wellbeing, girls education</tspan></text><rect class="panel" x="24" y="176" width="130" height="74" rx="4"/><text class="label" x="34" y="218"><tspan x="34" dy="0">Planet</tspan></text><rect class="panel" x="160" y="176" width="130" height="74" rx="4"/><text class="body" x="170" y="218"><tspan x="170" dy="0">SDGs 6, 12, 13, 14, 15</tspan></text><rect class="panel" x="296" y="176" width="220" height="74" rx="4"/><text class="body" x="306" y="206"><tspan x="306" dy="0">Water, climate action, life</tspan><tspan x="306" dy="20">on land and below water</tspan></text><rect class="panel" x="522" y="176" width="234" height="74" rx="4"/><text class="body" x="532" y="206"><tspan x="532" dy="0">Water conservation, waste audits,</tspan><tspan x="532" dy="20">school greening projects</tspan></text><rect class="panel" x="24" y="256" width="130" height="74" rx="4"/><text class="label" x="34" y="298"><tspan x="34" dy="0">Prosperity</tspan></text><rect class="panel" x="160" y="256" width="130" height="74" rx="4"/><text class="body" x="170" y="298"><tspan x="170" dy="0">SDGs 7, 8, 9, 10, 11</tspan></text><rect class="panel" x="296" y="256" width="220" height="74" rx="4"/><text class="body" x="306" y="286"><tspan x="306" dy="0">Clean energy, decent work,</tspan><tspan x="306" dy="20">innovation, reduced inequality</tspan></text><rect class="panel" x="522" y="256" width="234" height="74" rx="4"/><text class="body" x="532" y="286"><tspan x="532" dy="0">Practical skills, energy saving,</tspan><tspan x="532" dy="20">fair community cooperation</tspan></text><rect class="panel" x="24" y="336" width="130" height="74" rx="4"/><text class="label" x="34" y="378"><tspan x="34" dy="0">Peace</tspan></text><rect class="panel" x="160" y="336" width="130" height="74" rx="4"/><text class="body" x="170" y="378"><tspan x="170" dy="0">SDG 16</tspan></text><rect class="panel" x="296" y="336" width="220" height="74" rx="4"/><text class="body" x="306" y="366"><tspan x="306" dy="0">Peace, justice, and strong</tspan><tspan x="306" dy="20">inclusive institutions</tspan></text><rect class="panel" x="522" y="336" width="234" height="74" rx="4"/><text class="body" x="532" y="366"><tspan x="532" dy="0">Peaceful conflict resolution,</tspan><tspan x="532" dy="20">fair classroom rules, dialogue</tspan></text><rect class="panel" x="24" y="416" width="130" height="66" rx="4"/><text class="label" x="34" y="454"><tspan x="34" dy="0">Partnership</tspan></text><rect class="panel" x="160" y="416" width="130" height="66" rx="4"/><text class="body" x="170" y="454"><tspan x="170" dy="0">SDG 17</tspan></text><rect class="panel" x="296" y="416" width="220" height="66" rx="4"/><text class="body" x="306" y="444"><tspan x="306" dy="0">Global partnerships and</tspan><tspan x="306" dy="18">cross-sector collaboration</tspan></text><rect class="panel" x="522" y="416" width="234" height="66" rx="4"/><text class="body" x="532" y="444"><tspan x="532" dy="0">Parent-teacher alliances,</tspan><tspan x="532" dy="18">community linkage projects</tspan></text><text class="wm" x="756" y="508" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>