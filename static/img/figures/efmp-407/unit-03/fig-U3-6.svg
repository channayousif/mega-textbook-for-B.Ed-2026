<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">Global Citizenship Education Activities by Grade Band</title><desc id="d">Table outlining global citizenship education classroom activities, objectives, and pedagogical strategies across primary, middle, and secondary grade bands.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:12px}.h{font-size:18px;font-weight:700}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">Global Citizenship Education Activities by Grade Band</tspan></text><rect class="accent" x="24" y="56" width="130" height="34" rx="4"/><text class="label" x="34" y="78"><tspan x="34" dy="0">Grade Band</tspan></text><rect class="accent" x="160" y="56" width="180" height="34" rx="4"/><text class="label" x="170" y="78"><tspan x="170" dy="0">Learning Objective</tspan></text><rect class="accent" x="346" y="56" width="190" height="34" rx="4"/><text class="label" x="356" y="78"><tspan x="356" dy="0">Pedagogical Strategy</tspan></text><rect class="accent" x="542" y="56" width="214" height="34" rx="4"/><text class="label" x="552" y="78"><tspan x="552" dy="0">Classroom Activity</tspan></text><rect class="panel" x="24" y="96" width="130" height="110" rx="4"/><text class="label" x="34" y="140"><tspan x="34" dy="0">Primary</tspan><tspan x="34" dy="20">Grades 1-5</tspan></text><rect class="panel" x="160" y="96" width="180" height="110" rx="4"/><text class="body" x="170" y="124"><tspan x="170" dy="0">Recognize fairness,</tspan><tspan x="170" dy="18">appreciate diversity, and</tspan><tspan x="170" dy="18">practise mutual care in</tspan><tspan x="170" dy="18">daily interactions</tspan></text><rect class="panel" x="346" y="96" width="190" height="110" rx="4"/><text class="body" x="356" y="132"><tspan x="356" dy="0">Storytelling, structured</tspan><tspan x="356" dy="20">role play, and classroom</tspan><tspan x="356" dy="20">circle discussions</tspan></text><rect class="panel" x="542" y="96" width="214" height="110" rx="4"/><text class="body" x="552" y="124"><tspan x="552" dy="0">Cultural show-and-tell,</tspan><tspan x="552" dy="18">agreeing on classroom fair</tspan><tspan x="552" dy="18">rules, stories of diverse</tspan><tspan x="552" dy="18">peace-builders in Pakistan</tspan></text><rect class="panel" x="24" y="212" width="130" height="110" rx="4"/><text class="label" x="34" y="256"><tspan x="34" dy="0">Middle</tspan><tspan x="34" dy="20">Grades 6-8</tspan></text><rect class="panel" x="160" y="212" width="180" height="110" rx="4"/><text class="body" x="170" y="240"><tspan x="170" dy="0">Understand local-global</tspan><tspan x="170" dy="18">links in resources, water,</tspan><tspan x="170" dy="18">and community wellbeing</tspan></text><rect class="panel" x="346" y="212" width="190" height="110" rx="4"/><text class="body" x="356" y="248"><tspan x="356" dy="0">Guided inquiry, jigsaw</tspan><tspan x="356" dy="20">reading, and small-group</tspan><tspan x="356" dy="20">problem solving</tspan></text><rect class="panel" x="542" y="212" width="214" height="110" rx="4"/><text class="body" x="552" y="240"><tspan x="552" dy="0">Investigating local drinking</tspan><tspan x="552" dy="18">water sources, mapping school</tspan><tspan x="552" dy="18">litter, designing water-saving</tspan><tspan x="552" dy="18">bulletin boards</tspan></text><rect class="panel" x="24" y="328" width="130" height="130" rx="4"/><text class="label" x="34" y="378"><tspan x="34" dy="0">Secondary</tspan><tspan x="34" dy="20">Grades 9-10</tspan></text><rect class="panel" x="160" y="328" width="180" height="130" rx="4"/><text class="body" x="170" y="356"><tspan x="170" dy="0">Analyze systemic</tspan><tspan x="170" dy="18">drivers of inequality,</tspan><tspan x="170" dy="18">climate risk, and evaluate</tspan><tspan x="170" dy="18">policy choices</tspan></text><rect class="panel" x="346" y="328" width="190" height="130" rx="4"/><text class="body" x="356" y="364"><tspan x="356" dy="0">Structured controversy,</tspan><tspan x="356" dy="20">community action research,</tspan><tspan x="356" dy="20">and project-based learning</tspan></text><rect class="panel" x="542" y="328" width="214" height="130" rx="4"/><text class="body" x="552" y="356"><tspan x="552" dy="0">Student-led audits of school</tspan><tspan x="552" dy="18">plastic waste, dialogue on</tspan><tspan x="552" dy="18">climate change impact on</tspan><tspan x="552" dy="18">Sindh agriculture, community</tspan><tspan x="552" dy="18">advocacy campaigns</tspan></text><text class="wm" x="756" y="488" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>