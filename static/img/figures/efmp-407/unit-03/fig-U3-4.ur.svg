<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں منتخب ترجیحی ایس ڈی جیز: اسکول کے عمل</title><desc id="d">ایک جدول جس میں پاکستان کے منتخب ترجیحی پائیدار ترقی کے اہداف اور ہر ایک کے لیے عملی اسکول سطح کے اقدامات دکھائے گئے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.accent2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.accent3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.accent4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:13px}.h{font-size:18px;font-weight:700}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}</style><rect class="bg" x="0" y="0" width="780" height="500" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0">پاکستان میں منتخب ترجیحی ایس ڈی جیز: اسکول کے عمل</tspan></text><rect class="accent" x="586" y="56" width="170" height="34" rx="4"/><text class="label" x="746" y="78" text-anchor="end"><tspan x="746" dy="0">ترجیحی ہدف</tspan></text><rect class="accent" x="318" y="56" width="260" height="34" rx="4"/><text class="label" x="568" y="78" text-anchor="end"><tspan x="568" dy="0">قومی چیلنج</tspan></text><rect class="accent" x="24" y="56" width="286" height="34" rx="4"/><text class="label" x="300" y="78" text-anchor="end"><tspan x="300" dy="0">قابلِ عمل اسکولی عمل</tspan></text><rect class="panel" x="586" y="96" width="170" height="70" rx="4"/><text class="label" x="746" y="126" text-anchor="end"><tspan x="746" dy="0">SDG 3: اچھی صحت</tspan><tspan x="746" dy="20">اور بہبود</tspan></text><rect class="panel" x="318" y="96" width="260" height="70" rx="4"/><text class="body" x="568" y="124" text-anchor="end"><tspan x="568" dy="0">غذایی کمی، پانی سے پھیلنے والی</tspan><tspan x="568" dy="20">بیماری، روکنے والی بیماری</tspan></text><rect class="panel" x="24" y="96" width="286" height="70" rx="4"/><text class="body" x="300" y="124" text-anchor="end"><tspan x="300" dy="0">روزانہ ہاتھ دھونے کے معمول، صاف پانی</tspan><tspan x="300" dy="20">جانچ، شاگرد صفائی نگران</tspan></text><rect class="panel" x="586" y="172" width="170" height="70" rx="4"/><text class="label" x="746" y="202" text-anchor="end"><tspan x="746" dy="0">SDG 4: معیاری</tspan><tspan x="746" dy="20">تعلیم</tspan></text><rect class="panel" x="318" y="172" width="260" height="70" rx="4"/><text class="body" x="568" y="200" text-anchor="end"><tspan x="568" dy="0">اسکول سے باہر بچے، رٹنے</tspan><tspan x="568" dy="20">سیکھنا، کم بنیادی مہارتیں</tspan></text><rect class="panel" x="24" y="172" width="286" height="70" rx="4"/><text class="body" x="300" y="200" text-anchor="end"><tspan x="300" dy="0">تحقیقی اسباق، ہدف 4.7 کا اظاف،</tspan><tspan x="300" dy="20">مشکل سے پڑھنے والوں کے لیے مدد</tspan></text><rect class="panel" x="586" y="248" width="170" height="70" rx="4"/><text class="label" x="746" y="278" text-anchor="end"><tspan x="746" dy="0">SDG 5: جنسی</tspan><tspan x="746" dy="20">مساویت</tspan></text><rect class="panel" x="318" y="248" width="260" height="70" rx="4"/><text class="body" x="568" y="276" text-anchor="end"><tspan x="568" dy="0">ثانوی میں جنسی فرق</tspan><tspan x="568" dy="20">داخلہ اور قیادت</tspan></text><rect class="panel" x="24" y="248" width="286" height="70" rx="4"/><text class="body" x="300" y="276" text-anchor="end"><tspan x="300" dy="0">برابر بولنے کی باریاں، مخلوط جوڑی کام،</tspan><tspan x="300" dy="20">خواتین شاگرد قیادتی کردار</tspan></text><rect class="panel" x="586" y="324" width="170" height="70" rx="4"/><text class="label" x="746" y="354" text-anchor="end"><tspan x="746" dy="0">SDG 6: صاف پانی</tspan><tspan x="746" dy="20">اور صفائی</tspan></text><rect class="panel" x="318" y="324" width="260" height="70" rx="4"/><text class="body" x="568" y="352" text-anchor="end"><tspan x="568" dy="0">غیر محفوظ پینے کا پانی اور</tspan><tspan x="568" dy="20">ناکافی صفائی کی سہولتیں</tspan></text><rect class="panel" x="24" y="324" width="286" height="70" rx="4"/><text class="body" x="300" y="352" text-anchor="end"><tspan x="300" dy="0">ٹپکتے نلکوں کی مرمت، صاف بیت الخلاء کی دیکھ بھال،</tspan><tspan x="300" dy="20">محفوظ پینے کے پانی کا ذخیرہ</tspan></text><rect class="panel" x="586" y="400" width="170" height="66" rx="4"/><text class="label" x="746" y="430" text-anchor="end"><tspan x="746" dy="0">SDG 13: موسمیاتی</tspan><tspan x="746" dy="20">عمل</tspan></text><rect class="panel" x="318" y="400" width="260" height="66" rx="4"/><text class="body" x="568" y="428" text-anchor="end"><tspan x="568" dy="0">شدید گرمیوں کے لہر، سیلاب،</tspan><tspan x="568" dy="18">اور ماحولیاتی کمزوری</tspan></text><rect class="panel" x="24" y="400" width="286" height="66" rx="4"/><text class="body" x="300" y="428" text-anchor="end"><tspan x="300" dy="0">اسکول کے صحن میں شجرکاری، توانائی کی بچت،</tspan><tspan x="300" dy="18">آفات اور گرمیوں کے لہر کی حفاظتی مشقیں</tspan></text><text class="wm" x="24" y="488" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
