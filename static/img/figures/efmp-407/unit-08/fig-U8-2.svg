<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of a practical school sustainability project plan</title><desc id="d">Table showing a practical school sustainability project plan with columns for task, who is responsible, timeline, resources needed, and success indicators across four project activities.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 12px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="24" y="32">8.1 Sample project plan: school water and tree nursery</text><rect class="panel" x="24" y="50" width="732" height="50"/><text class="h" x="32" y="80">Task</text><text class="h" x="178" y="80">Who</text><text class="h" x="298" y="80">When</text><text class="h" x="398" y="80">Resources</text><text class="h" x="548" y="80">Success indicator</text><rect class="panel" x="24" y="100" width="732" height="65"/><text class="row" x="32" y="125">Water audit and<tspan x="32" dy="17">leak repairs</tspan></text><text class="ink" x="178" y="125">Science club and<tspan x="178" dy="17">school caretaker</tspan></text><text class="ink" x="298" y="125">Weeks 1 to 3</text><text class="ink" x="398" y="125">Washers, wrench,<tspan x="398" dy="17">meter logbook</tspan></text><text class="ink" x="548" y="125">Zero dripping taps; 20%<tspan x="548" dy="17">water saved</tspan></text><rect class="panel" x="24" y="165" width="732" height="65"/><text class="row" x="32" y="190">Native tree<tspan x="32" dy="17">nursery beds</tspan></text><text class="ink" x="178" y="190">Class 8 pupils and<tspan x="178" dy="17">science teacher</tspan></text><text class="ink" x="298" y="190">Weeks 2 to 6</text><text class="ink" x="398" y="190">Neem seeds, soil,<tspan x="398" dy="17">recycled milk bags</tspan></text><text class="ink" x="548" y="190">100 potted seedlings<tspan x="548" dy="17">sprouted healthy</tspan></text><rect class="panel" x="24" y="230" width="732" height="65"/><text class="row" x="32" y="255">Daily care and<tspan x="32" dy="17">greywater reuse</tspan></text><text class="ink" x="178" y="255">Pupil monitor<tspan x="178" dy="17">teams (in pairs)</tspan></text><text class="ink" x="298" y="255">Weeks 4 to 12</text><text class="ink" x="398" y="255">Watering cans and<tspan x="398" dy="17">observation chart</tspan></text><text class="ink" x="548" y="255">Over 85% sapling survival<tspan x="548" dy="17">recorded in chart</tspan></text><rect class="panel" x="24" y="295" width="732" height="65"/><text class="row" x="32" y="320">Planting day with<tspan x="32" dy="17">community</tspan></text><text class="ink" x="178" y="320">SMC members,<tspan x="178" dy="17">teachers and</tspan><tspan x="178" dy="17">pupils</tspan></text><text class="ink" x="298" y="320">Week 14</text><text class="ink" x="398" y="320">Spades, compost<tspan x="398" dy="17">and bamboo guards</tspan></text><text class="ink" x="548" y="320">50 trees planted along<tspan x="548" dy="17">school perimeter</tspan></text><path class="link" d="M170 50V360 M290 50V360 M390 50V360 M540 50V360 M756 50V360"/><text class="wm" x="768" y="372" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
