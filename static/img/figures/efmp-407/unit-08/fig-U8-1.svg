<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the school sustainability project cycle</title><desc id="d">Flowchart showing the six stages of a school sustainability project cycle: identify a need, plan the project, take action, monitor progress, report outcomes, and reflect and improve.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="24" y="32">8.1 Six stages of a school sustainability project</text><rect class="panel-a" x="270" y="52" width="240" height="66" rx="8"/><text class="row" x="390" y="76" text-anchor="middle">1. Identify a need</text><text class="small" x="390" y="96" text-anchor="middle">investigate local school needs</text><rect class="panel" x="520" y="140" width="236" height="66" rx="8"/><text class="row" x="638" y="164" text-anchor="middle">2. Plan the project</text><text class="small" x="638" y="184" text-anchor="middle">set goals, roles, budget and signs</text><rect class="panel" x="520" y="260" width="236" height="66" rx="8"/><text class="row" x="638" y="284" text-anchor="middle">3. Take action</text><text class="small" x="638" y="304" text-anchor="middle">carry out collaborative tasks</text><rect class="panel" x="270" y="344" width="240" height="66" rx="8"/><text class="row" x="390" y="368" text-anchor="middle">4. Monitor progress</text><text class="small" x="390" y="388" text-anchor="middle">track indicators and collect data</text><rect class="panel" x="24" y="260" width="236" height="66" rx="8"/><text class="row" x="142" y="284" text-anchor="middle">5. Report outcomes</text><text class="small" x="142" y="304" text-anchor="middle">share results with SMC and community</text><rect class="panel" x="24" y="140" width="236" height="66" rx="8"/><text class="row" x="142" y="164" text-anchor="middle">6. Reflect and improve</text><text class="small" x="142" y="184" text-anchor="middle">evaluate lessons and sustain gains</text><path class="stroke" d="M490 118 Q550 120 570 140" marker-end="url(#arrow)"/><path class="stroke" d="M638 206 L638 254" marker-end="url(#arrow)"/><path class="stroke" d="M570 326 Q550 350 490 355" marker-end="url(#arrow)"/><path class="stroke" d="M290 355 Q230 350 210 326" marker-end="url(#arrow)"/><path class="stroke" d="M142 260 L142 212" marker-end="url(#arrow)"/><path class="stroke" d="M210 140 Q230 120 290 118" marker-end="url(#arrow)"/><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
