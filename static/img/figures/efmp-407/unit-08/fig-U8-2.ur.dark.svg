<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے پائیداری کے ایک عملی منصوبے کا جدول</title><desc id="d">جدول جو اسکول کے پائیداری کے منصوبے کا ایک عملی خاکہ دکھاتا ہے، جس میں چار سرگرمیوں کے لیے کام، ذمہ دار، نظام الاوقات، درکار وسائل اور کامیابی کے اشاریوں کے کالم ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 12px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .row { font-size: 13px; } .ink { font-size: 13px; }</style><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="756" y="32" direction="rtl" text-anchor="start">8.1 نمونہ منصوبہ: اسکول میں پانی اور درختوں کی پنیری</text><rect class="panel" x="24" y="50" width="732" height="50"/><text class="h" x="748" y="82" direction="rtl" text-anchor="start">کام</text><text class="h" x="602" y="82" direction="rtl" text-anchor="start">ذمہ دار</text><text class="h" x="482" y="82" direction="rtl" text-anchor="start">کب</text><text class="h" x="382" y="82" direction="rtl" text-anchor="start">وسائل</text><text class="h" x="232" y="82" direction="rtl" text-anchor="start">کامیابی کا اشاریہ</text><rect class="panel" x="24" y="100" width="732" height="80"/><text class="row" x="748" y="126" direction="rtl" text-anchor="start">پانی کا جائزہ اور<tspan x="748" dy="32">نلکوں کی مرمت</tspan></text><text class="ink" x="602" y="126" direction="rtl" text-anchor="start">سائنس کلب اور<tspan x="602" dy="32">اسکول کا چوکیدار</tspan></text><text class="ink" x="482" y="145" direction="rtl" text-anchor="start">ہفتہ 1 سے 3</text><text class="ink" x="382" y="126" direction="rtl" text-anchor="start">واشر، رنچ،<tspan x="382" dy="32">میٹر کی لاگ بک</tspan></text><text class="ink" x="232" y="126" direction="rtl" text-anchor="start">کوئی نلکا نہ ٹپکے؛<tspan x="232" dy="32">20% پانی کی بچت</tspan></text><rect class="panel" x="24" y="180" width="732" height="80"/><text class="row" x="748" y="206" direction="rtl" text-anchor="start">مقامی درختوں کی<tspan x="748" dy="32">پنیری کی کیاریاں</tspan></text><text class="ink" x="602" y="206" direction="rtl" text-anchor="start">جماعت 8 کے بچے<tspan x="602" dy="32">اور سائنس استاد</tspan></text><text class="ink" x="482" y="225" direction="rtl" text-anchor="start">ہفتہ 2 سے 6</text><text class="ink" x="382" y="206" direction="rtl" text-anchor="start">نیم کے بیج، مٹی،<tspan x="382" dy="32">دودھ کی پرانی تھیلیاں</tspan></text><text class="ink" x="232" y="206" direction="rtl" text-anchor="start">100 صحت مند پودے<tspan x="232" dy="32">گملوں میں اگ آئیں</tspan></text><rect class="panel" x="24" y="260" width="732" height="80"/><text class="row" x="748" y="286" direction="rtl" text-anchor="start">روزانہ دیکھ بھال،<tspan x="748" dy="32">دھوون کا استعمال</tspan></text><text class="ink" x="602" y="286" direction="rtl" text-anchor="start">بچوں کی نگران<tspan x="602" dy="32">ٹیمیں (جوڑیوں میں)</tspan></text><text class="ink" x="482" y="305" direction="rtl" text-anchor="start">ہفتہ 4 سے 12</text><text class="ink" x="382" y="286" direction="rtl" text-anchor="start">پانی کے ڈبے اور<tspan x="382" dy="32">مشاہدے کا چارٹ</tspan></text><text class="ink" x="232" y="286" direction="rtl" text-anchor="start">پودوں کی 85% سے زیادہ<tspan x="232" dy="32">بقا چارٹ میں درج</tspan></text><rect class="panel" x="24" y="340" width="732" height="80"/><text class="row" x="748" y="366" direction="rtl" text-anchor="start">برادری کے ساتھ<tspan x="748" dy="32">شجرکاری کا دن</tspan></text><text class="ink" x="602" y="366" direction="rtl" text-anchor="start">SMC ارکان،<tspan x="602" dy="32">اساتذہ اور بچے</tspan></text><text class="ink" x="482" y="385" direction="rtl" text-anchor="start">ہفتہ 14</text><text class="ink" x="382" y="366" direction="rtl" text-anchor="start">بیلچے، کھاد اور<tspan x="382" dy="32">بانس کے جنگلے</tspan></text><text class="ink" x="232" y="366" direction="rtl" text-anchor="start">چاردیواری کے ساتھ<tspan x="232" dy="32">50 درخت لگائے گئے</tspan></text><path class="link" d="M610 50V420 M490 50V420 M390 50V420 M240 50V420 M24 50V420"/><text class="wm" x="768" y="432" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>