<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing reporting formats for school sustainability projects</title><desc id="d">Table comparing four reporting formats - visual notice boards, morning assemblies, concise written briefs, and community town-hall meetings - on audience, content, and frequency.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="24" y="32">8.2 Reporting formats and audiences</text><rect class="panel" x="24" y="50" width="732" height="50"/><text class="h" x="32" y="80">Format</text><text class="h" x="188" y="80">Audience</text><text class="h" x="358" y="80">Key content</text><text class="h" x="598" y="80">Frequency</text><rect class="panel" x="24" y="100" width="732" height="65"/><text class="row" x="32" y="125">Visual notice<tspan x="32" dy="17">board</tspan></text><text class="ink" x="188" y="125">Pupils, teachers and<tspan x="188" dy="17">daily school visitors</tspan></text><text class="ink" x="358" y="125">Photo charts, weekly water<tspan x="358" dy="17">savings and duty rosters</tspan></text><text class="ink" x="598" y="125">Updated weekly</text><rect class="panel" x="24" y="165" width="732" height="65"/><text class="row" x="32" y="190">Morning<tspan x="32" dy="17">assembly talk</tspan></text><text class="ink" x="188" y="190">All school classes<tspan x="188" dy="17">and school staff</tspan></text><text class="ink" x="358" y="190">Short pupil speeches, skits,<tspan x="358" dy="17">and milestone celebrations</tspan></text><text class="ink" x="598" y="190">Monthly or at<tspan x="598" dy="17">key milestones</tspan></text><rect class="panel" x="24" y="230" width="732" height="65"/><text class="row" x="32" y="255">Concise written<tspan x="32" dy="17">project brief</tspan></text><text class="ink" x="188" y="255">Head teacher, SMC<tspan x="188" dy="17">members and district</tspan></text><text class="ink" x="358" y="255">Summary of goals, resources<tspan x="358" dy="17">used, metrics and next steps</tspan></text><text class="ink" x="598" y="255">End of term or<tspan x="598" dy="17">project phase</tspan></text><rect class="panel" x="24" y="295" width="732" height="65"/><text class="row" x="32" y="320">Community<tspan x="32" dy="17">meeting day</tspan></text><text class="ink" x="188" y="320">Parents, elders and<tspan x="188" dy="17">neighbourhood</tspan></text><text class="ink" x="358" y="320">Exhibition of pupil work, open<tspan x="358" dy="17">discussion and thanks</tspan></text><text class="ink" x="598" y="320">Once or twice<tspan x="598" dy="17">per project cycle</tspan></text><path class="link" d="M180 50V360 M350 50V360 M590 50V360 M756 50V360"/><text class="wm" x="768" y="372" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
