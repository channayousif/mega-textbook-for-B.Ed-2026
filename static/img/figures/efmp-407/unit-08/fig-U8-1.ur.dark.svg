<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے پائیداری کے منصوبے کے چکر کا بہاؤ چارٹ</title><desc id="d">بہاؤ چارٹ جو اسکول کے پائیداری کے منصوبے کے چکر کے چھ مراحل دکھاتا ہے: ضرورت کی نشاندہی، منصوبے کی تیاری، عمل کرنا، پیش رفت کی نگرانی، نتائج کی رپورٹنگ، اور غور و فکر اور بہتری۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="756" y="32" direction="rtl" text-anchor="start">8.1 اسکول کے پائیداری کے منصوبے کے چھ مراحل</text><rect class="panel-a" x="270" y="52" width="240" height="66" rx="8"/><text class="row" x="390" y="77" direction="rtl" text-anchor="middle">1۔ ضرورت کی نشاندہی</text><text class="small" x="390" y="106" direction="rtl" text-anchor="middle">اسکول کی مقامی ضروریات کی چھان بین</text><rect class="panel" x="24" y="140" width="236" height="66" rx="8"/><text class="row" x="142" y="165" direction="rtl" text-anchor="middle">2۔ منصوبے کی تیاری</text><text class="small" x="142" y="194" direction="rtl" text-anchor="middle">مقاصد، کردار، بجٹ اور علامات طے کرنا</text><rect class="panel" x="24" y="260" width="236" height="66" rx="8"/><text class="row" x="142" y="285" direction="rtl" text-anchor="middle">3۔ عمل کرنا</text><text class="small" x="142" y="314" direction="rtl" text-anchor="middle">مل جل کر کام انجام دینا</text><rect class="panel" x="270" y="344" width="240" height="66" rx="8"/><text class="row" x="390" y="369" direction="rtl" text-anchor="middle">4۔ پیش رفت کی نگرانی</text><text class="small" x="390" y="398" direction="rtl" text-anchor="middle">اشاریوں پر نظر، اعداد و شمار جمع کرنا</text><rect class="panel" x="520" y="260" width="236" height="66" rx="8"/><text class="row" x="638" y="285" direction="rtl" text-anchor="middle">5۔ نتائج کی رپورٹنگ</text><text class="small" x="638" y="314" direction="rtl" text-anchor="middle">SMC اور برادری کو نتائج بتانا</text><rect class="panel" x="520" y="140" width="236" height="66" rx="8"/><text class="row" x="638" y="165" direction="rtl" text-anchor="middle">6۔ غور و فکر اور بہتری</text><text class="small" x="638" y="194" direction="rtl" text-anchor="middle">اسباق جانچنا، فوائد قائم رکھنا</text><path class="stroke" d="M290 118 Q230 120 210 140" marker-end="url(#arrow)"/><path class="stroke" d="M142 206 L142 254" marker-end="url(#arrow)"/><path class="stroke" d="M210 326 Q230 350 290 355" marker-end="url(#arrow)"/><path class="stroke" d="M490 355 Q550 350 570 326" marker-end="url(#arrow)"/><path class="stroke" d="M638 260 L638 212" marker-end="url(#arrow)"/><path class="stroke" d="M570 140 Q550 120 490 118" marker-end="url(#arrow)"/><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>