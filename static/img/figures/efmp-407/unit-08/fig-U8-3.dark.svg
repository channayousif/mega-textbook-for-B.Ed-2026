<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of school and community sustainability partnerships</title><desc id="d">Diagram showing the school at the centre connected by two-way partnerships to parents and the SMC, local councils, community elders, local businesses, and NGOs.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="24" y="32">8.2 School at the centre of community partnerships</text><rect class="panel" x="24" y="60" width="224" height="70" rx="8"/><text class="row" x="136" y="86" text-anchor="middle">Parents and SMC</text><text class="small" x="136" y="106" text-anchor="middle">oversight, planning and support</text><rect class="panel" x="532" y="60" width="224" height="70" rx="8"/><text class="row" x="644" y="86" text-anchor="middle">Local Union Council</text><text class="small" x="644" y="106" text-anchor="middle">civic links, water and waste</text><rect class="panel-a" x="265" y="185" width="250" height="80" rx="10"/><text class="h" x="390" y="218" text-anchor="middle">School, pupils and<tspan x="390" dy="20">teachers</tspan></text><text class="small" x="390" y="252" text-anchor="middle">investigation and action hub</text><rect class="panel" x="24" y="330" width="224" height="70" rx="8"/><text class="row" x="136" y="356" text-anchor="middle">Mosque and elders</text><text class="small" x="136" y="376" text-anchor="middle">moral trust, guidance and outreach</text><rect class="panel" x="278" y="330" width="224" height="70" rx="8"/><text class="row" x="390" y="356" text-anchor="middle">Growers and shops</text><text class="small" x="390" y="376" text-anchor="middle">seeds, tools and practical advice</text><rect class="panel" x="532" y="330" width="224" height="70" rx="8"/><text class="row" x="644" y="356" text-anchor="middle">NGOs and civil groups</text><text class="small" x="644" y="376" text-anchor="middle">training, kits and advocacy</text><line class="stroke" x1="270" y1="190" x2="200" y2="135" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="510" y1="190" x2="580" y2="135" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="270" y1="260" x2="200" y2="325" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="390" y1="270" x2="390" y2="325" marker-end="url(#arrow)"/><line class="stroke" x1="510" y1="260" x2="580" y2="325" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="wm" x="768" y="426" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
