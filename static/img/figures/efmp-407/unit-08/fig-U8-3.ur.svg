<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول اور برادری کی پائیداری کی شراکتوں کا خاکہ</title><desc id="d">خاکہ جس کے مرکز میں اسکول ہے، اور وہ دو طرفہ شراکت کے ذریعے والدین اور SMC، مقامی کونسلوں، برادری کے بزرگوں، مقامی کاروباروں اور غیر سرکاری تنظیموں (NGOs) سے جڑا ہوا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="756" y="32" direction="rtl" text-anchor="start">8.2 برادری کی شراکتوں کے مرکز میں اسکول</text><rect class="panel" x="24" y="60" width="224" height="70" rx="8"/><text class="row" x="136" y="88" direction="rtl" text-anchor="middle">مقامی یونین کونسل</text><text class="small" x="136" y="116" direction="rtl" text-anchor="middle">شہری روابط، پانی اور کچرا</text><rect class="panel" x="532" y="60" width="224" height="70" rx="8"/><text class="row" x="644" y="88" direction="rtl" text-anchor="middle">والدین اور SMC</text><text class="small" x="644" y="116" direction="rtl" text-anchor="middle">نگرانی، منصوبہ بندی اور مدد</text><rect class="panel-a" x="265" y="185" width="250" height="80" rx="10"/><text class="h" x="390" y="215" direction="rtl" text-anchor="middle">اسکول، بچے اور اساتذہ</text><text class="small" x="390" y="247" direction="rtl" text-anchor="middle">تحقیق اور عمل کا مرکز</text><rect class="panel" x="24" y="330" width="224" height="70" rx="8"/><text class="row" x="136" y="358" direction="rtl" text-anchor="middle">NGOs اور شہری تنظیمیں</text><text class="small" x="136" y="386" direction="rtl" text-anchor="middle">تربیت، سامان اور وکالت</text><rect class="panel" x="278" y="330" width="224" height="70" rx="8"/><text class="row" x="390" y="358" direction="rtl" text-anchor="middle">کاشتکار اور دکاندار</text><text class="small" x="390" y="386" direction="rtl" text-anchor="middle">بیج، اوزار اور عملی مشورہ</text><rect class="panel" x="532" y="330" width="224" height="70" rx="8"/><text class="row" x="644" y="358" direction="rtl" text-anchor="middle">مسجد اور بزرگ</text><text class="small" x="644" y="386" direction="rtl" text-anchor="middle">اخلاقی اعتماد، رہنمائی اور رابطہ</text><line class="stroke" x1="270" y1="190" x2="200" y2="135" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="510" y1="190" x2="580" y2="135" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="270" y1="260" x2="200" y2="325" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="390" y1="270" x2="390" y2="325" marker-end="url(#arrow)"/><line class="stroke" x1="510" y1="260" x2="580" y2="325" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="wm" x="768" y="426" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>