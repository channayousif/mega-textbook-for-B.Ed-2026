<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے پائیداری کے منصوبوں کے لیے رپورٹنگ کی صورتوں کا موازنہ</title><desc id="d">جدول جو رپورٹنگ کی چار صورتوں - بصری نوٹس بورڈ، صبح کی اسمبلی، مختصر تحریری خلاصہ اور برادری کا کھلا اجلاس - کا سامعین، مواد اور تعدد کے لحاظ سے موازنہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .row { font-size: 13px; } .ink { font-size: 13px; }</style><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="756" y="32" direction="rtl" text-anchor="start">8.2 رپورٹنگ کی صورتیں اور سامعین</text><rect class="panel" x="24" y="50" width="732" height="50"/><text class="h" x="748" y="82" direction="rtl" text-anchor="start">صورت</text><text class="h" x="592" y="82" direction="rtl" text-anchor="start">سامعین</text><text class="h" x="422" y="82" direction="rtl" text-anchor="start">اہم مواد</text><text class="h" x="182" y="82" direction="rtl" text-anchor="start">تعدد</text><rect class="panel" x="24" y="100" width="732" height="80"/><text class="row" x="748" y="126" direction="rtl" text-anchor="start">بصری نوٹس<tspan x="748" dy="32">بورڈ</tspan></text><text class="ink" x="592" y="126" direction="rtl" text-anchor="start">بچے، اساتذہ اور<tspan x="592" dy="32">روزانہ آنے والے</tspan></text><text class="ink" x="422" y="126" direction="rtl" text-anchor="start">تصویری چارٹ، ہفتہ وار پانی<tspan x="422" dy="32">کی بچت اور ڈیوٹی فہرستیں</tspan></text><text class="ink" x="182" y="145" direction="rtl" text-anchor="start">ہر ہفتے تازہ</text><rect class="panel" x="24" y="180" width="732" height="80"/><text class="row" x="748" y="206" direction="rtl" text-anchor="start">صبح کی اسمبلی<tspan x="748" dy="32">میں گفتگو</tspan></text><text class="ink" x="592" y="206" direction="rtl" text-anchor="start">اسکول کی تمام جماعتیں<tspan x="592" dy="32">اور عملہ</tspan></text><text class="ink" x="422" y="206" direction="rtl" text-anchor="start">بچوں کی مختصر تقریریں، خاکے<tspan x="422" dy="32">اور سنگِ میل کا جشن</tspan></text><text class="ink" x="182" y="206" direction="rtl" text-anchor="start">ماہانہ یا اہم<tspan x="182" dy="32">سنگِ میل پر</tspan></text><rect class="panel" x="24" y="260" width="732" height="80"/><text class="row" x="748" y="286" direction="rtl" text-anchor="start">منصوبے کا مختصر<tspan x="748" dy="32">تحریری خلاصہ</tspan></text><text class="ink" x="592" y="286" direction="rtl" text-anchor="start">ہیڈ ٹیچر، SMC ارکان<tspan x="592" dy="32">اور ضلعی افسران</tspan></text><text class="ink" x="422" y="286" direction="rtl" text-anchor="start">مقاصد، استعمال شدہ وسائل، پیمانوں<tspan x="422" dy="32">اور اگلے اقدامات کا خلاصہ</tspan></text><text class="ink" x="182" y="286" direction="rtl" text-anchor="start">تعلیمی دورانیے یا<tspan x="182" dy="32">مرحلے کے اختتام پر</tspan></text><rect class="panel" x="24" y="340" width="732" height="80"/><text class="row" x="748" y="366" direction="rtl" text-anchor="start">برادری کے<tspan x="748" dy="32">اجلاس کا دن</tspan></text><text class="ink" x="592" y="366" direction="rtl" text-anchor="start">والدین، بزرگ<tspan x="592" dy="32">اور پڑوسی</tspan></text><text class="ink" x="422" y="366" direction="rtl" text-anchor="start">بچوں کے کام کی نمائش،<tspan x="422" dy="32">کھلی گفتگو اور شکریہ</tspan></text><text class="ink" x="182" y="366" direction="rtl" text-anchor="start">منصوبے کے ہر چکر<tspan x="182" dy="32">میں ایک یا دو بار</tspan></text><path class="link" d="M600 50V420 M430 50V420 M190 50V420 M24 50V420"/><text class="wm" x="768" y="432" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>