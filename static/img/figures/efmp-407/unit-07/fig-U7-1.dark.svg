<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Selected policy and teacher education milestones</title><desc id="d">Three dated milestones distinguish international teacher education guidance in 2005, a Pakistani environmental education policy intention in 2009 and a Pakistani teacher education research agenda in 2015.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="35" text-anchor="start">Selected milestones: different kinds of evidence</text><path class="line" d="M75,90 L75,365"/><circle cx="75" cy="97" r="7" class="ah"/><text class="small" x="25" y="140" text-anchor="start">2005</text><rect class="panel" x="115" y="75" width="630" height="85" rx="8"/><text x="135" y="105" text-anchor="start">UNESCO guidance</text><text x="135" y="130" text-anchor="start">International teacher education recommendations</text><circle cx="75" cy="202" r="7" class="ah"/><text class="small" x="25" y="245" text-anchor="start">2009</text><rect class="panel" x="115" y="180" width="630" height="85" rx="8"/><text x="135" y="210" text-anchor="start">Pakistan National Education Policy</text><text x="135" y="235" text-anchor="start">Historical environmental-learning intention</text><circle cx="75" cy="307" r="7" class="ah"/><text class="small" x="25" y="350" text-anchor="start">2015</text><rect class="panel" x="115" y="285" width="630" height="85" rx="8"/><text x="135" y="315" text-anchor="start">Jumani and Abbasi</text><text x="135" y="340" text-anchor="start">Pakistani teacher education research agenda</text><text class="small" x="24" y="415" text-anchor="start">Dates show sequence, not proof of a continuous programme.</text><text class="wm" x="768" y="458" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
