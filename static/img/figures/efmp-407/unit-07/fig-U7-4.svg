<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 585" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Teacher education: directions and local actions</title><desc id="d">Teacher preparation directions are paired with feasible trainee actions, while recommendations and proposed local practice are clearly separated from claims about existing nationwide programmes.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="585"/><text class="h" x="24" y="35" text-anchor="start">Teacher education: directions and local actions</text><rect class="accent" x="24" y="60" width="233" height="50" rx="8"/><text class="h" x="36" y="91" text-anchor="start">Direction</text><rect class="accent" x="257" y="60" width="233" height="50" rx="8"/><text class="h" x="269" y="91" text-anchor="start">B.Ed action</text><rect class="accent" x="490" y="60" width="233" height="50" rx="8"/><text class="h" x="502" y="91" text-anchor="start">Evidence to inspect</text><rect class="panel" x="24" y="110" width="233" height="125" rx="8"/><text x="36" y="140" text-anchor="start">Connect institutional</text><text x="36" y="165" text-anchor="start">learning and practice</text><rect class="panel" x="257" y="110" width="233" height="125" rx="8"/><text x="269" y="140" text-anchor="start">Align an outcome,</text><text x="269" y="165" text-anchor="start">task and assessment</text><rect class="panel" x="490" y="110" width="233" height="125" rx="8"/><text x="502" y="140" text-anchor="start">Lesson plan with</text><text x="502" y="165" text-anchor="start">a clear connection</text><rect class="panel" x="24" y="235" width="233" height="125" rx="8"/><text x="36" y="265" text-anchor="start">Use partnerships</text><text x="36" y="290" text-anchor="start">and support</text><rect class="panel" x="257" y="235" width="233" height="125" rx="8"/><text x="269" y="265" text-anchor="start">Rehearse and seek</text><text x="269" y="290" text-anchor="start">mentor feedback</text><rect class="panel" x="490" y="235" width="233" height="125" rx="8"/><text x="502" y="265" text-anchor="start">Observed questions</text><text x="502" y="290" text-anchor="start">and revision notes</text><rect class="panel" x="24" y="360" width="233" height="125" rx="8"/><text x="36" y="390" text-anchor="start">Prepare deliberately,</text><text x="36" y="415" text-anchor="start">beyond isolated</text><text x="36" y="440" text-anchor="start">activities</text><rect class="panel" x="257" y="360" width="233" height="125" rx="8"/><text x="269" y="390" text-anchor="start">Revise after</text><text x="269" y="415" text-anchor="start">checking reasons</text><rect class="panel" x="490" y="360" width="233" height="125" rx="8"/><text x="502" y="390" text-anchor="start">Before-and-after</text><text x="502" y="415" text-anchor="start">task responses</text><text class="small" x="24" y="520" text-anchor="start">Directions: UNESCO (2005); deliberate preparation: Jumani and Abbasi (2015).</text><text class="small" x="24" y="545" text-anchor="start">B.Ed actions are proposals, not verified nationwide programmes.</text><text class="wm" x="768" y="573" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
