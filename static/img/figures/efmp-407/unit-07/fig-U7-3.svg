<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Policy and classroom supports with feedback</title><desc id="d">Policy, curriculum, textbook tasks, teacher preparation and classroom learning are linked, with pupil work feeding back into materials and preparation rather than guaranteeing automatic implementation.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><text class="h" x="24" y="35" text-anchor="start">Policy needs connected classroom supports</text><rect class="panel" x="255" y="65" width="270" height="60" rx="8"/><text x="390" y="101" text-anchor="middle">Policy aims</text><path class="line" d="M390,125 L390,151" marker-end="url(#arrow)"/><rect class="panel" x="255" y="155" width="270" height="60" rx="8"/><text x="390" y="191" text-anchor="middle">Curriculum outcomes</text><path class="line" d="M390,215 L390,241" marker-end="url(#arrow)"/><rect class="panel" x="255" y="245" width="270" height="60" rx="8"/><text x="390" y="281" text-anchor="middle">Textbook tasks</text><path class="line" d="M390,305 L390,331" marker-end="url(#arrow)"/><rect class="panel" x="255" y="335" width="270" height="60" rx="8"/><text x="390" y="371" text-anchor="middle">Teacher preparation</text><path class="line" d="M390,395 L390,421" marker-end="url(#arrow)"/><rect class="panel" x="255" y="425" width="270" height="60" rx="8"/><text x="390" y="461" text-anchor="middle">Classroom learning</text><path class="line" d="M525,455 L700,455 L700,275 L530,275" marker-end="url(#arrow)"/><path class="line" d="M700,365 L530,365" marker-end="url(#arrow)"/><text class="small" x="24" y="290" text-anchor="start">Pupil work</text><text class="small" x="24" y="315" text-anchor="start">informs revision</text><text class="small" x="24" y="535" text-anchor="start">Arrows show links to examine, not automatic implementation.</text><text class="wm" x="768" y="578" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
