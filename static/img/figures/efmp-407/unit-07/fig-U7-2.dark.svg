<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 585" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From intention to evidence</title><desc id="d">A table links policy and teacher preparation intentions with possible school evidence and warns that posters, attendance and a proposed study do not establish learning or nationwide implementation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="585"/><text class="h" x="24" y="35" text-anchor="start">From intention to evidence</text><rect class="accent" x="24" y="60" width="233" height="50" rx="8"/><text class="h" x="36" y="91" text-anchor="start">Intention</text><rect class="accent" x="257" y="60" width="233" height="50" rx="8"/><text class="h" x="269" y="91" text-anchor="start">Possible evidence</text><rect class="accent" x="490" y="60" width="233" height="50" rx="8"/><text class="h" x="502" y="91" text-anchor="start">Limit of claim</text><rect class="panel" x="24" y="110" width="233" height="125" rx="8"/><text x="36" y="140" text-anchor="start">Environmental</text><text x="36" y="165" text-anchor="start">learning (2009)</text><rect class="panel" x="257" y="110" width="233" height="125" rx="8"/><text x="269" y="140" text-anchor="start">Pupils explain</text><text x="269" y="165" text-anchor="start">water-use choices</text><rect class="panel" x="490" y="110" width="233" height="125" rx="8"/><text x="502" y="140" text-anchor="start">A poster alone</text><text x="502" y="165" text-anchor="start">does not show</text><text x="502" y="190" text-anchor="start">understanding</text><rect class="panel" x="24" y="235" width="233" height="125" rx="8"/><text x="36" y="265" text-anchor="start">Rights and</text><text x="36" y="290" text-anchor="start">inclusion (2009)</text><rect class="panel" x="257" y="235" width="233" height="125" rx="8"/><text x="269" y="265" text-anchor="start">Task includes</text><text x="269" y="290" text-anchor="start">different access</text><text x="269" y="315" text-anchor="start">needs</text><rect class="panel" x="490" y="235" width="233" height="125" rx="8"/><text x="502" y="265" text-anchor="start">A plan alone</text><text x="502" y="290" text-anchor="start">does not show</text><text x="502" y="315" text-anchor="start">participation</text><rect class="panel" x="24" y="360" width="233" height="125" rx="8"/><text x="36" y="390" text-anchor="start">Planned teacher</text><text x="36" y="415" text-anchor="start">preparation (2015</text><text x="36" y="440" text-anchor="start">research agenda)</text><rect class="panel" x="257" y="360" width="233" height="125" rx="8"/><text x="269" y="390" text-anchor="start">Rehearsal and</text><text x="269" y="415" text-anchor="start">mentor feedback</text><rect class="panel" x="490" y="360" width="233" height="125" rx="8"/><text x="502" y="390" text-anchor="start">Proposed study,</text><text x="502" y="415" text-anchor="start">not nationwide</text><text x="502" y="440" text-anchor="start">findings</text><text class="small" x="24" y="520" text-anchor="start">2009: national policy; 2015: Jumani and Abbasi.</text><text class="small" x="24" y="545" text-anchor="start">Evidence examples are proposed checks, not reported school findings.</text><text class="wm" x="768" y="573" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
