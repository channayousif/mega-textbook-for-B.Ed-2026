<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of what sustainable development means</title><desc id="d">Concept map with sustainable development at the centre, linked to needs, with the essential needs of the poor first, to limits on what technology, society and nature can bear, and to the present and future generations, with the present generation leaving future generations able to meet their own needs.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } .c1 { fill: var(--a1-fill); fill-opacity: 0.55; stroke: var(--a1); stroke-width: 2.5; } .c2 { fill: var(--a2-fill); fill-opacity: 0.55; stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 10 5; } .c3 { fill: var(--a3-fill); fill-opacity: 0.55; stroke: var(--a3); stroke-width: 2.5; stroke-dasharray: 3 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="410"/><text class="h" x="24" y="32">1.1 What sustainable development means</text><rect class="panel" x="24" y="54" width="270" height="88" rx="8"/><text class="row" x="159" y="78" text-anchor="middle">needs</text><text class="ink" x="159" y="98" text-anchor="middle">essential needs of the poor<tspan x="159" dy="17">first</tspan></text><rect class="panel" x="486" y="54" width="270" height="88" rx="8"/><text class="row" x="621" y="78" text-anchor="middle">limits</text><text class="ink" x="621" y="98" text-anchor="middle">what technology, society and<tspan x="621" dy="17">nature can bear</tspan></text><rect class="panel-a" x="280" y="182" width="220" height="70" rx="28"/><text class="h" x="390" y="212" text-anchor="middle">sustainable<tspan x="390" dy="20">development</tspan></text><rect class="panel" x="24" y="312" width="240" height="46" rx="8"/><text class="row" x="144" y="336" text-anchor="middle">present generation</text><rect class="panel" x="516" y="312" width="240" height="46" rx="8"/><text class="row" x="636" y="336" text-anchor="middle">future generations</text><line class="stroke" x1="300" y1="182" x2="220" y2="144" marker-end="url(#arrow)"/><line class="stroke" x1="480" y1="182" x2="560" y2="144" marker-end="url(#arrow)"/><line class="stroke" x1="320" y1="252" x2="210" y2="310" marker-end="url(#arrow)"/><line class="stroke" x1="460" y1="252" x2="570" y2="310" marker-end="url(#arrow)"/><line class="stroke" x1="266" y1="335" x2="514" y2="335" marker-end="url(#arrow)"/><text class="small" x="164" y="172" text-anchor="middle">puts first</text><text class="small" x="616" y="172" text-anchor="middle">stays within</text><text class="small" x="196" y="276" text-anchor="middle">serves now</text><text class="small" x="586" y="276" text-anchor="middle">serves later</text><text class="small" x="390" y="358" text-anchor="middle">leave them able to<tspan x="390" dy="17">meet their needs</tspan></text><text class="wm" x="768" y="400" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
