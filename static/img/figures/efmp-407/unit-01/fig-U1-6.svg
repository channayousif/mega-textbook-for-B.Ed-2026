<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 375" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of one Pakistani example for each dimension</title><desc id="d">Table giving one Pakistani example for each dimension and what goes wrong when it is ignored: the Indus Delta for the environmental dimension, the 2022 floods for the economic dimension, and the Diamer Basha Dam for the social dimension.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } .c1 { fill: var(--a1-fill); fill-opacity: 0.55; stroke: var(--a1); stroke-width: 2.5; } .c2 { fill: var(--a2-fill); fill-opacity: 0.55; stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 10 5; } .c3 { fill: var(--a3-fill); fill-opacity: 0.55; stroke: var(--a3); stroke-width: 2.5; stroke-dasharray: 3 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="375"/><text class="h" x="24" y="32">1.3 What goes wrong when a dimension is ignored</text><rect class="panel" x="24" y="54" width="732" height="62"/><text class="h" x="32" y="78">Dimension</text><text class="h" x="178" y="78">Pakistani example</text><text class="h" x="460" y="78">What goes wrong when it is<tspan x="460" dy="17">ignored</tspan></text><rect class="panel" x="24" y="116" width="146" height="75"/><text class="row" x="32" y="140">Environmental</text><text class="ink" x="178" y="140">Indus Delta: falling freshwater<tspan x="178" dy="17">flows below Kotri Barrage</tspan></text><text class="ink" x="460" y="140">sea moves up the river, mangrove<tspan x="460" dy="17">species are lost, fish catches</tspan><tspan x="460" dy="17">fall</tspan></text><rect class="panel" x="24" y="191" width="146" height="92"/><text class="row" x="32" y="215">Economic</text><text class="ink" x="178" y="215">2022 floods: damage above USD<tspan x="178" dy="17">14.9 billion, losses about USD</tspan><tspan x="178" dy="17">15.2 billion</tspan></text><text class="ink" x="460" y="215">building without counting flood<tspan x="460" dy="17">risk means paying again;</tspan><tspan x="460" dy="17">reconstruction needs above USD 16</tspan><tspan x="460" dy="17">billion</tspan></text><rect class="panel" x="24" y="283" width="146" height="58"/><text class="row" x="32" y="307">Social</text><text class="ink" x="178" y="307">Diamer Basha Dam: 31 villages<tspan x="178" dy="17">and 28,650 people affected</tspan></text><text class="ink" x="460" y="307">long delays harm the people<tspan x="460" dy="17">waiting to be moved</tspan></text><path class="link" d="M170 54V341 M452 54V341 M756 54V341 M170 191H756 M170 283H756 M170 341H756 "/><text class="wm" x="768" y="365" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
