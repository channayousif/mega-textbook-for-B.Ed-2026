<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 346" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of three milestones in sustainable development</title><desc id="d">Timeline of three milestones: the 1972 Stockholm Conference made the environment a world issue and created UNEP, the 1987 Brundtland Report defined sustainable development through needs and limits, and Rio+20 in 2012 began the process that led to the Sustainable Development Goals, looking back to the 1992 Earth Summit.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } .c1 { fill: var(--a1-fill); fill-opacity: 0.55; stroke: var(--a1); stroke-width: 2.5; } .c2 { fill: var(--a2-fill); fill-opacity: 0.55; stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 10 5; } .c3 { fill: var(--a3-fill); fill-opacity: 0.55; stroke: var(--a3); stroke-width: 2.5; stroke-dasharray: 3 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="346"/><text class="h" x="24" y="32">1.2 Three milestones</text><line class="stroke" x1="24" y1="130" x2="756" y2="130" marker-end="url(#arrow)"/><circle class="panel-a" cx="139" cy="130" r="9"/><text class="h" x="139" y="110" text-anchor="middle">1972</text><rect class="panel" x="24" y="162" width="230" height="134"/><text class="row" x="139" y="188" text-anchor="middle">Stockholm Conference</text><text class="ink" x="139" y="217" text-anchor="middle">the environment becomes a<tspan x="139" dy="17">world issue; UNEP created</tspan></text><circle class="panel-a" cx="390" cy="130" r="9"/><text class="h" x="390" y="110" text-anchor="middle">1987</text><rect class="panel" x="275" y="162" width="230" height="134"/><text class="row" x="390" y="188" text-anchor="middle">Brundtland Report, Our<tspan x="390" dy="17">Common Future</tspan></text><text class="ink" x="390" y="234" text-anchor="middle">sustainable development<tspan x="390" dy="17">defined; needs and limits</tspan></text><circle class="panel-a" cx="641" cy="130" r="9"/><text class="h" x="641" y="110" text-anchor="middle">2012</text><rect class="panel" x="526" y="162" width="230" height="134"/><text class="row" x="641" y="188" text-anchor="middle">Rio+20, The Future We<tspan x="641" dy="17">Want</tspan></text><text class="ink" x="641" y="234" text-anchor="middle">process to develop the<tspan x="641" dy="17">Sustainable Development</tspan><tspan x="641" dy="17">Goals; education</tspan><tspan x="641" dy="17">commitment</tspan></text><line class="dash" x1="515" y1="112" x2="515" y2="148"/><text class="small" x="515" y="54" text-anchor="middle">1992 Earth Summit,<tspan x="515" dy="17">the meeting Rio+20</tspan><tspan x="515" dy="17">looks back to</tspan></text><text class="wm" x="768" y="336" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
