<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the three overlapping dimensions of sustainability</title><desc id="d">Diagram of three overlapping circles for the environmental, economic and social dimensions of sustainability, with sustainable development in the central area where all three circles meet.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } .c1 { fill: var(--a1-fill); fill-opacity: 0.55; stroke: var(--a1); stroke-width: 2.5; } .c2 { fill: var(--a2-fill); fill-opacity: 0.55; stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 10 5; } .c3 { fill: var(--a3-fill); fill-opacity: 0.55; stroke: var(--a3); stroke-width: 2.5; stroke-dasharray: 3 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="24" y="32">1.3 The three dimensions</text><circle class="c1" cx="390" cy="190" r="140"/><circle class="c2" cx="300" cy="345" r="140"/><circle class="c3" cx="480" cy="345" r="140"/><text class="row" x="390" y="92" text-anchor="middle">environmental</text><text class="ink" x="390" y="112" text-anchor="middle">care for land, water,<tspan x="390" dy="17">air and living things</tspan></text><text class="row" x="248" y="370" text-anchor="middle">economic</text><text class="ink" x="248" y="390" text-anchor="middle">livelihoods and<tspan x="248" dy="17">costs people can</tspan><tspan x="248" dy="17">carry over time</tspan></text><text class="row" x="524" y="370" text-anchor="middle">social</text><text class="ink" x="524" y="390" text-anchor="middle">fairness, health,<tspan x="524" dy="17">education and a</tspan><tspan x="524" dy="17">voice in decisions</tspan></text><text class="row" x="390" y="276" text-anchor="middle">sustainable<tspan x="390" dy="17">development</tspan></text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
