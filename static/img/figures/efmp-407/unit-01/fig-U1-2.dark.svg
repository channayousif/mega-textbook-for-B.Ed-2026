<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 375" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing three definitions of sustainable development</title><desc id="d">Table comparing three definitions of sustainable development: the 1980 World Conservation Strategy stresses conservation as part of development, the 1987 report Our Common Future stresses needs, limits and future generations, and the 1991 Caring for the Earth stresses people together with conservation.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } .c1 { fill: var(--a1-fill); fill-opacity: 0.55; stroke: var(--a1); stroke-width: 2.5; } .c2 { fill: var(--a2-fill); fill-opacity: 0.55; stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 10 5; } .c3 { fill: var(--a3-fill); fill-opacity: 0.55; stroke: var(--a3); stroke-width: 2.5; stroke-dasharray: 3 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="375"/><text class="h" x="24" y="32">1.1 Three definitions, three emphases</text><rect class="panel" x="24" y="54" width="732" height="62"/><text class="h" x="32" y="78">Source</text><text class="h" x="252" y="78">What it says (short<tspan x="252" dy="17">form)</tspan></text><text class="h" x="532" y="78">What it emphasises</text><rect class="panel" x="24" y="116" width="220" height="75"/><text class="row" x="32" y="140">World Conservation<tspan x="32" dy="17">Strategy (IUCN, UNEP</tspan><tspan x="32" dy="17">and WWF, 1980)</tspan></text><text class="ink" x="252" y="140">takes account of social and<tspan x="252" dy="17">ecological factors, as well as</tspan><tspan x="252" dy="17">economic ones</tspan></text><text class="ink" x="532" y="140">conservation must be part<tspan x="532" dy="17">of development</tspan></text><rect class="panel" x="24" y="191" width="220" height="75"/><text class="row" x="32" y="215">Our Common Future<tspan x="32" dy="17">(WCED, 1987)</tspan></text><text class="ink" x="252" y="215">meets present needs without<tspan x="252" dy="17">harming the ability of future</tspan><tspan x="252" dy="17">generations to meet theirs</tspan></text><text class="ink" x="532" y="215">needs of the poor,<tspan x="532" dy="17">limits, fairness between</tspan><tspan x="532" dy="17">generations</tspan></text><rect class="panel" x="24" y="266" width="220" height="75"/><text class="row" x="32" y="290">Caring for the Earth<tspan x="32" dy="17">(IUCN, UNEP and WWF,</tspan><tspan x="32" dy="17">1991)</tspan></text><text class="ink" x="252" y="290">both people-centred and<tspan x="252" dy="17">conservation-based</tspan></text><text class="ink" x="532" y="290">people's quality of life<tspan x="532" dy="17">together with care for</tspan><tspan x="532" dy="17">nature</tspan></text><path class="link" d="M244 54V341 M524 54V341 M756 54V341 M244 191H756 M244 266H756 M244 341H756 "/><text class="wm" x="768" y="365" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
