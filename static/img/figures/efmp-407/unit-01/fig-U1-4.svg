<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 426" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing the three milestones</title><desc id="d">Table comparing the 1972 Stockholm Conference, the 1987 Brundtland Report and Rio+20 in 2012 on who met or worked, what was agreed or added, and what each means for schools, and noting that the Brundtland Report came from a commission, not a conference.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 4; } .c1 { fill: var(--a1-fill); fill-opacity: 0.55; stroke: var(--a1); stroke-width: 2.5; } .c2 { fill: var(--a2-fill); fill-opacity: 0.55; stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 10 5; } .c3 { fill: var(--a3-fill); fill-opacity: 0.55; stroke: var(--a3); stroke-width: 2.5; stroke-dasharray: 3 4; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="426"/><text class="h" x="24" y="32">1.2 The milestones compared</text><rect class="panel" x="24" y="54" width="732" height="62"/><text class="h" x="32" y="78">Milestone</text><text class="h" x="156" y="78">Who met or<tspan x="156" dy="17">worked</tspan></text><text class="h" x="352" y="78">What was agreed<tspan x="352" dy="17">or added</tspan></text><text class="h" x="544" y="78">What it means for<tspan x="544" dy="17">schools</tspan></text><rect class="panel" x="24" y="116" width="124" height="92"/><text class="row" x="32" y="140">Stockholm<tspan x="32" dy="17">Conference,</tspan><tspan x="32" dy="17">1972</tspan></text><text class="ink" x="156" y="140">representatives of<tspan x="156" dy="17">113 UN member states</tspan><tspan x="156" dy="17">at a conference</tspan></text><text class="ink" x="352" y="140">Declaration of 26<tspan x="352" dy="17">principles, Action</tspan><tspan x="352" dy="17">Plan, UNEP</tspan></text><text class="ink" x="544" y="140">Principle 19:<tspan x="544" dy="17">environmental education</tspan><tspan x="544" dy="17">for young people and</tspan><tspan x="544" dy="17">adults</tspan></text><rect class="panel" x="24" y="208" width="124" height="109"/><text class="row" x="32" y="232">Brundtland<tspan x="32" dy="17">Report,</tspan><tspan x="32" dy="17">1987</tspan></text><text class="ink" x="156" y="232">an independent<tspan x="156" dy="17">commission, not a</tspan><tspan x="156" dy="17">conference; public</tspan><tspan x="156" dy="17">hearings on five</tspan><tspan x="156" dy="17">continents</tspan></text><text class="ink" x="352" y="232">the definition:<tspan x="352" dy="17">needs and limits</tspan></text><text class="ink" x="544" y="232">teach fairness between<tspan x="544" dy="17">generations and links</tspan><tspan x="544" dy="17">between poverty and</tspan><tspan x="544" dy="17">environment</tspan></text><rect class="panel" x="24" y="317" width="124" height="75"/><text class="row" x="32" y="341">Rio+20,<tspan x="32" dy="17">2012</tspan></text><text class="ink" x="156" y="341">governments and civil<tspan x="156" dy="17">society at a</tspan><tspan x="156" dy="17">conference</tspan></text><text class="ink" x="352" y="341">The Future We Want;<tspan x="352" dy="17">process to develop</tspan><tspan x="352" dy="17">the goals</tspan></text><text class="ink" x="544" y="341">paragraphs 233 and 234:<tspan x="544" dy="17">ESD, campus practice,</tspan><tspan x="544" dy="17">teaching across subjects</tspan></text><path class="link" d="M148 54V392 M344 54V392 M536 54V392 M756 54V392 M148 208H756 M148 317H756 M148 392H756 "/><text class="wm" x="768" y="416" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
