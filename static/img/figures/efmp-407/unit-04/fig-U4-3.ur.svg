<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 515" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک مجوزہ تقویت دینے والا چکر: نہ اٹھایا گیا پلاسٹک صفائی کا کام بڑھاتا ہے، اس سے کوڑے دان جانچنے کا وقت کم ہوتا ہے اور نہ اٹھایا گیا پلاسٹک مزید بڑھتا ہے۔ اطلاع دینے کی یاد دہانی جانچ میں مدد دے سکتی ہے۔</title><desc id="d">ایک مجوزہ تقویت دینے والا چکر: نہ اٹھایا گیا پلاسٹک صفائی کا کام بڑھاتا ہے، اس سے کوڑے دان جانچنے کا وقت کم ہوتا ہے اور نہ اٹھایا گیا پلاسٹک مزید بڑھتا ہے۔ اطلاع دینے کی یاد دہانی جانچ میں مدد دے سکتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="515" class="bg"/><text x="736" y="35" class="h" text-anchor="end">‏کچرے کا ایک مجوزہ تقویت دینے والا چکر‏</text><rect x="255" y="70" width="250" height="70" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="380" y="110" text-anchor="middle">‏نہ اٹھایا گیا پلاسٹک‏</text><rect x="475" y="235" width="260" height="70" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="155" y="275" text-anchor="middle">‏صفائی کے کام کا بوجھ‏</text><rect x="25" y="235" width="295" height="70" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="587.5" y="275" text-anchor="middle">‏کوڑے دان کی معمول کی جانچ کا وقت‏</text><path d="M505 105 H605 V225" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><text x="70" y="175" class="small" text-anchor="middle">‏مثبت: ایک ہی سمت‏</text><path d="M465 270 H330" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><text x="365" y="250" class="small" text-anchor="middle">‏منفی: مخالف سمت‏</text><path d="M100 235 V105 H245" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><text x="650" y="185" class="small" text-anchor="end">‏منفی: مخالف سمت‏</text><text x="380" y="190" class="sh" text-anchor="middle">‏تقویت دینے والا چکر‏</text><rect x="150" y="355" width="460" height="60" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="380" y="390" text-anchor="middle">‏بچوں کی یاد دہانی: تقریباً بھرے کوڑے دان کی اطلاع دیں‏</text><path d="M170 355 V315" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><text x="736" y="450" class="small" text-anchor="end">‏جانچنے کے لیے مفروضے، ہر اسکول کا ثابت شدہ بیان نہیں۔‏</text><text x="736" y="473" class="small" text-anchor="end">‏کچرا سنبھالنا اور اٹھانا بڑوں کا کام ہے؛ بچے محفوظ طریقے سے اطلاع دے سکتے ہیں۔‏</text><text aria-hidden="true" x="12" y="503" class="wm" text-anchor="start">textbook.com.pk</text></svg>
