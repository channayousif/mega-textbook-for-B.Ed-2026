<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three lenses compare a probable future of recurring litter, possible reliable collection and a preferable future with less waste and fair access, each with a question.</title><desc id="d">Three lenses compare a probable future of recurring litter, possible reliable collection and a preferable future with less waste and fair access, each with a question.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="419" class="bg"/><text x="24" y="35" class="h" text-anchor="start">Three lenses for the gate one year from now</text><rect x="24" y="60" width="145" height="50" class="panel-a"/><text x="36" y="85" class="sh" text-anchor="start">Lens</text><rect x="169" y="60" width="285" height="50" class="panel-a"/><text x="181" y="85" class="sh" text-anchor="start">Conditional future</text><rect x="454" y="60" width="282" height="50" class="panel-a"/><text x="466" y="85" class="sh" text-anchor="start">Classroom question</text><rect x="24" y="110" width="145" height="78" class="panel"/><text x="36" y="135" text-anchor="start">Probable</text><rect x="169" y="110" width="285" height="78" class="panel"/><text x="181" y="135" text-anchor="start">Litter recurs if current</text><text x="181" y="156" text-anchor="start">collection stays unchanged.</text><rect x="454" y="110" width="282" height="78" class="panel"/><text x="466" y="135" text-anchor="start">What suggests this</text><text x="466" y="156" text-anchor="start">pattern will continue?</text><rect x="24" y="188" width="145" height="78" class="panel"/><text x="36" y="213" text-anchor="start">Possible</text><rect x="169" y="188" width="285" height="78" class="panel"/><text x="181" y="213" text-anchor="start">Overflow falls if regular</text><text x="181" y="234" text-anchor="start">adult collection is secured.</text><rect x="454" y="188" width="282" height="78" class="panel"/><text x="466" y="213" text-anchor="start">What would make this</text><text x="466" y="234" text-anchor="start">alternative possible?</text><rect x="24" y="266" width="145" height="78" class="panel"/><text x="36" y="291" text-anchor="start">Preferable</text><rect x="169" y="266" width="285" height="78" class="panel"/><text x="181" y="291" text-anchor="start">Less waste and fair food</text><text x="181" y="312" text-anchor="start">access, with shared support.</text><rect x="454" y="266" width="282" height="78" class="panel"/><text x="466" y="291" text-anchor="start">Whose needs are met,</text><text x="466" y="312" text-anchor="start">and what must change?</text><text x="24" y="389" class="small" text-anchor="start">These lenses can overlap. A preference is not a prediction.</text><text aria-hidden="true" x="748" y="407" class="wm" text-anchor="end">textbook.com.pk</text></svg>
