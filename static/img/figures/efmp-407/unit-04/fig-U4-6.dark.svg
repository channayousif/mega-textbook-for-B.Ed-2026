<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 653" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A Grade 6 paper-use lesson totals 35 minutes: hook 4, model 5, group inquiry 12, discussion 7, individual check 5 and reflection 2.</title><desc id="d">A Grade 6 paper-use lesson totals 35 minutes: hook 4, model 5, group inquiry 12, discussion 7, individual check 5 and reflection 2.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="653" class="bg"/><text x="24" y="35" class="h" text-anchor="start">Grade 6 mathematics: paper-use inquiry</text><rect x="24" y="60" width="145" height="50" class="panel-a"/><text x="36" y="85" class="sh" text-anchor="start">Minutes</text><rect x="169" y="60" width="285" height="50" class="panel-a"/><text x="181" y="85" class="sh" text-anchor="start">Learning step</text><rect x="454" y="60" width="282" height="50" class="panel-a"/><text x="466" y="85" class="sh" text-anchor="start">Evidence / support</text><rect x="24" y="110" width="145" height="78" class="panel"/><text x="36" y="135" text-anchor="start">0-4 (4 min)</text><rect x="169" y="110" width="285" height="78" class="panel"/><text x="181" y="135" text-anchor="start">Hook: when is a blank</text><text x="181" y="156" text-anchor="start">side useful?</text><rect x="454" y="110" width="282" height="78" class="panel"/><text x="466" y="135" text-anchor="start">Hear contrasting reasons.</text><rect x="24" y="188" width="145" height="78" class="panel"/><text x="36" y="213" text-anchor="start">4-9 (5 min)</text><rect x="169" y="188" width="285" height="78" class="panel"/><text x="181" y="213" text-anchor="start">Model: compare two</text><text x="181" y="234" text-anchor="start">weekly paper records.</text><rect x="454" y="188" width="282" height="78" class="panel"/><text x="466" y="213" text-anchor="start">Explain what is counted.</text><rect x="24" y="266" width="145" height="78" class="panel"/><text x="36" y="291" text-anchor="start">9-21 (12 min)</text><rect x="169" y="266" width="285" height="78" class="panel"/><text x="181" y="291" text-anchor="start">Group inquiry: propose</text><text x="181" y="312" text-anchor="start">a feasible paper routine.</text><rect x="454" y="266" width="282" height="78" class="panel"/><text x="466" y="291" text-anchor="start">Use numbers; rotate roles.</text><rect x="24" y="344" width="145" height="78" class="panel"/><text x="36" y="369" text-anchor="start">21-28 (7 min)</text><rect x="169" y="344" width="285" height="78" class="panel"/><text x="181" y="369" text-anchor="start">Discuss fairness, a systems</text><text x="181" y="390" text-anchor="start">link and a possible future.</text><rect x="454" y="344" width="282" height="78" class="panel"/><text x="466" y="369" text-anchor="start">Challenge a hidden</text><text x="466" y="390" text-anchor="start">assumption.</text><rect x="24" y="422" width="145" height="78" class="panel"/><text x="36" y="447" text-anchor="start">28-33 (5 min)</text><rect x="169" y="422" width="285" height="78" class="panel"/><text x="181" y="447" text-anchor="start">Individual check: choice,</text><text x="181" y="468" text-anchor="start">two numbers, limitation.</text><rect x="454" y="422" width="282" height="78" class="panel"/><text x="466" y="447" text-anchor="start">Written or oral reasoning.</text><rect x="24" y="500" width="145" height="78" class="panel"/><text x="36" y="525" text-anchor="start">33-35 (2 min)</text><rect x="169" y="500" width="285" height="78" class="panel"/><text x="181" y="525" text-anchor="start">Recap and note what</text><text x="181" y="546" text-anchor="start">needs checking later.</text><rect x="454" y="500" width="282" height="78" class="panel"/><text x="466" y="525" text-anchor="start">Teacher reviews responses</text><text x="466" y="546" text-anchor="start">to plan the next lesson.</text><text x="24" y="623" class="small" text-anchor="start">Outcome: justify a feasible choice with two numbers and one limitation.</text><text aria-hidden="true" x="748" y="641" class="wm" text-anchor="end">textbook.com.pk</text></svg>
