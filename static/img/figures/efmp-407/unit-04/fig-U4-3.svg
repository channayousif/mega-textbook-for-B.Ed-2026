<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 515" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A proposed reinforcing loop links uncollected plastic to more clean-up work, less time for bin checks and more uncollected plastic. A reporting reminder can support checks.</title><desc id="d">A proposed reinforcing loop links uncollected plastic to more clean-up work, less time for bin checks and more uncollected plastic. A reporting reminder can support checks.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="515" class="bg"/><text x="24" y="35" class="h" text-anchor="start">A proposed reinforcing waste loop</text><rect x="255" y="70" width="250" height="70" rx="8" class="panel-a"/><text x="380.0" y="110" text-anchor="middle">Uncollected plastic</text><rect x="475" y="235" width="260" height="70" rx="8" class="panel-a"/><text x="605.0" y="275" text-anchor="middle">Clean-up workload</text><rect x="25" y="235" width="295" height="70" rx="8" class="panel-a"/><text x="172.5" y="275" text-anchor="middle">Time for routine bin checks</text><path d="M505 105 H605 V225" class="stroke" marker-end="url(#arrow)"/><text x="690" y="175" class="small" text-anchor="middle">+ same direction</text><path d="M465 270 H330" class="stroke" marker-end="url(#arrow)"/><text x="395" y="250" class="small" text-anchor="middle">- opposite</text><path d="M100 235 V105 H245" class="stroke" marker-end="url(#arrow)"/><text x="110" y="185" class="small" text-anchor="start">- opposite</text><text x="380" y="190" class="sh" text-anchor="middle">Reinforcing loop</text><rect x="150" y="355" width="460" height="60" rx="8" class="panel-a"/><text x="380.0" y="390" text-anchor="middle">Pupil reminder: report a nearly full bin</text><path d="M170 355 V315" class="stroke" marker-end="url(#arrow)"/><text x="24" y="450" class="small" text-anchor="start">Assumptions to check, not an established account of every school.</text><text x="24" y="473" class="small" text-anchor="start">Adults handle waste and collection; pupils can report safely.</text><text aria-hidden="true" x="748" y="503" class="wm" text-anchor="end">textbook.com.pk</text></svg>
