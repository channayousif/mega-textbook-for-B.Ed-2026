<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 497" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of projects and inquiry by starting question, immediate purpose, teacher support and typical time.</title><desc id="d">Comparison of projects and inquiry by starting question, immediate purpose, teacher support and typical time.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="497" class="bg"/><text x="24" y="35" class="h" text-anchor="start">Projects and inquiry: related but different</text><rect x="24" y="60" width="145" height="50" class="panel-a"/><text x="36" y="85" class="sh" text-anchor="start">Feature</text><rect x="169" y="60" width="285" height="50" class="panel-a"/><text x="181" y="85" class="sh" text-anchor="start">Project-based learning</text><rect x="454" y="60" width="282" height="50" class="panel-a"/><text x="466" y="85" class="sh" text-anchor="start">Inquiry-based learning</text><rect x="24" y="110" width="145" height="78" class="panel"/><text x="36" y="135" text-anchor="start">Starting point</text><rect x="169" y="110" width="285" height="78" class="panel"/><text x="181" y="135" text-anchor="start">Question linked to</text><text x="181" y="156" text-anchor="start">a purpose or audience</text><rect x="454" y="110" width="282" height="78" class="panel"/><text x="466" y="135" text-anchor="start">Question that can be</text><text x="466" y="156" text-anchor="start">investigated with evidence</text><rect x="24" y="188" width="145" height="78" class="panel"/><text x="36" y="213" text-anchor="start">Immediate result</text><rect x="169" y="188" width="285" height="78" class="panel"/><text x="181" y="213" text-anchor="start">Purposeful product</text><text x="181" y="234" text-anchor="start">or action, with reflection</text><rect x="454" y="188" width="282" height="78" class="panel"/><text x="466" y="213" text-anchor="start">Justified explanation</text><text x="466" y="234" text-anchor="start">with stated limitations</text><rect x="24" y="266" width="145" height="78" class="panel"/><text x="36" y="291" text-anchor="start">Teacher support</text><rect x="169" y="266" width="285" height="78" class="panel"/><text x="181" y="291" text-anchor="start">Model methods, check</text><text x="181" y="312" text-anchor="start">progress, guide reflection</text><rect x="454" y="266" width="282" height="78" class="panel"/><text x="466" y="291" text-anchor="start">Model a method, support</text><text x="466" y="312" text-anchor="start">interpretation, ask why</text><rect x="24" y="344" width="145" height="78" class="panel"/><text x="36" y="369" text-anchor="start">Typical time</text><rect x="169" y="344" width="285" height="78" class="panel"/><text x="181" y="369" text-anchor="start">Several lessons or longer;</text><text x="181" y="390" text-anchor="start">includes inquiry and action</text><rect x="454" y="344" width="282" height="78" class="panel"/><text x="466" y="369" text-anchor="start">Can fit a short lesson</text><text x="466" y="390" text-anchor="start">or extend over time</text><text aria-hidden="true" x="748" y="485" class="wm" text-anchor="end">textbook.com.pk</text></svg>
