<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 653" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعت 6 کا کاغذ کے استعمال کا سبق کل 35 منٹ کا ہے: آغازی سرگرمی 4، نمونہ 5، گروہی تحقیق 12، گفتگو 7، انفرادی جانچ 5 اور غور و فکر 2۔</title><desc id="d">جماعت 6 کا کاغذ کے استعمال کا سبق کل 35 منٹ کا ہے: آغازی سرگرمی 4، نمونہ 5، گروہی تحقیق 12، گفتگو 7، انفرادی جانچ 5 اور غور و فکر 2۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="653" class="bg"/><text x="736" y="35" class="h" text-anchor="end">‏جماعت 6 ریاضی: کاغذ کے استعمال کی تحقیق‏</text><rect x="24" y="60" width="145" height="50" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="724" y="85" class="sh" text-anchor="end">‏منٹ‏</text><rect x="169" y="60" width="285" height="50" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="579" y="85" class="sh" text-anchor="end">‏سیکھنے کا مرحلہ‏</text><rect x="454" y="60" width="282" height="50" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="294" y="85" class="sh" text-anchor="end">‏شواہد / مدد‏</text><rect x="24" y="110" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="135" text-anchor="end">‏0-4‏</text><text x="724" y="156" text-anchor="end">‏4 منٹ‏</text><rect x="169" y="110" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="135" text-anchor="end">‏آغازی سرگرمی: خالی رخ‏</text><text x="579" y="156" text-anchor="end">‏کب مفید ہے؟‏</text><rect x="454" y="110" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="135" text-anchor="end">‏متضاد وجوہ سنیں۔‏</text><rect x="24" y="188" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="213" text-anchor="end">‏4-9‏</text><text x="724" y="234" text-anchor="end">‏5 منٹ‏</text><rect x="169" y="188" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="213" text-anchor="end">‏نمونہ: کاغذ کے دو ہفتہ وار‏</text><text x="579" y="234" text-anchor="end">‏ریکارڈوں کا موازنہ۔‏</text><rect x="454" y="188" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="213" text-anchor="end">‏بتائیں کہ کیا گنا گیا۔‏</text><rect x="24" y="266" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="291" text-anchor="end">‏9-21‏</text><text x="724" y="312" text-anchor="end">‏12 منٹ‏</text><rect x="169" y="266" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="291" text-anchor="end">‏گروہی تحقیق: کاغذ کا ایک‏</text><text x="579" y="312" text-anchor="end">‏قابلِ عمل معمول تجویز کریں۔‏</text><rect x="454" y="266" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="291" text-anchor="end">‏اعداد استعمال کریں؛ کردار بدلیں۔‏</text><rect x="24" y="344" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="369" text-anchor="end">‏21-28‏</text><text x="724" y="390" text-anchor="end">‏7 منٹ‏</text><rect x="169" y="344" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="369" text-anchor="end">‏انصاف، ایک نظامی ربط اور‏</text><text x="579" y="390" text-anchor="end">‏ایک ممکن مستقبل پر گفتگو۔‏</text><rect x="454" y="344" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="369" text-anchor="end">‏کسی پوشیدہ مفروضے‏</text><text x="294" y="390" text-anchor="end">‏کو چیلنج کریں۔‏</text><rect x="24" y="422" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="447" text-anchor="end">‏28-33‏</text><text x="724" y="468" text-anchor="end">‏5 منٹ‏</text><rect x="169" y="422" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="447" text-anchor="end">‏انفرادی جانچ: انتخاب،‏</text><text x="579" y="468" text-anchor="end">‏دو اعداد، ایک حد۔‏</text><rect x="454" y="422" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="447" text-anchor="end">‏تحریری یا زبانی استدلال۔‏</text><rect x="24" y="500" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="525" text-anchor="end">‏33-35‏</text><text x="724" y="546" text-anchor="end">‏2 منٹ‏</text><rect x="169" y="500" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="525" text-anchor="end">‏دہرائی، اور نوٹ کریں کہ‏</text><text x="579" y="546" text-anchor="end">‏بعد میں کیا جانچنا ہے۔‏</text><rect x="454" y="500" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="525" text-anchor="end">‏استاد اگلے سبق کی منصوبہ بندی‏</text><text x="294" y="546" text-anchor="end">‏کے لیے جوابات دیکھتا ہے۔‏</text><text x="736" y="623" class="small" text-anchor="end">‏نتیجہ: دو اعداد اور ایک حد کے ساتھ قابلِ عمل انتخاب کا جواز دیں۔‏</text><text aria-hidden="true" x="12" y="641" class="wm" text-anchor="start">textbook.com.pk</text></svg>
