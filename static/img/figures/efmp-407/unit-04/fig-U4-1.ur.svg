<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بہاؤ چارٹ جس میں سوال، منصوبہ بندی، تحقیق، عمل، دوسروں تک پہنچانا اور غور و فکر کے مراحل ہیں، اور غور و فکر ایک نئے سوال کی طرف لے جاتا ہے۔</title><desc id="d">بہاؤ چارٹ جس میں سوال، منصوبہ بندی، تحقیق، عمل، دوسروں تک پہنچانا اور غور و فکر کے مراحل ہیں، اور غور و فکر ایک نئے سوال کی طرف لے جاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="430" class="bg"/><text x="736" y="35" class="h" text-anchor="end">‏منصوبہ شواہد، عمل اور غور و فکر استعمال کرتا ہے‏</text><rect x="45" y="75" width="180" height="65" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="625" y="112" text-anchor="middle">‏سوال‏</text><rect x="290" y="75" width="180" height="65" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="380" y="112" text-anchor="middle">‏منصوبہ بندی‏</text><rect x="535" y="75" width="180" height="65" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="135" y="112" text-anchor="middle">‏تحقیق‏</text><rect x="45" y="220" width="180" height="65" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="625" y="257" text-anchor="middle">‏عمل‏</text><rect x="290" y="220" width="180" height="65" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="380" y="257" text-anchor="middle">‏دوسروں تک پہنچانا‏</text><rect x="535" y="220" width="180" height="65" rx="8" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="135" y="257" text-anchor="middle">‏غور و فکر‏</text><path d="M225 107 H280" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><path d="M470 107 H525" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><path d="M660 140 V190 H135 V210" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><path d="M225 252 H280" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><path d="M470 252 H525" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><path d="M615 285 V330 H20 V107 H35" class="stroke" marker-end="url(#arrow)" transform="translate(760 0) scale(-1 1)"/><text x="715" y="365" class="small" text-anchor="end">‏غور و فکر سوال یا منصوبہ بندی کو بدل سکتا ہے۔‏</text><text x="715" y="390" class="small" text-anchor="end">‏ڈھالی گئی تدریسی ترتیب؛ جماعت کے لیے اصل ڈیزائن۔‏</text><text aria-hidden="true" x="12" y="418" class="wm" text-anchor="start">textbook.com.pk</text></svg>
