<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 497" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منصوبوں اور تحقیق کا موازنہ: آغاز کا سوال، فوری مقصد، استاد کی مدد اور عام دورانیہ۔</title><desc id="d">منصوبوں اور تحقیق کا موازنہ: آغاز کا سوال، فوری مقصد، استاد کی مدد اور عام دورانیہ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="497" class="bg"/><text x="736" y="35" class="h" text-anchor="end">‏منصوبے اور تحقیق: باہم متعلق مگر مختلف‏</text><rect x="591" y="60" width="145" height="50" class="panel-a"/><text x="724" y="85" class="sh" text-anchor="end">‏خصوصیت‏</text><rect x="306" y="60" width="285" height="50" class="panel-a"/><text x="579" y="85" class="sh" text-anchor="end">‏منصوبے پر مبنی سیکھنا‏</text><rect x="24" y="60" width="282" height="50" class="panel-a"/><text x="294" y="85" class="sh" text-anchor="end">‏تحقیق پر مبنی سیکھنا‏</text><rect x="591" y="110" width="145" height="78" class="panel"/><text x="724" y="135" text-anchor="end">‏نقطۂ آغاز‏</text><rect x="306" y="110" width="285" height="78" class="panel"/><text x="579" y="135" text-anchor="end">‏کسی مقصد یا سامع سے‏</text><text x="579" y="156" text-anchor="end">‏جڑا ہوا سوال‏</text><rect x="24" y="110" width="282" height="78" class="panel"/><text x="294" y="135" text-anchor="end">‏ایسا سوال جس کی شواہد‏</text><text x="294" y="156" text-anchor="end">‏سے تحقیق ہو سکے‏</text><rect x="591" y="188" width="145" height="78" class="panel"/><text x="724" y="213" text-anchor="end">‏فوری نتیجہ‏</text><rect x="306" y="188" width="285" height="78" class="panel"/><text x="579" y="213" text-anchor="end">‏غور و فکر کے ساتھ بامقصد‏</text><text x="579" y="234" text-anchor="end">‏حاصلِ کار یا عمل‏</text><rect x="24" y="188" width="282" height="78" class="panel"/><text x="294" y="213" text-anchor="end">‏بیان کردہ حدود کے ساتھ‏</text><text x="294" y="234" text-anchor="end">‏مدلل وضاحت‏</text><rect x="591" y="266" width="145" height="78" class="panel"/><text x="724" y="291" text-anchor="end">‏استاد کی مدد‏</text><rect x="306" y="266" width="285" height="78" class="panel"/><text x="579" y="291" text-anchor="end">‏طریقوں کا نمونہ، پیش رفت کی‏</text><text x="579" y="312" text-anchor="end">‏جانچ، غور و فکر کی رہنمائی‏</text><rect x="24" y="266" width="282" height="78" class="panel"/><text x="294" y="291" text-anchor="end">‏طریقے کا نمونہ، تشریح میں‏</text><text x="294" y="312" text-anchor="end">‏مدد، وجہ پوچھنا‏</text><rect x="591" y="344" width="145" height="78" class="panel"/><text x="724" y="369" text-anchor="end">‏عام دورانیہ‏</text><rect x="306" y="344" width="285" height="78" class="panel"/><text x="579" y="369" text-anchor="end">‏کئی اسباق یا زیادہ؛‏</text><text x="579" y="390" text-anchor="end">‏تحقیق اور عمل دونوں شامل‏</text><rect x="24" y="344" width="282" height="78" class="panel"/><text x="294" y="369" text-anchor="end">‏ایک مختصر سبق میں ممکن‏</text><text x="294" y="390" text-anchor="end">‏یا زیادہ وقت تک جاری‏</text><text aria-hidden="true" x="12" y="485" class="wm" text-anchor="start">textbook.com.pk</text></svg>
