<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 419" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین زاویے موازنہ کرتے ہیں: بار بار پھیلنے والے کچرے کا متوقع مستقبل، باقاعدہ کچرا اٹھنے کا ممکن مستقبل، اور کم کچرے اور منصفانہ رسائی کا پسندیدہ مستقبل، ہر ایک کے ساتھ ایک سوال۔</title><desc id="d">تین زاویے موازنہ کرتے ہیں: بار بار پھیلنے والے کچرے کا متوقع مستقبل، باقاعدہ کچرا اٹھنے کا ممکن مستقبل، اور کم کچرے اور منصفانہ رسائی کا پسندیدہ مستقبل، ہر ایک کے ساتھ ایک سوال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:14px;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{font-size:11px;fill:var(--wm)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect x="0" y="0" width="760" height="419" class="bg"/><text x="736" y="35" class="h" text-anchor="end">‏اب سے ایک سال بعد گیٹ کے لیے تین زاویے‏</text><rect x="24" y="60" width="145" height="50" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="724" y="85" class="sh" text-anchor="end">‏زاویہ‏</text><rect x="169" y="60" width="285" height="50" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="579" y="85" class="sh" text-anchor="end">‏مشروط مستقبل‏</text><rect x="454" y="60" width="282" height="50" class="panel-a" transform="translate(760 0) scale(-1 1)"/><text x="294" y="85" class="sh" text-anchor="end">‏جماعت کا سوال‏</text><rect x="24" y="110" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="135" text-anchor="end">‏متوقع‏</text><rect x="169" y="110" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="135" text-anchor="end">‏اگر کچرا اٹھانے کا موجودہ طریقہ‏</text><text x="579" y="156" text-anchor="end">‏نہ بدلے تو کچرا پھر پھیلے گا۔‏</text><rect x="454" y="110" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="135" text-anchor="end">‏کیا چیز بتاتی ہے کہ یہ‏</text><text x="294" y="156" text-anchor="end">‏نمونہ جاری رہے گا؟‏</text><rect x="24" y="188" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="213" text-anchor="end">‏ممکن‏</text><rect x="169" y="188" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="213" text-anchor="end">‏اگر بڑوں کا باقاعدہ کچرا اٹھانا‏</text><text x="579" y="234" text-anchor="end">‏یقینی ہو تو چھلکنا کم ہوگا۔‏</text><rect x="454" y="188" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="213" text-anchor="end">‏کیا چیز اس متبادل کو‏</text><text x="294" y="234" text-anchor="end">‏ممکن بنائے گی؟‏</text><rect x="24" y="266" width="145" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="724" y="291" text-anchor="end">‏پسندیدہ‏</text><rect x="169" y="266" width="285" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="579" y="291" text-anchor="end">‏کم کچرا اور کھانے تک منصفانہ‏</text><text x="579" y="312" text-anchor="end">‏رسائی، مشترکہ تعاون کے ساتھ۔‏</text><rect x="454" y="266" width="282" height="78" class="panel" transform="translate(760 0) scale(-1 1)"/><text x="294" y="291" text-anchor="end">‏کن کی ضروریات پوری ہوتی ہیں،‏</text><text x="294" y="312" text-anchor="end">‏اور کیا بدلنا ہوگا؟‏</text><text x="736" y="389" class="small" text-anchor="end">‏یہ زاویے ایک دوسرے سے مل سکتے ہیں۔ پسند پیش گوئی نہیں ہے۔‏</text><text aria-hidden="true" x="12" y="407" class="wm" text-anchor="start">textbook.com.pk</text></svg>
