<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کثیر درجاتی نظام الاوقات: کون سا گروہ کب استاد کے ساتھ ہے</title><desc id="d">کثیر درجاتی نظام الاوقات کا خاکہ: گروہ الف خود کام کرتا ہے جبکہ استاد گروہ ب کو پڑھاتا ہے، پھر وہ جگہ بدلتے ہیں، آغاز اور اختتام پر پوری جماعت کی مشترکہ سرگرمی کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">کثیر درجاتی سبق (تیسری اور چوتھی جماعت)</text><rect class="panel-a" x="40" y="60" width="700" height="70" rx="6"/><text class="sh" x="390" y="90" text-anchor="middle">پوری جماعت کا لنگر (10 منٹ)</text><text class="small" x="390" y="112" text-anchor="middle">مشترکہ متن یا سوال، دونوں جماعتیں ساتھ</text><rect class="panel-b" x="40" y="150" width="330" height="70" rx="6"/><text class="sh" x="205" y="180" text-anchor="middle">گروہ الف استاد کے ساتھ (15 منٹ)</text><text class="small" x="205" y="202" text-anchor="middle">براہِ راست تدریس، نیا مواد</text><rect class="panel-c" x="410" y="150" width="330" height="70" rx="6"/><text class="sh" x="575" y="180" text-anchor="middle">گروہ ب خود کام (15 منٹ)</text><text class="small" x="575" y="202" text-anchor="middle">لنگر سرگرمی، خود جانچ</text><line class="stroke" x1="370" y1="220" x2="408" y2="220" marker-end="url(#arrow)"/><text class="small" x="390" y="245" text-anchor="middle">تبادلہ</text><rect class="panel-b" x="410" y="260" width="330" height="70" rx="6"/><text class="sh" x="575" y="290" text-anchor="middle">گروہ ب استاد کے ساتھ (15 منٹ)</text><text class="small" x="575" y="312" text-anchor="middle">براہِ راست تدریس، نیا مواد</text><rect class="panel-c" x="40" y="260" width="330" height="70" rx="6"/><text class="sh" x="205" y="290" text-anchor="middle">گروہ الف خود کام (15 منٹ)</text><text class="small" x="205" y="312" text-anchor="middle">لنگر سرگرمی، خود جانچ</text><rect class="panel-a" x="40" y="360" width="700" height="70" rx="6"/><text class="sh" x="390" y="390" text-anchor="middle">پوری جماعت کا اختتام (10 منٹ)</text><text class="small" x="390" y="412" text-anchor="middle">پیشکش، غور، مل کر سمیٹنا</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
