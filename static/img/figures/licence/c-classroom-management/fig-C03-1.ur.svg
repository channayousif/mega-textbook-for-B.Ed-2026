<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعتی مشاہدے کا چکر</title><desc id="d">پانچ مرحلوں والا مشاہداتی چکر: طے کریں کہ کیا دیکھنا ہے، جو دیکھا وہ درج کریں، مشاہدے کو قیاس سے الگ کریں، سوچیں کہ ایسا کیوں ہو رہا ہو سکتا ہے، ایک تبدیلی کا منصوبہ بنائیں، پھر اگلا مشاہدہ شروع کریں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="420"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="35" text-anchor="middle">مشاہدے کا چکر</text><rect class="panel-a" x="40" y="70" width="180" height="90" rx="10"/><text class="body" x="130" y="105" text-anchor="middle">1۔ طے کریں کہ</text><text class="body" x="130" y="125" text-anchor="middle">کیا دیکھنا ہے</text><text class="small" x="130" y="148" text-anchor="middle">ایک مرکزِ توجہ چنیں</text><rect class="panel-b" x="280" y="70" width="180" height="90" rx="10"/><text class="body" x="370" y="105" text-anchor="middle">2۔ جو دیکھا</text><text class="body" x="370" y="125" text-anchor="middle">وہ درج کریں (بایاں کالم)</text><text class="small" x="370" y="148" text-anchor="middle">صرف ثبوت</text><rect class="panel-c" x="520" y="70" width="200" height="90" rx="10"/><text class="body" x="620" y="105" text-anchor="middle">3۔ مشاہدے کو قیاس</text><text class="body" x="620" y="125" text-anchor="middle">سے الگ کریں (دایاں کالم)</text><text class="small" x="620" y="148" text-anchor="middle">اس کا ممکنہ مطلب</text><rect class="panel-d" x="150" y="220" width="200" height="90" rx="10"/><text class="body" x="250" y="255" text-anchor="middle">4۔ پوچھیں کہ ایسا</text><text class="body" x="250" y="275" text-anchor="middle">کیوں ہو رہا ہو سکتا ہے</text><text class="small" x="250" y="298" text-anchor="middle">عارضی وضاحت</text><rect class="panel-a" x="420" y="220" width="200" height="90" rx="10"/><text class="body" x="520" y="255" text-anchor="middle">5۔ ایک تبدیلی کا</text><text class="body" x="520" y="275" text-anchor="middle">منصوبہ بنائیں</text><text class="small" x="520" y="298" text-anchor="middle">ثبوت پر مبنی ترمیم</text><line class="stroke" x1="220" y1="115" x2="280" y2="115" marker-end="url(#arrow)"/><line class="stroke" x1="460" y1="115" x2="520" y2="115" marker-end="url(#arrow)"/><line class="stroke" x1="620" y1="160" x2="620" y2="190"/><line class="stroke" x1="620" y1="190" x2="350" y2="190"/><line class="stroke" x1="350" y1="190" x2="350" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="350" y1="265" x2="420" y2="265" marker-end="url(#arrow)"/><line class="stroke" x1="420" y1="340" x2="100" y2="340"/><line class="stroke" x1="100" y1="340" x2="100" y2="160" marker-end="url(#arrow)"/><text class="small" x="260" y="380" text-anchor="middle">پھر اگلا مشاہدہ شروع کریں</text><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
