<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">رویے کے بگاڑ پر نگہداشت والا ردِ عمل</title><desc id="d">بہاؤ چارٹ: رویہ پرسکون انداز میں روکیں، نقصان کی جانچ کریں، دونوں فریقوں کی سنیں، تلافی پر اتفاق کریں، پیروی کریں، اور تعلق بحال کریں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">رویے کے بگاڑ پر نگہداشت اور جواب دہی والا ردِ عمل</text><rect class="panel-a" x="40" y="60" width="700" height="60" rx="6"/><text class="sh" x="390" y="85" text-anchor="middle">1۔ رویہ پرسکون انداز میں روکیں</text><text class="small" x="390" y="105" text-anchor="middle">پرسکون انداز میں روکنے والا استاد اسی ضبطِ نفس کا نمونہ بنتا ہے جو وہ سکھا رہا ہے</text><line class="stroke" x1="390" y1="120" x2="390" y2="148" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="150" width="700" height="60" rx="6"/><text class="sh" x="390" y="175" text-anchor="middle">2۔ نقصان کی جانچ کریں</text><text class="small" x="390" y="195" text-anchor="middle">پہلا سوال یہ نہیں کہ کس نے شروع کیا، بلکہ یہ کہ کیا کوئی زخمی ہے</text><line class="stroke" x1="390" y1="210" x2="390" y2="238" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="240" width="700" height="60" rx="6"/><text class="sh" x="390" y="265" text-anchor="middle">3۔ دونوں فریقوں کی سنیں</text><text class="small" x="390" y="285" text-anchor="middle">ہر بچہ بات کاٹے جانے کے بغیر اپنی بات کہتا ہے</text><line class="stroke" x1="390" y1="300" x2="390" y2="328" marker-end="url(#arrow)"/><rect class="panel-d" x="40" y="330" width="220" height="60" rx="6"/><text class="sh" x="150" y="355" text-anchor="middle">4۔ تلافی پر اتفاق</text><text class="small" x="150" y="375" text-anchor="middle">نقصان پہنچانے والا</text><text class="small" x="150" y="392" text-anchor="middle">بچہ طے کرنے میں مدد دیتا ہے</text><rect class="panel-a" x="280" y="330" width="220" height="60" rx="6"/><text class="sh" x="390" y="355" text-anchor="middle">5۔ پیروی</text><text class="small" x="390" y="375" text-anchor="middle">استاد جانچتا ہے کہ</text><text class="small" x="390" y="392" text-anchor="middle">تلافی ہوئی</text><rect class="panel-b" x="520" y="330" width="220" height="60" rx="6"/><text class="sh" x="630" y="355" text-anchor="middle">6۔ تعلق</text><text class="sh" x="630" y="375" text-anchor="middle">بحال کریں</text><text class="small" x="630" y="392" text-anchor="middle">کوئی تنازع باقی نہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
