<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک مقصد، تین طریقوں سے متنوع</title><desc id="d">خاکہ جو ایک نصابی مقصد کو مختلف صلاحیتوں والی جماعت کے لیے تین طریقوں سے متنوع دکھاتا ہے: سب کے لیے بنیادی کام، مدد کے محتاج بچوں کے لیے معاونت والی صورت، اور تیار بچوں کے لیے توسیعی صورت۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .stroke-b{stroke:var(--a3);stroke-width:2;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="260" y="30" width="260" height="100" rx="8"/><text class="h" x="390" y="60" text-anchor="middle">تعلیمی ہدف ایک ہی ہے</text><text class="body" x="390" y="85" text-anchor="middle">چوتھی جماعت ریاضی: بچے اس قابل ہوں گے کہ</text><text class="body" x="390" y="105" text-anchor="middle">دو ہندسی اعداد حاصل کے ساتھ جمع کریں</text><rect class="panel-b" x="260" y="190" width="260" height="90" rx="8"/><text class="h" x="390" y="220" text-anchor="middle">بنیادی کام - سب کے لیے</text><text class="body" x="390" y="245" text-anchor="middle">ہر بچہ دو ہندسی جمع پر کام کرتا ہے</text><text class="body" x="390" y="265" text-anchor="middle">اسی ہدف کے ساتھ</text><line class="stroke" x1="390" y1="130" x2="390" y2="188" marker-end="url(#arrow)"/><rect class="panel-c" x="30" y="360" width="300" height="90" rx="8"/><text class="h" x="180" y="390" text-anchor="middle">معاونت والی صورت</text><text class="body" x="180" y="415" text-anchor="middle">عددی لکیر اور حل شدہ مثال</text><text class="small" x="180" y="440" text-anchor="middle">مدد کے محتاج بچوں کے لیے</text><rect class="panel-d" x="450" y="360" width="300" height="90" rx="8"/><text class="h" x="600" y="390" text-anchor="middle">توسیعی صورت</text><text class="body" x="600" y="415" text-anchor="middle">اضافی معلومات والا عبارتی سوال</text><text class="small" x="600" y="440" text-anchor="middle">تیار بچوں کے لیے</text><line class="stroke-a" x1="310" y1="280" x2="180" y2="358" marker-end="url(#arrow)"/><line class="stroke-b" x1="470" y1="280" x2="600" y2="358" marker-end="url(#arrow)"/><text class="small" x="390" y="330" text-anchor="middle">ایک ہدف - مختلف راستہ</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
