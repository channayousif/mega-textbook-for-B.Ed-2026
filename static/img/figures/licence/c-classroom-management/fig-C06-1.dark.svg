<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Multigrade timetable showing which group is with the teacher</title><desc id="d">Diagram of a multigrade timetable showing which group is with the teacher when: Group A works independently while the teacher teaches Group B, then they swap, with a whole-class anchor at the start and end.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">A multigrade lesson (Classes 3 and 4)</text><rect class="panel-a" x="40" y="60" width="700" height="70" rx="6"/><text class="sh" x="390" y="90" text-anchor="middle">Whole-class anchor (10 min)</text><text class="small" x="390" y="112" text-anchor="middle">shared text or question, both grades together</text><rect class="panel-b" x="40" y="150" width="330" height="70" rx="6"/><text class="sh" x="205" y="180" text-anchor="middle">Group A with teacher (15 min)</text><text class="small" x="205" y="202" text-anchor="middle">direct instruction, new content</text><rect class="panel-c" x="410" y="150" width="330" height="70" rx="6"/><text class="sh" x="575" y="180" text-anchor="middle">Group B independent (15 min)</text><text class="small" x="575" y="202" text-anchor="middle">anchor activity, self-checking</text><line class="stroke" x1="370" y1="220" x2="408" y2="220" marker-end="url(#arrow)"/><text class="small" x="390" y="245" text-anchor="middle">swap</text><rect class="panel-b" x="410" y="260" width="330" height="70" rx="6"/><text class="sh" x="575" y="290" text-anchor="middle">Group B with teacher (15 min)</text><text class="small" x="575" y="312" text-anchor="middle">direct instruction, new content</text><rect class="panel-c" x="40" y="260" width="330" height="70" rx="6"/><text class="sh" x="205" y="290" text-anchor="middle">Group A independent (15 min)</text><text class="small" x="205" y="312" text-anchor="middle">anchor activity, self-checking</text><rect class="panel-a" x="40" y="360" width="700" height="70" rx="6"/><text class="sh" x="390" y="390" text-anchor="middle">Whole-class close (10 min)</text><text class="small" x="390" y="412" text-anchor="middle">share, reflect, pack away together</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
