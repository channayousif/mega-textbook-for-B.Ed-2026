<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منصوبہ، تحریک، تدریس اور تشخیص کا چکر</title><desc id="d">چار مرحلوں کے چکر کا بہاؤ چارٹ: سبق کا منصوبہ بنائیں، متعلمین کو تحریک دیں، مواد پڑھائیں، سمجھ کی تشخیص کریں، ہر مرحلے کے انتظامی فیصلے کے ساتھ اور تشخیص سے منصوبے کی طرف واپسی کا تیر۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .ah-a{fill:var(--a1)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="30" y="170" width="150" height="130" rx="8"/><text class="h" x="105" y="210" text-anchor="middle">منصوبہ</text><text class="body" x="105" y="240" text-anchor="middle">ہدف، سرگرمیاں اور</text><text class="body" x="105" y="260" text-anchor="middle">سامان طے کریں</text><text class="small" x="105" y="285" text-anchor="middle">واضح ہدف</text><rect class="panel-b" x="220" y="170" width="150" height="130" rx="8"/><text class="h" x="295" y="210" text-anchor="middle">تحریک</text><text class="body" x="295" y="240" text-anchor="middle">پہلے سیکھنے کی</text><text class="body" x="295" y="260" text-anchor="middle">خواہش پیدا کریں</text><text class="small" x="295" y="285" text-anchor="middle">اہمیت</text><rect class="panel-c" x="410" y="170" width="150" height="130" rx="8"/><text class="h" x="485" y="210" text-anchor="middle">تدریس</text><text class="body" x="485" y="240" text-anchor="middle">رفتار والے چکروں</text><text class="body" x="485" y="260" text-anchor="middle">میں مواد پڑھائیں</text><text class="small" x="485" y="285" text-anchor="middle">رفتار اور شرکت</text><rect class="panel-d" x="600" y="170" width="150" height="130" rx="8"/><text class="h" x="675" y="210" text-anchor="middle">تشخیص</text><text class="body" x="675" y="240" text-anchor="middle">جانچیں کہ ہدف</text><text class="body" x="675" y="260" text-anchor="middle">پورا ہوا یا نہیں</text><text class="small" x="675" y="285" text-anchor="middle">ثبوت</text><line class="stroke" x1="180" y1="235" x2="218" y2="235" marker-end="url(#arrow)"/><line class="stroke" x1="370" y1="235" x2="408" y2="235" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="235" x2="598" y2="235" marker-end="url(#arrow)"/><path class="stroke-a" d="M675,300 Q675,400,390,400 Q105,400,105,320" fill="none" marker-end="url(#arrow-a)"/><text class="small" x="390" y="430" text-anchor="middle">اگلا سبق</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
