<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مختلف تعلم کے لیے نشستوں کی تین ترتیبیں</title><desc id="d">نشستوں کی تین ترتیبیں ساتھ ساتھ (قطاریں، گروہ، نعل نما)، ہر ایک پر اس تعلیمی تجربے کا نام جس کی وہ خدمت کرتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">نشستوں کی تین ترتیبیں</text><rect class="panel-a" x="30" y="55" width="220" height="50" rx="6"/><text class="sh" x="140" y="85" text-anchor="middle">قطاریں</text><rect x="50" y="125" width="36" height="28" rx="3" class="panel"/><rect x="92" y="125" width="36" height="28" rx="3" class="panel"/><rect x="134" y="125" width="36" height="28" rx="3" class="panel"/><rect x="176" y="125" width="36" height="28" rx="3" class="panel"/><rect x="50" y="160" width="36" height="28" rx="3" class="panel"/><rect x="92" y="160" width="36" height="28" rx="3" class="panel"/><rect x="134" y="160" width="36" height="28" rx="3" class="panel"/><rect x="176" y="160" width="36" height="28" rx="3" class="panel"/><rect x="50" y="195" width="36" height="28" rx="3" class="panel"/><rect x="92" y="195" width="36" height="28" rx="3" class="panel"/><rect x="134" y="195" width="36" height="28" rx="3" class="panel"/><rect x="176" y="195" width="36" height="28" rx="3" class="panel"/><rect x="100" y="245" width="60" height="20" rx="3" class="panel-c"/><text class="small" x="130" y="280" text-anchor="middle">استاد سامنے</text><text class="body" x="140" y="330" text-anchor="middle">فائدہ: پوری جماعت کی</text><text class="body" x="140" y="350" text-anchor="middle">تدریس، مشق</text><text class="small" x="140" y="380" text-anchor="middle">قیمت: گروہی کام مشکل؛</text><text class="small" x="140" y="398" text-anchor="middle">پچھلے بینچوں کو کم توجہ</text><rect class="panel-b" x="280" y="55" width="220" height="50" rx="6"/><text class="sh" x="390" y="85" text-anchor="middle">گروہ</text><circle cx="320" cy="140" r="13" class="panel"/><circle cx="345" cy="130" r="13" class="panel"/><circle cx="345" cy="155" r="13" class="panel"/><circle cx="395" cy="140" r="13" class="panel"/><circle cx="420" cy="130" r="13" class="panel"/><circle cx="420" cy="155" r="13" class="panel"/><circle cx="395" cy="165" r="13" class="panel"/><circle cx="450" cy="140" r="13" class="panel"/><circle cx="475" cy="130" r="13" class="panel"/><circle cx="475" cy="155" r="13" class="panel"/><circle cx="320" cy="210" r="13" class="panel"/><circle cx="345" cy="200" r="13" class="panel"/><circle cx="345" cy="225" r="13" class="panel"/><rect x="360" y="245" width="60" height="20" rx="3" class="panel-c"/><text class="small" x="390" y="280" text-anchor="middle">استاد درمیان میں گھومتا ہے</text><text class="body" x="390" y="330" text-anchor="middle">فائدہ: گروہی کام،</text><text class="body" x="390" y="350" text-anchor="middle">گفتگو، تعاون</text><text class="small" x="390" y="380" text-anchor="middle">قیمت: واضح اصول درکار؛</text><text class="small" x="390" y="398" text-anchor="middle">شور بڑھ سکتا ہے</text><rect class="panel-c" x="530" y="55" width="220" hei