<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A behaviour breakdown handled through a caring response</title><desc id="d">Flowchart showing a behaviour breakdown handled through a caring, accountable response: stop the behaviour calmly, check for harm, hear both sides, agree a repair, follow up, and restore the relationship.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">A caring, accountable response to a behaviour breakdown</text><rect class="panel-a" x="40" y="60" width="700" height="60" rx="6"/><text class="sh" x="390" y="85" text-anchor="middle">1. Stop the behaviour calmly</text><text class="small" x="390" y="105" text-anchor="middle">a teacher who stops calmly models the self-regulation they are teaching</text><line class="stroke" x1="390" y1="120" x2="390" y2="148" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="150" width="700" height="60" rx="6"/><text class="sh" x="390" y="175" text-anchor="middle">2. Check for harm</text><text class="small" x="390" y="195" text-anchor="middle">the first question is not who started it but is anyone hurt</text><line class="stroke" x1="390" y1="210" x2="390" y2="238" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="240" width="700" height="60" rx="6"/><text class="sh" x="390" y="265" text-anchor="middle">3. Hear both sides</text><text class="small" x="390" y="285" text-anchor="middle">each pupil gets to tell their version without interruption</text><line class="stroke" x1="390" y1="300" x2="390" y2="328" marker-end="url(#arrow)"/><rect class="panel-d" x="40" y="330" width="220" height="60" rx="6"/><text class="sh" x="150" y="355" text-anchor="middle">4. Agree a repair</text><text class="small" x="150" y="375" text-anchor="middle">the pupil who caused</text><text class="small" x="150" y="392" text-anchor="middle">the harm helps decide</text><rect class="panel-a" x="280" y="330" width="220" height="60" rx="6"/><text class="sh" x="390" y="355" text-anchor="middle">5. Follow up</text><text class="small" x="390" y="375" text-anchor="middle">the teacher checks</text><text class="small" x="390" y="392" text-anchor="middle">the repair happened</text><rect class="panel-b" x="520" y="330" width="220" height="60" rx="6"/><text class="sh" x="630" y="355" text-anchor="middle">6. Restore the</text><text class="sh" x="630" y="375" text-anchor="middle">relationship</text><text class="small" x="630" y="392" text-anchor="middle">no unresolved conflict</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
