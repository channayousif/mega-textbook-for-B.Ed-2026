<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 708" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">برصغیر اور پاکستان میں تعلیم کی ٹائم لائن، 1835 سے 2013</title><desc id="d">دو ادوار میں عمودی ٹائم لائن۔ 1947 سے پہلے: میکالے کی یادداشت 1835، سائنٹفک سوسائٹی 1864، دارالعلوم دیوبند 1866، علی گڑھ کا اسکول 1875 اور ایم اے او کالج 1877، ندوۃ العلماء کی تحریک 1894 اور لکھنؤ کا دارالعلوم 1898، اور علی گڑھ مسلم یونیورسٹی 1920۔ 1947 کے بعد: پاکستان تعلیمی کانفرنس 1947، قومی تعلیمی کمیشن 1959، 1970، 1972، 1979، 1992 اور 1998 کی تعلیمی پالیسیاں، ہائر ایجوکیشن کمیشن 2002، قومی تعلیمی پالیسی 2009، اٹھارہویں ترمیم 2010 اور سندھ کا مفت اور لازمی تعلیم کا قانون 2013۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .axis{stroke:var(--line);stroke-width:3} .era1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .era2{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5} .dot{fill:var(--bg);stroke:var(--line);stroke-width:2.5} text{font-size:14px;fill:var(--ink)} .yr{font-size:15px;font-weight:700;fill:var(--ink)} .era{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="740" height="708"/><g direction="rtl"><rect class="era1" x="590" y="23" width="140" height="246" rx="6"/><text class="era" x="660" y="142" text-anchor="middle">1947 سے</text><text class="era" x="660" y="160" text-anchor="middle">پہلے</text><rect class="era2" x="590" y="275" width="140" height="390" rx="6"/><text class="era" x="660" y="475" text-anchor="middle">پاکستان</text><line class="axis" x1="490" y1="20" x2="490" y2="668"/><text class="yr" x="506" y="43" text-anchor="end">1835</text><circle class="dot" cx="490" cy="38" r="6"/><text class="body" x="472" y="43" text-anchor="start">میکالے کی یادداشت: انگریزی ذریعۂ تعلیم کی حمایت</text><text class="yr" x="506" y="79" text-anchor="end">1864</text><circle class="dot" cx="490" cy="74" r="6"/><text class="body" x="472" y="79" text-anchor="start">سر سید نے سائنٹفک سوسائٹی قائم کی</text><text class="yr" x="506" y="115" text-anchor="end">1866</text><circle class="dot" cx="490" cy="110" r="6"/><text class="body" x="472" y="115" text-anchor="start">دارالعلوم دیوبند کا قیام</text><text class="yr" x="506" y="151" text-anchor="end">1875</text><circle class="dot" cx="490" cy="146" r="6"/><text class="body" x="472" y="151" text-anchor="start">علی گڑھ میں سر سید کا اسکول کھلا</text><text class="yr" x="506" y="187" text-anchor="end">1877</text><circle class="dot" cx="490" cy="182" r="6"/><text class="body" x="472" y="187" text-anchor="start">محمڈن اینگلو اورینٹل کالج کا قیام</text><text class="yr" x="506" y="223" text-anchor="end">1894-98</text><circle class="dot" cx="490" cy="218" r="6"/><text class="body" x="472" y="223" text-anchor="start">ندوۃ العلماء کی تحریک؛ لکھنؤ کا دارالعلوم (1898)</text><text class="yr" x="506" y="259" text-anchor="end">1920</text><circle class="dot" cx="490" cy="254" r="6"/><text class="body" x="472" y="259" text-anchor="start">ایم اے او کالج علی گڑھ مسلم یونیورسٹی بنا</text><text class="yr" x="506" y="295" text-anchor="end">1947</text><circle class="dot" cx="490" cy="290" r="6"/><text class="body" x="472" y="295" text-anchor="start">پاکستان تعلیمی کانفرنس، کراچی</text><text class="yr" x="506" y="331" text-anchor="end">1959</text><circle class="dot" cx="490" cy="326" r="6"/><text class="body" x="472" y="331" text-anchor="start">قومی تعلیمی کمیشن کی رپورٹ</text><text class="yr" x="506" y="367" text-anchor="end">1970</text><circle class="dot" cx="490" cy="362" r="6"/><text class="body" x="472" y="367" text-anchor="start">نئی تعلیمی پالیسی (نافذ نہ ہو سکی)</text><text class="yr" x="506" y="403" text-anchor="end">1972</text><circle class="dot" cx="490" cy="398" r="6"/><text class="body" x="472" y="403" text-anchor="start">تعلیمی پالیسی 1972-80: جماعت دہم تک مفت تعلیم</text><text class="yr" x="506" y="439" text-anchor="end">1979</text><circle class="dot" cx="490" cy="434" r="6"/><text class="body" x="472" y="439" text-anchor="start">قومی تعلیمی پالیسی اور عمل درآمد پروگرام</text><text class="yr" x="506" y="475" text-anchor="end">1992</text><circle class="dot" cx="490" cy="470" r="6"/><text class="body" x="472" y="475" text-anchor="start">قومی تعلیمی پالیسی</text><text class="yr" x="506" y="511" text-anchor="end">1998</text><circle class="dot" cx="490" cy="506" r="6"/><text class="body" x="472" y="511" text-anchor="start">قومی تعلیمی پالیسی 1998-2010</text><text class="yr" x="506" y="547" text-anchor="end">2002</text><circle class="dot" cx="490" cy="542" r="6"/><text class="body" x="472" y="547" text-anchor="start">ہائر ایجوکیشن کمیشن کا قیام</text><text class="yr" x="506" y="583" text-anchor="end">2009</text><circle class="dot" cx="490" cy="578" r="6"/><text class="body" x="472" y="583" text-anchor="start">قومی تعلیمی پالیسی 2009</text><text class="yr" x="506" y="619" text-anchor="end">2010</text><circle class="dot" cx="490" cy="614" r="6"/><text class="body" x="472" y="619" text-anchor="start">اٹھارہویں ترمیم: آرٹیکل 25-A؛ تعلیم صوبوں کو منتقل</text><text class="yr" x="506" y="655" text-anchor="end">2013</text><circle class="dot" cx="490" cy="650" r="6"/><text class="body" x="472" y="655" text-anchor="start">سندھ میں بچوں کی مفت اور لازمی تعلیم کے حق کا قانون</text></g><text class="wm" x="12" y="700" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>