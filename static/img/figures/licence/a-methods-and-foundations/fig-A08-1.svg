<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 354" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four philosophies of education compared</title><desc id="d">Table comparing idealism, realism, pragmatism and critical theory by their view of knowledge, the aim of education, the curriculum, the method and the teacher&#x27;s role.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .rh{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="1000" height="354"/><rect class="hd" x="0" y="0" width="150" height="48"/><text class="h" x="75" y="29" text-anchor="middle">Philosophy</text><rect class="hd" x="150" y="0" width="170" height="48"/><text class="h" x="235" y="29" text-anchor="middle">Knowledge</text><rect class="hd" x="320" y="0" width="170" height="48"/><text class="h" x="405" y="29" text-anchor="middle">Aim</text><rect class="hd" x="490" y="0" width="170" height="48"/><text class="h" x="575" y="29" text-anchor="middle">Curriculum</text><rect class="hd" x="660" y="0" width="170" height="48"/><text class="h" x="745" y="29" text-anchor="middle">Method</text><rect class="hd" x="830" y="0" width="170" height="48"/><text class="h" x="915" y="29" text-anchor="middle">Teacher</text><rect class="rl" x="0" y="48" width="150" height="62"/><text class="rh" x="75" y="84" text-anchor="middle">Idealism</text><rect class="panel" x="150" y="48" width="170" height="62"/><text class="body" x="160" y="75" text-anchor="start">Ideas grasped</text><text class="body" x="160" y="93" text-anchor="start">by reason</text><rect class="panel" x="320" y="48" width="170" height="62"/><text class="body" x="330" y="75" text-anchor="start">Develop mind</text><text class="body" x="330" y="93" text-anchor="start">and character</text><rect class="panel" x="490" y="48" width="170" height="62"/><text class="body" x="500" y="75" text-anchor="start">Classics, literature,</text><text class="body" x="500" y="93" text-anchor="start">religion, philosophy</text><rect class="panel" x="660" y="48" width="170" height="62"/><text class="body" x="670" y="75" text-anchor="start">Dialogue, lecture,</text><text class="body" x="670" y="93" text-anchor="start">imitation of models</text><rect class="panel" x="830" y="48" width="170" height="62"/><text class="body" x="840" y="75" text-anchor="start">Moral and</text><text class="body" x="840" y="93" text-anchor="start">intellectual model</text><rect class="rl" x="0" y="110" width="150" height="80"/><text class="rh" x="75" y="155" text-anchor="middle">Realism</text><rect class="panel" x="150" y="110" width="170" height="80"/><text class="body" x="160" y="137" text-anchor="start">The real world,</text><text class="body" x="160" y="155" text-anchor="start">known through</text><text class="body" x="160" y="173" text-anchor="start">senses and reason</text><rect class="panel" x="320" y="110" width="170" height="80"/><text class="body" x="330" y="146" text-anchor="start">Understand the</text><text class="body" x="330" y="164" text-anchor="start">world as it is</text><rect class="panel" x="490" y="110" width="170" height="80"/><text class="body" x="500" y="146" text-anchor="start">Organised subjects,</text><text class="body" x="500" y="164" text-anchor="start">sciences, maths</text><rect class="panel" x="660" y="110" width="170" height="80"/><text class="body" x="670" y="137" text-anchor="start">Observation,</text><text class="body" x="670" y="155" text-anchor="start">demonstration,</text><text class="body" x="670" y="173" text-anchor="start">systematic teaching</text><rect class="panel" x="830" y="110" width="170" height="80"/><text class="body" x="840" y="146" text-anchor="start">Subject expert who</text><text class="body" x="840" y="164" text-anchor="start">presents knowledge</text><rect class="rl" x="0" y="190" width="150" height="80"/><text class="rh" x="75" y="235" text-anchor="middle">Pragmatism</text><rect class="panel" x="150" y="190" width="170" height="80"/><text class="body" x="160" y="217" text-anchor="start">What works when</text><text class="body" x="160" y="235" text-anchor="start">tested in</text><text class="body" x="160" y="253" text-anchor="start">experience</text><rect class="panel" x="320" y="190" width="170" height="80"/><text class="body" x="330" y="217" text-anchor="start">Growth, problem-</text><text class="body" x="330" y="235" text-anchor="start">solving, democratic</text><text class="body" x="330" y="253" text-anchor="start">living</text><rect class="panel" x="490" y="190" width="170" height="80"/><text class="body" x="500" y="217" text-anchor="start">Integrated, built on</text><text class="body" x="500" y="235" text-anchor="start">pupils&#x27; interests</text><text class="body" x="500" y="253" text-anchor="start">and problems</text><rect class="panel" x="660" y="190" width="170" height="80"/><text class="body" x="670" y="226" text-anchor="start">Learning by doing,</text><text class="body" x="670" y="244" text-anchor="start">projects, inquiry</text><rect class="panel" x="830" y="190" width="170" height="80"/><text class="body" x="840" y="226" text-anchor="start">Guide who</text><text class="body" x="840" y="244" text-anchor="start">arranges experience</text><rect class="rl" x="0" y="270" width="150" height="62"/><text class="rh" x="75" y="297" text-anchor="middle">Critical</text><text class="rh" x="75" y="315" text-anchor="middle">theory</text><rect class="panel" x="150" y="270" width="170" height="62"/><text class="body" x="160" y="297" text-anchor="start">Never neutral;</text><text class="body" x="160" y="315" text-anchor="start">shaped by power</text><rect class="panel" x="320" y="270" width="170" height="62"/><text class="body" x="330" y="297" text-anchor="start">Critical awareness,</text><text class="body" x="330" y="315" text-anchor="start">social justice</text><rect class="panel" x="490" y="270" width="170" height="62"/><text class="body" x="500" y="297" text-anchor="start">Problems from</text><text class="body" x="500" y="315" text-anchor="start">learners&#x27; own lives</text><rect class="panel" x="660" y="270" width="170" height="62"/><text class="body" x="670" y="297" text-anchor="start">Dialogue,</text><text class="body" x="670" y="315" text-anchor="start">problem-posing</text><rect class="panel" x="830" y="270" width="170" height="62"/><text class="body" x="840" y="297" text-anchor="start">Co-learner who</text><text class="body" x="840" y="315" text-anchor="start">questions with pupils</text><text class="wm" x="988" y="348" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>