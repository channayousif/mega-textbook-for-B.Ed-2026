"387" text-anchor="start">نہیں؛ طاقت سے متاثر</text><rect class="panel" x="510" y="318" width="170" height="98"/><text class="body" x="670" y="363" text-anchor="start">تنقیدی شعور،</text><text class="body" x="670" y="387" text-anchor="start">سماجی انصاف</text><rect class="panel" x="340" y="318" width="170" height="98"/><text class="body" x="500" y="363" text-anchor="start">متعلمین کی اپنی</text><text class="body" x="500" y="387" text-anchor="start">زندگی کے مسائل</text><rect class="panel" x="170" y="318" width="170" height="98"/><text class="body" x="330" y="363" text-anchor="start">مکالمہ،</text><text class="body" x="330" y="387" text-anchor="start">مسئلہ پیش کرنا</text><rect class="panel" x="0" y="318" width="170" height="98"/><text class="body" x="160" y="351" text-anchor="start">شریکِ تعلم جو</text><text class="body" x="160" y="375" text-anchor="start">شاگردوں کے ساتھ</text><text class="body" x="160" y="399" text-anchor="start">سوال کرے</text></g><text class="wm" x="12" y="432" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>