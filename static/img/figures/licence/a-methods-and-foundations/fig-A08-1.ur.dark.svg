<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 438" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم کے چار فلسفوں کا موازنہ</title><desc id="d">جدول جو تصوریت، حقیقت پسندی، نتائجیت اور تنقیدی نظریے کا موازنہ علم کے بارے میں ان کے نقطۂ نظر، تعلیم کے مقصد، نصاب، طریقے اور استاد کے کردار کے لحاظ سے کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .rh{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="1000" height="438"/><g direction="rtl"><rect class="hd" x="850" y="0" width="150" height="48"/><text class="h" x="925" y="29" text-anchor="middle">فلسفہ</text><rect class="hd" x="680" y="0" width="170" height="48"/><text class="h" x="765" y="29" text-anchor="middle">علم</text><rect class="hd" x="510" y="0" width="170" height="48"/><text class="h" x="595" y="29" text-anchor="middle">مقصد</text><rect class="hd" x="340" y="0" width="170" height="48"/><text class="h" x="425" y="29" text-anchor="middle">نصاب</text><rect class="hd" x="170" y="0" width="170" height="48"/><text class="h" x="255" y="29" text-anchor="middle">طریقہ</text><rect class="hd" x="0" y="0" width="170" height="48"/><text class="h" x="85" y="29" text-anchor="middle">استاد</text><rect class="rl" x="850" y="48" width="150" height="74"/><text class="rh" x="925" y="93" text-anchor="middle">تصوریت</text><rect class="panel" x="680" y="48" 