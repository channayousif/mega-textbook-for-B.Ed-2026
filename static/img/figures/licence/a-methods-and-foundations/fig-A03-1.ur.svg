<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">باہمی تعاون پر مبنی تعلم کے تین ماڈلوں کا موازنہ</title><desc id="d">جدول جو سوچو-جوڑی-بتاؤ، جگ سا اور STAD کا موازنہ کرتا ہے: ہر ایک کیسے چلتا ہے، کس کے لیے بہترین ہے، اور انفرادی جواب دہی کیسے شامل کی جاتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .rh{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="960" height="460"/><g direction="rtl"><rect class="hd" x="790" y="0" width="170" height="48"/><text class="h" x="875" y="29" text-anchor="middle">ماڈل</text><rect class="hd" x="480" y="0" width="310" height="48"/><text class="h" x="635" y="29" text-anchor="middle">یہ کیسے چلتا ہے</text><rect class="hd" x="260" y="0" width="220" height="48"/><text class="h" x="370" y="29" text-anchor="middle">کس کے لیے بہترین</text><rect class="hd" x="0" y="0" width="260" height="48"/><text class="h" x="130" y="29" text-anchor="middle">انفرادی جواب دہی</text><rect class="rl" x="790" y="48" width="170" height="122"/><text class="rh" x="875" y="117" text-anchor="middle">سوچو-جوڑی-بتاؤ</text><rect class="panel" x="480" y="48" width="310" height="122"/><text class="body" x="780" y="81" text-anchor="start">1. استاد سوال پوچھتا ہے</text><text class="body" x="780" y="105" text-anchor="start">2. ہر شاگرد اکیلے سوچتا ہے</text><text class="body" x="780" y="129" text-anchor="start">3. جوڑیاں جوابات پر بات کرتی ہیں</text><text class="body" x="780" y="153" text-anchor="start">4. کچھ جوڑیاں جماعت کو بتاتی ہیں</text><rect class="panel" x="260" y="48" width="220" height="122"/><text class="body" x="470" y="105" text-anchor="start">کوئی بھی سبق، 2 سے 3 منٹ؛</text><text class="body" x="470" y="129" text-anchor="start">بڑی جماعت میں پہلا قدم</text><rect class="panel" x="0" y="48" width="260" height="122"/><text class="body" x="250" y="105" text-anchor="start">کسی بھی شاگرد سے جوڑی کا</text><text class="body" x="250" y="129" text-anchor="start">جواب سنانے کو کہا جا سکتا ہے</text><rect class="rl" x="790" y="170" width="170" height="122"/><text class="rh" x="875" y="239" text-anchor="middle">جگ سا</text><rect class="panel" x="480" y="170" width="310" height="122"/><text class="body" x="780" y="203" text-anchor="start">1. گھریلو گروہ؛ مواد تقسیم</text><text class="body" x="780" y="227" text-anchor="start">2. ایک ہی حصے والے ماہر بن کر ملتے ہیں</text><text class="body" x="780" y="251" text-anchor="start">3. ماہر واپس آ کر پڑھاتے ہیں</text><text class="body" x="780" y="275" text-anchor="start">4. تمام حصوں پر انفرادی کوئز</text><rect class="panel" x="260" y="170" width="220" height="122"/><text class="body" x="470" y="227" text-anchor="start">ایسا مواد جو الگ الگ</text><text class="body" x="470" y="251" text-anchor="start">حصوں میں بٹ سکے</text><rect class="panel" x="0" y="170" width="260" height="122"/><text class="body" x="250" y="227" text-anchor="start">ہر شاگرد کا کوئز تمام حصوں پر،</text><text class="body" x="250" y="251" text-anchor="start">صرف اپنے حصے پر نہیں</text><rect class="rl" x="790" y="292" width="170" height="146"/><text class="rh" x="875" y="373" text-anchor="middle">STAD</text><rect class="panel" x="480" y="292" width="310" height="146"/><text class="body" x="780" y="325" text-anchor="start">1. استاد سبق پیش کرتا ہے</text><text class="body" x="780" y="349" text-anchor="start">2. ملی جلی ٹیمیں مل کر پڑھتی ہیں</text><text class="body" x="780" y="373" text-anchor="start">3. ہر شاگرد اکیلے کوئز دیتا ہے</text><text class="body" x="780" y="397" text-anchor="start">4. بہتری کے نمبر</text><text class="body" x="780" y="421" text-anchor="start">ٹیم کا اسکور بناتے ہیں</text><rect class="panel" x="260" y="292" width="220" height="146"/><text class="body" x="470" y="361" text-anchor="start">واضح درست جواب والا مواد:</text><text class="body" x="470" y="385" text-anchor="start">حقائق، مہارتیں</text><rect class="panel" x="0" y="292" width="260" height="146"/><text class="body" x="250" y="361" text-anchor="start">ٹیم کا اسکور صرف ہر رکن کی</text><text class="body" x="250" y="385" text-anchor="start">اپنی بہتری سے بنتا ہے</text></g><text class="wm" x="12" y="454" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>