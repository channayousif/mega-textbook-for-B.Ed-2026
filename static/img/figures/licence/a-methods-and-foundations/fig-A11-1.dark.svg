<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 672" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of education in the subcontinent and Pakistan, 1835 to 2013</title><desc id="d">A vertical timeline in two eras. Before 1947: Macaulay&#x27;s Minute 1835, Scientific Society 1864, Darul Uloom Deoband 1866, the Aligarh school 1875 and MAO College 1877, the Nadwatul Ulama movement 1894 and its Lucknow seminary 1898, and Aligarh Muslim University 1920. After 1947: the Pakistan Educational Conference 1947, the Commission on National Education 1959, education policies of 1970, 1972, 1979, 1992 and 1998, the Higher Education Commission 2002, the National Education Policy 2009, the 18th Amendment 2010 and the Sindh free and compulsory education act 2013.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .axis{stroke:var(--line);stroke-width:3} .era1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .era2{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5} .dot{fill:var(--bg);stroke:var(--line);stroke-width:2.5} text{font-size:14px;fill:var(--ink)} .yr{font-size:15px;font-weight:700;fill:var(--ink)} .era{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="740" height="672"/><rect class="era1" x="10" y="23" width="140" height="232" rx="6"/><text class="era" x="80" y="135" text-anchor="middle">Before</text><text class="era" x="80" y="153" text-anchor="middle">1947</text><rect class="era2" x="10" y="261" width="140" height="368" rx="6"/><text class="era" x="80" y="450" text-anchor="middle">Pakistan</text><line class="axis" x1="250" y1="20" x2="250" y2="632"/><text class="yr" x="234" y="42" text-anchor="end">1835</text><circle class="dot" cx="250" cy="37" r="6"/><text class="body" x="268" y="42" text-anchor="start">Macaulay&#x27;s Minute favours English-medium education</text><text class="yr" x="234" y="76" text-anchor="end">1864</text><circle class="dot" cx="250" cy="71" r="6"/><text class="body" x="268" y="76" text-anchor="start">Sir Syed founds the Scientific Society</text><text class="yr" x="234" y="110" text-anchor="end">1866</text><circle class="dot" cx="250" cy="105" r="6"/><text class="body" x="268" y="110" text-anchor="start">Darul Uloom Deoband founded</text><text class="yr" x="234" y="144" text-anchor="end">1875</text><circle class="dot" cx="250" cy="139" r="6"/><text class="body" x="268" y="144" text-anchor="start">Sir Syed&#x27;s school opens at Aligarh</text><text class="yr" x="234" y="178" text-anchor="end">1877</text><circle class="dot" cx="250" cy="173" r="6"/><text class="body" x="268" y="178" text-anchor="start">Muhammadan Anglo-Oriental College founded</text><text class="yr" x="234" y="212" text-anchor="end">1894-98</text><circle class="dot" cx="250" cy="207" r="6"/><text class="body" x="268" y="212" text-anchor="start">Nadwatul Ulama movement; its Lucknow seminary (1898)</text><text class="yr" x="234" y="246" text-anchor="end">1920</text><circle class="dot" cx="250" cy="241" r="6"/><text class="body" x="268" y="246" text-anchor="start">MAO College becomes Aligarh Muslim University</text><text class="yr" x="234" y="280" text-anchor="end">1947</text><circle class="dot" cx="250" cy="275" r="6"/><text class="body" x="268" y="280" text-anchor="start">Pakistan Educational Conference, Karachi</text><text class="yr" x="234" y="314" text-anchor="end">1959</text><circle class="dot" cx="250" cy="309" r="6"/><text class="body" x="268" y="314" text-anchor="start">Report of the Commission on National Education</text><text class="yr" x="234" y="348" text-anchor="end">1970</text><circle class="dot" cx="250" cy="343" r="6"/><text class="body" x="268" y="348" text-anchor="start">The New Education Policy (not implemented)</text><text class="yr" x="234" y="382" text-anchor="end">1972</text><circle class="dot" cx="250" cy="377" r="6"/><text class="body" x="268" y="382" text-anchor="start">Education Policy 1972-80: free education to Class X</text><text class="yr" x="234" y="416" text-anchor="end">1979</text><circle class="dot" cx="250" cy="411" r="6"/><text class="body" x="268" y="416" text-anchor="start">National Education Policy and Implementation Programme</text><text class="yr" x="234" y="450" text-anchor="end">1992</text><circle class="dot" cx="250" cy="445" r="6"/><text class="body" x="268" y="450" text-anchor="start">National Education Policy</text><text class="yr" x="234" y="484" text-anchor="end">1998</text><circle class="dot" cx="250" cy="479" r="6"/><text class="body" x="268" y="484" text-anchor="start">National Education Policy 1998-2010</text><text class="yr" x="234" y="518" text-anchor="end">2002</text><circle class="dot" cx="250" cy="513" r="6"/><text class="body" x="268" y="518" text-anchor="start">Higher Education Commission established</text><text class="yr" x="234" y="552" text-anchor="end">2009</text><circle class="dot" cx="250" cy="547" r="6"/><text class="body" x="268" y="552" text-anchor="start">National Education Policy 2009</text><text class="yr" x="234" y="586" text-anchor="end">2010</text><circle class="dot" cx="250" cy="581" r="6"/><text class="body" x="268" y="586" text-anchor="start">18th Amendment: Article 25-A; education devolved</text><text class="yr" x="234" y="620" text-anchor="end">2013</text><circle class="dot" cx="250" cy="615" r="6"/><text class="body" x="268" y="620" text-anchor="start">Sindh Right of Children to Free and Compulsory Education Act</text><text class="wm" x="728" y="664" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>