<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 382" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three cooperative learning models compared</title><desc id="d">Table comparing Think-Pair-Share, Jigsaw and STAD by how each runs, what it is best for, and how individual accountability is built in.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .rh{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="960" height="382"/><rect class="hd" x="0" y="0" width="170" height="48"/><text class="h" x="85" y="29" text-anchor="middle">Model</text><rect class="hd" x="170" y="0" width="310" height="48"/><text class="h" x="325" y="29" text-anchor="middle">How it runs</text><rect class="hd" x="480" y="0" width="220" height="48"/><text class="h" x="590" y="29" text-anchor="middle">Best for</text><rect class="hd" x="700" y="0" width="260" height="48"/><text class="h" x="830" y="29" text-anchor="middle">Individual accountability</text><rect class="rl" x="0" y="48" width="170" height="98"/><text class="rh" x="85" y="102" text-anchor="middle">Think-Pair-Share</text><rect class="panel" x="170" y="48" width="310" height="98"/><text class="body" x="180" y="75" text-anchor="start">1. Teacher asks a question</text><text class="body" x="180" y="93" text-anchor="start">2. Each pupil thinks alone</text><text class="body" x="180" y="111" text-anchor="start">3. Pairs discuss their answers</text><text class="body" x="180" y="129" text-anchor="start">4. Some pairs share with the class</text><rect class="panel" x="480" y="48" width="220" height="98"/><text class="body" x="490" y="93" text-anchor="start">Any lesson, 2-3 minutes;</text><text class="body" x="490" y="111" text-anchor="start">a first step in large classes</text><rect class="panel" x="700" y="48" width="260" height="98"/><text class="body" x="710" y="93" text-anchor="start">Any pupil may be asked</text><text class="body" x="710" y="111" text-anchor="start">to report the pair&#x27;s answer</text><rect class="rl" x="0" y="146" width="170" height="98"/><text class="rh" x="85" y="200" text-anchor="middle">Jigsaw</text><rect class="panel" x="170" y="146" width="310" height="98"/><text class="body" x="180" y="173" text-anchor="start">1. Home groups; material split</text><text class="body" x="180" y="191" text-anchor="start">2. Same-part pupils meet as experts</text><text class="body" x="180" y="209" text-anchor="start">3. Experts return and teach</text><text class="body" x="180" y="227" text-anchor="start">4. Individual quiz on all parts</text><rect class="panel" x="480" y="146" width="220" height="98"/><text class="body" x="490" y="191" text-anchor="start">Content that divides</text><text class="body" x="490" y="209" text-anchor="start">into separate parts</text><rect class="panel" x="700" y="146" width="260" height="98"/><text class="body" x="710" y="191" text-anchor="start">Each pupil&#x27;s quiz covers</text><text class="body" x="710" y="209" text-anchor="start">every part, not only one&#x27;s own</text><rect class="rl" x="0" y="244" width="170" height="116"/><text class="rh" x="85" y="307" text-anchor="middle">STAD</text><rect class="panel" x="170" y="244" width="310" height="116"/><text class="body" x="180" y="271" text-anchor="start">1. Teacher presents the lesson</text><text class="body" x="180" y="289" text-anchor="start">2. Mixed teams study together</text><text class="body" x="180" y="307" text-anchor="start">3. Each pupil takes a quiz alone</text><text class="body" x="180" y="325" text-anchor="start">4. Improvement points build</text><text class="body" x="180" y="343" text-anchor="start">the team score</text><rect class="panel" x="480" y="244" width="220" height="116"/><text class="body" x="490" y="298" text-anchor="start">Content with clear right</text><text class="body" x="490" y="316" text-anchor="start">answers: facts, skills</text><rect class="panel" x="700" y="244" width="260" height="116"/><text class="body" x="710" y="289" text-anchor="start">Team score is built only</text><text class="body" x="710" y="307" text-anchor="start">from each member&#x27;s own</text><text class="body" x="710" y="325" text-anchor="start">improvement</text><text class="wm" x="948" y="376" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>