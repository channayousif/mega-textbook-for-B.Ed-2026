<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 456" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">پانچ سوالات والے ٹیسٹ کا تجزیۂ سوالات</title><desc id="d">36 طلبہ کی جماعت کے پانچ سوالات کا حل شدہ تجزیہ، 10 طلبہ کے بالائی اور زیریں گروہ کے ساتھ۔ سوال 1: 9 اور 7 درست، p 0.80، D 0.20، سرحدی۔ سوال 2: 8 اور 3، p 0.55، D 0.50، رکھیں۔ سوال 3: 4 اور 5، p 0.45، D منفی 0.10، کلید جانچیں اور دوبارہ لکھیں۔ سوال 4: 3 اور 1، p 0.20، D 0.20، سرحدی۔ سوال 5: 7 اور 4، p 0.55، D 0.30، رکھیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.pa{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.pb{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.pc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:14px;fill:var(--ink)}.h{font-size:14px;font-weight:700}.sh{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.frame{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.4}</style><rect class="bg" x="0" y="0" width="780" height="456"/><rect class="panel" x="710" y="0" width="70" height="66"/><text class="h" x="745" y="38" text-anchor="middle">سوال</text><rect class="pa" x="590" y="0" width="120" height="66"/><text class="h" x="650" y="26" text-anchor="middle">بالائی گروہ</text><text class="h" x="650" y="50" text-anchor="middle">درست تعداد</text><rect class="pa" x="470" y="0" width="120" height="66"/><text class="h" x="530" y="26" text-anchor="middle">زیریں گروہ</text><text class="h" x="530" y="50" text-anchor="middle">درست تعداد</text><rect class="pb" x="330" y="0" width="140" height="66"/><text class="h" x="400" y="26" text-anchor="middle">مشکل p</text><text class="h" x="400" y="50" text-anchor="middle" direction="ltr">(RU + RL) / 20</text><rect class="pb" x="180" y="0" width="150" height="66"/><text class="h" x="255" y="26" text-anchor="middle">امتیاز D</text><text class="h" x="255" y="50" text-anchor="middle" direction="ltr">(RU - RL) / 10</text><rect class="pc" x="0" y="0" width="180" height="66"/><text class="h" x="90" y="38" text-anchor="middle">فیصلہ</text><rect class="panel" x="710" y="66" width="70" height="58"/><text class="sh" x="745" y="100" text-anchor="middle" direction="ltr">1</text><text class="body" x="650" y="100" text-anchor="middle" direction="ltr">9</text><text class="body" x="530" y="100" text-anchor="middle" direction="ltr">7</text><text class="body" x="400" y="100" text-anchor="middle" direction="ltr">0.80</text><text class="body" x="255" y="100" text-anchor="middle" direction="ltr">0.20</text><text class="body" x="90" y="88" text-anchor="middle">آسان، سرحدی:</text><text class="body" x="90" y="112" text-anchor="middle">بہتر کریں</text><rect class="panel" x="710" y="124" width="70" height="58"/><text class="sh" x="745" y="158" text-anchor="middle" direction="ltr">2</text><text class="body" x="650" y="158" text-anchor="middle" direction="ltr">8</text><text class="body" x="530" y="158" text-anchor="middle" direction="ltr">3</text><text class="body" x="400" y="158" text-anchor="middle" direction="ltr">0.55</text><text class="body" x="255" y="158" text-anchor="middle" direction="ltr">0.50</text><text class="body" x="90" y="158" text-anchor="middle">رکھیں: بہت اچھا</text><rect class="panel" x="710" y="182" width="70" height="58"/><text class="sh" x="745" y="216" text-anchor="middle" direction="ltr">3</text><text class="body" x="650" y="216" text-anchor="middle" direction="ltr">4</text><text class="body" x="530" y="216" text-anchor="middle" direction="ltr">5</text><text class="body" x="400" y="216" text-anchor="middle" direction="ltr">0.45</text><text class="body" x="255" y="216" text-anchor="middle" direction="ltr">-0.10</text><text class="body" x="90" y="204" text-anchor="middle">منفی: کلید جانچیں،</text><text class="body" x="90" y="228" text-anchor="middle">دوبارہ لکھیں</text><rect class="panel" x="710" y="240" width="70" height="58"/><text class="sh" x="745" y="274" text-anchor="middle" direction="ltr">4</text><text class="body" x="650" y="274" text-anchor="middle" direction="ltr">3</text><text class="body" x="530" y="274" text-anchor="middle" direction="ltr">1</text><text class="body" x="400" y="274" text-anchor="middle" direction="ltr">0.20</text><text class="body" x="255" y="274" text-anchor="middle" direction="ltr">0.20</text><text class="body" x="90" y="262" text-anchor="middle">مشکل، سرحدی:</text><text class="body" x="90" y="286" text-anchor="middle">تدریس دیکھیں</text><rect class="panel" x="710" y="298" width="70" height="58"/><text class="sh" x="745" y="332" text-anchor="middle" direction="ltr">5</text><text class="body" x="650" y="332" text-anchor="middle" direction="ltr">7</text><text class="body" x="530" y="332" text-anchor="middle" direction="ltr">4</text><text class="body" x="400" y="332" text-anchor="middle" direction="ltr">0.55</text><text class="body" x="255" y="332" text-anchor="middle" direction="ltr">0.30</text><text class="body" x="90" y="320" text-anchor="middle">رکھیں: مناسب</text><text class="body" x="90" y="344" text-anchor="middle">حد تک اچھا</text><path class="grid" d="M710 0V356M590 0V356M470 0V356M330 0V356M180 0V356M0 66H780M0 124H780M0 182H780M0 240H780M0 298H780M0 356H780"/><rect class="frame" x="0.75" y="0.75" width="778.5" height="354.5"/><text class="small" x="768" y="378" text-anchor="start">36 طلبہ کی جماعت۔ بالائی اور زیریں گروہ کل نمبروں کے لحاظ سے اوپر اور نیچے کے 27 فی صد ہیں،</text><text class="small" x="768" y="402" text-anchor="start">یعنی 0.27 ضرب 36 = 9.7، اس لیے ہر گروہ میں 10 طلبہ۔</text><text class="small" x="768" y="426" text-anchor="start">D کے لیے ایبل کی رہنمائی: 0.40 یا زیادہ بہت اچھا، 0.30 تا 0.39 اچھا، 0.20 تا 0.29 سرحدی۔</text><text class="wm" x="12" y="450" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>