<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">معیارِ گروہی اور معیارِ کسوٹی تعبیر کا موازنہ</title><desc id="d">جدول جو معیارِ گروہی اور معیارِ کسوٹی تعبیر کا موازنہ کرتا ہے: ہر ایک کس سوال کا جواب دیتی ہے، حوالہ کیا ہے، نتائج کیسے بتائے جاتے ہیں، سوالات کیسے چنے جاتے ہیں، اور عام استعمال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.pa{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.pb{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.pc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:14px;fill:var(--ink)}.h{font-size:14px;font-weight:700}.sh{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.frame{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.4}</style><rect class="bg" x="0" y="0" width="780" height="490"/><rect class="panel" x="610" y="0" width="170" height="70"/><text class="h" x="695" y="40" text-anchor="middle">پہلو</text><rect class="pa" x="305" y="0" width="305" height="70"/><text class="h" x="457.5" y="28" text-anchor="middle">معیارِ گروہی</text><text class="h" x="457.5" y="52" text-anchor="middle">(نسبتی)</text><rect class="pb" x="0" y="0" width="305" height="70"/><text class="h" x="152.5" y="28" text-anchor="middle">معیارِ کسوٹی</text><text class="h" x="152.5" y="52" text-anchor="middle">(مطلق)</text><rect class="panel" x="610" y="70" width="170" height="80"/><text class="sh" x="695" y="103" text-anchor="middle">کس سوال کا</text><text class="sh" x="695" y="127" text-anchor="middle">جواب</text><text class="body" x="457.5" y="103" text-anchor="middle">یہ طالب علم دوسروں کے</text><text class="body" x="457.5" y="127" text-anchor="middle">مقابلے میں کیسا رہا؟</text><text class="body" x="152.5" y="103" text-anchor="middle">یہ طالب علم طے شدہ معیار</text><text class="body" x="152.5" y="127" text-anchor="middle">کے مطابق کیا کر سکتا ہے؟</text><rect class="panel" x="610" y="150" width="170" height="80"/><text class="sh" x="695" y="195" text-anchor="middle">حوالہ</text><text class="body" x="457.5" y="183" text-anchor="middle">گروہ (جماعت یا ہم جماعتوں)</text><text class="body" x="457.5" y="207" text-anchor="middle">کے نمبر</text><text class="body" x="152.5" y="183" text-anchor="middle">طے شدہ کسوٹی: متعین</text><text class="body" x="152.5" y="207" text-anchor="middle">مہارتیں یا حدِ کامیابی</text><rect class="panel" x="610" y="230" width="170" height="80"/><text class="sh" x="695" y="263" text-anchor="middle">نتائج کی</text><text class="sh" x="695" y="287" text-anchor="middle">صورت</text><text class="body" x="457.5" y="263" text-anchor="middle">درجہ، فی صدیہ یا</text><text class="body" x="457.5" y="287" text-anchor="middle">گروہ میں مقام</text><text class="body" x="152.5" y="263" text-anchor="middle">مہارت حاصل یا نہیں؛</text><text class="body" x="152.5" y="287" text-anchor="middle">پورے ہونے والے مقاصد</text><rect class="panel" x="610" y="310" width="170" height="80"/><text class="sh" x="695" y="343" text-anchor="middle">سوالات کا</text><text class="sh" x="695" y="367" text-anchor="middle">انتخاب</text><text class="body" x="457.5" y="343" text-anchor="middle">طلبہ کو پھیلانے کے لیے</text><text class="body" x="457.5" y="367" text-anchor="middle">(درمیانی مشکل کے سوال)</text><text class="body" x="152.5" y="343" text-anchor="middle">ہر مقصد کا احاطہ</text><text class="body" x="152.5" y="367" text-anchor="middle">(مشکل مواد سے طے)</text><rect class="panel" x="610" y="390" width="170" height="80"/><text class="sh" x="695" y="435" text-anchor="middle">عام استعمال</text><text class="body" x="457.5" y="423" text-anchor="middle">محدود نشستوں کے لیے</text><text class="body" x="457.5" y="447" text-anchor="middle">انتخابی امتحان</text><text class="body" x="152.5" y="423" text-anchor="middle">اکائی کا ٹیسٹ یا ترقی</text><text class="body" x="152.5" y="447" text-anchor="middle">کا امتحان</text><path class="grid" d="M610 0V470M305 0V470M0 70H780M0 150H780M0 230H780M0 310H780M0 390H780M0 470H780"/><rect class="frame" x="0.75" y="0.75" width="778.5" height="468.5"/><text class="wm" x="12" y="484" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>