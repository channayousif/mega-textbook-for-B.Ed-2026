<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Norm-referenced and criterion-referenced interpretation compared</title><desc id="d">Table comparing norm-referenced and criterion-referenced interpretation on the question each answers, the reference point, how results are reported, how items are chosen, and a typical use.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.pa{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.pb{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.pc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700}.sh{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.frame{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.4}</style><rect class="bg" x="0" y="0" width="780" height="490"/><rect class="panel" x="0" y="0" width="170" height="70"/><text class="h" x="85" y="40" text-anchor="middle" direction="ltr">Point</text><rect class="pa" x="170" y="0" width="305" height="70"/><text class="h" x="322.5" y="30.5" text-anchor="middle" direction="ltr">Norm-referenced</text><text class="h" x="322.5" y="49.5" text-anchor="middle" direction="ltr">(relative)</text><rect class="pb" x="475" y="0" width="305" height="70"/><text class="h" x="627.5" y="30.5" text-anchor="middle" direction="ltr">Criterion-referenced</text><text class="h" x="627.5" y="49.5" text-anchor="middle" direction="ltr">(absolute)</text><rect class="panel" x="0" y="70" width="170" height="80"/><text class="sh" x="85" y="105.5" text-anchor="middle" direction="ltr">Question it</text><text class="sh" x="85" y="124.5" text-anchor="middle" direction="ltr">answers</text><text class="body" x="322.5" y="105.5" text-anchor="middle" direction="ltr">How did this pupil do</text><text class="body" x="322.5" y="124.5" text-anchor="middle" direction="ltr">compared with others?</text><text class="body" x="627.5" y="105.5" text-anchor="middle" direction="ltr">What can this pupil do</text><text class="body" x="627.5" y="124.5" text-anchor="middle" direction="ltr">against a set standard?</text><rect class="panel" x="0" y="150" width="170" height="80"/><text class="sh" x="85" y="185.5" text-anchor="middle" direction="ltr">Reference</text><text class="sh" x="85" y="204.5" text-anchor="middle" direction="ltr">point</text><text class="body" x="322.5" y="185.5" text-anchor="middle" direction="ltr">The scores of a norm</text><text class="body" x="322.5" y="204.5" text-anchor="middle" direction="ltr">group (class or cohort)</text><text class="body" x="627.5" y="185.5" text-anchor="middle" direction="ltr">A fixed criterion: defined</text><text class="body" x="627.5" y="204.5" text-anchor="middle" direction="ltr">skills or a cut score</text><rect class="panel" x="0" y="230" width="170" height="80"/><text class="sh" x="85" y="265.5" text-anchor="middle" direction="ltr">Results</text><text class="sh" x="85" y="284.5" text-anchor="middle" direction="ltr">reported as</text><text class="body" x="322.5" y="265.5" text-anchor="middle" direction="ltr">Rank, percentile or</text><text class="body" x="322.5" y="284.5" text-anchor="middle" direction="ltr">position in the group</text><text class="body" x="627.5" y="265.5" text-anchor="middle" direction="ltr">Mastery or non-mastery;</text><text class="body" x="627.5" y="284.5" text-anchor="middle" direction="ltr">objectives met</text><rect class="panel" x="0" y="310" width="170" height="80"/><text class="sh" x="85" y="345.5" text-anchor="middle" direction="ltr">Items chosen</text><text class="sh" x="85" y="364.5" text-anchor="middle" direction="ltr">to</text><text class="body" x="322.5" y="345.5" text-anchor="middle" direction="ltr">Spread pupils out</text><text class="body" x="322.5" y="364.5" text-anchor="middle" direction="ltr">(middle-difficulty items)</text><text class="body" x="627.5" y="345.5" text-anchor="middle" direction="ltr">Cover every objective</text><text class="body" x="627.5" y="364.5" text-anchor="middle" direction="ltr">(difficulty set by content)</text><rect class="panel" x="0" y="390" width="170" height="80"/><text class="sh" x="85" y="435" text-anchor="middle" direction="ltr">Typical use</text><text class="body" x="322.5" y="425.5" text-anchor="middle" direction="ltr">Selection test for a</text><text class="body" x="322.5" y="444.5" text-anchor="middle" direction="ltr">limited number of places</text><text class="body" x="627.5" y="425.5" text-anchor="middle" direction="ltr">Unit test or promotion</text><text class="body" x="627.5" y="444.5" text-anchor="middle" direction="ltr">examination</text><path class="grid" d="M170 0V470M475 0V470M0 70H780M0 150H780M0 230H780M0 310H780M0 390H780M0 470H780"/><rect class="frame" x="0.75" y="0.75" width="778.5" height="468.5"/><text class="wm" x="768" y="484" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>