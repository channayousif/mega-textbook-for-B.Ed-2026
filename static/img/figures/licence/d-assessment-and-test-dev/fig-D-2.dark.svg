<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 388" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of specifications for a Class 5 science test</title><desc id="d">A two-way grid for a 20-item Class 5 science term test. Rows are four content areas weighted by teaching periods: plants 4 periods and 8 items, the water cycle 3 periods and 6 items, weather 2 periods and 4 items, soil 1 period and 2 items. Columns are Remember 6 items, Understand 8 items and Apply 6 items.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.pa{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.pb{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.pc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700}.sh{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.frame{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.4}</style><rect class="bg" x="0" y="0" width="780" height="388"/><rect class="panel" x="0" y="0" width="210" height="64"/><text class="h" x="105" y="37" text-anchor="middle" direction="ltr">Content area</text><rect class="panel" x="210" y="0" width="90" height="64"/><text class="h" x="255" y="28" text-anchor="middle" direction="ltr">Periods</text><text class="h" x="255" y="46" text-anchor="middle" direction="ltr">taught</text><rect class="pa" x="300" y="0" width="110" height="64"/><text class="h" x="355" y="37" text-anchor="middle" direction="ltr">Remember</text><rect class="pb" x="410" y="0" width="110" height="64"/><text class="h" x="465" y="37" text-anchor="middle" direction="ltr">Understand</text><rect class="pc" x="520" y="0" width="110" height="64"/><text class="h" x="575" y="37" text-anchor="middle" direction="ltr">Apply</text><rect class="panel" x="630" y="0" width="70" height="64"/><text class="h" x="665" y="37" text-anchor="middle" direction="ltr">Items</text><rect class="panel" x="700" y="0" width="80" height="64"/><text class="h" x="740" y="37" text-anchor="middle" direction="ltr">Per cent</text><rect class="panel" x="0" y="64" width="210" height="52"/><text class="sh" x="105" y="95" text-anchor="middle" direction="ltr">Plants and their parts</text><text class="body" x="255" y="95" text-anchor="middle" direction="ltr">4</text><text class="body" x="355" y="95" text-anchor="middle" direction="ltr">2</text><text class="body" x="465" y="95" text-anchor="middle" direction="ltr">3</text><text class="body" x="575" y="95" text-anchor="middle" direction="ltr">3</text><text class="body" x="665" y="95" text-anchor="middle" direction="ltr">8</text><text class="body" x="740" y="95" text-anchor="middle" direction="ltr">40%</text><rect class="panel" x="0" y="116" width="210" height="52"/><text class="sh" x="105" y="147" text-anchor="middle" direction="ltr">The water cycle</text><text class="body" x="255" y="147" text-anchor="middle" direction="ltr">3</text><text class="body" x="355" y="147" text-anchor="middle" direction="ltr">2</text><text class="body" x="465" y="147" text-anchor="middle" direction="ltr">2</text><text class="body" x="575" y="147" text-anchor="middle" direction="ltr">2</text><text class="body" x="665" y="147" text-anchor="middle" direction="ltr">6</text><text class="body" x="740" y="147" text-anchor="middle" direction="ltr">30%</text><rect class="panel" x="0" y="168" width="210" height="52"/><text class="sh" x="105" y="199" text-anchor="middle" direction="ltr">Weather</text><text class="body" x="255" y="199" text-anchor="middle" direction="ltr">2</text><text class="body" x="355" y="199" text-anchor="middle" direction="ltr">1</text><text class="body" x="465" y="199" text-anchor="middle" direction="ltr">2</text><text class="body" x="575" y="199" text-anchor="middle" direction="ltr">1</text><text class="body" x="665" y="199" text-anchor="middle" direction="ltr">4</text><text class="body" x="740" y="199" text-anchor="middle" direction="ltr">20%</text><rect class="panel" x="0" y="220" width="210" height="52"/><text class="sh" x="105" y="251" text-anchor="middle" direction="ltr">Soil</text><text class="body" x="255" y="251" text-anchor="middle" direction="ltr">1</text><text class="body" x="355" y="251" text-anchor="middle" direction="ltr">1</text><text class="body" x="465" y="251" text-anchor="middle" direction="ltr">1</text><text class="body" x="575" y="251" text-anchor="middle" direction="ltr">0</text><text class="body" x="665" y="251" text-anchor="middle" direction="ltr">2</text><text class="body" x="740" y="251" text-anchor="middle" direction="ltr">10%</text><rect class="panel" x="0" y="272" width="210" height="52"/><text class="sh" x="105" y="303" text-anchor="middle" direction="ltr">Total</text><text class="body" x="255" y="303" text-anchor="middle" direction="ltr">10</text><text class="body" x="355" y="303" text-anchor="middle" direction="ltr">6 (30%)</text><text class="body" x="465" y="303" text-anchor="middle" direction="ltr">8 (40%)</text><text class="body" x="575" y="303" text-anchor="middle" direction="ltr">6 (30%)</text><text class="body" x="665" y="303" text-anchor="middle" direction="ltr">20</text><text class="body" x="740" y="303" text-anchor="middle" direction="ltr">100%</text><path class="grid" d="M210 0V324M300 0V324M410 0V324M520 0V324M630 0V324M700 0V324M0 64H780M0 116H780M0 168H780M0 220H780M0 272H780M0 324H780"/><rect class="frame" x="0.75" y="0.75" width="778.5" height="322.5"/><text class="small" x="12" y="346" text-anchor="start">Row weights follow teaching time (items = 20 x periods / 10). Column weights are the teacher's</text><text class="small" x="12" y="364" text-anchor="start">judgement of the unit's aims. Every row and column total must add up before items are written.</text><text class="wm" x="768" y="382" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>