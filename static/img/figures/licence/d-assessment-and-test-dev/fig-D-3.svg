<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Item analysis of a five-item test</title><desc id="d">Worked item analysis for five items from a class of 36, using upper and lower groups of 10 pupils. Item 1: 9 and 7 right, p 0.80, D 0.20, marginal. Item 2: 8 and 3, p 0.55, D 0.50, keep. Item 3: 4 and 5, p 0.45, D minus 0.10, negative, check the key and rewrite. Item 4: 3 and 1, p 0.20, D 0.20, marginal. Item 5: 7 and 4, p 0.55, D 0.30, keep.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.pa{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.pb{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.pc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700}.sh{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.frame{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.4}</style><rect class="bg" x="0" y="0" width="780" height="420"/><rect class="panel" x="0" y="0" width="70" height="66"/><text class="h" x="35" y="38" text-anchor="middle" direction="ltr">Item</text><rect class="pa" x="70" y="0" width="120" height="66"/><text class="h" x="130" y="29" text-anchor="middle" direction="ltr">Upper group</text><text class="h" x="130" y="47" text-anchor="middle" direction="ltr">right (of 10)</text><rect class="pa" x="190" y="0" width="120" height="66"/><text class="h" x="250" y="29" text-anchor="middle" direction="ltr">Lower group</text><text class="h" x="250" y="47" text-anchor="middle" direction="ltr">right (of 10)</text><rect class="pb" x="310" y="0" width="140" height="66"/><text class="h" x="380" y="29" text-anchor="middle" direction="ltr">Difficulty p</text><text class="h" x="380" y="47" text-anchor="middle" direction="ltr">(RU + RL) / 20</text><rect class="pb" x="450" y="0" width="150" height="66"/><text class="h" x="525" y="29" text-anchor="middle" direction="ltr">Discrimination D</text><text class="h" x="525" y="47" text-anchor="middle" direction="ltr">(RU - RL) / 10</text><rect class="pc" x="600" y="0" width="180" height="66"/><text class="h" x="690" y="38" text-anchor="middle" direction="ltr">Decision</text><rect class="panel" x="0" y="66" width="70" height="58"/><text class="sh" x="35" y="100" text-anchor="middle" direction="ltr">1</text><text class="body" x="130" y="100" text-anchor="middle" direction="ltr">9</text><text class="body" x="250" y="100" text-anchor="middle" direction="ltr">7</text><text class="body" x="380" y="100" text-anchor="middle" direction="ltr">0.80</text><text class="body" x="525" y="100" text-anchor="middle" direction="ltr">0.20</text><text class="body" x="690" y="91" text-anchor="middle" direction="ltr">Easy, marginal:</text><text class="body" x="690" y="109" text-anchor="middle" direction="ltr">revise</text><rect class="panel" x="0" y="124" width="70" height="58"/><text class="sh" x="35" y="158" text-anchor="middle" direction="ltr">2</text><text class="body" x="130" y="158" text-anchor="middle" direction="ltr">8</text><text class="body" x="250" y="158" text-anchor="middle" direction="ltr">3</text><text class="body" x="380" y="158" text-anchor="middle" direction="ltr">0.55</text><text class="body" x="525" y="158" text-anchor="middle" direction="ltr">0.50</text><text class="body" x="690" y="158" text-anchor="middle" direction="ltr">Keep: very good</text><rect class="panel" x="0" y="182" width="70" height="58"/><text class="sh" x="35" y="216" text-anchor="middle" direction="ltr">3</text><text class="body" x="130" y="216" text-anchor="middle" direction="ltr">4</text><text class="body" x="250" y="216" text-anchor="middle" direction="ltr">5</text><text class="body" x="380" y="216" text-anchor="middle" direction="ltr">0.45</text><text class="body" x="525" y="216" text-anchor="middle" direction="ltr">-0.10</text><text class="body" x="690" y="207" text-anchor="middle" direction="ltr">Negative: check</text><text class="body" x="690" y="225" text-anchor="middle" direction="ltr">key, rewrite</text><rect class="panel" x="0" y="240" width="70" height="58"/><text class="sh" x="35" y="274" text-anchor="middle" direction="ltr">4</text><text class="body" x="130" y="274" text-anchor="middle" direction="ltr">3</text><text class="body" x="250" y="274" text-anchor="middle" direction="ltr">1</text><text class="body" x="380" y="274" text-anchor="middle" direction="ltr">0.20</text><text class="body" x="525" y="274" text-anchor="middle" direction="ltr">0.20</text><text class="body" x="690" y="265" text-anchor="middle" direction="ltr">Hard, marginal:</text><text class="body" x="690" y="283" text-anchor="middle" direction="ltr">review teaching</text><rect class="panel" x="0" y="298" width="70" height="58"/><text class="sh" x="35" y="332" text-anchor="middle" direction="ltr">5</text><text class="body" x="130" y="332" text-anchor="middle" direction="ltr">7</text><text class="body" x="250" y="332" text-anchor="middle" direction="ltr">4</text><text class="body" x="380" y="332" text-anchor="middle" direction="ltr">0.55</text><text class="body" x="525" y="332" text-anchor="middle" direction="ltr">0.30</text><text class="body" x="690" y="323" text-anchor="middle" direction="ltr">Keep: reasonably</text><text class="body" x="690" y="341" text-anchor="middle" direction="ltr">good</text><path class="grid" d="M70 0V356M190 0V356M310 0V356M450 0V356M600 0V356M0 66H780M0 124H780M0 182H780M0 240H780M0 298H780M0 356H780"/><rect class="frame" x="0.75" y="0.75" width="778.5" height="354.5"/><text class="small" x="12" y="378" text-anchor="start">Class of 36 pupils. Upper and lower groups are the top and bottom 27 per cent by total score</text><text class="small" x="12" y="396" text-anchor="start">(0.27 x 36 = 9.7, rounded to 10 each). D guide (Ebel): 0.40+ very good, 0.30-0.39 good, 0.20-0.29 marginal.</text><text class="wm" x="768" y="414" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>