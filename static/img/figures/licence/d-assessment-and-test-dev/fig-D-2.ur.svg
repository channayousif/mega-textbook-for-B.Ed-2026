<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 424" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">جماعت پنجم سائنس کے ٹیسٹ کا جدولِ تخصیص</title><desc id="d">جماعت پنجم سائنس کے 20 سوالات والے ٹیسٹ کا دو رخی جدول۔ قطاریں چار موضوعات ہیں جن کا وزن تدریسی پیریڈز سے طے ہوا: پودے 4 پیریڈ اور 8 سوال، آبی چکر 3 پیریڈ اور 6 سوال، موسم 2 پیریڈ اور 4 سوال، مٹی 1 پیریڈ اور 2 سوال۔ کالم یاد رکھنا 6، سمجھنا 8 اور اطلاق 6 سوال ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.pa{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.pb{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.pc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:14px;fill:var(--ink)}.h{font-size:14px;font-weight:700}.sh{font-size:14px;font-weight:600}.body{font-size:14px}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.frame{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.4}</style><rect class="bg" x="0" y="0" width="780" height="424"/><rect class="panel" x="570" y="0" width="210" height="64"/><text class="h" x="675" y="37" text-anchor="middle">موضوع</text><rect class="panel" x="480" y="0" width="90" height="64"/><text class="h" x="525" y="25" text-anchor="middle">تدریسی</text><text class="h" x="525" y="49" text-anchor="middle">پیریڈ</text><rect class="pa" x="370" y="0" width="110" height="64"/><text class="h" x="425" y="37" text-anchor="middle">یاد رکھنا</text><rect class="pb" x="260" y="0" width="110" height="64"/><text class="h" x="315" y="37" text-anchor="middle">سمجھنا</text><rect class="pc" x="150" y="0" width="110" height="64"/><text class="h" x="205" y="37" text-anchor="middle">اطلاق</text><rect class="panel" x="80" y="0" width="70" height="64"/><text class="h" x="115" y="37" text-anchor="middle">سوالات</text><rect class="panel" x="0" y="0" width="80" height="64"/><text class="h" x="40" y="37" text-anchor="middle">فی صد</text><rect class="panel" x="570" y="64" width="210" height="52"/><text class="sh" x="675" y="95" text-anchor="middle">پودے اور ان کے حصے</text><text class="body" x="525" y="95" text-anchor="middle" direction="ltr">4</text><text class="body" x="425" y="95" text-anchor="middle" direction="ltr">2</text><text class="body" x="315" y="95" text-anchor="middle" direction="ltr">3</text><text class="body" x="205" y="95" text-anchor="middle" direction="ltr">3</text><text class="body" x="115" y="95" text-anchor="middle" direction="ltr">8</text><text class="body" x="40" y="95" text-anchor="middle" direction="ltr">40%</text><rect class="panel" x="570" y="116" width="210" height="52"/><text class="sh" x="675" y="147" text-anchor="middle">آبی چکر</text><text class="body" x="525" y="147" text-anchor="middle" direction="ltr">3</text><text class="body" x="425" y="147" text-anchor="middle" direction="ltr">2</text><text class="body" x="315" y="147" text-anchor="middle" direction="ltr">2</text><text class="body" x="205" y="147" text-anchor="middle" direction="ltr">2</text><text class="body" x="115" y="147" text-anchor="middle" direction="ltr">6</text><text class="body" x="40" y="147" text-anchor="middle" direction="ltr">30%</text><rect class="panel" x="570" y="168" width="210" height="52"/><text class="sh" x="675" y="199" text-anchor="middle">موسم</text><text class="body" x="525" y="199" text-anchor="middle" direction="ltr">2</text><text class="body" x="425" y="199" text-anchor="middle" direction="ltr">1</text><text class="body" x="315" y="199" text-anchor="middle" direction="ltr">2</text><text class="body" x="205" y="199" text-anchor="middle" direction="ltr">1</text><text class="bo