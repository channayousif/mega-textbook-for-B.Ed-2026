<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول اور برادری کا دو طرفہ تعلق</title><desc id="d">خاکہ جس میں ایک طرف اسکول اور دوسری طرف برادری ہے۔ اوپر کا تیر اسکول سے برادری کی طرف ہے اور برادری پر اسکول کے اثرات بتاتا ہے؛ نیچے کا تیر برادری سے اسکول کی طرف ہے اور اسکول پر برادری کے اثرات بتاتا ہے۔ درمیان میں پلوں کی پٹی ہے: والدین، اسکول مینجمنٹ کمیٹی، استاد، اور اسکول بطور برادری کی خدمات کا مرکز۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-b{stroke:var(--a2);stroke-width:2.5;fill:none;stroke-dasharray:8 5} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="580" y="150" width="170" height="170" rx="10"/><text class="h" x="665" y="215" text-anchor="middle">اسکول</text><text class="body" x="665" y="245" text-anchor="middle">اساتذہ، طلبہ،</text><text class="body" x="665" y="265" text-anchor="middle">سربراہ، نصاب</text><rect class="panel-b" x="30" y="150" width="170" height="170" rx="10"/><text class="h" x="115" y="215" text-anchor="middle">برادری</text><text class="body" x="115" y="245" text-anchor="middle">خاندان، بزرگ، مسجد،</text><text class="body" x="115" y="265" text-anchor="middle">غیر سرکاری ادارے، روزگار</text><path class="stroke" d="M580,165 C480,60 300,60 200,165" marker-end="url(#arrow)"/><path class="stroke-b" d="M200,305 C300,410 480,410 580,305" marker-end="url(#arrow-b)"/><text class="sh" x="390" y="30" text-anchor="middle">برادری پر اسکول کے اثرات</text><text class="small" x="390" y="52" text-anchor="middle">خواندگی اور مہارتیں؛ صحت اور شہری شعور؛</text><text class="small" x="390" y="69" text-anchor="middle">نئے خیالات؛ مشترکہ اقدار؛ ملنے کی جگہ</text><text class="sh" x="390" y="420" text-anchor="middle">اسکول پر برادری کے اثرات</text><text class="small" x="390" y="440" text-anchor="middle">داخلہ اور حاضری؛ توقعات اور اقدار؛</text><text class="small" x="390" y="457" text-anchor="middle">زبان؛ وسائل، رضاکار اور تعاون</text><rect class="panel" x="230" y="160" width="320" height="150" rx="10"/><text class="h" x="390" y="185" text-anchor="middle">پل</text><rect class="panel-d" x="395" y="200" width="140" height="40" rx="6"/><text class="body" x="465" y="225" text-anchor="middle">والدین</text><rect class="panel-d" x="245" y="200" width="140" height="40" rx="6"/><text class="body" x="315" y="225" text-anchor="middle">ایس ایم سی / پی ٹی اے</text><rect class="panel-d" x="395" y="252" width="140" height="40" rx="6"/><text class="body" x="465" y="277" text-anchor="middle">استاد</text><rect class="panel-d" x="245" y="252" width="140" height="40" rx="6"/><text class="body" x="315" y="277" text-anchor="middle">اسکول بطور مرکز</text><text class="wm" x="770" y="462" text-anchor="end">textbook.com.pk</text></svg>