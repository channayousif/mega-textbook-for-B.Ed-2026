<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five types of social interaction</title><desc id="d">Table of the five types of social interaction, cooperation, competition, conflict, accommodation and assimilation, each with its meaning, a school example, and what the teacher can do.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-b{stroke:var(--a2);stroke-width:2.5;fill:none;stroke-dasharray:8 5} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><rect class="panel" x="0" y="0" width="150" height="50"/><text class="h" x="75" y="31" text-anchor="middle">Type</text><rect class="panel" x="150" y="0" width="210" height="50"/><text class="h" x="255" y="31" text-anchor="middle">What it means</text><rect class="panel" x="360" y="0" width="210" height="50"/><text class="h" x="465" y="31" text-anchor="middle">School example</text><rect class="panel" x="570" y="0" width="210" height="50"/><text class="h" x="675" y="31" text-anchor="middle">Teacher's move</text><rect class="panel-a" x="0" y="50" width="150" height="86"/><text class="sh" x="75" y="98" text-anchor="middle">Cooperation</text><rect class="bg" x="150" y="50" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="255" y="86" text-anchor="middle">Working together</text><text class="body" x="255" y="106" text-anchor="middle">towards a shared goal</text><rect class="bg" x="360" y="50" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="465" y="86" text-anchor="middle">Pupils plant the</text><text class="body" x="465" y="106" text-anchor="middle">school garden</text><rect class="bg" x="570" y="50" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="675" y="86" text-anchor="middle">Set shared goals;</text><text class="body" x="675" y="106" text-anchor="middle">check the goal is good</text><rect class="panel-b" x="0" y="136" width="150" height="86"/><text class="sh" x="75" y="184" text-anchor="middle">Competition</text><rect class="bg" x="150" y="136" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="255" y="172" text-anchor="middle">Striving for something</text><text class="body" x="255" y="192" text-anchor="middle">in limited supply</text><rect class="bg" x="360" y="136" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="465" y="172" text-anchor="middle">Inter-house</text><text class="body" x="465" y="192" text-anchor="middle">science quiz</text><rect class="bg" x="570" y="136" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="675" y="172" text-anchor="middle">Fair rules; reward</text><text class="body" x="675" y="192" text-anchor="middle">effort, rotate winners</text><rect class="panel-c" x="0" y="222" width="150" height="86"/><text class="sh" x="75" y="270" text-anchor="middle">Conflict</text><rect class="bg" x="150" y="222" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="255" y="258" text-anchor="middle">Each side tries to</text><text class="body" x="255" y="278" text-anchor="middle">prevail over the other</text><rect class="bg" x="360" y="222" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="465" y="258" text-anchor="middle">Quarrel over the</text><text class="body" x="465" y="278" text-anchor="middle">cricket pitch at break</text><rect class="bg" x="570" y="222" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="675" y="258" text-anchor="middle">Stop, hear both sides,</text><text class="body" x="675" y="278" text-anchor="middle">agree a fair step</text><rect class="panel-d" x="0" y="308" width="150" height="86"/><text class="sh" x="75" y="356" text-anchor="middle">Accommodation</text><rect class="bg" x="150" y="308" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="255" y="344" text-anchor="middle">Adjusting to get along;</text><text class="body" x="255" y="364" text-anchor="middle">both keep identity</text><rect class="bg" x="360" y="308" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="465" y="344" text-anchor="middle">Group switches language</text><text class="body" x="465" y="364" text-anchor="middle">so a newcomer follows</text><rect class="bg" x="570" y="308" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="675" y="344" text-anchor="middle">Praise and model</text><text class="body" x="675" y="364" text-anchor="middle">give-and-take</text><rect class="panel-a" x="0" y="394" width="150" height="86"/><text class="sh" x="75" y="442" text-anchor="middle">Assimilation</text><rect class="bg" x="150" y="394" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="255" y="430" text-anchor="middle">Gradually taking on</text><text class="body" x="255" y="450" text-anchor="middle">another group's ways</text><rect class="bg" x="360" y="394" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="465" y="430" text-anchor="middle">New pupil slowly speaks</text><text class="body" x="465" y="450" text-anchor="middle">and plays like the class</text><rect class="bg" x="570" y="394" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="675" y="430" text-anchor="middle">Welcome, but never</text><text class="body" x="675" y="450" text-anchor="middle">forbid home language</text><text class="sh" x="390" y="508" text-anchor="middle">Competition aims at the goal; conflict aims at the rival.</text><text class="sh" x="390" y="530" text-anchor="middle">Accommodation keeps both identities; assimilation absorbs one.</text><text class="wm" x="770" y="552" text-anchor="end">textbook.com.pk</text></svg>