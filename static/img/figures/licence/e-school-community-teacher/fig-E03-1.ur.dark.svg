<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معاشرتی تعامل کی پانچ اقسام</title><desc id="d">جدول جس میں معاشرتی تعامل کی پانچ اقسام، تعاون، مقابلہ، تنازع، مطابقت اور انجذاب، ہر ایک کے مطلب، اسکول کی ایک مثال اور استاد کے قدم کے ساتھ دکھائی گئی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-b{stroke:var(--a2);stroke-width:2.5;fill:none;stroke-dasharray:8 5} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><rect class="panel" x="0" y="0" width="210" height="50"/><text class="h" x="105" y="31" text-anchor="middle">استاد کا قدم</text><rect class="panel" x="210" y="0" width="210" height="50"/><text class="h" x="315" y="31" text-anchor="middle">اسکول کی مثال</text><rect class="panel" x="420" y="0" width="210" height="50"/><text class="h" x="525" y="31" text-anchor="middle">مطلب</text><rect class="panel" x="630" y="0" width="150" height="50"/><text class="h" x="705" y="31" text-anchor="middle">قسم</text><rect class="bg" x="0" y="50" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="105" y="86" text-anchor="middle">مشترکہ ہدف دیں؛ دیکھیں</text><text class="body" x="105" y="106" text-anchor="middle">کہ ہدف اچھا ہو</text><rect class="bg" x="210" y="50" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="315" y="86" text-anchor="middle">طلبہ مل کر اسکول کا</text><text class="body" x="315" y="106" text-anchor="middle">باغیچہ لگاتے ہیں</text><rect class="bg" x="420" y="50" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="525" y="86" text-anchor="middle">مشترکہ مقصد کے لیے</text><text class="body" x="525" y="106" text-anchor="middle">مل کر کام کرنا</text><rect class="panel-a" x="630" y="50" width="150" height="86"/><text class="sh" x="705" y="98" text-anchor="middle">تعاون</text><rect class="bg" x="0" y="136" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="105" y="172" text-anchor="middle">منصفانہ اصول؛ محنت کو</text><text class="body" x="105" y="192" text-anchor="middle">سراہیں، فاتح بدلتے رہیں</text><rect class="bg" x="210" y="136" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="315" y="172" text-anchor="middle">ہاؤسز کے درمیان</text><text class="body" x="315" y="192" text-anchor="middle">سائنس کوئز</text><rect class="bg" x="420" y="136" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="525" y="172" text-anchor="middle">محدود چیز کے حصول</text><text class="body" x="525" y="192" text-anchor="middle">کی کوشش</text><rect class="panel-b" x="630" y="136" width="150" height="86"/><text class="sh" x="705" y="184" text-anchor="middle">مقابلہ</text><rect class="bg" x="0" y="222" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="105" y="258" text-anchor="middle">روکیں، دونوں کو سنیں،</text><text class="body" x="105" y="278" text-anchor="middle">منصفانہ قدم طے کریں</text><rect class="bg" x="210" y="222" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="315" y="258" text-anchor="middle">وقفے میں کرکٹ کی</text><text class="body" x="315" y="278" text-anchor="middle">جگہ پر جھگڑا</text><rect class="bg" x="420" y="222" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="525" y="258" text-anchor="middle">ہر فریق دوسرے پر</text><text class="body" x="525" y="278" text-anchor="middle">غالب آنا چاہتا ہے</text><rect class="panel-c" x="630" y="222" width="150" height="86"/><text class="sh" x="705" y="270" text-anchor="middle">تنازع</text><rect class="bg" x="0" y="308" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="105" y="344" text-anchor="middle">لین دین کو سراہیں</text><text class="body" x="105" y="364" text-anchor="middle">اور خود مثال بنیں</text><rect class="bg" x="210" y="308" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="315" y="344" text-anchor="middle">نئے طالب علم کے لیے</text><text class="body" x="315" y="364" text-anchor="middle">گروہ زبان بدل لیتا ہے</text><rect class="bg" x="420" y="308" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="525" y="344" text-anchor="middle">نبھانے کے لیے خود کو ڈھالنا؛</text><text class="body" x="525" y="364" text-anchor="middle">دونوں کی شناخت برقرار</text><rect class="panel-d" x="630" y="308" width="150" height="86"/><text class="sh" x="705" y="356" text-anchor="middle">مطابقت</text><rect class="bg" x="0" y="394" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="105" y="430" text-anchor="middle">خوش آمدید کہیں، مگر گھر کی</text><text class="body" x="105" y="450" text-anchor="middle">زبان سے کبھی نہ روکیں</text><rect class="bg" x="210" y="394" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="315" y="430" text-anchor="middle">نیا طالب علم آہستہ آہستہ</text><text class="body" x="315" y="450" text-anchor="middle">جماعت جیسا ہو جاتا ہے</text><rect class="bg" x="420" y="394" width="210" height="86" style="stroke:var(--ink);stroke-width:1;stroke-opacity:0.35"/><text class="body" x="525" y="430" text-anchor="middle">رفتہ رفتہ دوسرے گروہ</text><text class="body" x="525" y="450" text-anchor="middle">کے طور طریقے اپنانا</text><rect class="panel-a" x="630" y="394" width="150" height="86"/><text class="sh" x="705" y="442" text-anchor="middle">انجذاب</text><text class="sh" x="390" y="508" text-anchor="middle">مقابلہ ہدف پر نظر رکھتا ہے، تنازع حریف پر۔</text><text class="sh" x="390" y="530" text-anchor="middle">مطابقت میں دونوں شناختیں رہتی ہیں، انجذاب میں ایک جذب ہو جاتی ہے۔</text><text class="wm" x="770" y="552" text-anchor="end">textbook.com.pk</text></svg>