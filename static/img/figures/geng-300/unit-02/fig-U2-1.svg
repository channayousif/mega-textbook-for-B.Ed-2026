<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map showing purpose, audience and context at the centre</title><desc id="d">Concept map showing purpose, audience and context at the centre, with branches to tone, bias, stereotypes, assumptions and inferences.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><line class="stroke" x1="390" y1="90" x2="390" y2="182"/><line class="stroke" x1="600" y1="155" x2="472" y2="212"/><line class="stroke" x1="580" y1="355" x2="472" y2="262"/><line class="stroke" x1="210" y1="355" x2="312" y2="262"/><line class="stroke" x1="195" y1="155" x2="312" y2="212"/><ellipse class="panel-a" cx="390" cy="235" rx="155" ry="56"/><text class="h" x="390" y="228" text-anchor="middle">Purpose, audience,</text><text class="h" x="390" y="250" text-anchor="middle">context</text><rect class="panel-b" x="315" y="40" width="150" height="50" rx="6"/><text class="sh" x="390" y="71" text-anchor="middle">Tone</text><rect class="panel-c" x="600" y="130" width="150" height="50" rx="6"/><text class="sh" x="675" y="161" text-anchor="middle">Bias</text><rect class="panel-d" x="580" y="330" width="150" height="50" rx="6"/><text class="sh" x="655" y="361" text-anchor="middle">Stereotypes</text><rect class="panel-a" x="135" y="330" width="150" height="50" rx="6"/><text class="sh" x="210" y="361" text-anchor="middle">Assumptions</text><rect class="panel-b" x="120" y="130" width="150" height="50" rx="6"/><text class="sh" x="195" y="161" text-anchor="middle">Inferences</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
