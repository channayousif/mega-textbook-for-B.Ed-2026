<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram showing the listening process and barriers to comprehension</title><desc id="d">Diagram showing the listening process and barriers to comprehension: external barriers, internal barriers and language barriers, with strategies for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">The listening process and barriers to comprehension</text><rect class="panel-a" x="40" y="60" width="150" height="60" rx="6"/><text class="sh" x="115" y="90" text-anchor="middle">Hearing</text><text class="small" x="115" y="110" text-anchor="middle">sound reaches the ear</text><rect class="panel-b" x="225" y="60" width="150" height="60" rx="6"/><text class="sh" x="300" y="90" text-anchor="middle">Attending</text><text class="small" x="300" y="110" text-anchor="middle">focus on key points</text><rect class="panel-c" x="410" y="60" width="150" height="60" rx="6"/><text class="sh" x="485" y="90" text-anchor="middle">Interpreting</text><text class="small" x="485" y="110" text-anchor="middle">make sense of meaning</text><rect class="panel-d" x="595" y="60" width="150" height="60" rx="6"/><text class="sh" x="670" y="90" text-anchor="middle">Responding</text><text class="small" x="670" y="110" text-anchor="middle">reply or recall later</text><line class="stroke" x1="190" y1="90" x2="223" y2="90" marker-end="url(#arrow)"/><line class="stroke" x1="375" y1="90" x2="408" y2="90" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="90" x2="593" y2="90" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="170" width="700" height="80" rx="8"/><text class="sh" x="60" y="200">External barriers</text><text class="small" x="60" y="220">noise, poor seating, fast or unclear speech</text><text class="body" x="60" y="240">sit near the front, reduce distractions, ask for repetition</text><rect class="panel-b" x="40" y="265" width="700" height="80" rx="8"/><text class="sh" x="60" y="295">Internal barriers</text><text class="small" x="60" y="315">bias, worry, tiredness, mind wandering</text><text class="body" x="60" y="335">notice your reaction, stay curious, pause and refocus</text><rect class="panel-c" x="40" y="360" width="700" height="80" rx="8"/><text class="sh" x="60" y="390">Language barriers</text><text class="small" x="60" y="410">unfamiliar words, complex sentences, strong accent</text><text class="body" x="60" y="430">use context clues, chunk the speech, confirm key terms</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
