<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing note-taking formats</title><desc id="d">Table comparing note-taking formats: linear notes, mind maps and Cornell notes, each with a description and when to use it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Note-taking formats compared</text><rect class="panel-a" x="14" y="52" width="736" height="36" rx="4"/><rect class="panel" x="14" y="92" width="736" height="110" rx="4"/><rect class="panel" x="14" y="206" width="736" height="110" rx="4"/><rect class="panel" x="14" y="320" width="736" height="110" rx="4"/><rect class="stroke" x="14" y="52" width="736" height="378" rx="4"/><line class="grid" x1="154" y1="52" x2="154" y2="430"/><line class="grid" x1="454" y1="52" x2="454" y2="430"/><text class="sh" x="84" y="75" text-anchor="middle">Format</text><text class="sh" x="304" y="75" text-anchor="middle">Description</text><text class="sh" x="602" y="75" text-anchor="middle">When to use it</text><text class="sh" x="84" y="146" text-anchor="middle">Linear notes</text><text class="body" x="162" y="126"><tspan x="162" dy="0">points written in the order you</tspan><tspan x="162" dy="16">hear or read them, using headings</tspan><tspan x="162" dy="16">and numbered lists</tspan></text><text class="body" x="462" y="126"><tspan x="462" dy="0">a clear, step-by-step lecture</tspan><tspan x="462" dy="16">or textbook chapter</tspan></text><text class="sh" x="84" y="260" text-anchor="middle">Mind map</text><text class="body" x="162" y="240"><tspan x="162" dy="0">a central idea with branches</tspan><tspan x="162" dy="16">for linked ideas, keywords</tspan><tspan x="162" dy="16">and images</tspan></text><text class="body" x="462" y="240"><tspan x="462" dy="0">brainstorming connections</tspan><tspan x="462" dy="16">between topics</tspan></text><text class="sh" x="84" y="374" text-anchor="middle">Cornell notes</text><text class="body" x="162" y="354"><tspan x="162" dy="0">a page split into cues, notes</tspan><tspan x="162" dy="16">and a summary section at</tspan><tspan x="162" dy="16">the bottom</tspan></text><text class="body" x="462" y="354"><tspan x="462" dy="0">reviewing and self-testing</tspan><tspan x="462" dy="16">after a lesson</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
