<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing common biases and stereotypes with examples</title><desc id="d">Table comparing common biases and stereotypes with examples from Pakistani media.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Common biases and stereotypes in the media</text><rect class="panel-a" x="14" y="52" width="736" height="36" rx="4"/><rect class="panel" x="14" y="92" width="736" height="56" rx="4"/><rect class="panel" x="14" y="148" width="736" height="56" rx="4"/><rect class="panel" x="14" y="204" width="736" height="56" rx="4"/><rect class="panel" x="14" y="260" width="736" height="56" rx="4"/><rect class="panel" x="14" y="316" width="736" height="56" rx="4"/><rect class="panel" x="14" y="372" width="736" height="56" rx="4"/><rect class="stroke" x="14" y="52" width="736" height="376" rx="4"/><line class="grid" x1="154" y1="52" x2="154" y2="428"/><line class="grid" x1="454" y1="52" x2="454" y2="428"/><text class="sh" x="84" y="75" text-anchor="middle">Stereotype</text><text class="sh" x="304" y="75" text-anchor="middle">Example</text><text class="sh" x="602" y="75" text-anchor="middle">More neutral alternative</text><text class="sh" x="84" y="122" text-anchor="middle">Gender</text><text class="body" x="162" y="114"><tspan x="162" dy="0">women shown only as</tspan><tspan x="162" dy="16">homemakers or caregivers</tspan></text><text class="body" x="462" y="114"><tspan x="462" dy="0">show people of all genders</tspan><tspan x="462" dy="16">in varied roles</tspan></text><text class="sh" x="84" y="178" text-anchor="middle">Rural / urban</text><text class="body" x="162" y="170"><tspan x="162" dy="0">rural people shown as</tspan><tspan x="162" dy="16">backward or simple</tspan></text><text class="body" x="462" y="170"><tspan x="462" dy="0">present rural and urban</tspan><tspan x="462" dy="16">life with equal respect</tspan></text><text class="sh" x="84" y="234" text-anchor="middle">Religious</text><text class="body" x="162" y="226"><tspan x="162" dy="0">one faith shown as the</tspan><tspan x="162" dy="16">norm, others as exotic</tspan></text><text class="body" x="462" y="226"><tspan x="462" dy="0">treat all faiths as</tspan><tspan x="462" dy="16">equally familiar</tspan></text><text class="sh" x="84" y="290" text-anchor="middle">Ethnic</text><text class="body" x="162" y="282"><tspan x="162" dy="0">a single ethnic group</tspan><tspan x="162" dy="16">always cast as comic relief</tspan></text><text class="body" x="462" y="282"><tspan x="462" dy="0">share humour across groups,</tspan><tspan x="462" dy="16">not at one group's cost</tspan></text><text class="sh" x="84" y="346" text-anchor="middle">Age</text><text class="body" x="162" y="338"><tspan x="162" dy="0">older people always shown</tspan><tspan x="162" dy="16">as frail or out of touch</tspan></text><text class="body" x="462" y="338"><tspan x="462" dy="0">show older and younger</tspan><tspan x="462" dy="16">people contributing alike</tspan></text><text class="sh" x="84" y="402" text-anchor="middle">Political</text><text class="body" x="162" y="394"><tspan x="162" dy="0">one party's view presented</tspan><tspan x="162" dy="16">as plain fact</tspan></text><text class="body" x="462" y="394"><tspan x="462" dy="0">label opinions as opinions,</tspan><tspan x="462" dy="16">name the standpoint</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
