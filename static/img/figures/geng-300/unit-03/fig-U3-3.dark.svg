<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Planning and delivering a presentation</title><desc id="d">Flowchart showing planning and delivering a presentation from preparation to follow-up. Steps flow left to right then down and back: choose topic, research, organise content, prepare visual aids, then down to practise, deliver, handle Q&A and follow up.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="74" y="50" width="140" height="70" rx="6"/><text class="sh" x="144" y="90" text-anchor="middle">Choose topic</text><rect class="panel-b" x="238" y="50" width="140" height="70" rx="6"/><text class="sh" x="308" y="90" text-anchor="middle">Research</text><rect class="panel-c" x="402" y="50" width="140" height="70" rx="6"/><text class="sh" x="472" y="80" text-anchor="middle">Organise</text><text class="sh" x="472" y="100" text-anchor="middle">content</text><rect class="panel-d" x="566" y="50" width="140" height="70" rx="6"/><text class="sh" x="636" y="80" text-anchor="middle">Prepare visual</text><text class="sh" x="636" y="100" text-anchor="middle">aids</text><rect class="panel-d" x="566" y="330" width="140" height="70" rx="6"/><text class="sh" x="636" y="370" text-anchor="middle">Practise</text><rect class="panel-c" x="402" y="330" width="140" height="70" rx="6"/><text class="sh" x="472" y="370" text-anchor="middle">Deliver</text><rect class="panel-b" x="238" y="330" width="140" height="70" rx="6"/><text class="sh" x="308" y="360" text-anchor="middle">Handle</text><text class="sh" x="308" y="380" text-anchor="middle">Q and A</text><rect class="panel-a" x="74" y="330" width="140" height="70" rx="6"/><text class="sh" x="144" y="370" text-anchor="middle">Follow up</text><line class="stroke" x1="214" y1="85" x2="238" y2="85" marker-end="url(#a3)"/><line class="stroke" x1="378" y1="85" x2="402" y2="85" marker-end="url(#a3)"/><line class="stroke" x1="542" y1="85" x2="566" y2="85" marker-end="url(#a3)"/><line class="stroke" x1="636" y1="120" x2="636" y2="330" marker-end="url(#a3)"/><line class="stroke" x1="566" y1="365" x2="542" y2="365" marker-end="url(#a3)"/><line class="stroke" x1="402" y1="365" x2="378" y2="365" marker-end="url(#a3)"/><line class="stroke" x1="238" y1="365" x2="214" y2="365" marker-end="url(#a3)"/><rect class="panel" x="270" y="168" width="240" height="134" rx="8"/><text class="h" x="390" y="198" text-anchor="middle">Two phases</text><text class="sh" x="390" y="228" text-anchor="middle">Planning (top row)</text><text class="body" x="390" y="250" text-anchor="middle">choose, research, organise,</text><text class="body" x="390" y="268" text-anchor="middle">design your support</text><text class=