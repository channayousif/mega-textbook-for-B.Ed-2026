<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Document structure templates compared</title><desc id="d">Table comparing document structure templates for emails, reports and letters with structure and tone notes for each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="220" height="70"/><text class="h" x="110" y="32" text-anchor="middle">Document type</text><text class="small" x="110" y="54" text-anchor="middle">the form you are writing</text><rect class="panel-b" x="220" y="0" width="280" height="70"/><text class="h" x="360" y="32" text-anchor="middle">Structure</text><text class="small" x="360" y="54" text-anchor="middle">the order of parts</text><rect class="panel-c" x="500" y="0" width="280" height="70"/><text class="h" x="640" y="32" text-anchor="middle">Tone</text><text class="small" x="640" y="54" text-anchor="middle">the level of formality</text><rect class="panel" x="0" y="70" width="220" height="130"/><text class="sh" x="110" y="140" text-anchor="middle">Email</text><rect class="panel" x="0" y="200" width="220" height="130"/><text class="sh" x="110" y="270" text-anchor="middle">Report</text><rect class="panel" x="0" y="330" width="220" height="130"/><text class="sh" x="110" y="400" text-anchor="middle">Letter</text><text class="body" x="360" y="112" text-anchor="middle">subject line, greeting,</text><text class="body" x="360" y="132" text-anchor="middle">purpose, detail, close</text><text class="small" x="360" y="168" text-anchor="middle">short paragraphs, clear action</text><text class="body" x="360" y="242" text-anchor="middle">title, executive summary,</text><text class="body" x="360" y="262" text-anchor="middle">findings, recommendations</text><text class="small" x="360" y="298" text-anchor="middle">headings and evidence</text><text class="body" x="360" y="372" text-anchor="middle">sender address, date, salutation,</text><text class="body" x="360" y="392" text-anchor="middle">body, sign-off</text><text class="small" x="360" y="428" text-anchor="middle">formal conventions and courtesy</text><text class="body" x="640" y="122" text-anchor="middle">polite, direct,</text><text class="body" x="640" y="142" text-anchor="middle">semi-formal</text><text class="body" x="640" y="252" text-anchor="middle">objective, formal,</text><text class="body" x="640" y="272" text-anchor="middle">evidence-led</text><text class="body" x="640" y="382" text-anchor="middle">formal, respectful,</text><text class="body" x="640" y="402" text-anchor="middle">relationship-aware</text><line class="grid" x1="220" y1="0" x2="220" y2="470"/><line class="grid" x1="500" y1="0" x2="500" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="200" x2="780" y2="200"/><line class="grid" x1="0" y1="330" x2="780" y2="330"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
