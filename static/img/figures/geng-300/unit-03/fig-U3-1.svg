<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Principles of effective communication</title><desc id="d">Concept map showing the principles of effective communication and how they interact. A central node for effective communication connects to five principles: clarity, correctness, coherence, courteousness and conciseness.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><line class="stroke" x1="390" y1="235" x2="390" y2="50" marker-end="url(#a1)"/><line class="stroke" x1="390" y1="235" x2="675" y2="135" marker-end="url(#a1)"/><line class="stroke" x1="390" y1="235" x2="675" y2="340" marker-end="url(#a1)"/><line class="stroke" x1="390" y1="235" x2="105" y2="340" marker-end="url(#a1)"/><line class="stroke" x1="390" y1="235" x2="105" y2="135" marker-end="url(#a1)"/><rect class="panel-b" x="310" y="20" width="160" height="60" rx="6"/><text class="sh" x="390" y="48" text-anchor="middle">Clarity</text><text class="small" x="390" y="68" text-anchor="middle">an understandable message</text><rect class="panel-c" x="590" y="105" width="170" height="60" rx="6"/><text class="sh" x="675" y="133" text-anchor="middle">Coherence</text><text class="small" x="675" y="153" text-anchor="middle">logical connections</text><rect class="panel-d" x="590" y="310" width="170" height="60" rx="6"/><text class="sh" x="675" y="338" text-anchor="middle">Conciseness</text><text class="small" x="675" y="358" text-anchor="middle">brief and to the point</text><rect class="panel-a" x="20" y="310" width="170" height="60" rx="6"/><text class="sh" x="105" y="338" text-anchor="middle">Courteousness</text><text class="small" x="105" y="358" text-anchor="middle">polite, respectful tone</text><rect class="panel-a" x="20" y="105" width="170" height="60" rx="6"/><text class="sh" x="105" y="133" text-anchor="middle">Correctness</text><text class="small" x="105" y="153" text-anchor="middle">accurate and error-free</text><ellipse class="panel-b" cx="390" cy="235" rx="145" ry="55"/><text class="h" x="390" y="230" text-anchor="middle">Effective</text><text class="h" x="390" y="252" text-anchor="middle">communication</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
