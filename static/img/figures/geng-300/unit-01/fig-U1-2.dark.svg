<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Word formation processes</title><desc id="d">Diagram showing the word-formation processes: affixation, compounding, clipping and back formation, each illustrated with examples.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700} .sh{font-size:13px;font-weight:700} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">Word formation processes</text><text class="small" x="390" y="54" text-anchor="middle">four ways English builds new words, each with a definition and examples</text><rect class="panel-a" x="15" y="70" width="180" height="380" rx="6"/><rect class="panel-a" x="15" y="70" width="180" height="46"/><text class="sh" x="105" y="98" text-anchor="middle">affixation</text><text class="small" x="105" y="140" text-anchor="middle">add a prefix or</text><text class="small" x="105" y="156" text-anchor="middle">suffix to a base</text><line class="grid" x1="30" y1="176" x2="180" y2="176"/><text class="body" x="105" y="210" text-anchor="middle">un + happy</text><text class="small" x="105" y="228" text-anchor="middle">prefix un-</text><text class="body" x="105" y="266" text-anchor="middle">happy + ness</text><text class="small" x="105" y="284" text-anchor="middle">suffix -ness</text><rect class="panel-b" x="205" y="70" width="180" height="380" rx="6"/><rect class="panel-b" x="205" y="70" width="180" height="46"/><text class="sh" x="295" y="98" text-anchor="middle">compounding</text><text class="small" x="295" y="140" text-anchor="middle">join two free</text><text class="small" x="295" y="156" text-anchor="middle">morphemes</text><line class="grid" x1="220" y1="176" x2="370" y2="176"/><text class="body" x="295" y="210" text-anchor="middle">black + board</text><text class="small" x="295" y="228" text-anchor="middle">blackboard</text><text class="body" x="295" y="266" text-anchor="middle">note + book</text><text class="small" x="295" y="284" text-anchor="middle">notebook</text><rect class="panel-c" x="395" y="70" width="180" height="380" rx="6"/><rect class="panel-c" x="395" y="70" width="180" height="46"/><text class="sh" x="485" y="98" text-anchor="middle">clipping</text><text class="small" x="485" y="140" text-anchor="middle">shorten an</text><text class="small" x="485" y="156" text-anchor="middle">existing word</text><line class="grid" x1="410" y1="176" x2="560" y2="176"/><text class="body" x="485" y="210" text-anchor="middle">advertisement</text><text class="small" x="485" y="228" text-anchor="middle">ad</text><text class="body" x="485" y="266" text-anchor="middle">telephone</text><text class="small" x="485" y="284" text-anchor="middle">phone</text><rect class="panel-d" x="585" y="70" width="180" height="380" rx="6"/><rect class="panel-d" x="585" y="70" width="180" height="46"/><text class="sh" x="675" y="98" text-anchor="middle">back formation</text><text class="small" x="675" y="140" text-anchor="middle">remove a real or</text><text class="small" x="675" y="156" text-anchor="middle">supposed affix</text><line class="grid" x1="600" y1="176" x2="750" y2="176"/><text class="body" x="675" y="210" text-anchor="middle">editor</text><text class="small" x="675" y="228" text-anchor="middle">edit</text><text class="body" x="675" y="266" text-anchor="middle">burglar</text><text class="small" x="675" y="284" text-anchor="middle">burgle</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
