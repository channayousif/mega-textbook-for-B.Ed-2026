<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The English sound system</title><desc id="d">Diagram showing the English sound system: vowels, diphthongs and consonants, with sounds that do not exist in Urdu highlighted.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .sh{font-size:13px;font-weight:700} .body{font-size:14px;fill:var(--ink)} .small{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} .flag{fill:var(--a3);stroke:var(--a3)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">The English sound system</text><text class="small" x="390" y="54" text-anchor="middle">vowels, diphthongs and consonants; a diamond marks a sound absent from Urdu</text><rect class="panel-a" x="15" y="70" width="240" height="352"/><rect class="panel-a" x="15" y="70" width="240" height="40"/><text class="sh" x="135" y="96" text-anchor="middle">Vowels</text><rect class="panel-b" x="270" y="70" width="170" height="352"/><rect class="panel-b" x="270" y="70" width="170" height="40"/><text class="sh" x="355"