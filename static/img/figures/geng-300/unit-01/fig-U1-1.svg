<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Vocabulary knowledge concept map</title><desc id="d">Concept map showing vocabulary knowledge at the centre with branches to contextual usage, register, collocation, connotation, synonyms, antonyms and idiomatic expressions.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .sh{font-size:13px;font-weight:700} .body{font-size:14px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} .link{stroke:var(--line);stroke-width:2;fill:none}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="112" ry="46" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="230">Vocabulary</text><text class="h" x="390" y="250">knowledge</text><rect class="panel-a" x="20" y="46" width="170" height="54" rx="6"/><text class="sh" x="105" y="70">contextual</text><text class="sh" x="105" y="88">usage</text><rect class="panel-b" x="590" y="46" width="170" height="54" rx="6"/><text class="sh" x="675" y="70">register</text><text class="sh" x="675" y="88">formality level</text><rect class="panel-c" x="620" y="170" width="150" height="54" rx="6"/><text class="sh" x="695" y="194">collocation</text><text class="sh" x="695" y="212">word partners</text><rect class="panel-d" x="590" y="316" width="170" height="54" rx="6"/><text class="sh" x="675" y="340">connotation</text><text class="sh" x="675" y="358">implied meaning</text><rect class="panel-a" x="295" y="400" width="190" height="54" rx="6"/><text class="sh" x="390" y="424">idiomatic</text><text class="sh" x="390" y="442">expressions</text><rect class="panel-b" x="20" y="316" width="170" height="54" rx="6"/><text class="sh" x="105" y="340">antonyms</text><text class="sh" x="105" y="358">opposites</text><rect class="panel-c" x="20" y="170" width="150" height="54" rx="6"/><text class="sh" x="95" y="194">synonyms</text><text class="sh" x="95" y="212">similar words</text><line class="link" x1="268" y1="155" x2="175" y2="105" marker-end="url(#ar)"/><line class="link" x1="512" y1="155" x2="605" y2="105" marker-end="url(#ar)"/><line class="link" x1="580" y1="210" x2="630" y2="205" marker-end="url(#ar)"/><line class="link" x1="512" y1="320" x2="605" y2="355" marker-end="url(#ar)"/><line class="link" x1="390" y1="283" x2="390" y2="395" marker-end="url(#ar)"/><line class="link" x1="268" y1="320" x2="175" y2="355" marker-end="url(#ar)"/><line class="link" x1="200" y1="210" x2="160" y2="205" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
