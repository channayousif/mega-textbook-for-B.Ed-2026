<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four sentence structures</title><desc id="d">Table comparing the four sentence structures with examples: simple, compound, complex and compound-complex.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700} .sh{font-size:13px;font-weight:700} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">The four sentence structures</text><text class="small" x="390" y="54" text-anchor="middle">each structure shown with an example and its clause count</text><rect class="panel-a" x="20" y="78" width="170" height="50"/><text class="sh" x="105" y="108" text-anchor="middle">Structure</text><rect class="panel-b" x="190" y="78" width="370" height="50"/><text class="sh" x="375" y="108" text-anchor="middle">Example</text><rect class="panel-c" x="560" y="78" width="200" height="50"/><text class="sh" x="660" y="108" text-anchor="middle">Clause count</text><rect class="panel-a" x="20" y="128" width="170" height="74"/><text class="body" x="105" y="166" text-anchor="middle">simple</text><text class="small" x="105" y="186" text-anchor="middle">one independent</text><rect class="panel-b" x="190" y="128" width="370" height="74"/><text class="body" x="375" y="166" text-anchor="middle">The students read the text.</text><rect class="panel-c" x="560" y="128" width="200" height="74"/><text class="body" x="660" y="158" text-anchor="middle">1 independent</text><text class="small" x="660" y="178" text-anchor="middle">0 dependent</text><rect class="panel-a" x="20" y="202" width="170" height="74"/><text class="body" x="105" y="240" text-anchor="middle">compound</text><text class="small" x="105" y="260" text-anchor="middle">two independent</text><rect class="panel-b" x="190" y="202" width="370" height="74"/><text class="body" x="375" y="232" text-anchor="middle">The students read the text,</text><text class="body" x="375" y="252" text-anchor="middle">and they discussed it.</text><rect class="panel-c" x="560" y="202" width="200" height="74"/><text class="body" x="660" y="232" text-anchor="middle">2 independent</text><text class="small" x="660" y="252" text-anchor="middle">0 dependent</text><rect class="panel-a" x="20" y="276" width="170" height="74"/><text class="body" x="105" y="306" text-anchor="middle">complex</text><text class="small" x="105" y="326" text-anchor="middle">one of each</text><rect class="panel-b" x="190" y="276" width="370" height="74"/><text class="body" x="375" y="306" text-anchor="middle">When the students read the</text><text class="body" x="375" y="326" text-anchor="middle">text, they discussed it.</text><rect class="panel-c" x="560" y="276" width="200" height="74"/><text class="body" x="660" y="306" text-anchor="middle">1 independent</text><text class="small" x="660" y="326" text-anchor="middle">1 dependent</text><rect class="panel-a" x="20" y="350" width="170" height="74"/><text class="body" x="105" y="380" text-anchor="middle">compound-</text><text class="body" x="105" y="398" text-anchor="middle">complex</text><rect class="panel-b" x="190" y="350" width="370" height="74"/><text class="body" x="375" y="380" text-anchor="middle">When the students read the text,</text><text class="body" x="375" y="400" text-anchor="middle">they discussed it, and they wrote notes.</text><rect class="panel-c" x="560" y="350" width="200" height="74"/><text class="body" x="660" y="380" text-anchor="middle">2 independent</text><text class="small" x="660" y="400" text-anchor="middle">1 dependent</text><line class="grid" x1="190" y1="78" x2="190" y2="424"/><line class="grid" x1="560" y1="78" x2="560" y2="424"/><line class="grid" x1="20" y1="128" x2="760" y2="128"/><line class="grid" x1="20" y1="202" x2="760" y2="202"/><line class="grid" x1="20" y1="276" x2="760" y2="276"/><line class="grid" x1="20" y1="350" x2="760" y2="350"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
