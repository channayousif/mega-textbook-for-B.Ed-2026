<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Writing purposes</title><desc id="d">A concept map placing 'Writing purposes' at the centre with four branches - inform (present facts), analyze (break down), persuade (argue a case), entertain (engage the reader).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="110" ry="50" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="232">Writing purposes</text><rect class="panel" x="30" y="30" width="160" height="55" rx="6"/><text class="h" x="110" y="55">Inform</text><text class="m" x="110" y="72">present facts</text><rect class="panel" x="600" y="30" width="160" height="55" rx="6"/><text class="h" x="680" y="55">Analyze</text><text class="m" x="680" y="72">break down</text><rect class="panel" x="30" y="385" width="160" height="55" rx="6"/><text class="h" x="110" y="410">Persuade</text><text class="m" x="110" y="427">argue a case</text><rect class="panel" x="600" y="385" width="160" height="55" rx="6"/><text class="h" x="680" y="410">Entertain</text><text class="m" x="680" y="427">engage the reader</text><line class="link" x1="190" y1="57" x2="290" y2="210" marker-end="url(#ar)"/><line class="link" x1="600" y1="57" x2="500" y2="210" marker-end="url(#ar)"/><line class="link" x1="190" y1="412" x2="290" y2="260" marker-end="url(#ar)"/><line class="link" x1="600" y1="412" x2="500" y2="260" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
