<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Audience spectrum</title><desc id="d">A diagram showing the audience-awareness spectrum from academic to public, with key differences in language, tone and structure.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="60" width="220" height="120" rx="10"/><text class="h" x="140" y="100" font-size="16">Academic</text><text x="140" y="130">formal tone</text><text x="140" y="150">citations, hedging</text><text x="140" y="170">complex sentences</text><rect class="panel" x="280" y="60" width="220" height="120" rx="10"/><text class="h" x="390" y="100" font-size="16">Semi-formal</text><text x="390" y="130">clear, warm tone</text><text x="390" y="150">some citations</text><text x="390" y="170">moderate sentences</text><rect class="panel" x="530" y="60" width="220" height="120" rx="10"/><text class="h" x="640" y="100" font-size="16">Public</text><text x="640" y="130">accessible tone</text><text x="640" y="150">no citations needed</text><text x="640" y="170">short, scannable</text><rect x="30" y="250" width="720" height="120" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="390" y="290">Adjust your language to your audience</text><text x="390" y="320">The same topic can be written for a tutor, a parent or a newsletter.</text><text x="390" y="340">Match tone, vocabulary and structure to the reader.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
