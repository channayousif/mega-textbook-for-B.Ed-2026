<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Hedging language</title><desc id="d">Table of hedging language phrases ranked by strength, with examples.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="110" height="40" rx="4"/><text class="h" x="75" y="44">Strength</text><rect class="panel" x="130" y="20" width="250" height="40" rx="4"/><text class="h" x="255" y="44">Phrases</text><rect class="panel" x="380" y="20" width="380" height="40" rx="4"/><text class="h" x="570" y="44">Example</text><rect class="panel" x="20" y="60" width="110" height="90" rx="4"/><text class="rl" x="75" y="105">Strong</text><rect class="panel" x="130" y="60" width="250" height="90" rx="4"/><text x="255" y="95">The evidence shows</text><text x="255" y="115">This demonstrates</text><rect class="panel" x="380" y="60" width="380" height="90" rx="4"/><text x="570" y="100">The evidence shows that</text><text x="570" y="120">homework improves results</text><rect class="panel" x="20" y="150" width="110" height="90" rx="4"/><text class="rl" x="75" y="195">Moderate</text><rect class="panel" x="130" y="150" width="250" height="90" rx="4"/><text x="255" y="185">Research suggests</text><text x="255" y="205">Studies indicate</text><rect class="panel" x="380" y="150" width="380" height="90" rx="4"/><text x="570" y="190">Research suggests that group</text><text x="570" y="210">work may improve learning</text><rect class="panel" x="20" y="240" width="110" height="90" rx="4"/><text class="rl" x="75" y="285">Cautious</text><rect class="panel" x="130" y="240" width="250" height="90" rx="4"/><text x="255" y="275">It appears that</text><text x="255" y="295">This may suggest</text><rect class="panel" x="380" y="240" width="380" height="90" rx="4"/><text x="570" y="280">It appears that smaller classes</text><text x="570" y="300">may benefit some pupils</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
