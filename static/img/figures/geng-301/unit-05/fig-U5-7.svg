<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Public writing forms</title><desc id="d">Table comparing three public writing forms by length, tone and key features.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="130" height="40" rx="4"/><text class="h" x="85" y="44">Form</text><rect class="panel" x="150" y="20" width="150" height="40" rx="4"/><text class="h" x="225" y="44">Length</text><rect class="panel" x="300" y="20" width="150" height="40" rx="4"/><text class="h" x="375" y="44">Tone</text><rect class="panel" x="450" y="20" width="310" height="40" rx="4"/><text class="h" x="605" y="44">Key features</text><rect class="panel" x="20" y="60" width="130" height="120" rx="4"/><text class="rl" x="85" y="120">Opinion column</text><rect class="panel" x="150" y="60" width="150" height="120" rx="4"/><text x="225" y="120">400-800 words</text><rect class="panel" x="300" y="60" width="150" height="120" rx="4"/><text x="375" y="120">argumentative</text><text x="375" y="140">persuasive</text><rect class="panel" x="450" y="60" width="310" height="120" rx="4"/><text x="605" y="110">strong opening hook</text><text x="605" y="130">clear thesis</text><text x="605" y="150">evidence and reasoning</text><rect class="panel" x="20" y="180" width="130" height="120" rx="4"/><text class="rl" x="85" y="240">Newsletter</text><rect class="panel" x="150" y="180" width="150" height="120" rx="4"/><text x="225" y="240">200-400 words</text><rect class="panel" x="300" y="180" width="150" height="120" rx="4"/><text x="375" y="240">warm, welcoming</text><text x="375" y="260">informative</text><rect class="panel" x="450" y="180" width="310" height="120" rx="4"/><text x="605" y="230">short paragraphs</text><text x="605" y="250">bullet points OK</text><text x="605" y="270">dates and times prominent</text><rect class="panel" x="20" y="300" width="130" height="120" rx="4"/><text class="rl" x="85" y="360">Blog post</text><rect class="panel" x="150" y="300" width="150" height="120" rx="4"/><text x="225" y="360">300-600 words</text><rect class="panel" x="300" y="300" width="150" height="120" rx="4"/><text x="375" y="360">conversational</text><text x="375" y="380">informal OK</text><rect class="panel" x="450" y="300" width="310" height="120" rx="4"/><text x="605" y="350">subheadings</text><text x="605" y="370">personal voice</text><text x="605" y="390">short paragraphs</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
