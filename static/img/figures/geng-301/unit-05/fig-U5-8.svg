<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Style checklist</title><desc id="d">A style checklist showing the features, appropriate uses and sample opening phrases for formal, semi-formal and informal register.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="120" height="40" rx="4"/><text class="h" x="80" y="44">Register</text><rect class="panel" x="140" y="20" width="220" height="40" rx="4"/><text class="h" x="250" y="44">Features</text><rect class="panel" x="360" y="20" width="200" height="40" rx="4"/><text class="h" x="460" y="44">Appropriate for</text><rect class="panel" x="560" y="20" width="200" height="40" rx="4"/><text class="h" x="660" y="44">Sample opening</text><rect class="panel" x="20" y="60" width="120" height="120" rx="4"/><text class="rl" x="80" y="120">Formal</text><rect class="panel" x="140" y="60" width="220" height="120" rx="4"/><text x="250" y="100">third person</text><text x="250" y="120">no contractions</text><text x="250" y="140">technical vocabulary</text><text x="250" y="160">citations required</text><rect class="panel" x="360" y="60" width="200" height="120" rx="4"/><text x="460" y="110">academic essays</text><text x="460" y="130">reports</text><text x="460" y="150">official letters</text><rect class="panel" x="560" y="60" width="200" height="120" rx="4"/><text x="660" y="110">This study examines...</text><text x="660" y="130">The evidence suggests...</text><rect class="panel" x="20" y="180" width="120" height="120" rx="4"/><text class="rl" x="80" y="240">Semi-formal</text><rect class="panel" x="140" y="180" width="220" height="120" rx="4"/><text x="250" y="220">first or third person</text><text x="250" y="240">few contractions</text><text x="250" y="260">clear vocabulary</text><text x="250" y="280">some citations</text><rect class="panel" x="360" y="180" width="200" height="120" rx="4"/><text x="460" y="230">newsletters</text><text x="460" y="250">emails to parents</text><text x="460" y="270">staff meetings</text><rect class="panel" x="560" y="180" width="200" height="120" rx="4"/><text x="660" y="230">Just a reminder that...</text><text x="660" y="250">We are pleased to...</text><rect class="panel" x="20" y="300" width="120" height="120" rx="4"/><text class="rl" x="80" y="360">Informal</text><rect class="panel" x="140" y="300" width="220" height="120" rx="4"/><text x="250" y="340">first person OK</text><text x="250" y="360">contractions OK</text><text x="250" y="380">everyday vocabulary</text><text x="250" y="400">personal voice</text><rect class="panel" x="360" y="300" width="200" height="120" rx="4"/><text x="460" y="350">reflections</text><text x="460" y="370">blogs</text><text x="460" y="390">personal notes</text><rect class="panel" x="560" y="300" width="200" height="120" rx="4"/><text x="660" y="350">I have noticed that...</text><text x="660" y="370">Last week I tried...</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
