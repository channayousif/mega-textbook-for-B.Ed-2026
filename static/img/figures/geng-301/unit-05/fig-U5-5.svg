<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Purpose and strategy</title><desc id="d">Table comparing four writing purposes by strategy and the signal words teachers use to set each type of task.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="110" height="40" rx="4"/><text class="h" x="75" y="44">Purpose</text><rect class="panel" x="130" y="20" width="250" height="40" rx="4"/><text class="h" x="255" y="44">Strategy</text><rect class="panel" x="380" y="20" width="380" height="40" rx="4"/><text class="h" x="570" y="44">Signal words</text><rect class="panel" x="20" y="60" width="110" height="90" rx="4"/><text class="rl" x="75" y="105">Inform</text><rect class="panel" x="130" y="60" width="250" height="90" rx="4"/><text x="255" y="95">present facts clearly</text><text x="255" y="115">and objectively</text><rect class="panel" x="380" y="60" width="380" height="90" rx="4"/><text x="570" y="100">explain, describe, outline,</text><text x="570" y="120">according to</text><rect class="panel" x="20" y="150" width="110" height="90" rx="4"/><text class="rl" x="75" y="195">Analyze</text><rect class="panel" x="130" y="150" width="250" height="90" rx="4"/><text x="255" y="185">break a topic into parts</text><text x="255" y="205">and examine them</text><rect class="panel" x="380" y="150" width="380" height="90" rx="4"/><text x="570" y="190">analyze, compare, examine,</text><text x="570" y="210">evaluate</text><rect class="panel" x="20" y="240" width="110" height="90" rx="4"/><text class="rl" x="75" y="285">Persuade</text><rect class="panel" x="130" y="240" width="250" height="90" rx="4"/><text x="255" y="275">argue for a position</text><text x="255" y="295">with evidence</text><rect class="panel" x="380" y="240" width="380" height="90" rx="4"/><text x="570" y="280">argue, recommend, should,</text><text x="570" y="300">must, defend</text><rect class="panel" x="20" y="330" width="110" height="90" rx="4"/><text class="rl" x="75" y="375">Entertain</text><rect class="panel" x="130" y="330" width="250" height="90" rx="4"/><text x="255" y="365">engage through story</text><text x="255" y="385">or humour</text><rect class="panel" x="380" y="330" width="380" height="90" rx="4"/><text x="570" y="370">imagine, picture this,</text><text x="570" y="390">once, consider</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
