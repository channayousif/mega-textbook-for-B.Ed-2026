<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Writing purposes</title><desc id="d">A concept map placing "Writing purposes" at the centre with four branches: inform, analyze, persuade and entertain.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="110" ry="50" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="232">Writing purposes</text><rect class="panel" x="30" y="30" width="160" height="55" rx="6"/><text class="h" x="110" y="55">Inform</text><text class="m" x="110" y="72">present facts</text><rect class="panel" x="600" y="30" width="160" height="55" rx="6"/><text class="h" x="680" y="55">Analyze</text><text class="m" x="680" y="72">break down</text><rect class="panel" x="30" y="385" width="160" height="55" rx="6"/><text class="h" x="110" y="410">Persuade</text><text class="m" x="110" y="427">argue a case</text><rect class="panel" x="600" y="385" width="160" height="55" rx="6"/><text class="h" x="680" y="410">Entertain</text><text class="m" x="680" y="427">engage the reader</text><line class="link" x1="190" y1="57" x2="290" y2="210" marker-end="url(#ar)"/><line class="link" x1="600" y1="57" x2="500" y2="210" marker-end="url(#ar)"/><line class="link" x1="190" y1="412" x2="290" y2="260" marker-end="url(#ar)"/><line class="link" x1="600" y1="412" x2="500" y2="260" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
