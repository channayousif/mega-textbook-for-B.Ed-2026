<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Academic and informal writing</title><desc id="d">Table comparing informal and academic writing on tone, vocabulary, evidence and person.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="130" height="40" rx="4"/><text class="h" x="85" y="44">Element</text><rect class="panel" x="150" y="20" width="280" height="40" rx="4"/><text class="h" x="290" y="44">Informal</text><rect class="panel" x="430" y="20" width="330" height="40" rx="4"/><text class="h" x="595" y="44">Academic</text><rect class="panel" x="20" y="60" width="130" height="90" rx="4"/><text class="rl" x="85" y="105">Tone</text><rect class="panel" x="150" y="60" width="280" height="90" rx="4"/><text x="290" y="95">personal, conversational</text><text x="290" y="115">first person, slang OK</text><rect class="panel" x="430" y="60" width="330" height="90" rx="4"/><text x="595" y="95">formal, objective</text><text x="595" y="115">third person, no slang</text><rect class="panel" x="20" y="150" width="130" height="90" rx="4"/><text class="rl" x="85" y="195">Vocabulary</text><rect class="panel" x="150" y="150" width="280" height="90" rx="4"/><text x="290" y="185">everyday words</text><text x="290" y="205">contractions OK</text><rect class="panel" x="430" y="150" width="330" height="90" rx="4"/><text x="595" y="185">precise, technical terms</text><text x="595" y="205">no contractions</text><rect class="panel" x="20" y="240" width="130" height="90" rx="4"/><text class="rl" x="85" y="285">Evidence</text><rect class="panel" x="150" y="240" width="280" height="90" rx="4"/><text x="290" y="275">personal experience</text><text x="290" y="295">opinions</text><rect class="panel" x="430" y="240" width="330" height="90" rx="4"/><text x="595" y="275">cited sources, data</text><text x="595" y="295">research findings</text><rect class="panel" x="20" y="330" width="130" height="90" rx="4"/><text class="rl" x="85" y="375">Person</text><rect class="panel" x="150" y="330" width="280" height="90" rx="4"/><text x="290" y="365">first person (I, we)</text><text x="290" y="385">common</text><rect class="panel" x="430" y="330" width="330" height="90" rx="4"/><text x="595" y="365">third person or passive</text><text x="595" y="385">first person rare</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
