<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Tone adjustments</title><desc id="d">Table showing how the same content changes in tone when written for three audiences: academic tutor, parent newsletter and personal reflection.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="200" height="40" rx="4"/><text class="h" x="120" y="44">Academic tutor</text><rect class="panel" x="220" y="20" width="260" height="40" rx="4"/><text class="h" x="350" y="44">Parent newsletter</text><rect class="panel" x="480" y="20" width="280" height="40" rx="4"/><text class="h" x="620" y="44">Personal reflection</text><rect class="panel" x="20" y="60" width="200" height="100" rx="4"/><text x="120" y="105">Research indicates that</text><text x="120" y="125">structured homework may</text><text x="120" y="145">enhance learning outcomes</text><rect class="panel" x="220" y="60" width="260" height="100" rx="4"/><text x="350" y="105">Giving a small amount of</text><text x="350" y="125">homework each day helps</text><text x="350" y="145">children practise at home</text><rect class="panel" x="480" y="60" width="280" height="100" rx="4"/><text x="620" y="105">I have seen how daily</text><text x="620" y="125">homework changes the way</text><text x="620" y="145">my pupils think about learning</text><rect class="panel" x="20" y="160" width="200" height="60" rx="4"/><text class="rl" x="120" y="190">Tone: formal, objective</text><rect class="panel" x="220" y="160" width="260" height="60" rx="4"/><text class="rl" x="350" y="190">Tone: warm, clear</text><rect class="panel" x="480" y="160" width="280" height="60" rx="4"/><text class="rl" x="620" y="190">Tone: personal, reflective</text><rect class="panel" x="20" y="220" width="200" height="60" rx="4"/><text class="rl" x="120" y="250">Evidence: cited sources</text><rect class="panel" x="220" y="220" width="260" height="60" rx="4"/><text class="rl" x="350" y="250">Evidence: practical tips</text><rect class="panel" x="480" y="220" width="280" height="60" rx="4"/><text class="rl" x="620" y="250">Evidence: own experience</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
