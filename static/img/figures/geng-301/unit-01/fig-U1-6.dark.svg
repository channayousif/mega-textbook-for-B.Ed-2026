<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Weak and strong paragraph</title><desc id="d">Table comparing a weak paragraph and a strong paragraph by sentence role.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="120" height="40" rx="4"/><text class="h" x="80" y="44">Role</text><rect class="panel" x="140" y="20" width="300" height="40" rx="4"/><text class="h" x="290" y="44">Weak paragraph</text><rect class="panel" x="440" y="20" width="320" height="40" rx="4"/><text class="h" x="600" y="44">Strong paragraph</text><rect class="panel" x="20" y="60" width="120" height="80" rx="4"/><text class="rl" x="80" y="100">Topic sentence</text><rect class="panel" x="140" y="60" width="300" height="80" rx="4"/><text x="290" y="95">Group work is a very</text><text x="290" y="112">good thing for pupils</text><rect class="panel" x="440" y="60" width="320" height="80" rx="4"/><text x="600" y="95">Group work develops</text><text x="600" y="112">communication and teamwork skills</text><rect class="panel" x="20" y="140" width="120" height="80" rx="4"/><text class="rl" x="80" y="180">Supporting detail</text><rect class="panel" x="140" y="140" width="300" height="80" rx="4"/><text x="290" y="175">It is fun and pupils</text><text x="290" y="192">like doing it</text><rect class="panel" x="440" y="140" width="320" height="80" rx="4"/><text x="600" y="175">When pupils discuss ideas</text><text x="600" y="192">in pairs, they explain their thinking</text><rect class="panel" x="20" y="220" width="120" height="80" rx="4"/><text class="rl" x="80" y="260">Off-topic sentence</text><rect class="panel" x="140" y="220" width="300" height="80" rx="4"/><text x="290" y="255">My school has a large</text><text x="290" y="272">playground</text><rect class="panel" x="440" y="220" width="320" height="80" rx="4"/><text x="600" y="255">(no off-topic sentence;</text><text x="600" y="272">all sentences connect)</text><rect class="panel" x="20" y="300" width="120" height="80" rx="4"/><text class="rl" x="80" y="340">Concluding sentence</text><rect class="panel" x="140" y="300" width="300" height="80" rx="4"/><text x="290" y="335">So group work is good</text><text x="290" y="352">and teachers should use it</text><rect class="panel" x="440" y="300" width="320" height="80" rx="4"/><text x="600" y="335">For these reasons, every</text><text x="600" y="352">class should include group tasks</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>