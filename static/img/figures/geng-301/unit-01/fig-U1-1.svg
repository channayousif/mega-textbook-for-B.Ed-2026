<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Modes of writing</title><desc id="d">A concept map placing 'Modes of Writing' at the centre with four branches - narration tells a story, description paints a picture, exposition explains and informs, argumentation persuades; the exposition branch is highlighted.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted);text-anchor:middle} .ah{fill:var(--ink)} .eval{stroke:var(--a1);stroke-width:3;fill:none}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="100" ry="50" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="232">Modes of Writing</text><rect class="panel" x="30" y="40" width="160" height="60" rx="6"/><text class="h" x="110" y="76">Narration</text><text class="m" x="110" y="92">tells a story</text><rect class="panel" x="590" y="40" width="160" height="60" rx="6"/><text class="h" x="670" y="76">Description</text><text class="m" x="670" y="92">paints a picture</text><rect class="panel" x="30" y="370" width="160" height="60" rx="6"/><text class="h" x="110" y="406">Exposition</text><text class="m" x="110" y="422">explains and informs</text><rect class="panel" x="590" y="370" width="160" height="60" rx="6"/><text class="h" x="670" y="406">Argumentation</text><text class="m" x="670" y="422">persuades the reader</text><line class="link" x1="190" y1="70" x2="290" y2="210" marker-end="url(#ar)"/><line class="link" x1="590" y1="70" x2="490" y2="210" marker-end="url(#ar)"/><line class="link" x1="190" y1="400" x2="290" y2="260" marker-end="url(#ar)"/><line class="link" x1="590" y1="400" x2="490" y2="260" marker-end="url(#ar)"/><rect class="eval" x="22" y="362" width="176" height="76" rx="6"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>