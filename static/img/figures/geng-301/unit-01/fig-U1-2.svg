<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three pillars of effective writing</title><desc id="d">A diagram showing three pillars supporting effective writing - clarity (word choice, simple sentences), coherence (logical flow, transitions), organization (structure, outline).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="60" y="380" width="180" height="16" fill="var(--ink)" opacity="0.15"/><rect x="300" y="380" width="180" height="16" fill="var(--ink)" opacity="0.15"/><rect x="540" y="380" width="180" height="16" fill="var(--ink)" opacity="0.15"/><rect class="panel" x="40" y="200" width="200" height="160" rx="8"/><text class="h" x="140" y="240">Clarity</text><text x="140" y="270">word choice</text><text x="140" y="290">simple sentences</text><text x="140" y="310">avoid ambiguity</text><rect class="panel" x="280" y="200" width="200" height="160" rx="8"/><text class="h" x="380" y="240">Coherence</text><text x="380" y="270">logical flow</text><text x="380" y="290">transitions</text><text x="380" y="310">connections</text><rect class="panel" x="520" y="200" width="200" height="160" rx="8"/><text class="h" x="620" y="240">Organization</text><text x="620" y="270">structure</text><text x="620" y="290">outline as roadmap</text><text x="620" y="310">planned order</text><rect x="100" y="60" width="580" height="80" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="95" font-size="18">Effective Writing</text><text class="m" x="390" y="118">built on three pillars</text><line x1="140" y1="360" x2="140" y2="200" stroke="var(--ink)" stroke-width="2"/><line x1="380" y1="360" x2="380" y2="200" stroke="var(--ink)" stroke-width="2"/><line x1="620" y1="360" x2="620" y2="200" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>