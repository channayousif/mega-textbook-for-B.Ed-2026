<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Expository writing purposes</title><desc id="d">Table comparing four expository writing purposes - academic essay, professional report, textbook section and how-to guide - by their purpose, audience and key feature.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="170" height="50" rx="4"/><text class="h" x="105" y="50">Type</text><rect class="panel" x="190" y="20" width="190" height="50" rx="4"/><text class="h" x="285" y="50">Purpose</text><rect class="panel" x="380" y="20" width="190" height="50" rx="4"/><text class="h" x="475" y="50">Audience</text><rect class="panel" x="570" y="20" width="190" height="50" rx="4"/><text class="h" x="665" y="50">Key feature</text><rect class="panel" x="20" y="70" width="170" height="80" rx="4"/><text class="rl" x="105" y="110">Academic essay</text><rect class="panel" x="190" y="70" width="190" height="80" rx="4"/><text x="285" y="105">explain a concept</text><text x="285" y="125">or analyze an issue</text><rect class="panel" x="380" y="70" width="190" height="80" rx="4"/><text x="475" y="110">tutor or examiner</text><rect class="panel" x="570" y="70" width="190" height="80" rx="4"/><text x="665" y="105">thesis-driven</text><text x="665" y="125">evidence-based</text><rect class="panel" x="20" y="150" width="170" height="80" rx="4"/><text class="rl" x="105" y="190">Professional report</text><rect class="panel" x="190" y="150" width="190" height="80" rx="4"/><text x="285" y="185">inform a reader who</text><text x="285" y="205">needs facts</text><rect class="panel" x="380" y="150" width="190" height="80" rx="4"/><text x="475" y="190">head teacher, board</text><rect class="panel" x="570" y="150" width="190" height="80" rx="4"/><text x="665" y="185">structured, clear</text><text x="665" y="205">recommendations</text><rect class="panel" x="20" y="230" width="170" height="80" rx="4"/><text class="rl" x="105" y="270">Textbook section</text><rect class="panel" x="190" y="230" width="190" height="80" rx="4"/><text x="285" y="265">explain a topic in</text><text x="285" y="285">clear language</text><rect class="panel" x="380" y="230" width="190" height="80" rx="4"/><text x="475" y="270">pupils in a class</text><rect class="panel" x="570" y="230" width="190" height="80" rx="4"/><text x="665" y="265">step-by-step</text><text x="665" y="285">explanation</text><rect class="panel" x="20" y="310" width="170" height="80" rx="4"/><text class="rl" x="105" y="350">How-to guide</text><rect class="panel" x="190" y="310" width="190" height="80" rx="4"/><text x="285" y="345">walk a reader through</text><text x="285" y="365">a procedure</text><rect class="panel" x="380" y="310" width="190" height="80" rx="4"/><text x="475" y="350">general reader</text><rect class="panel" x="570" y="310" width="190" height="80" rx="4"/><text x="665" y="345">numbered steps</text><text x="665" y="365">with warnings</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>