<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Paragraph-writing process</title><desc id="d">A flowchart showing the paragraph-writing process in four steps: choose a single idea, write a topic sentence, add two to four supporting details, write a concluding sentence.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="40" y="40" width="700" height="70" rx="10"/><text class="h" x="390" y="70">Step 1: Choose a single idea</text><text class="m" x="390" y="90">one main point for the paragraph</text><line class="link" x1="390" y1="110" x2="390" y2="140" marker-end="url(#ar)"/><rect class="panel" x="40" y="140" width="700" height="70" rx="10"/><text class="h" x="390" y="170">Step 2: Write a topic sentence</text><text class="m" x="390" y="190">states the main idea clearly</text><line class="link" x1="390" y1="210" x2="390" y2="240" marker-end="url(#ar)"/><rect class="panel" x="40" y="240" width="700" height="70" rx="10"/><text class="h" x="390" y="270">Step 3: Add 2-4 supporting details</text><text class="m" x="390" y="290">examples, reasons or evidence</text><line class="link" x1="390" y1="310" x2="390" y2="340" marker-end="url(#ar)"/><rect class="panel" x="40" y="340" width="700" height="70" rx="10"/><text class="h" x="390" y="370">Step 4: Write a concluding sentence</text><text class="m" x="390" y="390">rounds off the paragraph</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>