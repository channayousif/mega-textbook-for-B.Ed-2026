<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six expository types</title><desc id="d">Concept map of expository writing with six branches: description, illustration, classification, cause and effect, process analysis and comparative analysis, each with its purpose.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted);text-anchor:middle} .ah{fill:var(--ink)} .eval{stroke:var(--a1);stroke-width:3;fill:none}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" width="780" height="470"/><line class="link" x1="390" y1="235" x2="120" y2="70"/><rect class="panel" x="20" y="35" width="200" height="70" rx="6"/><text class="h" x="120" y="64">Description</text><text class="m" x="120" y="85">relevant features</text><line class="link" x1="390" y1="235" x2="390" y2="70"/><rect class="panel" x="290" y="35" width="200" height="70" rx="6"/><text class="h" x="390" y="64">Illustration</text><text class="m" x="390" y="85">examples</text><line class="link" x1="390" y1="235" x2="660" y2="70"/><rect class="panel" x="560" y="35" width="200" height="70" rx="6"/><text class="h" x="660" y="64">Classification</text><text class="m" x="660" y="85">groups by a rule</text><line class="link" x1="390" y1="235" x2="120" y2="385"/><rect class="panel" x="20" y="350" width="200" height="70" rx="6"/><text class="h" x="120" y="379">Cause and effect</text><text class="m" x="120" y="400">reasons and results</text><line class="link" x1="390" y1="235" x2="390" y2="385"/><rect class="panel" x="290" y="350" width="200" height="70" rx="6"/><text class="h" x="390" y="379">Process analysis</text><text class="m" x="390" y="400">ordered steps</text><line class="link" x1="390" y1="235" x2="660" y2="385"/><rect class="panel" x="560" y="350" width="200" height="70" rx="6"/><text class="h" x="660" y="379">Comparative analysis</text><text class="m" x="660" y="400">similarities, differences</text><ellipse cx="390" cy="235" rx="105" ry="45" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="233">Expository writing</text><text class="m" x="390" y="252">explains and informs</text><text class="wm" x="768" y="460" aria-hidden="true">textbook.com.pk</text></svg>