<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Clear and unclear versions</title><desc id="d">Table comparing unclear and clear versions of sample sentences, showing what changed in clarity, coherence and organization.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="140" height="40" rx="4"/><text class="h" x="90" y="44">Problem</text><rect class="panel" x="160" y="20" width="200" height="40" rx="4"/><text class="h" x="260" y="44">Unclear version</text><rect class="panel" x="360" y="20" width="200" height="40" rx="4"/><text class="h" x="460" y="44">Clear version</text><rect class="panel" x="560" y="20" width="200" height="40" rx="4"/><text class="h" x="660" y="44">What changed</text><rect class="panel" x="20" y="60" width="140" height="90" rx="4"/><text class="rl" x="90" y="105">Clarity</text><rect class="panel" x="160" y="60" width="200" height="90" rx="4"/><text x="260" y="95">The thing that the</text><text x="260" y="112">teacher did was good</text><rect class="panel" x="360" y="60" width="200" height="90" rx="4"/><text x="460" y="95">The teacher used</text><text x="460" y="112">think-pair-share</text><rect class="panel" x="560" y="60" width="200" height="90" rx="4"/><text x="660" y="95">replaced vague words</text><text x="660" y="112">with specific ones</text><rect class="panel" x="20" y="150" width="140" height="90" rx="4"/><text class="rl" x="90" y="195">Coherence</text><rect class="panel" x="160" y="150" width="200" height="90" rx="4"/><text x="260" y="185">Group work helps.</text><text x="260" y="202">I like football.</text><rect class="panel" x="360" y="150" width="200" height="90" rx="4"/><text x="460" y="185">Group work helps</text><text x="460" y="202">pupils learn from peers</text><rect class="panel" x="560" y="150" width="200" height="90" rx="4"/><text x="660" y="185">removed off-topic</text><text x="660" y="202">sentence</text><rect class="panel" x="20" y="240" width="140" height="90" rx="4"/><text class="rl" x="90" y="285">Organization</text><rect class="panel" x="160" y="240" width="200" height="90" rx="4"/><text x="260" y="275">Homework is good.</text><text x="260" y="292">It helps pupils.</text><rect class="panel" x="360" y="240" width="200" height="90" rx="4"/><text x="460" y="275">Daily homework reinforces</text><text x="460" y="292">learning when marked</text><rect class="panel" x="560" y="240" width="200" height="90" rx="4"/><text x="660" y="275">added specific</text><text x="660" y="292">detail and reason</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>