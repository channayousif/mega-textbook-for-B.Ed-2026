<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Compare and contrast structures</title><desc id="d">Table comparing block and point-by-point comparison structures with guidance on when to use each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="140" height="40" rx="4"/><text class="h" x="90" y="44">Structure</text><rect class="panel" x="160" y="20" width="280" height="40" rx="4"/><text class="h" x="300" y="44">Organization</text><rect class="panel" x="440" y="20" width="320" height="40" rx="4"/><text class="h" x="600" y="44">When to use</text><rect class="panel" x="20" y="60" width="140" height="120" rx="4"/><text class="rl" x="90" y="120">Block</text><rect class="panel" x="160" y="60" width="280" height="120" rx="4"/><text x="300" y="100">All of A, then all of B</text><text x="300" y="120">Paragraph 1: A on all points</text><text x="300" y="140">Paragraph 2: B on all points</text><rect class="panel" x="440" y="60" width="320" height="120" rx="4"/><text x="600" y="110">short comparisons;</text><text x="600" y="130">simple topics</text><text x="600" y="150">reader can hold A in memory</text><rect class="panel" x="20" y="180" width="140" height="120" rx="4"/><text class="rl" x="90" y="240">Point-by-point</text><rect class="panel" x="160" y="180" width="280" height="120" rx="4"/><text x="300" y="220">One point for both A and B,</text><text x="300" y="240">then the next point for both</text><text x="300" y="260">Paragraph 1: cost (A vs B)</text><rect class="panel" x="440" y="180" width="320" height="120" rx="4"/><text x="600" y="230">longer comparisons;</text><text x="600" y="250">complex topics</text><text x="600" y="270">clearer for the reader</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
