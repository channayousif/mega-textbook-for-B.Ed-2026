<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Classification and cause/effect</title><desc id="d">A concept map showing how classification and cause/effect relate as organizational patterns.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="80" rx="130" ry="40" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="85">Organizational patterns</text><rect class="panel" x="80" y="180" width="280" height="120" rx="10"/><text class="h" x="220" y="215">Classification</text><text x="220" y="245">Sorts items into</text><text x="220" y="265">categories by a single</text><text x="220" y="285">organizing principle</text><rect class="panel" x="420" y="180" width="280" height="120" rx="10"/><text class="h" x="560" y="215">Cause and effect</text><text x="560" y="245">Explores why something</text><text x="560" y="265">happened and what</text><text x="560" y="285">resulted from it</text><line class="link" x1="220" y1="180" x2="320" y2="120" marker-end="url(#ar)"/><line class="link" x1="560" y1="180" x2="460" y2="120" marker-end="url(#ar)"/><rect x="150" y="340" width="480" height="80" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="390" y="370">Both make abstract ideas concrete and organized</text><text class="m" x="390" y="395">choose the pattern that fits your purpose</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
