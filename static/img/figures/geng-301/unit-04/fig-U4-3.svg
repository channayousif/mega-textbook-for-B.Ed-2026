<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Process analysis structure</title><desc id="d">A flowchart showing process analysis structure from goal through sequential steps to result, with warnings at each step.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="40" y="30" width="700" height="60" rx="10"/><text class="h" x="390" y="55">1. State the goal</text><text class="m" x="390" y="75">what the reader will be able to do</text><line class="link" x1="390" y1="90" x2="390" y2="115" marker-end="url(#ar)"/><rect class="panel" x="40" y="115" width="700" height="60" rx="10"/><text class="h" x="390" y="140">2. List materials needed</text><text class="m" x="390" y="160">what to prepare before starting</text><line class="link" x1="390" y1="175" x2="390" y2="200" marker-end="url(#ar)"/><rect class="panel" x="40" y="200" width="700" height="60" rx="10"/><text class="h" x="390" y="225">3. Explain each step in order</text><text class="m" x="390" y="245">chronological sequence</text><line class="link" x1="390" y1="260" x2="390" y2="285" marker-end="url(#ar)"/><rect class="panel" x="40" y="285" width="700" height="60" rx="10"/><text class="h" x="390" y="310">4. Add warnings and transitions</text><text class="m" x="390" y="330">what to watch out for</text><line class="link" x1="390" y1="345" x2="390" y2="370" marker-end="url(#ar)"/><rect class="panel" x="40" y="370" width="700" height="60" rx="10"/><text class="h" x="390" y="395">5. State the expected result</text><text class="m" x="390" y="415">what success looks like</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
