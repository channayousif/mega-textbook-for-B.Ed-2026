<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Classification principles</title><desc id="d">Table comparing classification principles with examples from Pakistani schooling.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="140" height="40" rx="4"/><text class="h" x="90" y="44">Principle</text><rect class="panel" x="160" y="20" width="280" height="40" rx="4"/><text class="h" x="300" y="44">Categories</text><rect class="panel" x="440" y="20" width="320" height="40" rx="4"/><text class="h" x="600" y="44">Example</text><rect class="panel" x="20" y="60" width="140" height="90" rx="4"/><text class="rl" x="90" y="105">Management</text><rect class="panel" x="160" y="60" width="280" height="90" rx="4"/><text x="300" y="95">government, private,</text><text x="300" y="115">community</text><rect class="panel" x="440" y="60" width="320" height="90" rx="4"/><text x="600" y="100">schools in Pakistan</text><text x="600" y="120">grouped by who runs them</text><rect class="panel" x="20" y="150" width="140" height="90" rx="4"/><text class="rl" x="90" y="195">Level</text><rect class="panel" x="160" y="150" width="280" height="90" rx="4"/><text x="300" y="185">primary, secondary,</text><text x="300" y="205">higher secondary</text><rect class="panel" x="440" y="150" width="320" height="90" rx="4"/><text x="600" y="190">schools grouped by</text><text x="600" y="210">the age of pupils</text><rect class="panel" x="20" y="240" width="140" height="90" rx="4"/><text class="rl" x="90" y="285">Assessment</text><rect class="panel" x="160" y="240" width="280" height="90" rx="4"/><text x="300" y="275">formative, summative,</text><text x="300" y="295">diagnostic</text><rect class="panel" x="440" y="240" width="320" height="90" rx="4"/><text x="600" y="280">tests grouped by</text><text x="600" y="300">their purpose</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
