<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Description and illustration</title><desc id="d">A diagram comparing description (sensory detail) and illustration (concrete examples) as two ways to make abstract ideas concrete.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="40" width="340" height="380" rx="10"/><text class="h" x="200" y="80" font-size="16">Description</text><text class="m" x="200" y="105">uses sensory detail</text><rect x="50" y="120" width="300" height="60" rx="6"/><text x="200" y="150">What you can see, hear, smell</text><rect x="50" y="190" width="300" height="60" rx="6"/><text x="200" y="220">Paints a picture with words</text><rect x="50" y="260" width="300" height="60" rx="6"/><text x="200" y="290">Helps the reader imagine</text><rect x="50" y="330" width="300" height="60" rx="6"/><text x="200" y="360">The classroom had cracked plaster</text><rect class="panel" x="410" y="40" width="340" height="380" rx="10"/><text class="h" x="580" y="80" font-size="16">Illustration</text><text class="m" x="580" y="105">uses concrete examples</text><rect x="430" y="120" width="300" height="60" rx="6"/><text x="580" y="150">Specific cases that prove a point</text><rect x="430" y="190" width="300" height="60" rx="6"/><text x="580" y="220">One vivid example can persuade</text><rect x="430" y="260" width="300" height="60" rx="6"/><text x="580" y="290">Makes abstract claims believable</text><rect x="430" y="330" width="300" height="60" rx="6"/><text x="580" y="360">In one school in Shikarpur...</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
