<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Description and illustration</title><desc id="d">A diagram comparing description (sensory detail) and illustration (concrete examples) as two ways to make abstract ideas concrete.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="40" width="340" height="380" rx="10"/><text class="h" x="200" y="80" font-size="16">Description</text><text class="m" x="200" y="105">uses sensory detail</text><rect x="50" y="120" width="300" height="60" rx="6"/><text x="200" y="150">What you can see, hear, smell</text><rect x="50" y="190" width="300" height="60" rx="6"/><text x="200" y="220">Paints a picture with words</text><rect x="50" y="260" width="300" height="60" rx="6"/><text x="200" y="290">Helps the reader imagine</text><rect x="50" y="330" width="300" height="60" rx="6"/><text x="200" y="360">The classroom had cracked plaster</text><rect class="panel" x="410" y="40" width="340" height="380" rx="10"/><text class="h" x="580" y="80" font-size="16">Illustration</text><text class="m" x="580" y="105">uses concrete examples</text><rect x="430" y="120" width="300" height="60" rx="6"/><text x="580" y="150">Specific cases that prove a point</text><rect x="430" y="190" width="300" height="60" rx="6"/><text x="580" y="220">One vivid example can persuade</text><rect x="430" y="260" width="300" height="60" rx="6"/><text x="580" y="290">Makes abstract claims believable</text><rect x="430" y="330" width="300" height="60" rx="6"/><text x="580" y="360">In one school in Shikarpur...</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
