<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Expository type identification</title><desc id="d">Table comparing six expository types by signal words and the writing purpose each serves best.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:11px;fill:var(--ink);text-anchor:middle} .h{font-size:12px;font-weight:700} .m{font-size:10px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="100" height="35" rx="4"/><text class="h" x="70" y="42">Type</text><rect class="panel" x="120" y="20" width="280" height="35" rx="4"/><text class="h" x="260" y="42">Signal words</text><rect class="panel" x="400" y="20" width="360" height="35" rx="4"/><text class="h" x="580" y="42">Best used to</text><rect class="panel" x="20" y="55" width="100" height="65" rx="4"/><text class="rl" x="70" y="85">Description</text><rect class="panel" x="120" y="55" width="280" height="65" rx="4"/><text x="260" y="80">looks like, feels like,</text><text x="260" y="98">appears, senses</text><rect class="panel" x="400" y="55" width="360" height="65" rx="4"/><text x="580" y="85">paint a picture with words</text><rect class="panel" x="20" y="120" width="100" height="65" rx="4"/><text class="rl" x="70" y="150">Illustration</text><rect class="panel" x="120" y="120" width="280" height="65" rx="4"/><text x="260" y="145">for example, such as,</text><text x="260" y="163">for instance, like</text><rect class="panel" x="400" y="120" width="360" height="65" rx="4"/><text x="580" y="150">support a point with examples</text><rect class="panel" x="20" y="185" width="100" height="65" rx="4"/><text class="rl" x="70" y="215">Classification</text><rect class="panel" x="120" y="185" width="280" height="65" rx="4"/><text x="260" y="210">types, categories,</text><text x="260" y="228">groups, classes</text><rect class="panel" x="400" y="185" width="360" height="65" rx="4"/><text x="580" y="220">sort items into groups</text><rect class="panel" x="20" y="250" width="100" height="65" rx="4"/><text class="rl" x="70" y="280">Cause/effect</text><rect class="panel" x="120" y="250" width="280" height="65" rx="4"/><text x="260" y="275">because, therefore,</text><text x="260" y="293">as a result, leads to</text><rect class="panel" x="400" y="250" width="360" height="65" rx="4"/><text x="580" y="280">explain why something happened</text><rect class="panel" x="20" y="315" width="100" height="65" rx="4"/><text class="rl" x="70" y="345">Process</text><rect class="panel" x="120" y="315" width="280" height="65" rx="4"/><text x="260" y="340">first, next, then,</text><text x="260" y="358">finally, step</text><rect class="panel" x="400" y="315" width="360" height="65" rx="4"/><text x="580" y="345">explain a step-by-step procedure</text><rect class="panel" x="20" y="380" width="100" height="65" rx="4"/><text class="rl" x="70" y="410">Comparison</text><rect class="panel" x="120" y="380" width="280" height="65" rx="4"/><text x="260" y="405">similarly, in contrast,</text><text x="260" y="423">unlike, whereas</text><rect class="panel" x="400" y="380" width="360" height="65" rx="4"/><text x="580" y="410">analyze similarities and differences</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
