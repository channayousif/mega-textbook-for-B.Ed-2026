<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Hook types</title><desc id="d">Table comparing four hook types with examples and guidance on when to use each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="110" height="40" rx="4"/><text class="h" x="75" y="44">Type</text><rect class="panel" x="130" y="20" width="280" height="40" rx="4"/><text class="h" x="270" y="44">Example</text><rect class="panel" x="410" y="20" width="350" height="40" rx="4"/><text class="h" x="585" y="44">Best used when</text><rect class="panel" x="20" y="60" width="110" height="90" rx="4"/><text class="rl" x="75" y="105">Question</text><rect class="panel" x="130" y="60" width="280" height="90" rx="4"/><text x="270" y="95">What if half the school day</text><text x="270" y="115">were spent outside?</text><rect class="panel" x="410" y="60" width="350" height="90" rx="4"/><text x="585" y="105">the essay will answer</text><text x="585" y="125">a specific question</text><rect class="panel" x="20" y="150" width="110" height="90" rx="4"/><text class="rl" x="75" y="195">Anecdote</text><rect class="panel" x="130" y="150" width="280" height="90" rx="4"/><text x="270" y="185">A Grade 3 teacher decided</text><text x="270" y="205">to drop homework</text><rect class="panel" x="410" y="150" width="350" height="90" rx="4"/><text x="585" y="185">a short story illustrates</text><text x="585" y="205">the topic</text><rect class="panel" x="20" y="240" width="110" height="90" rx="4"/><text class="rl" x="75" y="285">Statistic</text><rect class="panel" x="130" y="240" width="280" height="90" rx="4"/><text x="270" y="275">UNESCO: 250 million</text><text x="270" y="295">children cannot read</text><rect class="panel" x="410" y="240" width="350" height="90" rx="4"/><text x="585" y="275">data supports the argument</text><rect class="panel" x="20" y="330" width="110" height="90" rx="4"/><text class="rl" x="75" y="375">Bold statement</text><rect class="panel" x="130" y="330" width="280" height="90" rx="4"/><text x="270" y="365">The most powerful teaching</text><text x="270" y="385">tool costs nothing</text><rect class="panel" x="410" y="330" width="350" height="90" rx="4"/><text x="585" y="365">the essay will unpack</text><text x="585" y="385">a surprising claim</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
