<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Body paragraph construction</title><desc id="d">A flowchart showing body paragraph construction from topic sentence to transition.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="40" y="40" width="700" height="65" rx="10"/><text class="h" x="390" y="65">1. Topic sentence</text><text class="m" x="390" y="85">connects to thesis; states the point</text><line class="link" x1="390" y1="105" x2="390" y2="130" marker-end="url(#ar)"/><rect class="panel" x="40" y="130" width="700" height="65" rx="10"/><text class="h" x="390" y="155">2. State the point clearly</text><text class="m" x="390" y="175">one sentence that develops the topic</text><line class="link" x1="390" y1="195" x2="390" y2="220" marker-end="url(#ar)"/><rect class="panel" x="40" y="220" width="700" height="65" rx="10"/><text class="h" x="390" y="245">3. Give evidence</text><text class="m" x="390" y="265">example, reason, fact or quotation</text><line class="link" x1="390" y1="285" x2="390" y2="310" marker-end="url(#ar)"/><rect class="panel" x="40" y="310" width="700" height="65" rx="10"/><text class="h" x="390" y="335">4. Explain the evidence</text><text class="m" x="390" y="355">how it supports your point</text><line class="link" x1="390" y1="375" x2="390" y2="400" marker-end="url(#ar)"/><rect class="panel" x="40" y="400" width="700" height="50" rx="10"/><text class="h" x="390" y="425">5. Transition to next paragraph</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
