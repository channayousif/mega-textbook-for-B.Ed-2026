<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Thesis checklist</title><desc id="d">A thesis checklist with four criteria: one sentence, takes a position, arguable and specific.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="30" y="30" width="720" height="400" rx="12" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="390" y="70" font-size="18">Thesis Statement Checklist</text><rect class="panel" x="50" y="100" width="680" height="70" rx="8"/><text x="390" y="130">Is it ONE sentence that states the main idea?</text><rect class="panel" x="50" y="180" width="680" height="70" rx="8"/><text x="390" y="210">Does it take a position someone could disagree with?</text><rect class="panel" x="50" y="260" width="680" height="70" rx="8"/><text x="390" y="290">Is it specific enough in scope (not too broad)?</text><rect class="panel" x="50" y="340" width="680" height="70" rx="8"/><text x="390" y="370">Does it avoid announcing ("This essay will...")?</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
