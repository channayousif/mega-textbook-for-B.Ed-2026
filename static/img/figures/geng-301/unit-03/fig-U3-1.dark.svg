<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Funnel shape of an introduction</title><desc id="d">A diagram showing the funnel shape of an introduction from hook (wide) through background to thesis statement (narrow).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><polygon points="100,80 680,80 480,380 300,380" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><rect class="panel" x="150" y="40" width="480" height="60" rx="8"/><text class="h" x="390" y="65">Hook</text><text class="m" x="390" y="85">engages the reader</text><rect class="panel" x="180" y="150" width="420" height="60" rx="8"/><text class="h" x="390" y="175">Background / context</text><text class="m" x="390" y="195">narrows to the topic</text><rect class="panel" x="240" y="270" width="300" height="60" rx="8"/><text class="h" x="390" y="295">Thesis statement</text><text class="m" x="390" y="315">narrow, specific, arguable</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
