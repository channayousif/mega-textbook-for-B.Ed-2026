<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Conclusion types</title><desc id="d">Table comparing four conclusion types with guidance on when to use each and sample opening phrases.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="120" height="40" rx="4"/><text class="h" x="80" y="44">Type</text><rect class="panel" x="140" y="20" width="200" height="40" rx="4"/><text class="h" x="240" y="44">When to use</text><rect class="panel" x="340" y="20" width="420" height="40" rx="4"/><text class="h" x="550" y="44">Sample opening phrase</text><rect class="panel" x="20" y="60" width="120" height="90" rx="4"/><text class="rl" x="80" y="105">Summary</text><rect class="panel" x="140" y="60" width="200" height="90" rx="4"/><text x="240" y="95">most essays;</text><text x="240" y="115">safe and clear</text><rect class="panel" x="340" y="60" width="420" height="90" rx="4"/><text x="550" y="95">In conclusion, we have seen</text><text x="550" y="115">that...</text><rect class="panel" x="20" y="150" width="120" height="90" rx="4"/><text class="rl" x="80" y="195">Call to action</text><rect class="panel" x="140" y="150" width="200" height="90" rx="4"/><text x="240" y="185">persuasive essays;</text><text x="240" y="205">urge the reader</text><rect class="panel" x="340" y="150" width="420" height="90" rx="4"/><text x="550" y="185">Every school should...</text><rect class="panel" x="20" y="240" width="120" height="90" rx="4"/><text class="rl" x="80" y="285">Full circle</text><rect class="panel" x="140" y="240" width="200" height="90" rx="4"/><text x="240" y="275">return to the hook;</text><text x="240" y="295">elegant close</text><rect class="panel" x="340" y="240" width="420" height="90" rx="4"/><text x="550" y="275">The question we asked at the</text><text x="550" y="295">start can now be answered</text><rect class="panel" x="20" y="330" width="120" height="90" rx="4"/><text class="rl" x="80" y="375">Forward-looking</text><rect class="panel" x="140" y="330" width="200" height="90" rx="4"/><text x="240" y="365">points to what</text><text x="240" y="385">comes next</text><rect class="panel" x="340" y="330" width="420" height="90" rx="4"/><text x="550" y="365">This raises further questions</text><text x="550" y="385">about...</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
