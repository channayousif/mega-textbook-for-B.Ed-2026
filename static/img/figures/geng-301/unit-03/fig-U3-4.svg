<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Essay structure</title><desc id="d">A concept map showing essay structure - introduction, three body paragraphs and conclusion - with arrows showing the flow and cohesion devices between them.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="300" y="30" width="180" height="60" rx="10"/><text class="h" x="390" y="55">Introduction</text><text class="m" x="390" y="75">hook + thesis</text><line class="link" x1="390" y1="90" x2="390" y2="120" marker-end="url(#ar)"/><rect class="panel" x="30" y="120" width="200" height="80" rx="10"/><text class="h" x="130" y="150">Body 1</text><text class="m" x="130" y="170">point A + evidence</text><line class="link" x1="230" y1="160" x2="300" y2="160" marker-end="url(#ar)"/><rect class="panel" x="270" y="120" width="200" height="80" rx="10"/><text class="h" x="370" y="150">Body 2</text><text class="m" x="370" y="170">point B + evidence</text><line class="link" x1="470" y1="160" x2="540" y2="160" marker-end="url(#ar)"/><rect class="panel" x="510" y="120" width="200" height="80" rx="10"/><text class="h" x="610" y="150">Body 3</text><text class="m" x="610" y="170">point C + evidence</text><line class="link" x1="390" y1="200" x2="390" y2="240" marker-end="url(#ar)"/><rect class="panel" x="300" y="240" width="180" height="60" rx="10"/><text class="h" x="390" y="265">Conclusion</text><text class="m" x="390" y="285">restate + final thought</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
