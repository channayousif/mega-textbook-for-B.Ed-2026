y="210">no argument</text><rect class="panel" x="430" y="150" width="330" height="90" rx="4"/><text x="595" y="190">Daily homework in Grades 3-5</text><text x="595" y="210">reinforces learning when short</text><rect class="panel" x="20" y="240" width="130" height="90" rx="4"/><text x="85" y="285">Some people like</text><text x="85" y="305">it, some do not</text><rect class="panel" x="150" y="240" width="280" height="90" rx="4"/><text x="290" y="280">True but not</text><text x="290" y="300">arguable</text><rect class="panel" x="430" y="240" width="330" height="90" rx="4"/><text x="595" y="280">Structured daily homework in</text><text x="595" y="300">primary school improves results</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
