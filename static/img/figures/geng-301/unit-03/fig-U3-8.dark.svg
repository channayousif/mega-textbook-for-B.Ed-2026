<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Transitional devices</title><desc id="d">Table of transitional devices grouped by function: addition, contrast, cause/effect and conclusion, with example words.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="130" height="40" rx="4"/><text class="h" x="85" y="44">Function</text><rect class="panel" x="150" y="20" width="610" height="40" rx="4"/><text class="h" x="455" y="44">Transitional words and phrases</text><rect class="panel" x="20" y="60" width="130" height="90" rx="4"/><text class="rl" x="85" y="105">Addition</text><rect class="panel" x="150" y="60" width="610" height="90" rx="4"/><text x="455" y="100">in addition, furthermore, moreover,</text><text x="455" y="120">another, also, besides</text><rect class="panel" x="20" y="150" width="130" height="90" rx="4"/><text class="rl" x="85" y="195">Contrast</text><rect class="panel" x="150" y="150" width="610" height="90" rx="4"/><text x="455" y="190">however, on the other hand, in contrast,</text><text x="455" y="210">yet, but, nevertheless</text><rect class="panel" x="20" y="240" width="130" height="90" rx="4"/><text class="rl" x="85" y="285">Cause/effect</text><rect class="panel" x="150" y="240" width="610" height="90" rx="4"/><text x="455" y="280">as a result, therefore, consequently,</text><text x="455" y="300">because of this, thus</text><rect class="panel" x="20" y="330" width="130" height="90" rx="4"/><text class="rl" x="85" y="375">Conclusion</text><rect class="panel" x="150" y="330" width="610" height="90" rx="4"/><text x="455" y="370">in conclusion, overall, to summarize,</text><text x="455" y="390">finally, in short</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
