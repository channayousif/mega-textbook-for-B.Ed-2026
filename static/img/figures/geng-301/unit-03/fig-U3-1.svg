<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Funnel shape of an introduction</title><desc id="d">A diagram showing the funnel shape of an introduction from hook (wide) through background to thesis statement (narrow).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:14px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><polygon points="100,80 680,80 480,380 300,380" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><rect class="panel" x="150" y="40" width="480" height="60" rx="8"/><text class="h" x="390" y="65">Hook</text><text class="m" x="390" y="85">engages the reader</text><rect class="panel" x="180" y="150" width="420" height="60" rx="8"/><text class="h" x="390" y="175">Background / context</text><text class="m" x="390" y="195">narrows to the topic</text><rect class="panel" x="240" y="270" width="300" height="60" rx="8"/><text class="h" x="390" y="295">Thesis statement</text><text class="m" x="390" y="315">narrow, specific, arguable</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
