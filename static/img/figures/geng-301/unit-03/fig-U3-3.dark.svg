<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Body paragraph construction</title><desc id="d">A flowchart showing body paragraph construction: topic sentence connected to thesis, then point, evidence, explanation and transition.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="40" y="40" width="700" height="65" rx="10"/><text class="h" x="390" y="65">1. Topic sentence</text><text class="m" x="390" y="85">connects to thesis; states the point</text><line class="link" x1="390" y1="105" x2="390" y2="130" marker-end="url(#ar)"/><rect class="panel" x="40" y="130" width="700" height="65" rx="10"/><text class="h" x="390" y="155">2. State the point clearly</text><text class="m" x="390" y="175">one sentence that develops the topic</text><line class="link" x1="390" y1="195" x2="390" y2="220" marker-end="url(#ar)"/><rect class="panel" x="40" y="220" width="700" height="65" rx="10"/><text class="h" x="390" y="245">3. Give evidence</text><text class="m" x="390" y="265">example, reason, fact or quotation</text><line class="link" x1="390" y1="285" x2="390" y2="310" marker-end="url(#ar)"/><rect class="panel" x="40" y="310" width="700" height="65" rx="10"/><text class="h" x="390" y="335">4. Explain the evidence</text><text class="m" x="390" y="355">how it supports your point</text><line class="link" x1="390" y1="375" x2="390" y2="400" marker-end="url(#ar)"/><rect class="panel" x="40" y="400" width="700" height="50" rx="10"/><text class="h" x="390" y="425">5. Transition to next paragraph</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
