<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Drafting stages</title><desc id="d">Table comparing the three drafting stages by main job, focus and what to avoid at each stage.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="140" height="40" rx="4"/><text class="h" x=90 y="44">Stage</text><rect class="panel" x="160" y="20" width="190" height="40" rx="4"/><text class="h" x="255" y="44">Main job</text><rect class="panel" x="350" y="20" width="190" height="40" rx="4"/><text class="h" x="445" y="44">What to focus on</text><rect class="panel" x="540" y="20" width="220" height="40" rx="4"/><text class="h" x="650" y="44">What NOT to do</text><rect class="panel" x="20" y="60" width="140" height="90" rx="4"/><text class="rl" x="90" y="105">Rough draft</text><rect class="panel" x="160" y="60" width="190" height="90" rx="4"/><text x="255" y="95">get ideas down</text><text x="255" y="115">from outline</text><rect class="panel" x="350" y="60" width="190" height="90" rx="4"/><text x="445" y="95">completeness;</text><text x="445" y="115">keep writing</text><rect class="panel" x="540" y="60" width="220" height="90" rx="4"/><text x="650" y="95">do not stop to</text><text x="650" y="115">fix spelling</text><rect class="panel" x="20" y="150" width="140" height="90" rx="4"/><text class="rl" x="90" y="195">Structured draft</text><rect class="panel" x="160" y="150" width="190" height="90" rx="4"/><text x="255" y="185">fix organization</text><rect class="panel" x="350" y="150" width="190" height="90" rx="4"/><text x="445" y="185">paragraph order;</text><text x="445" y="205">add missing points</text><rect class="panel" x="540" y="150" width="220" height="90" rx="4"/><text x="650" y="185">do not polish</text><text x="650" y="205">sentences yet</text><rect class="panel" x="20" y="240" width="140" height="90" rx="4"/><text class="rl" x="90" y="285">Refined draft</text><rect class="panel" x="160" y="240" width="190" height="90" rx="4"/><text x="255" y="275">improve sentences</text><rect class="panel" x="350" y="240" width="190" height="90" rx="4"/><text x="445" y="275">word choice;</text><text x="445" y="295">clarity; conciseness</text><rect class="panel" x="540" y="240" width="220" height="90" rx="4"/><text x="650" y="275">do not skip the</text><text x="650" y="295">earlier stages</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
