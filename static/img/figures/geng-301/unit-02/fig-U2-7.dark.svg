<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Common editing errors</title><desc id="d">Table showing common editing errors with before-and-after examples: subject-verb agreement, vague word choice and run-on sentences.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="140" height="40" rx="4"/><text class="h" x="90" y="44">Error type</text><rect class="panel" x="160" y="20" width="280" height="40" rx="4"/><text class="h" x="300" y="44">Before</text><rect class="panel" x="440" y="20" width="320" height="40" rx="4"/><text class="h" x="600" y="44">After</text><rect class="panel" x="20" y="60" width="140" height="100" rx="4"/><text class="rl" x="90" y="110">Subject-verb</text><text class="rl" x="90" y="130">agreement</text><rect class="panel" x="160" y="60" width="280" height="100" rx="4"/><text x="300" y="105">The group of pupils</text><text x="300" y="125">are working</text><rect class="panel" x="440" y="60" width="320" height="100" rx="4"/><text x="600" y="105">The group of pupils</text><text x="600" y="125">is working</text><rect class="panel" x="20" y="160" width="140" height="100" rx="4"/><text class="rl" x="90" y="210">Vague word</text><text class="rl" x="90" y="230">choice</text><rect class="panel" x="160" y="160" width="280" height="100" rx="4"/><text x="300" y="205">The teacher did</text><text x="300" y="225">a good thing</text><rect class="panel" x="440" y="160" width="320" height="100" rx="4"/><text x="600" y="205">The teacher used</text><text x="600" y="225">think-pair-share</text><rect class="panel" x="20" y="260" width="140" height="100" rx="4"/><text class="rl" x="90" y="310">Run-on</text><text class="rl" x="90" y="330">sentence</text><rect class="panel" x="160" y="260" width="280" height="100" rx="4"/><text x="300" y="305">Group work helps</text><text x="300" y="325">pupils learn it is good</text><rect class="panel" x="440" y="260" width="320" height="100" rx="4"/><text x="600" y="305">Group work helps</text><text x="600" y="325">pupils learn. It is good.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
