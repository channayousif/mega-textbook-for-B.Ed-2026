<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Pre-writing techniques compared</title><desc id="d">Table comparing five pre-writing techniques by what they produce, when to use each and how much time each needs.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="130" height="40" rx="4"/><text class="h" x="85" y="44">Technique</text><rect class="panel" x="150" y="20" width="200" height="40" rx="4"/><text class="h" x="250" y="44">What it produces</text><rect class="panel" x="350" y="20" width="220" height="40" rx="4"/><text class="h" x="460" y="44">When to use it</text><rect class="panel" x="570" y="20" width="190" height="40" rx="4"/><text class="h" x="665" y="44">Time needed</text><rect class="panel" x="20" y="60" width="130" height="75" rx="4"/><text class="rl" x="85" y="95">Brainstorming</text><rect class="panel" x="150" y="60" width="200" height="75" rx="4"/><text x="250" y="90">a list of raw ideas</text><text x="250" y="108">without judgement</text><rect class="panel" x="350" y="60" width="220" height="75" rx="4"/><text x="460" y="90">when you need to</text><text x="460" y="108">generate ideas</text><rect class="panel" x="570" y="60" width="190" height="75" rx="4"/><text x="665" y="100">5 minutes</text><rect class="panel" x="20" y="135" width="130" height="75" rx="4"/><text class="rl" x="85" y="170">Listing</text><rect class="panel" x="150" y="135" width="200" height="75" rx="4"/><text x="250" y="165">organized points</text><rect class="panel" x="350" y="135" width="220" height="75" rx="4"/><text x="460" y="165">when you already</text><text x="460" y="183">know your points</text><rect class="panel" x="570" y="135" width="190" height="75" rx="4"/><text x="665" y="175">5 minutes</text><rect class="panel" x="20" y="210" width="130" height="75" rx="4"/><text class="rl" x="85" y="245">Free-writing</text><rect class="panel" x="150" y="210" width="200" height="75" rx="4"/><text x="250" y="240">connected thoughts</text><text x="250" y="258">on paper</text><rect class="panel" x="350" y="210" width="220" height="75" rx="4"/><text x="460" y="240">to discover what</text><text x="460" y="258">you actually think</text><rect class="panel" x="570" y="210" width="190" height="75" rx="4"/><text x="665" y="250">10 minutes</text><rect class="panel" x="20" y="285" width="130" height="75" rx="4"/><text class="rl" x="85" y="320">Mind-mapping</text><rect class="panel" x="150" y="285" width="200" height="75" rx="4"/><text x="250" y="315">a visual web of</text><text x="250" y="333">linked ideas</text><rect class="panel" x="350" y="285" width="220" height="75" rx="4"/><text x="460" y="315">when ideas have</text><text x="460" y="333">many connections</text><rect class="panel" x="570" y="285" width="190" height="75" rx="4"/><text x="665" y="325">10 minutes</text><rect class="panel" x="20" y="360" width="130" height="75" rx="4"/><text class="rl" x="85" y="395">Outlining</text><rect class="panel" x="150" y="360" width="200" height="75" rx="4"/><text x="250" y="390">a structured plan</text><text x="250" y="408">for the draft</text><rect class="panel" x="350" y="360" width="220" height="75" rx="4"/><text x="460" y="390">before you start</text><text x="460" y="408">drafting</text><rect class="panel" x="570" y="360" width="190" height="75" rx="4"/><text x="665" y="400">10 minutes</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>