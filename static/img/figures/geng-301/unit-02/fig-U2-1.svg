<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Pre-writing techniques</title><desc id="d">A concept map placing 'Pre-writing techniques' at the centre with five branches - brainstorming produces a list of raw ideas, listing produces organized points, free-writing produces connected thoughts, mind-mapping produces a visual web, outlining produces a structured plan.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted);text-anchor:middle} .ah{fill:var(--ink)}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="110" ry="50" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="232">Pre-writing techniques</text><rect class="panel" x="20" y="30" width="160" height="55" rx="6"/><text class="h" x="100" y="55">Brainstorming</text><text class="m" x="100" y="72">list of raw ideas</text><rect class="panel" x="600" y="30" width="160" height="55" rx="6"/><text class="h" x="680" y="55">Listing</text><text class="m" x="680" y="72">organized points</text><rect class="panel" x="20" y="385" width="160" height="55" rx="6"/><text class="h" x="100" y="410">Free-writing</text><text class="m" x="100" y="427">connected thoughts</text><rect class="panel" x="600" y="385" width="160" height="55" rx="6"/><text class="h" x="680" y="410">Mind-mapping</text><text class="m" x="680" y="427">visual web</text><rect class="panel" x="310" y="385" width="160" height="55" rx="6"/><text class="h" x="390" y="410">Outlining</text><text class="m" x="390" y="427">structured plan</text><line class="link" x1="180" y1="57" x2="280" y2="210" marker-end="url(#ar)"/><line class="link" x1="600" y1="57" x2="500" y2="210" marker-end="url(#ar)"/><line class="link" x1="180" y1="412" x2="280" y2="260" marker-end="url(#ar)"/><line class="link" x1="600" y1="412" x2="500" y2="260" marker-end="url(#ar)"/><line class="link" x1="390" y1="385" x2="390" y2="285" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>