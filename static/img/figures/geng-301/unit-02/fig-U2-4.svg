<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Writing process timeline</title><desc id="d">A timeline of the writing process from pre-writing to publishing, showing proof reading as the penultimate step with a zoom box listing three checks: spelling, punctuation and formatting.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><line x1="40" y1="120" x2="740" y2="120" stroke="var(--ink)" stroke-width="2"/><rect class="panel" x="30" y="60" width="90" height="50" rx="6"/><text class="h" x="75" y="85">Pre-writing</text><text class="m" x="75" y="102">brainstorm</text><circle cx="75" cy="120" r="6" fill="var(--a1)"/><rect class="panel" x="140" y="60" width="90" height="50" rx="6"/><text class="h" x="185" y="85">Drafting</text><text class="m" x="185" y="102">rough, struct</text><circle cx="185" cy="120" r="6" fill="var(--a1)"/><rect class="panel" x="250" y="60" width="90" height="50" rx="6"/><text class="h" x="295" y="85">Revising</text><text class="m" x="295" y="102">content</text><circle cx="295" cy="120" r="6" fill="var(--a1)"/><rect class="panel" x="360" y="60" width="90" height="50" rx="6"/><text class="h" x="405" y="85">Editing</text><text class="m" x="405" y="102">sentences</text><circle cx="405" cy="120" r="6" fill="var(--a1)"/><rect class="panel" x="470" y="60" width="90" height="50" rx="6"/><text class="h" x="515" y="85">Proof read</text><text class="m" x="515" y="102">final check</text><circle cx="515" cy="120" r="6" fill="var(--a1)"/><rect class="panel" x="580" y="60" width="90" height="50" rx="6"/><text class="h" x="625" y="85">Peer review</text><text class="m" x="625" y="102">feedback</text><circle cx="625" cy="120" r="6" fill="var(--a1)"/><rect class="panel" x="670" y="60" width="90" height="50" rx="6"/><text class="h" x="715" y="85">Publish</text><text class="m" x="715" y="102">submit</text><circle cx="715" cy="120" r="6" fill="var(--a1)"/><rect x="440" y="200" width="150" height="100" rx="8" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="515" y="230">Proof reading</text><text x="515" y="255">1. Spelling</text><text x="515" y="275">2. Punctuation</text><text x="515" y="295">3. Formatting</text><line x1="515" y1="170" x2="515" y2="200" stroke="var(--a1)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
