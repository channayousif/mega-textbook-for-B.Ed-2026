<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Peer review form</title><desc id="d">A peer review feedback form with four checklist questions and space for yes/no answers and comments.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="400" height="40" rx="4"/><text class="h" x="220" y="44">Checklist question</text><rect class="panel" x="420" y="20" width="100" height="40" rx="4"/><text class="h" x="470" y="44">Yes/No</text><rect class="panel" x="520" y="20" width="240" height="40" rx="4"/><text class="h" x="640" y="44">Comment</text><rect class="panel" x="20" y="60" width="400" height="80" rx="4"/><text x="220" y="95">Can I identify the main idea</text><text x="220" y="115">in the first paragraph?</text><rect class="panel" x="420" y="60" width="100" height="80" rx="4"/><text x="470" y="105">Yes / No</text><rect class="panel" x="520" y="60" width="240" height="80" rx="4"/><text class="m" x="640" y="105">write your answer here</text><rect class="panel" x="20" y="140" width="400" height="80" rx="4"/><text x="220" y="175">Does each paragraph have a</text><text x="220" y="195">clear topic sentence?</text><rect class="panel" x="420" y="140" width="100" height="80" rx="4"/><text x="470" y="185">Yes / No</text><rect class="panel" x="520" y="140" width="240" height="80" rx="4"/><text class="m" x="640" y="185">write your answer here</text><rect class="panel" x="20" y="220" width="400" height="80" rx="4"/><text x="220" y="255">Are there sentences I had to</text><text x="220" y="275">read twice to understand?</text><rect class="panel" x="420" y="220" width="100" height="80" rx="4"/><text x="470" y="265">Yes / No</text><rect class="panel" x="520" y="220" width="240" height="80" rx="4"/><text class="m" x="640" y="265">write your answer here</text><rect class="panel" x="20" y="300" width="400" height="80" rx="4"/><text x="220" y="335">Are there grammar or spelling</text><text x="220" y="355">errors I noticed?</text><rect class="panel" x="420" y="300" width="100" height="80" rx="4"/><text x="470" y="345">Yes / No</text><rect class="panel" x="520" y="300" width="240" height="80" rx="4"/><text class="m" x="640" y="345">write your answer here</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
