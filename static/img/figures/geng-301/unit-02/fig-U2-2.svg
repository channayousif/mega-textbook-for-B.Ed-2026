<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three-stage drafting process</title><desc id="d">A flowchart showing the three-stage drafting process: rough draft (get ideas down, do not edit), structured draft (organize paragraphs, add missing points), refined draft (improve sentences, check word choice).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="80" width="210" height="140" rx="10"/><text class="h" x="135" y="115">Rough draft</text><text x="135" y="145">Get ideas down from</text><text x="135" y="165">your outline</text><text x="135" y="185">Do not stop to edit</text><text x="135" y="205">Placeholders are fine</text><line class="link" x1="240" y1="150" x2="280" y2="150" marker-end="url(#ar)"/><rect class="panel" x="280" y="80" width="210" height="140" rx="10"/><text class="h" x="385" y="115">Structured draft</text><text x="385" y="145">Read what you have</text><text x="385" y="165">Fix organization</text><text x="385" y="185">Add missing points</text><text x="385" y="205">Cut off-topic parts</text><line class="link" x1="490" y1="150" x2="530" y2="150" marker-end="url(#ar)"/><rect class="panel" x="530" y="80" width="220" height="140" rx="10"/><text class="h" x="640" y="115">Refined draft</text><text x="640" y="145">Improve sentences</text><text x="640" y="165">Replace vague words</text><text x="640" y="185">Check word choice</text><text x="640" y="205">Sharpen topic sentences</text><rect x="30" y="280" width="720" height="120" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="390" y="315">Key rule: do not try to polish in the rough draft</text><text x="390" y="345">Polishing before organizing wastes effort on sentences you may later cut.</text><text x="390" y="365">Work through the stages in order.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>