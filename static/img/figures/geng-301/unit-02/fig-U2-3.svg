<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Revising and editing</title><desc id="d">A diagram comparing revising (content, organization, argument) and editing (grammar, word choice, sentences) as two separate processes.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="40" width="340" height="380" rx="10"/><text class="h" x="200" y="80" font-size="16">Revising</text><text class="m" x="200" y="105">the big picture</text><rect x="50" y="120" width="300" height="60" rx="6"/><text x="200" y="150">Content: what is said</text><rect x="50" y="190" width="300" height="60" rx="6"/><text x="200" y="220">Organization: order of ideas</text><rect x="50" y="260" width="300" height="60" rx="6"/><text x="200" y="290">Argument strength: evidence</text><rect x="50" y="330" width="300" height="60" rx="6"/><text x="200" y="360">Conciseness: cut unnecessary words</text><rect class="panel" x="410" y="40" width="340" height="380" rx="10"/><text class="h" x="580" y="80" font-size="16">Editing</text><text class="m" x="580" y="105">the sentence level</text><rect x="430" y="120" width="300" height="60" rx="6"/><text x="580" y="150">Grammar: correct errors</text><rect x="430" y="190" width="300" height="60" rx="6"/><text x="580" y="220">Word choice: specific, precise</text><rect x="430" y="260" width="300" height="60" rx="6"/><text x="580" y="290">Sentence structure: clarity</text><rect x="430" y="330" width="300" height="60" rx="6"/><text x="580" y="360">Tone and conciseness</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
