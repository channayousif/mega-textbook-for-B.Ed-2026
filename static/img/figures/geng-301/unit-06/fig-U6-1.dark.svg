<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Source evaluation process</title><desc id="d">A concept map showing the CRAAP test with five branches: currency, relevance, authority, accuracy and purpose, each with a question to ask.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:10px;fill:var(--muted)} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="80" rx="100" ry="35" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="85">Source Evaluation</text><rect class="panel" x="30" y="160" width="140" height="80" rx="8"/><text class="h" x="100" y="190">Currency</text><text class="m" x="100" y="210">When published?</text><text class="m" x="100" y="228">Still current?</text><rect class="panel" x="220" y="160" width="140" height="80" rx="8"/><text class="h" x="290" y="190">Relevance</text><text class="m" x="290" y="210">Relates to topic?</text><text class="m" x="290" y="228">Right audience?</text><rect class="panel" x="410" y="160" width="140" height="80" rx="8"/><text class="h" x="480" y="190">Authority</text><text class="m" x="480" y="210">Who wrote it?</text><text class="m" x="480" y="228">Qualified?</text><rect class="panel" x="580" y="160" width="140" height="80" rx="8"/><text class="h" x="650" y="190">Accuracy</text><text class="m" x="650" y="210">Evidence given?</text><text class="m" x="650" y="228">Verifiable?</text><rect class="panel" x="300" y="300" width="180" height="80" rx="8"/><text class="h" x="390" y="330">Purpose</text><text class="m" x="390" y="350">Why does it exist?</text><text class="m" x="390" y="368">Inform, persuade, sell?</text><line class="link" x1="100" y1="160" x2="320" y2="115" marker-end="url(#ar)"/><line class="link" x1="290" y1="160" x2="370" y2="115" marker-end="url(#ar)"/><line class="link" x1="480" y1="160" x2="410" y2="115" marker-end="url(#ar)"/><line class="link" x1="650" y1="160" x2="460" y2="115" marker-end="url(#ar)"/><line class="link" x1="390" y1="300" x2="390" y2="115" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
