<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">CRAAP test criteria</title><desc id="d">Table showing the CRAAP test criteria with questions and credibility indicators.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600} .wm{font-size:12px;fill:var(--wm);text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="80" height="40" rx="4"/><text class="h" x="60" y="44">Test</text><rect class="panel" x="100" y="20" width="280" height="40" rx="4"/><text class="h" x="240" y="44">Question to ask</text><rect class="panel" x="380" y="20" width="380" height="40" rx="4"/><text class="h" x="570" y="44">What makes it credible</text><rect class="panel" x="20" y="60" width="80" height="80" rx="4"/><text class="rl" x="60" y="100">Currency</text><rect class="panel" x="100" y="60" width="280" height="80" rx="4"/><text x="240" y="95">When was it published?</text><text x="240" y="115">Is the information still current?</text><rect class="panel" x="380" y="60" width="380" height="80" rx="4"/><text x="570" y="100">Recent publication date</text><text x="570" y="120">updated for current context</text><rect class="panel" x="20" y="140" width="80" height="80" rx="4"/><text class="rl" x="60" y="180">Relevance</text><rect class="panel" x="100" y="140" width="280" height="80" rx="4"/><text x="240" y="175">Does it relate to my topic?</text><text x="240" y="195">Is it right for my audience?</text><rect class="panel" x="380" y="140" width="380" height="80" rx="4"/><text x="570" y="180">directly addresses the topic</text><text x="570" y="200">appropriate level</text><rect class="panel" x="20" y="220" width="80" height="80" rx="4"/><text class="rl" x="60" y="260">Authority</text><rect class="panel" x="100" y="220" width="280" height="80" rx="4"/><text x="240" y="255">Who is the author?</text><text x="240" y="275">What are their qualifications?</text><rect class="panel" x="380" y="220" width="380" height="80" rx="4"/><text x="570" y="260">named author with credentials</text><text x="570" y="280">recognized publisher</text><rect class="panel" x="20" y="300" width="80" height="80" rx="4"/><text class="rl" x="60" y="340">Accuracy</text><rect class="panel" x="100" y="300" width="280" height="80" rx="4"/><text x="240" y="335">Is the information</text><text x="240" y="355">supported by evidence?</text><rect class="panel" x="380" y="300" width="380" height="80" rx="4"/><text x="570" y="340">cited sources, data</text><text x="570" y="360">verifiable from other sources</text><rect class="panel" x="20" y="380" width="80" height="70" rx="4"/><text class="rl" x="60" y="415">Purpose</text><rect class="panel" x="100" y="380" width="280" height="70" rx="4"/><text x="240" y="415">Why does this source exist?</text><rect class="panel" x="380" y="380" width="380" height="70" rx="4"/><text x="570" y="415">to inform or educate</text><text x="570" y="435">not to sell or persuade</text><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
