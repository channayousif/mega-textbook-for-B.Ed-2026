<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">APA and MLA compared</title><desc id="d">Table comparing APA and MLA citation styles side by side across four features.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600} .wm{font-size:12px;fill:var(--wm);text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="140" height="40" rx="4"/><text class="h" x="90" y="44">Feature</text><rect class="panel" x="160" y="20" width="280" height="40" rx="4"/><text class="h" x="300" y="44">APA</text><rect class="panel" x="440" y="20" width="320" height="40" rx="4"/><text class="h" x="600" y="44">MLA</text><rect class="panel" x="20" y="60" width="140" height="90" rx="4"/><text class="rl" x="90" y="105">In-text citation</text><rect class="panel" x="160" y="60" width="280" height="90" rx="4"/><text x="300" y="100">(Author, Year, p. page)</text><text x="300" y="120">example: (Channa, 2023, p. 45)</text><rect class="panel" x="440" y="60" width="320" height="90" rx="4"/><text x="600" y="100">(Author page)</text><text x="600" y="120">example: (Channa 45)</text><rect class="panel" x="20" y="150" width="140" height="90" rx="4"/><text class="rl" x="90" y="195">Reference list</text><rect class="panel" x="160" y="150" width="280" height="90" rx="4"/><text x="300" y="190">References</text><text x="300" y="210">hanging indent</text><rect class="panel" x="440" y="150" width="320" height="90" rx="4"/><text x="600" y="190">Works Cited</text><text x="600" y="210">hanging indent</text><rect class="panel" x="20" y="240" width="140" height="90" rx="4"/><text class="rl" x="90" y="285">Year position</text><rect class="panel" x="160" y="240" width="280" height="90" rx="4"/><text x="300" y="280">after author name</text><text x="300" y="300">(Author, Year)</text><rect class="panel" x="440" y="240" width="320" height="90" rx="4"/><text x="600" y="280">near end of entry</text><text x="600" y="300">(...Year)</text><rect class="panel" x="20" y="330" width="140" height="90" rx="4"/><text class="rl" x="90" y="375">Used in</text><rect class="panel" x="160" y="330" width="280" height="90" rx="4"/><text x="300" y="370">education, psychology</text><text x="300" y="390">social sciences</text><rect class="panel" x="440" y="330" width="320" height="90" rx="4"/><text x="600" y="370">humanities, literature</text><text x="600" y="390">languages</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
