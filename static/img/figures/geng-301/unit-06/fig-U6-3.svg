<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Quoting paraphrasing summarizing</title><desc id="d">Table comparing quoting, paraphrasing and summarizing by definition, when to use each and the key rule for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="120" height="40" rx="4"/><text class="h" x="80" y="44">Technique</text><rect class="panel" x="140" y="20" width="220" height="40" rx="4"/><text class="h" x="250" y="44">What it is</text><rect class="panel" x="360" y="20" width="200" height="40" rx="4"/><text class="h" x="460" y="44">When to use</text><rect class="panel" x="560" y="20" width="200" height="40" rx="4"/><text class="h" x="660" y="44">Key rule</text><rect class="panel" x="20" y="60" width="120" height="100" rx="4"/><text class="rl" x="80" y="110">Quoting</text><rect class="panel" x="140" y="60" width="220" height="100" rx="4"/><text x="250" y="95">Author's exact words</text><text x="250" y="115">in quotation marks</text><rect class="panel" x="360" y="60" width="200" height="100" rx="4"/><text x="460" y="100">when wording is</text><text x="460" y="120">powerful or precise</text><rect class="panel" x="560" y="60" width="200" height="100" rx="4"/><text x="660" y="100">use sparingly;</text><text x="660" y="120">always cite</text><rect class="panel" x="20" y="160" width="120" height="100" rx="4"/><text class="rl" x="80" y="210">Paraphrasing</text><rect class="panel" x="140" y="160" width="220" height="100" rx="4"/><text x="250" y="195">Restate an idea in</text><text x="250" y="215">your own words</text><rect class="panel" x="360" y="160" width="200" height="100" rx="4"/><text x="460" y="200">most common</text><text x="460" y="220">technique</text><rect class="panel" x="560" y="160" width="200" height="100" rx="4"/><text x="660" y="200">change wording AND</text><text x="660" y="220">structure; cite</text><rect class="panel" x="20" y="260" width="120" height="100" rx="4"/><text class="rl" x="80" y="310">Summarizing</text><rect class="panel" x="140" y="260" width="220" height="100" rx="4"/><text x="250" y="295">Condense a longer</text><text x="250" y="315">passage into a few lines</text><rect class="panel" x="360" y="260" width="200" height="100" rx="4"/><text x="460" y="300">when you need the</text><text x="460" y="320">main point only</text><rect class="panel" x="560" y="260" width="200" height="100" rx="4"/><text x="660" y="300">capture the core</text><text x="660" y="320">argument; cite</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
