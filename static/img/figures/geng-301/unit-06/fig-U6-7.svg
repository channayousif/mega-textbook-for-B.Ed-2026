<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Paraphrasing technique</title><desc id="d">Table showing a paraphrasing example: original, poor paraphrase and good paraphrase.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .rl{fill:var(--ink);font-weight:600}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="20" width="140" height="40" rx="4"/><text class="h" x="90" y="44">Version</text><rect class="panel" x="160" y="20" width="600" height="40" rx="4"/><text class="h" x="460" y="44">Text</text><rect class="panel" x="20" y="60" width="140" height="120" rx="4"/><text class="rl" x="90" y="120">Original</text><rect class="panel" x="160" y="60" width="600" height="120" rx="4"/><text x="460" y="100">Formative assessment, when practised consistently,</text><text x="460" y="120">allows teachers to identify gaps in pupil understanding</text><text x="460" y="140">before those gaps become entrenched.</text><text class="m" x="460" y="160">(Channa, 2023, p. 78)</text><rect class="panel" x="20" y="180" width="140" height="120" rx="4"/><text class="rl" x="90" y="230">Poor paraphrase</text><rect class="panel" x="160" y="180" width="600" height="120" rx="4"/><text x="460" y="220">Formative assessment, when practised regularly,</text><text x="460" y="240">allows teachers to identify gaps in student understanding</text><text x="460" y="260">before those gaps become entrenched.</text><text class="m" x="460" y="280">mosaic plagiarism - too close to original</text><rect class="panel" x="20" y="300" width="140" height="120" rx="4"/><text class="rl" x="90" y="350">Good paraphrase</text><rect class="panel" x="160" y="300" width="600" height="120" rx="4"/><text x="460" y="340">Teachers who use ongoing checks on learning can spot</text><text x="460" y="360">misconceptions early, before pupils fall behind</text><text x="460" y="380">(Channa, 2023).</text><text class="m" x="460" y="400">wording and structure both changed</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
