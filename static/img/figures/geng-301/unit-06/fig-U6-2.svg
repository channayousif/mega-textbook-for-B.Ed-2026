<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">When to cite</title><desc id="d">A flowchart showing when to cite: if it is not common knowledge and uses someone's ideas, data or words, you must cite.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .ah{fill:var(--ink)} .wm{font-size:12px;fill:var(--wm);text-anchor:end}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="250" y="30" width="280" height="60" rx="10"/><text class="h" x="390" y="55">Did you learn this from</text><text class="h" x="390" y="75">a source?</text><line class="link" x1="320" y1="90" x2="250" y2="130" marker-end="url(#ar)"/><text class="m" x="270" y="115">No</text><line class="link" x1="460" y1="90" x2="530" y2="130" marker-end="url(#ar)"/><text class="m" x="510" y="115">Yes</text><rect class="panel" x="100" y="130" width="250" height="60" rx="10"/><text class="h" x="225" y="155">Common knowledge</text><text class="m" x="225" y="175">no citation needed</text><rect class="panel" x="430" y="130" width="250" height="60" rx="10"/><text class="h" x="555" y="155">Someone's idea, data</text><text class="h" x="555" y="175">or words</text><line class="link" x1="555" y1="190" x2="555" y2="240" marker-end="url(#ar)"/><rect class="panel" x="250" y="240" width="280" height="60" rx="10"/><text class="h" x="390" y="265">CITE THE SOURCE</text><text class="m" x="390" y="285">in-text + reference list</text><rect x="150" y="340" width="480" height="80" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="390" y="370">When in doubt, cite it</text><text x="390" y="395">Over-citing is a minor error. Under-citing is plagiarism.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
