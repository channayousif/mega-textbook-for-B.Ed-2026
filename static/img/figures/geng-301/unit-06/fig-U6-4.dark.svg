<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Types of plagiarism</title><desc id="d">A diagram showing four types of plagiarism: direct, self, mosaic and accidental, with a brief description of each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="40" width="340" height="180" rx="10"/><text class="h" x="200" y="80" font-size="16">Direct plagiarism</text><text x="200" y="120">Copying text word-for-word</text><text x="200" y="140">without quotation marks</text><text x="200" y="160">or citation</text><text class="m" x="200" y="190">the most obvious type</text><rect class="panel" x="410" y="40" width="340" height="180" rx="10"/><text class="h" x="580" y="80" font-size="16">Self-plagiarism</text><text x="580" y="120">Reusing your own previously</text><text x="580" y="140">submitted work in a new</text><text x="580" y="160">assignment without permission</text><text class="m" x="580" y="190">even your own work must be original</text><rect class="panel" x="30" y="260" width="340" height="180" rx="10"/><text class="h" x="200" y="300" font-size="16">Mosaic plagiarism</text><text x="200" y="340">Piecing together phrases from</text><text x="200" y="360">multiple sources with minor</text><text x="200" y="380">word changes</text><text class="m" x="200" y="410">the most common type</text><rect class="panel" x="410" y="260" width="340" height="180" rx="10"/><text class="h" x="580" y="300" font-size="16">Accidental plagiarism</text><text x="580" y="340">Forgetting to cite a source</text><text x="580" y="360">or paraphrasing too closely</text><text x="580" y="380">without realizing</text><text class="m" x="580" y="410">intent does not matter</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
