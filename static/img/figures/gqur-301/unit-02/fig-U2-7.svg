<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Symmetric and skewed distributions</title><desc id="d">Three distributions side by side: symmetric (mean, median, mode all equal), right-skewed (mean greater than median greater than mode), and left-skewed (mean less than median less than mode).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780"/><rect class="bg" x="0" y="0" width="780" height="470"/>

  <text class="h" x="390" y="25" text-anchor="middle">Mean, median and mode in different distributions</text>

  <!-- LEFT: Symmetric -->
  <rect x="20" y="40" width="240" height="320" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="h c" x="140" y="60">Symmetric</text>
  <!-- Bell curve symmetric -->
  <path d="M 50,280 Q 80,200 140,160 Q 200,200 230,280" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/>
  <!-- Mean, median, mode all at center -->
  <line x1="140" y1="155" x2="140" y2="285" stroke="var(--a3)" stroke-width="2"/>
  <text class="sh c" x="140" y="305">= = =</text>
  <text class="m c" x="140" y="320">Mean</text>
  <text class="m c" x="140" y="332">Median</text>
  <text class="m c" x="140" y="344">Mode</text>

  <!-- CENTER: Right-skewed -->
  <rect x="270" y="40" width="240" height="320" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="h c" x="390" y="60">Right-skewed</text>
  <!-- Right-skewed curve -->
  <path d="M 300,280 Q 320,180 380,160 Q 420,170 460,280" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <!-- Mean pulled right -->
  <line x1="420" y1="155" x2="420" y2="285" stroke="var(--a3)" stroke-width="2"/>
  <!-- Median -->
  <line x1="390" y1="155" x2="390" y2="285" stroke="var(--a1)" stroke-width="2"/>
  <!-- Mode -->
  <line x1="360" y1="155" x2="360" y2="285" stroke="var(--a4)" stroke-width="2"/>
  <text class="sh c" x="360" y="305">Mode</text>
  <text class="sh c" x="390" y="305">Med</text>
  <text class="sh c" x="420" y="305">Mean</text>
  <text class="m c" x="390" y="325">Mode &lt; Med &lt; Mean</text>

  <!-- RIGHT: Left-skewed -->
  <rect x="520" y="40" width="240" height="320" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="h c" x="640" y="60">Left-skewed</text>
  <!-- Left-skewed curve -->
  <path d="M 550,280 Q 580,170 620,160 Q 660,180 700,280" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/>
  <!-- Mean pulled left -->
  <line x1="580" y1="155" x2="580" y2="285" stroke="var(--a3)" stroke-width="2"/>
  <!-- Median -->
  <line x1="620" y1="155" x2="620" y2="285" stroke="var(--a1)" stroke-width="2"/>
  <!-- Mode -->
  <line x1="660" y1="155" x2="660" y2="285" stroke="var(--a4)" stroke-width="2"/>
  <text class="sh c" x="580" y="305">Mean</text>
  <text class="sh c" x="620" y="305">Med</text>
  <text class="sh c" x="660" y="305">Mode</text>
  <text class="m c" x="640" y="325">Mean &lt; Med &lt; Mode</text>

  <!-- Caption -->
  <rect x="20" y="380" width="740" height="70" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="40" y="405">Caption: The relationship between mean, median and mode reveals distribution shape</text>
  <text class="m" x="40" y="425">Symmetric: all three equal. Right-skewed: mean > median > mode. Left-skewed: mean < median < mode.</text>
  <text class="m" x="40" y="440">Credit: textbook.com.pk based on Lane (2023).</text>

  <text class="wm" x="760" y="455" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
