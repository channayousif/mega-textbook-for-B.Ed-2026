<svg font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d"><title id="t">Three charts from the same data</title><desc id="d">School examination results: a correctly scaled bar chart and pie chart compare categories and shares; the crossed-out middle chart intentionally misuses touching histogram bars for categories.</desc>
  <defs>
    <style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2} line.axis{stroke:var(--ink);stroke-width:1.5;fill:none} rect.bar-fill{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} text.caption{font-size:12px;fill:var(--muted)} text.chart-title{font-size:12px;font-weight:600;fill:var(--ink)} line.cross{stroke:var(--a3);stroke-width:3;fill:none} text.label{font-size:10px;font-weight:600;fill:var(--ink)} path.slice1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} path.slice2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} path.slice3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} path.slice4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} path.slice5{fill:var(--panel);stroke:var(--muted);stroke-width:2} text.title{font-size:14px;font-weight:700;fill:var(--ink)}</style>
  </defs>

  <text x="760" y="460" class="wm" aria-hidden="true">textbook.com.pk</text>
  <text x="30" y="30" class="title">Three charts from the same data: exam results (n=172)</text>
  <text x="30" y="50" class="label" style="font-size:12px">Distinction 45, First 78, Second 32, Third 12, Failed 5</text>

  <!-- LEFT: Bar chart (correct for categorical) -->
  <rect x="20" y="65" width="240" height="280" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="0.8"/>
  <text x="140" y="85" text-anchor="middle" class="chart-title">Bar chart (correct here)</text>
  <text x="140" y="100" text-anchor="middle" class="label">Compares categories</text>

  <!-- Y axis -->
  <line x1="55" y1="110" x2="55" y2="320" class="axis"/>
  <!-- X axis -->
  <line x1="55" y1="320" x2="245" y2="320" class="axis"/>

  <!-- Bars -->
  <rect x="70" y="248" width="25" height="72" rx="2" class="bar-fill"/>
  <rect x="110" y="195.2" width="25" height="124.8" rx="2" class="bar-fill"/>
  <rect x="150" y="268.8" width="25" height="51.2" rx="2" class="bar-fill"/>
  <rect x="190" y="300.8" width="25" height="19.2" rx="2" class="bar-fill"/>
  <rect x="225" y="312" width="25" height="8" rx="2" class="bar-fill"/>

  <!-- Bar labels -->
  <text x="82" y="335" text-anchor="middle" class="label">Dist</text>
  <text x="122" y="335" text-anchor="middle" class="label">First</text>
  <text x="162" y="335" text-anchor="middle" class="label">Second</text>
  <text x="202" y="335" text-anchor="middle" class="label">Third</text>
  <text x="237" y="335" text-anchor="middle" class="label">Fail</text>

  <!-- Y labels -->
  <text x="50" y="320" text-anchor="end" class="label">0</text>
  <text x="50" y="240" text-anchor="end" class="label">50</text>
  <text x="50" y="160" text-anchor="end" class="label">100</text>

  <!-- MIDDLE: Histogram (wrong for categorical) -->
  <rect x="270" y="65" width="240" height="280" rx="6" fill="var(--panel)" stroke="var(--a3)" stroke-width="1.5"/>
  <text x="390" y="85" text-anchor="middle" class="chart-title" fill="var(--a3)">Histogram (misuse)</text>
  <text x="390" y="100" text-anchor="middle" class="label" fill="var(--a3)">Touching bars imply continuity</text>

  <!-- Y axis -->
  <line x1="305" y1="110" x2="305" y2="320" class="axis"/>
  <!-- X axis -->
  <line x1="305" y1="320" x2="495" y2="320" class="axis"/>

  <!-- Touching bars (histogram style - wrong) -->
  <rect x="305" y="248" width="40" height="72" rx="0" fill="var(--a3)" opacity="0.3"/>
  <rect x="345" y="195.2" width="40" height="124.8" rx="0" fill="var(--a3)" opacity="0.3"/>
  <rect x="385" y="268.8" width="40" height="51.2" rx="0" fill="var(--a3)" opacity="0.3"/>
  <rect x="425" y="300.8" width="40" height="19.2" rx="0" fill="var(--a3)" opacity="0.3"/>
  <rect x="465" y="312" width="30" height="8" rx="0" fill="var(--a3)" opacity="0.3"/>

  <!-- Cross mark -->
  <line x1="290" y1="100" x2="490" y2="320" class="cross"/>
  <line x1="490" y1="100" x2="290" y2="320" class="cross"/>

  <!-- RIGHT: Pie chart (shows proportions) -->
  <rect x="520" y="65" width="240" height="280" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="0.8"/>
  <text x="640" y="85" text-anchor="middle" class="chart-title">Pie chart (also correct)</text>
  <text x="640" y="100" text-anchor="middle" class="label">Shares proportions of whole</text>

  <circle cx="620" cy="210" r="85" fill="none" stroke="var(--line)" stroke-width="0.5"/>
  <!-- Contiguous sectors: count / 172 * 360 degrees; numbers match legend. -->
  <path d="M 620,210 L 620.000000,125.000000 A 85,85 0 0,1 704.773244,216.204602 Z" class="slice1"/>
  <path d="M 620,210 L 704.773244,216.204602 A 85,85 0 0,1 537.033550,228.481565 Z" class="slice2"/>
  <path d="M 620,210 L 537.033550,228.481565 A 85,85 0 0,1 570.541992,140.870372 Z" class="slice3"/>
  <path d="M 620,210 L 570.541992,140.870372 A 85,85 0 0,1 604.560868,126.413917 Z" class="slice4"/>
  <path d="M 620,210 L 604.560868,126.413917 A 85,85 0 0,1 620.000000,125.000000 Z" class="slice5"/>
  <text x="667.61" y="169.75" text-anchor="middle" class="label">1</text>
  <text x="624.74" y="278.83" text-anchor="middle" class="label">2</text>
  <text x="559.29" y="190.78" text-anchor="middle" class="label">3</text>
  <text x="594.58" y="154.18" text-anchor="middle" class="label">4</text>
  <text x="614.07" y="149.27" text-anchor="middle" class="label">5</text>

  <!-- Pie legend -->
  <text x="540" y="320" class="label" font-size="9px">1: Distinction 26%</text>
  <text x="540" y="335" class="label" font-size="9px">2: First division 45%</text>
  <text x="540" y="350" class="label" font-size="9px">3: Second 19%</text>
  <text x="675" y="320" class="label" font-size="9px">4: Third 7%</text>
  <text x="675" y="335" class="label" font-size="9px">5: Failed 3%</text>

  <!-- Caption -->
  <text x="30" y="380" class="caption">Caption: Bar chart and pie chart are both appropriate for categorical data. A histogram is wrong here</text>
  <text x="30" y="400" class="caption">because the touching bars falsely imply continuity. Credit: textbook.com.pk.</text>
</svg>
