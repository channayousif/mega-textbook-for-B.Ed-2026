<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Mean and median on a number line</title><desc id="d">A number line showing 10 quiz marks as dots, with the mean marked at 14.9 and the median at 17, showing how the low outlier pulls the mean left.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780"/><rect class="bg" x="0" y="0" width="780" height="470"/>

  <text class="h c" x="390" y="30">Effect of an outlier on mean and median</text>

  <!-- Number line -->
  <line x1="80" y1="120" x2="720" y2="120" stroke="var(--line)" stroke-width="2"/>

  <!-- Tick marks and labels -->
  <line x1="100" y1="115" x2="100" y2="125" stroke="var(--ink)" stroke-width="1"/>
  <text class="m c" x="100" y="140">0</text>
  <line x1="200" y1="115" x2="200" y2="125" stroke="var(--ink)" stroke-width="1"/>
  <text class="m c" x="200" y="140">5</text>
  <line x1="300" y1="115" x2="300" y2="125" stroke="var(--ink)" stroke-width="1"/>
  <text class="m c" x="300" y="140">10</text>
  <line x1="400" y1="115" x2="400" y2="125" stroke="var(--ink)" stroke-width="1"/>
  <text class="m c" x="400" y="140">15</text>
  <line x1="500" y1="115" x2="500" y2="125" stroke="var(--ink)" stroke-width="1"/>
  <text class="m c" x="500" y="140">20</text>

  <!-- Data points: 3, 12, 14, 15, 16, 17, 17, 18, 18, 19 -->
  <!-- 3 (outlier) -->
  <circle cx="112" cy="120" r="6" fill="var(--a3)"/>
  <!-- 12 -->
  <circle cx="233" cy="120" r="5" fill="var(--a1)"/>
  <!-- 14 -->
  <circle cx="250" cy="120" r="5" fill="var(--a1)"/>
  <!-- 15 -->
  <circle cx="267" cy="120" r="5" fill="var(--a1)"/>
  <!-- 16 -->
  <circle cx="283" cy="120" r="5" fill="var(--a1)"/>
  <!-- 17, 17 -->
  <circle cx="300" cy="115" r="5" fill="var(--a1)"/>
  <circle cx="300" cy="125" r="5" fill="var(--a1)"/>
  <!-- 18, 18 -->
  <circle cx="317" cy="115" r="5" fill="var(--a1)"/>
  <circle cx="317" cy="125" r="5" fill="var(--a1)"/>
  <!-- 19 -->
  <circle cx="333" cy="120" r="5" fill="var(--a1)"/>

  <!-- Mean marker -->
  <polygon points="283,160 278,150 288,150" fill="var(--a3)"/>
  <text class="sh c" x="283" y="180">Mean = 14.9</text>
  <text class="m c" x="283" y="193">(pulled down by 3)</text>

  <!-- Median marker -->
  <polygon points="300,220 295,210 305,210" fill="var(--a1)"/>
  <text class="sh c" x="300" y="240">Median = 16.5</text>
  <text class="m c" x="300" y="253">(robust to 3)</text>

  <!-- Outlier annotation -->
  <rect x="60" y="290" width="200" height="50" rx="4" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="1"/>
  <text class="sh" x="80" y="312">Outlier: mark = 3</text>
  <text class="m" x="80" y="328">Pulls mean down by ~1.2</text>

  <!-- Explanation box -->
  <rect x="300" y="290" width="420" height="100" rx="4" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="320" y="315">What the diagram shows</text>
  <text class="m" x="320" y="335">Most marks cluster between 15 and 19. The median (16.5) sits in the middle</text>
  <text class="m" x="320" y="350">of this cluster and represents the typical mark well. The mean (14.9) is pulled</text>
  <text class="m" x="320" y="365">below the cluster by the single low mark of 3. This is why the median is preferred</text>
  <text class="m" x="320" y="380">when outliers are present.</text>

  <!-- Caption -->
  <text class="m c" x="390" y="430">Caption: A number line showing how an outlier pulls the mean but not the median.</text>
  <text class="m c" x="390" y="445">Credit: textbook.com.pk.</text>

  <text class="wm" x="760" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
