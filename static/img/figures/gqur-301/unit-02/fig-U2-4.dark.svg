<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Choosing a sampling method</title><desc id="d">A flowchart for choosing a sampling method: start with the research question, decide whether a sampling frame exists, whether random selection is practical, and whether the population has distinct subgroups.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780"/><rect class="bg" x="0" y="0" width="780" height="470"/>

  <text class="h" x="390" y="25" text-anchor="middle">Choosing a sampling method</text>

  <!-- Start -->
  <rect class="step" x="310" y="45" width="160" height="35" rx="6"/>
  <text class="sh c" x="390" y="67">Research question</text>
  <line class="arrow" x1="390" y1="80" x2="390" y2="105"/>

  <!-- Q1: Sampling frame? -->
  <rect class="dec" x="300" y="105" width="180" height="40" rx="4"/>
  <text class="sh c" x="390" y="120">Sampling frame</text>
  <text class="m c" x="390" y="135">exists?</text>

  <!-- Yes branch -->
  <line class="arrow" x1="480" y1="125" x2="600" y2="125"/>
  <text class="m c" x="545" y="118">Yes</text>

  <!-- Q2: Random practical? -->
  <rect class="dec" x="560" y="140" width="200" height="40" rx="4"/>
  <text class="sh c" x="660" y="155">Random selection</text>
  <text class="m c" x="660" y="170">practical?</text>

  <!-- Yes: subgroups? -->
  <line class="arrow" x1="660" y1="180" x2="660" y2="210"/>
  <rect class="dec" x="570" y="210" width="180" height="40" rx="4"/>
  <text class="sh c" x="660" y="225">Distinct</text>
  <text class="m c" x="660" y="240">subgroups?</text>

  <!-- Yes: stratified -->
  <line class="arrow" x1="750" y1="230" x2="750" y2="260"/>
  <rect class="step" x="660" y="260" width="120" height="35" rx="6"/>
  <text class="sh c" x="720" y="282">Stratified</text>

  <!-- No: simple random -->
  <line class="arrow" x1="660" y1="250" x2="660" y2="290"/>
  <rect class="step" x="630" y="290" width="120" height="35" rx="6"/>
  <text class="sh c" x="690" y="312">Simple random</text>

  <!-- No to random: quota -->
  <line class="arrow" x1="560" y1="160" x2="100" y2="200"/>
  <text class="m c" x="300" y="180">No</text>
  <rect class="step" x="30" y="200" width="140" height="35" rx="6"/>
  <text class="sh c" x="100" y="222">Quota or purposive</text>

  <!-- No to frame: convenience -->
  <line class="arrow" x1="300" y1="125" x2="100" y2="125"/>
  <text class="m c" x="200" y="118">No</text>
  <rect class="step" x="30" y="105" width="140" height="35" rx="6"/>
  <text class="sh c" x="100" y="127">Convenience or</text>
  <text class="sh c" x="100" y="140">purposive</text>

  <!-- Caption -->
  <rect x="30" y="350" width="720" height="90" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="50" y="375">Caption: Decision guide for choosing a sampling method</text>
  <text class="m" x="50" y="395">Start with whether a complete list (sampling frame) exists, then whether random selection</text>
  <text class="m" x="50" y="410">is practical, then whether subgroups matter. The answers lead to the appropriate method.</text>
  <text class="m" x="50" y="430">Credit: textbook.com.pk.</text>

  <text class="wm" x="760" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
