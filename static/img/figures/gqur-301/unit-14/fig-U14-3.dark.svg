<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Steps to build a confidence interval</title><desc id="d">A flowchart with five boxes and arrows showing the steps: compute sample mean, compute standard error, find critical value, compute margin of error, build the interval.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .box{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .arrow{stroke:var(--ink);stroke-width:2.5;fill:none} .step{fill:var(--a1)}</style><rect class="bg" x="0" y="0" width="780" height="560"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>

  <!-- Title -->
  <text class="h" x="50" y="38">Five steps to build a 95 per cent confidence interval for a mean</text>

  <!-- Step 1 -->
  <rect class="box" x="240" y="56" width="300" height="56" rx="8"/>
  <text class="sh c" x="390" y="78">Step 1: Compute the</text>
  <text class="sh c" x="390" y="98">sample mean (x¯)</text>

  <!-- Arrow 1->2 -->
  <line class="arrow" x1="390" y1="112" x2="390" y2="136" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <rect class="box" x="240" y="136" width="300" height="56" rx="8"/>
  <text class="sh c" x="390" y="158">Step 2: Compute the</text>
  <text class="sh c" x="390" y="178">standard error (s / √n)</text>

  <!-- Arrow 2->3 -->
  <line class="arrow" x1="390" y1="192" x2="390" y2="216" marker-end="url(#ar)"/>

  <!-- Step 3 -->
  <rect class="box" x="240" y="216" width="300" height="56" rx="8"/>
  <text class="sh c" x="390" y="238">Step 3: Choose the confidence</text>
  <text class="sh c" x="390" y="258">level and find z* (1.96)</text>

  <!-- Arrow 3->4 -->
  <line class="arrow" x1="390" y1="272" x2="390" y2="296" marker-end="url(#ar)"/>

  <!-- Step 4 -->
  <rect class="box" x="240" y="296" width="300" height="56" rx="8"/>
  <text class="sh c" x="390" y="318">Step 4: Compute the</text>
  <text class="sh c" x="390" y="338">margin of error (z* x SE)</text>

  <!-- Arrow 4->5 -->
  <line class="arrow" x1="390" y1="352" x2="390" y2="376" marker-end="url(#ar)"/>

  <!-- Step 5 -->
  <rect class="box" x="240" y="376" width="300" height="56" rx="8"/>
  <text class="sh c" x="390" y="398">Step 5: Build the interval</text>
  <text class="sh c" x="390" y="418">(x¯ - margin, x¯ + margin)</text>

  <!-- Worked example panel on the right -->
  <rect class="panel" x="560" y="56" width="200" height="380" rx="8"/>
  <text class="sh c" x="660" y="82">Worked example</text>
  <text class="small c" x="660" y="108">n = 15, x¯ = 34.2</text>
  <text class="small c" x="660" y="128">s = 3.8, z* = 1.96</text>
  <line x1="575" y1="140" x2="745" y2="140" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>
  <text class="body c" x="660" y="168">SE = 3.8 / √15</text>
  <text class="body c" x="660" y="188">= 3.8 / 3.87 = 0.98</text>
  <line x1="575" y1="200" x2="745" y2="200" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>
  <text class="body c" x="660" y="228">Margin = 1.96 x 0.98</text>
  <text class="body c" x="660" y="248">= 1.92</text>
  <line x1="575" y1="260" x2="745" y2="260" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>
  <text class="body c" x="660" y="288">Interval = 34.2 +/- 1.92</text>
  <text class="sh c" x="660" y="318">= (32.28, 36.12)</text>
  <line x1="575" y1="330" x2="745" y2="330" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>
  <text class="small c" x="660" y="358">Report: "We estimate the</text>
  <text class="small c" x="660" y="378">mean classroom size to be</text>
  <text class="small c" x="660" y="398">between 32.3 and 36.1</text>
  <text class="small c" x="660" y="418">pupils, with 95 per cent</text>
  <text class="small c" x="660" y="434">confidence."</text>

  <!-- Annotation panel on the left -->
  <rect class="panel" x="20" y="56" width="200" height="380" rx="8"/>
  <text class="sh c" x="120" y="82">What each step does</text>
  <text class="small c" x="120" y="110">Step 1: Find the centre</text>
  <text class="small c" x="120" y="130">of the sample.</text>
  <text class="small c" x="120" y="160">Step 2: Measure how</text>
  <text class="small c" x="120" y="180">much sample means vary.</text>
  <text class="small c" x="120" y="210">Step 3: Pick how</text>
  <text class="small c" x="120" y="230">certain you want to be.</text>
  <text class="small c" x="120" y="260">Step 4: Turn that</text>
  <text class="small c" x="120" y="280">certainty into a width.</text>
  <text class="small c" x="120" y="310">Step 5: Add and subtract</text>
  <text class="small c" x="120" y="330">the width from the centre.</text>
  <line x1="35" y1="348" x2="205" y2="348" stroke="var(--ink)" stroke-width="1" opacity="0.3"/>
  <text class="small c" x="120" y="378">Steps 1 and 2 use the</text>
  <text class="small c" x="120" y="398">sample data. Step 3 uses</text>
  <text class="small c" x="120" y="418">the chosen confidence level.</text>

  <!-- Wordmark -->
  <text class="wm" x="765" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>