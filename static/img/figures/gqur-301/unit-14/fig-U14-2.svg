<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Worked point-estimate table</title><desc id="d">A table comparing two point estimates: a mean estimate of 34.2 pupils from classroom sizes and a proportion estimate of 0.60 from a school library survey, with formulas shown.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .row1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .row2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1;opacity:0.3} .start{text-anchor:start}</style><rect class="bg" x="0" y="0" width="780" height="420"/>

  <!-- Title -->
  <text class="h" x="50" y="40">Two point estimates from the district survey</text>

  <!-- Table header -->
  <rect class="panel" x="50" y="58" width="680" height="40" rx="6"/>
  <text class="sh c" x="190" y="83">Estimate type</text>
  <text class="sh c" x="415" y="83">Formula</text>
  <text class="sh c" x="630" y="83">Computed value</text>

  <!-- Row 1: Mean estimate -->
  <rect class="row1" x="50" y="102" width="680" height="90" rx="6"/>
  <text class="sh c" x="190" y="130">Sample mean (x¯)</text>
  <text class="body c" x="190" y="155">Sum of all sample</text>
  <text class="body c" x="190" y="173">values, divide by n</text>
  <text class="body c" x="415" y="130">x¯ = 513 / 15</text>
  <text class="body c" x="415" y="155">x¯ = 34.2</text>
  <text class="sh c" x="630" y="140">34.2 pupils</text>
  <text class="small c" x="630" y="165">per classroom</text>

  <!-- Row 2: Proportion estimate -->
  <rect class="row2" x="50" y="196" width="680" height="90" rx="6"/>
  <text class="sh c" x="190" y="224">Sample proportion (p̂)</text>
  <text class="body c" x="190" y="249">Number with the</text>
  <text class="body c" x="190" y="267">feature, divide by n</text>
  <text class="body c" x="415" y="224">p̂ = 9 / 15</text>
  <text class="body c" x="415" y="249">p̂ = 0.60</text>
  <text class="sh c" x="630" y="234">0.60 (60 per cent)</text>
  <text class="small c" x="630" y="259">of schools have a library</text>

  <!-- Grid lines between columns -->
  <line class="grid" x1="330" y1="58" x2="330" y2="286"/>
  <line class="grid" x1="500" y1="58" x2="500" y2="286"/>

  <!-- Annotation panel -->
  <rect class="panel" x="50" y="304" width="680" height="90" rx="8"/>
  <text class="h" x="75" y="332">Reading this table</text>
  <text class="body" x="75" y="358">Both rows use the same idea: a single number from the sample stands in for</text>
  <text class="body" x="75" y="378">the unknown population value. The sample mean estimates the population mean;</text>
  <text class="body" x="75" y="394">the sample proportion estimates the population proportion.</text>

  <!-- Wordmark -->
  <text class="wm" x="765" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>