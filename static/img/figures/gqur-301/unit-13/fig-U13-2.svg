<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Correlation coefficient interpretation scale from -1.0 to +1.0 with descriptors</title><desc id="d">Correlation coefficient interpretation scale from -1.0 to +1.0 with descriptors: strong negative (-1.0 to -0.70), moderate negative (-0.70 to -0.30), weak or none (-0.30 to +0.30), moderate positive (+0.30 to +0.70), strong positive (+0.70 to +1.0), each with a classroom example.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.fit{stroke:var(--a1);stroke-width:3;fill:none}.dash{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4;fill:none}.grid{stroke:var(--ink);opacity:.25}.dot,.ah{fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="ah"/></marker></defs><rect class="bg" width="780" height="470"/><text x="390" y="35" text-anchor="middle" class="h">Interpreting the correlation coefficient</text><rect x="15" y="55" width="750" height="370" rx="8" class="panel"/><text x="120" y="87" text-anchor="middle" class="h">Range of r</text><text x="340" y="87" text-anchor="middle" class="h">Direction / strength</text><text x="605" y="87" text-anchor="middle" class="h">Illustrative classroom pair</text><line x1="25" y1="109" x2="755" y2="109" class="grid" /><text x="120" y="143" text-anchor="middle" class="support">−1.00 to −0.70</text><text x="340" y="143" text-anchor="middle" class="support">Strong negative</text><text x="605" y="143" text-anchor="middle" class="support">Absences / test score</text><line x1="25" y1="171" x2="755" y2="171" class="grid" /><text x="120" y="205" text-anchor="middle" class="support">−0.70 to −0.30</text><text x="340" y="205" text-anchor="middle" class="support">Moderate negative</text><text x="605" y="205" text-anchor="middle" class="support">Late arrivals / test score</text><line x1="25" y1="233" x2="755" y2="233" class="grid" /><text x="120" y="267" text-anchor="middle" class="support">−0.30 to +0.30</text><text x="340" y="267" text-anchor="middle" class="support">Weak or none</text><text x="605" y="267" text-anchor="middle" class="support">Shoe size / test score</text><line x1="25" y1="295" x2="755" y2="295" class="grid" /><text x="120" y="329" text-anchor="middle" class="support">+0.30 to +0.70</text><text x="340" y="329" text-anchor="middle" class="support">Moderate positive</text><text x="605" y="329" text-anchor="middle" class="support">Books read / reading score</text><line x1="25" y1="357" x2="755" y2="357" class="grid" /><text x="120" y="391" text-anchor="middle" class="support">+0.70 to +1.00</text><text x="340" y="391" text-anchor="middle" class="support">Strong positive</text><text x="605" y="391" text-anchor="middle" class="support">Study hours / test score</text><text x="390" y="450" text-anchor="middle" class="support">Rule of thumb; examples are hypothetical, not causal claims.</text><text x="768" y="465" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
