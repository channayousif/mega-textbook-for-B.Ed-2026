<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">باہمی تعلق کے عدد کا پیمانہ منفی ایک سے مثبت ایک تک، سمت، طاقت اور جماعت کی فرضی مثالوں کے ساتھ۔</title><desc id="d">باہمی تعلق کے عدد کا پیمانہ منفی ایک سے مثبت ایک تک، سمت، طاقت اور جماعت کی فرضی مثالوں کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.fit{stroke:var(--a1);stroke-width:3;fill:none}.dash{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4;fill:none}.grid{stroke:var(--ink);opacity:.25}.dot,.ah{fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="ah"/></marker></defs><rect class="bg" width="780" height="470"/><text x="390" y="35" text-anchor="middle" class="h">باہمی تعلق کے عدد کی تشریح</text><rect x="15" y="55" width="750" height="370" rx="8" class="panel"/><text x="660" y="87" text-anchor="middle" class="h">عدد کی حد</text><text x="440" y="87" text-anchor="middle" class="h">سمت اور طاقت</text><text x="175" y="87" text-anchor="middle" class="h">جماعت کی فرضی مثال</text><line x1="25" y1="109" x2="755" y2="109" class="grid" /><text x="660" y="143" text-anchor="middle" class="support">[−1.00, −0.70]</text><text x="440" y="143" text-anchor="middle" class="support">مضبوط منفی</text><text x="175" y="143" text-anchor="middle" class="support">غیر حاضری / ٹیسٹ نمبر</text><line x1="25" y1="171" x2="755" y2="171" class="grid" /><text x="660" y="205" text-anchor="middle" class="support">[−0.70, −0.30]</text><text x="440" y="205" text-anchor="middle" class="support">معتدل منفی</text><text x="175" y="205" text-anchor="middle" class="support">تاخیر سے آمد / ٹیسٹ نمبر</text><line x1="25" y1="233" x2="755" y2="233" class="grid" /><text x="660" y="267" text-anchor="middle" class="support">[−0.30, +0.30]</text><text x="440" y="267" text-anchor="middle" class="support">کمزور یا نہ ہونے کے برابر</text><text x="175" y="267" text-anchor="middle" class="support">جوتے کا سائز / ٹیسٹ نمبر</text><line x1="25" y1="295" x2="755" y2="295" class="grid" /><text x="660" y="329" text-anchor="middle" class="support">[+0.30, +0.70]</text><text x="440" y="329" text-anchor="middle" class="support">معتدل مثبت</text><text x="175" y="329" text-anchor="middle" class="support">پڑھی ہوئی کتابیں / مطالعے کے نمبر</text><line x1="25" y1="357" x2="755" y2="357" class="grid" /><text x="660" y="391" text-anchor="middle" class="support">[+0.70, +1.00]</text><text x="440" y="391" text-anchor="middle" class="support">مضبوط مثبت</text><text x="175" y="391" text-anchor="middle" class="support">مطالعے کے گھنٹے / ٹیسٹ نمبر</text><text x="390" y="450" text-anchor="middle" class="support">تقریبی پیمانہ؛ مثالیں فرضی ہیں، سبب کا دعویٰ نہیں۔</text><text x="12" y="458" text-anchor="start" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
