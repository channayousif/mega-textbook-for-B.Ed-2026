<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خط رجعت بنانے کے مراحل</title><desc id="d">خط رجعت بنانے کے مراحل: جوڑے ڈیٹا، اوسط، ڈھلوان، عمودی قطع، مساوات اور پیش گوئی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.fit{stroke:var(--a1);stroke-width:3;fill:none}.dash{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4;fill:none}.grid{stroke:var(--ink);opacity:.25}.dot,.ah{fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="ah"/></marker></defs><rect class="bg" width="780" height="470"/><text x="390" y="32" text-anchor="middle" class="h">کم ترین مربعات کا خط بنائیں اور استعمال کریں</text><rect x="530" y="65" width="230" height="125" rx="8" class="panel"/><text x="645" y="105" text-anchor="middle" class="h">۱۔ جوڑے ڈیٹا</text><text x="645" y="153" text-anchor="middle" class="support">(x, y)</text><rect x="275" y="65" width="230" height="125" rx="8" class="panel"/><text x="390" y="105" text-anchor="middle" class="h">۲۔ اوسط نکالیں</text><text x="390" y="153" text-anchor="middle" class="support">x̄ = Σx/n; ȳ = Σy/n</text><rect x="20" y="65" width="230" height="125" rx="8" class="panel"/><text x="135" y="105" text-anchor="middle" class="h">۳۔ ڈھلوان نکالیں</text><text x="135" y="153" text-anchor="middle" class="support">b = Σ(x−x̄)(y−ȳ) / Σ(x−x̄)²</text><rect x="20" y="275" width="230" height="125" rx="8" class="panel"/><text x="135" y="315" text-anchor="middle" class="h">۴۔ عمودی قطع نکالیں</text><text x="135" y="363" text-anchor="middle" class="support">a = ȳ − bx̄</text><rect x="275" y="275" width="230" height="125" rx="8" class="panel"/><text x="390" y="315" text-anchor="middle" class="h">۵۔ خط کی مساوات لکھیں</text><text x="390" y="363" text-anchor="middle" class="support">ŷ = a + bx</text><rect x="530" y="275" width="230" height="125" rx="8" class="panel"/><text x="645" y="315" text-anchor="middle" class="h">۶۔ پیش گوئی کریں</text><text x="645" y="363" text-anchor="middle" class="support">x → ŷ</text><line x1="530" y1="128" x2="505" y2="128" class="stroke" marker-end="url(#arrow)"/><line x1="275" y1="128" x2="250" y2="128" class="stroke" marker-end="url(#arrow)"/><line x1="135" y1="190" x2="135" y2="275" class="stroke" marker-end="url(#arrow)"/><line x1="250" y1="338" x2="275" y2="338" class="stroke" marker-end="url(#arrow)"/><line x1="505" y1="338" x2="530" y2="338" class="stroke" marker-end="url(#arrow)"/><text x="390" y="439" text-anchor="middle" class="support">پیش گوئی مشاہدہ شدہ حد کے اندر کریں۔</text><text x="12" y="465" text-anchor="start" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
