<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Step-by-step flowchart for fitting a least-squares regression line</title><desc id="d">Step-by-step flowchart for fitting a least-squares regression line: raw data, compute means, compute slope b, compute intercept a, write equation, then use the line to predict a response value.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.support{font-size:14px}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.fit{stroke:var(--a1);stroke-width:3;fill:none}.dash{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4;fill:none}.grid{stroke:var(--ink);opacity:.25}.dot,.ah{fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" class="ah"/></marker></defs><rect class="bg" width="780" height="470"/><text x="390" y="32" text-anchor="middle" class="h">Fit and use a least-squares line</text><rect x="20" y="65" width="230" height="125" rx="8" class="panel"/><text x="135" y="105" text-anchor="middle" class="h">1. Paired raw data</text><text x="135" y="153" text-anchor="middle" class="support">(x, y)</text><rect x="275" y="65" width="230" height="125" rx="8" class="panel"/><text x="390" y="105" text-anchor="middle" class="h">2. Compute means</text><text x="390" y="153" text-anchor="middle" class="support">x̄ = Σx/n; ȳ = Σy/n</text><rect x="530" y="65" width="230" height="125" rx="8" class="panel"/><text x="645" y="105" text-anchor="middle" class="h">3. Compute slope</text><text x="645" y="153" text-anchor="middle" class="support">b = Σ(x−x̄)(y−ȳ) / Σ(x−x̄)²</text><rect x="530" y="275" width="230" height="125" rx="8" class="panel"/><text x="645" y="315" text-anchor="middle" class="h">4. Compute intercept</text><text x="645" y="363" text-anchor="middle" class="support">a = ȳ − bx̄</text><rect x="275" y="275" width="230" height="125" rx="8" class="panel"/><text x="390" y="315" text-anchor="middle" class="h">5. Write the line</text><text x="390" y="363" text-anchor="middle" class="support">ŷ = a + bx</text><rect x="20" y="275" width="230" height="125" rx="8" class="panel"/><text x="135" y="315" text-anchor="middle" class="h">6. Predict a response</text><text x="135" y="363" text-anchor="middle" class="support">x → ŷ</text><line x1="250" y1="128" x2="275" y2="128" class="stroke" marker-end="url(#arrow)"/><line x1="505" y1="128" x2="530" y2="128" class="stroke" marker-end="url(#arrow)"/><line x1="645" y1="190" x2="645" y2="275" class="stroke" marker-end="url(#arrow)"/><line x1="530" y1="338" x2="505" y2="338" class="stroke" marker-end="url(#arrow)"/><line x1="275" y1="338" x2="250" y2="338" class="stroke" marker-end="url(#arrow)"/><text x="390" y="439" text-anchor="middle" class="support">Predict within the observed range of x.</text><text x="768" y="465" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
