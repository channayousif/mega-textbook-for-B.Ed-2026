<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">fig-U9-1: concept-map</title><desc id="d">A concept map connects a draw to one outcome, all five possible outcomes, the three odd outcomes and their probability of three fifths.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.box{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect width="640" height="440" fill="var(--bg)"/><text x="24" y="32" class="h" text-anchor="start">From experiment to probability</text><rect class="box" x="180" y="52" width="280" height="64" rx="8"/><text x="320" y="77" class="" text-anchor="middle">Experiment: draw one slip</text><text x="320" y="100" class="small" text-anchor="middle">Five identical slips, numbered 1 to 5</text><line class="line" x1="230" y1="116" x2="145" y2="172" marker-end="url(#arrow)"/><line class="line" x1="410" y1="116" x2="490" y2="172" marker-end="url(#arrow)"/><text x="105" y="144" class="small" text-anchor="start">one result</text><text x="430" y="158" class="small" text-anchor="start">all possibilities</text><rect class="box" x="30" y="180" width="230" height="68" rx="8"/><text x="145" y="208" class="" text-anchor="middle">Outcome: slip 1</text><text x="145" y="232" class="small" text-anchor="middle">A single result</text><rect class="box" x="350" y="180" width="260" height="68" rx="8"/><text x="480" y="208" class="" text-anchor="middle">Sample space: 1, 2, 3, 4, 5</text><text x="480" y="232" class="small" text-anchor="middle">Every possible result</text><line class="line" x1="480" y1="248" x2="480" y2="288" marker-end="url(#arrow)"/><text x="485" y="274" class="small" text-anchor="start">select odd numbers</text><rect class="box" x="350" y="296" width="260" height="62" rx="8"/><text x="480" y="321" class="" text-anchor="middle">Event: 1, 3, 5</text><text x="480" y="345" class="small" text-anchor="middle">Three favourable outcomes</text><line class="line" x1="350" y1="327" x2="288" y2="327" marker-end="url(#arrow)"/><rect class="box" x="30" y="296" width="250" height="62" rx="8"/><text x="155" y="321" class="" text-anchor="middle">Probability: P(odd) = 3/5</text><text x="155" y="345" class="small" text-anchor="middle">Equal chances are assumed</text><text x="628" y="430" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
