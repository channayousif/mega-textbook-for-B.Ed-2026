<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">fig-U9-4: table</title><desc id="d">A rule table pairs complement, overlap-corrected addition and conditional multiplication with their conditions and classroom examples.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.box{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect width="640" height="440" fill="var(--bg)"/><text x="24" y="32" class="h" text-anchor="start">Choose a probability rule</text><rect class="box" x="24" y="52" width="592" height="94" rx="8"/><text x="40" y="78" class="h" text-anchor="start">Complement: not A</text><text x="40" y="104" class="" text-anchor="start">P(not A) = 1 - P(A)</text><text x="40" y="130" class="small" text-anchor="start">Not reading: 1 - 18/30 = 12/30</text><rect class="box" x="24" y="160" width="592" height="102" rx="8"/><text x="40" y="187" class="h" text-anchor="start">Addition: A or B, including both</text><text x="40" y="213" class="" text-anchor="start">P(A or B) = P(A) + P(B) - P(A and B)</text><text x="40" y="241" class="small" text-anchor="start">Either club: 18/30 + 14/30 - 8/30 = 24/30</text><rect class="box" x="24" y="276" width="592" height="122" rx="8"/><text x="40" y="303" class="h" text-anchor="start">Multiplication: A and B</text><text x="40" y="329" class="" text-anchor="start">P(A and B) = P(A) × P(B given A)</text><text x="40" y="355" class="small" text-anchor="start">Both clubs: (18/30) × (8/18) = 8/30</text><text x="40" y="381" class="small" text-anchor="start">Only if independent: P(A and B) = P(A) × P(B)</text><text x="628" y="430" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
