<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">fig-U9-3: diagram</title><desc id="d">Reading and science overlap in eight pupils; ten join reading only, six science only and six neither, so twenty-four join at least one activity.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.box{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect width="640" height="440" fill="var(--bg)"/><text x="24" y="32" class="h" text-anchor="start">Overlapping school activities</text><text x="24" y="64" class="small" text-anchor="start">Select one pupil uniformly from this fictional class of 30.</text><rect x="24" y="82" width="592" height="236" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><ellipse cx="257" cy="186" rx="145" ry="90" fill="var(--a1-fill)" stroke="var(--ink)" stroke-width="2"/><ellipse cx="395" cy="186" rx="145" ry="90" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 4"/><text x="197" y="120" class="" text-anchor="middle">Reading</text><text x="453" y="120" class="" text-anchor="middle">Science</text><text x="195" y="177" class="" text-anchor="middle">Reading only</text><text x="195" y="204" class="h" text-anchor="middle">10</text><text x="326" y="177" class="" text-anchor="middle">Both</text><text x="326" y="204" class="h" text-anchor="middle">8</text><text x="459" y="177" class="" text-anchor="middle">Science only</text><text x="459" y="204" class="h" text-anchor="middle">6</text><text x="560" y="288" class="small" text-anchor="end">Neither: 6</text><text x="24" y="346" class="" text-anchor="start">Union: reading or science = 10 + 8 + 6 = 24</text><text x="24" y="372" class="" text-anchor="start">Intersection: both = 8</text><text x="24" y="398" class="" text-anchor="start">Complement of reading: science only + neither = 12</text><text x="628" y="430" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
