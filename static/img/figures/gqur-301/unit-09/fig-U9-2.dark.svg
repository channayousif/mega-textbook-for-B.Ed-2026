<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">fig-U9-2: diagram</title><desc id="d">A probability scale runs from impossible at zero to certain at one, with intermediate chances of 0.2, 0.5 and 0.8.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.box{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect width="640" height="440" fill="var(--bg)"/><text x="24" y="32" class="h" text-anchor="start">The probability scale</text><text x="24" y="64" class="small" text-anchor="start">Values describe the chance of a clearly stated event.</text><line class="line" x1="65" y1="176" x2="575" y2="176"/><line class="line" x1="65" y1="163" x2="65" y2="189"/><text x="65" y="145" class="h" text-anchor="middle">0</text><text x="65" y="214" class="small" text-anchor="middle">Impossible</text><line class="line" x1="167.0" y1="163" x2="167.0" y2="189"/><text x="167.0" y="145" class="h" text-anchor="middle">0.2</text><text x="167.0" y="214" class="small" text-anchor="middle">Unlikely</text><line class="line" x1="320.0" y1="163" x2="320.0" y2="189"/><text x="320.0" y="145" class="h" text-anchor="middle">0.5</text><text x="320.0" y="214" class="small" text-anchor="middle">Even chance</text><line class="line" x1="473.0" y1="163" x2="473.0" y2="189"/><text x="473.0" y="145" class="h" text-anchor="middle">0.8</text><text x="473.0" y="214" class="small" text-anchor="middle">Likely</text><line class="line" x1="575" y1="163" x2="575" y2="189"/><text x="575" y="145" class="h" text-anchor="middle">1</text><text x="575" y="214" class="small" text-anchor="middle">Certain</text><rect class="box" x="24" y="248" width="286" height="92" rx="8"/><text x="40" y="274" class="h" text-anchor="start">Probability 0</text><text x="40" y="300" class="" text-anchor="start">Draw 9 from slips 1 to 5</text><text x="40" y="323" class="small" text-anchor="start">No possible outcome meets the event.</text><rect class="box" x="330" y="248" width="286" height="92" rx="8"/><text x="346" y="274" class="h" text-anchor="start">Probability 1</text><text x="346" y="300" class="" text-anchor="start">Draw 1 to 5 from slips 1 to 5</text><text x="346" y="323" class="small" text-anchor="start">Every outcome meets the event.</text><text x="320" y="378" class="" text-anchor="middle">A valid probability is at least 0 and at most 1.</text><text x="628" y="430" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
