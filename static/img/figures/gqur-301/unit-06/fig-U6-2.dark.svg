<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table computing the range for two sections with the same mean of 12.</title><desc id="d">A table computing the range for two sections with the same mean of 12. Section A: largest 14, smallest 10, range 4. Section B: largest 20, smallest 4, range 16.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)} .cell{fill:var(--bg);stroke:var(--muted);stroke-width:1} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .head{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} .band{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .dot{fill:var(--ink);stroke:var(--bg);stroke-width:1} .line{fill:none;stroke:var(--ink);stroke-width:2} .grid{fill:none;stroke:var(--muted);stroke-width:1;opacity:.5} .dash{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5} .arrow{fill:var(--ink)} text{font-size:14px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{font-size:11px;fill:var(--wm)} .body{font-size:14px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="30" y="35" text-anchor="start"><tspan x="30" dy="0">Computing the range</tspan></text><rect class="head" x="25" y="85" width="730" height="72" rx="0"/><line class="grid" x1="116" y1="85" x2="116" y2="157"/><line class="grid" x1="392" y1="85" x2="392" y2="157"/><line class="grid" x1="462" y1="85" x2="462" y2="157"/><line class="grid" x1="538" y1="85" x2="538" y2="157"/><line class="grid" x1="690" y1="85" x2="690" y2="157"/><text class="sh" x="70.5" y="111" text-anchor="middle"><tspan x="70.5" dy="0">Section</tspan></text><text class="sh" x="254.0" y="111" text-anchor="middle"><tspan x="254.0" dy="0">Marks (sorted)</tspan></text><text class="sh" x="427.0" y="111" text-anchor="middle"><tspan x="427.0" dy="0">Largest</tspan></text><text class="sh" x="500.0" y="111" text-anchor="middle"><tspan x="500.0" dy="0">Smallest</tspan></text><text class="sh" x="614.0" y="111" text-anchor="middle"><tspan x="614.0" dy="0">Range =</tspan><tspan x="614.0" dy="19">largest -</tspan><tspan x="614.0" dy="19">smallest</tspan></text><text class="sh" x="722.5" y="111" text-anchor="middle"><tspan x="722.5" dy="0">Mean</tspan></text><rect class="cell" x="25" y="157" width="730" height="95" rx="0"/><line class="grid" x1="116" y1="157" x2="116" y2="252"/><line class="grid" x1="392" y1="157" x2="392" y2="252"/><line class="grid" x1="462" y1="157" x2="462" y2="252"/><line class="grid" x1="538" y1="157" x2="538" y2="252"/><line class="grid" x1="690" y1="157" x2="690" y2="252"/><text class="body" x="70.5" y="183" text-anchor="middle"><tspan x="70.5" dy="0">Section A</tspan></text><text class="body" x="254.0" y="183" text-anchor="middle"><tspan x="254.0" dy="0">10, 11, 12, 12,</tspan><tspan x="254.0" dy="19">12, 12, 13, 14</tspan></text><text class="body" x="427.0" y="183" text-anchor="middle"><tspan x="427.0" dy="0">14</tspan></text><text class="body" x="500.0" y="183" text-anchor="middle"><tspan x="500.0" dy="0">10</tspan></text><text class="body" x="614.0" y="183" text-anchor="middle"><tspan x="614.0" dy="0">4</tspan></text><text class="body" x="722.5" y="183" text-anchor="middle"><tspan x="722.5" dy="0">12</tspan></text><rect class="cell" x="25" y="252" width="730" height="95" rx="0"/><line class="grid" x1="116" y1="252" x2="116" y2="347"/><line class="grid" x1="392" y1="252" x2="392" y2="347"/><line class="grid" x1="462" y1="252" x2="462" y2="347"/><line class="grid" x1="538" y1="252" x2="538" y2="347"/><line class="grid" x1="690" y1="252" x2="690" y2="347"/><text class="body" x="70.5" y="278" text-anchor="middle"><tspan x="70.5" dy="0">Section B</tspan></text><text class="body" x="254.0" y="278" text-anchor="middle"><tspan x="254.0" dy="0">4, 5, 7, 10,</tspan><tspan x="254.0" dy="19">14, 17, 19, 20</tspan></text><text class="body" x="427.0" y="278" text-anchor="middle"><tspan x="427.0" dy="0">20</tspan></text><text class="body" x="500.0" y="278" text-anchor="middle"><tspan x="500.0" dy="0">4</tspan></text><text class="body" x="614.0" y="278" text-anchor="middle"><tspan x="614.0" dy="0">16</tspan></text><text class="body" x="722.5" y="278" text-anchor="middle"><tspan x="722.5" dy="0">12</tspan></text><text class="sh" x="390" y="398" text-anchor="middle"><tspan x="390" dy="0">same mean, different range</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
