<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Two dot plots with the same mean of 12.</title><desc id="d">Two dot plots with the same mean of 12. Section A's eight marks are bunched between 10 and 14, with a standard deviation of about 1.1; Section B's eight marks are spread from 4 to 20, with a standard deviation of about 6.0. A band of one standard deviation either side of the mean is narrow for A and wide for B.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
