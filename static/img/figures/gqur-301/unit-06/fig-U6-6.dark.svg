<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A guide to interpreting the standard deviation in a classroom.</title><desc id="d">A guide to interpreting the standard deviation in a classroom. A small value means a consistent group that may suit one pace; a large value means a varied group that needs different levels of support; a very small value on a test may mean the test was too easy; a large value on a placement test is useful because it separates pupils.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)} .cell{fill:var(--bg);stroke:var(--muted);stroke-width:1} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .head{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} .band{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .dot{fill:var(--ink);stroke:var(--bg);stroke-width:1} .line{fill:none;stroke:var(--ink);stroke-width:2} .grid{fill:none;stroke:var(--muted);stroke-width:1;opacity:.5} .dash{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5} .arrow{fill:var(--ink)} text{font-size:14px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{font-size:11px;fill:var(--wm)} .body{font-size:14px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="25" y="32" text-anchor="start"><tspan x="25" dy="0">Interpreting standard deviation</tspan></text><rect class="head" x="25" y="55" width="730" height="44" rx="0"/><text class="sh" x="37" y="82" text-anchor="start"><tspan x="37" dy="0">What you see</tspan></text><text class="sh" x="244" y="82" text-anchor="start"><tspan x="244" dy="0">What it usually means</tspan></text><text class="sh" x="492" y="82" text-anchor="start"><tspan x="492" dy="0">A classroom example</tspan></text><rect class="cell" x="25" y="99" width="730" height="76" rx="0"/><text class="body" x="37" y="122" text-anchor="start"><tspan x="37" dy="0">Small standard</tspan><tspan x="37" dy="19">deviation</tspan></text><text class="body" x="244" y="122" text-anchor="start"><tspan x="244" dy="0">values are close to the mean;</tspan><tspan x="244" dy="19">the group is consistent</tspan></text><text class="body" x="492" y="122" text-anchor="start"><tspan x="492" dy="0">most of a class scored 11-13</tspan><tspan x="492" dy="19">on a test: one pace may suit</tspan><tspan x="492" dy="19">the whole class</tspan></text><rect class="cell" x="25" y="175" width="730" height="76" rx="0"/><text class="body" x="37" y="198" text-anchor="start"><tspan x="37" dy="0">Large standard</tspan><tspan x="37" dy="19">deviation</tspan></text><text class="body" x="244" y="198" text-anchor="start"><tspan x="244" dy="0">values are spread far from</tspan><tspan x="244" dy="19">the mean; the group is varied</tspan></text><text class="body" x="492" y="198" text-anchor="start"><tspan x="492" dy="0">marks run from 4 to 20: plan</tspan><tspan x="492" dy="19">groups or support at</tspan><tspan x="492" dy="19">different levels</tspan></text><rect class="cell" x="25" y="251" width="730" height="76" rx="0"/><text class="body" x="37" y="274" text-anchor="start"><tspan x="37" dy="0">Very small standard</tspan><tspan x="37" dy="19">deviation on a test</tspan></text><text class="body" x="244" y="274" text-anchor="start"><tspan x="244" dy="0">the test may not</tspan><tspan x="244" dy="19">separate pupils</tspan></text><text class="body" x="492" y="274" text-anchor="start"><tspan x="492" dy="0">everyone scored 18-20: the</tspan><tspan x="492" dy="19">test may have been too easy</tspan></text><rect class="cell" x="25" y="327" width="730" height="76" rx="0"/><text class="body" x="37" y="350" text-anchor="start"><tspan x="37" dy="0">Large standard deviation</tspan><tspan x="37" dy="19">on a placement test</tspan></text><text class="body" x="244" y="350" text-anchor="start"><tspan x="244" dy="0">the test separates</tspan><tspan x="244" dy="19">pupils well</tspan></text><text class="body" x="492" y="350" text-anchor="start"><tspan x="492" dy="0">a reading test used to</tspan><tspan x="492" dy="19">form reading groups</tspan></text><line class="grid" x1="232" y1="55" x2="232" y2="403"/><line class="grid" x1="480" y1="55" x2="480" y2="403"/><text class="sh" x="390" y="435" text-anchor="middle"><tspan x="390" dy="0">always report the spread with the mean</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
