<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A five-step flowchart for the variance and standard deviation of 2, 4, 4, 4, 5, 5, 7, 9</title><desc id="d">A five-step flowchart for the variance and standard deviation of 2, 4, 4, 4, 5, 5, 7, 9: the mean is 5, the deviations add to 0, the squared deviations add to 32, the variance is 32 divided by 8, which is 4, and the standard deviation is the square root of 4, which is 2 days.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .head{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} .band{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .dot{fill:var(--ink);stroke:var(--bg);stroke-width:1} .line{fill:none;stroke:var(--ink);stroke-width:2} .grid{fill:none;stroke:var(--muted);stroke-width:1;opacity:.5} .dash{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5} .arrow{fill:var(--ink)} text{font-size:14px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{font-size:11px;fill:var(--wm)} .body{font-size:14px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="560" rx="0"/><text class="h" x="30" y="30" text-anchor="start"><tspan x="30" dy="0">From deviations to standard deviation</tspan></text><text class="small" x="30" y="55" text-anchor="start"><tspan x="30" dy="0">Data: 2, 4, 4, 4, 5, 5, 7, 9</tspan></text><rect class="head" x="30" y="75" width="485" height="76" rx="7"/><text class="sh" x="46" y="96" text-anchor="start"><tspan x="46" dy="0">1. Find the mean</tspan></text><text class="body" x="46" y="139" text-anchor="start"><tspan x="46" dy="0">mean = 5</tspan></text><line class="line" x1="272" y1="151" x2="272" y2="162"/><path class="arrow" d="M267,159 L277,159 L272,166 Z"/><rect class="head" x="30" y="167" width="485" height="76" rx="7"/><text class="sh" x="46" y="188" text-anchor="start"><tspan x="46" dy="0">2. Subtract the mean from each value:</tspan><tspan x="46" dy="18">the deviations</tspan></text><text class="body" x="46" y="231" text-anchor="start"><tspan x="46" dy="0">-3, -1, -1, -1, 0, 0, 2, 4; they add to 0</tspan></text><line class="line" x1="272" y1="243" x2="272" y2="254"/><path class="arrow" d="M267,251 L277,251 L272,258 Z"/><rect class="head" x="30" y="259" width="485" height="76" rx="7"/><text class="sh" x="46" y="280" text-anchor="start"><tspan x="46" dy="0">3. Square each deviation</tspan></text><text class="body" x="46" y="323" text-anchor="start"><tspan x="46" dy="0">9, 1, 1, 1, 0, 0, 4, 16</tspan></text><line class="line" x1="272" y1="335" x2="272" y2="346"/><path class="arrow" d="M267,343 L277,343 L272,350 Z"/><rect class="head" x="30" y="351" width="485" height="76" rx="7"/><text class="sh" x="46" y="372" text-anchor="start"><tspan x="46" dy="0">4. Add the squares and divide by N:</tspan><tspan x="46" dy="18">the variance</tspan></text><text class="body" x="46" y="415" text-anchor="start"><tspan x="46" dy="0">32 / 8 = 4</tspan></text><line class="line" x1="272" y1="427" x2="272" y2="438"/><path class="arrow" d="M267,435 L277,435 L272,442 Z"/><rect class="head" x="30" y="443" width="485" height="76" rx="7"/><text class="sh" x="46" y="464" text-anchor="start"><tspan x="46" dy="0">5. Take the square root:</tspan><tspan x="46" dy="18">the standard deviation</tspan></text><text class="body" x="46" y="507" text-anchor="start"><tspan x="46" dy="0">2 days</tspan></text><line class="dash" x1="515" y1="390" x2="540" y2="390"/><rect class="panel" x="540" y="352" width="210" height="100" rx="6"/><text class="body" x="552" y="374" text-anchor="start"><tspan x="552" dy="0">for a sample used to</tspan><tspan x="552" dy="24">estimate a larger group,</tspan><tspan x="552" dy="24">divide by n - 1</tspan></text><text class="wm" x="768" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
