<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A computation table for eight pupils' days absent.</title><desc id="d">A computation table for eight pupils' days absent. The values add to 40, so the mean is 5; the deviations add to 0; the squared deviations add to 32, so the variance is 4 and the standard deviation is 2 days.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)} .cell{fill:var(--bg);stroke:var(--muted);stroke-width:1} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5} .head{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} .band{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .dot{fill:var(--ink);stroke:var(--bg);stroke-width:1} .line{fill:none;stroke:var(--ink);stroke-width:2} .grid{fill:none;stroke:var(--muted);stroke-width:1;opacity:.5} .dash{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5} .arrow{fill:var(--ink)} text{font-size:14px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{font-size:11px;fill:var(--wm)} .body{font-size:14px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="560" rx="0"/><text class="h" x="30" y="32" text-anchor="start"><tspan x="30" dy="0">Eight pupils' days absent</tspan></text><rect class="head" x="60" y="55" width="660" height="40" rx="0"/><text class="sh" x="160.0" y="80" text-anchor="middle"><tspan x="160.0" dy="0">Days absent (x)</tspan></text><text class="sh" x="375.0" y="80" text-anchor="middle"><tspan x="375.0" dy="0">Deviation (x - mean)</tspan></text><text class="sh" x="605.0" y="80" text-anchor="middle"><tspan x="605.0" dy="0">Squared deviation</tspan></text><rect class="cell" x="60" y="95" width="660" height="33" rx="0"/><text class="body" x="160.0" y="117" text-anchor="middle"><tspan x="160.0" dy="0">2</tspan></text><text class="body" x="375.0" y="117" text-anchor="middle"><tspan x="375.0" dy="0">-3</tspan></text><text class="body" x="605.0" y="117" text-anchor="middle"><tspan x="605.0" dy="0">9</tspan></text><rect class="cell" x="60" y="128" width="660" height="33" rx="0"/><text class="body" x="160.0" y="150" text-anchor="middle"><tspan x="160.0" dy="0">4</tspan></text><text class="body" x="375.0" y="150" text-anchor="middle"><tspan x="375.0" dy="0">-1</tspan></text><text class="body" x="605.0" y="150" text-anchor="middle"><tspan x="605.0" dy="0">1</tspan></text><rect class="cell" x="60" y="161" width="660" height="33" rx="0"/><text class="body" x="160.0" y="183" text-anchor="middle"><tspan x="160.0" dy="0">4</tspan></text><text class="body" x="375.0" y="183" text-anchor="middle"><tspan x="375.0" dy="0">-1</tspan></text><text class="body" x="605.0" y="183" text-anchor="middle"><tspan x="605.0" dy="0">1</tspan></text><rect class="cell" x="60" y="194" width="660" height="33" rx="0"/><text class="body" x="160.0" y="216" text-anchor="middle"><tspan x="160.0" dy="0">4</tspan></text><text class="body" x="375.0" y="216" text-anchor="middle"><tspan x="375.0" dy="0">-1</tspan></text><text class="body" x="605.0" y="216" text-anchor="middle"><tspan x="605.0" dy="0">1</tspan></text><rect class="cell" x="60" y="227" width="660" height="33" rx="0"/><text class="body" x="160.0" y="249" text-anchor="middle"><tspan x="160.0" dy="0">5</tspan></text><text class="body" x="375.0" y="249" text-anchor="middle"><tspan x="375.0" dy="0">0</tspan></text><text class="body" x="605.0" y="249" text-anchor="middle"><tspan x="605.0" dy="0">0</tspan></text><rect class="cell" x="60" y="260" width="660" height="33" rx="0"/><text class="body" x="160.0" y="282" text-anchor="middle"><tspan x="160.0" dy="0">5</tspan></text><text class="body" x="375.0" y="282" text-anchor="middle"><tspan x="375.0" dy="0">0</tspan></text><text class="body" x="605.0" y="282" text-anchor="middle"><tspan x="605.0" dy="0">0</tspan></text><rect class="cell" x="60" y="293" width="660" height="33" rx="0"/><text class="body" x="160.0" y="315" text-anchor="middle"><tspan x="160.0" dy="0">7</tspan></text><text class="body" x="375.0" y="315" text-anchor="middle"><tspan x="375.0" dy="0">2</tspan></text><text class="body" x="605.0" y="315" text-anchor="middle"><tspan x="605.0" dy="0">4</tspan></text><rect class="cell" x="60" y="326" width="660" height="33" rx="0"/><text class="body" x="160.0" y="348" text-anchor="middle"><tspan x="160.0" dy="0">9</tspan></text><text class="body" x="375.0" y="348" text-anchor="middle"><tspan x="375.0" dy="0">4</tspan></text><text class="body" x="605.0" y="348" text-anchor="middle"><tspan x="605.0" dy="0">16</tspan></text><rect class="head" x="60" y="359" width="660" height="33" rx="0"/><text class="sh" x="160.0" y="381" text-anchor="middle"><tspan x="160.0" dy="0">40</tspan></text><text class="sh" x="375.0" y="381" text-anchor="middle"><tspan x="375.0" dy="0">0</tspan></text><text class="sh" x="605.0" y="381" text-anchor="middle"><tspan x="605.0" dy="0">32</tspan></text><line class="grid" x1="260" y1="55" x2="260" y2="392"/><line class="grid" x1="490" y1="55" x2="490" y2="392"/><text class="small" x="74" y="382" text-anchor="start"><tspan x="74" dy="0">Totals</tspan></text><text class="body" x="60" y="431" text-anchor="start"><tspan x="60" dy="0">mean = 40 / 8 = 5</tspan><tspan x="60" dy="33">variance = 32 / 8 = 4</tspan><tspan x="60" dy="33">standard deviation = square root of 4 = 2 days</tspan></text><text class="wm" x="768" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
