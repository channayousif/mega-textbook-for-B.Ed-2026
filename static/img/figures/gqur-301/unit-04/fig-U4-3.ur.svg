<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک کم نمبر حسابی اوسط کو کھینچتا ہے، وسطانیہ کو نہیں</title><desc id="d">عددی لکیر پر کوئز کے 10 نمبر نقطوں سے دکھائے گئے ہیں، حسابی اوسط 14.9 اور وسطانیہ 16.5 پر نشان ہے، جس سے ظاہر ہوتا ہے کہ کم غیر معمولی قدر حسابی اوسط کو بائیں کھینچتی ہے۔</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:start} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="340"/><text class="h c" x="390" y="28">ایک کم نمبر حسابی اوسط کو کھینچتا ہے، وسطانیہ کو نہیں</text><line class="line" x1="60" y1="190" x2="720" y2="190"/><line class="line" x1="60" y1="190" x2="60" y2="198"/><text class="m c" x="60" y="214">0</text><line class="line" x1="126" y1="190" x2="126" y2="198"/><text class="m c" x="126" y="214">2</text><line class="line" x1="192" y1="190" x2="192" y2="198"/><text class="m c" x="192" y="214">4</text><line class="line" x1="258" y1="190" x2="258" y2="198"/><text class="m c" x="258" y="214">6</text><line class="line" x1="324" y1="190" x2="324" y2="198"/><text class="m c" x="324" y="214">8</text><line class="line" x1="390" y1="190" x2="390" y2="198"/><text class="m c" x="390" y="214">10</text><line class="line" x1="456" y1="190" x2="456" y2="198"/><text class="m c" x="456" y="214">12</text><line class="line" x1="522" y1="190" x2="522" y2="198"/><text class="m c" x="522" y="214">14</text><line class="line" x1="588" y1="190" x2="588" y2="198"/><text class="m c" x="588" y="214">16</text><line class="line" x1="654" y1="190" x2="654" y2="198"/><text class="m c" x="654" y="214">18</text><line class="line" x1="720" y1="190" x2="720" y2="198"/><text class="m c" x="720" y="214">20</text><circle cx="159" cy="176" r="7" fill="var(--bg)" stroke="var(--a3)" stroke-width="2"/><circle cx="456" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="522" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="555" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="588" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="621" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="621" cy="160" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="654" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="654" cy="160" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><circle cx="687" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/><line x1="551.7" y1="96" x2="551.7" y2="190" stroke="var(--a3)" stroke-width="2" stroke-dasharray="5 3"/><text class="sh" text-anchor="end" x="545.7" y="88">حسابی اوسط 14.9</text><line x1="604.5" y1="70" x2="604.5" y2="190" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="610.5" y="66">وسطانیہ 16.5</text><text class="m c" x="159" y="150">غیر معمولی قدر: 3</text><rect x="20" y="244" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text class="sh" x="744" y="264" text-anchor="end">وضاحت: کوئز کے وہی دس نمبر، مرکز کی دو پیمائشیں</text><text class="m" x="744" y="280" text-anchor="end">نمبر (20 میں سے): 3، 12، 14، 15، 16، 17، 17، 18، 18، 19۔ نو بچوں کے نمبر 12 سے 19 تک ہیں، مگر</text><text class="m" x="744" y="296" text-anchor="end">اکیلا 3 حسابی اوسط کو 14.9 تک نیچے کھینچتا ہے۔ وسطانیہ 16.5 صرف دو درمیانی نمبروں پر منحصر ہے</text><text class="m" x="744" y="312" text-anchor="end">(16 اور 17)، اس لیے جھرمٹ کے ساتھ رہتا ہے۔ ماخذ: textbook.com.pk، Lane (2023) سے ماخوذ۔</text><text class="wm" x="20" text-anchor="start" y="330" aria-hidden="true">textbook.com.pk</text></svg>
