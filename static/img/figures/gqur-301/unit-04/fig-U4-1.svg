<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How to compute the mean</title><desc id="d">A flowchart with two routes to the mean: from a list, add all the values, count them and divide (149 divided by 10 gives 14.9); from a frequency table, multiply each value by its frequency, add the products and the frequencies, and divide (64 divided by 10 gives 6.4).</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">How to compute the mean</text>
  <text class="sh c" x="200" y="56">From a list of values</text>
  <text class="sh c" x="580" y="56">From a frequency table</text>
  <rect class="b1" x="70" y="70" width="260" height="52" rx="6"/>
  <text class="sh c" x="200" y="90">1. Add all the values</text>
  <text class="m c" x="200" y="106">12 + 14 + ... + 3 = 149</text>
  <line class="line" x1="200" y1="122" x2="200" y2="148" marker-end="url(#arr)"/>
  <rect class="b1" x="70" y="150" width="260" height="52" rx="6"/>
  <text class="sh c" x="200" y="170">2. Count the values</text>
  <text class="m c" x="200" y="186">n = 10</text>
  <line class="line" x1="200" y1="202" x2="200" y2="228" marker-end="url(#arr)"/>
  <rect class="b1" x="70" y="230" width="260" height="52" rx="6"/>
  <text class="sh c" x="200" y="250">3. Divide total by count</text>
  <text class="m c" x="200" y="266">149 ÷ 10 = 14.9</text>
  <rect class="b2" x="450" y="70" width="260" height="52" rx="6"/>
  <text class="sh c" x="580" y="90">1. Multiply each value by f</text>
  <text class="m c" x="580" y="106">5×2, 6×3, 7×4, 8×1</text>
  <line class="line" x1="580" y1="122" x2="580" y2="148" marker-end="url(#arr)"/>
  <rect class="b2" x="450" y="150" width="260" height="52" rx="6"/>
  <text class="sh c" x="580" y="170">2. Add products and add f</text>
  <text class="m c" x="580" y="186">Σfx = 64, Σf = 10</text>
  <line class="line" x1="580" y1="202" x2="580" y2="228" marker-end="url(#arr)"/>
  <rect class="b2" x="450" y="230" width="260" height="52" rx="6"/>
  <text class="sh c" x="580" y="250">3. Divide Σfx by Σf</text>
  <text class="m c" x="580" y="266">64 ÷ 10 = 6.4</text>
  <line class="line" x1="200" y1="282" x2="330" y2="316" marker-end="url(#arr)"/>
  <line class="line" x1="580" y1="282" x2="450" y2="316" marker-end="url(#arr)"/>
  <rect class="b3" x="270" y="318" width="240" height="44" rx="6"/>
  <text class="sh c" x="390" y="338">mean = total ÷ count</text>
  <text class="m c" x="390" y="354">(the same idea both times)</text>
  <rect x="20" y="380" width="740" height="62" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="400">Caption: Two routes to the arithmetic mean</text>
  <text class="m" x="36" y="416">Left: the 10 quiz marks from Topic 4.1. Right: marks 5, 6, 7, 8 obtained by 2, 3, 4 and 1 pupils.</text>
  <text class="m" x="36" y="432">A frequency table only saves writing each repeated value out. Credit: textbook.com.pk after Lane (2023).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
