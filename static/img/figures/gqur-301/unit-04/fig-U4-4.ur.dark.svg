<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حل شدہ مثال: کوئز کے دس نمبروں کی حسابی اوسط اور وسطانیہ</title><desc id="d">کوئز کے 10 نمبروں سے حسابی اوسط اور وسطانیہ نکالنے کا مرحلہ وار حل شدہ جدول: مرتب قدریں، مجموعہ 149، تعداد 10، حسابی اوسط 14.9؛ پھر وسطانیہ کے مقام 5 اور 6، قدریں 16 اور 17، اور وسطانیہ 16.5۔</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:start} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h c" x="390" y="28">حل شدہ مثال: کوئز کے دس نمبروں کی حسابی اوسط اور وسطانیہ</text><rect class="b1" x="30" y="44" width="720" height="50" rx="6"/><text class="sh c" x="390" y="64">خام نمبر (20 میں سے)</text><text class="m c" x="390" y="80">12, 14, 15, 16, 17, 17, 18, 18, 19, 3</text><rect class="b1" x="30" y="104" width="720" height="50" rx="6"/><text class="sh c" x="390" y="124">مرحلہ 1: ترتیب دیں</text><text class="m c" x="390" y="140">3, 12, 14, 15, 16, 17, 17, 18, 18, 19</text><rect class="b2" x="30" y="164" width="350" height="118" rx="6"/><text class="sh c" x="575" y="184">حسابی اوسط</text><text class="m c" x="575" y="200">مجموعہ = 3 + 12 + 14 + ... + 19 = 149</text><text class="m c" x="575" y="216">تعداد n = 10</text><text class="m c" x="575" y="232">حسابی اوسط = 149 ÷ 10 = 14.9</text><text class="m c" x="575" y="248">(ہر نمبر استعمال ہوتا ہے)</text><rect class="b2" x="400" y="164" width="350" height="118" rx="6"/><text class="sh c" x="205" y="184">وسطانیہ</text><text class="m c" x="205" y="200">n = 10 جفت ہے: مقامات 5 اور 6 لیں</text><text class="m c" x="205" y="216">پانچویں قدر = 16، چھٹی قدر = 17</text><text class="m c" x="205" y="232">وسطانیہ = (16 + 17) ÷ 2 = 16.5</text><text class="m c" x="205" y="248">(صرف درمیان اہم ہے)</text><rect class="b3" x="30" y="292" width="720" height="46" rx="6"/><text class="sh c" x="390" y="312">نتیجہ: حسابی اوسط 14.9، وسطانیہ 16.5</text><text class="m c" x="390" y="328">وسطانیہ زیادہ ہے کیونکہ کم نمبر 3 حسابی اوسط کو نیچے کھینچتا ہے۔</text><rect x="20" y="352" width="740" height="62" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text class="sh" x="744" y="372" text-anchor="end">وضاحت: انہی اعداد و شمار سے حسابی اوسط اور وسطانیہ کا حل شدہ حساب</text><text class="m" x="744" y="388" text-anchor="end">پہلے ترتیب دیں: وسطانیہ کے لیے ترتیب ضروری ہے، اور اس سے غیر معمولی قدر بھی آسانی سے نظر آتی ہے۔</text><text class="m" x="744" y="404" text-anchor="end">ماخذ: textbook.com.pk، Lane (2023) سے ماخوذ۔</text><text class="wm" x="20" text-anchor="start" y="420" aria-hidden="true">textbook.com.pk</text></svg>
