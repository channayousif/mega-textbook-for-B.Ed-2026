<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The mean as the balance point</title><desc id="d">A number line from 0 to 20 with the ten quiz marks shown as dots and a fulcrum at the mean of 14.9, where the distances below and above the mean balance; the single low mark of 3 pulls the balance point left.</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">The mean is the balance point of the data</text>
  <line class="line" x1="60" y1="210" x2="720" y2="210"/>
  <line class="line" x1="60" y1="210" x2="60" y2="218"/>
  <text class="m c" x="60" y="234">0</text>
  <line class="line" x1="126" y1="210" x2="126" y2="218"/>
  <text class="m c" x="126" y="234">2</text>
  <line class="line" x1="192" y1="210" x2="192" y2="218"/>
  <text class="m c" x="192" y="234">4</text>
  <line class="line" x1="258" y1="210" x2="258" y2="218"/>
  <text class="m c" x="258" y="234">6</text>
  <line class="line" x1="324" y1="210" x2="324" y2="218"/>
  <text class="m c" x="324" y="234">8</text>
  <line class="line" x1="390" y1="210" x2="390" y2="218"/>
  <text class="m c" x="390" y="234">10</text>
  <line class="line" x1="456" y1="210" x2="456" y2="218"/>
  <text class="m c" x="456" y="234">12</text>
  <line class="line" x1="522" y1="210" x2="522" y2="218"/>
  <text class="m c" x="522" y="234">14</text>
  <line class="line" x1="588" y1="210" x2="588" y2="218"/>
  <text class="m c" x="588" y="234">16</text>
  <line class="line" x1="654" y1="210" x2="654" y2="218"/>
  <text class="m c" x="654" y="234">18</text>
  <line class="line" x1="720" y1="210" x2="720" y2="218"/>
  <text class="m c" x="720" y="234">20</text>
  <circle cx="159" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="456" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="522" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="555" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="588" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="621" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="621" cy="180" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="654" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="654" cy="180" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="687" cy="196" r="7" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
  <polygon points="551.7,212 537.7,244 565.7,244" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/>
  <text class="sh c" x="551.7" y="262">mean = 14.9</text>
  <text class="m c" x="159" y="150">one low mark (3)</text>
  <line class="line" x1="159" y1="156" x2="159" y2="184"/>
  <text class="m" x="462.6" y="110">deviations below the mean add to -15.7</text>
  <text class="m" x="462.6" y="126">deviations above the mean add to +15.7</text>
  <rect x="20" y="290" width="740" height="94" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="310">Caption: The mean balances the distances on either side</text>
  <text class="m" x="36" y="326">Quiz marks 3, 12, 14, 15, 16, 17, 17, 18, 18, 19. Measured from 14.9, the distances below and above</text>
  <text class="m" x="36" y="342">cancel exactly, so a beam resting on 14.9 would balance. One far-away mark has a long lever arm:</text>
  <text class="m" x="36" y="358">it drags the balance point towards itself, which is why the mean is sensitive to outliers.</text>
  <text class="m" x="36" y="374">Credit: textbook.com.pk after Lane (2023).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
