  <circle cx="522" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="555" cy="176" r="7" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/>
