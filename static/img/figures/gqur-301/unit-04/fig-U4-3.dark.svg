  <text class="sh" x="36" y="264">Caption: The same ten quiz marks, two measures of centre</text>
  <text class="m" x="36" y="280">Marks 3, 12, 14, 15, 16, 17, 17, 18, 18, 19 (out of 20). Nine pupils scored between 12 and 19, but the</text>
  <text class="m" x="36" y="296">single mark of 3 drags the mean down to 14.9. The median, 16.5, depends only on the middle two</text>
  <text class="m" x="36" y="312">marks (16 and 17), so it stays with the cluster. Credit: textbook.com.pk after Lane (2023).</text>
