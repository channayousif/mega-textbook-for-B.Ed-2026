<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حسابی اوسط کیسے نکالیں</title><desc id="d">حسابی اوسط تک پہنچنے کے دو راستوں کا بہاؤ خاکہ: فہرست میں تمام قدریں جمع کریں، گنیں اور تقسیم کریں (149 کو 10 پر تقسیم کرنے سے 14.9)؛ تعددی جدول میں ہر قدر کو اس کی تعدد سے ضرب دیں، حاصل ضرب اور تعدد الگ الگ جمع کریں، پھر تقسیم کریں (64 کو 10 پر تقسیم کرنے سے 6.4)۔</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:start} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h c" x="390" y="28">حسابی اوسط کیسے نکالیں</text><text class="sh c" x="580" y="56">قدروں کی فہرست سے</text><text class="sh c" x="200" y="56">تعددی جدول سے</text><rect class="b1" x="450" y="70" width="260" height="52" rx="6"/><text class="sh c" x="580" y="90">1. تمام قدریں جمع کریں</text><text class="m c" x="580" y="106">12 + 14 + ... + 3 = 149</text><line class="line" x1="580" y1="122" x2="580" y2="148" marker-end="url(#arr)"/><rect class="b1" x="450" y="150" width="260" height="52" rx="6"/><text class="sh c" x="580" y="170">2. قدریں گنیں</text><text class="m c" x="580" y="186">n = 10</text><line class="line" x1="580" y1="202" x2="580" y2="228" marker-end="url(#arr)"/><rect class="b1" x="450" y="230" width="260" height="52" rx="6"/><text class="sh c" x="580" y="250">3. مجموعہ تعداد پر تقسیم کریں</text><text class="m c" x="580" y="266">149 ÷ 10 = 14.9</text><rect class="b2" x="70" y="70" width="260" height="52" rx="6"/><text class="sh c" x="200" y="90">1. ہر قدر کو f سے ضرب دیں</text><text class="m c" x="200" y="106">5×2, 6×3, 7×4, 8×1</text><line class="line" x1="200" y1="122" x2="200" y2="148" marker-end="url(#arr)"/><rect class="b2" x="70" y="150" width="260" height="52" rx="6"/><text class="sh c" x="200" y="170">2. حاصل ضرب اور f الگ جمع کریں</text><text class="m c" x="200" y="186">Σfx = 64, Σf = 10</text><line class="line" x1="200" y1="202" x2="200" y2="228" marker-end="url(#arr)"/><rect class="b2" x="70" y="230" width="260" height="52" rx="6"/><text class="sh c" x="200" y="250">3. Σfx کو Σf پر تقسیم کریں</text><text class="m c" x="200" y="266">64 ÷ 10 = 6.4</text><line class="line" x1="580" y1="282" x2="450" y2="316" marker-end="url(#arr)"/><line class="line" x1="200" y1="282" x2="330" y2="316" marker-end="url(#arr)"/><rect class="b3" x="270" y="318" width="240" height="44" rx="6"/><text class="sh c" x="390" y="338">حسابی اوسط = مجموعہ ÷ تعداد</text><text class="m c" x="390" y="354">(دونوں بار ایک ہی تصور)</text><rect x="20" y="380" width="740" height="62" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/><text class="sh" x="744" y="400" text-anchor="end">وضاحت: حسابی اوسط تک دو راستے</text><text class="m" x="744" y="416" text-anchor="end">دائیں: موضوع 4.1 کے کوئز کے 10 نمبر۔ بائیں: 2، 3، 4 اور 1 بچوں کے نمبر بالترتیب 5، 6، 7، 8۔</text><text class="m" x="744" y="432" text-anchor="end">تعددی جدول صرف دہرائی گئی قدروں کو لکھنے کی محنت بچاتا ہے۔ ماخذ: textbook.com.pk، Lane (2023) سے ماخوذ۔</text><text class="wm" x="20" y="460" aria-hidden="true">textbook.com.pk</text></svg>
