<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شماریاتی آبادی، نمونہ، پیرامیٹر اور شماریہ</title><desc id="d">ایک تصوری نقشہ جس کی اوپر کی قطار میں شماریاتی آبادی اور پیرامیٹر، اور نیچے کی قطار میں نمونہ اور شماریہ ہیں: نمونہ شماریاتی آبادی سے لیا جاتا ہے، ہر ایک کا خلاصہ اس کے اپنے عدد سے ہوتا ہے، اور شماریہ پیرامیٹر کا اندازہ لگاتا ہے، جسے استنباط کہتے ہیں۔</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:11px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="470" /><text class="h c" x="390" y="28">شماریاتی آبادی، نمونہ، پیرامیٹر اور شماریہ</text><rect class="b2" x="490" y="60" width="230" height="62" rx="6" /><text class="sh c" x="605" y="80">شماریاتی آبادی</text><text class="m c" x="605" y="96">ضلع کے تمام 347 اسکول</text><rect class="b2" x="60" y="60" width="230" height="62" rx="6" /><text class="sh c" x="175" y="80">پیرامیٹر</text><text class="m c" x="175" y="96">جماعت کا حقیقی اوسط حجم (نامعلوم)</text><rect class="b3" x="490" y="220" width="230" height="62" rx="6" /><text class="sh c" x="605" y="240">نمونہ</text><text class="m c" x="605" y="256">وہ 30 اسکول جہاں دورہ ہوا</text><rect class="b3" x="60" y="220" width="230" height="62" rx="6" /><text class="sh c" x="175" y="240">شماریہ</text><text class="m c" x="175" y="256">ان 30 میں جماعت کا اوسط حجم</text><line class="line" x1="490" y1="91" x2="292" y2="91" marker-end="url(#arr)" /><text class="m c" x="391" y="82">کا عددی خلاصہ</text><line class="line" x1="490" y1="251" x2="292" y2="251" marker-end="url(#arr)" /><text class="m c" x="391" y="242">کا عددی خلاصہ</text><line class="line" x1="605" y1="218" x2="605" y2="124" marker-end="url(#arr)" /><text class="m" x="670" y="176" text-anchor="end">سے لیا گیا</text><line x1="175" y1="218" x2="175" y2="126" stroke="var(--a3)" stroke-width="3" marker-end="url(#arr)" /><text class="sh" x="165" y="168" text-anchor="end">اندازہ لگاتا ہے</text><text class="m" x="165" y="184" text-anchor="end">(استنباط)</text><rect x="20" y="312" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1" /><text class="sh" x="744" y="332" text-anchor="end">وضاحت: دو سطحیں، دو قسم کے عدد</text><text class="m" x="744" y="348" text-anchor="end">اوپری قطار وہ ہے جسے ہم جاننا چاہتے ہیں؛ نچلی وہ جسے واقعی ناپ سکتے ہیں۔ نمونے سے شماریہ نکالتے ہیں</text><text class="m" x="744" y="364" text-anchor="end">اور اس سے شماریاتی آبادی کے نامعلوم پیرامیٹر کا اندازہ لگاتے ہیں۔ نمونے سے شماریاتی آبادی تک</text><text class="m" x="744" y="380" text-anchor="end">یہ قدم استنباط کہلاتا ہے۔ ماخذ: textbook.com.pk، Lane (2023) کی بنیاد پر۔</text><text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text></svg>
