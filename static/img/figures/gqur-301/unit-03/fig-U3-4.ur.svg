<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">نمونہ گیری کے طریقے کا انتخاب</title><desc id="d">نمونہ گیری کا طریقہ منتخب کرنے کا بہاؤ خاکہ: تحقیقی سوال سے آغاز کریں، پھر طے کریں کہ نمونہ گیری فریم موجود ہے، تصادفی انتخاب عملی طور پر ممکن ہے، اور شماریاتی آبادی میں الگ ذیلی گروہ ہیں یا نہیں۔</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:11px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="470" /><text class="h c" x="390" y="28">نمونہ گیری کا طریقہ چننا: تین سوال</text><rect class="b1" x="290" y="44" width="200" height="36" rx="6" /><text class="sh c" x="390" y="64">تحقیقی سوال</text><line class="line" x1="390" y1="80" x2="390" y2="96" marker-end="url(#arr)" /><rect class="b2" x="260" y="98" width="260" height="44" rx="6" /><text class="sh c" x="390" y="118">1. کیا نمونہ گیری فریم موجود ہے؟</text><text class="m c" x="390" y="134">(شماریاتی آبادی کی مکمل فہرست)</text><line class="line" x1="520" y1="120" x2="566" y2="120" marker-end="url(#arr)" /><text class="m c" x="543" y="112">نہیں</text><rect class="b3" x="568" y="98" width="182" height="44" rx="6" /><text class="sh c" x="659" y="118">غیر تصادفی:</text><text class="m c" x="659" y="134">سہولتی یا مقصدی</text><line class="line" x1="390" y1="142" x2="390" y2="162" marker-end="url(#arr)" /><text class="m" x="378" y="156" text-anchor="end">ہاں</text><rect class="b2" x="260" y="164" width="260" height="44" rx="6" /><text class="sh c" x="390" y="184">2. کیا تصادفی انتخاب عملی طور پر ممکن ہے؟</text><text class="m c" x="390" y="200">(سفر، وقت، لاگت)</text><line class="line" x1="520" y1="186" x2="566" y2="186" marker-end="url(#arr)" /><text class="m c" x="543" y="178">نہیں</text><rect class="b3" x="568" y="164" width="182" height="44" rx="6" /><text class="sh c" x="659" y="184">غیر تصادفی:</text><text class="m c" x="659" y="200">کوٹہ یا مقصدی</text><line class="line" x1="390" y1="208" x2="390" y2="228" marker-end="url(#arr)" /><text class="m" x="378" y="222" text-anchor="end">ہاں</text><rect class="b2" x="260" y="230" width="260" height="44" rx="6" /><text class="sh c" x="390" y="250">3. کیا الگ ذیلی گروہ اہم ہیں؟</text><text class="m c" x="390" y="266">(مثلاً شہری اور دیہی اسکول)</text><line class="line" x1="260" y1="252" x2="214" y2="252" marker-end="url(#arr)" /><text class="m c" x="237" y="244">ہاں</text><rect class="b1" x="30" y="230" width="182" height="44" rx="6" /><text class="sh c" x="121" y="250">طبقاتی تصادفی</text><text class="m c" x="121" y="266">ہر ذیلی گروہ سے نمونہ</text><line class="line" x1="390" y1="274" x2="390" y2="294" marker-end="url(#arr)" /><text class="m" x="378" y="288" text-anchor="end">نہیں</text><rect class="b1" x="260" y="296" width="260" height="44" rx="6" /><text class="sh c" x="390" y="316">سادہ تصادفی یا منظم</text><text class="m c" x="390" y="332">ہر رکن کے انتخاب کا معلوم امکان</text><rect x="20" y="356" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1" /><text class="sh" x="744" y="376" text-anchor="end">وضاحت: تین سوالوں کے جواب طریقے کی طرف رہنمائی کرتے ہیں</text><text class="m" x="744" y="392" text-anchor="end">تصادفی طریقوں کے لیے مکمل فہرست اور عملی امکان ضروری ہیں؛ ایسا نہ ہو تو غیر تصادفی طریقہ</text><text class="m" x="744" y="408" text-anchor="end">استعمال ہوتا ہے اور نتائج پوری شماریاتی آبادی پر لاگو نہیں ہوتے۔ اگر سوال صرف ایک ذیلی گروہ کا ہو</text><text class="m" x="744" y="424" text-anchor="end">تو مقصدی نمونہ گیری درست ہے۔ ماخذ: textbook.com.pk، Lane (2023) کی بنیاد پر۔</text><text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text></svg>
