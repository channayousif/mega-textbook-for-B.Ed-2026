<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شماریاتی آبادی اور نمونے کا خاکہ</title><desc id="d">ایک خاکہ جس میں بڑے دائرے پر ’شماریاتی آبادی: تمام 347 اسکول‘ اور اس کے اندر چھوٹے دائرے پر ’نمونہ: 30 منتخب اسکول‘ لکھا ہے، اور نمونے سے شماریاتی آبادی کی طرف جانے والے تیر پر ’استنباط‘ لکھا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:11px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2} line.arrow{stroke:var(--line);stroke-width:2;fill:none} circle.pop{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} circle.samp{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780" /><rect class="bg" x="0" y="0" width="780" height="470" /><circle cx="420" cy="220" r="140" class="pop" /><text class="h c" x="420" y="120">شماریاتی آبادی</text><text class="sh c" x="420" y="140">تمام 347 اسکول</text><text class="m c" x="420" y="158">ضلع میں</text><circle cx="420" cy="260" r="50" class="samp" /><text class="sh c" x="420" y="255">نمونہ</text><text class="m c" x="420" y="272">30 اسکول</text><line class="arrow" x1="260" y1="220" x2="130" y2="170" marker-end="url(#arrow-blue)" /><text class="sh c" x="190" y="155">استنباط</text><text class="m c" x="190" y="172">نمونے سے</text><text class="m c" x="190" y="185">شماریاتی آبادی تک</text><rect x="30" y="200" width="170" height="70" rx="6" class="panel" stroke="var(--line)" stroke-width="1" /><text class="sh c" x="115" y="225">شماریاتی آبادی</text><text class="sh c" x="115" y="242">کا اندازہ</text><text class="m c" x="115" y="260">(شماریے سے)</text><rect x="30" y="380" width="720" height="70" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1" /><text class="sh" x="730" y="392" text-anchor="end">وضاحت: 347 اسکولوں کی شماریاتی آبادی سے 30 اسکولوں کا نمونہ</text><text class="m" x="730" y="408" text-anchor="end">نمونے سے نکالا گیا شماریہ، شماریاتی آبادی کے پیرامیٹر کا اندازہ لگانے کے لیے استعمال ہوتا ہے۔</text><text class="m" x="730" y="424" text-anchor="end">ماخذ: textbook.com.pk۔</text><text class="wm" x="760" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text><defs><marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)" /></marker></defs></svg>
