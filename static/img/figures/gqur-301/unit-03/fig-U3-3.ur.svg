<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">نمونہ گیری کے طریقوں کا موازنہ</title><desc id="d">ایک جدول جس میں تصادفی نمونہ گیری (سادہ تصادفی، منظم، طبقاتی) اور غیر تصادفی طریقوں (سہولتی، مقصدی، کوٹہ) کا وضاحتوں اور اسکول کی مثالوں کے ساتھ موازنہ ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:11px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2} line.bd{fill:none;stroke:var(--line);stroke-width:1} rect.hb{fill:var(--a2-fill);stroke:var(--line);stroke-width:1} rect.row1{fill:var(--a1-fill)} rect.row2{fill:var(--bg)}</style><rect class="bg" x="0" y="0" width="780" /><rect class="bg" x="0" y="0" width="780" height="470" /><text class="h" x="750" y="28" text-anchor="end">تصادفی اور غیر تصادفی نمونہ گیری کا موازنہ</text><rect class="hb" x="20" y="40" width="740" height="28" rx="4" /><line class="bd" x1="600" y1="40" x2="600" y2="68" /><line class="bd" x1="430" y1="40" x2="430" y2="68" /><line class="bd" x1="260" y1="40" x2="260" y2="68" /><text class="h c" x="680" y="59">طریقہ</text><text class="h c" x="515" y="59">کیسے کام کرتا ہے</text><text class="h c" x="345" y="59">کب استعمال کریں</text><text class="h c" x="150" y="59">اسکول کی مثال</text><rect class="row1" x="20" y="68" width="740" height="40" /><line class="bd" x1="600" y1="68" x2="600" y2="108" /><line class="bd" x1="430" y1="68" x2="430" y2="108" /><line class="bd" x1="260" y1="68" x2="260" y2="108" /><text class="sh c" x="680" y="90">سادہ تصادفی</text><text class="m c" x="515" y="85">ہر رکن کا برابر</text><text class="m c" x="515" y="98">امکان</text><text class="m c" x="345" y="85">مکمل فہرست ہو،</text><text class="m c" x="345" y="98">ذیلی گروہ اہم نہ ہوں</text><text class="m c" x="150" y="85">ٹوپی سے</text><text class="m c" x="150" y="98">نام نکالنا</text><rect class="row2" x="20" y="108" width="740" height="40" /><line class="bd" x1="600" y1="108" x2="600" y2="148" /><line class="bd" x1="430" y1="108" x2="430" y2="148" /><line class="bd" x1="260" y1="108" x2="260" y2="148" /><text class="sh c" x="680" y="130">منظم</text><text class="m c" x="515" y="125">فہرست کا ہر</text><text class="m c" x="515" y="138">k واں رکن</text><text class="m c" x="345" y="125">فہرست ہو،</text><text class="m c" x="345" y="138">جلدی ہو سکتا ہو</text><text class="m c" x="150" y="125">رجسٹر کا ہر</text><text class="m c" x="150" y="138">5 واں طالب علم</text><rect class="row1" x="20" y="148" width="740" height="40" /><line class="bd" x1="600" y1="148" x2="600" y2="188" /><line class="bd" x1="430" y1="148" x2="430" y2="188" /><line class="bd" x1="260" y1="148" x2="260" y2="188" /><text class="sh c" x="680" y="170">طبقاتی</text><text class="m c" x="515" y="165">طبقات میں بانٹیں،</text><text class="m c" x="515" y="178">ہر ایک سے نمونہ لیں</text><text class="m c" x="345" y="165">اہم الگ</text><text class="m c" x="345" y="178">ذیلی گروہ ہوں</text><text class="m c" x="150" y="165">ہر جماعت سے</text><text class="m c" x="150" y="178">الگ نمونہ</text><rect class="row2" x="20" y="188" width="740" height="40" /><line class="bd" x1="600" y1="188" x2="600" y2="228" /><line class="bd" x1="430" y1="188" x2="430" y2="228" /><line class="bd" x1="260" y1="188" x2="260" y2="228" /><text class="sh c" x="680" y="210">سہولتی</text><text class="m c" x="515" y="205">جن تک پہنچنا</text><text class="m c" x="515" y="218">سب سے آسان ہو</text><text class="m c" x="345" y="205">صرف ابتدائی</text><text class="m c" x="345" y="218">کھوج کے لیے</text><text class="m c" x="150" y="205">صحن میں</text><text class="m c" x="150" y="218">موجود طلبہ</text><rect class="row1" x="20" y="228" width="740" height="40" /><line class="bd" x1="600" y1="228" x2="600" y2="268" /><line class="bd" x1="430" y1="228" x2="430" y2="268" /><line class="bd" x1="260" y1="228" x2="260" y2="268" /><text class="sh c" x="680" y="250">مقصدی</text><text class="m c" x="515" y="245">مخصوص معیار</text><text class="m c" x="515" y="258">سے انتخاب</text><text class="m c" x="345" y="245">مخصوص ذیلی</text><text class="m c" x="345" y="258">گروہ کا مطالعہ</text><text class="m c" x="150" y="245">صرف سب سے زیادہ</text><text class="m c" x="150" y="258">غیر حاضر طلبہ</text><rect x="20" y="320" width="740" height="120" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1" /><text class="sh" x="740" y="345" text-anchor="end">وضاحت: تصادفی اور غیر تصادفی نمونہ گیری کے طریقے</text><text class="m" x="740" y="370" text-anchor="end">تصادفی نمونہ گیری (اوپر کی 3 قطاریں) ہر رکن کو انتخاب کا معلوم امکان دیتی ہے اور نتائج پوری</text><text class="m" x="740" y="385" text-anchor="end">شماریاتی آبادی پر لاگو کرنے کی تائید کرتی ہے۔ غیر تصادفی طریقے (نچلی قطاریں) آسان ہیں،</text><text class="m" x="740" y="400" text-anchor="end">لیکن نمائندگی کو عددی طور پر بیان کرنے کی تائید نہیں کرتے۔</text><text class="m" x="740" y="425" text-anchor="end">ماخذ: textbook.com.pk، Lane (2023) کی بنیاد پر۔</text><text class="wm" x="760" y="455" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
