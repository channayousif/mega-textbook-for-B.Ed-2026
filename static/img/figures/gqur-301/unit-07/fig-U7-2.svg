<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four school counting questions showing the method, the working and the count: listing gives 4 uniforms, the addition rule gives 5 Annual Day events and 11 library books, and the addition rule with the overlap removed gives 17 club members.</title><desc id="d">Table of four school counting questions showing the method, the working and the count: listing gives 4 uniforms, the addition rule gives 5 Annual Day events and 11 library books, and the addition rule with the overlap removed gives 17 club members.</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.card{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.dashed{stroke-dasharray:6 4}
.header{fill:var(--a1-fill)}
.grid{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.25}
.line{fill:none;stroke:var(--ink);stroke-width:1.5}
.ah{fill:var(--ink)}
.white{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.blue{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}
.grey{fill:var(--muted);stroke:var(--ink);stroke-width:1.5}
.navy{fill:var(--a2);stroke:var(--ink);stroke-width:1.5}
text{font-size:14px;fill:var(--ink)}
.h{font-size:18px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:700;fill:var(--ink)}
.small{font-size:13px;fill:var(--ink)}
.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Choosing a counting method</tspan></text><rect class="card" x="20" y="55" width="740" height="348" rx="0"/><rect class="header" x="20" y="55" width="740" height="44" rx="0"/><path class="grid" d="M323,55 V403"/><path class="grid" d="M522,55 V403"/><path class="grid" d="M687,55 V403"/><text class="sh" x="30" y="82" text-anchor="start"><tspan x="30" dy="0">School question</tspan></text><text class="sh" x="333" y="82" text-anchor="start"><tspan x="333" dy="0">Method</tspan></text><text class="sh" x="532" y="82" text-anchor="start"><tspan x="532" dy="0">Working</tspan></text><text class="sh" x="697" y="82" text-anchor="start"><tspan x="697" dy="0">Count</tspan></text><path class="grid" d="M20,99 H760"/><text x="30" y="133.0" text-anchor="start"><tspan x="30" dy="0">Uniforms from 2 shirts</tspan><tspan x="30" dy="19">and 2 trousers</tspan></text><text x="333" y="133.0" text-anchor="start"><tspan x="333" dy="0">Systematic</tspan><tspan x="333" dy="19">listing</tspan></text><text x="532" y="142.0" text-anchor="start"><tspan x="532" dy="0">WG WN BG BN</tspan></text><text x="697" y="142.0" text-anchor="start"><tspan x="697" dy="0">4</tspan></text><path class="grid" d="M20,175 H760"/><text x="30" y="209.0" text-anchor="start"><tspan x="30" dy="0">Annual Day: 3 sports</tspan><tspan x="30" dy="19">or 2 stage events</tspan></text><text x="333" y="218.0" text-anchor="start"><tspan x="333" dy="0">Addition rule</tspan></text><text x="532" y="218.0" text-anchor="start"><tspan x="532" dy="0">3 + 2</tspan></text><text x="697" y="218.0" text-anchor="start"><tspan x="697" dy="0">5</tspan></text><path class="grid" d="M20,251 H760"/><text x="30" y="285.0" text-anchor="start"><tspan x="30" dy="0">One library book: 7 story</tspan><tspan x="30" dy="19">books or 4 science books</tspan></text><text x="333" y="294.0" text-anchor="start"><tspan x="333" dy="0">Addition rule</tspan></text><text x="532" y="294.0" text-anchor="start"><tspan x="532" dy="0">7 + 4</tspan></text><text x="697" y="294.0" text-anchor="start"><tspan x="697" dy="0">11</tspan></text><path class="grid" d="M20,327 H760"/><text x="30" y="361.0" text-anchor="start"><tspan x="30" dy="0">Cricket club: 12; science: 8</tspan><tspan x="30" dy="19">3 pupils are in both</tspan></text><text x="333" y="361.0" text-anchor="start"><tspan x="333" dy="0">Addition rule,</tspan><tspan x="333" dy="19">overlap removed</tspan></text><text x="532" y="370.0" text-anchor="start"><tspan x="532" dy="0">12 + 8 - 3</tspan></text><text x="697" y="370.0" text-anchor="start"><tspan x="697" dy="0">17</tspan></text><path class="grid" d="M20,403 H760"/><text class="small" x="24" y="430" text-anchor="start"><tspan x="24" dy="0">W = white shirt; B = sky blue shirt; G = grey trousers; N = navy trousers.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
