<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ضرب کے اصول سے حل کیے گئے اسکول کے پانچ شمارشی مسائل کا جدول، جس میں مراحل اور ہر مرحلے پر طریقے دکھائے گئے ہیں: 6 ٹائم ٹیبل، 12 وردیاں، 12 کھانے، 400 شناختی کوڈ اور 6 بیٹھنے کی ترتیبیں۔</title><desc id="d">ضرب کے اصول سے حل کیے گئے اسکول کے پانچ شمارشی مسائل کا جدول، جس میں مراحل اور ہر مرحلے پر طریقے دکھائے گئے ہیں: 6 ٹائم ٹیبل، 12 وردیاں، 12 کھانے، 400 شناختی کوڈ اور 6 بیٹھنے کی ترتیبیں۔</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.card{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.dashed{stroke-dasharray:6 4}
.header{fill:var(--a1-fill)}
.grid{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.25}
.line{fill:none;stroke:var(--ink);stroke-width:1.5}
.ah{fill:var(--ink)}
.white{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.blue{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}
.grey{fill:var(--muted);stroke:var(--ink);stroke-width:1.5}
.navy{fill:var(--a2);stroke:var(--ink);stroke-width:1.5}
text{font-size:12px;fill:var(--ink)}
.h{font-size:17px;font-weight:700;fill:var(--ink)}
.sh{font-size:12px;font-weight:700;fill:var(--ink)}
.small{font-size:12px;fill:var(--ink)}
.wm{fill:var(--wm);font-size:11px}
