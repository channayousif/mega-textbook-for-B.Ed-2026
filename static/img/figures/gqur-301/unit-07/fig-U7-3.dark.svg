x="553" y="429" text-anchor="start"><tspan x="553" dy="0">9 Roti, Chicken, Water</tspan></text><rect class="panel" x="450" y="449" width="80" height="28" rx="5"/><text class="small" x="490.0" y="468" text-anchor="middle"><tspan x="490.0" dy="0">Lassi</tspan></text><text class="small" x="553" y="468" text-anchor="start"><tspan x="553" dy="0">10 Roti, Chicken, Lassi</tspan></text><rect class="panel" x="290" y="507.5" width="95" height="28" rx="5"/><text class="small" x="337.5" y="526.5" text-anchor="middle"><tspan x="337.5" dy="0">Sabzi</tspan></text><rect class="panel" x="450" y="488" width="80" height="28" rx="5"/><text class="small" x="490.0" y="507" text-anchor="middle"><tspan x="490.0" dy="0">Water</tspan></text><text class="small" x="553" y="507" text-anchor="start"><tspan x="553" dy="0">11 Roti, Sabzi, Water</tspan></text><rect class="panel" x="450" y="527" width="80" height="28" rx="5"/><text class="small" x="490.0" y="546" text-anchor="middle"><tspan x="490.0" dy="0">Lassi</tspan></text><text class="small" x="553" y="546" text-anchor="start"><tspan x="553" dy="0">12 Roti, Sabzi, Lassi</tspan></text><rect class="header" x="20" y="586" width="740" height="40" rx="6"/><text class="h" x="390" y="612" text-anchor="middle"><tspan x="390" dy="0">2 x 3 x 2 = 12 paths = 12 meals</tspan></text><text class="wm" x="768" y="640" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
