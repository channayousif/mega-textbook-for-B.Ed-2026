-end="url(#arrow)"/><path class="line" d="M385,521.5 L450,502" marker-end="url(#arrow)"/><path class="line" d="M385,521.5 L450,541" marker-end="url(#arrow)"/><rect class="panel" x="14" y="312.5" width="74" height="28" rx="5"/><text class="small" x="51.0" y="331.5" text-anchor="middle"><tspan x="51.0" dy="0">Lunch</tspan></text><rect class="panel" x="130" y="195.5" width="90" height="28" rx="5"/><text class="small" x="175.0" y="214.5" text-anchor="middle"><tspan x="175.0" dy="0">Rice</tspan></text><rect class="panel" x="290" y="117.5" width="95" height="28" rx="5"/><text class="small" x="337.5" y="136.5" text-anchor="middle"><tspan x="337.5" dy="0">Daal</tspan></text><rect class="panel" x="450" y="98" width="80" height="28" rx="5"/><text class="small" x="490.0" y="117" text-anchor="middle"><tspan x="490.0" dy="0">Water</tspan></text><text class="small" x="553" y="117" text-anchor="start"><tspan x="553" dy="0">1 Rice, Daal, Water</tspan></text><rect class="panel" x="450" y="137" width="80" height="28" rx="5"/><text class="small" x="490.0" y="156" text-anchor="middle"><tspan x="490.0" dy="0">Lassi</tspan></text><text class="small" x="553" y="156" text-anchor="start"><tspan x="553" dy="0">2 Rice, Daal, Lassi</tspan></text><rect class="panel" x="290" y="195.5" width="95" height="28" rx="5"/><text class="small" x="337.5" y="214.5" text-anchor="middle"><tspan x="337.5" dy="0">Chicken</tspan></text><rect class="panel" x="450" y="176" width="80" height="28" rx="5"/><text class="small" x="490.0" y="195" text-anchor="middle"><tspan x="490.0" dy="0">Water</tspan></text><text class="small" x="553" y="195" text-anchor="start"><tspan x="553" dy="0">3 Rice, Chicken, Water</tspan></text><rect class="panel" x="450" y="215" width="80" height="28" rx="5"/><text class="small" x="490.0" y="234" text-anchor="middle"><tspan x="490.0" dy="0">Lassi</tspan></text><text class="small" x="553" y="234" text-anchor="start"><tspan x="553" dy="0">4 Rice, Chicken, Lassi</tspan></text><rect class="pan