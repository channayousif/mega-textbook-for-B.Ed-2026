<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دو قمیص کے رنگوں اور دو پتلون کے رنگوں سے بنی اسکول وردیوں کی دو فہرستیں۔ بے ترتیب فہرست سفید سلیٹی کے ساتھ دہراتی ہے اور آسمانی نیلی سلیٹی کے ساتھ چھوڑ دیتی ہے۔ منظم فہرست قمیص مقرر رکھ کر پتلون بدلتی ہے، جس سے چاروں وردیاں ایک ایک بار ملتی ہیں۔</title><desc id="d">دو قمیص کے رنگوں اور دو پتلون کے رنگوں سے بنی اسکول وردیوں کی دو فہرستیں۔ بے ترتیب فہرست سفید سلیٹی کے ساتھ دہراتی ہے اور آسمانی نیلی سلیٹی کے ساتھ چھوڑ دیتی ہے۔ منظم فہرست قمیص مقرر رکھ کر پتلون بدلتی ہے، جس سے چاروں وردیاں ایک ایک بار ملتی ہیں۔</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.card{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.dashed{stroke-dasharray:6 4}
.header{fill:var(--a1-fill)}
.grid{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.25}
.line{fill:none;stroke:var(--ink);stroke-width:1.5}
.ah{fill:var(--ink)}
.white{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.blue{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}
.grey{fill:var(--muted);stroke:var(--ink);stroke-width:1.5}
.navy{fill:var(--a2);stroke:var(--ink);stroke-width:1.5}
text{font-size:12px;fill:var(--ink)}
.h{font-size:17px;font-weight:700;fill:var(--ink)}
.sh{font-size:12px;font-weight:700;fill:var(--ink)}
.small{font-size:12px;fill:var(--ink)}
.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="756" y="30" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">وردیوں کی فہرست کے دو طریقے</tspan></text><rect class="panel" x="400" y="48" width="360" height="386" rx="10"/><text class="h" x="742" y="76" text-anchor="end"><tspan x="742" dy="0" text-anchor="end">بے ترتیب فہرست</tspan></text><rect class="panel" x="20" y="48" width="360" height="386" rx="10"/><text class="h" x="362" y="76" text-anchor="end"><tspan x="362" dy="0" text-anchor="end">منظم فہرست</tspan></text><rect class="card" x="590" y="94" width="154" height="133" rx="6"/><path class="white" d="M713 109 l14 10 -8 13 -10 -6 v28 h-40 v-28 l-10 6 -8 -13 14 -10 10 7 h14 z"/><path class="grey" d="M641 110 h-30 l-4 44 h13 l6 -26 6 26 h13 z"/><text class="small" x="734" y="174" text-anchor="end"><tspan x="734" dy="0" text-anchor="end">سفید قمیص</tspan><tspan x="734" dy="19" text-anchor="end">سلیٹی پتلون</tspan></text><path class="line" d="M616 209 l-5 5 -10 -12"/><rect class="card" x="416" y="94" width="154" height="133" rx="6"/><path class="blue" d="M539 109 l14 10 -8 13 -10 -6 v28 h-40 v-28 l-10 6 -8 -13 14 -10 10 7 h14 z"/><path class="navy" d="M467 110 h-30 l-4 44 h13 l6 -26 6 26 h13 z"/><text class="small" x="560" y="174" text-anchor="end"><tspan x="560" dy="0" text-anchor="end">آسمانی نیلی قمیص</tspan><tspan x="560" dy="19" text-anchor="end">نیوی پتلون</tspan></text><path class="line" d="M442 209 l-5 5 -10 -12"/><rect class="card" x="590" y="241" width="154" height="133" rx="6"/><path class="white" d="M713 256 l14 10 -8 13 -10 -6 v28 h-40 v-28 l-10 6 -8 -13 14 -10 10 7 h14 z"/><path class="navy" d="M641 257 h-30 l-4 44 h13 l6 -26 6 26 h13 z"/><text class="small" x="734" y="321" text-anchor="end"><tspan x="734" dy="0" text-anchor="end">سفید قمیص</tspan><tspan x="734" dy="19" text-anchor="end">نیوی پتلون</tspan></text><path class="line" d="M616 356 l-5 5 -10 -12"/><rect class="card dashed" x="416" y="241" width=