<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے چار شمارشی سوالات کا جدول جس میں طریقہ، عمل اور شمار دکھایا گیا ہے: فہرست سازی سے 4 وردیاں ملتی ہیں، جمع کے اصول سے 5 سالانہ دن کے مقابلے اور 11 لائبریری کتابیں، اور مشترک حصے ہٹا کر جمع کے اصول سے 17 کلب ممبران۔</title><desc id="d">اسکول کے چار شمارشی سوالات کا جدول جس میں طریقہ، عمل اور شمار دکھایا گیا ہے: فہرست سازی سے 4 وردیاں ملتی ہیں، جمع کے اصول سے 5 سالانہ دن کے مقابلے اور 11 لائبریری کتابیں، اور مشترک حصے ہٹا کر جمع کے اصول سے 17 کلب ممبران۔</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.card{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.dashed{stroke-dasharray:6 4}
.header{fill:var(--a1-fill)}
.grid{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.25}
.line{fill:none;stroke:var(--ink);stroke-width:1.5}
.ah{fill:var(--ink)}
.white{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.blue{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}
.grey{fill:var(--muted);stroke:var(--ink);stroke-width:1.5}
.navy{fill:var(--a2);stroke:var(--ink);stroke-width:1.5}
text{font-size:12px;fill:var(--ink)}
.h{font-size:17px;font-weight:700;fill:var(--ink)}
.sh{font-size:12px;font-weight:700;fill:var(--ink)}
.small{font-size:12px;fill:var(--ink)}
.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">گنتی کے طریقے کا انتخاب</tspan></text><rect class="card" x="20" y="55" width="740" height="348" rx="0"/><rect class="header" x="20" y="55" width="740" height="44" rx="0"/><path class="grid" d="M457 55 V403"/><path class="grid" d="M258 55 V403"/><path class="grid" d="M93 55 V403"/><text class="sh" x="750" y="82" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">اسکول کا سوال</tspan></text><text class="sh" x="447" y="82" text-anchor="end"><tspan x="447" dy="0" text-anchor="end">طریقہ</tspan></text><text class="sh" x="248" y="82" text-anchor="end"><tspan x="248" dy="0" text-anchor="end">حساب</tspan></text><text class="sh" x="83" y="82" text-anchor="end"><tspan x="83" dy="0" text-anchor="end">شمار</tspan></text><path class="grid" d="M760 99 H20"/><text x="750" y="133.0" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">2 قمیصوں اور</tspan><tspan x="750" dy="19" text-anchor="end">2 پتلونوں سے وردیاں</tspan></text><text x="447" y="133.0" text-anchor="end"><tspan x="447" dy="0" text-anchor="end">منظم</tspan><tspan x="447" dy="19" text-anchor="end">فہرست سازی</tspan></text><text x="248" y="142.0" text-anchor="end"><tspan x="248" dy="0" text-anchor="end">WG WN BG BN</tspan></text><text x="83" y="142.0" text-anchor="end"><tspan x="83" dy="0" text-anchor="end">4</tspan></text><path class="grid" d="M760 175 H20"/><text x="750" y="209.0" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">سالانہ دن: 3 کھیل</tspan><tspan x="750" dy="19" text-anchor="end">یا 2 اسٹیج مقابلے</tspan></text><text x="447" y="218.0" text-anchor="end"><tspan x="447" dy="0" text-anchor="end">جمع کا اصول</tspan></text><text x="248" y="218.0" text-anchor="end"><tspan x="248" dy="0" text-anchor="end">3 + 2</tspan></text><text x="83" y="218.0" text-anchor="end"><tspan x="83" dy="0" text-anchor="end">5</tspan></text><path class="grid" d="M760 251 H20"/><text x="750" y="285.0" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">ایک کتاب: 7 کہانی کی</tspan><tspan x="750" dy="19" text-anchor="end">یا 4 سائنس کی کتابیں</tspan></text><text x="447" y="294.0" text-anchor="end"><tspan x="447" dy="0" text-anchor="end">جمع کا اصول</tspan></text><text x="248" y="294.0" text-anchor="end"><tspan x="248" dy="0" text-anchor="end">7 + 4</tspan></text><text x="83" y="294.0" text-anchor="end"><tspan x="83" dy="0" text-anchor="end">11</tspan></text><path class="grid" d="M760 327 H20"/><text x="750" y="361.0" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">کرکٹ کلب: 12؛ سائنس: 8</tspan><tspan x="750" dy="19" text-anchor="end">3 طلبہ دونوں میں ہیں</tspan></text><text x="447" y="361.0" text-anchor="end"><tspan x="447" dy="0" text-anchor="end">جمع کا اصول،</tspan><tspan x="447" dy="19" text-anchor="end">مشترک حصہ منہا</tspan></text><text x="248" y="370.0" text-anchor="end"><tspan x="248" dy="0" text-anchor="end">12 + 8 - 3</tspan></text><text x="83" y="370.0" text-anchor="end"><tspan x="83" dy="0" text-anchor="end">17</tspan></text><path class="grid" d="M760 403 H20"/><text class="small" x="756" y="430" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">W = سفید قمیص؛ B = آسمانی نیلی قمیص؛ G = سلیٹی پتلون؛ N = نیوی پتلون۔</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
