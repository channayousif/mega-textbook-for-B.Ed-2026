<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Two lists of school uniforms made from two shirt colours and two trouser colours.</title><desc id="d">Two lists of school uniforms made from two shirt colours and two trouser colours. The haphazard list repeats white with grey and misses sky blue with grey. The systematic list fixes the shirt and changes the trousers, giving all four uniforms once each.</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.card{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.dashed{stroke-dasharray:6 4}
.header{fill:var(--a1-fill)}
.grid{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.25}
.line{fill:none;stroke:var(--ink);stroke-width:1.5}
.ah{fill:var(--ink)}
.white{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.blue{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}
.grey{fill:var(--muted);stroke:var(--ink);stroke-width:1.5}
.navy{fill:var(--a2);stroke:var(--ink);stroke-width:1.5}
text{font-size:14px;fill:var(--ink)}
.h{font-size:18px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:700;fill:var(--ink)}
.small{font-size:13px;fill:var(--ink)}
.wm{fill:var(--wm);font-size:11px}
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="24" y="30" text-anchor="start"><tspan x="24" dy="0">Two ways to list uniforms</tspan></text><rect class="panel" x="20" y="48" width="360" height="386" rx="10"/><text class="h" x="38" y="76" text-anchor="start"><tspan x="38" dy="0">Haphazard list</tspan></text><rect class="panel" x="400" y="48" width="360" height="386" rx="10"/><text class="h" x="418" y="76" text-anchor="start"><tspan x="418" dy="0">Systematic list</tspan></text><rect class="card" x="36" y="94" width="154" height="133" rx="6"/><path class="white" d="M67,109 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="grey" d="M139,110 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="46" y="174" text-anchor="start"><tspan x="46" dy="0">White shirt</tspan><tspan x="46" dy="19">Grey trousers</tspan></text><path class="line" d="M164,209 l5,5 10,-12"/><rect class="card" x="210" y="94" width="154" height="133" rx="6"/><path class="blue" d="M241,109 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="navy" d="M313,110 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="220" y="174" text-anchor="start"><tspan x="220" dy="0">Sky blue shirt</tspan><tspan x="220" dy="19">Navy trousers</tspan></text><path class="line" d="M338,209 l5,5 10,-12"/><rect class="card" x="36" y="241" width="154" height="133" rx="6"/><path class="white" d="M67,256 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="navy" d="M139,257 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="46" y="321" text-anchor="start"><tspan x="46" dy="0">White shirt</tspan><tspan x="46" dy="19">Navy trousers</tspan></text><path class="line" d="M164,356 l5,5 10,-12"/><rect class="card dashed" x="210" y="241" width="154" height="133" rx="6"/><path class="white" d="M241,256 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="grey" d="M313,257 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="220" y="321" text-anchor="start"><tspan x="220" dy="0">White shirt</tspan><tspan x="220" dy="19">Grey trousers</tspan></text><text class="sh" x="220" y="362" text-anchor="start"><tspan x="220" dy="0">repeated</tspan></text><rect class="card" x="416" y="94" width="154" height="133" rx="6"/><path class="white" d="M447,109 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="grey" d="M519,110 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="426" y="174" text-anchor="start"><tspan x="426" dy="0">White shirt</tspan><tspan x="426" dy="19">Grey trousers</tspan></text><path class="line" d="M544,209 l5,5 10,-12"/><rect class="card" x="590" y="94" width="154" height="133" rx="6"/><path class="white" d="M621,109 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="navy" d="M693,110 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="600" y="174" text-anchor="start"><tspan x="600" dy="0">White shirt</tspan><tspan x="600" dy="19">Navy trousers</tspan></text><path class="line" d="M718,209 l5,5 10,-12"/><rect class="card" x="416" y="241" width="154" height="133" rx="6"/><path class="blue" d="M447,256 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="grey" d="M519,257 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="426" y="321" text-anchor="start"><tspan x="426" dy="0">Sky blue shirt</tspan><tspan x="426" dy="19">Grey trousers</tspan></text><path class="line" d="M544,356 l5,5 10,-12"/><rect class="card" x="590" y="241" width="154" height="133" rx="6"/><path class="blue" d="M621,256 l-14,10 8,13 10,-6 v28 h40 v-28 l10,6 8,-13 -14,-10 -10,7 h-14 z"/><path class="navy" d="M693,257 h30 l4,44 h-13 l-6,-26 -6,26 h-13 z"/><text class="small" x="600" y="321" text-anchor="start"><tspan x="600" dy="0">Sky blue shirt</tspan><tspan x="600" dy="19">Navy trousers</tspan></text><path class="line" d="M718,356 l5,5 10,-12"/><rect class="card dashed" x="36" y="386" width="328" height="34" rx="4"/><text class="small" x="48" y="408" text-anchor="start"><tspan x="48" dy="0">missing: sky blue with grey</tspan></text><text class="small" x="416" y="407" text-anchor="start"><tspan x="416" dy="0">Fix the shirt, change the trousers.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
