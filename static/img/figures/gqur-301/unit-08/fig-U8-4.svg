<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The combination formula with school examples</title><desc id="d">A table of the combination formula C(n, r) = n! divided by r! times (n - r)! with five school examples: a workshop group of 3 from 8 teachers gives 56, two register carriers from 3 volunteers give 3, a cricket eleven from 14 gives 364, any 5 of 8 exam questions gives 56, and handshakes among 10 teachers give 45.</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">Combinations: C(n, r) = n! ÷ (r! × (n - r)!)</text>
  <rect x="40" y="46" width="330" height="46" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="50" y="74">Situation</text>
  <rect x="370" y="46" width="230" height="46" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="380" y="74">Working</text>
  <rect x="600" y="46" width="140" height="46" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="610" y="74">Count</text>
  <rect x="40" y="92" width="330" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="120">3 teachers for a workshop, from 8</text>
  <rect x="370" y="92" width="230" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="120">336 ÷ 3! = 336 ÷ 6</text>
  <rect x="600" y="92" width="140" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="120">56</text>
  <rect x="40" y="138" width="330" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="166">2 register carriers, from 3 volunteers</text>
  <rect x="370" y="138" width="230" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="166">C(3, 2)</text>
  <rect x="600" y="138" width="140" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="166">3</text>
  <rect x="40" y="184" width="330" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="212">A cricket XI from a squad of 14</text>
  <rect x="370" y="184" width="230" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="212">C(14, 11) = C(14, 3)</text>
  <rect x="600" y="184" width="140" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="212">364</text>
  <rect x="40" y="230" width="330" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="258">Any 5 of 8 examination questions</text>
  <rect x="370" y="230" width="230" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="258">C(8, 5) = C(8, 3)</text>
  <rect x="600" y="230" width="140" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="258">56</text>
  <rect x="40" y="276" width="330" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="304">Handshakes among 10 teachers</text>
  <rect x="370" y="276" width="230" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="304">C(10, 2) = 90 ÷ 2</text>
  <rect x="600" y="276" width="140" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="304">45</text>
  <rect x="20" y="340" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="360">Caption: C(n, r) = P(n, r) ÷ r!</text>
  <text class="m" x="36" y="376">Order does not matter in any row: only the group counts.</text>
  <text class="m" x="36" y="392">Choosing r is the same as leaving out n - r, so C(n, r) = C(n, n - r) often shortens the working.</text>
  <text class="m" x="36" y="408">Credit: textbook.com.pk after Abramson (2021).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
