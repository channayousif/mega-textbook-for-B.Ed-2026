  <text class="m c" x="595" y="246">ایک ہی گروہ،</text>
  <text class="m c" x="595" y="262">چاہے ترتیب کچھ بھی ہو</text>
  <rect x="20" y="378" width="740" height="62" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="398">6 ترتیبیں = 1 تراکیب، اس لیے 3! = 6 سے تقسیم کریں</text>
  <text class="m" x="36" y="414">الف، ب اور ج تین طالب علم ہیں۔ ہر 3 رکنی کمیٹی ترتیبوں میں 3! = 6 بار نظر آتی ہے۔</text>
  <text class="m" x="36" y="430">حوالہ: textbook.com.pk بمطابق Lane (2023)۔</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
