  <text class="h c" x="595" y="68">ترتیب اہم نہیں: ایک کمیٹی</text>
  <text class="m c" x="80" y="94">پہلی</text>
  <text class="m c" x="150" y="94">دوسری</text>
  <text class="m c" x="220" y="94">تیسری</text>
