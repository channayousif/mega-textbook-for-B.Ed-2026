<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Which counting method?</title><desc id="d">A flowchart for choosing a counting method. If order does not matter, use a combination. If order matters and items can repeat, use the multiplicative rule, n to the power r. If order matters without repetition, use n factorial when all items are arranged, or P(n, r) when only some are. A note says to multiply across stages and add across separate cases.</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/>
  <text class="h c" x="390" y="28">Which counting method?</text>
  <rect class="b2" x="220" y="44" width="340" height="50" rx="6"/>
  <text class="sh c" x="390" y="66">Read the problem: what is being chosen,</text>
  <text class="sh c" x="390" y="82">and from how many?</text>
  <line class="line" x1="390" y1="94" x2="390" y2="122" marker-end="url(#arr)"/>
  <rect class="b2" x="250" y="124" width="280" height="46" rx="6"/>
  <text class="sh c" x="390" y="152">Does order matter? (swap test)</text>
  <line class="line" x1="300" y1="170" x2="150" y2="214" marker-end="url(#arr)"/>
  <text class="m c" x="205" y="188">no</text>
  <rect class="b3" x="30" y="216" width="240" height="58" rx="6"/>
  <text class="sh c" x="150" y="240">Combination</text>
  <text class="m c" x="150" y="258">C(n, r) = n! ÷ (r! (n - r)!)</text>
  <line class="line" x1="480" y1="170" x2="560" y2="214" marker-end="url(#arr)"/>
  <text class="m c" x="536" y="188">yes</text>
  <rect class="b2" x="420" y="216" width="300" height="46" rx="6"/>
  <text class="sh c" x="570" y="244">Can an item be used again?</text>
  <line class="line" x1="470" y1="262" x2="360" y2="312" marker-end="url(#arr)"/>
  <text class="m c" x="400" y="280">yes</text>
  <rect class="b3" x="240" y="314" width="250" height="58" rx="6"/>
  <text class="sh c" x="365" y="338">Multiplicative rule</text>
  <text class="m c" x="365" y="356">n × n × ... = n to the power r</text>
  <line class="line" x1="650" y1="262" x2="650" y2="312" marker-end="url(#arr)"/>
  <text class="m c" x="666" y="290">no</text>
  <rect class="b2" x="520" y="314" width="250" height="46" rx="6"/>
  <text class="sh c" x="645" y="342">Are all n items arranged?</text>
  <line class="line" x1="590" y1="360" x2="560" y2="410" marker-end="url(#arr)"/>
  <text class="m c" x="560" y="384">yes</text>
  <rect class="b3" x="480" y="412" width="130" height="46" rx="6"/>
  <text class="sh c" x="545" y="440">n!</text>
  <line class="line" x1="700" y1="360" x2="700" y2="410" marker-end="url(#arr)"/>
  <text class="m c" x="716" y="384">no</text>
  <rect class="b3" x="620" y="412" width="150" height="58" rx="6"/>
  <text class="sh c" x="695" y="436">Permutation</text>
  <text class="m c" x="695" y="454">P(n, r) = n! ÷ (n - r)!</text>
  <rect class="b4" x="30" y="412" width="400" height="58" rx="6"/>
  <text class="sh" x="46" y="436">Several stages? Count each stage, then multiply.</text>
  <text class="sh" x="46" y="454">Separate cases? Count each case, then add.</text>
  <rect x="20" y="490" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="510">Caption: two questions choose the method</text>
  <text class="m" x="36" y="526">Swap test: if swapping two chosen items gives a different outcome, order matters.</text>
  <text class="m" x="36" y="542">Then check the answer with a small listed case and a size check.</text>
  <text class="m" x="36" y="558">Credit: textbook.com.pk after Abramson (2021).</text>
  <text class="wm" x="760" y="590" aria-hidden="true">textbook.com.pk</text>
</svg>
