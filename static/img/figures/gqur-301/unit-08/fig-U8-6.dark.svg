<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Solved school counting problems</title><desc id="d">A table of six solved school counting problems, each labelled with whether order matters, the method and the answer: a lock code with repeats gives 1,000, three prizes among 10 give 720, a team of 4 from 10 gives 210, 2 boys and 2 girls give 60, a line with two friends together gives 48, and a committee with at least one girl gives 74.</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">Solved school counting problems</text>
  <rect x="20" y="46" width="300" height="42" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="30" y="72">School problem</text>
  <rect x="320" y="46" width="100" height="42" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="330" y="72">Order?</text>
  <rect x="420" y="46" width="220" height="42" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="430" y="72">Method</text>
  <rect x="640" y="46" width="120" height="42" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="650" y="72">Answer</text>
  <rect x="20" y="88" width="300" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="30" y="114">3-digit lock code, repeats allowed</text>
  <rect x="320" y="88" width="100" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="330" y="114">Yes</text>
  <rect x="420" y="88" width="220" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="430" y="114">10 × 10 × 10</text>
  <rect x="640" y="88" width="120" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="650" y="114">1,000</text>
  <rect x="20" y="130" width="300" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="30" y="156">1st, 2nd, 3rd prize among 10</text>
  <rect x="320" y="130" width="100" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="330" y="156">Yes</text>
  <rect x="420" y="130" width="220" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="430" y="156">P(10, 3)</text>
  <rect x="640" y="130" width="120" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="650" y="156">720</text>
  <rect x="20" y="172" width="300" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="30" y="198">Team of 4 debaters from 10</text>
  <rect x="320" y="172" width="100" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="330" y="198">No</text>
  <rect x="420" y="172" width="220" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="430" y="198">C(10, 4)</text>
  <rect x="640" y="172" width="120" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="650" y="198">210</text>
  <rect x="20" y="214" width="300" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="30" y="240">2 boys from 5 and 2 girls from 4</text>
  <rect x="320" y="214" width="100" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="330" y="240">No</text>
  <rect x="420" y="214" width="220" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="430" y="240">C(5, 2) × C(4, 2)</text>
  <rect x="640" y="214" width="120" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="650" y="240">60</text>
  <rect x="20" y="256" width="300" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="30" y="282">5 in a line, two friends together</text>
  <rect x="320" y="256" width="100" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="330" y="282">Yes</text>
  <rect x="420" y="256" width="220" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="430" y="282">4! × 2!</text>
  <rect x="640" y="256" width="120" height="42" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="650" y="282">48</text>
  <rect x="20" y="298" width="300" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="30" y="324">3 from 9, at least one girl</text>
  <rect x="320" y="298" width="100" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="330" y="324">No</text>
  <rect x="420" y="298" width="220" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="430" y="324">C(9, 3) - C(5, 3)</text>
  <rect x="640" y="298" width="120" height="42" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="650" y="324">74</text>
  <rect x="20" y="354" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="374">Caption: label the method before you calculate</text>
  <text class="m" x="36" y="390">Multiply across stages (choose boys, then girls). Treat "together" items as one block.</text>
  <text class="m" x="36" y="406">Count "at least one" as all cases minus the cases with none.</text>
  <text class="m" x="36" y="422">Credit: textbook.com.pk after Abramson (2021).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
