<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The permutation formula with school examples</title><desc id="d">تبدیل کا فارمولا P(n, r) = n! تقسیم (n - r)! کا جدول چار اسکولی مثالوں کے ساتھ: تین طالب علم قطار میں 6 ترتیبیں دیتے ہیں، 8 امیدواروں میں سے ہیڈ اور ڈپٹی پریفیکٹ 56، 10 فائنلسٹوں میں تین انعام 720، اور کراچی کے حروف سے 2,520۔</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">تبدیلیں: P(n, r) = n! ÷ (n - r)!</text>
  <rect x="40" y="46" width="330" height="50" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="50" y="76">صورت حال</text>
  <rect x="370" y="46" width="230" height="50" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="380" y="76">حساب</text>
  <rect x="600" y="46" width="140" height="50" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="610" y="76">گنتی</text>
  <rect x="40" y="96" width="330" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="126">اسمبلی کی قطار میں تین طالب علم</text>
  <rect x="370" y="96" width="230" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="126">3! = 3 × 2 × 1</text>
  <rect x="600" y="96" width="140" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="126">6</text>
  <rect x="40" y="146" width="330" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="176">8 میں سے ہیڈ اور ڈپٹی پریفیکٹ</text>
  <rect x="370" y="146" width="230" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="176">P(8, 2) = 8 × 7</text>
  <rect x="600" y="146" width="140" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="176">56</text>
  <rect x="40" y="196" width="330" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="226">10 فائنلسٹوں میں پہلا، دوسرا اور تیسرا انعام</text>
  <rect x="370" y="196" width="230" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="226">P(10, 3) = 10 × 9 × 8</text>
  <rect x="600" y="196" width="140" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="226">720</text>
  <rect x="40" y="246" width="330" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="276">KARACHI کے حروف (دو A یکساں)</text>
  <rect x="370" y="246" width="230" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="276">7! ÷ 2! = 5,040 ÷ 2</text>
  <rect x="600" y="246" width="140" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="276">2,520</text>
  <rect x="20" y="330" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="350">n! تمام ترتیبیں گنتا ہے، P(n, r) r چیزوں کی ترتیبیں گنتا ہے</text>
  <text class="m" x="36" y="366">ہر صف میں ترتیب اہم ہے: دو لوگوں یا حروف کی جگہ بدلنے سے مختلف نتیجہ آتا ہے۔</text>
  <text class="m" x="36" y="382">n سے شروع کریں اور r گھٹتے عناصر سے ضرب دیں۔ اگر کچھ چیزیں ایک جیسی ہوں تو ان کے فیکٹوریل سے تقسیم کریں۔</text>
  <text class="m" x="36" y="398">حوالہ: textbook.com.pk بمطابق Abramson (2021)۔</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
