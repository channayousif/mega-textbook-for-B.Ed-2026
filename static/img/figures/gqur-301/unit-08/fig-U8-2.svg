<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The permutation formula with school examples</title><desc id="d">A table of the permutation formula P(n, r) = n! divided by (n - r)! with four school examples: three pupils in a line give 6 orders, a head prefect and deputy from 8 candidates give 56, three prizes among 10 finalists give 720, and the letters of KARACHI give 2,520.</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">Permutations: P(n, r) = n! ÷ (n - r)!</text>
  <rect x="40" y="46" width="330" height="50" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="50" y="76">Situation</text>
  <rect x="370" y="46" width="230" height="50" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="380" y="76">Working</text>
  <rect x="600" y="46" width="140" height="50" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="610" y="76">Count</text>
  <rect x="40" y="96" width="330" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="126">3 pupils in an assembly line</text>
  <rect x="370" y="96" width="230" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="126">3! = 3 × 2 × 1</text>
  <rect x="600" y="96" width="140" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="126">6</text>
  <rect x="40" y="146" width="330" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="176">Head prefect and deputy from 8</text>
  <rect x="370" y="146" width="230" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="176">P(8, 2) = 8 × 7</text>
  <rect x="600" y="146" width="140" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="176">56</text>
  <rect x="40" y="196" width="330" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="226">1st, 2nd and 3rd prize from 10 finalists</text>
  <rect x="370" y="196" width="230" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="226">P(10, 3) = 10 × 9 × 8</text>
  <rect x="600" y="196" width="140" height="50" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="226">720</text>
  <rect x="40" y="246" width="330" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="276">Letters of KARACHI (two A’s alike)</text>
  <rect x="370" y="246" width="230" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="276">7! ÷ 2! = 5,040 ÷ 2</text>
  <rect x="600" y="246" width="140" height="50" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="276">2,520</text>
  <rect x="20" y="330" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="350">Caption: n! counts all orders, P(n, r) counts orders of r items</text>
  <text class="m" x="36" y="366">Order matters in every row: swapping two people or letters gives a different result.</text>
  <text class="m" x="36" y="382">Start at n and multiply r shrinking factors. If some items are alike, divide by their factorials.</text>
  <text class="m" x="36" y="398">Credit: textbook.com.pk after Abramson (2021).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
