<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The combination formula with school examples</title><desc id="d">تراکیب کا فارمولا C(n, r) = n! تقسیم r! ضرب (n - r)! کا جدول پانچ اسکولی مثالوں کے ساتھ: 8 اساتذہ میں سے 3 کا ورکشاپ گروہ 56، 3 رضاکاروں میں سے دو رجسٹر لے جانے والے 3، 14 میں سے کرکٹ گیارہ 364، 8 امتحانی سوالات میں سے کوئی 5 56، اور 10 اساتذہ کے درمیان مصافحے 45۔</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">تراکیب: C(n, r) = n! ÷ (r! × (n - r)!)</text>
  <rect x="40" y="46" width="330" height="46" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="50" y="74">صورت حال</text>
  <rect x="370" y="46" width="230" height="46" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="380" y="74">حساب</text>
  <rect x="600" y="46" width="140" height="46" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="610" y="74">گنتی</text>
  <rect x="40" y="92" width="330" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="120">8 میں سے 3 اساتذہ ورکشاپ کے لیے</text>
  <rect x="370" y="92" width="230" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="120">336 ÷ 3! = 336 ÷ 6</text>
  <rect x="600" y="92" width="140" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="120">56</text>
  <rect x="40" y="138" width="330" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="166">3 رضاکاروں میں سے 2 رجسٹر لے جانے والے</text>
  <rect x="370" y="138" width="230" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="166">C(3, 2)</text>
  <rect x="600" y="138" width="140" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="166">3</text>
  <rect x="40" y="184" width="330" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="212">14 کے گروہ میں سے کرکٹ گیارہ</text>
  <rect x="370" y="184" width="230" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="212">C(14, 11) = C(14, 3)</text>
  <rect x="600" y="184" width="140" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="212">364</text>
  <rect x="40" y="230" width="330" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="258">8 امتحانی سوالات میں سے کوئی 5</text>
  <rect x="370" y="230" width="230" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="258">C(8, 5) = C(8, 3)</text>
  <rect x="600" y="230" width="140" height="46" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="258">56</text>
  <rect x="40" y="276" width="330" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="50" y="304">10 اساتذہ کے درمیان مصافحے</text>
  <rect x="370" y="276" width="230" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="380" y="304">C(10, 2) = 90 ÷ 2</text>
  <rect x="600" y="276" width="140" height="46" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text x="610" y="304">45</text>
  <rect x="20" y="340" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="360">C(n, r) = P(n, r) ÷ r!</text>
  <text class="m" x="36" y="376">کسی بھی صف میں ترتیب اہم نہیں: صرف گروہ اہم ہے۔</text>
  <text class="m" x="36" y="392">r چننا n - r چھوڑنے کے برابر ہے، اس لیے C(n, r) = C(n, n - r) اکثر حساب مختصر کرتا ہے۔</text>
  <text class="m" x="36" y="408">حوالہ: textbook.com.pk بمطابق Abramson (2021)۔</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
