<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A model is checked, then reconsidered</title><desc id="d">A modelling cycle starts with a question and assumptions, builds a model, checks it against observations, and returns to revision when needed.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.small{font-size:14px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="590"/><text x="24" y="32" class="h" text-anchor="start">A model is checked, then reconsidered</text><rect class="panel" x="30" y="62" width="440" height="72" rx="8"/><text x="48" y="90" class="h" text-anchor="start">1. Question</text><text x="48" y="115" class="" text-anchor="start">How many reading sheets?</text><path class="link" d="M250,134 L250,160" marker-end="url(#arrow)"/><rect class="panel" x="30" y="162" width="440" height="72" rx="8"/><text x="48" y="190" class="h" text-anchor="start">2. Assumptions</text><text x="48" y="215" class="" text-anchor="start">Comparable ordinary school days</text><path class="link" d="M250,234 L250,260" marker-end="url(#arrow)"/><rect class="panel" x="30" y="262" width="440" height="72" rx="8"/><text x="48" y="290" class="h" text-anchor="start">3. Model</text><text x="48" y="315" class="" text-anchor="start">Predict from the recent mean</text><path class="link" d="M250,334 L250,360" marker-end="url(#arrow)"/><rect class="panel" x="30" y="362" width="440" height="72" rx="8"/><text x="48" y="390" class="h" text-anchor="start">4. Check against data</text><text x="48" y="415" class="" text-anchor="start">Compare later counts with predictions</text><path class="link" d="M250,434 L250,464" marker-end="url(#arrow)"/><rect class="panel" x="30" y="466" width="440" height="76" rx="8"/><text x="48" y="496" class="h" text-anchor="start">5. Keep or revise?</text><text x="48" y="523" class="" text-anchor="start">Use only while the conditions hold</text><path class="link" d="M470,505 L590,505 L590,198 L470,198" marker-end="url(#arrow)"/><text x="487" y="350" class="small" text-anchor="start">Revise</text><text x="487" y="374" class="small" text-anchor="start">if needed</text><text x="625" y="578" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
