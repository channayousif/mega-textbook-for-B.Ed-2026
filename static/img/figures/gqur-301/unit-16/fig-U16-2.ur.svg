<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نمونہ اور قابل مشاہدہ جانچ چنیں</title><desc id="d">اسکول کی تین صورتوں کے ساتھ نمونے کا انتخاب اور قابل مشاہدہ جانچ دی گئی ہے: نمونوں کو ان کے مطلوبہ استعمال کے مطابق جانچنا ضروری ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="460" transform="translate(640 0) scale(-1 1)"/><text x="616" y="32" class="h" text-anchor="end">نمونہ اور قابل مشاہدہ جانچ چنیں</text><text x="608" y="70" class="h" text-anchor="end">صورت حال</text><text x="428" y="70" class="h" text-anchor="end">نمونہ</text><text x="258" y="70" class="h" text-anchor="end">جانچ</text><rect class="panel" x="24" y="88" width="180" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="116" class="" text-anchor="end">حاضری</text><rect class="panel" x="204" y="88" width="170" height="110" transform="translate(640 0) scale(-1 1)"/><text x="426" y="116" class="" text-anchor="end">حالیہ اوسط</text><rect class="panel" x="374" y="88" width="242" height="110" transform="translate(640 0) scale(-1 1)"/><text x="256" y="116" class="" text-anchor="end">بعد کی روزانہ گنتیوں</text><text x="256" y="140" class="" text-anchor="end">سے موازنہ</text><rect class="panel" x="24" y="198" width="180" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="226" class="" text-anchor="end">پڑھنے کے اجلاس</text><text x="606" y="250" class="" text-anchor="end">اور الفاظ</text><rect class="panel" x="204" y="198" width="170" height="110" transform="translate(640 0) scale(-1 1)"/><text x="426" y="226" class="" text-anchor="end">مجوزہ خط</text><rect class="panel" x="374" y="198" width="242" height="110" transform="translate(640 0) scale(-1 1)"/><text x="256" y="226" class="" text-anchor="end">مشاہدہ منفی پیش گوئی</text><text x="256" y="250" class="" text-anchor="end">کے فرق کا خاکہ</text><rect class="panel" x="24" y="308" width="180" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="336" class="" text-anchor="end">دیر سے آمد</text><rect class="panel" x="204" y="308" width="170" height="110" transform="translate(640 0) scale(-1 1)"/><text x="426" y="336" class="" text-anchor="end">مشاہدہ شدہ دیر</text><text x="426" y="360" class="" text-anchor="end">کا تناسب</text><rect class="panel" x="374" y="308" width="242" height="110" transform="translate(640 0) scale(-1 1)"/><text x="256" y="336" class="" text-anchor="end">ملتے جلتے ہفتوں</text><text x="256" y="360" class="" text-anchor="end">میں موازنہ</text><text x="15" y="448" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
