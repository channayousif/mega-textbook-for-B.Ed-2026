<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1230" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Formula reminders: purpose before calculation</title><desc id="d">A course formula table pairs each expression with its purpose and a condition, reminding learners to choose a method before calculating.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.small{font-size:14px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="1230"/><text x="24" y="32" class="h" text-anchor="start">Formula reminders: purpose before calculation</text><text x="32" y="70" class="h" text-anchor="start">Expression</text><text x="312" y="70" class="h" text-anchor="start">Meaning or condition</text><rect class="panel" x="24" y="88" width="280" height="110"/><text x="34" y="116" class="" text-anchor="start">Mean = sum / n</text><rect class="panel" x="304" y="88" width="312" height="110"/><text x="314" y="116" class="" text-anchor="start">Numerical centre; inspect</text><text x="314" y="140" class="" text-anchor="start">unusual values</text><rect class="panel" x="24" y="198" width="280" height="110"/><text x="34" y="226" class="" text-anchor="start">Range = max - min</text><rect class="panel" x="304" y="198" width="312" height="110"/><text x="314" y="226" class="" text-anchor="start">Distance between extremes</text><rect class="panel" x="24" y="308" width="280" height="110"/><text x="34" y="336" class="" text-anchor="start">s² = sum of squared</text><text x="34" y="360" class="" text-anchor="start">deviations / (n - 1)</text><rect class="panel" x="304" y="308" width="312" height="110"/><text x="314" y="336" class="" text-anchor="start">Sample variance; n greater than</text><text x="314" y="360" class="" text-anchor="start">1</text><rect class="panel" x="24" y="418" width="280" height="110"/><text x="34" y="446" class="" text-anchor="start">s = square root of s²</text><rect class="panel" x="304" y="418" width="312" height="110"/><text x="314" y="446" class="" text-anchor="start">Sample spread in the original</text><text x="314" y="470" class="" text-anchor="start">units</text><rect class="panel" x="24" y="528" width="280" height="110"/><text x="34" y="556" class="" text-anchor="start">P(not A) = 1 - P(A)</text><rect class="panel" x="304" y="528" width="312" height="110"/><text x="314" y="556" class="" text-anchor="start">Complement of a defined event</text><rect class="panel" x="24" y="638" width="280" height="110"/><text x="34" y="666" class="" text-anchor="start">n! / (n - r)!</text><rect class="panel" x="304" y="638" width="312" height="110"/><text x="314" y="666" class="" text-anchor="start">Ordered selections without</text><text x="314" y="690" class="" text-anchor="start">replacement</text><rect class="panel" x="24" y="748" width="280" height="110"/><text x="34" y="776" class="" text-anchor="start">n! / [r!(n - r)!]</text><rect class="panel" x="304" y="748" width="312" height="110"/><text x="314" y="776" class="" text-anchor="start">Unordered selections without</text><text x="314" y="800" class="" text-anchor="start">replacement</text><rect class="panel" x="24" y="858" width="280" height="110"/><text x="34" y="886" class="" text-anchor="start">Predicted y = a + bx</text><rect class="panel" x="304" y="858" width="312" height="110"/><text x="314" y="886" class="" text-anchor="start">Straight-line pattern; check</text><text x="314" y="910" class="" text-anchor="start">observed differences</text><rect class="panel" x="24" y="968" width="280" height="110"/><text x="34" y="996" class="" text-anchor="start">Estimate ± margin</text><rect class="panel" x="304" y="968" width="312" height="110"/><text x="314" y="996" class="" text-anchor="start">Confidence interval under stated</text><text x="314" y="1020" class="" text-anchor="start">conditions</text><rect class="panel" x="24" y="1078" width="280" height="110"/><text x="34" y="1106" class="" text-anchor="start">(Estimate - null value) /</text><text x="34" y="1130" class="" text-anchor="start">standard error</text><rect class="panel" x="304" y="1078" width="312" height="110"/><text x="314" y="1106" class="" text-anchor="start">Test statistic; check sampling</text><text x="314" y="1130" class="" text-anchor="start">and assumptions</text><text x="625" y="1218" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
