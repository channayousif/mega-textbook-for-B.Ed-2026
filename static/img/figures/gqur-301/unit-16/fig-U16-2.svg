<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Choose a model and an observable check</title><desc id="d">Three school situations are paired with a model choice and an observable check, showing that models must be tested against their intended use.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.small{font-size:14px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="460"/><text x="24" y="32" class="h" text-anchor="start">Choose a model and an observable check</text><text x="32" y="70" class="h" text-anchor="start">Situation</text><text x="212" y="70" class="h" text-anchor="start">Model</text><text x="382" y="70" class="h" text-anchor="start">Check</text><rect class="panel" x="24" y="88" width="180" height="110"/><text x="34" y="116" class="" text-anchor="start">Attendance</text><rect class="panel" x="204" y="88" width="170" height="110"/><text x="214" y="116" class="" text-anchor="start">Recent mean</text><rect class="panel" x="374" y="88" width="242" height="110"/><text x="384" y="116" class="" text-anchor="start">Compare with later daily</text><text x="384" y="140" class="" text-anchor="start">counts</text><rect class="panel" x="24" y="198" width="180" height="110"/><text x="34" y="226" class="" text-anchor="start">Reading sessions</text><text x="34" y="250" class="" text-anchor="start">and words</text><rect class="panel" x="204" y="198" width="170" height="110"/><text x="214" y="226" class="" text-anchor="start">Candidate line</text><rect class="panel" x="374" y="198" width="242" height="110"/><text x="384" y="226" class="" text-anchor="start">Plot observed-minus-</text><text x="384" y="250" class="" text-anchor="start">predicted differences</text><rect class="panel" x="24" y="308" width="180" height="110"/><text x="34" y="336" class="" text-anchor="start">Late arrivals</text><rect class="panel" x="204" y="308" width="170" height="110"/><text x="214" y="336" class="" text-anchor="start">Observed late</text><text x="214" y="360" class="" text-anchor="start">proportion</text><rect class="panel" x="374" y="308" width="242" height="110"/><text x="384" y="336" class="" text-anchor="start">Compare across similar</text><text x="384" y="360" class="" text-anchor="start">weeks</text><text x="625" y="448" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
