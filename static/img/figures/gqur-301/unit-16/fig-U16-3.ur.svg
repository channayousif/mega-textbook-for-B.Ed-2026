<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول میں مسئلہ حل کرنے کا چکر</title><desc id="d">پانچ مربوط مرحلے پڑھنے تک رسائی کے اسکولی سوال کو منصوبے، جانچے ہوئے ڈیٹا، تجزیے اور ایسے نتیجے سے جوڑتے ہیں جو نئے سوال تک لے جا سکتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="550" transform="translate(640 0) scale(-1 1)"/><text x="616" y="32" class="h" text-anchor="end">اسکول میں مسئلہ حل کرنے کا چکر</text><rect class="panel" x="30" y="65" width="260" height="90" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="594" y="95" class="h" text-anchor="end">1. مسئلہ</text><text x="594" y="124" class="" text-anchor="end">پڑھنے سے کون محروم ہے؟</text><rect class="panel" x="350" y="65" width="260" height="90" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="274" y="95" class="h" text-anchor="end">2. منصوبہ</text><text x="274" y="124" class="" text-anchor="end">طالب علم-دن اور دیر کی تعریف</text><rect class="panel" x="350" y="240" width="260" height="90" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="274" y="270" class="h" text-anchor="end">3. ڈیٹا</text><text x="274" y="299" class="" text-anchor="end">پانچ روزانہ ریکارڈ جانچیں</text><rect class="panel" x="350" y="415" width="260" height="90" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="274" y="445" class="h" text-anchor="end">4. تجزیہ</text><text x="274" y="474" class="" text-anchor="end">18 / 90 = 20% دیر</text><rect class="panel" x="30" y="415" width="260" height="90" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="594" y="445" class="h" text-anchor="end">5. نتیجہ</text><text x="594" y="474" class="" text-anchor="end">محدود اقدام؛ پیروی</text><path class="link" d="M290,110 L348,110" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><path class="link" d="M480,155 L480,238" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><path class="link" d="M480,330 L480,413" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><path class="link" d="M350,460 L292,460" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><path class="link" d="M30,460 L14,460 L14,110 L28,110" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><text x="608" y="267" class="h" text-anchor="end">پڑھنے تک رسائی</text><text x="608" y="295" class="" text-anchor="end">سوال طریقہ طے کرتا ہے</text><text x="608" y="323" class="" text-anchor="end">پیروی کے بعد نظرثانی</text><text x="15" y="538" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
