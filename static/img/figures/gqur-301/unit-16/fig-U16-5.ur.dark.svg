<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کورس کے تصورات کیسے جڑتے ہیں</title><desc id="d">کورس کے تصورات تحقیقی سوال سے جڑتے ہیں: ڈیٹا اور نمونہ گیری خلاصوں کی، احتمال غیر یقینی کیفیت کی، اور تعلقات نمونوں کی بنیاد بنتے ہیں؛ استنباط کے لیے جائز دائرہ درکار ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="790" transform="translate(640 0) scale(-1 1)"/><text x="616" y="32" class="h" text-anchor="end">کورس کے تصورات کیسے جڑتے ہیں</text><rect class="panel" x="150" y="60" width="340" height="72" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="470" y="90" class="h" text-anchor="end">اسکولی سوال اور حدود</text><text x="470" y="116" class="" text-anchor="end">مربوط طریقے چنیں</text><rect class="panel" x="32" y="190" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="594" y="220" class="h" text-anchor="end">ڈیٹا اور ماخذ</text><text x="594" y="247" class="" text-anchor="end">مشاہدات متعین کریں</text><rect class="panel" x="358" y="190" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="268" y="220" class="h" text-anchor="end">نمونہ گیری</text><text x="268" y="247" class="" text-anchor="end">وسیع گروہ متعین کریں</text><rect class="panel" x="32" y="330" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="594" y="360" class="h" text-anchor="end">تنظیم</text><text x="594" y="387" class="" text-anchor="end">جدول اور خاکے</text><rect class="panel" x="358" y="330" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="268" y="360" class="h" text-anchor="end">گنتی</text><text x="268" y="387" class="" text-anchor="end">ممکنہ نتائج متعین کریں</text><rect class="panel" x="32" y="470" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="594" y="500" class="h" text-anchor="end">مرکز اور پھیلاؤ</text><text x="594" y="527" class="" text-anchor="end">مشاہدات کا</text><text x="594" y="550" class="" text-anchor="end">خلاصہ کریں</text><rect class="panel" x="358" y="470" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="268" y="500" class="h" text-anchor="end">احتمال</text><text x="268" y="527" class="" text-anchor="end">غیر یقینی کیفیت کا نمونہ</text><rect class="panel" x="32" y="610" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="594" y="640" class="h" text-anchor="end">تعلقات</text><text x="594" y="667" class="" text-anchor="end">خاکہ، پھر خط کی جانچ</text><rect class="panel" x="358" y="610" width="250" height="88" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="268" y="640" class="h" text-anchor="end">استنباط</text><text x="268" y="667" class="" text-anchor="end">حدود کے ساتھ تخمینہ</text><text x="268" y="690" class="" text-anchor="end">یا آزمائش</text><path class="link" d="M250,132 L157,188" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><path class="link" d="M390,132 L483,188" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><path class="link" d="M157,278 L157,328" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><path