<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1230" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فارمولوں کی یاددہانی: حساب سے پہلے مقصد</title><desc id="d">کورس کے فارمولوں کا جدول ہر عبارت کو مقصد اور شرط سے جوڑتا ہے: حساب سے پہلے طریقہ منتخب کریں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="1230" transform="translate(640 0) scale(-1 1)"/><text x="616" y="32" class="h" text-anchor="end">فارمولوں کی یاددہانی: حساب سے پہلے مقصد</text><text x="608" y="70" class="h" text-anchor="end">عبارت</text><text x="328" y="70" class="h" text-anchor="end">مطلب یا شرط</text><rect class="panel" x="24" y="88" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="116" class="" text-anchor="end">اوسط = مجموعہ / n</text><rect class="panel" x="304" y="88" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="116" class="" text-anchor="end">عددی مرکز؛ غیر معمولی</text><text x="326" y="140" class="" text-anchor="end">قدریں دیکھیں</text><rect class="panel" x="24" y="198" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="226" class="" text-anchor="end">حدِ پھیلاؤ = سب سے بڑا - سب سے چھوٹا</text><rect class="panel" x="304" y="198" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="226" class="" text-anchor="end">انتہائی قدروں کا فاصلہ</text><rect class="panel" x="24" y="308" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="336" class="" text-anchor="end">s² = انحرافات کے مربعوں</text><text x="606" y="360" class="" text-anchor="end">کا مجموعہ / (n - 1)</text><rect class="panel" x="304" y="308" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="336" class="" text-anchor="end">نمونے کا تغیر؛ n ایک</text><text x="326" y="360" class="" text-anchor="end">سے بڑا</text><rect class="panel" x="24" y="418" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="446" class="" text-anchor="end">s = تغیر s² کا جذر</text><rect class="panel" x="304" y="418" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="446" class="" text-anchor="end">اصل اکائیوں میں نمونے</text><text x="326" y="470" class="" text-anchor="end">کا پھیلاؤ</text><rect class="panel" x="24" y="528" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="556" class="" text-anchor="end">P(not A) = 1 - P(A)</text><rect class="panel" x="304" y="528" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="556" class="" text-anchor="end">متعین واقعے کا تکملہ</text><rect class="panel" x="24" y="638" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="666" class="" text-anchor="end">n! / (n - r)!</text><rect class="panel" x="304" y="638" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="666" class="" text-anchor="end">بغیر واپسی مرتب</text><text x="326" y="690" class="" text-anchor="end">انتخاب</text><rect class="panel" x="24" y="748" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="776" class="" text-anchor="end">n! / [r!(n - r)!]</text><rect class="panel" x="304" y="748" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="776" class="" text-anchor="end">بغیر واپسی غیر مرتب</text><text x="326" y="800" class="" text-anchor="end">انتخاب</text><rect class="panel" x="24" y="858" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="886" class="" text-anchor="end">پیش گوئی شدہ y = a + bx</text><rect class="panel" x="304" y="858" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="886" class="" text-anchor="end">سیدھے خط کا انداز؛ مشاہدہ شدہ</text><text x="326" y="910" class="" text-anchor="end">فرق جانچیں</text><rect class="panel" x="24" y="968" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="996" class="" text-anchor="end">تخمینہ ± حاشیہ</text><rect class="panel" x="304" y="968" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="996" class="" text-anchor="end">بیان کردہ شرائط کے تحت</text><text x="326" y="1020" class="" text-anchor="end">اعتماد کا وقفہ</text><rect class="panel" x="24" y="1078" width="280" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="1106" class="" text-anchor="end">(تخمینہ - صفر مفروضے کی قدر) /</text><text x="606" y="1130" class="" text-anchor="end">معیاری خطا</text><rect class="panel" x="304" y="1078" width="312" height="110" transform="translate(640 0) scale(-1 1)"/><text x="326" y="1106" class="" text-anchor="end">آزمائشی شماریہ؛ نمونہ گیری</text><text x="326" y="1130" class="" text-anchor="end">اور مفروضے جانچیں</text><text x="15" y="1218" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
