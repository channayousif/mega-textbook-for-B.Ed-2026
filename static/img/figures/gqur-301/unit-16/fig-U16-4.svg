<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A worked reading-access investigation</title><desc id="d">A worked investigation links the reading-access question to five-day counts, a 20 percent late share among present pupil-days, and a cautious follow-up decision.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.small{font-size:14px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="790"/><text x="24" y="32" class="h" text-anchor="start">A worked reading-access investigation</text><text x="32" y="70" class="h" text-anchor="start">Stage</text><text x="192" y="70" class="h" text-anchor="start">Evidence and reasoning</text><rect class="panel" x="24" y="88" width="160" height="110"/><text x="34" y="116" class="" text-anchor="start">Question</text><rect class="panel" x="184" y="88" width="432" height="110"/><text x="194" y="116" class="" text-anchor="start">What share of present pupil-days involved</text><text x="194" y="140" class="" text-anchor="start">late arrival?</text><rect class="panel" x="24" y="198" width="160" height="110"/><text x="34" y="226" class="" text-anchor="start">Plan</text><rect class="panel" x="184" y="198" width="432" height="110"/><text x="194" y="226" class="" text-anchor="start">One class; five days; unchanged reading start</text><text x="194" y="250" class="" text-anchor="start">time</text><rect class="panel" x="24" y="308" width="160" height="110"/><text x="34" y="336" class="" text-anchor="start">Data</text><rect class="panel" x="184" y="308" width="432" height="110"/><text x="194" y="336" class="" text-anchor="start">90 present pupil-days; 18 late arrivals;</text><text x="194" y="360" class="" text-anchor="start">check totals</text><rect class="panel" x="24" y="418" width="160" height="110"/><text x="34" y="446" class="" text-anchor="start">Analysis</text><rect class="panel" x="184" y="418" width="432" height="110"/><text x="194" y="446" class="" text-anchor="start">18 / 90 = 20%; Friday: 6 / 18 = 33.3%</text><rect class="panel" x="24" y="528" width="160" height="110"/><text x="34" y="556" class="" text-anchor="start">Conclusion</text><rect class="panel" x="184" y="528" width="432" height="110"/><text x="194" y="556" class="" text-anchor="start">Describe this class and period; do not infer</text><text x="194" y="580" class="" text-anchor="start">causes</text><rect class="panel" x="24" y="638" width="160" height="110"/><text x="34" y="666" class="" text-anchor="start">Follow-up</text><rect class="panel" x="184" y="638" width="432" height="110"/><text x="194" y="666" class="" text-anchor="start">Try an agreed routine; record comparable</text><text x="194" y="690" class="" text-anchor="start">later days</text><text x="625" y="778" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
