<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How the course concepts connect</title><desc id="d">Course concepts connect through the investigation question: data and sampling support summaries, probability supports uncertainty, relationships support models, and inference requires justified scope.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.small{font-size:14px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="790"/><text x="24" y="32" class="h" text-anchor="start">How the course concepts connect</text><rect class="panel" x="150" y="60" width="340" height="72" rx="8"/><text x="170" y="90" class="h" text-anchor="start">School question and limits</text><text x="170" y="116" class="" text-anchor="start">Choose connected methods</text><rect class="panel" x="32" y="190" width="250" height="88" rx="8"/><text x="46" y="220" class="h" text-anchor="start">Data and sources</text><text x="46" y="247" class="" text-anchor="start">Define observations</text><rect class="panel" x="358" y="190" width="250" height="88" rx="8"/><text x="372" y="220" class="h" text-anchor="start">Sampling</text><text x="372" y="247" class="" text-anchor="start">Define the wider group</text><rect class="panel" x="32" y="330" width="250" height="88" rx="8"/><text x="46" y="360" class="h" text-anchor="start">Organisation</text><text x="46" y="387" class="" text-anchor="start">Tables and graphs</text><rect class="panel" x="358" y="330" width="250" height="88" rx="8"/><text x="372" y="360" class="h" text-anchor="start">Counting</text><text x="372" y="387" class="" text-anchor="start">Define possible outcomes</text><rect class="panel" x="32" y="470" width="250" height="88" rx="8"/><text x="46" y="500" class="h" text-anchor="start">Centre and spread</text><text x="46" y="527" class="" text-anchor="start">Summarise the</text><text x="46" y="550" class="" text-anchor="start">observations</text><rect class="panel" x="358" y="470" width="250" height="88" rx="8"/><text x="372" y="500" class="h" text-anchor="start">Probability</text><text x="372" y="527" class="" text-anchor="start">Model uncertainty</text><rect class="panel" x="32" y="610" width="250" height="88" rx="8"/><text x="46" y="640" class="h" text-anchor="start">Relationships</text><text x="46" y="667" class="" text-anchor="start">Plot, then check a line</text><rect class="panel" x="358" y="610" width="250" height="88" rx="8"/><text x="372" y="640" class="h" text-anchor="start">Inference</text><text x="372" y="667" class="" text-anchor="start">Estimate or test with</text><text x="372" y="690" class="" text-anchor="start">limits</text><path class="link" d="M250,132 L157,188" marker-end="url(#arrow)"/><path class="link" d="M390,132 L483,188" marker-end="url(#arrow)"/><path class="link" d="M157,278 L157,328" marker-end="url(#arrow)"/><path class="link" d="M157,418 L157,468" marker-end="url(#arrow)"/><path class="link" d="M157,558 L157,608" marker-end="url(#arrow)"/><path class="link" d="M282,374 L356,374" marker-end="url(#arrow)"/><path class="link" d="M483,418 L483,468" marker-end="url(#arrow)"/><path class="link" d="M483,558 L483,608" marker-end="url(#arrow)"/><path class="link" d="M282,654 L356,654" marker-end="url(#arrow)"/><path class="link" d="M608,234 L624,234 L624,654 L610,654" marker-end="url(#arrow)"/><path class="link" d="M483,698 L483,748 L16,748 L16,96 L148,96" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="115" y="730" class="small" text-anchor="start">Return to the question; check assumptions</text><text x="625" y="778" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
