<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نمونے کی جانچ، پھر نظرثانی</title><desc id="d">نمونہ سازی کا چکر سوال اور مفروضوں سے شروع ہوتا ہے، نمونہ بناتا ہے، مشاہدات کے مقابل اس کی جانچ کرتا ہے، اور ضرورت پر نظرثانی کی طرف لوٹتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="590" transform="translate(640 0) scale(-1 1)"/><text x="616" y="32" class="h" text-anchor="end">نمونے کی جانچ، پھر نظرثانی</text><rect class="panel" x="30" y="62" width="440" height="72" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="592" y="90" class="h" text-anchor="end">1. سوال</text><text x="592" y="115" class="" text-anchor="end">پڑھنے کی کتنی شیٹس؟</text><path class="link" d="M250,134 L250,160" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><rect class="panel" x="30" y="162" width="440" height="72" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="592" y="190" class="h" text-anchor="end">2. مفروضے</text><text x="592" y="215" class="" text-anchor="end">قابل موازنہ عام اسکولی دن</text><path class="link" d="M250,234 L250,260" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><rect class="panel" x="30" y="262" width="440" height="72" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="592" y="290" class="h" text-anchor="end">3. نمونہ</text><text x="592" y="315" class="" text-anchor="end">حالیہ اوسط سے پیش گوئی</text><path class="link" d="M250,334 L250,360" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><rect class="panel" x="30" y="362" width="440" height="72" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="592" y="390" class="h" text-anchor="end">4. ڈیٹا سے جانچ</text><text x="592" y="415" class="" text-anchor="end">بعد کی گنتیاں پیش گوئی سے ملائیں</text><path class="link" d="M250,434 L250,464" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><rect class="panel" x="30" y="466" width="440" height="76" rx="8" transform="translate(640 0) scale(-1 1)"/><text x="592" y="496" class="h" text-anchor="end">5. برقرار رکھیں یا بدلیں؟</text><text x="592" y="523" class="" text-anchor="end">صرف شرائط برقرار رہنے تک استعمال</text><path class="link" d="M470,505 L590,505 L590,198 L470,198" marker-end="url(#arrow)" transform="translate(640 0) scale(-1 1)"/><text x="153" y="350" class="small" text-anchor="end">نظرثانی</text><text x="153" y="374" class="small" text-anchor="end">ضرورت پر</text><text x="15" y="578" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
