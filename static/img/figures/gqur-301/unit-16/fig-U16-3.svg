<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The school problem-solving cycle</title><desc id="d">Five connected stages link the school question about reading access to a plan, checked data, analysis and a conclusion that can lead to a new question.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700}.small{font-size:14px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="550"/><text x="24" y="32" class="h" text-anchor="start">The school problem-solving cycle</text><rect class="panel" x="30" y="65" width="260" height="90" rx="8"/><text x="46" y="95" class="h" text-anchor="start">1. Problem</text><text x="46" y="124" class="" text-anchor="start">Who misses reading?</text><rect class="panel" x="350" y="65" width="260" height="90" rx="8"/><text x="366" y="95" class="h" text-anchor="start">2. Plan</text><text x="366" y="124" class="" text-anchor="start">Define pupil-days and late</text><rect class="panel" x="350" y="240" width="260" height="90" rx="8"/><text x="366" y="270" class="h" text-anchor="start">3. Data</text><text x="366" y="299" class="" text-anchor="start">Check five daily records</text><rect class="panel" x="350" y="415" width="260" height="90" rx="8"/><text x="366" y="445" class="h" text-anchor="start">4. Analysis</text><text x="366" y="474" class="" text-anchor="start">18 / 90 = 20% late</text><rect class="panel" x="30" y="415" width="260" height="90" rx="8"/><text x="46" y="445" class="h" text-anchor="start">5. Conclusion</text><text x="46" y="474" class="" text-anchor="start">Limited action; follow-up</text><path class="link" d="M290,110 L348,110" marker-end="url(#arrow)"/><path class="link" d="M480,155 L480,238" marker-end="url(#arrow)"/><path class="link" d="M480,330 L480,413" marker-end="url(#arrow)"/><path class="link" d="M350,460 L292,460" marker-end="url(#arrow)"/><path class="link" d="M30,460 L14,460 L14,110 L28,110" marker-end="url(#arrow)"/><text x="32" y="267" class="h" text-anchor="start">Reading access</text><text x="32" y="295" class="" text-anchor="start">Question drives method</text><text x="32" y="323" class="" text-anchor="start">Revise after follow-up</text><text x="625" y="538" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
