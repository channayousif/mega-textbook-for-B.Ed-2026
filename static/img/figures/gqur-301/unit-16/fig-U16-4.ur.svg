<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پڑھنے تک رسائی کی حل شدہ تحقیق</title><desc id="d">حل شدہ تحقیق پڑھنے تک رسائی کے سوال کو پانچ دن کی گنتیوں، حاضر طالب علم-دنوں میں 20 فیصد دیر، اور محتاط اگلے فیصلے سے جوڑتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:17px;font-weight:700}.small{font-size:13px;fill:var(--ink)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="790" transform="translate(640 0) scale(-1 1)"/><text x="616" y="32" class="h" text-anchor="end">پڑھنے تک رسائی کی حل شدہ تحقیق</text><text x="608" y="70" class="h" text-anchor="end">مرحلہ</text><text x="448" y="70" class="h" text-anchor="end">شواہد اور استدلال</text><rect class="panel" x="24" y="88" width="160" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="116" class="" text-anchor="end">سوال</text><rect class="panel" x="184" y="88" width="432" height="110" transform="translate(640 0) scale(-1 1)"/><text x="446" y="116" class="" text-anchor="end">حاضر طالب علم-دنوں میں کتنا حصہ</text><text x="446" y="140" class="" text-anchor="end">دیر سے آمد کا تھا؟</text><rect class="panel" x="24" y="198" width="160" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="226" class="" text-anchor="end">منصوبہ</text><rect class="panel" x="184" y="198" width="432" height="110" transform="translate(640 0) scale(-1 1)"/><text x="446" y="226" class="" text-anchor="end">ایک جماعت؛ پانچ دن؛ مطالعے کے آغاز کا</text><text x="446" y="250" class="" text-anchor="end">وقت یکساں</text><rect class="panel" x="24" y="308" width="160" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="336" class="" text-anchor="end">ڈیٹا</text><rect class="panel" x="184" y="308" width="432" height="110" transform="translate(640 0) scale(-1 1)"/><text x="446" y="336" class="" text-anchor="end">90 حاضر طالب علم-دن؛ 18 دیر سے آمد؛</text><text x="446" y="360" class="" text-anchor="end">مجموعے جانچیں</text><rect class="panel" x="24" y="418" width="160" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="446" class="" text-anchor="end">تجزیہ</text><rect class="panel" x="184" y="418" width="432" height="110" transform="translate(640 0) scale(-1 1)"/><text x="446" y="446" class="" text-anchor="end">18 / 90 = 20%؛ جمعہ: 6 / 18 = 33.3%</text><rect class="panel" x="24" y="528" width="160" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="556" class="" text-anchor="end">نتیجہ</text><rect class="panel" x="184" y="528" width="432" height="110" transform="translate(640 0) scale(-1 1)"/><text x="446" y="556" class="" text-anchor="end">اسی جماعت اور مدت کی وضاحت کریں؛ سبب</text><text x="446" y="580" class="" text-anchor="end">اخذ نہ کریں</text><rect class="panel" x="24" y="638" width="160" height="110" transform="translate(640 0) scale(-1 1)"/><text x="606" y="666" class="" text-anchor="end">پیروی</text><rect class="panel" x="184" y="638" width="432" height="110" transform="translate(640 0) scale(-1 1)"/><text x="446" y="666" class="" text-anchor="end">متفقہ معمول آزمائیں؛ بعد کے قابل موازنہ</text><text x="446" y="690" class="" text-anchor="end">دن درج کریں</text><text x="15" y="778" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
