<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زیڈ-جانچ اور ٹی-جانچ کا موازنہ جدول</title><desc id="d">زیڈ-جانچ اور ٹی-جانچ کا موازنہ جدول چھ قطاروں میں: ہر ایک کب لاگو ہوتی ہے، کون سی تقسیم استعمال ہوتی ہے، نمونے کا سائز، جانچ کا فارمولا، سروں کی موٹائی، اور ایک اسکولی مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:14px;fill:var(--ink)}.h{font-size:16px;font-weight:700}.wm{font-size:11px;fill:var(--wm)}.bg{fill:var(--bg)}.axis{stroke:var(--ink);stroke-width:1.5;fill:none}.curve{stroke:var(--a1);stroke-width:2.5;fill:none}.tc{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none}.dash{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.lead{stroke:var(--muted);stroke-width:1;fill:none}.grid{stroke:var(--ink);stroke-width:1;opacity:.22;fill:none}.tint{fill:var(--a1-fill)}.bold{font-weight:700}</style><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="var(--a1-fill)"/><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="var(--a1)" stroke-width="1"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="6" height="6"><rect width="6" height="6" fill="var(--a2-fill)"/><circle cx="3" cy="3" r="1" fill="var(--a2)"/></pattern></defs><rect class="bg" width="780" height="470"/><text x="750" y="32" class="h" text-anchor="end">زیڈ-جانچ یا ٹی-جانچ کا انتخاب</text><rect class="tint" x="30" y="57" width="720" height="39"/><text x="736" y="82" class="h" text-anchor="end">موازنہ</text><text x="565" y="82" class="h" text-anchor="end">زیڈ-جانچ</text><text x="297" y="82" class="h" text-anchor="end">ٹی-جانچ</text><path class="grid" d="M750 96 L30 96"/><text x="736" y="122" class="bold" text-anchor="end">کب استعمال کریں</text><text x="565" y="122" text-anchor="end">σ معلوم</text><text x="297" y="122" text-anchor="end">σ نامعلوم</text><path class="grid" d="M750 150 L30 150"/><text x="736" y="176" class="bold" text-anchor="end">تقسیم</text><text x="565" y="176" text-anchor="end">معیاری نارمل</text><text x="297" y="176" text-anchor="end">ٹی، df = n - 1</text><path class="grid" d="M750 204 L30 204"/><text x="736" y="230" class="bold" text-anchor="end">نمونے کا سائز</text><text x="565" y="230" text-anchor="end">بڑا n (یا کوئی بھی n اگر</text><text x="565" y="248" text-anchor="end">آبادی نارمل ہو)</text><text x="297" y="230" text-anchor="end">چھوٹا یا درمیانہ n</text><path class="grid" d="M750 258 L30 258"/><text x="736" y="284" class="bold" text-anchor="end">جانچ شماریات</text><text x="565" y="284" text-anchor="end">z = (x̄ - μ0)/(σ/√n)</text><text x="297" y="284" text-anchor="end">t = (x̄ - μ0)/(s/√n)</text><path class="grid" d="M750 312 L30 312"/><text x="736" y="338" class="bold" text-anchor="end">سرے</text><text x="565" y="338" text-anchor="end">پتلے</text><text x="297" y="338" text-anchor="end">موٹے (چھوٹے n کے لیے</text><text x="297" y="356" text-anchor="end">زیادہ محتاط)</text><path class="grid" d="M750 366 L30 366"/><text x="736" y="392" class="bold" text-anchor="end">اسکولی مثال</text><text x="565" y="392" text-anchor="end">ضلعی اوسط اور</text><text x="565" y="410" text-anchor="end">معلوم ضلعی معیاری انحرف</text><text x="297" y="392" text-anchor="end">چھوٹی جماعت، صرف</text><text x="297" y="410" text-anchor="end">نمونے کا معیاری انحرف</text><path class="grid" d="M750 420 L30 420"/><path class="grid" d="M580 57 L580 420"/><path class="grid" d="M312 57 L312 420"/><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
