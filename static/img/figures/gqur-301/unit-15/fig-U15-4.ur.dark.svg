<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زیڈ-جانچ کا خلاصہ جدول</title><desc id="d">زیڈ-جانچ کا خلاصہ جدول: عدم فروض μ = 68، متبادل فروض μ &gt; 68، α = 0.05، نمونے کا اوسط 71.5، n = 40، آبادی کا معیاری انحرف 12، معیاری خطا 1.90، جانچ شماریات z = 1.84، پی-قدر 0.0329، اور عدم فروض کو خارج کرنے کا فیصلہ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:14px;fill:var(--ink)}.h{font-size:16px;font-weight:700}.wm{font-size:11px;fill:var(--wm)}.bg{fill:var(--bg)}.axis{stroke:var(--ink);stroke-width:1.5;fill:none}.curve{stroke:var(--a1);stroke-width:2.5;fill:none}.tc{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none}.dash{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.lead{stroke:var(--muted);stroke-width:1;fill:none}.grid{stroke:var(--ink);stroke-width:1;opacity:.22;fill:none}.tint{fill:var(--a1-fill)}.bold{font-weight:700}</style><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="var(--a1-fill)"/><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="var(--a1)" stroke-width="1"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="6" height="6"><rect width="6" height="6" fill="var(--a2-fill)"/><circle cx="3" cy="3" r="1" fill="var(--a2)"/></pattern></defs><rect class="bg" width="780" height="470"/><text x="750" y="32" class="h" text-anchor="end">حل شدہ زیڈ-جانچ: سکھر کی ریاضی جماعت</text><rect class="tint" x="30" y="54" width="720" height="30"/><text x="736" y="75" class="h" text-anchor="end">قدم</text><text x="508" y="75" class="h" text-anchor="end">قدر</text><path class="grid" d="M750 84 L30 84"/><text x="736" y="105" text-anchor="end">عدم فروض</text><text x="508" y="105" text-anchor="end">H0: μ = 68</text><path class="grid" d="M750 115 L30 115"/><text x="736" y="136" text-anchor="end">متبادل فروض</text><text x="508" y="136" text-anchor="end">H1: μ &gt; 68 (دائیں طرفہ)</text><path class="grid" d="M750 146 L30 146"/><text x="736" y="167" text-anchor="end">اہمیت کی سطح</text><text x="508" y="167" text-anchor="end">α = 0.05</text><path class="grid" d="M750 177 L30 177"/><text x="736" y="198" text-anchor="end">نمونہ</text><text x="508" y="198" text-anchor="end">x̄ = 71.5, n = 40</text><path class="grid" d="M750 208 L30 208"/><text x="736" y="229" text-anchor="end">آبادی کا معیاری انحرف</text><text x="508" y="229" text-anchor="end">σ = 12</text><path class="grid" d="M750 239 L30 239"/><text x="736" y="260" text-anchor="end">معیاری خطا</text><text x="508" y="260" text-anchor="end">12/√40 = 1.90</text><path class="grid" d="M750 270 L30 270"/><text x="736" y="291" text-anchor="end">جانچ شماریات</text><text x="508" y="291" text-anchor="end">z = (71.5 - 68)/1.90 = 1.84</text><path class="grid" d="M750 301 L30 301"/><text x="736" y="322" text-anchor="end">پی-قدر</text><text x="508" y="322" text-anchor="end">0.0329</text><rect class="tint" x="30" y="332" width="720" height="31"/><path class="grid" d="M750 332 L30 332"/><text x="736" y="353" class="bold" text-anchor="end">فیصلہ</text><text x="508" y="353" class="bold" text-anchor="end">H0 خارج کریں (p ≤ α)</text><path class="grid" d="M750 363 L30 363"/><text x="736" y="384" text-anchor="end">نتیجہ</text><text x="508" y="384" text-anchor="end">کافی شہادت ہے کہ جماعت کا اوسط</text><text x="508" y="402" text-anchor="end">ضلعی اوسط 68 سے زیادہ ہے۔</text><path class="grid" d="M750 412 L30 412"/><path class="grid" d="M522 54 L522 412"/><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
