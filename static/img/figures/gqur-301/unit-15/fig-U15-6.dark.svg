<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A comparison table between the z-test and the t-test across six rows: when each applies, the distribution used, the sample size, the test formula, the tail thickness, and a school example.</title><desc id="d">A comparison table between the z-test and the t-test across six rows: when each applies, the distribution used, the sample size, the test formula, the tail thickness, and a school example.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:14px;fill:var(--ink)}.h{font-size:16px;font-weight:700}.wm{font-size:11px;fill:var(--wm)}.bg{fill:var(--bg)}.axis{stroke:var(--ink);stroke-width:1.5;fill:none}.curve{stroke:var(--a1);stroke-width:2.5;fill:none}.tc{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none}.dash{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.lead{stroke:var(--muted);stroke-width:1;fill:none}.grid{stroke:var(--ink);stroke-width:1;opacity:.22;fill:none}.tint{fill:var(--a1-fill)}.bold{font-weight:700}</style><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="var(--a1-fill)"/><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="var(--a1)" stroke-width="1"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="6" height="6"><rect width="6" height="6" fill="var(--a2-fill)"/><circle cx="3" cy="3" r="1" fill="var(--a2)"/></pattern></defs><rect class="bg" width="780" height="470"/><text x="30" y="32" class="h" text-anchor="start">Choosing between a z-test and a t-test</text><rect class="tint" x="30" y="57" width="720" height="39"/><text x="44" y="82" class="h" text-anchor="start">Comparison</text><text x="215" y="82" class="h" text-anchor="start">z-test</text><text x="483" y="82" class="h" text-anchor="start">t-test</text><path class="grid" d="M30.00,96.00 L750.00,96.00"/><text x="44" y="122" class="bold" text-anchor="start">When to use</text><text x="215" y="122" text-anchor="start">σ known</text><text x="483" y="122" text-anchor="start">σ unknown</text><path class="grid" d="M30.00,150.00 L750.00,150.00"/><text x="44" y="176" class="bold" text-anchor="start">Distribution</text><text x="215" y="176" text-anchor="start">standard normal</text><text x="483" y="176" text-anchor="start">t with df = n - 1</text><path class="grid" d="M30.00,204.00 L750.00,204.00"/><text x="44" y="230" class="bold" text-anchor="start">Sample size</text><text x="215" y="230" text-anchor="start">large n (or any n if</text><text x="215" y="248" text-anchor="start">population normal)</text><text x="483" y="230" text-anchor="start">small or moderate n</text><path class="grid" d="M30.00,258.00 L750.00,258.00"/><text x="44" y="284" class="bold" text-anchor="start">Test statistic</text><text x="215" y="284" text-anchor="start">z = (x̄ - μ0)/(σ/√n)</text><text x="483" y="284" text-anchor="start">t = (x̄ - μ0)/(s/√n)</text><path class="grid" d="M30.00,312.00 L750.00,312.00"/><text x="44" y="338" class="bold" text-anchor="start">Tails</text><text x="215" y="338" text-anchor="start">thinner</text><text x="483" y="338" text-anchor="start">thicker (more conservative</text><text x="483" y="356" text-anchor="start">for small n)</text><path class="grid" d="M30.00,366.00 L750.00,366.00"/><text x="44" y="392" class="bold" text-anchor="start">School example</text><text x="215" y="392" text-anchor="start">district mean with</text><text x="215" y="410" text-anchor="start">known district SD</text><text x="483" y="392" text-anchor="start">small class with only</text><text x="483" y="410" text-anchor="start">the sample SD</text><path class="grid" d="M30.00,420.00 L750.00,420.00"/><path class="grid" d="M200.00,57.00 L200.00,420.00"/><path class="grid" d="M468.00,57.00 L468.00,420.00"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
