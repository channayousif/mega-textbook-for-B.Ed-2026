<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A summary table for the z-test: null hypothesis μ = 68, alternative μ &gt; 68, α = 0.05, sample mean 71.5, n = 40, population standard deviation 12, standard error 1.90, test statistic z = 1.84, p-value 0.0329, decision to reject the null hypothesis.</title><desc id="d">A summary table for the z-test: null hypothesis μ = 68, alternative μ &gt; 68, α = 0.05, sample mean 71.5, n = 40, population standard deviation 12, standard error 1.90, test statistic z = 1.84, p-value 0.0329, decision to reject the null hypothesis.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{font-size:14px;fill:var(--ink)}.h{font-size:16px;font-weight:700}.wm{font-size:11px;fill:var(--wm)}.bg{fill:var(--bg)}.axis{stroke:var(--ink);stroke-width:1.5;fill:none}.curve{stroke:var(--a1);stroke-width:2.5;fill:none}.tc{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none}.dash{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;fill:none}.lead{stroke:var(--muted);stroke-width:1;fill:none}.grid{stroke:var(--ink);stroke-width:1;opacity:.22;fill:none}.tint{fill:var(--a1-fill)}.bold{font-weight:700}</style><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7"><rect width="7" height="7" fill="var(--a1-fill)"/><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="var(--a1)" stroke-width="1"/></pattern><pattern id="dots" patternUnits="userSpaceOnUse" width="6" height="6"><rect width="6" height="6" fill="var(--a2-fill)"/><circle cx="3" cy="3" r="1" fill="var(--a2)"/></pattern></defs><rect class="bg" width="780" height="470"/><text x="30" y="32" class="h" text-anchor="start">Worked z-test: the Sukkur math class</text><rect class="tint" x="30" y="54" width="720" height="30"/><text x="44" y="75" class="h" text-anchor="start">Step</text><text x="272" y="75" class="h" text-anchor="start">Value</text><path class="grid" d="M30.00,84.00 L750.00,84.00"/><text x="44" y="105" text-anchor="start">Null hypothesis</text><text x="272" y="105" text-anchor="start">H0: μ = 68</text><path class="grid" d="M30.00,115.00 L750.00,115.00"/><text x="44" y="136" text-anchor="start">Alternative hypothesis</text><text x="272" y="136" text-anchor="start">H1: μ &gt; 68 (right-tailed)</text><path class="grid" d="M30.00,146.00 L750.00,146.00"/><text x="44" y="167" text-anchor="start">Significance level</text><text x="272" y="167" text-anchor="start">α = 0.05</text><path class="grid" d="M30.00,177.00 L750.00,177.00"/><text x="44" y="198" text-anchor="start">Sample</text><text x="272" y="198" text-anchor="start">x̄ = 71.5, n = 40</text><path class="grid" d="M30.00,208.00 L750.00,208.00"/><text x="44" y="229" text-anchor="start">Population SD</text><text x="272" y="229" text-anchor="start">σ = 12</text><path class="grid" d="M30.00,239.00 L750.00,239.00"/><text x="44" y="260" text-anchor="start">Standard error</text><text x="272" y="260" text-anchor="start">12/√40 = 1.90</text><path class="grid" d="M30.00,270.00 L750.00,270.00"/><text x="44" y="291" text-anchor="start">Test statistic</text><text x="272" y="291" text-anchor="start">z = (71.5 - 68)/1.90 = 1.84</text><path class="grid" d="M30.00,301.00 L750.00,301.00"/><text x="44" y="322" text-anchor="start">p-value</text><text x="272" y="322" text-anchor="start">0.0329</text><rect class="tint" x="30" y="332" width="720" height="31"/><path class="grid" d="M30.00,332.00 L750.00,332.00"/><text x="44" y="353" class="bold" text-anchor="start">Decision</text><text x="272" y="353" class="bold" text-anchor="start">reject H0 (p ≤ α)</text><path class="grid" d="M30.00,363.00 L750.00,363.00"/><text x="44" y="384" text-anchor="start">Conclusion</text><text x="272" y="384" text-anchor="start">Enough evidence that the class mean exceeds</text><text x="272" y="402" text-anchor="start">the district mean of 68.</text><path class="grid" d="M30.00,412.00 L750.00,412.00"/><path class="grid" d="M258.00,54.00 L258.00,412.00"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
