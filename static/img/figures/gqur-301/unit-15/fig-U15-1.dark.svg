<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The hypothesis testing process</title><desc id="d">A flowchart showing the five steps of a hypothesis test in order: state hypotheses, choose significance level, compute the test statistic, find the p-value, and decide whether to reject the null hypothesis by comparing the p-value with the significance level.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.box{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:1.5}.diamond{fill:var(--a3-fill);stroke:var(--a3);stroke-width:1.5}.yes-line{fill:none;stroke:var(--a3);stroke-width:1.5}.no-line{fill:none;stroke:var(--a2);stroke-width:1.5}.reject{fill:var(--a3-fill);stroke:var(--a3);stroke-width:1.5}.keep{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}.wm{fill:var(--wm);font-size:7px}</style><rect class="bg" width="600" height="360"/><text x="300" y="20" font-size="14" font-weight="bold" text-anchor="middle">The hypothesis testing process</text><rect class="box" x="210" y="35" width="180" height="32" rx="6"/><text x="300" y="55" font-size="12" text-anchor="middle">1. State H₀ and H₁</text><line class="line" x1="300" y1="67" x2="300" y2="78"/><rect class="box" x="210" y="78" width="180" height="32" rx="6"/><text x="300" y="98" font-size="12" text-anchor="middle">2. Choose α (significance)</text><line class="line" x1="300" y1="110" x2="300" y2="121"/><rect class="box" x="210" y="121" width="180" height="32" rx="6"/><text x="300" y="141" font-size="12" text-anchor="middle">3. Compute test statistic</text><line class="line" x1="300" y1="153" x2="300" y2="164"/><rect class="box" x="210" y="164" width="180" height="32" rx="6"/><text x="300" y="184" font-size="12" text-anchor="middle">4. Find the p-value</text><line class="line" x1="300" y1="196" x2="300" y2="214"/><polygon class="diamond" points="300,214 375,248 300,282 225,248"/><text x="300" y="244" font-size="10" text-anchor="middle">p ≤ α</text><text x="300" y="257" font-size="10" text-anchor="middle">?</text><line class="yes-line" x1="375" y1="248" x2="470" y2="248"/><text x="422" y="240" font-size="9" text-anchor="middle">Yes</text><rect class="reject" x="470" y="234" width="110" height="28" rx="6"/><text x="525" y="253" font-size="11" text-anchor="middle">Reject H₀</text><line class="no-line" x1="300" y1="282" x2="300" y2="300"/><text x="312" y="296" font-size="9">No</text><rect class="keep" x="225" y="300" width="150" height="22" rx="6"/><text x="300" y="316" font-size="10" text-anchor="middle">Do not reject H₀</text><text class="wm" x="595" y="352" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
