<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فروضی جانچ کا طریقہ کار</title><desc id="d">ایک فلوچارٹ جو فروضی جانچ کے پانچ قدم ترتیب سے دکھاتا ہے: فروضیں بیان کریں، اہمیت کی سطح منتخب کریں، جانچ شماریات معلوم کریں، پی-قدر تلاش کریں، اور پی-قدر کا اہمیت کی سطح سے موازنہ کرکے فیصلہ کریں کہ عدم فروض کو خارج کیا جائے یا نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.box{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:1.5}.diamond{fill:var(--a3-fill);stroke:var(--a3);stroke-width:1.5}.yes-line{fill:none;stroke:var(--a3);stroke-width:1.5}.no-line{fill:none;stroke:var(--a2);stroke-width:1.5}.reject{fill:var(--a3-fill);stroke:var(--a3);stroke-width:1.5}.keep{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}.wm{fill:var(--wm);font-size:7px}</style><rect class="bg" width="600" height="360"/><text x="300" y="20" font-size="14" font-weight="bold" text-anchor="middle">فروضی جانچ کا طریقہ کار</text><rect class="box" x="210" y="35" width="180" height="32" rx="6"/><text x="300" y="55" font-size="12" text-anchor="middle">1۔ H₀ اور H₁ بیان کریں</text><line class="line" x1="300" y1="67" x2="300" y2="78"/><rect class="box" x="210" y="78" width="180" height="32" rx="6"/><text x="300" y="98" font-size="12" text-anchor="middle">2۔ اہمیت کی سطح α چنیں</text><line class="line" x1="300" y1="110" x2="300" y2="121"/><rect class="box" x="210" y="121" width="180" height="32" rx="6"/><text x="300" y="141" font-size="12" text-anchor="middle">3۔ جانچ شماریات نکالیں</text><line class="line" x1="300" y1="153" x2="300" y2="164"/><rect class="box" x="210" y="164" width="180" height="32" rx="6"/><text x="300" y="184" font-size="12" text-anchor="middle">4۔ پی-قدر معلوم کریں</text><line class="line" x1="300" y1="196" x2="300" y2="214"/><polygon class="diamond" points="300,214 225,248 300,282 375,248"/><text x="300" y="244" font-size="10" text-anchor="middle">p ≤ α</text><text x="300" y="257" font-size="10" text-anchor="middle">?</text><line class="yes-line" x1="225" y1="248" x2="130" y2="248"/><text x="178" y="240" font-size="9" text-anchor="middle">ہاں</text><rect class="reject" x="20" y="234" width="110" height="28" rx="6"/><text x="75" y="253" font-size="11" text-anchor="middle">H₀ خارج کریں</text><line class="no-line" x1="300" y1="282" x2="300" y2="300"/><text x="288" y="296" font-size="9" text-anchor="end">نہیں</text><rect class="keep" x="225" y="300" width="150" height="22" rx="6"/><text x="300" y="316" font-size="10" text-anchor="middle">H₀ خارج نہ کریں</text><text class="wm" x="5" y="352" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
