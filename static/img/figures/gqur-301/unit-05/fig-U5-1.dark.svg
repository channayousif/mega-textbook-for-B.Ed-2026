<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Finding the mode</title><desc id="d">Left: a bar chart of favourite subjects in a class of 30 with the Maths bar highlighted as the mode. Right: a dot plot of ten marks in which 5 and 8 each occur three times, so the data are bimodal.</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">Finding the mode: the most frequent value</text>
  <rect x="20" y="44" width="360" height="270" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="200" y="64">Favourite subject, class of 30</text>
  <rect class="b2" x="52" y="158" width="44" height="112"/>
  <text class="m c" x="74" y="152">8</text>
  <text class="m c" x="74" y="288">Urdu</text>
  <rect class="b3" x="116" y="102" width="44" height="168"/>
  <text class="m c" x="138" y="96">12</text>
  <text class="m c" x="138" y="288">Maths</text>
  <rect class="b2" x="180" y="186" width="44" height="84"/>
  <text class="m c" x="202" y="180">6</text>
  <text class="m c" x="202" y="288">Science</text>
  <rect class="b2" x="244" y="228" width="44" height="42"/>
  <text class="m c" x="266" y="222">3</text>
  <text class="m c" x="266" y="288">English</text>
  <rect class="b2" x="308" y="256" width="44" height="14"/>
  <text class="m c" x="330" y="250">1</text>
  <text class="m c" x="330" y="288">Soc. St.</text>
  <line class="line" x1="44" y1="270" x2="364" y2="270"/>
  <text class="sh c" x="138" y="302">Mode = Maths (12 pupils)</text>
  <rect x="400" y="44" width="360" height="270" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="580" y="64">Marks out of 10, ten pupils</text>
  <circle cx="480" cy="250" r="8" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="530" cy="250" r="8" fill="var(--bg)" stroke="var(--a3)" stroke-width="2"/>
  <circle cx="530" cy="228" r="8" fill="var(--bg)" stroke="var(--a3)" stroke-width="2"/>
  <circle cx="530" cy="206" r="8" fill="var(--bg)" stroke="var(--a3)" stroke-width="2"/>
  <circle cx="580" cy="250" r="8" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="630" cy="250" r="8" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/>
  <circle cx="680" cy="250" r="8" fill="var(--bg)" stroke="var(--a3)" stroke-width="2"/>
  <circle cx="680" cy="228" r="8" fill="var(--bg)" stroke="var(--a3)" stroke-width="2"/>
  <circle cx="680" cy="206" r="8" fill="var(--bg)" stroke="var(--a3)" stroke-width="2"/>
  <circle cx="730" cy="250" r="8" fill="var(--bg)" stroke="var(--a2)" stroke-width="2"/>
  <line class="line" x1="430" y1="266" x2="750" y2="266"/>
  <text class="m c" x="430" y="284">3</text>
  <text class="m c" x="480" y="284">4</text>
  <text class="m c" x="530" y="284">5</text>
  <text class="m c" x="580" y="284">6</text>
  <text class="m c" x="630" y="284">7</text>
  <text class="m c" x="680" y="284">8</text>
  <text class="m c" x="730" y="284">9</text>
  <text class="sh c" x="580" y="302">Bimodal: modes 5 and 8</text>
  <rect x="20" y="330" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="350">Caption: The mode is read off the tallest bar or the tallest stack</text>
  <text class="m" x="36" y="366">Left: unordered categories have no mean or median, but they do have a mode. Right: two values</text>
  <text class="m" x="36" y="382">tie for the highest count (3 each), so the data have two modes. If every value occurred equally</text>
  <text class="m" x="36" y="398">often there would be no mode at all. Credit: textbook.com.pk after Lane (2023).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
