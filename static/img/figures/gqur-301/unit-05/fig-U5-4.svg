<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Mean, median and mode compared</title><desc id="d">A table comparing mean, median and mode on five properties: uses every value, pulled by outliers, works for unordered categories, works for ranked categories, and always exactly one value.</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">Mean, median and mode compared</text>
  <rect x="40" y="46" width="290" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="52" y="73">Property</text>
  <rect x="330" y="46" width="140" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="400" y="73">Mean</text>
  <rect x="470" y="46" width="140" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="540" y="73">Median</text>
  <rect x="610" y="46" width="130" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="675" y="73">Mode</text>
  <rect x="40" y="90" width="290" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="52" y="117">Uses every value</text>
  <rect x="330" y="90" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="400" y="117">Yes</text>
  <rect x="470" y="90" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="117">No</text>
  <rect x="610" y="90" width="130" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="117">No</text>
  <rect x="40" y="134" width="290" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="52" y="161">Pulled by outliers</text>
  <rect x="330" y="134" width="140" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="400" y="161">Strongly</text>
  <rect x="470" y="134" width="140" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="161">Very little</text>
  <rect x="610" y="134" width="130" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="161">No</text>
  <rect x="40" y="178" width="290" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="52" y="205">Unordered categories</text>
  <rect x="330" y="178" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="400" y="205">No</text>
  <rect x="470" y="178" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="205">No</text>
  <rect x="610" y="178" width="130" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="205">Yes</text>
  <rect x="40" y="222" width="290" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="52" y="249">Ranked categories (grades A-E)</text>
  <rect x="330" y="222" width="140" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="400" y="249">No</text>
  <rect x="470" y="222" width="140" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="249">Yes</text>
  <rect x="610" y="222" width="130" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="249">Yes</text>
  <rect x="40" y="266" width="290" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="52" y="293">Always exactly one value</text>
  <rect x="330" y="266" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="400" y="293">Yes</text>
  <rect x="470" y="266" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="293">Yes</text>
  <rect x="610" y="266" width="130" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="293">No</text>
  <rect x="20" y="330" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="350">Caption: Each measure trades something for something else</text>
  <text class="m" x="36" y="366">The mean uses all the information but an extreme value drags it. The median ignores how far the</text>
  <text class="m" x="36" y="382">extremes lie, so it stays put. Only the mode works for unordered categories, but it may not be unique.</text>
  <text class="m" x="36" y="398">Credit: textbook.com.pk after Lane (2023) and Illowsky and Dean (2023).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
