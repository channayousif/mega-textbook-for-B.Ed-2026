<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Finding the mode in different kinds of data</title><desc id="d">A table showing how to find the mode for unordered categories (Maths), ungrouped numbers (9), two values tying (5 and 8, bimodal), every value occurring equally often (no mode) and grouped data (modal class 10-19).</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">Finding the mode in different kinds of data</text>
  <rect x="40" y="46" width="210" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="52" y="73">Data</text>
  <rect x="250" y="46" width="310" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="262" y="73">Example</text>
  <rect x="560" y="46" width="180" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="572" y="73">Mode</text>
  <rect x="40" y="90" width="210" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="52" y="117">Unordered categories</text>
  <rect x="250" y="90" width="310" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="262" y="117">Urdu 8, Maths 12, Science 6</text>
  <rect x="560" y="90" width="180" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="572" y="117">Maths</text>
  <rect x="40" y="134" width="210" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="52" y="161">Ungrouped numbers</text>
  <rect x="250" y="134" width="310" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="262" y="161">shoe sizes 7, 8, 8, 9, 9, 9, 10</text>
  <rect x="560" y="134" width="180" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="572" y="161">9</text>
  <rect x="40" y="178" width="210" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="52" y="205">Two values tie</text>
  <rect x="250" y="178" width="310" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="262" y="205">4, 5, 5, 5, 6, 7, 8, 8, 8, 9</text>
  <rect x="560" y="178" width="180" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="572" y="205">5 and 8 (bimodal)</text>
  <rect x="40" y="222" width="210" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="52" y="249">Every value equally often</text>
  <rect x="250" y="222" width="310" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="262" y="249">2, 4, 6, 8</text>
  <rect x="560" y="222" width="180" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="572" y="249">no mode</text>
  <rect x="40" y="266" width="210" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="52" y="293">Grouped data</text>
  <rect x="250" y="266" width="310" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m" x="262" y="293">0-9: 3, 10-19: 8, 20-29: 5 pupils</text>
  <rect x="560" y="266" width="180" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="572" y="293">modal class 10-19</text>
  <rect x="20" y="330" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="350">Caption: The same rule, the highest count, works for every kind of data</text>
  <text class="m" x="36" y="366">Unlike the mean and median, a data set can have one mode, several modes or none. For grouped</text>
  <text class="m" x="36" y="382">data we name the modal class, the interval with the highest frequency, rather than one value.</text>
  <text class="m" x="36" y="398">Credit: textbook.com.pk after Lane (2023) and Illowsky and Dean (2023).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
