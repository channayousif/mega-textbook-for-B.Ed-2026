<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مختلف اقسام کے ڈیٹا میں عادہ تلاش کرنا</title><desc id="d">ایک جدول جو بے ترتیب اقسام (میتھس)، غیر گروپ شدہ نمبر (9)، دو قیمتوں کے برابر آنا (5 اور 8، دو عادی)، ہر قیمت کے برابر آنا (کوئی عادہ نہیں) اور گروپ شدہ ڈیٹا (عادی جماعت 10-19) میں عادہ تلاش کرنے کا طریقہ دکھاتا ہے۔</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .s{text-anchor:end} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">مختلف اقسام کے ڈیٹا میں عادہ تلاش کرنا</text>
  <rect x="40" y="46" width="210" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh s" x="238" y="73">ڈیٹا</text>
  <rect x="250" y="46" width="310" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="405" y="73">مثال</text>
  <rect x="560" y="46" width="180" height="44" fill="var(--a2-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="650" y="73">عادہ</text>
  <rect x="40" y="90" width="210" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m s" x="238" y="117">بے ترتیب اقسام</text>
  <rect x="250" y="90" width="310" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="405" y="117">اردو 8، میتھس 12، سائنس 6</text>
  <rect x="560" y="90" width="180" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="650" y="117">میتھس</text>
  <rect x="40" y="134" width="210" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m s" x="238" y="161">غیر گروپ شدہ نمبر</text>
  <rect x="250" y="134" width="310" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="405" y="161">جوتے کے سائز 7, 8, 8, 9, 9, 9, 10</text>
  <rect x="560" y="134" width="180" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="650" y="161">9</text>
  <rect x="40" y="178" width="210" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m s" x="238" y="205">دو قیمتیں برابر</text>
  <rect x="250" y="178" width="310" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="405" y="205">4, 5, 5, 5, 6, 7, 8, 8, 8, 9</text>
  <rect x="560" y="178" width="180" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="650" y="205">5 اور 8 (دو عادی)</text>
  <rect x="40" y="222" width="210" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m s" x="238" y="249">ہر قیمت برابر آئے</text>
  <rect x="250" y="222" width="310" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="405" y="249">2, 4, 6, 8</text>
  <rect x="560" y="222" width="180" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="650" y="249">کوئی عادہ نہیں</text>
  <rect x="40" y="266" width="210" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m s" x="238" y="293">گروپ شدہ ڈیٹا</text>
  <rect x="250" y="266" width="310" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="405" y="293">0-9: 3، 10-19: 8، 20-29: 5 طلباء</text>
  <rect x="560" y="266" width="180" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh c" x="650" y="293">عادی جماعت 10-19</text>
  <rect x="20" y="330" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="744" y="350" text-anchor="end">نوٹ: ایک ہی اصول، سب سے زیادہ گنتی، ہر قسم کے ڈیٹا پر لاگو ہوتا ہے</text>
  <text class="m" x="744" y="366" text-anchor="end">اوسط اور میڈین کے برعکس، ڈیٹا سیٹ میں ایک عادہ، کئی عادیں یا کوئی عادہ نہیں ہو سکتا۔ گروپ شدہ</text>
  <text class="m" x="744" y="382" text-anchor="end">ڈیٹا کے لیے ہم عادی جماعت کا نام لیتے ہیں، سب سے زیادہ تعدد والا وقفہ، بجائے ایک قیمت کے۔</text>
  <text class="m" x="744" y="398" text-anchor="end">حوالہ: textbook.com.pk بمطابق Lane (2023) اور Illowsky and Dean (2023)۔</text>
  <text class="wm" x="760" y="460" direction="ltr" aria-hidden="true">textbook.com.pk</text>
</svg>