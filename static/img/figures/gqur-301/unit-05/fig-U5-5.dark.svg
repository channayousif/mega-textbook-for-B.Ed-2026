<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Which measure should I report?</title><desc id="d">A flowchart for choosing a measure of central tendency: unordered categories lead to the mode, ranked categories to the median, and numbers to a second question about outliers or strong skew, which leads to the median if yes and the mean if no.</desc><defs><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/>
  <text class="h c" x="390" y="28">Which measure should I report?</text>
  <rect class="b2" x="280" y="44" width="220" height="44" rx="6"/>
  <text class="sh c" x="390" y="64">What kind of data?</text>
  <line class="line" x1="330" y1="88" x2="120" y2="128" marker-end="url(#arr)"/>
  <line class="line" x1="390" y1="88" x2="390" y2="128" marker-end="url(#arr)"/>
  <line class="line" x1="450" y1="88" x2="650" y2="128" marker-end="url(#arr)"/>
  <rect class="b1" x="30" y="130" width="180" height="60" rx="6"/>
  <text class="sh c" x="120" y="150">Unordered categories</text>
  <text class="m c" x="120" y="166">e.g. favourite subject</text>
  <rect class="b1" x="300" y="130" width="180" height="60" rx="6"/>
  <text class="sh c" x="390" y="150">Ranked categories</text>
  <text class="m c" x="390" y="166">e.g. grades A-E</text>
  <rect class="b1" x="560" y="130" width="190" height="60" rx="6"/>
  <text class="sh c" x="655" y="150">Numbers</text>
  <text class="m c" x="655" y="166">e.g. marks, ages, incomes</text>
  <line class="line" x1="120" y1="190" x2="120" y2="226" marker-end="url(#arr)"/>
  <line class="line" x1="390" y1="190" x2="390" y2="226" marker-end="url(#arr)"/>
  <line class="line" x1="655" y1="190" x2="655" y2="214" marker-end="url(#arr)"/>
  <rect class="b3" x="30" y="228" width="180" height="44" rx="6"/>
  <text class="sh c" x="120" y="248">Report the mode</text>
  <rect class="b3" x="300" y="228" width="180" height="44" rx="6"/>
  <text class="sh c" x="390" y="248">Report the median</text>
  <rect class="b2" x="560" y="216" width="190" height="44" rx="6"/>
  <text class="sh c" x="655" y="236">Outliers or strong skew?</text>
  <line class="line" x1="620" y1="260" x2="540" y2="292" marker-end="url(#arr)"/>
  <line class="line" x1="690" y1="260" x2="690" y2="292" marker-end="url(#arr)"/>
  <text class="m c" x="566" y="272">yes</text>
  <text class="m c" x="704" y="280">no</text>
  <rect class="b3" x="460" y="294" width="150" height="44" rx="6"/>
  <text class="sh c" x="535" y="314">Report the median</text>
  <rect class="b3" x="620" y="294" width="140" height="44" rx="6"/>
  <text class="sh c" x="690" y="314">Report the mean</text>
  <rect x="20" y="352" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh" x="36" y="372">Caption: Data type first, then shape, then the question</text>
  <text class="m" x="36" y="388">Whatever the route, check the question being asked: 'most common' needs the mode, 'typical middle'</text>
  <text class="m" x="36" y="404">needs the median, 'shared out equally' needs the mean. When the mean and median differ, reporting</text>
  <text class="m" x="36" y="420">both tells the reader about the shape. Credit: textbook.com.pk after Lane (2023).</text>
  <text class="wm" x="760" y="460" aria-hidden="true">textbook.com.pk</text>
</svg>
