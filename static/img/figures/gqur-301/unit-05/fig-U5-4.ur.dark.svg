  <text class="m c" x="400" y="205">نہیں</text>
  <rect x="470" y="178" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="205">نہیں</text>
  <rect x="610" y="178" width="130" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="205">ہاں</text>
  <rect x="40" y="222" width="290" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh s" x="318" y="249">درجہ بندی والے اقسام (درجات A-E)</text>
  <rect x="330" y="222" width="140" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="400" y="249">نہیں</text>
  <rect x="470" y="222" width="140" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="249">ہاں</text>
  <rect x="610" y="222" width="130" height="44" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="249">ہاں</text>
  <rect x="40" y="266" width="290" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="sh s" x="318" y="293">ہمیشہ بالکل ایک قیمت</text>
  <rect x="330" y="266" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="400" y="293">ہاں</text>
  <rect x="470" y="266" width="140" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="540" y="293">ہاں</text>
  <rect x="610" y="266" width="130" height="44" fill="var(--a1-fill)" stroke="var(--line)" stroke-width="1"/>
  <text class="m c" x="675" y="293">نہیں</text>
  <rect x="20" y="330" width="740" height="78" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
   <text class="sh" x="744" y="350" text-anchor="start">نوٹ: ہر پیمائش کچھ قیمت کچھ اور کے بدلے میں لیتی ہے</text>
   <text class="m" x="744" y="366" text-anchor="start">اوسط تمام معلومات استعمال کرتی ہے مگر ایک انتہائی قیمت اسے کھینچ لیتی ہے۔ میڈین انتہا کی</text>
   <text class="m" x="744" y="382" text-anchor="start">دوری کو نظرانداز کرتی ہے، لہٰدا ٹھیک رہتی ہے۔ صرف عادہ بے ترتیب اقسام کے لیے کام کرتی ہے،</text>
   <text class="m" x="744" y="398" text-anchor="start">مگر یکتا ضرور نہیں ہوتی۔ حوالہ: textbook.com.pk بمطابق Lane (2023) اور Illowsky and Dean (2023)۔</text>
  <text class="wm" x="760" y="460" direction="ltr" aria-hidden="true">textbook.com.pk</text>
</svg>