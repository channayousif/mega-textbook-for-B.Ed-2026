<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d"><title id="t">Chart-type selection guide</title><desc id="d">Table with rows for bar chart, histogram, and pie chart, comparing the data type each requires, what each emphasizes, and when to choose it, with school examples.</desc>
  <defs>
    <style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style>
  </defs>

  <text x="760" y="460" class="wm" aria-hidden="true">textbook.com.pk</text>
  <text x="30" y="30" class="title">Chart-type selection guide</text>

  <!-- Header -->
  <rect x="30" y="45" width="720" height="28" rx="4" class="header-bg"/>
  <line x1="150" y1="45" x2="150" y2="73" class="border"/>
  <line x1="340" y1="45" x2="340" y2="73" class="border"/>
  <line x1="500" y1="45" x2="500" y2="73" class="border"/>
  <text x="90" y="64" text-anchor="middle" class="header">Chart type</text>
  <text x="245" y="64" text-anchor="middle" class="header">Data type required</text>
  <text x="420" y="64" text-anchor="middle" class="header">What it emphasizes</text>
  <text x="610" y="64" text-anchor="middle" class="header">When to choose it</text>

  <!-- Row 1: Bar chart -->
  <rect x="30" y="73" width="720" height="55" class="row-bg-1"/>
  <line x1="150" y1="73" x2="150" y2="128" class="border"/>
  <line x1="340" y1="73" x2="340" y2="128" class="border"/>
  <line x1="500" y1="73" x2="500" y2="128" class="border"/>
  <text x="90" y="98" text-anchor="middle" class="row-label">Bar chart</text>
  <text x="245" y="98" text-anchor="middle" class="cell">Qualitative or discrete</text>
  <text x="245" y="113" text-anchor="middle" class="cell">categories</text>
  <text x="420" y="98" text-anchor="middle" class="cell">Comparing the size of</text>
  <text x="420" y="113" text-anchor="middle" class="cell">one category vs another</text>
  <text x="610" y="98" text-anchor="middle" class="cell">Order does not matter;</text>
  <text x="610" y="113" text-anchor="middle" class="cell">want to compare sizes</text>

  <!-- Row 2: Histogram -->
  <rect x="30" y="128" width="720" height="55" class="row-bg-2"/>
  <line x1="150" y1="128" x2="150" y2="183" class="border"/>
  <line x1="340" y1="128" x2="340" y2="183" class="border"/>
  <line x1="500" y1="128" x2="500" y2="183" class="border"/>
  <text x="90" y="153" text-anchor="middle" class="row-label">Histogram</text>
  <text x="245" y="153" text-anchor="middle" class="cell">Quantitative (grouped</text>
  <text x="245" y="168" text-anchor="middle" class="cell">into intervals)</text>
  <text x="420" y="153" text-anchor="middle" class="cell">The shape of the</text>
  <text x="420" y="168" text-anchor="middle" class="cell">distribution</text>
  <text x="610" y="153" text-anchor="middle" class="cell">Want to see where data</text>
  <text x="610" y="168" text-anchor="middle" class="cell">clusters and spreads</text>

  <!-- Row 3: Pie chart -->
  <rect x="30" y="183" width="720" height="55" class="row-bg-1"/>
  <line x1="150" y1="183" x2="150" y2="238" class="border"/>
  <line x1="340" y1="183" x2="340" y2="238" class="border"/>
  <line x1="500" y1="183" x2="500" y2="238" class="border"/>
  <text x="90" y="208" text-anchor="middle" class="row-label">Pie chart</text>
  <text x="245" y="208" text-anchor="middle" class="cell">Qualitative (few</text>
  <text x="245" y="223" text-anchor="middle" class="cell">categories)</text>
  <text x="420" y="208" text-anchor="middle" class="cell">Proportions of a</text>
  <text x="420" y="223" text-anchor="middle" class="cell">meaningful whole</text>
  <text x="610" y="208" text-anchor="middle" class="cell">Want to show parts of a</text>
  <text x="610" y="223" text-anchor="middle" class="cell">whole (5 categories max)</text>

  <!-- Examples box -->
  <rect x="30" y="255" width="720" height="130" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="1"/>
  <text x="50" y="280" class="cell" font-weight="600">School examples:</text>
  <text x="50" y="300" class="cell">Bar chart: number of pupils preferring each sport (categories: cricket, football, hockey, athletics).</text>
  <text x="50" y="320" class="cell">Histogram: distribution of test marks from 0 to 100 grouped into intervals of 10.</text>
  <text x="50" y="340" class="cell">Pie chart: how the school budget is divided among 5 categories (salaries, materials, maintenance, transport, events).</text>
  <text x="50" y="365" class="cell" font-weight="600">Rule of thumb:</text>
  <text x="50" y="380" class="cell">Bar chart for comparing | Histogram for distribution shape | Pie chart for proportions of a whole.</text>

  <!-- Caption -->
  <text x="30" y="410" class="caption">Caption: Chart-type selection guide with data requirements and school examples. Credit: textbook.com.pk.</text>
</svg>
