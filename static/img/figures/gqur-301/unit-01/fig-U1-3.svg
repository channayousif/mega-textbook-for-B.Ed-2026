<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d"><title id="t">Primary vs secondary data sources</title><desc id="d">A diagram showing data flowing from an origin to a user, with primary source (direct collection) on the left and secondary source (existing record) on the right, each with examples.</desc>
  <defs>
    <style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style>
  </defs>

  <text x="760" y="460" class="wm" aria-hidden="true">textbook.com.pk</text>
  <text x="30" y="30" class="title">Primary vs secondary data sources</text>

  <!-- LEFT: Primary source flow -->
  <rect x="30" y="50" width="340" height="320" rx="8" class="primary-box"/>
  <text x="200" y="80" text-anchor="middle" class="label" font-size="15px">Primary source</text>
  <text x="200" y="100" text-anchor="middle" class="sublabel">You collect it yourself</text>

  <!-- Origin -->
  <rect x="60" y="120" width="120" height="50" rx="6" class="origin-box"/>
  <text x="120" y="145" text-anchor="middle" class="sublabel">Origin:</text>
  <text x="120" y="162" text-anchor="middle" class="example">Pupils, parents,</text>
  <text x="120" y="175" text-anchor="middle" class="example">your own class</text>

  <!-- Arrow down -->
  <line x1="120" y1="175" x2="120" y2="210" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Collection method -->
  <rect x="60" y="210" width="120" height="55" rx="6" class="origin-box"/>
  <text x="120" y="232" text-anchor="middle" class="sublabel">You collect via:</text>
  <text x="120" y="248" text-anchor="middle" class="example">questionnaire,</text>
  <text x="120" y="262" text-anchor="middle" class="example">count, interview</text>

  <!-- Arrow down -->
  <line x1="120" y1="265" x2="120" y2="300" class="arrow"/>

  <!-- User -->
  <rect x="60" y="300" width="120" height="45" rx="6" class="origin-box"/>
  <text x="120" y="322" text-anchor="middle" class="sublabel">User:</text>
  <text x="120" y="338" text-anchor="middle" class="example">You (the teacher)</text>

  <!-- Strength/weakness -->
  <rect x="200" y="120" width="150" height="80" rx="4" fill="var(--panel)" stroke="var(--line)" stroke-width="0.8"/>
  <text x="275" y="142" text-anchor="middle" class="sublabel">Strength:</text>
  <text x="275" y="160" text-anchor="middle" class="example">Control, relevance</text>
  <text x="275" y="180" text-anchor="middle" class="sublabel">Weakness:</text>
  <text x="275" y="196" text-anchor="middle" class="example">Time, effort</text>

  <!-- RIGHT: Secondary source flow -->
  <rect x="410" y="50" width="340" height="320" rx="8" class="secondary-box"/>
  <text x="580" y="80" text-anchor="middle" class="label" font-size="15px">Secondary source</text>
  <text x="580" y="100" text-anchor="middle" class="sublabel">Someone else collected it</text>

  <!-- Origin -->
  <rect x="440" y="120" width="120" height="50" rx="6" class="origin-box"/>
  <text x="500" y="145" text-anchor="middle" class="sublabel">Origin:</text>
  <text x="500" y="162" text-anchor="middle" class="example">Govt, PBS,</text>
  <text x="500" y="175" text-anchor="middle" class="example">school records</text>

  <!-- Arrow down -->
  <line x1="500" y1="175" x2="500" y2="210" class="arrow"/>

  <!-- Collection method -->
  <rect x="440" y="210" width="120" height="55" rx="6" class="origin-box"/>
  <text x="500" y="232" text-anchor="middle" class="sublabel">Collected via:</text>
  <text x="500" y="248" text-anchor="middle" class="example">census, register,</text>
  <text x="500" y="262" text-anchor="middle" class="example">published report</text>

  <!-- Arrow down -->
  <line x1="500" y1="265" x2="500" y2="300" class="arrow"/>

  <!-- User -->
  <rect x="440" y="300" width="120" height="45" rx="6" class="origin-box"/>
  <text x="500" y="322" text-anchor="middle" class="sublabel">User:</text>
  <text x="500" y="338" text-anchor="middle" class="example">You (find &amp; use)</text>

  <!-- Strength/weakness -->
  <rect x="580" y="120" width="150" height="80" rx="4" fill="var(--panel)" stroke="var(--line)" stroke-width="0.8"/>
  <text x="655" y="142" text-anchor="middle" class="sublabel">Strength:</text>
  <text x="655" y="160" text-anchor="middle" class="example">Speed, low cost</text>
  <text x="655" y="180" text-anchor="middle" class="sublabel">Weakness:</text>
  <text x="655" y="196" text-anchor="middle" class="example">Limited relevance</text>

  <!-- Caption -->
  <text x="30" y="400" class="caption">Caption: Primary sources are collected by you for your purpose; secondary sources already exist.</text>
  <text x="30" y="420" class="caption">Credit: textbook.com.pk based on Illowsky et al. (2020).</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/>
    </marker>
  </defs>
</svg>
