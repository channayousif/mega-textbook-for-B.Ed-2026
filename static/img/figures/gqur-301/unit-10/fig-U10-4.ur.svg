<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">غیر حاضر طلبہ کی تقسیم</title><desc id="d">50 دنوں میں غیر حاضر طلبہ کی تقسیم کا جدول۔ 0 سے 5 غیر حاضر طلبہ کے احتمالات بالترتیب 0.10، 0.24، 0.30، 0.20، 0.12 اور 0.04 ہیں۔ دونوں جانچوں پر درست کا نشان ہے: ہر احتمال 0 اور 1 کے درمیان ہے اور ان کا مجموعہ 1 ہے۔ آخری سطر ہر قدر کو اس کے احتمال سے ضرب دیتی ہے، جس سے روزانہ غیر حاضر طلبہ کی متوقع قدر 2.12 حاصل ہوتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="430"/><rect x="15" y="25" width="930" height="56" rx="8" class="panel"/><text x="932" y="61" font-size="18" text-anchor="end">x (غیر حاضر طلبہ)</text><text x="702" y="61" font-size="19" text-anchor="end">0</text><text x="602" y="61" font-size="19" text-anchor="end">1</text><text x="502" y="61" font-size="19" text-anchor="end">2</text><text x="402" y="61" font-size="19" text-anchor="end">3</text><text x="302" y="61" font-size="19" text-anchor="end">4</text><text x="202" y="61" font-size="19" text-anchor="end">5</text><text x="102" y="61" font-size="18" text-anchor="end">کل</text><rect x="15" y="83" width="930" height="56" rx="8" class="panel"/><text x="932" y="119" font-size="18" text-anchor="end">دن</text><text x="702" y="119" font-size="19" text-anchor="end">5</text><text x="602" y="119" font-size="19" text-anchor="end">12</text><text x="502" y="119" font-size="19" text-anchor="end">15</text><text x="402" y="119" font-size="19" text-anchor="end">10</text><text x="302" y="119" font-size="19" text-anchor="end">6</text><text x="202" y="119" font-size="19" text-anchor="end">2</text><text x="102" y="119" font-size="19" text-anchor="end">50</text><rect x="15" y="141" width="930" height="56" rx="8" class="panel"/><text x="932" y="177" font-size="19" text-anchor="end">P(X = x)</text><text x="702" y="177" font-size="19" text-anchor="end">0.10</text><text x="602" y="177" font-size="19" text-anchor="end">0.24</text><text x="502" y="177" font-size="19" text-anchor="end">0.30</text><text x="402" y="177" font-size="19" text-anchor="end">0.20</text><text x="302" y="177" font-size="19" text-anchor="end">0.12</text><text x="202" y="177" font-size="19" text-anchor="end">0.04</text><text x="102" y="177" font-size="19" text-anchor="end">1.00</text><rect x="15" y="199" width="930" height="56" rx="8" class="panel"/><text x="932" y="235" font-size="19" text-anchor="end">x × P(X = x)</text><text x="702" y="235" font-size="19" text-anchor="end">0</text><text x="602" y="235" font-size="19" text-anchor="end">0.24</text><text x="502" y="235" font-size="19" text-anchor="end">0.60</text><text x="402" y="235" font-size="19" text-anchor="end">0.60</text><text x="302" y="235" font-size="19" text-anchor="end">0.48</text><text x="202" y="235" font-size="19" text-anchor="end">0.20</text><text x="102" y="235" font-size="19" text-anchor="end">2.12</text><text x="935" y="306" font-size="20" text-anchor="end">✓ جانچ 1: ہر احتمال 0 اور 1 کے درمیان ہے</text><text x="935" y="345" font-size="20" text-anchor="end">✓ جانچ 2: احتمالات کا مجموعہ 1 ہے</text><text x="935" y="390" font-size="22" text-anchor="end">متوقع قدر: ⁦E(X) = 2.12⁩ غیر حاضر طلبہ روزانہ</text><text class="wm" x="12" y="423" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
