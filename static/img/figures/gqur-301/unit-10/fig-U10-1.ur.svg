<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصادفی متغیرات کا تصوری نقشہ</title><desc id="d">ایک تصوری نقشہ جس کے مرکز میں تصادفی متغیر ہے۔ ایک شاخ منفصل تصادفی متغیرات کی طرف جاتی ہے، جنہیں گنا جاتا ہے، جیسے غیر حاضر طلبہ، مختصر آزمائش کے نمبر اور بہن بھائیوں کی تعداد۔ دوسری شاخ مسلسل تصادفی متغیرات کی طرف جاتی ہے، جنہیں ناپا جاتا ہے، جیسے قد، پیدل چلنے کا وقت اور بستے کا وزن۔ ایک نوٹ بتاتا ہے کہ قریب ترین عدد تک لکھنے سے یہ مقداریں منفصل نہیں بن جاتیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="450"/><rect x="260" y="25" width="440" height="75" rx="8" class="panel"/><text x="480" y="55" font-size="22" text-anchor="middle">تصادفی متغیر</text><text x="480" y="83" font-size="17" text-anchor="middle">اتفاقی نتیجے کو دیا گیا عدد</text><path d="M600 100 L725 160" class="line"/><path d="M360 100 L235 160" class="line"/><rect x="505" y="160" width="430" height="215" rx="8" class="panel"/><text x="915" y="205" font-size="21" text-anchor="end">منفصل: گنتی</text><text x="915" y="244" font-size="17" text-anchor="end">الگ الگ قابل فہرست قدریں</text><text x="915" y="280" font-size="17" text-anchor="end">غیر حاضر طلبہ: 0، 1، 2، ... 40</text><text x="915" y="314" font-size="17" text-anchor="end">آزمائش میں درست جواب: 0 سے 10</text><text x="915" y="348" font-size="17" text-anchor="end">بہن بھائی: 0، 1، 2، ...</text><rect x="25" y="160" width="430" height="215" rx="8" class="panel"/><text x="435" y="205" font-size="21" text-anchor="end">مسلسل: پیمائش</text><text x="435" y="244" font-size="17" text-anchor="end">وقفے کی کوئی بھی قدر</text><text x="435" y="280" font-size="17" text-anchor="end">سینٹی میٹروں میں قد</text><text x="435" y="314" font-size="17" text-anchor="end">منٹوں میں پیدل چلنے کا وقت</text><text x="435" y="348" font-size="17" text-anchor="end">کلوگراموں میں بستے کا وزن</text><text x="480" y="413" font-size="18" text-anchor="middle">قریب ترین عدد تک لکھنے سے اصل مقدار نہیں بدلتی۔</text><text class="wm" x="12" y="443" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
