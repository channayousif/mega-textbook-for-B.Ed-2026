<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Two panels</title><desc id="d">Two panels. On the left, separate bars show the probability of 0 to 5 absentees, tallest at 2 absentees with probability 0.30. On the right, a smooth curve shows pupils' heights from 120 to 160 cm, where the probability of a height between 140 and 145 cm is the shaded area under the curve and the whole area equals 1.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="460"/><text x="245" y="35" font-size="22" text-anchor="middle">Discrete: number of absentees</text><text x="730" y="35" font-size="22" text-anchor="middle">Continuous: height</text><path d="M65,335 L450,335" class="line"/><path d="M65,335 L65,85" class="line"/><text x="65" y="65" font-size="17" text-anchor="start">Probability</text><rect x="88" y="265.0" width="32" height="70.0" class="bar"/><text x="104" y="360" font-size="18" text-anchor="middle">0</text><text x="104" y="255.0" font-size="15" text-anchor="middle">0.10</text><rect x="146" y="167.0" width="32" height="168.0" class="bar"/><text x="162" y="360" font-size="18" text-anchor="middle">1</text><text x="162" y="157.0" font-size="15" text-anchor="middle">0.24</text><rect x="204" y="125.0" width="32" height="210.0" class="bar"/><text x="220" y="360" font-size="18" text-anchor="middle">2</text><text x="220" y="115.0" font-size="15" text-anchor="middle">0.30</text><rect x="262" y="195.0" width="32" height="140.0" class="bar"/><text x="278" y="360" font-size="18" text-anchor="middle">3</text><text x="278" y="185.0" font-size="15" text-anchor="middle">0.20</text><rect x="320" y="251.0" width="32" height="84.0" class="bar"/><text x="336" y="360" font-size="18" text-anchor="middle">4</text><text x="336" y="241.0" font-size="15" text-anchor="middle">0.12</text><rect x="378" y="307.0" width="32" height="28.0" class="bar"/><text x="394" y="360" font-size="18" text-anchor="middle">5</text><text x="394" y="297.0" font-size="15" text-anchor="middle">0.04</text><text x="245" y="395" font-size="16" text-anchor="middle">Separate values; bar heights are probabilities</text><path d="M535,335 L925,335" class="line"/><path d="M535,335 L535,85" class="line"/><text x="540" y="65" font-size="17" text-anchor="start">Density (not probability)</text><path d="M730,335 L730,115.00 L732,115.05 L734,115.19 L736,115.44 L738,115.78 L740,116.22 L742,116.75 L744,117.38 L746,118.10 L748,118.91 L750,119.82 L752,120.82 L754,121.91 L756,123.09 L758,124.35 L760,125.70 L762,127.13 L764,128.65 L766,130.24 L768,131.91 L770,133.66 L772,135.48 L774,137.38 L776,139.34 L778,141.36 L778,335 Z" class="bar"/><path d="M540,305.23 L545,301.97 L550,298.45 L555,294.68 L560,290.63 L565,286.32 L570,281.73 L575,276.87 L580,271.75 L585,266.36 L590,260.73 L595,254.85 L600,248.74 L605,242.43 L610,235.93 L615,229.26 L620,222.46 L625,215.56 L630,208.58 L635,201.56 L640,194.55 L645,187.57 L650,180.68 L655,173.91 L660,167.30 L665,160.91 L670,154.78 L675,148.95 L680,143.45 L685,138.35 L690,133.66 L695,129.44 L700,125.70 L705,122.49 L710,119.82 L715,117.73 L720,116.22 L725,115.30 L730,115.00 L735,115.30 L740,116.22 L745,117.73 L750,119.82 L755,122.49 L760,125.70 L765,129.44 L770,133.66 L775,138.35 L780,143.45 L785,148.95 L790,154.78 L795,160.91 L800,167.30 L805,173.91 L810,180.68 L815,187.57 L820,194.55 L825,201.56 L830,208.58 L835,215.56 L840,222.46 L845,229.26 L850,235.93 L855,242.43 L860,248.74 L865,254