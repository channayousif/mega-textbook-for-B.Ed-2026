<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے چھ تصادفی متغیرات</title><desc id="d">اسکول کے چھ تصادفی متغیرات کا جدول۔ غیر حاضر طلبہ کی تعداد، مختصر آزمائش کے نمبر اور بہن بھائیوں کی تعداد گنی جاتی ہیں اور منفصل ہیں۔ قد، پیدل چلنے کا وقت اور عمر ناپے جاتے ہیں اور مسلسل ہیں، اگرچہ عمر عموماً مکمل سالوں میں درج کی جاتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="430"/><rect x="15" y="20" width="930" height="48" rx="8" class="panel"/><text x="930" y="51" font-size="17" text-anchor="end">تصادفی متغیر</text><text x="600" y="51" font-size="17" text-anchor="end">طریقہ</text><text x="460" y="51" font-size="17" text-anchor="end">ممکنہ قدریں</text><text x="180" y="51" font-size="17" text-anchor="end">قسم</text><rect x="15" y="70" width="930" height="48" rx="8" class="panel"/><text x="930" y="101" font-size="17" text-anchor="end">غیر حاضر طلبہ (40 کی جماعت)</text><text x="600" y="101" font-size="17" text-anchor="end">گنتی</text><text x="460" y="101" font-size="18" text-anchor="end">0, 1, ... 40</text><text x="180" y="101" font-size="17" text-anchor="end">منفصل</text><rect x="15" y="120" width="930" height="48" rx="8" class="panel"/><text x="930" y="151" font-size="17" text-anchor="end">آزمائش میں درست جواب</text><text x="600" y="151" font-size="17" text-anchor="end">گنتی</text><text x="460" y="151" font-size="18" text-anchor="end">0, 1, ... 10</text><text x="180" y="151" font-size="17" text-anchor="end">منفصل</text><rect x="15" y="170" width="930" height="48" rx="8" class="panel"/><text x="930" y="201" font-size="17" text-anchor="end">بہن بھائی</text><text x="600" y="201" font-size="17" text-anchor="end">گنتی</text><text x="460" y="201" font-size="18" text-anchor="end">0, 1, 2, ...</text><text x="180" y="201" font-size="17" text-anchor="end">منفصل</text><rect x="15" y="220" width="930" height="48" rx="8" class="panel"/><text x="930" y="251" font-size="17" text-anchor="end">قد (cm)</text><text x="600" y="251" font-size="17" text-anchor="end">پیمائش</text><text x="460" y="251" font-size="17" text-anchor="end">وقفے کی کوئی بھی قدر</text><text x="180" y="251" font-size="17" text-anchor="end">مسلسل</text><rect x="15" y="270" width="930" height="48" rx="8" class="panel"/><text x="930" y="301" font-size="17" text-anchor="end">پیدل چلنے کا وقت (منٹ)</text><text x="600" y="301" font-size="17" text-anchor="end">پیمائش</text><text x="460" y="301" font-size="17" text-anchor="end">وقفے کی کوئی بھی قدر</text><text x="180" y="301" font-size="17" text-anchor="end">مسلسل</text><rect x="15" y="320" width="930" height="48" rx="8" class="panel"/><text x="930" y="351" font-size="17" text-anchor="end">اصل عمر (سال)</text><text x="600" y="351" font-size="17" text-anchor="end">پیمائش</text><text x="460" y="351" font-size="17" text-anchor="end">کوئی بھی؛ اکثر قریب ترین عدد تک درج</text><text x="180" y="351" font-size="17" text-anchor="end">مسلسل</text><text x="935" y="398" font-size="17" text-anchor="end">رجسٹر میں مکمل سالوں میں درج عمر ایک منفصل متغیر ہے۔</text><text class="wm" x="12" y="423" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
