<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map with &quot;random variable&quot; at the centre</title><desc id="d">A concept map with ’random variable’ at the centre. One branch leads to discrete random variables, which are counted, such as absentees, quiz scores and siblings. The other leads to continuous random variables, which are measured, such as height, walking time and bag weight, with a note that rounding does not make them discrete.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="450"/><rect x="260" y="25" width="440" height="75" rx="8" class="panel"/><text x="480" y="55" font-size="23" text-anchor="middle">Random variable</text><text x="480" y="83" font-size="18" text-anchor="middle">A number assigned to a chance outcome</text><path d="M360,100 L235,160" class="line"/><path d="M600,100 L725,160" class="line"/><rect x="25" y="160" width="430" height="215" rx="8" class="panel"/><text x="45" y="195" font-size="24" text-anchor="start">Discrete: counts</text><text x="45" y="233" font-size="18" text-anchor="start">Separate values you can list</text><text x="45" y="267" font-size="18" text-anchor="start">Absentees: 0, 1, 2, ... 40</text><text x="45" y="301" font-size="18" text-anchor="start">Correct quiz answers: 0 to 10</text><text x="45" y="335" font-size="18" text-anchor="start">Siblings: 0, 1, 2, ...</text><rect x="505" y="160" width="430" height="215" rx="8" class="panel"/><text x="525" y="195" font-size="24" text-anchor="start">Continuous: measurements</text><text x="525" y="233" font-size="18" text-anchor="start">Any value in an interval</text><text x="525" y="267" font-size="18" text-anchor="start">Height in centimetres</text><text x="525" y="301" font-size="18" text-anchor="start">Walking time in minutes</text><text x="525" y="335" font-size="18" text-anchor="start">Bag weight in kilograms</text><text x="480" y="413" font-size="19" text-anchor="middle">Rounding a measurement does not change the underlying quantity.</text><text class="wm" x="948" y="443" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
