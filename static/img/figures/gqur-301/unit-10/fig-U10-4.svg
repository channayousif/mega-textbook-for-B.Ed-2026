<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the absentee distribution over 50 days, with probabilities 0</title><desc id="d">A table of the absentee distribution over 50 days, with probabilities 0.10, 0.24, 0.30, 0.20, 0.12 and 0.04 for 0 to 5 absentees. Both checks are ticked: every probability lies between 0 and 1 and they add to 1. A last row multiplies each value by its probability, giving an expected value of 2.12 absentees per day.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="430"/><rect x="15" y="25" width="930" height="56" rx="8" class="panel"/><text x="28" y="61" font-size="19" text-anchor="start">x (absentees)</text><text x="258" y="61" font-size="19" text-anchor="start">0</text><text x="358" y="61" font-size="19" text-anchor="start">1</text><text x="458" y="61" font-size="19" text-anchor="start">2</text><text x="558" y="61" font-size="19" text-anchor="start">3</text><text x="658" y="61" font-size="19" text-anchor="start">4</text><text x="758" y="61" font-size="19" text-anchor="start">5</text><text x="858" y="61" font-size="19" text-anchor="start">Total</text><rect x="15" y="83" width="930" height="56" rx="8" class="panel"/><text x="28" y="119" font-size="19" text-anchor="start">Days</text><text x="258" y="119" font-size="19" text-anchor="start">5</text><text x="358" y="119" font-size="19" text-anchor="start">12</text><text x="458" y="119" font-size="19" text-anchor="start">15</text><text x="558" y="119" font-size="19" text-anchor="start">10</text><text x="658" y="119" font-size="19" text-anchor="start">6</text><text x="758" y="119" font-size="19" text-anchor="start">2</text><text x="858" y="119" font-size="19" text-anchor="start">50</text><rect x="15" y="141" width="930" height="56" rx="8" class="panel"/><text x="28" y="177" font-size="19" text-anchor="start">P(X = x)</text><text x="258" y="177" font-size="19" text-anchor="start">0.10</text><text x="358" y="177" font-size="19" text-anchor="start">0.24</text><text x="458" y="177" font-size="19" text-anchor="start">0.30</text><text x="558" y="177" font-size="19" text-anchor="start">0.20</text><text x="658" y="177" font-size="19" text-anchor="start">0.12</text><text x="758" y="177" font-size="19" text-anchor="start">0.04</text><text x="858" y="177" font-size="19" text-anchor="start">1.00</text><rect x="15" y="199" width="930" height="56" rx="8" class="panel"/><text x="28" y="235" font-size="19" text-anchor="start">x × P(X = x)</text><text x="258" y="235" font-size="19" text-anchor="start">0</text><text x="358" y="235" font-size="19" text-anchor="start">0.24</text><text x="458" y="235" font-size="19" text-anchor="start">0.60</text><text x="558" y="235" font-size="19" text-anchor="start">0.60</text><text x="658" y="235" font-size="19" text-anchor="start">0.48</text><text x="758" y="235" font-size="19" text-anchor="start">0.20</text><text x="858" y="235" font-size="19" text-anchor="start">2.12</text><text x="25" y="306" font-size="21" text-anchor="start">✓ Check 1: every probability is between 0 and 1</text><text x="25" y="345" font-size="21" text-anchor="start">✓ Check 2: probabilities add to 1</text><text x="25" y="390" font-size="23" text-anchor="start">Expected value E(X) = 2.12 absentees per day</text><text class="wm" x="948" y="423" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
