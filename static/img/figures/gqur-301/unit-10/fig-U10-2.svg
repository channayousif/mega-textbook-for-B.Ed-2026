<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of six school random variables</title><desc id="d">A table of six school random variables. The number of absentees, quiz score and number of siblings are counted and discrete. Height, walking time and age are measured and continuous, even though age is usually recorded in whole years.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="430"/><rect x="15" y="20" width="930" height="48" rx="8" class="panel"/><text x="30" y="51" font-size="18" text-anchor="start">Random variable</text><text x="360" y="51" font-size="18" text-anchor="start">Method</text><text x="500" y="51" font-size="18" text-anchor="start">Possible values</text><text x="780" y="51" font-size="18" text-anchor="start">Type</text><rect x="15" y="70" width="930" height="48" rx="8" class="panel"/><text x="30" y="101" font-size="18" text-anchor="start">Absentees (class of 40)</text><text x="360" y="101" font-size="18" text-anchor="start">Count</text><text x="500" y="101" font-size="18" text-anchor="start">0, 1, ... 40</text><text x="780" y="101" font-size="18" text-anchor="start">Discrete</text><rect x="15" y="120" width="930" height="48" rx="8" class="panel"/><text x="30" y="151" font-size="18" text-anchor="start">Correct quiz answers</text><text x="360" y="151" font-size="18" text-anchor="start">Count</text><text x="500" y="151" font-size="18" text-anchor="start">0, 1, ... 10</text><text x="780" y="151" font-size="18" text-anchor="start">Discrete</text><rect x="15" y="170" width="930" height="48" rx="8" class="panel"/><text x="30" y="201" font-size="18" text-anchor="start">Siblings</text><text x="360" y="201" font-size="18" text-anchor="start">Count</text><text x="500" y="201" font-size="18" text-anchor="start">0, 1, 2, ...</text><text x="780" y="201" font-size="18" text-anchor="start">Discrete</text><rect x="15" y="220" width="930" height="48" rx="8" class="panel"/><text x="30" y="251" font-size="18" text-anchor="start">Height (cm)</text><text x="360" y="251" font-size="18" text-anchor="start">Measure</text><text x="500" y="251" font-size="18" text-anchor="start">Any in an interval</text><text x="780" y="251" font-size="18" text-anchor="start">Continuous</text><rect x="15" y="270" width="930" height="48" rx="8" class="panel"/><text x="30" y="301" font-size="18" text-anchor="start">Walking time (min)</text><text x="360" y="301" font-size="18" text-anchor="start">Measure</text><text x="500" y="301" font-size="18" text-anchor="start">Any in an interval</text><text x="780" y="301" font-size="18" text-anchor="start">Continuous</text><rect x="15" y="320" width="930" height="48" rx="8" class="panel"/><text x="30" y="351" font-size="18" text-anchor="start">Actual age (years)</text><text x="360" y="351" font-size="18" text-anchor="start">Measure</text><text x="500" y="351" font-size="18" text-anchor="start">Any; often rounded</text><text x="780" y="351" font-size="18" text-anchor="start">Continuous</text><text x="25" y="398" font-size="18" text-anchor="start">Whole-year age in a register is a discrete recorded variable.</text><text class="wm" x="948" y="423" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
