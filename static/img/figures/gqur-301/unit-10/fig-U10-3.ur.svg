<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منفصل اور مسلسل تقسیمیں</title><desc id="d">دو حصے۔ دائیں جانب الگ الگ ستون 0 سے 5 غیر حاضر طلبہ کے احتمالات دکھاتے ہیں۔ سب سے اونچا ستون 2 غیر حاضر طلبہ کا ہے، جس کا احتمال 0.30 ہے۔ بائیں جانب ایک ہموار منحنی طلبہ کے 120 سے 160 cm قد دکھاتی ہے۔ 140 اور 145 cm کے درمیان قد کا احتمال منحنی کے نیچے سایہ دار رقبہ ہے، اور پورا رقبہ 1 کے برابر ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.line{fill:none;stroke:var(--ink);stroke-width:2.5}.bar{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" width="960" height="460"/><text x="715" y="35" font-size="21" text-anchor="middle">منفصل: غیر حاضر طلبہ کی تعداد</text><text x="230" y="35" font-size="21" text-anchor="middle">مسلسل: قد</text><path d="M895 335 L510 335" class="line"/><path d="M895 335 L895 85" class="line"/><text x="895" y="65" font-size="16" text-anchor="end">احتمال</text><rect x="840" y="265.0" width="32" height="70.0" class="bar"/><text x="856" y="360" font-size="18" text-anchor="middle">0</text><text x="856" y="255.0" font-size="15" text-anchor="middle">0.10</text><rect x="782" y="167.0" width="32" height="168.0" class="bar"/><text x="798" y="360" font-size="18" text-anchor="middle">1</text><text x="798" y="157.0" font-size="15" text-anchor="middle">0.24</text><rect x="724" y="125.0" width="32" height="210.0" class="bar"/><text x="740" y="360" font-size="18" text-anchor="middle">2</text><text x="740" y="115.0" font-size="15" text-anchor="middle">0.30</text><rect x="666" y="195.0"