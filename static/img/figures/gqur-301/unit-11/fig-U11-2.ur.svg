<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">تعیینی اور امکانی نتائج</title><desc id="d">ایک موازنہ خاکہ جس میں بائیں طرف ایک تعیینی ماڈل دکھایا گیا ہے جس میں مقررہ داخلی داد و سید سے ایک واحد نتیجہ آتا ہے، اور دائیں طرف ایک امکانی ماڈل دکھایا گیا ہے جس میں متعدد ممکنہ نتائج کا پھیلاؤ ہے؛ اسکولی مثالوں کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink);direction:rtl}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm);direction:ltr}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.grid{stroke:var(--ink);opacity:0.25}.bar{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.dash{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" width="780" height="480"/><text x="390" y="32" class="h" text-anchor="middle">ایک ہی اسکول، دو قسم کے نتائج</text><rect class="panel" x="25" y="65" width="350" height="320" rx="8"/><text x="200" y="98" class="h" text-anchor="middle">تعیینی</text><rect class="panel" x="405" y="65" width="350" height="320" rx="8"/><text x="580" y="98" class="h" text-anchor="middle">امکانی</text><text x="200" y="140" class="" text-anchor="middle">120 کاپیاں روپے 50 فی کاپی</text><text x="200" y="165" class="" text-anchor="middle">مقررہ داخلی داد و سید</text><line class="link" x1="200" y1="182" x2="200" y2="225" marker-end="url(#arrow)"/><text x="200" y="260" class="" text-anchor="middle">لاگت = 6,000 روپے</text><text x="200" y="285" class="" text-anchor="middle">ان داخلی داد و سید کے لیے ایک نتیجہ</text><text x="580" y="140" class="" text-anchor="middle">120 طلبہ؛ غیر حضری کی شرح 5%</text><text x="580" y="165" class="" text-anchor="middle">روزانہ غیر حضری غیر یقینی ہے</text><line class="link" x1="580" y1="182" x2="580" y2="225" marker-end="url(#arrow)"/><text x="580" y="260" class="" text-anchor="middle">ممکنہ شمار: 0, 1, ... , 120</text><text x="580" y="285" class="" text-anchor="middle">متوقع غیر حضریاں: 6</text><text x="580" y="310" class="" text-anchor="middle">اصل شمار مختلف ہو سکتا ہے</text><text x="390" y="420" class="" text-anchor="middle">متوقع شمار کوئی یقینی شمار نہیں ہے۔</text><text x="20" y="455" class="small" text-anchor="start">تدریس کی اصل خاکہ؛ ماخذ: Lane اور OpenStax۔</text><text x="768" y="460" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>