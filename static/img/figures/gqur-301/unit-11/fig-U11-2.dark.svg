<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Deterministic and probabilistic outputs</title><desc id="d">A side-by-side comparison diagram showing a deterministic model with fixed single output on the left, and a probabilistic model with a range of probable outcomes on the right, using school examples.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.grid{stroke:var(--ink);opacity:0.25}.bar{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.dash{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" width="780" height="480"/><text x="390" y="32" class="h" text-anchor="middle">Same school, two kinds of output</text><rect class="panel" x="25" y="65" width="350" height="320" rx="8"/><text x="200" y="98" class="h" text-anchor="middle">Deterministic</text><rect class="panel" x="405" y="65" width="350" height="320" rx="8"/><text x="580" y="98" class="h" text-anchor="middle">Probabilistic</text><text x="200" y="140" class="" text-anchor="middle">120 booklets at Rs 50 each</text><text x="200" y="165" class="" text-anchor="middle">Fixed inputs</text><line class="link" x1="200" y1="182" x2="200" y2="225" marker-end="url(#arrow)"/><text x="200" y="260" class="" text-anchor="middle">Cost = Rs 6,000</text><text x="200" y="285" class="" text-anchor="middle">One output for these inputs</text><text x="580" y="140" class="" text-anchor="middle">120 pupils; absence rate 5%</text><text x="580" y="165" class="" text-anchor="middle">Uncertain daily absences</text><line class="link" x1="580" y1="182" x2="580" y2="225" marker-end="url(#arrow)"/><text x="580" y="260" class="" text-anchor="middle">Possible counts: 0, 1, ... , 120</text><text x="580" y="285" class="" text-anchor="middle">Expected absences: 6</text><text x="580" y="310" class="" text-anchor="middle">Actual count can differ</text><text x="390" y="420" class="" text-anchor="middle">An expected count is not a guaranteed count.</text><text x="20" y="455" class="small" text-anchor="start">Original teaching schematic; sources: Lane and OpenStax.</text><text x="768" y="460" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
