<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">امکانی ماڈلوں کے انتخاب</title><desc id="d">ایک تصوری نقشہ جس میں امکانی ماڈل مرکز میں ہیں، دو حدی ماڈل کی طرف منفہر ہے جو دو نتائج کے مسلسل شمار کو ظاہر کرتا ہے، اور نارمل ماڈل کی طرف منفہر ہے جو مسلسل گونقار پیمائشوں کو ظاہر کرتا ہے؛ ہر ماڈل کے لیے شرائط اور اسکولی مثالیں دی گئی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink);direction:rtl}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm);direction:ltr}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.grid{stroke:var(--ink);opacity:0.25}.bar{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.dash{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" width="780" height="480"/><text x="390" y="30" class="h" text-anchor="middle">امکانی ماڈل</text><text x="390" y="55" class="h" text-anchor="middle">مقررہ شمار یا مسلسل پیمائشیں؟</text><rect class="panel" x="225" y="85" width="330" height="65" rx="8"/><text x="390" y="112" class="" text-anchor="middle">امکانی ماڈل</text><text x="390" y="137" class="" text-anchor="middle">ممکنہ نتائج + امکانات</text><line class="link" x1="305" y1="150" x2="200" y2="205" marker-end="url(#arrow)"/><line class="link" x1="475" y1="150" x2="580" y2="205" marker-end="url(#arrow)"/><rect class="panel" x="25" y="210" width="350" height="175" rx="8"/><rect class="panel" x="405" y="210" width="350" height="175" rx="8"/><text x="200" y="238" class="h" text-anchor="middle">دو حدی</text><text x="200" y="270" class="" text-anchor="middle">مقررہ پرکھیں؛ دو نتائج</text><text x="200" y="295" class="" text-anchor="middle">آزاد؛ p یکساں</text><text x="200" y="320" class="" text-anchor="middle">مثال: درست قیاس</text><text x="200" y="345" class="" text-anchor="middle">کامیابیوں کا شمار پیش کرتا ہے</text><text x="580" y="238" class="h" text-anchor="middle">نارمل</text><text x="580" y="270" class="" text-anchor="middle">مسلسل، متناسب گونقار منحنی</text><text x="580" y="295" class="" text-anchor="middle">اوسط اور معیاری انحراف سے مقرر</text><text x="580" y="320" class="" text-anchor="middle">مثال: موزوں نمبری ماڈل</text><text x="580" y="345" class="" text-anchor="middle">وقفوں میں تناسب پیش کرتا ہے</text><text x="390" y="420" class="" text-anchor="middle">ماڈل منتخب کرنے سے پہلے شرائط کی جانچ کریں۔</text><text x="20" y="455" class="small" text-anchor="start">تدریس کی اصل خاکہ؛ ماخذ: Lane اور OpenStax۔</text><text x="768" y="460" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>