<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">اسکولی صورت حال اور ماڈل</title><desc id="d">ایک حوالہ جدول جس میں عام اسکولی صورت حال کا مناسب امکانی ماڈل سے موازنہ کیا گیا ہے: صورت حال، استعمال شدہ ماڈل، اہم مفروضہ، پیش گوئی، اور ماڈل کب ناکام ہوتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:12px;fill:var(--ink);direction:rtl}.h{font-size:18px;font-weight:700;fill:var(--ink);direction:rtl}.small{font-size:12px;fill:var(--ink);direction:rtl}.wm{font-size:11px;fill:var(--wm);direction:ltr}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.grid{stroke:var(--ink);opacity:0.25}.bar{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.dash{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" width="780" height="480"/><text x="390" y="30" class="h" text-anchor="middle">اسکولی صورت حال کا ماڈل سے موازنہ کریں</text><rect class="panel" x="20" y="60" width="740" height="344"/><line class="link" x1="205" y1="60" x2="205" y2="404"/><line class="link" x1="350" y1="60" x2="350" y2="404"/><line class="link" x1="555" y1="60" x2="555" y2="404"/><line class="link" x1="20" y1="104" x2="760" y2="104"/><line class="link" x1="20" y1="179" x2="760" y2="179"/><line class="link" x1="20" y1="254" x2="760" y2="254"/><line class="link" x1="20" y1="329" x2="760" y2="329"/><text x="112" y="88" class="small" text-anchor="middle">صورت حال</text><text x="277" y="88" class="small" text-anchor="middle">ماڈل</text><text x="452" y="88" class="small" text-anchor="middle">شرائط / پیش گوئی</text><text x="657" y="88" class="small" text-anchor="middle">احتیاط</text><text x="112" y="130" class="" text-anchor="middle">درست قیاس</text><text x="112" y="155" class="" text-anchor="middle">امتحان پر</text><text x="277" y="130" class="" text-anchor="middle">دو حدی</text><text x="452" y="130" class="" text-anchor="middle">آزاد؛ p مقرر</text><text x="452" y="155" class="" text-anchor="middle">درست جوابات کا شمار</text><text x="657" y="130" class="" text-anchor="middle">نشانیاں p بدل سکتی ہیں</text><text x="112" y="205" class="" text-anchor="middle">حاضر طلبہ</text><text x="112" y="230" class="" text-anchor="middle">اسکولی دن</text><text x="277" y="205" class="" text-anchor="middle">دو حدی</text><text x="277" y="230" class="" text-anchor="middle">اگر موزوں ہو</text><text x="452" y="205" class="" text-anchor="middle">آزاد؛ p مقرر</text><text x="452" y="230" class="" text-anchor="middle">حاضر شمار</text><text x="657" y="205" class="" text-anchor="middle">مشترکہ نقل و حمل</text><text x="657" y="230" class="" text-anchor="middle">غیر حضریوں کو جوڑتا ہے</text><text x="112" y="280" class="" text-anchor="middle">ضلعی نمبر</text><text x="112" y="305" class="" text-anchor="middle">گونقار شکل کے ساتھ</text><text x="277" y="280" class="" text-anchor="middle">نارمل</text><text x="277" y="305" class="" text-anchor="middle">تقریب</text><text x="452" y="280" class="" text-anchor="middle">متناسب گونقار شکل</text><text x="452" y="305" class="" text-anchor="middle">حد سے نیچے تناسب</text><text x="657" y="280" class="" text-anchor="middle">نمبر کی حد چیک کریں</text><text x="112" y="355" class="" text-anchor="middle">ناپی گئی اونچائیاں</text><text x="112" y="380" class="" text-anchor="middle">ہم عمر گروہ میں</text><text x="277" y="355" class="" text-anchor="middle">نارمل</text><text x="277" y="380" class="" text-anchor="middle">اگر موزوں ہو</text><text x="452" y="355" class="" text-anchor="middle">تقریبی گونقار شکل</text><text x="452" y="380" class="" text-anchor="middle">وقفے میں تناسب</text><text x="657" y="355" class="" text-anchor="middle">مختلط عمر کے گروہ</text><text x="657" y="380" class="" text-anchor="middle">شاید نہ پورا اتریں</text><text x="390" y="432" class="small" text-anchor="middle">کسی ماڈل کو ثابت کرنے کی دلیل ضروری ہے کہ اس کے شرائط پورے اترتے ہیں۔</text><text x="20" y="455" class="small" text-anchor="start">تدریس کی اصل خاکہ؛ ماخذ: Lane اور OpenStax۔</text><text x="768" y="460" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>