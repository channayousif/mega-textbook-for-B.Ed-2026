<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">دو حدی قیاسی ماڈل</title><desc id="d">ایک دو حدی قیاسی ماڈل جس میں داخلی داد و سید دس آزاد چار آپشن سوالات ہیں؛ سب سے زیادہ امکانی نمبر دو ہیں، اوسط 2.5 ہے اور پانچ یا زیادہ ہونے کا امکان تقریباً 7.8 فیصد ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink);direction:rtl}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink);direction:rtl}.wm{font-size:11px;fill:var(--wm);direction:ltr}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.grid{stroke:var(--ink);opacity:0.25}.bar{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.dash{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" width="780" height="480"/><text x="390" y="30" class="h" text-anchor="middle">اندازہ لگانے والا قیاس: دس چار آپشن سوالات</text><text x="390" y="59" class="" text-anchor="middle">داخلی داد و سید: n = 10, p = 0.25؛ آزاد انتخاب</text><text x="70" y="94" class="small" text-anchor="start">امکانیت (%)</text><line x1="70" y1="330" x2="745" y2="330" class="grid"/><text x="60" y="335" class="small" text-anchor="end">0</text><line x1="70" y1="260" x2="745" y2="260" class="grid"/><text x="60" y="265" class="small" text-anchor="end">10</text><line x1="70" y1="190" x2="745" y2="190" class="grid"/><text x="60" y="195" class="small" text-anchor="end">20</text><line x1="70" y1="120" x2="745" y2="120" class="grid"/><text x="60" y="125" class="small" text-anchor="end">30</text><rect x="85" y="290.58" width="34" height="39.42" class="bar"/><text x="102" y="355" class="" text-anchor="middle">0</text><rect x="144" y="198.60" width="34" height="131.40" class="bar"/><text x="161" y="355" class="" text-anchor="middle">1</text><rect x="203" y="132.90" width="34" height="197.10" class="bar"/><text x="220" y="355" class="" text-anchor="middle">2</text><rect x="262" y="154.80" width="34" height="175.20" class="bar"/><text x="279" y="355" class="" text-anchor="middle">3</text><rect x="321" y="227.80" width="34" height="102.20" class="bar"/><text x="338" y="355" class="" text-anchor="middle">4</text><rect x="380" y="289.12" width="34" height="40.88" class="bar"/><text x="397" y="355" class="" text-anchor="middle">5</text><rect x="439" y="318.64" width="34" height="11.36" class="bar"/><text x="456" y="355" class="" text-anchor="middle">6</text><rect x="498" y="327.84" width="34" height="2.16" class="bar"/><text x="515" y="355" class="" text-anchor="middle">7</text><rect x="557" y="329.73" width="34" height="0.27" class="bar"/><text x="574" y="355" class="" text-anchor="middle">8</text><rect x="616" y="329.98" width="34" height="0.02" class="bar"/><text x="633" y="355" class="" text-anchor="middle">9</text><rect x="675" y="330.00" width="34" height="0.00" class="bar"/><text x="692" y="355" class="" text-anchor="middle">10</text><line x1="368" y1="100" x2="368" y2="330" class="dash"/><text x="470" y="117" class="small" text-anchor="start">کامیابی خطہ: نمبر 5 سے 10</text><text x="470" y="142" class="small" text-anchor="start">اجتماعی امکانیت: 7.8%</text><text x="390" y="384" class="" text-anchor="middle">درست قیاس (k)</text><text x="390" y="413" class="" text-anchor="middle">سب سے زیادہ امکانی نمبر: 2؛ متوقع نمبر: 2.5</text><text x="20" y="455" class="small" text-anchor="start">تدریس کی اصل خاکہ؛ ماخذ: Lane اور OpenStax۔</text><text x="76