<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">School situations and models</title><desc id="d">Table matching four everyday school situations to suitable probabilistic models, detailing the situation, model used, key assumption, prediction made, and when the model fails.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}.grid{stroke:var(--ink);opacity:0.25}.bar{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.dash{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" width="780" height="480"/><text x="390" y="30" class="h" text-anchor="middle">Match a school situation to a model</text><rect class="panel" x="20" y="60" width="740" height="344"/><line class="link" x1="205" y1="60" x2="205" y2="404"/><line class="link" x1="350" y1="60" x2="350" y2="404"/><line class="link" x1="555" y1="60" x2="555" y2="404"/><line class="link" x1="20" y1="104" x2="760" y2="104"/><line class="link" x1="20" y1="179" x2="760" y2="179"/><line class="link" x1="20" y1="254" x2="760" y2="254"/><line class="link" x1="20" y1="329" x2="760" y2="329"/><text x="30" y="88" class="small" text-anchor="start">Situation</text><text x="215" y="88" class="small" text-anchor="start">Model</text><text x="360" y="88" class="small" text-anchor="start">Conditions / prediction</text><text x="565" y="88" class="small" text-anchor="start">Caution</text><text x="30" y="130" class="small" text-anchor="start">Correct guesses</text><text x="30" y="155" class="small" text-anchor="start">on a test</text><text x="215" y="130" class="small" text-anchor="start">Binomial</text><text x="360" y="130" class="small" text-anchor="start">Independent; fixed p</text><text x="360" y="155" class="small" text-anchor="start">Count of right responses</text><text x="565" y="130" class="small" text-anchor="start">Clues can change p</text><text x="30" y="205" class="small" text-anchor="start">Pupils present</text><text x="30" y="230" class="small" text-anchor="start">on a school day</text><text x="215" y="205" class="small" text-anchor="start">Binomial</text><text x="215" y="230" class="small" text-anchor="start">if suitable</text><text x="360" y="205" class="small" text-anchor="start">Independent; fixed p</text><text x="360" y="230" class="small" text-anchor="start">Count attending</text><text x="565" y="205" class="small" text-anchor="start">Shared transport</text><text x="565" y="230" class="small" text-anchor="start">links absences</text><text x="30" y="280" class="small" text-anchor="start">District scores</text><text x="30" y="305" class="small" text-anchor="start">with a bell shape</text><text x="215" y="280" class="small" text-anchor="start">Normal</text><text x="215" y="305" class="small" text-anchor="start">approximation</text><text x="360" y="280" class="small" text-anchor="start">Symmetric bell shape</text><text x="360" y="305" class="small" text-anchor="start">Proportion below cut-off</text><text x="565" y="280" class="small" text-anchor="start">Check score limits</text><text x="30" y="355" class="small" text-anchor="start">Measured heights</text><text x="30" y="380" class="small" text-anchor="start">in a similar-age group</text><text x="215" y="355" class="small" text-anchor="start">Normal</text><text x="215" y="380" class="small" text-anchor="start">if suitable</text><text x="360" y="355" class="small" text-anchor="start">Approximate bell shape</text><text x="360" y="380" class="small" text-anchor="start">Proportion in a range</text><text x="565" y="355" class="small" text-anchor="start">Mixed-age groups</text><text x="565" y="380" class="small" text-anchor="start">may not fit</text><text x="390" y="432" class="small" text-anchor="middle">A model needs evidence that its conditions fit.</text><text x="20" y="455" class="small" text-anchor="start">Original teaching schematic; sources: Lane and OpenStax.</text><text x="768" y="460" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
