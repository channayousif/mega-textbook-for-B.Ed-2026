<svg font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d"><title id="t">Bivariate data: study hours and test score</title><desc id="d">Data table with two columns (study hours per week and test score out of 100) showing 10 paired observations from a Pakistani school.</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2} line.border{fill:none;stroke:var(--line);stroke-width:1} text.caption{font-size:12px;fill:var(--muted)} text.cell{font-size:12px;fill:var(--ink)} text.header{font-size:12px;font-weight:700;fill:var(--ink)} rect.header-bg{fill:var(--a2-fill);stroke:var(--line);stroke-width:1} rect.row-bg-1{fill:var(--a1-fill)} rect.row-bg-2{fill:var(--bg)} text.title{font-size:14px;font-weight:700;fill:var(--ink)}</style></defs><text x="760" y="460" class="wm" aria-hidden="true">textbook.com.pk</text><text x="30" y="30" class="title">Paired data: 10 pupils at a school in Sukkur</text><rect x="140" y="50" width="500" height="30" rx="4" class="header-bg"/><line x1="270" y1="50" x2="270" y2="80" class="border"/><line x1="450" y1="50" x2="450" y2="80" class="border"/><text x="205" y="70" text-anchor