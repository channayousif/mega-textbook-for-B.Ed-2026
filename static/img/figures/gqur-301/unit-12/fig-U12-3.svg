<svg font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d"><title id="t">Three scatter plots showing positive, negative and no relationship</title><desc id="d">Three scatter plots side by side showing a positive relationship (rising), a negative relationship (falling) and no relationship (random scatter).</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .line{stroke:var(--line);stroke-width:2} line.axis{stroke:var(--ink);stroke-width:1.5} circle.pt{fill:var(--a1);stroke:none} text.title{font-size:13px;font-weight:700;fill:var(--ink)} text.label{font-size:11px;fill:var(--muted)} text.caption{font-size:12px;fill:var(--muted)}</style></defs><text x="760" y="490" class="wm" aria-hidden="true">textbook.com.pk</text><rect x="30" y="20" width="220" height="200" rx="6" class="panel"/><text x="140" y="42" class="title" text-anchor="middle">Positive</text><text x="140" y="57" class="label" text-anchor="middle">Cloud rises left to right</text><line class="axis" x1="55" y1="195" x2="230" y2="195"/><line class="axis" x1="55" y1="195" x2="55" y2="75"/><text x="140" y="212" class="label" text-anchor="middle">Variable X</text><text x="45" y="130" class="label" transform="rotate(-90, 45, 130)" text-anchor="middle">Variable Y</text><circle class="pt" cx="70" cy="185" r="4"/><circle class="pt" cx="85" cy="178" r="4"/><circle class="pt" cx="100" cy="165" r="4"/><circle class="pt" cx="110" cy="160" r="4"/><circle class="pt" cx="125" cy="150" r="4"/><circle class="pt" cx="140" cy="142" r="4"/><circle class="pt" cx="155" cy="130" r="4"/><circle class="pt" cx="170" cy="120" r="4"/><circle class="pt" cx="185" cy="108" r="4"/><circle class="pt" cx="200" cy="95" r="4"/><circle class="pt" cx="215" cy="85" r="4"/><rect x="280" y="20" width="220" height="200" rx="6" class="panel"/><text x="390" y="42" class="title" text-anchor="middle">Negative</text><text x="390" y="57" class="label" text-anchor="middle">Cloud falls left to right</text><line class="axis" x1="305" y1="195" x2="480" y2="195"/><line class="axis" x1="305" y1="195" x2="305" y2="75"/><text x="390" y="212" class="label" text-anchor="middle">Variable X</text><text x="295" y="130" class="label" transform="rotate(-90, 295, 130)" text-anchor="middle">Variable Y</text><circle class="pt" cx="320" cy="85" r="4"/><circle class="pt" cx="335" cy="95" r="4"/><circle class="pt" cx="350" cy="108" r="4"/><circle class="pt" cx="365" cy="118" r="4"/><circle class="pt" cx="380" cy="130" r="4"/><circle class="pt" cx="395" cy="140" r="4"/><circle class="pt" cx="410" cy="150" r="4"/><circle class="pt" cx="425" cy="160" r="4"/><circle class="pt" cx="440" cy="170" r="4"/><circle class="pt" cx="455" cy="178" r="4"/><circle class="pt" cx="470" cy="185" r="4"/><rect x="530" y="20" width="220" height="200" rx="6" class="panel"/><text x="640" y="42" class="title" text-anchor="middle">No relationship</text><text x="640" y="57" class="label" text-anchor="middle">Random scatter, no slope</text><line class="axis" x1="555" y1="195" x2="730" y2="195"/><line class="axis" x1="555" y1="195" x2="555" y2="75"/><text x="640" y="212" class="label" text-anchor="middle">Variable X</text><text x="545" y="130" class="label" transform="rotate(-90, 545, 130)" text-anchor="middle">Variable Y</text><circle class="pt" cx="575" cy="150" r="4"/><circle class="pt" cx="590" cy="100" r="4"/><circle class="pt" cx="600" cy="175" r="4"/><circle class="pt" cx="615" cy="120" r="4"/><circle class="pt" cx="630" cy="160" r="4"/><circle class="pt" cx="640" cy="90" r="4"/><circle class="pt" cx="655" cy="145" r="4"/><circle class="pt" cx="670" cy="110" r="4"/><circle class="pt" cx="685" cy="170" r="4"/><circle class="pt" cx="700" cy="130" r="4"/><circle class="pt" cx="715" cy="155" r="4"/><rect x="30" y="240" width="720" height="100" rx="6" class="panel"/><text x="50" y="265" class="sh">Direction tells you the slope of the cloud:</text><text x="50" y="285" class="m">Positive: as X increases, Y tends to increase (cloud rises).</text><text x="50" y="300" class="m">Negative: as X increases, Y tends to decrease (cloud falls).</text><text x="50" y="315" class="m">No relationship: no discernible slope; points scatter randomly.</text><text x="50" y="330" class="m">Example from the text: study hours vs test score shows a positive direction.</text><text x="30" y="365" class="caption">Caption: The same axes, three different clouds. Direction is the first descriptor you read.</text><text x="30" y="385" class="caption">Credit: textbook.com.pk based on Lane (2023) and Illowsky et al. (2023).</text></svg>
