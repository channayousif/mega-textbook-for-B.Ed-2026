<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Bivariate Analysis concept map</title><desc id="d">Concept map placing 'Bivariate Analysis' at the centre, branching into scatter plot, direction, strength, form and outlier, showing the flow from data to plot to interpretation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780"/><rect class="bg" x="0" y="0" width="780" height="500"/><rect class="b1" x="290" y="30" width="200" height="44" rx="8"/><text class="h c" x="390" y="57">Bivariate Analysis</text><text class="m c" x="390" y="95">Data paired case by case</text><line class="line" x1="340" y1="74" x2="170" y2="130"/><rect class="b2" x="70" y="130" width="200" height="40" rx="6"/><text class="sh c" x="170" y="156">Scatter plot</text><line class="line" x1="390" y1="74" x2="390" y2="130"/><rect class="b3" x="290" y="130" width="200" height="40" rx="6"/><text class="sh c" x="390" y="156">Direction</text><line class="line" x1="440" y1="74" x2="590" y2="130"/><rect class="b4" x="490" y="130" width="200" height="40" rx="6"/><text class="sh c" x="590" y="156">Strength</text><text class="m c" x="170" y="190">Plot points on two axes</text><line class="line" x1="340" y1="170" x2="250" y2="220"/><rect class="panel" x="170" y="220" width="160" height="28" rx="4"/><text class="m c" x="250" y="240">Positive (rises)</text><line class="line" x1="390" y1="170" x2="390" y2="220"/><rect class="panel" x="310" y="220" width="160" height="28" rx="4"/><text class="m c" x="390" y="240">Negative (falls)</text><line class="line" x1="440" y1="170" x2="530" y2="220"/><rect class="panel" x="450" y="220" width="160" height="28" rx="4"/><text class="m c" x="530" y="240">No direction</text><line class="line" x1="540" y1="170" x2="470" y2="220"/><rect class="panel" x="380" y="220" width="180" height="28" rx="4"/><text class="m c" x="470" y="240">Strong (tight cloud)</text><line class="line" x1="590" y1="170" x2="620" y2="220"/><rect class="panel" x="540" y="220" width="160" height="28" rx="4"/><text class="m c" x="620" y="240">Weak (spread)</text><text class="m c" x="390" y="275">Leads to interpretation</text><line class="line" x1="340" y1="290" x2="200" y2="340"/><rect class="b2" x="100" y="340" width="200" height="40" rx="6"/><text class="sh c" x="200" y="366">Form</text><line class="line" x1="440" y1="290" x2="580" y2="340"/><rect class="b3" x="480" y="340" width="200" height="40" rx="6"/><text class="sh c" x="580" y="366">Outlier</text><line class="line" x1="150" y1="380" x2="100" y2="420"/><rect class="panel" x="20" y="420" width="160" height="28" rx="4"/><text class="m c" x="100" y="440">Linear (straight)</text><line class="line" x1="250" y1="380" x2="280" y2="420"/><rect class="panel" x="200" y="420" width="160" height="28" rx="4"/><text class="m c" x="280" y="440">Non-linear (curve)</text><line class="line" x1="580" y1="380" x2="580" y2="420"/><rect class="panel" x="460" y="420" width="240" height="28" rx="4"/><text class="m c" x="580" y="440">Point far from the main cloud</text><rect class="panel" x="30" y="460" width="720" height="30" rx="4"/><text class="m c" x="390" y="480">Caption: Bivariate Analysis flows from paired data to a scatter plot, then to interpretation.</text><text class="wm" x="760" y="495" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
