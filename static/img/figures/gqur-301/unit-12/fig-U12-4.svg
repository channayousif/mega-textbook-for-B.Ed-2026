<svg font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d"><title id="t">Scatter plot interpretation guide</title><desc id="d">Table summarising how to interpret a scatter plot: direction, strength, form and outliers, with descriptions and school-based examples.</desc><defs><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end} .line{stroke:var(--line);stroke-width:2} line.border{fill:none;stroke:var(--line);stroke-width:1} text.caption{font-size:12px;fill:var(--muted)} text.cell{font-size:12px;fill:var(--ink)} text.header{font-size:12px;font-weight:700;fill:var(--ink)} rect.header-bg{fill:var(--a2-fill);stroke:var(--line);stroke-width:1} rect.row-bg-1{fill:var(--a1-fill)} rect.row-bg-2{fill:var(--bg)} text.title{font-size:14px;font-weight:700;fill:var(--ink)} text.row-header{font-size:12px;font-weight:600;fill:var(--ink)}</style></defs><text x="760" y="460" class="wm" aria-hidden="true">textbook.com.pk</text><text x="30" y="30" class="title">Scatter plot interpretation guide</text><rect x="30" y="45" width="720" height="30" rx="4" class="header-bg"/><line x1="130" y1="45" x2="130" y2="75" class="border"/><line x1="350" y1="45" x2="350" y2="75" class="border"/><line x1="560" y1="45" x2="560" y2="75" class="border"/><text x="80" y="65" text-anchor="middle" class="header">Descriptor</text><text x="240" y="65" text-anchor="middle" class="header">What to look for</text><text x="455" y="65" text-anchor="middle" class="header">School example</text><text x="650" y="65" text-anchor="middle" class="header">Caution</text><rect x="30" y="75" width="720" height="60" class="row-bg-1"/><line x1="130" y1="75" x2="130" y2="135" class="border"/><line x1="350" y1="75" x2="350" y2="135" class="border"/><line x1="560" y1="75" x2="560" y2="135" class="border"/><text x="80" y="100" text-anchor="middle" class="row-header">Direction</text><text x="80" y="118" text-anchor="middle" class="cell">(slope)</text><text x="240" y="100" text-anchor="middle" class="cell">Overall slope of the cloud:</text><text x="240" y="115" text-anchor="middle" class="cell">rises, falls, or flat</text><text x="455" y="100" text-anchor="middle" class="cell">Study hours vs test score:</text><text x="455" y="115" text-anchor="middle" class="cell">rises (positive)</text><text x="650" y="100" text-anchor="middle" class="cell">Slope shows</text><text x="650" y="115" text-anchor="middle" class="cell">association, not cause</text><rect x="30" y="135" width="720" height="60" class="row-bg-2"/><line x1="130" y1="135" x2="130" y2="195" class="border"/><line x1="350" y1="135" x2="350" y2="195" class="border"/><line x1="560" y1="135" x2="560" y2="195" class="border"/><text x="80" y="160" text-anchor="middle" class="row-header">Strength</text><text x="80" y="178" text-anchor="middle" class="cell">(tightness)</text><text x="240" y="160" text-anchor="middle" class="cell">How closely points follow</text><text x="240" y="175" text-anchor="middle" class="cell">a single stream</text><text x="455" y="160" text-anchor="middle" class="cell">Tight cloud = strong;</text><text x="455" y="175" text-anchor="middle" class="cell">wide cloud = weak</text><text x="650" y="160" text-anchor="middle" class="cell">Do not confuse</text><text x="650" y="175" text-anchor="middle" class="cell">with direction</text><rect x="30" y="195" width="720" height="60" class="row-bg-1"/><line x1="130" y1="195" x2="130" y2="255" class="border"/><line x1="350" y1="195" x2="350" y2="255" class="border"/><line x1="560" y1="195" x2="560" y2="255" class="border"/><text x="80" y="220" text-anchor="middle" class="row-header">Form</text><text x="80" y="238" text-anchor="middle" class="cell">(shape)</text><text x="240" y="220" text-anchor="middle" class="cell">Linear (straight-line)</text><text x="240" y="235" text-anchor="middle" class="cell">or non-linear (curved)</text><text x="455" y="220" text-anchor="middle" class="cell">Study hours vs score:</text><text x="455" y="235" text-anchor="middle" class="cell">roughly linear</text><text x="650" y="220" text-anchor="middle" class="cell">Curves need tools</text><text x="650" y="235" text-anchor="middle" class="cell">beyond this course</text><rect x="30" y="255" width="720" height="60" class="row-bg-2"/><line x1="130" y1="255" x2="130" y2="315" class="border"/><line x1="350" y1="255" x2="350" y2="315" class="border"/><line x1="560" y1="255" x2="560" y2="315" class="border"/><text x="80" y="280" text-anchor="middle" class="row-header">Outlier</text><text x="80" y="298" text-anchor="middle" class="cell">(odd point)</text><text x="240" y="280" text-anchor="middle" class="cell">Point far from the main</text><text x="240" y="295" text-anchor="middle" class="cell">cloud in either direction</text><text x="455" y="280" text-anchor="middle" class="cell">10 hours studied but</text><text x="455" y="295" text-anchor="middle" class="cell">scored only 30</text><text x="650" y="280" text-anchor="middle" class="cell">Describe the pattern</text><text x="650" y="295" text-anchor="middle" class="cell">with and without it</text><rect x="30" y="335" width="720" height="100" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="1"/><text x="50" y="360" class="cell" font-weight="600">How to read any scatter plot:</text><text x="50" y="380" class="cell">1. State the direction (positive, negative, or none).</text><text x="50" y="395" class="cell">2. State the strength (strong, moderate, or weak).</text><text x="50" y="410" class="cell">3. State the form (linear or non-linear) and note any outlier.</text><text x="50" y="425" class="cell">4. Say "is associated with", not "causes", unless you have evidence beyond the plot.</text><text x="30" y="450" class="caption">Caption: Four descriptors for reading a scatter plot, with school-based examples and cautions. Credit: textbook.com.pk.</text></svg>
