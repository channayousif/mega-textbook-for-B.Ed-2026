<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Western and Muslim educational thinkers compared</title><desc id="d">Table comparing Western and Muslim educational thought on aims of education, sources of knowledge, the teacher's role, and moral development, illustrating both shared values and distinctive spiritual commitments.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="185" x2="756" y2="185"/><line class="frame" x1="24" y1="280" x2="756" y2="280"/><line class="frame" x1="24" y1="375" x2="756" y2="375"/><line class="frame" x1="160" y1="50" x2="160" y2="465"/><line class="frame" x1="460" y1="50" x2="460" y2="465"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Dimension</text><text class="h" x="174" y="78">Western thinkers</text><text class="h" x="474" y="78">Muslim scholars</text><g id="comp-aims"><text class="sh" x="34" y="125">Primary aim</text><text class="cell" x="174" y="120">Rational autonomy, inquiry,</text><text class="cell" x="174" y="137">human flourishing (eudaimonia),</text><text class="cell" x="174" y="154">and democratic citizenship</text><text class="cell" x="474" y="120">Spiritual salvation and adab;</text><text class="cell" x="474" y="137">harmonizing worldly success (dunya)</text><text class="cell" x="474" y="154">with accountability to Allah (akhirah)</text></g><g id="comp-knowledge"><text class="sh" x="34" y="215">Knowledge</text><text class="cell" x="174" y="210">Reason (Plato), observation</text><text class="cell" x="174" y="227">(Aristotle), nature (Rousseau),</text><text class="cell" x="174" y="244">and inquiry testing (Dewey)</text><text class="cell" x="474" y="210">Divine revelation (Wahy) integrated</text><text class="cell" x="474" y="227">with human reason (aql) and</text><text class="cell" x="474" y="244">empirical sensory observation</text></g><g id="comp-teacher"><text class="sh" x="34" y="310">Teacher</text><text class="cell" x="174" y="305">Facilitator, Socratic questioner,</text><text class="cell" x="174" y="322">instructor, democratic guide,</text><text class="cell" x="174" y="339">and stage setter for inquiry</text><text class="cell" x="474" y="305">Moral exemplar and spiritual guide</text><text class="cell" x="474" y="322">(murshid); guardian of character;</text><text class="cell" x="474" y="339">embodies knowledge in conduct</text></g><g id="comp-morals"><text class="sh" x="34" y="405">Morals</text><text class="cell" x="174" y="400">Civic harmony, habituated virtue,</text><text class="cell" x="174" y="417">and social democratic agreement</text><text class="cell" x="474" y="400">Divine commands, Prophetic model,</text><text class="cell" x="474" y="417">and spiritual purification</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Western and Muslim educational thinkers compared</text><text id="label-caption" class="small" x="24" y="490">Both traditions value reason and virtue; Muslim thought anchors knowledge in divine purpose.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>