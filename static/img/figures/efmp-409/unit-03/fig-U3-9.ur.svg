<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">علامہ اقبال کا تعلیمی فلسفہ</title><desc id="d">علامہ اقبال کے تعلیمی فلسفے کا تصوراتی خاکہ جس کے مرکز میں خودی ہے، اور اس سے متحرک جدوجہد، عقل و عشق کی ہم آہنگی، استاد بطور روحانی رہنما، مربوط نصاب اور خود انحصاری کی شاخیں نکلتی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="290" y="210" width="200" height="80" rx="12"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="210" x2="580" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="210" x2="200" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="250" x2="590" y2="250" marker-end="url(#arrow)"/><line class="stroke" x1="290" y1="250" x2="190" y2="250" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="290" x2="530" y2="385" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="290" x2="250" y2="385" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-center"><text class="h" x="390" y="242" text-anchor="middle">‏خودی‏</text><text class="sh" x="390" y="262" text-anchor="middle">‏(ذات / انا)‏</text><text class="small" x="390" y="280" text-anchor="middle">‏اخلاقی انفرادیت‏</text></g><g id="node-action"><rect class="panel-b" x="500" y="80" width="230" height="55" rx="8"/><text class="sh" x="615" y="102" text-anchor="middle">‏بامقصد عمل (تگ و دو)‏</text><text class="small" x="615" y="122" text-anchor="middle">‏تقدیر پرستی کے خلاف متحرک جدوجہد‏</text></g><g id="node-balance"><rect class="panel-b" x="50" y="80" width="230" height="55" rx="8"/><text class="sh" x="165" y="102" text-anchor="middle">‏عقل و عشق کی ہم آہنگی‏</text><text class="small" x="165" y="122" text-anchor="middle">‏اخلاقی بصیرت کی رہنمائی میں عقل‏</text></g><g id="node-teacher"><rect class="panel-b" x="590" y="222" width="170" height="55" rx="8"/><text class="sh" x="675" y="245" text-anchor="middle">‏استاد بطور مرشد‏</text><text class="small" x="675" y="265" text-anchor="middle">‏باطنی آگ جگاتا ہے‏</text></g><g id="node-shaheen"><rect class="panel-b" x="20" y="222" width="170" height="55" rx="8"/><text class="sh" x="105" y="245" text-anchor="middle">‏علامت: شاہین‏</text><text class="small" x="105" y="265" text-anchor="middle">‏خود انحصاری، جرأت‏</text></g><g id="node-curriculum"><rect class="panel-b" x="430" y="385" width="240" height="55" rx="8"/><text class="sh" x="550" y="407" text-anchor="middle">‏مربوط نصاب‏</text><text class="small" x="550" y="427" text-anchor="middle">‏تجربی سائنس اور روحانی اخلاقیات‏</text></g><g id="node-community"><rect class="panel-b" x="110" y="385" width="240" height="55" rx="8"/><text class="sh" x="230" y="407" text-anchor="middle">‏ملت کی خدمت‏</text><text class="small" x="230" y="427" text-anchor="middle">‏معاشرے میں فرد کی تکمیل‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="750" y="35" text-anchor="end">‏علامہ اقبال کا تعلیمی فلسفہ‏</text><text id="label-caption" class="small" x="750" y="485" text-anchor="end">‏خودی فعال خود شناسی ہے: جرأت، تخلیقی عقل، اخلاقی بصیرت اور اجتماعی فرض کی پرورش۔‏</text><text class="wm" x="30" y="505" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
