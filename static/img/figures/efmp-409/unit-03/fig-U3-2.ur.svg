<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ریاست میں افلاطون کے تعلیمی مراحل</title><desc id="d">ریاست میں افلاطون کے تعلیمی مراحل کو عمر کے گروہوں کے لحاظ سے دکھانے والا خاکہ: بچپن میں کھیل اور کہانیاں، نوجوانی میں جسمانی ورزش اور موسیقی، جوانی میں فوجی خدمت، اعلیٰ ریاضی اور جدلیات، اور آخر میں فلسفی محافظ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="30" y="55" width="720" height="65" rx="8"/><rect class="panel-b" x="30" y="135" width="720" height="65" rx="8"/><rect class="panel" x="30" y="215" width="720" height="65" rx="8"/><rect class="panel-a" x="30" y="295" width="720" height="75" rx="8"/><rect class="panel-b" x="30" y="385" width="720" height="65" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="120" x2="390" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="200" x2="390" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="280" x2="390" y2="295" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="370" x2="390" y2="385" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="stage-1"><text class="sh" x="735" y="77" text-anchor="end">‏مرحلہ 1: عمر 0 سے 6 سال (ابتدائی بچپن)‏</text><text class="cell" x="735" y="105" text-anchor="end">‏اچھی عادتیں بنانے کے لیے کھیل، جسمانی کھیل، بچوں کی نظمیں اور اخلاقی کہانیاں۔‏</text></g><g id="stage-2"><text class="sh" x="735" y="157" text-anchor="end">‏مرحلہ 2: عمر 7 سے 17 سال (پرائمری اور ثانوی تشکیل)‏</text><text class="cell" x="735" y="185" text-anchor="end">‏جسم کے لیے ورزش؛ روح میں ہم آہنگی کے لیے موسیقی اور شاعری۔‏</text></g><g id="stage-3"><text class="sh" x="735" y="237" text-anchor="end">‏مرحلہ 3: عمر 18 سے 20 سال (فوجی اور شہری خدمت)‏</text><text class="cell" x="735" y="265" text-anchor="end">‏جسمانی نظم و ضبط اور شہری خدمت؛ جرأت اور ضبطِ نفس کی آزمائش۔‏</text></g><g id="stage-4"><text class="sh" x="735" y="317" text-anchor="end">‏مرحلہ 4: عمر 20 سے 35 سال (اعلیٰ سائنسی اور جدلیاتی مطالعہ)‏</text><text class="cell" x="735" y="345" text-anchor="end">‏عمر 20 سے 30: ریاضی اور فلکیات۔ عمر 30 سے 35: جدلیاتی تحقیق۔‏</text></g><g id="stage-5"><text class="sh" x="735" y="407" text-anchor="end">‏مرحلہ 5: عمر 35 سے 50+ (عملی قیادت اور حکمرانی)‏</text><text class="cell" x="735" y="435" text-anchor="end">‏پندرہ سال کا شہری انتظام، جس کا انجام دانا محافظت ہے۔‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="750" y="35" text-anchor="end">‏ریاست میں افلاطون کے تعلیمی مراحل‏</text><text id="label-caption" class="small" x="750" y="480" text-anchor="end">‏تعلیم ابتدائی حسی کھیل سے پختہ جدلیات اور اخلاقی قیادت تک ایک کٹھن، عمر بھر کا سفر ہے۔‏</text><text class="wm" x="30" y="505" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
