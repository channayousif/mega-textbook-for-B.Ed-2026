<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Naturalism and Rousseau's stages in Emile</title><desc id="d">Table presenting Rousseau's four developmental stages in Emile: infancy (motor freedom), childhood (sensory training and negative education), pre-adolescence (utility and manual trade), and adolescence (moral and social development).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="180" x2="756" y2="180"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="365" x2="756" y2="365"/><line class="frame" x1="180" y1="50" x2="180" y2="465"/><line class="frame" x1="475" y1="50" x2="475" y2="465"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Stage and age</text><text class="h" x="194" y="78">Focus and method</text><text class="h" x="485" y="78">Educational principle</text><g id="stage-infancy"><text class="sh" x="34" y="125">1. Infancy</text><text class="small" x="34" y="145">(Ages 0 to 5)</text><text class="cell" x="194" y="122">Physical growth, free movement,</text><text class="cell" x="194" y="139">and bodily care; direct contact</text><text class="cell" x="194" y="156">with physical surroundings</text><text class="cell" x="485" y="122">Avoid swaddling and early curbs;</text><text class="cell" x="485" y="139">build natural strength;</text><text class="cell" x="485" y="156">no moral preaching</text></g><g id="stage-childhood"><text class="sh" x="34" y="210">2. Childhood</text><text class="small" x="34" y="230">(Ages 5 to 12)</text><text class="cell" x="194" y="207">Sensory education; natural</text><text class="cell" x="194" y="224">consequences; outdoor play;</text><text class="cell" x="194" y="241">negative education</text><text class="cell" x="485" y="207">Do not rush book learning;</text><text class="cell" x="485" y="224">let experience teach effects;</text><text class="cell" x="485" y="241">educate senses before mind</text></g><g id="stage-preadolescence"><text class="sh" x="34" y="300">3. Pre-adolescence</text><text class="small" x="34" y="320">(Ages 12 to 15)</text><text class="cell" x="194" y="297">Intellectual curiosity, geography,</text><text class="cell" x="194" y="314">and manual trade (carpentry);</text><text class="cell" x="194" y="331">utility and inquiry</text><text class="cell" x="485" y="297">Read Robinson Crusoe;</text><text class="cell" x="485" y="314">connect study to real needs;</text><text class="cell" x="485" y="331">respect manual labour</text></g><g id="stage-adolescence"><text class="sh" x="34" y="390">4. Adolescence</text><text class="small" x="34" y="410">(Ages 15 to 20)</text><text class="cell" x="194" y="387">Moral education, social empathy,</text><text class="cell" x="194" y="404">civic duties, and emotional</text><text class="cell" x="194" y="421">maturation into community</text><text class="cell" x="485" y="387">Awakening of conscience;</text><text class="cell" x="485" y="404">learning human dignity;</text><text class="cell" x="485" y="421">faith without hypocrisy</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Naturalism and Rousseau's stages in Emile</text><text id="label-caption" class="small" x="24" y="490">Rousseau aligns education with nature: physical freedom, sensory training, utility, then moral reasoning.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>