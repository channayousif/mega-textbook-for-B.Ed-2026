<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Plato's educational stages in The Republic</title><desc id="d">Diagram illustrating Plato's educational stages in The Republic across age brackets: childhood play and stories, youth gymnastics and music, young adult military service, higher mathematics and dialectic, culminating in philosopher-guardians.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="30" y="55" width="720" height="65" rx="8"/><rect class="panel-b" x="30" y="135" width="720" height="65" rx="8"/><rect class="panel" x="30" y="215" width="720" height="65" rx="8"/><rect class="panel-a" x="30" y="295" width="720" height="75" rx="8"/><rect class="panel-b" x="30" y="385" width="720" height="65" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="120" x2="390" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="200" x2="390" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="280" x2="390" y2="295" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="370" x2="390" y2="385" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="stage-1"><text class="sh" x="45" y="80">Stage 1: Ages 0 to 6 (Early Childhood)</text><text class="cell" x="45" y="102">Play, physical games, nursery rhymes, and moral stories to form good habits.</text></g><g id="stage-2"><text class="sh" x="45" y="160">Stage 2: Ages 7 to 17 (Primary and Secondary Formation)</text><text class="cell" x="45" y="182">Gymnastics for the body; music and poetry to build harmony in the soul.</text></g><g id="stage-3"><text class="sh" x="45" y="240">Stage 3: Ages 18 to 20 (Military and Civic Service)</text><text class="cell" x="45" y="262">Physical discipline and civic service; testing courage and self-control.</text></g><g id="stage-4"><text class="sh" x="45" y="320">Stage 4: Ages 20 to 35 (Higher Scientific and Dialectic Studies)</text><text class="cell" x="45" y="342">Ages 20 to 30: Mathematics and astronomy. Ages 30 to 35: Dialectic inquiry.</text></g><g id="stage-5"><text class="sh" x="45" y="410">Stage 5: Ages 35 to 50+ (Practical Leadership and Governance)</text><text class="cell" x="45" y="432">Fifteen years of civic administration, culminating in wise guardianship.</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="30" y="35">Plato's stages of education in The Republic</text><text id="label-caption" class="small" x="30" y="480">Education is a rigorous, lifelong journey from early sensory play to mature dialectic and moral leadership.</text><text class="wm" x="750" y="505" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>