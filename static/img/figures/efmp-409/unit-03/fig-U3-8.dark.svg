<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Pragmatism and Ibn Khaldun compared</title><desc id="d">Table comparing pragmatism and Ibn Khaldun across learning approach, method, discipline, and knowledge goals, showing practical pedagogical parallels alongside differing philosophical roots.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="185" x2="756" y2="185"/><line class="frame" x1="24" y1="280" x2="756" y2="280"/><line class="frame" x1="24" y1="375" x2="756" y2="375"/><line class="frame" x1="160" y1="50" x2="160" y2="465"/><line class="frame" x1="460" y1="50" x2="460" y2="465"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Dimension</text><text class="h" x="174" y="78">Pragmatism (John Dewey)</text><text class="h" x="474" y="78">Ibn Khaldun</text><g id="dim-learning"><text class="sh" x="34" y="125">Learning</text><text class="cell" x="174" y="120">Learning by doing; reconstruction</text><text class="cell" x="174" y="137">of experience; inquiry solves</text><text class="cell" x="174" y="154">real environmental problems</text><text class="cell" x="474" y="120">Acquisition of lasting faculty (malaka);</text><text class="cell" x="474" y="137">practical application rather than</text><text class="cell" x="474" y="154">rote memorization of words</text></g><g id="dim-pedagogy"><text class="sh" x="34" y="215">Method</text><text class="cell" x="174" y="210">Project method, problem solving,</text><text class="cell" x="174" y="227">and integrated curriculum;</text><text class="cell" x="174" y="244">collaborative group work</text><text class="cell" x="474" y="210">Gradual instruction (at-tadrij):</text><text class="cell" x="474" y="227">general overview, deeper details,</text><text class="cell" x="474" y="244">and final masterly synthesis</text></g><g id="dim-discipline"><text class="sh" x="34" y="310">Discipline</text><text class="cell" x="174" y="305">Democratic self-discipline;</text><text class="cell" x="174" y="322">shared community responsibility;</text><text class="cell" x="174" y="339">teacher as co-investigator</text><text class="cell" x="474" y="305">Strict ban on corporal punishment;</text><text class="cell" x="474" y="322">cruelty ruins pupil character and</text><text class="cell" x="474" y="339">breeds fear and deceit</text></g><g id="dim-worldview"><text class="sh" x="34" y="405">Knowledge</text><text class="cell" x="174" y="400">Values are socially tested;</text><text class="cell" x="174" y="417">ideas are tools for growth</text><text class="cell" x="474" y="400">Knowledge serves civic life (umran)</text><text class="cell" x="474" y="417">and accountability to Allah</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Pragmatism and Ibn Khaldun compared</text><text id="label-caption" class="small" x="24" y="490">Both stress practical mastery and reject coercion, though Ibn Khaldun grounds learning in Islamic ethics.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>