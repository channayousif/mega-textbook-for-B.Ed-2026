<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Idealism and realism on the origin of knowledge</title><desc id="d">Diagram contrasting idealism and realism: idealism shows knowledge originating in eternal Forms accessed through pure reason, while realism shows knowledge originating in the physical world accessed through sensory observation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="30" y="60" width="345" height="395" rx="8"/><rect class="panel-b" x="405" y="60" width="345" height="395" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="202" y1="160" x2="202" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="202" y1="270" x2="202" y2="305" marker-end="url(#arrow)"/><line class="stroke" x1="577" y1="160" x2="577" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="577" y1="270" x2="577" y2="305" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="left-idealism"><text class="h" x="202" y="95" text-anchor="middle">Idealism (Plato)</text><text class="small" x="202" y="115" text-anchor="middle">Knowledge originates in the mind and ideas</text><rect class="panel" x="50" y="130" width="305" height="45" rx="6"/><text class="sh" x="202" y="157" text-anchor="middle">Realm of Eternal Ideas (Forms)</text><rect class="panel" x="50" y="205" width="305" height="55" rx="6"/><text class="cell" x="202" y="227" text-anchor="middle">Mental Reflection and Dialectic</text><text class="small" x="202" y="247" text-anchor="middle">Reason uncovers innate truth</text><rect class="panel" x="50" y="315" width="305" height="55" rx="6"/><text class="cell" x="202" y="337" text-anchor="middle">Spiritual and Moral Insight</text><text class="small" x="202" y="357" text-anchor="middle">Sensory particulars are imperfect copies</text><text class="sh" x="202" y="420" text-anchor="middle">Core: Reality is spiritual and mental</text></g><g id="right-realism"><text class="h" x="577" y="95" text-anchor="middle">Realism (Aristotle)</text><text class="small" x="577" y="115" text-anchor="middle">Knowledge originates in the physical world</text><rect class="panel" x="425" y="130" width="305" height="45" rx="6"/><text class="sh" x="577" y="157" text-anchor="middle">Objective Physical World (Matter and Form)</text><rect class="panel" x="425" y="205" width="305" height="55" rx="6"/><text class="cell" x="577" y="227" text-anchor="middle">Sensory Observation and Experience</text><text class="small" x="577" y="247" text-anchor="middle">Senses perceive external objects</text><rect class="panel" x="425" y="315" width="305" height="55" rx="6"/><text class="cell" x="577" y="337" text-anchor="middle">Inductive Demonstration and Science</text><text class="small" x="577" y="357" text-anchor="middle">Mind abstracts universal natural laws</text><text class="sh" x="577" y="420" text-anchor="middle">Core: Reality exists independent of mind</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="30" y="35">Idealism and realism on the origin of knowledge</text><text id="label-caption" class="small" x="30" y="480">Plato looks inward to universal Forms; Aristotle looks outward to concrete physical particulars.</text><text class="wm" x="750" y="505" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>