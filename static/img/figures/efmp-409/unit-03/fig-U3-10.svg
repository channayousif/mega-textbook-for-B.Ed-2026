<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three verses by Allama Iqbal on education</title><desc id="d">Table of three educational verses by Allama Iqbal from Bang-e-Dra and Bal-e-Jibril, explaining their core messages on moral leadership, self-respect, and purposeful action.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="215" x2="756" y2="215"/><line class="frame" x1="24" y1="335" x2="756" y2="335"/><line class="frame" x1="160" y1="50" x2="160" y2="465"/><line class="frame" x1="470" y1="50" x2="470" y2="465"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Work</text><text class="h" x="174" y="78">Verse and translation</text><text class="h" x="484" y="78">Educational meaning</text><g id="verse-1"><text class="sh" x="34" y="125">Bang-e-Dra</text><text class="small" x="34" y="145">(1924)</text><text class="small" x="34" y="165">Moral aim</text><text class="cell" x="174" y="120">"Sabaq phir parh sadaqat ka..."</text><text class="small" x="174" y="145">(Learn again the lesson of truth,</text><text class="small" x="174" y="165">justice, and courage)</text><text class="cell" x="484" y="120">Education builds core virtues</text><text class="cell" x="484" y="137">(truth, fairness, courage) so youth</text><text class="cell" x="484" y="154">provide ethical leadership.</text></g><g id="verse-2"><text class="sh" x="34" y="245">Bal-e-Jibril</text><text class="small" x="34" y="265">(1935)</text><text class="small" x="34" y="285">Self-respect</text><text class="cell" x="174" y="240">"Ghairat hai bari cheez..."</text><text class="small" x="174" y="265">(Self-respect is supreme; it crowns</text><text class="small" x="174" y="285">the humble with true honour)</text><text class="cell" x="484" y="240">Schooling must develop honour</text><text class="cell" x="484" y="257">and moral autonomy; teachers must</text><text class="cell" x="484" y="274">never crush student dignity.</text></g><g id="verse-3"><text class="sh" x="34" y="365">Bang-e-Dra</text><text class="small" x="34" y="385">(1924)</text><text class="small" x="34" y="405">Action</text><text class="cell" x="174" y="360">"Aml se zindagi banti hai..."</text><text class="small" x="174" y="385">(Action makes life heaven or hell;</text><text class="small" x="174" y="405">human nature is made by doing)</text><text class="cell" x="484" y="360">Knowledge is proven in action;</text><text class="cell" x="484" y="377">schools must prioritize action</text><text class="cell" x="484" y="394">over passive memorization.</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Three verses by Allama Iqbal on education</text><text id="label-caption" class="small" x="24" y="490">Iqbal's poetry demands moral character, human dignity, and purposeful action in education.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>