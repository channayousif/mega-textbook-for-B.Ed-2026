<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Dewey's cycle of learning by experience</title><desc id="d">Flowchart of Dewey's inquiry cycle: encountering a genuine problem, gathering observations, forming a hypothesis, taking active testing action, and reflecting on consequences.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"></g><g id="layer-edges"><line class="stroke" x1="380" y1="105" x2="380" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="380" y1="190" x2="380" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="380" y1="275" x2="380" y2="305" marker-end="url(#arrow)"/><line class="stroke" x1="380" y1="360" x2="380" y2="390" marker-end="url(#arrow)"/><path class="dash" d="M570,420 L640,420 L640,80 L575,80" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-step1"><rect class="panel-a" x="190" y="55" width="380" height="50" rx="25"/><text class="sh" x="380" y="78" text-anchor="middle">1. Encounter an authentic problem</text><text class="small" x="380" y="96" text-anchor="middle">A real difficulty or question in the pupil's environment</text></g><g id="node-step2"><rect class="panel-b" x="190" y="140" width="380" height="50" rx="8"/><text class="sh" x="380" y="163" text-anchor="middle">2. Intellectualize and gather data</text><text class="small" x="380" y="181" text-anchor="middle">Observing, collecting facts, and defining conditions</text></g><g id="node-step3"><rect class="panel-b" x="190" y="225" width="380" height="50" rx="8"/><text class="sh" x="380" y="248" text-anchor="middle">3. Formulate hypotheses and plans</text><text class="small" x="380" y="266" text-anchor="middle">Generating creative ideas and predicting consequences</text></g><g id="node-step4"><rect class="panel-b" x="190" y="310" width="380" height="50" rx="8"/><text class="sh" x="380" y="333" text-anchor="middle">4. Test hypothesis through action</text><text class="small" x="380" y="351" text-anchor="middle">Active experimentation, building, or doing in the real world</text></g><g id="node-step5"><rect class="panel-a" x="190" y="395" width="380" height="50" rx="25"/><text class="sh" x="380" y="418" text-anchor="middle">5. Reflect and reconstruct experience</text><text class="small" x="380" y="436" text-anchor="middle">Analysing results to gain meaning and direct future action</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="30" y="35">Dewey's cycle of learning by experience</text><text id="label-caption" class="small" x="30" y="480">Learning is an ongoing inquiry loop: action tests thought, and reflection transforms experience.</text><text class="small" x="650" y="240">Reconstructed</text><text class="small" x="650" y="258">experience leads</text><text class="small" x="650" y="276">to new inquiry</text><text class="wm" x="750" y="505" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>