<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم میں واقعیت</title><desc id="d">تعلیم میں واقعیت کا خلاصہ پیش کرنے والا جدول: فطری دنیا سے ہم آہنگی اور یودیمونیا کے مقاصد، فطری علوم اور ریاضی پر مبنی نصاب، عملی مظاہرے اور مشاہدے کے طریقے، استاد بطور ماہر معلم، اور طالب علم بطور معروضی مشاہدہ کرنے والا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="95" x2="24" y2="95"/><line class="frame" x1="756" y1="175" x2="24" y2="175"/><line class="frame" x1="756" y1="255" x2="24" y2="255"/><line class="frame" x1="756" y1="330" x2="24" y2="330"/><line class="frame" x1="756" y1="395" x2="24" y2="395"/><line class="frame" x1="596" y1="50" x2="596" y2="465"/><line class="frame" x1="296" y1="50" x2="296" y2="465"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏جزو‏</text><text class="h" x="586" y="78" text-anchor="end">‏واقعیت پسند نقطۂ نظر‏</text><text class="h" x="286" y="78" text-anchor="end">‏ارسطوئی عمل‏</text><g id="node-aims"><text class="sh" x="746" y="122" text-anchor="end">‏تعلیمی مقاصد‏</text><text class="cell" x="586" y="114" text-anchor="end">‏طبعی دنیا سے ہم آہنگی؛‏</text><text class="cell" x="586" y="134" text-anchor="end">‏حقائق سے عقلی سوچ کی نشوونما؛‏</text><text class="cell" x="586" y="154" text-anchor="end">‏انسانی فلاح (یودیمونیا)‏</text><text class="cell" x="286" y="114" text-anchor="end">‏مشق سے فضائل کی عادت؛‏</text><text class="cell" x="286" y="134" text-anchor="end">‏فطرت کو سمجھنے کے لیے عقل کی تربیت؛‏</text><text class="cell" x="286" y="154" text-anchor="end">‏فعال شہری زندگی کی تیاری‏</text></g><g id="node-curriculum"><text class="sh" x="746" y="202" text-anchor="end">‏نصاب‏</text><text class="cell" x="586" y="194" text-anchor="end">‏فطری علوم، حیاتیات، ریاضی،‏</text><text class="cell" x="586" y="214" text-anchor="end">‏جغرافیہ اور عملی مہارتیں؛‏</text><text class="cell" x="586" y="234" text-anchor="end">‏معروضی حقیقت کا علم‏</text><text class="cell" x="286" y="194" text-anchor="end">‏فطری صورتوں کی درجہ بندی؛‏</text><text class="cell" x="286" y="214" text-anchor="end">‏منطق، اخلاقیات اور سیاسیات؛‏</text><text class="cell" x="286" y="234" text-anchor="end">‏طبعی حقائق کا مطالعہ‏</text></g><g id="node-method"><text class="sh" x="746" y="280" text-anchor="end">‏طریقۂ تدریس‏</text><text class="cell" x="586" y="272" text-anchor="end">‏حسی مشاہدہ اور عملی مظاہرہ؛‏</text><text class="cell" x="586" y="292" text-anchor="end">‏تجربات اور مطالعاتی دورے؛‏</text><text class="cell" x="586" y="312" text-anchor="end">‏جزئیات سے استقرائی منطق‏</text><text class="cell" x="286" y="272" text-anchor="end">‏حقیقی اشیا کا معائنہ؛‏</text><text class="cell" x="286" y="292" text-anchor="end">‏پیمائش اور درجہ بندی؛‏</text><text class="cell" x="286" y="312" text-anchor="end">‏قواعد سے پہلے اخلاقی عادتیں‏</text></g><g id="node-teacher"><text class="sh" x="746" y="355" text-anchor="end">‏استاد کا کردار‏</text><text class="cell" x="586" y="348.5" text-anchor="end">‏حقیقت کو ماہرانہ طور پر پیش کرنے والا؛‏</text><text class="cell" x="586" y="368.5" text-anchor="end">‏مشاہدات کو معروضی ترتیب دیتا ہے‏</text><text class="cell" x="286" y="348.5" text-anchor="end">‏فطرت کا درست مظاہرہ کرتا ہے؛‏</text><text class="cell" x="286" y="368.5" text-anchor="end">‏بلا تعصب رہنمائی کرتا ہے‏</text></g><g id="node-pupil"><text class="sh" x="746" y="425" text-anchor="end">‏طالب علم کا کردار‏</text><text class="cell" x="586" y="418.5" text-anchor="end">‏فطرت کا توجہ سے مشاہدہ کرنے والا؛‏</text><text class="cell" x="586" y="438.5" text-anchor="end">‏حقائق کو منظم طور پر درج کرنے والا‏</text><text class="cell" x="286" y="418.5" text-anchor="end">‏خیالات کو ثبوت پر پرکھتا ہے؛‏</text><text class="cell" x="286" y="438.5" text-anchor="end">‏نیک اعمال کی مشق کرتا ہے‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏تعلیم میں واقعیت‏</text><text id="label-caption" class="small" x="756" y="490" text-anchor="end">‏واقعیت سیکھنے کی بنیاد حسی مشاہدے، فطری قوانین اور اخلاقی فضیلت کی عادت سازی پر رکھتی ہے۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
