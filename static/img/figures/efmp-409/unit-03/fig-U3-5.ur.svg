<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فطریت اور ایمیل میں روسو کے مراحل</title><desc id="d">ایمیل میں روسو کے نشوونما کے چار مراحل پیش کرنے والا جدول: شیرخوارگی (حرکت کی آزادی)، بچپن (حسی تربیت اور منفی تعلیم)، قبل از بلوغت (افادیت اور ہاتھ کا ہنر)، اور مراہقت (اخلاقی اور سماجی نشوونما)۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="95" x2="24" y2="95"/><line class="frame" x1="756" y1="180" x2="24" y2="180"/><line class="frame" x1="756" y1="275" x2="24" y2="275"/><line class="frame" x1="756" y1="365" x2="24" y2="365"/><line class="frame" x1="600" y1="50" x2="600" y2="465"/><line class="frame" x1="305" y1="50" x2="305" y2="465"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏مرحلہ اور عمر‏</text><text class="h" x="586" y="78" text-anchor="end">‏توجہ اور طریقہ‏</text><text class="h" x="295" y="78" text-anchor="end">‏تعلیمی اصول‏</text><g id="stage-infancy"><text class="sh" x="746" y="125" text-anchor="end">‏1. شیرخوارگی‏</text><text class="small" x="746" y="145" text-anchor="end">‏(عمر 0 سے 5)‏</text><text class="cell" x="586" y="119" text-anchor="end">‏جسمانی نشوونما، آزاد حرکت،‏</text><text class="cell" x="586" y="139" text-anchor="end">‏اور جسم کی دیکھ بھال؛ طبعی‏</text><text class="cell" x="586" y="159" text-anchor="end">‏ماحول سے براہِ راست رابطہ‏</text><text class="cell" x="295" y="119" text-anchor="end">‏کس کر لپیٹنے اور ابتدائی پابندیوں سے گریز؛‏</text><text class="cell" x="295" y="139" text-anchor="end">‏فطری قوت کی تعمیر؛‏</text><text class="cell" x="295" y="159" text-anchor="end">‏اخلاقی وعظ نہیں‏</text></g><g id="stage-childhood"><text class="sh" x="746" y="210" text-anchor="end">‏2. بچپن‏</text><text class="small" x="746" y="230" text-anchor="end">‏(عمر 5 سے 12)‏</text><text class="cell" x="586" y="204" text-anchor="end">‏حسی تعلیم؛ فطری‏</text><text class="cell" x="586" y="224" text-anchor="end">‏نتائج؛ کھلی فضا میں کھیل؛‏</text><text class="cell" x="586" y="244" text-anchor="end">‏منفی تعلیم‏</text><text class="cell" x="295" y="204" text-anchor="end">‏کتابی تعلیم میں جلدی نہیں؛‏</text><text class="cell" x="295" y="224" text-anchor="end">‏تجربے کو نتائج سکھانے دیں؛‏</text><text class="cell" x="295" y="244" text-anchor="end">‏ذہن سے پہلے حواس کی تعلیم‏</text></g><g id="stage-preadolescence"><text class="sh" x="746" y="300" text-anchor="end">‏3. قبل از بلوغت‏</text><text class="small" x="746" y="320" text-anchor="end">‏(عمر 12 سے 15)‏</text><text class="cell" x="586" y="294" text-anchor="end">‏ذہنی تجسس، جغرافیہ،‏</text><text class="cell" x="586" y="314" text-anchor="end">‏اور دستی ہنر (بڑھئی کا کام)؛‏</text><text class="cell" x="586" y="334" text-anchor="end">‏افادیت اور تحقیق‏</text><text class="cell" x="295" y="294" text-anchor="end">‏رابنسن کروسو پڑھنا؛‏</text><text class="cell" x="295" y="314" text-anchor="end">‏مطالعے کو حقیقی ضرورتوں سے جوڑنا؛‏</text><text class="cell" x="295" y="334" text-anchor="end">‏جسمانی محنت کا احترام‏</text></g><g id="stage-adolescence"><text class="sh" x="746" y="390" text-anchor="end">‏4. مراہقت‏</text><text class="small" x="746" y="410" text-anchor="end">‏(عمر 15 سے 20)‏</text><text class="cell" x="586" y="384" text-anchor="end">‏اخلاقی تعلیم، سماجی ہمدردی،‏</text><text class="cell" x="586" y="404" text-anchor="end">‏شہری فرائض، اور جذباتی‏</text><text class="cell" x="586" y="424" text-anchor="end">‏پختگی کے ساتھ برادری میں شمولیت‏</text><text class="cell" x="295" y="384" text-anchor="end">‏ضمیر کی بیداری؛‏</text><text class="cell" x="295" y="404" text-anchor="end">‏انسانی وقار کا سبق؛‏</text><text class="cell" x="295" y="424" text-anchor="end">‏منافقت سے پاک ایمان‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏فطریت اور ایمیل میں روسو کے مراحل‏</text><text id="label-caption" class="small" x="756" y="490" text-anchor="end">‏روسو تعلیم کو فطرت سے ہم آہنگ کرتے ہیں: جسمانی آزادی، حسی تربیت، افادیت، پھر اخلاقی استدلال۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
