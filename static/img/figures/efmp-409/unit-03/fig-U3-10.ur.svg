<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم پر علامہ اقبال کے تین اشعار</title><desc id="d">بانگِ درا اور بالِ جبریل سے علامہ اقبال کے تین تعلیمی اشعار کا جدول، جو اخلاقی قیادت، عزتِ نفس اور بامقصد عمل کے بارے میں ان کے بنیادی پیغامات کی وضاحت کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="95" x2="24" y2="95"/><line class="frame" x1="756" y1="215" x2="24" y2="215"/><line class="frame" x1="756" y1="335" x2="24" y2="335"/><line class="frame" x1="620" y1="50" x2="620" y2="465"/><line class="frame" x1="310" y1="50" x2="310" y2="465"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏تصنیف‏</text><text class="h" x="606" y="78" text-anchor="end">‏شعر اور مفہوم‏</text><text class="h" x="296" y="78" text-anchor="end">‏تعلیمی معنی‏</text><g id="verse-1"><text class="sh" x="746" y="125" text-anchor="end">‏بانگِ درا‏</text><text class="small" x="746" y="145" text-anchor="end">(1924)</text><text class="small" x="746" y="165" text-anchor="end">‏اخلاقی مقصد‏</text><text class="cell" x="606" y="120" text-anchor="end">‏”سبق پھر پڑھ صداقت کا...“‏</text><text class="small" x="606" y="145" text-anchor="end">‏(سچائی، انصاف اور جرأت کا‏</text><text class="small" x="606" y="165" text-anchor="end">‏سبق پھر سے پڑھ)‏</text><text class="cell" x="296" y="117" text-anchor="end">‏تعلیم بنیادی فضائل پیدا کرتی ہے‏</text><text class="cell" x="296" y="137" text-anchor="end">‏(سچائی، انصاف، جرأت) تاکہ نوجوان‏</text><text class="cell" x="296" y="157" text-anchor="end">‏اخلاقی قیادت فراہم کریں۔‏</text></g><g id="verse-2"><text class="sh" x="746" y="245" text-anchor="end">‏بالِ جبریل‏</text><text class="small" x="746" y="265" text-anchor="end">(1935)</text><text class="small" x="746" y="285" text-anchor="end">‏عزتِ نفس‏</text><text class="cell" x="606" y="240" text-anchor="end">‏”غیرت ہے بڑی چیز...“‏</text><text class="small" x="606" y="265" text-anchor="end">‏(غیرت سب سے بڑی چیز ہے؛ یہ‏</text><text class="small" x="606" y="285" text-anchor="end">‏درویش کو حقیقی عزت کا تاج پہناتی ہے)‏</text><text class="cell" x="296" y="237" text-anchor="end">‏اسکولنگ کو عزت اور اخلاقی‏</text><text class="cell" x="296" y="257" text-anchor="end">‏خود مختاری پیدا کرنی چاہیے؛ اساتذہ‏</text><text class="cell" x="296" y="277" text-anchor="end">‏طالب علم کا وقار کبھی نہ کچلیں۔‏</text></g><g id="verse-3"><text class="sh" x="746" y="365" text-anchor="end">‏بانگِ درا‏</text><text class="small" x="746" y="385" text-anchor="end">(1924)</text><text class="small" x="746" y="405" text-anchor="end">‏عمل‏</text><text class="cell" x="606" y="360" text-anchor="end">‏”عمل سے زندگی بنتی ہے...“‏</text><text class="small" x="606" y="385" text-anchor="end">‏(عمل سے زندگی جنت بھی بنتی ہے‏</text><text class="small" x="606" y="405" text-anchor="end">‏اور جہنم بھی؛ انسان عمل سے بنتا ہے)‏</text><text class="cell" x="296" y="357" text-anchor="end">‏علم عمل میں ثابت ہوتا ہے؛‏</text><text class="cell" x="296" y="377" text-anchor="end">‏اسکول غیر فعال رٹے پر‏</text><text class="cell" x="296" y="397" text-anchor="end">‏عمل کو ترجیح دیں۔‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏تعلیم پر علامہ اقبال کے تین اشعار‏</text><text id="label-caption" class="small" x="756" y="490" text-anchor="end">‏اقبال کی شاعری تعلیم میں اخلاقی کردار، انسانی وقار اور بامقصد عمل کا تقاضا کرتی ہے۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
