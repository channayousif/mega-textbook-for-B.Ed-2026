<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">علم کے ماخذ کے بارے میں مثالیات اور واقعیت</title><desc id="d">مثالیات اور واقعیت کا تقابل کرنے والا خاکہ: مثالیات دکھاتی ہے کہ علم ابدی امثال سے جنم لیتا ہے جن تک خالص عقل کے ذریعے رسائی ہوتی ہے، جبکہ واقعیت دکھاتی ہے کہ علم طبعی دنیا سے جنم لیتا ہے جس تک حسی مشاہدے کے ذریعے رسائی ہوتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="405" y="60" width="345" height="395" rx="8"/><rect class="panel-b" x="30" y="60" width="345" height="395" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="578" y1="160" x2="578" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="578" y1="270" x2="578" y2="305" marker-end="url(#arrow)"/><line class="stroke" x1="203" y1="160" x2="203" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="203" y1="270" x2="203" y2="305" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="left-idealism"><text class="h" x="578" y="95" text-anchor="middle">‏مثالیات (افلاطون)‏</text><text class="small" x="578" y="115" text-anchor="middle">‏علم ذہن اور تصورات سے جنم لیتا ہے‏</text><rect class="panel" x="425" y="130" width="305" height="45" rx="6"/><text class="sh" x="578" y="157" text-anchor="middle">‏ابدی تصورات (امثال) کا عالم‏</text><rect class="panel" x="425" y="205" width="305" height="55" rx="6"/><text class="cell" x="578" y="225" text-anchor="middle">‏ذہنی غور و فکر اور جدلیات‏</text><text class="small" x="578" y="249" text-anchor="middle">‏عقل پیدائشی سچائی کو آشکار کرتی ہے‏</text><rect class="panel" x="425" y="315" width="305" height="55" rx="6"/><text class="cell" x="578" y="335" text-anchor="middle">‏روحانی اور اخلاقی بصیرت‏</text><text class="small" x="578" y="359" text-anchor="middle">‏حسی جزئیات ناقص نقلیں ہیں‏</text><text class="sh" x="578" y="420" text-anchor="middle">‏مرکز: حقیقت روحانی اور ذہنی ہے‏</text></g><g id="right-realism"><text class="h" x="203" y="95" text-anchor="middle">‏واقعیت (ارسطو)‏</text><text class="small" x="203" y="115" text-anchor="middle">‏علم طبعی دنیا سے جنم لیتا ہے‏</text><rect class="panel" x="50" y="130" width="305" height="45" rx="6"/><text class="sh" x="203" y="157" text-anchor="middle">‏معروضی طبعی دنیا (مادہ اور صورت)‏</text><rect class="panel" x="50" y="205" width="305" height="55" rx="6"/><text class="cell" x="203" y="225" text-anchor="middle">‏حسی مشاہدہ اور تجربہ‏</text><text class="small" x="203" y="249" text-anchor="middle">‏حواس بیرونی اشیا کا ادراک کرتے ہیں‏</text><rect class="panel" x="50" y="315" width="305" height="55" rx="6"/><text class="cell" x="203" y="335" text-anchor="middle">‏استقرائی مظاہرہ اور سائنس‏</text><text class="small" x="203" y="359" text-anchor="middle">‏ذہن آفاقی فطری قوانین اخذ کرتا ہے‏</text><text class="sh" x="203" y="420" text-anchor="middle">‏مرکز: حقیقت ذہن سے آزاد موجود ہے‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="750" y="35" text-anchor="end">‏علم کے ماخذ کے بارے میں مثالیات اور واقعیت‏</text><text id="label-caption" class="small" x="750" y="480" text-anchor="end">‏افلاطون اندر کی طرف آفاقی امثال کو دیکھتے ہیں؛ ارسطو باہر کی طرف ٹھوس طبعی جزئیات کو۔‏</text><text class="wm" x="30" y="505" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
