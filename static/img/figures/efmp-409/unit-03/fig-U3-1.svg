<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Idealism in education</title><desc id="d">Table summarizing idealism in education: aims of spiritual and intellectual self-realisation, curriculum of humanities and enduring ideas, Socratic and discussion methods, teacher as moral role model, and pupil as active seeker of truth.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="255" x2="756" y2="255"/><line class="frame" x1="24" y1="330" x2="756" y2="330"/><line class="frame" x1="24" y1="395" x2="756" y2="395"/><line class="frame" x1="184" y1="50" x2="184" y2="465"/><line class="frame" x1="484" y1="50" x2="484" y2="465"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Component</text><text class="h" x="194" y="78">Idealist view</text><text class="h" x="494" y="78">Platonic emphasis</text><g id="node-aims"><text class="sh" x="34" y="122">Educational aims</text><text class="cell" x="194" y="117">Spiritual and intellectual growth;</text><text class="cell" x="194" y="134">realisation of truth and goodness;</text><text class="cell" x="194" y="151">building moral character</text><text class="cell" x="494" y="117">Cultivating justice in the soul;</text><text class="cell" x="494" y="134">producing virtuous citizens;</text><text class="cell" x="494" y="151">turning the mind toward Good</text></g><g id="node-curriculum"><text class="sh" x="34" y="202">Curriculum</text><text class="cell" x="194" y="197">Humanities, philosophy, ethics,</text><text class="cell" x="194" y="214">history, religion, and math;</text><text class="cell" x="194" y="231">enduring cultural heritage</text><text class="cell" x="494" y="197">Music and gymnastics in youth;</text><text class="cell" x="494" y="214">geometry and astronomy;</text><text class="cell" x="494" y="231">dialectic for mature thinkers</text></g><g id="node-method"><text class="sh" x="34" y="280">Teaching method</text><text class="cell" x="194" y="275">Socratic dialectic; discussion;</text><text class="cell" x="194" y="292">guided reflection and inquiry;</text><text class="cell" x="194" y="309">drawing out innate knowledge</text><text class="cell" x="494" y="275">Questions to test assumptions;</text><text class="cell" x="494" y="292">resolving debates rationally;</text><text class="cell" x="494" y="309">awakening insight within</text></g><g id="node-teacher"><text class="sh" x="34" y="355">Role of teacher</text><text class="cell" x="194" y="350">Moral exemplar and guide;</text><text class="cell" x="194" y="367">gardener of spiritual growth</text><text class="cell" x="494" y="350">Guides the soul from the cave</text><text class="cell" x="494" y="367">into the light of truth</text></g><g id="node-pupil"><text class="sh" x="34" y="425">Role of pupil</text><text class="cell" x="194" y="420">Active seeker of truth;</text><text class="cell" x="194" y="437">striving for self-realisation</text><text class="cell" x="494" y="420">Disciplines appetites and</text><text class="cell" x="494" y="437">cultivates higher reason</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Idealism in education</text><text id="label-caption" class="small" x="24" y="490">Idealism prioritises spiritual and moral development through lasting ideas and Socratic dialogue.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>