<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم میں مثالیات</title><desc id="d">تعلیم میں مثالیات کا خلاصہ پیش کرنے والا جدول: روحانی اور ذہنی خود شناسی کے مقاصد، انسانیات اور پائیدار تصورات پر مبنی نصاب، سقراطی اور مباحثے کے طریقے، استاد بطور اخلاقی نمونہ، اور طالب علم بطور سچائی کا فعال متلاشی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="95" x2="24" y2="95"/><line class="frame" x1="756" y1="175" x2="24" y2="175"/><line class="frame" x1="756" y1="255" x2="24" y2="255"/><line class="frame" x1="756" y1="330" x2="24" y2="330"/><line class="frame" x1="756" y1="395" x2="24" y2="395"/><line class="frame" x1="596" y1="50" x2="596" y2="465"/><line class="frame" x1="296" y1="50" x2="296" y2="465"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏جزو‏</text><text class="h" x="586" y="78" text-anchor="end">‏مثالی نقطۂ نظر‏</text><text class="h" x="286" y="78" text-anchor="end">‏افلاطونی زور‏</text><g id="node-aims"><text class="sh" x="746" y="122" text-anchor="end">‏تعلیمی مقاصد‏</text><text class="cell" x="586" y="114" text-anchor="end">‏روحانی اور ذہنی نشوونما؛‏</text><text class="cell" x="586" y="134" text-anchor="end">‏سچائی اور نیکی کا ادراک؛‏</text><text class="cell" x="586" y="154" text-anchor="end">‏اخلاقی کردار کی تعمیر‏</text><text class="cell" x="286" y="114" text-anchor="end">‏روح میں انصاف کی پرورش؛‏</text><text class="cell" x="286" y="134" text-anchor="end">‏نیک شہری تیار کرنا؛‏</text><text class="cell" x="286" y="154" text-anchor="end">‏ذہن کا رخ خیر کی طرف موڑنا‏</text></g><g id="node-curriculum"><text class="sh" x="746" y="202" text-anchor="end">‏نصاب‏</text><text class="cell" x="586" y="194" text-anchor="end">‏انسانیات، فلسفہ، اخلاقیات،‏</text><text class="cell" x="586" y="214" text-anchor="end">‏تاریخ، مذہب اور ریاضی؛‏</text><text class="cell" x="586" y="234" text-anchor="end">‏پائیدار ثقافتی ورثہ‏</text><text class="cell" x="286" y="194" text-anchor="end">‏نوجوانی میں موسیقی اور ورزش؛‏</text><text class="cell" x="286" y="214" text-anchor="end">‏جیومیٹری اور فلکیات؛‏</text><text class="cell" x="286" y="234" text-anchor="end">‏پختہ مفکرین کے لیے جدلیات‏</text></g><g id="node-method"><text class="sh" x="746" y="280" text-anchor="end">‏طریقۂ تدریس‏</text><text class="cell" x="586" y="272" text-anchor="end">‏سقراطی جدلیات؛ مباحثہ؛‏</text><text class="cell" x="586" y="292" text-anchor="end">‏رہنمائی میں غور و فکر اور تحقیق؛‏</text><text class="cell" x="586" y="312" text-anchor="end">‏پیدائشی علم کو باہر لانا‏</text><text class="cell" x="286" y="272" text-anchor="end">‏مفروضات پرکھنے والے سوالات؛‏</text><text class="cell" x="286" y="292" text-anchor="end">‏مباحث کا عقلی حل؛‏</text><text class="cell" x="286" y="312" text-anchor="end">‏باطنی بصیرت کی بیداری‏</text></g><g id="node-teacher"><text class="sh" x="746" y="355" text-anchor="end">‏استاد کا کردار‏</text><text class="cell" x="586" y="348.5" text-anchor="end">‏اخلاقی نمونہ اور رہنما؛‏</text><text class="cell" x="586" y="368.5" text-anchor="end">‏روحانی نشوونما کا باغبان‏</text><text class="cell" x="286" y="348.5" text-anchor="end">‏روح کو غار سے نکال کر‏</text><text class="cell" x="286" y="368.5" text-anchor="end">‏سچائی کی روشنی میں لاتا ہے‏</text></g><g id="node-pupil"><text class="sh" x="746" y="425" text-anchor="end">‏طالب علم کا کردار‏</text><text class="cell" x="586" y="418.5" text-anchor="end">‏سچائی کا فعال متلاشی؛‏</text><text class="cell" x="586" y="438.5" text-anchor="end">‏خود شناسی کے لیے کوشاں‏</text><text class="cell" x="286" y="418.5" text-anchor="end">‏خواہشات پر قابو پاتا اور‏</text><text class="cell" x="286" y="438.5" text-anchor="end">‏اعلیٰ عقل کو پروان چڑھاتا ہے‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏تعلیم میں مثالیات‏</text><text id="label-caption" class="small" x="756" y="490" text-anchor="end">‏مثالیات پائیدار تصورات اور سقراطی مکالمے کے ذریعے روحانی اور اخلاقی نشوونما کو ترجیح دیتی ہے۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
