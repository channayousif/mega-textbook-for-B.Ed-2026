<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مغربی اور مسلم تعلیمی مفکرین کا تقابل</title><desc id="d">تعلیم کے مقاصد، علم کے ماخذ، استاد کے کردار اور اخلاقی نشوونما کے بارے میں مغربی اور مسلم تعلیمی فکر کا تقابل کرنے والا جدول، جو مشترکہ اقدار اور امتیازی روحانی وابستگیوں دونوں کو واضح کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="95" x2="24" y2="95"/><line class="frame" x1="756" y1="185" x2="24" y2="185"/><line class="frame" x1="756" y1="280" x2="24" y2="280"/><line class="frame" x1="756" y1="375" x2="24" y2="375"/><line class="frame" x1="620" y1="50" x2="620" y2="465"/><line class="frame" x1="320" y1="50" x2="320" y2="465"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏پہلو‏</text><text class="h" x="606" y="78" text-anchor="end">‏مغربی مفکرین‏</text><text class="h" x="306" y="78" text-anchor="end">‏مسلم علما‏</text><g id="comp-aims"><text class="sh" x="746" y="125" text-anchor="end">‏بنیادی مقصد‏</text><text class="cell" x="606" y="117" text-anchor="end">‏عقلی خود مختاری، تحقیق،‏</text><text class="cell" x="606" y="137" text-anchor="end">‏انسانی فلاح (یودیمونیا)،‏</text><text class="cell" x="606" y="157" text-anchor="end">‏اور جمہوری شہریت‏</text><text class="cell" x="306" y="117" text-anchor="end">‏روحانی نجات اور ادب؛‏</text><text class="cell" x="306" y="137" text-anchor="end">‏دنیاوی کامیابی (دنیا) کو‏</text><text class="cell" x="306" y="157" text-anchor="end">‏اللہ کے حضور جواب دہی (آخرت) سے ہم آہنگ کرنا‏</text></g><g id="comp-knowledge"><text class="sh" x="746" y="215" text-anchor="end">‏علم‏</text><text class="cell" x="606" y="207" text-anchor="end">‏عقل (افلاطون)، مشاہدہ‏</text><text class="cell" x="606" y="227" text-anchor="end">‏(ارسطو)، فطرت (روسو)،‏</text><text class="cell" x="606" y="247" text-anchor="end">‏اور تحقیقی آزمائش (ڈیوی)‏</text><text class="cell" x="306" y="207" text-anchor="end">‏الٰہی وحی کے ساتھ‏</text><text class="cell" x="306" y="227" text-anchor="end">‏انسانی عقل اور‏</text><text class="cell" x="306" y="247" text-anchor="end">‏تجربی حسی مشاہدے کا امتزاج‏</text></g><g id="comp-teacher"><text class="sh" x="746" y="310" text-anchor="end">‏استاد‏</text><text class="cell" x="606" y="302" text-anchor="end">‏سہولت کار، سقراطی سوال کنندہ،‏</text><text class="cell" x="606" y="322" text-anchor="end">‏معلم، جمہوری رہنما،‏</text><text class="cell" x="606" y="342" text-anchor="end">‏اور تحقیق کے لیے ماحول ساز‏</text><text class="cell" x="306" y="302" text-anchor="end">‏اخلاقی نمونہ اور روحانی رہنما‏</text><text class="cell" x="306" y="322" text-anchor="end">‏(مرشد)؛ کردار کا محافظ؛‏</text><text class="cell" x="306" y="342" text-anchor="end">‏علم کو عمل میں ڈھالتا ہے‏</text></g><g id="comp-morals"><text class="sh" x="746" y="405" text-anchor="end">‏اخلاق‏</text><text class="cell" x="606" y="398.5" text-anchor="end">‏شہری ہم آہنگی، عادت سے فضیلت،‏</text><text class="cell" x="606" y="418.5" text-anchor="end">‏اور سماجی جمہوری اتفاق‏</text><text class="cell" x="306" y="398.5" text-anchor="end">‏الٰہی احکام، اسوۂ نبوی،‏</text><text class="cell" x="306" y="418.5" text-anchor="end">‏اور روحانی تزکیہ‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏مغربی اور مسلم تعلیمی مفکرین کا تقابل‏</text><text id="label-caption" class="small" x="756" y="490" text-anchor="end">‏دونوں روایات عقل اور فضیلت کی قدر کرتی ہیں؛ مسلم فکر علم کو الٰہی مقصد سے وابستہ کرتی ہے۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
