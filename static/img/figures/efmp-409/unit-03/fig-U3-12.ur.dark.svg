<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم کے نمایاں مسلم علما</title><desc id="d">کلاسیکی دور سے جدید زمانے تک بڑے مسلم تعلیمی علما کو دکھانے والی زمانی ترتیب: امام غزالی، ابن خلدون، شاہ ولی اللہ، سر سید احمد خان اور علامہ اقبال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="30" y="65" width="720" height="65" rx="6"/><rect class="panel-b" x="30" y="145" width="720" height="65" rx="6"/><rect class="panel-a" x="30" y="225" width="720" height="65" rx="6"/><rect class="panel-b" x="30" y="305" width="720" height="65" rx="6"/><rect class="panel-a" x="30" y="385" width="720" height="65" rx="6"/></g><g id="layer-edges"><line class="stroke" x1="600" y1="50" x2="600" y2="455"/></g><g id="layer-nodes"><g id="node-ghazali"><circle cx="600" cy="97" r="7" class="ah"/><text class="sh" x="740" y="90" text-anchor="end">‏امام غزالی‏</text><text class="small" x="740" y="114" text-anchor="end">‏1058 - 1111 ء‏</text><text class="cell" x="580" y="90" text-anchor="end">‏روحانی تزکیہ اور ذہنی نظم‏</text><text class="small" x="580" y="114" text-anchor="end">‏اہم تصنیف: احیاء علوم الدین (دینی علوم کا احیا؛ ادب اور اخلاق)‏</text></g><g id="node-khaldun-2"><circle cx="600" cy="177" r="7" class="ah"/><text class="sh" x="740" y="170" text-anchor="end">‏ابن خلدون‏</text><text class="small" x="740" y="194" text-anchor="end">‏1332 - 1406 ء‏</text><text class="cell" x="580" y="170" text-anchor="end">‏تدریجی تعلیم (التدریج) اور عملی مہارت (ملکہ)‏</text><text class="small" x="580" y="194" text-anchor="end">‏اہم تصنیف: مقدمہ (سیکھنے کی پیش رو عمرانیات؛ سختی نہیں)‏</text></g><g id="node-waliullah"><circle cx="600" cy="257" r="7" class="ah"/><text class="sh" x="740" y="250" text-anchor="end">‏شاہ ولی اللہ‏</text><text class="small" x="740" y="274" text-anchor="end">‏1703 - 1762 ء‏</text><text class="cell" x="580" y="250" text-anchor="end">‏نصابی اصلاح اور سماجی تجدید‏</text><text class="small" x="580" y="274" text-anchor="end">‏اہم تصنیف: حجۃ اللہ البالغہ (نصاب کی اصلاح، عقل کا توازن)‏</text></g><g id="node-syed"><circle cx="600" cy="337" r="7" class="ah"/><text class="sh" x="740" y="330" text-anchor="end">‏سر سید احمد خان‏</text><text class="small" x="740" y="354" text-anchor="end">‏1817 - 1898 ء‏</text><text class="cell" x="580" y="330" text-anchor="end">‏جدید سائنسی تعلیم اور عقلی تحقیق‏</text><text class="small" x="580" y="354" text-anchor="end">‏اہم ورثہ: ایم اے او کالج علی گڑھ (سائنٹفک سوسائٹی، جدید تعلیم)‏</text></g><g id="node-iqbal-2"><circle cx="600" cy="417" r="7" class="ah"/><text class="sh" x="740" y="410" text-anchor="end">‏علامہ اقبال‏</text><text class="small" x="740" y="434" text-anchor="end">‏1877 - 1938 ء‏</text><text class="cell" x="580" y="410" text-anchor="end">‏فلسفۂ خودی اور متحرک جدوجہد‏</text><text class="small" x="580" y="434" text-anchor="end">‏اہم تصانیف: اسرارِ خودی، بانگِ درا، تشکیلِ جدید (تخلیقی تدریسیات)‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="750" y="35" text-anchor="end">‏تعلیم کے نمایاں مسلم علما‏</text><text id="label-caption" class="small" x="750" y="475" text-anchor="end">‏ایک مسلسل فکری ورثہ: قرونِ وسطیٰ کے روحانی امتزاج سے جدید تعلیمی احیا تک۔‏</text><text class="wm" x="30" y="500" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
