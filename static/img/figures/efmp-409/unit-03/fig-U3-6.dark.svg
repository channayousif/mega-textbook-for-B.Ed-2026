<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Lifetimes and major works of educational thinkers</title><desc id="d">Timeline showing the lifetimes and landmark works of major educational thinkers: Plato, Aristotle, Ibn Khaldun, Rousseau, Dewey, and Iqbal from ancient Greece to the modern era.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="30" y="60" width="720" height="55" rx="6"/><rect class="panel-b" x="30" y="125" width="720" height="55" rx="6"/><rect class="panel-a" x="30" y="190" width="720" height="55" rx="6"/><rect class="panel-b" x="30" y="255" width="720" height="55" rx="6"/><rect class="panel-a" x="30" y="320" width="720" height="55" rx="6"/><rect class="panel-b" x="30" y="385" width="720" height="55" rx="6"/></g><g id="layer-edges"><line class="stroke" x1="160" y1="50" x2="160" y2="450"/></g><g id="layer-nodes"><g id="node-plato"><circle cx="160" cy="87" r="7" class="ah"/><text class="sh" x="40" y="83">Plato</text><text class="small" x="40" y="100">c. 428 - 348 BCE</text><text class="cell" x="180" y="83">Idealism; founder of the Academy in Athens</text><text class="small" x="180" y="100">Key work: The Republic (allegory of cave, dialectic, philosopher-guardians)</text></g><g id="node-aristotle"><circle cx="160" cy="152" r="7" class="ah"/><text class="sh" x="40" y="148">Aristotle</text><text class="small" x="40" y="165">384 - 322 BCE</text><text class="cell" x="180" y="148">Realism; founder of the Lyceum</text><text class="small" x="180" y="165">Key works: Politics and Ethics (virtue by habituation, eudaimonia)</text></g><g id="node-khaldun"><circle cx="160" cy="217" r="7" class="ah"/><text class="sh" x="40" y="213">Ibn Khaldun</text><text class="small" x="40" y="230">1332 - 1406 CE</text><text class="cell" x="180" y="213">Sociology of learning and empirical pedagogy</text><text class="small" x="180" y="230">Key work: The Muqaddimah (gradual learning, mastery of habits, no harshness)</text></g><g id="node-rousseau"><circle cx="160" cy="282" r="7" class="ah"/><text class="sh" x="40" y="278">Rousseau</text><text class="small" x="40" y="295">1712 - 1778 CE</text><text class="cell" x="180" y="278">Naturalism; child-centred education</text><text class="small" x="180" y="295">Key work: Emile, or On Education (negative education, natural growth stages)</text></g><g id="node-dewey"><circle cx="160" cy="347" r="7" class="ah"/><text class="sh" x="40" y="343">John Dewey</text><text class="small" x="40" y="360">1859 - 1952 CE</text><text class="cell" x="180" y="343">Pragmatism and progressive education</text><text class="small" x="180" y="360">Key work: Democracy and Education (learning by doing, reflective inquiry)</text></g><g id="node-iqbal"><circle cx="160" cy="412" r="7" class="ah"/><text class="sh" x="40" y="408">Allama Iqbal</text><text class="small" x="40" y="425">1877 - 1938 CE</text><text class="cell" x="180" y="408">Islamic educational synthesis and philosophy of selfhood</text><text class="small" x="180" y="425">Key works: Asrar-e-Khudi, Bang-e-Dra, The Reconstruction (Khudi, intellect and love)</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="30" y="35">Lifetimes and major works of educational thinkers</text><text id="label-caption" class="small" x="30" y="475">Timeline bridging ancient Greek, Muslim classical, and modern educational thinkers.</text><text class="wm" x="750" y="500" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>