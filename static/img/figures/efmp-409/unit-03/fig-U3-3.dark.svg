<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Realism in education</title><desc id="d">Table summarizing realism in education: aims of adjusting to the natural world and eudaimonia, curriculum of natural sciences and mathematics, demonstration and observation methods, teacher as expert instructor, and pupil as objective observer.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="255" x2="756" y2="255"/><line class="frame" x1="24" y1="330" x2="756" y2="330"/><line class="frame" x1="24" y1="395" x2="756" y2="395"/><line class="frame" x1="184" y1="50" x2="184" y2="465"/><line class="frame" x1="484" y1="50" x2="484" y2="465"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Component</text><text class="h" x="194" y="78">Realist view</text><text class="h" x="494" y="78">Aristotelian practice</text><g id="node-aims"><text class="sh" x="34" y="122">Educational aims</text><text class="cell" x="194" y="117">Adjust to the physical world;</text><text class="cell" x="194" y="134">develop rational thinking from facts;</text><text class="cell" x="194" y="151">human flourishing (eudaimonia)</text><text class="cell" x="494" y="117">Habituate virtues through practice;</text><text class="cell" x="494" y="134">train reason to understand nature;</text><text class="cell" x="494" y="151">prepare for active civic life</text></g><g id="node-curriculum"><text class="sh" x="34" y="202">Curriculum</text><text class="cell" x="194" y="197">Natural sciences, biology, math,</text><text class="cell" x="194" y="214">geography, and practical skills;</text><text class="cell" x="194" y="231">knowledge of objective reality</text><text class="cell" x="494" y="197">Classification of natural forms;</text><text class="cell" x="494" y="214">logic, ethics, and politics;</text><text class="cell" x="494" y="231">study of physical facts</text></g><g id="node-method"><text class="sh" x="34" y="280">Teaching method</text><text class="cell" x="194" y="275">Sensory observation and demonstration;</text><text class="cell" x="194" y="292">experiments and field visits;</text><text class="cell" x="194" y="309">inductive logic from specifics</text><text class="cell" x="494" y="275">Inspection of real objects;</text><text class="cell" x="494" y="292">measuring and categorizing;</text><text class="cell" x="494" y="309">moral habits before rules</text></g><g id="node-teacher"><text class="sh" x="34" y="355">Role of teacher</text><text class="cell" x="194" y="350">Expert presenter of factual reality;</text><text class="cell" x="194" y="367">organizes observations objectively</text><text class="cell" x="494" y="350">Demonstrates nature accurately;</text><text class="cell" x="494" y="367">guides pupils without bias</text></g><g id="node-pupil"><text class="sh" x="34" y="425">Role of pupil</text><text class="cell" x="194" y="420">Attentive observer of nature;</text><text class="cell" x="194" y="437">disciplined recorder of facts</text><text class="cell" x="494" y="420">Tests ideas against evidence;</text><text class="cell" x="494" y="437">practices virtuous actions</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Realism in education</text><text id="label-caption" class="small" x="24" y="490">Realism grounds learning in sensory observation, natural laws, and habituation of moral virtue.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>