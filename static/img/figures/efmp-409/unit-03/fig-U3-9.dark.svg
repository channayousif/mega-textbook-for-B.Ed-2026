<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Allama Iqbal's educational philosophy</title><desc id="d">Concept map of Allama Iqbal's educational philosophy with Khudi at the centre, branching into dynamic struggle, harmony of intellect and love, the teacher as spiritual guide, integrated curriculum, and self-reliance.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="290" y="210" width="200" height="80" rx="12"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="210" x2="200" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="210" x2="580" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="290" y1="250" x2="190" y2="250" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="250" x2="590" y2="250" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="290" x2="250" y2="385" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="290" x2="530" y2="385" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-center"><text class="h" x="390" y="242" text-anchor="middle">KHUDI</text><text class="sh" x="390" y="262" text-anchor="middle">(Selfhood / Ego)</text><text class="small" x="390" y="280" text-anchor="middle">Moral Individuality</text></g><g id="node-action"><rect class="panel-b" x="50" y="80" width="230" height="55" rx="8"/><text class="sh" x="165" y="102" text-anchor="middle">Purposeful Action (Tag-o-Dou)</text><text class="small" x="165" y="122" text-anchor="middle">Dynamic struggle against fatalism</text></g><g id="node-balance"><rect class="panel-b" x="500" y="80" width="230" height="55" rx="8"/><text class="sh" x="615" y="102" text-anchor="middle">Harmony of Aql and Ishq</text><text class="small" x="615" y="122" text-anchor="middle">Intellect guided by moral vision</text></g><g id="node-teacher"><rect class="panel-b" x="20" y="222" width="170" height="55" rx="8"/><text class="sh" x="105" y="245" text-anchor="middle">Teacher as Murshid</text><text class="small" x="105" y="265" text-anchor="middle">Awakens inner fire</text></g><g id="node-shaheen"><rect class="panel-b" x="590" y="222" width="170" height="55" rx="8"/><text class="sh" x="675" y="245" text-anchor="middle">Symbol: Shaheen</text><text class="small" x="675" y="265" text-anchor="middle">Self-reliance, courage</text></g><g id="node-curriculum"><rect class="panel-b" x="110" y="385" width="240" height="55" rx="8"/><text class="sh" x="230" y="407" text-anchor="middle">Integrated Curriculum</text><text class="small" x="230" y="427" text-anchor="middle">Empirical science plus spiritual ethics</text></g><g id="node-community"><rect class="panel-b" x="430" y="385" width="240" height="55" rx="8"/><text class="sh" x="550" y="407" text-anchor="middle">Service to Millat (Community)</text><text class="small" x="550" y="427" text-anchor="middle">Individual realized within society</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="30" y="35">Allama Iqbal's educational philosophy</text><text id="label-caption" class="small" x="30" y="485">Khudi is active self-realisation: cultivating courage, creative intellect, moral vision, and communal duty.</text><text class="wm" x="750" y="505" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>