<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تجربے کے ذریعے سیکھنے کا ڈیوی کا دائرہ</title><desc id="d">ڈیوی کے تحقیقی دائرے کا بہاؤ نقشہ: ایک حقیقی مسئلے کا سامنا، مشاہدات جمع کرنا، مفروضہ قائم کرنا، فعال آزمائشی عمل کرنا، اور نتائج پر غور کرنا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"></g><g id="layer-edges"><line class="stroke" x1="400" y1="105" x2="400" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="400" y1="190" x2="400" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="400" y1="275" x2="400" y2="305" marker-end="url(#arrow)"/><line class="stroke" x1="400" y1="360" x2="400" y2="390" marker-end="url(#arrow)"/><path class="dash" d="M210 420 L140 420 L140 80 L205 80" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-step1"><rect class="panel-a" x="210" y="55" width="380" height="50" rx="25"/><text class="sh" x="400" y="78" text-anchor="middle">‏1. حقیقی مسئلے کا سامنا‏</text><text class="small" x="400" y="96" text-anchor="middle">‏طالب علم کے ماحول میں کوئی حقیقی مشکل یا سوال‏</text></g><g id="node-step2"><rect class="panel-b" x="210" y="140" width="380" height="50" rx="8"/><text class="sh" x="400" y="163" text-anchor="middle">‏2. غور کرنا اور معلومات جمع کرنا‏</text><text class="small" x="400" y="181" text-anchor="middle">‏مشاہدہ، حقائق جمع کرنا اور شرائط متعین کرنا‏</text></g><g id="node-step3"><rect class="panel-b" x="210" y="225" width="380" height="50" rx="8"/><text class="sh" x="400" y="248" text-anchor="middle">‏3. مفروضات اور منصوبے بنانا‏</text><text class="small" x="400" y="266" text-anchor="middle">‏تخلیقی خیالات سامنے لانا اور نتائج کی پیش گوئی‏</text></g><g id="node-step4"><rect class="panel-b" x="210" y="310" width="380" height="50" rx="8"/><text class="sh" x="400" y="333" text-anchor="middle">‏4. عمل کے ذریعے مفروضے کی آزمائش‏</text><text class="small" x="400" y="351" text-anchor="middle">‏حقیقی دنیا میں فعال تجربہ، تعمیر یا عمل‏</text></g><g id="node-step5"><rect class="panel-a" x="210" y="395" width="380" height="50" rx="25"/><text class="sh" x="400" y="418" text-anchor="middle">‏5. غور و فکر اور تجربے کی تعمیرِ نو‏</text><text class="small" x="400" y="436" text-anchor="middle">‏مفہوم پانے اور آئندہ عمل کی سمت کے لیے نتائج کا تجزیہ‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="750" y="35" text-anchor="end">‏تجربے کے ذریعے سیکھنے کا ڈیوی کا دائرہ‏</text><text id="label-caption" class="small" x="750" y="480" text-anchor="end">‏سیکھنا ایک جاری تحقیقی دائرہ ہے: عمل سوچ کو پرکھتا ہے اور غور و فکر تجربے کو بدلتا ہے۔‏</text><text class="small" x="130" y="238" text-anchor="end">‏تعمیرِ نو شدہ‏</text><text class="small" x="130" y="258" text-anchor="end">‏تجربہ نئی‏</text><text class="small" x="130" y="278" text-anchor="end">‏تحقیق تک لے جاتا ہے‏</text><text class="wm" x="30" y="505" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
