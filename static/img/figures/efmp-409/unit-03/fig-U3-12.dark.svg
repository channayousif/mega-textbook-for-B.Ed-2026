<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Prominent Muslim scholars of education</title><desc id="d">Timeline displaying major Muslim educational scholars from the classical era to modern times: Al-Ghazali, Ibn Khaldun, Shah Waliullah, Sir Syed Ahmad Khan, and Allama Iqbal.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="30" y="65" width="720" height="65" rx="6"/><rect class="panel-b" x="30" y="145" width="720" height="65" rx="6"/><rect class="panel-a" x="30" y="225" width="720" height="65" rx="6"/><rect class="panel-b" x="30" y="305" width="720" height="65" rx="6"/><rect class="panel-a" x="30" y="385" width="720" height="65" rx="6"/></g><g id="layer-edges"><line class="stroke" x1="180" y1="50" x2="180" y2="455"/></g><g id="layer-nodes"><g id="node-ghazali"><circle cx="180" cy="97" r="7" class="ah"/><text class="sh" x="40" y="93">Al-Ghazali</text><text class="small" x="40" y="112">1058 - 1111 CE</text><text class="cell" x="200" y="93">Spiritual purification and intellectual discipline</text><text class="small" x="200" y="112">Key work: Ihya Ulum al-Din (Revival of Religious Sciences; adab and ethics)</text></g><g id="node-khaldun-2"><circle cx="180" cy="177" r="7" class="ah"/><text class="sh" x="40" y="173">Ibn Khaldun</text><text class="small" x="40" y="192">1332 - 1406 CE</text><text class="cell" x="200" y="173">Gradual learning (at-tadrij) and practical mastery (malaka)</text><text class="small" x="200" y="192">Key work: The Muqaddimah (pioneering sociology of learning; no harshness)</text></g><g id="node-waliullah"><circle cx="180" cy="257" r="7" class="ah"/><text class="sh" x="40" y="253">Shah Waliullah</text><text class="small" x="40" y="272">1703 - 1762 CE</text><text class="cell" x="200" y="253">Curricular reform and social renewal</text><text class="small" x="200" y="272">Key work: Hujjat Allah al-Baligha (reform of curriculum, balance of reason)</text></g><g id="node-syed"><circle cx="180" cy="337" r="7" class="ah"/><text class="sh" x="40" y="333">Sir Syed Ahmad</text><text class="small" x="40" y="352">1817 - 1898 CE</text><text class="cell" x="200" y="333">Modern scientific education and rational inquiry</text><text class="small" x="200" y="352">Key legacy: MAO College Aligarh (scientific society, modern learning)</text></g><g id="node-iqbal-2"><circle cx="180" cy="417" r="7" class="ah"/><text class="sh" x="40" y="413">Allama Iqbal</text><text class="small" x="40" y="432">1877 - 1938 CE</text><text class="cell" x="200" y="413">Philosophy of Khudi (selfhood) and dynamic struggle</text><text class="small" x="200" y="432">Key works: Asrar-e-Khudi, Bang-e-Dra, The Reconstruction (creative pedagogy)</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="30" y="35">Prominent Muslim scholars of education</text><text id="label-caption" class="small" x="30" y="475">A continuous intellectual legacy: from medieval spiritual synthesis to modern educational revival.</text><text class="wm" x="750" y="500" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>