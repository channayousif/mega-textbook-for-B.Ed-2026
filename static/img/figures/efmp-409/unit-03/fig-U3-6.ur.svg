<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی مفکرین کی زندگیاں اور اہم تصانیف</title><desc id="d">بڑے تعلیمی مفکرین کی زندگیوں اور اہم تصانیف کو دکھانے والی زمانی ترتیب: قدیم یونان سے جدید دور تک افلاطون، ارسطو، ابن خلدون، روسو، ڈیوی اور اقبال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel-a" x="30" y="60" width="720" height="55" rx="6"/><rect class="panel-b" x="30" y="125" width="720" height="55" rx="6"/><rect class="panel-a" x="30" y="190" width="720" height="55" rx="6"/><rect class="panel-b" x="30" y="255" width="720" height="55" rx="6"/><rect class="panel-a" x="30" y="320" width="720" height="55" rx="6"/><rect class="panel-b" x="30" y="385" width="720" height="55" rx="6"/></g><g id="layer-edges"><line class="stroke" x1="620" y1="50" x2="620" y2="450"/></g><g id="layer-nodes"><g id="node-plato"><circle cx="620" cy="87" r="7" class="ah"/><text class="sh" x="740" y="80" text-anchor="end">‏افلاطون‏</text><text class="small" x="740" y="102" text-anchor="end">‏تقریباً 428 - 348 ق م‏</text><text class="cell" x="600" y="80" text-anchor="end">‏مثالیات؛ ایتھنز میں اکیڈمی کے بانی‏</text><text class="small" x="600" y="102" text-anchor="end">‏اہم تصنیف: ریاست (تمثیلِ غار، جدلیات، فلسفی محافظ)‏</text></g><g id="node-aristotle"><circle cx="620" cy="152" r="7" class="ah"/><text class="sh" x="740" y="145" text-anchor="end">‏ارسطو‏</text><text class="small" x="740" y="167" text-anchor="end">‏384 - 322 ق م‏</text><text class="cell" x="600" y="145" text-anchor="end">‏واقعیت؛ لائسیئم کے بانی‏</text><text class="small" x="600" y="167" text-anchor="end">‏اہم تصانیف: سیاسیات اور اخلاقیات (عادت سے فضیلت، یودیمونیا)‏</text></g><g id="node-khaldun"><circle cx="620" cy="217" r="7" class="ah"/><text class="sh" x="740" y="210" text-anchor="end">‏ابن خلدون‏</text><text class="small" x="740" y="232" text-anchor="end">‏1332 - 1406 ء‏</text><text class="cell" x="600" y="210" text-anchor="end">‏سیکھنے کی عمرانیات اور تجربی تدریسیات‏</text><text class="small" x="600" y="232" text-anchor="end">‏اہم تصنیف: مقدمہ (تدریجی تعلیم، عادتوں میں مہارت، سختی نہیں)‏</text></g><g id="node-rousseau"><circle cx="620" cy="282" r="7" class="ah"/><text class="sh" x="740" y="275" text-anchor="end">‏روسو‏</text><text class="small" x="740" y="297" text-anchor="end">‏1712 - 1778 ء‏</text><text class="cell" x="600" y="275" text-anchor="end">‏فطریت؛ بچہ مرکز تعلیم‏</text><text class="small" x="600" y="297" text-anchor="end">‏اہم تصنیف: ایمیل (منفی تعلیم، فطری نشوونما کے مراحل)‏</text></g><g id="node-dewey"><circle cx="620" cy="347" r="7" class="ah"/><text class="sh" x="740" y="340" text-anchor="end">‏جان ڈیوی‏</text><text class="small" x="740" y="362" text-anchor="end">‏1859 - 1952 ء‏</text><text class="cell" x="600" y="340" text-anchor="end">‏افادیت پسندی اور ترقی پسند تعلیم‏</text><text class="small" x="600" y="362" text-anchor="end">‏اہم تصنیف: جمہوریت اور تعلیم (کر کے سیکھنا، تاملی تحقیق)‏</text></g><g id="node-iqbal"><circle cx="620" cy="412" r="7" class="ah"/><text class="sh" x="740" y="405" text-anchor="end">‏علامہ اقبال‏</text><text class="small" x="740" y="427" text-anchor="end">‏1877 - 1938 ء‏</text><text class="cell" x="600" y="405" text-anchor="end">‏اسلامی تعلیمی امتزاج اور فلسفۂ خودی‏</text><text class="small" x="600" y="427" text-anchor="end">‏اہم تصانیف: اسرارِ خودی، بانگِ درا، تشکیلِ جدید (خودی، عقل و عشق)‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="750" y="35" text-anchor="end">‏تعلیمی مفکرین کی زندگیاں اور اہم تصانیف‏</text><text id="label-caption" class="small" x="750" y="475" text-anchor="end">‏قدیم یونانی، کلاسیکی مسلم اور جدید تعلیمی مفکرین کو جوڑنے والی زمانی ترتیب۔‏</text><text class="wm" x="30" y="500" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
