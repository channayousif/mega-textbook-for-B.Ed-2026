<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">افادیت پسندی اور ابن خلدون کا تقابل</title><desc id="d">افادیت پسندی اور ابن خلدون کا سیکھنے کے انداز، طریقے، نظم و ضبط اور علم کے مقاصد کے لحاظ سے تقابل کرنے والا جدول، جو مختلف فلسفیانہ جڑوں کے ساتھ ساتھ عملی تدریسی مماثلتیں دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="415" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="95" x2="24" y2="95"/><line class="frame" x1="756" y1="185" x2="24" y2="185"/><line class="frame" x1="756" y1="280" x2="24" y2="280"/><line class="frame" x1="756" y1="375" x2="24" y2="375"/><line class="frame" x1="620" y1="50" x2="620" y2="465"/><line class="frame" x1="320" y1="50" x2="320" y2="465"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏پہلو‏</text><text class="h" x="606" y="78" text-anchor="end">‏افادیت پسندی (جان ڈیوی)‏</text><text class="h" x="306" y="78" text-anchor="end">‏ابن خلدون‏</text><g id="dim-learning"><text class="sh" x="746" y="125" text-anchor="end">‏سیکھنا‏</text><text class="cell" x="606" y="117" text-anchor="end">‏کر کے سیکھنا؛ تجربے کی‏</text><text class="cell" x="606" y="137" text-anchor="end">‏تعمیرِ نو؛ تحقیق ماحول کے‏</text><text class="cell" x="606" y="157" text-anchor="end">‏حقیقی مسائل حل کرتی ہے‏</text><text class="cell" x="306" y="117" text-anchor="end">‏پائیدار صلاحیت (ملکہ) کا حصول؛‏</text><text class="cell" x="306" y="137" text-anchor="end">‏الفاظ کے رٹے کے بجائے‏</text><text class="cell" x="306" y="157" text-anchor="end">‏عملی اطلاق‏</text></g><g id="dim-pedagogy"><text class="sh" x="746" y="215" text-anchor="end">‏طریقہ‏</text><text class="cell" x="606" y="207" text-anchor="end">‏منصوبہ جاتی طریقہ، مسئلہ حل کرنا،‏</text><text class="cell" x="606" y="227" text-anchor="end">‏اور مربوط نصاب؛‏</text><text class="cell" x="606" y="247" text-anchor="end">‏مشترکہ گروہی کام‏</text><text class="cell" x="306" y="207" text-anchor="end">‏تدریجی تدریس (التدریج):‏</text><text class="cell" x="306" y="227" text-anchor="end">‏عمومی جائزہ، گہری تفصیلات،‏</text><text class="cell" x="306" y="247" text-anchor="end">‏اور آخر میں ماہرانہ امتزاج‏</text></g><g id="dim-discipline"><text class="sh" x="746" y="310" text-anchor="end">‏نظم و ضبط‏</text><text class="cell" x="606" y="302" text-anchor="end">‏جمہوری خود نظم؛‏</text><text class="cell" x="606" y="322" text-anchor="end">‏برادری کی مشترکہ ذمہ داری؛‏</text><text class="cell" x="606" y="342" text-anchor="end">‏استاد بطور شریکِ تحقیق‏</text><text class="cell" x="306" y="302" text-anchor="end">‏جسمانی سزا کی سخت ممانعت؛‏</text><text class="cell" x="306" y="322" text-anchor="end">‏ظلم طالب علم کا کردار بگاڑتا اور‏</text><text class="cell" x="306" y="342" text-anchor="end">‏خوف اور فریب پیدا کرتا ہے‏</text></g><g id="dim-worldview"><text class="sh" x="746" y="405" text-anchor="end">‏علم‏</text><text class="cell" x="606" y="398.5" text-anchor="end">‏اقدار سماجی طور پر پرکھی جاتی ہیں؛‏</text><text class="cell" x="606" y="418.5" text-anchor="end">‏خیالات نشوونما کے اوزار ہیں‏</text><text class="cell" x="306" y="398.5" text-anchor="end">‏علم تمدنی زندگی (عمران)‏</text><text class="cell" x="306" y="418.5" text-anchor="end">‏اور اللہ کے حضور جواب دہی کے لیے‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏افادیت پسندی اور ابن خلدون کا تقابل‏</text><text id="label-caption" class="small" x="756" y="490" text-anchor="end">‏دونوں عملی مہارت پر زور دیتے اور جبر کو رد کرتے ہیں، اگرچہ ابن خلدون سیکھنے کی بنیاد اسلامی اخلاقیات پر رکھتے ہیں۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
