<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکولنگ کے تین سماجی نقطہ ہائے نظر</title><desc id="d">جدول جس میں اسکولنگ کے کارکردگی پسند، کشمکش پسند اور تعامل پسند زاویہ ہائے نظر کا موازنہ کیا گیا ہے۔ کارکردگی پسندی کا کہنا ہے کہ اسکول طلبہ کی معاشرتی بندی کرتے، ثقافت منتقل کرتے، نظم قائم رکھتے اور کردار تفویض کرتے ہیں۔ کشمکش پسندی کہتی ہے کہ اسکول طبقے، صنف، زبان اور خطے کی بنیاد پر ناہمواری پیدا کرتے ہیں۔ باہمی تعامل پسندی کہتی ہے کہ کمرۂ جماعت میں بات چیت کے لیبل اور توقعات طالب علم کی شناخت بناتے ہیں۔ ہر قطار میں ایک پاکستانی اسکول کی مثال دی گئی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="315" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="185" x2="756" y2="185"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="365" x2="756" y2="365"/><line class="frame" x1="596" y1="50" x2="596" y2="365"/><line class="frame" x1="296" y1="50" x2="296" y2="365"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">زاویۂ نظر</text><text class="h" x="586" y="78" text-anchor="end">اسکولنگ کا کردار</text><text class="h" x="286" y="78" text-anchor="end">پاکستانی اسکول سے مثال</text><g id="node-functionalist"><text class="sh" x="746" y="122" text-anchor="end">کارکردگی پسندی</text><text class="cell" x="586" y="115" text-anchor="end">اسکول طلبہ کی معاشرتی بندی کرتے،</text><text class="cell" x="586" y="132" text-anchor="end">ثقافت منتقل کرتے، نظم قائم رکھتے</text><text class="cell" x="586" y="149" text-anchor="end">اور لوگوں کو کردار تفویض کرتے ہیں۔</text><text class="cell" x="286" y="115" text-anchor="end">اردو کا مشترکہ سبق اور قومی ترانہ</text><text class="cell" x="286" y="132" text-anchor="end">ایک متنوع ملک کو باہم جوڑے</text><text class="cell" x="286" y="149" text-anchor="end">رکھنے میں مدد دیتے ہیں۔</text></g><g id="node-conflict"><text class="sh" x="746" y="212" text-anchor="end">کشمکش پسندی</text><text class="cell" x="586" y="205" text-anchor="end">اسکول طبقے، صنف، زبان اور</text><text class="cell" x="586" y="222" text-anchor="end">خطے کی بنیاد پر معاشرتی</text><text class="cell" x="586" y="239" text-anchor="end">ناہمواریوں کو دوبارہ پیدا کرتے ہیں۔</text><text class="cell" x="286" y="205" text-anchor="end">کراچی کے پوش علاقے کا نجی اسکول</text><text class="cell" x="286" y="222" text-anchor="end">بمقابلہ تھرپارکر کا اسکول جہاں چار</text><text class="cell" x="286" y="239" text-anchor="end">درجات کے لیے صرف ایک استاد ہے۔</text></g><g id="node-interactionist"><text class="sh" x="746" y="302" text-anchor="end">باہمی تعامل پسندی</text><text class="cell" x="586" y="295" text-anchor="end">کمرۂ جماعت میں روزمرہ گفتگو کے</text><text class="cell" x="586" y="312" text-anchor="end">لیبل اور اساتذہ کی توقعات طالب علم</text><text class="cell" x="586" y="329" text-anchor="end">کی خودی اور شناخت کو تشکیل دیتے ہیں۔</text><text class="cell" x="286" y="295" text-anchor="end">استاد صرف تین بچوں سے جواب کی</text><text class="cell" x="286" y="312" text-anchor="end">توقع رکھتا ہے، اس لیے سال کے آخر</text><text class="cell" x="286" y="329" text-anchor="end">تک صرف وہی بچے ہاتھ اٹھاتے ہیں۔</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">اسکولنگ کے تین سماجی نقطہ ہائے نظر</text><text id="label-caption" class="small" x="756" y="388" text-anchor="end">ہر زاویۂ نظر ایک ہی اسکول کے ایک مختلف پہلو کو واضح کرتا ہے۔</text><text class="wm" x="24" y="390" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>