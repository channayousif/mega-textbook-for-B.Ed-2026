<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five foundations of education and the question each asks</title><desc id="d">Concept map with education at the centre and five foundations around it, each joined by an arrow into the centre. Philosophical asks what is real, true and good. Ideological asks what kind of people this nation should raise. Sociological asks how society and schooling shape each other. Psychological asks how children grow and learn. Historical asks how education has developed and why that matters now.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-philosophical-education" class="stroke" x1="274" y1="87" x2="380" y2="175" marker-end="url(#arrow)"/><line id="edge-ideological-education" class="stroke" x1="274" y1="163" x2="380" y2="190" marker-end="url(#arrow)"/><line id="edge-sociological-education" class="stroke" x1="274" y1="239" x2="380" y2="205" marker-end="url(#arrow)"/><line id="edge-psychological-education" class="stroke" x1="274" y1="315" x2="380" y2="220" marker-end="url(#arrow)"/><line id="edge-historical-education" class="stroke" x1="274" y1="391" x2="380" y2="235" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-philosophical"><rect class="panel-b" x="24" y="52" width="250" height="70" rx="8"/><text class="sh" x="36" y="72">Philosophical</text><text class="cell" x="36" y="90">What is real, true and good?</text></g><g id="node-ideological"><rect class="panel-b" x="24" y="128" width="250" height="70" rx="8"/><text class="sh" x="36" y="148">Ideological</text><text class="cell" x="36" y="166">What kind of people should</text><text class="cell" x="36" y="182">this nation raise?</text></g><g id="node-sociological"><rect class="panel-b" x="24" y="204" width="250" height="70" rx="8"/><text class="sh" x="36" y="224">Sociological</text><text class="cell" x="36" y="242">How do society and schooling</text><text class="cell" x="36" y="258">shape each other?</text></g><g id="node-psychological"><rect class="panel-b" x="24" y="280" width="250" height="70" rx="8"/><text class="sh" x="36" y="300">Psychological</text><text class="cell" x="36" y="318">How do children grow</text><text class="cell" x="36" y="334">and learn?</text></g><g id="node-historical"><rect class="panel-b" x="24" y="356" width="250" height="70" rx="8"/><text class="sh" x="36" y="376">Historical</text><text class="cell" x="36" y="394">How has education developed</text><text class="cell" x="36" y="410">over time?</text></g><g id="node-education"><rect class="panel-a" x="380" y="160" width="360" height="90" rx="30"/><text class="h" x="560" y="192" text-anchor="middle">Education</text><text class="cell" x="560" y="214" text-anchor="middle">what makes a school what it is?</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Five foundations of education and the question each asks</text><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
