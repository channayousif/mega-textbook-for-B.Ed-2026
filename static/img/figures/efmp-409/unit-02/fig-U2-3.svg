<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Ideology and religion compared</title><desc id="d">Table comparing ideology and religion on source, scope and role in education. An ideology comes from the shared ideas and interests of a group and frames aims, citizenship and national identity. A religion comes from revelation, scripture and tradition and shapes worship, morality, meaning and conduct.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="325" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="165" x2="756" y2="165"/><line class="frame" x1="24" y1="235" x2="756" y2="235"/><line class="frame" x1="24" y1="305" x2="756" y2="305"/><line class="frame" x1="24" y1="375" x2="756" y2="375"/><line class="frame" x1="180" y1="50" x2="180" y2="375"/><line class="frame" x1="464" y1="50" x2="464" y2="375"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Dimension</text><text class="h" x="190" y="78">Ideology</text><text class="h" x="474" y="78">Religion</text><g id="node-source"><text class="sh" x="34" y="128">Source</text><text class="cell" x="190" y="123">The shared ideas and interests</text><text class="cell" x="190" y="140">of a group</text><text class="cell" x="474" y="123">Revelation, scripture and a</text><text class="cell" x="474" y="140">living tradition</text></g><g id="node-scope"><text class="sh" x="34" y="198">Scope</text><text class="cell" x="190" y="193">A vision of the good life and</text><text class="cell" x="190" y="210">of who holds power</text><text class="cell" x="474" y="193">A relationship with God, the</text><text class="cell" x="474" y="210">self and the world</text></g><g id="node-role"><text class="sh" x="34" y="268">Role in education</text><text class="cell" x="190" y="263">Frames aims, citizenship and</text><text class="cell" x="190" y="280">national identity</text><text class="cell" x="474" y="263">Shapes worship, morality,</text><text class="cell" x="474" y="280">meaning and conduct</text></g><g id="node-example"><text class="sh" x="34" y="338">Example</text><text class="cell" x="190" y="333">The Ideology of Pakistan; the</text><text class="cell" x="190" y="350">Objectives Resolution</text><text class="cell" x="474" y="333">Islam; the Qur'an and the example</text><text class="cell" x="474" y="350">of the Prophet (peace be upon him)</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Ideology and religion compared</text><text id="label-caption" class="small" x="24" y="392">The two overlap in Pakistan, but they are not the same thing.</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
