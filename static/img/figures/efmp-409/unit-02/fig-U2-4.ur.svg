<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نظریۂ پاکستان اور اسلامی تعلیمات سے قومی مقاصد تک</title><desc id="d">خاکہ جو واضح کرتا ہے کہ نظریۂ پاکستان اور اسلامی تعلیمات کس طرح قومی تعلیمی مقاصد میں ظاہر ہوتے ہیں۔ دو قومی نظریہ، قراردادِ لاہور 1940، قراردادِ مقاصد 1949 اور آرٹیکل 2A پر مبنی نظریۂ پاکستان قومی تعلیمی پالیسی 2009 کے مقاصد اور آرٹیکل 25A کی صورت اختیار کرتا ہے، جو اسکول کی صبح کی اسمبلی، نصاب، زبان، امتحانات اور شہریت کو تشکیل دیتے ہیں۔ قرآن اور سنت پر مبنی اسلامی تعلیمات بھی انہی قومی مقاصد کی رہنمائی کرتی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-ideology-aims" class="stroke" x1="526" y1="150" x2="490" y2="150" marker-end="url(#arrow)"/><line id="edge-aims-school" class="stroke" x1="260" y1="150" x2="224" y2="150" marker-end="url(#arrow)"/><line id="edge-islamic-aims" class="dash" x1="641" y1="250" x2="375" y2="210" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-ideology"><rect class="panel-a" x="526" y="90" width="230" height="120" rx="8"/><text class="sh" x="744" y="116" text-anchor="end">نظریۂ پاکستان</text><text class="cell" x="744" y="140" text-anchor="end">دو قومی نظریہ؛</text><text class="cell" x="744" y="157" text-anchor="end">قراردادِ لاہور 1940؛</text><text class="cell" x="744" y="174" text-anchor="end">قراردادِ مقاصد 1949؛</text><text class="cell" x="744" y="191" text-anchor="end">آرٹیکل 2A</text></g><g id="node-aims"><rect class="panel" x="260" y="90" width="230" height="120" rx="8"/><text class="sh" x="478" y="116" text-anchor="end">قومی مقاصد</text><text class="cell" x="478" y="140" text-anchor="end">قومی تعلیمی پالیسی 2009</text><text class="cell" x="478" y="157" text-anchor="end">کے مقاصد 4، 8 اور 9؛</text><text class="cell" x="478" y="174" text-anchor="end">آرٹیکل 25A: مفت اور</text><text class="cell" x="478" y="191" text-anchor="end">لازمی تعلیم</text></g><g id="node-school"><rect class="panel" x="24" y="90" width="200" height="120" rx="8"/><text class="sh" x="212" y="116" text-anchor="end">اسکول</text><text class="cell" x="212" y="140" text-anchor="end">صبح کی اسمبلی، نصاب،</text><text class="cell" x="212" y="157" text-anchor="end">زبان، امتحانات</text><text class="cell" x="212" y="174" text-anchor="end">اور شہریت</text></g><g id="node-islamic"><rect class="panel-b" x="526" y="250" width="230" height="80" rx="8"/><text class="sh" x="744" y="278" text-anchor="end">اسلامی تعلیمات</text><text class="cell" x="744" y="302" text-anchor="end">قرآن مجید اور سنتِ نبویؐ</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">نظریۂ پاکستان اور اسلامی تعلیمات سے قومی مقاصد تک</text><text id="label-caption" class="small" x="756" y="370" text-anchor="end">ٹھوس تیر: نظریاتی بنیاد۔ نقطہ دار تیر: اسلامی بنیاد۔</text><text class="wm" x="24" y="390" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>