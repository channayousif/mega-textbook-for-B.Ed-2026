<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From the Ideology of Pakistan and Islamic teachings to national aims</title><desc id="d">Diagram showing how the Ideology of Pakistan and Islamic teachings appear in national curriculum aims. The Ideology of Pakistan, drawn from the Two-Nation Theory, the Lahore Resolution 1940, the Objectives Resolution 1949 and Article 2A, leads to national aims in the National Education Policy 2009 and Article 25A, which in turn shape the school's assembly, curriculum, language, examinations and citizenship. Islamic teachings, from the Qur'an and the Sunnah, feed the same national aims.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"/><g id="layer-edges"><line id="edge-ideology-aims" class="stroke" x1="254" y1="150" x2="290" y2="150" marker-end="url(#arrow)"/><line id="edge-aims-school" class="stroke" x1="520" y1="150" x2="556" y2="150" marker-end="url(#arrow)"/><line id="edge-islamic-aims" class="dash" x1="139" y1="250" x2="405" y2="210" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-ideology"><rect class="panel-a" x="24" y="90" width="230" height="120" rx="8"/><text class="sh" x="36" y="116">The Ideology of Pakistan</text><text class="cell" x="36" y="140">Two-Nation Theory;</text><text class="cell" x="36" y="157">Lahore Resolution 1940;</text><text class="cell" x="36" y="174">Objectives Resolution 1949;</text><text class="cell" x="36" y="191">Article 2A</text></g><g id="node-aims"><rect class="panel" x="290" y="90" width="230" height="120" rx="8"/><text class="sh" x="302" y="116">National aims</text><text class="cell" x="302" y="140">National Education Policy</text><text class="cell" x="302" y="157">2009 aims 4, 8 and 9;</text><text class="cell" x="302" y="174">Article 25A: free and</text><text class="cell" x="302" y="191">compulsory education</text></g><g id="node-school"><rect class="panel" x="556" y="90" width="200" height="120" rx="8"/><text class="sh" x="568" y="116">The school</text><text class="cell" x="568" y="140">Assembly, curriculum,</text><text class="cell" x="568" y="157">language, examinations</text><text class="cell" x="568" y="174">and citizenship</text></g><g id="node-islamic"><rect class="panel-b" x="24" y="250" width="230" height="80" rx="8"/><text class="sh" x="36" y="278">Islamic teachings</text><text class="cell" x="36" y="302">The Qur'an and the Sunnah</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">From the Ideology of Pakistan and Islamic teachings to national aims</text><text id="label-caption" class="small" x="24" y="370">Solid arrows: the ideological foundation. Dashed arrow: the Islamic foundation.</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
