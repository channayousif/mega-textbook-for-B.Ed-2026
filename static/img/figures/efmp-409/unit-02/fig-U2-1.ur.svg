<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم کی پانچ بنیادی بنیادیں اور ہر ایک کا سوال</title><desc id="d">تصوراتی خاکہ جس کے مرکز میں تعلیم اور اس کے گرد پانچ بنیادیں ہیں، جن میں سے ہر ایک تیر کے ذریعے مرکز سے جڑی ہے۔ فلسفیانہ بنیاد پوچھتی ہے کہ حقیقی، سچ اور اچھا کیا ہے؟ نظریاتی بنیاد پوچھتی ہے کہ اس قوم کو کس قسم کے افراد تیار کرنے چاہئیں؟ سماجی بنیاد پوچھتی ہے کہ معاشرہ اور اسکول ایک دوسرے کو کیسے تشکیل دیتے ہیں؟ نفسیاتی بنیاد پوچھتی ہے کہ بچے کیسے نشوونما پاتے اور سیکھتے ہیں؟ تاریخی بنیاد پوچھتی ہے کہ وقت کے ساتھ تعلیم نے کیسے ترقی کی ہے اور آج اس کی کیا اہمیت ہے؟</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-philosophical-education" class="stroke" x1="506" y1="87" x2="400" y2="175" marker-end="url(#arrow)"/><line id="edge-ideological-education" class="stroke" x1="506" y1="163" x2="400" y2="190" marker-end="url(#arrow)"/><line id="edge-sociological-education" class="stroke" x1="506" y1="239" x2="400" y2="205" marker-end="url(#arrow)"/><line id="edge-psychological-education" class="stroke" x1="506" y1="315" x2="400" y2="220" marker-end="url(#arrow)"/><line id="edge-historical-education" class="stroke" x1="506" y1="391" x2="400" y2="235" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-philosophical"><rect class="panel-b" x="506" y="52" width="250" height="70" rx="8"/><text class="sh" x="744" y="74" text-anchor="end">فلسفیانہ بنیاد</text><text class="cell" x="744" y="96" text-anchor="end">حقیقی، سچ اور اچھا کیا ہے؟</text></g><g id="node-ideological"><rect class="panel-b" x="506" y="128" width="250" height="70" rx="8"/><text class="sh" x="744" y="150" text-anchor="end">نظریاتی بنیاد</text><text class="cell" x="744" y="170" text-anchor="end">اس قوم کو کس قسم کے</text><text class="cell" x="744" y="188" text-anchor="end">افراد تیار کرنے چاہئیں؟</text></g><g id="node-sociological"><rect class="panel-b" x="506" y="204" width="250" height="70" rx="8"/><text class="sh" x="744" y="226" text-anchor="end">سماجی بنیاد</text><text class="cell" x="744" y="246" text-anchor="end">معاشرہ اور اسکول ایک دوسرے</text><text class="cell" x="744" y="264" text-anchor="end">کو کیسے تشکیل دیتے ہیں؟</text></g><g id="node-psychological"><rect class="panel-b" x="506" y="280" width="250" height="70" rx="8"/><text class="sh" x="744" y="302" text-anchor="end">نفسیاتی بنیاد</text><text class="cell" x="744" y="322" text-anchor="end">بچے کیسے نشوونما پاتے</text><text class="cell" x="744" y="340" text-anchor="end">اور سیکھتے ہیں؟</text></g><g id="node-historical"><rect class="panel-b" x="506" y="356" width="250" height="70" rx="8"/><text class="sh" x="744" y="378" text-anchor="end">تاریخی بنیاد</text><text class="cell" x="744" y="398" text-anchor="end">وقت کے ساتھ تعلیم نے</text><text class="cell" x="744" y="416" text-anchor="end">کیسے ترقی کی ہے؟</text></g><g id="node-education"><rect class="panel-a" x="40" y="160" width="360" height="90" rx="30"/><text class="h" x="220" y="195" text-anchor="middle">تعلیم</text><text class="cell" x="220" y="218" text-anchor="middle">وہ کیا ہے جو اسکول کو اس کی اصل صورت دیتا ہے؟</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">تعلیم کی پانچ بنیادی بنیادیں اور ہر ایک کا سوال</text><text class="wm" x="24" y="430" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>