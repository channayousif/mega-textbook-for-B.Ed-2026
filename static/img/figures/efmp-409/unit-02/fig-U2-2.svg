<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three sociological views of schooling</title><desc id="d">Table comparing the functionalist, conflict and interactionist views of schooling. Functionalism says schools socialise pupils, transmit culture, keep order and place people into roles. Conflict theory says schools reproduce inequality by class, gender, language and region. Interactionism says labels and expectations in classroom talk shape who a pupil becomes. Each row gives a Pakistani school example.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="315" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="185" x2="756" y2="185"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="365" x2="756" y2="365"/><line class="frame" x1="184" y1="50" x2="184" y2="365"/><line class="frame" x1="484" y1="50" x2="484" y2="365"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Perspective</text><text class="h" x="194" y="78">What schooling does</text><text class="h" x="494" y="78">A Pakistani example</text><g id="node-functionalist"><text class="sh" x="34" y="122">Functionalist</text><text class="cell" x="194" y="115">Schools socialise pupils,</text><text class="cell" x="194" y="132">transmit culture, keep order</text><text class="cell" x="194" y="149">and place people into roles.</text><text class="cell" x="494" y="115">A common Urdu lesson and the</text><text class="cell" x="494" y="132">national anthem hold a diverse</text><text class="cell" x="494" y="149">country together.</text></g><g id="node-conflict"><text class="sh" x="34" y="212">Conflict</text><text class="cell" x="194" y="205">Schools reproduce inequality</text><text class="cell" x="194" y="222">by class, gender, language and</text><text class="cell" x="194" y="239">region.</text><text class="cell" x="494" y="205">A well-equipped private school</text><text class="cell" x="494" y="222">in Karachi against a one-teacher</text><text class="cell" x="494" y="239">school in Tharparkar.</text></g><g id="node-interactionist"><text class="sh" x="34" y="302">Interactionist</text><text class="cell" x="194" y="295">Labels and expectations in</text><text class="cell" x="194" y="312">classroom talk shape who a</text><text class="cell" x="194" y="329">pupil becomes.</text><text class="cell" x="494" y="295">A teacher expects only three</text><text class="cell" x="494" y="312">pupils to answer, so only those</text><text class="cell" x="494" y="329">three volunteer.</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Three sociological views of schooling</text><text id="label-caption" class="small" x="24" y="388">Each perspective explains a different feature of the same school.</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
