<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نظریہ اور مذہب کا تقابل</title><desc id="d">جدول جس میں ماخذ، دائرہ کار اور تعلیم میں کردار کی بنیاد پر نظریہ اور مذہب کا تقابل کیا گیا ہے۔ نظریہ کسی گروہ کے مشترکہ افکار اور مفادات سے پیدا ہوتا ہے اور مقاصد، شہریت اور قومی شناخت کی تشکیل کرتا ہے۔ مذہب وحی، الہامی کتب اور زندہ روایات سے حاصل ہوتا ہے اور عبادت، اخلاقیات، مفہومِ حیات اور کردار سازی کی رہنمائی کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="325" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="165" x2="756" y2="165"/><line class="frame" x1="24" y1="235" x2="756" y2="235"/><line class="frame" x1="24" y1="305" x2="756" y2="305"/><line class="frame" x1="24" y1="375" x2="756" y2="375"/><line class="frame" x1="600" y1="50" x2="600" y2="375"/><line class="frame" x1="316" y1="50" x2="316" y2="375"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">پہلو</text><text class="h" x="590" y="78" text-anchor="end">نظریہ</text><text class="h" x="306" y="78" text-anchor="end">مذہب</text><g id="node-source"><text class="sh" x="746" y="128" text-anchor="end">ماخذ</text><text class="cell" x="590" y="123" text-anchor="end">کسی گروہ یا قوم کے مشترکہ</text><text class="cell" x="590" y="140" text-anchor="end">افکار اور مفادات</text><text class="cell" x="306" y="123" text-anchor="end">وحی، الہامی کتب اور</text><text class="cell" x="306" y="140" text-anchor="end">زندہ روایات</text></g><g id="node-scope"><text class="sh" x="746" y="198" text-anchor="end">دائرہ کار</text><text class="cell" x="590" y="193" text-anchor="end">پسندیدہ طرزِ زندگی اور اختیار و</text><text class="cell" x="590" y="210" text-anchor="end">اقتدار کے حاملین کا تصور</text><text class="cell" x="306" y="193" text-anchor="end">خدا، اپنی ذات اور کائنات</text><text class="cell" x="306" y="210" text-anchor="end">کے ساتھ ہمہ جہت تعلق</text></g><g id="node-role"><text class="sh" x="746" y="268" text-anchor="end">تعلیم میں کردار</text><text class="cell" x="590" y="263" text-anchor="end">تعلیمی مقاصد، شہریت اور</text><text class="cell" x="590" y="280" text-anchor="end">قومی شناخت کا فریم ورک</text><text class="cell" x="306" y="263" text-anchor="end">عبادت، اخلاقیات، مفہومِ حیات</text><text class="cell" x="306" y="280" text-anchor="end">اور حسنِ کردار کی تشکیل</text></g><g id="node-example"><text class="sh" x="746" y="338" text-anchor="end">عملی مثال</text><text class="cell" x="590" y="333" text-anchor="end">نظریۂ پاکستان؛ قراردادِ مقاصد</text><text class="cell" x="590" y="350" text-anchor="end">اور قومی تعلیمی پالیسی</text><text class="cell" x="306" y="333" text-anchor="end">اسلام؛ قرآن مجید اور رسول اللہ</text><text class="cell" x="306" y="350" text-anchor="end">صلی اللہ علیہ وسلم کا اسوۂ حسنہ</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">نظریہ اور مذہب کا تقابل</text><text id="label-caption" class="small" x="756" y="392" text-anchor="end">پاکستان میں دونوں ایک دوسرے سے مربوط ہیں، لیکن دونوں کا مفہوم اور دائرہ کار الگ ہے۔</text><text class="wm" x="24" y="390" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>