<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 670" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the education policy cycle</title><desc id="d">Flowchart of the education policy cycle from a problem, through a commission report and a draft policy, past an approval decision, into launch and implementation, and on to review, which feeds the next cycle.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="670"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-problem-report" class="stroke" x1="390" y1="98" x2="390" y2="128" marker-end="url(#arrow)"/><line id="edge-report-draft" class="stroke" x1="380" y1="186" x2="380" y2="214" marker-end="url(#arrow)"/><line id="edge-draft-decision" class="stroke" x1="390" y1="272" x2="390" y2="300" marker-end="url(#arrow)"/><line id="edge-decision-launch" class="stroke" x1="390" y1="378" x2="390" y2="406" marker-end="url(#arrow)"/><line id="edge-launch-implementation" class="stroke" x1="390" y1="464" x2="390" y2="492" marker-end="url(#arrow)"/><line id="edge-implementation-review" class="stroke" x1="390" y1="550" x2="390" y2="578" marker-end="url(#arrow)"/><line id="edge-decision-revise" class="stroke" x1="280" y1="340" x2="184" y2="340" marker-end="url(#arrow)"/><path id="edge-revise-draft" class="dash" d="M110,300 L110,244 L268,244" marker-end="url(#arrow)"/><path id="edge-review-problem" class="dash" d="M270,608 L60,608 L60,74 L268,74" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-problem"><rect class="panel-a" x="270" y="50" width="240" height="48" rx="24"/><text class="sh" x="390" y="79" text-anchor="middle">A problem in schools or society</text></g><g id="node-report"><polygon class="panel-b" points="280,130 500,130 480,186 260,186"/><text class="cell" x="380" y="155" text-anchor="middle">A commission or committee</text><text class="cell" x="380" y="172" text-anchor="middle">is appointed and writes a report</text></g><g id="node-draft"><rect class="panel" x="270" y="216" width="240" height="56" rx="8"/><text class="cell" x="390" y="240" text-anchor="middle">The government drafts</text><text class="cell" x="390" y="257" text-anchor="middle">a policy from the report</text></g><g id="node-decision"><polygon class="panel-b" points="390,302 500,340 390,378 280,340"/><text class="cell" x="390" y="337" text-anchor="middle">Is the policy</text><text class="cell" x="390" y="354" text-anchor="middle">approved?</text></g><g id="node-revise"><rect class="panel" x="40" y="310" width="144" height="60" rx="8"/><text class="cell" x="112" y="336" text-anchor="middle">Revise</text><text class="cell" x="112" y="353" text-anchor="middle">the draft</text></g><g id="node-launch"><rect class="panel" x="270" y="408" width="240" height="56" rx="8"/><text class="cell" x="390" y="432" text-anchor="middle">The policy is launched:</text><text class="cell" x="390" y="449" text-anchor="middle">funds, offices, rules</text></g><g id="node-implementation"><rect class="panel" x="270" y="494" width="240" height="56" rx="8"/><text class="cell" x="390" y="518" text-anchor="middle">Implementation in provinces,</text><text class="cell" x="390" y="535" text-anchor="middle">districts and schools</text></g><g id="node-review"><rect class="panel" x="270" y="580" width="240" height="56" rx="8"/><text class="cell" x="390" y="604" text-anchor="middle">Review and monitoring:</text><text class="cell" x="390" y="621" text-anchor="middle">was the problem solved?</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">The education policy cycle</text><text class="small" x="236" y="330">no</text><text class="small" x="398" y="398">yes</text><text class="small" x="66" y="600">the cycle continues</text><text class="wm" x="768" y="660" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
