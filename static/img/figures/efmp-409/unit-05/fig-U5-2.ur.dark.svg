<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی رپورٹ اور تعلیمی پالیسی کا موازنہ</title><desc id="d">جدول جو تعلیمی رپورٹ اور تعلیمی پالیسی کا موازنہ کرتا ہے کہ انہیں کون لکھتا ہے، ان کا اختیار کیا ہے، ان کا مقصد کیا ہے اور ان کی قانونی حیثیت کیا ہے، اور ہر ایک کی پاکستان سے ایک مثال دیتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="300" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="44" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="94" x2="24" y2="94"/><line class="frame" x1="756" y1="162" x2="24" y2="162"/><line class="frame" x1="756" y1="230" x2="24" y2="230"/><line class="frame" x1="756" y1="298" x2="24" y2="298"/><line class="frame" x1="756" y1="350" x2="24" y2="350"/><line class="frame" x1="616" y1="50" x2="616" y2="350"/><line class="frame" x1="412" y1="50" x2="412" y2="350"/><line class="frame" x1="208" y1="50" x2="208" y2="350"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏پہلو‏</text><text class="h" x="606" y="78" text-anchor="end">‏تعلیمی رپورٹ‏</text><text class="h" x="402" y="78" text-anchor="end">‏تعلیمی پالیسی‏</text><text class="h" x="198" y="78" text-anchor="end">‏پاکستانی مثال‏</text><g id="node-who"><text class="sh" x="746" y="122" text-anchor="end">‏کون لکھتا ہے‏</text><text class="cell" x="606" y="112" text-anchor="end">‏ایک کمیشن یا کمیٹی‏</text><text class="cell" x="606" y="137" text-anchor="end">‏جسے حکومت مقرر کرے‏</text><text class="cell" x="402" y="112" text-anchor="end">‏وفاقی یا صوبائی‏</text><text class="cell" x="402" y="137" text-anchor="end">‏حکومت، کوئی وزارت‏</text><text class="cell" x="198" y="112" text-anchor="end">‏شریف کمیشن‏</text><text class="cell" x="198" y="137" text-anchor="end">‏رپورٹ، 1959‏</text></g><g id="node-authority"><text class="sh" x="746" y="190" text-anchor="end">‏اختیار‏</text><text class="cell" x="606" y="180" text-anchor="end">‏مشورہ دیتی ہے؛ قانونی قوت نہیں‏</text><text class="cell" x="402" y="180" text-anchor="end">‏حکومت منظور کرتی ہے؛‏</text><text class="cell" x="402" y="205" text-anchor="end">‏مقصد نفاذ ہے‏</text><text class="cell" x="198" y="180" text-anchor="end">‏قومی تعلیمی‏</text><text class="cell" x="198" y="205" text-anchor="end">‏پالیسی، 1979‏</text></g><g id="node-purpose"><text class="sh" x="746" y="258" text-anchor="end">‏مقصد‏</text><text class="cell" x="606" y="248" text-anchor="end">‏نتائج بیان کرتی اور‏</text><text class="cell" x="606" y="273" text-anchor="end">‏تبدیلی کی سفارش کرتی ہے‏</text><text class="cell" x="402" y="248" text-anchor="end">‏مقاصد، اہداف اور‏</text><text class="cell" x="402" y="273" text-anchor="end">‏پروگرام بیان کرتی ہے‏</text><text class="cell" x="198" y="248" text-anchor="end">‏قومی تعلیمی‏</text><text class="cell" x="198" y="273" text-anchor="end">‫‏پالیسی، ‎1998-2010‏‬</text></g><g id="node-status"><text class="sh" x="746" y="326" text-anchor="end">‏قانونی حیثیت‏</text><text class="cell" x="606" y="316" text-anchor="end">‏حکومت کے عمل تک‏</text><text class="cell" x="606" y="341" text-anchor="end">‏لازم نہیں‏</text><text class="cell" x="402" y="316" text-anchor="end">‏دفاتر، فنڈز اور قواعد‏</text><text class="cell" x="402" y="341" text-anchor="end">‏کے ذریعے نافذ‏</text><text class="cell" x="198" y="316" text-anchor="end">‏ہر ایک اپنی وزارت‏</text><text class="cell" x="198" y="341" text-anchor="end">‏اور تاریخ بتاتی ہے‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏تعلیمی رپورٹ اور تعلیمی پالیسی کا موازنہ‏</text><text class="wm" font-family="system-ui, sans-serif" x="12" y="368" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
