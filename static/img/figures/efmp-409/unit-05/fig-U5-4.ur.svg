<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">شریف کمیشن اور 1979 کی پالیسی کا موازنہ</title><desc id="d">جدول جو 1959 کی شریف کمیشن رپورٹ اور قومی تعلیمی پالیسی 1979 کی بنیادی سفارشات کا اسکولی ڈھانچے، لازمی تعلیم، نصاب، اساتذہ اور نفاذ کے لحاظ سے موازنہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="464" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="44" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="94" x2="24" y2="94"/><line class="frame" x1="756" y1="178" x2="24" y2="178"/><line class="frame" x1="756" y1="262" x2="24" y2="262"/><line class="frame" x1="756" y1="346" x2="24" y2="346"/><line class="frame" x1="756" y1="430" x2="24" y2="430"/><line class="frame" x1="756" y1="514" x2="24" y2="514"/><line class="frame" x1="580" y1="50" x2="580" y2="514"/><line class="frame" x1="328" y1="50" x2="328" y2="514"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">‏موضوع‏</text><text class="h" x="570" y="78" text-anchor="end">‏شریف کمیشن 1959‏</text><text class="h" x="318" y="78" text-anchor="end">‏قومی تعلیمی پالیسی 1979‏</text><g id="node-structure"><text class="cell" x="746" y="141" text-anchor="end">‏اسکولی ڈھانچہ‏</text><text class="cell" x="570" y="118" text-anchor="end">‏یونیورسٹی سے پہلے کی تعلیم‏</text><text class="cell" x="570" y="142" text-anchor="end">‏دس سے بارہ سال؛‏</text><text class="cell" x="570" y="166" text-anchor="end">‏تین سالہ ڈگری‏</text><text class="cell" x="318" y="118" text-anchor="end">‏قومی زبان ذریعۂ تعلیم؛‏</text><text class="cell" x="318" y="142" text-anchor="end">‏مذہبی اور جدید نظام‏</text><text class="cell" x="318" y="166" text-anchor="end">‏ایک نظام میں مربوط‏</text></g><g id="node-compulsory"><text class="cell" x="746" y="225" text-anchor="end">‏لازمی تعلیم‏</text><text class="cell" x="570" y="202" text-anchor="end">‏دس سال میں پانچ سالہ لازمی‏</text><text class="cell" x="570" y="226" text-anchor="end">‏تعلیم سب کے لیے؛ پندرہ‏</text><text class="cell" x="570" y="250" text-anchor="end">‏سال میں آٹھ سالہ‏</text><text class="cell" x="318" y="202" text-anchor="end">‏مسجد، محلہ اور ولیج‏</text><text class="cell" x="318" y="226" text-anchor="end">‏ورکشاپ اسکولوں کے‏</text><text class="cell" x="318" y="250" text-anchor="end">‏ذریعے توسیع‏</text></g><g id="node-curriculum"><text class="cell" x="746" y="309" text-anchor="end">‏نصاب‏</text><text class="cell" x="570" y="286" text-anchor="end">‏سائنس، ریاضی اور قومی زبان‏</text><text class="cell" x="570" y="310" text-anchor="end">‏کا مرکزی حصہ، ساتھ‏</text><text class="cell" x="570" y="334" text-anchor="end">‏پیشہ ورانہ اختیاری مضامین‏</text><text class="cell" x="318" y="286" text-anchor="end">‏نصاب پر اسلامی فکر اور‏</text><text class="cell" x="318" y="310" text-anchor="end">‏قومی نظریے کی بنیاد پر‏</text><text class="cell" x="318" y="334" text-anchor="end">‏نظرِ ثانی‏</text></g><g id="node-teachers"><text class="cell" x="746" y="393" text-anchor="end">‏اساتذہ‏</text><text class="cell" x="570" y="370" text-anchor="end">‏تربیت، تنخواہوں اور ملازمت‏</text><text class="cell" x="570" y="394" text-anchor="end">‏کی شرائط میں بہتری‏</text><text class="cell" x="318" y="370" text-anchor="end">‏اساتذہ کی تعلیم اور ترغیب‏</text><text class="cell" x="318" y="394" text-anchor="end">‏پر الگ ابواب‏</text></g><g id="node-implementation"><text class="cell" x="746" y="477" text-anchor="end">‏نفاذ‏</text><text class="cell" x="570" y="454" text-anchor="end">‏ڈھانچہ تجویز ہوا مگر‏</text><text class="cell" x="570" y="478" text-anchor="end">‏محدود؛ ایک رپورٹ، کوئی‏</text><text class="cell" x="570" y="502" text-anchor="end">‏پروگرام نہیں‏</text><text class="cell" x="318" y="454" text-anchor="end">‏ایک نفاذی پروگرام‏</text><text class="cell" x="318" y="478" text-anchor="end">‏جو کابینہ نے منظور کیا‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏شریف کمیشن اور 1979 کی پالیسی کا موازنہ‏</text><text class="wm" font-family="system-ui, sans-serif" x="12" y="530" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
