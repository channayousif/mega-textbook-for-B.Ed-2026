<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قومی تعلیمی پالیسی 1998-2010 کے اہداف اور بعد کے شواہد</title><desc id="d">جدول جو قومی تعلیمی پالیسی 1998-2010 کے تین اہداف کا بعد کے شواہد سے موازنہ کرتا ہے: 2010 کے لیے 70 فیصد خواندگی کا ہدف بمقابلہ 2010 میں 55.4 فیصد، پہلے پانچ برسوں کے لیے 55 فیصد خواندگی کا ہدف بمقابلہ 2005 میں 49.9 فیصد، اور سب کے لیے پرائمری داخلہ بمقابلہ 2010 میں 73.6 فیصد مجموعی داخلہ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="308" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="56" rx="8"/></g><g id="layer-edges"><line class="frame" x1="756" y1="106" x2="24" y2="106"/><line class="frame" x1="756" y1="190" x2="24" y2="190"/><line class="frame" x1="756" y1="274" x2="24" y2="274"/><line class="frame" x1="756" y1="358" x2="24" y2="358"/><line class="frame" x1="570" y1="50" x2="570" y2="358"/><line class="frame" x1="310" y1="50" x2="310" y2="358"/></g><g id="layer-nodes"><text class="h" x="746" y="71" text-anchor="end">‫‏‎1998-2010 کی‏‬</text><text class="h" x="746" y="95" text-anchor="end">‏پالیسی میں ہدف‏</text><text class="h" x="556" y="84" text-anchor="end">‏پالیسی نے کیا کہا‏</text><text class="h" x="296" y="84" text-anchor="end">‏بعد کے شواہد کیا بتاتے ہیں‏</text><g id="node-literacy2010"><text class="sh" x="746" y="142" text-anchor="end">‏بالغوں کی خواندگی‏</text><text class="sh" x="746" y="166" text-anchor="end">‏2010 تک‏</text><text class="cell" x="556" y="130" text-anchor="end">‏خواندگی کی شرح تقریباً 39‏</text><text class="cell" x="556" y="154" text-anchor="end">‏فیصد سے بڑھا کر 70 فیصد‏</text><text class="cell" x="556" y="178" text-anchor="end">‏کرنا، 2010 تک‏</text><text class="cell" x="296" y="130" text-anchor="end">‏عالمی بینک: بالغوں کی خواندگی‏</text><text class="cell" x="296" y="154" text-anchor="end">‏(15 سال اور زائد) 55.4 فیصد‏</text><text class="cell" x="296" y="178" text-anchor="end">‏2010 میں‏</text></g><g id="node-literacy5"><text class="sh" x="746" y="226" text-anchor="end">‏پہلے پانچ برسوں میں‏</text><text class="sh" x="746" y="250" text-anchor="end">‏بالغوں کی خواندگی‏</text><text class="cell" x="556" y="214" text-anchor="end">‏پالیسی کے پہلے پانچ‏</text><text class="cell" x="556" y="238" text-anchor="end">‏برسوں میں خواندگی کی شرح‏</text><text class="cell" x="556" y="262" text-anchor="end">‏55 فیصد تک بڑھانا‏</text><text class="cell" x="296" y="214" text-anchor="end">‏عالمی بینک: بالغوں کی خواندگی‏</text><text class="cell" x="296" y="238" text-anchor="end">‏(15 سال اور زائد) 2005 میں‏</text><text class="cell" x="296" y="262" text-anchor="end">‏49.9 فیصد، قریب ترین دستیاب سال‏</text></g><g id="node-enrolment"><text class="sh" x="746" y="310" text-anchor="end">‏پرائمری میں‏</text><text class="sh" x="746" y="334" text-anchor="end">‏مجموعی داخلہ‏</text><text class="cell" x="556" y="298" text-anchor="end">‏2010 تک سب کے لیے‏</text><text class="cell" x="556" y="322" text-anchor="end">‏پرائمری تعلیم‏</text><text class="cell" x="296" y="298" text-anchor="end">‏عالمی بینک: پرائمری میں‏</text><text class="cell" x="296" y="322" text-anchor="end">‏مجموعی داخلہ 73.6 فیصد‏</text><text class="cell" x="296" y="346" text-anchor="end">‏2010 میں‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‫‏قومی تعلیمی پالیسی ‎1998-2010 کے اہداف اور بعد کے شواہد‏‬</text><text id="label-caption" class="small" x="756" y="380" text-anchor="end">‫‏عالمی بینک، ورلڈ ڈیولپمنٹ انڈیکیٹرز، بازیافت ‎2026-11-25۔‏‬</text><text class="wm" font-family="system-ui, sans-serif" x="12" y="390" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
