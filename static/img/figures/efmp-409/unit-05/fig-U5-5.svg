<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Targets of the National Education Policy 1998-2010 against later evidence</title><desc id="d">Table comparing three targets of the National Education Policy 1998-2010 with later evidence: the 70 percent literacy target for 2010 against 55.4 percent in 2010, the 55 percent first-five-year literacy target against 49.9 percent in 2005, and universal primary enrolment against 73.6 percent gross enrolment in 2010.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="330"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="240" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="44" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="94" x2="756" y2="94"/><line class="frame" x1="24" y1="156" x2="756" y2="156"/><line class="frame" x1="24" y1="218" x2="756" y2="218"/><line class="frame" x1="24" y1="290" x2="756" y2="290"/><line class="frame" x1="210" y1="50" x2="210" y2="290"/><line class="frame" x1="470" y1="50" x2="470" y2="290"/></g><g id="layer-nodes"><text class="h" x="34" y="72">Target in the</text><text class="h" x="34" y="89">1998-2010 policy</text><text class="h" x="224" y="78">What the policy said</text><text class="h" x="484" y="78">What later evidence shows</text><g id="node-literacy2010"><text class="sh" x="34" y="126">Adult literacy</text><text class="sh" x="34" y="143">by 2010</text><text class="cell" x="224" y="119">Raise the literacy rate from</text><text class="cell" x="224" y="136">about 39 percent to 70 percent</text><text class="cell" x="224" y="153">by 2010</text><text class="cell" x="484" y="119">World Bank adult literacy</text><text class="cell" x="484" y="136">(ages 15+) was 55.4 percent</text><text class="cell" x="484" y="153">in 2010</text></g><g id="node-literacy5"><text class="sh" x="34" y="188">Adult literacy in</text><text class="sh" x="34" y="205">the first five years</text><text class="cell" x="224" y="181">Raise the literacy rate to</text><text class="cell" x="224" y="198">55 percent in the first five</text><text class="cell" x="224" y="215">years of the policy</text><text class="cell" x="484" y="181">World Bank adult literacy</text><text class="cell" x="484" y="198">(ages 15+) was 49.9 percent in</text><text class="cell" x="484" y="215">2005, the nearest available year</text></g><g id="node-enrolment"><text class="sh" x="34" y="250">Gross primary</text><text class="sh" x="34" y="267">enrolment</text><text class="cell" x="224" y="243">Universal primary education</text><text class="cell" x="224" y="260">by 2010</text><text class="cell" x="484" y="243">World Bank gross primary</text><text class="cell" x="484" y="260">enrolment was 73.6 percent</text><text class="cell" x="484" y="277">in 2010</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Targets of the National Education Policy 1998-2010 against later evidence</text><text id="label-caption" class="small" x="24" y="312">World Bank World Development Indicators, retrieved 2026-11-25.</text><text class="wm" x="768" y="322" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
