<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی پالیسیاں کیوں لڑکھڑاتی ہیں</title><desc id="d">تصوراتی خاکہ جس کے مرکز میں "تعلیمی پالیسیاں کیوں لڑکھڑاتی ہیں" ہے اور اس کے گرد چھ عوامل ہیں: مالیات، حکمرانی، استعداد، تسلسل، اعداد و شمار اور سیاست۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="360"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-finance-centre" class="stroke" x1="536" y1="88" x2="492" y2="200" marker-end="url(#arrow)"/><line id="edge-governance-centre" class="stroke" x1="536" y1="198" x2="492" y2="214" marker-end="url(#arrow)"/><line id="edge-capacity-centre" class="stroke" x1="536" y1="308" x2="492" y2="228" marker-end="url(#arrow)"/><line id="edge-continuity-centre" class="stroke" x1="244" y1="88" x2="288" y2="200" marker-end="url(#arrow)"/><line id="edge-data-centre" class="stroke" x1="244" y1="198" x2="288" y2="214" marker-end="url(#arrow)"/><line id="edge-politics-centre" class="stroke" x1="244" y1="308" x2="288" y2="228" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-finance"><rect class="panel-b" x="536" y="60" width="220" height="56" rx="8"/><text class="sh" x="744" y="83" text-anchor="end">‏مالیات‏</text><text class="cell" x="744" y="106" text-anchor="end">‏فنڈ کے بغیر ہدف‏</text></g><g id="node-governance"><rect class="panel-b" x="536" y="170" width="220" height="56" rx="8"/><text class="sh" x="744" y="193" text-anchor="end">‏حکمرانی‏</text><text class="cell" x="744" y="216" text-anchor="end">‏عمل کے لیے کوئی دفتر نامزد نہیں‏</text></g><g id="node-capacity"><rect class="panel-b" x="536" y="280" width="220" height="56" rx="8"/><text class="sh" x="744" y="303" text-anchor="end">‏استعداد‏</text><text class="cell" x="744" y="326" text-anchor="end">‏غیر تربیت یافتہ اساتذہ‏</text></g><g id="node-continuity"><rect class="panel-b" x="24" y="60" width="220" height="56" rx="8"/><text class="sh" x="232" y="83" text-anchor="end">‏تسلسل‏</text><text class="cell" x="232" y="106" text-anchor="end">‏نئی حکومت اسے ختم کر دیتی ہے‏</text></g><g id="node-data"><rect class="panel-b" x="24" y="170" width="220" height="56" rx="8"/><text class="sh" x="232" y="193" text-anchor="end">‏اعداد و شمار‏</text><text class="cell" x="232" y="216" text-anchor="end">‏داخلوں کے قابلِ اعتماد اعداد نہیں‏</text></g><g id="node-politics"><rect class="panel-b" x="24" y="280" width="220" height="56" rx="8"/><text class="sh" x="232" y="303" text-anchor="end">‏سیاست‏</text><text class="cell" x="232" y="326" text-anchor="end">‏زبان، شناخت، مذہب‏</text></g><g id="node-centre"><rect class="panel-a" x="290" y="180" width="200" height="80" rx="30"/><text class="h" x="390" y="212" text-anchor="middle">‏تعلیمی پالیسیاں‏</text><text class="h" x="390" y="234" text-anchor="middle">‏کیوں لڑکھڑاتی ہیں‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏تعلیمی پالیسیاں کیوں لڑکھڑاتی ہیں‏</text><text class="wm" font-family="system-ui, sans-serif" x="12" y="348" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
