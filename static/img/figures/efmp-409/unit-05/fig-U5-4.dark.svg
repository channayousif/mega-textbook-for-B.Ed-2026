<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The Sharif Commission and the 1979 policy compared</title><desc id="d">Table comparing the main recommendations of the Sharif Commission report of 1959 and the National Education Policy 1979 on schooling structure, compulsory education, curriculum, teachers and implementation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="354" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="44" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="94" x2="756" y2="94"/><line class="frame" x1="24" y1="156" x2="756" y2="156"/><line class="frame" x1="24" y1="218" x2="756" y2="218"/><line class="frame" x1="24" y1="280" x2="756" y2="280"/><line class="frame" x1="24" y1="342" x2="756" y2="342"/><line class="frame" x1="24" y1="404" x2="756" y2="404"/><line class="frame" x1="200" y1="50" x2="200" y2="404"/><line class="frame" x1="452" y1="50" x2="452" y2="404"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Theme</text><text class="h" x="210" y="78">Sharif Commission 1959</text><text class="h" x="462" y="78">National Education Policy 1979</text><g id="node-structure"><text class="cell" x="34" y="126">Schooling structure</text><text class="cell" x="210" y="119">Pre-university extended</text><text class="cell" x="210" y="136">ten to twelve years;</text><text class="cell" x="210" y="153">three-year degree</text><text class="cell" x="462" y="119">National language as medium;</text><text class="cell" x="462" y="136">religious and modern systems</text><text class="cell" x="462" y="153">integrated into one system</text></g><g id="node-compulsory"><text class="cell" x="34" y="188">Compulsory education</text><text class="cell" x="210" y="181">Five-year universal compulsory</text><text class="cell" x="210" y="198">in ten years; eight years</text><text class="cell" x="210" y="215">within fifteen</text><text class="cell" x="462" y="181">Expansion through mosque,</text><text class="cell" x="462" y="198">mohalla and village</text><text class="cell" x="462" y="215">workshop schools</text></g><g id="node-curriculum"><text class="cell" x="34" y="250">Curriculum</text><text class="cell" x="210" y="243">Core of science, mathematics</text><text class="cell" x="210" y="260">and national language with</text><text class="cell" x="210" y="277">vocational options</text><text class="cell" x="462" y="243">Curriculum revised around</text><text class="cell" x="462" y="260">Islamic thought and national</text><text class="cell" x="462" y="277">ideology</text></g><g id="node-teachers"><text class="cell" x="34" y="312">Teachers</text><text class="cell" x="210" y="305">Improve training, salaries</text><text class="cell" x="210" y="322">and service conditions</text><text class="cell" x="462" y="305">Teacher education and</text><text class="cell" x="462" y="322">motivation named as chapters</text></g><g id="node-implementation"><text class="cell" x="34" y="374">Implementation</text><text class="cell" x="210" y="367">Machinery suggested but</text><text class="cell" x="210" y="384">limited; a report, not a</text><text class="cell" x="210" y="401">programme</text><text class="cell" x="462" y="367">An implementation programme</text><text class="cell" x="462" y="384">approved by cabinet</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">The Sharif Commission and the 1979 policy compared</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
