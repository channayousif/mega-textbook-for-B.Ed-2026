<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Pakistan's education conference, commissions and policies 1947 to 1998</title><desc id="d">Timeline of Pakistan's education conference, commissions and policies from 1947 to 1998, showing the 1947 Pakistan Education Conference, the 1959 Sharif Commission report, the 1970 policy, the 1972-1980 policy, the 1979 policy, the 1992 policy and the 1998-2010 policy.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="300"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="200" rx="8"/></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="40" y1="150" x2="720" y2="150"/><line class="frame" x1="55" y1="140" x2="55" y2="160"/><line class="frame" x1="160" y1="140" x2="160" y2="160"/><line class="frame" x1="265" y1="140" x2="265" y2="160"/><line class="frame" x1="370" y1="140" x2="370" y2="160"/><line class="frame" x1="475" y1="140" x2="475" y2="160"/><line class="frame" x1="580" y1="140" x2="580" y2="160"/><line class="frame" x1="685" y1="140" x2="685" y2="160"/></g><g id="layer-nodes"><g id="node-1947"><text class="sh" x="55" y="90" text-anchor="middle">1947</text><text class="cell" x="55" y="185" text-anchor="middle">Education</text><text class="cell" x="55" y="201" text-anchor="middle">Conference,</text><text class="cell" x="55" y="217" text-anchor="middle">Karachi</text></g><g id="node-1959"><text class="sh" x="160" y="90" text-anchor="middle">1959</text><text class="cell" x="160" y="185" text-anchor="middle">Sharif</text><text class="cell" x="160" y="201" text-anchor="middle">Commission</text><text class="cell" x="160" y="217" text-anchor="middle">report</text></g><g id="node-1970"><text class="sh" x="265" y="90" text-anchor="middle">1970</text><text class="cell" x="265" y="185" text-anchor="middle">National</text><text class="cell" x="265" y="201" text-anchor="middle">Education</text><text class="cell" x="265" y="217" text-anchor="middle">Policy</text></g><g id="node-1972"><text class="sh" x="370" y="90" text-anchor="middle">1972-1980</text><text class="cell" x="370" y="185" text-anchor="middle">National</text><text class="cell" x="370" y="201" text-anchor="middle">Education</text><text class="cell" x="370" y="217" text-anchor="middle">Policy</text></g><g id="node-1979"><text class="sh" x="475" y="90" text-anchor="middle">1979</text><text class="cell" x="475" y="185" text-anchor="middle">National</text><text class="cell" x="475" y="201" text-anchor="middle">Education</text><text class="cell" x="475" y="217" text-anchor="middle">Policy 1979</text></g><g id="node-1992"><text class="sh" x="580" y="90" text-anchor="middle">1992</text><text class="cell" x="580" y="185" text-anchor="middle">National</text><text class="cell" x="580" y="201" text-anchor="middle">Education</text><text class="cell" x="580" y="217" text-anchor="middle">Policy 1992</text></g><g id="node-1998"><text class="sh" x="685" y="90" text-anchor="middle">1998</text><text class="cell" x="685" y="185" text-anchor="middle">National Education</text><text class="cell" x="685" y="201" text-anchor="middle">Policy</text><text class="cell" x="685" y="217" text-anchor="middle">1998-2010</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Pakistan's education conference, commissions and policies, 1947 to 1998</text><text id="label-caption" class="small" x="24" y="278">Dates follow the PIE national education policy list.</text><text class="wm" x="768" y="290" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
