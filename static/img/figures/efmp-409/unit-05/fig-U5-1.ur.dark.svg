<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 670" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی پالیسی کا چکر: فلو چارٹ</title><desc id="d">تعلیمی پالیسی کے چکر کا فلو چارٹ: ایک مسئلے سے شروع ہو کر کمیشن کی رپورٹ اور مسودۂ پالیسی سے گزرتا ہے، منظوری کے فیصلے کے بعد اجرا اور نفاذ تک پہنچتا ہے، اور پھر جائزے پر جاتا ہے جو اگلے چکر کی بنیاد بنتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="670"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-problem-report" class="stroke" x1="390" y1="98" x2="390" y2="128" marker-end="url(#arrow)"/><line id="edge-report-draft" class="stroke" x1="400" y1="186" x2="400" y2="214" marker-end="url(#arrow)"/><line id="edge-draft-decision" class="stroke" x1="390" y1="272" x2="390" y2="300" marker-end="url(#arrow)"/><line id="edge-decision-launch" class="stroke" x1="390" y1="378" x2="390" y2="406" marker-end="url(#arrow)"/><line id="edge-launch-implementation" class="stroke" x1="390" y1="464" x2="390" y2="492" marker-end="url(#arrow)"/><line id="edge-implementation-review" class="stroke" x1="390" y1="550" x2="390" y2="578" marker-end="url(#arrow)"/><line id="edge-decision-revise" class="stroke" x1="500" y1="340" x2="596" y2="340" marker-end="url(#arrow)"/><path id="edge-revise-draft" class="dash" d="M670 300 L670 244 L512 244" marker-end="url(#arrow)"/><path id="edge-review-problem" class="dash" d="M510 608 L720 608 L720 74 L512 74" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-problem"><rect class="panel-a" x="270" y="50" width="240" height="48" rx="24"/><text class="sh" x="390" y="79" text-anchor="middle">‏اسکولوں یا معاشرے میں ایک مسئلہ‏</text></g><g id="node-report"><polygon class="panel-b" points="500,130 280,130 300,186 520,186"/><text class="cell" x="400" y="150" text-anchor="middle">‏ایک کمیشن یا کمیٹی مقرر ہوتی ہے‏</text><text class="cell" x="400" y="176" text-anchor="middle">‏اور رپورٹ لکھتی ہے‏</text></g><g id="node-draft"><rect class="panel" x="270" y="216" width="240" height="56" rx="8"/><text class="cell" x="390" y="236" text-anchor="middle">‏حکومت رپورٹ کی بنیاد پر‏</text><text class="cell" x="390" y="261" text-anchor="middle">‏پالیسی کا مسودہ بناتی ہے‏</text></g><g id="node-decision"><polygon class="panel-b" points="390,302 280,340 390,378 500,340"/><text class="cell" x="390" y="333" text-anchor="middle">‏کیا پالیسی‏</text><text class="cell" x="390" y="358" text-anchor="middle">‏منظور ہوئی؟‏</text></g><g id="node-revise"><rect class="panel" x="596" y="310" width="144" height="60" rx="8"/><text class="cell" x="668" y="331" text-anchor="middle">‏مسودے پر‏</text><text class="cell" x="668" y="357" text-anchor="middle">‏نظرِ ثانی‏</text></g><g id="node-launch"><rect class="panel" x="270" y="408" width="240" height="56" rx="8"/><text class="cell" x="390" y="428" text-anchor="middle">‏پالیسی کا اجرا:‏</text><text class="cell" x="390" y="453" text-anchor="middle">‏فنڈز، دفاتر، قواعد‏</text></g><g id="node-implementation"><rect class="panel" x="270" y="494" width="240" height="56" rx="8"/><text class="cell" x="390" y="514" text-anchor="middle">‏صوبوں، اضلاع اور اسکولوں‏</text><text class="cell" x="390" y="539" text-anchor="middle">‏میں نفاذ‏</text></g><g id="node-review"><rect class="panel" x="270" y="580" width="240" height="56" rx="8"/><text class="cell" x="390" y="600" text-anchor="middle">‏جائزہ اور نگرانی:‏</text><text class="cell" x="390" y="625" text-anchor="middle">‏کیا مسئلہ حل ہوا؟‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏تعلیمی پالیسی کا چکر‏</text><text class="small" x="544" y="330" text-anchor="end">‏نہیں‏</text><text class="small" x="382" y="398" text-anchor="end">‏ہاں‏</text><text class="small" x="714" y="600" text-anchor="end">‏چکر جاری رہتا ہے‏</text><text class="wm" font-family="system-ui, sans-serif" x="12" y="660" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
