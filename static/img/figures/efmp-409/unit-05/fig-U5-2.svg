<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">An education report compared with an education policy</title><desc id="d">Table comparing an education report and an education policy on who writes them, their authority, their purpose and their legal status, with a Pakistani example of each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="300" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="44" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="94" x2="756" y2="94"/><line class="frame" x1="24" y1="162" x2="756" y2="162"/><line class="frame" x1="24" y1="230" x2="756" y2="230"/><line class="frame" x1="24" y1="298" x2="756" y2="298"/><line class="frame" x1="24" y1="350" x2="756" y2="350"/><line class="frame" x1="164" y1="50" x2="164" y2="350"/><line class="frame" x1="368" y1="50" x2="368" y2="350"/><line class="frame" x1="572" y1="50" x2="572" y2="350"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Dimension</text><text class="h" x="174" y="78">An education report</text><text class="h" x="378" y="78">An education policy</text><text class="h" x="582" y="78">Pakistani example</text><g id="node-who"><text class="sh" x="34" y="122">Who writes it</text><text class="cell" x="174" y="115">A commission or committee</text><text class="cell" x="174" y="132">appointed by the government</text><text class="cell" x="378" y="115">The federal or provincial</text><text class="cell" x="378" y="132">government, a ministry</text><text class="cell" x="582" y="115">The Sharif Commission</text><text class="cell" x="582" y="132">report, 1959</text></g><g id="node-authority"><text class="sh" x="34" y="190">Authority</text><text class="cell" x="174" y="183">Advises; has no force of law</text><text class="cell" x="378" y="183">Adopted by government;</text><text class="cell" x="378" y="200">meant to be applied</text><text class="cell" x="582" y="183">The National Education</text><text class="cell" x="582" y="200">Policy, 1979</text></g><g id="node-purpose"><text class="sh" x="34" y="258">Purpose</text><text class="cell" x="174" y="251">Describes findings and</text><text class="cell" x="174" y="268">recommends change</text><text class="cell" x="378" y="251">States aims, targets and</text><text class="cell" x="378" y="268">a programme</text><text class="cell" x="582" y="251">The National Education</text><text class="cell" x="582" y="268">Policy, 1998-2010</text></g><g id="node-status"><text class="sh" x="34" y="326">Status in law</text><text class="cell" x="174" y="319">Not binding until the</text><text class="cell" x="174" y="336">government acts on it</text><text class="cell" x="378" y="319">Applied through offices,</text><text class="cell" x="378" y="336">funds and rules</text><text class="cell" x="582" y="319">Each names its ministry</text><text class="cell" x="582" y="336">and its date</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">An education report compared with an education policy</text><text class="wm" x="768" y="368" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
