<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کی تعلیمی کانفرنس، کمیشن اور پالیسیاں، 1947 تا 1998</title><desc id="d">1947 سے 1998 تک پاکستان کی تعلیمی کانفرنس، کمیشنوں اور پالیسیوں کی ٹائم لائن، جس میں 1947 کی پاکستان تعلیمی کانفرنس، 1959 کی شریف کمیشن رپورٹ، 1970 کی پالیسی، 1972-1980 کی پالیسی، 1979 کی پالیسی، 1992 کی پالیسی اور 1998-2010 کی پالیسی دکھائی گئی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="300"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="200" rx="8"/></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="740" y1="150" x2="60" y2="150"/><line class="frame" x1="725" y1="140" x2="725" y2="160"/><line class="frame" x1="620" y1="140" x2="620" y2="160"/><line class="frame" x1="515" y1="140" x2="515" y2="160"/><line class="frame" x1="410" y1="140" x2="410" y2="160"/><line class="frame" x1="305" y1="140" x2="305" y2="160"/><line class="frame" x1="200" y1="140" x2="200" y2="160"/><line class="frame" x1="95" y1="140" x2="95" y2="160"/></g><g id="layer-nodes"><g id="node-1947"><text class="sh" x="725" y="90" text-anchor="middle">1947</text><text class="cell" x="725" y="182" text-anchor="middle">‏تعلیمی‏</text><text class="cell" x="725" y="205" text-anchor="middle">‏کانفرنس،‏</text><text class="cell" x="725" y="228" text-anchor="middle">‏کراچی‏</text></g><g id="node-1959"><text class="sh" x="620" y="90" text-anchor="middle">1959</text><text class="cell" x="620" y="182" text-anchor="middle">‏شریف‏</text><text class="cell" x="620" y="205" text-anchor="middle">‏کمیشن‏</text><text class="cell" x="620" y="228" text-anchor="middle">‏رپورٹ‏</text></g><g id="node-1970"><text class="sh" x="515" y="90" text-anchor="middle">1970</text><text class="cell" x="515" y="182" text-anchor="middle">‏قومی‏</text><text class="cell" x="515" y="205" text-anchor="middle">‏تعلیمی‏</text><text class="cell" x="515" y="228" text-anchor="middle">‏پالیسی‏</text></g><g id="node-1972"><text class="sh" x="410" y="90" text-anchor="middle">1972-1980</text><text class="cell" x="410" y="182" text-anchor="middle">‏قومی‏</text><text class="cell" x="410" y="205" text-anchor="middle">‏تعلیمی‏</text><text class="cell" x="410" y="228" text-anchor="middle">‏پالیسی‏</text></g><g id="node-1979"><text class="sh" x="305" y="90" text-anchor="middle">1979</text><text class="cell" x="305" y="182" text-anchor="middle">‏قومی‏</text><text class="cell" x="305" y="205" text-anchor="middle">‏تعلیمی‏</text><text class="cell" x="305" y="228" text-anchor="middle">‏پالیسی 1979‏</text></g><g id="node-1992"><text class="sh" x="200" y="90" text-anchor="middle">1992</text><text class="cell" x="200" y="182" text-anchor="middle">‏قومی‏</text><text class="cell" x="200" y="205" text-anchor="middle">‏تعلیمی‏</text><text class="cell" x="200" y="228" text-anchor="middle">‏پالیسی 1992‏</text></g><g id="node-1998"><text class="sh" x="95" y="90" text-anchor="middle">1998</text><text class="cell" x="95" y="182" text-anchor="middle">‏قومی تعلیمی‏</text><text class="cell" x="95" y="205" text-anchor="middle">‏پالیسی‏</text><text class="cell" x="95" y="228" text-anchor="middle">1998-2010</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">‏پاکستان کی تعلیمی کانفرنس، کمیشن اور پالیسیاں، 1947 تا 1998‏</text><text id="label-caption" class="small" x="756" y="278" text-anchor="end">‏تاریخیں پی آئی ای کی قومی تعلیمی پالیسیوں کی فہرست کے مطابق ہیں۔‏</text><text class="wm" font-family="system-ui, sans-serif" x="12" y="290" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
