<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 566" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From a philosophy to the classroom</title><desc id="d">Flowchart from a philosophy to the classroom, top to bottom: a philosophy's view of reality, knowledge and values leads to the aims of education, then to the curriculum, then to teaching methods, then to the roles of teacher and pupil. A dashed arrow returns from the classroom to the philosophy, showing that classroom results test and refine the philosophy.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="566"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-philosophy-aims" class="stroke" x1="330" y1="112" x2="330" y2="150" marker-end="url(#arrow)"/><line id="edge-aims-curriculum" class="stroke" x1="330" y1="208" x2="330" y2="246" marker-end="url(#arrow)"/><line id="edge-curriculum-method" class="stroke" x1="330" y1="304" x2="330" y2="342" marker-end="url(#arrow)"/><line id="edge-method-roles" class="stroke" x1="330" y1="400" x2="330" y2="438" marker-end="url(#arrow)"/><path id="edge-roles-philosophy" class="dash" d="M510,468 L600,468 L600,84 L514,84" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-philosophy"><rect class="panel-a" x="150" y="56" width="360" height="56" rx="28"/><text class="sh" x="330" y="79" text-anchor="middle">A philosophy</text><text class="body" x="330" y="99" text-anchor="middle">view of reality, knowledge and values</text></g><g id="node-aims"><rect class="panel-b" x="150" y="152" width="360" height="56" rx="8"/><text class="sh" x="330" y="175" text-anchor="middle">Aims of education</text><text class="body" x="330" y="195" text-anchor="middle">what is education for?</text></g><g id="node-curriculum"><rect class="panel-b" x="150" y="248" width="360" height="56" rx="8"/><text class="sh" x="330" y="271" text-anchor="middle">Curriculum</text><text class="body" x="330" y="291" text-anchor="middle">what is worth teaching?</text></g><g id="node-method"><rect class="panel-b" x="150" y="344" width="360" height="56" rx="8"/><text class="sh" x="330" y="367" text-anchor="middle">Teaching method</text><text class="body" x="330" y="387" text-anchor="middle">how is it taught?</text></g><g id="node-roles"><rect class="panel-a" x="150" y="440" width="360" height="56" rx="28"/><text class="sh" x="330" y="463" text-anchor="middle">Roles in the classroom</text><text class="body" x="330" y="483" text-anchor="middle">what the teacher and pupils do</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">From a philosophy to the classroom</text><text id="label-caption" class="small" x="24" y="532">Solid arrows: each step shapes the next. Dashed arrow: classroom results feed back.</text><text id="label-feedback" class="small" x="616" y="259">classroom results</text><text class="small" x="616" y="276">test and refine</text><text class="small" x="616" y="293">the philosophy</text><text class="wm" x="768" y="556" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
