<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 566" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فلسفے سے کمرۂ جماعت تک کا سلسلہ</title><desc id="d">فلسفے سے کمرۂ جماعت تک کا فلو چارٹ، اوپر سے نیچے: حقیقت، علم اور اقدار کے بارے میں فلسفیانہ زاویۂ نظر تعلیم کے مقاصد کو جنم دیتا ہے، پھر نصاب، پھر تدریسی طریقے، اور پھر استاد اور شاگرد کے کردار۔ ایک نقطہ دار تیر کمرۂ جماعت سے واپس فلسفے کی طرف جاتا ہے، جو ظاہر کرتا ہے کہ جماعتی نتائج فلسفے کو پرکھتے اور اس کی اصلاح کرتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="566"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-philosophy-aims" class="stroke" x1="450" y1="112" x2="450" y2="150" marker-end="url(#arrow)"/><line id="edge-aims-curriculum" class="stroke" x1="450" y1="208" x2="450" y2="246" marker-end="url(#arrow)"/><line id="edge-curriculum-method" class="stroke" x1="450" y1="304" x2="450" y2="342" marker-end="url(#arrow)"/><line id="edge-method-roles" class="stroke" x1="450" y1="400" x2="450" y2="438" marker-end="url(#arrow)"/><path id="edge-roles-philosophy" class="dash" d="M270,468 L180,468 L180,84 L266,84" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-philosophy"><rect class="panel-a" x="270" y="56" width="360" height="56" rx="28"/><text class="sh" x="450" y="79" text-anchor="middle">فلسفہ</text><text class="body" x="450" y="99" text-anchor="middle">حقیقت، علم اور اقدار کا زاویۂ نظر</text></g><g id="node-aims"><rect class="panel-b" x="270" y="152" width="360" height="56" rx="8"/><text class="sh" x="450" y="175" text-anchor="middle">تعلیم کے مقاصد</text><text class="body" x="450" y="195" text-anchor="middle">تعلیم کا مقصد کیا ہے؟</text></g><g id="node-curriculum"><rect class="panel-b" x="270" y="248" width="360" height="56" rx="8"/><text class="sh" x="450" y="271" text-anchor="middle">نصاب</text><text class="body" x="450" y="291" text-anchor="middle">کیا پڑھانا ضروری ہے؟</text></g><g id="node-method"><rect class="panel-b" x="270" y="344" width="360" height="56" rx="8"/><text class="sh" x="450" y="367" text-anchor="middle">طریقہ تدریس</text><text class="body" x="450" y="387" text-anchor="middle">کیسے پڑھایا جائے؟</text></g><g id="node-roles"><rect class="panel-a" x="270" y="440" width="360" height="56" rx="28"/><text class="sh" x="450" y="463" text-anchor="middle">کمرۂ جماعت میں کردار</text><text class="body" x="450" y="483" text-anchor="middle">استاد اور طلبہ کیا کرتے ہیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">فلسفے سے کمرۂ جماعت تک کا سلسلہ</text><text id="label-caption" class="small" x="756" y="532" text-anchor="end">مسلسل تیر: ہر مرحلہ اگلے مرحلے کی تشکیل کرتا ہے۔ نقطہ دار تیر: جماعتی نتائج سے حاصل ہونے والا فیڈ بیک۔</text><text id="label-feedback" class="small" x="164" y="259" text-anchor="end">کمرۂ جماعت کے نتائج</text><text class="small" x="164" y="276" text-anchor="end">فلسفے کی جانچ اور</text><text class="small" x="164" y="293" text-anchor="end">اس کی اصلاح کرتے ہیں</text><text class="wm" x="24" y="556" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>