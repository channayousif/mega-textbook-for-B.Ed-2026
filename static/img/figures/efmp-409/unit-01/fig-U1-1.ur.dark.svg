<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 517" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم کی تعریف کے پانچ زاویے</title><desc id="d">تعلیم کی تعریف کے پانچ زاویوں کا تقابلی جدول: لفظی ماخذ (پرورش کرنا اور باہر نکالنا)، محدود مفہوم (اسکولوں میں باقاعدہ تدریس)، وسیع مفہوم (ہر وہ تجربہ جو ذہن، کردار یا جسم کو سنوارے)، مغربی مفکرین (پیسٹالوزی، ڈیوی) کی تعریفیں، اور اسلامی اصطلاحات تربیت، تعلیم اور تادیب۔ ہر قطار زاویۂ نظر، اس کا مفہوم اور سندھ کے کسی خاندان یا اسکول سے مثال پیش کرتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="517"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="405" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="167" x2="756" y2="167"/><line class="frame" x1="24" y1="239" x2="756" y2="239"/><line class="frame" x1="24" y1="311" x2="756" y2="311"/><line class="frame" x1="24" y1="383" x2="756" y2="383"/><line class="frame" x1="596" y1="50" x2="596" y2="455"/><line class="frame" x1="296" y1="50" x2="296" y2="455"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">زاویۂ نظر</text><text class="h" x="586" y="78" text-anchor="end">بنیادی مفہوم</text><text class="h" x="286" y="78" text-anchor="end">سندھ سے عملی مثال</text><g id="node-origin"><text class="sh" x="746" y="117" text-anchor="end">لفظی ماخذ</text><text class="cell" x="586" y="117" text-anchor="end">educare: پرورش کرنا یا پالنا پوسنا</text><text class="cell" x="586" y="134" text-anchor="end">educere: باہر نکالنا، رہنمائی کرنا</text><text class="cell" x="286" y="117" text-anchor="end">والدین کا بچے کی پرورش کرنا؛</text><text class="cell" x="286" y="134" text-anchor="end">استاد کا فطری صلاحیتوں کو ابھارنا</text></g><g id="node-narrow"><text class="sh" x="746" y="189" text-anchor="end">محدود مفہوم</text><text class="cell" x="586" y="189" text-anchor="end">اسکولوں، کالجوں اور جامعات میں</text><text class="cell" x="586" y="206" text-anchor="end">منظم و دانستہ تدریس کا عمل</text><text class="cell" x="286" y="189" text-anchor="end">جماعت ہفتم میں تربیت یافتہ استاد کا</text><text class="cell" x="286" y="206" text-anchor="end">نصاب کے مطابق سائنس پڑھانا</text></g><g id="node-broad"><text class="sh" x="746" y="261" text-anchor="end">وسیع مفہوم</text><text class="cell" x="586" y="261" text-anchor="end">ہر وہ تجربہ جو انسان کے ذہن،</text><text class="cell" x="586" y="278" text-anchor="end">کردار یا جسم کو سنوارے</text><text class="cell" x="286" y="261" text-anchor="end">خاندانی دکان پر لڑکی کا حساب کتاب،</text><text class="cell" x="286" y="278" text-anchor="end">معاملات اور صبر و ضبط سیکھنا</text></g><g id="node-western"><text class="sh" x="746" y="333" text-anchor="end">مغربی مفکرین</text><text class="cell" x="586" y="333" text-anchor="end">پیسٹالوزی: پیدائشی صلاحیتوں کی نشوونما؛</text><text class="cell" x="586" y="350" text-anchor="end">ڈیوی: تجربات کی مسلسل تشکیلِ نو</text><text class="cell" x="286" y="333" text-anchor="end">استاد کا بچے کی گھریلو معلومات اور</text><text class="cell" x="286" y="350" text-anchor="end">سابقہ تجربات کی بنیاد پر تدریس کرنا</text></g><g id="node-muslim"><text class="sh" x="746" y="405" text-anchor="end">اسلامی اصطلاحات</text><text class="cell" x="586" y="405" text-anchor="end">تربیت: ہمہ جہت نشوونما کی رہنمائی</text><text class="cell" x="586" y="422" text-anchor="end">تعلیم: صحیح علم کی منتقلی؛ تادیب: حسنِ عمل</text><text class="cell" x="286" y="405" text-anchor="end">فہم کے ساتھ قرآن پاک پڑھنا اور</text><text class="cell" x="286" y="422" text-anchor="end">روزمرہ زندگی میں اس پر عمل کرنا</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">تعلیم کی تعریف کے پانچ زاویے</text><text id="label-caption" class="small" x="756" y="483" text-anchor="end">اکثر تعریفیں اس پر متفق ہیں کہ تعلیم ایک مثبت سمت میں نشوونما کا نام ہے، محض اسکول جانا نہیں۔</text><text class="wm" x="24" y="507" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>