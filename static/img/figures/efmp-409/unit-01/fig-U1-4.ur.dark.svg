<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 457" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم کے پانچ مقاصد</title><desc id="d">تعلیم کے پانچ بنیادی مقاصد کا جدول مع مفہوم اور مثال: انفرادی مقصد (ہر بچے کی مکمل صلاحیتوں کو نکھارنا، جیسے کسی شرمیلی طالبہ کو شاعری میں اپنی صلاحیت دریافت کرنے میں مدد دینا)؛ معاشرتی مقصد (باہمی احترام کے ساتھ مل جل کر رہنے والے شہری تیار کرنا، جیسے اسکول کے قریب گلی کی صفائی کا جماعتی منصوبہ)؛ پیشہ ورانہ مقصد (دیانت دارانہ روزگار کے لیے تیار کرنا، جیسے ہائی اسکول میں تکنیکی شعبہ)؛ اخلاقی مقصد (اچھے کردار کی تعمیر، جیسے مانیٹر کا منصفانہ نظام)؛ اور روحانی مقصد (ایمان اور باطنی زندگی کی آبیاری، جیسے قرآنی سبق کے عملی تقاضوں پر غور کرنا)۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="457"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="345" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="155" x2="756" y2="155"/><line class="frame" x1="24" y1="215" x2="756" y2="215"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="335" x2="756" y2="335"/><line class="frame" x1="616" y1="50" x2="616" y2="395"/><line class="frame" x1="326" y1="50" x2="326" y2="395"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">مقصد</text><text class="h" x="606" y="78" text-anchor="end">اس کا کیا مطلب ہے</text><text class="h" x="316" y="78" text-anchor="end">پاکستانی اسکول سے عملی مثال</text><g id="node-individual"><text class="sh" x="746" y="117" text-anchor="end">انفرادی</text><text class="cell" x="606" y="117" text-anchor="end">ہر بچے کی مکمل صلاحیتوں کو نکھارنا:</text><text class="cell" x="606" y="134" text-anchor="end">ذہن، جسم، جذبات اور فطری استعداد</text><text class="cell" x="316" y="117" text-anchor="end">ایک شرمیلی طالبہ کو شاعری میں اپنی</text><text class="cell" x="316" y="134" text-anchor="end">صلاحیت دریافت کرنے میں مدد دینا</text></g><g id="node-social"><text class="sh" x="746" y="177" text-anchor="end">معاشرتی</text><text class="cell" x="606" y="177" text-anchor="end">باہمی احترام کے ساتھ مل جل کر</text><text class="cell" x="606" y="194" text-anchor="end">رہنے والے ذمہ دار شہری تیار کرنا</text><text class="cell" x="316" y="177" text-anchor="end">اسکول کے قریب محلے کی صفائی کے</text><text class="cell" x="316" y="194" text-anchor="end">لیے جماعت کا ایک عملی منصوبہ</text></g><g id="node-vocational"><text class="sh" x="746" y="237" text-anchor="end">پیشہ ورانہ</text><text class="cell" x="606" y="237" text-anchor="end">لوگوں کو دیانت دارانہ روزگار اور</text><text class="cell" x="606" y="254" text-anchor="end">معاشی زندگی کے لیے ہنر سکھانا</text><text class="cell" x="316" y="237" text-anchor="end">ہائی اسکول میں تکنیکی شعبہ یا عملی</text><text class="cell" x="316" y="254" text-anchor="end">دستکاری و مہارتوں کی تربیت</text></g><g id="node-moral"><text class="sh" x="746" y="297" text-anchor="end">اخلاقی</text><text class="cell" x="606" y="297" text-anchor="end">اچھے کردار کی تعمیر: دیانت داری،</text><text class="cell" x="606" y="314" text-anchor="end">انصاف اور سماجی ذمہ داری</text><text class="cell" x="316" y="297" text-anchor="end">کلاس مانیٹر کا منصفانہ نظام جہاں</text><text class="cell" x="316" y="314" text-anchor="end">ہر طالب علم کو باری باری موقع ملے</text></g><g id="node-spiritual"><text class="sh" x="746" y="357" text-anchor="end">روحانی</text><text class="cell" x="606" y="357" text-anchor="end">ایمان اور باطنی و روحانی</text><text class="cell" x="606" y="374" text-anchor="end">زندگی کی آبیاری کرنا</text><text class="cell" x="316" y="357" text-anchor="end">اس بات پر غور کرنا کہ قرآنی سبق ہم</text><text class="cell" x="316" y="374" text-anchor="end">سے روزمرہ زندگی میں کیا تقاضا کرتا ہے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">تعلیم کے پانچ بنیادی مقاصد</text><text id="label-caption" class="small" x="756" y="423" text-anchor="end">مقاصد اسکول کے تدریسی اوقات کے لیے باہم متصل ہوتے ہیں، اس لیے ایک متوازن ٹائم ٹیبل ان سب میں توازن قائم رکھتا ہے۔</text><text class="wm" x="24" y="447" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>