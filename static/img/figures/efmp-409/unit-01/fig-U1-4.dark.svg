<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 457" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five aims of education</title><desc id="d">Table of five aims of education, each with what it means and an example: individual aim (develop each child's full potential, such as helping a shy pupil find her talent in poetry); social aim (prepare citizens who live together, such as a class project to clean the street); vocational aim (prepare for honest work, such as a technical stream in a high school); moral aim (build good character and conduct, such as a fair class monitor system); spiritual aim (nurture faith and inner life, such as reflecting on what a Qur'an lesson asks of us).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="457"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="345" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="155" x2="756" y2="155"/><line class="frame" x1="24" y1="215" x2="756" y2="215"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="335" x2="756" y2="335"/><line class="frame" x1="164" y1="50" x2="164" y2="395"/><line class="frame" x1="454" y1="50" x2="454" y2="395"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Aim</text><text class="h" x="174" y="78">What it means</text><text class="h" x="464" y="78">Example in a Pakistani school</text><g id="node-individual"><text class="sh" x="34" y="117">Individual</text><text class="cell" x="174" y="117">Develop each child's full</text><text class="cell" x="174" y="134">potential: mind, body, talents</text><text class="cell" x="464" y="117">Helping a shy pupil find her</text><text class="cell" x="464" y="134">talent for poetry</text></g><g id="node-social"><text class="sh" x="34" y="177">Social</text><text class="cell" x="174" y="177">Prepare citizens who live</text><text class="cell" x="174" y="194">together with respect</text><text class="cell" x="464" y="177">A class project to clean the</text><text class="cell" x="464" y="194">street near the school</text></g><g id="node-vocational"><text class="sh" x="34" y="237">Vocational</text><text class="cell" x="174" y="237">Prepare people for honest</text><text class="cell" x="174" y="254">work and a livelihood</text><text class="cell" x="464" y="237">A technical stream or workshop</text><text class="cell" x="464" y="254">skills in a high school</text></g><g id="node-moral"><text class="sh" x="34" y="297">Moral</text><text class="cell" x="174" y="297">Build good character: honesty,</text><text class="cell" x="174" y="314">justice, responsibility</text><text class="cell" x="464" y="297">A fair class-monitor system</text><text class="cell" x="464" y="314">where every pupil takes a turn</text></g><g id="node-spiritual"><text class="sh" x="34" y="357">Spiritual</text><text class="cell" x="174" y="357">Nurture faith and</text><text class="cell" x="174" y="374">the inner life</text><text class="cell" x="464" y="357">Reflecting on what a Qur'an</text><text class="cell" x="464" y="374">lesson asks of us each day</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Five aims of education</text><text id="label-caption" class="small" x="24" y="423">Aims compete for time in a school, so a good timetable balances them.</text><text class="wm" x="768" y="447" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
