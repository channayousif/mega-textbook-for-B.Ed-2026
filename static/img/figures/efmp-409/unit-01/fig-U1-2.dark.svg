<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three branches of philosophy and the school questions they raise</title><desc id="d">Concept map with philosophy at the centre and three branches. Metaphysics asks what is real, which leads to the school question what is a child and what is worth studying. Epistemology asks what is true and how we know, which leads to how pupils should come to know. Axiology asks what is good and valuable, divides into ethics and aesthetics, and leads to which values the school should build.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-philosophy-metaphysics" class="stroke" x1="390" y1="110" x2="140" y2="158" marker-end="url(#arrow)"/><line id="edge-philosophy-epistemology" class="stroke" x1="390" y1="110" x2="390" y2="158" marker-end="url(#arrow)"/><line id="edge-philosophy-axiology" class="stroke" x1="390" y1="110" x2="640" y2="158" marker-end="url(#arrow)"/><line id="edge-metaphysics-school" class="dash" x1="140" y1="240" x2="140" y2="368" marker-end="url(#arrow)"/><line id="edge-epistemology-school" class="dash" x1="390" y1="240" x2="390" y2="368" marker-end="url(#arrow)"/><line id="edge-axiology-ethics" class="stroke" x1="640" y1="240" x2="585" y2="268" marker-end="url(#arrow)"/><line id="edge-axiology-aesthetics" class="stroke" x1="640" y1="240" x2="697" y2="268" marker-end="url(#arrow)"/><line id="edge-ethics-school" class="dash" x1="585" y1="320" x2="625" y2="368" marker-end="url(#arrow)"/><line id="edge-aesthetics-school" class="dash" x1="697" y1="320" x2="657" y2="368" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-philosophy"><rect class="panel-a" x="250" y="50" width="280" height="60" rx="30"/><text class="h" x="390" y="76" text-anchor="middle">Philosophy</text><text class="body" x="390" y="96" text-anchor="middle">the love of wisdom</text></g><g id="node-metaphysics"><rect class="panel-b" x="30" y="160" width="220" height="80" rx="8"/><text class="h" x="140" y="184" text-anchor="middle">Metaphysics</text><text class="body" x="140" y="205" text-anchor="middle">What is real?</text></g><g id="node-epistemology"><rect class="panel-b" x="280" y="160" width="220" height="80" rx="8"/><text class="h" x="390" y="184" text-anchor="middle">Epistemology</text><text class="body" x="390" y="205" text-anchor="middle">What is true?</text><text class="body" x="390" y="222" text-anchor="middle">How do we know?</text></g><g id="node-axiology"><rect class="panel-b" x="530" y="160" width="220" height="80" rx="8"/><text class="h" x="640" y="184" text-anchor="middle">Axiology</text><text class="body" x="640" y="205" text-anchor="middle">What is good</text><text class="body" x="640" y="222" text-anchor="middle">and valuable?</text></g><g id="node-ethics"><rect class="panel" x="532" y="270" width="106" height="50" rx="8"/><text class="sh" x="585" y="290" text-anchor="middle">Ethics</text><text class="cell" x="585" y="308" text-anchor="middle">right conduct</text></g><g id="node-aesthetics"><rect class="panel" x="644" y="270" width="106" height="50" rx="8"/><text class="sh" x="697" y="290" text-anchor="middle">Aesthetics</text><text class="cell" x="697" y="308" text-anchor="middle">beauty</text></g><g id="node-school-child"><rect class="panel" x="30" y="370" width="220" height="74" rx="8"/><text class="sh" x="140" y="392" text-anchor="middle">In school</text><text class="body" x="140" y="412" text-anchor="middle">What is a child, and</text><text class="body" x="140" y="429" text-anchor="middle">what is worth studying?</text></g><g id="node-school-knowing"><rect class="panel" x="280" y="370" width="220" height="74" rx="8"/><text class="sh" x="390" y="392" text-anchor="middle">In school</text><text class="body" x="390" y="412" text-anchor="middle">How should pupils</text><text class="body" x="390" y="429" text-anchor="middle">come to know?</text></g><g id="node-school-values"><rect class="panel" x="530" y="370" width="220" height="74" rx="8"/><text class="sh" x="640" y="392" text-anchor="middle">In school</text><text class="body" x="640" y="412" text-anchor="middle">Which values should</text><text class="body" x="640" y="429" text-anchor="middle">the school build?</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Three branches of philosophy and the school questions they raise</text><text id="label-caption" class="small" x="24" y="474">Solid arrows: a branch of philosophy and its parts. Dashed arrows: the question it raises</text><text id="label-caption1" class="small" x="24" y="492">for a teacher.</text><text class="wm" x="768" y="520" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
