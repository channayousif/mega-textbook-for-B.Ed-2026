<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فلسفے کی تین شاخیں اور اسکول میں اٹھنے والے سوالات</title><desc id="d">تصوراتی خاکہ جس کے مرکز میں فلسفہ اور اس کی تین بنیادی شاخیں ہیں۔ مابعد الطبیعیات دریافت کرتی ہے کہ حقیقت کیا ہے، جس سے اسکول میں یہ سوال جنم لیتا ہے کہ بچہ کیا ہے اور کیا پڑھانے کے لائق ہے۔ علمیات دریافت کرتی ہے کہ سچ کیا ہے اور ہم کیسے جانتے ہیں، جس سے یہ سوال پیدا ہوتا ہے کہ طلبہ کو علم کیسے حاصل کرنا چاہیے۔ قدرِیات دریافت کرتی ہے کہ کیا اچھا اور قابلِ قدر ہے، جو اخلاقیات اور جمالیات میں تقسیم ہوتی ہے اور اسکول میں اقدار کی تعمیر کی رہنمائی کرتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-philosophy-metaphysics" class="stroke" x1="390" y1="110" x2="640" y2="158" marker-end="url(#arrow)"/><line id="edge-philosophy-epistemology" class="stroke" x1="390" y1="110" x2="390" y2="158" marker-end="url(#arrow)"/><line id="edge-philosophy-axiology" class="stroke" x1="390" y1="110" x2="140" y2="158" marker-end="url(#arrow)"/><line id="edge-metaphysics-school" class="dash" x1="640" y1="240" x2="640" y2="368" marker-end="url(#arrow)"/><line id="edge-epistemology-school" class="dash" x1="390" y1="240" x2="390" y2="368" marker-end="url(#arrow)"/><line id="edge-axiology-ethics" class="stroke" x1="140" y1="240" x2="85" y2="268" marker-end="url(#arrow)"/><line id="edge-axiology-aesthetics" class="stroke" x1="140" y1="240" x2="197" y2="268" marker-end="url(#arrow)"/><line id="edge-ethics-school" class="dash" x1="85" y1="320" x2="125" y2="368" marker-end="url(#arrow)"/><line id="edge-aesthetics-school" class="dash" x1="197" y1="320" x2="155" y2="368" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-philosophy"><rect class="panel-a" x="250" y="50" width="280" height="60" rx="30"/><text class="h" x="390" y="76" text-anchor="middle">فلسفہ</text><text class="body" x="390" y="96" text-anchor="middle">دانائی و حکمت کی تلاش</text></g><g id="node-metaphysics"><rect class="panel-b" x="530" y="160" width="220" height="80" rx="8"/><text class="h" x="640" y="184" text-anchor="middle">مابعد الطبیعیات</text><text class="body" x="640" y="205" text-anchor="middle">حقیقت کیا ہے؟</text></g><g id="node-epistemology"><rect class="panel-b" x="280" y="160" width="220" height="80" rx="8"/><text class="h" x="390" y="184" text-anchor="middle">علمیات</text><text class="body" x="390" y="205" text-anchor="middle">سچ کیا ہے؟</text><text class="body" x="390" y="222" text-anchor="middle">ہم کیسے جانتے ہیں؟</text></g><g id="node-axiology"><rect class="panel-b" x="30" y="160" width="220" height="80" rx="8"/><text class="h" x="140" y="184" text-anchor="middle">قدرِیات</text><text class="body" x="140" y="205" text-anchor="middle">کیا اچھا اور</text><text class="body" x="140" y="222" text-anchor="middle">قابلِ قدر ہے؟</text></g><g id="node-ethics"><rect class="panel" x="32" y="270" width="106" height="50" rx="8"/><text class="sh" x="85" y="290" text-anchor="middle">اخلاقیات</text><text class="cell" x="85" y="308" text-anchor="middle">نیک عمل</text></g><g id="node-aesthetics"><rect class="panel" x="144" y="270" width="106" height="50" rx="8"/><text class="sh" x="197" y="290" text-anchor="middle">جمالیات</text><text class="cell" x="197" y="308" text-anchor="middle">خوبصورتی</text></g><g id="node-school-child"><rect class="panel" x="530" y="370" width="220" height="74" rx="8"/><text class="sh" x="640" y="392" text-anchor="middle">اسکول میں</text><text class="body" x="640" y="412" text-anchor="middle">بچہ کیا ہے، اور کیا</text><text class="body" x="640" y="429" text-anchor="middle">پڑھانے کے لائق ہے؟</text></g><g id="node-school-knowing"><rect class="panel" x="280" y="370" width="220" height="74" rx="8"/><text class="sh" x="390" y="392" text-anchor="middle">اسکول میں</text><text class="body" x="390" y="412" text-anchor="middle">طلبہ کو علم کیسے</text><text class="body" x="390" y="429" text-anchor="middle">حاصل کرنا چاہیے؟</text></g><g id="node-school-values"><rect class="panel" x="30" y="370" width="220" height="74" rx="8"/><text class="sh" x="140" y="392" text-anchor="middle">اسکول میں</text><text class="body" x="140" y="412" text-anchor="middle">اسکول کو کن اقدار</text><text class="body" x="140" y="429" text-anchor="middle">کو فروغ دینا چاہیے؟</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">فلسفے کی تین شاخیں اور اسکول میں اٹھنے والے سوالات</text><text id="label-caption" class="small" x="756" y="474" text-anchor="end">مسلسل تیر: فلسفے کی شاخیں اور ان کے ذیلی اجزاء۔ نقطہ دار تیر: وہ سوالات جو تدریس</text><text id="label-caption1" class="small" x="756" y="492" text-anchor="end">کے دوران اساتذہ کے لیے پیدا ہوتے ہیں۔</text><text class="wm" x="24" y="520" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>