<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 517" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five ways to define education</title><desc id="d">Table comparing five ways of defining education: the word origin (to bring up, and to lead out), the narrow meaning (deliberate teaching in schools), the broad meaning (any experience that shapes the mind, character or body), definitions by Western thinkers (Pestalozzi, Dewey), and the Muslim terms tarbiyah, ta'lim and ta'dib. Each row gives what the view says and an example from a Sindh family or school.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="517"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="405" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="167" x2="756" y2="167"/><line class="frame" x1="24" y1="239" x2="756" y2="239"/><line class="frame" x1="24" y1="311" x2="756" y2="311"/><line class="frame" x1="24" y1="383" x2="756" y2="383"/><line class="frame" x1="184" y1="50" x2="184" y2="455"/><line class="frame" x1="484" y1="50" x2="484" y2="455"/></g><g id="layer-nodes"><text class="h" x="34" y="78">View</text><text class="h" x="194" y="78">What it says</text><text class="h" x="494" y="78">Example from Sindh</text><g id="node-origin"><text class="sh" x="34" y="117">Word origin</text><text class="cell" x="194" y="117">educare: to bring up or rear</text><text class="cell" x="194" y="134">educere: to lead out, bring out</text><text class="cell" x="494" y="117">A parent raising a child;</text><text class="cell" x="494" y="134">a teacher drawing out curiosity</text></g><g id="node-narrow"><text class="sh" x="34" y="189">Narrow meaning</text><text class="cell" x="194" y="189">Deliberate teaching in schools,</text><text class="cell" x="194" y="206">colleges and universities</text><text class="cell" x="494" y="189">Class 7 science taught from the</text><text class="cell" x="494" y="206">syllabus by a trained teacher</text></g><g id="node-broad"><text class="sh" x="34" y="261">Broad meaning</text><text class="cell" x="194" y="261">Any experience that shapes the</text><text class="cell" x="194" y="278">mind, character or body</text><text class="cell" x="494" y="261">A girl learns accounts and</text><text class="cell" x="494" y="278">patience in her family shop</text></g><g id="node-western"><text class="sh" x="34" y="333">Western thinkers</text><text class="cell" x="194" y="333">Pestalozzi: natural development</text><text class="cell" x="194" y="350">of inborn powers. Dewey: growth</text><text class="cell" x="194" y="367">by rebuilding experience</text><text class="cell" x="494" y="333">A teacher builds on what pupils</text><text class="cell" x="494" y="350">already know from home</text></g><g id="node-muslim"><text class="sh" x="34" y="405">Muslim terms</text><text class="cell" x="194" y="405">Tarbiyah: nurturing growth</text><text class="cell" x="194" y="422">Ta'lim: passing on knowledge</text><text class="cell" x="194" y="439">Ta'dib: knowledge shown in conduct</text><text class="cell" x="494" y="405">Reading the Qur'an with meaning</text><text class="cell" x="494" y="422">and acting on it in daily life</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Five ways to define education</text><text id="label-caption" class="small" x="24" y="483">Most definitions agree that education is growth in a good direction, not only schooling.</text><text class="wm" x="768" y="507" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
