<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اصحابِ صفہ کا تعلیمی نمونہ</title><desc id="d">اصحابِ صفہ کے تعلیمی نمونے کا چکراتی خاکہ جس کے پانچ دائرے مرکز کے گرد ہیں۔ مرکز میں 'صفہ کا تعلیمی حلقہ' درج ہے۔ دائروں میں 'معلم: نبی کریم ﷺ'، 'متعلمین: اصحابِ صفہ'، 'عمل: جو سیکھا اس پر عمل کرنا'، 'اشاعت: دوسروں کو سکھانا'، اور 'روزمرہ زندگی: عبادت، کھانا اور رفاقت' درج ہیں۔ تیر ہر دائرے سے اگلے دائرے کی طرف چلتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.lbl { font-size: 13px; font-weight: 600; fill: var(--ink); }
.centre { font-size: 14px; font-weight: 700; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect class="panel" x="24" y="45" width="732" height="390" rx="8"/><ellipse id="region-centre" cx="390" cy="240" rx="95" ry="62" class="panel-a"/></g><g id="layer-edges"><path id="edge-teacher-learners" class="stroke" d="M495,87 C570,87 650,100 650,140" marker-end="url(#arrow)"/><line id="edge-learners-practice" class="stroke" x1="650" y1="204" x2="650" y2="300" marker-end="url(#arrow)"/><line id="edge-practice-outreach" class="stroke" x1="560" y1="332" x2="220" y2="332" marker-end="url(#arrow)"/><line id="edge-outreach-life" class="stroke" x1="130" y1="300" x2="130" y2="204" marker-end="url(#arrow)"/><path id="edge-life-teacher" class="stroke" d="M220,172 C220,100 285,87 285,87" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-teacher"><rect class="panel-b" x="285" y="55" width="210" height="64" rx="8"/><text class="lbl" x="390" y="81" text-anchor="middle">معلم: رسول اللہ ﷺ</text><text class="lbl" x="390" y="99" text-anchor="middle">(بذاتِ خود نمونۂ عمل)</text></g><g id="node-learners"><rect class="panel-b" x="560" y="140" width="180" height="64" rx="8"/><text class="lbl" x="650" y="166" text-anchor="middle">متعلمین: اصحابِ صفہ</text><text class="lbl" x="650" y="184" text-anchor="middle">(یکسوئی کے ساتھ حصولِ علم)</text></g><g id="node-practice"><rect class="panel-b" x="560" y="300" width="180" height="64" rx="8"/><text class="lbl" x="650" y="326" text-anchor="middle">عمل: جو سیکھا اس پر</text><text class="lbl" x="650" y="344" text-anchor="middle">عمل پیرا ہونا</text></g><g id="node-outreach"><rect class="panel-b" x="30" y="300" width="190" height="64" rx="8"/><text class="lbl" x="125" y="326" text-anchor="middle">اشاعت: دوسروں کو</text><text class="lbl" x="125" y="344" text-anchor="middle">سکھانا اور پھیلانا</text></g><g id="node-life"><rect class="panel-b" x="30" y="140" width="190" height="64" rx="8"/><text class="lbl" x="125" y="166" text-anchor="middle">روزمرہ زندگی: عبادت،</text><text class="lbl" x="125" y="184" text-anchor="middle">طعام اور باہمی رفاقت</text></g><text class="centre" x="390" y="246" text-anchor="middle">صفہ کا تعلیمی حلقہ</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="30" text-anchor="end">اصحابِ صفہ کا تعلیمی نمونہ</text><text id="label-caption" class="small" x="756" y="458" text-anchor="end">یہ تعلیمی حلقہ معلم، متعلمین، عملی مشق، اشاعتِ علم اور باہمی زندگی کو باہم جوڑتا ہے۔</text><text class="wm" x="24" y="472" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
