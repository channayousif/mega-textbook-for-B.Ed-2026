<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Subjects and methods at As-Suffa</title><desc id="d">Table of five subjects and methods at As-Suffa with a present-day classroom parallel for each: the Qur'an and Sunnah, reading and writing, Arabic language, memorisation and oral repetition, and teaching others.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="155" x2="756" y2="155"/><line class="frame" x1="24" y1="215" x2="756" y2="215"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="335" x2="756" y2="335"/><line class="frame" x1="24" y1="395" x2="756" y2="395"/><line class="frame" x1="234" y1="50" x2="234" y2="410"/><line class="frame" x1="500" y1="50" x2="500" y2="410"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Subject or method</text><text class="h" x="244" y="78">At As-Suffa</text><text class="h" x="510" y="78">Present-day parallel</text><g id="node-s1"><text class="sh" x="34" y="127">The Qur'an and Sunnah</text><text class="cell" x="244" y="127">Recitation, memorisation</text><text class="cell" x="244" y="144">and understanding</text><text class="cell" x="510" y="127">A lesson that teaches a text</text><text class="cell" x="510" y="144">with its meaning</text></g><g id="node-s2"><text class="sh" x="34" y="187">Reading and writing</text><text class="cell" x="244" y="187">Learners gained literacy;</text><text class="cell" x="244" y="204">writing carried knowledge</text><text class="cell" x="510" y="187">A lesson that asks pupils to</text><text class="cell" x="510" y="204">write, not only copy</text></g><g id="node-s3"><text class="sh" x="34" y="247">Arabic language</text><text class="cell" x="244" y="247">The language of the sources</text><text class="cell" x="244" y="264">was taught</text><text class="cell" x="510" y="247">A language lesson that</text><text class="cell" x="510" y="264">connects to reading</text></g><g id="node-s4"><text class="sh" x="34" y="307">Memorisation and oral</text><text class="sh" x="34" y="324">repetition</text><text class="cell" x="244" y="307">Listening, repeating and</text><text class="cell" x="244" y="324">reciting aloud</text><text class="cell" x="510" y="307">Choral reading and retrieval</text><text class="cell" x="510" y="324">practice</text></g><g id="node-s5"><text class="sh" x="34" y="367">Teaching others</text><text class="cell" x="244" y="367">Learners were prepared to go</text><text class="cell" x="244" y="384">out and teach</text><text class="cell" x="510" y="367">Peer teaching and a monitor</text><text class="cell" x="510" y="384">system</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Subjects and methods at As-Suffa</text><text id="label-caption" class="small" x="24" y="430">The curriculum joined the sources, literacy and the duties of daily life.</text><text class="wm" x="768" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
