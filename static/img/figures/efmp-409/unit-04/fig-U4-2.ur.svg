<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قرآن اور حدیث میں علم کا تصور</title><desc id="d">تصوراتی خاکہ جس کے مرکز میں علم اور اس کے گرد پانچ پہلو ہیں: تلاش (اقرا، پڑھنے کا حکم)، تفکر (تخلیق کی نشانیوں پر غور)، تعلیم (قلم اور معلم)، عمل (کردار میں علم کا اظہار) اور اشاعت (دوسروں تک علم پہنچانا)۔ تیر ہر پہلو سے مرکز کی طرف اشارہ کرتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.lbl { font-size: 13px; font-weight: 600; fill: var(--ink); }
.centre { font-size: 14px; font-weight: 700; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect class="panel" x="24" y="45" width="732" height="380" rx="8"/><ellipse id="region-centre" cx="390" cy="240" rx="112" ry="58" class="panel-a"/></g><g id="layer-edges"><line id="edge-seeking" class="stroke" x1="390" y1="112" x2="390" y2="176" marker-end="url(#arrow)"/><line id="edge-reflecting" class="stroke" x1="570" y1="178" x2="496" y2="214" marker-end="url(#arrow)"/><line id="edge-teaching" class="stroke" x1="570" y1="302" x2="496" y2="266" marker-end="url(#arrow)"/><line id="edge-acting" class="stroke" x1="210" y1="302" x2="284" y2="266" marker-end="url(#arrow)"/><line id="edge-sharing" class="stroke" x1="210" y1="178" x2="284" y2="214" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-seeking"><rect class="panel-b" x="290" y="56" width="200" height="56" rx="8"/><text class="lbl" x="390" y="90" text-anchor="middle">تلاشِ علم (اِقرا)</text></g><g id="node-reflecting"><rect class="panel-b" x="570" y="150" width="180" height="56" rx="8"/><text class="lbl" x="660" y="184" text-anchor="middle">تفکر اور غور (تفکر)</text></g><g id="node-teaching"><rect class="panel-b" x="570" y="300" width="180" height="56" rx="8"/><text class="lbl" x="660" y="334" text-anchor="middle">تدریس اور ابلاغ (قلم)</text></g><g id="node-acting"><rect class="panel-b" x="30" y="300" width="180" height="56" rx="8"/><text class="lbl" x="120" y="334" text-anchor="middle">عمل اور کردار (عمل)</text></g><g id="node-sharing"><rect class="panel-b" x="30" y="150" width="180" height="56" rx="8"/><text class="lbl" x="120" y="184" text-anchor="middle">اشاعت اور ترسیل (تبلیغ)</text></g><text class="centre" x="390" y="234" text-anchor="middle">علم</text><text class="centre" x="390" y="254" text-anchor="middle">قرآن اور حدیث کی روشنی میں</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="30" text-anchor="end">قرآن اور حدیث میں علم کا تصور</text><text id="label-caption" class="small" x="756" y="448" text-anchor="end">پانچ بنیادی تصورات علم کے مرکز سے جڑتے ہیں: تلاش، تفکر، تدریس، عمل اور اشاعت۔</text><text class="wm" x="24" y="462" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
