<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of Surah Al-Alaq verses 1 to 5</title><desc id="d">Table of Surah Al-Alaq verses 1 to 5. Each row gives the verse, what it says in plain words, and the educational idea it carries: read in the name of your Lord; man is created from a clinging clot; read again, for your Lord is generous; God taught by the pen; God taught humanity what it did not know.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="155" x2="756" y2="155"/><line class="frame" x1="24" y1="215" x2="756" y2="215"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="335" x2="756" y2="335"/><line class="frame" x1="24" y1="395" x2="756" y2="395"/><line class="frame" x1="140" y1="50" x2="140" y2="410"/><line class="frame" x1="440" y1="50" x2="440" y2="410"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Verse</text><text class="h" x="150" y="78">What it says in plain words</text><text class="h" x="450" y="78">The educational idea it carries</text><g id="node-v1"><text class="sh" x="34" y="127">96:1</text><text class="cell" x="150" y="127">Read, in the name of your Lord</text><text class="cell" x="150" y="144">who created</text><text class="cell" x="450" y="127">The first word of the revelation is</text><text class="cell" x="450" y="144">a command to read</text></g><g id="node-v2"><text class="sh" x="34" y="187">96:2</text><text class="cell" x="150" y="187">He created man from a clinging</text><text class="cell" x="150" y="204">clot</text><text class="cell" x="450" y="187">Learning begins with the wonder of</text><text class="cell" x="450" y="204">how life begins</text></g><g id="node-v3"><text class="sh" x="34" y="247">96:3</text><text class="cell" x="150" y="247">Read, and your Lord is the most</text><text class="cell" x="150" y="264">Generous</text><text class="cell" x="450" y="247">Reading is tied to gratitude,</text><text class="cell" x="450" y="264">not pride</text></g><g id="node-v4"><text class="sh" x="34" y="307">96:4</text><text class="cell" x="150" y="307">Who taught by the pen</text><text class="cell" x="450" y="307">The pen, and so writing, is an</text><text class="cell" x="450" y="324">instrument of teaching</text></g><g id="node-v5"><text class="sh" x="34" y="367">96:5</text><text class="cell" x="150" y="367">He taught humanity what they did</text><text class="cell" x="150" y="384">not know</text><text class="cell" x="450" y="367">Revelation itself is an act of</text><text class="cell" x="450" y="384">teaching</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Surah Al-Alaq, verses 1 to 5</text><text id="label-caption" class="small" x="24" y="438">The first word is a command to read, and the pen is named as an instrument of teaching.</text><text class="wm" x="768" y="462" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
