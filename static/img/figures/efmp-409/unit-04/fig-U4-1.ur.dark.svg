<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سورۃ العلق، آیات 1 تا 5 کا جدول</title><desc id="d">سورۃ العلق کی آیات 1 تا 5 کا جدول۔ ہر قطار میں آیت، اس کا سادہ مفہوم اور تعلیمی نکتہ درج ہے: اپنے رب کے نام سے پڑھیں؛ انسان کو جمے ہوئے خون سے پیدا کیا گیا؛ دوبارہ پڑھیں کہ آپ کا رب کریم ہے؛ اللہ نے قلم کے ذریعے سکھایا؛ اللہ نے انسان کو وہ سکھایا جو وہ نہیں جانتا تھا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="158" x2="756" y2="158"/><line class="frame" x1="24" y1="221" x2="756" y2="221"/><line class="frame" x1="24" y1="284" x2="756" y2="284"/><line class="frame" x1="24" y1="347" x2="756" y2="347"/><line class="frame" x1="24" y1="410" x2="756" y2="410"/><line class="frame" x1="646" y1="50" x2="646" y2="410"/><line class="frame" x1="356" y1="50" x2="356" y2="410"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">آیت</text><text class="h" x="636" y="78" text-anchor="end">سادہ الفاظ میں مفہوم</text><text class="h" x="346" y="78" text-anchor="end">تعلیمی نکتہ</text><g id="node-v1"><text class="sh" x="746" y="132" text-anchor="end">96:1</text><text class="cell" x="636" y="125" text-anchor="end">پڑھیں، اپنے رب کے نام سے</text><text class="cell" x="636" y="145" text-anchor="end">جس نے پیدا کیا</text><text class="cell" x="346" y="125" text-anchor="end">پہلی وحی کا سب سے پہلا لفظ</text><text class="cell" x="346" y="145" text-anchor="end">پڑھنے اور علم کا حکم ہے</text></g><g id="node-v2"><text class="sh" x="746" y="195" text-anchor="end">96:2</text><text class="cell" x="636" y="188" text-anchor="end">اس نے انسان کو جمے ہوئے</text><text class="cell" x="636" y="208" text-anchor="end">خون کے لوتھڑے سے پیدا کیا</text><text class="cell" x="346" y="188" text-anchor="end">سیکھنے کا آغاز تخلیق اور زندگی کی</text><text class="cell" x="346" y="208" text-anchor="end">ابتدا پر غور و فکر سے ہوتا ہے</text></g><g id="node-v3"><text class="sh" x="746" y="258" text-anchor="end">96:3</text><text class="cell" x="636" y="251" text-anchor="end">پڑھیں، اور آپ کا رب</text><text class="cell" x="636" y="271" text-anchor="end">سب سے زیادہ کریم ہے</text><text class="cell" x="346" y="251" text-anchor="end">مطالعہ اور علم شکر گزاری سے</text><text class="cell" x="346" y="271" text-anchor="end">جڑے ہیں، تکبر سے نہیں</text></g><g id="node-v4"><text class="sh" x="746" y="321" text-anchor="end">96:4</text><text class="cell" x="636" y="321" text-anchor="end">جس نے قلم کے ذریعے سکھایا</text><text class="cell" x="346" y="314" text-anchor="end">قلم اور تحریر تدریس اور علم کو</text><text class="cell" x="346" y="334" text-anchor="end">محفوظ رکھنے کا بنیادی ذریعہ ہیں</text></g><g id="node-v5"><text class="sh" x="746" y="384" text-anchor="end">96:5</text><text class="cell" x="636" y="377" text-anchor="end">اس نے انسان کو وہ سکھایا جو</text><text class="cell" x="636" y="397" text-anchor="end">وہ نہیں جانتا تھا</text><text class="cell" x="346" y="377" text-anchor="end">وحی اور تعلیم بذاتِ خود اللہ تعالیٰ</text><text class="cell" x="346" y="397" text-anchor="end">کا انسان پر احسان اور رہنمائی ہے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">سورۃ العلق، آیات 1 تا 5</text><text id="label-caption" class="small" x="756" y="438" text-anchor="end">پہلا لفظ پڑھنے کا حکم ہے، اور قلم کو تدریس اور فہم کا ذریعہ بتایا گیا ہے۔</text><text class="wm" x="24" y="462" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
