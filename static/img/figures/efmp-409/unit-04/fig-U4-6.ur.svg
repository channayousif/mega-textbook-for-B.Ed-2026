<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اصحابِ صفہ کے مضامین اور تدریسی طریقے</title><desc id="d">اصحابِ صفہ کے پانچ مضامین اور طریقوں کا جدول جن میں سے ہر ایک کے ساتھ موجودہ دور کے کمرۂ جماعت کی مثال دی گئی ہے: قرآن اور سنت، پڑھنا اور لکھنا، عربی زبان، حفظ اور زبانی تکرار، اور دوسروں کو سکھانا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="158" x2="756" y2="158"/><line class="frame" x1="24" y1="221" x2="756" y2="221"/><line class="frame" x1="24" y1="284" x2="756" y2="284"/><line class="frame" x1="24" y1="347" x2="756" y2="347"/><line class="frame" x1="24" y1="410" x2="756" y2="410"/><line class="frame" x1="560" y1="50" x2="560" y2="410"/><line class="frame" x1="300" y1="50" x2="300" y2="410"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">مضمون یا طریقہ</text><text class="h" x="550" y="78" text-anchor="end">اصحابِ صفہ میں طریقہ</text><text class="h" x="290" y="78" text-anchor="end">موجودہ دور کی مماثلت</text><g id="node-s1"><text class="sh" x="746" y="132" text-anchor="end">قرآن اور سنت</text><text class="cell" x="550" y="125" text-anchor="end">تلاوت، حفظ، فہم اور</text><text class="cell" x="550" y="145" text-anchor="end">عملی فہم حاصل کرنا</text><text class="cell" x="290" y="125" text-anchor="end">ایسا سبق جس میں متن کو اس کے</text><text class="cell" x="290" y="145" text-anchor="end">معانی و مفاہیم کے ساتھ پڑھایا جائے</text></g><g id="node-s2"><text class="sh" x="746" y="195" text-anchor="end">پڑھنا اور لکھنا</text><text class="cell" x="550" y="188" text-anchor="end">متعلمین نے خواندگی حاصل کی؛</text><text class="cell" x="550" y="208" text-anchor="end">تحریر کے ذریعے علم محفوظ ہوا</text><text class="cell" x="290" y="188" text-anchor="end">ایسا سبق جو طلبہ سے خود لکھنے</text><text class="cell" x="290" y="208" text-anchor="end">کا تقاضا کرے، محض نقل کرنا نہیں</text></g><g id="node-s3"><text class="sh" x="746" y="258" text-anchor="end">عربی زبان</text><text class="cell" x="550" y="251" text-anchor="end">بنیادی دینی و علمی ماخذ کی</text><text class="cell" x="550" y="271" text-anchor="end">زبان سکھائی گئی</text><text class="cell" x="290" y="251" text-anchor="end">زبان کی تدریس جو فہم،</text><text class="cell" x="290" y="271" text-anchor="end">بول چال اور مطالعے سے جڑی ہو</text></g><g id="node-s4"><text class="sh" x="746" y="314" text-anchor="end">زبانی تکرار اور</text><text class="sh" x="746" y="334" text-anchor="end">حفظ</text><text class="cell" x="550" y="314" text-anchor="end">سننا، دہرانا اور بلند آواز سے</text><text class="cell" x="550" y="334" text-anchor="end">یاد کرنا</text><text class="cell" x="290" y="314" text-anchor="end">اجتماعی بلند خوانی اور یادداشت</text><text class="cell" x="290" y="334" text-anchor="end">کی باقاعدہ مشقیں</text></g><g id="node-s5"><text class="sh" x="746" y="384" text-anchor="end">دوسروں کو سکھانا</text><text class="cell" x="550" y="377" text-anchor="end">متعلمین کو دیگر قبائل تک جا کر</text><text class="cell" x="550" y="397" text-anchor="end">سکھانے کی تربیت دی گئی</text><text class="cell" x="290" y="377" text-anchor="end">ہم جولی تدریس (پیئر ٹیچنگ) اور</text><text class="cell" x="290" y="397" text-anchor="end">جماعت میں مانیٹر کا نظام</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">اصحابِ صفہ کے مضامین اور تدریسی طریقے</text><text id="label-caption" class="small" x="756" y="430" text-anchor="end">نصاب نے دینی ماخذ، خواندگی اور روزمرہ زندگی کے فرائض کو یکجا کیا۔</text><text class="wm" x="24" y="452" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
