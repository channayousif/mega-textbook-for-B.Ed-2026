<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline from the first revelation to the Last Sermon</title><desc id="d">Timeline from left to right with five points: about 610 CE, the first revelation in the cave of Hira; 622 CE, the Hijrah to Medina and the Charter of Medina; about 622 CE, the founding of As-Suffa beside the Prophet's Mosque; 632 CE, the Last Sermon at Arafat; and 632 CE, the death of the Prophet Muhammad, peace be upon him.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.tick { stroke: var(--a4); stroke-width: 2; }
.dot { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2.5; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.st { font-size: 12px; fill: var(--ink); }
.dt { font-size: 12px; font-weight: 700; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="40" y1="200" x2="740" y2="200" marker-end="url(#arrow)"/><line id="edge-t1" class="tick" x1="80" y1="200" x2="80" y2="176"/><line id="edge-t2" class="tick" x1="240" y1="200" x2="240" y2="224"/><line id="edge-t3" class="tick" x1="400" y1="200" x2="400" y2="176"/><line id="edge-t4" class="tick" x1="560" y1="200" x2="560" y2="224"/><line id="edge-t5" class="tick" x1="720" y1="200" x2="720" y2="176"/></g><g id="layer-nodes"><circle id="node-p1" class="dot" cx="80" cy="200" r="9"/><circle id="node-p2" class="dot" cx="240" cy="200" r="9"/><circle id="node-p3" class="dot" cx="400" cy="200" r="9"/><circle id="node-p4" class="dot" cx="560" cy="200" r="9"/><circle id="node-p5" class="dot" cx="720" cy="200" r="9"/><text class="dt" x="45" y="140">c. 610 CE</text><text class="st" x="45" y="156">The first revelation</text><text class="st" x="45" y="172">in the cave of Hira</text><text class="dt" x="240" y="238" text-anchor="middle">622 CE</text><text class="st" x="240" y="254" text-anchor="middle">The Hijrah to Medina</text><text class="st" x="240" y="270" text-anchor="middle">and the Charter of Medina</text><text class="dt" x="400" y="140" text-anchor="middle">c. 622 CE</text><text class="st" x="400" y="156" text-anchor="middle">As-Suffa is founded</text><text class="st" x="400" y="172" text-anchor="middle">beside the Prophet's Mosque</text><text class="dt" x="560" y="238" text-anchor="middle">632 CE</text><text class="st" x="560" y="254" text-anchor="middle">The Last Sermon</text><text class="st" x="560" y="270" text-anchor="middle">at Arafat</text><text class="dt" x="735" y="140" text-anchor="end">632 CE</text><text class="st" x="735" y="156" text-anchor="end">The death of the Prophet</text><text class="st" x="735" y="172" text-anchor="end">Muhammad, peace be upon him</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="30">From the first revelation to the Last Sermon</text><text id="label-caption" class="small" x="24" y="330">From the first revelation to the Last Sermon, the sources and the community grow.</text><text class="wm" x="768" y="362" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
