<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ بنیادی اصول اور ان کی تعلیمی قدر</title><desc id="d">میثاقِ مدینہ اور خطبۂ وداع کے چھ اصولوں کا جدول۔ ہر قطار میں اصول، اس کا ماخذ اور اس کی تعلیمی قدر دی گئی ہے: قانون کی نظر میں برابری؛ ضمیر کی آزادی؛ جان و مال کی حرمت؛ امانتوں کی واپسی اور احتساب؛ حقوق و فرائض کا توازن؛ اور مشترکہ ماخذِ رہنمائی سے وابستگی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="420" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="157" x2="756" y2="157"/><line class="frame" x1="24" y1="219" x2="756" y2="219"/><line class="frame" x1="24" y1="281" x2="756" y2="281"/><line class="frame" x1="24" y1="343" x2="756" y2="343"/><line class="frame" x1="24" y1="405" x2="756" y2="405"/><line class="frame" x1="24" y1="470" x2="756" y2="470"/><line class="frame" x1="586" y1="50" x2="586" y2="470"/><line class="frame" x1="406" y1="50" x2="406" y2="470"/></g><g id="layer-nodes"><text class="h" x="746" y="78" text-anchor="end">اصول</text><text class="h" x="576" y="78" text-anchor="end">کہاں مذکور ہے</text><text class="h" x="396" y="78" text-anchor="end">تعلیمی قدر</text><g id="node-p1"><text class="sh" x="746" y="125" text-anchor="end">قانون کی نظر میں برابری</text><text class="cell" x="576" y="120" text-anchor="end">میثاقِ مدینہ اور</text><text class="cell" x="576" y="138" text-anchor="end">خطبۂ وداع</text><text class="cell" x="396" y="120" text-anchor="end">خاندانی پس منظر پر کوئی رعایت نہیں</text><text class="cell" x="396" y="138" text-anchor="end">اور محلے کی بنیاد پر سزا نہیں</text></g><g id="node-p2"><text class="sh" x="746" y="185" text-anchor="end">ضمیر اور عقیدے</text><text class="sh" x="746" y="203" text-anchor="end">کی آزادی</text><text class="cell" x="576" y="194" text-anchor="end">میثاقِ مدینہ</text><text class="cell" x="396" y="185" text-anchor="end">کسی طالب علم کا اس کی زبان، عقیدے</text><text class="cell" x="396" y="203" text-anchor="end">یا لباس کی وجہ سے مذاق نہیں اڑایا جائے گا</text></g><g id="node-p3"><text class="sh" x="746" y="247" text-anchor="end">جان و مال کی حرمت</text><text class="cell" x="576" y="256" text-anchor="end">خطبۂ وداع</text><text class="cell" x="396" y="247" text-anchor="end">کمرۂ جماعت ایک محفوظ جگہ ہے؛</text><text class="cell" x="396" y="265" text-anchor="end">مستعار لی گئی اشیاء واپس کی جائیں گی</text></g><g id="node-p4"><text class="sh" x="746" y="318" text-anchor="end">امانتوں کی واپسی</text><text class="cell" x="576" y="318" text-anchor="end">خطبۂ وداع</text><text class="cell" x="396" y="309" text-anchor="end">مانیٹر اور لائبریری کے نگران اپنے</text><text class="cell" x="396" y="327" text-anchor="end">پاس رکھی چیزوں کے جوابدہ ہیں</text></g><g id="node-p5"><text class="sh" x="746" y="380" text-anchor="end">حقوق و فرائض میں توازن</text><text class="cell" x="576" y="380" text-anchor="end">خطبۂ وداع</text><text class="cell" x="396" y="371" text-anchor="end">ہر طالب علم کو اظہار کا حق حاصل ہے،</text><text class="cell" x="396" y="389" text-anchor="end">اور ہر آواز کا ایک دائرۂ کار ہے</text></g><g id="node-p6"><text class="sh" x="746" y="435" text-anchor="end">مشترکہ رہنمائی سے</text><text class="sh" x="746" y="453" text-anchor="end">وابستگی</text><text class="cell" x="576" y="444" text-anchor="end">خطبۂ وداع</text><text class="cell" x="396" y="435" text-anchor="end">پوری جماعت اپنے ضابطۂ اخلاق پر متفق</text><text class="cell" x="396" y="453" text-anchor="end">ہوتی ہے اور تنازع پر اسی کی طرف لوٹتی ہے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">چھ بنیادی اصول اور ان کی تعلیمی قدر</text><text id="label-caption" class="small" x="756" y="498" text-anchor="end">ہر اصول کو کمرۂ جماعت کے باقاعدہ ضابطے یا عادت میں ڈھالا جا سکتا ہے۔</text><text class="wm" x="24" y="522" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
