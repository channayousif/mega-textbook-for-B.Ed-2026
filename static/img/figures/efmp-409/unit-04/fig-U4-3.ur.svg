<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پہلی وحی سے خطبۂ وداع تک کا زمانی تسلسل</title><desc id="d">پہلی وحی سے خطبۂ وداع تک کا زمانی خط (ٹائم لائن): تقریباً 610ء، غارِ حرا میں پہلی وحی؛ 622ء، مدینہ کی طرف ہجرت اور میثاقِ مدینہ؛ تقریباً 622ء، مسجدِ نبوی کے پہلو میں اصحابِ صفہ کا قیام؛ 632ء، میدانِ عرفات میں خطبۂ وداع؛ اور 632ء، نبی کریم ﷺ کا وصالِ مبارک۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.tick { stroke: var(--a4); stroke-width: 2; }
.dot { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2.5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.st { font-size: 12px; fill: var(--ink); }
.dt { font-size: 12px; font-weight: 700; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="740" y1="200" x2="40" y2="200" marker-end="url(#arrow)"/><line id="edge-t1" class="tick" x1="700" y1="200" x2="700" y2="176"/><line id="edge-t2" class="tick" x1="550" y1="200" x2="550" y2="224"/><line id="edge-t3" class="tick" x1="390" y1="200" x2="390" y2="176"/><line id="edge-t4" class="tick" x1="230" y1="200" x2="230" y2="224"/><line id="edge-t5" class="tick" x1="80" y1="200" x2="80" y2="176"/></g><g id="layer-nodes"><circle id="node-p1" class="dot" cx="700" cy="200" r="9"/><circle id="node-p2" class="dot" cx="550" cy="200" r="9"/><circle id="node-p3" class="dot" cx="390" cy="200" r="9"/><circle id="node-p4" class="dot" cx="230" cy="200" r="9"/><circle id="node-p5" class="dot" cx="80" cy="200" r="9"/><text class="dt" x="700" y="140" text-anchor="middle">تقریباً 610ء</text><text class="st" x="700" y="156" text-anchor="middle">غارِ حرا میں</text><text class="st" x="700" y="172" text-anchor="middle">پہلی وحی</text><text class="dt" x="550" y="238" text-anchor="middle">622ء</text><text class="st" x="550" y="254" text-anchor="middle">مدینہ کی طرف ہجرت</text><text class="st" x="550" y="270" text-anchor="middle">اور میثاقِ مدینہ</text><text class="dt" x="390" y="140" text-anchor="middle">تقریباً 622ء</text><text class="st" x="390" y="156" text-anchor="middle">مسجدِ نبوی کے ساتھ</text><text class="st" x="390" y="172" text-anchor="middle">اصحابِ صفہ کا قیام</text><text class="dt" x="230" y="238" text-anchor="middle">632ء</text><text class="st" x="230" y="254" text-anchor="middle">میدانِ عرفات میں</text><text class="st" x="230" y="270" text-anchor="middle">خطبۂ وداع</text><text class="dt" x="80" y="140" text-anchor="middle">632ء</text><text class="st" x="80" y="156" text-anchor="middle">نبی کریم ﷺ کا</text><text class="st" x="80" y="172" text-anchor="middle">وصالِ مبارک</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="30" text-anchor="end">پہلی وحی سے خطبۂ وداع تک کا زمانی تسلسل</text><text id="label-caption" class="small" x="756" y="330" text-anchor="end">پہلی وحی سے خطبۂ وداع تک اسلامی ذرائع اور تعلیمی برادری کا ارتقا۔</text><text class="wm" x="24" y="362" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
