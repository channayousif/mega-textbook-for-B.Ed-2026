<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six principles and their educational value</title><desc id="d">Table of six principles from the Charter of Medina and the Last Sermon. Each row gives the principle, where it appears, and its educational value: equality before the law; freedom of conscience; sanctity of life and property; returning trusts and accountability; rights and duties towards others; and holding to a shared source of guidance.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"><rect class="panel" x="24" y="50" width="732" height="420" rx="8"/><rect class="panel-a" x="24" y="50" width="732" height="45" rx="8"/></g><g id="layer-edges"><line class="frame" x1="24" y1="95" x2="756" y2="95"/><line class="frame" x1="24" y1="155" x2="756" y2="155"/><line class="frame" x1="24" y1="215" x2="756" y2="215"/><line class="frame" x1="24" y1="275" x2="756" y2="275"/><line class="frame" x1="24" y1="335" x2="756" y2="335"/><line class="frame" x1="24" y1="395" x2="756" y2="395"/><line class="frame" x1="24" y1="455" x2="756" y2="455"/><line class="frame" x1="214" y1="50" x2="214" y2="470"/><line class="frame" x1="410" y1="50" x2="410" y2="470"/></g><g id="layer-nodes"><text class="h" x="34" y="78">Principle</text><text class="h" x="224" y="78">Where it appears</text><text class="h" x="420" y="78">Educational value</text><g id="node-p1"><text class="sh" x="34" y="127">Equality before</text><text class="sh" x="34" y="144">the law</text><text class="cell" x="224" y="127">Charter of Medina and</text><text class="cell" x="224" y="144">the Last Sermon</text><text class="cell" x="420" y="127">No pupil is favoured for family</text><text class="cell" x="420" y="144">or punished for neighbourhood</text></g><g id="node-p2"><text class="sh" x="34" y="187">Freedom of</text><text class="sh" x="34" y="204">conscience</text><text class="cell" x="224" y="187">Charter of Medina</text><text class="cell" x="420" y="187">No pupil is mocked for their</text><text class="cell" x="420" y="204">language, faith or dress</text></g><g id="node-p3"><text class="sh" x="34" y="247">Sanctity of life</text><text class="sh" x="34" y="264">and property</text><text class="cell" x="224" y="247">Last Sermon</text><text class="cell" x="420" y="247">The classroom is safe; borrowed</text><text class="cell" x="420" y="264">things are returned</text></g><g id="node-p4"><text class="sh" x="34" y="307">Returning trusts</text><text class="cell" x="224" y="307">Last Sermon</text><text class="cell" x="420" y="307">The monitor and the librarian</text><text class="cell" x="420" y="324">answer for what is in their care</text></g><g id="node-p5"><text class="sh" x="34" y="367">Rights and duties</text><text class="cell" x="224" y="367">Last Sermon</text><text class="cell" x="420" y="367">Every pupil has a voice, and</text><text class="cell" x="420" y="384">every voice has a limit</text></g><g id="node-p6"><text class="sh" x="34" y="427">Holding to a</text><text class="sh" x="34" y="444">shared source</text><text class="cell" x="224" y="427">Last Sermon</text><text class="cell" x="420" y="427">The class agrees on its charter</text><text class="cell" x="420" y="444">and returns to it</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Six principles and their educational value</text><text id="label-caption" class="small" x="24" y="498">Each principle can become a classroom rule or a classroom habit.</text><text class="wm" x="768" y="522" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
