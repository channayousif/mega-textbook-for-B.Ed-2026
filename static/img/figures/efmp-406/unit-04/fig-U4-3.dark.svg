<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 760" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Use or share? Check before acting</title><desc id="d">Before using or sharing a resource, check ownership, permission, credit, accuracy, privacy and audience, stopping when a necessary check is unresolved.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--line);stroke-width:2} .accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .wm{font-size:11px;fill:var(--wm)} .link{stroke:var(--ink);stroke-width:2;fill:none} .ah{fill:var(--ink)} .grid{stroke:var(--line);stroke-width:1;fill:none} </style><rect class="bg" width="780" height="760"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="24" y="32" class="h" text-anchor="start"><tspan x="24" dy="0">Use or share? Check before acting</tspan></text><text x="24" y="66" class="small" text-anchor="start"><tspan x="24" dy="0">Before use or sharing, work through every check.</tspan></text><rect x="24" y="94" width="420" height="68" rx="5" class="accent"/><text x="40" y="120" class="h" text-anchor="start"><tspan x="40" dy="0">1. Creator</tspan></text><text x="40" y="146" class="body" text-anchor="start"><tspan x="40" dy="0">Who made this work?</tspan></text><path d="M234 162 V181" class="link" marker-end="url(#arrow)"/><rect x="24" y="185" width="420" height="68" rx="5" class="accent"/><text x="40" y="211" class="h" text-anchor="start"><tspan x="40" dy="0">2. Permission</tspan></text><text x="40" y="237" class="body" text-anchor="start"><tspan x="40" dy="0">May we use it this way?</tspan></text><path d="M234 253 V272" class="link" marker-end="url(#arrow)"/><rect x="24" y="276" width="420" height="68" rx="5" class="accent"/><text x="40" y="302" class="h" text-anchor="start"><tspan x="40" dy="0">3. Credit</tspan></text><text x="40" y="328" class="body" text-anchor="start"><tspan x="40" dy="0">Can readers trace the source?</tspan></text><path d="M234 344 V363" class="link" marker-end="url(#arrow)"/><rect x="24" y="367" width="420" height="68" rx="5" class="accent"/><text x="40" y="393" class="h" text-anchor="start"><tspan x="40" dy="0">4. Accuracy</tspan></text><text x="40" y="419" class="body" text-anchor="start"><tspan x="40" dy="0">Is the claim supported?</tspan></text><path d="M234 435 V454" class="link" marker-end="url(#arrow)"/><rect x="24" y="458" width="420" height="68" rx="5" class="accent"/><text x="40" y="484" class="h" text-anchor="start"><tspan x="40" dy="0">5. Privacy</tspan></text><text x="40" y="510" class="body" text-anchor="start"><tspan x="40" dy="0">Does it expose personal details?</tspan></text><path d="M234 526 V545" class="link" marker-end="url(#arrow)"/><rect x="24" y="549" width="420" height="68" rx="5" class="accent"/><text x="40" y="575" class="h" text-anchor="start"><tspan x="40" dy="0">6. Audience</tspan></text><text x="40" y="601" class="body" text-anchor="start"><tspan x="40" dy="0">Is sharing appropriate and fair?</tspan></text><rect x="510" y="170" width="244" height="162" rx="5" class="panel"/><text x="526" y="202" class="h" text-anchor="start"><tspan x="526" dy="0">Unresolved?</tspan><tspan x="526" dy="24">Stop this use.</tspan></text><text x="526" y="263" class="body" text-anchor="start"><tspan x="526" dy="0">Seek help, replace,</tspan><tspan x="526" dy="24">or narrow the use.</tspan></text><path d="M444 218 H506" class="link" marker-end="url(#arrow)"/><text x="475" y="155" class="small" text-anchor="start"><tspan x="475" dy="0">At any check</tspan></text><rect x="24" y="658" width="420" height="62" rx="5" class="panel"/><text x="40" y="685" class="body" text-anchor="start"><tspan x="40" dy="0">All necessary checks resolved?</tspan><tspan x="40" dy="24">Use with the chosen audience.</tspan></text><path d="M234 617 V654" class="link" marker-end="url(#arrow)"/><text x="766" y="746" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
