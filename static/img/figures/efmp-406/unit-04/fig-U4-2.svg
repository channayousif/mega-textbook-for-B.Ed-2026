<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 472" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Digital writing is a revision cycle</title><desc id="d">A digital writing cycle connects planning, drafting, linking, sharing with a chosen audience, receiving comments and revising.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--line);stroke-width:2} .accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .wm{font-size:11px;fill:var(--wm)} .link{stroke:var(--ink);stroke-width:2;fill:none} .ah{fill:var(--ink)} .grid{stroke:var(--line);stroke-width:1;fill:none} </style><rect class="bg" width="780" height="472"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="24" y="32" class="h" text-anchor="start"><tspan x="24" dy="0">Digital writing is a revision cycle</tspan></text><text x="24" y="63" class="small" text-anchor="start"><tspan x="24" dy="0">Use a chosen classroom audience, not compulsory public posting.</tspan></text><rect x="30" y="98" width="200" height="88" rx="5" class="accent"/><text x="44" y="129" class="h" text-anchor="start"><tspan x="44" dy="0">1. Plan</tspan></text><text x="44" y="162" class="body" text-anchor="start"><tspan x="44" dy="0">Reader and purpose</tspan></text><rect x="290" y="98" width="200" height="88" rx="5" class="accent"/><text x="304" y="129" class="h" text-anchor="start"><tspan x="304" dy="0">2. Draft</tspan></text><text x="304" y="162" class="body" text-anchor="start"><tspan x="304" dy="0">Essential information</tspan></text><rect x="550" y="98" width="200" height="88" rx="5" class="accent"/><text x="564" y="129" class="h" text-anchor="start"><tspan x="564" dy="0">3. Link</tspan></text><text x="564" y="162" class="body" text-anchor="start"><tspan x="564" dy="0">Relevant source</tspan></text><rect x="550" y="248" width="200" height="88" rx="5" class="accent"/><text x="564" y="279" class="h" text-anchor="start"><tspan x="564" dy="0">4. Share</tspan></text><text x="564" y="312" class="body" text-anchor="start"><tspan x="564" dy="0">Chosen reader</tspan></text><rect x="290" y="248" width="200" height="88" rx="5" class="accent"/><text x="304" y="279" class="h" text-anchor="start"><tspan x="304" dy="0">5. Comments</tspan></text><text x="304" y="312" class="body" text-anchor="start"><tspan x="304" dy="0">A specific problem</tspan></text><rect x="30" y="248" width="200" height="88" rx="5" class="accent"/><text x="44" y="279" class="h" text-anchor="start"><tspan x="44" dy="0">6. Revise</tspan></text><text x="44" y="312" class="body" text-anchor="start"><tspan x="44" dy="0">Explain the change</tspan></text><path d="M230 142 H286" class="link" marker-end="url(#arrow)"/><path d="M490 142 H546" class="link" marker-end="url(#arrow)"/><path d="M650 186 V244" class="link" marker-end="url(#arrow)"/><path d="M550 292 H494" class="link" marker-end="url(#arrow)"/><path d="M290 292 H234" class="link" marker-end="url(#arrow)"/><path d="M130 248 V210 H390 V190" class="link" marker-end="url(#arrow)"/><text x="24" y="388" class="body" text-anchor="start"><tspan x="24" dy="0">Return to the draft after feedback.</tspan><tspan x="24" dy="24">A paper exchange can preserve the same thinking.</tspan></text><text x="766" y="458" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
