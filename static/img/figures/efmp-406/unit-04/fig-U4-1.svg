<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 554" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Reading: choose for the goal</title><desc id="d">Paper and screen reading compared through comprehension, attention, navigation and the support a teacher can provide.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--line);stroke-width:2} .accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .wm{font-size:11px;fill:var(--wm)} .link{stroke:var(--ink);stroke-width:2;fill:none} .ah{fill:var(--ink)} .grid{stroke:var(--line);stroke-width:1;fill:none} </style><rect class="bg" width="780" height="554"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="24" y="32" class="h" text-anchor="start"><tspan x="24" dy="0">Reading: choose for the goal</tspan></text><rect x="24" y="58" width="156" height="50" rx="5" class="accent"/><text x="34" y="89" class="body" text-anchor="start"><tspan x="34" dy="0">Focus</tspan></text><rect x="180" y="58" width="186" height="50" rx="5" class="accent"/><text x="190" y="89" class="body" text-anchor="start"><tspan x="190" dy="0">Paper</tspan></text><rect x="366" y="58" width="186" height="50" rx="5" class="accent"/><text x="376" y="89" class="body" text-anchor="start"><tspan x="376" dy="0">Screen</tspan></text><rect x="552" y="58" width="204" height="50" rx="5" class="accent"/><text x="562" y="89" class="body" text-anchor="start"><tspan x="562" dy="0">Teacher support</tspan></text><rect x="24" y="108" width="156" height="84" rx="5" class="panel"/><text x="34" y="138" class="body" text-anchor="start"><tspan x="34" dy="0">Comprehension</tspan></text><rect x="180" y="108" width="186" height="84" rx="5" class="panel"/><text x="190" y="138" class="body" text-anchor="start"><tspan x="190" dy="0">Can support</tspan><tspan x="190" dy="24">story understanding</tspan></text><rect x="366" y="108" width="186" height="84" rx="5" class="panel"/><text x="376" y="138" class="body" text-anchor="start"><tspan x="376" dy="0">Design and adult</tspan><tspan x="376" dy="24">support matter</tspan></text><rect x="552" y="108" width="204" height="84" rx="5" class="panel"/><text x="562" y="138" class="body" text-anchor="start"><tspan x="562" dy="0">Ask for reasons</tspan><tspan x="562" dy="24">and story evidence</tspan></text><rect x="24" y="192" width="156" height="84" rx="5" class="panel"/><text x="34" y="222" class="body" text-anchor="start"><tspan x="34" dy="0">Attention</tspan></text><rect x="180" y="192" width="186" height="84" rx="5" class="panel"/><text x="190" y="222" class="body" text-anchor="start"><tspan x="190" dy="0">No embedded</tspan><tspan x="190" dy="24">links or games</tspan></text><rect x="366" y="192" width="186" height="84" rx="5" class="panel"/><text x="376" y="222" class="body" text-anchor="start"><tspan x="376" dy="0">Extra features</tspan><tspan x="376" dy="24">may distract</tspan></text><rect x="552" y="192" width="204" height="84" rx="5" class="panel"/><text x="562" y="222" class="body" text-anchor="start"><tspan x="562" dy="0">Remove unrelated</tspan><tspan x="562" dy="24">features</tspan></text><rect x="24" y="276" width="156" height="84" rx="5" class="panel"/><text x="34" y="306" class="body" text-anchor="start"><tspan x="34" dy="0">Navigation</tspan></text><rect x="180" y="276" width="186" height="84" rx="5" class="panel"/><text x="190" y="306" class="body" text-anchor="start"><tspan x="190" dy="0">Pages and</tspan><tspan x="190" dy="24">physical position</tspan></text><rect x="366" y="276" width="186" height="84" rx="5" class="panel"/><text x="376" y="306" class="body" text-anchor="start"><tspan x="376" dy="0">Headings, links</tspan><tspan x="376" dy="24">and back button</tspan></text><rect x="552" y="276" width="204" height="84" rx="5" class="panel"/><text x="562" y="306" class="body" text-anchor="start"><tspan x="562" dy="0">Model returning</tspan><tspan x="562" dy="24">to the source</tspan></text><rect x="24" y="360" width="156" height="84" rx="5" class="panel"/><text x="34" y="390" class="body" text-anchor="start"><tspan x="34" dy="0">Access</tspan></text><rect x="180" y="360" width="186" height="84" rx="5" class="panel"/><text x="190" y="390" class="body" text-anchor="start"><tspan x="190" dy="0">Needs a readable</tspan><tspan x="190" dy="24">copy or reader</tspan></text><rect x="366" y="360" width="186" height="84" rx="5" class="panel"/><text x="376" y="390" class="body" text-anchor="start"><tspan x="376" dy="0">Needs usable text</tspan><tspan x="376" dy="24">and device access</tspan></text><rect x="552" y="360" width="204" height="84" rx="5" class="panel"/><text x="562" y="390" class="body" text-anchor="start"><tspan x="562" dy="0">Keep an equivalent</tspan><tspan x="562" dy="24">paper route</tspan></text><text x="24" y="478" class="small" text-anchor="start"><tspan x="24" dy="0">Evidence varies by learners, design and support.</tspan><tspan x="24" dy="24">Preference alone does not demonstrate comprehension.</tspan></text><text x="766" y="540" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
