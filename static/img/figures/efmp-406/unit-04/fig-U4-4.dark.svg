<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 574" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Responsible conduct is a set of actions</title><desc id="d">Responsible online conduct links checking, respectful feedback, permission, credit, privacy and fair participation to classroom actions.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--line);stroke-width:2} .accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{fill:var(--ink)} .h{font-size:18px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .wm{font-size:11px;fill:var(--wm)} .link{stroke:var(--ink);stroke-width:2;fill:none} .ah{fill:var(--ink)} .grid{stroke:var(--line);stroke-width:1;fill:none} </style><rect class="bg" width="780" height="574"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text x="24" y="32" class="h" text-anchor="start"><tspan x="24" dy="0">Responsible conduct is a set of actions</tspan></text><rect x="24" y="58" width="186" height="48" rx="5" class="accent"/><text x="36" y="88" class="h" text-anchor="start"><tspan x="36" dy="0">Rule</tspan></text><rect x="210" y="58" width="234" height="48" rx="5" class="accent"/><text x="222" y="88" class="h" text-anchor="start"><tspan x="222" dy="0">Why it matters</tspan></text><rect x="444" y="58" width="312" height="48" rx="5" class="accent"/><text x="456" y="88" class="h" text-anchor="start"><tspan x="456" dy="0">Classroom action</tspan></text><rect x="24" y="106" width="186" height="84" rx="5" class="panel"/><text x="36" y="137" class="body" text-anchor="start"><tspan x="36" dy="0">Check a claim</tspan></text><rect x="210" y="106" width="234" height="84" rx="5" class="panel"/><text x="222" y="137" class="body" text-anchor="start"><tspan x="222" dy="0">Popularity is not</tspan><tspan x="222" dy="24">proof of accuracy.</tspan></text><rect x="444" y="106" width="312" height="84" rx="5" class="panel"/><text x="456" y="137" class="body" text-anchor="start"><tspan x="456" dy="0">Find the current source</tspan><tspan x="456" dy="24">before forwarding.</tspan></text><rect x="24" y="190" width="186" height="84" rx="5" class="panel"/><text x="36" y="221" class="body" text-anchor="start"><tspan x="36" dy="0">Give useful</tspan><tspan x="36" dy="24">feedback</tspan></text><rect x="210" y="190" width="234" height="84" rx="5" class="panel"/><text x="222" y="221" class="body" text-anchor="start"><tspan x="222" dy="0">A writer needs a</tspan><tspan x="222" dy="24">specific problem.</tspan></text><rect x="444" y="190" width="312" height="84" rx="5" class="panel"/><text x="456" y="221" class="body" text-anchor="start"><tspan x="456" dy="0">Name the missing date</tspan><tspan x="456" dy="24">and ask for clarification.</tspan></text><rect x="24" y="274" width="186" height="84" rx="5" class="panel"/><text x="36" y="305" class="body" text-anchor="start"><tspan x="36" dy="0">Check permission</tspan><tspan x="36" dy="24">and give credit</tspan></text><rect x="210" y="274" width="234" height="84" rx="5" class="panel"/><text x="222" y="305" class="body" text-anchor="start"><tspan x="222" dy="0">Acknowledgment is</tspan><tspan x="222" dy="24">not blanket permission.</tspan></text><rect x="444" y="274" width="312" height="84" rx="5" class="panel"/><text x="456" y="305" class="body" text-anchor="start"><tspan x="456" dy="0">Read terms and retain</tspan><tspan x="456" dy="24">creator, source and licence.</tspan></text><rect x="24" y="358" width="186" height="84" rx="5" class="panel"/><text x="36" y="389" class="body" text-anchor="start"><tspan x="36" dy="0">Protect privacy</tspan></text><rect x="210" y="358" width="234" height="84" rx="5" class="panel"/><text x="222" y="389" class="body" text-anchor="start"><tspan x="222" dy="0">A file may reveal</tspan><tspan x="222" dy="24">personal information.</tspan></text><rect x="444" y="358" width="312" height="84" rx="5" class="panel"/><text x="456" y="389" class="body" text-anchor="start"><tspan x="456" dy="0">Use a fictional example</tspan><tspan x="456" dy="24">instead of pupil details.</tspan></text><rect x="24" y="442" width="186" height="84" rx="5" class="panel"/><text x="36" y="473" class="body" text-anchor="start"><tspan x="36" dy="0">Include everyone</tspan></text><rect x="210" y="442" width="234" height="84" rx="5" class="panel"/><text x="222" y="473" class="body" text-anchor="start"><tspan x="222" dy="0">Home data access</tspan><tspan x="222" dy="24">cannot be assumed.</tspan></text><rect x="444" y="442" width="312" height="84" rx="5" class="panel"/><text x="456" y="473" class="body" text-anchor="start"><tspan x="456" dy="0">Provide the essential text</tspan><tspan x="456" dy="24">and a paper route in class.</tspan></text><text x="766" y="560" class="wm" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
