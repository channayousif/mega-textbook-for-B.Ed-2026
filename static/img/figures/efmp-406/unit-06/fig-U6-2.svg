<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">Overlapping barriers to equitable access</title><desc id="d">Barriers to access connect to several learner groups, with overlapping links showing that learners may face more than one barrier and need different support.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="620" rx="6" class="bg"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">One learner can face several barriers</tspan></text><text x="24" y="65" class="h" text-anchor="start"><tspan x="24" dy="0">Barriers</tspan></text><text x="518" y="65" class="h" text-anchor="start"><tspan x="518" dy="0">Possible affected groups</tspan></text><path d="M286,133 L494,133" class="line dash" marker-end="url(#arrow)"/><path d="M286,133 L494,361" class="line dash" marker-end="url(#arrow)"/><path d="M286,247 L494,133" class="line dash" marker-end="url(#arrow)"/><path d="M286,247 L494,247" class="line dash" marker-end="url(#arrow)"/><path d="M286,247 L494,361" class="line dash" marker-end="url(#arrow)"/><path d="M286,361 L494,247" class="line dash" marker-end="url(#arrow)"/><path d="M286,361 L494,361" class="line dash" marker-end="url(#arrow)"/><path d="M286,475 L494,133" class="line dash" marker-end="url(#arrow)"/><path d="M286,475 L494,475" class="line dash" marker-end="url(#arrow)"/><rect x="24" y="94" width="262" height="78" rx="6" class="panel"/><text x="38" y="123" class="" text-anchor="start"><tspan x="38" dy="0">Cost</tspan></text><rect x="494" y="94" width="262" height="78" rx="6" class="accent"/><text x="508" y="123" class="" text-anchor="start"><tspan x="508" dy="0">Girls</tspan></text><rect x="24" y="208" width="262" height="78" rx="6" class="panel"/><text x="38" y="237" class="" text-anchor="start"><tspan x="38" dy="0">Unsafe or distant</tspan><tspan x="38" dy="23">routes</tspan></text><rect x="494" y="208" width="262" height="78" rx="6" class="accent"/><text x="508" y="237" class="" text-anchor="start"><tspan x="508" dy="0">Children with disabilities</tspan></text><rect x="24" y="322" width="262" height="78" rx="6" class="panel"/><text x="38" y="351" class="" text-anchor="start"><tspan x="38" dy="0">Inaccessible</tspan><tspan x="38" dy="23">materials</tspan></text><rect x="494" y="322" width="262" height="78" rx="6" class="accent"/><text x="508" y="351" class="" text-anchor="start"><tspan x="508" dy="0">Rural children</tspan></text><rect x="24" y="436" width="262" height="78" rx="6" class="panel"/><text x="38" y="465" class="" text-anchor="start"><tspan x="38" dy="0">Unfamiliar instructional</tspan><tspan x="38" dy="23">language</tspan></text><rect x="494" y="436" width="262" height="78" rx="6" class="accent"/><text x="508" y="465" class="" text-anchor="start"><tspan x="508" dy="0">Minority-language</tspan><tspan x="508" dy="23">speakers</tspan></text><text x="24" y="552" class="small" text-anchor="start"><tspan x="24" dy="0">Links show possible overlaps, not fixed traits or lower ability.</tspan><tspan x="24" dy="23">Ask which barrier is present before choosing support.</tspan></text><text class="wm" x="768" y="608" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
