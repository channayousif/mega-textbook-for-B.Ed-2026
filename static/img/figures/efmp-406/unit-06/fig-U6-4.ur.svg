<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایف ای اے، SDG اور پاکستانی پالیسی ٹائم لائن</title><desc id="d">ایف ای اے کی 2000 کی تجدید اور 2015 کا افق 2015 سے 2030 تک کے SDG دور سے پہلے ہیں، پاکستان کا 2018 پالیسی فریم ورک کسی وعدے کے طور پر نشان زد ہے، کسی کامیابی کے شواہد کے طور پر نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="550" rx="6" class="bg" transform="translate(780 0) scale(-1 1)"/><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">وعدے اور افق حاصل شدہ نتائج نہیں ہیں</tspan></text><path d="M65,252 L715,252" class="line" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M65,241 L65,263" class="line" transform="translate(780 0) scale(-1 1)"/><text x="715" y="290" class="h" text-anchor="middle"><tspan x="715" dy="0">2000</tspan></text><path d="M282,241 L282,263" class="line" transform="translate(780 0) scale(-1 1)"/><text x="498" y="290" class="h" text-anchor="middle"><tspan x="498" dy="0">2015</tspan></text><path d="M499,241 L499,263" class="line" transform="translate(780 0) scale(-1 1)"/><text x="281" y="290" class="h" text-anchor="middle"><tspan x="281" dy="0">2018</tspan></text><path d="M715,241 L715,263" class="line" transform="translate(780 0) scale(-1 1)"/><text x="65" y="290" class="h" text-anchor="middle"><tspan x="65" dy="0">2030</tspan></text><rect x="24" y="76" width="226" height="133" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="740" y="106" class="h" text-anchor="end"><tspan x="740" dy="0">ڈاکر میں ایف ای اے</tspan><tspan x="740" dy="23">کی تجدید</tspan></text><text x="740" y="161" class="" text-anchor="end"><tspan x="740" dy="0">وعدہ تجدید ہوا</tspan><tspan x="740" dy="23">ہدف افق: 2015</tspan></text><path d="M65,209 L65,241" class="line" transform="translate(780 0) scale(-1 1)"/><rect x="274" y="76" width="226" height="133" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="490" y="106" class="h" text-anchor="end"><tspan x="490" dy="0">SDG اپنائے گئے</tspan></text><text x="490" y="138" class="" text-anchor="end"><tspan x="490" dy="0">تعلیم اور خواندگی</tspan><tspan x="490" dy="23">ہدف افق: 2030</tspan></text><path d="M282,209 L282,241" class="line" transform="translate(780 0) scale(-1 1)"/><path d="M499,263 L499,326" class="line" transform="translate(780 0) scale(-1 1)"/><rect x="350" y="326" width="330" height="99" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="414" y="357" class="h" text-anchor="end"><tspan x="414" dy="0">پاکستانی پالیسی فریم ورک</tspan></text><text x="414" y="389" class="" text-anchor="end"><tspan x="414" dy="0">2018 قومی سنگ میل</tspan></text><text x="756" y="470" class="small" text-anchor="end"><tspan x="756" dy="0">ایف ای اے: 2000 تجدید → 2015 افق۔ SDG: 2015 اپنان → 2030 افق۔</tspan><tspan x="756" dy="23">ماخذ: Ahmad (2011); United Nations Goal 4; MoFEPT (2018).</tspan></text><text class="wm" x="12" y="538" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
