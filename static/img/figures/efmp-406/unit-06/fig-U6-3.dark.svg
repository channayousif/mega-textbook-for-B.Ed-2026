<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">Connected teacher roles in literacy</title><desc id="d">A teacher connects classroom instruction, school coordination, home knowledge and community reading purposes, while wider staffing and infrastructure remain shared system responsibilities.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="590" rx="6" class="bg"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Teachers connect literacy opportunities</tspan></text><path d="M390,260 L203,124" class="line"/><path d="M390,260 L577,124" class="line"/><path d="M390,260 L203,370" class="line"/><path d="M390,260 L577,370" class="line"/><rect x="288" y="223" width="204" height="74" rx="6" class="accent"/><text x="390" y="254" class="" text-anchor="middle"><tspan x="390" dy="0">Teacher</tspan><tspan x="390" dy="23">Teach, connect, check</tspan></text><rect x="24" y="76" width="338" height="112" rx="6" class="panel"/><text x="40" y="105" class="h" text-anchor="start"><tspan x="40" dy="0">Classroom</tspan></text><text x="40" y="136" class="" text-anchor="start"><tspan x="40" dy="0">Teach reading and meaning</tspan><tspan x="40" dy="23">Model and assess reasoning</tspan></text><rect x="418" y="76" width="338" height="112" rx="6" class="panel"/><text x="434" y="105" class="h" text-anchor="start"><tspan x="434" dy="0">School</tspan></text><text x="434" y="136" class="" text-anchor="start"><tspan x="434" dy="0">Coordinate shared support</tspan><tspan x="434" dy="23">Review evidence together</tspan></text><rect x="24" y="326" width="338" height="112" rx="6" class="panel"/><text x="40" y="355" class="h" text-anchor="start"><tspan x="40" dy="0">Home</tspan></text><text x="40" y="386" class="" text-anchor="start"><tspan x="40" dy="0">Invite family knowledge</tspan><tspan x="40" dy="23">Offer a school alternative</tspan></text><rect x="418" y="326" width="338" height="112" rx="6" class="panel"/><text x="434" y="355" class="h" text-anchor="start"><tspan x="434" dy="0">Community</tspan></text><text x="434" y="386" class="" text-anchor="start"><tspan x="434" dy="0">Use real reading purposes</tspan><tspan x="434" dy="23">Check messages before sharing</tspan></text><rect x="24" y="472" width="732" height="73" rx="6" class="panel"/><text x="40" y="502" class="small" text-anchor="start"><tspan x="40" dy="0">Wider system responsibilities remain: staffing, buildings and safe access.</tspan><tspan x="40" dy="23">Record needs and refer them through the school.</tspan></text><text class="wm" x="768" y="578" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
