<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">Literacy barriers, effects and responses</title><desc id="d">Five literacy barriers are paired with possible effects and responses, showing that each response must address the barrier actually observed.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="650" rx="6" class="bg"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Match the response to the observed barrier</tspan></text><rect x="24" y="57" width="160" height="44" rx="6" class="accent"/><text x="36" y="85" class="h" text-anchor="start"><tspan x="36" dy="0">Barrier</tspan></text><rect x="194" y="57" width="230" height="44" rx="6" class="accent"/><text x="206" y="85" class="h" text-anchor="start"><tspan x="206" dy="0">Possible effect</tspan></text><rect x="434" y="57" width="322" height="44" rx="6" class="accent"/><text x="446" y="85" class="h" text-anchor="start"><tspan x="446" dy="0">Possible response</tspan></text><rect x="24" y="113" width="160" height="82" rx="6" class="panel"/><text x="36" y="142" class="" text-anchor="start"><tspan x="36" dy="0">Poverty</tspan></text><rect x="194" y="113" width="230" height="82" rx="6" class="panel"/><text x="206" y="142" class="" text-anchor="start"><tspan x="206" dy="0">Materials or time</tspan><tspan x="206" dy="23">are hard to obtain</tspan></text><rect x="434" y="113" width="322" height="82" rx="6" class="panel"/><text x="446" y="142" class="" text-anchor="start"><tspan x="446" dy="0">Provide school reading time</tspan><tspan x="446" dy="23">and shared materials</tspan></text><rect x="24" y="207" width="160" height="82" rx="6" class="panel"/><text x="36" y="236" class="" text-anchor="start"><tspan x="36" dy="0">Gender barriers</tspan></text><rect x="194" y="207" width="230" height="82" rx="6" class="panel"/><text x="206" y="236" class="" text-anchor="start"><tspan x="206" dy="0">A club schedule or norm</tspan><tspan x="206" dy="23">restricts participation</tspan></text><rect x="434" y="207" width="322" height="82" rx="6" class="panel"/><text x="446" y="236" class="" text-anchor="start"><tspan x="446" dy="0">Listen to learners and families</tspan><tspan x="446" dy="23">and review the arrangement</tspan></text><rect x="24" y="301" width="160" height="82" rx="6" class="panel"/><text x="36" y="330" class="" text-anchor="start"><tspan x="36" dy="0">Instructional</tspan><tspan x="36" dy="23">language</tspan></text><rect x="194" y="301" width="230" height="82" rx="6" class="panel"/><text x="206" y="330" class="" text-anchor="start"><tspan x="206" dy="0">Unfamiliar words hide</tspan><tspan x="206" dy="23">what a learner knows</tspan></text><rect x="434" y="301" width="322" height="82" rx="6" class="panel"/><text x="446" y="330" class="" text-anchor="start"><tspan x="446" dy="0">Bridge familiar-language talk</tspan><tspan x="446" dy="23">to supported target-language reading</tspan></text><rect x="24" y="395" width="160" height="82" rx="6" class="panel"/><text x="36" y="424" class="" text-anchor="start"><tspan x="36" dy="0">Distance</tspan></text><rect x="194" y="395" width="230" height="82" rx="6" class="panel"/><text x="206" y="424" class="" text-anchor="start"><tspan x="206" dy="0">Reaching school or a club</tspan><tspan x="206" dy="23">is difficult or unsafe</tspan></text><rect x="434" y="395" width="322" height="82" rx="6" class="panel"/><text x="446" y="424" class="" text-anchor="start"><tspan x="446" dy="0">Arrange school catch-up support</tspan><tspan x="446" dy="23">and refer safe-access needs</tspan></text><rect x="24" y="489" width="160" height="82" rx="6" class="panel"/><text x="36" y="518" class="" text-anchor="start"><tspan x="36" dy="0">Teacher shortage</tspan></text><rect x="194" y="489" width="230" height="82" rx="6" class="panel"/><text x="206" y="518" class="" text-anchor="start"><tspan x="206" dy="0">Learners lose supported</tspan><tspan x="206" dy="23">reading turns</tspan></text><rect x="434" y="489" width="322" height="82" rx="6" class="panel"/><text x="446" y="518" class="" text-anchor="start"><tspan x="446" dy="0">Plan reading rotations</tspan><tspan x="446" dy="23">and request staffing support</tspan></text><text x="24" y="612" class="small" text-anchor="start"><tspan x="24" dy="0">Possible effects need local evidence. These are response options, not diagnoses.</tspan></text><text class="wm" x="768" y="638" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
