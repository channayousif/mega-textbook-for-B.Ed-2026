<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خواندگی کے فروغ میں منسلک استاد کے کردار</title><desc id="d">ایک استاد جماعتی تعلیم، اسکولی بندیش، گھریلو علم اور برادری کے پڑھنے کے مقاصد سے جڑتا ہے، جبکہ وسیع عملہ اور بنیادی ڈھانچہ مشترکہ نظامی ذمہ داریاں رہتی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="590" rx="6" class="bg" transform="translate(780 0) scale(-1 1)"/><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">اساتذہ خواندگی کے مواقع سے جڑتے ہیں</tspan></text><path d="M390,260 L203,124" class="line" transform="translate(780 0) scale(-1 1)"/><path d="M390,260 L577,124" class="line" transform="translate(780 0) scale(-1 1)"/><path d="M390,260 L203,370" class="line" transform="translate(780 0) scale(-1 1)"/><path d="M390,260 L577,370" class="line" transform="translate(780 0) scale(-1 1)"/><rect x="288" y="223" width="204" height="74" rx="6" class="accent" transform="translate(780 0) scale(-1 1)"/><text x="390" y="254" class="" text-anchor="middle"><tspan x="390" dy="0">استاد</tspan><tspan x="390" dy="23">پڑھائیں، جوڑیں، جانچیں</tspan></text><rect x="24" y="76" width="338" height="112" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="740" y="105" class="h" text-anchor="end"><tspan x="740" dy="0">جماعت</tspan></text><text x="740" y="136" class="" text-anchor="end"><tspan x="740" dy="0">پڑھنا اور مطلب سکھائیں</tspan><tspan x="740" dy="23">استدلال کا ماڈل بنائیں اور جانچیں</tspan></text><rect x="418" y="76" width="338" height="112" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="346" y="105" class="h" text-anchor="end"><tspan x="346" dy="0">اسکول</tspan></text><text x="346" y="136" class="" text-anchor="end"><tspan x="346" dy="0">مشترکہ مدد کی بندیش کریں</tspan><tspan x="346" dy="23">شواہد مل کر جائزہ لیں</tspan></text><rect x="24" y="326" width="338" height="112" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="740" y="355" class="h" text-anchor="end"><tspan x="740" dy="0">گھر</tspan></text><text x="740" y="386" class="" text-anchor="end"><tspan x="740" dy="0">خاندانی علم کی دعوت دیں</tspan><tspan x="740" dy="23">اسکولی متبادل پیش کریں</tspan></text><rect x="418" y="326" width="338" height="112" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="346" y="355" class="h" text-anchor="end"><tspan x="346" dy="0">برادری</tspan></text><text x="346" y="386" class="" text-anchor="end"><tspan x="346" dy="0">حقیقی پڑھنے کے مقاصد استعمال کریں</tspan><tspan x="346" dy="23">شیئر کرنے سے پہلے پیغامات کی جانچ کریں</tspan></text><rect x="24" y="472" width="732" height="73" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="740" y="502" class="small" text-anchor="end"><tspan x="740" dy="0">وسیع نظامی ذمہ داریاں رہتی ہیں: عملہ، عمارتیں اور محفوظ رسائی۔</tspan><tspan x="740" dy="23">ضروریات ریکارڈ کریں اور ان کا حوالہ اسکول کے ذریعے دیں۔</tspan></text><text class="wm" x="12" y="578" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
