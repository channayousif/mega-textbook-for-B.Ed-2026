<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منصفانہ رسائی کی باہم جڑی رکاوٹیں</title><desc id="d">رسائی کی رکاوٹیں کئی متعلم گروہوں سے جڑی ہیں، اوورلیپنگ رابطے دکھاتے ہیں کہ متعلم ایک سے زیادہ رکاوٹ کا سامنا کر سکتے ہیں اور انہیں مختلف مدد درکار ہو سکتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="620" rx="6" class="bg" transform="translate(780 0) scale(-1 1)"/><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">ایک متعلم کو کئی رکاوٹوں کا سامنا ہو سکتا ہے</tspan></text><text x="756" y="65" class="h" text-anchor="end"><tspan x="756" dy="0">رکاوٹیں</tspan></text><text x="262" y="65" class="h" text-anchor="end"><tspan x="262" dy="0">ممکنہ متاثرہ گروہ</tspan></text><path d="M286,133 L494,133" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,133 L494,361" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,247 L494,133" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,247 L494,247" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,247 L494,361" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,361 L494,247" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,361 L494,361" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,475 L494,133" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><path d="M286,475 L494,475" class="line dash" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)"/><rect x="24" y="94" width="262" height="78" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="742" y="123" class="" text-anchor="end"><tspan x="742" dy="0">قیمت</tspan></text><rect x="494" y="94" width="262" height="78" rx="6" class="accent" transform="translate(780 0) scale(-1 1)"/><text x="272" y="123" class="" text-anchor="end"><tspan x="272" dy="0">لڑکیاں</tspan></text><rect x="24" y="208" width="262" height="78" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="742" y="237" class="" text-anchor="end"><tspan x="742" dy="0">غیر محفوظ یا</tspan><tspan x="742" dy="23">دور دراز راستے</tspan></text><rect x="494" y="208" width="262" height="78" rx="6" class="accent" transform="translate(780 0) scale(-1 1)"/><text x="272" y="237" class="" text-anchor="end"><tspan x="272" dy="0">معذور بچے</tspan></text><rect x="24" y="322" width="262" height="78" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="742" y="351" class="" text-anchor="end"><tspan x="742" dy="0">ناقابلِ رسائی</tspan><tspan x="742" dy="23">مواد</tspan></text><rect x="494" y="322" width="262" height="78" rx="6" class="accent" transform="translate(780 0) scale(-1 1)"/><text x="272" y="351" class="" text-anchor="end"><tspan x="272" dy="0">دیہی بچے</tspan></text><rect x="24" y="436" width="262" height="78" rx="6" class="panel" transform="translate(780 0) scale(-1 1)"/><text x="742" y="465" class="" text-anchor="end"><tspan x="742" dy="0">غیر واقف تعلیمی</tspan><tspan x="742" dy="23">زبان</tspan></text><rect x="494" y="436" width="262" height="78" rx="6" class="accent" transform="translate(780 0) scale(-1 1)"/><text x="272" y="465" class="" text-anchor="end"><tspan x="272" dy="0">اقلیتی زبان</tspan><tspan x="272" dy="23">بولنے والے</tspan></text><text x="756" y="552" class="small" text-anchor="end"><tspan x="756" dy="0">رابطے ممکنہ اوورلیپ دکھاتے ہیں، مقررہ شناختیں یا کم صلاحیت نہیں۔</tspan><tspan x="756" dy="23">مدد چننے سے پہلے پوچھیں کہ کون سی رکاوٹ موجود ہے۔</tspan></text><text class="wm" x="12" y="608" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
