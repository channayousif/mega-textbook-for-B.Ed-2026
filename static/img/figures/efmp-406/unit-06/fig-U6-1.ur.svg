<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خواندگی کی رکاوٹیں، اثرات اور جوابات</title><desc id="d">پانچ خواندگی کی رکاوٹوں کو ممکنہ اثرات اور جوابات کے ساتھ جوڑا گیا ہے، یہ دکھاتا ہے کہ ہر جواب کو مشاہدہ کردہ رکاوٹ پر لاگو ہونا چاہیے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="650" rx="6" class="bg"/><text x="756" y="35" class="h" text-anchor="end"><tspan x="756" dy="0">جواب کو مشاہدہ کردہ رکاوٹ سے ملائیں</tspan></text><rect x="596" y="57" width="160" height="44" rx="6" class="accent"/><text x="744" y="85" class="h" text-anchor="end"><tspan x="744" dy="0">رکاوٹ</tspan></text><rect x="356" y="57" width="230" height="44" rx="6" class="accent"/><text x="574" y="85" class="h" text-anchor="end"><tspan x="574" dy="0">ممکنہ اثر</tspan></text><rect x="24" y="57" width="322" height="44" rx="6" class="accent"/><text x="334" y="85" class="h" text-anchor="end"><tspan x="334" dy="0">ممکنہ جواب</tspan></text><rect x="596" y="113" width="160" height="82" rx="6" class="panel"/><text x="744" y="142" class="" text-anchor="end"><tspan x="744" dy="0">غریبی</tspan></text><rect x="356" y="113" width="230" height="82" rx="6" class="panel"/><text x="574" y="142" class="" text-anchor="end"><tspan x="574" dy="0">مواد یا وقت حاصل</tspan><tspan x="574" dy="23">کرنا مشکل ہے</tspan></text><rect x="24" y="113" width="322" height="82" rx="6" class="panel"/><text x="334" y="142" class="" text-anchor="end"><tspan x="334" dy="0">اسکول میں پڑھنے کا وقت</tspan><tspan x="334" dy="23">اور مشترکہ مواد فراہم کریں</tspan></text><rect x="596" y="207" width="160" height="82" rx="6" class="panel"/><text x="744" y="236" class="" text-anchor="end"><tspan x="744" dy="0">جنسی رکاوٹیں</tspan></text><rect x="356" y="207" width="230" height="82" rx="6" class="panel"/><text x="574" y="236" class="" text-anchor="end"><tspan x="574" dy="0">کلب کا شیڈول یا رواج</tspan><tspan x="574" dy="23">شرکت کو محدود کرتا ہے</tspan></text><rect x="24" y="207" width="322" height="82" rx="6" class="panel"/><text x="334" y="236" class="" text-anchor="end"><tspan x="334" dy="0">متعلمین اور خاندانوں کو سنیں</tspan><tspan x="334" dy="23">اور ترتیب کا جائزہ لیں</tspan></text><rect x="596" y="301" width="160" height="82" rx="6" class="panel"/><text x="744" y="330" class="" text-anchor="end"><tspan x="744" dy="0">تعلیمی زبان</tspan></text><rect x="356" y="301" width="230" height="82" rx="6" class="panel"/><text x="574" y="330" class="" text-anchor="end"><tspan x="574" dy="0">غیر واقف الفاظ متعلم</tspan><tspan x="574" dy="23">کا علم چھپاتے ہیں</tspan></text><rect x="24" y="301" width="322" height="82" rx="6" class="panel"/><text x="334" y="330" class="" text-anchor="end"><tspan x="334" dy="0">واقف زبان کی بات کو معاونتی</tspan><tspan x="334" dy="23">ہدف زبان کی پڑھائی سے جوڑیں</tspan></text><rect x="596" y="395" width="160" height="82" rx="6" class="panel"/><text x="744" y="424" class="" text-anchor="end"><tspan x="744" dy="0">فاصلہ</tspan></text><rect x="356" y="395" width="230" height="82" rx="6" class="panel"/><text x="574" y="424" class="" text-anchor="end"><tspan x="574" dy="0">اسکول یا کلب تک پہنچنا</tspan><tspan x="574" dy="23">مشکل یا غیر محفوظ ہے</tspan></text><rect x="24" y="395" width="322" height="82" rx="6" class="panel"/><text x="334" y="424" class="" text-anchor="end"><tspan x="334" dy="0">اسکولی تیز رفتار مدد کا انتظام</tspan><tspan x="334" dy="23">کریں اور محفوظ رسائی کی ضروریات کا حوالہ دیں</tspan></text><rect x="596" y="489" width="160" height="82" rx="6" class="panel"/><text x="744" y="518" class="" text-anchor="end"><tspan x="744" dy="0">استاد کی کمی</tspan></text><rect x="356" y="489" width="230" height="82" rx="6" class="panel"/><text x="574" y="518" class="" text-anchor="end"><tspan x="574" dy="0">متعلمین معاونتی پڑھنے</tspan><tspan x="574" dy="23">کی باریاں کھو دیتے ہیں</tspan></text><rect x="24" y="489" width="322" height="82" rx="6" class="panel"/><text x="334" y="518" class="" text-anchor="end"><tspan x="334" dy="0">پڑھنے کی گردش کی منصوبہ بندی</tspan><tspan x="334" dy="23">کریں اور عملے کی مدد کا مطالبہ کریں</tspan></text><text x="756" y="612" class="small" text-anchor="end"><tspan x="756" dy="0">ممکنہ اثرات کے مقامی شواہد درکار ہیں۔ یہ جوابات کے اختیارات ہیں، تشخیص نہیں۔</tspan></text><text class="wm" x="12" y="638" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
