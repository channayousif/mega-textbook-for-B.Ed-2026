<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title id="t">EFA, SDG and Pakistan policy timeline</title><desc id="d">EFA's 2000 renewal and 2015 horizon precede the SDG period from 2015 to 2030, with Pakistan's 2018 policy framework marked as a commitment rather than evidence of achievement.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}.line{fill:none;stroke:var(--ink);stroke-width:2}.dash{stroke-dasharray:6 4}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}.arrow{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs><rect x="0" y="0" width="780" height="550" rx="6" class="bg"/><text x="24" y="35" class="h" text-anchor="start"><tspan x="24" dy="0">Commitments and horizons are not achieved outcomes</tspan></text><path d="M65,252 L715,252" class="line" marker-end="url(#arrow)"/><path d="M65,241 L65,263" class="line"/><text x="65" y="290" class="h" text-anchor="middle"><tspan x="65" dy="0">2000</tspan></text><path d="M282,241 L282,263" class="line"/><text x="282" y="290" class="h" text-anchor="middle"><tspan x="282" dy="0">2015</tspan></text><path d="M499,241 L499,263" class="line"/><text x="499" y="290" class="h" text-anchor="middle"><tspan x="499" dy="0">2018</tspan></text><path d="M715,241 L715,263" class="line"/><text x="715" y="290" class="h" text-anchor="middle"><tspan x="715" dy="0">2030</tspan></text><rect x="24" y="76" width="226" height="133" rx="6" class="panel"/><text x="40" y="106" class="h" text-anchor="start"><tspan x="40" dy="0">Dakar renewal</tspan><tspan x="40" dy="23">of EFA</tspan></text><text x="40" y="161" class="" text-anchor="start"><tspan x="40" dy="0">Commitment renewed</tspan><tspan x="40" dy="23">Target horizon: 2015</tspan></text><path d="M65,209 L65,241" class="line"/><rect x="274" y="76" width="226" height="133" rx="6" class="panel"/><text x="290" y="106" class="h" text-anchor="start"><tspan x="290" dy="0">SDGs adopted</tspan></text><text x="290" y="138" class="" text-anchor="start"><tspan x="290" dy="0">Education and literacy</tspan><tspan x="290" dy="23">Target horizon: 2030</tspan></text><path d="M282,209 L282,241" class="line"/><path d="M499,263 L499,326" class="line"/><rect x="350" y="326" width="330" height="99" rx="6" class="panel"/><text x="366" y="357" class="h" text-anchor="start"><tspan x="366" dy="0">Pakistan policy framework</tspan></text><text x="366" y="389" class="" text-anchor="start"><tspan x="366" dy="0">2018 national milestone</tspan></text><text x="24" y="470" class="small" text-anchor="start"><tspan x="24" dy="0">EFA: 2000 renewal → 2015 horizon. SDGs: 2015 adoption → 2030 horizon.</tspan><tspan x="24" dy="23">Sources: Ahmad (2011); United Nations Goal 4; MoFEPT (2018).</tspan></text><text class="wm" x="768" y="538" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
