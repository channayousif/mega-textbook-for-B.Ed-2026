<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t3 d3" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t3">خواندہ شہری: شہری خواندگی کے چار ابعاد</title><desc id="d3">چار باہم جڑے شہری خواندگی کے ابعاد دکھانے والا نقشہ: معلومات پڑھنا، دعووں کا تنقیدی جائزہ لینا، شہری آواز کا اظہار، اور فعال جمہوری شرکت۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.card{fill:var(--panel);stroke:var(--line);stroke-width:2}.card-accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--a2);stroke-width:2}.ah{fill:var(--a2)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.num{font-size:14px;font-weight:700;fill:var(--a1)}.title{font-size:15px;font-weight:700}.body{font-size:13px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="800" height="480" transform="translate(780 0) scale(-0.975 1)"/><text x="750.8" y="32" class="h" text-anchor="end">خواندہ شہری: شہری خواندگی کے چار ابعاد</text><text x="750.8" y="52" class="sub" text-anchor="end">تنقیدی پڑھنا اور لکھنا شہریوں کو جمہوری زندگی میں فعال طور پر شرکت کے لیے کیسے بااختیار بناتے ہیں</text><rect class="card-accent" x="40" y="75" width="360" height="150" rx="8" transform="translate(780 0) scale(-0.975 1)"/><text x="726.4" y="103" class="num" text-anchor="end">بعد 1</text><text x="726.4" y="125" class="title" text-anchor="end">شہری معلومات پڑھنا</text><text x="726.4" y="150" class="body" text-anchor="end">• آئینی حقوق تک رسائی (مثلاً دفعہ 25-الف)</text><text x="726.4" y="170" class="body" text-anchor="end">• میونسپل نوٹسز اور قوانین کو سمجھنا</text><text x="726.4" y="190" class="body" text-anchor="end">• ووٹنگ کے طریقوں اور بلٹوں کو سمجھنا</text><line x1="400" y1="150" x2="420" y2="150" class="link" marker-end="url(#arr2)" transform="translate(780 0) scale(-0.975 1)"/><rect class="card" x="430" y="75" width="330" height="150" rx="8" transform="translate(780 0) scale(-0.975 1)"/><text x="346.1" y="103" class="num" text-anchor="end">بعد 2</text><text x="346.1" y="125" class="title" text-anchor="end">دعووں کا تنقیدی جائزہ</text><text x="346.1" y="150" class="body" text-anchor="end">• سیاسی تعصب اور پروپیگنڈا کی نشاندہی</text><text x="346.1" y="170" class="body" text-anchor="end">• خبروں اور سوشل میڈیا میں ماخذ کی تصدیق</text><text x="346.1" y="190" class="body" text-anchor="end">• تصدیق شدہ حقائق کو افواہ سے الگ کرنا</text><line x1="595" y1="225" x2="595" y2="255" class="link" marker-end="url(#arr2)" transform="translate(780 0) scale(-0.975 1)"/><rect class="card-accent" x="430" y="265" width="330" height="150" rx="8" transform="translate(780 0) scale(-0.975 1)"/><text x="346.1" y="293" class="num" text-anchor="end">بعد 3</text><text x="346.1" y="315" class="title" text-anchor="end">شہری آواز کا اظہار</text><text x="346.1" y="340" class="body" text-anchor="end">• رسمی درخواستیں اور عوامی خطوط لکھنا</text><text x="346.1" y="360" class="body" text-anchor="end">• شہری فورمز میں برادری کی ضروریات کا اظہار</text><text x="346.1" y="380" class="body" text-anchor="end">• ثقافتی اختلافات کے درمیان مواصلت</text><line x1="430" y1="340" x2="410" y2="340" class="link" marker-end="url(#arr2)" transform="translate(780 0) scale(-0.975 1)"/><rect class="card" x="40" y="265" width="360" height="150" rx="8" transform="translate(780 0) scale(-0.975 1)"/><text x="726.4" y="293" class="num" text-anchor="end">بعد 4</text><text x="726.4" y="315" class="title" text-anchor="end">جمہوری اجتماعی عمل</text><text x="726.4" y="340" class="body" text-anchor="end">• اسکول مینجمنٹ كميٹیوں میں حصہ لینا</text><text x="726.4" y="360" class="body" text-anchor="end">• برادری کی بہبود اور مقامی وکالت کا اہتمام</text><text x="726.4" y="380" class="body" text-anchor="end">• عوامی نمائندگان سے بازپرس کرنا</text><line x1="205" y1="265" x2="205" y2="235" class="link" marker-end="url(#arr2)" transform="translate(780 0) scale(-0.975 1)"/><text x="765" y="460" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
