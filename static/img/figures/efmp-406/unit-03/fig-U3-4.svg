<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="t4 d4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t4">Languages in a Pakistani Pupil's Education</title><desc id="d4">Table comparing home languages, Urdu, and English in a Pakistani pupil's life across primary domains, classroom role, and contribution to literacy development.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.th{fill:var(--a1-fill);stroke:var(--line);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--muted);stroke-width:1}.alt-cell{fill:var(--panel);stroke:var(--muted);stroke-width:1}.banner{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.col-head{font-size:14px;font-weight:700}.row-lbl{font-size:13px;font-weight:700}.txt{font-size:13px}.banner-txt{font-size:13px;font-weight:600}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="820" height="480"/><text x="25" y="32" class="h" text-anchor="start">Languages in a Pakistani Pupil's Literacy Journey</text><text x="25" y="52" class="sub" text-anchor="start">Balancing mother tongues, national language, and global access in classroom practice</text><rect class="th" x="25" y="70" width="165" height="40"/><text x="107" y="95" class="col-head" text-anchor="middle">Language Tier</text><rect class="th" x="190" y="70" width="195" height="40"/><text x="287" y="95" class="col-head" text-anchor="middle">Everyday Domains</text><rect class="th" x="385" y="70" width="225" height="40"/><text x="497" y="95" class="col-head" text-anchor="middle">Role in Literacy Development</text><rect class="th" x="610" y="70" width="185" height="40"/><text x="702" y="95" class="col-head" text-anchor="middle">Classroom Strategy</text><rect class="cell" x="25" y="110" width="165" height="85"/><text x="35" y="136" class="row-lbl" text-anchor="start">Regional Language /</text><text x="35" y="154" class="row-lbl" text-anchor="start">Mother Tongue</text><text x="35" y="174" class="sub" text-anchor="start">(Sindhi, Pashto, etc.)</text><rect class="cell" x="190" y="110" width="195" height="85"/><text x="200" y="136" class="txt" text-anchor="start">Home, family relations,</text><text x="200" y="154" class="txt" text-anchor="start">neighbourhood, local market,</text><text x="200" y="172" class="txt" text-anchor="start">and cultural celebrations.</text><rect class="cell" x="385" y="110" width="225" height="85"/><text x="395" y="136" class="txt" text-anchor="start">Foundation for early thinking,</text><text x="395" y="154" class="txt" text-anchor="start">concept formation, oral fluency,</text><text x="395" y="172" class="txt" text-anchor="start">and initial phonemic awareness.</text><rect class="cell" x="610" y="110" width="185" height="85"/><text x="620" y="136" class="txt" text-anchor="start">Mother-tongue instruction</text><text x="620" y="154" class="txt" text-anchor="start">in early grades; oral</text><text x="620" y="172" class="txt" text-anchor="start">scaffolding for new ideas.</text><rect class="alt-cell" x="25" y="195" width="165" height="85"/><text x="35" y="225" class="row-lbl" text-anchor="start">National Language</text><text x="35" y="245" class="sub" text-anchor="start">(Urdu)</text><rect class="alt-cell" x="190" y="195" width="195" height="85"/><text x="200" y="221" class="txt" text-anchor="start">Inter-provincial commerce,</text><text x="200" y="239" class="txt" text-anchor="start">national news, broadcast media,</text><text x="200" y="257" class="txt" text-anchor="start">and urban communication.</text><rect class="alt-cell" x="385" y="195" width="225" height="85"/><text x="395" y="221" class="txt" text-anchor="start">Unifying lingua franca;</text><text x="395" y="239" class="txt" text-anchor="start">bridges local speech to broader</text><text x="395" y="257" class="txt" text-anchor="start">national print culture and texts.</text><rect class="alt-cell" x="610" y="195" width="185" height="85"/><text x="620" y="221" class="txt" text-anchor="start">Systematic reading and</text><text x="620" y="239" class="txt" text-anchor="start">writing instruction across</text><text x="620" y="257" class="txt" text-anchor="start">all primary grades.</text><rect class="cell" x="25" y="280" width="165" height="85"/><text x="35" y="310" class="row-lbl" text-anchor="start">Official / Global</text><text x="35" y="330" class="row-lbl" text-anchor="start">Language (English)</text><rect class="cell" x="190" y="280" width="195" height="85"/><text x="200" y="306" class="txt" text-anchor="start">Higher education, civil service,</text><text x="200" y="324" class="txt" text-anchor="start">formal law, sciences, and</text><text x="200" y="342" class="txt" text-anchor="start">international digital media.</text><rect class="cell" x="385" y="280" width="225" height="85"/><text x="395" y="306" class="txt" text-anchor="start">Key gatekeeper for academic</text><text x="395" y="324" class="txt" text-anchor="start">degrees, global information,</text><text x="395" y="342" class="txt" text-anchor="start">and professional employment.</text><rect class="cell" x="610" y="280" width="185" height="85"/><text x="620" y="306" class="txt" text-anchor="start">Explicit language teaching;</text><text x="620" y="324" class="txt" text-anchor="start">avoid punitive immersion;</text><text x="620" y="342" class="txt" text-anchor="start">use bilingual glossaries.</text><rect class="banner" x="25" y="375" width="770" height="50" rx="6"/><text x="410" y="396" class="banner-txt" text-anchor="middle">Pedagogical principle: Additive multilingualism and flexible translanguaging allow learners</text><text x="410" y="414" class="banner-txt" text-anchor="middle">to use their full linguistic repertoire, connecting home languages to academic success.</text><text x="795" y="460" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>