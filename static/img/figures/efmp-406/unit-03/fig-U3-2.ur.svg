<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t2 d2" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t2">غالب اسکولی خواندگی بمقابلہ مقامی برادری کی خواندگی</title><desc id="d2">پاکستان میں زبان کی شکل، اختیار، سماجی پہچان اور کلاس روم کے اثرات کے لحاظ سے غالب اسکولی خواندگیوں اور مقامی برادری کی خواندگیوں کا موازنہ کرنے والا جدول۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.th{fill:var(--a1-fill);stroke:var(--line);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--muted);stroke-width:1}.alt-cell{fill:var(--panel);stroke:var(--muted);stroke-width:1}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.col-head{font-size:14px;font-weight:700}.row-lbl{font-size:13px;font-weight:700}.txt{font-size:13px}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="820" height="480" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="756.2" y="32" class="h" text-anchor="end">پاکستان میں غالب بمقابلہ مقامی خواندگیاں</text><text x="756.2" y="52" class="sub" text-anchor="end">اداری طاقت، سماجی پہچان اور کلاس روم کے اثرات کا معائنہ</text><rect class="th" x="25" y="70" width="160" height="40" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="680.1" y="95" class="col-head" text-anchor="middle">بُعد</text><rect class="th" x="185" y="70" width="295" height="40" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="464.2" y="95" class="col-head" text-anchor="middle">غالب اسکولی خواندگی</text><rect class="th" x="480" y="70" width="315" height="40" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="174.1" y="95" class="col-head" text-anchor="middle">مقامی برادری کی خواندگی</text><rect class="cell" x="25" y="110" width="160" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="746.7" y="142" class="row-lbl" text-anchor="end">زبان اور</text><text x="746.7" y="160" class="row-lbl" text-anchor="end">تحریری شکل</text><rect class="cell" x="185" y="110" width="295" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="594.5" y="136" class="txt" text-anchor="end">معیاری اردو اور رسمی انگریزی؛</text><text x="594.5" y="154" class="txt" text-anchor="end">مدون قواعد، رسمی املا،</text><text x="594.5" y="172" class="txt" text-anchor="end">اور تسلیم شدہ تعلیمی اصطلاحات۔</text><rect class="cell" x="480" y="110" width="315" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="313.9" y="136" class="txt" text-anchor="end">علاقائی مادری زبانیں (سندھی، پشتو،</text><text x="313.9" y="154" class="txt" text-anchor="end">پنجابی، بلوچی) اور عام شکلیں؛</text><text x="313.9" y="172" class="txt" text-anchor="end">زبانی شکلیں، غیر رسمی نوٹسز، اور مقامی تحریریں۔</text><rect class="alt-cell" x="25" y="185" width="160" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="746.7" y="217" class="row-lbl" text-anchor="end">اختیار اور</text><text x="746.7" y="235" class="row-lbl" text-anchor="end">توثیق</text><rect class="alt-cell" x="185" y="185" width="295" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="594.5" y="211" class="txt" text-anchor="end">نصابی بورڈ، امتحانات، نصابی</text><text x="594.5" y="229" class="txt" text-anchor="end">رہنما خطوط، اور ریاستی سند؛</text><text x="594.5" y="247" class="txt" text-anchor="end">تعلیمی حکام کے ذریعے توثیق شدہ۔</text><rect class="alt-cell" x="480" y="185" width="315" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="313.9" y="211" class="txt" text-anchor="end">خاندانی بزرگ، مذہبی برادری، مقامی</text><text x="313.9" y="229" class="txt" text-anchor="end">بازار کے ہم عمر، اور زرعی شبکے؛</text><text x="313.9" y="247" class="txt" text-anchor="end">عملی سماجی فائدے کے ذریعے توثیق شدہ۔</text><rect class="cell" x="25" y="260" width="160" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="746.7" y="292" class="row-lbl" text-anchor="end">سماجی مقام اور</text><text x="746.7" y="310" class="row-lbl" text-anchor="end">کام</text><rect class="cell" x="185" y="260" width="295" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="594.5" y="286" class="txt" text-anchor="end">اعلیٰ اداری وقار؛ ایک</text><text x="594.5" y="304" class="txt" text-anchor="end">دروازہ بان اعلیٰ تعلیم، رسمی</text><text x="594.5" y="322" class="txt" text-anchor="end">ملازمتوں، اور سماجی ترقی کے لیے۔</text><rect class="cell" x="480" y="260" width="315" height="75" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="313.9" y="286" class="txt" text-anchor="end">اکثر حاشیہ پر لگائی گئی یا کمی کے</text><text x="313.9" y="304" class="txt" text-anchor="end">لیبل والی اسکولوں کے ذریعے، اگرچہ</text><text x="313.9" y="322" class="txt" text-anchor="end">روزمرہ خاندانی، ثقافتی، تجارتی، اور اجتماعی زندگی کو برقرار رکھتی ہے۔</text><rect class="alt-cell" x="25" y="335" width="160" height="85" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="746.7" y="367" class="row-lbl" text-anchor="end">کلاس روم کے</text><text x="746.7" y="385" class="row-lbl" text-anchor="end">اثرات</text><rect class="alt-cell" x="185" y="335" width="295" height="85" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="594.5" y="361" class="txt" text-anchor="end">واضح طور پر پڑھائی جانی چاہیے تاکہ تمام شاگرد</text><text x="594.5" y="379" class="txt" text-anchor="end">تعلیمی اور شہری طاقت تک رسائی حاصل کریں،</text><text x="594.5" y="397" class="txt" text-anchor="end">گھریلو روایات کو ذلیل کیے بغیر۔</text><rect class="alt-cell" x="480" y="335" width="315" height="85" transform="translate(780 0) scale(-0.9512195121951219 1)"/><text x="313.9" y="361" class="txt" text-anchor="end">اساتذہ کو برادری کی خواندگیوں کو ثقافتی</text><text x="313.9" y="379" class="txt" text-anchor="end">علم کے ذخیرے کے طور پر تسلیم کرنا ہوگا اور</text><text x="313.9" y="397" class="txt" text-anchor="end">تعلیمی خواندگی تک تعمیری پل بنانے ہوں گے۔</text><text x="795" y="465" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
