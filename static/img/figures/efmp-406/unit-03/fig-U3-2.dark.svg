<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" aria-labelledby="t2 d2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t2">Dominant School Literacy vs Vernacular Community Literacy</title><desc id="d2">Table comparing dominant school literacies and vernacular community literacies across language variety, authority, social recognition, and classroom implications in Pakistan.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.th{fill:var(--a1-fill);stroke:var(--line);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--muted);stroke-width:1}.alt-cell{fill:var(--panel);stroke:var(--muted);stroke-width:1}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.col-head{font-size:14px;font-weight:700}.row-lbl{font-size:13px;font-weight:700}.txt{font-size:13px}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="820" height="480"/><text x="25" y="32" class="h" text-anchor="start">Dominant vs Vernacular Literacies in Pakistan</text><text x="25" y="52" class="sub" text-anchor="start">Examining institutional power, social recognition, and classroom consequences</text><rect class="th" x="25" y="70" width="160" height="40"/><text x="105" y="95" class="col-head" text-anchor="middle">Dimension</text><rect class="th" x="185" y="70" width="295" height="40"/><text x="332" y="95" class="col-head" text-anchor="middle">Dominant School Literacy</text><rect class="th" x="480" y="70" width="315" height="40"/><text x="637" y="95" class="col-head" text-anchor="middle">Vernacular Community Literacy</text><rect class="cell" x="25" y="110" width="160" height="75"/><text x="35" y="142" class="row-lbl" text-anchor="start">Language and</text><text x="35" y="160" class="row-lbl" text-anchor="start">Script Variety</text><rect class="cell" x="185" y="110" width="295" height="75"/><text x="195" y="136" class="txt" text-anchor="start">Standardized Urdu and formal English;</text><text x="195" y="154" class="txt" text-anchor="start">codified grammar, formal orthography,</text><text x="195" y="172" class="txt" text-anchor="start">and sanctioned academic terminology.</text><rect class="cell" x="480" y="110" width="315" height="75"/><text x="490" y="136" class="txt" text-anchor="start">Regional mother tongues (Sindhi, Pashto,</text><text x="490" y="154" class="txt" text-anchor="start">Punjabi, Balochi) and colloquial varieties;</text><text x="490" y="172" class="txt" text-anchor="start">oral forms, informal notes, and local scripts.</text><rect class="alt-cell" x="25" y="185" width="160" height="75"/><text x="35" y="217" class="row-lbl" text-anchor="start">Authority and</text><text x="35" y="235" class="row-lbl" text-anchor="start">Validation</text><rect class="alt-cell" x="185" y="185" width="295" height="75"/><text x="195" y="211" class="txt" text-anchor="start">Textbook boards, examinations, syllabus</text><text x="195" y="229" class="txt" text-anchor="start">guidelines, and state credentialing;</text><text x="195" y="247" class="txt" text-anchor="start">validated by educational authorities.</text><rect class="alt-cell" x="480" y="185" width="315" height="75"/><text x="490" y="211" class="txt" text-anchor="start">Family elders, religious community, local</text><text x="490" y="229" class="txt" text-anchor="start">market peers, and agricultural networks;</text><text x="490" y="247" class="txt" text-anchor="start">validated through practical social utility.</text><rect class="cell" x="25" y="260" width="160" height="75"/><text x="35" y="292" class="row-lbl" text-anchor="start">Social Status and</text><text x="35" y="310" class="row-lbl" text-anchor="start">Function</text><rect class="cell" x="185" y="260" width="295" height="75"/><text x="195" y="286" class="txt" text-anchor="start">High institutional prestige; acts as a</text><text x="195" y="304" class="txt" text-anchor="start">gatekeeper for higher education, formal</text><text x="195" y="322" class="txt" text-anchor="start">jobs, and social advancement.</text><rect class="cell" x="480" y="260" width="315" height="75"/><text x="490" y="286" class="txt" text-anchor="start">Often marginalized or labelled deficient by</text><text x="490" y="304" class="txt" text-anchor="start">schools, despite maintaining daily family,</text><text x="490" y="322" class="txt" text-anchor="start">cultural, trade, and communal life.</text><rect class="alt-cell" x="25" y="335" width="160" height="85"/><text x="35" y="367" class="row-lbl" text-anchor="start">Classroom</text><text x="35" y="385" class="row-lbl" text-anchor="start">Implications</text><rect class="alt-cell" x="185" y="335" width="295" height="85"/><text x="195" y="361" class="txt" text-anchor="start">Must be taught explicitly so all pupils</text><text x="195" y="379" class="txt" text-anchor="start">gain access to academic and civic power,</text><text x="195" y="397" class="txt" text-anchor="start">without demeaning home traditions.</text><rect class="alt-cell" x="480" y="335" width="315" height="85"/><text x="490" y="361" class="txt" text-anchor="start">Teachers must recognize community literacies</text><text x="490" y="379" class="txt" text-anchor="start">as cultural funds of knowledge and build</text><text x="490" y="397" class="txt" text-anchor="start">constructive bridges into academic literacy.</text><text x="795" y="465" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>