<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t3 d3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t3">The Literate Citizen in a Democratic Society</title><desc id="d3">Diagram showing four interconnected dimensions of civic literacy: reading information, evaluating claims critically, expressing civic voice, and active democratic participation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.card{fill:var(--panel);stroke:var(--line);stroke-width:2}.card-accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--a2);stroke-width:2}.ah{fill:var(--a2)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.num{font-size:14px;font-weight:700;fill:var(--a1)}.title{font-size:15px;font-weight:700}.body{font-size:13px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="800" height="480"/><text x="30" y="32" class="h" text-anchor="start">The Literate Citizen: Four Dimensions of Civic Literacy</text><text x="30" y="52" class="sub" text-anchor="start">How critical reading and writing empower citizens to participate actively in democratic life</text><rect class="card-accent" x="40" y="75" width="360" height="150" rx="8"/><text x="55" y="103" class="num" text-anchor="start">Dimension 1</text><text x="55" y="125" class="title" text-anchor="start">Reading Civic Information</text><text x="55" y="150" class="body" text-anchor="start">• Accessing constitutional rights (e.g. Article 25-A)</text><text x="55" y="170" class="body" text-anchor="start">• Comprehending municipal notices and laws</text><text x="55" y="190" class="body" text-anchor="start">• Understanding voting procedures and ballots</text><line x1="400" y1="150" x2="420" y2="150" class="link" marker-end="url(#arr2)"/><rect class="card" x="430" y="75" width="330" height="150" rx="8"/><text x="445" y="103" class="num" text-anchor="start">Dimension 2</text><text x="445" y="125" class="title" text-anchor="start">Critical Evaluation of Claims</text><text x="445" y="150" class="body" text-anchor="start">• Identifying political bias and propaganda</text><text x="445" y="170" class="body" text-anchor="start">• Verifying sources in news and social media</text><text x="445" y="190" class="body" text-anchor="start">• Distinguishing verified facts from rumour</text><line x1="595" y1="225" x2="595" y2="255" class="link" marker-end="url(#arr2)"/><rect class="card-accent" x="430" y="265" width="330" height="150" rx="8"/><text x="445" y="293" class="num" text-anchor="start">Dimension 3</text><text x="445" y="315" class="title" text-anchor="start">Expressing Civic Voice</text><text x="445" y="340" class="body" text-anchor="start">• Writing formal petitions and public letters</text><text x="445" y="360" class="body" text-anchor="start">• Articulating community needs in civic forums</text><text x="445" y="380" class="body" text-anchor="start">• Communicating across cultural differences</text><line x1="430" y1="340" x2="410" y2="340" class="link" marker-end="url(#arr2)"/><rect class="card" x="40" y="265" width="360" height="150" rx="8"/><text x="55" y="293" class="num" text-anchor="start">Dimension 4</text><text x="55" y="315" class="title" text-anchor="start">Democratic Collective Action</text><text x="55" y="340" class="body" text-anchor="start">• Participating in School Management Committees</text><text x="55" y="360" class="body" text-anchor="start">• Organizing community welfare and local advocacy</text><text x="55" y="380" class="body" text-anchor="start">• Holding public representatives accountable</text><line x1="205" y1="265" x2="205" y2="235" class="link" marker-end="url(#arr2)"/><text x="765" y="460" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>