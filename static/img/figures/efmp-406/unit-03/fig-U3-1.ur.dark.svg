<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t1 d1" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t1">خواندگی کے اعمال برادری کے شعبوں میں</title><desc id="d1">ایک پاکستانی برادری میں گھر، اسکول، مذہبی اداروں، بازار اور کام کی جگہ کی روایتی روزمرہ خواندگی کے اعمال کو جوڑنے والا تصوری نقشہ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.box{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.domain{font-size:15px;font-weight:700}.item{font-size:13px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><text x="750.8" y="34" class="h" text-anchor="end">خواندگی کے اعمال برادری کے شعبوں میں</text><text x="750.8" y="54" class="sub" text-anchor="end">پڑھنا اور لکھنا روزمرہ پاکستانی سماجی اداروں میں مختلف شکلیں لیتے ہیں</text><rect class="accent" x="263.25" y="210" width="253.5" height="80" rx="10"/><text x="390.0" y="242" class="domain" text-anchor="middle">خواندگی بطور سماجی عمل</text><text x="390.0" y="264" class="item" text-anchor="middle">ثقافتی طور پر مقامی پڑھنے، لکھنے،</text><text x="390.0" y="280" class="item" text-anchor="middle">اور مشترکہ معنی بنانے کے طریقے</text><line x1="458.25" y1="210" x2="585" y2="150" class="link" marker-end="url(#arr)"/><rect class="box" x="516.75" y="70" width="234" height="100" rx="6"/><text x="736.1" y="96" class="domain" text-anchor="end">گھر اور خاندان</text><text x="736.1" y="118" class="item" text-anchor="end">• مشترکہ زبانی داستان گوئی</text><text x="736.1" y="136" class="item" text-anchor="end">• خاندانی خطوط اور ڈیرائی رقم</text><text x="736.1" y="154" class="item" text-anchor="end">• دوا کے لیبل اور بل</text><line x1="321.75" y1="210" x2="195" y2="150" class="link" marker-end="url(#arr)"/><rect class="box" x="9.75" y="70" width="263.25" height="100" rx="6"/><text x="258.4" y="96" class="domain" text-anchor="end">اسکول اور کالج</text><text x="258.4" y="118" class="item" text-anchor="end">• تجویز شدہ درسی کتابیں</text><text x="258.4" y="136" class="item" text-anchor="end">• بورڈ امتحانی اسکرپٹیں</text><text x="258.4" y="154" class="item" text-anchor="end">• رسمی تعلیمی مضامین</text><line x1="390" y1="290" x2="390" y2="350" class="link" marker-end="url(#arr)"/><rect class="box" x="263.25" y="360" width="238.88" height="100" rx="6"/><text x="487.5" y="386" class="domain" text-anchor="end">مذہبی اور شہری جگہیں</text><text x="487.5" y="408" class="item" text-anchor="end">• مقدس متن کی تلاوت اور تفسیر</text><text x="487.5" y="426" class="item" text-anchor="end">• برادری کے نوٹسز اور فہرستیں</text><text x="487.5" y="444" class="item" text-anchor="end">• شاعری کے اجتماع (مشاعرہ)</text><line x1="468" y1="290" x2="594.75" y2="350" class="link" marker-end="url(#arr)"/><rect class="box" x="516.75" y="340" width="234" height="100" rx="6"/><text x="736.1" y="366" class="domain" text-anchor="end">بازار اور تجارت</text><text x="736.1" y="388" class="item" text-anchor="end">• دکان کے کھاتے (کھاتا)</text><text x="736.1" y="406" class="item" text-anchor="end">• ہاتھ کی رسیدیں اور قیمت کے بورڈ</text><text x="736.1" y="424" class="item" text-anchor="end">• موبائل والیٹ کے ادائیگی کے پیغامات</text><line x1="312" y1="290" x2="185.25" y2="350" class="link" marker-end="url(#arr)"/><rect class="box" x="9.75" y="340" width="263.25" height="100" rx="6"/><text x="258.4" y="366" class="domain" text-anchor="end">کام کی جگہ اور حکمرانی</text><text x="258.4" y="388" class="item" text-anchor="end">• ملازمت کے معاہدے</text><text x="258.4" y="406" class="item" text-anchor="end">• زمین کے ریکارڈ (فرد / کھاتونی)</text><text x="258.4" y="424" class="item" text-anchor="end">• سرکاری شناختی کارڈ کے فارم</text><text x="770" y="505" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
