<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t4 d4" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t4">پاکستانی شاگرد کی تعلیم میں زبانیں</title><desc id="d4">پاکستانی شاگرد کی زندگی میں گھریلو زبان، اردو، اور انگریزی کا بنیادی شعبوں، کلاس روم کے کردار، اور خواندگی کی نشوونما میں حصے کے لحاظ سے موازنہ کرنے والا جدول۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.th{fill:var(--a1-fill);stroke:var(--line);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--muted);stroke-width:1}.alt-cell{fill:var(--panel);stroke:var(--muted);stroke-width:1}.banner{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.col-head{font-size:12px;font-weight:700}.row-lbl{font-size:13px;font-weight:700}.txt{font-size:11px}.banner-txt{font-size:13px;font-weight:600}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><text x="756.2" y="32" class="h" text-anchor="end">پاکستانی شاگرد کی خواندگی کے سفر میں زبانیں</text><text x="756.2" y="52" class="sub" text-anchor="end">کلاس روم کے عمل میں مادری زبانوں، قومی زبان، اور عالمی رسائی کا توازن</text><rect class="th" x="599.27" y="70" width="156.95" height="40"/><text x="678.2" y="95" class="col-head" text-anchor="middle">زبانی سطح</text><rect class="th" x="413.78" y="70" width="185.49" height="40"/><text x="507.0" y="95" class="col-head" text-anchor="middle">روزمرہ کے شعبے</text><rect class="th" x="199.76" y="70" width="214.02" height="40"/><text x="307.2" y="95" class="col-head" text-anchor="middle">خواندگی کی نشوونما میں کردار</text><rect class="th" x="23.78" y="70" width="175.98" height="40"/><text x="112.2" y="95" class="col-head" text-anchor="middle">کلاس روم کی حکمت عملی</text><rect class="cell" x="599.27" y="110" width="156.95" height="85"/><text x="746.7" y="136" class="row-lbl" text-anchor="end">علاقائی زبان /</text><text x="746.7" y="154" class="row-lbl" text-anchor="end">مادری زبان</text><text x="746.7" y="174" class="sub" text-anchor="end">(سندھی، پشتو، وغیرہ)</text><rect class="cell" x="413.78" y="110" width="185.49" height="85"/><text x="589.8" y="136" class="txt" text-anchor="end">گھر، خاندانی رشتے،</text><text x="589.8" y="154" class="txt" text-anchor="end">محلہ، مقامی بازار،</text><text x="589.8" y="172" class="txt" text-anchor="end">اور ثقافتی اجتماعات۔</text><rect class="cell" x="199.76" y="110" width="214.02" height="85"/><text x="404.3" y="136" class="txt" text-anchor="end">ابتدائی سوچ کی بنیاد،</text><text x="404.3" y="154" class="txt" text-anchor="end">تصور سازی، زبانی روانی،</text><text x="404.3" y="172" class="txt" text-anchor="end">اور ابتدائی آوازی شعور۔</text><rect class="cell" x="23.78" y="110" width="175.98" height="85"/><text x="190.2" y="136" class="txt" text-anchor="end">مادری زبان کی ہدایات</text><text x="190.2" y="154" class="txt" text-anchor="end">ابتدائی جماعتوں میں؛ زبانی</text><text x="190.2" y="172" class="txt" text-anchor="end">نئے خیالات کے لیے معاونتی تدریس۔</text><rect class="alt-cell" x="599.27" y="195" width="156.95" height="85"/><text x="746.7" y="225" class="row-lbl" text-anchor="end">قومی زبان</text><text x="746.7" y="245" class="sub" text-anchor="end">(اردو)</text><rect class="alt-cell" x="413.78" y="195" width="185.49" height="85"/><text x="589.8" y="221" class="txt" text-anchor="end">بین الصوبائی تجارت،</text><text x="589.8" y="239" class="txt" text-anchor="end">قومی خبریں، نشریاتی میڈیا،</text><text x="589.8" y="257" class="txt" text-anchor="end">اور شہری مواصلت۔</text><rect class="alt-cell" x="199.76" y="195" width="214.02" height="85"/><text x="404.3" y="221" class="txt" text-anchor="end">متحدہ مشترکہ زبان؛</text><text x="404.3" y="239" class="txt" text-anchor="end">مقامی گفتگو کو وسیع قومی</text><text x="404.3" y="257" class="txt" text-anchor="end">اشاعتی ثقافت اور متون سے جوڑتی ہے۔</text><rect class="alt-cell" x="23.78" y="195" width="175.98" height="85"/><text x="190.2" y="221" class="txt" text-anchor="end">منظم پڑھنے اور</text><text x="190.2" y="239" class="txt" text-anchor="end">لکھنے کی ہدایات تمام</text><text x="190.2" y="257" class="txt" text-anchor="end">پرائمری جماعتوں میں۔</text><rect class="cell" x="599.27" y="280" width="156.95" height="85"/><text x="746.7" y="310" class="row-lbl" text-anchor="end">سرکاری / عالمی</text><text x="746.7" y="330" class="row-lbl" text-anchor="end">زبان (انگریزی)</text><rect class="cell" x="413.78" y="280" width="185.49" height="85"/><text x="589.8" y="306" class="txt" text-anchor="end">اعلیٰ تعلیم، سول سروس،</text><text x="589.8" y="324" class="txt" text-anchor="end">رسمی قانون، سائنس، اور</text><text x="589.8" y="342" class="txt" text-anchor="end">بین الاقوامی ڈیجیٹل میڈیا۔</text><rect class="cell" x="199.76" y="280" width="214.02" height="85"/><text x="404.3" y="306" class="txt" text-anchor="end">تعلیمی ڈگریوں کے لیے اہم</text><text x="404.3" y="324" class="txt" text-anchor="end">دروازہ بان، عالمی معلومات،</text><text x="404.3" y="342" class="txt" text-anchor="end">اور پیشہ ورانہ ملازمت۔</text><rect class="cell" x="23.78" y="280" width="175.98" height="85"/><text x="190.2" y="306" class="txt" text-anchor="end">واضح زبان ہدایات؛</text><text x="190.2" y="324" class="txt" text-anchor="end">سزا دہ زبانی غوطے سے پرہیز کریں؛</text><text x="190.2" y="342" class="txt" text-anchor="end">دو لسانی الفاظ کے جدول استعمال کریں۔</text><rect class="banner" x="23.78" y="375" width="732.44" height="50" rx="6"/><text x="390.0" y="396" class="banner-txt" text-anchor="middle">تدریسی اصل: اضافی کثیر لسانیت اور لچکدار بین اللسانی عمل متعلمین کو اپنا</text><text x="390.0" y="414" class="banner-txt" text-anchor="middle">مکمل لسانی ذخیرہ استعمال کرنے کی اجازت دیتے ہیں، گھریلو زبانوں کو تعلیمی کامیابی سے جوڑتے ہیں۔</text><text x="12" y="460" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
