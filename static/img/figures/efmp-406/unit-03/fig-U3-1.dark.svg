<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t1">Literacy Practices in Community Domains</title><desc id="d1">Concept map linking diverse everyday literacy practices across home, school, religious institutions, market and workplace in a Pakistani community.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.box{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.link{fill:none;stroke:var(--line);stroke-width:2}.ah{fill:var(--line)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.sub{font-size:13px;fill:var(--muted)}.domain{font-size:15px;font-weight:700}.item{font-size:13px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="800" height="520"/><text x="30" y="34" class="h" text-anchor="start">Literacy Practices in Community Domains</text><text x="30" y="54" class="sub" text-anchor="start">Reading and writing take varied forms across everyday Pakistani social institutions</text><rect class="accent" x="270" y="210" width="260" height="80" rx="10"/><text x="400" y="242" class="domain" text-anchor="middle">Literacy as Social Practice</text><text x="400" y="264" class="item" text-anchor="middle">Culturally situated ways of reading,</text><text x="400" y="280" class="item" text-anchor="middle">writing, and making shared meaning</text><line x1="330" y1="210" x2="200" y2="150" class="link" marker-end="url(#arr)"/><rect class="box" x="30" y="70" width="210" height="100" rx="6"/><text x="45" y="96" class="domain" text-anchor="start">Home and Family</text><text x="45" y="118" class="item" text-anchor="start">• Shared oral storytelling</text><text x="45" y="136" class="item" text-anchor="start">• Family letters and remittances</text><text x="45" y="154" class="item" text-anchor="start">• Medicine labels and bills</text><line x1="470" y1="210" x2="600" y2="150" class="link" marker-end="url(#arr)"/><rect class="box" x="560" y="70" width="210" height="100" rx="6"/><text x="575" y="96" class="domain" text-anchor="start">School and College</text><text x="575" y="118" class="item" text-anchor="start">• Prescribed textbooks</text><text x="575" y="136" class="item" text-anchor="start">• Board exam scripts</text><text x="575" y="154" class="item" text-anchor="start">• Formal academic essays</text><line x1="400" y1="290" x2="400" y2="350" class="link" marker-end="url(#arr)"/><rect class="box" x="285" y="360" width="230" height="100" rx="6"/><text x="300" y="386" class="domain" text-anchor="start">Religious and Civic Spaces</text><text x="300" y="408" class="item" text-anchor="start">• Sacred text recitation and tafsir</text><text x="300" y="426" class="item" text-anchor="start">• Community notices and rosters</text><text x="300" y="444" class="item" text-anchor="start">• Poetry gatherings (mushaira)</text><line x1="320" y1="290" x2="190" y2="350" class="link" marker-end="url(#arr)"/><rect class="box" x="30" y="340" width="210" height="100" rx="6"/><text x="45" y="366" class="domain" text-anchor="start">Market and Commerce</text><text x="45" y="388" class="item" text-anchor="start">• Shop ledgers (khata)</text><text x="45" y="406" class="item" text-anchor="start">• Hand receipts and price boards</text><text x="45" y="424" class="item" text-anchor="start">• Mobile wallet payment texts</text><line x1="480" y1="290" x2="610" y2="350" class="link" marker-end="url(#arr)"/><rect class="box" x="560" y="340" width="210" height="100" rx="6"/><text x="575" y="366" class="domain" text-anchor="start">Workplace and Governance</text><text x="575" y="388" class="item" text-anchor="start">• Employment contracts</text><text x="575" y="406" class="item" text-anchor="start">• Land records (fard / khatooni)</text><text x="575" y="424" class="item" text-anchor="start">• Official identity card forms</text><text x="770" y="505" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>