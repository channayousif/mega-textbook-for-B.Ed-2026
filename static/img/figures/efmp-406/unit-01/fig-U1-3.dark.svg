<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of literacy practices from oral tradition through manuscript, print and mass schooling to screens</title><desc id="d">Timeline of literacy practices from oral tradition through manuscript, print and mass schooling to screens, with a dashed line showing that older practices continue alongside newer ones.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { stroke: var(--ink); stroke-width: 2.5; fill: none; } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="26" y="34">1.2 Literacy practices over time</text><text class="muted" x="390" y="73" text-anchor="middle">approximate order, not to scale</text><path class="link" d="M26 104 H754" marker-end="url(#arrow)"/><path class="link" d="M94 96 V140 M242 96 V140 M390 96 V140 M538 96 V140 M686 96 V140"/><rect class="panel" x="26" y="140" width="136" height="176" rx="6"/><text class="sh" x="38" y="165">Oral tradition</text><text class="ink" x="38" y="213"><tspan x="38">Stories, poetry</tspan><tspan x="38" dy="18">and knowledge</tspan><tspan x="38" dy="18">memorised</tspan><tspan x="38" dy="18">and spoken</tspan></text><rect class="panel" x="174" y="140" width="136" height="176" rx="6"/><text class="sh" x="186" y="165">Manuscript</text><text class="ink" x="186" y="213"><tspan x="186">Hand-copied</tspan><tspan x="186" dy="18">books, scribes</tspan><tspan x="186" dy="18">and</tspan><tspan x="186" dy="18">calligraphers</tspan></text><rect class="panel" x="322" y="140" width="136" height="176" rx="6"/><text class="sh" x="334" y="165">Print</text><text class="ink" x="334" y="213"><tspan x="334">Printed books</tspan><tspan x="334" dy="18">and newspapers</tspan><tspan x="334" dy="18">reach many</tspan><tspan x="334" dy="18">readers</tspan></text><rect class="panel" x="470" y="140" width="136" height="176" rx="6"/><text class="sh" x="482" y="165"><tspan x="482">Mass</tspan><tspan x="482" dy="18">schooling</tspan></text><text class="ink" x="482" y="213"><tspan x="482">Every child</tspan><tspan x="482" dy="18">reads, writes;</tspan><tspan x="482" dy="18">literacy</tspan><tspan x="482" dy="18">counted in</tspan><tspan x="482" dy="18">censuses</tspan></text><rect class="panel" x="618" y="140" width="136" height="176" rx="6"/><text class="sh" x="630" y="165">Screens</text><text class="ink" x="630" y="213"><tspan x="630">Phones,</tspan><tspan x="630" dy="18">messages,</tspan><tspan x="630" dy="18">images</tspan><tspan x="630" dy="18">and video</tspan></text><path class="link" d="M26 341 V355 H754 V341" stroke-dasharray="7 5"/><text class="muted" x="390" y="389" text-anchor="middle">older practices continue alongside newer ones</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
