<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of literacy across the life course as a rising spiral through childhood, school, work, community and older age</title><desc id="d">Diagram of literacy across the life course as a rising spiral through childhood, school, work, community and older age, with an arrow showing that learning continues.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="32" y="34">Literacy across the life course</text><path class="link" d="M300,390 C300,430 480,430 480,320 C480,290 300,350 300,250 C300,220 480,280 480,180 C480,150 300,210 300,110 C300,65 450,100 450,48" marker-end="url(#arrow)"/><text class="ink" x="478" y="62">learning continues</text><circle class="panel" cx="300" cy="390" r="9"/><text class="h" x="36" y="378">Childhood</text><text class="muted" x="36" y="399">Stories and first</text><text class="muted" x="36" y="416">letters at home</text><circle class="panel" cx="480" cy="320" r="9"/><text class="h" x="510" y="316">School</text><text class="muted" x="510" y="337">Reading to learn</text><circle class="panel" cx="300" cy="250" r="9"/><text class="h" x="36" y="238">Work</text><text class="muted" x="36" y="259">Forms, instructions,</text><text class="muted" x="36" y="276">messages</text><circle class="panel" cx="480" cy="180" r="9"/><text class="h" x="510" y="176">Community</text><text class="muted" x="510" y="197">Notices, news, voting</text><circle class="panel" cx="300" cy="110" r="9"/><text class="h" x="36" y="98">Older age</text><text class="muted" x="36" y="119">Medicine labels,</text><text class="muted" x="36" y="136">phone messages,</text><text class="muted" x="36" y="153">teaching grandchildren</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
