<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خواندگی کا تصوری نقشہ</title><desc id="d">تصوری نقشے کے مرکز میں خواندگی ہے: پڑھنا، لکھنا اور حسابی صلاحیت بطور مہارتیں جڑے ہیں، جبکہ مطلب سمجھنا اور سماجی عمل ان مہارتوں کے استعمال اور مقاصد کے طور پر جڑے ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 2.5; } .ink { font-size: 16px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { font-size: 11px; fill: var(--wm); } .ah { fill: var(--ink); } .centre { fill: var(--a1-fill); stroke: var(--ink); stroke-width: 2.5; } .dashed { stroke-dasharray: 7 5; } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="470" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="40" y="24" width="700" height="38" rx="4" transform="translate(780 0) scale(-1 1)" /><text class="h" x="390" y="49" text-anchor="middle">مہارتیں</text><path class="link" d="M160,144 L310,210" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><path class="link" d="M390,144 L390,205" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><path class="link" d="M620,144 L470,210" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="60" y="92" width="200" height="52" rx="6" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="290" y="92" width="200" height="52" rx="6" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="520" y="92" width="200" height="52" rx="6" transform="translate(780 0) scale(-1 1)" /><text class="ink" x="620" y="124" text-anchor="middle">پڑھنا</text><text class="ink" x="390" y="124" text-anchor="middle">لکھنا</text><text class="ink" x="160" y="124" text-anchor="middle">حسابی صلاحیت</text><rect class="centre" x="290" y="205" width="200" height="58" rx="26" transform="translate(780 0) scale(-1 1)" /><text class="h" x="390" y="240" text-anchor="middle">خواندگی</text><path class="link dashed" d="M305,258 L215,330" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><path class="link dashed" d="M475,258 L565,330" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="265" y="280" width="250" height="34" rx="4" transform="translate(780 0) scale(-1 1)" /><text class="h" x="390" y="302" text-anchor="middle">استعمال اور مقاصد</text><rect class="panel" x="55" y="332" width="320" height="64" rx="6" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="405" y="332" width="320" height="64" rx="6" transform="translate(780 0) scale(-1 1)" /><text class="ink" x="565" y="357" text-anchor="middle"><tspan x="565">مطلب سمجھنا</tspan><tspan x="565" dy="20">متون سے</tspan></text><text class="ink" x="215" y="357" text-anchor="middle"><tspan x="215">سماجی عمل: متون کا</tspan><tspan x="215" dy="20">روزمرہ زندگی میں استعمال</tspan></text><text class="muted" x="390" y="429" text-anchor="middle">مہارتیں ذرائع ہیں؛ طریقے ان سے کیے جانے والے کام ہیں</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
