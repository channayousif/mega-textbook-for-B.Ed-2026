<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زندگی کے مراحل میں خواندگی</title><desc id="d">خاکہ زندگی بھر کی خواندگی کو اوپر اٹھتے بل دار راستے کی صورت میں بچپن، اسکول، کام، برادری اور بڑھاپے سے گزرتا دکھاتا ہے: تیر بتاتا ہے کہ سیکھنا جاری رہتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="470" transform="translate(780 0) scale(-1 1)" /><text class="h" x="748" y="34" text-anchor="end">زندگی کے مراحل میں خواندگی</text><path class="link" d="M300,390 C300,430 480,430 480,320 C480,290 300,350 300,250 C300,220 480,280 480,180 C480,150 300,210 300,110 C300,65 450,100 450,48" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><text class="ink" x="302" y="62" text-anchor="end">سیکھنا جاری رہتا ہے</text><circle class="panel" cx="300" cy="390" r="9" transform="translate(780 0) scale(-1 1)" /><text class="h" x="744" y="378" text-anchor="end">بچپن</text><text class="muted" x="744" y="399" text-anchor="end">گھر میں کہانیاں اور</text><text class="muted" x="744" y="416" text-anchor="end">ابتدائی حروف</text><circle class="panel" cx="480" cy="320" r="9" transform="translate(780 0) scale(-1 1)" /><text class="h" x="270" y="316" text-anchor="end">اسکول</text><text class="muted" x="270" y="337" text-anchor="end">سیکھنے کے لیے پڑھنا</text><circle class="panel" cx="300" cy="250" r="9" transform="translate(780 0) scale(-1 1)" /><text class="h" x="744" y="238" text-anchor="end">کام</text><text class="muted" x="744" y="259" text-anchor="end">فارم، ہدایات،</text><text class="muted" x="744" y="276" text-anchor="end">پیغامات</text><circle class="panel" cx="480" cy="180" r="9" transform="translate(780 0) scale(-1 1)" /><text class="h" x="270" y="176" text-anchor="end">برادری</text><text class="muted" x="270" y="197" text-anchor="end">نوٹس، خبریں، ووٹ دینا</text><circle class="panel" cx="300" cy="110" r="9" transform="translate(780 0) scale(-1 1)" /><text class="h" x="744" y="98" text-anchor="end">بڑھاپا</text><text class="muted" x="744" y="119" text-anchor="end">دواؤں کے لیبل،</text><text class="muted" x="744" y="136" text-anchor="end">فون کے پیغامات،</text><text class="muted" x="744" y="153" text-anchor="end">پوتے پوتیوں کو پڑھانا</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
