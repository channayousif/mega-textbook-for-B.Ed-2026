<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1.2 وقت کے ساتھ خواندگی کے طریقے</title><desc id="d">خواندگی کے طریقوں کی خطِ وقت زبانی روایت سے مخطوطے، طباعت اور عام اسکولی تعلیم کے ذریعے اسکرینوں تک جاتی ہے: ٹوٹی لکیر دکھاتی ہے کہ پرانے طریقے نئے طریقوں کے ساتھ جاری رہتے ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { stroke: var(--ink); stroke-width: 2.5; fill: none; } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah" /></marker></defs><rect class="bg" x="0" y="0" width="780" height="470" transform="translate(780 0) scale(-1 1)" /><text class="h" x="754" y="34" text-anchor="end">1.2 وقت کے ساتھ خواندگی کے طریقے</text><text class="muted" x="390" y="73" text-anchor="middle">تخمینی ترتیب، پیمانے کے مطابق نہیں</text><path class="link" d="M26 104 H754" marker-end="url(#arrow)" transform="translate(780 0) scale(-1 1)" /><path class="link" d="M94 96 V140 M242 96 V140 M390 96 V140 M538 96 V140 M686 96 V140" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="26" y="140" width="136" height="176" rx="6" transform="translate(780 0) scale(-1 1)" /><text class="sh" x="742" y="165" text-anchor="end">زبانی روایت</text><text class="ink" x="742" y="213" text-anchor="end"><tspan x="742">کہانیاں، شاعری</tspan><tspan x="742" dy="20">اور علم</tspan><tspan x="742" dy="20">یاد کیے جاتے</tspan><tspan x="742" dy="20">اور سنائے جاتے</tspan></text><rect class="panel" x="174" y="140" width="136" height="176" rx="6" transform="translate(780 0) scale(-1 1)" /><text class="sh" x="594" y="165" text-anchor="end">مخطوطہ</text><text class="ink" x="594" y="213" text-anchor="end"><tspan x="594">ہاتھ سے نقل</tspan><tspan x="594" dy="20">کی گئی کتابیں،</tspan><tspan x="594" dy="20">کاتب اور</tspan><tspan x="594" dy="20">خطاط</tspan></text><rect class="panel" x="322" y="140" width="136" height="176" rx="6" transform="translate(780 0) scale(-1 1)" /><text class="sh" x="446" y="165" text-anchor="end">طباعت</text><text class="ink" x="446" y="213" text-anchor="end"><tspan x="446">چھپی کتابیں</tspan><tspan x="446" dy="20">اور اخبار</tspan><tspan x="446" dy="20">بہت سے قاریوں</tspan><tspan x="446" dy="20">تک پہنچتے ہیں</tspan></text><rect class="panel" x="470" y="140" width="136" height="176" rx="6" transform="translate(780 0) scale(-1 1)" /><text class="sh" x="298" y="165" text-anchor="end"><tspan x="298">عام اسکولی</tspan><tspan x="298" dy="20">تعلیم</tspan></text><text class="ink" x="298" y="213" text-anchor="end"><tspan x="298">ہر بچہ پڑھتا</tspan><tspan x="298" dy="20">اور لکھتا ہے؛</tspan><tspan x="298" dy="20">خواندگی کی</tspan><tspan x="298" dy="20">گنتی مردم</tspan><tspan x="298" dy="20">شماری میں</tspan></text><rect class="panel" x="618" y="140" width="136" height="176" rx="6" transform="translate(780 0) scale(-1 1)" /><text class="sh" x="150" y="165" text-anchor="end">اسکرینیں</text><text class="ink" x="150" y="213" text-anchor="end"><tspan x="150">فون،</tspan><tspan x="150" dy="20">پیغامات،</tspan><tspan x="150" dy="20">تصاویر</tspan><tspan x="150" dy="20">اور ویڈیو</tspan></text><path class="link" d="M26 341 V355 H754 V341" stroke-dasharray="7 5" transform="translate(780 0) scale(-1 1)" /><text class="muted" x="390" y="389" text-anchor="middle">پرانے طریقے نئے طریقوں کے ساتھ جاری رہتے ہیں</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
