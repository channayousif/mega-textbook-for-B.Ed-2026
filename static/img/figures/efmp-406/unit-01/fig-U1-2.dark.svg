<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing the traditional and contemporary views of literacy</title><desc id="d">Table comparing the traditional and contemporary views of literacy on what counts as literacy, where it is learned, how it is measured and who counts as literate.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="32">1.1 Views of literacy</text><rect class="panel" x="24" y="54" width="732" height="56"/><rect class="panel" x="24" y="110" width="190" height="80"/><rect class="panel" x="24" y="190" width="190" height="80"/><rect class="panel" x="24" y="270" width="190" height="80"/><rect class="panel" x="24" y="350" width="190" height="80"/><path class="link" d="M214 54V430 M448 54V430 M756 110V430H214 M214 190H756 M214 270H756 M214 350H756"/><text class="h" x="36" y="87">Aspect</text><text class="h" x="226" y="87">Traditional view</text><text class="h" x="460" y="87">Contemporary view</text><text class="row" x="36" y="142">What counts<tspan x="36" dy="17">as literacy</tspan></text><text class="ink" x="226" y="142">Decoding and<tspan x="226" dy="17">writing print</tspan></text><text class="ink" x="460" y="133">Using print, images and<tspan x="460" dy="17">screens for real purposes</tspan></text><text class="row" x="36" y="222">Where it is<tspan x="36" dy="17">learned</tspan></text><text class="ink" x="226" y="222">In school, once</text><text class="ink" x="460" y="213">At home, school, work and<tspan x="460" dy="17">community, throughout life</tspan></text><text class="row" x="36" y="302">How it is<tspan x="36" dy="17">measured</tspan></text><text class="ink" x="226" y="302">Signing a name or<tspan x="226" dy="17">passing a reading test</tspan></text><text class="ink" x="460" y="293">What a person can do with<tspan x="460" dy="17">texts in their own life</tspan></text><text class="row" x="36" y="382">Who is literate</text><text class="ink" x="226" y="382">A yes-or-no label</text><text class="ink" x="460" y="373">Everyone has some literacies,<tspan x="460" dy="17">at different levels</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
