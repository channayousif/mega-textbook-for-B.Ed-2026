<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1.1 خواندگی کے نقطۂ نظر</title><desc id="d">جدول میں خواندگی کے روایتی اور عصری نقطۂ نظر کا موازنہ ہے: خواندگی کسے کہتے ہیں، کہاں سیکھی جاتی ہے، کیسے ناپی جاتی ہے اور کسے خواندہ سمجھا جاتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="470" transform="translate(780 0) scale(-1 1)" /><text class="h" x="756" y="32" text-anchor="end">1.1 خواندگی کے نقطۂ نظر</text><rect class="panel" x="24" y="54" width="732" height="56" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="24" y="110" width="190" height="80" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="24" y="190" width="190" height="80" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="24" y="270" width="190" height="80" transform="translate(780 0) scale(-1 1)" /><rect class="panel" x="24" y="350" width="190" height="80" transform="translate(780 0) scale(-1 1)" /><path class="link" d="M214 54V430 M448 54V430 M756 110V430H214 M214 190H756 M214 270H756 M214 350H756" transform="translate(780 0) scale(-1 1)" /><text class="h" x="744" y="87" text-anchor="end">پہلو</text><text class="h" x="554" y="87" text-anchor="end">روایتی نقطۂ نظر</text><text class="h" x="320" y="87" text-anchor="end">عصری نقطۂ نظر</text><text class="row" x="744" y="142" text-anchor="end">خواندگی کسے<tspan x="744" dy="20">کہتے ہیں</tspan></text><text class="ink" x="554" y="142" text-anchor="end">علامتیں پڑھنا اور<tspan x="554" dy="20">چھپی تحریر لکھنا</tspan></text><text class="ink" x="320" y="133" text-anchor="end">حقیقی مقاصد کے لیے طباعت، تصاویر<tspan x="320" dy="20">اور اسکرینوں کا استعمال</tspan></text><text class="row" x="744" y="222" text-anchor="end">کہاں سیکھی<tspan x="744" dy="20">جاتی ہے</tspan></text><text class="ink" x="554" y="222" text-anchor="end">اسکول میں، ایک بار</text><text class="ink" x="320" y="213" text-anchor="end">گھر، اسکول، کام اور برادری میں،<tspan x="320" dy="20">پوری زندگی</tspan></text><text class="row" x="744" y="302" text-anchor="end">کیسے ناپی<tspan x="744" dy="20">جاتی ہے</tspan></text><text class="ink" x="554" y="302" text-anchor="end">دستخط کرنا یا<tspan x="554" dy="20">پڑھنے کی آزمائش پاس کرنا</tspan></text><text class="ink" x="320" y="293" text-anchor="end">شخص اپنی زندگی کے متون سے<tspan x="320" dy="20">کیا کر سکتا ہے</tspan></text><text class="row" x="744" y="382" text-anchor="end">کون خواندہ ہے</text><text class="ink" x="554" y="382" text-anchor="end">ہاں یا نہیں کا ٹھپا</text><text class="ink" x="320" y="373" text-anchor="end">ہر شخص کی کچھ خواندگیاں ہیں،<tspan x="320" dy="20">مختلف سطحوں پر</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
