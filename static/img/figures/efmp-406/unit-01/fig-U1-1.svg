<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with literacy at the centre</title><desc id="d">Concept map with literacy at the centre: reading, writing and numeracy are linked as skills, and making meaning and social practice are linked as the uses and purposes those skills serve.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 2.5; } .ink { font-size: 16px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { font-size: 11px; fill: var(--wm); } .ah { fill: var(--ink); } .centre { fill: var(--a1-fill); stroke: var(--ink); stroke-width: 2.5; } .dashed { stroke-dasharray: 7 5; } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="40" y="24" width="700" height="38" rx="4"/><text class="h" x="390" y="49" text-anchor="middle">skills</text><path class="link" d="M160,144 L310,210" marker-end="url(#arrow)"/><path class="link" d="M390,144 L390,205" marker-end="url(#arrow)"/><path class="link" d="M620,144 L470,210" marker-end="url(#arrow)"/><rect class="panel" x="60" y="92" width="200" height="52" rx="6"/><rect class="panel" x="290" y="92" width="200" height="52" rx="6"/><rect class="panel" x="520" y="92" width="200" height="52" rx="6"/><text class="ink" x="160" y="124" text-anchor="middle">reading</text><text class="ink" x="390" y="124" text-anchor="middle">writing</text><text class="ink" x="620" y="124" text-anchor="middle">numeracy</text><rect class="centre" x="290" y="205" width="200" height="58" rx="26"/><text class="h" x="390" y="240" text-anchor="middle">literacy</text><path class="link dashed" d="M305,258 L215,330" marker-end="url(#arrow)"/><path class="link dashed" d="M475,258 L565,330" marker-end="url(#arrow)"/><rect class="panel" x="265" y="280" width="250" height="34" rx="4"/><text class="h" x="390" y="302" text-anchor="middle">uses and purposes</text><rect class="panel" x="55" y="332" width="320" height="64" rx="6"/><rect class="panel" x="405" y="332" width="320" height="64" rx="6"/><text class="ink" x="215" y="357" text-anchor="middle"><tspan x="215">making meaning</tspan><tspan x="215" dy="20">from texts</tspan></text><text class="ink" x="565" y="357" text-anchor="middle"><tspan x="565">social practice: using</tspan><tspan x="565" dy="20">texts in daily life</tspan></text><text class="muted" x="390" y="429" text-anchor="middle">skills are the tools; practices are what people do with them</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
