<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1.1 خواندگی کے نقطۂ نظر</title><desc id="d">جدول میں خواندگی کے روایتی اور عصری نقطۂ نظر کا موازنہ ہے: خواندگی کسے کہتے ہیں، کہاں سیکھی جاتی ہے، کیسے ناپی جاتی ہے اور کسے خواندہ سمجھا جاتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1.5; } text { font-size: 14px; fill: var(--ink); } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .row { font-size: 14px; font-weight: 600; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="470" /><text class="h" x="756" y="32" text-anchor="end">1.1 خواندگی کے نقطۂ نظر</text><rect class="panel" x="24" y="54" width="732" height="56" /><rect class="panel" x="566" y="110" width="190" height="80" /><rect class="panel" x="566" y="190" width="190" height="80" /><rect class="panel" x="566" y="270" width="190" height="80" /><rect class="panel" x="566" y="350" width="190" height="80" /><path class="link" d="M566 54V430 M332 54V430 M24 110V430H566 M566 190H24 M566 270H24 M566 350H24" /><text class="h" x="744" y="87" text-anchor="end">پہلو</text><text class="h" x="554" y="87" text-anchor="end">روایتی نقطۂ نظر</text><text class="h" x="320" y="87" text-anchor="end">عصری نقطۂ نظر</text><text class="row" x="744" y="142" text-anchor="end">خواندگی کسے<tspan x="744" dy="20">کہتے ہیں</tspan></text><text class="ink" x="554" y="142" text-anchor="end">علامتیں پڑھنا اور<tspan x="554" dy="20">چھپی تحریر لکھنا</tspan></text><text class="ink" x="320" y="133" text-anchor="end">حقیقی مقاصد کے لیے طباعت، تصاویر<tspan x="320" dy="20">اور اسکرینوں کا استعمال</tspan></text><text class="row" x="744" y="222" text-anchor="end">کہاں سیکھی<tspan x="744" dy="20">جاتی ہے</tspan></text><text class="ink" x="554" y="222" text-anchor="end">اسکول میں، ایک بار</text><text class="ink" x="320" y="213" text-anchor="end">گھر، اسکول، کام اور برادری میں،<tspan x="320" dy="20">پوری زندگی</tspan></text><text class="row" x="744" y="302" text-anchor="end">کیسے ناپی<tspan x="744" dy="20">جاتی ہے</tspan></text><text class="ink" x="554" y="302" text-anchor="end">دستخط کرنا یا<tspan x="554" dy="20">پڑھنے کی آزمائش پاس کرنا</tspan></text><text class="ink" x="320" y="293" text-anchor="end">شخص اپنی زندگی کے متون سے<tspan x="320" dy="20">کیا کر سکتا ہے</tspan></text><text class="row" x="744" y="382" text-anchor="end">کون خواندہ ہے</text><text class="ink" x="554" y="382" text-anchor="end">ہاں یا نہیں کا ٹھپا</text><text class="ink" x="320" y="373" text-anchor="end">ہر شخص کی کچھ خواندگیاں ہیں،<tspan x="320" dy="20">مختلف سطحوں پر</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
