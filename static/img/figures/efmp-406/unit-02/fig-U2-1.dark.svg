<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Critical and digital literacy compared</title><desc id="d">Critical literacy asks whose interests a message serves, while digital literacy includes purposeful and responsible use of digital tools. Both involve judging meaning.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.label{font-size:16px}.support{font-size:14px}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="20" y="32" text-anchor="start"><tspan x="20" dy="0">Two forms of literacy</tspan></text><rect class="panel" x="20" y="55" width="150" height="55" rx="10"/><text class="h" x="32" y="89" text-anchor="start"><tspan x="32" dy="0">Reader focus</tspan></text><rect class="panel" x="180" y="55" width="280" height="55" rx="10"/><text class="h" x="192" y="89" text-anchor="start"><tspan x="192" dy="0">Critical literacy</tspan></text><rect class="panel" x="470" y="55" width="290" height="55" rx="10"/><text class="h" x="482" y="89" text-anchor="start"><tspan x="482" dy="0">Digital literacy</tspan></text><rect class="panel" x="20" y="122" width="150" height="90" rx="10"/><rect class="panel" x="180" y="122" width="280" height="90" rx="10"/><rect class="panel" x="470" y="122" width="290" height="90" rx="10"/><text class="label" x="32" y="155" text-anchor="start"><tspan x="32" dy="0">Questions</tspan></text><text class="label" x="192" y="155" text-anchor="start"><tspan x="192" dy="0">Whose interests?</tspan><tspan x="192" dy="24">Whose voice is missing?</tspan></text><text class="label" x="482" y="155" text-anchor="start"><tspan x="482" dy="0">What is my purpose?</tspan><tspan x="482" dy="24">How should I use this tool?</tspan></text><rect class="panel" x="20" y="222" width="150" height="90" rx="10"/><rect class="panel" x="180" y="222" width="280" height="90" rx="10"/><rect class="panel" x="470" y="222" width="290" height="90" rx="10"/><text class="label" x="32" y="255" text-anchor="start"><tspan x="32" dy="0">Classroom task</tspan></text><text class="label" x="192" y="255" text-anchor="start"><tspan x="192" dy="0">Examine an app claim</tspan><tspan x="192" dy="24">and revise unfair wording</tspan></text><text class="label" x="482" y="255" text-anchor="start"><tspan x="482" dy="0">Make and share a clear,</tspan><tspan x="482" dy="24">accessible school notice</tspan></text><rect class="panel" x="20" y="322" width="150" height="90" rx="10"/><rect class="panel" x="180" y="322" width="280" height="90" rx="10"/><rect class="panel" x="470" y="322" width="290" height="90" rx="10"/><text class="label" x="32" y="355" text-anchor="start"><tspan x="32" dy="0">Common pitfall</tspan></text><text class="label" x="192" y="355" text-anchor="start"><tspan x="192" dy="0">Rejecting a message</tspan><tspan x="192" dy="24">without examining it</tspan></text><text class="label" x="482" y="355" text-anchor="start"><tspan x="482" dy="0">Operating a device</tspan><tspan x="482" dy="24">without judging meaning</tspan></text><text class="support" x="20" y="443" text-anchor="start"><tspan x="20" dy="0">Both involve judging meaning.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
