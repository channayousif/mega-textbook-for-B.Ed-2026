<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Modes and design choices in a book-exchange message</title><desc id="d">Words state the exchange rule, an image shows a swap, layout highlights the condition, colour supports labels and an optional spoken version carries the same essential details.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.label{font-size:16px}.support{font-size:14px}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="20" y="30" text-anchor="start"><tspan x="20" dy="0">How one message combines modes and design</tspan></text><rect class="panel" x="245" y="55" width="290" height="105" rx="10"/><text class="label" x="390" y="85" text-anchor="middle"><tspan x="390" dy="0">School book exchange</tspan><tspan x="390" dy="24">Bring one usable book</tspan><tspan x="390" dy="24">to swap for one book.</tspan></text><path class="link" d="M390,160 L135,200" marker-end="url(#arrow)"/><path class="link" d="M390,160 L390,200" marker-end="url(#arrow)"/><path class="link" d="M390,160 L645,200" marker-end="url(#arrow)"/><rect class="panel" x="20" y="202" width="230" height="100" rx="10"/><text class="h" x="32" y="230" text-anchor="start"><tspan x="32" dy="0">Words</tspan></text><text class="support" x="32" y="259" text-anchor="start"><tspan x="32" dy="0">State the exchange rule.</tspan></text><rect class="panel" x="275" y="202" width="230" height="100" rx="10"/><text class="h" x="287" y="230" text-anchor="start"><tspan x="287" dy="0">Image</tspan></text><text class="support" x="287" y="259" text-anchor="start"><tspan x="287" dy="0">Show one book each way.</tspan></text><rect class="panel" x="530" y="202" width="230" height="100" rx="10"/><text class="h" x="542" y="230" text-anchor="start"><tspan x="542" dy="0">Layout</tspan></text><text class="support" x="542" y="259" text-anchor="start"><tspan x="542" dy="0">Give the condition</tspan><tspan x="542" dy="24">clear prominence.</tspan></text><path class="link" d="M135,302 L260,330" marker-end="url(#arrow)"/><path class="link" d="M645,302 L520,330" marker-end="url(#arrow)"/><rect class="panel" x="140" y="332" width="250" height="85" rx="10"/><text class="h" x="152" y="360" text-anchor="start"><tspan x="152" dy="0">Colour</tspan></text><text class="support" x="152" y="387" text-anchor="start"><tspan x="152" dy="0">Supports clear labels.</tspan></text><rect class="panel" x="410" y="332" width="250" height="85" rx="10"/><text class="h" x="422" y="360" text-anchor="start"><tspan x="422" dy="0">Optional audio</tspan></text><text class="support" x="422" y="387" text-anchor="start"><tspan x="422" dy="0">Speaks the same details.</tspan></text><text class="support" x="20" y="442" text-anchor="start"><tspan x="20" dy="0">Essential meaning also needs a readable text version.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
