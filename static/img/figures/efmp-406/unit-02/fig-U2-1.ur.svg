<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تنقیدی اور ڈیجیٹل خواندگی کا موازنہ</title><desc id="d">تنقیدی خواندگی پوچھتی ہے کہ پیغام کس کے مفاد میں ہے، جبکہ ڈیجیٹل خواندگی میں ڈیجیٹل آلات کا بامقصد اور ذمہ دارانہ استعمال شامل ہے۔ دونوں میں معنی کو پرکھنا شامل ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.label{font-size:16px}.support{font-size:14px}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="760" y="32" text-anchor="end"><tspan x="760" dy="0" text-anchor="end">خواندگی کی دو صورتیں</tspan></text><rect class="panel" x="610" y="55" width="150" height="55" rx="10"/><text class="h" x="748" y="89" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">قاری کی توجہ</tspan></text><rect class="panel" x="320" y="55" width="280" height="55" rx="10"/><text class="h" x="588" y="89" text-anchor="end"><tspan x="588" dy="0" text-anchor="end">تنقیدی خواندگی</tspan></text><rect class="panel" x="20" y="55" width="290" height="55" rx="10"/><text class="h" x="298" y="89" text-anchor="end"><tspan x="298" dy="0" text-anchor="end">ڈیجیٹل خواندگی</tspan></text><rect class="panel" x="610" y="122" width="150" height="90" rx="10"/><rect class="panel" x="320" y="122" width="280" height="90" rx="10"/><rect class="panel" x="20" y="122" width="290" height="90" rx="10"/><text class="label" x="748" y="155" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">سوالات</tspan></text><text class="label" x="588" y="155" text-anchor="end"><tspan x="588" dy="0" text-anchor="end">کس کے مفادات؟</tspan><tspan x="588" dy="24" text-anchor="end">کس کی آواز غائب ہے؟</tspan></text><text class="label" x="298" y="155" text-anchor="end"><tspan x="298" dy="0" text-anchor="end">میرا مقصد کیا ہے؟</tspan><tspan x="298" dy="24" text-anchor="end">یہ آلہ کیسے استعمال کروں؟</tspan></text><rect class="panel" x="610" y="222" width="150" height="90" rx="10"/><rect class="panel" x="320" y="222" width="280" height="90" rx="10"/><rect class="panel" x="20" y="222" width="290" height="90" rx="10"/><text class="label" x="748" y="255" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">جماعتی کام</tspan></text><text class="label" x="588" y="255" text-anchor="end"><tspan x="588" dy="0" text-anchor="end">ایپ کا دعویٰ جانچیں</tspan><tspan x="588" dy="24" text-anchor="end">اور غیر منصفانہ عبارت بدلیں</tspan></text><text class="label" x="298" y="255" text-anchor="end"><tspan x="298" dy="0" text-anchor="end">واضح، قابل رسائی</tspan><tspan x="298" dy="24" text-anchor="end">اسکولی نوٹس بنائیں اور بھیجیں</tspan></text><rect class="panel" x="610" y="322" width="150" height="90" rx="10"/><rect class="panel" x="320" y="322" width="280" height="90" rx="10"/><rect class="panel" x="20" y="322" width="290" height="90" rx="10"/><text class="label" x="748" y="355" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">عام غلطی</tspan></text><text class="label" x="588" y="355" text-anchor="end"><tspan x="588" dy="0" text-anchor="end">پیغام کو جانچے</tspan><tspan x="588" dy="24" text-anchor="end">بغیر رد کرنا</tspan></text><text class="label" x="298" y="355" text-anchor="end"><tspan x="298" dy="0" text-anchor="end">معنی پرکھے بغیر</tspan><tspan x="298" dy="24" text-anchor="end">آلہ چلانا</tspan></text><text class="support" x="760" y="443" text-anchor="end"><tspan x="760" dy="0" text-anchor="end">دونوں میں معنی کو پرکھنا شامل ہے۔</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
