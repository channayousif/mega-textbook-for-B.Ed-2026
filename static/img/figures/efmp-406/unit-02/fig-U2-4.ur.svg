<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تبادلے کے پیغام میں طرز اور ڈیزائن</title><desc id="d">الفاظ تبادلے کا اصول بتاتے ہیں، تصویر کتاب بدلنا دکھاتی ہے، ترتیب شرط نمایاں کرتی ہے، رنگ ناموں کی مدد کرتا ہے اور اختیاری زبانی نسخہ وہی ضروری تفصیلات دیتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.label{font-size:16px}.support{font-size:14px}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="760" y="30" text-anchor="end"><tspan x="760" dy="0" text-anchor="end">ایک پیغام میں طرز اور ڈیزائن کیسے ملتے ہیں</tspan></text><rect class="panel" x="245" y="55" width="290" height="105" rx="10"/><text class="label" x="390" y="85" text-anchor="middle"><tspan x="390" dy="0" text-anchor="middle">اسکول میں کتابوں کا تبادلہ</tspan><tspan x="390" dy="24" text-anchor="middle">ایک قابل استعمال کتاب لائیں</tspan><tspan x="390" dy="24" text-anchor="middle">اور بدلے میں ایک کتاب لیں۔</tspan></text><path class="link" d="M390 160 L645 200" marker-end="url(#arrow)"/><path class="link" d="M390 160 L390 200" marker-end="url(#arrow)"/><path class="link" d="M390 160 L135 200" marker-end="url(#arrow)"/><rect class="panel" x="530" y="202" width="230" height="100" rx="10"/><text class="h" x="748" y="230" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">الفاظ</tspan></text><text class="support" x="748" y="259" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">تبادلے کا اصول بتائیں۔</tspan></text><rect class="panel" x="275" y="202" width="230" height="100" rx="10"/><text class="h" x="493" y="230" text-anchor="end"><tspan x="493" dy="0" text-anchor="end">تصویر</tspan></text><text class="support" x="493" y="259" text-anchor="end"><tspan x="493" dy="0" text-anchor="end">دونوں طرف ایک کتاب دکھائیں۔</tspan></text><rect class="panel" x="20" y="202" width="230" height="100" rx="10"/><text class="h" x="238" y="230" text-anchor="end"><tspan x="238" dy="0" text-anchor="end">ترتیب</tspan></text><text class="support" x="238" y="259" text-anchor="end"><tspan x="238" dy="0" text-anchor="end">شرط صاف</tspan><tspan x="238" dy="24" text-anchor="end">نمایاں کریں۔</tspan></text><path class="link" d="M645 302 L520 330" marker-end="url(#arrow)"/><path class="link" d="M135 302 L260 330" marker-end="url(#arrow)"/><rect class="panel" x="390" y="332" width="250" height="85" rx="10"/><text class="h" x="628" y="360" text-anchor="end"><tspan x="628" dy="0" text-anchor="end">رنگ</tspan></text><text class="support" x="628" y="387" text-anchor="end"><tspan x="628" dy="0" text-anchor="end">واضح ناموں کی مدد کرتا ہے۔</tspan></text><rect class="panel" x="120" y="332" width="250" height="85" rx="10"/><text class="h" x="358" y="360" text-anchor="end"><tspan x="358" dy="0" text-anchor="end">اختیاری آواز</tspan></text><text class="support" x="358" y="387" text-anchor="end"><tspan x="358" dy="0" text-anchor="end">وہی تفصیلات بول کر دیتی ہے۔</tspan></text><text class="support" x="760" y="442" text-anchor="end"><tspan x="760" dy="0" text-anchor="end">ضروری معنی کا قابل مطالعہ تحریری نسخہ بھی ہو۔</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
