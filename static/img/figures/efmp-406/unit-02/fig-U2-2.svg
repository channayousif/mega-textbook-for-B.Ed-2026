<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Critical reading questions and return to the text</title><desc id="d">A critical reader identifies the maker and audience, checks missing voices, and chooses a supported response, returning to the text when evidence is missing.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.label{font-size:16px}.support{font-size:14px}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="30" text-anchor="start"><tspan x="24" dy="0">Questions a critical reader asks</tspan></text><rect class="panel" x="200" y="55" width="380" height="66" rx="10"/><text class="h" x="390" y="94" text-anchor="middle"><tspan x="390" dy="0">Who made it?</tspan></text><path class="link" d="M390,121 L390,145" marker-end="url(#arrow)"/><rect class="panel" x="200" y="147" width="380" height="66" rx="10"/><text class="h" x="390" y="186" text-anchor="middle"><tspan x="390" dy="0">For whom?</tspan></text><path class="link" d="M390,213 L390,237" marker-end="url(#arrow)"/><rect class="panel" x="200" y="239" width="380" height="66" rx="10"/><text class="h" x="390" y="278" text-anchor="middle"><tspan x="390" dy="0">What is left out?</tspan></text><path class="link" d="M390,305 L390,329" marker-end="url(#arrow)"/><rect class="panel" x="200" y="331" width="380" height="66" rx="10"/><text class="h" x="390" y="370" text-anchor="middle"><tspan x="390" dy="0">What do I do now?</tspan></text><path class="link" d="M580,364 L730,364 L730,88 L582,88" marker-end="url(#arrow)"/><rect class="panel" x="592" y="185" width="175" height="120" rx="10"/><text class="support" x="605" y="212" text-anchor="start"><tspan x="605" dy="0">Missing evidence?</tspan><tspan x="605" dy="24">Reread the text.</tspan><tspan x="605" dy="24">State what is</tspan><tspan x="605" dy="24">still unknown.</tspan></text><text class="support" x="200" y="440" text-anchor="start"><tspan x="200" dy="0">Choose a response supported by the text.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
