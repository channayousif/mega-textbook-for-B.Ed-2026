<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تنقیدی سوالات اور متن کی طرف واپسی</title><desc id="d">تنقیدی قاری بنانے والے اور مخاطبین کو شناخت کرتا ہے، غائب آوازیں جانچتا ہے اور ثبوت پر مبنی ردعمل چنتا ہے؛ ثبوت نہ ملے تو متن کی طرف لوٹتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.label{font-size:16px}.support{font-size:14px}.wm{fill:var(--wm);font-size:11px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="756" y="30" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">تنقیدی قاری کے سوالات</tspan></text><rect class="panel" x="200" y="55" width="380" height="66" rx="10"/><text class="h" x="390" y="94" text-anchor="middle"><tspan x="390" dy="0" text-anchor="middle">کس نے بنایا؟</tspan></text><path class="link" d="M390 121 L390 145" marker-end="url(#arrow)"/><rect class="panel" x="200" y="147" width="380" height="66" rx="10"/><text class="h" x="390" y="186" text-anchor="middle"><tspan x="390" dy="0" text-anchor="middle">کس کے لیے؟</tspan></text><path class="link" d="M390 213 L390 237" marker-end="url(#arrow)"/><rect class="panel" x="200" y="239" width="380" height="66" rx="10"/><text class="h" x="390" y="278" text-anchor="middle"><tspan x="390" dy="0" text-anchor="middle">کیا چھوڑ دیا گیا؟</tspan></text><path class="link" d="M390 305 L390 329" marker-end="url(#arrow)"/><rect class="panel" x="200" y="331" width="380" height="66" rx="10"/><text class="h" x="390" y="370" text-anchor="middle"><tspan x="390" dy="0" text-anchor="middle">اب میں کیا کروں؟</tspan></text><path class="link" d="M200 364 L50 364 L50 88 L198 88" marker-end="url(#arrow)"/><rect class="panel" x="13" y="185" width="175" height="120" rx="10"/><text class="support" x="175" y="212" text-anchor="end"><tspan x="175" dy="0" text-anchor="end">ثبوت غائب ہے؟</tspan><tspan x="175" dy="24" text-anchor="end">متن دوبارہ پڑھیں۔</tspan><tspan x="175" dy="24" text-anchor="end">بتائیں کہ کیا</tspan><tspan x="175" dy="24" text-anchor="end">ابھی نامعلوم ہے۔</tspan></text><text class="support" x="580" y="440" text-anchor="end"><tspan x="580" dy="0" text-anchor="end">متن کی تائید والا ردعمل چنیں۔</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
