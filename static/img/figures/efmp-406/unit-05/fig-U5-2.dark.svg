<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing a teacher-centred and a learner-centred literacy lesson</title><desc id="d">Table comparing a teacher-centred and a learner-centred literacy lesson on who talks most, who chooses, what pupils read, what pupils write and who checks learning.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="24" y="30">5.1 Who does the thinking?</text><rect class="bg" x="24" y="48" width="732" height="360" rx="0"/><rect class="panel" x="24" y="48" width="732" height="60" rx="0"/><rect class="panel" x="24" y="108" width="156" height="60" rx="0"/><rect class="panel" x="24" y="168" width="156" height="60" rx="0"/><rect class="panel" x="24" y="228" width="156" height="60" rx="0"/><rect class="panel" x="24" y="288" width="156" height="60" rx="0"/><rect class="panel" x="24" y="348" width="156" height="60" rx="0"/><path class="link" d="M180 48V408 M438 48V408 M756 108V408H180 M180 168H756 M180 228H756 M180 288H756 M180 348H756"/><text class="h" x="36" y="80">Question</text><text class="h" x="192" y="73">Teacher-centred<tspan x="192" dy="17">literacy lesson</tspan></text><text class="h" x="450" y="73">Learner-centred<tspan x="450" dy="17">literacy lesson</tspan></text><text class="ink" x="36" y="131">Who talks<tspan x="36" dy="17">most</tspan></text><text class="ink" x="192" y="131">The teacher explains<tspan x="192" dy="17">and pupils listen</tspan></text><text class="ink" x="450" y="131">Pupils talk in pairs and groups;<tspan x="450" dy="17">the teacher listens and prompts</tspan></text><text class="ink" x="36" y="191">Who chooses</text><text class="ink" x="192" y="191">The teacher chooses the text<tspan x="192" dy="17">and the questions</tspan></text><text class="ink" x="450" y="191">Pupils help choose questions,<tspan x="450" dy="17">texts or the product</tspan></text><text class="ink" x="36" y="251">What pupils<tspan x="36" dy="17">read</tspan></text><text class="ink" x="192" y="251">One textbook passage</text><text class="ink" x="450" y="251">The textbook plus other real texts<tspan x="450" dy="17">such as leaflets, notices and labels</tspan></text><text class="ink" x="36" y="311">What pupils<tspan x="36" dy="17">write</tspan></text><text class="ink" x="192" y="311">Copied answers</text><text class="ink" x="450" y="311">Their own questions, notes and<tspan x="450" dy="17">a product for real readers</tspan></text><text class="ink" x="36" y="371">Who checks<tspan x="36" dy="17">learning</tspan></text><text class="ink" x="192" y="371">The teacher marks<tspan x="192" dy="17">at the end</tspan></text><text class="ink" x="450" y="371">The teacher, the pupil and peers<tspan x="450" dy="17">check during the work</tspan></text><text class="muted" x="24" y="431">the teacher plans and guides in both;<tspan x="24" dy="17">what changes is who does the thinking</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
