<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of a literacy inquiry project in seven stages</title><desc id="d">Flowchart of a literacy inquiry project in seven stages, ask, find, read, judge, make, share and reflect, with an example from a Class 5 project on safe water under each stage and an arrow from reflection back to new questions.</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="24" y="32">5.1 Literacy inquiry: safe drinking water</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10Z"/></marker></defs><rect class="panel" x="12" y="120" width="96" height="92" rx="8"/><text class="ink" x="60" y="147" text-anchor="middle">1 Ask a<tspan x="60" dy="17">question</tspan></text><text class="ink" x="60" y="246" text-anchor="middle">Where does<tspan x="60" dy="17">our water</tspan><tspan x="60" dy="17">come from?</tspan></text><path class="link" d="M108 166H120" marker-end="url(#arrow)"/><rect class="panel" x="122" y="120" width="96" height="92" rx="8"/><text class="ink" x="170" y="147" text-anchor="middle">2 Find<tspan x="170" dy="17">sources</tspan></text><text class="ink" x="170" y="246" text-anchor="middle">textbook,<tspan x="170" dy="17">leaflet,</tspan><tspan x="170" dy="17">interview</tspan></text><path class="link" d="M218 166H230" marker-end="url(#arrow)"/><rect class="panel" x="232" y="120" width="96" height="92" rx="8"/><text class="ink" x="280" y="147" text-anchor="middle">3 Read<tspan x="280" dy="17">and take</tspan><tspan x="280" dy="17">notes</tspan></text><text class="ink" x="280" y="246" text-anchor="middle">notes in<tspan x="280" dy="17">a table</tspan></text><path class="link" d="M328 166H340" marker-end="url(#arrow)"/><rect class="panel" x="342" y="120" width="96" height="92" rx="8"/><text class="ink" x="390" y="147" text-anchor="middle">4 Judge<tspan x="390" dy="17">the</tspan><tspan x="390" dy="17">sources</tspan></text><text class="ink" x="390" y="246" text-anchor="middle">Which<tspan x="390" dy="17">source is</tspan><tspan x="390" dy="17">more</tspan><tspan x="390" dy="17">reliable?</tspan></text><path class="link" d="M438 166H450" marker-end="url(#arrow)"/><rect class="panel" x="452" y="120" width="96" height="92" rx="8"/><text class="ink" x="500" y="147" text-anchor="middle">5 Make a<tspan x="500" dy="17">product</tspan></text><text class="ink" x="500" y="246" text-anchor="middle">a wall<tspan x="500" dy="17">poster</tspan></text><path class="link" d="M548 166H560" marker-end="url(#arrow)"/><rect class="panel" x="562" y="120" width="96" height="92" rx="8"/><text class="ink" x="610" y="147" text-anchor="middle">6 Share<tspan x="610" dy="17">with an</tspan><tspan x="610" dy="17">audience</tspan></text><text class="ink" x="610" y="246" text-anchor="middle">parents'<tspan x="610" dy="17">day display</tspan></text><path class="link" d="M658 166H670" marker-end="url(#arrow)"/><rect class="panel" x="672" y="120" width="96" height="92" rx="8"/><text class="ink" x="720" y="147" text-anchor="middle">7 Reflect</text><text class="ink" x="720" y="246" text-anchor="middle">What would<tspan x="720" dy="17">we do</tspan><tspan x="720" dy="17">differently?</tspan></text><path class="link" d="M720 120V87Q720 64 696 64H84Q60 64 60 87V118" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text class="muted" x="390" y="54" text-anchor="middle">new questions</text><text class="muted" x="24" y="391">Class 5 project: each stage builds on the work before it.<tspan x="24" dy="17">Reflection can lead to another inquiry.</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
