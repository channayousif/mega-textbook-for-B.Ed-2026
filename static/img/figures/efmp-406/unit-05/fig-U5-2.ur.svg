<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد مرکز اور متعلم مرکز خواندگی کے سبق کا تقابلی جدول: زیادہ بات کون کرتا ہے، انتخاب کون کرتا ہے، بچے کیا پڑھتے اور لکھتے ہیں اور سیکھنے کی جانچ کون کرتا ہے</title><desc id="d">استاد مرکز اور متعلم مرکز خواندگی کے سبق کا تقابلی جدول: زیادہ بات کون کرتا ہے، انتخاب کون کرتا ہے، بچے کیا پڑھتے اور لکھتے ہیں اور سیکھنے کی جانچ کون کرتا ہے۔</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="756" y="30" text-anchor="end">5.1 سوچنے کا کام کون کرتا ہے؟</text><rect class="bg" x="24" y="48" width="732" height="360" rx="0"/><rect class="panel" x="24" y="48" width="732" height="60" rx="0"/><rect class="panel" x="600" y="108" width="156" height="60" rx="0"/><rect class="panel" x="600" y="168" width="156" height="60" rx="0"/><rect class="panel" x="600" y="228" width="156" height="60" rx="0"/><rect class="panel" x="600" y="288" width="156" height="60" rx="0"/><rect class="panel" x="600" y="348" width="156" height="60" rx="0"/><path class="link" d="M600 48 V408 M342 48 V408 M24 108 V408 H600 M600 168 H24 M600 228 H24 M600 288 H24 M600 348 H24"/><text class="h" x="744" y="80" text-anchor="end">سوال</text><text class="h" x="588" y="73" text-anchor="end">استاد مرکز<tspan x="588" dy="22" text-anchor="end">خواندگی سبق</tspan></text><text class="h" x="330" y="73" text-anchor="end">متعلم مرکز<tspan x="330" dy="22" text-anchor="end">خواندگی سبق</tspan></text><text class="ink" x="744" y="131" text-anchor="end">زیادہ بات<tspan x="744" dy="22" text-anchor="end">کون کرتا ہے</tspan></text><text class="ink" x="588" y="131" text-anchor="end">استاد سمجھاتا ہے<tspan x="588" dy="22" text-anchor="end">اور بچے سنتے ہیں</tspan></text><text class="ink" x="330" y="131" text-anchor="end">بچے جوڑوں اور گروہوں میں بولتے ہیں؛<tspan x="330" dy="22" text-anchor="end">استاد سنتا اور اشارے دیتا ہے</tspan></text><text class="ink" x="744" y="191" text-anchor="end">کون چنتا ہے</text><text class="ink" x="588" y="191" text-anchor="end">استاد متن اور سوالات<tspan x="588" dy="22" text-anchor="end">چنتا ہے</tspan></text><text class="ink" x="330" y="191" text-anchor="end">بچے سوال، متن یا تخلیق<tspan x="330" dy="22" text-anchor="end">چننے میں شریک ہوتے ہیں</tspan></text><text class="ink" x="744" y="251" text-anchor="end">بچے کیا<tspan x="744" dy="22" text-anchor="end">پڑھتے ہیں</tspan></text><text class="ink" x="588" y="251" text-anchor="end">کتاب کی ایک عبارت</text><text class="ink" x="330" y="251" text-anchor="end">درسی کتاب اور دیگر حقیقی متن،<tspan x="330" dy="22" text-anchor="end">مثلاً کتابچے، اعلانات اور لیبل</tspan></text><text class="ink" x="744" y="311" text-anchor="end">بچے کیا<tspan x="744" dy="22" text-anchor="end">لکھتے ہیں</tspan></text><text class="ink" x="588" y="311" text-anchor="end">نقل کیے جواب</text><text class="ink" x="330" y="311" text-anchor="end">اپنے سوال، نوٹس اور<tspan x="330" dy="22" text-anchor="end">حقیقی قارئین کے لیے تخلیق</tspan></text><text class="ink" x="744" y="371" text-anchor="end">سیکھنے کی<tspan x="744" dy="22" text-anchor="end">جانچ کون کرے</tspan></text><text class="ink" x="588" y="371" text-anchor="end">استاد آخر میں<tspan x="588" dy="22" text-anchor="end">نمبر لگاتا ہے</tspan></text><text class="ink" x="330" y="371" text-anchor="end">استاد، بچہ اور ہم جماعت<tspan x="330" dy="22" text-anchor="end">کام کے دوران جانچتے ہیں</tspan></text><text class="muted" x="756" y="431" text-anchor="end">دونوں میں استاد منصوبہ بناتا اور رہنمائی کرتا ہے؛<tspan x="756" dy="22" text-anchor="end">فرق یہ ہے کہ سوچنے کا کام کون کرتا ہے</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
