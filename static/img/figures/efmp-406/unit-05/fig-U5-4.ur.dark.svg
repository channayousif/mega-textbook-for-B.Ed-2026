<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مرکز میں ایک متعلم کی خواندگی اور اردگرد تشخیص کے پانچ طریقوں کا خاکہ: مشاہدہ، ریڈنگ ریکارڈ، پورٹ فولیو، معیارِ جانچ اور آزمائش</title><desc id="d">مرکز میں ایک متعلم کی خواندگی اور اردگرد تشخیص کے پانچ طریقوں کا خاکہ: مشاہدہ، ریڈنگ ریکارڈ، پورٹ فولیو، معیارِ جانچ اور آزمائش۔ بیرونی حلقہ دکھاتا ہے کہ مل کر یہ کسی ایک طریقے سے زیادہ مکمل تصویر دیتے ہیں۔</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="756" y="26" text-anchor="end">5.2 خواندگی کی زیادہ مکمل تصویر</text><rect class="link" x="20" y="38" width="740" height="389" rx="38"/><path class="link" d="M390 183 V137 M452 230 L500 213 M328 230 L280 213 M435 288 L500 328 M345 288 L280 328"/><circle class="panel" cx="390" cy="246" r="62"/><text class="h" x="390" y="233" text-anchor="middle">ایک متعلم<tspan x="390" dy="22" text-anchor="end">کی خواندگی</tspan></text><rect class="panel" x="260" y="52" width="260" height="85" rx="8"/><text class="h" x="508" y="75" text-anchor="end">مشاہدہ</text><text class="ink" x="508" y="96" text-anchor="end">دیکھیں اور لکھیں کہ بچہ<tspan x="508" dy="22" text-anchor="end">جماعت میں کیسے پڑھتا،</tspan><tspan x="508" dy="22" text-anchor="end">بات کرتا اور لکھتا ہے۔</tspan></text><rect class="panel" x="500" y="155" width="240" height="112" rx="8"/><text class="h" x="728" y="178" text-anchor="end">ریڈنگ ریکارڈ</text><text class="ink" x="728" y="199" text-anchor="end">مختصر عبارت کی قرأت سنیں؛<tspan x="728" dy="22" text-anchor="end">غلطیاں، خود اصلاحیں</tspan><tspan x="728" dy="22" text-anchor="end">اور رفتار نوٹ کریں۔</tspan></text><rect class="panel" x="40" y="155" width="240" height="112" rx="8"/><text class="h" x="268" y="178" text-anchor="end">پورٹ فولیو</text><text class="ink" x="268" y="199" text-anchor="end">پوری سہ ماہی میں جمع<tspan x="268" dy="22" text-anchor="end">بچے کی تحریروں</tspan><tspan x="268" dy="22" text-anchor="end">کا فولڈر۔</tspan></text><rect class="panel" x="500" y="287" width="240" height="118" rx="8"/><text class="h" x="728" y="310" text-anchor="end">معیارِ جانچ</text><text class="ink" x="728" y="331" text-anchor="end">کسوٹیوں اور درجوں کا<tspan x="728" dy="22" text-anchor="end">جدول جو کام پر فیصلہ</tspan><tspan x="728" dy="22" text-anchor="end">کرنے کے لیے ہو۔</tspan></text><rect class="panel" x="40" y="287" width="240" height="118" rx="8"/><text class="h" x="268" y="310" text-anchor="end">آزمائش</text><text class="ink" x="268" y="331" text-anchor="end">یکساں حالات میں سب<tspan x="268" dy="22" text-anchor="end">بچوں کے لیے تحریری</tspan><tspan x="268" dy="22" text-anchor="end">یا زبانی سوالات۔</tspan></text><text class="muted" x="390" y="445" text-anchor="middle">مل کر یہ کسی ایک طریقے سے زیادہ مکمل تصویر دیتے ہیں</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
