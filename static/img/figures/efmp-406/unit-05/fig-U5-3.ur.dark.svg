<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خواندگی کی تدریس کے چار کم خرچ آئی سی ٹی آلات کا جدول: موبائل فون، پروجیکٹر، ریڈیو یا ریکارڈ شدہ آواز اور آف لائن برقی کتابیں</title><desc id="d">خواندگی کی تدریس کے چار کم خرچ آئی سی ٹی آلات کا جدول: موبائل فون، پروجیکٹر، ریڈیو یا ریکارڈ شدہ آواز اور آف لائن برقی کتابیں۔ ہر ایک کا کام اور جماعت میں ایک استعمال دکھایا گیا ہے۔</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="756" y="30" text-anchor="end">5.2 خواندگی کے لیے کم خرچ آئی سی ٹی</text><rect class="bg" x="24" y="48" width="732" height="374" rx="0"/><rect class="panel" x="24" y="48" width="732" height="54" rx="0"/><rect class="panel" x="556" y="102" width="200" height="80" rx="0"/><rect class="panel" x="556" y="182" width="200" height="80" rx="0"/><rect class="panel" x="556" y="262" width="200" height="80" rx="0"/><rect class="panel" x="556" y="342" width="200" height="80" rx="0"/><path class="link" d="M556 48 V422 M338 48 V422 M24 102 V422 H556 M556 182 H24 M556 262 H24 M556 342 H24"/><text class="h" x="744" y="79" text-anchor="end">کم خرچ آلہ</text><text class="h" x="544" y="79" text-anchor="end">اس کا کام</text><text class="h" x="326" y="70" text-anchor="end">جماعت میں خواندگی<tspan x="326" dy="22" text-anchor="end">کا ایک استعمال</tspan></text><text class="ink" x="744" y="125" text-anchor="end">ایک موبائل فون</text><text class="ink" x="544" y="125" text-anchor="end">آواز ریکارڈ، تصویریں،<tspan x="544" dy="22" text-anchor="end">اور آواز اور مختصر</tspan><tspan x="544" dy="22" text-anchor="end">ویڈیو چلانا</tspan></text><text class="ink" x="326" y="125" text-anchor="end">شروع اور آخر میں بچوں کی<tspan x="326" dy="22" text-anchor="end">قرأت ریکارڈ کریں؛ انہیں</tspan><tspan x="326" dy="22" text-anchor="end">اپنی ترقی سننے دیں۔</tspan></text><text class="ink" x="744" y="205" text-anchor="end">پروجیکٹر یا<tspan x="744" dy="22" text-anchor="end">بڑی اسکرین</tspan></text><text class="ink" x="544" y="205" text-anchor="end">پوری جماعت کو<tspan x="544" dy="22" text-anchor="end">ایک متن دکھانا</tspan></text><text class="ink" x="326" y="205" text-anchor="end">اخبار کا صفحہ یا بچوں کی<tspan x="326" dy="22" text-anchor="end">تحریر دکھائیں اور مل کر</tspan><tspan x="326" dy="22" text-anchor="end">اس کی تدوین کریں۔</tspan></text><text class="ink" x="744" y="285" text-anchor="end">ریڈیو یا<tspan x="744" dy="22" text-anchor="end">ریکارڈ شدہ آواز</tspan></text><text class="ink" x="544" y="285" text-anchor="end">زبانی کہانیاں، خبریں<tspan x="544" dy="22" text-anchor="end">اور پروگرام لانا</tspan></text><text class="ink" x="326" y="285" text-anchor="end">مختصر کہانی یا خبر سنیں،<tspan x="326" dy="22" text-anchor="end">پھر اسے دوبارہ بیان کریں</tspan><tspan x="326" dy="22" text-anchor="end">یا خلاصہ لکھیں۔</tspan></text><text class="ink" x="744" y="365" text-anchor="end">فون یا ٹیبلٹ پر<tspan x="744" dy="22" text-anchor="end">آف لائن برقی کتابیں</tspan><tspan x="744" dy="22" text-anchor="end">اور کہانیاں</tspan></text><text class="ink" x="544" y="365" text-anchor="end">انٹرنیٹ کے بغیر<tspan x="544" dy="22" text-anchor="end">لائبریری</tspan></text><text class="ink" x="326" y="365" text-anchor="end">چھوٹے گروہ کہانی چن کر<tspan x="326" dy="22" text-anchor="end">پڑھیں، پھر دوسروں کو</tspan><tspan x="326" dy="22" text-anchor="end">اس کی سفارش کریں۔</tspan></text><text class="muted" x="756" y="445" text-anchor="end">پہلے خواندگی کا مقصد، پھر آلے کا انتخاب</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
