<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram with one learner's literacy at the centre surrounded by five ways to assess it</title><desc id="d">Diagram with one learner's literacy at the centre surrounded by five ways to assess it, observation, reading record, portfolio, rubric and test, inside a ring showing that together they give a fuller picture than any one method.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="24" y="26">5.2 A fuller picture of literacy</text><rect class="link" x="20" y="38" width="740" height="389" rx="38"/><path class="link" d="M390 183V137 M328 230L280 213 M452 230L500 213 M345 288L280 328 M435 288L500 328"/><circle class="panel" cx="390" cy="246" r="62"/><text class="h" x="390" y="233" text-anchor="middle">one learner's<tspan x="390" dy="17">literacy</tspan></text><rect class="panel" x="260" y="52" width="260" height="85" rx="8"/><text class="h" x="272" y="75">observation</text><text class="ink" x="272" y="96">Watch and note how the pupil<tspan x="272" dy="17">reads, talks and writes</tspan><tspan x="272" dy="17">in class.</tspan></text><rect class="panel" x="40" y="155" width="240" height="112" rx="8"/><text class="h" x="52" y="178">reading record</text><text class="ink" x="52" y="199">Listen to a short passage<tspan x="52" dy="17">read aloud; note errors,</tspan><tspan x="52" dy="17">self-corrections and speed.</tspan></text><rect class="panel" x="500" y="155" width="240" height="112" rx="8"/><text class="h" x="512" y="178">portfolio</text><text class="ink" x="512" y="199">A folder of the pupil's<tspan x="512" dy="17">writing collected over</tspan><tspan x="512" dy="17">a term.</tspan></text><rect class="panel" x="40" y="287" width="240" height="118" rx="8"/><text class="h" x="52" y="310">rubric</text><text class="ink" x="52" y="331">A table of criteria and<tspan x="52" dy="17">levels used to judge</tspan><tspan x="52" dy="17">a piece of work.</tspan></text><rect class="panel" x="500" y="287" width="240" height="118" rx="8"/><text class="h" x="512" y="310">test</text><text class="ink" x="512" y="331">Written or oral questions<tspan x="512" dy="17">answered under the same</tspan><tspan x="512" dy="17">conditions by all pupils.</tspan></text><text class="muted" x="390" y="445" text-anchor="middle">together they give a fuller picture than any one method</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
