<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four low-cost ICT tools for literacy teaching</title><desc id="d">Table of four low-cost ICT tools for literacy teaching, a mobile phone, a projector, radio or recorded audio and offline e-books, showing what each does and one classroom use for each.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="24" y="30">5.2 Low-cost ICT for literacy</text><rect class="bg" x="24" y="48" width="732" height="374" rx="0"/><rect class="panel" x="24" y="48" width="732" height="54" rx="0"/><rect class="panel" x="24" y="102" width="200" height="80" rx="0"/><rect class="panel" x="24" y="182" width="200" height="80" rx="0"/><rect class="panel" x="24" y="262" width="200" height="80" rx="0"/><rect class="panel" x="24" y="342" width="200" height="80" rx="0"/><path class="link" d="M224 48V422 M442 48V422 M756 102V422H224 M224 182H756 M224 262H756 M224 342H756"/><text class="h" x="36" y="79">Low-cost tool</text><text class="h" x="236" y="79">What it does</text><text class="h" x="454" y="70">One classroom use<tspan x="454" dy="17">for literacy</tspan></text><text class="ink" x="36" y="125">One mobile phone</text><text class="ink" x="236" y="125">Records sound, takes<tspan x="236" dy="17">photographs, plays</tspan><tspan x="236" dy="17">audio and short video</tspan></text><text class="ink" x="454" y="125">Record pupils reading aloud at<tspan x="454" dy="17">the start and end of a term;</tspan><tspan x="454" dy="17">let them hear their progress.</tspan></text><text class="ink" x="36" y="205">A projector or<tspan x="36" dy="17">large screen</tspan></text><text class="ink" x="236" y="205">Shows one text to<tspan x="236" dy="17">the whole class</tspan></text><text class="ink" x="454" y="205">Project a newspaper page or<tspan x="454" dy="17">pupils' own writing and edit</tspan><tspan x="454" dy="17">it together.</tspan></text><text class="ink" x="36" y="285">Radio or<tspan x="36" dy="17">recorded audio</tspan></text><text class="ink" x="236" y="285">Brings spoken stories,<tspan x="236" dy="17">news and programmes</tspan></text><text class="ink" x="454" y="285">Listen to a short story or news<tspan x="454" dy="17">item, then retell or summarise</tspan><tspan x="454" dy="17">it in writing.</tspan></text><text class="ink" x="36" y="365">Offline e-books and<tspan x="36" dy="17">stories on a phone</tspan><tspan x="36" dy="17">or tablet</tspan></text><text class="ink" x="236" y="365">Gives a library<tspan x="236" dy="17">without internet</tspan></text><text class="ink" x="454" y="365">Let small groups choose and<tspan x="454" dy="17">read a story, then recommend</tspan><tspan x="454" dy="17">it to others.</tspan></text><text class="muted" x="24" y="445">start from the literacy purpose, then choose the tool</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
