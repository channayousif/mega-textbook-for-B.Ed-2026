<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خواندگی کے تحقیقی منصوبے کا سات مرحلوں والا بہاؤ: سوال، تلاش، مطالعہ، پرکھ، تخلیق، پیش کش اور غور</title><desc id="d">خواندگی کے تحقیقی منصوبے کا سات مرحلوں والا بہاؤ: سوال، تلاش، مطالعہ، پرکھ، تخلیق، پیش کش اور غور۔ ہر مرحلے کے نیچے پانچویں جماعت کے محفوظ پانی کے منصوبے کی مثال ہے اور غور سے نئے سوالات کی طرف تیر واپس جاتا ہے۔</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1.5; }
text { font-size: 14px; fill: var(--ink); }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470" rx="0"/><text class="h" x="756" y="32" text-anchor="end">5.1 خواندگی کی تحقیق: پینے کا محفوظ پانی</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10Z"/></marker></defs><rect class="panel" x="672" y="120" width="96" height="92" rx="8"/><text class="ink" x="720" y="147" text-anchor="middle">1 سوال<tspan x="720" dy="22" text-anchor="end">پوچھیں</tspan></text><text class="ink" x="720" y="246" text-anchor="middle">ہمارا پانی<tspan x="720" dy="22" text-anchor="end">کہاں سے</tspan><tspan x="720" dy="22" text-anchor="end">آتا ہے؟</tspan></text><path class="link" d="M672 166 H660" marker-end="url(#arrow)"/><rect class="panel" x="562" y="120" width="96" height="92" rx="8"/><text class="ink" x="610" y="147" text-anchor="middle">2 ذرائع<tspan x="610" dy="22" text-anchor="end">ڈھونڈیں</tspan></text><text class="ink" x="610" y="246" text-anchor="middle">درسی کتاب،<tspan x="610" dy="22" text-anchor="end">کتابچہ،</tspan><tspan x="610" dy="22" text-anchor="end">انٹرویو</tspan></text><path class="link" d="M562 166 H550" marker-end="url(#arrow)"/><rect class="panel" x="452" y="120" width="96" height="92" rx="8"/><text class="ink" x="500" y="147" text-anchor="middle">3 پڑھیں<tspan x="500" dy="22" text-anchor="end">اور نوٹس</tspan><tspan x="500" dy="22" text-anchor="end">لیں</tspan></text><text class="ink" x="500" y="246" text-anchor="middle">جدول میں<tspan x="500" dy="22" text-anchor="end">نوٹس</tspan></text><path class="link" d="M452 166 H440" marker-end="url(#arrow)"/><rect class="panel" x="342" y="120" width="96" height="92" rx="8"/><text class="ink" x="390" y="147" text-anchor="middle">4 ذرائع<tspan x="390" dy="22" text-anchor="end">کو</tspan><tspan x="390" dy="22" text-anchor="end">پرکھیں</tspan></text><text class="ink" x="390" y="246" text-anchor="middle">کون سا<tspan x="390" dy="22" text-anchor="end">ماخذ</tspan><tspan x="390" dy="22" text-anchor="end">زیادہ قابل</tspan><tspan x="390" dy="22" text-anchor="end">اعتماد ہے؟</tspan></text><path class="link" d="M342 166 H330" marker-end="url(#arrow)"/><rect class="panel" x="232" y="120" width="96" height="92" rx="8"/><text class="ink" x="280" y="147" text-anchor="middle">5 تخلیق<tspan x="280" dy="22" text-anchor="end">بنائیں</tspan></text><text class="ink" x="280" y="246" text-anchor="middle">دیواری<tspan x="280" dy="22" text-anchor="end">پوسٹر</tspan></text><path class="link" d="M232 166 H220" marker-end="url(#arrow)"/><rect class="panel" x="122" y="120" width="96" height="92" rx="8"/><text class="ink" x="170" y="147" text-anchor="middle">6 قارئین<tspan x="170" dy="22" text-anchor="end">کو پیش</tspan><tspan x="170" dy="22" text-anchor="end">کریں</tspan></text><text class="ink" x="170" y="246" text-anchor="middle">والدین کے<tspan x="170" dy="22" text-anchor="end">دن نمائش</tspan></text><path class="link" d="M122 166 H110" marker-end="url(#arrow)"/><rect class="panel" x="12" y="120" width="96" height="92" rx="8"/><text class="ink" x="60" y="147" text-anchor="middle">7 غور کریں</text><text class="ink" x="60" y="246" text-anchor="middle">کیا ہم<tspan x="60" dy="22" text-anchor="end">مختلف انداز</tspan><tspan x="60" dy="22" text-anchor="end">اپنائیں گے؟</tspan></text><path class="link" d="M60 120 V87 Q60 64 84 64 H696 Q720 64 720 87 V118" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text class="muted" x="390" y="54" text-anchor="middle">نئے سوالات</text><text class="muted" x="756" y="391" text-anchor="end">پانچویں کا منصوبہ: ہر مرحلہ پچھلے کام پر بنتا ہے۔<tspan x="756" dy="22" text-anchor="end">غور سے نئی تحقیق شروع ہو سکتی ہے۔</tspan></text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
