<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">مقامی بولنے والوں کو مشکل انگریزی آوازیں</title>
  <desc id="d">جدول انگریزی آوازوں کی جن کو اردو، سندھی اور پشتو بولنے والے اکثر مشکل سے لیتے ہیں، ہر ایک کے لیے قریبی جوڑوں کی مشق کے ساتھ۔</desc>
  <style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style>
  <rect class="bg" x="0" y="0" width="780" height="520"/>
  <text class="h" x="390" y="34" text-anchor="middle">مقامی بولنے والوں کو مشکل انگریزی آوازیں</text>
  <text class="muted" x="390" y="54" text-anchor="middle">چھ عام مشکلات کے لیے قریبی جوڑوں کی مشق</text>
  <rect class="panel" x="30" y="72" width="720" height="36" rx="4"/>
  <text class="sh" x="735" y="96" text-anchor="end">آواز</text>
  <text class="sh" x="600" y="96" text-anchor="end">عام مشکل</text>
  <text class="sh" x="270" y="96" text-anchor="end">قریبی جوڑوں کی مشق</text>
  <rect class="panel-a" x="30" y="116" width="720" height="56" rx="4"/>
  <text class="sh" x="735" y="140" text-anchor="end">/v/ اور /w/</text>
  <text class="muted" x="735" y="158" text-anchor="end">v بمقابلہ w</text>
  <text class="body" x="600" y="140" text-anchor="end">بہت سے بولنے والے دونوں کے لیے /v/</text>
  <text class="body" x="600" y="158" text-anchor="end">استعمال کرتے ہیں، "west" "vest" لگتا ہے</text>
  <text class="body" x="270" y="140" text-anchor="end">vest - west</text>
  <text class="body" x="270" y="158" text-anchor="end">vine - wine</text>
  <rect class="panel-b" x="30" y="180" width="720" height="56" rx="4"/>
  <text class="sh" x="735" y="204" text-anchor="end">/f/ اور /p/</text>
  <text class="muted" x="735" y="222" text-anchor="end">f بمقابلہ p</text>
  <text class="body" x="600" y="204" text-anchor="end">کچھ بولنے والے /f/ کے لیے</text>
  <text class="body" x="600" y="222" text-anchor="end">/p/ بدل دیتے ہیں</text>
  <text class="body" x="270" y="204" text-anchor="end">fan - pan</text>
  <text class="body" x="270" y="222" text-anchor="end">fat - pat</text>
  <rect class="panel-c" x="30" y="244" width="720" height="56" rx="4"/>
  <text class="sh" x="735" y="268" text-anchor="end">/θ/ اور /ð/</text>
  <text class="muted" x="735" y="286" text-anchor="end">th آوازیں</text>
  <text class="body" x="600" y="268" text-anchor="end">یہ آوازیں غائب ہیں؛ بولنے والے</text>
  <text class="body" x="600" y="286" text-anchor="end">/t/، /s/ یا /d/، /z/ استعمال کرتے ہیں</text>
  <text class="body" x="270" y="268" text-anchor="end">thin - tin</text>
  <text class="body" x="270" y="286" text-anchor="end">this - these</text>
  <rect class="panel-d" x="30" y="308" width="720" height="56" rx="4"/>
  <text class="sh" x="735" y="332" text-anchor="end">/tʃ/ اور /dʒ/</text>
  <text class="muted" x="735" y="350" text-anchor="end">ch اور j</text>
  <text class="body" x="600" y="332" text-anchor="end">بولنے والے ان دونوں آوازوں میں</text>
  <text class="body" x="600" y="350" text-anchor="end">الجھ سکتے ہیں</text>
  <text class="body" x="270" y="332" text-anchor="end">chair - jar</text>
  <text class="body" x="270" y="350" text-anchor="end">cheap - jeep</text>
  <rect class="panel-a" x="30" y="372" width="720" height="56" rx="4"/>
  <text class="sh" x="735" y="396" text-anchor="end">/ŋ/ اور /n/</text>
  <text class="muted" x="735" y="414" text-anchor="end">ng اور n</text>
  <text class="body" x="600" y="396" text-anchor="end">آخری /ŋ/ اکثر</text>
  <text class="body" x="600" y="414" text-anchor="end">/n/ سے بدل دیا جاتا ہے</text>
  <text class="body" x="270" y="396" text-anchor="end">sin - sing</text>
  <text class="body" x="270" y="414" text-anchor="end">thin - thing</text>
  <rect class="panel-b" x="30" y="436" width="720" height="56" rx="4"/>
  <text class="sh" x="735" y="460" text-anchor="end">/iː/ اور /ɪ/</text>
  <text class="muted" x="735" y="478" text-anchor="end">لمبی اور چھوٹی i</text>
  <text class="body" x="600" y="460" text-anchor="end">حرفِ علت کی لمبائی</text>
  <text class="body" x="600" y="478" text-anchor="end">بہت سی زبانوں میں تضادی نہیں</text>
  <text class="body" x="270" y="460" text-anchor="end">ship - sheep</text>
  <text class="body" x="270" y="478" text-anchor="end">live - leave</text>
  <text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
