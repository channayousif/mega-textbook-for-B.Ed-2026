<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">نیا لفظ پیش کرنے کے طریقے</title>
  <desc id="d">تصوری نقشہ جو نیا انگریزی لفظ پیش کرنے کے چھ طریقے دکھاتا ہے: تصویر، حقیقی شے، اشارہ، مثال جملہ، مترادف اور ترجمہ۔</desc>
  <style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; } .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; } .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style>
  <rect class="bg" x="0" y="0" width="780" height="400"/>
  <text class="h" x="390" y="34" text-anchor="middle">نیا لفظ پیش کرنے کے طریقے</text>
  <text class="muted" x="390" y="54" text-anchor="middle">چھ طریقے جو مفہوم انگریزی میں دکھاتے ہیں</text>
  <rect class="panel" x="285" y="160" width="210" height="80" rx="12"/>
  <text class="sh" x="390" y="194" text-anchor="middle">نیا لفظ</text>
  <text class="sh" x="390" y="214" text-anchor="middle">پیش کرنا</text>
  <rect class="panel-a" x="30" y="70" width="180" height="80" rx="8"/>
  <text class="sh" x="120" y="100" text-anchor="middle">تصویر</text>
  <text class="body" x="120" y="122" text-anchor="middle">فلیش کارڈ دکھائیں</text>
  <text class="body" x="120" y="140" text-anchor="middle">یا تصویر</text>
  <rect class="panel-b" x="30" y="160" width="180" height="80" rx="8"/>
  <text class="sh" x="120" y="190" text-anchor="middle">حقیقی شے</text>
  <text class="body" x="120" y="212" text-anchor="middle">اصل چیز دکھائیں</text>
  <text class="body" x="120" y="230" text-anchor="middle">یا ماڈل</text>
  <rect class="panel-c" x="30" y="250" width="180" height="80" rx="8"/>
  <text class="sh" x="120" y="280" text-anchor="middle">اشارہ</text>
  <text class="body" x="120" y="302" text-anchor="middle">مفہوم کو اشارے سے ادا کریں</text>
  <rect class="panel-d" x="570" y="70" width="180" height="80" rx="8"/>
  <text class="sh" x="660" y="100" text-anchor="middle">مثال جملہ</text>
  <text class="body" x="660" y="122" text-anchor="middle">اسے ایک سادہ</text>
  <text class="body" x="660" y="140" text-anchor="middle">انگریزی جملے میں استعمال کریں</text>
  <rect class="panel-a" x="570" y="160" width="180" height="80" rx="8"/>
  <text class="sh" x="660" y="190" text-anchor="middle">مترادف</text>
  <text class="body" x="660" y="212" text-anchor="middle">ایک مشابہ</text>
  <text class="body" x="660" y="230" text-anchor="middle">انگریزی لفظ دوں</text>
  <rect class="panel-b" x="570" y="250" width="180" height="80" rx="8"/>
  <text class="sh" x="660" y="280" text-anchor="middle">ترجمہ</text>
  <text class="body" x="660" y="302" text-anchor="middle">مادری زبان کا مطلب</text>
  <text class="body" x="660" y="320" text-anchor="middle">آخری مدد کے طور پر</text>
  <path class="stroke-a" d="M 570 110 L 500 175"/>
  <polygon class="ah" points="503,168 495,178 506,180"/>
  <path class="stroke-b" d="M 570 200 L 500 200"/>
  <polygon class="ah" points="504,195 495,200 504,205"/>
  <path class="stroke-c" d="M 570 290 L 500 225"/>
  <polygon class="ah" points="506,220 495,222 503,232"/>
  <path class="stroke-d" d="M 210 110 L 280 175"/>
  <polygon class="ah" points="277,168 285,178 274,180"/>
  <path class="stroke-a" d="M 210 200 L 280 200"/>
  <polygon class="ah" points="276,195 285,200 276,205"/>
  <path class="stroke-b" d="M 210 290 L 280 225"/>
  <polygon class="ah" points="274,220 285,222 277,232"/>
  <text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
