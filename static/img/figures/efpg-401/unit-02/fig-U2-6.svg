<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Composition Tasks by Grade Band</title><desc id="d">Table of composition tasks by grade band with the support each needs and the teacher's role.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="34" text-anchor="middle">Composition Tasks by Grade Band</text><text class="muted" x="390" y="54" text-anchor="middle">Matching the task, the support and the teacher's role</text><rect class="panel" x="30" y="72" width="720" height="36" rx="4"/><text class="sh" x="42" y="96">Aspect</text><text class="sh" x="180" y="96">Grades 1 to 2</text><text class="sh" x="370" y="96">Grades 3 to 5</text><text class="sh" x="560" y="96">Grades 6 to 8</text><rect class="panel-a" x="30" y="116" width="720" height="64" rx="4"/><text class="sh" x="42" y="140">Sample task</text><text class="muted" x="42" y="158">What pupils do</text><text class="body" x="180" y="140">Label a picture;</text><text class="body" x="180" y="158">copy three words</text><text class="body" x="370" y="140">Write a paragraph</text><text class="body" x="370" y="158">with prompts</text><text class="body" x="560" y="140">Write an essay or</text><text class="body" x="560" y="158">a story independently</text><rect class="panel-b" x="30" y="188" width="720" height="64" rx="4"/><text class="sh" x="42" y="212">Support needed</text><text class="muted" x="42" y="230">How much help</text><text class="body" x="180" y="212">A model and a</text><text class="body" x="180" y="230">word bank</text><text class="body" x="370" y="212">Prompts and a</text><text class="body" x="370" y="230">sentence frame</text><text class="body" x="560" y="212">A clear task and</text><text class="body" x="560" y="230">time to plan</text><rect class="panel-c" x="30" y="260" width="720" height="64" rx="4"/><text class="sh" x="42" y="284">Teacher's role</text><text class="muted" x="42" y="302">Teacher's work</text><text class="body" x="180" y="284">Demonstrate and</text><text class="body" x="180" y="302">guide each step</text><text class="body" x="370" y="284">Ask guiding questions;</text><text class="body" x="370" y="302">check ideas</text><text class="body" x="560" y="284">Set the task;</text><text class="body" x="560" y="302">give feedback on ideas</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
