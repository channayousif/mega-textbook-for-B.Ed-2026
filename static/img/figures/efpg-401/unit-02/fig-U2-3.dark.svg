<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Prose Teaching and Poetry Teaching Compared</title><desc id="d">Table comparing prose and poetry teaching on aim, reading aloud, memorisation and enjoyment.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="34" text-anchor="middle">Prose Teaching and Poetry Teaching Compared</text><text class="muted" x="390" y="54" text-anchor="middle">Two text types, two different lessons</text><rect class="panel" x="30" y="72" width="720" height="36" rx="4"/><text class="sh" x="45" y="96">Feature</text><text class="sh" x="245" y="96">Prose teaching</text><text class="sh" x="505" y="96">Poetry teaching</text><rect class="panel-a" x="30" y="116" width="720" height="58" rx="4"/><text class="sh" x="45" y="140">Aim</text><text class="body" x="245" y="140">Understand a continuous</text><text class="body" x="245" y="158">text and respond to it</text><text class="body" x="505" y="140">Enjoy a patterned text</text><text class="body" x="505" y="158">and respond to its meaning</text><rect class="panel-b" x="30" y="182" width="720" height="58" rx="4"/><text class="sh" x="45" y="206">Reading aloud</text><text class="body" x="245" y="206">Model reading, then</text><text class="body" x="245" y="224">silent reading for meaning</text><text class="body" x="505" y="206">Read aloud for sound</text><text class="body" x="505" y="224">and feeling, then chorus</text><rect class="panel-a" x="30" y="248" width="720" height="58" rx="4"/><text class="sh" x="45" y="272">Memorisation</text><text class="body" x="245" y="272">Not the main aim;</text><text class="body" x="245" y="290">meaning comes first</text><text class="body" x="505" y="272">A possible result,</text><text class="body" x="505" y="290">but not the aim</text><rect class="panel-b" x="30" y="314" width="720" height="58" rx="4"/><text class="sh" x="45" y="338">Enjoyment</text><text class="body" x="245" y="338">Comes through interest</text><text class="body" x="245" y="356">in the story or topic</text><text class="body" x="505" y="338">Central; the poem is</text><text class="body" x="505" y="356">experienced before analysis</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
