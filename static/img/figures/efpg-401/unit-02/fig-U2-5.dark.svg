<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The Guided-to-Free Composition Continuum</title><desc id="d">Flowchart showing the four steps of the guided-to-free composition continuum from copying to free writing, with support decreasing at each step.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; } .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; } .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah-a { fill: var(--a1); } .ah-b { fill: var(--a2); } .ah-c { fill: var(--a3); } .ah-d { fill: var(--a4); } .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="34" text-anchor="middle">The Guided-to-Free Composition Continuum</text><text class="muted" x="390" y="54" text-anchor="middle">Support decreases as pupils take responsibility for content</text><rect class="panel-a" x="40" y="76" width="150" height="250" rx="8"/><text class="sh" x="115" y="104" text-anchor="middle">1. Copying</text><line class="grid" x1="52" y1="114" x2="178" y2="114"/><text class="body" x="52" y="140">Trace or copy</text><text class="body" x="52" y="160">a model text</text><text class="small" x="52" y="196">Builds handwriting</text><text class="small" x="52" y="214">and spelling</text><rect class="panel-b" x="225" y="76" width="150" height="250" rx="8"/><text class="sh" x="300" y="104" text-anchor="middle">2. Completing</text><line class="grid" x1="237" y1="114" x2="363" y2="114"/><text class="body" x="237" y="140">Finish a partly</text><text class="body" x="237" y="160">written text</text><text class="small" x="237" y="196">Think about content</text><text class="small" x="237" y="214">with a frame</text><rect class="panel-c" x="410" y="76" width="150" height="250" rx="8"/><text class="sh" x="485" y="104" text-anchor="middle">3. Guided writing</text><line class="grid" x1="422" y1="114" x2="548" y2="114"/><text class="body" x="422" y="140">Write with</text><text class="body" x="422" y="160">prompts or questions</text><text class="small" x="422" y="196">Frame guides</text><text class="small" x="422" y="214">the ideas</text><rect class="panel-d" x="595" y="76" width="150" height="250" rx="8"/><text class="sh" x="670" y="104" text-anchor="middle">4. Free writing</text><line class="grid" x1="607" y1="114" x2="733" y2="114"/><text class="body" x="607" y="140">Write independently</text><text class="body" x="607" y="160">on a new topic</text><text class="small" x="607" y="196">Choose and</text><text class="small" x="607" y="214">organise ideas</text><path class="stroke-a" d="M 190 200 L 220 200"/><polygon class="ah-a" points="220,195 228,200 220,205"/><path class="stroke-b" d="M 375 200 L 405 200"/><polygon class="ah-b" points="405,195 413,200 405,205"/><path class="stroke-c" d="M 560 200 L 590 200"/><polygon class="ah-c" points="590,195 598,200 590,205"/><path class="stroke-d" stroke-dasharray="4 4" d="M 60 350 L 720 350"/><polygon class="ah-d" points="720,345 728,350 720,355"/><text class="small" x="390" y="372" text-anchor="middle">Support decreases from copying to free writing</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
