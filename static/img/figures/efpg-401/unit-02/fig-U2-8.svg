<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Vocabulary Strategies Learners Rate</title><desc id="d">Table of vocabulary strategies showing which learners rate effective and ineffective, with a classroom example for each.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="580"/><text class="h" x="390" y="34" text-anchor="middle">Vocabulary Strategies Learners Rate</text><text class="muted" x="390" y="54" text-anchor="middle">Findings from Tamimi Sa'd and Rajabi (2018)</text><rect class="panel" x="30" y="72" width="720" height="36" rx="4"/><text class="sh" x="45" y="96">Strategy</text><text class="sh" x="285" y="96">Learners' rating</text><text class="sh" x="475" y="96">Classroom example</text><rect class="panel-a" x="30" y="116" width="720" height="56" rx="4"/><text class="sh" x="45" y="140">Reading and repeating words</text><text class="muted" x="45" y="158">Most favoured</text><text class="body" x="285" y="140">Effective</text><text class="body" x="475" y="140">Chorus and pair repetition</text><text class="body" x="475" y="158">of new words</text><rect class="panel-a" x="30" y="180" width="720" height="56" rx="4"/><text class="sh" x="45" y="204">Using words in context</text><text class="muted" x="45" y="222">Specific context</text><text class="body" x="285" y="204">Effective</text><text class="body" x="475" y="204">Write a sentence using</text><text class="body" x="475" y="222">the word in a situation</text><rect class="panel-b" x="30" y="244" width="720" height="56" rx="4"/><text class="sh" x="45" y="268">Using words in sentences</text><text class="muted" x="45" y="286">Most frequent</text><text class="body" x="285" y="268">Frequent</text><text class="body" x="475" y="268">"The mango is sweet."</text><rect class="panel-b" x="30" y="308" width="720" height="56" rx="4"/><text class="sh" x="45" y="332">Translation to mother tongue</text><text class="muted" x="45" y="350">Very frequent</text><text class="body" x="285" y="332">Frequent, but shallow</text><text class="body" x="475" y="332">Quick check, then use</text><text class="body" x="475" y="350">the word in English</text><rect class="panel-a" x="30" y="372" width="720" height="56" rx="4"/><text class="sh" x="45" y="396">Using dictionaries</text><text class="muted" x="45" y="414">Underused</text><text class="body" x="285" y="396">Underused but effective</text><text class="body" x="475" y="396">Look up a word and read</text><text class="body" x="475" y="414">its example sentence</text><rect class="panel-c" x="30" y="436" width="720" height="56" rx="4"/><text class="sh" x="45" y="460">Superficial attention</text><text class="muted" x="45" y="478">Surface only</text><text class="body" x="285" y="460">Ineffective</text><text class="body" x="475" y="460">Copy a list once and</text><text class="body" x="475" y="478">never use the words</text><rect class="panel-c" x="30" y="500" width="720" height="44" rx="4"/><text class="sh" x="45" y="522">Excessive mother-tongue use</text><text class="body" x="285" y="522">Ineffective</text><text class="body" x="475" y="522">Teach the whole lesson in Urdu</text><text class="wm" x="768" y="570" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
