<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six Steps of a Prose Lesson</title><desc id="d">Flowchart of a prose lesson showing six steps from warm-up through new words, model reading, silent reading and comprehension questions to a follow-up task.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; } .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; } .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ah-a { fill: var(--a1); } .ah-b { fill: var(--a2); } .ah-c { fill: var(--a3); } .ah-d { fill: var(--a4); } .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="390" y="34" text-anchor="middle">Six Steps of a Prose Lesson</text><text class="muted" x="390" y="54" text-anchor="middle">A reliable sequence for Grades 4 to 8</text><rect class="panel-a" x="40" y="72" width="220" height="130" rx="8"/><text class="sh" x="150" y="98" text-anchor="middle">1. Warm-up</text><line class="grid" x1="55" y1="108" x2="245" y2="108"/><text class="body" x="60" y="130">Connect to pupils' lives</text><text class="body" x="60" y="152">Show a picture or ask</text><text class="body" x="60" y="174">two simple questions</text><rect class="panel-b" x="280" y="72" width="220" height="130" rx="8"/><text class="sh" x="390" y="98" text-anchor="middle">2. New words</text><line class="grid" x1="295" y1="108" x2="485" y2="108"/><text class="body" x="300" y="130">Pre-teach four to six</text><text class="body" x="300" y="152">key words in context</text><text class="body" x="300" y="174">Use pictures or actions</text><rect class="panel-c" x="520" y="72" width="220" height="130" rx="8"/><text class="sh" x="630" y="98" text-anchor="middle">3. Model reading</text><line class="grid" x1="535" y1="108" x2="725" y2="108"/><text class="body" x="540" y="130">Teacher reads aloud</text><text class="body" x="540" y="152">with expression once;</text><text class="body" x="540" y="174">pupils follow in books</text><path class="stroke-a" d="M 260 137 L 275 137"/><polygon class="ah-a" points="275,132 283,137 275,142"/><path class="stroke-b" d="M 500 137 L 515 137"/><polygon class="ah-b" points="515,132 523,137 515,142"/><rect class="panel-d" x="40" y="222" width="220" height="130" rx="8"/><text class="sh" x="150" y="248" text-anchor="middle">4. Silent reading</text><line class="grid" x1="55" y1="258" x2="245" y2="258"/><text class="body" x="60" y="280">Pupils read quietly</text><text class="body" x="60" y="302">at their own pace;</text><text class="body" x="60" y="324">teacher supports</text><rect class="panel-a" x="280" y="222" width="220" height="130" rx="8"/><text class="sh" x="390" y="248" text-anchor="middle">5. Comprehension</text><line class="grid" x1="295" y1="258" x2="485" y2="258"/><text class="body" x="300" y="280">Literal, inferential and</text><text class="body" x="300" y="302">personal response</text><text class="body" x="300" y="324">questions</text><rect class="panel-b" x="520" y="222" width="220" height="130" rx="8"/><text class="sh" x="630" y="248" text-anchor="middle">6. Follow-up</text><line class="grid" x1="535" y1="258" x2="725" y2="258"/><text class="body" x="540" y="280">A short speaking or</text><text class="body" x="540" y="302">writing task using</text><text class="body" x="540" y="324">the text</text><path class="stroke-c" d="M 630 202 L 630 212 L 150 212 L 150 218"/><polygon class="ah-c" points="145,218 150,226 155,218"/><path class="stroke-d" d="M 260 287 L 275 287"/><polygon class="ah-d" points="275,282 283,287 275,292"/><path class="stroke-a" d="M 500 287 L 515 287"/><polygon class="ah-a" points="515,282 523,287 515,292"/><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
