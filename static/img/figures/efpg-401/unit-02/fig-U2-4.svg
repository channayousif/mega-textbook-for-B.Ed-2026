<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A Rain Poem Marked for Teaching</title><desc id="d">Diagram of a short rain poem with rhyming words, rhythm beats and a labelled image marked for teaching.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; } .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .poem { font-size: 16px; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="34" text-anchor="middle">A Rain Poem Marked for Teaching</text><text class="muted" x="390" y="54" text-anchor="middle">Rhyme, rhythm and imagery made visible</text><rect class="panel" x="60" y="70" width="660" height="270" rx="8"/><text class="poem" x="130" y="150">Soft rain falls,</text><text class="poem" x="130" y="195">Silver threads on the street,</text><text class="poem" x="130" y="240">Children splash with glee,</text><text class="poem" x="130" y="285">Happy sound of little feet.</text><ellipse class="stroke-c" cx="197" cy="188" rx="76" ry="17"/><text class="small" x="197" y="170" text-anchor="middle">image</text><line class="stroke-a" x1="332" y1="200" x2="399" y2="200"/><line class="stroke-a" x1="341" y1="290" x2="389" y2="290"/><text class="small" x="410" y="200">rhyme</text><text class="small" x="398" y="290">rhyme</text><text class="small" x="130" y="170">1 2 3 4</text><text class="small" x="130" y="215">1 2 3 4</text><text class="small" x="130" y="260">1 2 3 4</text><text class="small" x="130" y="305">1 2 3 4</text><text class="small" x="190" y="305">rhythm</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
