<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Ways to Present a New Word</title><desc id="d">Concept map showing six ways to present a new English word: picture, object, mime, example sentence, synonym and translation.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; } .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; } .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="34" text-anchor="middle">Ways to Present a New Word</text><text class="muted" x="390" y="54" text-anchor="middle">Six methods that show meaning in English</text><rect class="panel" x="285" y="160" width="210" height="80" rx="12"/><text class="sh" x="390" y="194" text-anchor="middle">Presenting</text><text class="sh" x="390" y="214" text-anchor="middle">a New Word</text><rect class="panel-a" x="30" y="70" width="180" height="80" rx="8"/><text class="sh" x="120" y="100" text-anchor="middle">Picture</text><text class="body" x="120" y="122" text-anchor="middle">Show a flash card</text><text class="body" x="120" y="140" text-anchor="middle">or photograph</text><rect class="panel-b" x="30" y="160" width="180" height="80" rx="8"/><text class="sh" x="120" y="190" text-anchor="middle">Object</text><text class="body" x="120" y="212" text-anchor="middle">Show the real thing</text><text class="body" x="120" y="230" text-anchor="middle">or a model</text><rect class="panel-c" x="30" y="250" width="180" height="80" rx="8"/><text class="sh" x="120" y="280" text-anchor="middle">Mime</text><text class="body" x="120" y="302" text-anchor="middle">Act out the meaning</text><rect class="panel-d" x="570" y="70" width="180" height="80" rx="8"/><text class="sh" x="660" y="100" text-anchor="middle">Example sentence</text><text class="body" x="660" y="122" text-anchor="middle">Use it in a simple</text><text class="body" x="660" y="140" text-anchor="middle">English sentence</text><rect class="panel-a" x="570" y="160" width="180" height="80" rx="8"/><text class="sh" x="660" y="190" text-anchor="middle">Synonym</text><text class="body" x="660" y="212" text-anchor="middle">Give a similar</text><text class="body" x="660" y="230" text-anchor="middle">English word</text><rect class="panel-b" x="570" y="250" width="180" height="80" rx="8"/><text class="sh" x="660" y="280" text-anchor="middle">Translation</text><text class="body" x="660" y="302" text-anchor="middle">Mother-tongue meaning</text><text class="body" x="660" y="320" text-anchor="middle">as final support</text><path class="stroke-a" d="M 210 110 L 280 175"/><polygon class="ah" points="277,168 285,178 274,180"/><path class="stroke-b" d="M 210 200 L 280 200"/><polygon class="ah" points="276,195 285,200 276,205"/><path class="stroke-c" d="M 210 290 L 280 225"/><polygon class="ah" points="274,220 285,222 277,232"/><path class="stroke-d" d="M 570 110 L 500 175"/><polygon class="ah" points="503,168 495,178 506,180"/><path class="stroke-a" d="M 570 200 L 500 200"/><polygon class="ah" points="504,195 495,200 504,205"/><path class="stroke-b" d="M 570 290 L 500 225"/><polygon class="ah" points="506,220 495,222 503,232"/><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
