<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comprehension Question Types</title><desc id="d">Table comparing literal, inferential and personal response comprehension questions with the purpose, an example and the skill each builds for a Grade 6 story.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="34" text-anchor="middle">Comprehension Question Types</text><text class="muted" x="390" y="54" text-anchor="middle">Moving from facts to inference and personal response</text><rect class="panel" x="30" y="72" width="720" height="36" rx="4"/><text class="sh" x="45" y="96">Question type</text><text class="sh" x="220" y="96">Purpose</text><text class="sh" x="490" y="96">Example from a Grade 6 story</text><rect class="panel-a" x="30" y="116" width="720" height="64" rx="4"/><text class="sh" x="45" y="140">Literal</text><text class="muted" x="45" y="158">Facts in the text</text><text class="body" x="220" y="140">Check that pupils can find</text><text class="body" x="220" y="158">information stated in the text</text><text class="body" x="490" y="140">"Who found the axe in</text><text class="body" x="490" y="158">the river?"</text><rect class="panel-b" x="30" y="188" width="720" height="64" rx="4"/><text class="sh" x="45" y="212">Inferential</text><text class="muted" x="45" y="230">Reading between lines</text><text class="body" x="220" y="212">Ask pupils to use clues to</text><text class="body" x="220" y="230">work out what is not stated</text><text class="body" x="490" y="212">"Why did the woodcutter say</text><text class="body" x="490" y="230">the gold axe was not his?"</text><rect class="panel-c" x="30" y="260" width="720" height="64" rx="4"/><text class="sh" x="45" y="284">Personal response</text><text class="muted" x="45" y="302">Own view</text><text class="body" x="220" y="284">Ask pupils to connect the text</text><text class="body" x="220" y="302">to their own life and values</text><text class="body" x="490" y="284">"Would you have returned</text><text class="body" x="490" y="302">the axe? Why?"</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
