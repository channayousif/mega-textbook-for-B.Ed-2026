<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">English Sounds Local Speakers Find Hard</title><desc id="d">Table of English sounds that Urdu, Sindhi and Pashto speakers often find hard, with a minimal-pair drill for each.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="390" y="34" text-anchor="middle">English Sounds Local Speakers Find Hard</text><text class="muted" x="390" y="54" text-anchor="middle">Minimal-pair drills for six common difficulties</text><rect class="panel" x="30" y="72" width="720" height="36" rx="4"/><text class="sh" x="45" y="96">Sound</text><text class="sh" x="180" y="96">Common difficulty</text><text class="sh" x="510" y="96">Minimal-pair drill</text><rect class="panel-a" x="30" y="116" width="720" height="56" rx="4"/><text class="sh" x="45" y="140">/v/ and /w/</text><text class="muted" x="45" y="158">v versus w</text><text class="body" x="180" y="140">Many speakers use /v/ for both,</text><text class="body" x="180" y="158">so "west" sounds like "vest"</text><text class="body" x="510" y="140">vest - west</text><text class="body" x="510" y="158">vine - wine</text><rect class="panel-b" x="30" y="180" width="720" height="56" rx="4"/><text class="sh" x="45" y="204">/f/ and /p/</text><text class="muted" x="45" y="222">f versus p</text><text class="body" x="180" y="204">Some speakers substitute</text><text class="body" x="180" y="222">/p/ for /f/</text><text class="body" x="510" y="204">fan - pan</text><text class="body" x="510" y="222">fat - pat</text><rect class="panel-c" x="30" y="244" width="720" height="56" rx="4"/><text class="sh" x="45" y="268">/θ/ and /ð/</text><text class="muted" x="45" y="286">th sounds</text><text class="body" x="180" y="268">These sounds are absent; speakers</text><text class="body" x="180" y="286">use /t/, /s/ or /d/, /z/</text><text class="body" x="510" y="268">thin - tin</text><text class="body" x="510" y="286">this - these</text><rect class="panel-d" x="30" y="308" width="720" height="56" rx="4"/><text class="sh" x="45" y="332">/tʃ/ and /dʒ/</text><text class="muted" x="45" y="350">ch and j</text><text class="body" x="180" y="332">Speakers may confuse</text><text class="body" x="180" y="350">the two affricates</text><text class="body" x="510" y="332">chair - jar</text><text class="body" x="510" y="350">cheap - jeep</text><rect class="panel-a" x="30" y="372" width="720" height="56" rx="4"/><text class="sh" x="45" y="396">/ŋ/ and /n/</text><text class="muted" x="45" y="414">ng and n</text><text class="body" x="180" y="396">Final /ŋ/ is often</text><text class="body" x="180" y="414">replaced by /n/</text><text class="body" x="510" y="396">sin - sing</text><text class="body" x="510" y="414">thin - thing</text><rect class="panel-b" x="30" y="436" width="720" height="56" rx="4"/><text class="sh" x="45" y="460">/iː/ and /ɪ/</text><text class="muted" x="45" y="478">long and short i</text><text class="body" x="180" y="460">Vowel length is not</text><text class="body" x="180" y="478">contrastive in many languages</text><text class="body" x="510" y="460">ship - sheep</text><text class="body" x="510" y="478">live - leave</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
