<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">تفہیمی سوالات کی اقسام</title>
  <desc id="d">جدول جو صریح، استنباطی اور ذاتی جواب کے تفہیمی سوالات کا موازنہ کرتا ہے، چھٹی جماعت کی کہانی کے لیے مقصد، مثال اور مہارت کے ساتھ۔</desc>
  <style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style>
  <rect class="bg" x="0" y="0" width="780" height="400"/>
  <text class="h" x="390" y="34" text-anchor="middle">تفہیمی سوالات کی اقسام</text>
  <text class="muted" x="390" y="54" text-anchor="middle">حقائق سے استنباط اور ذاتی جواب کی طرف</text>
  <rect class="panel" x="30" y="72" width="720" height="36" rx="4"/>
  <text class="sh" x="735" y="96" text-anchor="end">سوال کی قسم</text>
  <text class="sh" x="560" y="96" text-anchor="end">مقصد</text>
  <text class="sh" x="290" y="96" text-anchor="end">چھٹی جماعت کی کہانی کی مثال</text>
  <rect class="panel-a" x="30" y="116" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="140" text-anchor="end">صریح</text>
  <text class="muted" x="735" y="158" text-anchor="end">عبارت میں حقائق</text>
  <text class="body" x="560" y="140" text-anchor="end">یہ جانچنا کہ بچے عبارت میں</text>
  <text class="body" x="560" y="158" text-anchor="end">موجود معلومات تلاش کر سکتے ہیں</text>
  <text class="body" x="290" y="140" text-anchor="end">Who found the axe in</text>
  <text class="body" x="290" y="158" text-anchor="end">the river?</text>
  <rect class="panel-b" x="30" y="188" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="212" text-anchor="end">استنباطی</text>
  <text class="muted" x="735" y="230" text-anchor="end">لکیروں کے درمیان پڑھنا</text>
  <text class="body" x="560" y="212" text-anchor="end">بچوں سے اشارے استعمال کر کے</text>
  <text class="body" x="560" y="230" text-anchor="end">وہ معلوم کرنے کو کہیں جو بتایا نہیں گیا</text>
  <text class="body" x="290" y="212" text-anchor="end">Why did the woodcutter say</text>
  <text class="body" x="290" y="230" text-anchor="end">the gold axe was not his?</text>
  <rect class="panel-c" x="30" y="260" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="284" text-anchor="end">ذاتی جواب</text>
  <text class="muted" x="735" y="302" text-anchor="end">اپنی رائے</text>
  <text class="body" x="560" y="284" text-anchor="end">بچوں سے عبارت کو اپنی زندگی</text>
  <text class="body" x="560" y="302" text-anchor="end">اور اقدار سے جوڑنے کو کہیں</text>
  <text class="body" x="290" y="284" text-anchor="end">Would you have returned</text>
  <text class="body" x="290" y="302" text-anchor="end">the axe? Why?</text>
  <text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
