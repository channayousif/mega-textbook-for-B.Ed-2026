<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four video sources a teacher can use</title><desc id="d">Table of four video sources a Pakistani teacher can use, with how to get each and a criterion for choosing a suitable clip.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="390" y="30" text-anchor="middle">Four video sources a teacher can use</text><rect class="panel" x="30" y="48" width="720" height="32" rx="4"/><text class="sh" x="110" y="69" text-anchor="middle">Video source</text><text class="sh" x="325" y="69" text-anchor="middle">How to get it</text><text class="sh" x="605" y="69" text-anchor="middle">Criterion for choosing a clip</text><rect class="panel-a" x="30" y="86" width="720" height="64" rx="4"/><text class="sh" x="110" y="122" text-anchor="middle">School DVD or USB</text><text class="body" x="325" y="112" text-anchor="middle">Ask the school for a</text><text class="body" x="325" y="132" text-anchor="middle">donated DVD or USB</text><text class="body" x="605" y="112" text-anchor="middle">Choose a clip under three minutes</text><text class="body" x="605" y="132" text-anchor="middle">with one clear idea</text><rect class="panel-b" x="30" y="156" width="720" height="64" rx="4"/><text class="sh" x="110" y="192" text-anchor="middle">Mobile phone download</text><text class="body" x="325" y="182" text-anchor="middle">Download from a free</text><text class="body" x="325" y="202" text-anchor="middle">educational site on a phone</text><text class="body" x="605" y="182" text-anchor="middle">Pick a clip with clear voices</text><text class="body" x="605" y="202" text-anchor="middle">and no fast editing</text><rect class="panel-c" x="30" y="226" width="720" height="64" rx="4"/><text class="sh" x="110" y="262" text-anchor="middle">Educational television</text><text class="body" x="325" y="252" text-anchor="middle">Record a short programme</text><text class="body" x="325" y="272" text-anchor="middle">with a timer or a phone</text><text class="body" x="605" y="252" text-anchor="middle">Choose a programme that matches</text><text class="body" x="605" y="272" text-anchor="middle">the lesson outcome</text><rect class="panel-d" x="30" y="296" width="720" height="64" rx="4"/><text class="sh" x="110" y="332" text-anchor="middle">Classroom projector</text><text class="body" x="325" y="322" text-anchor="middle">Connect a phone or computer</text><text class="body" x="325" y="342" text-anchor="middle">to the projector</text><text class="body" x="605" y="322" text-anchor="middle">Show one picture or clip that</text><text class="body" x="605" y="342" text-anchor="middle">carries the new language</text><text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
