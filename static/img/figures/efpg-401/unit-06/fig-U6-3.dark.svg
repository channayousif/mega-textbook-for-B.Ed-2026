<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five low-cost teaching aids</title><desc id="d">Table of five low-cost teaching aids - charts, models, pictures, flash cards and real objects - showing how to make each and one English-lesson use.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="390" y="34" text-anchor="middle">Five low-cost teaching aids</text><text class="sh" x="390" y="58" text-anchor="middle">How to make each aid and one English-lesson use</text><rect class="panel" x="30" y="72" width="720" height="32" rx="4"/><text class="sh" x="95" y="93" text-anchor="middle">Aid</text><text class="sh" x="310" y="93" text-anchor="middle">How to make it</text><text class="sh" x="605" y="93" text-anchor="middle">One English-lesson use</text><rect class="panel-a" x="30" y="110" width="720" height="56" rx="4"/><text class="sh" x="95" y="144" text-anchor="middle">Charts</text><text class="body" x="310" y="134" text-anchor="middle">Draw on brown paper</text><text class="body" x="310" y="154" text-anchor="middle">with a thick marker</text><text class="body" x="605" y="134" text-anchor="middle">Point to each fruit and ask:</text><text class="body" x="605" y="154" text-anchor="middle">What is this?</text><rect class="panel-b" x="30" y="172" width="720" height="56" rx="4"/><text class="sh" x="95" y="206" text-anchor="middle">Models</text><text class="body" x="310" y="196" text-anchor="middle">Shape clay into the object</text><text class="body" x="310" y="216" text-anchor="middle">or build it from scrap</text><text class="body" x="605" y="196" text-anchor="middle">Name the parts of a body</text><text class="body" x="605" y="216" text-anchor="middle">or a building</text><rect class="panel-c" x="30" y="234" width="720" height="56" rx="4"/><text class="sh" x="95" y="268" text-anchor="middle">Pictures</text><text class="body" x="310" y="258" text-anchor="middle">Cut images from old</text><text class="body" x="310" y="278" text-anchor="middle">magazines or calendars</text><text class="body" x="605" y="258" text-anchor="middle">Match each picture to</text><text class="body" x="605" y="278" text-anchor="middle">a new English word</text><rect class="panel-d" x="30" y="296" width="720" height="56" rx="4"/><text class="sh" x="95" y="330" text-anchor="middle">Flash cards</text><text class="body" x="310" y="320" text-anchor="middle">Cut old envelopes</text><text class="body" x="310" y="340" text-anchor="middle">into small cards</text><text class="body" x="605" y="320" text-anchor="middle">Hold up a card and ask</text><text class="body" x="605" y="340" text-anchor="middle">the class to read it</text><rect class="panel-a" x="30" y="358" width="720" height="56" rx="4"/><text class="sh" x="95" y="392" text-anchor="middle">Real objects</text><text class="body" x="310" y="382" text-anchor="middle">Bring a cup, a key,</text><text class="body" x="310" y="402" text-anchor="middle">a mango or a leaf</text><text class="body" x="605" y="382" text-anchor="middle">Hold up the object and ask:</text><text class="body" x="605" y="402" text-anchor="middle">What is this?</text><text class="wm" x="768" y="432" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
