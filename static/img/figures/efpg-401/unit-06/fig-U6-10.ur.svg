<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">صاف سلائیڈ اور بھیڑ سلائیڈ</title><desc id="d">دو پینل نقشہ جو صاف سلائیڈ (ایک خیال، چند الفاظ اور ایک تصویر) کا بھرپور جملوں والی بھیڑ سلائیڈ سے موازنہ کرتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .line { fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="390" y="32" text-anchor="middle">صاف سلائیڈ اور بھیڑ سلائیڈ</text><rect class="panel-a" x="400" y="56" width="350" height="270" rx="8"/><text class="sh" x="575" y="86" text-anchor="middle">صاف</text><rect class="panel-b" x="510" y="100" width="130" height="80" rx="4"/><circle class="panel-c" cx="602" cy="128" r="12"/><polygon class="panel-b" points="640,180 575,150 510,180"/><text class="body" x="575" y="220" text-anchor="middle">گرم، دھوپ، آم، فصل</text><text class="muted" x="575" y="250" text-anchor="middle">ایک خیال، چھ الفاظ، ایک تصویر</text><text class="muted" x="575" y="272" text-anchor="middle">استاد وضاحت کرتا ہے۔</text><rect class="panel-d" x="30" y="56" width="350" height="270" rx="8"/><text class="sh" x="205" y="86" text-anchor="middle">بھیڑ</text><rect class="line" x="55" y="105" width="300" height="8" rx="2"/><rect class="line" x="55" y="127" width="300" height="8" rx="2"/><rect class="line" x="55" y="149" width="300" height="8" rx="2"/><rect class="line" x="55" y="171" width="300" height="8" rx="2"/><rect class="line" x="55" y="193" width="300" height="8" rx="2"/><rect class="line" x="55" y="215" width="300" height="8" rx="2"/><rect class="line" x="115" y="237" width="240" height="8" rx="2"/><text class="muted" x="205" y="272" text-anchor="middle">لمبے جملے، کوئی تصویر نہیں</text><text class="muted" x="205" y="294" text-anchor="middle">استاد سلائیڈ پڑھتا ہے۔</text><text class="wm" x="768" y="370" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
