<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین سمعی وسائل کا موازنہ</title><desc id="d">ریڈیو، کیسٹ پلیئر اور موبائل فون کی آواز کا بطور جماعتی سمعی وسیلہ موازنہ: ہر ایک کی طاقت اور حد۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="340"/><text class="h" x="390" y="30" text-anchor="middle">تین سمعی وسائل کا موازنہ</text><rect class="panel" x="30" y="48" width="720" height="32" rx="4"/><text class="sh" x="660" y="69" text-anchor="middle">سمعی وسیلہ</text><text class="sh" x="460" y="69" text-anchor="middle">کیا چلاتا ہے</text><text class="sh" x="260" y="69" text-anchor="middle">طاقت</text><text class="sh" x="95" y="69" text-anchor="middle">حد</text><rect class="panel-a" x="30" y="86" width="720" height="64" rx="4"/><text class="sh" x="660" y="122" text-anchor="middle">ریڈیو</text><text class="body" x="460" y="112" text-anchor="middle">نشریات، کہانیاں،</text><text class="body" x="460" y="132" text-anchor="middle">گانے</text><text class="body" x="260" y="112" text-anchor="middle">قدرتی رفتار کی</text><text class="body" x="260" y="132" text-anchor="middle">حقیقی آوازیں</text><text class="body" x="95" y="122" text-anchor="middle">روك یا دہرا نہیں سکتا</text><rect class="panel-b" x="30" y="156" width="720" height="64" rx="4"/><text class="sh" x="660" y="192" text-anchor="middle">کیسٹ پلیئر</text><text class="body" x="460" y="182" text-anchor="middle">ریکارڈ شدہ سبق</text><text class="body" x="460" y="202" text-anchor="middle">اور مشقیں</text><text class="body" x="260" y="192" text-anchor="middle">جملہ دہرا سکتا ہے</text><text class="body" x="95" y="182" text-anchor="middle">ٹیپ گھس جاتی ہے</text><text class="body" x="95" y="202" text-anchor="middle">اور سرسراہٹ آتی ہے</text><rect class="panel-c" x="30" y="226" width="720" height="64" rx="4"/><text class="sh" x="660" y="262" text-anchor="middle">موبائل فون کی آواز</text><text class="body" x="460" y="252" text-anchor="middle">ڈاؤن لوڈ شدہ کلپ</text><text class="body" x="460" y="272" text-anchor="middle">اور گانے</text><text class="body" x="260" y="252" text-anchor="middle">روکنا، دہرانا،</text><text class="body" x="260" y="272" text-anchor="middle">رفتار پر قابو</text><text class="body" x="95" y="252" text-anchor="middle">بجلی چاہیے</text><text class="body" x="95" y="272" text-anchor="middle">اور اسپیکر</text><text class="wm" x="768" y="330" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
