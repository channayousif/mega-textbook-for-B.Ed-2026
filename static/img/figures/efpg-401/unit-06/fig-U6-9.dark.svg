<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four projected aids compared</title><desc id="d">Table comparing slides, filmstrip, overhead projector and multimedia projector on approximate cost, power needs and best classroom use.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="390" y="30" text-anchor="middle">Four projected aids compared</text><rect class="panel" x="30" y="48" width="720" height="32" rx="4"/><text class="sh" x="105" y="69" text-anchor="middle">Projected aid</text><text class="sh" x="255" y="69" text-anchor="middle">Approximate cost</text><text class="sh" x="395" y="69" text-anchor="middle">Power needs</text><text class="sh" x="610" y="69" text-anchor="middle">Best classroom use</text><rect class="panel-a" x="30" y="86" width="720" height="64" rx="4"/><text class="sh" x="105" y="122" text-anchor="middle">Slides</text><text class="body" x="255" y="122" text-anchor="middle">Low</text><text class="body" x="395" y="122" text-anchor="middle">Electricity</text><text class="body" x="610" y="112" text-anchor="middle">One image at a time</text><text class="body" x="610" y="132" text-anchor="middle">for the whole class</text><rect class="panel-b" x="30" y="156" width="720" height="64" rx="4"/><text class="sh" x="105" y="192" text-anchor="middle">Filmstrip</text><text class="body" x="255" y="192" text-anchor="middle">Low</text><text class="body" x="395" y="192" text-anchor="middle">Electricity</text><text class="body" x="610" y="182" text-anchor="middle">A fixed sequence of</text><text class="body" x="610" y="202" text-anchor="middle">pictures and captions</text><rect class="panel-c" x="30" y="226" width="720" height="64" rx="4"/><text class="sh" x="105" y="262" text-anchor="middle">Overhead projector</text><text class="body" x="255" y="262" text-anchor="middle">Medium</text><text class="body" x="395" y="262" text-anchor="middle">Electricity</text><text class="body" x="610" y="252" text-anchor="middle">Writing on a transparent</text><text class="body" x="610" y="272" text-anchor="middle">sheet, lights on</text><rect class="panel-d" x="30" y="296" width="720" height="64" rx="4"/><text class="sh" x="105" y="332" text-anchor="middle">Multimedia projector</text><text class="body" x="255" y="332" text-anchor="middle">High</text><text class="body" x="395" y="322" text-anchor="middle">Electricity</text><text class="body" x="395" y="342" text-anchor="middle">and a device</text><text class="body" x="610" y="322" text-anchor="middle">Slides, pictures and</text><text class="body" x="610" y="342" text-anchor="middle">video on a screen</text><text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
