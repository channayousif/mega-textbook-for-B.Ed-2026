<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A clear slide and a crowded slide</title><desc id="d">Two-panel diagram contrasting a clear slide with one idea, few words and a picture against a crowded slide full of long sentences.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .line { fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="390" y="32" text-anchor="middle">A clear slide and a crowded slide</text><rect class="panel-a" x="30" y="56" width="350" height="270" rx="8"/><text class="sh" x="205" y="86" text-anchor="middle">Clear</text><rect class="panel-b" x="140" y="100" width="130" height="80" rx="4"/><circle class="panel-c" cx="178" cy="128" r="12"/><polygon class="panel-b" points="140,180 205,150 270,180"/><text class="body" x="205" y="220" text-anchor="middle">hot, sunny, mangoes, harvest</text><text class="muted" x="205" y="250" text-anchor="middle">One idea, six words, one picture</text><text class="muted" x="205" y="272" text-anchor="middle">The teacher explains.</text><rect class="panel-d" x="400" y="56" width="350" height="270" rx="8"/><text class="sh" x="575" y="86" text-anchor="middle">Crowded</text><rect class="line" x="425" y="105" width="300" height="8" rx="2"/><rect class="line" x="425" y="127" width="300" height="8" rx="2"/><rect class="line" x="425" y="149" width="300" height="8" rx="2"/><rect class="line" x="425" y="171" width="300" height="8" rx="2"/><rect class="line" x="425" y="193" width="300" height="8" rx="2"/><rect class="line" x="425" y="215" width="300" height="8" rx="2"/><rect class="line" x="425" y="237" width="240" height="8" rx="2"/><text class="muted" x="575" y="272" text-anchor="middle">Long sentences, no picture</text><text class="muted" x="575" y="294" text-anchor="middle">The teacher reads the slide.</text><text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
