<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A language laboratory layout</title><desc id="d">Diagram of a language laboratory with a teacher console and six pupil booths, showing how the teacher monitors and speaks to individual pupils.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .muted { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--a1); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="390" y="28" text-anchor="middle">A language laboratory layout</text><rect class="panel" x="290" y="48" width="200" height="56" rx="6"/><text class="sh" x="390" y="72" text-anchor="middle">Teacher console</text><text class="muted" x="390" y="90" text-anchor="middle">listens and speaks</text><rect class="panel-b" x="70" y="150" width="180" height="70" rx="6"/><text class="sh" x="160" y="180" text-anchor="middle">Pupil booth 1</text><text class="muted" x="160" y="200" text-anchor="middle">headset and mic</text><rect class="panel-b" x="290" y="150" width="180" height="70" rx="6"/><text class="sh" x="380" y="180" text-anchor="middle">Pupil booth 2</text><text class="muted" x="380" y="200" text-anchor="middle">headset and mic</text><rect class="panel-b" x="510" y="150" width="180" height="70" rx="6"/><text class="sh" x="600" y="180" text-anchor="middle">Pupil booth 3</text><text class="muted" x="600" y="200" text-anchor="middle">headset and mic</text><rect class="panel-a" x="70" y="250" width="180" height="70" rx="6"/><text class="sh" x="160" y="280" text-anchor="middle">Pupil booth 4</text><text class="muted" x="160" y="300" text-anchor="middle">headset and mic</text><rect class="panel-a" x="290" y="250" width="180" height="70" rx="6"/><text class="sh" x="380" y="280" text-anchor="middle">Pupil booth 5</text><text class="muted" x="380" y="300" text-anchor="middle">headset and mic</text><rect class="panel-a" x="510" y="250" width="180" height="70" rx="6"/><text class="sh" x="600" y="280" text-anchor="middle">Pupil booth 6</text><text class="muted" x="600" y="300" text-anchor="middle">headset and mic</text><line class="stroke-a" x1="390" y1="106" x2="380" y2="148" marker-end="url(#arrow)"/><text class="muted" x="390" y="350" text-anchor="middle">The teacher can listen to one pupil without the class hearing.</text><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
