<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فلش کارڈ کی پانچ مراحل مشق</title><desc id="d">نئے الفاظ کے لیے فلش کارڈ کے پانچ مراحل کا نقشہ: دکھانا، کہنا، دہرانا، جملے میں استعمال کرنا، اور اگلے دن دوبارہ دیکھنا، جو ایک چکر میں ترتیب ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--a1); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="30" text-anchor="middle">فلش کارڈ کی پانچ مراحل مشق</text><rect class="panel-a" x="300" y="44" width="180" height="46" rx="6"/><text class="body" x="390" y="72" text-anchor="middle">1. کارڈ دکھائیں</text><rect class="panel-b" x="40" y="110" width="180" height="46" rx="6"/><text class="body" x="130" y="138" text-anchor="middle">2. لفظ کہیں</text><rect class="panel-c" x="80" y="270" width="180" height="46" rx="6"/><text class="body" x="170" y="298" text-anchor="middle">3. شاگرد دہرائیں</text><rect class="panel-d" x="520" y="270" width="180" height="46" rx="6"/><text class="body" x="610" y="298" text-anchor="middle">4. جملے میں استعمال کریں</text><rect class="panel-a" x="540" y="110" width="180" height="46" rx="6"/><text class="body" x="630" y="138" text-anchor="middle">5. اگلے دن دوبارہ دیکھیں</text><line class="stroke-a" x1="298" y1="66" x2="222" y2="126" marker-end="url(#arrow)"/><line class="stroke-a" x1="132" y1="158" x2="168" y2="268" marker-end="url(#arrow)"/><line class="stroke-a" x1="262" y1="293" x2="518" y2="293" marker-end="url(#arrow)"/><line class="stroke-a" x1="608" y1="268" x2="628" y2="158" marker-end="url(#arrow)"/><line class="stroke-a" x1="538" y1="132" x2="482" y2="74" marker-end="url(#arrow)"/><text class="wm" x="768" y="390" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
