<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حواس کے استعمال کے مطابق وسائل</title><desc id="d">جدول میں سمعی و بصری وسائل ان حواس کے مطابق گروہ بند ہیں: دیکھنا، سننا، یا دونوں، ہر گروہ کے ساتھ چوتھی جماعت کے انگریزی سبق کی ایک مثال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="390" y="34" text-anchor="middle">حواس کے استعمال کے مطابق وسائل</text><text class="muted" x="390" y="56" text-anchor="middle">ہر گروہ کے لیے وسائل اور چوتھی جماعت کے انگریزی سبق کی مثال</text><rect class="panel" x="30" y="72" width="720" height="36" rx="4"/><text class="sh" x="635" y="95" text-anchor="middle">دیکھنا</text><text class="sh" x="390" y="95" text-anchor="middle">سننا</text><text class="sh" x="145" y="95" text-anchor="middle">دونوں حواس</text><rect class="panel-a" x="30" y="116" width="720" height="80" rx="4"/><text class="body" x="635" y="146" text-anchor="middle">چارٹ، تصاویر،</text><text class="body" x="635" y="168" text-anchor="middle">ماڈل، حقیقی اشیاء</text><text class="body" x="390" y="146" text-anchor="middle">ریڈیو، کیسٹ پلیئر،</text><text class="body" x="390" y="168" text-anchor="middle">موبائل فون کی آواز</text><text class="body" x="145" y="146" text-anchor="middle">ٹیلی وژن، VCR،</text><text class="body" x="145" y="168" text-anchor="middle">فلمیں، ویڈیو کلپ</text><text class="muted" x="635" y="228" text-anchor="middle">سبق کی مثال</text><text class="body" x="635" y="252" text-anchor="middle">منڈی کے چارٹ کی طرف اشارہ کریں</text><text class="body" x="635" y="274" text-anchor="middle">اور پوچھیں: What is this?</text><text class="muted" x="390" y="228" text-anchor="middle">سبق کی مثال</text><text class="body" x="390" y="252" text-anchor="middle">منڈی کی گفتگو چلائیں</text><text class="body" x="390" y="274" text-anchor="middle">اور خریدی گئی چیزوں کی گنتی کریں</text><text class="muted" x="145" y="228" text-anchor="middle">سبق کی مثال</text><text class="body" x="145" y="252" text-anchor="middle">دو منٹ کی کلپ دکھائیں</text><text class="body" x="145" y="274" text-anchor="middle">اور پوچھیں کہ آگے کیا ہوتا ہے</text><text class="wm" x="768" y="370" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
