<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ویڈیو سبق کے پانچ مراحل</title><desc id="d">ویڈیو سبق کے پانچ مراحل کا فلو چارٹ: پیش منظر کام طے کرنا، دیکھنا، تفہم کی جانچ، بحث کرنا، اور تابع سرگرمی، اگلی کلپ کی طرف واپس لوپ کے ساتھ۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .muted { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--a1); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="270"/><text class="h" x="390" y="30" text-anchor="middle">ویڈیو سبق کے پانچ مراحل</text><rect class="panel-a" x="600" y="80" width="120" height="50" rx="6"/><text class="body" x="660" y="110" text-anchor="middle">پیش منظر کام</text><rect class="panel-b" x="465" y="80" width="120" height="50" rx="6"/><text class="body" x="525" y="110" text-anchor="middle">دیکھیں</text><rect class="panel-c" x="330" y="80" width="120" height="50" rx="6"/><text class="body" x="390" y="103" text-anchor="middle">تفہم کی</text><text class="body" x="390" y="121" text-anchor="middle">جانچ</text><rect class="panel-d" x="195" y="80" width="120" height="50" rx="6"/><text class="body" x="255" y="110" text-anchor="middle">بحث کریں</text><rect class="panel-a" x="60" y="80" width="120" height="50" rx="6"/><text class="body" x="120" y="103" text-anchor="middle">تابع سرگرمی</text><line class="stroke-a" x1="599" y1="105" x2="586" y2="105" marker-end="url(#arrow)"/><line class="stroke-a" x1="464" y1="105" x2="451" y2="105" marker-end="url(#arrow)"/><line class="stroke-a" x1="329" y1="105" x2="316" y2="105" marker-end="url(#arrow)"/><line class="stroke-a" x1="194" y1="105" x2="181" y2="105" marker-end="url(#arrow)"/><path class="stroke-a" d="M120,132 L120,190 L660,190 L660,132" marker-end="url(#arrow)"/><text class="muted" x="390" y="210" text-anchor="middle">اگلی کلپ</text><text class="wm" x="768" y="260" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
