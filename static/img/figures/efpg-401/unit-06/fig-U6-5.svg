<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three audio aids compared</title><desc id="d">Table comparing radio, cassette player and mobile phone audio as classroom audio aids, with each one's strength and limitation.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="340"/><text class="h" x="390" y="30" text-anchor="middle">Three audio aids compared</text><rect class="panel" x="30" y="48" width="720" height="32" rx="4"/><text class="sh" x="95" y="69" text-anchor="middle">Audio aid</text><text class="sh" x="260" y="69" text-anchor="middle">What it plays</text><text class="sh" x="460" y="69" text-anchor="middle">Strength</text><text class="sh" x="660" y="69" text-anchor="middle">Limitation</text><rect class="panel-a" x="30" y="86" width="720" height="64" rx="4"/><text class="sh" x="95" y="122" text-anchor="middle">Radio</text><text class="body" x="260" y="112" text-anchor="middle">Broadcasts, stories,</text><text class="body" x="260" y="132" text-anchor="middle">songs</text><text class="body" x="460" y="112" text-anchor="middle">Real voices at</text><text class="body" x="460" y="132" text-anchor="middle">natural speed</text><text class="body" x="660" y="122" text-anchor="middle">Cannot pause or repeat</text><rect class="panel-b" x="30" y="156" width="720" height="64" rx="4"/><text class="sh" x="95" y="192" text-anchor="middle">Cassette player</text><text class="body" x="260" y="182" text-anchor="middle">Recorded lessons</text><text class="body" x="260" y="202" text-anchor="middle">and drills</text><text class="body" x="460" y="192" text-anchor="middle">Can repeat a sentence</text><text class="body" x="660" y="182" text-anchor="middle">Tapes wear out</text><text class="body" x="660" y="202" text-anchor="middle">and hiss</text><rect class="panel-c" x="30" y="226" width="720" height="64" rx="4"/><text class="sh" x="95" y="262" text-anchor="middle">Mobile phone audio</text><text class="body" x="260" y="252" text-anchor="middle">Downloaded clips</text><text class="body" x="260" y="272" text-anchor="middle">and songs</text><text class="body" x="460" y="252" text-anchor="middle">Pause, repeat,</text><text class="body" x="460" y="272" text-anchor="middle">control speed</text><text class="body" x="660" y="252" text-anchor="middle">Needs power</text><text class="body" x="660" y="272" text-anchor="middle">and a speaker</text><text class="wm" x="768" y="330" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
