<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستانی استاد کے استعمال کے قابل چار ویڈیو ذرائع</title><desc id="d">پاکستانی استاد کے استعمال کے قابل چار ویڈیو ذرائع کا جدول: ہر ایک کیسے حاصل کریں اور مناسب کلپ چننے کا معیار۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="390" y="30" text-anchor="middle">پاکستانی استاد کے استعمال کے قابل چار ویڈیو ذرائع</text><rect class="panel" x="30" y="48" width="720" height="32" rx="4"/><text class="sh" x="605" y="69" text-anchor="middle">ویڈیو ذریعہ</text><text class="sh" x="325" y="69" text-anchor="middle">کیسے حاصل کریں</text><text class="sh" x="110" y="69" text-anchor="middle">کلپ چننے کا معیار</text><rect class="panel-a" x="30" y="86" width="720" height="64" rx="4"/><text class="sh" x="605" y="122" text-anchor="middle">اسکول کی ڈی وی ڈی یا یو ایس بی</text><text class="body" x="325" y="112" text-anchor="middle">اسکول سے عطیہ کی گئی</text><text class="body" x="325" y="132" text-anchor="middle">ڈی وی ڈی یا یو ایس بی مانگیں</text><text class="body" x="110" y="112" text-anchor="middle">تین منٹ سے کم کلپ چنیں</text><text class="body" x="110" y="132" text-anchor="middle">جس میں ایک واضح خیال ہو</text><rect class="panel-b" x="30" y="156" width="720" height="64" rx="4"/><text class="sh" x="605" y="192" text-anchor="middle">موبائل فون ڈاؤن لوڈ</text><text class="body" x="325" y="182" text-anchor="middle">مفت تعلیمی سائٹ سے</text><text class="body" x="325" y="202" text-anchor="middle">فون پر ڈاؤن لوڈ کریں</text><text class="body" x="110" y="182" text-anchor="middle">صاف آوازوں والی کلپ چنیں</text><text class="body" x="110" y="202" text-anchor="middle">اور تیز ایڈیٹنگ نہ ہو</text><rect class="panel-c" x="30" y="226" width="720" height="64" rx="4"/><text class="sh" x="605" y="262" text-anchor="middle">تعلیمی ٹیلی وژن</text><text class="body" x="325" y="252" text-anchor="middle">مختصر پروگرام ریکارڈ کریں</text><text class="body" x="325" y="272" text-anchor="middle">ٹائمر یا فون سے</text><text class="body" x="110" y="252" text-anchor="middle">ایسا پروگرام چنیں جو</text><text class="body" x="110" y="272" text-anchor="middle">سبق کے نتیجے سے ملے</text><rect class="panel-d" x="30" y="296" width="720" height="64" rx="4"/><text class="sh" x="605" y="332" text-anchor="middle">کمرۂ جماعت کا پروجیکٹر</text><text class="body" x="325" y="322" text-anchor="middle">فون یا کمپیوٹر پروجیکٹر</text><text class="body" x="325" y="342" text-anchor="middle">سے جوڑیں</text><text class="body" x="110" y="322" text-anchor="middle">ایک تصویر یا کلپ دکھائیں</text><text class="body" x="110" y="342" text-anchor="middle">جو نئی زبان اٹھائے</text><text class="wm" x="768" y="370" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
