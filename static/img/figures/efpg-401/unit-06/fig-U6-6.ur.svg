<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زبان لیبارٹری کی ترتیب</title><desc id="d">زبان لیبارٹری کا نقشہ جس میں استاد کا کنسول اور چھ شاگردوں کے کمرے ہیں، یہ دکھاتا ہے کہ استاد انفرادی شاگردوں پر نگرانی کرتا ہے اور ان سے بات کرتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .muted { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--a1); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="390" y="28" text-anchor="middle">زبان لیبارٹری کی ترتیب</text><rect class="panel" x="290" y="48" width="200" height="56" rx="6"/><text class="sh" x="390" y="72" text-anchor="middle">استاد کا کنسول</text><text class="muted" x="390" y="90" text-anchor="middle">سنتا اور بولتا ہے</text><rect class="panel-b" x="530" y="150" width="180" height="70" rx="6"/><text class="sh" x="620" y="180" text-anchor="middle">شاگرد کا کمرہ 1</text><text class="muted" x="620" y="200" text-anchor="middle">ہیڈ سیٹ اور مائیک</text><rect class="panel-b" x="310" y="150" width="180" height="70" rx="6"/><text class="sh" x="400" y="180" text-anchor="middle">شاگرد کا کمرہ 2</text><text class="muted" x="400" y="200" text-anchor="middle">ہیڈ سیٹ اور مائیک</text><rect class="panel-b" x="90" y="150" width="180" height="70" rx="6"/><text class="sh" x="180" y="180" text-anchor="middle">شاگرد کا کمرہ 3</text><text class="muted" x="180" y="200" text-anchor="middle">ہیڈ سیٹ اور مائیک</text><rect class="panel-a" x="530" y="250" width="180" height="70" rx="6"/><text class="sh" x="620" y="280" text-anchor="middle">شاگرد کا کمرہ 4</text><text class="muted" x="620" y="300" text-anchor="middle">ہیڈ سیٹ اور مائیک</text><rect class="panel-a" x="310" y="250" width="180" height="70" rx="6"/><text class="sh" x="400" y="280" text-anchor="middle">شاگرد کا کمرہ 5</text><text class="muted" x="400" y="300" text-anchor="middle">ہیڈ سیٹ اور مائیک</text><rect class="panel-a" x="90" y="250" width="180" height="70" rx="6"/><text class="sh" x="180" y="280" text-anchor="middle">شاگرد کا کمرہ 6</text><text class="muted" x="180" y="300" text-anchor="middle">ہیڈ سیٹ اور مائیک</text><line class="stroke-a" x1="390" y1="106" x2="400" y2="148" marker-end="url(#arrow)"/><text class="muted" x="390" y="350" text-anchor="middle">استاد کلاس کے سنے بغیر ایک شاگرد کو سن سکتا ہے۔</text><text class="wm" x="768" y="410" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
