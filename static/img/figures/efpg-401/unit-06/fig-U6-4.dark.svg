<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A five-step flash-card routine</title><desc id="d">Diagram of a five-step flash-card routine for new words: show, say, repeat, use in a sentence, and review the next day, arranged as a cycle.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--a1); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="30" text-anchor="middle">A five-step flash-card routine</text><rect class="panel-a" x="300" y="44" width="180" height="46" rx="6"/><text class="body" x="390" y="72" text-anchor="middle">1. Show the card</text><rect class="panel-b" x="560" y="110" width="180" height="46" rx="6"/><text class="body" x="650" y="138" text-anchor="middle">2. Say the word</text><rect class="panel-c" x="520" y="270" width="180" height="46" rx="6"/><text class="body" x="610" y="298" text-anchor="middle">3. Pupils repeat</text><rect class="panel-d" x="80" y="270" width="180" height="46" rx="6"/><text class="body" x="170" y="298" text-anchor="middle">4. Use in a sentence</text><rect class="panel-a" x="60" y="110" width="180" height="46" rx="6"/><text class="body" x="150" y="138" text-anchor="middle">5. Review next day</text><line class="stroke-a" x1="482" y1="66" x2="558" y2="126" marker-end="url(#arrow)"/><line class="stroke-a" x1="648" y1="158" x2="612" y2="268" marker-end="url(#arrow)"/><line class="stroke-a" x1="518" y1="293" x2="262" y2="293" marker-end="url(#arrow)"/><line class="stroke-a" x1="172" y1="268" x2="152" y2="158" marker-end="url(#arrow)"/><line class="stroke-a" x1="242" y1="132" x2="298" y2="74" marker-end="url(#arrow)"/><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
