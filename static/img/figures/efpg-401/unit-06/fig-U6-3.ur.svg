<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ کم خرچ تدریسی وسائل</title><desc id="d">پانچ کم خرچ تدریسی وسائل (چارٹ، ماڈل، تصاویر، فلش کارڈ اور حقیقی اشیاء) کا جدول: ہر وسیلہ کیسے بنائے جائے اور ایک انگریزی سبق میں اس کا استعمال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="390" y="34" text-anchor="middle">پانچ کم خرچ تدریسی وسائل</text><text class="sh" x="390" y="58" text-anchor="middle">ہر وسیلہ کیسے بنائے جائے اور ایک انگریزی سبق میں استعمال</text><rect class="panel" x="30" y="72" width="720" height="32" rx="4"/><text class="sh" x="605" y="93" text-anchor="middle">وسیلہ</text><text class="sh" x="310" y="93" text-anchor="middle">کیسے بنائے جائے</text><text class="sh" x="95" y="93" text-anchor="middle">ایک انگریزی سبق میں استعمال</text><rect class="panel-a" x="30" y="110" width="720" height="56" rx="4"/><text class="sh" x="605" y="144" text-anchor="middle">چارٹ</text><text class="body" x="310" y="134" text-anchor="middle">بھورے کاغذ پر بنائیں</text><text class="body" x="310" y="154" text-anchor="middle">موٹی مارکر سے</text><text class="body" x="95" y="134" text-anchor="middle">ہر پھل کی طرف اشارہ کریں</text><text class="body" x="95" y="154" text-anchor="middle">اور پوچھیں: What is this?</text><rect class="panel-b" x="30" y="172" width="720" height="56" rx="4"/><text class="sh" x="605" y="206" text-anchor="middle">ماڈل</text><text class="body" x="310" y="196" text-anchor="middle">مٹی کو شے کی شکل دیں</text><text class="body" x="310" y="216" text-anchor="middle">یا کچرے سے بنائیں</text><text class="body" x="95" y="196" text-anchor="middle">جسم یا عمارت کے</text><text class="body" x="95" y="216" text-anchor="middle">حصوں کے نام بتائیں</text><rect class="panel-c" x="30" y="234" width="720" height="56" rx="4"/><text class="sh" x="605" y="268" text-anchor="middle">تصاویر</text><text class="body" x="310" y="258" text-anchor="middle">پرانی رسالوں یا کیلنڈر</text><text class="body" x="310" y="278" text-anchor="middle">سے تصاویر کٹائیں</text><text class="body" x="95" y="258" text-anchor="middle">ہر تصویر کو نئے</text><text class="body" x="95" y="278" text-anchor="middle">انگریزی لفظ سے جوڑیں</text><rect class="panel-d" x="30" y="296" width="720" height="56" rx="4"/><text class="sh" x="605" y="330" text-anchor="middle">فلش کارڈ</text><text class="body" x="310" y="320" text-anchor="middle">پرانے لفافے کٹ کر</text><text class="body" x="310" y="340" text-anchor="middle">چھوٹے کارڈ بنائیں</text><text class="body" x="95" y="320" text-anchor="middle">کارڈ تھام کر پوچھیں</text><text class="body" x="95" y="340" text-anchor="middle">کہ کلاس اسے پڑھے</text><rect class="panel-a" x="30" y="358" width="720" height="56" rx="4"/><text class="sh" x="605" y="392" text-anchor="middle">حقیقی اشیاء</text><text class="body" x="310" y="382" text-anchor="middle">کپ، چابی، آم</text><text class="body" x="310" y="402" text-anchor="middle">یا پتہ لائیں</text><text class="body" x="95" y="382" text-anchor="middle">شے تھام کر پوچھیں:</text><text class="body" x="95" y="402" text-anchor="middle">What is this?</text><text class="wm" x="768" y="432" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
