<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five stages of a video lesson</title><desc id="d">Flowchart of a five-stage video lesson: set a preview task, watch, check understanding, discuss, and follow up, with a loop back to the next clip.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .muted { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--a1); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="270"/><text class="h" x="390" y="30" text-anchor="middle">Five stages of a video lesson</text><rect class="panel-a" x="60" y="80" width="120" height="50" rx="6"/><text class="body" x="120" y="110" text-anchor="middle">Preview task</text><rect class="panel-b" x="195" y="80" width="120" height="50" rx="6"/><text class="body" x="255" y="110" text-anchor="middle">Watch</text><rect class="panel-c" x="330" y="80" width="120" height="50" rx="6"/><text class="body" x="390" y="103" text-anchor="middle">Check</text><text class="body" x="390" y="121" text-anchor="middle">understanding</text><rect class="panel-d" x="465" y="80" width="120" height="50" rx="6"/><text class="body" x="525" y="110" text-anchor="middle">Discuss</text><rect class="panel-a" x="600" y="80" width="120" height="50" rx="6"/><text class="body" x="660" y="103" text-anchor="middle">Follow-up</text><text class="body" x="660" y="121" text-anchor="middle">activity</text><line class="stroke-a" x1="181" y1="105" x2="194" y2="105" marker-end="url(#arrow)"/><line class="stroke-a" x1="316" y1="105" x2="329" y2="105" marker-end="url(#arrow)"/><line class="stroke-a" x1="451" y1="105" x2="464" y2="105" marker-end="url(#arrow)"/><line class="stroke-a" x1="586" y1="105" x2="599" y2="105" marker-end="url(#arrow)"/><path class="stroke-a" d="M660,132 L660,190 L120,190 L120,132" marker-end="url(#arrow)"/><text class="muted" x="390" y="210" text-anchor="middle">next clip</text><text class="wm" x="768" y="260" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
