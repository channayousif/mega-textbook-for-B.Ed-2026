<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سمعی و بصری وسائل اور ان کے فوائد</title><desc id="d">تصوراتی نقشہ جس کے مرکز میں سمعی و بصری وسائل ہیں اور چار فائدے ان سے نکلتے ہیں: توجہ، معنی، یادداشت اور شرکت۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--a1); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="390" y="34" text-anchor="middle">سمعی و بصری وسائل اور ان کے فوائد</text><rect class="panel-a" x="535" y="55" width="190" height="64" rx="8"/><text class="h" x="630" y="82" text-anchor="middle">توجہ</text><text class="body" x="630" y="104" text-anchor="middle">شاگرد دیکھتے اور سنتے ہیں</text><rect class="panel-b" x="55" y="55" width="190" height="64" rx="8"/><text class="h" x="150" y="82" text-anchor="middle">معنی</text><text class="body" x="150" y="104" text-anchor="middle">الفاظ چیزوں سے جڑتے ہیں</text><rect class="panel-c" x="535" y="300" width="190" height="64" rx="8"/><text class="h" x="630" y="327" text-anchor="middle">یادداشت</text><text class="body" x="630" y="349" text-anchor="middle">تصاویر یاد کرنے میں مدد دیتی ہیں</text><rect class="panel-d" x="55" y="300" width="190" height="64" rx="8"/><text class="h" x="150" y="327" text-anchor="middle">شرکت</text><text class="body" x="150" y="349" text-anchor="middle">شاگرد اشارہ کرتے اور جواب دیتے ہیں</text><rect class="panel" x="285" y="180" width="210" height="60" rx="8"/><text class="h" x="390" y="216" text-anchor="middle">سمعی و بصری وسائل</text><line class="stroke-a" x1="320" y1="190" x2="240" y2="125" marker-end="url(#arrow)"/><line class="stroke-a" x1="470" y1="190" x2="550" y2="125" marker-end="url(#arrow)"/><line class="stroke-a" x1="320" y1="230" x2="240" y2="295" marker-end="url(#arrow)"/><line class="stroke-a" x1="470" y1="230" x2="550" y2="295" marker-end="url(#arrow)"/><text class="wm" x="768" y="410" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
