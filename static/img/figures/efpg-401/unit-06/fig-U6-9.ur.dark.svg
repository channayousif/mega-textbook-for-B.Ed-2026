<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار پروجیکٹڈ وسائل کا موازنہ</title><desc id="d">سلائیڈ، فلم اسٹرپ، اوور ہیڈ پروجیکٹر اور ملٹی میڈیا پروجیکٹر کا موازنہ: تقریبی خرچ، بجلی کی ضرورت اور بہترین جماعتی استعمال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 12px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="390" y="30" text-anchor="middle">چار پروجیکٹڈ وسائل کا موازنہ</text><rect class="panel" x="30" y="48" width="720" height="32" rx="4"/><text class="sh" x="610" y="69" text-anchor="middle">پروجیکٹڈ وسیلہ</text><text class="sh" x="395" y="69" text-anchor="middle">تقریبی خرچ</text><text class="sh" x="255" y="69" text-anchor="middle">بجلی کی ضرورت</text><text class="sh" x="105" y="69" text-anchor="middle">بہترین جماعتی استعمال</text><rect class="panel-a" x="30" y="86" width="720" height="64" rx="4"/><text class="sh" x="610" y="122" text-anchor="middle">سلائیڈ</text><text class="body" x="395" y="122" text-anchor="middle">کم</text><text class="body" x="255" y="122" text-anchor="middle">بجلی</text><text class="body" x="105" y="112" text-anchor="middle">ایک بار میں ایک تصویر</text><text class="body" x="105" y="132" text-anchor="middle">پوری کلاس کے لیے</text><rect class="panel-b" x="30" y="156" width="720" height="64" rx="4"/><text class="sh" x="610" y="192" text-anchor="middle">فلم اسٹرپ</text><text class="body" x="395" y="192" text-anchor="middle">کم</text><text class="body" x="255" y="192" text-anchor="middle">بجلی</text><text class="body" x="105" y="182" text-anchor="middle">تصاویر اور عنوانات کا</text><text class="body" x="105" y="202" text-anchor="middle">مقرر تسلسل</text><rect class="panel-c" x="30" y="226" width="720" height="64" rx="4"/><text class="sh" x="610" y="262" text-anchor="middle">اوور ہیڈ پروجیکٹر</text><text class="body" x="395" y="262" text-anchor="middle">درمیانہ</text><text class="body" x="255" y="262" text-anchor="middle">بجلی</text><text class="body" x="105" y="252" text-anchor="middle">شفاف شیٹ پر لکھنا،</text><text class="body" x="105" y="272" text-anchor="middle">روشنی چالو</text><rect class="panel-d" x="30" y="296" width="720" height="64" rx="4"/><text class="sh" x="610" y="332" text-anchor="middle">ملٹی میڈیا پروجیکٹر</text><text class="body" x="395" y="332" text-anchor="middle">زیادہ</text><text class="body" x="255" y="322" text-anchor="middle">بجلی</text><text class="body" x="255" y="342" text-anchor="middle">اور آلہ</text><text class="body" x="105" y="322" text-anchor="middle">سلائیڈ، تصاویر اور</text><text class="body" x="105" y="342" text-anchor="middle">ویڈیو پردے پر</text><text class="wm" x="768" y="370" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
