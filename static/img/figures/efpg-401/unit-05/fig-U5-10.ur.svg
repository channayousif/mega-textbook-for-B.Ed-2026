<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">نظم کے سبق کا بہاؤ</title>
  <desc id="d">نظم کے سبق کا خاکہ جو لطف کے لیے سننے سے شروع ہو کر بلند خوانی، معنی پر گفتگو اور ذاتی ردِ عمل تک جاتا ہے۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="300"/>

  <text class="h" x="390" y="34" text-anchor="middle">نظم کے سبق کا بہاؤ</text>

  <rect class="panel-a" x="580" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="660" y="98" text-anchor="middle">لطف کے لیے</text>
  <text class="sh" x="660" y="118" text-anchor="middle">سننا</text>
  <text class="small" x="660" y="140" text-anchor="middle">کتابیں بند،</text>
  <text class="small" x="660" y="158" text-anchor="middle">دو بار سنیں</text>

  <rect class="panel-b" x="400" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="480" y="98" text-anchor="middle">بلند خوانی اور</text>
  <text class="sh" x="480" y="118" text-anchor="middle">پڑھنا</text>
  <text class="small" x="480" y="148" text-anchor="middle">مل کر بلند آواز سے پڑھیں</text>

  <rect class="panel-c" x="220" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="300" y="108" text-anchor="middle">معنی پر گفتگو</text>
  <text class="small" x="300" y="140" text-anchor="middle">احساسات اور تصویروں</text>
  <text class="small" x="300" y="158" text-anchor="middle">پر بات کریں</text>

  <rect class="panel-d" x="40" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="120" y="98" text-anchor="middle">تحسین اور</text>
  <text class="sh" x="120" y="118" text-anchor="middle">ردِ عمل</text>
  <text class="small" x="120" y="140" text-anchor="middle">تصویر بنائیں اور</text>
  <text class="small" x="120" y="158" text-anchor="middle">ردِ عمل لکھیں</text>

  <line class="stroke" x1="580" y1="120" x2="560" y2="120" marker-end="url(#arrow)"/>
  <line class="stroke" x1="400" y1="120" x2="380" y2="120" marker-end="url(#arrow)"/>
  <line class="stroke" x1="220" y1="120" x2="200" y2="120" marker-end="url(#arrow)"/>

  <text class="small" x="390" y="210" text-anchor="middle">نظم سننے سے اس پر ردِ عمل دینے تک</text>

  <text class="wm" x="768" y="288" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
