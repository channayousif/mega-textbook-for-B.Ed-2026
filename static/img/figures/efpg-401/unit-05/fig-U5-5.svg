<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Activity-based techniques with class-size tips</title>
  <desc id="d">Table comparing pair work, group work, games and role play, with class-size tips and preparation notes for each technique.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="430"/>

  <text class="h" x="390" y="34" text-anchor="middle">Four Activity-Based Techniques</text>

  <rect class="panel" x="30" y="50" width="720" height="32" rx="4"/>
  <text class="sh" x="45" y="71">Technique</text>
  <text class="sh" x="155" y="71">Best class size</text>
  <text class="sh" x="295" y="71">Preparation</text>
  <text class="sh" x="505" y="71">Tip</text>

  <rect class="panel-a" x="30" y="90" width="720" height="72" rx="4"/>
  <text class="sh" x="45" y="120">Pair work</text>
  <text class="body" x="155" y="120">Any size, 50+</text>
  <text class="body" x="295" y="120">Prepare a short task card</text>
  <text class="body" x="505" y="112">Keep the task under</text>
  <text class="body" x="505" y="130">10 minutes</text>

  <rect class="panel-b" x="30" y="170" width="720" height="72" rx="4"/>
  <text class="sh" x="45" y="200">Group work</text>
  <text class="body" x="155" y="200">30 to 50 pupils</text>
  <text class="body" x="295" y="200">Give each pupil a role</text>
  <text class="body" x="505" y="200">Walk around and monitor</text>

  <rect class="panel-c" x="30" y="250" width="720" height="72" rx="4"/>
  <text class="sh" x="45" y="280">Games</text>
  <text class="body" x="155" y="280">Any size</text>
  <text class="body" x="295" y="272">Prepare cards or a</text>
  <text class="body" x="295" y="290">score sheet</text>
  <text class="body" x="505" y="272">Link the game to</text>
  <text class="body" x="505" y="290">the lesson aim</text>

  <rect class="panel-d" x="30" y="330" width="720" height="72" rx="4"/>
  <text class="sh" x="45" y="360">Role play</text>
  <text class="body" x="155" y="360">20 to 40 pupils</text>
  <text class="body" x="295" y="352">Give a clear situation</text>
  <text class="body" x="295" y="370">and time box</text>
  <text class="body" x="505" y="352">Let pairs perform</text>
  <text class="body" x="505" y="370">for the class</text>

  <text class="wm" x="768" y="418" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
