<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">ہر مرحلے پر شاگرد کی سرگرمی کے ساتھ سبق کے مراحل</title>
  <desc id="d">سبق کے پانچ مراحل کا جدول جس میں ہر مرحلے پر شاگردوں کی سرگرمی اور اس کا حاصل دکھایا گیا ہے، کلاس کی کھڑکی سے نظر آنے والی چیزوں کے نام بتانے سے تین سچے جملے لکھنے تک۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="480"/>

  <text class="h" x="390" y="34" text-anchor="middle">35 منٹ کا سبق جس کے ہر مرحلے میں سرگرمی ہے</text>
  <text class="small" x="390" y="54" text-anchor="middle">پانچویں جماعت کا موضوع: میرا گاؤں</text>

  <rect class="panel" x="30" y="70" width="720" height="32" rx="4"/>
  <text class="sh" x="735" y="91" text-anchor="end">مرحلہ</text>
  <text class="sh" x="605" y="91" text-anchor="end">شاگردوں کی سرگرمی</text>
  <text class="sh" x="305" y="91" text-anchor="end">اس سے کیا حاصل ہوتا ہے</text>

  <rect class="panel-a" x="30" y="110" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="134" text-anchor="end">آغاز کی سرگرمی</text>
  <text class="small" x="735" y="152" text-anchor="end">4 منٹ</text>
  <text class="body" x="605" y="134" text-anchor="end">کلاس کی کھڑکی سے نظر آنے والی</text>
  <text class="body" x="605" y="152" text-anchor="end">پانچ چیزوں کے نام بتانا</text>
  <text class="body" x="305" y="134" text-anchor="end">جماعت کو پرسکون کرتی ہے اور پہلے سے</text>
  <text class="body" x="305" y="152" text-anchor="end">معلوم الفاظ کو تازہ کرتی ہے</text>

  <rect class="panel-b" x="30" y="180" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="204" text-anchor="end">پیشکش</text>
  <text class="small" x="735" y="222" text-anchor="end">7 منٹ</text>
  <text class="body" x="605" y="204" text-anchor="end">گاؤں کی تین تصویریں دیکھ کر</text>
  <text class="body" x="605" y="222" text-anchor="end">دو نئے الفاظ کا اندازہ لگانا</text>
  <text class="body" x="305" y="204" text-anchor="end">ترجمے کے بجائے سیاق کے ذریعے</text>
  <text class="body" x="305" y="222" text-anchor="end">نئے الفاظ متعارف کراتی ہے</text>

  <rect class="panel-c" x="30" y="250" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="274" text-anchor="end">مشق</text>
  <text class="small" x="735" y="292" text-anchor="end">10 منٹ</text>
  <text class="body" x="605" y="274" text-anchor="end">جوڑوں میں سوال جواب کرنا:</text>
  <text class="body" x="605" y="292" text-anchor="end">"Is there a ... in your village?"</text>
  <text class="body" x="305" y="274" text-anchor="end">نئی ساخت کو قابو میں رکھتی ہے تاکہ</text>
  <text class="body" x="305" y="292" text-anchor="end">ہر شاگرد اسے کئی بار بولے</text>

  <rect class="panel-d" x="30" y="320" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="344" text-anchor="end">آزادانہ استعمال</text>
  <text class="small" x="735" y="362" text-anchor="end">10 منٹ</text>
  <text class="body" x="605" y="344" text-anchor="end">چار چار کے گروہ میں اپنے</text>
  <text class="body" x="605" y="362" text-anchor="end">گاؤں کے بارے میں بتانا</text>
  <text class="body" x="305" y="344" text-anchor="end">زبان کو ایک حقیقی ابلاغی مقصد</text>
  <text class="body" x="305" y="362" text-anchor="end">کے لیے آزادی سے استعمال کرتی ہے</text>

  <rect class="panel-a" x="30" y="390" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="414" text-anchor="end">دہرائی</text>
  <text class="small" x="735" y="432" text-anchor="end">4 منٹ</text>
  <text class="body" x="605" y="414" text-anchor="end">تین سچے جملے لکھنا اور</text>
  <text class="body" x="605" y="432" text-anchor="end">ایک بلند آواز سے پڑھنا</text>
  <text class="body" x="305" y="414" text-anchor="end">سیکھنے کی جانچ کرتی ہے اور استاد کو</text>
  <text class="body" x="305" y="432" text-anchor="end">آگے کے فیصلے کے لیے ثبوت دیتی ہے</text>

  <text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
