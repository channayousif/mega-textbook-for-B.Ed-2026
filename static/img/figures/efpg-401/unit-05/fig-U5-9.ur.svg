<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">نثر اور نظم کے اسباق کے منصوبے ساتھ ساتھ</title>
  <desc id="d">نثر کے سبق اور نظم کے سبق کا ساتھ ساتھ تقابلی جدول، جس میں مراحل، استاد کے سوالات، شاگردوں کی سرگرمیاں اور مقاصد دکھائے گئے ہیں۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="450"/>

  <text class="h" x="390" y="34" text-anchor="middle">نثر اور نظم کے اسباق ساتھ ساتھ</text>

  <rect class="panel" x="30" y="50" width="720" height="32" rx="4"/>
  <text class="sh" x="740" y="71" text-anchor="end">مرحلہ</text>
  <text class="sh" x="610" y="71" text-anchor="end">نثر کا سبق</text>
  <text class="sh" x="320" y="71" text-anchor="end">نظم کا سبق</text>

  <rect class="panel-a" x="30" y="90" width="720" height="62" rx="4"/>
  <text class="sh" x="740" y="120" text-anchor="end">آغاز</text>
  <text class="body" x="610" y="112" text-anchor="end">تصویر دکھائیں؛ پوچھیں</text>
  <text class="body" x="610" y="130" text-anchor="end">"کیا آپ نے بکری دیکھی ہے؟"</text>
  <text class="body" x="320" y="112" text-anchor="end">کتابیں بند رکھ کر نظم</text>
  <text class="body" x="320" y="130" text-anchor="end">دو بار بلند آواز سے پڑھیں</text>

  <rect class="panel-b" x="30" y="158" width="720" height="62" rx="4"/>
  <text class="sh" x="740" y="180" text-anchor="end">پہلا</text>
  <text class="sh" x="740" y="198" text-anchor="end">سامنا</text>
  <text class="body" x="610" y="180" text-anchor="end">مرکزی خیال کے لیے کہانی</text>
  <text class="body" x="610" y="198" text-anchor="end">خاموشی سے پڑھیں</text>
  <text class="body" x="320" y="188" text-anchor="end">مل کر بلند آواز سے نظم پڑھیں</text>

  <rect class="panel-c" x="30" y="226" width="720" height="62" rx="4"/>
  <text class="sh" x="740" y="256" text-anchor="end">گہرا کام</text>
  <text class="body" x="610" y="256" text-anchor="end">پوچھیں "لڑکے نے بکری کی مدد کیوں کی؟"</text>
  <text class="body" x="320" y="256" text-anchor="end">پوچھیں "آپ کو کیا تصویر نظر آتی ہے؟"</text>

  <rect class="panel-d" x="30" y="294" width="720" height="62" rx="4"/>
  <text class="sh" x="740" y="324" text-anchor="end">زبان کا کام</text>
  <text class="body" x="610" y="316" text-anchor="end">کہانی کے تین الفاظ</text>
  <text class="body" x="610" y="334" text-anchor="end">سیاق کے اندر سکھائیں</text>
  <text class="body" x="320" y="316" text-anchor="end">نظم کے ذریعے ایک یا دو</text>
  <text class="body" x="320" y="334" text-anchor="end">الفاظ پر بات کریں</text>

  <rect class="panel-a" x="30" y="362" width="720" height="62" rx="4"/>
  <text class="sh" x="740" y="392" text-anchor="end">ردِ عمل</text>
  <text class="body" x="610" y="392" text-anchor="end">لڑکے کی مالک سے ملاقات کی کردار نگاری</text>
  <text class="body" x="320" y="384" text-anchor="end">منظر بنائیں اور</text>
  <text class="body" x="320" y="402" text-anchor="end">دو سطریں لکھیں</text>

  <text class="wm" x="768" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
