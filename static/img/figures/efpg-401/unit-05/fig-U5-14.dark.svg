<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">A grammar point placed in a context, a task and a check</title>
  <desc id="d">Diagram of a grammar point placed in a context, then used in a task, then checked, with the form, meaning and use labelled at each step.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="280"/>

  <text class="h" x="390" y="34" text-anchor="middle">A Grammar Point in Context, Task and Check</text>

  <rect class="panel-a" x="60" y="80" width="180" height="100" rx="4"/>
  <text class="sh" x="150" y="110" text-anchor="middle">Context</text>
  <text class="small" x="150" y="134" text-anchor="middle">A photo gives the form</text>
  <text class="small" x="150" y="152" text-anchor="middle">a meaning to see</text>
  <text class="small" x="150" y="170" text-anchor="middle">Focus: meaning</text>

  <rect class="panel-b" x="300" y="80" width="180" height="100" rx="4"/>
  <text class="sh" x="390" y="110" text-anchor="middle">Task</text>
  <text class="small" x="390" y="134" text-anchor="middle">Pupils choose the form</text>
  <text class="small" x="390" y="152" text-anchor="middle">for a real purpose</text>
  <text class="small" x="390" y="170" text-anchor="middle">Focus: use</text>

  <rect class="panel-c" x="540" y="80" width="180" height="100" rx="4"/>
  <text class="sh" x="630" y="110" text-anchor="middle">Check</text>
  <text class="small" x="630" y="134" text-anchor="middle">The teacher sees whether</text>
  <text class="small" x="630" y="152" text-anchor="middle">the form is used correctly</text>
  <text class="small" x="630" y="170" text-anchor="middle">Focus: use</text>

  <line class="stroke" x1="240" y1="130" x2="300" y2="130" marker-end="url(#arrow)"/>
  <line class="stroke" x1="480" y1="130" x2="540" y2="130" marker-end="url(#arrow)"/>

  <text class="small" x="390" y="220" text-anchor="middle">Meaning first, then form, then use</text>

  <text class="wm" x="768" y="268" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
