<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The purpose of each lesson-plan step and a common mistake</title>
  <desc id="d">Table of the seven lesson-plan steps showing the purpose of each step and a common mistake to avoid.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="520"/>

  <text class="h" x="390" y="34" text-anchor="middle">Purpose and Common Mistakes at Each Step</text>

  <rect class="panel" x="30" y="54" width="720" height="32" rx="4"/>
  <text class="sh" x="45" y="75">Step</text>
  <text class="sh" x="155" y="75">Purpose</text>
  <text class="sh" x="450" y="75">Common mistake</text>

  <rect class="panel-a" x="30" y="94" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="124">Outcomes</text>
  <text class="body" x="155" y="124">States what pupils will do</text>
  <text class="body" x="450" y="124">A vague aim like "teach grammar"</text>

  <rect class="panel-b" x="30" y="150" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="180">Warm-up</text>
  <text class="body" x="155" y="172">Settles the class and activates</text>
  <text class="body" x="155" y="190">English</text>
  <text class="body" x="450" y="180">Skipped to save time</text>

  <rect class="panel-c" x="30" y="206" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="236">Presentation</text>
  <text class="body" x="155" y="228">Introduces the new language</text>
  <text class="body" x="155" y="246">in context</text>
  <text class="body" x="450" y="236">A rule with no example</text>

  <rect class="panel-d" x="30" y="262" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="292">Practice</text>
  <text class="body" x="155" y="292">Builds accuracy with support</text>
  <text class="body" x="450" y="292">No correction of errors</text>

  <rect class="panel-a" x="30" y="318" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="348">Production</text>
  <text class="body" x="155" y="348">Builds fluency and ownership</text>
  <text class="body" x="450" y="340">Omitted so pupils never</text>
  <text class="body" x="450" y="358">use it freely</text>

  <rect class="panel-b" x="30" y="374" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="404">Assessment</text>
  <text class="body" x="155" y="396">Shows whether the outcome</text>
  <text class="body" x="155" y="414">was reached</text>
  <text class="body" x="450" y="396">Missing so the teacher</text>
  <text class="body" x="450" y="414">cannot adjust</text>

  <rect class="panel-c" x="30" y="430" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="460">Homework</text>
  <text class="body" x="155" y="460">Extends the practice</text>
  <text class="body" x="450" y="460">Unrelated to the lesson</text>

  <text class="wm" x="768" y="508" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
