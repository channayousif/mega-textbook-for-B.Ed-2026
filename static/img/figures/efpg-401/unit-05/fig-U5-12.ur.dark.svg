<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">رہنمائی شدہ تحریر کے سبق کے پانچ مراحل</title>
  <desc id="d">رہنمائی شدہ تحریر کے سبق کا بہاؤ نقشہ: استاد نمونہ دکھاتا ہے، جماعت اس کا تجزیہ کرتی ہے، شاگرد مل کر منصوبہ بناتے ہیں، شاگرد لکھتے ہیں، اور جماعت تحریر ایک دوسرے کو سناتی ہے۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="240"/>

  <text class="h" x="390" y="34" text-anchor="middle">رہنمائی شدہ تحریر کا سلسلہ</text>

  <rect class="panel-a" x="620" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="685" y="100" text-anchor="middle">نمونہ</text>
  <text class="small" x="685" y="122" text-anchor="middle">ایک اچھی مثال</text>
  <text class="small" x="685" y="140" text-anchor="middle">دکھائیں</text>

  <rect class="panel-b" x="470" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="535" y="100" text-anchor="middle">تجزیہ</text>
  <text class="small" x="535" y="131" text-anchor="middle">اس کے حصوں کے نام</text>

  <rect class="panel-c" x="320" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="385" y="94" text-anchor="middle">مل کر منصوبہ</text>
  <text class="small" x="385" y="122" text-anchor="middle">تختہ تحریر پر</text>
  <text class="small" x="385" y="140" text-anchor="middle">منصوبہ بنائیں</text>

  <rect class="panel-d" x="170" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="235" y="100" text-anchor="middle">لکھنا</text>
  <text class="small" x="235" y="122" text-anchor="middle">شاگرد مدد کے</text>
  <text class="small" x="235" y="140" text-anchor="middle">ساتھ لکھتے ہیں</text>

  <rect class="panel-a" x="20" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="85" y="100" text-anchor="middle">سنانا</text>
  <text class="small" x="85" y="122" text-anchor="middle">اپنا کام ساتھی</text>
  <text class="small" x="85" y="140" text-anchor="middle">کو سنائیں</text>

  <line class="stroke" x1="620" y1="110" x2="600" y2="110" marker-end="url(#arrow)"/>
  <line class="stroke" x1="470" y1="110" x2="450" y2="110" marker-end="url(#arrow)"/>
  <line class="stroke" x1="320" y1="110" x2="300" y2="110" marker-end="url(#arrow)"/>
  <line class="stroke" x1="170" y1="110" x2="150" y2="110" marker-end="url(#arrow)"/>

  <text class="small" x="390" y="190" text-anchor="middle">جیسے جیسے شاگرد تحریر سنبھالتے ہیں، مدد گھٹتی جاتی ہے</text>

  <text class="wm" x="768" y="228" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
