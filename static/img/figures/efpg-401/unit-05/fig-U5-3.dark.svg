<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The seven steps of a lesson plan</title>
  <desc id="d">Flowchart of the seven steps of a lesson plan from learning outcomes through warm-up, presentation, practice, production and assessment to homework.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="460"/>

  <text class="h" x="390" y="34" text-anchor="middle">The Seven Steps of a Lesson Plan</text>

  <rect class="panel-a" x="240" y="60" width="300" height="44" rx="4"/>
  <text class="sh" x="390" y="87" text-anchor="middle">1. Learning outcomes</text>
  <rect class="panel-b" x="240" y="116" width="300" height="44" rx="4"/>
  <text class="sh" x="390" y="143" text-anchor="middle">2. Warm-up</text>
  <rect class="panel-c" x="240" y="172" width="300" height="44" rx="4"/>
  <text class="sh" x="390" y="199" text-anchor="middle">3. Presentation</text>
  <rect class="panel-d" x="240" y="228" width="300" height="44" rx="4"/>
  <text class="sh" x="390" y="255" text-anchor="middle">4. Practice</text>
  <rect class="panel-a" x="240" y="284" width="300" height="44" rx="4"/>
  <text class="sh" x="390" y="311" text-anchor="middle">5. Production</text>
  <rect class="panel-b" x="240" y="340" width="300" height="44" rx="4"/>
  <text class="sh" x="390" y="367" text-anchor="middle">6. Assessment</text>
  <rect class="panel-c" x="240" y="396" width="300" height="44" rx="4"/>
  <text class="sh" x="390" y="423" text-anchor="middle">7. Homework</text>

  <line class="stroke" x1="390" y1="104" x2="390" y2="116" marker-end="url(#arrow)"/>
  <line class="stroke" x1="390" y1="160" x2="390" y2="172" marker-end="url(#arrow)"/>
  <line class="stroke" x1="390" y1="216" x2="390" y2="228" marker-end="url(#arrow)"/>
  <line class="stroke" x1="390" y1="272" x2="390" y2="284" marker-end="url(#arrow)"/>
  <line class="stroke" x1="390" y1="328" x2="390" y2="340" marker-end="url(#arrow)"/>
  <line class="stroke" x1="390" y1="384" x2="390" y2="396" marker-end="url(#arrow)"/>

  <path class="stroke-a" d="M240,362 L170,362 L170,82 L240,82" marker-end="url(#arrow)"/>
  <text class="small" x="160" y="225" text-anchor="middle">feedback</text>

  <text class="wm" x="768" y="450" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
