<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">گرائمر کا نکتہ سیاق، کام اور جانچ میں</title>
  <desc id="d">گرائمر کے ایک نکتے کا خاکہ جسے پہلے سیاق میں رکھا جاتا ہے، پھر کام میں استعمال کیا جاتا ہے اور پھر جانچا جاتا ہے، اور پہلے مرحلے پر معنی جبکہ کام اور جانچ کے مراحل پر استعمال کی نشاندہی کی گئی ہے۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="280"/>

  <text class="h" x="390" y="34" text-anchor="middle">گرائمر کا نکتہ سیاق، کام اور جانچ میں</text>

  <rect class="panel-a" x="540" y="80" width="180" height="100" rx="4"/>
  <text class="sh" x="630" y="110" text-anchor="middle">سیاق</text>
  <text class="small" x="630" y="134" text-anchor="middle">تصویر صورت کو ایسا معنی</text>
  <text class="small" x="630" y="152" text-anchor="middle">دیتی ہے جو نظر آئے</text>
  <text class="small" x="630" y="170" text-anchor="middle">توجہ: معنی</text>

  <rect class="panel-b" x="300" y="80" width="180" height="100" rx="4"/>
  <text class="sh" x="390" y="110" text-anchor="middle">کام</text>
  <text class="small" x="390" y="134" text-anchor="middle">شاگرد حقیقی مقصد کے لیے</text>
  <text class="small" x="390" y="152" text-anchor="middle">صورت کا انتخاب کرتے ہیں</text>
  <text class="small" x="390" y="170" text-anchor="middle">توجہ: استعمال</text>

  <rect class="panel-c" x="60" y="80" width="180" height="100" rx="4"/>
  <text class="sh" x="150" y="110" text-anchor="middle">جانچ</text>
  <text class="small" x="150" y="134" text-anchor="middle">استاد دیکھتا ہے کہ آیا</text>
  <text class="small" x="150" y="152" text-anchor="middle">صورت درست استعمال ہوئی</text>
  <text class="small" x="150" y="170" text-anchor="middle">توجہ: استعمال</text>

  <line class="stroke" x1="540" y1="130" x2="480" y2="130" marker-end="url(#arrow)"/>
  <line class="stroke" x1="300" y1="130" x2="240" y2="130" marker-end="url(#arrow)"/>

  <text class="small" x="390" y="220" text-anchor="middle">پہلے معنی، پھر صورت، پھر استعمال</text>

  <text class="wm" x="768" y="268" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
