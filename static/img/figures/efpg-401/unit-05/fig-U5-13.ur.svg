<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">فعلی طریقے پر مبنی گرائمر کے سبق کا مکمل منصوبہ</title>
  <desc id="d">فعلی طریقے کے مطابق فعل حال مکمل (present perfect) کے گرائمر سبق کے مکمل منصوبے کا جدول، جس میں ہر مرحلہ، استاد کا عمل، شاگردوں کا عمل اور صورت، معنی یا استعمال پر توجہ دکھائی گئی ہے۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="450"/>

  <text class="h" x="390" y="34" text-anchor="middle">فعلی گرائمر کا سبق: فعل حال مکمل</text>

  <rect class="panel" x="30" y="50" width="720" height="32" rx="4"/>
  <text class="sh" x="745" y="71" text-anchor="end">مرحلہ</text>
  <text class="sh" x="642" y="71" text-anchor="end">وقت</text>
  <text class="sh" x="580" y="71" text-anchor="end">استاد کا عمل</text>
  <text class="sh" x="380" y="71" text-anchor="end">شاگردوں کا عمل</text>
  <text class="sh" x="210" y="71" text-anchor="end">توجہ</text>

  <rect class="panel-a" x="30" y="90" width="720" height="62" rx="4"/>
  <text class="sh" x="745" y="120" text-anchor="end">سیاق</text>
  <text class="body" x="642" y="120" text-anchor="end">6 منٹ</text>
  <text class="body" x="580" y="112" text-anchor="end">ٹوٹی کھڑکی کی تصویر دکھا کر</text>
  <text class="body" x="580" y="130" text-anchor="end">پوچھیں "What has happened?"</text>
  <text class="body" x="380" y="120" text-anchor="end">اندازہ لگا کر جواب</text>
  <text class="body" x="210" y="120" text-anchor="end">معنی</text>

  <rect class="panel-b" x="30" y="158" width="720" height="62" rx="4"/>
  <text class="sh" x="745" y="188" text-anchor="end">پیشکش</text>
  <text class="body" x="642" y="188" text-anchor="end">8 منٹ</text>
  <text class="body" x="580" y="180" text-anchor="end">جوابات تختے پر لکھ کر نمایاں کریں</text>
  <text class="body" x="580" y="198" text-anchor="end">"has + past participle"</text>
  <text class="body" x="380" y="180" text-anchor="end">صورت پر غور</text>
  <text class="body" x="380" y="198" text-anchor="end">اور دہرانا</text>
  <text class="body" x="210" y="188" text-anchor="end">صورت</text>

  <rect class="panel-c" x="30" y="226" width="720" height="62" rx="4"/>
  <text class="sh" x="745" y="248" text-anchor="end">رہنمائی</text>
  <text class="sh" x="745" y="266" text-anchor="end">والی مشق</text>
  <text class="body" x="642" y="256" text-anchor="end">8 منٹ</text>
  <text class="body" x="580" y="248" text-anchor="end">جوڑیوں کو تصویر دیں؛</text>
  <text class="body" x="580" y="266" text-anchor="end">تین جملے بنوائیں</text>
  <text class="body" x="380" y="248" text-anchor="end">جوڑیوں میں</text>
  <text class="body" x="380" y="266" text-anchor="end">جملے بنانا</text>
  <text class="body" x="210" y="248" text-anchor="end">صورت اور معنی</text>

  <rect class="panel-d" x="30" y="294" width="720" height="62" rx="4"/>
  <text class="sh" x="745" y="324" text-anchor="end">کام</text>
  <text class="body" x="642" y="324" text-anchor="end">10 منٹ</text>
  <text class="body" x="580" y="316" text-anchor="end">گروہوں سے اسکول میں</text>
  <text class="body" x="580" y="334" text-anchor="end">تین تبدیلیوں کا</text>
  <text class="body" x="580" y="352" text-anchor="end">بیان کروائیں</text>
  <text class="body" x="380" y="316" text-anchor="end">بیان کر کے رپورٹ</text>
  <text class="body" x="380" y="334" text-anchor="end">کی تیاری</text>
  <text class="body" x="210" y="324" text-anchor="end">استعمال</text>

  <rect class="panel-a" x="30" y="362" width="720" height="62" rx="4"/>
  <text class="sh" x="745" y="392" text-anchor="end">جانچ</text>
  <text class="body" x="642" y="392" text-anchor="end">4 منٹ</text>
  <text class="body" x="580" y="384" text-anchor="end">دو گروہوں سے رپورٹ لیں؛</text>
  <text class="body" x="580" y="402" text-anchor="end">نرمی سے اصلاح کریں</text>
  <text class="body" x="380" y="392" text-anchor="end">رپورٹ پیش کرنا اور سننا</text>
  <text class="body" x="210" y="392" text-anchor="end">استعمال</text>

  <text class="wm" x="768" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
