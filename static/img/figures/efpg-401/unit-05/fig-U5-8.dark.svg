<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The three stages of a structural lesson</title>
  <desc id="d">Flowchart of a structural lesson showing presentation moving to controlled practice and then to free practice, with the teacher's aim at each stage.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="280"/>

  <text class="h" x="390" y="34" text-anchor="middle">The Three Stages of a Structural Lesson</text>

  <rect class="panel-a" x="60" y="70" width="180" height="90" rx="4"/>
  <text class="sh" x="150" y="100" text-anchor="middle">Presentation</text>
  <text class="small" x="150" y="124" text-anchor="middle">Show the pattern</text>
  <text class="small" x="150" y="142" text-anchor="middle">in a context</text>

  <rect class="panel-b" x="300" y="70" width="180" height="90" rx="4"/>
  <text class="sh" x="390" y="100" text-anchor="middle">Controlled practice</text>
  <text class="small" x="390" y="124" text-anchor="middle">Build accuracy</text>
  <text class="small" x="390" y="142" text-anchor="middle">with support</text>

  <rect class="panel-c" x="540" y="70" width="180" height="90" rx="4"/>
  <text class="sh" x="630" y="100" text-anchor="middle">Free practice</text>
  <text class="small" x="630" y="124" text-anchor="middle">Build fluency</text>
  <text class="small" x="630" y="142" text-anchor="middle">and ownership</text>

  <line class="stroke" x1="240" y1="115" x2="300" y2="115" marker-end="url(#arrow)"/>
  <line class="stroke" x1="480" y1="115" x2="540" y2="115" marker-end="url(#arrow)"/>

  <text class="small" x="150" y="196" text-anchor="middle">Teacher talks most here</text>
  <text class="small" x="390" y="196" text-anchor="middle">Teacher corrects errors</text>
  <text class="small" x="630" y="196" text-anchor="middle">Pupils take over</text>

  <text class="small" x="390" y="232" text-anchor="middle">Support shrinks from left to right</text>

  <text class="wm" x="768" y="268" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
