<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The five steps of a guided writing lesson</title>
  <desc id="d">Flowchart of the guided writing lesson: the teacher shows a model, the class analyses it, the pupils plan together, the pupils write, and the class shares the writing.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="240"/>

  <text class="h" x="390" y="34" text-anchor="middle">The Guided Writing Sequence</text>

  <rect class="panel-a" x="30" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="95" y="100" text-anchor="middle">Model</text>
  <text class="small" x="95" y="122" text-anchor="middle">Show a good</text>
  <text class="small" x="95" y="140" text-anchor="middle">example</text>

  <rect class="panel-b" x="180" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="245" y="100" text-anchor="middle">Analyse</text>
  <text class="small" x="245" y="131" text-anchor="middle">Name its parts</text>

  <rect class="panel-c" x="330" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="395" y="94" text-anchor="middle">Plan together</text>
  <text class="small" x="395" y="122" text-anchor="middle">Build a plan</text>
  <text class="small" x="395" y="140" text-anchor="middle">on the board</text>

  <rect class="panel-d" x="480" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="545" y="100" text-anchor="middle">Write</text>
  <text class="small" x="545" y="122" text-anchor="middle">Pupils write</text>
  <text class="small" x="545" y="140" text-anchor="middle">with support</text>

  <rect class="panel-a" x="630" y="70" width="130" height="80" rx="4"/>
  <text class="sh" x="695" y="100" text-anchor="middle">Share</text>
  <text class="small" x="695" y="122" text-anchor="middle">Read work to</text>
  <text class="small" x="695" y="140" text-anchor="middle">a partner</text>

  <line class="stroke" x1="160" y1="110" x2="180" y2="110" marker-end="url(#arrow)"/>
  <line class="stroke" x1="310" y1="110" x2="330" y2="110" marker-end="url(#arrow)"/>
  <line class="stroke" x1="460" y1="110" x2="480" y2="110" marker-end="url(#arrow)"/>
  <line class="stroke" x1="610" y1="110" x2="630" y2="110" marker-end="url(#arrow)"/>

  <text class="small" x="390" y="190" text-anchor="middle">Support shrinks as the pupils take over the writing</text>

  <text class="wm" x="768" y="228" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
