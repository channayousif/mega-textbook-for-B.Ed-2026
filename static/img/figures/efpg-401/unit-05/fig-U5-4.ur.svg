<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">ہر مرحلے کا مقصد اور عام غلطیاں</title>
  <desc id="d">سبقی منصوبے کے سات مراحل کا جدول جس میں ہر مرحلے کا مقصد اور اس سے بچنے والی ایک عام غلطی دکھائی گئی ہے۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="520"/>

  <text class="h" x="390" y="34" text-anchor="middle">ہر مرحلے کا مقصد اور عام غلطیاں</text>

  <rect class="panel" x="30" y="54" width="720" height="32" rx="4"/>
  <text class="sh" x="735" y="75" text-anchor="end">مرحلہ</text>
  <text class="sh" x="615" y="75" text-anchor="end">مقصد</text>
  <text class="sh" x="330" y="75" text-anchor="end">عام غلطی</text>

  <rect class="panel-a" x="30" y="94" width="720" height="52" rx="4"/>
  <text class="sh" x="735" y="124" text-anchor="end">نتیجہ ہائے تعلم</text>
  <text class="body" x="615" y="124" text-anchor="end">بتاتا ہے کہ شاگرد کیا کر سکیں گے</text>
  <text class="body" x="330" y="124" text-anchor="end">مبہم مقصد، جیسے "گرائمر پڑھانا"</text>

  <rect class="panel-b" x="30" y="150" width="720" height="52" rx="4"/>
  <text class="sh" x="735" y="180" text-anchor="end">آغاز کی سرگرمی</text>
  <text class="body" x="615" y="172" text-anchor="end">جماعت کو پرسکون کرتی ہے اور</text>
  <text class="body" x="615" y="190" text-anchor="end">انگریزی کو متحرک کرتی ہے</text>
  <text class="body" x="330" y="180" text-anchor="end">وقت بچانے کے لیے چھوڑ دینا</text>

  <rect class="panel-c" x="30" y="206" width="720" height="52" rx="4"/>
  <text class="sh" x="735" y="236" text-anchor="end">پیشکش</text>
  <text class="body" x="615" y="228" text-anchor="end">نئی زبان کو سیاق کے اندر</text>
  <text class="body" x="615" y="246" text-anchor="end">متعارف کراتی ہے</text>
  <text class="body" x="330" y="236" text-anchor="end">مثال کے بغیر صرف اصول</text>

  <rect class="panel-d" x="30" y="262" width="720" height="52" rx="4"/>
  <text class="sh" x="735" y="292" text-anchor="end">مشق</text>
  <text class="body" x="615" y="292" text-anchor="end">مدد کے ساتھ درستگی پیدا کرتی ہے</text>
  <text class="body" x="330" y="292" text-anchor="end">غلطیوں کی کوئی اصلاح نہیں</text>

  <rect class="panel-a" x="30" y="318" width="720" height="52" rx="4"/>
  <text class="sh" x="735" y="348" text-anchor="end">آزادانہ استعمال</text>
  <text class="body" x="615" y="348" text-anchor="end">روانی اور اپنائیت پیدا کرتا ہے</text>
  <text class="body" x="330" y="340" text-anchor="end">چھوڑ دینا، اس لیے شاگرد زبان</text>
  <text class="body" x="330" y="358" text-anchor="end">کبھی آزادی سے استعمال نہیں کرتے</text>

  <rect class="panel-b" x="30" y="374" width="720" height="52" rx="4"/>
  <text class="sh" x="735" y="404" text-anchor="end">تشخیص</text>
  <text class="body" x="615" y="396" text-anchor="end">دکھاتی ہے کہ نتیجہ</text>
  <text class="body" x="615" y="414" text-anchor="end">حاصل ہوا یا نہیں</text>
  <text class="body" x="330" y="396" text-anchor="end">غائب، اس لیے استاد</text>
  <text class="body" x="330" y="414" text-anchor="end">سبق میں رد و بدل نہیں کر پاتا</text>

  <rect class="panel-c" x="30" y="430" width="720" height="52" rx="4"/>
  <text class="sh" x="735" y="460" text-anchor="end">گھر کا کام</text>
  <text class="body" x="615" y="460" text-anchor="end">مشق کو آگے بڑھاتا ہے</text>
  <text class="body" x="330" y="460" text-anchor="end">سبق سے غیر متعلق</text>

  <text class="wm" x="768" y="508" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
