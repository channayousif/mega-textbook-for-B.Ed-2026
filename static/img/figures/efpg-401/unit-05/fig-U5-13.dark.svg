<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">A filled grammar-lesson plan using the functional approach</title>
  <desc id="d">Table of a filled grammar-lesson plan for the present perfect using the functional approach, showing each stage, the teacher action, the pupil action and the focus on form, meaning or use.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="450"/>

  <text class="h" x="390" y="34" text-anchor="middle">A Functional Grammar Lesson: The Present Perfect</text>

  <rect class="panel" x="30" y="50" width="720" height="32" rx="4"/>
  <text class="sh" x="35" y="71">Stage</text>
  <text class="sh" x="145" y="71">Time</text>
  <text class="sh" x="200" y="71">Teacher action</text>
  <text class="sh" x="400" y="71">Pupil action</text>
  <text class="sh" x="570" y="71">Focus</text>

  <rect class="panel-a" x="30" y="90" width="720" height="62" rx="4"/>
  <text class="sh" x="35" y="120">Context</text>
  <text class="body" x="145" y="120">6 min</text>
  <text class="body" x="200" y="103">Show a photo of a</text>
  <text class="body" x="200" y="121">broken window; ask</text>
  <text class="body" x="200" y="139">"What has happened?"</text>
  <text class="body" x="400" y="120">Guess and answer</text>
  <text class="body" x="570" y="120">Meaning</text>

  <rect class="panel-b" x="30" y="158" width="720" height="62" rx="4"/>
  <text class="sh" x="35" y="188">Presentation</text>
  <text class="body" x="145" y="188">8 min</text>
  <text class="body" x="200" y="171">Write answers on</text>
  <text class="body" x="200" y="189">the board; highlight</text>
  <text class="body" x="200" y="207">"has + past participle"</text>
  <text class="body" x="400" y="180">Notice the form</text>
  <text class="body" x="400" y="198">and repeat</text>
  <text class="body" x="570" y="188">Form</text>

  <rect class="panel-c" x="30" y="226" width="720" height="62" rx="4"/>
  <text class="sh" x="35" y="248">Guided</text>
  <text class="sh" x="35" y="266">practice</text>
  <text class="body" x="145" y="256">8 min</text>
  <text class="body" x="200" y="248">Give pairs a picture;</text>
  <text class="body" x="200" y="266">ask for three sentences</text>
  <text class="body" x="400" y="248">Make sentences</text>
  <text class="body" x="400" y="266">in pairs</text>
  <text class="body" x="570" y="248">Form and meaning</text>

  <rect class="panel-d" x="30" y="294" width="720" height="62" rx="4"/>
  <text class="sh" x="35" y="324">Task</text>
  <text class="body" x="145" y="324">10 min</text>
  <text class="body" x="200" y="316">Ask groups to describe</text>
  <text class="body" x="200" y="334">three changes in</text>
  <text class="body" x="200" y="352">their school</text>
  <text class="body" x="400" y="316">Describe and prepare</text>
  <text class="body" x="400" y="334">to report</text>
  <text class="body" x="570" y="324">Use</text>

  <rect class="panel-a" x="30" y="362" width="720" height="62" rx="4"/>
  <text class="sh" x="35" y="392">Check</text>
  <text class="body" x="145" y="392">4 min</text>
  <text class="body" x="200" y="384">Ask two groups to report;</text>
  <text class="body" x="200" y="402">correct gently</text>
  <text class="body" x="400" y="392">Report and listen</text>
  <text class="body" x="570" y="392">Use</text>

  <text class="wm" x="768" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
