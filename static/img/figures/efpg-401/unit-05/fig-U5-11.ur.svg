<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">پیراگراف، کہانی اور مضمون کے اسباق کا موازنہ</title>
  <desc id="d">پیراگراف، کہانی اور مضمون کے اسباق کا تقابلی جدول، جس میں نمونے کا متن، دی جانے والی مدد، شاگردوں کا حاصلِ کار اور استاد کا کردار دکھایا گیا ہے۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="380"/>

  <text class="h" x="390" y="34" text-anchor="middle">تحریر کے تین اسباق کا موازنہ</text>

  <rect class="panel" x="30" y="50" width="720" height="32" rx="4"/>
  <text class="sh" x="740" y="71" text-anchor="end">سبق</text>
  <text class="sh" x="640" y="71" text-anchor="end">نمونہ</text>
  <text class="sh" x="420" y="71" text-anchor="end">مدد</text>
  <text class="sh" x="220" y="71" text-anchor="end">حاصلِ کار</text>

  <rect class="panel-a" x="30" y="90" width="720" height="82" rx="4"/>
  <text class="sh" x="740" y="130" text-anchor="end">پیراگراف</text>
  <text class="body" x="640" y="116" text-anchor="end">چار جملوں کا نمونے</text>
  <text class="body" x="640" y="134" text-anchor="end">کا پیراگراف</text>
  <text class="body" x="420" y="107" text-anchor="end">موضوعی، معاون اور</text>
  <text class="body" x="420" y="125" text-anchor="end">اختتامی جملوں کا</text>
  <text class="body" x="420" y="143" text-anchor="end">ایک ڈھانچا</text>
  <text class="body" x="220" y="130" text-anchor="end">ایک منظم پیراگراف</text>

  <rect class="panel-b" x="30" y="180" width="720" height="82" rx="4"/>
  <text class="sh" x="740" y="220" text-anchor="end">کہانی</text>
  <text class="body" x="640" y="206" text-anchor="end">آغاز، درمیان اور</text>
  <text class="body" x="640" y="224" text-anchor="end">انجام والی ایک</text>
  <text class="body" x="640" y="242" text-anchor="end">مختصر کہانی</text>
  <text class="body" x="420" y="206" text-anchor="end">ماحول، کرداروں، مسئلے</text>
  <text class="body" x="420" y="224" text-anchor="end">اور حل کا</text>
  <text class="body" x="420" y="242" text-anchor="end">کہانی نقشہ</text>
  <text class="body" x="220" y="220" text-anchor="end">ایک مختصر بیانیہ</text>

  <rect class="panel-c" x="30" y="270" width="720" height="82" rx="4"/>
  <text class="sh" x="740" y="310" text-anchor="end">مضمون</text>
  <text class="body" x="640" y="296" text-anchor="end">تمہید، نفسِ مضمون</text>
  <text class="body" x="640" y="314" text-anchor="end">اور اختتام والا</text>
  <text class="body" x="640" y="332" text-anchor="end">ایک مختصر مضمون</text>
  <text class="body" x="420" y="305" text-anchor="end">خیالات کی فہرست اور</text>
  <text class="body" x="420" y="323" text-anchor="end">پیراگراف کا منصوبہ</text>
  <text class="body" x="220" y="310" text-anchor="end">ایک مختصر مضمون</text>

  <text class="wm" x="768" y="368" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
