<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">The flow of a poetry lesson</title>
  <desc id="d">Diagram of a poetry lesson flowing from listening for enjoyment to recitation, discussing meaning, and a personal response.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
    .ah { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="300"/>

  <text class="h" x="390" y="34" text-anchor="middle">The Flow of a Poetry Lesson</text>

  <rect class="panel-a" x="40" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="120" y="98" text-anchor="middle">Listening for</text>
  <text class="sh" x="120" y="118" text-anchor="middle">enjoyment</text>
  <text class="small" x="120" y="140" text-anchor="middle">Books closed,</text>
  <text class="small" x="120" y="158" text-anchor="middle">listen twice</text>

  <rect class="panel-b" x="220" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="300" y="98" text-anchor="middle">Recitation and</text>
  <text class="sh" x="300" y="118" text-anchor="middle">reading</text>
  <text class="small" x="300" y="148" text-anchor="middle">Read aloud in chorus</text>

  <rect class="panel-c" x="400" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="480" y="108" text-anchor="middle">Discussing meaning</text>
  <text class="small" x="480" y="140" text-anchor="middle">Talk about feelings</text>
  <text class="small" x="480" y="158" text-anchor="middle">and pictures</text>

  <rect class="panel-d" x="580" y="70" width="160" height="100" rx="4"/>
  <text class="sh" x="660" y="98" text-anchor="middle">Appreciation and</text>
  <text class="sh" x="660" y="118" text-anchor="middle">response</text>
  <text class="small" x="660" y="140" text-anchor="middle">Draw and write</text>
  <text class="small" x="660" y="158" text-anchor="middle">a response</text>

  <line class="stroke" x1="200" y1="120" x2="220" y2="120" marker-end="url(#arrow)"/>
  <line class="stroke" x1="380" y1="120" x2="400" y2="120" marker-end="url(#arrow)"/>
  <line class="stroke" x1="560" y1="120" x2="580" y2="120" marker-end="url(#arrow)"/>

  <text class="small" x="390" y="210" text-anchor="middle">From hearing the poem to responding to it</text>

  <text class="wm" x="768" y="288" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
