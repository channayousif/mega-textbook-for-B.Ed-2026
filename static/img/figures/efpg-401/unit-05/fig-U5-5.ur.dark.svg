<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">سرگرمی پر مبنی چار طریقے</title>
  <desc id="d">جوڑیوں میں کام، گروہی کام، کھیلوں اور کردار نگاری کا تقابلی جدول، جس میں ہر طریقے کے لیے کلاس کے سائز سے متعلق مشورے اور تیاری کے نکات دیے گئے ہیں۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .muted { font-size: 13px; fill: var(--muted); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    text { font-size: 15px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 14px; fill: var(--ink); }
    .small { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="430"/>

  <text class="h" x="390" y="34" text-anchor="middle">سرگرمی پر مبنی چار طریقے</text>

  <rect class="panel" x="30" y="50" width="720" height="32" rx="4"/>
  <text class="sh" x="735" y="71" text-anchor="end">طریقہ</text>
  <text class="sh" x="625" y="71" text-anchor="end">موزوں تعدادِ طلبہ</text>
  <text class="sh" x="485" y="71" text-anchor="end">تیاری</text>
  <text class="sh" x="275" y="71" text-anchor="end">مشورہ</text>

  <rect class="panel-a" x="30" y="90" width="720" height="72" rx="4"/>
  <text class="sh" x="735" y="120" text-anchor="end">جوڑیوں میں کام</text>
  <text class="body" x="625" y="120" text-anchor="end">کوئی بھی تعداد، 50+</text>
  <text class="body" x="485" y="120" text-anchor="end">کام کا ایک مختصر کارڈ تیار کریں</text>
  <text class="body" x="275" y="112" text-anchor="end">کام کو 10 منٹ سے</text>
  <text class="body" x="275" y="130" text-anchor="end">کم رکھیں</text>

  <rect class="panel-b" x="30" y="170" width="720" height="72" rx="4"/>
  <text class="sh" x="735" y="200" text-anchor="end">گروہی کام</text>
  <text class="body" x="625" y="200" text-anchor="end">30 سے 50 شاگرد</text>
  <text class="body" x="485" y="200" text-anchor="end">ہر شاگرد کو ایک کردار دیں</text>
  <text class="body" x="275" y="200" text-anchor="end">گھوم پھر کر نگرانی کریں</text>

  <rect class="panel-c" x="30" y="250" width="720" height="72" rx="4"/>
  <text class="sh" x="735" y="280" text-anchor="end">کھیل</text>
  <text class="body" x="625" y="280" text-anchor="end">کوئی بھی تعداد</text>
  <text class="body" x="485" y="272" text-anchor="end">کارڈ یا نمبروں کی</text>
  <text class="body" x="485" y="290" text-anchor="end">شیٹ تیار کریں</text>
  <text class="body" x="275" y="272" text-anchor="end">کھیل کو سبق کے</text>
  <text class="body" x="275" y="290" text-anchor="end">مقصد سے جوڑیں</text>

  <rect class="panel-d" x="30" y="330" width="720" height="72" rx="4"/>
  <text class="sh" x="735" y="360" text-anchor="end">کردار نگاری</text>
  <text class="body" x="625" y="360" text-anchor="end">20 سے 40 شاگرد</text>
  <text class="body" x="485" y="352" text-anchor="end">واضح صورتِ حال اور</text>
  <text class="body" x="485" y="370" text-anchor="end">مقررہ وقت دیں</text>
  <text class="body" x="275" y="352" text-anchor="end">جوڑیوں کو کلاس کے</text>
  <text class="body" x="275" y="370" text-anchor="end">سامنے پیش کرنے دیں</text>

  <text class="wm" x="768" y="418" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
