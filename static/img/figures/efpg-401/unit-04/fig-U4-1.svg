<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A Grammar Item in Three Dimensions</title><desc id="d">Concept map showing a grammar item, the present continuous, analysed into three dimensions: form (subject plus am, is or are plus verb-ing), meaning (an action happening now) and use (describing what people are doing in a picture, a video still or a classroom scene).</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; } .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; } .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="390" y="34" text-anchor="middle">A Grammar Item in Three Dimensions</text><text class="muted" x="390" y="54" text-anchor="middle">The present continuous as an example</text><rect class="panel" x="300" y="175" width="180" height="90" rx="12"/><text class="sh" x="390" y="210" text-anchor="middle">A grammar item</text><text class="body" x="390" y="232" text-anchor="middle">the present continuous</text><rect class="panel-a" x="30" y="70" width="200" height="100" rx="8"/><text class="sh" x="130" y="100" text-anchor="middle">Form</text><text class="body" x="130" y="122" text-anchor="middle">Subject + am/is/are</text><text class="body" x="130" y="140" text-anchor="middle">+ verb-ing</text><text class="muted" x="130" y="160" text-anchor="middle">She is reading.</text><rect class="panel-b" x="30" y="250" width="200" height="100" rx="8"/><text class="sh" x="130" y="280" text-anchor="middle">Meaning</text><text class="body" x="130" y="302" text-anchor="middle">An action happening now</text><text class="body" x="130" y="320" text-anchor="middle">at the moment of speaking</text><rect class="panel-c" x="550" y="165" width="200" height="120" rx="8"/><text class="sh" x="650" y="195" text-anchor="middle">Use</text><text class="body" x="650" y="217" text-anchor="middle">Describing what people</text><text class="body" x="650" y="235" text-anchor="middle">are doing in a picture,</text><text class="body" x="650" y="253" text-anchor="middle">a video still or a scene</text><path class="stroke-a" d="M 230 120 L 295 190"/><polygon class="ah" points="292,183 300,193 289,195"/><path class="stroke-b" d="M 230 300 L 295 250"/><polygon class="ah" points="289,245 300,247 292,257"/><path class="stroke-c" d="M 550 225 L 485 220"/><polygon class="ah" points="491,215 483,220 491,225"/><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>