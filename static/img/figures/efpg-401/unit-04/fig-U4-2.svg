<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 495" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Two Ways to Present the Present Continuous</title><desc id="d">Table comparing deductive and inductive presentation of the present continuous across starting point, pupils' first task, teacher's role, best use and a common risk for each.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="495"/><text class="h" x="390" y="34" text-anchor="middle">Two Ways to Present the Present Continuous</text><text class="muted" x="390" y="54" text-anchor="middle">Deductive and inductive presentation compared</text><rect class="panel" x="30" y="72" width="720" height="36" rx="4"/><text class="sh" x="45" y="96">Aspect</text><text class="sh" x="255" y="96">Deductive (rule-first)</text><text class="sh" x="505" y="96">Inductive (examples-first)</text><rect class="panel-a" x="30" y="116" width="720" height="64" rx="4"/><text class="sh" x="45" y="140">Starting point</text><text class="body" x="255" y="140">State the rule first</text><text class="body" x="505" y="140">Give examples in context first</text><text class="muted" x="45" y="160">Where the lesson begins</text><rect class="panel-b" x="30" y="188" width="720" height="64" rx="4"/><text class="sh" x="45" y="212">Pupils' first task</text><text class="body" x="255" y="212">Repeat and drill the rule</text><text class="body" x="505" y="212">Notice the pattern in examples</text><text class="muted" x="45" y="232">What pupils do first</text><rect class="panel-a" x="30" y="260" width="720" height="64" rx="4"/><text class="sh" x="45" y="284">Teacher's role</text><text class="body" x="255" y="284">Explains the rule</text><text class="body" x="505" y="278">Guides pupils to notice</text><text class="body" x="505" y="296">and state the rule</text><rect class="panel-b" x="30" y="332" width="720" height="64" rx="4"/><text class="sh" x="45" y="356">Best for</text><text class="body" x="255" y="356">Simple structures, limited time</text><text class="body" x="505" y="350">Complex structures, young pupils</text><text class="body" x="505" y="368">curious classes</text><rect class="panel-a" x="30" y="404" width="720" height="64" rx="4"/><text class="sh" x="45" y="428">Risk</text><text class="body" x="255" y="422">Pupils may memorise without</text><text class="body" x="255" y="440">understanding</text><text class="body" x="505" y="422">Some pupils may not notice</text><text class="body" x="505" y="440">the pattern</text><text class="wm" x="768" y="485" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>