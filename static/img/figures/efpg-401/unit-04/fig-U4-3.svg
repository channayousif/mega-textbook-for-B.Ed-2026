<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From Rule to Use in Four Stages</title><desc id="d">Flowchart showing the path from rule to use in four stages: notice the structure in a meaningful context, understand its form, meaning and use, practise it in controlled exercises, then use it freely in a communicative task.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .stroke { stroke: var(--ink); stroke-width: 2; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; } .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; } .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .muted { font-size: 13px; fill: var(--muted); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ah-a { fill: var(--a1); } .ah-b { fill: var(--a2); } .ah-c { fill: var(--a3); } .ah-d { fill: var(--a4); } .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="34" text-anchor="middle">From Rule to Use in Four Stages</text><text class="muted" x="390" y="54" text-anchor="middle">The path of a functional grammar lesson</text><rect class="panel-a" x="40" y="72" width="340" height="130" rx="8"/><text class="sh" x="210" y="98" text-anchor="middle">1. Notice</text><line class="grid" x1="55" y1="108" x2="365" y2="108"/><text class="body" x="60" y="130">See or hear the structure</text><text class="body" x="60" y="152">in a meaningful context</text><text class="small" x="60" y="176">a picture, a story, a scene</text><rect class="panel-b" x="400" y="72" width="340" height="130" rx="8"/><text class="sh" x="570" y="98" text-anchor="middle">2. Understand</text><line class="grid" x1="415" y1="108" x2="725" y2="108"/><text class="body" x="420" y="130">Grasp the form, meaning</text><text class="body" x="420" y="152">and use of the structure</text><text class="small" x="420" y="176">the teacher states the rule</text><rect class="panel-c" x="400" y="222" width="340" height="130" rx="8"/><text class="sh" x="570" y="248" text-anchor="middle">3. Practise in control</text><line class="grid" x1="415" y1="258" x2="725" y2="258"/><text class="body" x="420" y="280">Complete controlled exercises</text><text class="body" x="420" y="302">with the structure fixed</text><text class="small" x="420" y="326">gap-fill, substitution, matching</text><rect class="panel-d" x="40" y="222" width="340" height="130" rx="8"/><text class="sh" x="210" y="248" text-anchor="middle">4. Use freely</text><line class="grid" x1="55" y1="258" x2="365" y2="258"/><text class="body" x="60" y="280">Use the structure in a real</text><text class="body" x="60" y="302">communicative task</text><text class="small" x="60" y="326">describe a photo, role-play, survey</text><path class="stroke-a" d="M 380 137 L 395 137"/><polygon class="ah-a" points="395,132 403,137 395,142"/><path class="stroke-b" d="M 570 202 L 570 217"/><polygon class="ah-b" points="565,217 570,225 575,217"/><path class="stroke-c" d="M 400 287 L 385 287"/><polygon class="ah-c" points="385,282 377,287 385,292"/><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>