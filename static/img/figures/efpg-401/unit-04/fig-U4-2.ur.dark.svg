<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 495" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">فعل حال جاری کو پیش کرنے کے دو طریقے</title>
  <desc id="d">جدول جس میں استنباطی اور استقرائی پیشکش کا تقابلی جائزہ شروعات کے نقطے، طلبہ کے پہلے کام، استاد کے کردار، موزونیت اور ممکنہ خطرے کے لحاظ سے پیش کیا گیا ہے۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 13px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="495"/>

  <text class="h" x="390" y="38" text-anchor="middle">فعل حال جاری کو پیش کرنے کے دو طریقے</text>
  <text class="muted" x="390" y="58" text-anchor="middle">استنباطی اور استقرائی پیشکش کا تقابلی جائزہ</text>

  <!-- Table Header -->
  <rect class="panel" x="30" y="72" width="720" height="36" rx="4"/>
  <text class="sh" x="735" y="96" text-anchor="end">پہلو</text>
  <text class="sh" x="525" y="96" text-anchor="end">استنباطی (پہلے اصول)</text>
  <text class="sh" x="270" y="96" text-anchor="end">استقرائی (پہلے مثالیں)</text>

  <!-- Row 1: Starting point -->
  <rect class="panel-a" x="30" y="116" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="140" text-anchor="end">شروعات کا نقطہ</text>
  <text class="muted" x="735" y="160" text-anchor="end">سبق کہاں سے شروع ہوتا ہے</text>
  <text class="body" x="525" y="140" text-anchor="end">پہلے اصول بیان کرنا</text>
  <text class="body" x="270" y="140" text-anchor="end">پہلے سیاق میں مثالیں دینا</text>

  <!-- Row 2: Pupils' first task -->
  <rect class="panel-b" x="30" y="188" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="212" text-anchor="end">طلبہ کا پہلا کام</text>
  <text class="muted" x="735" y="232" text-anchor="end">طلبہ سب سے پہلے کیا کرتے ہیں</text>
  <text class="body" x="525" y="212" text-anchor="end">اصول کو دہرانا اور مشق کرنا</text>
  <text class="body" x="270" y="212" text-anchor="end">مثالوں سے نمونہ تلاش کرنا</text>

  <!-- Row 3: Teacher's role -->
  <rect class="panel-a" x="30" y="260" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="284" text-anchor="end">استاد کا کردار</text>
  <text class="muted" x="735" y="304" text-anchor="end">رہنمائی کا انداز</text>
  <text class="body" x="525" y="284" text-anchor="end">اصول کی وضاحت کرتا ہے</text>
  <text class="body" x="270" y="278" text-anchor="end">طلبہ کی نمونہ تلاش کرنے اور</text>
  <text class="body" x="270" y="298" text-anchor="end">اصول اخذ کرنے میں رہنمائی</text>

  <!-- Row 4: Best for -->
  <rect class="panel-b" x="30" y="332" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="356" text-anchor="end">سب سے موزوں</text>
  <text class="muted" x="735" y="376" text-anchor="end">کب استعمال کریں</text>
  <text class="body" x="525" y="356" text-anchor="end">آسان ساخت، محدود وقت</text>
  <text class="body" x="270" y="350" text-anchor="end">پیچیدہ ساخت، چھوٹی جماعتیں</text>
  <text class="body" x="270" y="370" text-anchor="end">اور متجسس طلبہ</text>

  <!-- Row 5: Risk -->
  <rect class="panel-a" x="30" y="404" width="720" height="64" rx="4"/>
  <text class="sh" x="735" y="428" text-anchor="end">ممکنہ خطرہ</text>
  <text class="muted" x="735" y="448" text-anchor="end">جس سے بچنا ضروری ہے</text>
  <text class="body" x="525" y="422" text-anchor="end">طلبہ سمجھے بغیر محض</text>
  <text class="body" x="525" y="442" text-anchor="end">اصول رٹ سکتے ہیں</text>
  <text class="body" x="270" y="422" text-anchor="end">کچھ طلبہ رہنمائی کے بغیر</text>
  <text class="body" x="270" y="442" text-anchor="end">نمونہ نہ سمجھ سکیں</text>

  <text class="wm" x="768" y="485" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text>
</svg>
