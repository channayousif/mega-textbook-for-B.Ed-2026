<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Comparison of Functional Writing Formats</title>
  <desc id="d">Table comparing an informal letter, an invitation, and an application to the headmaster across layout, opening salutation, tone, body purpose, and closing signature.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 12px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="430"/>

  <text class="h" x="390" y="34" text-anchor="middle">Comparative Analysis of Functional Writing Genres</text>
  <text class="muted" x="390" y="52" text-anchor="middle">Contrasting informal letters, social invitations, and formal school applications</text>

  <!-- Table Header -->
  <rect class="panel" x="25" y="68" width="730" height="34" rx="4"/>
  <text class="sh" x="35" y="90">Feature</text>
  <text class="sh" x="170" y="90">Informal Letter</text>
  <text class="sh" x="365" y="90">Social Invitation</text>
  <text class="sh" x="555" y="90">Formal Application</text>

  <!-- Row 1: Layout -->
  <rect class="panel-a" x="25" y="108" width="730" height="54" rx="4"/>
  <text class="sh" x="35" y="128">1. Layout</text>
  <text class="muted" x="35" y="146">Page design</text>
  <text class="body" x="170" y="128">Sender address top-right;</text>
  <text class="body" x="170" y="146">date below; left body margin</text>
  <text class="body" x="365" y="128">Card format or boxed layout;</text>
  <text class="body" x="365" y="146">centered or indented details</text>
  <text class="body" x="555" y="128">Recipient title top-left; formal</text>
  <text class="body" x="555" y="146">subject line before body</text>

  <!-- Row 2: Salutation -->
  <rect class="panel-b" x="25" y="168" width="730" height="54" rx="4"/>
  <text class="sh" x="35" y="188">2. Salutation</text>
  <text class="muted" x="35" y="206">Greeting form</text>
  <text class="body" x="170" y="188">"Dear Bilal," or</text>
  <text class="body" x="170" y="206">"Dear Uncle,"</text>
  <text class="body" x="365" y="188">"You are cordially invited..."</text>
  <text class="body" x="365" y="206">or "Dear Friend,"</text>
  <text class="body" x="555" y="188">"Respected Sir / Madam,"</text>
  <text class="body" x="555" y="206">(Strict professional deference)</text>

  <!-- Row 3: Tone -->
  <rect class="panel-a" x="25" y="228" width="730" height="54" rx="4"/>
  <text class="sh" x="35" y="248">3. Tone</text>
  <text class="muted" x="35" y="266">Register</text>
  <text class="body" x="170" y="248">Warm, friendly, emotional,</text>
  <text class="body" x="170" y="266">and conversational</text>
  <text class="body" x="365" y="248">Welcoming, enthusiastic,</text>
  <text class="body" x="365" y="266">clear, and celebratory</text>
  <text class="body" x="555" y="248">Formal, respectful, concise,</text>
  <text class="body" x="555" y="266">objective, and serious</text>

  <!-- Row 4: Body Focus -->
  <rect class="panel-b" x="25" y="288" width="730" height="54" rx="4"/>
  <text class="sh" x="35" y="308">4. Body</text>
  <text class="muted" x="35" y="326">Content aim</text>
  <text class="body" x="170" y="308">Shares personal news, life</text>
  <text class="body" x="170" y="326">experiences, and inquiries</text>
  <text class="body" x="365" y="308">Specifies event purpose, date,</text>
  <text class="body" x="365" y="326">time, venue, and RSVP</text>
  <text class="body" x="555" y="308">States official leave reasons,</text>
  <text class="body" x="555" y="326">exact dates, and formal plea</text>

  <!-- Row 5: Closing -->
  <rect class="panel-a" x="25" y="348" width="730" height="54" rx="4"/>
  <text class="sh" x="35" y="368">5. Closing</text>
  <text class="muted" x="35" y="386">Subscription</text>
  <text class="body" x="170" y="368">"Your loving friend,"</text>
  <text class="body" x="170" y="386">followed by first name</text>
  <text class="body" x="365" y="368">"Warm regards,"</text>
  <text class="body" x="365" y="386">followed by host name</text>
  <text class="body" x="555" y="368">"Yours obediently," followed</text>
  <text class="body" x="555" y="386">by name, class, &amp; roll number</text>

  <text class="wm" x="768" y="422" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
