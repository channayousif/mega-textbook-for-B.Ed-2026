<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Three-Stage Listening Lesson Framework</title>
  <desc id="d">Flowchart showing a three-stage listening lesson: pre-listening prepares learners with vocabulary and purpose, while-listening focuses attention with guided tasks, and post-listening checks meaning and extends into speaking or writing.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 13px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="400"/>

  <text class="h" x="390" y="38" text-anchor="middle">Three-Stage Framework for Teaching Listening</text>
  <text class="muted" x="390" y="58" text-anchor="middle">Scaffolding second-language comprehension from preparation to communication</text>

  <!-- Stage 1: Pre-Listening -->
  <rect class="panel-a" x="40" y="80" width="210" height="260" rx="8"/>
  <text class="sh" x="145" y="112" text-anchor="middle">1. Pre-Listening</text>
  <text class="small" x="145" y="132" text-anchor="middle">Preparation and Purpose</text>
  <line class="grid" x1="55" y1="145" x2="235" y2="145"/>

  <text class="body" x="60" y="175">• Activate prior knowledge</text>
  <text class="body" x="60" y="205">• Show picture or realia</text>
  <text class="body" x="60" y="235">• Pre-teach blocking words</text>
  <text class="body" x="60" y="265">• Set clear listening goal</text>
  <text class="body" x="60" y="295">• Provide focus question</text>
  <text class="small" x="145" y="325" text-anchor="middle">Mental schema is ready</text>

  <!-- Arrow 1 to 2 -->
  <path class="stroke-a" d="M 250 210 L 280 210"/>
  <polygon class="ah-a" points="280,205 288,210 280,215"/>

  <!-- Stage 2: While-Listening -->
  <rect class="panel-b" x="285" y="80" width="210" height="260" rx="8"/>
  <text class="sh" x="390" y="112" text-anchor="middle">2. While-Listening</text>
  <text class="small" x="390" y="132" text-anchor="middle">Guided Comprehension</text>
  <line class="grid" x1="300" y1="145" x2="480" y2="145"/>

  <text class="body" x="305" y="175">• First listen: global gist</text>
  <text class="body" x="305" y="205">• Check overall topic</text>
  <text class="body" x="305" y="235">• Second listen: details</text>
  <text class="body" x="305" y="265">• Tick list or simple grid</text>
  <text class="body" x="305" y="295">• Minimal writing load</text>
  <text class="small" x="390" y="325" text-anchor="middle">Active meaning construction</text>

  <!-- Arrow 2 to 3 -->
  <path class="stroke-b" d="M 495 210 L 525 210"/>
  <polygon class="ah-b" points="525,205 533,210 525,215"/>

  <!-- Stage 3: Post-Listening -->
  <rect class="panel-c" x="530" y="80" width="210" height="260" rx="8"/>
  <text class="sh" x="635" y="112" text-anchor="middle">3. Post-Listening</text>
  <text class="small" x="635" y="132" text-anchor="middle">Extension and Transfer</text>
  <line class="grid" x1="545" y1="145" x2="725" y2="145"/>

  <text class="body" x="550" y="175">• Compare answers in pairs</text>
  <text class="body" x="550" y="205">• Whole-class verification</text>
  <text class="body" x="550" y="235">• Discuss passage ideas</text>
  <text class="body" x="550" y="265">• Pair speaking role play</text>
  <text class="body" x="550" y="295">• Link to writing task</text>
  <text class="small" x="635" y="325" text-anchor="middle">Transfer to productive skills</text>

  <!-- Return loop -->
  <path class="stroke" stroke-dasharray="4 4" d="M 635 340 L 635 365 L 145 365 L 145 345"/>
  <polygon class="ah" points="140,345 145,337 150,345"/>
  <text class="small" x="390" y="380" text-anchor="middle">Learning cycle informs subsequent lesson design</text>

  <text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
