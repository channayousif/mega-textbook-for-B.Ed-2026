<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Comparison of Listening Sub-Skills</title>
  <desc id="d">Table comparing four listening sub-skills: gist, specific detail, inference, and following instructions, detailing classroom purpose and concrete primary school tasks for each.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 13px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="400"/>

  <text class="h" x="390" y="38" text-anchor="middle">Core Listening Sub-Skills in Primary English</text>
  <text class="muted" x="390" y="58" text-anchor="middle">Matching classroom learning tasks to specific cognitive purposes</text>

  <!-- Table Header -->
  <rect class="panel" x="30" y="75" width="720" height="35" rx="4"/>
  <text class="sh" x="45" y="98">Listening Sub-Skill</text>
  <text class="sh" x="225" y="98">Cognitive Purpose</text>
  <text class="sh" x="485" y="98">Classroom Practice Task</text>

  <!-- Row 1: Gist -->
  <rect class="panel-a" x="30" y="118" width="720" height="58" rx="4"/>
  <text class="sh" x="45" y="142">1. Listening for Gist</text>
  <text class="muted" x="45" y="160">Global understanding</text>
  <text class="body" x="225" y="142">Grasp overall main message</text>
  <text class="body" x="225" y="160">without decoding every single word</text>
  <text class="body" x="485" y="142">Match story to picture summary;</text>
  <text class="body" x="485" y="160">identify speaker's primary intent</text>

  <!-- Row 2: Specific Detail -->
  <rect class="panel-b" x="30" y="184" width="720" height="58" rx="4"/>
  <text class="sh" x="45" y="208">2. Specific Detail</text>
  <text class="muted" x="45" y="226">Focused extraction</text>
  <text class="body" x="225" y="208">Locate precise factual items</text>
  <text class="body" x="225" y="226">(names, numbers, dates, locations)</text>
  <text class="body" x="485" y="208">Fill missing times in schedule;</text>
  <text class="body" x="485" y="226">tick prices on shopping list</text>

  <!-- Row 3: Inference -->
  <rect class="panel-c" x="30" y="250" width="720" height="58" rx="4"/>
  <text class="sh" x="45" y="274">3. Inferential</text>
  <text class="muted" x="45" y="292">Reading between lines</text>
  <text class="body" x="225" y="274">Deduce unstated feelings, attitudes,</text>
  <text class="body" x="225" y="292">relationships, or social context</text>
  <text class="body" x="485" y="274">Identify speaker emotion from tone;</text>
  <text class="body" x="485" y="292">deduce setting from audio clues</text>

  <!-- Row 4: Instructions -->
  <rect class="panel-d" x="30" y="316" width="720" height="58" rx="4"/>
  <text class="sh" x="45" y="340">4. Instructions</text>
  <text class="muted" x="45" y="358">Procedural listening</text>
  <text class="body" x="225" y="340">Execute sequential spoken commands</text>
  <text class="body" x="225" y="358">accurately in correct operational order</text>
  <text class="body" x="485" y="340">Total Physical Response commands;</text>
  <text class="body" x="485" y="358">listen and draw path on grid map</text>

  <text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
