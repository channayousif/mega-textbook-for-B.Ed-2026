<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Five Language Games for Spoken English</title>
  <desc id="d">Table of five language games for oral expression: game title, targeted grade level, time allocation, and specific spoken language structures practiced.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 13px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="420"/>

  <text class="h" x="390" y="36" text-anchor="middle">Five Language Games for Primary Oral Expression</text>
  <text class="muted" x="390" y="54" text-anchor="middle">Structured communicative games that promote spontaneous spoken English</text>

  <!-- Table Header -->
  <rect class="panel" x="30" y="70" width="720" height="35" rx="4"/>
  <text class="sh" x="45" y="93">Language Game</text>
  <text class="sh" x="235" y="93">Target &amp; Time</text>
  <text class="sh" x="355" y="93">Target Spoken Language Structures</text>

  <!-- Row 1 -->
  <rect class="panel-a" x="30" y="112" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="133">1. Twenty Questions</text>
  <text class="muted" x="45" y="151">Deductive guessing</text>
  <text class="body" x="235" y="133">Grades 4-5</text>
  <text class="muted" x="235" y="151">10-15 mins</text>
  <text class="body" x="355" y="133">Yes/No questions: "Is it...?", "Can it...?", "Does it have...?"</text>
  <text class="muted" x="355" y="151">Adjectives of size, shape, color, and habitat</text>

  <!-- Row 2 -->
  <rect class="panel-b" x="30" y="170" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="191">2. Describe and Draw</text>
  <text class="muted" x="45" y="209">Spatial speech</text>
  <text class="body" x="235" y="191">Grades 3-5</text>
  <text class="muted" x="235" y="209">15 mins</text>
  <text class="body" x="355" y="191">Prepositions: "in the middle", "above", "to the left of"</text>
  <text class="muted" x="355" y="209">Geometric shapes, household nouns, and size markers</text>

  <!-- Row 3 -->
  <rect class="panel-c" x="30" y="228" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="249">3. Chain Story</text>
  <text class="muted" x="45" y="267">Narrative sequencing</text>
  <text class="body" x="235" y="249">Grades 4-5</text>
  <text class="muted" x="235" y="267">10 mins</text>
  <text class="body" x="355" y="249">Past simple verbs and chronological connectors: then, next</text>
  <text class="muted" x="355" y="267">Narrative imagination and spontaneous discourse linking</text>

  <!-- Row 4 -->
  <rect class="panel-d" x="30" y="286" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="307">4. Find Someone Who</text>
  <text class="muted" x="45" y="325">Survey interview</text>
  <text class="body" x="235" y="307">Grades 3-5</text>
  <text class="muted" x="235" y="325">15 mins</text>
  <text class="body" x="355" y="307">Present simple questions: "Do you have...?", "Can you...?"</text>
  <text class="muted" x="355" y="325">Short spoken replies: "Yes, I do," "No, I cannot"</text>

  <!-- Row 5 -->
  <rect class="panel-a" x="30" y="344" width="720" height="52" rx="4"/>
  <text class="sh" x="45" y="365">5. Spot Difference</text>
  <text class="muted" x="45" y="383">Information exchange</text>
  <text class="body" x="235" y="365">Grades 3-5</text>
  <text class="muted" x="235" y="383">15 mins</text>
  <text class="body" x="355" y="365">Comparing scenes: "In my picture...", "What about yours?"</text>
  <text class="muted" x="355" y="383">Present continuous statements describing character actions</text>

  <text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
