<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">ترجمے کے بغیر معنی کا براہِ راست ربط</title>
  <desc id="d">خاکہ جو دکھاتا ہے کہ براہِ راست طریقہ مادری زبان کے ترجمے کو بیچ میں لائے بغیر انگریزی الفاظ کو براہِ راست حقیقی اشیا، بصری تصاویر اور جسمانی حرکات سے کیسے جوڑتا ہے۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .body { font-size: 13px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .ah-d { fill: var(--a4); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="380"/>

  <text class="h" x="390" y="34" text-anchor="middle">‫ترجمے کے بغیر معنی کا براہِ راست ربط‬</text>
  <text class="muted" x="390" y="61" text-anchor="middle">‫انگریزی الفاظ کو براہِ راست حسی تجربے اور حرکت سے جوڑنا‬</text>

  <!-- Top Three Modalities -->
  <!-- Box 1: Objects (Realia) -->
  <rect class="panel-a" x="530" y="80" width="205" height="135" rx="8"/>
  <text class="sh" x="633" y="108" text-anchor="middle">‫1. حقیقی اشیا‬</text>
  <text class="small" x="633" y="128" text-anchor="middle">‫جماعت کی ٹھوس اشیا‬</text>
  <line class="grid" x1="725" y1="138" x2="540" y2="138"/>
  <text class="small" x="725" y="162" text-anchor="end">‫• پنسلیں، کتابیں، پتے‬</text>
  <text class="small" x="725" y="186" text-anchor="end">‫• طلبہ حقیقی اشیا چھوتے ہیں‬</text>
  <text class="small" x="633" y="206" text-anchor="middle">‫جسمانی حسی سہارا‬</text>

  <!-- Box 2: Visual Representation -->
  <rect class="panel-b" x="288" y="80" width="205" height="135" rx="8"/>
  <text class="sh" x="390" y="108" text-anchor="middle">‫2. بصری تصاویر‬</text>
  <text class="small" x="390" y="128" text-anchor="middle">‫عکاسی اور خاکے‬</text>
  <line class="grid" x1="483" y1="138" x2="298" y2="138"/>
  <text class="small" x="483" y="162" text-anchor="end">‫• چارٹ، کارڈ، خاکے‬</text>
  <text class="small" x="483" y="186" text-anchor="end">‫• جانوروں اور گلیوں کے مناظر‬</text>
  <text class="small" x="390" y="206" text-anchor="middle">‫بصری سیاقی اشارہ‬</text>

  <!-- Box 3: Physical Actions -->
  <rect class="panel-c" x="45" y="80" width="205" height="135" rx="8"/>
  <text class="sh" x="148" y="108" text-anchor="middle">‫3. جسمانی حرکات‬</text>
  <text class="small" x="148" y="128" text-anchor="middle">‫خاموش اداکاری، اشارے اور حرکت‬</text>
  <line class="grid" x1="240" y1="138" x2="55" y2="138"/>
  <text class="small" x="240" y="162" text-anchor="end">‫• دوڑنا، اچھلنا، چلنا‬</text>
  <text class="small" x="240" y="186" text-anchor="end">‫• استاد حرکات کا مظاہرہ کرتا ہے‬</text>
  <text class="small" x="148" y="206" text-anchor="middle">‫حرکی تقویت‬</text>

  <!-- Arrows converging to Center Box -->
  <path class="stroke-a" d="M 633 215 L 490 270"/>
  <polygon class="ah-a" points="493,265 482,272 489,275"/>

  <path class="stroke-b" d="M 390 215 L 390 255"/>
  <polygon class="ah-b" points="395,255 390,265 385,255"/>

  <path class="stroke-c" d="M 148 215 L 290 270"/>
  <polygon class="ah-c" points="291,275 298,272 287,265"/>

  <!-- Center Box: Direct Association Target -->
  <rect class="panel" x="220" y="265" width="340" height="75" rx="8"/>
  <text class="sh" x="390" y="292" text-anchor="middle">‫براہِ راست ذہنی ربط‬</text>
  <text class="body" x="390" y="312" text-anchor="middle">‫انگریزی لفظ اور ساخت قائم ہوتی ہے‬</text>
  <text class="small" x="390" y="330" text-anchor="middle">‫مادری زبان ‪(L1)‬ کے ترجمے کا چکر ختم‬</text>

  <text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
