<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">پرائمری انگریزی میں سمعی و زبانی مشقوں کی اقسام</title>
  <desc id="d">جدول جس میں سمعی و زبانی طریقے کی چار بنیادی مشقوں کی تفصیل دی گئی ہے: تکرار، متبادل، تبدیلی اور زنجیری مشقیں، استاد کے اشاروں اور طلبہ کے جوابات سمیت۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .body { font-size: 13px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .ah-d { fill: var(--a4); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="400"/>

  <text class="h" x="390" y="34" text-anchor="middle">‫پرائمری انگریزی میں سمعی و زبانی مشقوں کی اقسام‬</text>
  <text class="muted" x="390" y="61" text-anchor="middle">‫قواعدی نمونوں پر عبور کے لیے منظم زبانی عادت سازی کی مشقیں‬</text>

  <!-- Row 1: Repetition Drill -->
  <rect class="panel-a" x="515" y="75" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="102" text-anchor="end">‫تکرار کی مشق‬</text>
  <text class="small" x="728" y="122" text-anchor="end">‫صوتی نقل‬</text>
  <rect class="panel" x="40" y="75" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="100" text-anchor="end">‫• استاد: ‪"She bought fresh fruit at the bazaar."‬‬</text>
  <text class="body" x="490" y="124" text-anchor="end">‫• طلبہ اجتماعی اور انفرادی طور پر اسی لہجے میں دہراتے ہیں‬</text>

  <!-- Row 2: Substitution Drill -->
  <rect class="panel-b" x="515" y="150" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="177" text-anchor="end">‫متبادل کی مشق‬</text>
  <text class="small" x="728" y="197" text-anchor="end">‫خانہ پُر کرنے کی مشق‬</text>
  <rect class="panel" x="40" y="150" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="175" text-anchor="end">‫• استاد: ‪"I like sweet mangoes."‬ اشارہ: ‪"apples"‬‬</text>
  <text class="body" x="490" y="199" text-anchor="end">‫• طلبہ: ‪"I like sweet apples."‬ (نحوی خانوں کی پختگی)‬</text>

  <!-- Row 3: Transformation Drill -->
  <rect class="panel-a" x="515" y="225" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="252" text-anchor="end">‫تبدیلی کی مشق‬</text>
  <text class="small" x="728" y="272" text-anchor="end">‫نحوی تشکیلِ نو‬</text>
  <rect class="panel" x="40" y="225" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="250" text-anchor="end">‫• استاد: ‪"Bilal is writing a letter."‬ اشارہ: ‪"‬منفی‪"‬‬</text>
  <text class="body" x="490" y="274" text-anchor="end">‫• طلبہ: ‪"Bilal is not writing a letter."‬ (منفی صورت خودکار)‬</text>

  <!-- Row 4: Chain Drill -->
  <rect class="panel-c" x="515" y="300" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="327" text-anchor="end">‫زنجیری مشق‬</text>
  <text class="small" x="728" y="347" text-anchor="end">‫باہمی زبانی بہاؤ‬</text>
  <rect class="panel" x="40" y="300" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="325" text-anchor="end">‫• طالب علم 1 سے طالب علم 2: ‪"Where do you live?"‬‬</text>
  <text class="body" x="490" y="349" text-anchor="end">‫• طالب علم 2: ‪"I live in Sukkur. Where do you live?"‬ (آگے بڑھتا ہے)‬</text>

  <text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
