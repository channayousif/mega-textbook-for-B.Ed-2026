<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Morphological Word Family Tree</title>
  <desc id="d">Diagram illustrating how a single base root word, care, generates an entire family of related nouns, adjectives, and adverbs through affixation.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .body { font-size: 13px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .ah-d { fill: var(--a4); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="370"/>

  <text class="h" x="390" y="36" text-anchor="middle">Word Family Morphology: Root and Affixation</text>
  <text class="muted" x="390" y="56" text-anchor="middle">Building multiple parts of speech from a single root morpheme</text>

  <!-- Left: Suffix Family 1 (-ful) -->
  <rect class="panel-a" x="40" y="80" width="200" height="60" rx="8"/>
  <text class="sh" x="140" y="105" text-anchor="middle">careful</text>
  <text class="small" x="140" y="125" text-anchor="middle">Adjective • care + -ful</text>

  <rect class="panel-a" x="40" y="160" width="200" height="60" rx="8"/>
  <text class="sh" x="140" y="185" text-anchor="middle">carefully</text>
  <text class="small" x="140" y="205" text-anchor="middle">Adverb • careful + -ly</text>

  <rect class="panel-a" x="40" y="240" width="200" height="60" rx="8"/>
  <text class="sh" x="140" y="265" text-anchor="middle">carefulness</text>
  <text class="small" x="140" y="285" text-anchor="middle">Noun • careful + -ness</text>

  <!-- Center Root Box -->
  <rect class="panel" x="300" y="145" width="180" height="90" rx="10"/>
  <text class="small" x="390" y="170" text-anchor="middle">BASE ROOT MORPHEME</text>
  <text class="h" x="390" y="200" text-anchor="middle">CARE</text>
  <text class="small" x="390" y="222" text-anchor="middle">Noun / Verb</text>

  <!-- Right: Suffix Family 2 (-less) -->
  <rect class="panel-c" x="540" y="80" width="200" height="60" rx="8"/>
  <text class="sh" x="640" y="105" text-anchor="middle">careless</text>
  <text class="small" x="640" y="125" text-anchor="middle">Adjective • care + -less</text>

  <rect class="panel-c" x="540" y="160" width="200" height="60" rx="8"/>
  <text class="sh" x="640" y="185" text-anchor="middle">carelessly</text>
  <text class="small" x="640" y="205" text-anchor="middle">Adverb • careless + -ly</text>

  <rect class="panel-c" x="540" y="240" width="200" height="60" rx="8"/>
  <text class="sh" x="640" y="265" text-anchor="middle">carelessness</text>
  <text class="small" x="640" y="285" text-anchor="middle">Noun • careless + -ness</text>

  <!-- Connecting Lines from Center to Left -->
  <path class="stroke-a" d="M 300 170 L 240 110"/>
  <path class="stroke-a" d="M 300 190 L 240 190"/>
  <path class="stroke-a" d="M 300 210 L 240 270"/>

  <!-- Connecting Lines from Center to Right -->
  <path class="stroke-c" d="M 480 170 L 540 110"/>
  <path class="stroke-c" d="M 480 190 L 540 190"/>
  <path class="stroke-c" d="M 480 210 L 540 270"/>

  <text class="small" x="390" y="328" text-anchor="middle">Morphological generative power: explicit teaching of affixes multiplies learner vocabulary</text>

  <text class="wm" x="768" y="355" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
