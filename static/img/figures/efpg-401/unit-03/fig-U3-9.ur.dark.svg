<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">ترسیلی طریقۂ تدریسِ زبان (CLT): بنیادی ستون</title>
  <desc id="d">تصوراتی خاکہ جو ترسیلی طریقۂ تدریسِ زبان کے چار بنیادی ستون دکھاتا ہے: حقیقی ترسیلی مقصد، معلوماتی خلا، جوڑی کا باہمی کام، اور درستی سے پہلے روانی کو ترجیح دینا۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .body { font-size: 13px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .ah-d { fill: var(--a4); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="380"/>

  <text class="h" x="390" y="34" text-anchor="middle">‫ترسیلی طریقۂ تدریسِ زبان ‪(CLT)‬: بنیادی ستون‬</text>
  <text class="muted" x="390" y="61" text-anchor="middle">‫باہم مربوط تدریسی اصول جو ترسیلی اہلیت پیدا کرتے ہیں‬</text>

  <!-- Central Hub: CLT -->
  <rect class="panel" x="290" y="150" width="200" height="80" rx="10"/>
  <text class="sh" x="390" y="182" text-anchor="middle">‫ترسیلی‬</text>
  <text class="sh" x="390" y="202" text-anchor="middle">‫اہلیت‬</text>
  <text class="small" x="390" y="222" text-anchor="middle">‫سماجی سیاق میں معنی‬</text>

  <!-- Top Pillar: Real Purpose -->
  <rect class="panel-a" x="260" y="70" width="260" height="58" rx="8"/>
  <text class="sh" x="390" y="94" text-anchor="middle">‫1. حقیقی ترسیلی مقصد‬</text>
  <text class="small" x="390" y="114" text-anchor="middle">‫کام حقیقی معلومات پہنچاتے ہیں، اصولوں کی نمائش نہیں‬</text>

  <!-- Connecting line Top -->
  <path class="stroke-a" d="M 390 128 L 390 150"/>
  <polygon class="ah-a" points="395,145 390,150 385,145"/>

  <!-- Right Pillar: Information Gap -->
  <rect class="panel-b" x="40" y="160" width="220" height="60" rx="8"/>
  <text class="sh" x="150" y="185" text-anchor="middle">‫2. معلوماتی خلا‬</text>
  <text class="small" x="150" y="205" text-anchor="middle">‫بولنے والا غائب معلومات بانٹتا ہے‬</text>

  <!-- Connecting line Right -->
  <path class="stroke-b" d="M 290 190 L 260 190"/>
  <polygon class="ah-b" points="265,185 260,190 265,195"/>

  <!-- Bottom Pillar: Pair and Group Work -->
  <rect class="panel-c" x="260" y="260" width="260" height="58" rx="8"/>
  <text class="sh" x="390" y="284" text-anchor="middle">‫3. جوڑی کا باہمی کام‬</text>
  <text class="small" x="390" y="304" text-anchor="middle">‫بڑی جماعتوں میں طلبہ کے بولنے کا وقت بڑھاتا ہے‬</text>

  <!-- Connecting line Bottom -->
  <path class="stroke-c" d="M 390 230 L 390 260"/>
  <polygon class="ah-c" points="395,255 390,260 385,255"/>

  <!-- Left Pillar: Fluency Before Accuracy -->
  <rect class="panel-d" x="520" y="160" width="220" height="60" rx="8"/>
  <text class="sh" x="630" y="185" text-anchor="middle">‫4. درستی سے پہلے روانی‬</text>
  <text class="small" x="630" y="205" text-anchor="middle">‫غلطیوں کی نگرانی سے پہلے پیغام کی ترسیل‬</text>

  <!-- Connecting line Left -->
  <path class="stroke-d" d="M 490 190 L 520 190"/>
  <polygon class="ah-d" points="515,185 520,190 515,195"/>

  <text class="small" x="390" y="348" text-anchor="middle">‫تعاملی ترکیب: زبان معنی کی حقیقی گفت و شنید کے ذریعے حاصل ہوتی ہے‬</text>

  <text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
