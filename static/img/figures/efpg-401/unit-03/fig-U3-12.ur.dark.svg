<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">ابتدائی جماعتوں کے لیے عام سابقے اور لاحقے</title>
  <desc id="d">جدول جس میں پرائمری جماعتوں کے لیے انگریزی کے کثرت سے استعمال ہونے والے سابقوں اور لاحقوں کی تفصیل دی گئی ہے، ان کے معنی اور کلاس روم کی ٹھوس مثالوں سمیت۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .body { font-size: 13px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .ah-d { fill: var(--a4); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="400"/>

  <text class="h" x="390" y="34" text-anchor="middle">‫ابتدائی جماعتوں کے لیے عام سابقے اور لاحقے‬</text>
  <text class="muted" x="390" y="61" text-anchor="middle">‫انگریزی کے بنیادی سابقے لاحقے: معنی اور پرائمری جماعت کے نمونہ الفاظ‬</text>

  <!-- Row 1: Prefix un- -->
  <rect class="panel-a" x="515" y="75" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="102" text-anchor="end">‫سابقہ: ‪un-‬‬</text>
  <text class="small" x="728" y="122" text-anchor="end">‫نفی / الٹ‬</text>
  <rect class="panel" x="40" y="75" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="100" text-anchor="end">‫• معنی: نہیں، الٹ، عمل کو الٹنا‬</text>
  <text class="body" x="490" y="124" text-anchor="end">‫• مثالیں: ‪unhappy, unkind, unfair, untie, unlock‬‬</text>

  <!-- Row 2: Prefix re- -->
  <rect class="panel-b" x="515" y="150" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="177" text-anchor="end">‫سابقہ: ‪re-‬‬</text>
  <text class="small" x="728" y="197" text-anchor="end">‫تکرار / واپسی‬</text>
  <rect class="panel" x="40" y="150" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="175" text-anchor="end">‫• معنی: دوبارہ، واپس، پھر سے کرنا‬</text>
  <text class="body" x="490" y="199" text-anchor="end">‫• مثالیں: ‪rewrite, retell, replay, rebuild, reread‬‬</text>

  <!-- Row 3: Suffix -ful -->
  <rect class="panel-a" x="515" y="225" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="252" text-anchor="end">‫لاحقہ: ‪-ful‬‬</text>
  <text class="small" x="728" y="272" text-anchor="end">‫صفت کی علامت‬</text>
  <rect class="panel" x="40" y="225" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="250" text-anchor="end">‫• معنی: سے بھرا ہوا، کی خصوصیات رکھنے والا‬</text>
  <text class="body" x="490" y="274" text-anchor="end">‫• مثالیں: ‪helpful, playful, careful, colourful, joyful‬‬</text>

  <!-- Row 4: Suffix -er / -or -->
  <rect class="panel-c" x="515" y="300" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="327" text-anchor="end">‫لاحقہ: ‪-er / -or‬‬</text>
  <text class="small" x="728" y="347" text-anchor="end">‫فاعلی اسم کی علامت‬</text>
  <rect class="panel" x="40" y="300" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="325" text-anchor="end">‫• معنی: وہ جو مخصوص کام انجام دے‬</text>
  <text class="body" x="490" y="349" text-anchor="end">‫• مثالیں: ‪teacher, farmer, player, writer, visitor‬‬</text>

  <text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
