<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">قواعد و ترجمہ کے سبق کے چار مراحل</title>
  <desc id="d">خاکہ جس میں قواعد و ترجمہ کے سبق کے چار ترتیب وار مراحل دکھائے گئے ہیں: اصول کی واضح پیشکش، دو لسانی الفاظ یاد کرنا، نمونے کی مثالیں، اور دو طرفہ ترجمے کی مشق۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .body { font-size: 13px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .ah-d { fill: var(--a4); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="390"/>

  <text class="h" x="390" y="34" text-anchor="middle">‫قواعد و ترجمہ کے سبق کے چار مراحل‬</text>
  <text class="muted" x="390" y="61" text-anchor="middle">‫روایتی استنباطی چکر: مجرد اصول سے ترجمے کی مشق تک‬</text>

  <!-- Step 1 -->
  <rect class="panel-a" x="580" y="80" width="160" height="240" rx="8"/>
  <text class="sh" x="660" y="108" text-anchor="middle">‫1. اصول کا بیان‬</text>
  <text class="small" x="660" y="128" text-anchor="middle">‫استنباطی پیشکش‬</text>
  <line class="grid" x1="730" y1="140" x2="590" y2="140"/>
  <text class="body" x="730" y="170" text-anchor="end">‫• استاد اصول سمجھاتا ہے‬</text>
  <text class="body" x="730" y="195" text-anchor="end">‫• تختے پر فارمولا‬</text>
  <text class="body" x="730" y="220" text-anchor="end">‫• ‪L1‬ میں پیشکش‬</text>
  <text class="body" x="730" y="245" text-anchor="end">‫• اصطلاحات یاد کرنا‬</text>
  <text class="small" x="660" y="295" text-anchor="middle">‫مجرد اصول‬</text>

  <!-- Arrow 1 to 2 -->
  <path class="stroke-a" d="M 580 200 L 560 200"/>
  <polygon class="ah-a" points="560,195 552,200 560,205"/>

  <!-- Step 2 -->
  <rect class="panel-b" x="400" y="80" width="150" height="240" rx="8"/>
  <text class="sh" x="475" y="108" text-anchor="middle">‫2. الفاظ کی فہرست‬</text>
  <text class="small" x="475" y="128" text-anchor="middle">‫دو لسانی ذخیرۂ الفاظ‬</text>
  <line class="grid" x1="540" y1="140" x2="410" y2="140"/>
  <text class="body" x="540" y="170" text-anchor="end">‫• الگ تھلگ الفاظ‬</text>
  <text class="body" x="540" y="195" text-anchor="end">‫• ‪L1‬ مترادفات‬</text>
  <text class="body" x="540" y="220" text-anchor="end">‫• تحریری نقل‬</text>
  <text class="body" x="540" y="245" text-anchor="end">‫• رٹا اور تکرار‬</text>
  <text class="small" x="475" y="295" text-anchor="middle">‫سیاق سے کٹا ہوا‬</text>

  <!-- Arrow 2 to 3 -->
  <path class="stroke-b" d="M 400 200 L 380 200"/>
  <polygon class="ah-b" points="380,195 372,200 380,205"/>

  <!-- Step 3 -->
  <rect class="panel-a" x="220" y="80" width="150" height="240" rx="8"/>
  <text class="sh" x="295" y="108" text-anchor="middle">‫3. نمونے کے جملے‬</text>
  <text class="small" x="295" y="128" text-anchor="middle">‫مثالوں کا تجزیہ‬</text>
  <line class="grid" x1="360" y1="140" x2="230" y2="140"/>
  <text class="body" x="360" y="170" text-anchor="end">‫• اصول کا اطلاق‬</text>
  <text class="body" x="360" y="195" text-anchor="end">‫• استاد ترجمہ کرتا ہے‬</text>
  <text class="body" x="360" y="220" text-anchor="end">‫• اجزا کی شناخت‬</text>
  <text class="body" x="360" y="245" text-anchor="end">‫• ساخت کی جانچ‬</text>
  <text class="small" x="295" y="295" text-anchor="middle">‫قواعدی تجزیہ‬</text>

  <!-- Arrow 3 to 4 -->
  <path class="stroke-a" d="M 220 200 L 200 200"/>
  <polygon class="ah-a" points="200,195 192,200 200,205"/>

  <!-- Step 4 -->
  <rect class="panel-c" x="40" y="80" width="150" height="240" rx="8"/>
  <text class="sh" x="115" y="108" text-anchor="middle">‫4. ترجمہ‬</text>
  <text class="small" x="115" y="128" text-anchor="middle">‫تحریری مشق‬</text>
  <line class="grid" x1="180" y1="140" x2="50" y2="140"/>
  <text class="body" x="180" y="170" text-anchor="end">‫• ‪L1‬ سے انگریزی‬</text>
  <text class="body" x="180" y="195" text-anchor="end">‫• انگریزی سے ‪L1‬‬</text>
  <text class="body" x="180" y="220" text-anchor="end">‫• خاموش انفرادی کام‬</text>
  <text class="body" x="180" y="245" text-anchor="end">‫• تحریری رائے‬</text>
  <text class="small" x="115" y="295" text-anchor="middle">‫درستی پر توجہ‬</text>

  <!-- Connecting summary line -->
  <path class="stroke" stroke-dasharray="4 4" d="M 660 320 L 660 345 L 115 345 L 115 320"/>
  <text class="small" x="390" y="362" text-anchor="middle">‫بنیادی نتیجۂ تعلم: پڑھ کر سمجھنا اور قواعدی تجزیہ‬</text>

  <text class="wm" x="768" y="380" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
