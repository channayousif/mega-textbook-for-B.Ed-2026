<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">براہِ راست طریقہ: اصول، مراحل اور جائزہ</title>
  <desc id="d">جدول جس میں پاکستان کے پرائمری اسکولوں کے تناظر میں براہِ راست طریقے کا تجزیہ زبان میں ڈوبنے کے بنیادی اصولوں، مظاہرے کے طریقۂ کار، زبانی روانی کی خوبیوں اور کلاس روم کی عملی پابندیوں کے لحاظ سے کیا گیا ہے۔</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .body { font-size: 13px; fill: var(--ink); }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; }
    .stroke-b { stroke: var(--a2); stroke-width: 2; fill: none; }
    .stroke-c { stroke: var(--a3); stroke-width: 2; fill: none; }
    .stroke-d { stroke: var(--a4); stroke-width: 2; fill: none; }
    .grid { stroke: var(--ink); stroke-width: 1; fill: none; opacity: 0.25; }
    .ah { fill: var(--ink); }
    .ah-a { fill: var(--a1); }
    .ah-b { fill: var(--a2); }
    .ah-c { fill: var(--a3); }
    .ah-d { fill: var(--a4); }
    .wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="400"/>

  <text class="h" x="390" y="34" text-anchor="middle">‫براہِ راست طریقہ: جائزہ اور تجزیہ‬</text>
  <text class="muted" x="390" y="61" text-anchor="middle">‫زبان میں ڈوبنا، استقرائی قواعد اور ترسیلی مظاہرہ‬</text>

  <!-- Row 1: Core Principles -->
  <rect class="panel-a" x="515" y="75" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="102" text-anchor="end">‫بنیادی اصول‬</text>
  <text class="small" x="728" y="122" text-anchor="end">‫براہِ راست ربط‬</text>
  <rect class="panel" x="40" y="75" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="100" text-anchor="end">‫• صرف انگریزی کا استعمال؛ مادری زبان ‪(L1)‬ ممنوع‬</text>
  <text class="body" x="490" y="124" text-anchor="end">‫• معنی براہِ راست اشیا، تصاویر اور حرکات سے جڑا ہوا‬</text>

  <!-- Row 2: Typical Step -->
  <rect class="panel-b" x="515" y="150" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="177" text-anchor="end">‫کلاس روم کا مرحلہ‬</text>
  <text class="small" x="728" y="197" text-anchor="end">‫مظاہرے کا طریقہ‬</text>
  <rect class="panel" x="40" y="150" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="175" text-anchor="end">‫• استاد حقیقی شے دکھا کر زبانی سوال پوچھتا ہے‬</text>
  <text class="body" x="490" y="199" text-anchor="end">‫• طلبہ ترجمے کے بغیر مکمل انگریزی جملوں میں جواب دیتے ہیں‬</text>

  <!-- Row 3: Strengths -->
  <rect class="panel-a" x="515" y="225" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="252" text-anchor="end">‫تدریسی خوبیاں‬</text>
  <text class="small" x="728" y="272" text-anchor="end">‫زبانی ابلاغ‬</text>
  <rect class="panel" x="40" y="225" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="250" text-anchor="end">‫• درست تلفظ اور فی البدیہہ گفتگو کو فروغ دیتا ہے‬</text>
  <text class="body" x="490" y="274" text-anchor="end">‫• پرائمری برسوں ہی سے انگریزی میں سوچنے کی بنیاد ڈالتا ہے‬</text>

  <!-- Row 4: Weaknesses -->
  <rect class="panel-c" x="515" y="300" width="225" height="66" rx="6"/>
  <text class="sh" x="728" y="327" text-anchor="end">‫تدریسی حدود‬</text>
  <text class="small" x="728" y="347" text-anchor="end">‫کلاس روم کی پابندیاں‬</text>
  <rect class="panel" x="40" y="300" width="465" height="66" rx="6"/>
  <text class="body" x="490" y="325" text-anchor="end">‫• مختصر ‪L1‬ وضاحت کے بغیر مجرد الفاظ سمجھانا مشکل‬</text>
  <text class="body" x="490" y="349" text-anchor="end">‫• استاد کی اعلیٰ زبانی روانی اور چھوٹی جماعتوں کا تقاضا‬</text>

  <text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
