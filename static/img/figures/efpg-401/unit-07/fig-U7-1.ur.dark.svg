<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">معروضی سوالات کی چار اقسام</title>
  <desc id="d">جدول جس میں معروضی سوالات کی چار اقسام - کثیر الانتخابی، درست یا غلط، جوڑ ملانا اور خالی جگہ پر کرنا - اور ان کے تحریری اصول بیان کیے گئے ہیں۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 1.5; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 13px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="420"/>

  <text class="h" x="390" y="38" text-anchor="middle">معروضی سوالات کی چار اقسام</text>
  <text class="muted" x="390" y="58" text-anchor="middle">ہر قسم کی ساخت اور اسے مؤثر انداز میں لکھنے کا اصول</text>

  <!-- Table Header -->
  <rect class="panel" x="30" y="75" width="720" height="35" rx="4"/>
  <text class="sh" x="735" y="98" text-anchor="end">سوال کی قسم</text>
  <text class="sh" x="525" y="98" text-anchor="end">اس کی ظاہری شکل</text>
  <text class="sh" x="280" y="98" text-anchor="end">لکھنے کا اصول</text>

  <!-- Row 1: Multiple choice -->
  <rect class="panel-a" x="30" y="118" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="142" text-anchor="end">1. کثیر الانتخابی</text>
  <text class="muted" x="735" y="162" text-anchor="end">بنیادی عبارت مع متبادلات</text>
  <text class="body" x="525" y="142" text-anchor="end">ایک بنیادی عبارت مع چار متبادلات</text>
  <text class="body" x="525" y="162" text-anchor="end">(الف تا د لیبل شدہ)</text>
  <text class="body" x="280" y="142" text-anchor="end">ایک طے شدہ درست جواب؛ تین قرینِ قیاس</text>
  <text class="body" x="280" y="162" text-anchor="end">غلط متبادل؛ متوازی متبادلات</text>

  <!-- Row 2: True/false -->
  <rect class="panel-b" x="30" y="186" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="210" text-anchor="end">2. درست یا غلط</text>
  <text class="muted" x="735" y="230" text-anchor="end">فیصلہ طلب بیان</text>
  <text class="body" x="525" y="210" text-anchor="end">ایک بیان جسے درست یا غلط</text>
  <text class="body" x="525" y="230" text-anchor="end">نشان زد کیا جائے</text>
  <text class="body" x="280" y="210" text-anchor="end">واضح طور پر درست یا غلط؛ "ہمیشہ" اور</text>
  <text class="body" x="280" y="230" text-anchor="end">"کبھی نہیں" سے پرہیز؛ متوازن بیانات</text>

  <!-- Row 3: Matching -->
  <rect class="panel-c" x="30" y="254" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="278" text-anchor="end">3. جوڑ ملانا</text>
  <text class="muted" x="735" y="298" text-anchor="end">ملانے کے لیے دو کالم</text>
  <text class="body" x="525" y="278" text-anchor="end">دو کالم جنہیں لکیروں کے</text>
  <text class="body" x="525" y="298" text-anchor="end">ذریعے ملایا جائے</text>
  <text class="body" x="280" y="278" text-anchor="end">دونوں کالموں میں برابر تعداد؛</text>
  <text class="body" x="280" y="298" text-anchor="end">ہر شے کا صرف ایک ہی جوڑ</text>

  <!-- Row 4: Fill in the blank -->
  <rect class="panel-d" x="30" y="322" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="346" text-anchor="end">4. خالی جگہ پر کرنا</text>
  <text class="muted" x="735" y="366" text-anchor="end">خالی جگہ والا جملہ</text>
  <text class="body" x="525" y="346" text-anchor="end">مکمل کرنے کے لیے ایک جملہ</text>
  <text class="body" x="525" y="366" text-anchor="end">جس میں خالی جگہ ہو</text>
  <text class="body" x="280" y="346" text-anchor="end">ہر خالی جگہ کا ایک طے شدہ جواب؛</text>
  <text class="body" x="280" y="366" text-anchor="end">خالی جگہ جملے کے آغاز میں نہ ہو</text>

  <text class="wm" x="768" y="410" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text>
</svg>