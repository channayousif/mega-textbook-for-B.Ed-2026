<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif">
  <title id="t">معروضی اور انشائی ٹیسٹ کا موازنہ</title>
  <desc id="d">جدول جس میں معروضی اور انشائی ٹیسٹ کا موازنہ کیا گیا ہے کہ وہ کیا جانچتے ہیں، ان کی نمبر دہی کیسے کی جاتی ہے اور ان کی اعتمادیّت کتنی ہے۔</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 13px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="360"/>

  <text class="h" x="390" y="38" text-anchor="middle">معروضی اور انشائی ٹیسٹ کا موازنہ</text>
  <text class="muted" x="390" y="58" text-anchor="middle">دونوں اقسام کیا جانچتی ہیں، ان کی نمبر دہی کیسے ہوتی ہے اور ان کی اعتمادیّت کیسی ہے</text>

  <!-- Table Header -->
  <rect class="panel" x="30" y="75" width="720" height="35" rx="4"/>
  <text class="sh" x="735" y="98" text-anchor="end">پہلو</text>
  <text class="sh" x="525" y="98" text-anchor="end">معروضی ٹیسٹ</text>
  <text class="sh" x="280" y="98" text-anchor="end">انشائی ٹیسٹ</text>

  <!-- Row 1: What it measures -->
  <rect class="panel-a" x="30" y="118" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="142" text-anchor="end">کیا جانچتا ہے</text>
  <text class="muted" x="735" y="162" text-anchor="end">حاصل شدہ تعلم</text>
  <text class="body" x="525" y="142" text-anchor="end">حقائق، ذخیرہ الفاظ، گرامر کے</text>
  <text class="body" x="525" y="162" text-anchor="end">قواعد اور بنیادی فہم</text>
  <text class="body" x="280" y="142" text-anchor="end">تحریر، تقریر، تفہیم اور</text>
  <text class="body" x="280" y="162" text-anchor="end">سوچنے کی صلاحیت</text>

  <!-- Row 2: How it is marked -->
  <rect class="panel-b" x="30" y="186" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="210" text-anchor="end">نمبر دہی کا طریقہ</text>
  <text class="muted" x="735" y="230" text-anchor="end">جانچنے والے کا کام</text>
  <text class="body" x="525" y="210" text-anchor="end">ہر سوال کا ایک طے شدہ جواب؛</text>
  <text class="body" x="525" y="230" text-anchor="end">تیز اور یکساں جانچ</text>
  <text class="body" x="280" y="210" text-anchor="end">معیارِ جانچ کے مطابق تفصیلی جواب</text>
  <text class="body" x="280" y="230" text-anchor="end">کا جائزہ؛ زیادہ وقت طلب</text>

  <!-- Row 3: Reliability -->
  <rect class="panel-c" x="30" y="254" width="720" height="62" rx="4"/>
  <text class="sh" x="735" y="278" text-anchor="end">اعتمادیّت</text>
  <text class="muted" x="735" y="298" text-anchor="end">نمبروں میں یکسانیت</text>
  <text class="body" x="525" y="278" text-anchor="end">زیادہ؛ ہر ممتحن کی طرف سے</text>
  <text class="body" x="525" y="298" text-anchor="end">ایک جیسے نمبر</text>
  <text class="body" x="280" y="278" text-anchor="end">معیارِ جانچ (rubric) کے واضح</text>
  <text class="body" x="280" y="298" text-anchor="end">ہونے پر منحصر ہے</text>

  <text class="wm" x="768" y="350" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text>
</svg>