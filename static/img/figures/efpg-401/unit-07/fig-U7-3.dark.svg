<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Objective and Subjective Tests Compared</title>
  <desc id="d">Table comparing objective and subjective tests on what they measure, how they are marked and how reliable the marking is.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg { fill: var(--bg); }
    .ink { fill: var(--ink); }
    .stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
    .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 1.5; }
    .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 1.5; }
    .h { font-size: 18px; font-weight: 700; fill: var(--ink); }
    .sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body { font-size: 13px; fill: var(--ink); }
    .muted { font-size: 13px; fill: var(--muted); }
    .wm { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="360"/>

  <text class="h" x="390" y="38" text-anchor="middle">Objective and Subjective Tests Compared</text>
  <text class="muted" x="390" y="58" text-anchor="middle">What each type measures, how it is marked and how reliable it is</text>

  <!-- Table Header -->
  <rect class="panel" x="30" y="75" width="720" height="35" rx="4"/>
  <text class="sh" x="45" y="98">Aspect</text>
  <text class="sh" x="220" y="98">Objective-type test</text>
  <text class="sh" x="490" y="98">Subjective-type test</text>

  <!-- Row 1: What it measures -->
  <rect class="panel-a" x="30" y="118" width="720" height="62" rx="4"/>
  <text class="sh" x="45" y="142">What it measures</text>
  <text class="muted" x="45" y="162">The learning</text>
  <text class="body" x="220" y="142">Facts, vocabulary, grammar</text>
  <text class="body" x="220" y="162">rules and simple understanding</text>
  <text class="body" x="490" y="142">Writing, speaking, comprehension</text>
  <text class="body" x="490" y="162">and thinking</text>

  <!-- Row 2: How it is marked -->
  <rect class="panel-b" x="30" y="186" width="720" height="62" rx="4"/>
  <text class="sh" x="45" y="210">How it is marked</text>
  <text class="muted" x="45" y="230">The marker's task</text>
  <text class="body" x="220" y="210">One fixed answer per item;</text>
  <text class="body" x="220" y="230">quick and consistent</text>
  <text class="body" x="490" y="210">Longer answer judged against</text>
  <text class="body" x="490" y="230">a rubric; slower</text>

  <!-- Row 3: Reliability -->
  <rect class="panel-c" x="30" y="254" width="720" height="62" rx="4"/>
  <text class="sh" x="45" y="278">Reliability</text>
  <text class="muted" x="45" y="298">Consistency of marks</text>
  <text class="body" x="220" y="278">High; the same mark for</text>
  <text class="body" x="220" y="298">every marker</text>
  <text class="body" x="490" y="278">Depends on how clear the</text>
  <text class="body" x="490" y="298">rubric is</text>

  <text class="wm" x="768" y="350" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>
