<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک شاگرد کی صلاحیتوں کا خاکہ</title><desc id="d">ایک شاگرد کی صلاحیتوں کا خاکہ چھ شعبوں میں پٹیوں کے طور پر: زبان، عدد، مکانی، معاشرتی، عملی اور جسم، مختلف لمبائی کے ساتھ، اور یہ یاد دہانی کہ ایک واحد درجہ ان میں سے دو کا نمونہ لے کر خود کو پورا کہتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.bar{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="14" y="14" width="752" height="396" rx="8"/><text class="h" x="390" y="46" text-anchor="middle">ایک شاگرد، چھ شعبے: خاکہ، نقطہ نہیں</text><line class="grid" x1="580" y1="70" x2="580" y2="350"/><text class="sh" x="600" y="92" text-anchor="start">زبان</text><rect class="bar" x="100" y="78" width="480" height="22" rx="4"/><text class="sh" x="600" y="134" text-anchor="start">عدد</text><rect class="bar" x="430" y="120" width="150" height="22" rx="4"/><text class="sh" x="600" y="176" text-anchor="start">مکانی</text><rect class="bar" x="140" y="162" width="440" height="22" rx="4"/><text class="sh" x="600" y="218" text-anchor="start">معاشرتی</text><rect class="bar" x="290" y="204" width="290" height="22" rx="4"/><text class="sh" x="600" y="260" text-anchor="start">عملی</text><rect class="bar" x="180" y="246" width="400" height="22" rx="4"/><text class="sh" x="600" y="302" text-anchor="start">جسم</text><rect class="bar" x="360" y="288" width="220" height="22" rx="4"/><text class="small" x="390" y="352" text-anchor="middle">لمبی پٹی = اُس شعبے میں موجودہ سطح زیادہ مضبوط</text><text class="body" x="390" y="386" text-anchor="middle">ایک واحد درجہ ان میں سے دو کا نمونہ لے کر خود کو پورا کہتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
