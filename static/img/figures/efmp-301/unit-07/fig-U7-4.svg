<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of three learners</title><desc id="d">A table of three learners - slow, gifted and disabled - each against how each is recognised, what does not help, and what helps.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M118 14V426M372 14V426M574 14V426M12 74H768M12 172H768M12 270H768M12 368H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="65" y="48" text-anchor="middle">learner</text><text class="h" x="245" y="40" text-anchor="middle">how</text><text class="h" x="245" y="60" text-anchor="middle">recognised</text><text class="h" x="473" y="40" text-anchor="middle">what does</text><text class="h" x="473" y="60" text-anchor="middle">NOT help</text><text class="h" x="671" y="40" text-anchor="middle">what</text><text class="h" x="671" y="60" text-anchor="middle">helps</text><text class="sh" x="65" y="120" text-anchor="middle">slow</text><text class="sh" x="65" y="140" text-anchor="middle">learner</text><text class="body" x="130" y="106">complete but late work;</text><text class="body" x="130" y="126">understanding on the third pass</text><text class="body" x="384" y="106">more of the same worksheet</text><text class="body" x="384" y="126">faster; public comparison</text><text class="body" x="586" y="100">shorter steps, same goal;</text><text class="body" x="586" y="118">time; prior-knowledge checks;</text><text class="body" x="586" y="136">visible progress</text><text class="sh" x="65" y="218" text-anchor="middle">gifted</text><text class="sh" x="65" y="238" text-anchor="middle">learner</text><text class="body" x="130" y="204">quick independent learning;</text><text class="body" x="130" y="224">advanced language; the early</text><text class="body" x="130" y="244">finisher; argues the textbook</text><text class="body" x="384" y="204">more worksheets; withdrawal</text><text class="body" x="384" y="224">of the interesting work</text><text class="body" x="586" y="198">real problems; choice; honest</text><text class="body" x="586" y="216">high expectations; deliberate</text><text class="body" x="586" y="234">group life</text><text class="sh" x="65" y="316" text-anchor="middle">pupil with</text><text class="sh" x="65" y="336" text-anchor="middle">a disability</text><text class="body" x="130" y="302">a specific barrier to</text><text class="body" x="130" y="322">participation</text><text class="body" x="384" y="302">managing the label;</text><text class="body" x="384" y="322">sending the pupil home</text><text class="body" x="586" y="296">removing the specific barrier;</text><text class="body" x="586" y="314">deliberate inclusion in</text><text class="body" x="586" y="332">every activity</text><text class="small" x="24" y="410">The pupil is never the label; the barrier is specific, and the school's job is to remove it.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
