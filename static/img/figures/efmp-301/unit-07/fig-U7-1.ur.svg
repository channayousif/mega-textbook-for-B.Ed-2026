<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">طرزِ تعلم کا دعوی اور ثبوت</title><desc id="d">طرزِ تعلم کے دعوے کا جدول: جو دعوی کیا جاتا ہے، تحقیق نے کیا پایا، اور جو رکھنے لائق ہے: شاگرد مختلف ہیں مگر مطابقت سے فائدہ نہیں، اور کثیر اسلوبی تدریس زیادہ شاگردوں تک پہنچتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="400" rx="8"/><path class="grid" d="M 516 14V414M264 14V414M12 76H768M12 190H768M12 304H768"/><path class="ink" d="M 12 76H768V80H12z"/><text class="h" x="642" y="48" text-anchor="middle">جو دعوی کیا جاتا ہے</text><text class="h" x="390" y="48" text-anchor="middle">تحقیق نے کیا پایا</text><text class="h" x="138" y="40" text-anchor="middle">جو رکھنے</text><text class="h" x="138" y="60" text-anchor="middle">لائق ہے</text><text class="body" x="756" y="112" text-anchor="end">ہر شاگرد کا ایک پکا طرز ہے،</text><text class="body" x="756" y="132" text-anchor="end">بصری، سماعتی یا حرکی</text><text class="body" x="504" y="112" text-anchor="end">طرز اپنی زبانی بتائی</text><text class="body" x="504" y="132" text-anchor="end">پسند ہیں، ناپی ہوئی اقسام نہیں</text><text class="body" x="252" y="112" text-anchor="end">شاگرد مختلف ہیں -</text><text class="body" x="252" y="132" text-anchor="end">یہ بات سچ ہے</text><text class="body" x="756" y="226" text-anchor="end">طرز کے مطابق تدریس سے</text><text class="body" x="756" y="246" text-anchor="end">تعلم بہتر ہو جاتا ہے</text><text class="body" x="504" y="226" text-anchor="end">مطابقت والی تحقیق کم یا</text><text class="body" x="504" y="246" text-anchor="end">کوئی فائدہ نہیں دکھاتی</text><text class="body" x="252" y="226" text-anchor="end">ایک سے زیادہ انداز میں پیش</text><text class="body" x="252" y="246" text-anchor="end">کرنا زیادہ شاگردوں تک پہنچتا ہے</text><text class="body" x="756" y="340" text-anchor="end">طرز یہ بتاتا ہے کہ شاگرد</text><text class="body" x="756" y="360" text-anchor="end">مشکل کیوں محسوس کرتا ہے</text><text class="body" x="504" y="340" text-anchor="end">مشکل عموماً کام، سابقہ علم یا</text><text class="body" x="504" y="360" text-anchor="end">تدریس تک جا کر ملتی ہے</text><text class="body" x="252" y="340" text-anchor="end">شاگرد سے پہلے کام</text><text class="body" x="252" y="360" text-anchor="end">کا تقاضا دیکھیں</text><text class="small" x="756" y="398" text-anchor="end">حقیقی فرق کی غلط وضاحت ہمیشہ شاگرد کو تنگ کر کے ختم ہوتی ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
