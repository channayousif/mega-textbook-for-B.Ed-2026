<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A profile of one pupil's abilities</title><desc id="d">A profile of one pupil's abilities drawn as bars across six domains - language, number, spatial, social, practical and body - of differing lengths, with a caption that a single rank samples two of them and calls itself the whole.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.bar{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="14" y="14" width="752" height="396" rx="8"/><text class="h" x="390" y="46" text-anchor="middle">One pupil, six domains: a profile, not a point</text><line class="grid" x1="200" y1="70" x2="200" y2="350"/><text class="sh" x="180" y="92" text-anchor="end">language</text><rect class="bar" x="200" y="78" width="480" height="22" rx="4"/><text class="sh" x="180" y="134" text-anchor="end">number</text><rect class="bar" x="200" y="120" width="150" height="22" rx="4"/><text class="sh" x="180" y="176" text-anchor="end">spatial</text><rect class="bar" x="200" y="162" width="440" height="22" rx="4"/><text class="sh" x="180" y="218" text-anchor="end">social</text><rect class="bar" x="200" y="204" width="290" height="22" rx="4"/><text class="sh" x="180" y="260" text-anchor="end">practical</text><rect class="bar" x="200" y="246" width="400" height="22" rx="4"/><text class="sh" x="180" y="302" text-anchor="end">body</text><rect class="bar" x="200" y="288" width="220" height="22" rx="4"/><text class="small" x="390" y="352" text-anchor="middle">longer bar = stronger present level in that domain</text><text class="body" x="390" y="386" text-anchor="middle">A single rank samples two of these and calls itself the whole.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
