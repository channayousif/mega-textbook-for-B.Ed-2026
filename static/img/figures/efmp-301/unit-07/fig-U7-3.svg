<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of the inclusive classroom</title><desc id="d">A concept map of the inclusive classroom with four branches - slow learner, gifted learner, pupil with a disability, and every other pupil - each with its need, and dashed arrows noting distinct needs in one room.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke"><path d="M390 210 L390 156"/><path d="M390 260 L390 316"/><path d="M340 235 L200 235"/><path d="M440 235 L580 235"/></g><g class="dash"><path d="M130 120 C220 40 560 40 650 120"/><path d="M130 350 C220 428 560 428 650 350"/></g><text class="small" x="390" y="52" text-anchor="middle">distinct needs, one room</text><text class="small" x="390" y="440" text-anchor="middle">distinct needs, one room</text><ellipse class="ink" cx="390" cy="235" rx="118" ry="48" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">the inclusive</text><text x="390" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">classroom</text><rect class="panel-a" x="30" y="66" width="200" height="90" rx="10"/><text class="sh" x="130" y="92" text-anchor="middle">slow learner</text><text class="body" x="130" y="114" text-anchor="middle">pace, not ceiling; needs time</text><text class="body" x="130" y="134" text-anchor="middle">and shorter steps</text><rect class="panel-b" x="550" y="66" width="200" height="90" rx="10"/><text class="sh" x="650" y="92" text-anchor="middle">gifted learner</text><text class="body" x="650" y="114" text-anchor="middle">unusual level of skill; needs real</text><text class="body" x="650" y="134" text-anchor="middle">challenge, not more of the same</text><rect class="panel-c" x="30" y="316" width="200" height="90" rx="10"/><text class="sh" x="130" y="342" text-anchor="middle">pupil with a disability</text><text class="body" x="130" y="364" text-anchor="middle">a specific barrier; needs the</text><text class="body" x="130" y="384" text-anchor="middle">barrier removed, not exclusion</text><rect class="panel-d" x="550" y="316" width="200" height="90" rx="10"/><text class="sh" x="650" y="342" text-anchor="middle">every other pupil</text><text class="body" x="650" y="364" text-anchor="middle">learns belonging and helpfulness</text><text class="body" x="650" y="384" text-anchor="middle">from the inclusion itself</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
