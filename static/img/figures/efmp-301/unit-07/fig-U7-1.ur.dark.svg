<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">طرزِ تعلم کا دعوی اور شہادت</title><desc id="d">طرزِ تعلم کے دعوے کا جدول: جو دعوی کیا جاتا ہے، تحقیق نے کیا پایا، اور جو رکھنے لائق ہے: شاگرد مختلف ہیں مگر مطابقت سے فائدہ نہیں، اور کثیر اسلوبی تدریس زیادہ شاگردوں تک پہنچتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="400" rx="8"/><path class="grid" d="M 516 14V414M516 14V414M12 76H768M12 190H768M12 304H768"/><path class="ink" d="M 768 76H768V80H12z"/><text class="h" x="642" y="48" text-anchor="middle">جو دعوی کیا جاتا ہے</text><text class="h" x="390" y="48" text-anchor="middle">تحقیق نے کیا پایا</text><text class="h" x="138" y="40" text-anchor="middle">جو رکھنے</text><text class="h" x="138" y="60" text-anchor="middle">لائق ہے</text><text class="body" x="756" y="112">ہر شاگرد کا ایک پکا طرز ہے،</text><text class="body" x="756" y="132">بصری، سماعتی یا حرکی</text><text class="body" x="504" y="112">طرز اپنی زبانی بتائی</text><text class="body" x="504" y="132">پسند ہیں، ناپی ہوئی اقسام نہیں</text><text class="body" x="252" y="112">شاگرد مختلف ہیں -</text><text class="body" x="252" y="132">یہ بات سچ ہے</text><text class="body" x="756" y="226">طرز کے مطابق تدریس سے</text><text class="body" x="756" y="246">تعلم بہتر ہو جاتا ہے</text><text class="body" x="504" y="226">مطابقت والی تحقیق کم یا</text><text class="body" x="504" y="246">کوئی فائدہ نہیں دکھاتی</text><text class="body" x="252" y="226">ایک سے زیادہ انداز میں پیش</text><text class="body" x="252" y="246">کرنا زیادہ شاگردوں تک پہنچتا ہے</text><text class="body" x="756" y="340">طرز یہ بتاتا ہے کہ شاگرد</text><text class="body" x="756" y="360">مشکل کیوں محسوس کرتا ہے</text><text class="body" x="504" y="340">مشکل عموماً کام، سابقہ علم یا</text><text class="body" x="504" y="360">تدریس تک جا کر ملتی ہے</text><text class="body" x="252" y="340">شاگرد سے پہلے کام</text><text class="body" x="252" y="360">کا تقاضا دیکھیں</text><text class="small" x="756" y="398">حقیقی فرق کی غلط وضاحت ہمیشہ شاگرد کو تنگ کر کے ختم ہوتی ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
