<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین متعلموں کی پہچان اور معاونت</title><desc id="d">تین متعلموں کا جدول: کمزور، ذہین اور معذور، ہر ایک کے ساتھ اس کی پہچان، کیا مدد ہرگز نہیں کرتا، اور کیا مدد کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 662 14V426M408 14V426M206 14V426M12 74H768M12 172H768M12 270H768M12 368H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="715" y="48" text-anchor="middle">متعلم</text><text class="h" x="535" y="40" text-anchor="middle">پہچان</text><text class="h" x="535" y="60" text-anchor="middle">کیسی ہوتی ہے</text><text class="h" x="307" y="40" text-anchor="middle">کیا مدد</text><text class="h" x="307" y="60" text-anchor="middle">ہرگز نہیں کرتا</text><text class="h" x="109" y="40" text-anchor="middle">کیا</text><text class="h" x="109" y="60" text-anchor="middle">مدد کرتا ہے</text><text class="sh" x="715" y="120" text-anchor="middle">کمزور</text><text class="sh" x="715" y="140" text-anchor="middle">متعلم</text><text class="body" x="650" y="106" text-anchor="end">مکمل مگر دیر سے آنے والا کام؛</text><text class="body" x="650" y="126" text-anchor="end">سمجھ تیسرے چکر میں آتی ہے</text><text class="body" x="396" y="106" text-anchor="end">وہی ورک شیٹ تیز تر؛</text><text class="body" x="396" y="126" text-anchor="end">سب کے سامنے موازنہ</text><text class="body" x="194" y="100" text-anchor="end">چھوٹے مرحلے، وہی منزل؛ وقت؛</text><text class="body" x="194" y="118" text-anchor="end">سابقہ علم کی جانچ؛</text><text class="body" x="194" y="136" text-anchor="end">نظر آنے والی پیش رفت</text><text class="sh" x="715" y="218" text-anchor="middle">ذہین</text><text class="sh" x="715" y="238" text-anchor="middle">متعلم</text><text class="body" x="650" y="204" text-anchor="end">تیز خود مختار تعلم؛</text><text class="body" x="650" y="224" text-anchor="end">ترقی یافتہ زبان؛ جلدی مکمل</text><text class="body" x="650" y="244" text-anchor="end">کرنے والا؛ کتاب سے بحث کرتا ہے</text><text class="body" x="396" y="204" text-anchor="end">مزید ورک شیٹ؛ دلچسپ کام</text><text class="body" x="396" y="224" text-anchor="end">واپس لینا</text><text class="body" x="194" y="198" text-anchor="end">حقیقی مسائل؛ انتخاب؛ سچی</text><text class="body" x="194" y="216" text-anchor="end">امیدیں؛ سوچی سمجھی</text><text class="body" x="194" y="234" text-anchor="end">گروپ زندگی</text><text class="sh" x="715" y="316" text-anchor="middle">معذور</text><text class="sh" x="715" y="336" text-anchor="middle">شاگرد</text><text class="body" x="650" y="302" text-anchor="end">شراکت میں</text><text class="body" x="650" y="322" text-anchor="end">مخصوص رکاوٹ</text><text class="body" x="396" y="302" text-anchor="end">لیبل سنبھالنا؛</text><text class="body" x="396" y="322" text-anchor="end">شاگرد کو گھر بھیج دینا</text><text class="body" x="194" y="296" text-anchor="end">مخصوص رکاوٹ دور کرنا؛</text><text class="body" x="194" y="314" text-anchor="end">ہر سرگرمی میں</text><text class="body" x="194" y="332" text-anchor="end">سوچی سمجھی شمولیت</text><text class="small" x="756" y="410" text-anchor="end">شاگرد کبھی لیبل نہیں؛ رکاوٹ مخصوص ہوتی ہے، اور اسکول کا کام اسے دور کرنا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
