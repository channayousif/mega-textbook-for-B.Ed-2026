<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the learning-styles claim</title><desc id="d">A table of the learning-styles claim against what the research found and what is worth keeping: pupils differ, but matching to a diagnosed style shows little gain, and multimodal teaching reaches more pupils.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="400" rx="8"/><path class="grid" d="M264 14V414M516 14V414M12 76H768M12 190H768M12 304H768"/><path class="ink" d="M12 76H768V80H12z"/><text class="h" x="138" y="48" text-anchor="middle">what is claimed</text><text class="h" x="390" y="48" text-anchor="middle">what the research found</text><text class="h" x="642" y="40" text-anchor="middle">what is worth</text><text class="h" x="642" y="60" text-anchor="middle">keeping</text><text class="body" x="24" y="112">each pupil has a fixed style,</text><text class="body" x="24" y="132">visual, auditory or kinaesthetic</text><text class="body" x="276" y="112">styles are self-reported</text><text class="body" x="276" y="132">preferences, not measured types</text><text class="body" x="528" y="112">pupils differ -</text><text class="body" x="528" y="132">that part is true</text><text class="body" x="24" y="226">teaching matched to the style</text><text class="body" x="24" y="246">improves learning</text><text class="body" x="276" y="226">matching studies show little</text><text class="body" x="276" y="246">or no gain</text><text class="body" x="528" y="226">presenting ideas in more than</text><text class="body" x="528" y="246">one mode reaches more pupils</text><text class="body" x="24" y="340">the style explains why</text><text class="body" x="24" y="360">a pupil struggles</text><text class="body" x="276" y="340">struggle usually traces to the task,</text><text class="body" x="276" y="360">the prior knowledge or the teaching</text><text class="body" x="528" y="340">look at the demand</text><text class="body" x="528" y="360">before the pupil</text><text class="small" x="24" y="398">A wrong explanation of a real difference always ends by narrowing the pupil.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
