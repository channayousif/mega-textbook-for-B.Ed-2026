<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">شمولیتی جماعت کا تصوری نقشہ</title><desc id="d">شمولیتی جماعت کا تصوری نقشہ چار شاخوں کے ساتھ: کمزور متعلم، ذہین متعلم، معذور شاگرد اور باقی سب شاگرد، ہر ایک کی ضرورت، اور باریک تیروں پر لکھا کہ الگ ضرورتیں ایک کمرے میں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke"><path d="M 390 210L 390 156"/><path d="M 390 260L 390 316"/><path d="M 440 235L 580 235"/><path d="M 340 235L 200 235"/></g><g class="dash"><path d="M 650 120C 560 40 220 40 130 120"/><path d="M 650 350C 560 428 220 428 130 350"/></g><text class="small" x="390" y="52" text-anchor="middle">الگ ضرورتیں، ایک کمرہ</text><text class="small" x="390" y="440" text-anchor="middle">الگ ضرورتیں، ایک کمرہ</text><ellipse class="ink" cx="390" cy="235" rx="118" ry="48" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">شمولیتی</text><text x="390" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">جماعت</text><rect class="panel-a" x="550" y="66" width="200" height="90" rx="10"/><text class="sh" x="650" y="92" text-anchor="middle">کمزور متعلم</text><text class="body" x="650" y="114" text-anchor="middle">رفتار، حد نہیں؛ وقت اور</text><text class="body" x="650" y="134" text-anchor="middle">چھوٹے مرحلے چاہئے</text><rect class="panel-b" x="30" y="66" width="200" height="90" rx="10"/><text class="sh" x="130" y="92" text-anchor="middle">ذہین متعلم</text><text class="body" x="130" y="114" text-anchor="middle">غیر معمولی مہارت؛ حقیقی چیلنج</text><text class="body" x="130" y="134" text-anchor="middle">چاہئے، وہی زیادہ نہیں</text><rect class="panel-c" x="550" y="316" width="200" height="90" rx="10"/><text class="sh" x="650" y="342" text-anchor="middle">معذور شاگرد</text><text class="body" x="650" y="364" text-anchor="middle">ایک مخصوص رکاوٹ؛ رکاوٹ</text><text class="body" x="650" y="384" text-anchor="middle">دور کرنی چاہئے، شاگرد کو نہیں</text><rect class="panel-d" x="30" y="316" width="200" height="90" rx="10"/><text class="sh" x="130" y="342" text-anchor="middle">باقی سب شاگرد</text><text class="body" x="130" y="364" text-anchor="middle">شمولیت سے تعلق اور</text><text class="body" x="130" y="384" text-anchor="middle">مددگاری خود سیکھتے ہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
