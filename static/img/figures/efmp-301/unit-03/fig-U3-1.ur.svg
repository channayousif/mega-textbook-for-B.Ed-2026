<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کلاسیکی شرطندگی کا دو پینل خاکہ</title><desc id="d">کلاسیکی شرطندگی کا دو پینل خاکہ: شرطندگی سے پہلے گھنٹی کوئی ردعمل نہیں پیدا کرتی جبکہ کھانا لعاب پیدا کرتا ہے؛ شرطندگی کے بعد گھنٹی اکیلی لعاب پیدا کرتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect id="region-before" class="panel" x="20" y="20" width="740" height="200" rx="12"/><rect id="region-after" class="panel" x="20" y="240" width="740" height="240" rx="12"/></g><g id="layer-edges"><line id="edge-food-salivation" class="stroke" x1="220" y1="140" x2="160" y2="140" marker-end="url(#arrow)"/><line id="edge-bell-salivation" class="stroke" x1="560" y1="360" x2="500" y2="360" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-bell-before"><rect class="frame" x="560" y="100" width="180" height="80" rx="8"/><text class="sh" x="650" y="134" text-anchor="middle">‏گھنٹی‏</text><text class="small" x="650" y="160" text-anchor="middle">‏بے جان محرک‏</text></g><g id="node-no-response"><rect class="dashed" x="380" y="100" width="140" height="80" rx="8"/><path class="stroke" d="M460 112 L440 132 M440 112 L460 132"/><text class="sh" x="450" y="162" text-anchor="middle">‏کوئی ردعمل نہیں‏</text></g><g id="node-food"><rect class="frame" x="220" y="100" width="120" height="80" rx="8"/><text class="sh" x="280" y="146" text-anchor="middle">‏کھانا‏</text></g><g id="node-salivation-before"><rect class="frame" x="40" y="100" width="120" height="80" rx="8"/><text class="sh" x="100" y="146" text-anchor="middle">‏لعاب‏</text></g><g id="node-bell-after"><rect class="frame" x="560" y="320" width="180" height="80" rx="8"/><text class="sh" x="650" y="366" text-anchor="middle">‏گھنٹی‏</text></g><g id="node-salivation-after"><rect class="frame" x="360" y="320" width="140" height="80" rx="8"/><text class="sh" x="430" y="366" text-anchor="middle">‏لعاب‏</text></g><g id="node-key"><rect class="frame" x="40" y="280" width="280" height="180" rx="8"/><text class="body" x="304" y="312" text-anchor="end">‏گھنٹی: بے جان محرک‏</text><text class="body" x="304" y="334" text-anchor="end">‏شرطی محرک بن جاتا ہے‏</text><text class="body" x="304" y="372" text-anchor="end">‏کھانا: غیر شرطی محرک‏</text><text class="body" x="304" y="410" text-anchor="end">‏لعاب: ردعمل اب‏</text><text class="body" x="304" y="432" text-anchor="end">‏گھنٹی سے چلتا ہے‏</text></g></g><g id="layer-labels"><text class="h" x="740" y="52" text-anchor="end">‏شرطندگی سے پہلے‏</text><text class="h" x="740" y="272" text-anchor="end">‏شرطندگی کے بعد‏</text><text aria-hidden="true" class="wm" x="12" y="510" text-anchor="start">textbook.com.pk</text></g></svg>
