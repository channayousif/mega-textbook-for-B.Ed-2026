<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map with schema at the centre, assimilation fitting new experience into the schema and accommodation changing the schema</title><desc id="d">A concept map with schema at the centre, assimilation fitting new experience into the schema and accommodation changing the schema, above Piaget's framing, and below Bruner's three modes of representation - enactive, iconic, symbolic - in teaching order.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel" x="214" y="18" width="352" height="45" rx="9"/><text class="h" x="390" y="47" text-anchor="middle">Piaget: learning as reorganising thinking</text><path class="stroke" d="M390 63 L390 127" stroke-dasharray="6 5"/><rect class="panel-a" x="22" y="94" width="249" height="151" rx="12"/><text class="h" x="39" y="122">assimilation</text><text class="body" x="39" y="148">new experience fitted into</text><text class="body" x="39" y="168">the existing schema</text><text class="body" x="39" y="195">child calls every four-legged</text><text class="body" x="39" y="213">animal a cat, meets a dog</text><text class="body" x="39" y="231">and files it under cat</text><rect class="panel-b" x="509" y="94" width="249" height="151" rx="12"/><text class="h" x="526" y="122">accommodation</text><text class="body" x="526" y="148">the schema changes to fit</text><text class="body" x="526" y="168">the new experience</text><text class="body" x="526" y="195">child separates dog from cat</text><text class="body" x="526" y="213">and rebuilds the category</text><ellipse class="panel-a" cx="390" cy="174" rx="89" ry="47"/><text class="h" x="390" y="180" text-anchor="middle">schema</text><path class="stroke" d="M302 169 C289 147 281 145 271 145" marker-end="url(#arrow)"/><path class="stroke" d="M478 169 C491 147 499 145 509 145" marker-end="url(#arrow)"/><path class="stroke" d="M390 221 L390 300" stroke-dasharray="6 5"/><text class="sh" x="390" y="318" text-anchor="middle">the order teaching should follow</text><rect class="panel-c" x="22" y="333" width="218" height="67" rx="9"/><text class="sh" x="131" y="361" text-anchor="middle">Bruner: enactive</text><text class="body" x="131" y="383" text-anchor="middle">(doing it)</text><rect class="panel-c" x="281" y="333" width="218" height="67" rx="9"/><text class="sh" x="390" y="361" text-anchor="middle">Bruner: iconic</text><text class="body" x="390" y="383" text-anchor="middle">(seeing it)</text><rect class="panel-c" x="540" y="333" width="218" height="67" rx="9"/><text class="sh" x="649" y="361" text-anchor="middle">Bruner: symbolic</text><text class="body" x="649" y="383" text-anchor="middle">(the sign for it)</text><path class="stroke" d="M240 367 L281 367" marker-end="url(#arrow)"/><path class="stroke" d="M499 367 L540 367" marker-end="url(#arrow)"/><text class="small" x="390" y="421" text-anchor="middle">doing, then seeing, then using signs</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
