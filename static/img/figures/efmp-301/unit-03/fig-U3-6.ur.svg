<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بینڈورا کے چار مشاہداتی تعلم قدموں کا فلو چارٹ</title><desc id="d">بینڈورا کے مشاہداتی تعلم کے چار قدموں کا فلو چارٹ: توجہ، حفظ، دہرانا اور حوصلہ: ہر ایک کی جماعتی مثال کے ساتھ، اور ایک نوٹ کہ چاروں کا موجود ہونا ضروری ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.ah{fill:var(--a1)}text{font-size:11.5px;fill:var(--ink)}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780.0 0.0 L 770.0 5.0 L 780.0 10.0 z" class="ah"/></marker></defs><rect class="panel-a" x="594.0" y="34" width="168" height="116" rx="8"/><rect class="panel-a" x="402.0" y="34" width="168" height="116" rx="8"/><rect class="panel-a" x="210.0" y="34" width="168" height="116" rx="8"/><rect class="panel-a" x="18.0" y="34" width="168" height="116" rx="8"/><line class="stroke-a" x1="593.0" y1="92" x2="572.0" y2="92" marker-end="url(#arrow)"/><line class="stroke-a" x1="401.0" y1="92" x2="380.0" y2="92" marker-end="url(#arrow)"/><line class="stroke-a" x1="209.0" y1="92" x2="188.0" y2="92" marker-end="url(#arrow)"/><text class="h ink" x="748.0" y="66" text-anchor="end">۱۔ توجہ:</text><text class="body" x="748.0" y="91" text-anchor="end">شاگرد نمونہ</text><text class="body" x="748.0" y="112" text-anchor="end">نوٹ کرتا ہے</text><text class="h ink" x="556.0" y="66" text-anchor="end">۲۔ حفظ:</text><text class="body" x="556.0" y="91" text-anchor="end">شاگرد دیکھی ہوئی</text><text class="body" x="556.0" y="112" text-anchor="end">چیز یاد رکھتا ہے</text><text class="h ink" x="364.0" y="66" text-anchor="end">۳۔ دہرانا:</text><text class="body" x="364.0" y="91" text-anchor="end">شاگرد رویہ</text><text class="body" x="364.0" y="112" text-anchor="end">کر سکتا ہے</text><text class="h ink" x="172.0" y="66" text-anchor="end">۴۔ حوصلہ:</text><text class="body" x="172.0" y="91" text-anchor="end">نتیجہ اسے کرنے</text><text class="body" x="172.0" y="112" text-anchor="end">کے قابل بناتا ہے</text><rect class="panel" x="594.0" y="180" width="168" height="166" rx="8"/><rect class="panel" x="402.0" y="180" width="168" height="166" rx="8"/><rect class="panel" x="210.0" y="180" width="168" height="166" rx="8"/><rect class="panel" x="18.0" y="180" width="168" height="166" rx="8"/><line class="stroke" x1="748.0" y1="215" x2="608.0" y2="215"/><line class="stroke" x1="556.0" y1="215" x2="416.0" y2="215"/><line class="stroke" x1="364.0" y1="215" x2="224.0" y2="215"/><line class="stroke" x1="172.0" y1="215" x2="32.0" y2="215"/><line class="grid" x1="762.0" y1="363" x2="18.0" y2="363"/><text class="sh" x="748.0" y="204" text-anchor="end">جماعتی مثال</text><text class="small" x="748.0" y="244" text-anchor="end">شاگرد دیکھتا ہے</text><text class="small" x="748.0" y="266" text-anchor="end">استاد پہلے غلط جواب کے</text><text class="small" x="748.0" y="288" text-anchor="end">ساتھ کیسے پیش آتا ہے</text><text class="sh" x="556.0" y="204" text-anchor="end">جماعتی مثال</text><text class="small" x="556.0" y="244" text-anchor="end">یاد رکھتا ہے کہ غلطی</text><text class="small" x="556.0" y="266" text-anchor="end">پر کام ہوا،</text><text class="small" x="556.0" y="288" text-anchor="end">مذاق نہیں اڑایا</text><text class="sh" x="364.0" y="204" text-anchor="end">جماعتی مثال</text><text class="small" x="364.0" y="244" text-anchor="end">غلط جواب بغیر</text><text class="small" x="364.0" y="266" text-anchor="end">چھپائے بلند</text><text class="small" x="364.0" y="288" text-anchor="end">آواز سے دیتا ہے</text><text class="sh" x="172.0" y="204" text-anchor="end">جماعتی مثال</text><text class="small" x="172.0" y="244" text-anchor="end">دیکھتا ہے غلط جواب</text><text class="small" x="172.0" y="266" text-anchor="end">مدد لاتا ہے،</text><text class="small" x="172.0" y="288" text-anchor="end">شرم نہیں</text><rect class="panel-a" x="64.0" y="385" width="652" height="42" rx="8"/><text class="sh" x="696.0" y="411" text-anchor="end">نوٹ:</text><text class="body" x="650.0" y="411" text-anchor="end">چاروں کا ہونا ضروری ہے؛ غائب قدم غائب سبق ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
