<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the behaviourist and cognitive views of learning</title><desc id="d">A table comparing the behaviourist and cognitive views of learning on what learning is, what the teacher arranges, what counts as evidence, and a classroom instance of each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><rect id="region-header" class="head" x="21" y="21" width="738" height="59"/><rect id="region-row-labels" class="band" x="21" y="80" width="179" height="359"/><g id="region-grid"><line class="grid" x1="200" y1="20" x2="200" y2="440"/><line class="grid" x1="480" y1="20" x2="480" y2="440"/><line class="rule" x1="20" y1="80" x2="760" y2="80"/><line class="grid" x1="20" y1="170" x2="760" y2="170"/><line class="grid" x1="20" y1="260" x2="760" y2="260"/><line class="grid" x1="20" y1="350" x2="760" y2="350"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="55">the view</text><text class="h" x="212" y="55">behaviourist</text><text class="h" x="492" y="55">cognitive</text></g><g id="node-row-1"><text class="sh" x="32" y="130">what learning is</text><text class="body" x="212" y="120">a change in observable</text><text class="body" x="212" y="140">behaviour</text><text class="body" x="492" y="120">a change in thinking</text><text class="body" x="492" y="140">and understanding</text></g><g id="node-row-2"><text class="sh" x="32" y="210">what the teacher</text><text class="sh" x="32" y="230">arranges</text><text class="body" x="212" y="210">consequences that</text><text class="body" x="212" y="230">follow behaviour</text><text class="body" x="492" y="210">experiences that meet</text><text class="body" x="492" y="230">and rebuild schemas</text></g><g id="node-row-3"><text class="sh" x="32" y="300">what counts as</text><text class="sh" x="32" y="320">evidence</text><text class="body" x="212" y="300">what the pupil can do,</text><text class="body" x="212" y="320">seen from outside</text><text class="body" x="492" y="290">what the pupil can explain,</text><text class="body" x="492" y="310">transfer and use in a new</text><text class="body" x="492" y="330">situation</text></g><g id="node-row-4"><text class="sh" x="32" y="390">a classroom</text><text class="sh" x="32" y="410">instance</text><text class="body" x="212" y="390">Rashid's letter-perfect</text><text class="body" x="212" y="410">recitation</text><text class="body" x="492" y="380">Sana's self-corrected</text><text class="body" x="492" y="400">recitation hanging</text><text class="body" x="492" y="420">on a story</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="470" text-anchor="end">textbook.com.pk</text></g></svg>
