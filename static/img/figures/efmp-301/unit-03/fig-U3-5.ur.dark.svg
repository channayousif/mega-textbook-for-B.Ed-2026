<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">طرزِ عمل پسند اور ادراکی نظریوں کا جدول</title><desc id="d">تعلم کے طرزِ عمل پسند اور ادراکی نظریوں کا موازنہ کرنے والا جدول: تعلم کیا ہے، استاد کیا ترتیب دیتا ہے، ثبوت کیا شمار ہوتا ہے، اور ہر ایک کی ایک جماعتی مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:11.5px;fill:var(--ink)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><rect class="stroke" x="24.0" y="22" width="732" height="388" rx="8"/><rect class="panel" x="588.0" y="22" width="168" height="48" rx="7"/><rect class="panel-a" x="320.0" y="22" width="268" height="48" rx="7"/><rect class="panel-b" x="24.0" y="22" width="296" height="48" rx="7"/><line class="grid" x1="588.0" y1="70" x2="588.0" y2="410"/><line class="grid" x1="320.0" y1="70" x2="320.0" y2="410"/><line class="grid" x1="756.0" y1="155" x2="24.0" y2="155"/><line class="grid" x1="756.0" y1="240" x2="24.0" y2="240"/><line class="grid" x1="756.0" y1="325" x2="24.0" y2="325"/><line class="stroke-a" x1="568.0" y1="61" x2="340.0" y2="61"/><line class="stroke-a" x1="300.0" y1="61" x2="44.0" y2="61" stroke="var(--a2)"/><text class="h" x="672.0" y="52" text-anchor="middle">نظریہ</text><text class="h" x="454.0" y="52" text-anchor="middle">طرزِ عمل پسند</text><text class="h" x="172.0" y="52" text-anchor="middle">ادراکی</text><text class="sh" x="672.0" y="117" text-anchor="middle">تعلم کیا ہے</text><text class="body" x="454.0" y="109" text-anchor="middle">مشاہدے جانے والے<tspan x="454" dy="17">رویے میں تبدیلی</tspan></text><text class="body" x="172.0" y="109" text-anchor="middle">سوچ اور سمجھ<tspan x="172" dy="17">میں تبدیلی</tspan></text><text class="sh" x="672.0" y="185" text-anchor="middle">استاد کیا<tspan x="672" dy="17">ترتیب دیتا ہے</tspan></text><text class="body" x="454.0" y="194" text-anchor="middle">روے کے پیچھے آنے<tspan x="454" dy="17">والے نتائج</tspan></text><text class="body" x="172.0" y="194" text-anchor="middle">تجربے جو خاکوں سے ملتے<tspan x="172" dy="17">اور انہیں دوبارہ بناتے ہیں</tspan></text><text class="sh" x="672.0" y="270" text-anchor="middle">ثبوت کیا<tspan x="672" dy="17">شمار ہوتا ہے</tspan></text><text class="body" x="454.0" y="279" text-anchor="middle">شاگرد کیا کر سکتا ہے،<tspan x="454" dy="17">باہر سے دیکھا گیا</tspan></text><text class="body" x="172.0" y="270" text-anchor="middle">شاگرد کیا بیان کر سکتا ہے،<tspan x="172" dy="17">نئی صورت میں منتقل</tspan><tspan x="172" dy="17">اور استعمال کر سکتا ہے</tspan></text><text class="sh" x="672.0" y="355" text-anchor="middle">جماعتی مثال</text><text class="body" x="454.0" y="364" text-anchor="middle">راشد کی بغیر غلطی<tspan x="454" dy="17">والی مکمل تلاوت</tspan></text><text class="body" x="172.0" y="355" text-anchor="middle">ثنا کی خود درست کی ہوئی<tspan x="172" dy="17">تلاوت جو ایک کہانی</tspan><tspan x="172" dy="17">پر ٹکی ہوئی ہے</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
