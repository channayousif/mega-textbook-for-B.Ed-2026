<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">روے اور اس کے نتیجے کا فلو چارٹ</title><desc id="d">روے اور اس کے نتیجے کا فلو چارٹ، چار حصوں میں تقسیم: مثبت اور منفی تقویت جو رویے کو زیادہ کرتے ہیں، اور مثبت اور منفی سزا جو کم کرتے ہیں، ہر ایک کی جماعتی مثال کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{font-size:11.5px;fill:var(--ink)}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780.0 0.0 L 770.0 5.0 L 780.0 10.0 z" class="ah"/></marker></defs><rect class="panel" x="282.0" y="14" width="216" height="35" rx="17"/><text class="h" x="390.0" y="37" text-anchor="middle">ایک رویہ ہوتا ہے</text><line class="stroke" x1="390.0" y1="50" x2="390.0" y2="65" marker-end="url(#arrow)"/><polygon class="panel" points="390,61 483,92 390,123 297,92"/><text class="h" x="390.0" y="97" text-anchor="middle">اس کے بعد کیا آتا ہے؟</text><path class="stroke" d="M 438.0 108.0 L 582.0 150.0" marker-end="url(#arrow)"/><path class="stroke" d="M 342.0 108.0 L 198.0 150.0" marker-end="url