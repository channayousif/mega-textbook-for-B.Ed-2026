<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of Bandura's four observational-learning steps</title><desc id="d">A flowchart of Bandura's four observational-learning steps - attention, retention, reproduction and motivation - each with a classroom instance, and a note distinguishing acquisition from performance.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-attention-attention-instance" class="link" x1="90" y1="140" x2="90" y2="180"/><line id="edge-attention-retention" class="stroke" x1="170" y1="80" x2="210" y2="80" marker-end="url(#arrow)"/><line id="edge-retention-retention-instance" class="link" x1="290" y1="140" x2="290" y2="180"/><line id="edge-retention-reproduction" class="stroke" x1="370" y1="80" x2="410" y2="80" marker-end="url(#arrow)"/><line id="edge-reproduction-reproduction-instance" class="link" x1="490" y1="140" x2="490" y2="180"/><line id="edge-reproduction-motivation" class="stroke" x1="570" y1="80" x2="610" y2="80" marker-end="url(#arrow)"/><line id="edge-motivation-motivation-instance" class="link" x1="690" y1="140" x2="690" y2="180"/></g><g id="layer-nodes"><g id="node-attention"><rect class="panel-a" x="10" y="20" width="160" height="120" rx="8"/><text class="sh" x="90" y="48" text-anchor="middle">1. attention:</text><text class="body" x="90" y="74" text-anchor="middle">the pupil notices</text><text class="body" x="90" y="94" text-anchor="middle">the model</text></g><g id="node-attention-instance"><rect class="frame" x="10" y="180" width="160" height="140" rx="8"/><text class="ish" x="90" y="206" text-anchor="middle">classroom instance</text><text class="small" x="90" y="234" text-anchor="middle">the pupil watches</text><text class="small" x="90" y="254" text-anchor="middle">how the teacher</text><text class="small" x="90" y="274" text-anchor="middle">treats the first</text><text class="small" x="90" y="294" text-anchor="middle">wrong answer</text></g><g id="node-retention"><rect class="panel-a" x="210" y="20" width="160" height="120" rx="8"/><text class="sh" x="290" y="48" text-anchor="middle">2. retention:</text><text class="body" x="290" y="74" text-anchor="middle">the pupil</text><text class="body" x="290" y="94" text-anchor="middle">remembers what</text><text class="body" x="290" y="114" text-anchor="middle">was seen</text></g><g id="node-retention-instance"><rect class="frame" x="210" y="180" width="160" height="140" rx="8"/><text class="ish" x="290" y="206" text-anchor="middle">classroom instance</text><text class="small" x="290" y="234" text-anchor="middle">remembers that</text><text class="small" x="290" y="254" text-anchor="middle">the error was</text><text class="small" x="290" y="274" text-anchor="middle">worked through,</text><text class="small" x="290" y="294" text-anchor="middle">not mocked</text></g><g id="node-reproduction"><rect class="panel-a" x="410" y="20" width="160" height="120" rx="8"/><text class="sh" x="490" y="48" text-anchor="middle">3. reproduction:</text><text class="body" x="490" y="74" text-anchor="middle">the pupil can do</text><text class="body" x="490" y="94" text-anchor="middle">the behaviour</text></g><g id="node-reproduction-instance"><rect class="frame" x="410" y="180" width="160" height="140" rx="8"/><text class="ish" x="490" y="206" text-anchor="middle">classroom instance</text><text class="small" x="490" y="234" text-anchor="middle">answers wrongly</text><text class="small" x="490" y="254" text-anchor="middle">out loud without</text><text class="small" x="490" y="274" text-anchor="middle">hiding</text></g><g id="node-motivation"><rect class="panel-a" x="610" y="20" width="160" height="120" rx="8"/><text class="sh" x="690" y="48" text-anchor="middle">4. motivation:</text><text class="body" x="690" y="74" text-anchor="middle">the outcome makes</text><text class="body" x="690" y="94" text-anchor="middle">it worth doing</text></g><g id="node-motivation-instance"><rect class="frame" x="610" y="180" width="160" height="140" rx="8"/><text class="ish" x="690" y="206" text-anchor="middle">classroom instance</text><text class="small" x="690" y="234" text-anchor="middle">sees the wrong</text><text class="small" x="690" y="254" text-anchor="middle">answer lead to</text><text class="small" x="690" y="274" text-anchor="middle">help, not shame</text></g><g id="node-note"><rect class="panel" x="20" y="360" width="740" height="60" rx="8"/><text class="sh" x="40" y="396">Note:</text><text class="body" x="90" y="396">Attention + retention: learning; reproduction + motivation: performance</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="450" text-anchor="end">textbook.com.pk</text></g></svg>
