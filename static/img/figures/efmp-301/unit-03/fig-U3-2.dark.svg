<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of a behaviour and its consequence, branching into four quadrants</title><desc id="d">A flowchart of a behaviour and its consequence, branching into four quadrants: positive and negative reinforcement, which make behaviour more frequent, and positive and negative punishment, which make it less frequent, each with a classroom example.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><g id="layer-regions"><rect id="region-consequences" class="band" x="20" y="200" width="740" height="340" rx="12"/></g><g id="layer-edges"><line id="edge-behaviour-follows" class="stroke" x1="390" y1="60" x2="390" y2="80" marker-end="url(#arrow)"/><line id="edge-follows-consequences" class="stroke" x1="390" y1="160" x2="390" y2="200" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-behaviour"><rect class="frame" x="260" y="20" width="260" height="40" rx="20"/><text class="h" x="390" y="46" text-anchor="middle">a behaviour happens</text></g><g id="node-follows"><polygon class="frame" points="390,80 520,120 390,160 260,120"/><text class="h" x="390" y="126" text-anchor="middle">what follows it?</text></g><g id="node-positive-reinforcement"><rect class="panel-a" x="40" y="220" width="340" height="140" rx="8"/><text class="small" x="56" y="248">ADDED: something the pupil wants</text><text class="h" x="56" y="276">positive reinforcement</text><text class="sh" x="56" y="302">MORE frequent</text><text class="small" x="56" y="328">Example: praise for a good answer</text></g><g id="node-negative-reinforcement"><rect class="panel-a" x="400" y="220" width="340" height="140" rx="8"/><text class="small" x="416" y="248">REMOVED: something the pupil dislikes</text><text class="h" x="416" y="276">negative reinforcement</text><text class="sh" x="416" y="302">MORE frequent</text><text class="small" x="416" y="328">Example: seatwork finished</text><text class="small" x="416" y="348">and the scolding stops</text></g><g id="node-positive-punishment"><rect class="panel-c" x="40" y="380" width="340" height="140" rx="8"/><text class="small" x="56" y="408">ADDED: something the pupil dislikes</text><text class="h" x="56" y="436">positive punishment</text><text class="sh" x="56" y="462">LESS frequent</text><text class="small" x="56" y="488">Example: scolding for calling out</text></g><g id="node-negative-punishment"><rect class="panel-c" x="400" y="380" width="340" height="140" rx="8"/><text class="small" x="416" y="408">REMOVED: something the pupil wants</text><text class="h" x="416" y="436">negative punishment</text><text class="sh" x="416" y="462">LESS frequent</text><text class="small" x="416" y="488">Example: a star removed for talking</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="570" text-anchor="end">textbook.com.pk</text></g></svg>
