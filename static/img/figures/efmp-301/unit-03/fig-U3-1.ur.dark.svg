<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کلاسیکی شرطندگی کا دو پینل خاکہ</title><desc id="d">کلاسیکی شرطندگی کا دو پینل خاکہ: شرطندگی سے پہلے گھنٹی کوئی ردعمل نہیں پیدا کرتی جبکہ کھانا رال پیدا کرتا ہے؛ شرطندگی کے بعد گھنٹی اکیلی رال پیدا کرتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780.0 0.0 L 770.0 5.0 L 780.0 10.0 z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780.0 0.0 L 770.0 5.0 L 780.0 10.0 z" class="ah-a"/></marker></defs><rect class="bg" x="0.0" y="0" width="780" height="470"/><rect class="panel" x="18.0" y="14" width="744" height="202" rx="10"/><text class="h" x="738.0" y="45" text-anchor="end">شرطندگی سے پہلے</text><line class="grid" x1="738.0" y1="59" x2="42.0" y2="59"/><g aria-label="bell, neutral stimulus"><path class="stroke" d="M 672.0 130.0 672.0 91.0 636.0 91.0 600.0 91.0 600.0 130.0 L 592.0 145.0 H 680.0 Z"/><path class="stroke" d="M 684.0 148.0 H 588.0 M 649.0 157.0 636.0 169.0 623.0 157.0"/><circle class="ink" cx="636.0" cy="151" r="5"/><path class="stroke" d="M 645.0 86.0 H 627.0"/><text class="sh" x="636.0" y="183" text-anchor="middle">گھنٹی</text><text class="small" x="636.0" y="201" text-anchor="middle">بے جان محرک</text></g><g aria-label="crossed-out droplet, no response"><path class="stroke" d="M 527.0 101.0 C 527.0 101.0 544.0 124.0 544.0 136.0 A 17.0 17.0 0.0 0.0 1.0 510.0 136.0 C 510.0 124.0 527.0 101.0 527.0 101.0 Z"/><path class="stroke" d="M 549.0 110.0 L 505.0 157.0"/><text class="sh" x="527.0" y="183" text-anchor="middle">کوئی ردعمل نہیں</text></g><line class="grid" x1="575.0" y1="136" x2="557.0" y2="136"/><g aria-label="plate of food, unconditioned stimulus"><ellipse class="stroke" cx="452" cy="145" rx="67" ry="18"/><path class="stroke" d="M 395.0 145.0 389.0 171.0 328.0 174.0 267.0 171.0 261.0 145.0"/><circle class="ink" cx="352.0" cy="136" r="8"/><circle class="ink" cx="329.0" cy="130" r="8"/><circle class="ink" cx="306.0" cy="136" r="8"/><text class="sh" x="328.0" y="195" text-anchor="middle">کھانا</text></g><line class="stroke-a" x1="254.0" y1="137" x2="160.0" y2="137" marker-end="url(#arrow-a)"/><g aria-label="salivation response"><path class="stroke-a" d="M 130.0 102.0 C 130.0 102.0 148.0 126.0 148.0 140.0 A 18.0 18.0 0.0 0.0 1.0 112.0 140.0 C 112.0 126.0 130.0 102.0 130.0 102.0 Z"/><text class="sh" x="130.0" y="183" text-anchor="middle">رال</text></g><rect class="panel" x="18.0" y="230" width="744" height="224" rx="10"/><text class="h" x="738.0" y="261" text-anchor="end">شرطندگی کے بعد</text><line class="grid" x1="738.0" y1="275" x2="42.0" y2="275"/><g aria-label="bell, conditioned stimulus"><path class="stroke" d="M 687.0 358.0 687.0 319.0 651.0 319.0 615.0 319.0 615.0 358.0 L 607.0 373.0 H 695.0 Z"/><path class="stroke" d="M 699.0 376.0 H 603.0 M 664.0 385.0 651.0 397.0 638.0 385.0"/><circle class="ink" cx="651.0" cy="379" r="5"/><path class="stroke" d="M 660.0 314.0 H 642.0"/><text class="sh" x="651.0" y="413" text-anchor="middle">گھنٹی</text></g><line class="stroke-a" x1="585.0" y1="358" x2="468.0" y2="358" marker-end="url(#arrow-a)"/><g aria-label="salivation response triggered by bell"><path class="stroke-a" d="M 434.0 322.0 C 434.0 322.0 453.0 347.0 453.0 361.0 A 19.0 19.0 0.0 0.0 1.0 415.0 361.0 C 415.0 347.0 434.0 322.0 434.0 322.0 Z"/><text class="sh" x="434.0" y="413" text-anchor="middle">رال</text></g><path class="grid" d="M 380.0 295.0 H 56.0 M 380.0 337.0 H 56.0 M 380.0 379.0 H 56.0"/><text class="small" x="362.0" y="310" text-anchor="end"><tspan class="sh" x="418" dy="0">bell:</tspan><tspan x="455" dy="0"> neutral stimulus becomes</tspan><tspan x="418" dy="16">conditioned stimulus</tspan></text><text class="small" x="362.0" y="352" text-anchor="end"><tspan class="sh" x="418" dy="0">food:</tspan><tspan x="455" dy="0"> unconditioned stimulus</tspan></text><text class="small" x="362.0" y="394" text-anchor="end"><tspan class="sh" x="418" dy="0">salivation:</tspan><tspan x="486" dy="0"> response now</tspan><tspan x="418" dy="16">triggered by the bell</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
