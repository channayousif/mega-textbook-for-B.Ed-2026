<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A two-panel diagram of classical conditioning: before conditioning, the bell produces no response while food produces salivation</title><desc id="d">A two-panel diagram of classical conditioning: before conditioning, the bell produces no response while food produces salivation; after conditioning, the bell alone produces salivation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="18" y="14" width="744" height="202" rx="10"/><text class="h" x="42" y="45">before conditioning</text><line class="grid" x1="42" y1="59" x2="738" y2="59"/><g aria-label="bell, neutral stimulus"><path class="stroke" d="M108 130Q108 91 144 91Q180 91 180 130L188 145H100Z"/><path class="stroke" d="M96 148H192M131 157Q144 169 157 157"/><circle class="ink" cx="144" cy="151" r="5"/><path class="stroke" d="M135 86H153"/><text class="sh" x="144" y="183" text-anchor="middle">bell</text><text class="small" x="144" y="201" text-anchor="middle">neutral stimulus</text></g><g aria-label="crossed-out droplet, no response"><path class="stroke" d="M253 101C253 101 236 124 236 136A17 17 0 0 0 270 136C270 124 253 101 253 101Z"/><path class="stroke" d="M231 110L275 157"/><text class="sh" x="253" y="183" text-anchor="middle">no response</text></g><line class="grid" x1="205" y1="136" x2="223" y2="136"/><g aria-label="plate of food, unconditioned stimulus"><ellipse class="stroke" cx="452" cy="145" rx="67" ry="18"/><path class="stroke" d="M385 145Q391 171 452 174Q513 171 519 145"/><circle class="ink" cx="428" cy="136" r="8"/><circle class="ink" cx="451" cy="130" r="8"/><circle class="ink" cx="474" cy="136" r="8"/><text class="sh" x="452" y="195" text-anchor="middle">food</text></g><line class="stroke-a" x1="526" y1="137" x2="620" y2="137" marker-end="url(#arrow-a)"/><g aria-label="salivation response"><path class="stroke-a" d="M650 102C650 102 632 126 632 140A18 18 0 0 0 668 140C668 126 650 102 650 102Z"/><text class="sh" x="650" y="183" text-anchor="middle">salivation</text></g><rect class="panel" x="18" y="230" width="744" height="224" rx="10"/><text class="h" x="42" y="261">after conditioning</text><line class="grid" x1="42" y1="275" x2="738" y2="275"/><g aria-label="bell, conditioned stimulus"><path class="stroke" d="M93 358Q93 319 129 319Q165 319 165 358L173 373H85Z"/><path class="stroke" d="M81 376H177M116 385Q129 397 142 385"/><circle class="ink" cx="129" cy="379" r="5"/><path class="stroke" d="M120 314H138"/><text class="sh" x="129" y="413" text-anchor="middle">bell</text></g><line class="stroke-a" x1="195" y1="358" x2="312" y2="358" marker-end="url(#arrow-a)"/><g aria-label="salivation response triggered by bell"><path class="stroke-a" d="M346 322C346 322 327 347 327 361A19 19 0 0 0 365 361C365 347 346 322 346 322Z"/><text class="sh" x="346" y="413" text-anchor="middle">salivation</text></g><path class="grid" d="M400 295H724M400 337H724M400 379H724"/><text class="small" x="418" y="310"><tspan class="sh" x="418" dy="0">bell:</tspan><tspan x="455" dy="0"> neutral stimulus becomes</tspan><tspan x="418" dy="16">conditioned stimulus</tspan></text><text class="small" x="418" y="352"><tspan class="sh" x="418" dy="0">food:</tspan><tspan x="455" dy="0"> unconditioned stimulus</tspan></text><text class="small" x="418" y="394"><tspan class="sh" x="418" dy="0">salivation:</tspan><tspan x="486" dy="0"> response now</tspan><tspan x="418" dy="16">triggered by the bell</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
