<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A two-panel diagram of classical conditioning: before conditioning, the bell produces no response while food produces salivation</title><desc id="d">A two-panel diagram of classical conditioning: before conditioning, the bell produces no response while food produces salivation; after conditioning, the bell alone produces salivation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect id="region-before" class="panel" x="20" y="20" width="740" height="200" rx="12"/><rect id="region-after" class="panel" x="20" y="240" width="740" height="240" rx="12"/></g><g id="layer-edges"><line id="edge-food-salivation" class="stroke" x1="560" y1="140" x2="620" y2="140" marker-end="url(#arrow)"/><line id="edge-bell-salivation" class="stroke" x1="220" y1="360" x2="280" y2="360" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-bell-before"><rect class="frame" x="40" y="100" width="180" height="80" rx="8"/><text class="sh" x="130" y="134" text-anchor="middle">bell</text><text class="small" x="130" y="160" text-anchor="middle">neutral stimulus</text></g><g id="node-no-response"><rect class="dashed" x="260" y="100" width="140" height="80" rx="8"/><path class="stroke" d="M320 112 L340 132 M340 112 L320 132"/><text class="sh" x="330" y="162" text-anchor="middle">no response</text></g><g id="node-food"><rect class="frame" x="440" y="100" width="120" height="80" rx="8"/><text class="sh" x="500" y="146" text-anchor="middle">food</text></g><g id="node-salivation-before"><rect class="frame" x="620" y="100" width="120" height="80" rx="8"/><text class="sh" x="680" y="146" text-anchor="middle">salivation</text></g><g id="node-bell-after"><rect class="frame" x="40" y="320" width="180" height="80" rx="8"/><text class="sh" x="130" y="366" text-anchor="middle">bell</text></g><g id="node-salivation-after"><rect class="frame" x="280" y="320" width="140" height="80" rx="8"/><text class="sh" x="350" y="366" text-anchor="middle">salivation</text></g><g id="node-key"><rect class="frame" x="460" y="280" width="280" height="180" rx="8"/><text class="body" x="476" y="312">bell: neutral stimulus becomes</text><text class="body" x="476" y="332">conditioned stimulus</text><text class="body" x="476" y="368">food: unconditioned stimulus</text><text class="body" x="476" y="404">salivation: response now</text><text class="body" x="476" y="424">triggered by the bell</text></g></g><g id="layer-labels"><text class="h" x="40" y="52">before conditioning</text><text class="h" x="40" y="272">after conditioning</text><text aria-hidden="true" class="wm" x="768" y="510" text-anchor="end">textbook.com.pk</text></g></svg>
