<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">روے اور اس کے نتیجے کا فلو چارٹ</title><desc id="d">روے اور اس کے نتیجے کا فلو چارٹ، چار حصوں میں تقسیم: مثبت اور منفی تقویت جو رویے کو زیادہ کرتے ہیں، اور مثبت اور منفی سزا جو کم کرتے ہیں، ہر ایک کی جماعتی مثال کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><g id="layer-regions"><rect id="region-consequences" class="band" x="20" y="200" width="740" height="340" rx="12"/></g><g id="layer-edges"><line id="edge-behaviour-follows" class="stroke" x1="390" y1="60" x2="390" y2="80" marker-end="url(#arrow)"/><line id="edge-follows-consequences" class="stroke" x1="390" y1="160" x2="390" y2="200" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-behaviour"><rect class="frame" x="260" y="20" width="260" height="40" rx="20"/><text class="h" x="390" y="46" text-anchor="middle">‏ایک رویہ ہوتا ہے‏</text></g><g id="node-follows"><polygon class="frame" points="390,80 260,120 390,160 520,120"/><text class="h" x="390" y="126" text-anchor="middle">‏اس کے بعد کیا آتا ہے؟‏</text></g><g id="node-positive-reinforcement"><rect class="panel-a" x="400" y="220" width="340" height="140" rx="8"/><text class="small" x="724" y="248" text-anchor="end">‏شامل: وہ چیز جو شاگرد چاہتا ہے‏</text><text class="h" x="724" y="276" text-anchor="end">‏مثبت تقویت‏</text><text class="sh" x="724" y="302" text-anchor="end">‏زیادہ کثرت سے‏</text><text class="small" x="724" y="328" text-anchor="end">‏مثال: اچھے جواب پر تعریف‏</text></g><g id="node-negative-reinforcement"><rect class="panel-a" x="40" y="220" width="340" height="140" rx="8"/><text class="small" x="364" y="248" text-anchor="end">‏ہٹا: وہ چیز جو شاگرد ناپسند کرتا ہے‏</text><text class="h" x="364" y="276" text-anchor="end">‏منفی تقویت‏</text><text class="sh" x="364" y="302" text-anchor="end">‏زیادہ کثرت سے‏</text><text class="small" x="364" y="328" text-anchor="end">‏مثال: سیٹ ورک مکمل اور جھڑک بند‏</text></g><g id="node-positive-punishment"><rect class="panel-c" x="400" y="380" width="340" height="140" rx="8"/><text class="small" x="724" y="408" text-anchor="end">‏شامل: وہ چیز جو شاگرد ناپسند کرتا ہے‏</text><text class="h" x="724" y="436" text-anchor="end">‏مثبت سزا‏</text><text class="sh" x="724" y="462" text-anchor="end">‏کم کثرت سے‏</text><text class="small" x="724" y="488" text-anchor="end">‏مثال: پکارنے پر جھڑک‏</text></g><g id="node-negative-punishment"><rect class="panel-c" x="40" y="380" width="340" height="140" rx="8"/><text class="small" x="364" y="408" text-anchor="end">‏ہٹا: وہ چیز جو شاگرد چاہتا ہے‏</text><text class="h" x="364" y="436" text-anchor="end">‏منفی سزا‏</text><text class="sh" x="364" y="462" text-anchor="end">‏کم کثرت سے‏</text><text class="small" x="364" y="488" text-anchor="end">‏مثال: بولنے پر ستارہ واپس‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="570" text-anchor="start">textbook.com.pk</text></g></svg>
