<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ جماعتی نتائج کا جدول</title><desc id="d">پانچ جماعتی نتائج کا جدول: تعریف، ستارہ چارٹ، بند ہونے والی جھڑک، پکارنے پر جھڑک، اور چھینا ستارہ: ہر ایک کے ساتھ یہ کہ وہ کیا ہے، کیا زیادہ یا کم ممکن بناتا ہے، اور اس کا کیا خطرہ ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:11.5px;fill:var(--ink)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.cell{font-size:13px;fill:var(--ink)}.row{font-size:13px;font-weight:600;fill:var(--ink)}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><rect class="panel" x="12.0" y="12" width="756" height="418" rx="8"/><rect class="panel-a" x="12.0" y="12" width="756" height="58" rx="8"/><path class="grid" d="M 582.0 12.0 V 430.0 M 424.0 12.0 V 430.0 M 234.0 12.0 V 430.0 M 768.0 70.0 H 12.0 M 768.0 142.0 H 12.0 M 768.0 214.0 H 12.0 M 768.0 286.0 H 12.0 M 768.0 358.0 H 12.0"/><text cl