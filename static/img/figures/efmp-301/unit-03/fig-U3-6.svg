<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of Bandura's four observational-learning steps</title><desc id="d">A flowchart of Bandura's four observational-learning steps - attention, retention, reproduction and motivation - each with a classroom instance, and a note that all four must be present.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.ah{fill:var(--a1)}text{font-size:15px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel-a" x="18" y="34" width="168" height="116" rx="8"/><rect class="panel-a" x="210" y="34" width="168" height="116" rx="8"/><rect class="panel-a" x="402" y="34" width="168" height="116" rx="8"/><rect class="panel-a" x="594" y="34" width="168" height="116" rx="8"/><line class="stroke-a" x1="187" y1="92" x2="208" y2="92" marker-end="url(#arrow)"/><line class="stroke-a" x1="379" y1="92" x2="400" y2="92" marker-end="url(#arrow)"/><line class="stroke-a" x1="571" y1="92" x2="592" y2="92" marker-end="url(#arrow)"/><text class="h ink" x="32" y="66">1. attention:</text><text class="body" x="32" y="91">the pupil notices</text><text class="body" x="32" y="112">the model</text><text class="h ink" x="224" y="66">2. retention:</text><text class="body" x="224" y="91">the pupil remembers</text><text class="body" x="224" y="112">what was seen</text><text class="h ink" x="416" y="66">3. reproduction:</text><text class="body" x="416" y="91">the pupil can do</text><text class="body" x="416" y="112">the behaviour</text><text class="h ink" x="608" y="66">4. motivation:</text><text class="body" x="608" y="91">the outcome makes</text><text class="body" x="608" y="112">it worth doing</text><rect class="panel" x="18" y="180" width="168" height="166" rx="8"/><rect class="panel" x="210" y="180" width="168" height="166" rx="8"/><rect class="panel" x="402" y="180" width="168" height="166" rx="8"/><rect class="panel" x="594" y="180" width="168" height="166" rx="8"/><line class="stroke" x1="32" y1="215" x2="172" y2="215"/><line class="stroke" x1="224" y1="215" x2="364" y2="215"/><line class="stroke" x1="416" y1="215" x2="556" y2="215"/><line class="stroke" x1="608" y1="215" x2="748" y2="215"/><line class="grid" x1="18" y1="363" x2="762" y2="363"/><text class="sh" x="32" y="204">Classroom instance</text><text class="small" x="32" y="244">the pupil watches</text><text class="small" x="32" y="266">how the teacher treats</text><text class="small" x="32" y="288">the first wrong answer</text><text class="sh" x="224" y="204">Classroom instance</text><text class="small" x="224" y="244">remembers that the</text><text class="small" x="224" y="266">error was worked</text><text class="small" x="224" y="288">through, not mocked</text><text class="sh" x="416" y="204">Classroom instance</text><text class="small" x="416" y="244">answers wrongly</text><text class="small" x="416" y="266">out loud without</text><text class="small" x="416" y="288">hiding</text><text class="sh" x="608" y="204">Classroom instance</text><text class="small" x="608" y="244">sees the wrong</text><text class="small" x="608" y="266">answer lead to help,</text><text class="small" x="608" y="288">not shame</text><rect class="panel-a" x="64" y="385" width="652" height="42" rx="8"/><text class="sh" x="84" y="411">Note:</text><text class="body" x="130" y="411">all four must be present; a missing step is a missing lesson</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
