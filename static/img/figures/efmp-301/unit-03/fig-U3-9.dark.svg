<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the four theory families</title><desc id="d">A table comparing the four theory families - behaviourism, cognitive, social learning and constructivism - on what learning is, the teacher's job, and what each misses.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><rect id="region-header" class="head" x="21" y="21" width="738" height="59"/><rect id="region-row-labels" class="band" x="21" y="80" width="159" height="359"/><g id="region-grid"><line class="grid" x1="180" y1="20" x2="180" y2="440"/><line class="grid" x1="350" y1="20" x2="350" y2="440"/><line class="grid" x1="580" y1="20" x2="580" y2="440"/><line class="rule" x1="20" y1="80" x2="760" y2="80"/><line class="grid" x1="20" y1="170" x2="760" y2="170"/><line class="grid" x1="20" y1="260" x2="760" y2="260"/><line class="grid" x1="20" y1="350" x2="760" y2="350"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="48" y="55">theory family</text><text class="sh" x="192" y="55">what learning is</text><text class="sh" x="362" y="55">the teacher's job</text><text class="sh" x="592" y="55">what it misses</text></g><g id="node-row-1"><text class="sh" x="48" y="130">behaviourism</text><text class="cell" x="192" y="121">change in observable</text><text class="cell" x="192" y="139">behaviour</text><text class="cell" x="362" y="121">arrange consequences that</text><text class="cell" x="362" y="139">train the wanted behaviour</text><text class="cell" x="592" y="112">understanding,</text><text class="cell" x="592" y="130">meaning, the inside</text><text class="cell" x="592" y="148">of the head</text></g><g id="node-row-2"><text class="sh" x="48" y="220">cognitive</text><text class="cell" x="192" y="211">change in thinking,</text><text class="cell" x="192" y="229">schemas rebuilt</text><text class="cell" x="362" y="202">order experience: enactive</text><text class="cell" x="362" y="220">to iconic to symbolic;</text><text class="cell" x="362" y="238">meet prior schemas</text><text class="cell" x="592" y="202">the social setting</text><text class="cell" x="592" y="220">where learning</text><text class="cell" x="592" y="238">happens</text></g><g id="node-row-3"><text class="sh" x="48" y="301">social</text><text class="sh" x="48" y="319">learning</text><text class="cell" x="192" y="292">change through</text><text class="cell" x="192" y="310">observation</text><text class="cell" x="192" y="328">of models</text><text class="cell" x="362" y="301">be a deliberate model, aim</text><text class="cell" x="362" y="319">attention and its outcomes</text><text class="cell" x="592" y="301">what is constructed,</text><text class="cell" x="592" y="319">not just copied</text></g><g id="node-row-4"><text class="sh" x="48" y="400">constructivism</text><text class="cell" x="192" y="382">understanding built</text><text class="cell" x="192" y="400">by the learner</text><text class="cell" x="192" y="418">with assistance</text><text class="cell" x="362" y="382">design the task, place and</text><text class="cell" x="362" y="400">remove scaffolds in</text><text class="cell" x="362" y="418">the zone</text><text class="cell" x="592" y="382">slow, hard to run</text><text class="cell" x="592" y="400">with sixty pupils and</text><text class="cell" x="592" y="418">a syllabus clock</text></g></g><g id="layer-labels"><text class="small" x="34" y="102" text-anchor="middle">1</text><text class="small" x="34" y="192" text-anchor="middle">2</text><text class="small" x="34" y="282" text-anchor="middle">3</text><text class="small" x="34" y="372" text-anchor="middle">4</text><text aria-hidden="true" class="wm" x="768" y="470" text-anchor="end">textbook.com.pk</text></g></svg>
