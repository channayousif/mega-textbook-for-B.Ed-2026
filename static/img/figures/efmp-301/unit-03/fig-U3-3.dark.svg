<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five classroom consequences</title><desc id="d">A table of five classroom consequences - praise, a star chart, scolding that stops, scolding for calling out, and a removed star - each against what it is, what it makes more or less likely, and what it risks.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="540"/><rect id="region-header" class="head" x="21" y="21" width="738" height="89"/><rect id="region-row-labels" class="band" x="21" y="110" width="179" height="449"/><g id="region-grid"><line class="grid" x1="200" y1="20" x2="200" y2="560"/><line class="grid" x1="370" y1="20" x2="370" y2="560"/><line class="grid" x1="520" y1="20" x2="520" y2="560"/><line class="rule" x1="20" y1="110" x2="760" y2="110"/><line class="grid" x1="20" y1="200" x2="760" y2="200"/><line class="grid" x1="20" y1="290" x2="760" y2="290"/><line class="grid" x1="20" y1="380" x2="760" y2="380"/><line class="grid" x1="20" y1="470" x2="760" y2="470"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="70">consequence</text><text class="h" x="212" y="70">what it is</text><text class="h" x="382" y="52">what it makes</text><text class="h" x="382" y="70">more or less</text><text class="h" x="382" y="88">likely</text><text class="h" x="532" y="70">what it risks</text></g><g id="node-row-1"><text class="sh" x="32" y="151">praise for a</text><text class="sh" x="32" y="169">good answer</text><text class="body" x="212" y="151">something wanted</text><text class="body" x="212" y="169">is added</text><text class="body" x="382" y="151">good answers</text><text class="body" x="382" y="169">more frequent</text><text class="body" x="532" y="142">praise inflation,</text><text class="body" x="532" y="160">dependence on</text><text class="body" x="532" y="178">the teacher</text></g><g id="node-row-2"><text class="sh" x="32" y="241">star chart for</text><text class="sh" x="32" y="259">completed work</text><text class="body" x="212" y="241">something wanted</text><text class="body" x="212" y="259">is added</text><text class="body" x="382" y="241">completed work</text><text class="body" x="382" y="259">more frequent</text><text class="body" x="532" y="232">copying rewarded</text><text class="body" x="532" y="250">if completion is all</text><text class="body" x="532" y="268">that is checked</text></g><g id="node-row-3"><text class="sh" x="32" y="331">scolding stops when</text><text class="sh" x="32" y="349">seatwork is done</text><text class="body" x="212" y="331">something disliked</text><text class="body" x="212" y="349">is removed</text><text class="body" x="382" y="331">finishing work</text><text class="body" x="382" y="349">more frequent</text><text class="body" x="532" y="331">pupils only work</text><text class="body" x="532" y="349">when scolded</text></g><g id="node-row-4"><text class="sh" x="32" y="421">scolding for</text><text class="sh" x="32" y="439">calling out</text><text class="body" x="212" y="421">something disliked</text><text class="body" x="212" y="439">is added</text><text class="body" x="382" y="421">calling out</text><text class="body" x="382" y="439">less frequent</text><text class="body" x="532" y="412">fear, avoidance</text><text class="body" x="532" y="430">of the subject,</text><text class="body" x="532" y="448">underground behaviour</text></g><g id="node-row-5"><text class="sh" x="32" y="511">a star removed</text><text class="sh" x="32" y="529">for talking</text><text class="body" x="212" y="511">something wanted</text><text class="body" x="212" y="529">is removed</text><text class="body" x="382" y="511">talking less</text><text class="body" x="382" y="529">frequent</text><text class="body" x="532" y="502">the chart becomes</text><text class="body" x="532" y="520">a threat rather than</text><text class="body" x="532" y="538">a prize</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="590" text-anchor="end">textbook.com.pk</text></g></svg>
