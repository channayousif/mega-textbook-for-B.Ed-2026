<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five classroom consequences</title><desc id="d">A table of five classroom consequences - praise, a star chart, scolding that stops, scolding for calling out, and a removed star - each against what it is, what it makes more or less likely, and what it risks.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.cell{font-size:13px;fill:var(--ink)}.row{font-size:13px;font-weight:600;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="12" width="756" height="418" rx="8"/><rect class="panel-a" x="12" y="12" width="756" height="58" rx="8"/><path class="grid" d="M198 12V430M356 12V430M546 12V430M12 70H768M12 142H768M12 214H768M12 286H768M12 358H768"/><text class="h" x="105" y="43" text-anchor="middle">consequence</text><text class="h" x="277" y="43" text-anchor="middle">what it is</text><text class="h" x="451" y="35" text-anchor="middle">what it makes more</text><text class="h" x="451" y="53" text-anchor="middle">or less likely</text><text class="h" x="657" y="43" text-anchor="middle">what it risks</text><text class="row" x="28" y="101">praise for a</text><text class="row" x="28" y="119">good answer</text><text class="cell" x="212" y="101">something wanted</text><text class="cell" x="212" y="119">is added</text><text class="cell" x="370" y="101">good answers</text><text class="cell" x="370" y="119">more frequent</text><text class="cell" x="560" y="92">praise inflation,</text><text class="cell" x="560" y="110">dependence on</text><text class="cell" x="560" y="128">the teacher</text><text class="row" x="28" y="173">star chart for</text><text class="row" x="28" y="191">completed work</text><text class="cell" x="212" y="173">something wanted</text><text class="cell" x="212" y="191">is added</text><text class="cell" x="370" y="173">completed work</text><text class="cell" x="370" y="191">more frequent</text><text class="cell" x="560" y="164">copying rewarded</text><text class="cell" x="560" y="182">if completion is all</text><text class="cell" x="560" y="200">that is checked</text><text class="row" x="28" y="245">scolding stops when</text><text class="row" x="28" y="263">seatwork is done</text><text class="cell" x="212" y="245">something disliked</text><text class="cell" x="212" y="263">is removed</text><text class="cell" x="370" y="245">finishing work</text><text class="cell" x="370" y="263">more frequent</text><text class="cell" x="560" y="245">pupils only work</text><text class="cell" x="560" y="263">when scolded</text><text class="row" x="28" y="317">scolding for</text><text class="row" x="28" y="335">calling out</text><text class="cell" x="212" y="317">something disliked</text><text class="cell" x="212" y="335">is added</text><text class="cell" x="370" y="317">calling out</text><text class="cell" x="370" y="335">less frequent</text><text class="cell" x="560" y="308">fear, avoidance</text><text class="cell" x="560" y="326">of the subject,</text><text class="cell" x="560" y="344">underground behaviour</text><text class="row" x="28" y="389">a star removed</text><text class="row" x="28" y="407">for talking</text><text class="cell" x="212" y="389">something wanted</text><text class="cell" x="212" y="407">is removed</text><text class="cell" x="370" y="389">talking less</text><text class="cell" x="370" y="407">frequent</text><text class="cell" x="560" y="380">the chart becomes</text><text class="cell" x="560" y="398">a threat rather than</text><text class="cell" x="560" y="416">a prize</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
