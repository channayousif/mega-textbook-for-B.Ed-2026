<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of constructivism with its four claims at the centre</title><desc id="d">A concept map of constructivism with its four claims at the centre, linked to psychological constructivism (the individual organises experience) and social constructivism (understanding is built with assistance), with the zone of proximal development and scaffolding attached.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-constructivism-claim-1" class="link" d="M290 240 C270 240 260 60 240 60"/><path id="edge-constructivism-claim-2" class="link" d="M290 240 C270 240 260 180 240 180"/><path id="edge-constructivism-claim-3" class="link" d="M290 240 C270 240 260 300 240 300"/><path id="edge-constructivism-claim-4" class="link" d="M290 240 C270 240 260 420 240 420"/><path id="edge-constructivism-psychological" class="link" d="M450 240 C490 240 480 80 520 80"/><path id="edge-constructivism-social" class="link" d="M450 240 L520 240"/><path id="edge-social-zpd" class="link" d="M580 300 V330 H400 V360"/><line id="edge-social-scaffolding" class="link" x1="640" y1="300" x2="640" y2="360"/></g><g id="layer-nodes"><g id="node-constructivism"><ellipse class="panel-a" cx="370" cy="240" rx="80" ry="40"/><text class="h" x="370" y="246" text-anchor="middle">constructivism</text></g><g id="node-claim-1"><rect class="frame" x="20" y="20" width="220" height="80" rx="8"/><text class="body" x="130" y="45" text-anchor="middle">the learner builds</text><text class="body" x="130" y="65" text-anchor="middle">understanding, it is not</text><text class="body" x="130" y="85" text-anchor="middle">delivered</text></g><g id="node-claim-2"><rect class="frame" x="20" y="140" width="220" height="80" rx="8"/><text class="body" x="130" y="175" text-anchor="middle">prior knowledge is the</text><text class="body" x="130" y="195" text-anchor="middle">building material</text></g><g id="node-claim-3"><rect class="frame" x="20" y="260" width="220" height="80" rx="8"/><text class="body" x="130" y="295" text-anchor="middle">activity and talk are</text><text class="body" x="130" y="315" text-anchor="middle">the tools</text></g><g id="node-claim-4"><rect class="frame" x="20" y="380" width="220" height="80" rx="8"/><text class="body" x="130" y="415" text-anchor="middle">the teacher designs</text><text class="body" x="130" y="435" text-anchor="middle">the site</text></g><g id="node-psychological"><rect class="panel" x="520" y="20" width="240" height="120" rx="8"/><text class="sh" x="640" y="55" text-anchor="middle">psychological</text><text class="sh" x="640" y="75" text-anchor="middle">constructivism</text><text class="body" x="640" y="95" text-anchor="middle">the individual organises</text><text class="body" x="640" y="115" text-anchor="middle">experience (Piaget)</text></g><g id="node-social"><rect class="panel" x="520" y="180" width="240" height="120" rx="8"/><text class="sh" x="640" y="215" text-anchor="middle">social constructivism</text><text class="body" x="640" y="235" text-anchor="middle">understanding is built</text><text class="body" x="640" y="255" text-anchor="middle">with assistance</text><text class="body" x="640" y="275" text-anchor="middle">(Vygotsky, Bruner)</text></g><g id="node-zpd"><rect class="panel-b" x="300" y="360" width="200" height="140" rx="8"/><text class="sh" x="400" y="395" text-anchor="middle">zone of proximal</text><text class="sh" x="400" y="415" text-anchor="middle">development</text><text class="body" x="400" y="435" text-anchor="middle">what the pupil can</text><text class="body" x="400" y="455" text-anchor="middle">do with help but</text><text class="body" x="400" y="475" text-anchor="middle">not yet alone</text></g><g id="node-scaffolding"><rect class="panel-b" x="540" y="360" width="200" height="140" rx="8"/><text class="sh" x="640" y="405" text-anchor="middle">scaffolding</text><text class="body" x="640" y="425" text-anchor="middle">temporary support,</text><text class="body" x="640" y="445" text-anchor="middle">removed as it is</text><text class="body" x="640" y="465" text-anchor="middle">stood on</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="530" text-anchor="end">textbook.com.pk</text></g></svg>
