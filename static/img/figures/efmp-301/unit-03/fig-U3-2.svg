<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of a behaviour and its consequence, branching into four quadrants</title><desc id="d">A flowchart of a behaviour and its consequence, branching into four quadrants: positive and negative reinforcement, which make behaviour more frequent, and punishment and response cost, which make it less frequent, each with a classroom example.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel" x="282" y="14" width="216" height="35" rx="17"/><text class="h" x="390" y="37" text-anchor="middle">a behaviour happens</text><line class="stroke" x1="390" y1="50" x2="390" y2="65" marker-end="url(#arrow)"/><polygon class="panel" points="390,61 483,92 390,123 297,92"/><text class="h" x="390" y="97" text-anchor="middle">what follows it?</text><path class="stroke" d="M342 108 L198 150" marker-end="url(#arrow)"/><path class="stroke" d="M438 108 L582 150" marker-end="url(#arrow)"/><path class="stroke" d="M300 96 H6 V320 H16" marker-end="url(#arrow)"/><path class="stroke" d="M480 96 H774 V320 H764" marker-end="url(#arrow)"/><line class="grid" x1="390" y1="143" x2="390" y2="432"/><line class="grid" x1="12" y1="291" x2="768" y2="291"/><rect class="panel" x="16" y="151" width="364" height="132" rx="8"/><circle class="stroke-a" cx="45" cy="177" r="13"/><path class="stroke-a" d="M38 177 H52 M45 170 V184"/><text class="small" x="68" y="181">ADDED: something the pupil wants</text><text class="h" x="34" y="208">positive reinforcement</text><path class="stroke-a" d="M42 239 V218 M35 225 L42 218 L49 225"/><text class="sh" x="61" y="231">MORE frequent</text><text class="small" x="34" y="262">Example: praise for a good answer</text><rect class="panel" x="400" y="151" width="364" height="132" rx="8"/><rect class="stroke-a" x="420" y="164" width="27" height="26" rx="4"/><path class="stroke-a" d="M426 177 H441"/><text class="small" x="462" y="181">REMOVED: something the pupil dislikes</text><text class="h" x="418" y="208">negative reinforcement</text><path class="stroke-a" d="M426 239 V218 M419 225 L426 218 L433 225"/><text class="sh" x="445" y="231">MORE frequent</text><text class="small" x="418" y="262">Example: seatwork finished and the scolding stops</text><rect class="panel" x="16" y="300" width="364" height="132" rx="8"/><polygon class="stroke" points="45,313 60,339 30,339"/><path class="stroke-a" d="M38 329 H52 M45 322 V336"/><text class="small" x="68" y="331">ADDED: something the pupil dislikes</text><text class="h" x="34" y="358">punishment</text><path class="stroke-a" d="M42 370 V391 M35 384 L42 391 L49 384"/><text class="sh" x="61" y="382">LESS frequent</text><text class="small" x="34" y="411">Example: scolding for calling out</text><rect class="panel" x="400" y="300" width="364" height="132" rx="8"/><polygon class="stroke" points="428,313 440,313 448,321 448,333 440,341 428,341 420,333 420,321"/><path class="stroke-a" d="M426 327 H442"/><text class="small" x="462" y="331">REMOVED: something the pupil wants</text><text class="h" x="418" y="358">response cost</text><path class="stroke-a" d="M426 370 V391 M419 384 L426 391 L433 384"/><text class="sh" x="445" y="382">LESS frequent</text><text class="small" x="418" y="411">Example: a star removed for talking</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
