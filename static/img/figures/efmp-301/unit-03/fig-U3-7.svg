<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five sources of models</title><desc id="d">A table of five sources of models - teacher, peers, older pupils, family, and screens and stories - each against what is being modelled and what strengthens or weakens the modelling.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="18" width="756" height="402" rx="6"/><rect class="panel-a" x="12" y="18" width="756" height="62" rx="6"/><line class="stroke stroke-a" x1="12" y1="80" x2="768" y2="80"/><line class="grid" x1="160" y1="18" x2="160" y2="420"/><line class="grid" x1="418" y1="18" x2="418" y2="420"/><line class="grid" x1="12" y1="148" x2="768" y2="148"/><line class="grid" x1="12" y1="216" x2="768" y2="216"/><line class="grid" x1="12" y1="284" x2="768" y2="284"/><line class="grid" x1="12" y1="352" x2="768" y2="352"/><text class="h ink" x="28" y="45">who the model is</text><text class="h ink" x="176" y="45">what is being</text><text class="h ink" x="176" y="65">modelled</text><text class="h ink" x="434" y="45">what strengthens or weakens</text><text class="h ink" x="434" y="65">the modelling</text><text class="sh ink" x="28" y="112">the teacher</text><text class="body" x="176" y="105">how errors, questions</text><text class="body" x="176" y="126">and effort are treated</text><text class="body" x="434" y="101">strongest model in the room:</text><text class="small muted" x="434" y="120">important, present daily</text><text class="small" x="434" y="138">consistency between words and outcomes</text><text class="sh ink" x="28" y="180">peers</text><text class="body" x="176" y="173">how work is done,</text><text class="body" x="176" y="194">how others are treated</text><text class="body" x="434" y="169">strong: similar and ever-present</text><text class="small" x="434" y="190">the classroom's visible norms, who gets attention</text><text class="sh ink" x="28" y="248">older pupils</text><text class="body" x="176" y="241">habits, confidence, shortcuts</text><text class="body" x="434" y="237">strong: admired and near in age</text><text class="small" x="434" y="258">what the school rewards them for</text><text class="sh ink" x="28" y="316">family</text><text class="body" x="176" y="309">attitudes to school, to reading,</text><text class="body" x="176" y="330">to authority</text><text class="body" x="434" y="305">strong: warm and long-standing</text><text class="small" x="434" y="326">whether school and home model the same things</text><text class="sh ink" x="28" y="384">screens and</text><text class="sh ink" x="28" y="402">stories</text><text class="body" x="176" y="377">behaviour repertoires,</text><text class="body" x="176" y="398">consequences as shown</text><text class="body" x="434" y="373">strong: vivid, repeated, engaging</text><text class="small" x="434" y="392">whether consequences are shown honestly</text><text class="small" x="434" y="409">or glamorised</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
