<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five sources of models</title><desc id="d">A table of five sources of models - teacher, peers, older pupils, family, and screens and stories - each against what is being modelled and what strengthens or weakens the modelling.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="630"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="570"/><rect id="region-header" class="head" x="21" y="21" width="738" height="69"/><rect id="region-row-labels" class="band" x="21" y="90" width="149" height="499"/><g id="region-grid"><line class="grid" x1="170" y1="20" x2="170" y2="590"/><line class="grid" x1="420" y1="20" x2="420" y2="590"/><line class="rule" x1="20" y1="90" x2="760" y2="90"/><line class="grid" x1="20" y1="190" x2="760" y2="190"/><line class="grid" x1="20" y1="290" x2="760" y2="290"/><line class="grid" x1="20" y1="390" x2="760" y2="390"/><line class="grid" x1="20" y1="490" x2="760" y2="490"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="51">who the</text><text class="h" x="32" y="69">model is</text><text class="h" x="182" y="51">what is being</text><text class="h" x="182" y="69">modelled</text><text class="h" x="432" y="51">what strengthens or weakens</text><text class="h" x="432" y="69">the modelling</text></g><g id="node-row-1"><text class="sh" x="32" y="145">the teacher</text><text class="body" x="182" y="136">how errors, questions</text><text class="body" x="182" y="154">and effort are treated</text><text class="body" x="432" y="127">strongest model in the room:</text><text class="body" x="432" y="145">important, present daily</text><text class="small" x="432" y="163">consistency between words and outcomes</text></g><g id="node-row-2"><text class="sh" x="32" y="245">peers</text><text class="body" x="182" y="236">how work is done,</text><text class="body" x="182" y="254">how others are treated</text><text class="body" x="432" y="227">strong: similar and ever-present</text><text class="small" x="432" y="245">the classroom's visible norms,</text><text class="small" x="432" y="263">who gets attention</text></g><g id="node-row-3"><text class="sh" x="32" y="345">older pupils</text><text class="body" x="182" y="345">habits, confidence, shortcuts</text><text class="body" x="432" y="336">strong: admired and near in age</text><text class="small" x="432" y="354">what the school rewards them for</text></g><g id="node-row-4"><text class="sh" x="32" y="445">family</text><text class="body" x="182" y="436">attitudes to school,</text><text class="body" x="182" y="454">to reading, to authority</text><text class="body" x="432" y="427">strong: warm and long-standing</text><text class="small" x="432" y="445">whether school and home model</text><text class="small" x="432" y="463">the same things</text></g><g id="node-row-5"><text class="sh" x="32" y="536">screens and</text><text class="sh" x="32" y="554">stories</text><text class="body" x="182" y="536">behaviour repertoires,</text><text class="body" x="182" y="554">consequences as shown</text><text class="body" x="432" y="527">strong: vivid, repeated, engaging</text><text class="small" x="432" y="545">whether consequences are shown</text><text class="small" x="432" y="563">honestly or glamorised</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="620" text-anchor="end">textbook.com.pk</text></g></svg>
