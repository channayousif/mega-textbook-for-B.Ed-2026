<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">طرزِ عمل پسند اور ادراکی نظریوں کا جدول</title><desc id="d">تعلم کے طرزِ عمل پسند اور ادراکی نظریوں کا موازنہ کرنے والا جدول: تعلم کیا ہے، استاد کیا ترتیب دیتا ہے، ثبوت کیا شمار ہوتا ہے، اور ہر ایک کی ایک جماعتی مثال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><rect id="region-header" class="head" x="21" y="21" width="738" height="59"/><rect id="region-row-labels" class="band" x="580" y="80" width="179" height="359"/><g id="region-grid"><line class="grid" x1="580" y1="20" x2="580" y2="440"/><line class="grid" x1="300" y1="20" x2="300" y2="440"/><line class="rule" x1="760" y1="80" x2="20" y2="80"/><line class="grid" x1="760" y1="170" x2="20" y2="170"/><line class="grid" x1="760" y1="260" x2="20" y2="260"/><line class="grid" x1="760" y1="350" x2="20" y2="350"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="748" y="55" text-anchor="end">‏نظریہ‏</text><text class="sh" x="568" y="55" text-anchor="end">‏طرزِ عمل پسند‏</text><text class="sh" x="288" y="55" text-anchor="end">‏ادراکی‏</text></g><g id="node-row-1"><text class="sh" x="748" y="130" text-anchor="end">‏تعلم کیا ہے‏</text><text class="body" x="568" y="119" text-anchor="end">‏مشاہدے جانے والے‏</text><text class="body" x="568" y="141" text-anchor="end">‏رویے میں تبدیلی‏</text><text class="body" x="288" y="119" text-anchor="end">‏سوچ اور سمجھ‏</text><text class="body" x="288" y="141" text-anchor="end">‏میں تبدیلی‏</text></g><g id="node-row-2"><text class="sh" x="748" y="209" text-anchor="end">‏استاد کیا‏</text><text class="sh" x="748" y="231" text-anchor="end">‏ترتیب دیتا ہے‏</text><text class="body" x="568" y="209" text-anchor="end">‏رویے کے پیچھے آنے‏</text><text class="body" x="568" y="231" text-anchor="end">‏والے نتائج‏</text><text class="body" x="288" y="209" text-anchor="end">‏تجربے جو خاکوں سے ملتے‏</text><text class="body" x="288" y="231" text-anchor="end">‏اور انہیں دوبارہ بناتے ہیں‏</text></g><g id="node-row-3"><text class="sh" x="748" y="299" text-anchor="end">‏ثبوت کیا‏</text><text class="sh" x="748" y="321" text-anchor="end">‏شمار ہوتا ہے‏</text><text class="body" x="568" y="299" text-anchor="end">‏شاگرد کیا کر سکتا ہے،‏</text><text class="body" x="568" y="321" text-anchor="end">‏باہر سے دیکھا گیا‏</text><text class="body" x="288" y="288" text-anchor="end">‏شاگرد کیا بیان کر سکتا ہے،‏</text><text class="body" x="288" y="310" text-anchor="end">‏نئی صورت میں منتقل‏</text><text class="body" x="288" y="332" text-anchor="end">‏اور استعمال کر سکتا ہے‏</text></g><g id="node-row-4"><text class="sh" x="748" y="400" text-anchor="end">‏جماعتی مثال‏</text><text class="body" x="568" y="389" text-anchor="end">‏راشد کی بغیر غلطی‏</text><text class="body" x="568" y="411" text-anchor="end">‏والی مکمل تلاوت‏</text><text class="body" x="288" y="378" text-anchor="end">‏ثنا کی خود درست کی ہوئی‏</text><text class="body" x="288" y="400" text-anchor="end">‏تلاوت جو ایک کہانی‏</text><text class="body" x="288" y="422" text-anchor="end">‏پر ٹکی ہوئی ہے‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="470" text-anchor="start">textbook.com.pk</text></g></svg>
