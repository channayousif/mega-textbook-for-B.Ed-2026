<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خاکے کے گرد تصوری نقشہ</title><desc id="d">خاکے کو مرکز میں رکھ کر تصوری نقشہ: ہم آہنگی نیا تجربہ خاکے میں فٹ کرتی ہے اور مطابقت خاکے کو بدلتی ہے، اوپر پیاژے کا فریم، نیچے برنر کی نمائندگی کے تین انداز: عملی، تصویری، علامتی: تدریسی ترتیب میں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-piaget-schema" class="link" x1="390" y1="60" x2="390" y2="100"/><path id="edge-schema-assimilation" class="stroke" d="M460 140 C540 140 620 140 620 180" marker-end="url(#arrow)"/><path id="edge-schema-accommodation" class="stroke" d="M320 140 C240 140 160 140 160 180" marker-end="url(#arrow)"/><line id="edge-enactive-iconic" class="stroke" x1="540" y1="430" x2="500" y2="430" marker-end="url(#arrow)"/><line id="edge-iconic-symbolic" class="stroke" x1="280" y1="430" x2="240" y2="430" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-piaget"><rect class="panel" x="140" y="20" width="500" height="40" rx="8"/><text class="h" x="390" y="46" text-anchor="middle">‏پیاژے: تعلم بطور سوچ کی دوبارہ تنظیم‏</text></g><g id="node-schema"><ellipse class="panel-a" cx="390" cy="140" rx="70" ry="40"/><text class="h" x="390" y="146" text-anchor="middle">‏خاکہ‏</text></g><g id="node-assimilation"><rect class="frame" x="480" y="180" width="280" height="180" rx="8"/><text class="h" x="744" y="208" text-anchor="end">‏ہم آہنگی‏</text><text class="body" x="744" y="234" text-anchor="end">‏نیا تجربہ موجود‏</text><text class="body" x="744" y="254" text-anchor="end">‏خاکے میں فٹ ہونا‏</text><text class="small" x="744" y="282" text-anchor="end">‏بچہ ہر چار پیروں والے‏</text><text class="small" x="744" y="302" text-anchor="end">‏جانور کو بلی کہتا، کتے سے‏</text><text class="small" x="744" y="322" text-anchor="end">‏ملتا ہے اور اسے بلی‏</text><text class="small" x="744" y="342" text-anchor="end">‏میں فائل کرتا ہے‏</text></g><g id="node-accommodation"><rect class="frame" x="20" y="180" width="280" height="180" rx="8"/><text class="h" x="284" y="208" text-anchor="end">‏مطابقت‏</text><text class="body" x="284" y="234" text-anchor="end">‏خاکہ بدل جاتا ہے تاکہ‏</text><text class="body" x="284" y="254" text-anchor="end">‏نیا تجربہ فٹ ہو‏</text><text class="small" x="284" y="282" text-anchor="end">‏بچہ کتے کو بلی سے الگ‏</text><text class="small" x="284" y="302" text-anchor="end">‏کرتا اور قسم دوبارہ‏</text><text class="small" x="284" y="322" text-anchor="end">‏بناتا ہے‏</text></g><g id="node-enactive"><rect class="panel-b" x="540" y="400" width="220" height="60" rx="8"/><text class="sh" x="650" y="424" text-anchor="middle">‏برنر: عملی‏</text><text class="body" x="650" y="446" text-anchor="middle">‏(کر کے)‏</text></g><g id="node-iconic"><rect class="panel-b" x="280" y="400" width="220" height="60" rx="8"/><text class="sh" x="390" y="424" text-anchor="middle">‏برنر: تصویری‏</text><text class="body" x="390" y="446" text-anchor="middle">‏(دیکھ کر)‏</text></g><g id="node-symbolic"><rect class="panel-b" x="20" y="400" width="220" height="60" rx="8"/><text class="sh" x="130" y="424" text-anchor="middle">‏برنر: علامتی‏</text><text class="body" x="130" y="446" text-anchor="middle">‏(اس کی علامت سے)‏</text></g></g><g id="layer-labels"><text class="sh" x="390" y="388" text-anchor="middle">‏تدریس کی ترتیب یہی ہونی چاہئے‏</text><text class="small" x="390" y="488" text-anchor="middle">‏کرنا، پھر دیکھنا، پھر علامتیں استعمال کرنا‏</text><text aria-hidden="true" class="wm" x="12" y="510" text-anchor="start">textbook.com.pk</text></g></svg>
