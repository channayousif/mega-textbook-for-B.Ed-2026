<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خاکے کے گرد تصوری نقشہ</title><desc id="d">خاکے کو مرکز میں رکھ کر تصوری نقشہ: ہم آہنگی نیا تجربہ خاکے میں فٹ کرتی ہے اور مطابقت خاکے کو بدلتی ہے، اوپر پیاژے کا فریم، نیچے برنر کی نمائندگی کے تین انداز: عملی، تصویری، علامتی: تدریسی ترتیب میں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:11.5px;fill:var(--ink)}.ah{fill:var(--ink)}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780.0 0.0 L 770.0 5.0 L 780.0 10.0 z" class="ah"/></marker></defs><rect class="panel" x="214.0" y="18" width="352" height="45" rx="9"/><text class="h" x="390.0" y="47" text-anchor="middle">پیاژے: تعلم بطور سوچ کی دوبارہ تنظیم</text><path class="stroke" d="M 390.0 63.0 L 390.0 127.0" stroke-dasharray="6 5"/><rect class="panel-a" x="509.0" y="94" width="249" height="151" rx="12"/><text class="h" x="741.0" y="122" text-anchor="end">ہم آہنگی</text><text class="body" x="741.0" y="148" text-anchor="end">نیا تجربہ موجود</text><text class="body" x="741.0" y="168" text-anchor="end">خاکے میں فٹ ہونا</text><text class="body" x="741.0" y="195" text-anchor="end">بچہ ہر چار پیروں والے</text><text class="body" x="741.0" y="213" text-anchor="end">جانور کو بلی کہتا، کتے سے ملتا ہے</text><text class="body" x="741.0" y="231" text-anchor="end">اور اسے بلی میں فائل کرتا ہے</text><rect class="panel-b" x="22.0" y="94" width="249" height="151" rx="12"/><text class="h" x="254.0" y="122" text-anchor="end">مطابقت</text><text class="body" x="254.0" y="148" text-anchor="end">خاکہ بدل جاتا ہے تاکہ</text><text class="body" x="254.0" y="168" text-anchor="end">نیا تجربہ فٹ ہو</text><text class="body" x="254.0" y="195" text-anchor="end">بچہ کتے کو بلی سے الگ</text><text class="body" x="254.0" y="213" text-anchor="end">کرتا اور قسم دوبارہ بناتا ہے</text><ellipse class="panel-a" cx="390" cy="174" rx="89" ry="47"/><text class="h" x="390.0" y="180" text-anchor="middle">خاکہ</text><path class="stroke" d="M 478.0 169.0 C 491.0 147.0 499.0 145.0 509.0 145.0" marker-end="url(#arrow)"/><path class="stroke" d="M 302.0 169.0 C 289.0 147.0 281.0 145.0 271.0 145.0" marker-end="url(#arrow)"/><path class="stroke" d="M 390.0 221.0 L 390.0 300.0" stroke-dasharray="6 5"/><text class="sh" x="390.0" y="318" text-anchor="middle">تدریس کی ترتیب یہی ہونی چاہئے</text><rect class="panel-c" x="540.0" y="333" width="218" height="67" rx="9"/><text class="sh" x="649.0" y="361" text-anchor="middle">برنر: عملی</text><text class="body" x="649.0" y="383" text-anchor="middle">(کر کے)</text><rect class="panel-c" x="281.0" y="333" width="218" height="67" rx="9"/><text class="sh" x="390.0" y="361" text-anchor="middle">برنر: تصویری</text><text class="body" x="390.0" y="383" text-anchor="middle">(دیکھ کر)</text><rect class="panel-c" x="22.0" y="333" width="218" height="67" rx="9"/><text class="sh" x="131.0" y="361" text-anchor="middle">برنر: علامتی</text><text class="body" x="131.0" y="383" text-anchor="middle">(اس کی علامت سے)</text><path class="stroke" d="M 540.0 367.0 L 499.0 367.0" marker-end="url(#arrow)"/><path class="stroke" d="M 281.0 367.0 L 240.0 367.0" marker-end="url(#arrow)"/><text class="small" x="390.0" y="421" text-anchor="middle">کرنا، پھر دیکھنا، پھر علامتیں استعمال کرنا</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
