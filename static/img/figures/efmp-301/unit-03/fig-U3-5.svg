<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the behaviourist and cognitive views of learning</title><desc id="d">A table comparing the behaviourist and cognitive views of learning on what learning is, what the teacher arranges, what counts as evidence, and a classroom instance of each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="stroke" x="24" y="22" width="732" height="388" rx="8"/><rect class="panel" x="24" y="22" width="168" height="48" rx="7"/><rect class="panel-a" x="192" y="22" width="268" height="48" rx="7"/><rect class="panel-b" x="460" y="22" width="296" height="48" rx="7"/><line class="grid" x1="192" y1="70" x2="192" y2="410"/><line class="grid" x1="460" y1="70" x2="460" y2="410"/><line class="grid" x1="24" y1="155" x2="756" y2="155"/><line class="grid" x1="24" y1="240" x2="756" y2="240"/><line class="grid" x1="24" y1="325" x2="756" y2="325"/><line class="stroke-a" x1="212" y1="61" x2="440" y2="61"/><line class="stroke-a" x1="480" y1="61" x2="736" y2="61" stroke="var(--a2)"/><text class="h" x="108" y="52" text-anchor="middle">the view</text><text class="h" x="326" y="52" text-anchor="middle">behaviourist</text><text class="h" x="608" y="52" text-anchor="middle">cognitive</text><text class="sh" x="108" y="117" text-anchor="middle">what learning is</text><text class="body" x="326" y="109" text-anchor="middle">a change in observable<tspan x="326" dy="17">behaviour</tspan></text><text class="body" x="608" y="109" text-anchor="middle">a change in thinking<tspan x="608" dy="17">and understanding</tspan></text><text class="sh" x="108" y="185" text-anchor="middle">what the teacher<tspan x="108" dy="17">arranges</tspan></text><text class="body" x="326" y="194" text-anchor="middle">consequences that<tspan x="326" dy="17">follow behaviour</tspan></text><text class="body" x="608" y="194" text-anchor="middle">experiences that meet<tspan x="608" dy="17">and rebuild schemas</tspan></text><text class="sh" x="108" y="270" text-anchor="middle">what counts as<tspan x="108" dy="17">evidence</tspan></text><text class="body" x="326" y="279" text-anchor="middle">what the pupil can do,<tspan x="326" dy="17">seen from outside</tspan></text><text class="body" x="608" y="270" text-anchor="middle">what the pupil can explain,<tspan x="608" dy="17">transfer and use in a new</tspan><tspan x="608" dy="17">situation</tspan></text><text class="sh" x="108" y="355" text-anchor="middle">a classroom<tspan x="108" dy="17">instance</tspan></text><text class="body" x="326" y="364" text-anchor="middle">Rashid's letter-perfect<tspan x="326" dy="17">recitation</tspan></text><text class="body" x="608" y="355" text-anchor="middle">Sana's self-corrected<tspan x="608" dy="17">recitation hanging</tspan><tspan x="608" dy="17">on a story</tspan></text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
