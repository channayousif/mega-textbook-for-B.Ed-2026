<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعمیدیت کا تصوری نقشہ</title><desc id="d">تعمیریت کا تصوری نقشہ، چار دعووں کے ساتھ مرکز میں، نفسیاتی تعمیریت (فرد تجربے کو منظم کرتا ہے) اور سماجی تعمیریت (سمجھ مدد سے بنتی ہے) سے جڑا، قریبی نشوونما کے علاقے اور معاونتی تدریس کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-constructivism-claim-1" class="link" d="M490 240 C510 240 520 60 540 60"/><path id="edge-constructivism-claim-2" class="link" d="M490 240 C510 240 520 180 540 180"/><path id="edge-constructivism-claim-3" class="link" d="M490 240 C510 240 520 300 540 300"/><path id="edge-constructivism-claim-4" class="link" d="M490 240 C510 240 520 420 540 420"/><path id="edge-constructivism-psychological" class="link" d="M330 240 C290 240 300 80 260 80"/><path id="edge-constructivism-social" class="link" d="M330 240 L260 240"/><path id="edge-social-zpd" class="link" d="M200 300 V330 H380 V360"/><line id="edge-social-scaffolding" class="link" x1="140" y1="300" x2="140" y2="360"/></g><g id="layer-nodes"><g id="node-constructivism"><ellipse class="panel-a" cx="410" cy="240" rx="80" ry="40"/><text class="h" x="410" y="246" text-anchor="middle">‏تعمیریت‏</text></g><g id="node-claim-1"><rect class="frame" x="540" y="20" width="220" height="80" rx="8"/><text class="body" x="650" y="45" text-anchor="middle">‏سیکھنے والا سمجھ‏</text><text class="body" x="650" y="65" text-anchor="middle">‏خود بناتا ہے، یہ‏</text><text class="body" x="650" y="85" text-anchor="middle">‏پہنچائی نہیں جاتی‏</text></g><g id="node-claim-2"><rect class="frame" x="540" y="140" width="220" height="80" rx="8"/><text class="body" x="650" y="175" text-anchor="middle">‏پچھلا علم‏</text><text class="body" x="650" y="195" text-anchor="middle">‏تعمیر کا سامان ہے‏</text></g><g id="node-claim-3"><rect class="frame" x="540" y="260" width="220" height="80" rx="8"/><text class="body" x="650" y="295" text-anchor="middle">‏سرگرمی اور بات چیت‏</text><text class="body" x="650" y="315" text-anchor="middle">‏آلے ہیں‏</text></g><g id="node-claim-4"><rect class="frame" x="540" y="380" width="220" height="80" rx="8"/><text class="body" x="650" y="415" text-anchor="middle">‏استاد جگہ کا‏</text><text class="body" x="650" y="435" text-anchor="middle">‏ڈیزائن کرتا ہے‏</text></g><g id="node-psychological"><rect class="panel" x="20" y="20" width="240" height="120" rx="8"/><text class="sh" x="140" y="65" text-anchor="middle">‏نفسیاتی تعمیریت‏</text><text class="body" x="140" y="85" text-anchor="middle">‏فرد تجربے کو‏</text><text class="body" x="140" y="105" text-anchor="middle">‏منظم کرتا ہے (پیاژے)‏</text></g><g id="node-social"><rect class="panel" x="20" y="180" width="240" height="120" rx="8"/><text class="sh" x="140" y="225" text-anchor="middle">‏سماجی تعمیریت‏</text><text class="body" x="140" y="245" text-anchor="middle">‏سمجھ مدد سے بنتی ہے‏</text><text class="body" x="140" y="265" text-anchor="middle">‏(ویگوٹسکی، برنر)‏</text></g><g id="node-zpd"><rect class="panel-b" x="280" y="360" width="200" height="140" rx="8"/><text class="sh" x="380" y="395" text-anchor="middle">‏قریبی نشوونما‏</text><text class="sh" x="380" y="415" text-anchor="middle">‏کا علاقہ‏</text><text class="body" x="380" y="435" text-anchor="middle">‏شاگرد مدد سے کر‏</text><text class="body" x="380" y="455" text-anchor="middle">‏سکتا ہے مگر اکیلے‏</text><text class="body" x="380" y="475" text-anchor="middle">‏ابھی نہیں‏</text></g><g id="node-scaffolding"><rect class="panel-b" x="40" y="360" width="200" height="140" rx="8"/><text class="sh" x="140" y="405" text-anchor="middle">‏معاونتی تدریس‏</text><text class="body" x="140" y="425" text-anchor="middle">‏عارضی سہارا، ہٹایا‏</text><text class="body" x="140" y="445" text-anchor="middle">‏جاتا ہے جب عمارت‏</text><text class="body" x="140" y="465" text-anchor="middle">‏کھڑی ہو جائے‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="530" text-anchor="start">textbook.com.pk</text></g></svg>
