<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعمیدیت کا تصوری نقشہ</title><desc id="d">تعمیدیت کا تصوری نقشہ اس کے چار دعووں کے ساتھ مرکز میں، نفسیاتی تعمیدیت (فرد تجربے کو منظم کرتا ہے) اور سماجی تعمیدیت (سمجھ مدد سے بنتی ہے) سے جڑا، قریبی نشوونما کے علاقے اور باوری تعمیر کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:11.5px;fill:var(--ink)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.attach{stroke:var(--a3);stroke-width:2;fill:none}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><g class="stroke-a"><path d="M 547.0 59.0 L 520.0 190.0"/><path d="M 547.0 150.0 L 520.0 208.0"/><path d="M 547.0 246.0 L 520.0 238.0"/><path d="M 654.0 361.0 L 480.0 277.0"/><path d="M 305.0 200.0 L 270.0 81.0"/><path d="M 305.0 242.0 L 270.0 225.0"/></g><g class="attach"><path d="M 160.0 275.0 L 390.0 336.0"/><path d="M 130.0 275.0 L 140.0 336.0"/></g><rect class="panel" x="547.0" y="26" width="215" height="66" rx="7"/><text x="654.5" y="51" text-anchor="middle" class="body">سیکھنے والا سمجھ</text><text x="654.5" y="69" text-anchor="middle" class="body">خود بناتا ہے، یہ پہنچائی نہیں جاتی</text><rect class="panel" x="547.0" y="120" width="215" height="60" rx="7"/><text x="654.5" y="145" text-anchor="middle" class="body">پچھلا علم</text><text x="654.5" y="163" text-anchor="middle" class="body">تعمیر کا سامان ہے</text><rect class="panel" x="547.0" y="216" width="215" height="60" rx="7"/><text x="654.5" y="241" text-anchor="middle" class="body">سرگرمی اور بات چیت</text><text x="654.5" y="259" text-anchor="middle" class="body">آلے ہیں</text><rect class="panel" x="542.0" y="361" width="220" height="54" rx="7"/><text x="652.0" y="385" text-anchor="middle" class="body">استاد جگہ کا</text><text x="652.0" y="403" text-anchor="middle" class="body">ڈیزائن کرتا ہے</text><rect class="core" x="305.0" y="173" width="215" height="104" rx="52"/><text x="412.5" y="232" text-anchor="middle" class="h">تعمیدیت</text><rect class="panel-b" x="20.0" y="26" width="250" height="110" rx="7"/><text x="145.0" y="53" text-anchor="middle" class="sh">نفسیاتی تعمیدیت</text><text x="145.0" y="77" text-anchor="middle" class="body">فرد تجربے کو</text><text x="145.0" y="95" text-anchor="middle" class="body">منظم کرتا ہے (پیاژے)</text><rect class="panel-b" x="20.0" y="175" width="250" height="100" rx="7"/><text x="145.0" y="202" text-anchor="middle" class="sh">سماجی تعمیدیت</text><text x="145.0" y="226" text-anchor="middle" class="body">سمجھ مدد سے بنتی ہے</text><text x="145.0" y="244" text-anchor="middle" class="body">(ویگوٹسکی، برنر)</text><rect class="panel-c" x="270.0" y="336" width="242" height="92" rx="7"/><text x="391.0" y="362" text-anchor="middle" class="sh">قریبی نشوونما کا علاقہ</text><text x="391.0" y="387" text-anchor="middle" class="body">شاگرد مدد سے کر سکتا ہے</text><text x="391.0" y="405" text-anchor="middle" class="body">مگر اکیلے ابھی نہیں</text><rect class="panel-c" x="18.0" y="336" width="242" height="92" rx="7"/><text x="139.0" y="362" text-anchor="middle" class="sh">باوری تعمیر</text><text x="139.0" y="387" text-anchor="middle" class="body">عارضی سہارا، ہٹایا جاتا ہے</text><text x="139.0" y="405" text-anchor="middle" class="body">جب عمارت کھڑی ہو جائے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
