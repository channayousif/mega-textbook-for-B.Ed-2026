<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 630" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نمونوں کے پانچ ذرائع کا جدول</title><desc id="d">نمونوں کے پانچ ذرائع کا جدول: استاد، ساتھی، بڑے شاگرد، خاندان، اور اسکرینیں اور کہانیاں: ہر ایک کے ساتھ کیا نمونہ بنایا جا رہا ہے اور کیا نمونہ سازی کو مضبوط یا کمزور کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="630"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="570"/><rect id="region-header" class="head" x="21" y="21" width="738" height="69"/><rect id="region-row-labels" class="band" x="610" y="90" width="149" height="499"/><g id="region-grid"><line class="grid" x1="610" y1="20" x2="610" y2="590"/><line class="grid" x1="360" y1="20" x2="360" y2="590"/><line class="rule" x1="760" y1="90" x2="20" y2="90"/><line class="grid" x1="760" y1="190" x2="20" y2="190"/><line class="grid" x1="760" y1="290" x2="20" y2="290"/><line class="grid" x1="760" y1="390" x2="20" y2="390"/><line class="grid" x1="760" y1="490" x2="20" y2="490"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="748" y="60" text-anchor="end">‏نمونہ کون ہے‏</text><text class="sh" x="598" y="50" text-anchor="end">‏کیا نمونہ‏</text><text class="sh" x="598" y="70" text-anchor="end">‏بنایا جا رہا ہے‏</text><text class="sh" x="348" y="50" text-anchor="end">‏کیا نمونہ سازی کو‏</text><text class="sh" x="348" y="70" text-anchor="end">‏مضبوط یا کمزور کرتا ہے‏</text></g><g id="node-row-1"><text class="sh" x="748" y="145" text-anchor="end">‏استاد‏</text><text class="body" x="598" y="135" text-anchor="end">‏غلطیوں، سوالوں اور‏</text><text class="body" x="598" y="155" text-anchor="end">‏محنت کے ساتھ کیا ہوتا ہے‏</text><text class="body" x="348" y="125" text-anchor="end">‏کمرے کا سب سے مضبوط نمونہ:‏</text><text class="body" x="348" y="145" text-anchor="end">‏اہم، روزانہ موجود‏</text><text class="small" x="348" y="165" text-anchor="end">‏الفاظ اور نتائج میں ہم آہنگی‏</text></g><g id="node-row-2"><text class="sh" x="748" y="245" text-anchor="end">‏ساتھی‏</text><text class="body" x="598" y="235" text-anchor="end">‏کام کیسے ہوتا ہے،‏</text><text class="body" x="598" y="255" text-anchor="end">‏دوسروں کے ساتھ کیسا ہوتا ہے‏</text><text class="body" x="348" y="225" text-anchor="end">‏مضبوط: مماثل اور ہمیشہ حاضر‏</text><text class="small" x="348" y="245" text-anchor="end">‏جماعت کے دکھنے والے اصول،‏</text><text class="small" x="348" y="265" text-anchor="end">‏کسے توجہ ملتی ہے‏</text></g><g id="node-row-3"><text class="sh" x="748" y="345" text-anchor="end">‏بڑے شاگرد‏</text><text class="body" x="598" y="345" text-anchor="end">‏عادتیں، اعتماد، آسان راستے‏</text><text class="body" x="348" y="335" text-anchor="end">‏مضبوط: قابلِ تعریف اور عمر میں قریب‏</text><text class="small" x="348" y="355" text-anchor="end">‏اسکول انہیں کس چیز کا انعام دیتا ہے‏</text></g><g id="node-row-4"><text class="sh" x="748" y="445" text-anchor="end">‏خاندان‏</text><text class="body" x="598" y="435" text-anchor="end">‏اسکول، مطالعے، اختیار کے‏</text><text class="body" x="598" y="455" text-anchor="end">‏بارے میں رویے‏</text><text class="body" x="348" y="425" text-anchor="end">‏مضبوط: شفیق اور پرانا‏</text><text class="small" x="348" y="445" text-anchor="end">‏کیا اسکول اور گھر وہی چیز‏</text><text class="small" x="348" y="465" text-anchor="end">‏نمونہ بناتے ہیں‏</text></g><g id="node-row-5"><text class="sh" x="748" y="535" text-anchor="end">‏اسکرینیں اور‏</text><text class="sh" x="748" y="555" text-anchor="end">‏کہانیاں‏</text><text class="body" x="598" y="535" text-anchor="end">‏رویے کے ذخیرے،‏</text><text class="body" x="598" y="555" text-anchor="end">‏دکھائے گئے نتائج‏</text><text class="body" x="348" y="525" text-anchor="end">‏مضبوط: واضح، دہرایا ہوا، دلچسپ‏</text><text class="small" x="348" y="545" text-anchor="end">‏کیا نتائج ایمانداری سے دکھائے‏</text><text class="small" x="348" y="565" text-anchor="end">‏جاتے ہیں یا چمکا کر‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="620" text-anchor="start">textbook.com.pk</text></g></svg>
