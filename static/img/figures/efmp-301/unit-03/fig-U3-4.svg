<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map with schema at the centre, assimilation fitting new experience into the schema and accommodation changing the schema</title><desc id="d">A concept map with schema at the centre, assimilation fitting new experience into the schema and accommodation changing the schema, above Piaget's framing, and below Bruner's three modes of representation - enactive, iconic, symbolic - in teaching order.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-piaget-schema" class="link" x1="390" y1="60" x2="390" y2="100"/><path id="edge-schema-assimilation" class="stroke" d="M320 140 C240 140 160 140 160 180" marker-end="url(#arrow)"/><path id="edge-schema-accommodation" class="stroke" d="M460 140 C540 140 620 140 620 180" marker-end="url(#arrow)"/><line id="edge-enactive-iconic" class="stroke" x1="240" y1="430" x2="280" y2="430" marker-end="url(#arrow)"/><line id="edge-iconic-symbolic" class="stroke" x1="500" y1="430" x2="540" y2="430" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-piaget"><rect class="panel" x="140" y="20" width="500" height="40" rx="8"/><text class="h" x="390" y="46" text-anchor="middle">Piaget: learning as reorganising thinking</text></g><g id="node-schema"><ellipse class="panel-a" cx="390" cy="140" rx="70" ry="40"/><text class="h" x="390" y="146" text-anchor="middle">schema</text></g><g id="node-assimilation"><rect class="frame" x="20" y="180" width="280" height="180" rx="8"/><text class="h" x="36" y="208">assimilation</text><text class="body" x="36" y="234">new experience fitted into</text><text class="body" x="36" y="254">the existing schema</text><text class="small" x="36" y="282">child calls every</text><text class="small" x="36" y="302">four-legged animal a cat,</text><text class="small" x="36" y="322">meets a dog and files it</text><text class="small" x="36" y="342">under cat</text></g><g id="node-accommodation"><rect class="frame" x="480" y="180" width="280" height="180" rx="8"/><text class="h" x="496" y="208">accommodation</text><text class="body" x="496" y="234">the schema changes to fit</text><text class="body" x="496" y="254">the new experience</text><text class="small" x="496" y="282">child separates dog from</text><text class="small" x="496" y="302">cat and rebuilds the</text><text class="small" x="496" y="322">category</text></g><g id="node-enactive"><rect class="panel-b" x="20" y="400" width="220" height="60" rx="8"/><text class="sh" x="130" y="424" text-anchor="middle">Bruner: enactive</text><text class="body" x="130" y="446" text-anchor="middle">(doing it)</text></g><g id="node-iconic"><rect class="panel-b" x="280" y="400" width="220" height="60" rx="8"/><text class="sh" x="390" y="424" text-anchor="middle">Bruner: iconic</text><text class="body" x="390" y="446" text-anchor="middle">(seeing it)</text></g><g id="node-symbolic"><rect class="panel-b" x="540" y="400" width="220" height="60" rx="8"/><text class="sh" x="650" y="424" text-anchor="middle">Bruner: symbolic</text><text class="body" x="650" y="446" text-anchor="middle">(the sign for it)</text></g></g><g id="layer-labels"><text class="sh" x="390" y="388" text-anchor="middle">the order teaching should follow</text><text class="small" x="390" y="488" text-anchor="middle">doing, then seeing, then using signs</text><text aria-hidden="true" class="wm" x="768" y="510" text-anchor="end">textbook.com.pk</text></g></svg>
