<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار نظریاتی خاندانوں کا جدول</title><desc id="d">چار نظریاتی خاندانوں کا موازنہ کرنے والا جدول: طرزِ عمل پسندی، ادراکی، سماجی تعلم اور تعمیریت: تعلم کیا ہے، استاد کا کام کیا ہے، اور ہر ایک کیا چھوڑتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><rect id="region-header" class="head" x="21" y="21" width="738" height="59"/><rect id="region-row-labels" class="band" x="600" y="80" width="159" height="359"/><g id="region-grid"><line class="grid" x1="600" y1="20" x2="600" y2="440"/><line class="grid" x1="430" y1="20" x2="430" y2="440"/><line class="grid" x1="200" y1="20" x2="200" y2="440"/><line class="rule" x1="760" y1="80" x2="20" y2="80"/><line class="grid" x1="760" y1="170" x2="20" y2="170"/><line class="grid" x1="760" y1="260" x2="20" y2="260"/><line class="grid" x1="760" y1="350" x2="20" y2="350"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="732" y="55" text-anchor="end">‏نظریاتی خاندان‏</text><text class="sh" x="588" y="55" text-anchor="end">‏تعلم کیا ہے‏</text><text class="sh" x="418" y="55" text-anchor="end">‏استاد کا کام‏</text><text class="sh" x="188" y="55" text-anchor="end">‏کیا چھوڑتی ہے‏</text></g><g id="node-row-1"><text class="sh" x="732" y="130" text-anchor="end">‏سلوکیات‏</text><text class="cell" x="588" y="119" text-anchor="end">‏مشاہدے جانے والے‏</text><text class="cell" x="588" y="141" text-anchor="end">‏رویے میں تبدیلی‏</text><text class="cell" x="418" y="119" text-anchor="end">‏ایسے نتائج ترتیب دیں جو‏</text><text class="cell" x="418" y="141" text-anchor="end">‏مانگا ہوا رویہ سکھائیں‏</text><text class="cell" x="188" y="119" text-anchor="end">‏سمجھ، مطلب،‏</text><text class="cell" x="188" y="141" text-anchor="end">‏سر کے اندر کی چیز‏</text></g><g id="node-row-2"><text class="sh" x="732" y="220" text-anchor="end">‏ادراکی‏</text><text class="cell" x="588" y="209" text-anchor="end">‏سوچ میں تبدیلی،‏</text><text class="cell" x="588" y="231" text-anchor="end">‏خاکے دوبارہ بننا‏</text><text class="cell" x="418" y="198" text-anchor="end">‏تجربے کی ترتیب: عملی سے‏</text><text class="cell" x="418" y="220" text-anchor="end">‏تصویری سے علامتی؛‏</text><text class="cell" x="418" y="242" text-anchor="end">‏پچھلے خاکوں سے ملیں‏</text><text class="cell" x="188" y="209" text-anchor="end">‏وہ سماجی ماحول جہاں‏</text><text class="cell" x="188" y="231" text-anchor="end">‏تعلم ہوتی ہے‏</text></g><g id="node-row-3"><text class="sh" x="732" y="310" text-anchor="end">‏سماجی تعلم‏</text><text class="cell" x="588" y="299" text-anchor="end">‏مشاہدے سے‏</text><text class="cell" x="588" y="321" text-anchor="end">‏تبدیلی‏</text><text class="cell" x="418" y="288" text-anchor="end">‏جان بوجھ کر نمونہ بنیں،‏</text><text class="cell" x="418" y="310" text-anchor="end">‏توجہ اور اس کے نتائج‏</text><text class="cell" x="418" y="332" text-anchor="end">‏نشانہ بنائیں‏</text><text class="cell" x="188" y="299" text-anchor="end">‏جو تعمیر ہوتا ہے،‏</text><text class="cell" x="188" y="321" text-anchor="end">‏صرف نقل نہیں‏</text></g><g id="node-row-4"><text class="sh" x="732" y="400" text-anchor="end">‏تعمیریت‏</text><text class="cell" x="588" y="389" text-anchor="end">‏سمجھ سیکھنے والا‏</text><text class="cell" x="588" y="411" text-anchor="end">‏مدد سے بناتا ہے‏</text><text class="cell" x="418" y="378" text-anchor="end">‏کام ڈیزائن کریں، معاونتی‏</text><text class="cell" x="418" y="400" text-anchor="end">‏تدریس علاقے میں رکھیں‏</text><text class="cell" x="418" y="422" text-anchor="end">‏اور ہٹائیں‏</text><text class="cell" x="188" y="378" text-anchor="end">‏سست، ساٹھ شاگردوں‏</text><text class="cell" x="188" y="400" text-anchor="end">‏اور نصاب کی گھڑی‏</text><text class="cell" x="188" y="422" text-anchor="end">‏کے ساتھ مشکل‏</text></g></g><g id="layer-labels"><text class="small" x="746" y="102" text-anchor="middle">1</text><text class="small" x="746" y="192" text-anchor="middle">2</text><text class="small" x="746" y="282" text-anchor="middle">3</text><text class="small" x="746" y="372" text-anchor="middle">4</text><text aria-hidden="true" class="wm" x="12" y="470" text-anchor="start">textbook.com.pk</text></g></svg>
