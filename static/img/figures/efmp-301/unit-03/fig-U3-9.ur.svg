<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار نظریاتی خاندانوں کا جدول</title><desc id="d">چار نظریاتی خاندانوں کا موازنہ کرنے والا جدول: سلوکیات، ادراکی، سماجی تعلم اور تعمیدیت: تعلم کیا ہے، استاد کا کام کیا ہے، اور ہر ایک کیا چھوڑتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:11.5px;fill:var(--ink)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><rect class="panel" x="12.0" y="16" width="756" height="402" rx="8"/><rect class="bg" x="14.0" y="74" width="752" height="342"/><line class="grid" x1="630.0" y1="16" x2="630.0" y2="418"/><line class="grid" x1="457.0" y1="16" x2="457.0" y2="418"/><line class="grid" x1="227.0" y1="16" x2="227.0" y2="418"/><line class="grid" x1="768.0" y1="74" x2="12.0" y2="74"/><line class="grid" x1="768.0" y1="160" x2="12.0" y2="160"/><line class="grid" x1="768.0" y1="246" x2="12.0" y2="246"/><line class="grid" x1="768.0" y1="332" x2="12.0" y2="332"/><line class="stroke-a" x1="751.0" y1="64" x2="647.0" y2="64"/><line class="stroke-a" x1="613.0" y1="64" x2="474.0" y2="64"/><line class="stroke-a" x1="440.0" y1="64" x2="244.0" y2="64"/><line class="stroke-a" x1="210.0" y1="64" x2="29.0" y2="64"/><text class="h ink" x="699.0" y="43" text-anchor="middle">نظریاتی خاندان</text><text class="h ink" x="544.0" y="43" text-anchor="middle">تعلیم کیا ہے</text><text class="h ink" x="342.0" y="43" text-anchor="middle">استاد کا کام</text><text class="h ink" x="119.0" y="43" text-anchor="middle">کیا چھوڑتی ہے</text><circle class="stroke" cx="748.0" cy="99" r="11"/><text class="small muted" x="748.0" y="104" text-anchor="middle">1</text><text class="sh" x="730.0" y="96" text-anchor="end">سلوکیات</text><text class="body" x="616.0" y="96" text-anchor="end">مشاہدے جانے والے</text><text class="body" x="616.0" y="113" text-anchor="end">روے میں تبدیلی</text><text class="body" x="443.0" y="96" text-anchor="end">ایسے نتائج ترتیب دیں جو</text><text class="body" x="443.0" y="113" text-anchor="end">مانگا ہوا رویہ سکھائیں</text><text class="body" x="213.0" y="96" text-anchor="end">سمجھ، مطلب،</text><text class="body" x="213.0" y="113" text-anchor="end">سر کے اندر کی چیز</text><circle class="stroke" cx="748.0" cy="185" r="11"/><text class="small muted" x="748.0" y="190" text-anchor="middle">2</text><text class="sh" x="730.0" y="182" text-anchor="end">ادراکی</text><text class="body" x="616.0" y="182" text-anchor="end">سوچ میں تبدیلی،</text><text class="body" x="616.0" y="199" text-anchor="end">خاکے دوبارہ بننا</text><text class="body" x="443.0" y="174" text-anchor="end">تجربے کی ترتیب: عملی سے</text><text class="body" x="443.0" y="191" text-anchor="end">تصویری سے علامتی؛</text><text class="body" x="443.0" y="208" text-anchor="end">پچھلے خاکوں سے ملیں</text><text class="body" x="213.0" y="182" text-anchor="end">وہ سماجی ماحول جہاں</text><text class="body" x="213.0" y="199" text-anchor="end">تعلیم ہوتی ہے</text><circle class="stroke" cx="748.0" cy="271" r="11"/><text class="small muted" x="748.0" y="276" text-anchor="middle">3</text><text class="sh" x="730.0" y="268" text-anchor="end">سماجی تعلم</text><text class="body" x="616.0" y="268" text-anchor="end">مشاہدے سے</text><text class="body" x="616.0" y="285" text-anchor="end">تبدیلی</text><text class="body" x="443.0" y="260" text-anchor="end">جان بوجھ کر نمونہ بنیں، توجہ اور</text><text class="body" x="443.0" y="277" text-anchor="end">اس کے نتائج نشانہ بنائیں</text><text class="body" x="213.0" y="268" text-anchor="end">جو تعمیر ہوتا ہے،</text><text class="body" x="213.0" y="285" text-anchor="end">صرف نقل نہیں</text><circle class="stroke" cx="748.0" cy="357" r="11"/><text class="small muted" x="748.0" y="362" text-anchor="middle">4</text><text class="sh" x="730.0" y="354" text-anchor="end">تعمیدیت</text><text class="body" x="616.0" y="346" text-anchor="end">سمجھ سیکھنے والا</text><text class="body" x="616.0" y="363" text-anchor="end">مدد سے بناتا ہے</text><text class="body" x="443.0" y="346" text-anchor="end">کام ڈیزائن کریں، باوری تعمیر</text><text class="body" x="443.0" y="363" text-anchor="end">علاقے میں رکھیں اور ہٹائیں</text><text class="body" x="213.0" y="346" text-anchor="end">سست، ساٹھ شاگردوں اور نصاب</text><text class="body" x="213.0" y="363" text-anchor="end">کی گھڑی کے ساتھ مشکل</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
