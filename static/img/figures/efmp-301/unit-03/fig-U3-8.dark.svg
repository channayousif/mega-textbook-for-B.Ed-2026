<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of constructivism with its four claims at the centre</title><desc id="d">A concept map of constructivism with its four claims at the centre, linked to psychological constructivism (the individual organises experience) and social constructivism (understanding is built with assistance), with the zone of proximal development and scaffolding attached.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.attach{stroke:var(--a3);stroke-width:2;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke-a"><path d="M233 59 L260 190"/><path d="M233 150 L260 208"/><path d="M233 246 L260 238"/><path d="M126 361 L300 277"/><path d="M475 200 L510 81"/><path d="M475 242 L510 225"/></g><g class="attach"><path d="M620 275 L390 336"/><path d="M650 275 L640 336"/></g><rect class="panel" x="18" y="26" width="215" height="66" rx="7"/><text x="125.5" y="51" text-anchor="middle" class="body">the learner builds</text><text x="125.5" y="69" text-anchor="middle" class="body">understanding, it is not delivered</text><rect class="panel" x="18" y="120" width="215" height="60" rx="7"/><text x="125.5" y="145" text-anchor="middle" class="body">prior knowledge is the</text><text x="125.5" y="163" text-anchor="middle" class="body">building material</text><rect class="panel" x="18" y="216" width="215" height="60" rx="7"/><text x="125.5" y="241" text-anchor="middle" class="body">activity and talk are</text><text x="125.5" y="259" text-anchor="middle" class="body">the tools</text><rect class="panel" x="18" y="361" width="220" height="54" rx="7"/><text x="128" y="385" text-anchor="middle" class="body">the teacher designs</text><text x="128" y="403" text-anchor="middle" class="body">the site</text><rect class="core" x="260" y="173" width="215" height="104" rx="52"/><text x="367.5" y="232" text-anchor="middle" class="h">constructivism</text><rect class="panel-b" x="510" y="26" width="250" height="110" rx="7"/><text x="635" y="53" text-anchor="middle" class="sh">psychological constructivism</text><text x="635" y="77" text-anchor="middle" class="body">the individual organises</text><text x="635" y="95" text-anchor="middle" class="body">experience (Piaget)</text><rect class="panel-b" x="510" y="175" width="250" height="100" rx="7"/><text x="635" y="202" text-anchor="middle" class="sh">social constructivism</text><text x="635" y="226" text-anchor="middle" class="body">understanding is built with</text><text x="635" y="244" text-anchor="middle" class="body">assistance (Vygotsky, Bruner)</text><rect class="panel-c" x="268" y="336" width="242" height="92" rx="7"/><text x="389" y="362" text-anchor="middle" class="sh">zone of proximal development</text><text x="389" y="387" text-anchor="middle" class="body">what the pupil can do with help</text><text x="389" y="405" text-anchor="middle" class="body">but not yet alone</text><rect class="panel-c" x="520" y="336" width="242" height="92" rx="7"/><text x="641" y="362" text-anchor="middle" class="sh">scaffolding</text><text x="641" y="387" text-anchor="middle" class="body">temporary support, removed</text><text x="641" y="405" text-anchor="middle" class="body">as it is stood on</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
