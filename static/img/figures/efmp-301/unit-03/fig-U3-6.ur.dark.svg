<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بینڈورا کے چار مشاہداتی تعلم قدموں کا فلو چارٹ</title><desc id="d">بینڈورا کے مشاہداتی تعلم کے چار قدموں کا فلو چارٹ: توجہ، حفظ، دہرانا اور حوصلہ: ہر ایک کی جماعتی مثال کے ساتھ، اور علم سیکھنے اور عملی کارکردگی کے فرق کا نوٹ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dashed{fill:var(--bg);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.ish{font-size:13px;font-weight:600;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-attention-attention-instance" class="link" x1="690" y1="140" x2="690" y2="180"/><line id="edge-attention-retention" class="stroke" x1="610" y1="80" x2="570" y2="80" marker-end="url(#arrow)"/><line id="edge-retention-retention-instance" class="link" x1="490" y1="140" x2="490" y2="180"/><line id="edge-retention-reproduction" class="stroke" x1="410" y1="80" x2="370" y2="80" marker-end="url(#arrow)"/><line id="edge-reproduction-reproduction-instance" class="link" x1="290" y1="140" x2="290" y2="180"/><line id="edge-reproduction-motivation" class="stroke" x1="210" y1="80" x2="170" y2="80" marker-end="url(#arrow)"/><line id="edge-motivation-motivation-instance" class="link" x1="90" y1="140" x2="90" y2="180"/></g><g id="layer-nodes"><g id="node-attention"><rect class="panel-a" x="610" y="20" width="160" height="120" rx="8"/><text class="sh" x="690" y="48" text-anchor="middle">‏۱۔ توجہ:‏</text><text class="body" x="690" y="74" text-anchor="middle">‏شاگرد نمونہ‏</text><text class="body" x="690" y="94" text-anchor="middle">‏نوٹ کرتا ہے‏</text></g><g id="node-attention-instance"><rect class="frame" x="610" y="180" width="160" height="140" rx="8"/><text class="ish" x="690" y="206" text-anchor="middle">‏جماعتی مثال‏</text><text class="small" x="690" y="234" text-anchor="middle">‏شاگرد دیکھتا ہے‏</text><text class="small" x="690" y="254" text-anchor="middle">‏استاد پہلے غلط‏</text><text class="small" x="690" y="274" text-anchor="middle">‏جواب کے ساتھ کیسے‏</text><text class="small" x="690" y="294" text-anchor="middle">‏پیش آتا ہے‏</text></g><g id="node-retention"><rect class="panel-a" x="410" y="20" width="160" height="120" rx="8"/><text class="sh" x="490" y="48" text-anchor="middle">‏۲۔ حفظ:‏</text><text class="body" x="490" y="74" text-anchor="middle">‏شاگرد دیکھی ہوئی‏</text><text class="body" x="490" y="94" text-anchor="middle">‏چیز یاد رکھتا ہے‏</text></g><g id="node-retention-instance"><rect class="frame" x="410" y="180" width="160" height="140" rx="8"/><text class="ish" x="490" y="206" text-anchor="middle">‏جماعتی مثال‏</text><text class="small" x="490" y="234" text-anchor="middle">‏یاد رکھتا ہے کہ‏</text><text class="small" x="490" y="254" text-anchor="middle">‏غلطی پر کام ہوا،‏</text><text class="small" x="490" y="274" text-anchor="middle">‏مذاق نہیں اڑایا‏</text></g><g id="node-reproduction"><rect class="panel-a" x="210" y="20" width="160" height="120" rx="8"/><text class="sh" x="290" y="48" text-anchor="middle">‏۳۔ دہرانا:‏</text><text class="body" x="290" y="74" text-anchor="middle">‏شاگرد رویہ‏</text><text class="body" x="290" y="94" text-anchor="middle">‏کر سکتا ہے‏</text></g><g id="node-reproduction-instance"><rect class="frame" x="210" y="180" width="160" height="140" rx="8"/><text class="ish" x="290" y="206" text-anchor="middle">‏جماعتی مثال‏</text><text class="small" x="290" y="234" text-anchor="middle">‏غلط جواب بغیر‏</text><text class="small" x="290" y="254" text-anchor="middle">‏چھپائے بلند‏</text><text class="small" x="290" y="274" text-anchor="middle">‏آواز سے دیتا ہے‏</text></g><g id="node-motivation"><rect class="panel-a" x="10" y="20" width="160" height="120" rx="8"/><text class="sh" x="90" y="48" text-anchor="middle">‏۴۔ حوصلہ:‏</text><text class="body" x="90" y="74" text-anchor="middle">‏نتیجہ اسے کرنے‏</text><text class="body" x="90" y="94" text-anchor="middle">‏کے قابل بناتا ہے‏</text></g><g id="node-motivation-instance"><rect class="frame" x="10" y="180" width="160" height="140" rx="8"/><text class="ish" x="90" y="206" text-anchor="middle">‏جماعتی مثال‏</text><text class="small" x="90" y="234" text-anchor="middle">‏دیکھتا ہے غلط جواب‏</text><text class="small" x="90" y="254" text-anchor="middle">‏مدد لاتا ہے،‏</text><text class="small" x="90" y="274" text-anchor="middle">‏شرم نہیں‏</text></g><g id="node-note"><rect class="panel" x="20" y="360" width="740" height="60" rx="8"/><text class="sh" x="740" y="396" text-anchor="end">‏نوٹ:‏</text><text class="body" x="696" y="396" text-anchor="end">‏توجہ و حفظ: سیکھنا؛ دہرانا و حوصلہ: کارکردگی‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="450" text-anchor="start">textbook.com.pk</text></g></svg>
