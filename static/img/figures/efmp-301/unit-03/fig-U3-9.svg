<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the four theory families</title><desc id="d">A table comparing the four theory families - behaviourism, cognitive, social learning and constructivism - on what learning is, the teacher's job, and what each misses.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="16" width="756" height="402" rx="8"/><rect class="bg" x="14" y="74" width="752" height="342"/><line class="grid" x1="150" y1="16" x2="150" y2="418"/><line class="grid" x1="323" y1="16" x2="323" y2="418"/><line class="grid" x1="553" y1="16" x2="553" y2="418"/><line class="grid" x1="12" y1="74" x2="768" y2="74"/><line class="grid" x1="12" y1="160" x2="768" y2="160"/><line class="grid" x1="12" y1="246" x2="768" y2="246"/><line class="grid" x1="12" y1="332" x2="768" y2="332"/><line class="stroke-a" x1="29" y1="64" x2="133" y2="64"/><line class="stroke-a" x1="167" y1="64" x2="306" y2="64"/><line class="stroke-a" x1="340" y1="64" x2="536" y2="64"/><line class="stroke-a" x1="570" y1="64" x2="751" y2="64"/><text class="h ink" x="81" y="43" text-anchor="middle">theory family</text><text class="h ink" x="236" y="43" text-anchor="middle">what learning is</text><text class="h ink" x="438" y="43" text-anchor="middle">the teacher's job</text><text class="h ink" x="661" y="43" text-anchor="middle">what it misses</text><circle class="stroke" cx="32" cy="99" r="11"/><text class="small muted" x="32" y="104" text-anchor="middle">1</text><text class="sh" x="50" y="96">behaviourism</text><text class="body" x="164" y="96">change in observable</text><text class="body" x="164" y="113">behaviour</text><text class="body" x="337" y="96">arrange consequences that</text><text class="body" x="337" y="113">train the wanted behaviour</text><text class="body" x="567" y="96">understanding, meaning,</text><text class="body" x="567" y="113">the inside of the head</text><circle class="stroke" cx="32" cy="185" r="11"/><text class="small muted" x="32" y="190" text-anchor="middle">2</text><text class="sh" x="50" y="182">cognitive</text><text class="body" x="164" y="182">change in thinking,</text><text class="body" x="164" y="199">schemas rebuilt</text><text class="body" x="337" y="174">order experience: enactive</text><text class="body" x="337" y="191">to iconic to symbolic;</text><text class="body" x="337" y="208">meet prior schemas</text><text class="body" x="567" y="182">the social setting where</text><text class="body" x="567" y="199">learning happens</text><circle class="stroke" cx="32" cy="271" r="11"/><text class="small muted" x="32" y="276" text-anchor="middle">3</text><text class="sh" x="50" y="268">social learning</text><text class="body" x="164" y="268">change through observation</text><text class="body" x="164" y="285">of models</text><text class="body" x="337" y="260">be a deliberate model, aim</text><text class="body" x="337" y="277">attention and its outcomes</text><text class="body" x="567" y="268">what is constructed,</text><text class="body" x="567" y="285">not just copied</text><circle class="stroke" cx="32" cy="357" r="11"/><text class="small muted" x="32" y="362" text-anchor="middle">4</text><text class="sh" x="50" y="354">constructivism</text><text class="body" x="164" y="346">understanding built by</text><text class="body" x="164" y="363">the learner with assistance</text><text class="body" x="337" y="346">design the task, place and</text><text class="body" x="337" y="363">remove scaffolds in the zone</text><text class="body" x="567" y="346">slow, hard to run with sixty</text><text class="body" x="567" y="363">pupils and a syllabus clock</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
