<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نمونوں کے پانچ ذرائع کا جدول</title><desc id="d">نمونوں کے پانچ ذرائع کا جدول: استاد، ساتھی، بڑے شاگرد، خاندان، اور اسکرینیں اور کہانیاں: ہر ایک کے ساتھ کیا نمونہ بنایا جا رہا ہے اور کیا نمونہ سازی کو مضبوط یا کمزور کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}.ah{fill:var(--ink)}text{font-size:11.5px;fill:var(--ink)}</style><rect class="bg" x="0.0" y="0" width="780" height="470"/><rect class="panel" x="12.0" y="18" width="756" height="402" rx="6"/><rect class="panel-a" x="12.0" y="18" width="756" height="62" rx="6"/><line class="stroke stroke-a" x1="768.0" y1="80" x2="12.0" y2="80"/><line class="grid" x1="620.0" y1="18" x2="620.0" y2="420"/><line class="grid" x1="362.0" y1="18" x2="362.0" y2="420"/><line class="grid" x1="768.0" y1="148" x2="12.0" y2="148"/><line class="grid" x1="768.0" y1="216" x2="12.0" y2="216"/><line class="grid" x1="768.0" y1="284" x2="12.0" y2="284"/><line class="grid" x1="768.0" y1="352" x2="12.0" y2="352"/><text class="h ink" x="752.0" y="45" text-anchor="end">نمونہ کون ہے</text><text class="h ink" x="604.0" y="45" text-anchor="end">کیا نمونہ</text><text class="h ink" x="604.0" y="65" text-anchor="end">بنایا جا رہا ہے</text><text class="h ink" x="346.0" y="45" text-anchor="end">کیا نمونہ سازی کو</text><text class="h ink" x="346.0" y="65" text-anchor="end">مضبوط یا کمزور کرتا ہے</text><text class="sh ink" x="752.0" y="112" text-anchor="end">استاد</text><text class="body" x="604.0" y="105" text-anchor="end">غلطیوں، سوالوں اور</text><text class="body" x="604.0" y="126" text-anchor="end">محنت کے ساتھ کیا ہوتا ہے</text><text class="body" x="346.0" y="101" text-anchor="end">کمرے کا سب سے مضبوط نمونہ:</text><text class="small muted" x="346.0" y="120" text-anchor="end">اہم، روزانہ موجود</text><text class="small" x="346.0" y="138" text-anchor="end">الفاظ اور نتائج میں ہم آہنگی</text><text class="sh ink" x="752.0" y="180" text-anchor="end">ساتھی</text><text class="body" x="604.0" y="173" text-anchor="end">کام کیسے ہوتا ہے،</text><text class="body" x="604.0" y="194" text-anchor="end">دوسروں کے ساتھ کیسا ہوتا ہے</text><text class="body" x="346.0" y="169" text-anchor="end">مضبوط: مماثل اور ہمیشہ حاضر</text><text class="small" x="346.0" y="190" text-anchor="end">جماعت کے دکھنے والے اصول، کسے توجہ ملتی ہے</text><text class="sh ink" x="752.0" y="248" text-anchor="end">بڑے شاگرد</text><text class="body" x="604.0" y="241" text-anchor="end">عادتیں، اعتماد، آسان راستے</text><text class="body" x="346.0" y="237" text-anchor="end">مضبوط: قابلِ تعریف اور عمر میں قریب</text><text class="small" x="346.0" y="258" text-anchor="end">اسکول انہیں کس چیز کا انعام دیتا ہے</text><text class="sh ink" x="752.0" y="316" text-anchor="end">خاندان</text><text class="body" x="604.0" y="309" text-anchor="end">اسکول، مطالعے، اختیار کے</text><text class="body" x="604.0" y="330" text-anchor="end">بارے میں رویے</text><text class="body" x="346.0" y="305" text-anchor="end">مضبوط: شفیق اور پرانا</text><text class="small" x="346.0" y="326" text-anchor="end">کیا اسکول اور گھر وہی چیز نمونہ بناتے ہیں</text><text class="sh ink" x="752.0" y="384" text-anchor="end">اسکرینیں اور</text><text class="sh ink" x="752.0" y="402" text-anchor="end">کہانیاں</text><text class="body" x="604.0" y="377" text-anchor="end">روے کے ذخیرے،</text><text class="body" x="604.0" y="398" text-anchor="end">دکھائے گئے نتائج</text><text class="body" x="346.0" y="373" text-anchor="end">مضبوط: واضح، دہرایا ہوا، دلچسپ</text><text class="small" x="346.0" y="392" text-anchor="end">کیا نتائج ایمانداری سے دکھائے</text><text class="small" x="346.0" y="409" text-anchor="end">جاتے ہیں یا چمکا کر</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
