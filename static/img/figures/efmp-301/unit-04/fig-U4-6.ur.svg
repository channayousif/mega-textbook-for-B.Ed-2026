<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مسئلہ حل کرنے کی حکمت عملیاں اور رکاوٹیں</title><desc id="d">پانچ حکمت عملیوں کا جدول: الگورتھم، قاعدہ سر انگشت، ذرائع و اغراض تجزیہ، پیچھے سے آگے اور قیاس، ہر ایک کے ساتھ روزمرہ کی مثال اور ایک رکاوٹ جو آ سکتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="hink" x="768" y="25" text-anchor="end">مسئلہ حل کرنے کی حکمت عملیاں</text><line class="stroke-a" x1="768" y1="33" x2="602" y2="33"/><rect class="panel" x="12" y="45" width="756" height="391" rx="4"/><line class="stroke" x1="768" y1="100" x2="12" y2="100"/><path class="grid" d="M 616 45V436M324 45V436M12 164H768M12 232H768M12 300H768M12 368H768"/><text class="h" x="692" y="78" text-anchor="middle">حکمت عملی</text><text class="h" x="470" y="70" text-anchor="middle">روزمرہ کی</text><text class="h" x="470" y="89" text-anchor="middle">مثال</text><text class="h" x="168" y="70" text-anchor="middle">ایک رکاوٹ جو</text><text class="h" x="168" y="89" text-anchor="middle">آ سکتی ہے</text><text class="sh" x="752" y="136" text-anchor="end">الگورتھم</text><text class="body" x="600" y="125" text-anchor="end">طویل تقسیم کے مرحلے</text><text class="body" x="308" y="117" text-anchor="end">اس مسئلے کا کوئی الگورتھم نہیں،</text><text class="body" x="308" y="135" text-anchor="end">سو شاگرد پھنس جاتا ہے</text><text class="sh" x="752" y="185" text-anchor="end">قاعدہ سر انگشت</text><text class="small muted" x="752" y="202" text-anchor="end">اسے بنائیں، آسان مثال آزمائیں</text><text class="body" x="600" y="189" text-anchor="end">رکشے والے مسئلے کے لیے عائشہ کی پٹیاں</text><text class="body" x="308" y="181" text-anchor="end">بنانا ہی کام بن جاتا ہے اور</text><text class="body" x="308" y="199" text-anchor="end">سوال بھول جاتے ہیں</text><text class="sh" x="752" y="258" text-anchor="end">ذرائع و</text><text class="sh" x="752" y="276" text-anchor="end">اغراض تجزیہ</text><text class="body" x="600" y="251" text-anchor="end">اپنی جگہ جواب سے ملیں،</text><text class="body" x="600" y="269" text-anchor="end">سب سے بڑا فرق گھٹائیں</text><text class="body" x="308" y="251" text-anchor="end">چنا گیا فرق آسان والا ہوتا ہے،</text><text class="body" x="308" y="269" text-anchor="end">رکاوٹ والا نہیں</text><text class="sh" x="752" y="326" text-anchor="end">پیچھے سے</text><text class="sh" x="752" y="344" text-anchor="end">آگے</text><text class="body" x="600" y="326" text-anchor="end">پوچھی گئی بات سے شروع کریں: کیا چیز</text><text class="body" x="600" y="344" text-anchor="end">اسے پیدا کرے گی؟</text><text class="body" x="308" y="319" text-anchor="end">نقطہ آغاز ہی غیر واضح ہو، تو</text><text class="body" x="308" y="337" text-anchor="end">واپسی کے زنجیر کا پہلا کڑی نہیں</text><text class="sh" x="752" y="407" text-anchor="end">قیاس</text><text class="body" x="600" y="394" text-anchor="end">یہ پچھلے سمسٹر کے پمپ والے سوال جیسا ہے</text><text class="body" x="308" y="394" text-anchor="end">مشابہت سطحی ہو اور طریقہ</text><text class="body" x="308" y="412" text-anchor="end">غلط انداز میں آ جائے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
