<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">توجہ کھینچنے اور بناوت کرنے والے عوامل</title><desc id="d">چھ عوامل کا جدول: انوکھا پن، مخالفت، معنی، جذبہ، کام کا تقاضا اور توقع، ہر ایک کے ساتھ جماعت میں اس کی مثال اور استاد کا ایک اقدام۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:13px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="16" width="756" height="422" rx="5"/><path class="stroke" d="M 768 72H768M236 16V438M544 16V438"/><g class="grid"><path d="M 768 133H768M12 194H768M12 255H768M12 316H768M12 377H768"/></g><path class="stroke-a" d="M 762 77V128M18 138V189M18 199V250M18 260V311M18 321V372M18 382V433"/><text class="h" x="656" y="40" text-anchor="middle">کیا کھینچتا یا</text><text class="h" x="656" y="60" text-anchor="middle">بناوت کرتا ہے</text><text class="h" x="390" y="40" text-anchor="middle">جماعت میں</text><text class="h" x="124" y="40" text-anchor="middle">استاد کا ایک اقدام</text><g><text class="sh ink" x="748" y="97" text-anchor="end">انوکھا پن</text><text class="small" x="748" y="117" text-anchor="end">نئی چیز یا نئی آواز</text><text class="body" x="526" y="97" text-anchor="end">اچانک سامنے آنے والا</text><text class="body" x="526" y="117" text-anchor="end">مظاہرے کا مرتبان</text><text class="body" x="218" y="97" text-anchor="end">اعلان چیز خود کرنے دیں</text><text class="sh ink" x="748" y="158" text-anchor="end">مُخالفت</text><text class="small" x="748" y="178" text-anchor="end">پس منظر سے فرق</text><text class="body" x="526" y="158" text-anchor="end">ایک رنگ والی</text><text class="body" x="526" y="178" text-anchor="end">چاک لکیر</text><text class="body" x="218" y="158" text-anchor="end">اسے اُس ایک نکتے کے لیے</text><text class="body" x="218" y="178" text-anchor="end">رکھیں جو اہم ہے</text><text class="sh ink" x="748" y="219" text-anchor="end">معنی</text><text class="small" x="748" y="239" text-anchor="end">سیکھنے والے سے تعلق</text><text class="body" x="526" y="219" text-anchor="end">وہ کہانی جو شروع ہو</text><text class="body" x="526" y="239" text-anchor="end">شاگردوں اپنی گلی سے</text><text class="body" x="218" y="219" text-anchor="end">شروع کریں اس بات سے</text><text class="body" x="218" y="239" text-anchor="end">کہ یہ کس کام کا ہے</text><text class="sh ink" x="748" y="280" text-anchor="end">جذبہ</text><text class="small" x="748" y="300" text-anchor="end">واقعے سے جڑا احساس</text><text class="body" x="526" y="280" text-anchor="end">اُس سیلاب کا سبق</text><text class="body" x="526" y="300" text-anchor="end">جو انہوں نے دیکھا</text><text class="body" x="218" y="280" text-anchor="end">احساس کو مواد</text><text class="body" x="218" y="300" text-anchor="end">سنبھالنے دیں</text><text class="sh ink" x="748" y="341" text-anchor="end">کام کا تقاضا</text><text class="small" x="748" y="361" text-anchor="end">کام کتنی پکڑ رکھتا ہے</text><text class="body" x="526" y="341" text-anchor="end">نقل کرنا</text><text class="body" x="526" y="361" text-anchor="end">سننے سے ٹکراتی ہے</text><text class="body" x="218" y="341" text-anchor="end">ایک وقت میں</text><text class="body" x="218" y="361" text-anchor="end">ایک تقاضا</text><text class="sh ink" x="748" y="402" text-anchor="end">توقع</text><text class="small" x="748" y="422" text-anchor="end">دیکھنے والا پہلے سے کیا جانتا ہے</text><text class="body" x="526" y="402" text-anchor="end">خاکہ استاد کو</text><text class="body" x="526" y="422" text-anchor="end">آسان دکھتا ہے</text><text class="body" x="218" y="402" text-anchor="end">حصوں کے نام زبان سے</text><text class="body" x="218" y="422" text-anchor="end">پہیلی سے پہلے بتائیں</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
