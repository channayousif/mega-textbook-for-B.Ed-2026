<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معلومات کی عملکاری کا سلسلہ</title><desc id="d">معلومات کی عملکاری کی زنجیر کا فلو چارٹ: حسی یادداشت مختصر وقت کے لیے تاثرات تھامتی ہے، عامل یادداشت سیکنڈوں کے لیے تقریباً چار چیزیں تھامتی ہے، ترمیز مواد کو لامحدود طویل المدتی یادداشت میں لے جاتی ہے، اور حاصل کرنا اسے واپس لاتی ہے، بھولنا زوال، مداخلت اور حاصل کرنے میں ناکامی سے کاٹتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:16px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}.cross{stroke:var(--ink);stroke-width:2.5;fill:none}.bin{stroke:var(--ink);stroke-width:1.8;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="ah"/></marker></defs><rect class="bg" x="0.0" y="0.0" width="1000.0" height="650"/><text class="h" x="976.9" y="39.0" text-anchor="end">معلومات یادداشت میں کیسے سفر کرتی ہے</text><text class="small muted" x="976.9" y="66.3" text-anchor="end">بھول جانے زنجیر کو ایک سے زیادہ مقام پر کاٹ سکتی ہے۔</text><path class="grid" d="M 23 125 H 977"/><text class="sh" x="500.0" y="104.0" text-anchor="middle">بھول جانے یہاں کاٹتی ہے:</text><text class="small" x="750.0" y="133.9" text-anchor="middle">زوال</text><text class="small" x="500.0" y="133.9" text-anchor="middle">مداخلت</text><text class="small" x="250.0" y="133.9" text-anchor="middle">بازیابی ناکامی</text><rect class="panel" x="765.4" y="160.0" width="211.5" height="286.8" rx="10"/><rect class="panel" x="521.8" y="160.0" width="211.5" height="286.8" rx="10"/><rect class="panel" x="278.2" y="160.0" width="211.5" height="286.8" rx="10"/><rect class="panel" x="23.1" y="160.0" width="223.1" height="286.8" rx="10"/><path class="stroke" d="M 765.4 276 H 733.3" marker-end="url(#arrow)"/><path class="stroke" d="M 521.8 276 H 489.7" marker-end="url(#arrow)"/><path class="stroke" d="M 278.2 276 H 246.2" marker-end="url(#arrow)"/><path class="cross" d="M 745 268 l 10 16 m 0 -16 l -10 16"/><path class="cross" d="M 501 268 l 10 16 m 0 -16 l -10 16"/><path class="cross" d="M 257 268 l 10 16 m 0 -16 l -10 16"/><text class="h" x="961.5" y="203.4" text-anchor="end">حسی یادداشت</text><text class="body" x="961.5" y="240.6" text-anchor="end">منظر، آواز، ذائقہ</text><text class="body" x="961.5" y="277.8" text-anchor="end">ایک دو سیکنڈ کے لیے</text><path class="bin" d="M 801 320 h 27 m -23 0 l 3 27 h 17 l 3 -27 m -17 -5 h 11 m -16 5 l 3 -5 h 12 l 3 5 m -10 5 v 18 m 7 -18 v 18"/><text class="small" x="871.8" y="404.9" text-anchor="middle">زیادہ تر یہیں گم ہو جاتی ہے</text><text class="h" x="717.9" y="203.4" text-anchor="end">عامل یادداشت</text><text class="sh" x="717.9" y="240.6" text-anchor="end">کام کی میز</text><text class="body" x="717.9" y="277.8" text-anchor="end">تقریباً چار چیزیں</text><text class="body" x="717.9" y="308.8" text-anchor="end">ایک ساتھ، سیکنڈ</text><text class="body" x="717.9" y="339.8" text-anchor="end">نہ کہ منٹ رکھتی ہے</text><path class="bin" d="M 535 360 h 27 m -23 0 l 3 22 h 17 l 3 -22 m -17 -5 h 11 m -16 5 l 3 -5 h 12 l 3 5 m -10 5 v 14 m 7 -14 v 14"/><text class="small" x="628.2" y="406.5" text-anchor="middle">توجہ اور دہرائی</text><text class="small" x="628.2" y="432.8" text-anchor="middle">کے بغیر گم ہو جاتی ہے</text><text class="h" x="474.4" y="203.4" text-anchor="end">ترمیز</text><text class="h" x="474.4" y="234.4" text-anchor="end">سے طویل مدتی</text><text class="h" x="474.4" y="265.4" text-anchor="end">یادداشت میں</text><text class="body" x="474.4" y="311.9" text-anchor="end">پہلے سے معلوم سے</text><text class="body" x="474.4" y="342.9" text-anchor="end">جوڑ کر محفوظ</text><path class="stroke-a" d="M 295 372 h 179" stroke-dasharray="5 4"/><text class="small" x="384.6" y="406.5" text-anchor="middle">رشتہ بنائیں</text><text class="h" x="230.8" y="203.4" text-anchor="end">طویل مدتی</text><text class="h" x="230.8" y="234.4" text-anchor="end">یادداشت</text><text class="body" x="230.8" y="280.9" text-anchor="end">محفوظ گنجائش</text><text class="body" x="230.8" y="311.9" text-anchor="end">بے حد سمجھی جاتی ہے</text><path class="ink" d="M 64 346 h 154 v 28 H 64 z"/><path d="M 77 354 h 128 m -128 7 h 128 m -128 7 h 128" class="grid"/><text class="small" x="134.6" y="406.5" text-anchor="middle">محفوظ علم</text><path class="stroke" d="M 134.6 447 V 514 H 628.2 V 447" marker-end="url(#arrow)"/><text class="sh" x="380.8" y="485.4" text-anchor="middle">بازیابی: ضرورت پر واپس لانا</text><path class="grid" d="M 23 554 H 977"/><text class="small" x="976.9" y="573.0" text-anchor="end">یادداشت یک رخی نالی نہیں: محفوظ چیز کو کام کی میز پر واپس لایا جا سکتا ہے۔</text><text class="wm" x="18" y="635" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
