<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A diagram of attention as a spotlight: the task and one pupil sit inside the beam while distractors sit outside it</title><desc id="d">A diagram of attention as a spotlight: the task and one pupil sit inside the beam while distractors sit outside it, and a split beam labelled divided attention lights two desks at once with a note that each gets less.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="14" y="14" width="464" height="412" rx="10"/><rect class="panel" x="492" y="14" width="274" height="412" rx="10"/><text class="h" x="32" y="42">Focused attention: one target</text><text class="small" x="32" y="62">The spotlight selects task and pupil.</text><line class="grid" x1="32" y1="70" x2="460" y2="70"/><rect class="ink" x="138" y="86" width="190" height="48" rx="3"/><rect class="stroke" x="146" y="94" width="174" height="32" rx="2"/><text class="small" x="233" y="116" text-anchor="middle" fill="var(--bg)">blackboard</text><circle class="ink" cx="86" cy="96" r="12"/><path class="stroke" d="M86 108v35m0-22-16 15m16-15 17 15m-17 7-12 21m12-21 13 21"/><text class="small" x="48" y="174">teacher</text><polygon points="153,141 314,141 394,352 72,352" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="234" y="160" text-anchor="middle">spotlight beam</text><rect x="202" y="183" width="65" height="36" rx="3" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><line class="grid" x1="210" y1="193" x2="258" y2="193"/><line class="grid" x1="210" y1="202" x2="258" y2="202"/><text class="body" x="234" y="238" text-anchor="middle">task</text><circle class="ink" cx="235" cy="264" r="13"/><path class="stroke" d="M235 277v35m0-21-19 16m19-16 19 16"/><rect x="187" y="310" width="98" height="16" rx="2" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><line class="stroke" x1="199" y1="326" x2="194" y2="348"/><line class="stroke" x1="273" y1="326" x2="278" y2="348"/><text class="body" x="235" y="372" text-anchor="middle">pupil at desk</text><text class="sh" x="32" y="194">outside the beam</text><path class="stroke" d="M40 215q8-13 16 0t16 0t16 0" stroke-dasharray="5 4"/><text class="body" x="38" y="239">road noise</text><circle cx="69" cy="294" r="14" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><path class="stroke" d="M69 270v-10m0 68v10m-24-44h-10m68 0h-10m-31-17-8-8m43 43-8-8m0-27 8-8m-43 43 8-8"/><text class="body" x="38" y="357">heat</text><path d="M416 202l24 41h-48z" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><path class="stroke" d="M416 212v18"/><text class="body" x="385" y="264">hunger</text><path d="M401 296h36l12 12-12 12h-36z" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><path d="M422 326h33l10 10-10 10h-33z" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><text class="body" x="385" y="365">neighbour's</text><text class="body" x="385" y="382">chatter</text><text class="h" x="510" y="42">Divided attention</text><text class="small" x="510" y="62">One beam split between two targets.</text><line class="grid" x1="510" y1="70" x2="748" y2="70"/><path d="M620 92h18l11 23h-40z" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="629" y="137" text-anchor="middle">split beam</text><polygon points="616,119 628,119 576,255 526,255" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" stroke-dasharray="6 4"/><polygon points="630,119 642,119 728,255 678,255" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" stroke-dasharray="6 4"/><circle class="ink" cx="552" cy="270" r="10"/><path class="stroke" d="M552 280v24m0-14-14 11m14-11 14 11"/><rect x="514" y="304" width="77" height="15" rx="2" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><line class="stroke" x1="524" y1="319" x2="520" y2="340"/><line class="stroke" x1="581" y1="319" x2="585" y2="340"/><text class="body" x="552" y="361" text-anchor="middle">desk A</text><circle class="ink" cx="702" cy="270" r="10"/><path class="stroke" d="M702 280v24m0-14-14 11m14-11 14 11"/><rect x="664" y="304" width="77" height="15" rx="2" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><line class="stroke" x1="674" y1="319" x2="670" y2="340"/><line class="stroke" x1="731" y1="319" x2="735" y2="340"/><text class="body" x="702" y="361" text-anchor="middle">desk B</text><path class="stroke-a" d="M536 385h183"/><text class="sh" x="628" y="406" text-anchor="middle">each gets less</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
