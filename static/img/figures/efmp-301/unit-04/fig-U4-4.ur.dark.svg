<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مطالعہ کی حکمت عملیاں اور ثبوت</title><desc id="d">پانچ مطالعہ حکمت عملیوں کا جدول: بار بار پڑھنا، ہائی لائٹ کرنا، وقت پر پھیلی واپسی، تفصیل بیانی اور کسی کو سکھانا، ہر ایک پر یہ کہ یہ یادداشت سے کیا مانگتی ہے، ثبوت کیا کہتی ہے، اور اسکول میں ایک استعمال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel)}.grid{fill:none;stroke:var(--line);stroke-width:1.5}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:12.5px;font-weight:700}.sh{font-size:11.5px;font-weight:700}.body{font-size:11.5px}.small{font-size:12px}.wm{fill:var(--wm);font-size:11px}.stroke{fill:none;stroke:var(--line);stroke-width:1.5}.stroke-a{fill:none;stroke:var(--a1);stroke-width:2.5}text{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="12" width="756" height="60" rx="4"/><rect class="grid" x="12" y="12" width="756" height="420" rx="4"/><g class="stroke"><path d="M 629 12V432M343 12V432M554 12V432M12 72H768M12 144H768M12 216H768M12 288H768M12 360H768"/></g><g text-anchor="middle"><text class="h" x="698.5" y="38" text-anchor="end">حکمت عملی</text><text class="h" x="533" y="31" text-anchor="end">یہ یادداشت سے</text><text class="h" x="533" y="49" text-anchor="end">کیا مانگتی ہے</text><text class="h" x="331.5" y="31" text-anchor="end">ثبوت کیا</text><text class="h" x="331.5" y="49" text-anchor="end">کہتی ہے</text><text class="h" x="119" y="31" text-anchor="end">اسکول کی سطح</text><text class="h" x="119" y="49" text-anchor="end">ایک استعمال</text><text class="sh" x="698.5" y="102" text-anchor="end">بار بار پڑھنا</text><text class="body" x="533" y="96" text-anchor="end">صرف دیکھنا،</text><text class="body" x="533" y="114" text-anchor="end">کوئی واپسی نہیں</text><text class="body" x="331.5" y="96" text-anchor="end">جانچ پہچان اور پہچان</text><text class="body" x="331.5" y="114" text-anchor="end">بناتی ہے، یاد دہانی کمزور</text><text class="body" x="119" y="96" text-anchor="end">سب سے سستی اور</text><text class="body" x="119" y="114" text-anchor="end">سب سے کمزور طریقہ</text><text class="sh" x="698.5" y="174" text-anchor="end">ہائی لائٹ کرنا</text><text class="body" x="533" y="168" text-anchor="end">چنے ہوئے حصوں پر توجہ،</text><text class="body" x="533" y="186" text-anchor="end">کوئی عمل نہیں</text><text class="body" x="331.5" y="168" text-anchor="end">فائدہ کم جب تک کوئی وجہ</text><text class="body" x="331.5" y="186" text-anchor="end">دل سے نہ چنا جائے</text><text class="body" x="119" y="159" text-anchor="end">اُن تین جملوں کو نشان</text><text class="body" x="119" y="177" text-anchor="end">لگائیں جو سبق</text><text class="body" x="119" y="195" text-anchor="end">کا مرکز ہیں</text><text class="sh" x="698.5" y="246" text-anchor="end">وقت پر پھیلی واپسی</text><text class="body" x="533" y="240" text-anchor="end">مواد کو باہر نکالنا،</text><text class="body" x="533" y="258" text-anchor="end">وقت کے ساتھ</text><text class="body" x="331.5" y="240" text-anchor="end">پائیدار یاد دہانی کے لیے</text><text class="body" x="331.5" y="258" text-anchor="end">مضبوط ثبوت</text><text class="body" x="119" y="240" text-anchor="end">پیر کا پنج سوال والا</text><text class="body" x="119" y="258" text-anchor="end">اختتامی کوئز، ہر ہفتے</text><text class="sh" x="698.5" y="318" text-anchor="end">تفصیل بیانی</text><text class="body" x="533" y="312" text-anchor="end">نئے مواد کو پرانے</text><text class="body" x="533" y="330" text-anchor="end">معلوم سے جوڑنا</text><text class="body" x="331.5" y="312" text-anchor="end">رمز کاری اور حفظ</text><text class="body" x="331.5" y="330" text-anchor="end">مضبوط کرتا ہے</text><text class="body" x="119" y="312" text-anchor="end">"ساتھی کو سمجھاؤ"</text><text class="body" x="119" y="330" text-anchor="end">والا ایک منٹ</text><text class="sh" x="698.5" y="382" text-anchor="end">کسی کو سکھانا</text><text class="body" x="533" y="384" text-anchor="end">واپسی بھی، تفصیل بھی</text><text class="body" x="533" y="402" text-anchor="end">اور تنظیم بھی</text><text class="body" x="331.5" y="384" text-anchor="end">مطالعہ کے معروف</text><text class="body" x="331.5" y="402" text-anchor="end">بہترین رویوں میں</text><text class="body" x="119" y="384" text-anchor="end">جوڑی میں اعادہ جہاں ہر</text><text class="body" x="119" y="402" text-anchor="end">ایک آدھا موضوع سکھائے</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
