<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five study strategies</title><desc id="d">A table of five study strategies - re-reading, highlighting, spaced retrieval, elaboration and teaching it to someone - on what each asks of memory, what the evidence says, and one school-scale use.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel)}.grid{fill:none;stroke:var(--line);stroke-width:1.5}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700}.sh{font-size:13px;font-weight:700}.body{font-size:13px}.small{font-size:12px}.wm{fill:var(--wm);font-size:11px}.stroke{fill:none;stroke:var(--line);stroke-width:1.5}.stroke-a{fill:none;stroke:var(--a1);stroke-width:2.5}text{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="12" width="756" height="60" rx="4"/><rect class="grid" x="12" y="12" width="756" height="420" rx="4"/><g class="stroke"><path d="M151 12V432M343 12V432M554 12V432M12 72H768M12 144H768M12 216H768M12 288H768M12 360H768"/></g><g text-anchor="middle"><text class="h" x="81.5" y="38">strategy</text><text class="h" x="247" y="31">what it asks</text><text class="h" x="247" y="49">of memory</text><text class="h" x="448.5" y="31">what the evidence</text><text class="h" x="448.5" y="49">says</text><text class="h" x="661" y="31">one school-scale</text><text class="h" x="661" y="49">use</text><text class="sh" x="81.5" y="102">re-reading</text><text class="body" x="247" y="96">exposure,</text><text class="body" x="247" y="114">no retrieval</text><text class="body" x="448.5" y="96">creates familiarity and</text><text class="body" x="448.5" y="114">recognition, weak recall</text><text class="body" x="661" y="96">the cheapest and weakest</text><text class="body" x="661" y="114">of the set</text><text class="sh" x="81.5" y="174">highlighting</text><text class="body" x="247" y="168">attention to selections,</text><text class="body" x="247" y="186">no processing</text><text class="body" x="448.5" y="168">little benefit unless it</text><text class="body" x="448.5" y="186">selects for a reason</text><text class="body" x="661" y="159">use to mark the three</text><text class="body" x="661" y="177">sentences that carry</text><text class="body" x="661" y="195">a lesson</text><text class="sh" x="81.5" y="246">spaced retrieval</text><text class="body" x="247" y="240">pulling material back out,</text><text class="body" x="247" y="258">over time</text><text class="body" x="448.5" y="240">strong evidence for</text><text class="body" x="448.5" y="258">durable recall</text><text class="body" x="661" y="240">the Monday five-question</text><text class="body" x="661" y="258">exit quiz, weekly</text><text class="sh" x="81.5" y="318">elaboration</text><text class="body" x="247" y="312">connecting new material</text><text class="body" x="247" y="330">to what is known</text><text class="body" x="448.5" y="312">strengthens encoding</text><text class="body" x="448.5" y="330">and storage</text><text class="body" x="661" y="312">the "explain it to your</text><text class="body" x="661" y="330">partner" minute</text><text class="sh" x="81.5" y="382">teaching it</text><text class="sh" x="81.5" y="399">to someone</text><text class="body" x="247" y="384">retrieval plus elaboration</text><text class="body" x="247" y="402">plus organisation</text><text class="body" x="448.5" y="384">among the strongest study</text><text class="body" x="448.5" y="402">behaviours known</text><text class="body" x="661" y="384">pair revision where each</text><text class="body" x="661" y="402">teaches half the topic</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
