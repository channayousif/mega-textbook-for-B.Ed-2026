<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سوچ کا تصوری نقشہ</title><desc id="d">سوچ کی تین شاخیں: تصورات یعنی سیکھی گئی اقسام، مسئلہ حل کرنے کی نام رکھنے والی حکمت عملیاں، اور استقرائی و استنتاجی استدلال، ہر ایک کے ساتھ جماعت کی مثال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}text{font-size:13px;fill:var(--ink)}</style><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780 0L 770 5L 780 10z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><path class="stroke-a" d="M 471 219L 517 155" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M 306 227L 265 165" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M 467 284L 489 329" marker-end="url(#arrow-a)"/><line class="grid" x1="390" y1="165" x2="390" y2="310"/><rect class="panel-a" x="517" y="30" width="245" height="134" rx="14"/><text class="h" x="742" y="58">تصورات</text><line class="stroke" x1="742" y1="70" x2="538" y2="70"/><text class="body" x="742" y="94">سیکھی گئی اقسام جن کے</text><text class="body" x="742" y="112">پہچانے ہوئے خدوخال ہیں</text><rect class="panel" x="533" y="119" width="213" height="35" rx="7"/><text class="small" x="735" y="136">جماعت اول کا شاگرد سبزی کا تصور</text><text class="small" x="735" y="150">بازار کے چکر سے بناتا ہے</text><rect class="panel-b" x="20" y="28" width="245" height="198" rx="14"/><text class="h" x="245" y="56">مسئلہ حل کرنا</text><line class="stroke" x1="245" y1="68" x2="40" y2="68"/><text class="sh" x="245" y="91">نام رکھنے والی حکمت عملیاں</text><text class="body" x="245" y="113">الگورتھم، قاعدہ سر انگشت</text><text class="body" x="245" y="130">ذرائع و اغراض</text><text class="body" x="245" y="147">پیچھے سے آگے، قیاس</text><line class="grid" x1="245" y1="158" x2="40" y2="158"/><rect class="panel" x="36" y="168" width="213" height="44" rx="7"/><text class="small" x="237" y="187">جماعت کی مثال</text><text class="body" x="237" y="204">عائشہ کی پٹیاں</text><rect class="panel-c" x="489" y="304" width="273" height="138" rx="14"/><text class="h" x="742" y="332">استدلال</text><line class="stroke" x1="742" y1="344" x2="509" y2="344"/><text class="body" x="742" y="363">مثالیں سے قاعدہ، استقرائی</text><text class="body" x="742" y="383">قاعدہ سے مثال، استنتاجی</text><rect class="panel" x="505" y="393" width="241" height="36" rx="7"/><text class="small" x="736" y="409">“یہ استاد ہمیشہ دیر سے چیک کرتا ہے”</text><text class="small" x="736" y="423">بمقابلہ وہ قیاس جو شاگرد خود جانچ سکے</text><ellipse class="panel" cx="390" cy="252" rx="84" ry="49"/><text class="hink" x="390" y="248" text-anchor="middle">سوچ</text><text class="small muted" x="390" y="270" text-anchor="middle">ذہن کام پر</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
