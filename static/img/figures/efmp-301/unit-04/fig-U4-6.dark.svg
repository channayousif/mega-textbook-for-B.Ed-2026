<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five problem-solving strategies</title><desc id="d">A table of five problem-solving strategies - algorithm, heuristic, means-ends analysis, working backwards and analogy - each with an everyday instance and one obstacle it can hit.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="12" y="25">Problem-solving strategies</text><line class="stroke-a" x1="12" y1="33" x2="178" y2="33"/><rect class="panel" x="12" y="45" width="756" height="391" rx="4"/><line class="stroke" x1="12" y1="100" x2="768" y2="100"/><path class="grid" d="M164 45V436M456 45V436M12 164H768M12 232H768M12 300H768M12 368H768"/><text class="h" x="88" y="78" text-anchor="middle">strategy</text><text class="h" x="310" y="70" text-anchor="middle">an everyday</text><text class="h" x="310" y="89" text-anchor="middle">instance</text><text class="h" x="612" y="70" text-anchor="middle">one obstacle</text><text class="h" x="612" y="89" text-anchor="middle">it can hit</text><text class="sh" x="28" y="136">Algorithm</text><text class="body" x="180" y="125">the long-division steps</text><text class="body" x="472" y="117">no algorithm exists for this problem,</text><text class="body" x="472" y="135">so the pupil is stuck</text><text class="sh" x="28" y="185">Heuristic</text><text class="small muted" x="28" y="202">draw it, try a simpler case</text><text class="body" x="180" y="189">Ayesha's bars for the rickshaw problem</text><text class="body" x="472" y="181">the drawing becomes the task and</text><text class="body" x="472" y="199">the question is forgotten</text><text class="sh" x="28" y="258">Means-ends</text><text class="sh" x="28" y="276">analysis</text><text class="body" x="180" y="251">compare where you are with the answer,</text><text class="body" x="180" y="269">shrink the biggest gap</text><text class="body" x="472" y="251">the gap chosen is the easy one,</text><text class="body" x="472" y="269">not the blocking one</text><text class="sh" x="28" y="326">Working</text><text class="sh" x="28" y="344">backwards</text><text class="body" x="180" y="326">start from what is asked: what would</text><text class="body" x="180" y="344">produce it?</text><text class="body" x="472" y="319">the start point itself is unclear, so</text><text class="body" x="472" y="337">the backwards chain has no first link</text><text class="sh" x="28" y="407">Analogy</text><text class="body" x="180" y="394">this is like the water-pump question</text><text class="body" x="180" y="412">from last term</text><text class="body" x="472" y="394">the likeness is superficial and the</text><text class="body" x="472" y="412">method is imported wrongly</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
