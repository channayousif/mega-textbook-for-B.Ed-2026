<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of six factors</title><desc id="d">A table of six factors - novelty, contrast, meaning, emotion, task demand and expectation - each against how it appears in the classroom and one teacher move that uses it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="16" width="756" height="422" rx="5"/><path class="stroke" d="M12 72H768M236 16V438M544 16V438"/><g class="grid"><path d="M12 133H768M12 194H768M12 255H768M12 316H768M12 377H768"/></g><path class="stroke-a" d="M18 77V128M18 138V189M18 199V250M18 260V311M18 321V372M18 382V433"/><text class="h" x="124" y="40" text-anchor="middle">what pulls or</text><text class="h" x="124" y="60" text-anchor="middle">shapes it</text><text class="h" x="390" y="40" text-anchor="middle">in the classroom</text><text class="h" x="656" y="40" text-anchor="middle">one teacher move</text><g><text class="sh ink" x="32" y="97">Novelty</text><text class="small" x="32" y="117">a new object or voice</text><text class="body" x="254" y="97">the unannounced</text><text class="body" x="254" y="117">demonstration jar</text><text class="body" x="562" y="97">let the object do</text><text class="body" x="562" y="117">the announcing</text><text class="sh ink" x="32" y="158">Contrast</text><text class="small" x="32" y="178">difference against a background</text><text class="body" x="254" y="158">the one coloured</text><text class="body" x="254" y="178">chalk line</text><text class="body" x="562" y="158">use it for the single</text><text class="body" x="562" y="178">point that matters</text><text class="sh ink" x="32" y="219">Meaning</text><text class="small" x="32" y="239">relevance to the learner</text><text class="body" x="254" y="219">the story that starts with</text><text class="body" x="254" y="239">the pupils' own street</text><text class="body" x="562" y="219">open with what</text><text class="body" x="562" y="239">this is for</text><text class="sh ink" x="32" y="280">Emotion</text><text class="small" x="32" y="300">feeling attached to the event</text><text class="body" x="254" y="280">the lesson about the flood</text><text class="body" x="254" y="300">they lived through</text><text class="body" x="562" y="280">let the feeling carry</text><text class="body" x="562" y="300">the content</text><text class="sh ink" x="32" y="341">Task demand</text><text class="small" x="32" y="361">how hard the task grips</text><text class="body" x="254" y="341">copying competes</text><text class="body" x="254" y="361">with listening</text><text class="body" x="562" y="341">one demand</text><text class="body" x="562" y="361">at a time</text><text class="sh ink" x="32" y="402">Expectation</text><text class="small" x="32" y="422">what the perceiver already knows</text><text class="body" x="254" y="402">the diagram obvious</text><text class="body" x="254" y="422">to the teacher</text><text class="body" x="562" y="402">name the parts aloud</text><text class="body" x="562" y="422">before the puzzle</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
