<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معلومات کی عملکاری کا سلسلہ</title><desc id="d">معلومات کا بہاؤ: حسی یادداشت چند لمحے سنبھالتی ہے، عامل یادداشت چار چیزیں سیکنڈوں کے لیے، رمز کاری بے حد طویل مدتی یادداشت میں لے جاتی ہے، اور واپسی اسے لوٹاتی ہے، جبکہ بھول جانے زوال، مداخلت اور واپسی کی ناکامی سے کاٹتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}.cross{stroke:var(--ink);stroke-width:2.5;fill:none}.bin{stroke:var(--ink);stroke-width:1.8;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780 0L10,5L0,10z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="762" y="30">معلومات یادداشت میں کیسے سفر کرتی ہے</text><text class="small muted" x="762" y="51">بھول جانے زنجیر کو ایک سے زیادہ مقام پر کاٹ سکتی ہے۔</text><path class="grid" d="M 762 96H762"/><text class="sh" x="390" y="80" text-anchor="middle">بھول جانے یہاں کاٹتی ہے:</text><text class="small" x="585" y="103" text-anchor="middle">زوال</text><text class="small" x="390" y="103" text-anchor="middle">مداخلت</text><text class="small" x="195" y="103" text-anchor="middle">واپسی نا کام ہونا</text><rect class="panel" x="597" y="120" width="165" height="150" rx="10"/><rect class="panel" x="407" y="120" width="165" height="150" rx="10"/><rect class="panel" x="217" y="120" width="165" height="150" rx="10"/><rect class="panel" x="18" y="120" width="174" height="150" rx="10"/><path class="stroke" d="M 597 195H208" marker-end="url(#arrow)"/><path class="stroke" d="M 407 195H398" marker-end="url(#arrow)"/><path class="stroke" d="M 217 195H588" marker-end="url(#arrow)"/><path class="cross" d="M 590 187l10 16m0-16l-10 16"/><path class="cross" d="M 395 187l10 16m0-16l-10 16"/><path class="cross" d="M 200 187l10 16m0-16l-10 16"/><text class="h" x="750" y="148">حسی یادداشت</text><text class="body" x="750" y="172">منظر، آواز، ذائقہ</text><text class="body" x="750" y="192">ایک دو سیکنڈ کے لیے</text><path class="bin" d="M 652 216h27m-23 0l3 27h17l3-27m-17-5h11m-16 5l3-5h12l3 5m-10 5v18m7-18v18"/><text class="small" x="639" y="258" text-anchor="middle">زیادہ تر یہیں گم ہو جاتی ہے</text><text class="h" x="560" y="148">عامل یادداشت</text><text class="sh" x="560" y="172">کام کی میز</text><text class="body" x="560" y="193">تقریباً چار چیزیں رکھتی ہے</text><text class="body" x="560" y="212">ایک ساتھ، سیکنڈ نہ کہ منٹ</text><path class="bin" d="M 461 224h27m-23 0l3 22h17l3-22m-17-5h11m-16 5l3-5h12l3 5m-10 5v14m7-14v14"/><text class="small" x="490" y="258" text-anchor="middle">گم ہو جاتی ہے جب تک توجہ</text><text class="small" x="490" y="274" text-anchor="middle">اور دہرائی نہ ہو</text><text class="h" x="370" y="148">رمز کاری سے</text><text class="h" x="370" y="168">طویل مدتی یادداشت</text><text class="body" x="370" y="198">جو پہلے سے معلوم</text><text class="body" x="370" y="218">ہے اس سے جوڑ کر</text><path class="stroke-a" d="M 370 237h140" stroke-dasharray="5 4"/><text class="small" x="300" y="257" text-anchor="middle">رشتہ بنائیں</text><text class="h" x="180" y="148">طویل مدتی یادداشت</text><text class="body" x="180" y="178">حفظ کی گنجائش</text><text class="body" x="180" y="198">بے حد سمجھی جاتی ہے</text><path class="ink" d="M 170 220h120v22H610z"/><path d="M 160 226h100m-100 7h100m-100 7h100" class="grid"/><text class="small" x="115" y="258" text-anchor="middle">محفوظ علم</text><path class="stroke" d="M 105 270V355H291V270" marker-end="url(#arrow)"/><text class="sh" x="297" y="337" text-anchor="middle">واپسی: ضرورت پر واپس لانا</text><path class="grid" d="M 762 385H762"/><text class="small" x="762" y="410">یادداشت یک رخی نالی نہیں: محفوظ چیز کو کام کی میز پر واپس لایا جا سکتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
