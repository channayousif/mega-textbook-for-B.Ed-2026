<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of the information-processing chain: sensory memory briefly holds impressions</title><desc id="d">A flowchart of the information-processing chain: sensory memory briefly holds impressions, working memory holds about four things for seconds, encoding moves material into unlimited long-term memory, and retrieval brings it back, with forgetting cutting in at decay, interference and retrieval failure.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}.cross{stroke:var(--ink);stroke-width:2.5;fill:none}.bin{stroke:var(--ink);stroke-width:1.8;fill:none}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="18" y="30">How information moves through memory</text><text class="small muted" x="18" y="51">Forgetting can interrupt the chain at more than one point.</text><path class="grid" d="M18 96H762"/><text class="sh" x="390" y="80" text-anchor="middle">forgetting cuts in here:</text><text class="small" x="195" y="103" text-anchor="middle">decay</text><text class="small" x="390" y="103" text-anchor="middle">interference</text><text class="small" x="585" y="103" text-anchor="middle">retrieval failure</text><rect class="panel" x="18" y="120" width="165" height="150" rx="10"/><rect class="panel" x="208" y="120" width="165" height="150" rx="10"/><rect class="panel" x="398" y="120" width="165" height="150" rx="10"/><rect class="panel" x="588" y="120" width="174" height="150" rx="10"/><path class="stroke" d="M183 195H208" marker-end="url(#arrow)"/><path class="stroke" d="M373 195H398" marker-end="url(#arrow)"/><path class="stroke" d="M563 195H588" marker-end="url(#arrow)"/><path class="cross" d="M190 187l10 16m0-16l-10 16"/><path class="cross" d="M385 187l10 16m0-16l-10 16"/><path class="cross" d="M580 187l10 16m0-16l-10 16"/><text class="h" x="30" y="148">sensory memory</text><text class="body" x="30" y="172">sights, sounds, tastes</text><text class="body" x="30" y="192">held for a second or two</text><path class="bin" d="M128 216h27m-23 0l3 27h17l3-27m-17-5h11m-16 5l3-5h12l3 5m-10 5v18m7-18v18"/><text class="small" x="141" y="258" text-anchor="middle">most is lost here</text><text class="h" x="220" y="148">working memory</text><text class="sh" x="220" y="172">the workbench</text><text class="body" x="220" y="193">holds about four things</text><text class="body" x="220" y="212">at once, seconds not minutes</text><path class="bin" d="M319 224h27m-23 0l3 22h17l3-22m-17-5h11m-16 5l3-5h12l3 5m-10 5v14m7-14v14"/><text class="small" x="290" y="258" text-anchor="middle">lost unless attended</text><text class="small" x="290" y="274" text-anchor="middle">and rehearsed</text><text class="h" x="410" y="148">encoding into</text><text class="h" x="410" y="168">long-term memory</text><text class="body" x="410" y="198">connected to what is</text><text class="body" x="410" y="218">already known</text><path class="stroke-a" d="M410 237h140" stroke-dasharray="5 4"/><text class="small" x="480" y="257" text-anchor="middle">make a connection</text><text class="h" x="600" y="148">long-term memory</text><text class="body" x="600" y="178">storage believed</text><text class="body" x="600" y="198">unlimited</text><path class="ink" d="M610 220h120v22H610z"/><path d="M620 226h100m-100 7h100m-100 7h100" class="grid"/><text class="small" x="665" y="258" text-anchor="middle">stored knowledge</text><path class="stroke" d="M675 270V355H291V270" marker-end="url(#arrow)"/><text class="sh" x="483" y="337" text-anchor="middle">retrieval: getting it back when needed</text><path class="grid" d="M18 385H762"/><text class="small" x="18" y="410">Memory is not a one-way pipe: what is stored can be brought back to the workbench.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
