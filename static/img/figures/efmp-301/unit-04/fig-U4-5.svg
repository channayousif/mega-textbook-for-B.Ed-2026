<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of thinking with three branches</title><desc id="d">A concept map of thinking with three branches - concepts as learned categories, problem-solving with its named strategies, and reasoning in its inductive and deductive forms - each with a classroom instance.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}text{font-size:15px;fill:var(--ink)}</style><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><path class="stroke-a" d="M309 219 L263 155" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M474 227 L515 165" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M313 284 L291 329" marker-end="url(#arrow-a)"/><line class="grid" x1="390" y1="165" x2="390" y2="310"/><rect class="panel-a" x="18" y="30" width="245" height="134" rx="14"/><text class="h" x="38" y="58">concepts</text><line class="stroke" x1="38" y1="70" x2="242" y2="70"/><text class="body" x="38" y="94">learned categories with</text><text class="body" x="38" y="112">defining features</text><rect class="panel" x="34" y="119" width="213" height="35" rx="7"/><text class="small" x="45" y="136">Class 1 pupil builds “sabzi”</text><text class="small" x="45" y="150">from market visits</text><rect class="panel-b" x="515" y="28" width="245" height="198" rx="14"/><text class="h" x="535" y="56">problem-solving</text><line class="stroke" x1="535" y1="68" x2="740" y2="68"/><text class="sh" x="535" y="91">strategies with names</text><text class="body" x="535" y="113">algorithm · heuristic</text><text class="body" x="535" y="130">means-ends</text><text class="body" x="535" y="147">working backwards · analogy</text><line class="grid" x1="535" y1="158" x2="740" y2="158"/><rect class="panel" x="531" y="168" width="213" height="44" rx="7"/><text class="small" x="543" y="187">classroom instance</text><text class="body" x="543" y="204">Ayesha's bars</text><rect class="panel-c" x="18" y="304" width="273" height="138" rx="14"/><text class="h" x="38" y="332">reasoning</text><line class="stroke" x1="38" y1="344" x2="271" y2="344"/><text class="body" x="38" y="363">cases → rule, inductive</text><text class="body" x="38" y="383">rule → case, deductive</text><rect class="panel" x="34" y="393" width="241" height="36" rx="7"/><text class="small" x="44" y="409">“this teacher always marks late”</text><text class="small" x="44" y="423">versus a syllogism a pupil can check</text><ellipse class="panel" cx="390" cy="252" rx="84" ry="49"/><text class="h ink" x="390" y="248" text-anchor="middle">thinking</text><text class="small muted" x="390" y="270" text-anchor="middle">mind at work</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
