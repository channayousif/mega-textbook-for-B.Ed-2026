<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">توجہ کھینچنے اور بناوت کرنے والے عوامل</title><desc id="d">چھ عوامل کا جدول: انوکھا پن، مخالفت، معنی، جذبہ، کام کا تقاضا اور توقع، ہر ایک کے ساتھ جماعت میں اس کی مثال اور استاد کا ایک اقدام۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:13px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="16" width="756" height="422" rx="5"/><path class="stroke" d="M 768 72H768M236 16V438M544 16V438"/><g class="grid"><path d="M 768 133H768M12 194H768M12 255H768M12 316H768M12 377H768"/></g><path class="stroke-a" d="M 762 77V128M18 138V189M18 199V250M18 260V311M18 321V372M18 382V433"/><text class="h" x="656" y="40" text-anchor="middle">کیا کھینچتا یا</text><text class="h" x="656" y="60" text-anchor="middle">بناوت کرتا ہے</text><text class="h" x="390" y="40" text-anchor="middle">جماعت میں</text><text class="h" x="124" y="40" text-anchor="middle">استاد کا ایک اقدام</text><g><text class="sh ink" x="748" y="97">انوکھا پن</text><text class="small" x="748" y="117">نئی چیز یا نئی آواز</text><text class="body" x="526" y="97">اچانک سامنے آنے والا</text><text class="body" x="526" y="117">مظاہرے کا مرتبان</text><text class="body" x="218" y="97">اعلان چیز خود کرنے دیں</text><text class="body" x="218" y="117"></text><text class="sh ink" x="748" y="158">مُخالفت</text><text class="small" x="748" y="178">پس منظر سے فرق</text><text class="body" x="526" y="158">ایک رنگ والی</text><text class="body" x="526" y="178">چاک لکیر</text><text class="body" x="218" y="158">اسے اُس ایک نکتے کے لیے</text><text class="body" x="218" y="178">رکھیں جو اہم ہے</text><text class="sh ink" x="748" y="219">معنی</text><text class="small" x="748" y="239">سیکھنے والے سے تعلق</text><text class="body" x="526" y="219">وہ کہانی جو شروع ہو</text><text class="body" x="526" y="239">شاگردوں اپنی گلی سے</text><text class="body" x="218" y="219">شروع کریں اس بات سے</text><text class="body" x="218" y="239">کہ یہ کس کام کا ہے</text><text class="sh ink" x="748" y="280">جذبہ</text><text class="small" x="748" y="300">واقعے سے جڑا احساس</text><text class="body" x="526" y="280">اُس سیلاب کا سبق</text><text class="body" x="526" y="300">جو انہوں نے دیکھا</text><text class="body" x="218" y="280">احساس کو مواد</text><text class="body" x="218" y="300">سنبھالنے دیں</text><text class="sh ink" x="748" y="341">کام کا تقاضا</text><text class="small" x="748" y="361">کام کتنی پکڑ رکھتا ہے</text><text class="body" x="526" y="341">نقل کرنا</text><text class="body" x="526" y="361">سننے سے ٹکراتی ہے</text><text class="body" x="218" y="341">ایک وقت میں</text><text class="body" x="218" y="361">ایک تقاضا</text><text class="sh ink" x="748" y="402">توقع</text><text class="small" x="748" y="422">دیکھنے والا پہلے سے کیا جانتا ہے</text><text class="body" x="526" y="402">خاکہ استاد کو</text><text class="body" x="526" y="422">آسان دکھتا ہے</text><text class="body" x="218" y="402">حصوں کے نام زبان سے</text><text class="body" x="218" y="422">پہیلی سے پہلے بتائیں</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
