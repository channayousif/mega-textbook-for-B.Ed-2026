<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فلاح و بہبود کا توازن</title><desc id="d">فلاح کا توازن خاکہ: بائیں پلڑے میں مانگیں: امتحان، موازنہ، شور اور گرمی، گھر کا بوجھ: اور دائیں سہارے: معمول، تعلق، بازخورد، حفاظت، کوئی جو نوٹ کرے: کیپشن کے ساتھ کہ فلاح توازن ہے، مانگوں کی غیر موجودگی نہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.item{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.dem{fill:var(--a3-fill)}.sup{fill:var(--a1-fill)}.link{stroke:var(--ink);stroke-width:2;fill:none}.beam{stroke:var(--ink);stroke-width:3;fill:none}.post{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><g id="region-scale"><path class="beam" d="M610 110 H170"/><path class="link" d="M610 110 L740 170 M610 110 L480 170 M170 110 L300 170 M170 110 L40 170"/><path class="beam" d="M390 110 V430"/><polygon class="post" points="390,96 404,118 376,118"/><polygon class="post" points="430,450 350,450 370,430 410,430"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-demands"><rect class="panel-c" x="480" y="170" width="260" height="270" rx="10"/><text class="sh" x="610" y="200" text-anchor="middle">‏مانگیں‏</text><rect class="item" x="500" y="220" width="220" height="32" rx="6"/><text class="cell" x="610" y="241" text-anchor="middle">‏امتحانات‏</text><rect class="item" x="500" y="262" width="220" height="32" rx="6"/><text class="cell" x="610" y="283" text-anchor="middle">‏موازنہ‏</text><rect class="item" x="500" y="304" width="220" height="32" rx="6"/><text class="cell" x="610" y="325" text-anchor="middle">‏شور اور گرمی‏</text><rect class="item" x="500" y="346" width="220" height="32" rx="6"/><text class="cell" x="610" y="367" text-anchor="middle">‏گھر کا بوجھ‏</text></g><g id="node-supports"><rect class="panel-a" x="40" y="170" width="260" height="270" rx="10"/><text class="sh" x="170" y="200" text-anchor="middle">‏سہارے‏</text><rect class="item" x="60" y="220" width="220" height="32" rx="6"/><text class="cell" x="170" y="241" text-anchor="middle">‏معمول‏</text><rect class="item" x="60" y="262" width="220" height="32" rx="6"/><text class="cell" x="170" y="283" text-anchor="middle">‏تعلق‏</text><rect class="item" x="60" y="304" width="220" height="32" rx="6"/><text class="cell" x="170" y="325" text-anchor="middle">‏اگلا مرحلہ بتانے والی رائے‏</text><rect class="item" x="60" y="346" width="220" height="32" rx="6"/><text class="cell" x="170" y="367" text-anchor="middle">‏تحفظ‏</text><rect class="item" x="60" y="388" width="220" height="32" rx="6"/><text class="cell" x="170" y="409" text-anchor="middle">‏کوئی جو توجہ دے‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="50" text-anchor="middle">‏فلاح و بہبود ایک توازن ہے‏</text><text id="label-caption" class="small" x="390" y="486" text-anchor="middle">‏فلاح و بہبود توازن ہے، مانگوں کی غیر موجودگی نہیں - اسکول سہارے ڈیزائن کرتا ہے۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
