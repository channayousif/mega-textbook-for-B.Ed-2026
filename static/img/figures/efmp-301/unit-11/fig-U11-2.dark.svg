<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five signs a teacher can notice</title><desc id="d">A table of five signs a teacher can notice - withdrawal, unexplained fall in marks, out-of-scale irritability, unexplained or repeated absence, and talk of hopelessness - each against a possible meaning and the response within the teacher's role.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.item{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.dem{fill:var(--a3-fill)}.sup{fill:var(--a1-fill)}.link{stroke:var(--ink);stroke-width:2;fill:none}.beam{stroke:var(--ink);stroke-width:3;fill:none}.post{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="20" y="90" width="220" height="400"/><path class="grid" d="M240 20V490M480 20V490M20 170H760M20 250H760M20 330H760M20 410H760"/><path class="rule" d="M20 90H760"/><rect class="frame" x="20" y="20" width="740" height="470" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-0"><text class="sh" x="130" y="51" text-anchor="middle">sign a teacher</text><text class="sh" x="130" y="69" text-anchor="middle">can notice</text></g><g id="node-head-1"><text class="sh" x="360" y="60" text-anchor="middle">a possible meaning</text></g><g id="node-head-2"><text class="sh" x="620" y="51" text-anchor="middle">the response within</text><text class="sh" x="620" y="69" text-anchor="middle">the teacher's role</text></g><g id="node-row-withdrawal"><text class="sh" x="130" y="126" text-anchor="middle">withdrawal from friends</text><text class="sh" x="130" y="144" text-anchor="middle">and activities</text><text class="cell" x="252" y="126" text-anchor="start">isolation, low mood,</text><text class="cell" x="252" y="144" text-anchor="start">fear of the room</text><text class="cell" x="492" y="126" text-anchor="start">a private, calm check-in;</text><text class="cell" x="492" y="144" text-anchor="start">keep the pupil included by role</text></g><g id="node-row-marks"><text class="sh" x="130" y="206" text-anchor="middle">a fall in marks with no</text><text class="sh" x="130" y="224" text-anchor="middle">teaching explanation</text><text class="cell" x="252" y="206" text-anchor="start">something outside the</text><text class="cell" x="252" y="224" text-anchor="start">lesson has changed</text><text class="cell" x="492" y="206" text-anchor="start">look wider before re-teaching;</text><text class="cell" x="492" y="224" text-anchor="start">ask, do not assume</text></g><g id="node-row-irritability"><text class="sh" x="130" y="286" text-anchor="middle">irritability out of scale</text><text class="sh" x="130" y="304" text-anchor="middle">with its trigger</text><text class="cell" x="252" y="286" text-anchor="start">the load has exceeded</text><text class="cell" x="252" y="304" text-anchor="start">the supports</text><text class="cell" x="492" y="286" text-anchor="start">reduce the demand;</text><text class="cell" x="492" y="304" text-anchor="start">name the feeling calmly</text></g><g id="node-row-absence"><text class="sh" x="130" y="366" text-anchor="middle">absence that is</text><text class="sh" x="130" y="384" text-anchor="middle">unexplained or repeated</text><text class="cell" x="252" y="366" text-anchor="start">something may be keeping</text><text class="cell" x="252" y="384" text-anchor="start">the pupil away</text><text class="cell" x="492" y="366" text-anchor="start">a quiet conversation,</text><text class="cell" x="492" y="384" text-anchor="start">not a public question</text></g><g id="node-row-hopelessness"><text class="sh" x="130" y="455" text-anchor="middle">talk of hopelessness</text><text class="cell" x="252" y="446" text-anchor="start">the pupil is telling you the</text><text class="cell" x="252" y="464" text-anchor="start">most important thing they can</text><text class="cell" x="492" y="446" text-anchor="start">listen fully, never dismiss,</text><text class="cell" x="492" y="464" text-anchor="start">escalate the same day</text></g></g><g id="layer-labels"><text class="wm" x="768" y="520" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
