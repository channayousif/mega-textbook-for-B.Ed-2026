<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the teacher's five well-being moves</title><desc id="d">A table of the teacher's five well-being moves, each against what it supports and its limit, with the referral's limit named as the profession, not a failure.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.item{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.dem{fill:var(--a3-fill)}.sup{fill:var(--a1-fill)}.link{stroke:var(--ink);stroke-width:2;fill:none}.beam{stroke:var(--ink);stroke-width:3;fill:none}.post{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="20" y="90" width="200" height="410"/><path class="grid" d="M220 20V500M470 20V500M20 170H760M20 250H760M20 330H760M20 410H760"/><path class="rule" d="M20 90H760"/><rect class="frame" x="20" y="20" width="740" height="480" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-0"><text class="sh" x="120" y="60" text-anchor="middle">the teacher's move</text></g><g id="node-head-1"><text class="sh" x="345" y="60" text-anchor="middle">what it supports</text></g><g id="node-head-2"><text class="sh" x="615" y="60" text-anchor="middle">its limit</text></g><g id="node-row-greet"><text class="sh" x="120" y="135" text-anchor="middle">greet by name</text><text class="cell" x="232" y="126" text-anchor="start">belonging; the relationship</text><text class="cell" x="232" y="144" text-anchor="start">before it is needed</text><text class="cell" x="482" y="126" text-anchor="start">it cannot reach what</text><text class="cell" x="482" y="144" text-anchor="start">happens at home</text></g><g id="node-row-routine"><text class="sh" x="120" y="206" text-anchor="middle">keep the routine</text><text class="sh" x="120" y="224" text-anchor="middle">unbroken</text><text class="cell" x="232" y="206" text-anchor="start">predictability that fear</text><text class="cell" x="232" y="224" text-anchor="start">cannot survive without</text><text class="cell" x="482" y="206" text-anchor="start">it does not remove</text><text class="cell" x="482" y="224" text-anchor="start">the demand itself</text></g><g id="node-row-reduce"><text class="sh" x="120" y="286" text-anchor="middle">reduce the demand</text><text class="sh" x="120" y="304" text-anchor="middle">you control</text><text class="cell" x="232" y="286" text-anchor="start">a load that fits</text><text class="cell" x="232" y="304" text-anchor="start">the workbench</text><text class="cell" x="482" y="286" text-anchor="start">it cannot change the</text><text class="cell" x="482" y="304" text-anchor="start">examination culture alone</text></g><g id="node-row-name"><text class="sh" x="120" y="375" text-anchor="middle">name feelings calmly</text><text class="cell" x="232" y="366" text-anchor="start">the workbench returned;</text><text class="cell" x="232" y="384" text-anchor="start">the emotion respected</text><text class="cell" x="482" y="366" text-anchor="start">naming is</text><text class="cell" x="482" y="384" text-anchor="start">not treating</text></g><g id="node-row-refer"><text class="sh" x="120" y="451" text-anchor="middle">refer the same day,</text><text class="sh" x="120" y="469" text-anchor="middle">words written</text><text class="cell" x="232" y="451" text-anchor="start">the pupil carried</text><text class="cell" x="232" y="469" text-anchor="start">by the right hands</text><text class="cell" x="482" y="442" text-anchor="start">the teacher's part ends at the</text><text class="cell" x="482" y="460" text-anchor="start">handover - that is the</text><text class="cell" x="482" y="478" text-anchor="start">profession, not a failure</text></g></g><g id="layer-labels"><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
