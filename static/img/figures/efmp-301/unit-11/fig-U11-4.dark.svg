<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the teacher's five well-being moves</title><desc id="d">A table of the teacher's five well-being moves, each against what it supports and its limit, with the referral's limit named as the profession, not a failure.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:13px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M182 14V426M448 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="97" y="48" text-anchor="middle">the teacher's move</text><text class="h" x="315" y="40" text-anchor="middle">what it</text><text class="h" x="315" y="60" text-anchor="middle">supports</text><text class="h" x="608" y="40" text-anchor="middle">its</text><text class="h" x="608" y="60" text-anchor="middle">limit</text><text class="sh" x="97" y="112" text-anchor="middle">greet by name</text><text class="body" x="194" y="102">belonging; the relationship</text><text class="body" x="194" y="122">before it is needed</text><text class="body" x="460" y="102">it cannot reach what</text><text class="body" x="460" y="122">happens at home</text><text class="sh" x="97" y="196" text-anchor="middle">keep the routine</text><text class="sh" x="97" y="214" text-anchor="middle">unbroken</text><text class="body" x="194" y="186">predictability that fear</text><text class="body" x="194" y="206">cannot survive without</text><text class="body" x="460" y="186">it does not remove</text><text class="body" x="460" y="206">the demand itself</text><text class="sh" x="97" y="280" text-anchor="middle">reduce the demand</text><text class="sh" x="97" y="298" text-anchor="middle">you control</text><text class="body" x="194" y="270">a load that fits</text><text class="body" x="194" y="290">the workbench</text><text class="body" x="460" y="270">it cannot change the</text><text class="body" x="460" y="290">examination culture alone</text><text class="sh" x="97" y="364" text-anchor="middle">name feelings calmly</text><text class="body" x="194" y="354">the workbench returned;</text><text class="body" x="194" y="374">the emotion respected</text><text class="body" x="460" y="354">naming is</text><text class="body" x="460" y="374">not treating</text><text class="sh" x="97" y="420" text-anchor="middle">refer the same day,</text><text class="sh" x="97" y="438" text-anchor="middle">words written</text><text class="body" x="194" y="424">the pupil carried</text><text class="body" x="194" y="444" font-size="12">by the right hands</text><text class="body" x="460" y="424" font-size="11.5">the teacher's part ends at the handover -</text><text class="body" x="460" y="442" font-size="11.5">that is the profession, not a failure</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
