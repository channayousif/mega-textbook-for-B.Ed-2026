<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A timeline of a school day</title><desc id="d">A timeline of a school day from assembly to home time, each station carrying its demand and its support, with a caption that every station is both, and the school designs which.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:13px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">The school day, station by station</text><line class="stroke" x1="40" y1="90" x2="740" y2="90"/><g class="stroke"><path d="M40 82 v16 M170 82 v16 M300 82 v16 M430 82 v16 M560 82 v16 M740 82 v16"/></g><text class="sh" x="40" y="70" text-anchor="middle">assembly</text><text class="sh" x="170" y="70" text-anchor="middle">lessons</text><text class="sh" x="300" y="70" text-anchor="middle">break</text><text class="sh" x="430" y="70" text-anchor="middle">last period</text><text class="sh" x="590" y="70" text-anchor="middle">home time</text><rect class="panel" x="20" y="120" width="130" height="150" rx="8"/><text class="body" x="85" y="142" text-anchor="middle" font-size="11.5">demand:</text><text class="body" x="85" y="160" text-anchor="middle" font-size="11.5">public comparison</text><text class="body" x="85" y="178" text-anchor="middle" font-size="11.5">of marks</text><text class="body" x="85" y="208" text-anchor="middle" font-size="11.5">support:</text><text class="body" x="85" y="226" text-anchor="middle" font-size="11.5">a predictable</text><text class="body" x="85" y="244" text-anchor="middle" font-size="11.5">start</text><rect class="panel" x="105" y="290" width="130" height="150" rx="8"/><text class="body" x="170" y="312" text-anchor="middle" font-size="11.5">demand:</text><text class="body" x="170" y="330" text-anchor="middle" font-size="11.5">the load of new</text><text class="body" x="170" y="348" text-anchor="middle" font-size="11.5">material</text><text class="body" x="170" y="378" text-anchor="middle" font-size="11.5">support:</text><text class="body" x="170" y="396" text-anchor="middle" font-size="11.5">steps made external;</text><text class="body" x="170" y="414" text-anchor="middle" font-size="11.5">wrong answers safe</text><rect class="panel" x="235" y="120" width="130" height="150" rx="8"/><text class="body" x="300" y="142" text-anchor="middle" font-size="11.5">demand:</text><text class="body" x="300" y="160" text-anchor="middle" font-size="11.5">the social test</text><text class="body" x="300" y="190" text-anchor="middle" font-size="11.5">support:</text><text class="body" x="300" y="208" text-anchor="middle" font-size="11.5">the peer group</text><text class="body" x="300" y="226" text-anchor="middle" font-size="11.5">that includes</text><rect class="panel" x="365" y="290" width="130" height="150" rx="8"/><text class="body" x="430" y="312" text-anchor="middle" font-size="11.5">demand:</text><text class="body" x="430" y="330" text-anchor="middle" font-size="11.5">attention is spent</text><text class="body" x="430" y="360" text-anchor="middle" font-size="11.5">support:</text><text class="body" x="430" y="378" text-anchor="middle" font-size="11.5">the one demand</text><text class="body" x="430" y="396" text-anchor="middle" font-size="11.5">that matters</text><rect class="panel" x="525" y="120" width="130" height="150" rx="8"/><text class="body" x="590" y="142" text-anchor="middle" font-size="11.5">demand:</text><text class="body" x="590" y="160" text-anchor="middle" font-size="11.5">the load at home</text><text class="body" x="590" y="190" text-anchor="middle" font-size="11.5">support:</text><text class="body" x="590" y="208" text-anchor="middle" font-size="11.5">the goodbye that says</text><text class="body" x="590" y="226" text-anchor="middle" font-size="11.5">tomorrow is expected</text><text class="small" x="390" y="462" text-anchor="middle">Every station is both a demand and a support; the school designs which.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
