<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A timeline of a school day</title><desc id="d">A timeline of a school day from assembly to home time, each station carrying its demand and its support, with a caption that every station is both, and the school designs which.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.item{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.dem{fill:var(--a3-fill)}.sup{fill:var(--a1-fill)}.link{stroke:var(--ink);stroke-width:2;fill:none}.beam{stroke:var(--ink);stroke-width:3;fill:none}.post{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><path class="grid" d="M20 110H760"/></g><g id="layer-edges"><line id="edge-assembly-lessons" class="link" x1="102" y1="110" x2="228" y2="110" marker-end="url(#arrow)"/><line id="edge-lessons-break" class="link" x1="252" y1="110" x2="378" y2="110" marker-end="url(#arrow)"/><line id="edge-break-last-period" class="link" x1="402" y1="110" x2="528" y2="110" marker-end="url(#arrow)"/><line id="edge-last-period-home-time" class="link" x1="552" y1="110" x2="678" y2="110" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-assembly"><text class="sh" x="90" y="86" text-anchor="middle">assembly</text><circle class="ring-o" cx="90" cy="110" r="8"/><path class="link" d="M90 118V140"/><rect class="dem" x="20" y="140" width="140" height="125"/><rect class="sup" x="20" y="265" width="140" height="135"/><path class="rule" d="M20 265H160"/><rect class="frame" x="20" y="140" width="140" height="260" rx="8"/><text class="sh" x="90" y="166" text-anchor="middle">demand</text><text class="cell" x="90" y="194" text-anchor="middle">public comparison</text><text class="cell" x="90" y="212" text-anchor="middle">of marks</text><text class="sh" x="90" y="291" text-anchor="middle">support</text><text class="cell" x="90" y="319" text-anchor="middle">a predictable</text><text class="cell" x="90" y="337" text-anchor="middle">start</text></g><g id="node-lessons"><text class="sh" x="240" y="86" text-anchor="middle">lessons</text><circle class="ring-o" cx="240" cy="110" r="8"/><path class="link" d="M240 118V140"/><rect class="dem" x="170" y="140" width="140" height="125"/><rect class="sup" x="170" y="265" width="140" height="135"/><path class="rule" d="M170 265H310"/><rect class="frame" x="170" y="140" width="140" height="260" rx="8"/><text class="sh" x="240" y="166" text-anchor="middle">demand</text><text class="cell" x="240" y="194" text-anchor="middle">the load of new</text><text class="cell" x="240" y="212" text-anchor="middle">material</text><text class="sh" x="240" y="291" text-anchor="middle">support</text><text class="cell" x="240" y="319" text-anchor="middle">steps made</text><text class="cell" x="240" y="337" text-anchor="middle">external; wrong</text><text class="cell" x="240" y="355" text-anchor="middle">answers safe</text></g><g id="node-break"><text class="sh" x="390" y="86" text-anchor="middle">break</text><circle class="ring-o" cx="390" cy="110" r="8"/><path class="link" d="M390 118V140"/><rect class="dem" x="320" y="140" width="140" height="125"/><rect class="sup" x="320" y="265" width="140" height="135"/><path class="rule" d="M320 265H460"/><rect class="frame" x="320" y="140" width="140" height="260" rx="8"/><text class="sh" x="390" y="166" text-anchor="middle">demand</text><text class="cell" x="390" y="194" text-anchor="middle">the social test</text><text class="sh" x="390" y="291" text-anchor="middle">support</text><text class="cell" x="390" y="319" text-anchor="middle">the peer group</text><text class="cell" x="390" y="337" text-anchor="middle">that includes</text></g><g id="node-last-period"><text class="sh" x="540" y="86" text-anchor="middle">last period</text><circle class="ring-o" cx="540" cy="110" r="8"/><path class="link" d="M540 118V140"/><rect class="dem" x="470" y="140" width="140" height="125"/><rect class="sup" x="470" y="265" width="140" height="135"/><path class="rule" d="M470 265H610"/><rect class="frame" x="470" y="140" width="140" height="260" rx="8"/><text class="sh" x="540" y="166" text-anchor="middle">demand</text><text class="cell" x="540" y="194" text-anchor="middle">attention is spent</text><text class="sh" x="540" y="291" text-anchor="middle">support</text><text class="cell" x="540" y="319" text-anchor="middle">the one demand</text><text class="cell" x="540" y="337" text-anchor="middle">that matters</text></g><g id="node-home-time"><text class="sh" x="690" y="86" text-anchor="middle">home time</text><circle class="ring-o" cx="690" cy="110" r="8"/><path class="link" d="M690 118V140"/><rect class="dem" x="620" y="140" width="140" height="125"/><rect class="sup" x="620" y="265" width="140" height="135"/><path class="rule" d="M620 265H760"/><rect class="frame" x="620" y="140" width="140" height="260" rx="8"/><text class="sh" x="690" y="166" text-anchor="middle">demand</text><text class="cell" x="690" y="194" text-anchor="middle">the load at home</text><text class="sh" x="690" y="291" text-anchor="middle">support</text><text class="cell" x="690" y="319" text-anchor="middle">the goodbye that</text><text class="cell" x="690" y="337" text-anchor="middle">says tomorrow</text><text class="cell" x="690" y="355" text-anchor="middle">is expected</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="40" text-anchor="middle">The school day, station by station</text><text id="label-caption" class="small" x="390" y="440" text-anchor="middle">Every station is both a demand and a support; the school designs which.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
