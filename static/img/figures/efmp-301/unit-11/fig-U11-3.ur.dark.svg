<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے دن کی ٹائم لائن</title><desc id="d">اسکول کے دن کی ٹائم لائن: اسمبلی سے گھر واپسی تک، ہر مرحلے پر اس کا تقاضا اور معاونت، اور یاد دہانی کہ ہر مرحلہ دونوں ہے، اسکول طے کرتا ہے کون سا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:11.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">اسکول کا دن، مرحلہ بہ مرحلہ</text><line class="stroke" x1="740" y1="90" x2="40" y2="90"/><g class="stroke"><path d="M 740 82v16 M 610 82v16 M 480 82v16 M 350 82v16 M 220 82v16 M 40 82v16"/></g><text class="sh" x="740" y="70" text-anchor="middle">اسمبلی</text><text class="sh" x="610" y="70" text-anchor="middle">اسباق</text><text class="sh" x="480" y="70" text-anchor="middle">وقفہ</text><text class="sh" x="350" y="70" text-anchor="middle">آخری گھنٹہ</text><text class="sh" x="190" y="70" text-anchor="middle">گھر واپسی</text><rect class="panel" x="630" y="120" width="130" height="150" rx="8"/><text class="body" x="695" y="142" text-anchor="middle" font-size="11.5">تقاضا:</text><text class="body" x="695" y="160" text-anchor="middle" font-size="11.5">نمبروں کا سب کے</text><text class="body" x="695" y="178" text-anchor="middle" font-size="11.5">سامنے موازنہ</text><text class="body" x="695" y="208" text-anchor="middle" font-size="11.5">معاونت:</text><text class="body" x="695" y="226" text-anchor="middle" font-size="11.5">پیشگی معلوم</text><text class="body" x="695" y="244" text-anchor="middle" font-size="11.5">آغاز</text><rect class="panel" x="545" y="290" width="130" height="150" rx="8"/><text class="body" x="610" y="312" text-anchor="middle" font-size="11.5">تقاضا:</text><text class="body" x="610" y="330" text-anchor="middle" font-size="11.5">نئے مواد</text><text class="body" x="610" y="348" text-anchor="middle" font-size="11.5">کا بوجھ</text><text class="body" x="610" y="378" text-anchor="middle" font-size="11.5">معاونت:</text><text class="body" x="610" y="396" text-anchor="middle" font-size="11.5">مرحلے باہر لکھے؛</text><text class="body" x="610" y="414" text-anchor="middle" font-size="11.5">غلط جواب محفوظ</text><rect class="panel" x="415" y="120" width="130" height="150" rx="8"/><text class="body" x="480" y="142" text-anchor="middle" font-size="11.5">تقاضا:</text><text class="body" x="480" y="160" text-anchor="middle" font-size="11.5">سماجی آزمائش</text><text class="body" x="480" y="190" text-anchor="middle" font-size="11.5">معاونت:</text><text class="body" x="480" y="208" text-anchor="middle" font-size="11.5">وہ ہم عمر گروہ</text><text class="body" x="480" y="226" text-anchor="middle" font-size="11.5">جو شامل کرتا ہے</text><rect class="panel" x="285" y="290" width="130" height="150" rx="8"/><text class="body" x="350" y="312" text-anchor="middle" font-size="11.5">تقاضا:</text><text class="body" x="350" y="330" text-anchor="middle" font-size="11.5">توجہ ختم ہو چکی</text><text class="body" x="350" y="360" text-anchor="middle" font-size="11.5">معاونت:</text><text class="body" x="350" y="378" text-anchor="middle" font-size="11.5">وہی ایک تقاضا</text><text class="body" x="350" y="396" text-anchor="middle" font-size="11.5">جو اہم ہے</text><rect class="panel" x="125" y="120" width="130" height="150" rx="8"/><text class="body" x="190" y="142" text-anchor="middle" font-size="11.5">تقاضا:</text><text class="body" x="190" y="160" text-anchor="middle" font-size="11.5">گھر کا بوجھ</text><text class="body" x="190" y="190" text-anchor="middle" font-size="11.5">معاونت:</text><text class="body" x="190" y="208" text-anchor="middle" font-size="11.5">وہ الوداع جو کہتا ہے</text><text class="body" x="190" y="226" text-anchor="middle" font-size="11.5">کل کی امید ہے</text><text class="small" x="390" y="462" text-anchor="middle">ہر مرحلہ تقاضا بھی ہے اور معاونت بھی؛ اسکول طے کرتا ہے کہ کون سا۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
