<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A balance diagram of well-being</title><desc id="d">A balance diagram of well-being: demands on the left pan - exams, comparison, noise and heat, load at home - and supports on the right - routine, belonging, feedback, safety, someone who notices - with a caption that well-being is the balance, not the absence of demands.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:3;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">Well-being is a balance</text><path class="stroke" d="M390 80 L390 130"/><path class="stroke" d="M180 130 L600 130"/><path class="stroke" d="M180 130 L180 160"/><path class="stroke" d="M600 130 L600 160"/><path class="stroke" d="M330 66 L450 66 M390 66 L390 130"/><rect class="panel" x="60" y="160" width="240" height="180" rx="10"/><text class="sh" x="180" y="188" text-anchor="middle">demands</text><rect class="ink" x="90" y="202" width="180" height="24" rx="4"/><text x="180" y="219" text-anchor="middle" font-size="12" fill="var(--bg)">exams</text><rect class="ink" x="90" y="232" width="180" height="24" rx="4"/><text x="180" y="249" text-anchor="middle" font-size="12" fill="var(--bg)">comparison</text><rect class="ink" x="90" y="262" width="180" height="24" rx="4"/><text x="180" y="279" text-anchor="middle" font-size="12" fill="var(--bg)">noise and heat</text><rect class="ink" x="90" y="292" width="180" height="24" rx="4"/><text x="180" y="309" text-anchor="middle" font-size="12" fill="var(--bg)">load at home</text><rect class="panel" x="480" y="160" width="240" height="230" rx="10"/><text class="sh" x="600" y="188" text-anchor="middle">supports</text><rect class="ink" x="510" y="202" width="180" height="24" rx="4"/><text x="600" y="219" text-anchor="middle" font-size="12" fill="var(--bg)">routine</text><rect class="ink" x="510" y="232" width="180" height="24" rx="4"/><text x="600" y="249" text-anchor="middle" font-size="12" fill="var(--bg)">belonging</text><rect class="ink" x="510" y="262" width="180" height="24" rx="4"/><text x="600" y="279" text-anchor="middle" font-size="11" fill="var(--bg)">feedback naming the next step</text><rect class="ink" x="510" y="292" width="180" height="24" rx="4"/><text x="600" y="309" text-anchor="middle" font-size="12" fill="var(--bg)">safety</text><rect class="ink" x="510" y="322" width="180" height="24" rx="4"/><text x="600" y="339" text-anchor="middle" font-size="12" fill="var(--bg)">someone who notices</text><text class="small" x="390" y="440" text-anchor="middle">Well-being is the balance, not the absence of demands - the school designs the supports.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
