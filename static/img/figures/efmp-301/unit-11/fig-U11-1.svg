<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A balance diagram of well-being</title><desc id="d">A balance diagram of well-being: demands on the left pan - exams, comparison, noise and heat, load at home - and supports on the right - routine, belonging, feedback, safety, someone who notices - with a caption that well-being is the balance, not the absence of demands.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.item{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.dem{fill:var(--a3-fill)}.sup{fill:var(--a1-fill)}.link{stroke:var(--ink);stroke-width:2;fill:none}.beam{stroke:var(--ink);stroke-width:3;fill:none}.post{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><g id="region-scale"><path class="beam" d="M170 110H610"/><path class="link" d="M170 110L40 170M170 110L300 170M610 110L480 170M610 110L740 170"/><path class="beam" d="M390 110V430"/><polygon class="post" points="390,96 376,118 404,118"/><polygon class="post" points="350,450 430,450 410,430 370,430"/></g></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-demands"><rect class="panel-c" x="40" y="170" width="260" height="270" rx="10"/><text class="sh" x="170" y="200" text-anchor="middle">demands</text><rect class="item" x="60" y="220" width="220" height="32" rx="6"/><text class="cell" x="170" y="241" text-anchor="middle">exams</text><rect class="item" x="60" y="262" width="220" height="32" rx="6"/><text class="cell" x="170" y="283" text-anchor="middle">comparison</text><rect class="item" x="60" y="304" width="220" height="32" rx="6"/><text class="cell" x="170" y="325" text-anchor="middle">noise and heat</text><rect class="item" x="60" y="346" width="220" height="32" rx="6"/><text class="cell" x="170" y="367" text-anchor="middle">load at home</text></g><g id="node-supports"><rect class="panel-a" x="480" y="170" width="260" height="270" rx="10"/><text class="sh" x="610" y="200" text-anchor="middle">supports</text><rect class="item" x="500" y="220" width="220" height="32" rx="6"/><text class="cell" x="610" y="241" text-anchor="middle">routine</text><rect class="item" x="500" y="262" width="220" height="32" rx="6"/><text class="cell" x="610" y="283" text-anchor="middle">belonging</text><rect class="item" x="500" y="304" width="220" height="32" rx="6"/><text class="cell" x="610" y="325" text-anchor="middle">feedback naming the next step</text><rect class="item" x="500" y="346" width="220" height="32" rx="6"/><text class="cell" x="610" y="367" text-anchor="middle">safety</text><rect class="item" x="500" y="388" width="220" height="32" rx="6"/><text class="cell" x="610" y="409" text-anchor="middle">someone who notices</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="50" text-anchor="middle">Well-being is a balance</text><text id="label-caption" class="small" x="390" y="486" text-anchor="middle">Well-being is the balance, not the absence of demands - the school designs the supports.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
