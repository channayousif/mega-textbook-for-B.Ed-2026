<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ نشانیاں جو استاد دیکھ سکتا ہے</title><desc id="d">پانچ نشانیوں کا جدول جو استاد نوٹ کر سکتا ہے: کھنچاؤ، بغیر وضاحت نمبروں کا گرنا، بے تناسب چڑھ، بغیر وجہ یا بار بار کی غیر حاضری، اور مایوسی کی بات: ہر ایک کے ساتھ ممکن مطلب اور استاد کے کردار کے اندر جواب۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.item{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.dem{fill:var(--a3-fill)}.sup{fill:var(--a1-fill)}.link{stroke:var(--ink);stroke-width:2;fill:none}.beam{stroke:var(--ink);stroke-width:3;fill:none}.post{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="540" y="90" width="220" height="400"/><path class="grid" d="M540 20 V490 M300 20 V490 M760 170 H20 M760 250 H20 M760 330 H20 M760 410 H20"/><path class="rule" d="M760 90 H20"/><rect class="frame" x="20" y="20" width="740" height="470" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-0"><text class="sh" x="650" y="60" text-anchor="middle">‏وہ نشانی جو استاد دیکھ سکے‏</text></g><g id="node-head-1"><text class="sh" x="420" y="60" text-anchor="middle">‏ممکنہ مطلب‏</text></g><g id="node-head-2"><text class="sh" x="160" y="47" text-anchor="middle">‏استاد کے کردار کے اندر‏</text><text class="sh" x="160" y="73" text-anchor="middle">‏جواب‏</text></g><g id="node-row-withdrawal"><text class="sh" x="650" y="122" text-anchor="middle">‏دوستوں اور سرگرمیوں‏</text><text class="sh" x="650" y="148" text-anchor="middle">‏سے کھنچ جانا‏</text><text class="cell" x="528" y="122" text-anchor="end">‏تنہائی، اداسی،‏</text><text class="cell" x="528" y="148" text-anchor="end">‏کمرے کا خوف‏</text><text class="cell" x="288" y="122" text-anchor="end">‏ذاتی، پرسکون پوچھ گچھ؛‏</text><text class="cell" x="288" y="148" text-anchor="end">‏شاگرد کو کردار کے ذریعے شامل رکھیں‏</text></g><g id="node-row-marks"><text class="sh" x="650" y="202" text-anchor="middle">‏نمبروں میں ایسی گراوٹ جس کی‏</text><text class="sh" x="650" y="228" text-anchor="middle">‏تدریسی وضاحت نہ ہو‏</text><text class="cell" x="528" y="202" text-anchor="end">‏سبق سے باہر کوئی چیز‏</text><text class="cell" x="528" y="228" text-anchor="end">‏بدل گئی ہے‏</text><text class="cell" x="288" y="202" text-anchor="end">‏دوبارہ سکھانے سے پہلے وسیع دیکھیں؛‏</text><text class="cell" x="288" y="228" text-anchor="end">‏پوچھیں، قیاس نہ کریں‏</text></g><g id="node-row-irritability"><text class="sh" x="650" y="282" text-anchor="middle">‏ایسی چڑچڑاہٹ جو موقعے سے‏</text><text class="sh" x="650" y="308" text-anchor="middle">‏بہت زیادہ ہو‏</text><text class="cell" x="528" y="282" text-anchor="end">‏بوجھ سہاراوں سے‏</text><text class="cell" x="528" y="308" text-anchor="end">‏بڑھ گیا ہے‏</text><text class="cell" x="288" y="282" text-anchor="end">‏مانگ کم کریں؛‏</text><text class="cell" x="288" y="308" text-anchor="end">‏احساس کو پرسکون نام دیں‏</text></g><g id="node-row-absence"><text class="sh" x="650" y="362" text-anchor="middle">‏بغیر وجہ یا بار بار کی‏</text><text class="sh" x="650" y="388" text-anchor="middle">‏غیر حاضری‏</text><text class="cell" x="528" y="362" text-anchor="end">‏کوئی چیز شاگرد کو‏</text><text class="cell" x="528" y="388" text-anchor="end">‏دور رکھ رہی ہو سکتی ہے‏</text><text class="cell" x="288" y="362" text-anchor="end">‏خاموش گفتگو،‏</text><text class="cell" x="288" y="388" text-anchor="end">‏سب کے سامنے سوال نہیں‏</text></g><g id="node-row-hopelessness"><text class="sh" x="650" y="455" text-anchor="middle">‏مایوسی کی بات‏</text><text class="cell" x="528" y="442" text-anchor="end">‏شاگرد آپ کو سب سے اہم‏</text><text class="cell" x="528" y="468" text-anchor="end">‏بات بتا رہا ہے جو وہ کر سکتا ہے‏</text><text class="cell" x="288" y="442" text-anchor="end">‏پوری طرح سنیں، کبھی نظر انداز نہ کریں،‏</text><text class="cell" x="288" y="468" text-anchor="end">‏اسی دن اگلے درجے کو بتائیں‏</text></g></g><g id="layer-labels"><text class="wm" x="12" y="520" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
