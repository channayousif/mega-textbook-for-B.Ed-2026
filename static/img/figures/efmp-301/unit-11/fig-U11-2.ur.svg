<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ نشانیاں جو استاد دیکھ سکتا ہے</title><desc id="d">پانچ نشانیاں کا جدول: کھنچ جانا، بغیر وضاحت نمبروں کی گراوٹ، موقعے سے بڑھی چڑچڑاہٹ، جھنڈ والی غیر حاضری، اور مایوسی کی بات، ہر ایک کے ساتھ ممکنہ مطلب اور استاد کے کردار کے اندر جواب۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:12.5px;font-weight:700;fill:var(--ink)}.sh{font-size:11.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 552 14V426M314 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M 12 74H768V78H12z"/><text class="h" x="660" y="48" text-anchor="middle">وہ نشانی جو استاد دیکھ سکے</text><text class="h" x="433" y="40" text-anchor="middle">ممکنہ</text><text class="h" x="433" y="60" text-anchor="middle">مطلب</text><text class="h" x="163" y="40" text-anchor="middle">استاد کے کردار کے اندر</text><text class="h" x="163" y="60" text-anchor="middle">جواب</text><text class="sh" x="660" y="112" text-anchor="middle">دوستوں اور سرگرمیوں</text><text class="sh" x="660" y="130" text-anchor="middle">سے کھنچ جانا</text><text class="body" x="540" y="102" text-anchor="end">تنہائی، اداسی،</text><text class="body" x="540" y="122" text-anchor="end">کمرے کا خوف</text><text class="body" x="302" y="102" text-anchor="end">ذاتی، پرسکون پوچھ گچھ؛</text><text class="body" x="302" y="122" text-anchor="end">شاگرد کو کردار کے ذریعے شامل رکھیں</text><text class="sh" x="660" y="196" text-anchor="middle">نمبروں میں ایسی گراوٹ جس کی</text><text class="sh" x="660" y="214" text-anchor="middle">تدریسی وضاحت نہ ہو</text><text class="body" x="540" y="186" text-anchor="end">سبق سے باہر کوئی چیز</text><text class="body" x="540" y="206" text-anchor="end">بدل گئی ہے</text><text class="body" x="302" y="186" text-anchor="end">دوبارہ سکھانے سے پہلے وسیع دیکھیں؛</text><text class="body" x="302" y="206" text-anchor="end">پوچھیں، قیاس نہ کریں</text><text class="sh" x="660" y="280" text-anchor="middle">ایسی چڑچڑاہٹ جو موقعے سے</text><text class="sh" x="660" y="298" text-anchor="middle">بہت زیادہ ہو</text><text class="body" x="540" y="270" text-anchor="end">بوجھ سہاراوں سے</text><text class="body" x="540" y="290" text-anchor="end">بڑھ گیا ہے</text><text class="body" x="302" y="270" text-anchor="end">مانگ کم کریں؛</text><text class="body" x="302" y="290" text-anchor="end">احساس کو پرسکون نام دیں</text><text class="sh" x="660" y="364" text-anchor="middle">ایسی غیر حاضری جو جھنڈ میں ہو</text><text class="sh" x="660" y="382" text-anchor="middle">(پیر، ویک اینڈ کے بعد)</text><text class="body" x="540" y="354" text-anchor="end">گھر کا مانگ</text><text class="body" x="540" y="374" text-anchor="end">بھاری ہے</text><text class="body" x="302" y="354" text-anchor="end">خاموش گفتگو،</text><text class="body" x="302" y="374" text-anchor="end">سب کے سامنے سوال نہیں</text><text class="sh" x="660" y="424" text-anchor="middle">مایوسی کی بات</text><text class="body" x="540" y="414" text-anchor="end">شاگرد آپ کو سب سے اہم</text><text class="body" x="540" y="432" font-size="12" text-anchor="end">بات بتا رہا ہے جو وہ کر سکتا ہے</text><text class="body" x="302" y="414" text-anchor="end">پوری طرح سنیں، کبھی نظر انداز نہ کریں،</text><text class="body" x="302" y="432" font-size="12" text-anchor="end">اسی دن اگلے درجے کو بتائیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
