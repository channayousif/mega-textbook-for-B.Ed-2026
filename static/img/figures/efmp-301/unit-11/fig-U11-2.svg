<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five signs a teacher can notice</title><desc id="d">A table of five signs a teacher can notice - withdrawal, unexplained fall in marks, out-of-scale irritability, clustered absence, and talk of hopelessness - each against a possible meaning and the response within the teacher's role.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:13px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M228 14V426M466 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="120" y="48" text-anchor="middle">sign a teacher can notice</text><text class="h" x="347" y="40" text-anchor="middle">a possible</text><text class="h" x="347" y="60" text-anchor="middle">meaning</text><text class="h" x="617" y="40" text-anchor="middle">the response within</text><text class="h" x="617" y="60" text-anchor="middle">the teacher's role</text><text class="sh" x="120" y="112" text-anchor="middle">withdrawal from friends</text><text class="sh" x="120" y="130" text-anchor="middle">and activities</text><text class="body" x="240" y="102">isolation, low mood,</text><text class="body" x="240" y="122">fear of the room</text><text class="body" x="478" y="102">a private, calm check-in;</text><text class="body" x="478" y="122">keep the pupil included by role</text><text class="sh" x="120" y="196" text-anchor="middle">a fall in marks with no</text><text class="sh" x="120" y="214" text-anchor="middle">teaching explanation</text><text class="body" x="240" y="186">something outside the</text><text class="body" x="240" y="206">lesson has changed</text><text class="body" x="478" y="186">look wider before re-teaching;</text><text class="body" x="478" y="206">ask, do not assume</text><text class="sh" x="120" y="280" text-anchor="middle">irritability out of scale</text><text class="sh" x="120" y="298" text-anchor="middle">with its trigger</text><text class="body" x="240" y="270">the load has exceeded</text><text class="body" x="240" y="290">the supports</text><text class="body" x="478" y="270">reduce the demand;</text><text class="body" x="478" y="290">name the feeling calmly</text><text class="sh" x="120" y="364" text-anchor="middle">absence that clusters</text><text class="sh" x="120" y="382" text-anchor="middle">(Mondays, after weekends)</text><text class="body" x="240" y="354">the home demand</text><text class="body" x="240" y="374">is heavy</text><text class="body" x="478" y="354">a quiet conversation,</text><text class="body" x="478" y="374">not a public question</text><text class="sh" x="120" y="424" text-anchor="middle">talk of hopelessness</text><text class="body" x="240" y="414">the pupil is telling you the</text><text class="body" x="240" y="432" font-size="12">most important thing they can</text><text class="body" x="478" y="414">listen fully, never dismiss,</text><text class="body" x="478" y="432" font-size="12">escalate the same day</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
