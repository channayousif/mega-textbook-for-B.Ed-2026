<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد کے پانچ اقدام برائے فلاح و بہبود</title><desc id="d">استاد کے پانچ فلاح اقدامات کا جدول، ہر ایک کے ساتھ کیا وہ سہارا دیتا ہے اور اس کی حد، رجوع کی حد بطور پیشہ نام کی گئی، ناکامی نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.item{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.dem{fill:var(--a3-fill)}.sup{fill:var(--a1-fill)}.link{stroke:var(--ink);stroke-width:2;fill:none}.beam{stroke:var(--ink);stroke-width:3;fill:none}.post{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="560" y="90" width="200" height="410"/><path class="grid" d="M560 20 V500 M310 20 V500 M760 170 H20 M760 250 H20 M760 330 H20 M760 410 H20"/><path class="rule" d="M760 90 H20"/><rect class="frame" x="20" y="20" width="740" height="480" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-0"><text class="sh" x="660" y="60" text-anchor="middle">‏استاد کا اقدام‏</text></g><g id="node-head-1"><text class="sh" x="435" y="60" text-anchor="middle">‏کیا چیز سہارا دیتی ہے‏</text></g><g id="node-head-2"><text class="sh" x="165" y="60" text-anchor="middle">‏اس کی حد‏</text></g><g id="node-row-greet"><text class="sh" x="660" y="135" text-anchor="middle">‏نام لے کر سلام‏</text><text class="cell" x="548" y="122" text-anchor="end">‏تعلق؛ وہ رشتہ جو ضرورت‏</text><text class="cell" x="548" y="148" text-anchor="end">‏سے پہلے موجود ہو‏</text><text class="cell" x="298" y="122" text-anchor="end">‏یہ گھر میں جو کچھ‏</text><text class="cell" x="298" y="148" text-anchor="end">‏ہوتا ہے وہاں نہیں پہنچتی‏</text></g><g id="node-row-routine"><text class="sh" x="660" y="202" text-anchor="middle">‏معمول کو‏</text><text class="sh" x="660" y="228" text-anchor="middle">‏مسلسل رکھیں‏</text><text class="cell" x="548" y="202" text-anchor="end">‏وہ پیشینی معلومی جس کے‏</text><text class="cell" x="548" y="228" text-anchor="end">‏بغیر خوف نہیں جی سکتا‏</text><text class="cell" x="298" y="202" text-anchor="end">‏یہ مانگیں کو خود‏</text><text class="cell" x="298" y="228" text-anchor="end">‏ختم نہیں کرتی‏</text></g><g id="node-row-reduce"><text class="sh" x="660" y="282" text-anchor="middle">‏اپنا مانگ کم‏</text><text class="sh" x="660" y="308" text-anchor="middle">‏کیجیے جو آپ کے قبضے میں ہو‏</text><text class="cell" x="548" y="282" text-anchor="end">‏ایسا بوجھ جو کام کی‏</text><text class="cell" x="548" y="308" text-anchor="end">‏میز میں سمائے‏</text><text class="cell" x="298" y="282" text-anchor="end">‏یہ امتحان کی‏</text><text class="cell" x="298" y="308" text-anchor="end">‏ثقافت اکیلی نہیں بدل سکتی‏</text></g><g id="node-row-name"><text class="sh" x="660" y="375" text-anchor="middle">‏احساس کو پرسکون نام دیں‏</text><text class="cell" x="548" y="362" text-anchor="end">‏میز واپس ملی؛‏</text><text class="cell" x="548" y="388" text-anchor="end">‏احساس کا احترام‏</text><text class="cell" x="298" y="362" text-anchor="end">‏نام دینا‏</text><text class="cell" x="298" y="388" text-anchor="end">‏علاج نہیں‏</text></g><g id="node-row-refer"><text class="sh" x="660" y="447" text-anchor="middle">‏اسی دن حوالہ دیں،‏</text><text class="sh" x="660" y="473" text-anchor="middle">‏باتیں لکھ کر‏</text><text class="cell" x="548" y="447" text-anchor="end">‏شاگرد صحیح‏</text><text class="cell" x="548" y="473" text-anchor="end">‏ہاتھوں میں‏</text><text class="cell" x="298" y="447" text-anchor="end">‏استاد کا حصہ رجوع پر ختم -‏</text><text class="cell" x="298" y="473" text-anchor="end">‏یہ پیشہ ورانہ اخلاق ہے، ناکامی نہیں‏</text></g></g><g id="layer-labels"><text class="wm" x="12" y="530" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
