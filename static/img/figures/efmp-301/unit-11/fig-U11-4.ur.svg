<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد کے پانچ اقدام برائے فلاح و بہبود</title><desc id="d">استاد کے پانچ اقداموں کا جدول: ہر ایک کے ساتھ کیا چیز سہارا دیتی ہے اور اس کی حد، اور حوالگی کی حد کو پیشہ ورانہ اخلاق کہا گیا، ناکامی نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:12.5px;font-weight:700;fill:var(--ink)}.sh{font-size:11.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 598 14V426M448 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="683" y="48" text-anchor="middle">استاد کا اقدام</text><text class="h" x="465" y="40" text-anchor="middle">کیا چیز</text><text class="h" x="465" y="60" text-anchor="middle">سہارا دیتی ہے</text><text class="h" x="172" y="40" text-anchor="middle">اس کی</text><text class="h" x="172" y="60" text-anchor="middle">حد</text><text class="sh" x="683" y="112" text-anchor="middle">نام لے کر سلام</text><text class="body" x="586" y="102" text-anchor="end">تعلق؛ وہ رشتہ جو ضرورت</text><text class="body" x="586" y="122" text-anchor="end">سے پہلے موجود ہو</text><text class="body" x="320" y="102" text-anchor="end">یہ گھر میں جو کچھ</text><text class="body" x="320" y="122" text-anchor="end">ہوتا ہے وہاں نہیں پہنچتی</text><text class="sh" x="683" y="196" text-anchor="middle">معمول کو</text><text class="sh" x="683" y="214" text-anchor="middle">مسلسل رکھیں</text><text class="body" x="586" y="186" text-anchor="end">وہ پیشینی معلومی جس کے</text><text class="body" x="586" y="206" text-anchor="end">بغیر خوف نہیں جی سکتا</text><text class="body" x="320" y="186" text-anchor="end">یہ تقاضے کو خود</text><text class="body" x="320" y="206" text-anchor="end">ختم نہیں کرتی</text><text class="sh" x="683" y="280" text-anchor="middle">اپنا تقاضا کم</text><text class="sh" x="683" y="298" text-anchor="middle">کیجیے جو آپ کے قبضے میں ہو</text><text class="body" x="586" y="270" text-anchor="end">ایسا بوجھ جو کام کی</text><text class="body" x="586" y="290" text-anchor="end">میز میں سمائے</text><text class="body" x="320" y="270" text-anchor="end">یہ امتحان کی</text><text class="body" x="320" y="290" text-anchor="end">ثقافت اکیلی نہیں بدل سکتی</text><text class="sh" x="683" y="364" text-anchor="middle">احساس کو پرسکون نام دیں</text><text class="body" x="586" y="354" text-anchor="end">میز واپس ملی؛</text><text class="body" x="586" y="374" text-anchor="end">احساس کا احترام</text><text class="body" x="320" y="354" text-anchor="end">نام دینا</text><text class="body" x="320" y="374" text-anchor="end">علاج نہیں</text><text class="sh" x="683" y="420" text-anchor="middle">اسی دن حوالہ دیں،</text><text class="sh" x="683" y="438" text-anchor="middle">باتیں لکھ کر</text><text class="body" x="586" y="424" text-anchor="end">شاگرد صحیح</text><text class="body" x="586" y="444" font-size="12" text-anchor="end">ہاتھوں میں</text><text class="body" x="320" y="424" font-size="11.5" text-anchor="end">استاد کا حصہ حوالگی پر ختم -</text><text class="body" x="320" y="442" font-size="11.5" text-anchor="end">یہ پیشہ ورانہ اخلاق ہے، ناکامی نہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
