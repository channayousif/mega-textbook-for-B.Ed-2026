<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فلاح و بہبود کا توازن</title><desc id="d">فلاح و بہبود کا توازن: بائیں پلڑے میں مانگیں - امتحانات، موازنہ، شور اور گرمی، گھر کا بوجھ - اور دائیں میں سہارے - معمول، تعلق، رائے، تحفظ، توجہ دینے والا - اور یاد دہانی کہ فلاح توازن ہے، مانگوں کی غیر موجودگی نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:3;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">فلاح و بہبود ایک توازن ہے</text><path class="stroke" d="M 390 80L 390 130"/><path class="stroke" d="M 600 130L 180 130"/><path class="stroke" d="M 600 130L 600 160"/><path class="stroke" d="M 180 130L 180 160"/><path class="stroke" d="M 450 66L 330 66M 390 66L 390 130"/><rect class="panel" x="480" y="160" width="240" height="180" rx="10"/><text class="sh" x="600" y="188" text-anchor="middle">مانگیں</text><rect class="ink" x="510" y="202" width="180" height="24" rx="4"/><text x="600" y="219" text-anchor="middle" font-size="12" fill="var(--bg)">امتحانات</text><rect class="ink" x="510" y="232" width="180" height="24" rx="4"/><text x="600" y="249" text-anchor="middle" font-size="12" fill="var(--bg)">موازنہ</text><rect class="ink" x="510" y="262" width="180" height="24" rx="4"/><text x="600" y="279" text-anchor="middle" font-size="12" fill="var(--bg)">شور اور گرمی</text><rect class="ink" x="510" y="292" width="180" height="24" rx="4"/><text x="600" y="309" text-anchor="middle" font-size="12" fill="var(--bg)">گھر کا بوجھ</text><rect class="panel" x="60" y="160" width="240" height="230" rx="10"/><text class="sh" x="180" y="188" text-anchor="middle">سہارے</text><rect class="ink" x="90" y="202" width="180" height="24" rx="4"/><text x="180" y="219" text-anchor="middle" font-size="12" fill="var(--bg)">معمول</text><rect class="ink" x="90" y="232" width="180" height="24" rx="4"/><text x="180" y="249" text-anchor="middle" font-size="12" fill="var(--bg)">تعلق</text><rect class="ink" x="90" y="262" width="180" height="24" rx="4"/><text x="180" y="279" text-anchor="middle" font-size="11" fill="var(--bg)">اگلا مرحلہ بتانے والی رائے</text><rect class="ink" x="90" y="292" width="180" height="24" rx="4"/><text x="180" y="309" text-anchor="middle" font-size="12" fill="var(--bg)">تحفظ</text><rect class="ink" x="90" y="322" width="180" height="24" rx="4"/><text x="180" y="339" text-anchor="middle" font-size="12" fill="var(--bg)">کوئی جو توجہ دے</text><text class="small" x="390" y="440" text-anchor="middle">فلاح و بہبود توازن ہے، مانگوں کی غیر موجودگی نہیں - اسکول سہارے ڈیزائن کرتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
