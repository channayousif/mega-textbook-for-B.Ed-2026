<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of creativity with its four observable parts</title><desc id="d">A concept map of creativity with its four observable parts - fluency, flexibility, originality and elaboration - linked to divergent and convergent thinking, with giftedness beside it as an educational need rather than a prize.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}.core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.dash{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:7 5;fill:none}.note{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="26" y="31">Creativity: observable parts, thinking modes and educational need</text><g class="stroke"><path d="M323 179L315 110"/><path d="M269 225L204 202"/><path d="M368 193L493 112"/><path d="M323 273L315 371"/><path d="M269 251L214 316"/></g><rect class="panel" x="226" y="49" width="178" height="61" rx="10"/><text class="sh" x="315" y="74" text-anchor="middle">fluency</text><text class="small" x="315" y="94" text-anchor="middle">many ideas</text><rect class="panel" x="26" y="162" width="178" height="76" rx="10"/><text class="sh" x="115" y="188" text-anchor="middle">originality</text><text class="small" x="115" y="208" text-anchor="middle">ideas that are new here</text><rect class="panel" x="226" y="371" width="178" height="67" rx="10"/><text class="sh" x="315" y="397" text-anchor="middle">elaboration</text><text class="small" x="315" y="417" text-anchor="middle">ideas worked out in detail</text><rect class="panel" x="493" y="52" width="242" height="60" rx="10"/><text class="sh" x="614" y="77" text-anchor="middle">flexibility</text><text class="small" x="614" y="97" text-anchor="middle">different kinds of ideas</text><ellipse class="core" cx="323" cy="226" rx="72" ry="48"/><text class="h" x="323" y="232" text-anchor="middle">creativity</text><rect class="note" x="26" y="296" width="188" height="126" rx="10"/><text class="sh" x="120" y="320" text-anchor="middle">giftedness</text><text class="small" x="120" y="342" text-anchor="middle">unusual level of skill</text><text class="small" x="120" y="360" text-anchor="middle">or knowledge, an</text><text class="small" x="120" y="378" text-anchor="middle">educational need</text><path class="grid" d="M47 393H193"/><text class="small" x="120" y="411" text-anchor="middle">not a prize, and not an</text><text class="small" x="120" y="427" text-anchor="middle">exemption from teaching</text><path class="dash" d="M395 211C430 201 444 191 476 191" marker-end="url(#arrow)"/><path class="dash" d="M395 244C430 257 444 284 476 302" marker-end="url(#arrow)"/><rect class="panel" x="477" y="145" width="270" height="85" rx="10"/><text class="sh" x="612" y="172" text-anchor="middle">divergent thinking</text><text class="body" x="612" y="195" text-anchor="middle">many possible answers</text><rect class="panel" x="477" y="276" width="270" height="85" rx="10"/><text class="sh" x="612" y="303" text-anchor="middle">convergent thinking</text><text class="body" x="612" y="326" text-anchor="middle">the one well-established answer</text><text class="small" x="440" y="271" text-anchor="middle">both are needed</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
