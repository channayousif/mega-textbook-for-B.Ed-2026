<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئی کیو اسکور کیا دکھاتا ہے اور کیا چھوڑتا ہے</title><desc id="d">چار پیمائش حقائق کا جدول: نمبر، بینڈ، پیشن گوئی اور تاریخ: ہر ایک کے ساتھ حقیقت، وہ کیا نہیں دکھاتی، اور استاد کا موقف۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="492"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="432" rx="8"/><path id="region-header" class="head" d="M752 20 H28 A8 8 0 0 0 20 28 V100 H760 V28 A8 8 0 0 0 752 20 z"/><rect class="band" x="640" y="101" width="119" height="350"/><path class="grid" d="M640 20 V452 M430 20 V452 M220 20 V452 M760 188 H20 M760 276 H20 M760 364 H20"/><path class="rule" d="M760 100 H20"/><rect class="frame" x="20" y="20" width="740" height="432" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="748" y="53" text-anchor="end">ٹیسٹ کیا</text><text class="h" x="748" y="79" text-anchor="end">کرتا ہے</text><text class="h" x="628" y="66" text-anchor="end">حقیقت</text><text class="h" x="418" y="53" text-anchor="end">یہ کیا بات</text><text class="h" x="418" y="79" text-anchor="end">ہرگز نہیں دکھاتا</text><text class="h" x="208" y="53" text-anchor="end">استاد کا</text><text class="h" x="208" y="79" text-anchor="end">موقف</text></g><g id="node-row-score"><text class="sh" x="748" y="136" text-anchor="end">اسکور</text><text class="small" x="748" y="160" text-anchor="end">ایک عدد</text><text class="cell" x="628" y="136" text-anchor="end">معیاری بنائے گئے ٹیسٹ کا عدد:</text><text class="cell" x="628" y="161" text-anchor="end">اوسط 100، انحراف 15</text><text class="cell" x="418" y="136" text-anchor="end">نمونہ شدہ کاموں پر کارکردگی</text><text class="cell" x="418" y="161" text-anchor="end">کا خلاصہ</text><text class="cell" x="208" y="136" text-anchor="end">ثبوت کا ایک ذریعہ،</text><text class="cell" x="208" y="161" text-anchor="end">کبھی فیصلہ نہیں</text></g><g id="node-row-band"><text class="sh" x="748" y="224" text-anchor="end">پٹی</text><text class="small" x="748" y="248" text-anchor="end">85 تا 115</text><text class="cell" x="628" y="224" text-anchor="end">85 تا 115 تقریباً دو تہائی</text><text class="cell" x="628" y="249" text-anchor="end">افراد کو احاطہ کرتی ہے</text><text class="cell" x="418" y="224" text-anchor="end">کہ پٹی سے باہر والے کم</text><text class="cell" x="418" y="249" text-anchor="end">قدر کے ہیں</text><text class="cell" x="208" y="224" text-anchor="end">پٹیاں بیان کرتی ہیں،</text><text class="cell" x="208" y="249" text-anchor="end">فیصلہ نہیں کرتیں</text></g><g id="node-row-scope"><text class="sh" x="748" y="312" text-anchor="end">پیش گوئی</text><text class="small" x="748" y="336" text-anchor="end">صرف اسکول</text><text class="cell" x="628" y="312" text-anchor="end">اسکول کی کارکردگی کی درمیانہ</text><text class="cell" x="628" y="337" text-anchor="end">درجے کی پیش گوئی کرتا ہے</text><text class="cell" x="418" y="312" text-anchor="end">جو اسکول سکھاتا ہے اس کا</text><text class="cell" x="418" y="337" text-anchor="end">باقی تقریباً کچھ نہیں</text><text class="cell" x="208" y="312" text-anchor="end">مدد کے فیصلوں کے لیے،</text><text class="cell" x="208" y="337" text-anchor="end">لیبل کے لیے نہیں</text></g><g id="node-row-history"><text class="sh" x="748" y="400" text-anchor="end">تاریخ</text><text class="small" x="748" y="424" text-anchor="end">یاد رکھیں</text><text class="cell" x="628" y="400" text-anchor="end">ابتدائی ٹیسٹوں نے لوگوں کو</text><text class="cell" x="628" y="425" text-anchor="end">نامنصفانہ درجہ دیا</text><text class="cell" x="418" y="400" text-anchor="end">کہ آج کے ٹیسٹ اس خطرے سے</text><text class="cell" x="418" y="425" text-anchor="end">مبرا نہیں ہیں</text><text class="cell" x="208" y="400" text-anchor="end">تاریخ جانیں،</text><text class="cell" x="208" y="425" text-anchor="end">عاجزی رکھیں</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="480" text-anchor="start">textbook.com.pk</text></g></svg>
