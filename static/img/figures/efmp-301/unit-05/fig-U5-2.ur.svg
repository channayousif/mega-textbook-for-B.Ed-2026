<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئی کیو اسکور کیا دکھاتا ہے اور کیا چھوڑتا ہے</title><desc id="d">چار پیمائشی حقیقتوں کا جدول: اسکور، پٹی، پیش گوئی اور تاریخ، ہر ایک کے ساتھ حقیقت، جو وہ ہرگز نہیں دکھاتا، اور استاد کا موضع۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:13px;fill:var(--ink)}.head{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.label{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.celltext{font-size:12px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="head" x="652" y="16" width="116" height="82" rx="5"/><rect class="head" x="462" y="16" width="190" height="82" rx="5"/><rect class="head" x="242" y="16" width="220" height="82" rx="5"/><rect class="head" x="12" y="16" width="230" height="82" rx="5"/><rect class="label" x="652" y="98" width="116" height="82" rx="5"/><rect class="cell" x="462" y="98" width="190" height="82" rx="5"/><rect class="cell" x="242" y="98" width="220" height="82" rx="5"/><rect class="cell" x="12" y="98" width="230" height="82" rx="5"/><rect class="label" x="652" y="180" width="116" height="82" rx="5"/><rect class="cell" x="462" y="180" width="190" height="82" rx="5"/><rect class="cell" x="242" y="180" width="220" height="82" rx="5"/><rect class="cell" x="12" y="180" width="230" height="82" rx="5"/><rect class="label" x="652" y="262" width="116" height="82" rx="5"/><rect class="cell" x="462" y="262" width="190" height="82" rx="5"/><rect class="cell" x="242" y="262" width="220" height="82" rx="5"/><rect class="cell" x="12" y="262" width="230" height="82" rx="5"/><rect class="label" x="652" y="344" width="116" height="82" rx="5"/><rect class="cell" x="462" y="344" width="190" height="82" rx="5"/><rect class="cell" x="242" y="344" width="220" height="82" rx="5"/><rect class="cell" x="12" y="344" width="230" height="82" rx="5"/><text class="h" x="710" y="49" text-anchor="middle">ٹیسٹ کیا</text><text class="h" x="710" y="70" text-anchor="middle">کرتا ہے</text><text class="h" x="557" y="60" text-anchor="middle">حقیقت</text><text class="h" x="352" y="49" text-anchor="middle">یہ کیا بات</text><text class="h" x="352" y="70" text-anchor="middle">ہرگز نہیں دکھاتا</text><text class="h" x="127" y="49" text-anchor="middle">استاد کا</text><text class="h" x="127" y="70" text-anchor="middle">موقف</text><text class="sh" x="710" y="133" text-anchor="middle">اسکور</text><text class="small" x="710" y="153" text-anchor="middle">ایک عدد</text><text class="celltext" x="557" y="132" text-anchor="middle">معیاری بنائے گئے ٹیسٹ کا عدد:</text><text class="celltext" x="557" y="150" text-anchor="middle">اوسط 100، انحراف 15</text><text class="celltext" x="352" y="132" text-anchor="middle">نمونہ شدہ کاموں پر کارکردگی</text><text class="celltext" x="352" y="150" text-anchor="middle">کا خلاصہ</text><text class="celltext" x="127" y="132" text-anchor="middle">شہادت کا ایک ذریعہ،</text><text class="celltext" x="127" y="150" text-anchor="middle">کبھی فیصلہ نہیں</text><text class="sh" x="710" y="215" text-anchor="middle">پٹی</text><text class="small" x="710" y="235" text-anchor="middle">85 تا 115</text><text class="celltext" x="557" y="214" text-anchor="middle">85 تا 115 تقریباً دو تہائی</text><text class="celltext" x="557" y="232" text-anchor="middle">افراد کو احاطہ کرتی ہے</text><text class="celltext" x="352" y="214" text-anchor="middle">کہ پٹی سے باہر والے کم</text><text class="celltext" x="352" y="232" text-anchor="middle">قدر کے ہیں</text><text class="celltext" x="127" y="214" text-anchor="middle">پٹیاں بیان کرتی ہیں،</text><text class="celltext" x="127" y="232" text-anchor="middle">فیصلہ نہیں کرتیں</text><text class="sh" x="710" y="297" text-anchor="middle">پیش گوئی</text><text class="small" x="710" y="317" text-anchor="middle">صرف اسکول</text><text class="celltext" x="557" y="296" text-anchor="middle">اسکول کی کارکردگی کی درمیانہ</text><text class="celltext" x="557" y="314" text-anchor="middle">درجے کی پیش گوئی کرتا ہے</text><text class="celltext" x="352" y="296" text-anchor="middle">جو اسکول سکھاتا ہے اس کا</text><text class="celltext" x="352" y="314" text-anchor="middle">باقی تقریباً کچھ نہیں</text><text class="celltext" x="127" y="296" text-anchor="middle">مدد کے فیصلوں کے لیے،</text><text class="celltext" x="127" y="314" text-anchor="middle">لیبل کے لیے نہیں</text><text class="sh" x="710" y="379" text-anchor="middle">تاریخ</text><text class="small" x="710" y="399" text-anchor="middle">یاد رکھیں</text><text class="celltext" x="557" y="378" text-anchor="middle">early tests ranked people</text><text class="celltext" x="557" y="396" text-anchor="middle">unjustly</text><text class="celltext" x="352" y="378" text-anchor="middle">that today's tests are free</text><text class="celltext" x="352" y="396" text-anchor="middle">of that risk</text><text class="celltext" x="127" y="378" text-anchor="middle">know the history,</text><text class="celltext" x="127" y="396" text-anchor="middle">hold the humility</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
