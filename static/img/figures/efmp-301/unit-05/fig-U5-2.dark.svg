<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four measurement facts</title><desc id="d">A table of four measurement facts - the score, the band, the prediction and the history - each against the fact, what it does not show, and the teacher's stance.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.head{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.label{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.celltext{font-size:12px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="head" x="12" y="16" width="116" height="82" rx="5"/><rect class="head" x="128" y="16" width="190" height="82" rx="5"/><rect class="head" x="318" y="16" width="220" height="82" rx="5"/><rect class="head" x="538" y="16" width="230" height="82" rx="5"/><rect class="label" x="12" y="98" width="116" height="82" rx="5"/><rect class="cell" x="128" y="98" width="190" height="82" rx="5"/><rect class="cell" x="318" y="98" width="220" height="82" rx="5"/><rect class="cell" x="538" y="98" width="230" height="82" rx="5"/><rect class="label" x="12" y="180" width="116" height="82" rx="5"/><rect class="cell" x="128" y="180" width="190" height="82" rx="5"/><rect class="cell" x="318" y="180" width="220" height="82" rx="5"/><rect class="cell" x="538" y="180" width="230" height="82" rx="5"/><rect class="label" x="12" y="262" width="116" height="82" rx="5"/><rect class="cell" x="128" y="262" width="190" height="82" rx="5"/><rect class="cell" x="318" y="262" width="220" height="82" rx="5"/><rect class="cell" x="538" y="262" width="230" height="82" rx="5"/><rect class="label" x="12" y="344" width="116" height="82" rx="5"/><rect class="cell" x="128" y="344" width="190" height="82" rx="5"/><rect class="cell" x="318" y="344" width="220" height="82" rx="5"/><rect class="cell" x="538" y="344" width="230" height="82" rx="5"/><text class="h" x="70" y="49" text-anchor="middle">what a test</text><text class="h" x="70" y="70" text-anchor="middle">does</text><text class="h" x="223" y="60" text-anchor="middle">the fact</text><text class="h" x="428" y="49" text-anchor="middle">what it does</text><text class="h" x="428" y="70" text-anchor="middle">NOT show</text><text class="h" x="653" y="49" text-anchor="middle">the teacher's</text><text class="h" x="653" y="70" text-anchor="middle">stance</text><text class="sh" x="70" y="133" text-anchor="middle">the score</text><text class="small" x="70" y="153" text-anchor="middle">a number</text><text class="celltext" x="223" y="132" text-anchor="middle">a number from a standardised</text><text class="celltext" x="223" y="150" text-anchor="middle">test: mean 100, deviation 15</text><text class="celltext" x="428" y="132" text-anchor="middle">a summary of performance</text><text class="celltext" x="428" y="150" text-anchor="middle">on the sampled tasks</text><text class="celltext" x="653" y="132" text-anchor="middle">one source of evidence,</text><text class="celltext" x="653" y="150" text-anchor="middle">never a verdict</text><text class="sh" x="70" y="215" text-anchor="middle">the band</text><text class="small" x="70" y="235" text-anchor="middle">85 to 115</text><text class="celltext" x="223" y="214" text-anchor="middle">85 to 115 covers about</text><text class="celltext" x="223" y="232" text-anchor="middle">two-thirds of people</text><text class="celltext" x="428" y="214" text-anchor="middle">that those outside the band</text><text class="celltext" x="428" y="232" text-anchor="middle">are worth less</text><text class="celltext" x="653" y="214" text-anchor="middle">bands describe,</text><text class="celltext" x="653" y="232" text-anchor="middle">they do not decide</text><text class="sh" x="70" y="297" text-anchor="middle">the prediction</text><text class="small" x="70" y="317" text-anchor="middle">school only</text><text class="celltext" x="223" y="296" text-anchor="middle">predicts school performance</text><text class="celltext" x="223" y="314" text-anchor="middle">moderately well</text><text class="celltext" x="428" y="296" text-anchor="middle">almost nothing else</text><text class="celltext" x="428" y="314" text-anchor="middle">a school grows</text><text class="celltext" x="653" y="296" text-anchor="middle">use for support decisions,</text><text class="celltext" x="653" y="314" text-anchor="middle">not labels</text><text class="sh" x="70" y="379" text-anchor="middle">the history</text><text class="small" x="70" y="399" text-anchor="middle">remember</text><text class="celltext" x="223" y="378" text-anchor="middle">early tests ranked people</text><text class="celltext" x="223" y="396" text-anchor="middle">unjustly</text><text class="celltext" x="428" y="378" text-anchor="middle">that today's tests are free</text><text class="celltext" x="428" y="396" text-anchor="middle">of that risk</text><text class="celltext" x="653" y="378" text-anchor="middle">know the history,</text><text class="celltext" x="653" y="396" text-anchor="middle">hold the humility</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
