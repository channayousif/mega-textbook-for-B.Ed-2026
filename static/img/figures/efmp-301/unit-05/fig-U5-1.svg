<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A diagram of intelligence theories on one axis, from Spearman's single general factor g on the left to Gardner's eight intelligences on the right</title><desc id="d">A diagram of intelligence theories on one axis, from Spearman's single general factor g on the left to Gardner's eight intelligences on the right, with middle positions (a general factor plus distinct strands) midway, and a caption that a teacher's position decides what intelligent means.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="28" y="34">Intelligence theories: one axis, different meanings</text><rect class="panel" x="26" y="62" width="258" height="112" rx="10"/><text class="sh" x="155" y="86" text-anchor="middle">one general ability</text><circle class="ink" cx="82" cy="125" r="25"/><text x="82" y="132" text-anchor="middle" fill="var(--bg)" font-size="22" font-weight="700">g</text><text class="body" x="121" y="113">Spearman: one general</text><text class="body" x="121" y="133">factor, g, measurable and</text><text class="body" x="121" y="153">comparable among individuals</text><rect class="panel" x="438" y="62" width="316" height="112" rx="10"/><text class="sh" x="596" y="86" text-anchor="middle">many relatively independent abilities</text><g class="ink"><circle cx="466" cy="113" r="8"/><circle cx="489" cy="104" r="8"/><circle cx="512" cy="113" r="8"/><circle cx="477" cy="136" r="8"/><circle cx="501" cy="136" r="8"/><circle cx="524" cy="136" r="8"/><circle cx="489" cy="157" r="8"/><circle cx="513" cy="157" r="8"/></g><text class="body" x="548" y="109">Gardner: at least eight</text><text class="small" x="548" y="121">intelligences - linguistic,</text><text class="small" x="548" y="133">logical-mathematical,</text><text class="small" x="548" y="145">musical, bodily kinesthetic,</text><text class="small" x="548" y="157">spatial, interpersonal,</text><text class="small" x="548" y="169">intrapersonal, naturalistic</text><line class="grid" x1="80" y1="212" x2="700" y2="212"/><line class="stroke" x1="80" y1="212" x2="700" y2="212" marker-end="url(#arrow)"/><line class="stroke" x1="80" y1="201" x2="80" y2="223"/><line class="stroke" x1="700" y1="201" x2="700" y2="223"/><text class="small" x="80" y="240" text-anchor="middle">one general ability</text><text class="small" x="700" y="240" text-anchor="middle">many abilities</text><line class="stroke-a" x1="390" y1="192" x2="390" y2="238" stroke-dasharray="5 4"/><path d="M390 190l11 11-11 11-11-11z" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect class="panel" x="254" y="260" width="272" height="49" rx="10"/><text class="sh" x="390" y="283" text-anchor="middle">Middle positions:</text><text class="body" x="390" y="301" text-anchor="middle">a general factor plus distinct strands</text><path class="stroke-a" d="M390 238v15"/><rect x="58" y="344" width="664" height="68" rx="12" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="390" y="372" text-anchor="middle">where a teacher stands on this axis decides what</text><text class="h" x="390" y="395" text-anchor="middle">the word intelligent means in the staff room</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
