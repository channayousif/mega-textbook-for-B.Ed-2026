<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ذہانت کے نظریوں کا ایک محور</title><desc id="d">ذہانت کے نظریوں کا محور: بائیں طرف اسپئرمین کا ایک عام عامل، دائیں طرف گارڈنر کی کم از کم آٹھ ذہانتیں، بیچ میں تھراسٹون کی چند بنیادی صلاحیتیں، اور یہ یاد دہانی کہ استاد کا مقام طے کرتا ہے کہ ذہین کا کیا مطلب ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{font-size:13px;fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 780 0L 770 5L 780 10z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="752" y="34">ذہانت کے نظریے: ایک محور، مختلف معنی</text><rect class="panel" x="496" y="62" width="258" height="112" rx="10"/><text class="sh" x="625" y="86" text-anchor="middle">ایک عام صلاحیت</text><circle class="ink" cx="698" cy="125" r="25"/><text x="698" y="132" text-anchor="middle" fill="var(--bg)" font-size="22" font-weight="700">جی</text><text class="body" x="659" y="113">اسپئرمین: ایک عام</text><text class="body" x="659" y="133">عامل جی، قابلِ پیمائش اور</text><text class="body" x="659" y="153">افراد کے درمیان قابلِ موازنہ</text><rect class="panel" x="26" y="62" width="316" height="112" rx="10"/><text class="sh" x="184" y="86" text-anchor="middle">کئی نسبتاً الگ صلاحیتیں</text><g class="ink"><circle cx="314" cy="113" r="8"/><circle cx="291" cy="104" r="8"/><circle cx="268" cy="113" r="8"/><circle cx="303" cy="136" r="8"/><circle cx="279" cy="136" r="8"/><circle cx="256" cy="136" r="8"/><circle cx="291" cy="157" r="8"/><circle cx="267" cy="157" r="8"/></g><text class="body" x="232" y="109">گارڈنر: کم از کم آٹھ</text><text class="small" x="232" y="121">ذہانتیں: لسانی،</text><text class="small" x="232" y="133">منطقی ریاضیاتی،</text><text class="small" x="232" y="145">موسیقی، جسمانی حرکی،</text><text class="small" x="232" y="157">مکانی، بین الاشخاصی،</text><text class="small" x="232" y="169">خود شعوری، فطری</text><line class="grid" x1="700" y1="212" x2="80" y2="212"/><line class="stroke" x1="700" y1="212" x2="80" y2="212" marker-end="url(#arrow)"/><line class="stroke" x1="700" y1="201" x2="700" y2="223"/><line class="stroke" x1="80" y1="201" x2="80" y2="223"/><text class="small" x="700" y="240" text-anchor="middle">ایک عام صلاحیت</text><text class="small" x="80" y="240" text-anchor="middle">کئی صلاحیتیں</text><line class="stroke-a" x1="390" y1="192" x2="390" y2="238" stroke-dasharray="5 4"/><path d="M 390 190l11 11-11 11-11-11z" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect class="panel" x="254" y="260" width="272" height="49" rx="10"/><text class="sh" x="390" y="283" text-anchor="middle">تھراسٹون اور دیگر:</text><text class="body" x="390" y="301" text-anchor="middle">چند بنیادی صلاحیتیں</text><path class="stroke-a" d="M 390 238v15"/><rect x="58" y="344" width="664" height="68" rx="12" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="390" y="372" text-anchor="middle">استاد اس محور پر کہاں کھڑا ہے، یہ طے کرتا ہے</text><text class="h" x="390" y="395" text-anchor="middle">کہ اسٹاف روم میں لفظ ذہین کا کیا مطلب ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
