<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ذہانت کے نظریوں کا ایک محور</title><desc id="d">ذہانت کے نظریوں کا ایک محور پر خاکہ، بائیں اسپیئرمین کا اکیلا عمومی عنصر g سے دائیں گارڈنر کی آٹھ ذہانتوں تک، بیچ میں درمیانی مقامات (ایک عمومی عنصر اور الگ دھاگیں)، کیپشن کے ساتھ کہ استاد کا مقام طے کرتا ہے ذہین کا مطلب کیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><g id="layer-regions"><rect id="region-caption" class="panel-a" x="40" y="460" width="700" height="84" rx="10"/></g><g id="layer-edges"><line id="edge-general-many" class="stroke" x1="60" y1="300" x2="720" y2="300" marker-end="url(#arrow)"/><line class="stroke" x1="60" y1="288" x2="60" y2="312"/><line class="dash" id="edge-axis-middle" x1="390" y1="314" x2="390" y2="360"/></g><g id="layer-nodes"><g id="node-general"><rect class="panel" x="20" y="60" width="360" height="190" rx="10"/><text class="sh" x="200" y="88" text-anchor="middle">ایک عام صلاحیت</text><circle class="ink" cx="64" cy="155" r="26"/><text class="knock" x="64" y="162" text-anchor="middle">جی</text><text class="body" x="356" y="132" text-anchor="end">اسپئرمین: ایک عام</text><text class="body" x="356" y="158" text-anchor="end">عامل جی، قابلِ پیمائش اور</text><text class="body" x="356" y="184" text-anchor="end">افراد کے درمیان قابلِ موازنہ</text></g><g id="node-many"><rect class="panel" x="400" y="60" width="360" height="190" rx="10"/><text class="sh" x="580" y="88" text-anchor="middle">کئی نسبتاً الگ صلاحیتیں</text><circle class="ink" cx="424" cy="133" r="8"/><circle class="ink" cx="448" cy="125" r="8"/><circle class="ink" cx="472" cy="133" r="8"/><circle class="ink" cx="430" cy="157" r="8"/><circle class="ink" cx="454" cy="157" r="8"/><circle class="ink" cx="478" cy="157" r="8"/><circle class="ink" cx="442" cy="181" r="8"/><circle class="ink" cx="466" cy="181" r="8"/><text class="body" x="748" y="118" text-anchor="end">گارڈنر: کم از کم آٹھ</text><text class="small" x="748" y="142" text-anchor="end">ذہانتیں: لسانی،</text><text class="small" x="748" y="165" text-anchor="end">منطقی ریاضیاتی،</text><text class="small" x="748" y="188" text-anchor="end">موسیقی، جسمانی حرکی،</text><text class="small" x="748" y="211" text-anchor="end">مکانی، بین الاشخاصی،</text><text class="small" x="748" y="234" text-anchor="end">خود شعوری، فطری</text></g><g id="node-middle"><polygon class="panel-a" points="390,286 404,300 390,314 376,300"/><rect class="panel" x="160" y="360" width="460" height="84" rx="10"/><text class="sh" x="390" y="386" text-anchor="middle">درمیانی مقامات:</text><text class="body" x="390" y="414" text-anchor="middle">ایک عام عنصر اور الگ دھاگیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="36" text-anchor="end">ذہانت کے نظریے: ایک محور، مختلف معنی</text><text class="small" x="40" y="336" text-anchor="start">ایک عام صلاحیت</text><text class="small" x="740" y="336" text-anchor="end">کئی صلاحیتیں</text><text class="h" x="390" y="494" text-anchor="middle">استاد اس محور پر کہاں کھڑا ہے، یہ طے کرتا ہے</text><text class="h" x="390" y="522" text-anchor="middle">کہ اسٹاف روم میں لفظ ذہین کا کیا مطلب ہے</text><text aria-hidden="true" class="wm" x="12" y="568" text-anchor="start">textbook.com.pk</text></g></svg>
