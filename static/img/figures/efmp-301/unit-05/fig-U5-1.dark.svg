<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A diagram of intelligence theories on one axis, from Spearman's single general factor g on the left to Gardner's eight intelligences on the right</title><desc id="d">A diagram of intelligence theories on one axis, from Spearman's single general factor g on the left to Gardner's eight intelligences on the right, with the middle positions (a general factor plus distinct strands) midway, and a caption that a teacher's position decides what intelligent means.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><g id="layer-regions"><rect id="region-caption" class="panel-a" x="40" y="460" width="700" height="84" rx="10"/></g><g id="layer-edges"><line id="edge-general-many" class="stroke" x1="60" y1="300" x2="720" y2="300" marker-end="url(#arrow)"/><line class="stroke" x1="60" y1="288" x2="60" y2="312"/><line class="dash" id="edge-axis-middle" x1="390" y1="314" x2="390" y2="360"/></g><g id="layer-nodes"><g id="node-general"><rect class="panel" x="20" y="60" width="360" height="190" rx="10"/><text class="sh" x="200" y="88" text-anchor="middle">one general ability</text><circle class="ink" cx="64" cy="155" r="26"/><text class="knock" x="64" y="162" text-anchor="middle">g</text><text class="body" x="112" y="132">Spearman: one general</text><text class="body" x="112" y="154">factor, g, measurable and</text><text class="body" x="112" y="176">comparable among individuals</text></g><g id="node-many"><rect class="panel" x="400" y="60" width="360" height="190" rx="10"/><text class="sh" x="580" y="88" text-anchor="middle">many relatively independent abilities</text><circle class="ink" cx="424" cy="133" r="8"/><circle class="ink" cx="448" cy="125" r="8"/><circle class="ink" cx="472" cy="133" r="8"/><circle class="ink" cx="430" cy="157" r="8"/><circle class="ink" cx="454" cy="157" r="8"/><circle class="ink" cx="478" cy="157" r="8"/><circle class="ink" cx="442" cy="181" r="8"/><circle class="ink" cx="466" cy="181" r="8"/><text class="body" x="500" y="118">Gardner: at least eight</text><text class="small" x="500" y="142">intelligences - linguistic,</text><text class="small" x="500" y="162">logical-mathematical,</text><text class="small" x="500" y="182">musical, bodily kinesthetic,</text><text class="small" x="500" y="202">spatial, interpersonal,</text><text class="small" x="500" y="222">intrapersonal, naturalistic</text></g><g id="node-middle"><polygon class="panel-a" points="390,286 404,300 390,314 376,300"/><rect class="panel" x="160" y="360" width="460" height="84" rx="10"/><text class="sh" x="390" y="386" text-anchor="middle">Middle / hierarchical positions:</text><text class="small" x="390" y="408" text-anchor="middle">Thurstone: primary mental abilities</text><text class="small" x="390" y="428" text-anchor="middle">Cattell-Horn-Carroll (CHC): g with broad strands</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="20" y="36">Intelligence theories: one axis, different meanings</text><text class="small" x="40" y="336" text-anchor="start">one general ability</text><text class="small" x="740" y="336" text-anchor="end">many abilities</text><text class="h" x="390" y="494" text-anchor="middle">where a teacher stands on this axis decides what</text><text class="h" x="390" y="522" text-anchor="middle">the word intelligent means in the staff room</text><text aria-hidden="true" class="wm" x="768" y="568" text-anchor="end">textbook.com.pk</text></g></svg>
