<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 532" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four classroom observations</title><desc id="d">A table of four classroom observations - the reused essay, the early finisher, the off-textbook question and the sociable gifted pupil - each against the common reading and what this topic suggests instead.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="532"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="448" rx="8"/><path id="region-header" class="head" d="M28 20H752A8 8 0 0 1 760 28V100H20V28A8 8 0 0 1 28 20z"/><rect class="band" x="21" y="101" width="259" height="366"/><path class="grid" d="M280 20V468M480 20V468M20 192H760M20 284H760M20 376H760"/><path class="rule" d="M20 100H760"/><rect class="frame" x="20" y="20" width="740" height="448" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="66">what you see</text><text class="h" x="292" y="55">the common</text><text class="h" x="292" y="77">reading</text><text class="h" x="492" y="55">what this topic</text><text class="h" x="492" y="77">suggests</text></g><g id="node-row-essay"><text class="sh" x="32" y="140">the essay that reuses</text><text class="sh" x="32" y="162">memorised phrases</text><text class="body" x="292" y="140">earns the</text><text class="body" x="292" y="162">top mark</text><text class="body" x="492" y="129">Add a box for originality:</text><text class="body" x="492" y="151">what here could not have been</text><text class="body" x="492" y="173">written by anyone.</text></g><g id="node-row-early"><text class="sh" x="32" y="232">the pupil who finishes early</text><text class="sh" x="32" y="254">and disturbs others</text><text class="body" x="292" y="243">a discipline case</text><text class="body" x="492" y="232">Hypothesis: unmet challenge.</text><text class="body" x="492" y="254">Enrich with real problems.</text></g><g id="node-row-question"><text class="sh" x="32" y="324">the pupil who asks a question</text><text class="sh" x="32" y="346">the textbook does not answer</text><text class="body" x="292" y="335">wasting time</text><text class="body" x="492" y="324">Divergent thinking doing its job:</text><text class="body" x="492" y="346">welcome it, then choose.</text></g><g id="node-row-gifted"><text class="sh" x="32" y="416">the gifted pupil, also</text><text class="sh" x="32" y="438">sociable and sporty</text><text class="body" x="292" y="416">does not fit</text><text class="body" x="292" y="438">the stereotype</text><text class="body" x="492" y="416">The stereotype is the defect:</text><text class="body" x="492" y="438">look in every group.</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="20" y="496">Read each observation before applying a label.</text><text aria-hidden="true" class="wm" x="768" y="520" text-anchor="end">textbook.com.pk</text></g></svg>
