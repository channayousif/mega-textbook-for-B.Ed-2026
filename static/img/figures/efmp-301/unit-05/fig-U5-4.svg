<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four classroom observations</title><desc id="d">A table of four classroom observations - the reused essay, the early finisher, the off-textbook question and the sociable gifted pupil - each against the common reading and what this topic suggests instead.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{font-size:15px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="13" y="18" width="754" height="404" rx="5"/><rect class="panel-a" x="13" y="18" width="247" height="64" rx="5"/><rect class="panel-b" x="260" y="18" width="238" height="64"/><rect class="panel-c" x="498" y="18" width="269" height="64" rx="5"/><path class="stroke-a" d="M25 72H248"/><path class="stroke" d="M260 82V422M498 82V422"/><path class="grid" d="M13 167H767M13 252H767M13 337H767"/><text class="h" x="136.5" y="56" text-anchor="middle">what you see</text><text class="h" x="379" y="48" text-anchor="middle">the common</text><text class="h" x="379" y="67" text-anchor="middle">reading</text><text class="h" x="632.5" y="48" text-anchor="middle">what this topic</text><text class="h" x="632.5" y="67" text-anchor="middle">suggests</text><text class="sh" x="28" y="114">the essay that reuses</text><text class="sh" x="28" y="134">memorised phrases</text><text class="body" x="379" y="116" text-anchor="middle">earns the</text><text class="body" x="379" y="135" text-anchor="middle">top mark</text><text class="body" x="513" y="106">Add a box for originality:</text><text class="body" x="513" y="125">what here could not have been</text><text class="body" x="513" y="144">written by anyone.</text><text class="sh" x="28" y="198">the pupil who finishes early</text><text class="sh" x="28" y="218">and disturbs others</text><text class="body" x="379" y="210" text-anchor="middle">a discipline case</text><text class="body" x="513" y="201">An unmet need: real problems,</text><text class="body" x="513" y="220">not more worksheets.</text><text class="sh" x="28" y="282">the pupil who asks a question</text><text class="sh" x="28" y="302">the textbook does not answer</text><text class="body" x="379" y="294" text-anchor="middle">wasting time</text><text class="body" x="513" y="285">Divergent thinking doing its job:</text><text class="body" x="513" y="304">welcome it, then choose.</text><text class="sh" x="28" y="367">the gifted pupil, also</text><text class="sh" x="28" y="387">sociable and sporty</text><text class="body" x="379" y="369" text-anchor="middle">does not fit</text><text class="body" x="379" y="388" text-anchor="middle">the stereotype</text><text class="body" x="513" y="360">The stereotype is the defect:</text><text class="body" x="513" y="379">look in every group.</text><text class="small" x="25" y="445">Read each observation before applying a label.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
