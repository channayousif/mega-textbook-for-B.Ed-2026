<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four measurement facts</title><desc id="d">A table of four measurement facts - the score, the band, the prediction and the history - each against the fact, what it does not show, and the teacher's stance.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="492"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="432" rx="8"/><path id="region-header" class="head" d="M28 20H752A8 8 0 0 1 760 28V100H20V28A8 8 0 0 1 28 20z"/><rect class="band" x="21" y="101" width="119" height="350"/><path class="grid" d="M140 20V452M350 20V452M560 20V452M20 188H760M20 276H760M20 364H760"/><path class="rule" d="M20 100H760"/><rect class="frame" x="20" y="20" width="740" height="432" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="55">what a test</text><text class="h" x="32" y="77">does</text><text class="h" x="152" y="66">the fact</text><text class="h" x="362" y="55">what it does</text><text class="h" x="362" y="77">NOT show</text><text class="h" x="572" y="55">the teacher's</text><text class="h" x="572" y="77">stance</text></g><g id="node-row-score"><text class="sh" x="32" y="136">the score</text><text class="small" x="32" y="160">a number</text><text class="cell" x="152" y="127">a number from a</text><text class="cell" x="152" y="149">standardised test:</text><text class="cell" x="152" y="171">mean 100, deviation 15</text><text class="cell" x="362" y="127">a summary of</text><text class="cell" x="362" y="149">performance on the</text><text class="cell" x="362" y="171">sampled tasks</text><text class="cell" x="572" y="138">one source of evidence,</text><text class="cell" x="572" y="160">never a verdict</text></g><g id="node-row-band"><text class="sh" x="32" y="224">the band</text><text class="small" x="32" y="248">85 to 115</text><text class="cell" x="152" y="226">85 to 115 covers about</text><text class="cell" x="152" y="248">two-thirds of people</text><text class="cell" x="362" y="226">that those outside the</text><text class="cell" x="362" y="248">band are worth less</text><text class="cell" x="572" y="226">bands describe,</text><text class="cell" x="572" y="248">they do not decide</text></g><g id="node-row-scope"><text class="sh" x="32" y="312">test scope</text><text class="small" x="32" y="336">sampled tasks</text><text class="cell" x="152" y="314">reflects performance on</text><text class="cell" x="152" y="336">specific sampled tasks</text><text class="cell" x="362" y="314">the full range of human</text><text class="cell" x="362" y="336">ability or intellect</text><text class="cell" x="572" y="303">use for support</text><text class="cell" x="572" y="325">decisions, not fixed</text><text class="cell" x="572" y="347">labels</text></g><g id="node-row-history"><text class="sh" x="32" y="400">the history</text><text class="small" x="32" y="424">remember</text><text class="cell" x="152" y="402">early tests ranked</text><text class="cell" x="152" y="424">people unjustly</text><text class="cell" x="362" y="402">that today's tests are</text><text class="cell" x="362" y="424">free of that risk</text><text class="cell" x="572" y="402">know the history,</text><text class="cell" x="572" y="424">hold the humility</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="480" text-anchor="end">textbook.com.pk</text></g></svg>
