<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تخلیقیت کے قابلِ مشاہدہ حصے</title><desc id="d">تخلیقیت کا تصوری نقشہ اس کے چار دیکھے جانے والے حصوں کے ساتھ: روانی، لچک، انفرادیت اور تفصیل: بکھری اور مرکوز سوچ سے جڑا، اس کے ساتھ خاص صلاحیت بطور تعلیمی ضرورت، انعام کے بجائے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="610"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-creativity-fluency" class="link" d="M600 222 L670 136"/><path id="edge-creativity-flexibility" class="link" d="M520 222 L440 136"/><path id="edge-creativity-originality" class="link" d="M600 298 L670 380"/><path id="edge-creativity-elaboration" class="link" d="M520 298 L440 380"/><path id="edge-creativity-divergent" class="dash" d="M484 252 C400 240 360 180 282 180" marker-end="url(#arrow)"/><path id="edge-creativity-convergent" class="dash" d="M484 268 C400 280 360 340 282 340" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-fluency"><rect class="panel" x="580" y="60" width="180" height="76" rx="8"/><text class="sh" x="670" y="86" text-anchor="middle">روانی</text><text class="small" x="670" y="116" text-anchor="middle">بہت سے خیالات</text></g><g id="node-flexibility"><rect class="panel" x="340" y="60" width="200" height="76" rx="8"/><text class="sh" x="440" y="86" text-anchor="middle">لچک</text><text class="small" x="440" y="116" text-anchor="middle">مختلف قسم کے خیالات</text></g><g id="node-originality"><rect class="panel" x="580" y="380" width="180" height="76" rx="8"/><text class="sh" x="670" y="406" text-anchor="middle">انفرادیت</text><text class="small" x="670" y="436" text-anchor="middle">ایسے خیالات جو یہاں نئے ہیں</text></g><g id="node-elaboration"><rect class="panel" x="340" y="380" width="200" height="76" rx="8"/><text class="sh" x="440" y="406" text-anchor="middle">تفصیل</text><text class="small" x="440" y="436" text-anchor="middle">تفصیل سے نکالے خیالات</text></g><g id="node-creativity"><ellipse class="panel-a" cx="560" cy="260" rx="76" ry="46"/><text class="h" x="560" y="266" text-anchor="middle">تخلیقیت</text></g><g id="node-divergent"><rect class="panel" x="20" y="140" width="260" height="80" rx="8"/><text class="sh" x="150" y="166" text-anchor="middle">بکھری سوچ</text><text class="body" x="150" y="196" text-anchor="middle">کئی ممکن جواب</text></g><g id="node-convergent"><rect class="panel" x="20" y="300" width="260" height="80" rx="8"/><text class="sh" x="150" y="326" text-anchor="middle">مرکوز سوچ</text><text class="body" x="150" y="356" text-anchor="middle">وہ ایک مستحکم جواب</text></g><g id="node-giftedness"><rect class="panel-b" x="20" y="420" width="280" height="150" rx="8"/><text class="sh" x="160" y="446" text-anchor="middle">ذہین ہونا</text><text class="small" x="160" y="470" text-anchor="middle">مہارت یا علم کا غیر معمولی</text><text class="small" x="160" y="493" text-anchor="middle">درجہ، ایک تعلیمی ضرورت</text><path class="grid" d="M280 508 H40"/><text class="small" x="160" y="528" text-anchor="middle">نہ انعام، اور نہ</text><text class="small" x="160" y="551" text-anchor="middle">تدریس سے چھوٹ</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="36" text-anchor="end">تخلیقیت: قابلِ مشاہدہ حصے، سوچ کے انداز اور تعلیمی ضرورت</text><text id="label-both" class="small" x="360" y="266" text-anchor="middle">دونوں کی ضرورت ہے</text><text aria-hidden="true" class="wm" x="12" y="598" text-anchor="start">textbook.com.pk</text></g></svg>
