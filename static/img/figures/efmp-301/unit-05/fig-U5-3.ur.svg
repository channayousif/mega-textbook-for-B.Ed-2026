<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تخلیقیت کے قابلِ مشاہدہ حصے</title><desc id="d">تخلیقیت کا تصوری نقشہ: چار قابلِ مشاہدہ حصے روانی، لچک، انفرادیت اور تفصیل، واگرا اور ہمراہ سوچ سے جڑے، اور ذہین ہونا بطور تعلیمی ضرورت نہ کہ انعام۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--ink)}.core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.dash{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:7 5;fill:none}.note{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 780 0L 770 5L 780 10z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="754" y="31" text-anchor="end">تخلیقیت: قابلِ مشاہدہ حصے، سوچ کے انداز اور تعلیمی ضرورت</text><g class="stroke"><path d="M 457 179L315 110"/><path d="M 511 225L204 202"/><path d="M 412 193L493 112"/><path d="M 457 273L315 371"/><path d="M 511 251L214 316"/></g><rect class="panel" x="376" y="49" width="178" height="61" rx="10"/><text class="sh" x="465" y="74" text-anchor="middle">روانی</text><text class="small" x="465" y="94" text-anchor="middle">بہت سے خیالات</text><rect class="panel" x="576" y="162" width="178" height="76" rx="10"/><text class="sh" x="665" y="188" text-anchor="middle">انفرادیت</text><text class="small" x="665" y="208" text-anchor="middle">ایسے خیالات جو یہاں نئے ہیں</text><rect class="panel" x="376" y="371" width="178" height="67" rx="10"/><text class="sh" x="465" y="397" text-anchor="middle">تفصیل</text><text class="small" x="465" y="417" text-anchor="middle">تفصیل سے نکالے خیالات</text><rect class="panel" x="45" y="52" width="242" height="60" rx="10"/><text class="sh" x="166" y="77" text-anchor="middle">لچک</text><text class="small" x="166" y="97" text-anchor="middle">مختلف قسم کے خیالات</text><ellipse class="core" cx="457" cy="226" rx="72" ry="48"/><text class="h" x="457" y="232" text-anchor="middle">تخلیقیت</text><rect class="note" x="566" y="296" width="188" height="126" rx="10"/><text class="sh" x="660" y="320" text-anchor="middle">ذہین ہونا</text><text class="small" x="660" y="342" text-anchor="middle">مہارت یا علم کا غیر معمولی</text><text class="small" x="660" y="360" text-anchor="middle">درجہ، ایک</text><text class="small" x="660" y="378" text-anchor="middle">تعلیمی ضرورت</text><path class="grid" d="M 733 393H193"/><text class="small" x="660" y="411" text-anchor="middle">نہ انعام، اور نہ</text><text class="small" x="660" y="427" text-anchor="middle">تدریس سے چھوٹ</text><path class="dash" d="M 385 211C430 201 444 191 476 191" marker-end="url(#arrow)"/><path class="dash" d="M 385 244C430 257 444 284 476 302" marker-end="url(#arrow)"/><rect class="panel" x="33" y="145" width="270" height="85" rx="10"/><text class="sh" x="168" y="172" text-anchor="middle">واگرا سوچ</text><text class="body" x="168" y="195" text-anchor="middle">کئے ممکن جواب</text><rect class="panel" x="33" y="276" width="270" height="85" rx="10"/><text class="sh" x="168" y="303" text-anchor="middle">ہمراہ سوچ</text><text class="body" x="168" y="326" text-anchor="middle">وہ ایک مستحکم جواب</text><text class="small" x="340" y="271" text-anchor="middle">دونوں کی ضرورت ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
