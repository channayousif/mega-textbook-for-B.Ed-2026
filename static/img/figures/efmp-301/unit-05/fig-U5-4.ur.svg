<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 532" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعت کی چار مشاہدات کی دوبارہ پڑھائی</title><desc id="d">چار جماعتی مشاہدوں کا جدول: دوبارہ استعمال والا مضمون، جلدی مکمل کرنے والا، کتاب سے باہر کا سوال، اور ملنسار ذہین متعلم: ہر ایک کے ساتھ عام قرأت اور وہ جو یہ موضوع تجویز کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="532"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="448" rx="8"/><path id="region-header" class="head" d="M752 20 H28 A8 8 0 0 0 20 28 V100 H760 V28 A8 8 0 0 0 752 20 z"/><rect class="band" x="500" y="101" width="259" height="366"/><path class="grid" d="M500 20 V468 M300 20 V468 M760 192 H20 M760 284 H20 M760 376 H20"/><path class="rule" d="M760 100 H20"/><rect class="frame" x="20" y="20" width="740" height="448" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="748" y="66" text-anchor="end">جو آپ دیکھتے ہیں</text><text class="h" x="488" y="53" text-anchor="end">عام</text><text class="h" x="488" y="79" text-anchor="end">پڑھائی</text><text class="h" x="288" y="53" text-anchor="end">یہ موضوع کیا</text><text class="h" x="288" y="79" text-anchor="end">تجویز کرتا ہے</text></g><g id="node-row-essay"><text class="sh" x="748" y="138" text-anchor="end">وہ مضمون جو یاد</text><text class="sh" x="748" y="163" text-anchor="end">کیے جملے دہراتا ہے</text><text class="body" x="488" y="138" text-anchor="end">سب سے زیادہ</text><text class="body" x="488" y="163" text-anchor="end">نمبر کما لیتا ہے</text><text class="body" x="288" y="126" text-anchor="end">انفرادیت کا خانہ شامل کریں:</text><text class="body" x="288" y="151" text-anchor="end">یہاں کیا ایسی بات ہے جو</text><text class="body" x="288" y="176" text-anchor="end">کوئی بھی نہ لکھ سکے۔</text></g><g id="node-row-early"><text class="sh" x="748" y="230" text-anchor="end">وہ شاگرد جو جلدی مکمل</text><text class="sh" x="748" y="255" text-anchor="end">کر کے دوسروں کو تنگ کرتا ہے</text><text class="body" x="488" y="243" text-anchor="end">نافرمانی کا مقدمہ</text><text class="body" x="288" y="230" text-anchor="end">ایک نامکمل ضرورت: حقیقی مسائل،</text><text class="body" x="288" y="255" text-anchor="end">نہ کہ مزید ورک شیٹ۔</text></g><g id="node-row-question"><text class="sh" x="748" y="322" text-anchor="end">وہ شاگرد جو ایسا سوال پوچھے</text><text class="sh" x="748" y="347" text-anchor="end">جس کا جواب کتاب میں نہ ہو</text><text class="body" x="488" y="335" text-anchor="end">وقت ضائع کرنا</text><text class="body" x="288" y="322" text-anchor="end">بکھری سوچ اپنا کام کر رہی ہے:</text><text class="body" x="288" y="347" text-anchor="end">خوش آمدید کہیں، پھر چنیں۔</text></g><g id="node-row-gifted"><text class="sh" x="748" y="414" text-anchor="end">ذہین شاگرد جو سماجی</text><text class="sh" x="748" y="439" text-anchor="end">اور کھیلوں میں بھی ہو</text><text class="body" x="488" y="414" text-anchor="end">وہ ٹھہرائی ہوئی</text><text class="body" x="488" y="439" text-anchor="end">تصویر میں فٹ نہیں بیٹھتا</text><text class="body" x="288" y="414" text-anchor="end">خود تصویر ہی عیب ہے:</text><text class="body" x="288" y="439" text-anchor="end">ہر گروپ میں دیکھیں۔</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="760" y="496" text-anchor="end">لیبل لگانے سے پہلے ہر مشاہدہ پڑھیں۔</text><text aria-hidden="true" class="wm" x="12" y="520" text-anchor="start">textbook.com.pk</text></g></svg>
