<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعت کی چار مشاہدات کی دوبارہ پڑھائی</title><desc id="d">چار جماعتی مشاہدات کا جدول: یاد کیے جملے والا مضمون، جلدی مکمل کرنے والا شاگرد، کتاب سے باہر کا سوال، اور سماجی ذہین شاگرد، ہر ایک کے ساتھ عام پڑھائی اور اس موضوع کی تجویز۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{font-size:13px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="13" y="18" width="754" height="404" rx="5"/><rect class="panel-a" x="520" y="18" width="247" height="64" rx="5"/><rect class="panel-b" x="282" y="18" width="238" height="64"/><rect class="panel-c" x="13" y="18" width="269" height="64" rx="5"/><path class="stroke-a" d="M 755 72H248"/><path class="stroke" d="M 520 82V422M498 82V422"/><path class="grid" d="M 767 167H767M13 252H767M13 337H767"/><text class="h" x="643.5" y="56" text-anchor="middle">جو آپ دیکھتے ہیں</text><text class="h" x="401" y="48" text-anchor="middle">عام</text><text class="h" x="401" y="67" text-anchor="middle">پڑھائی</text><text class="h" x="147.5" y="48" text-anchor="middle">یہ موضوع کیا</text><text class="h" x="147.5" y="67" text-anchor="middle">تجویز کرتا ہے</text><text class="sh" x="752" y="114">وہ مضمون جو یاد</text><text class="sh" x="752" y="134">کیے جملے دہراتا ہے</text><text class="body" x="401" y="116" text-anchor="middle">سب سے زیادہ</text><text class="body" x="401" y="135" text-anchor="middle">نمبر کما لیتا ہے</text><text class="body" x="267" y="106">انفرادیت کا خانہ شامل کریں:</text><text class="body" x="267" y="125">یہاں کیا ایسی بات ہے جو</text><text class="body" x="267" y="144">کوئی بھی نہ لکھ سکے۔</text><text class="sh" x="752" y="198">وہ شاگرد جو جلدی مکمل</text><text class="sh" x="752" y="218">کر کے دوسروں کو تنگ کرتا ہے</text><text class="body" x="401" y="210" text-anchor="middle">نافرمانی کا مقدمہ</text><text class="body" x="267" y="201">ایک نامکمل ضرورت: حقیقی مسائل،</text><text class="body" x="267" y="220">نہ کہ مزید ورک شیٹ۔</text><text class="sh" x="752" y="282">وہ شاگرد جو ایسا سوال پوچھے</text><text class="sh" x="752" y="302">جس کا جواب کتاب میں نہ ہو</text><text class="body" x="401" y="294" text-anchor="middle">وقت ضائع کرنا</text><text class="body" x="267" y="285">واگرا سوچ اپنا کام کر رہی ہے:</text><text class="body" x="267" y="304">خوش آمدید کہیں، پھر چنیں۔</text><text class="sh" x="752" y="367">ذہین شاگرد جو سماجی</text><text class="sh" x="752" y="387">اور کھیلوں میں بھی ہو</text><text class="body" x="401" y="369" text-anchor="middle">وہ ٹھہرائی ہوئی</text><text class="body" x="401" y="388" text-anchor="middle">تصویر میں فٹ نہیں بیٹھتا</text><text class="body" x="267" y="360">خود تصویر ہی عیب ہے:</text><text class="body" x="267" y="379">look in every group.</text><text class="small" x="755" y="445">Read each observation before applying a label.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
