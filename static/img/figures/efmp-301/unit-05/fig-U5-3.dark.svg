<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of creativity with its four observable parts</title><desc id="d">A concept map of creativity with its four observable parts - fluency, flexibility, originality and elaboration - linked to divergent and convergent thinking, with giftedness beside it as an educational need rather than a prize.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.knock{font-size:20px;font-weight:700;fill:var(--bg)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="610"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-creativity-fluency" class="link" d="M180 222L110 136"/><path id="edge-creativity-flexibility" class="link" d="M260 222L340 136"/><path id="edge-creativity-originality" class="link" d="M180 298L110 380"/><path id="edge-creativity-elaboration" class="link" d="M260 298L340 380"/><path id="edge-creativity-divergent" class="dash" d="M296 252C380 240 420 180 498 180" marker-end="url(#arrow)"/><path id="edge-creativity-convergent" class="dash" d="M296 268C380 280 420 340 498 340" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-fluency"><rect class="panel" x="20" y="60" width="180" height="76" rx="8"/><text class="sh" x="110" y="88" text-anchor="middle">fluency</text><text class="small" x="110" y="112" text-anchor="middle">many ideas</text></g><g id="node-flexibility"><rect class="panel" x="240" y="60" width="200" height="76" rx="8"/><text class="sh" x="340" y="88" text-anchor="middle">flexibility</text><text class="small" x="340" y="112" text-anchor="middle">different kinds of ideas</text></g><g id="node-originality"><rect class="panel" x="20" y="380" width="180" height="76" rx="8"/><text class="sh" x="110" y="408" text-anchor="middle">originality</text><text class="small" x="110" y="432" text-anchor="middle">ideas that are new here</text></g><g id="node-elaboration"><rect class="panel" x="240" y="380" width="200" height="76" rx="8"/><text class="sh" x="340" y="408" text-anchor="middle">elaboration</text><text class="small" x="340" y="432" text-anchor="middle">ideas worked out in detail</text></g><g id="node-creativity"><ellipse class="panel-a" cx="220" cy="260" rx="76" ry="46"/><text class="h" x="220" y="266" text-anchor="middle">creativity</text></g><g id="node-divergent"><rect class="panel" x="500" y="140" width="260" height="80" rx="8"/><text class="sh" x="630" y="168" text-anchor="middle">divergent thinking</text><text class="body" x="630" y="192" text-anchor="middle">many possible answers</text></g><g id="node-convergent"><rect class="panel" x="500" y="300" width="260" height="80" rx="8"/><text class="sh" x="630" y="328" text-anchor="middle">convergent thinking</text><text class="body" x="630" y="352" text-anchor="middle">the one well-established answer</text></g><g id="node-giftedness"><rect class="panel-b" x="480" y="420" width="280" height="150" rx="8"/><text class="sh" x="620" y="446" text-anchor="middle">giftedness</text><text class="small" x="620" y="470" text-anchor="middle">unusual level of skill or</text><text class="small" x="620" y="490" text-anchor="middle">knowledge, an educational need</text><path class="grid" d="M500 502H740"/><text class="small" x="620" y="524" text-anchor="middle">not a prize, and not an</text><text class="small" x="620" y="544" text-anchor="middle">exemption from teaching</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="20" y="36">Creativity: observable parts, thinking modes and educational need</text><text id="label-both" class="small" x="420" y="266" text-anchor="middle">both are needed</text><text aria-hidden="true" class="wm" x="768" y="598" text-anchor="end">textbook.com.pk</text></g></svg>
