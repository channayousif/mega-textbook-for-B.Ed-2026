<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کے مراحل کی ٹائم لائن</title><desc id="d">ابتدائی پرائمری سے بعد کی مراہقت تک نشوونما کے چار مرحلوں کی دائیں سے بائیں ٹائم لائن، ہر بینڈ میں اُس عمر کی سوچ اور موزوں تدریس، یہ یاد دہانی کے ساتھ کہ عمریں تقریبی ہیں مگر ترتیب نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.p1{fill:var(--a1-fill);stroke:var(--a1)}.p2{fill:var(--a2-fill);stroke:var(--a2)}.p3{fill:var(--a3-fill);stroke:var(--a3)}.p4{fill:var(--a4-fill);stroke:var(--a4)}.guide{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah ink"/></marker></defs><rect class="panel p1" x="620" y="40" width="132" height="270" rx="10"/><text class="h" x="686" y="68" text-anchor="middle">ابتدائی پرائمری</text><text class="small" x="686" y="86" text-anchor="middle">تقریباً 5-7</text><line class="stroke" x1="639" y1="100" x2="733" y2="100"/><text class="sh" x="733" y="123" text-anchor="end">سوچ</text><text class="body" x="733" y="143" text-anchor="end">چیزوں کی شکل اور محسوس کردہ</text><text class="body" x="733" y="159" text-anchor="end">جھلک کی رہنمائی میں</text><text class="sh" x="733" y="197" text-anchor="end">تدریس</text><text class="body" x="733" y="217" text-anchor="end">حقیقی چیزیں اور</text><text class="body" x="733" y="233" text-anchor="end">تصویریں</text><rect class="panel p2" x="360" y="40" width="260" height="270" rx="10"/><text class="h" x="490" y="68" text-anchor="middle">درمیانی پرائمری</text><text class="small" x="490" y="86" text-anchor="middle">تقریباً 7-11</text><line class="stroke" x1="380" y1="100" x2="600" y2="100"/><text class="sh" x="600" y="123" text-anchor="end">سوچ</text><text class="body" x="600" y="143" text-anchor="end">ٹھوس چیزوں پر اصول باندھنا</text><text class="sh" x="600" y="181" text-anchor="end">تدریس</text><text class="body" x="600" y="201" text-anchor="end">مواد، تجربے، ایسے مرحلے</text><text class="body" x="600" y="217" text-anchor="end">جو پلٹ کر چیک ہو سکیں</text><rect class="panel p3" x="164" y="40" width="196" height="270" rx="10"/><text class="h" x="262" y="68" text-anchor="middle">ابتدائی</text><text class="h" x="262" y="85" text-anchor="middle">مراہقت</text><text class="small" x="262" y="103" text-anchor="middle">تقریباً 11-14</text><line class="stroke" x1="184" y1="117" x2="340" y2="117"/><text class="sh" x="340" y="140" text-anchor="end">سوچ</text><text class="body" x="340" y="160" text-anchor="end">امکانات پر استدلال</text><text class="body" x="340" y="176" text-anchor="end">کا آغاز</text><text class="sh" x="340" y="214" text-anchor="end">تدریس</text><text class="body" x="340" y="234" text-anchor="end">حقیقی مسائل،</text><text class="body" x="340" y="250" text-anchor="end">مخالف مثالیں، مباحثہ</text><rect class="panel p4" x="28" y="40" width="136" height="270" rx="10"/><text class="h" x="96" y="68" text-anchor="middle">بعد کی</text><text class="h" x="96" y="85" text-anchor="middle">مراہقت</text><text class="small" x="96" y="103" text-anchor="middle">تقریباً 14-16</text><line class="stroke" x1="47" y1="117" x2="145" y2="117"/><text class="sh" x="144" y="140" text-anchor="end">سوچ</text><text class="body" x="144" y="160" text-anchor="end">باقاعدہ</text><text class="body" x="144" y="176" text-anchor="end">رسمی استدلال</text><text class="sh" x="144" y="202" text-anchor="end">تدریس</text><text class="body" x="144" y="222" text-anchor="end">مفروضے،</text><text class="body" x="144" y="238" text-anchor="end">جانچنے کے دعوے،</text><text class="body" x="144" y="254" text-anchor="end">منظم دلیل</text><path class="guide" d="M752 310 V346 M620 310 V346 M360 310 V346 M164 310 V346 M28 310 V346"/><line class="stroke" x1="752" y1="346" x2="28" y2="346" marker-end="url(#arrow)"/><path class="stroke" d="M752 338v16M620 338v16M360 338v16M164 338v16M28 338v16"/><text class="small" x="752" y="376" text-anchor="middle">5</text><text class="small" x="620" y="376" text-anchor="middle">7</text><text class="small" x="360" y="376" text-anchor="middle">11</text><text class="small" x="164" y="376" text-anchor="middle">14</text><text class="small" x="28" y="376" text-anchor="middle">16</text><text class="small muted" x="390" y="408" text-anchor="middle">عمریں تقریبی ہیں؛ ترتیب نہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
