<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کے مراحل کی ٹائم لائن</title><desc id="d">چار نشوونمائی مرحلوں کی پٹیاں دائیں سے بائیں ٹائم لائن، ابتدائی پرائمری سے بعد کی مراہقت تک، ہر پٹی پر اس بینڈ پر سوچ کیسے چلتی ہے اور کون سی تدریس موزوں ہے، کیپشن کے ساتھ کہ عمریں تقریباً ہیں مگر ترتیب نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="510"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="760" y1="420" x2="14" y2="420" marker-end="url(#arrow)"/><path class="stroke" d="M760 412 v16 M580 412 v16 M390 412 v16 M200 412 v16 M20 412 v16"/><path class="grid" d="M675 380 V412 M485 380 V412 M295 380 V412 M105 380 V412"/></g><g id="layer-nodes"><g id="node-early-primary"><rect class="panel" x="590" y="20" width="170" height="360" rx="10"/><text class="h" x="746" y="54" text-anchor="end">‏ابتدائی‏</text><text class="h" x="746" y="82" text-anchor="end">‏پرائمری‏</text><text class="small" x="746" y="108" text-anchor="end">‏تقریباً ⁦5-7⁩‏</text><path class="grid" d="M746 122 H604"/><text class="sh" x="746" y="152" text-anchor="end">‏سوچ‏</text><text class="body" x="746" y="178" text-anchor="end">‏چیزوں کی شکل اور‏</text><text class="body" x="746" y="204" text-anchor="end">‏محسوس کردہ جھلک‏</text><text class="body" x="746" y="230" text-anchor="end">‏کی رہنمائی میں‏</text><text class="sh" x="746" y="270" text-anchor="end">‏تدریس‏</text><text class="body" x="746" y="296" text-anchor="end">‏حقیقی چیزیں اور‏</text><text class="body" x="746" y="322" text-anchor="end">‏تصویریں‏</text></g><g id="node-middle-primary"><rect class="panel" x="400" y="20" width="170" height="360" rx="10"/><text class="h" x="556" y="54" text-anchor="end">‏درمیانی‏</text><text class="h" x="556" y="82" text-anchor="end">‏پرائمری‏</text><text class="small" x="556" y="108" text-anchor="end">‏تقریباً ⁦7-11⁩‏</text><path class="grid" d="M556 122 H414"/><text class="sh" x="556" y="152" text-anchor="end">‏سوچ‏</text><text class="body" x="556" y="178" text-anchor="end">‏ٹھوس چیزوں پر‏</text><text class="body" x="556" y="204" text-anchor="end">‏اصول باندھنا‏</text><text class="sh" x="556" y="270" text-anchor="end">‏تدریس‏</text><text class="body" x="556" y="296" text-anchor="end">‏مواد، تجربے، ایسے‏</text><text class="body" x