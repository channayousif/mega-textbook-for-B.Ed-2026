<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map with development at the centre</title><desc id="d">A concept map with development at the centre, linked to three drivers - maturation, which unfolds with age; learning, which comes through experience; and growth, which is physical increase - with a note that most classroom behaviour is a mix of all three.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-maturation-development" class="link" d="M130 200 C130 250 190 280 260 280"/><path id="edge-learning-development" class="link" d="M390 200 V240"/><path id="edge-growth-development" class="link" d="M650 200 C650 250 590 280 520 280"/><path id="edge-development-interaction" class="link" d="M390 320 V380"/></g><g id="layer-nodes"><g id="node-maturation"><rect class="panel" x="20" y="20" width="220" height="180" rx="12"/><text class="h" x="130" y="50" text-anchor="middle">maturation</text><text class="body" x="130" y="74" text-anchor="middle">unfolding with age</text><text class="small" x="130" y="98" text-anchor="middle">like puberty</text><text class="small" x="130" y="115" text-anchor="middle">arrives with time,</text><text class="small" x="130" y="132" text-anchor="middle">not teaching</text></g><g id="node-learning"><rect class="panel" x="280" y="20" width="220" height="180" rx="12"/><text class="h" x="390" y="50" text-anchor="middle">learning</text><text class="body" x="390" y="74" text-anchor="middle">change through experience</text><text class="small" x="390" y="98" text-anchor="middle">knowing the birds of</text><text class="small" x="390" y="115" text-anchor="middle">the schoolyard</text><text class="small" x="390" y="132" text-anchor="middle">arrives with practice</text><text class="small" x="390" y="149" text-anchor="middle">and teaching</text></g><g id="node-growth"><rect class="panel" x="540" y="20" width="220" height="180" rx="12"/><text class="h" x="650" y="50" text-anchor="middle">growth</text><text class="body" x="650" y="74" text-anchor="middle">physical increase</text><text class="small" x="650" y="98" text-anchor="middle">like height</text><text class="small" x="650" y="115" text-anchor="middle">measured in</text><text class="small" x="650" y="132" text-anchor="middle">centimetres</text></g><g id="node-development"><rect class="panel-a" x="260" y="240" width="260" height="80" rx="40"/><text class="h" x="390" y="274" text-anchor="middle">development</text><text class="small" x="390" y="298" text-anchor="middle">a changing pupil over time</text></g><g id="node-interaction"><rect class="panel" x="160" y="380" width="460" height="80" rx="12"/><text class="h" x="390" y="412" text-anchor="middle">their interaction</text><text class="body" x="390" y="438" text-anchor="middle">most classroom behaviour is a mix of all three</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="490" text-anchor="end">textbook.com.pk</text></g></svg>
