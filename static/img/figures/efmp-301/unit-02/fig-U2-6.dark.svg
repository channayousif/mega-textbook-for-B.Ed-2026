<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the four developmental domains</title><desc id="d">A table comparing the four developmental domains - cognitive, emotional, social and physical - on what grows, a typical Class 2 versus Class 6 difference, and one classroom sign of each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="410" rx="8"/><path id="region-header" class="head" d="M28 20H752A8 8 0 0 1 760 28V100H20V28A8 8 0 0 1 28 20z"/><rect class="band" x="21" y="176" width="738" height="102"/><rect class="band" x="21" y="354" width="738" height="76"/><path class="grid" d="M150 20V430M290 20V430M540 20V430M20 176H760M20 278H760M20 354H760"/><path class="rule" d="M20 100H760"/><rect class="frame" x="20" y="20" width="740" height="410" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="65.6">domain</text><text class="h" x="162" y="65.6">what grows</text><text class="h" x="302" y="55.6">a Class 2 vs Class 6</text><text class="h" x="302" y="75.6">difference</text><text class="h" x="552" y="65.6">one classroom sign</text></g><g id="node-row-cognitive"><text class="sh" x="32" y="133.1">cognitive</text><text class="small" x="32" y="150.4">thinking</text><text class="body" x="162" y="133.9">thinking and</text><text class="body" x="162" y="151.9">memory</text><text class="body" x="302" y="133.9">certain the tall glass holds more</text><text class="body" x="302" y="151.9">vs explains the pour rule</text><text class="body" x="552" y="133.9">multi-step instructions</text><text class="body" x="552" y="151.9">met without reminders</text></g><g id="node-row-emotional"><text class="sh" x="32" y="222.1">emotional</text><text class="small" x="32" y="239.4">regulation</text><text class="body" x="162" y="222.9">regulation of</text><text class="body" x="162" y="240.9">feelings</text><text class="body" x="302" y="222.9">crying at a wrong answer vs</text><text class="body" x="302" y="240.9">flushing and trying again</text><text class="body" x="552" y="213.9">the pupil who laughs in</text><text class="body" x="552" y="231.9">March at what made them</text><text class="body" x="552" y="249.9">cry in September</text></g><g id="node-row-social"><text class="sh" x="32" y="311.1">social</text><text class="small" x="32" y="328.4">peers and play</text><text class="body" x="162" y="311.9">relationships,</text><text class="body" x="162" y="329.9">play, peers</text><text class="body" x="302" y="311.9">parallel play beside others vs</text><text class="body" x="302" y="329.9">negotiated games with rules</text><text class="body" x="552" y="311.9">the seating map of who</text><text class="body" x="552" y="329.9">works with whom</text></g><g id="node-row-physical"><text class="sh" x="32" y="378.6">physical</text><text class="small" x="32" y="395.9">recalled from</text><text class="small" x="32" y="412.9">2.2</text><text class="body" x="162" y="387.9">body and motor</text><text class="body" x="162" y="405.9">control</text><text class="body" x="302" y="387.9">large shaky letters vs</text><text class="body" x="302" y="405.9">small even letters</text><text class="body" x="552" y="387.9">the handwriting on the</text><text class="body" x="552" y="405.9">newest exercise book</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="460" text-anchor="end">textbook.com.pk</text></g></svg>
