<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما پذیر شاگرد کا تصوری نقشہ</title><desc id="d">نشوونما پذیر شاگرد کا تصوری نقشہ جس کی تین شاخیں ہیں: ادراکی، جذباتی اور معاشرتی، ہر ایک پر جماعت کی نشانیاں، اور باریک تیروں کے ساتھ کہ ہر شاخ دوسروں کو سہارا دیتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.solid{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><path class="dash" d="M630 156C722 210 708 273 615 300" marker-end="url(#a)"/><path class="dash" d="M525 156C423 204 316 214 180 300" marker-end="url(#a)"/><path class="dash" d="M476 390C414 452 359 452 303 390" marker-end="url(#a)"/><text class="small" x="724" y="230" text-anchor="end">ہر ایک دوسروں کو</text><text class="small" x="724" y="245" text-anchor="end">سہارا دیتی ہے</text><text class="small" x="225" y="232" text-anchor="end">ہر ایک دوسروں کو</text><text class="small" x="225" y="247" text-anchor="end">سہارا دیتی ہے</text><text class="small" x="390" y="449" text-anchor="middle">ہر ایک دوسروں کو سہارا دیتی ہے</text><path class="solid" d="M533 156L449 191"/><path class="solid" d="M510 300L451 270"/><path class="solid" d="M270 300L329 270"/><rect class="panel" x="478" y="22" width="270" height="134" rx="12"/><text class="h" x="728" y="50" text-anchor="end">ادراکی</text><text class="small" x="728" y="70" text-anchor="end">سوچ عمر کے ساتھ کیسے بدلتی ہے</text><text class="sh" x="728" y="96" text-anchor="end">جماعت کی نشانیاں</text><text class="body" x="728" y="116" text-anchor="end">بقا کے جواب عمر کے ساتھ بدلتے ہیں</text><text class="body" x="728" y="134" text-anchor="end">کثیر مرحلہ کام میں اصول کی پیروی</text><text class="body" x="728" y="152" text-anchor="end">لطیفے مختلف عمر پر مختلف بیٹھتے ہیں</text><rect class="panel" x="475" y="300" width="270" height="142" rx="12"/><text class="h" x="725" y="328" text-anchor="end">جذباتی</text><text class="small" x="725" y="348" text-anchor="end">جذبات سے ان کے ضبط تک</text><text class="sh" x="725" y="374" text-anchor="end">جماعت کی نشانیاں</text><text class="body" x="725" y="394" text-anchor="end">غلط جواب پر رونا کم ہوتا ہے</text><text class="body" x="725" y="412" text-anchor="end">مکمل کام پر فخر</text><text class="body" x="725" y="430" text-anchor="end">نئے کاموں سے خوف</text><rect class="panel" x="35" y="300" width="270" height="142" rx="12"/><text class="h" x="285" y="328" text-anchor="end">معاشرتی</text><text class="small" x="285" y="348" text-anchor="end">وابستگی، کھیل اور ہم عمر گروہ</text><text class="sh" x="285" y="374" text-anchor="end">جماعت کی نشانیاں</text><text class="body" x="285" y="394" text-anchor="end">کون کس کے ساتھ کھیلتا ہے</text><text class="body" x="285" y="412" text-anchor="end">الگ تھلگ شاگرد</text><text class="body" x="285" y="430" text-anchor="end">مل جل کر کام ممکن ہوتا ہے</text><ellipse class="ink" cx="390" cy="231" rx="128" ry="55" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">نشوونما پذیر</text><text x="390" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">شاگرد</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
