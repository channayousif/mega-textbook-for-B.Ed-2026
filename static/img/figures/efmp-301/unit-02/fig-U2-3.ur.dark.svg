<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عمر کے مطابق قد کی نشوونما کا گراف</title><desc id="d">عمر کے مطابق قد کی نشوونما کا گراف جس میں ابتدائی بچپن اور مراہقت کے دو تیز مراحل دکھائی دیتے ہیں، درمیان میں مستحکم مرحلہ، اور دو پٹیاں جو بتاتی ہیں کہ بڑی حرکی مہارتیں باریک مہارتوں سے پہلے پختہ ہوتی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.curve{stroke-width:5}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><text class="h ink" x="688" y="32" text-anchor="end">قد مختلف رفتار سے بڑھتا ہے</text><line class="stroke" x1="688" y1="244" x2="688" y2="58" marker-end="url(#arrow)"/><line class="stroke" x1="688" y1="244" x2="70" y2="244" marker-end="url(#arrow)"/><text class="sh ink" x="700" y="71">قد</text><text class="sh ink" x="90" y="268">عمر</text><g class="grid"><line x1="660" y1="244" x2="660" y2="76"/><line x1="520" y1="244" x2="520" y2="76"/><line x1="380" y1="244" x2="380" y2="76"/><line x1="170" y1="244" x2="170" y2="76"/><line x1="100" y1="244" x2="100" y2="76"/><line x1="80" y1="196" x2="688" y2="196"/><line x1="80" y1="148" x2="688" y2="148"/><line x1="80" y1="100" x2="688" y2="100"/></g><path class="stroke-a curve" d="M660 230 C626 215 582 171 520 154 C476 148 430 146 380 141 C333 127 254 80 170 55 C142 47 119 40 100 34"/><g class="small muted" text-anchor="middle"><text x="660" y="263">2</text><text x="520" y="263">6</text><text x="380" y="263">10</text><text x="170" y="263">16</text><text x="100" y="263">18</text></g><path class="stroke" d="M660 276 v10 h-140 v-10"/><text class="sh" x="590" y="306" text-anchor="middle">پہلا تیز مرحلہ</text><text class="small muted" x="590" y="322" text-anchor="middle">ابتدائی بچپن، عمر 2 سے 6</text><path class="grid" stroke-dasharray="5 5" d="M520 286 H380"/><text class="sh" x="450" y="306" text-anchor="middle">اسکول کے برس: مسلسل مگر آہستہ</text><path class="stroke" d="M380 276 v10 h-210 v-10"/><text class="sh" x="275" y="306" text-anchor="middle">دوسرا تیز مرحلہ (بلوغت)</text><text class="small muted" x="275" y="322" text-anchor="middle">مراہقت، عمر 10 سے 16</text><rect class="panel-a" x="78" y="340" width="610" height="42" rx="5"/><text class="body" x="674" y="358" text-anchor="end">بڑی حرکی مہارتیں: دوڑنا، چھلانگ، گیند پکڑنا</text><line class="stroke-a" x1="270" y1="369" x2="192" y2="369" marker-end="url(#arrow-a)"/><text class="small muted" x="182" y="373" text-anchor="end">پہلے پختہ ہوتی ہیں</text><rect class="panel-b" x="78" y="396" width="610" height="42" rx="5"/><text class="body" x="674" y="414" text-anchor="end">باریک حرکی مہارتیں: لکھنا، دھاگہ پرونا، کینچی چلانا</text><line class="stroke" x1="270" y1="425" x2="134" y2="425" marker-end="url(#arrow)"/><text class="small muted" x="124" y="429" text-anchor="end">بعد میں پختہ ہوتی ہیں</text><text class="small muted" x="688" y="457" text-anchor="end">تیریں باریک حرکی کنٹرول کے بعد کے وقت کو دکھاتی ہیں۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
