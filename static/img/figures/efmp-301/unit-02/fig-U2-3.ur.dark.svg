<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عمر کے مطابق قد کی نشوونما کا گراف</title><desc id="d">عمر کے مطابق قد کی نشوونما کا گراف جو دو تیز مراحل دکھاتا ہے: ابتدائی بچپن اور مراہقت، بیچ میں مستحکم مرحلہ، اور دو پٹیاں جو بتاتی ہیں کہ بڑی حرکی مہارتیں باریک مہارتوں سے پہلے پختہ ہوتی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"><rect id="region-steep-early" class="band" x="140" y="80" width="140" height="200"/><rect id="region-steep-puberty" class="band" x="420" y="80" width="210" height="200"/><path class="grid" d="M140 280V80M280 280V80M420 280V80M630 280V80M700 280V80M100 230H710M100 180H710M100 130H710"/></g><g id="layer-edges"><line id="edge-axis-height" class="stroke" x1="100" y1="280" x2="100" y2="60" marker-end="url(#arrow)"/><line id="edge-axis-age" class="stroke" x1="100" y1="280" x2="730" y2="280" marker-end="url(#arrow)"/><path id="edge-bracket-early" class="stroke" d="M140 320 v10 H280 v-10"/><path id="edge-bracket-plateau" class="grid" stroke-dasharray="5 5" d="M286 330 H414"/><path id="edge-bracket-puberty" class="stroke" d="M420 320 v10 H630 v-10"/></g><g id="layer-nodes"><g id="node-curve"><path class="stroke" d="M140 265 C190 240 240 195 280 186 C330 178 370 173 420 166 C480 150 570 100 630 88 C660 82 680 78 700 77" stroke-width="3"/></g><g id="node-gross-motor"><rect class="panel-a" x="100" y="442" width="620" height="70" rx="8"/><text class="body" x="704" y="468" text-anchor="end">‏بڑی حرکی مہارتیں: دوڑنا، چھلانگ، گیند پکڑنا‏</text><line class="stroke" x1="116" y1="494" x2="260" y2="494" marker-end="url(#arrow)"/><text class="small" x="272" y="499">‏پہلے پختہ ہوتی ہیں‏</text></g><g id="node-fine-motor"><rect class="panel-b" x="100" y="528" width="620" height="70" rx="8"/><text class="body" x="704" y="554" text-anchor="end">‏باریک حرکی مہارتیں: لکھنا، دھاگہ پرونا، کینچی چلانا‏</text><line class="stroke" x1="116" y1="580" x2="420" y2="580" marker-end="url(#arrow)"/><text class="small" x="432" y="585">‏بعد میں پختہ ہوتی ہیں‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="680" y="40" text-anchor="end">‏قد مختلف رفتار سے بڑھتا ہے‏</text><text id="label-height" class="sh" x="112" y="72">‏قد‏</text><text id="label-age" class="sh" x="724" y="262" text-anchor="end">‏عمر‏</text><g id="label-ages"><text class="small" x="140" y="300" text-anchor="middle">2</text><text class="small" x="280" y="300" text-anchor="middle">6</text><text class="small" x="420" y="300" text-anchor="middle">10</text><text class="small" x="630" y="300" text-anchor="middle">16</text><text class="small" x="700" y="300" text-anchor="middle">18</text></g><g id="label-phase-early"><text class="sh" x="210" y="354" text-anchor="middle">‏پہلا تیز مرحلہ‏</text><text class="small" x="210" y="380" text-anchor="middle">‏ابتدائی بچپن،‏</text><text class="small" x="210" y="404" text-anchor="middle">‏عمر ⁦2⁩ سے ⁦6⁩‏</text></g><g id="label-phase-plateau"><text class="sh" x="350" y="354" text-anchor="middle">‏اسکول کے برس:‏</text><text class="sh" x="350" y="380" text-anchor="middle">‏مسلسل مگر آہستہ‏</text></g><g id="label-phase-puberty"><text class="sh" x="525" y="354" text-anchor="middle">‏دوسرا تیز مرحلہ‏</text><text class="sh" x="525" y="380" text-anchor="middle">‏(بلوغت)‏</text><text class="small" x="525" y="406" text-anchor="middle">‏مراہقت، عمر ⁦10⁩ سے ⁦16⁩‏</text></g><text id="label-caption" class="small" x="704" y="626" text-anchor="end">‏یہ تیریں باریک کنٹرول کے بعد کے وقت کو دکھاتی ہیں۔‏</text><text aria-hidden="true" class="wm" x="12" y="650">textbook.com.pk</text></g></svg>
