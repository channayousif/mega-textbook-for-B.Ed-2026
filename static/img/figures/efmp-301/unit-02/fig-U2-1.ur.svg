<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کا تصوری نقشہ</title><desc id="d">ایک تصوری نقشہ جس کے مرکز میں نشوونما ہے، جو تین محرکوں سے جڑی ہے: پختگی جو عمر کے ساتھ کھلتی ہے، سیکھنا جو تجربے سے آتا ہے، اور نشو جو جسمانی اضافہ ہے، یہ یاد دہانی کے ساتھ کہ جماعت کا زیادہ تر رویہ تینوں کا مل جل ہوتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.h{font-size:15px;font-weight:700;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}text{font-size:13px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke"><path d="M535 145 L464 199"/><path d="M390 155 L390 199"/><path d="M245 145 L316 199"/><path d="M390 281 L390 338"/></g><g class="ink"><circle cx="464" cy="199" r="4"/><circle cx="390" cy="199" r="4"/><circle cx="316" cy="199" r="4"/><circle cx="390" cy="338" r="4"/></g><rect class="panel" x="535" y="34" width="220" height="111" rx="14"/><text class="h" x="645" y="65" text-anchor="middle">پختگی</text><text class="body" x="645" y="91" text-anchor="middle">عمر کے ساتھ کھلنا</text><text class="small muted" x="645" y="113" text-anchor="middle">جیسے بلوغت</text><text class="small muted" x="645" y="131" text-anchor="middle">وقت کے ساتھ آتی ہے، سکھانے سے نہیں</text><rect class="panel" x="280" y="26" width="220" height="129" rx="14"/><text class="h" x="390" y="58" text-anchor="middle">سیکھنا</text><text class="body" x="390" y="84" text-anchor="middle">تجربے سے تبدیلی</text><text class="small muted" x="390" y="106" text-anchor="middle">اسکول کے صحن کے پرندے پہچاننا</text><text class="small muted" x="390" y="130" text-anchor="middle">مشق اور سکھانے سے آتی ہے</text><rect class="panel" x="25" y="34" width="220" height="111" rx="14"/><text class="h" x="135" y="65" text-anchor="middle">نشو</text><text class="body" x="135" y="91" text-anchor="middle">جسمانی اضافہ</text><text class="small muted" x="135" y="113" text-anchor="middle">جیسے قد</text><text class="small muted" x="135" y="131" text-anchor="middle">سینٹی میٹر میں ناپا جاتا ہے</text><rect class="panel" x="285" y="199" width="210" height="82" rx="41"/><text class="h" x="390" y="234" text-anchor="middle">نشوونما</text><text class="small muted" x="390" y="257" text-anchor="middle">وقت کے ساتھ بدلتا شاگرد</text><rect class="panel" x="165" y="338" width="450" height="91" rx="14"/><text class="h" x="390" y="371" text-anchor="middle">ان کا باہمی ملاپ</text><text class="body" x="390" y="398" text-anchor="middle">جماعت کا زیادہ تر رویہ تینوں کا مل جل ہوتا ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
