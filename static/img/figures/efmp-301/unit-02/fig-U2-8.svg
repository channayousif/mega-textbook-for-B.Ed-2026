<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five common classroom observations</title><desc id="d">A table of five common classroom observations, each with the developmental reading that explains it and a matched teaching response.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="12" y="18" width="756" height="62" fill="var(--panel)"/><rect class="grid" x="12" y="18" width="756" height="392"/><path class="grid" d="M264 18V410M516 18V410M12 80H768M12 146H768M12 212H768M12 278H768M12 344H768"/><text class="h ink" x="138" y="56" text-anchor="middle">what you see in class</text><text class="h ink" x="390" y="56" text-anchor="middle">the developmental reading</text><text class="h ink" x="642" y="56" text-anchor="middle">a matched response</text><text class="body" x="24" y="106">copying without understanding</text><text class="body" x="276" y="98">the task is at a stage ahead of</text><text class="body" x="276" y="116">the pupils' thinking</text><text class="body" x="528" y="98">back to concrete materials, then</text><text class="body" x="528" y="116">pictures, then symbols</text><text class="body" x="24" y="169">multi-step instructions lost midway</text><text class="body" x="276" y="164">reversibility not yet in place</text><text class="body" x="528" y="164">numbered steps on the board,</text><text class="body" x="528" y="182">external reminders</text><text class="body" x="24" y="230">large shaky handwriting</text><text class="body" x="24" y="248">despite effort</text><text class="body" x="276" y="230">fine motor control still maturing</text><text class="body" x="528" y="230">wider lines, larger boxes,</text><text class="body" x="528" y="248">patience</text><text class="body" x="24" y="296">shouting when group work</text><text class="body" x="24" y="314">frustrates</text><text class="body" x="276" y="296">emotional regulation still</text><text class="body" x="276" y="314">developing</text><text class="body" x="528" y="296">a role in the group, a named</text><text class="body" x="528" y="314">strategy, time</text><text class="body" x="24" y="362">one pupil always alone at break</text><text class="body" x="276" y="362">the peer-group map has a gap</text><text class="body" x="528" y="362">structured pairing, deliberate roles</text><text class="sh" x="12" y="440">Observe, read, respond</text><text class="small muted" x="188" y="440">Match the task to the pupil's next step.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
