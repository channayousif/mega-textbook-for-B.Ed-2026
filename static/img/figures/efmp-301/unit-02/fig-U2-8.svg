<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five common classroom observations</title><desc id="d">A table of five common classroom observations, each with the developmental reading that explains it and a matched teaching response.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="550"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="444" rx="8"/><path id="region-header" class="head" d="M28 20H752A8 8 0 0 1 760 28V84H20V28A8 8 0 0 1 28 20z"/><rect class="band" x="21" y="160" width="738" height="76"/><rect class="band" x="21" y="312" width="738" height="76"/><path class="grid" d="M270 20V464M520 20V464M20 160H760M20 236H760M20 312H760M20 388H760"/><path class="rule" d="M20 84H760"/><rect class="frame" x="20" y="20" width="740" height="444" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="57.6">what you see in class</text><text class="h" x="282" y="47.6">the developmental</text><text class="h" x="282" y="67.6">reading</text><text class="h" x="532" y="57.6">a matched response</text></g><g id="node-row-copying"><text class="body" x="32" y="117.9">copying without</text><text class="body" x="32" y="135.9">understanding</text><text class="body" x="282" y="117.9">the task is at a stage ahead</text><text class="body" x="282" y="135.9">of the pupils' thinking</text><text class="body" x="532" y="117.9">back to concrete materials,</text><text class="body" x="532" y="135.9">then pictures, then symbols</text></g><g id="node-row-instructions"><text class="body" x="32" y="193.9">multi-step instructions lost</text><text class="body" x="32" y="211.9">midway</text><text class="body" x="282" y="193.9">reversibility not yet in</text><text class="body" x="282" y="211.9">place</text><text class="body" x="532" y="193.9">numbered steps on the</text><text class="body" x="532" y="211.9">board, external reminders</text></g><g id="node-row-handwriting"><text class="body" x="32" y="269.9">large shaky handwriting</text><text class="body" x="32" y="287.9">despite effort</text><text class="body" x="282" y="269.9">fine motor control still</text><text class="body" x="282" y="287.9">maturing</text><text class="body" x="532" y="269.9">wider lines, larger boxes,</text><text class="body" x="532" y="287.9">patience</text></g><g id="node-row-shouting"><text class="body" x="32" y="345.9">shouting when group work</text><text class="body" x="32" y="363.9">frustrates</text><text class="body" x="282" y="345.9">emotional regulation still</text><text class="body" x="282" y="363.9">developing</text><text class="body" x="532" y="345.9">a role in the group, a</text><text class="body" x="532" y="363.9">named strategy, time</text></g><g id="node-row-alone"><text class="body" x="32" y="421.9">one pupil always alone at</text><text class="body" x="32" y="439.9">break</text><text class="body" x="282" y="430.9">the peer-group map has a gap</text><text class="body" x="532" y="421.9">structured pairing,</text><text class="body" x="532" y="439.9">deliberate roles</text></g></g><g id="layer-labels"><g id="label-caption"><text class="sh" x="20" y="490">Observe, read, respond:</text><text class="small" x="20" y="509">match the task to the pupil's next step.</text></g><text aria-hidden="true" class="wm" x="768" y="540" text-anchor="end">textbook.com.pk</text></g></svg>
