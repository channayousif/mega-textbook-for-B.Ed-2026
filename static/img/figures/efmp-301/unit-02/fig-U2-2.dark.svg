<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the three engines of development</title><desc id="d">A table comparing the three engines of development - growth, maturation and learning - against what each is, an everyday example, and what a teacher can do about it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="296" rx="8"/><path id="region-header" class="head" d="M28 20H752A8 8 0 0 1 760 28V84H20V28A8 8 0 0 1 28 20z"/><rect class="band" x="21" y="162" width="738" height="76"/><path class="grid" d="M160 20V316M360 20V316M560 20V316M20 162H760M20 238H760"/><path class="rule" d="M20 84H760"/><rect class="frame" x="20" y="20" width="740" height="296" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="57.6">engine</text><text class="h" x="172" y="57.6">what it is</text><text class="h" x="372" y="47.6">an everyday</text><text class="h" x="372" y="67.6">example</text><text class="h" x="572" y="47.6">what a teacher</text><text class="h" x="572" y="67.6">can do</text></g><g id="node-row-growth"><circle class="panel-a" cx="43" cy="123" r="11"/><text class="sh" x="43" y="128" text-anchor="middle">1</text><text class="sh" x="62" y="126.6">growth</text><text class="body" x="172" y="109.9">physical increase,</text><text class="body" x="172" y="127.9">measured in</text><text class="body" x="172" y="145.9">centimetres</text><text class="body" x="372" y="118.9">a pupil a head taller</text><text class="body" x="372" y="136.9">than last year</text><text class="body" x="572" y="118.9">adjust the desk and</text><text class="body" x="572" y="136.9">the seating plan</text></g><g id="node-row-maturation"><circle class="panel-a" cx="43" cy="200" r="11"/><text class="sh" x="43" y="205" text-anchor="middle">2</text><text class="sh" x="62" y="203.6">maturation</text><text class="body" x="172" y="195.9">a built-in programme</text><text class="body" x="172" y="213.9">unfolding with age</text><text class="body" x="372" y="195.9">puberty arriving on</text><text class="body" x="372" y="213.9">its own schedule</text><text class="body" x="572" y="195.9">wait, and prepare the</text><text class="body" x="572" y="213.9">pupil for it</text></g><g id="node-row-learning"><circle class="panel-a" cx="43" cy="277" r="11"/><text class="sh" x="43" y="282" text-anchor="middle">3</text><text class="sh" x="62" y="280.6">learning</text><text class="body" x="172" y="263.9">change through</text><text class="body" x="172" y="281.9">experience and</text><text class="body" x="172" y="299.9">practice</text><text class="body" x="372" y="272.9">knowing the birds of</text><text class="body" x="372" y="290.9">the schoolyard</text><text class="body" x="572" y="272.9">teach it, and check</text><text class="body" x="572" y="290.9">the teaching worked</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="20" y="342">Three named engines, three different classroom responses</text><text aria-hidden="true" class="wm" x="768" y="370" text-anchor="end">textbook.com.pk</text></g></svg>
