<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of the developing pupil</title><desc id="d">A concept map of the developing pupil with three domain branches - cognitive, emotional and social - each carrying classroom signs, and dashed arrows showing that each domain feeds the others.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-pupil-cognitive" class="link" d="M390 248 V220"/><path id="edge-pupil-emotional" class="link" d="M280 290 C170 290 170 320 170 360"/><path id="edge-pupil-social" class="link" d="M500 290 C610 290 610 320 610 360"/><path id="edge-cognitive-emotional" class="dash" d="M240 120 C80 120 60 240 60 360" marker-start="url(#arrow-b)" marker-end="url(#arrow-b)"/><path id="edge-cognitive-social" class="dash" d="M540 120 C700 120 720 240 720 360" marker-start="url(#arrow-b)" marker-end="url(#arrow-b)"/><path id="edge-emotional-social" class="dash" d="M320 500 H460" marker-start="url(#arrow-b)" marker-end="url(#arrow-b)"/></g><g id="layer-nodes"><g id="node-cognitive"><rect class="panel" x="240" y="20" width="300" height="200" rx="12"/><text class="h" x="256" y="50">cognitive</text><text class="small" x="256" y="69">how thinking changes with age</text><text class="sh" x="256" y="95">classroom signs</text><circle class="panel-a" cx="260" cy="108" r="3"/><text class="body" x="270" y="113">conservation answers vary by age</text><circle class="panel-a" cx="260" cy="126" r="3"/><text class="body" x="270" y="131">multi-step task rule-following</text><circle class="panel-a" cx="260" cy="144" r="3"/><text class="body" x="270" y="149">jokes that land differently</text></g><g id="node-emotional"><rect class="panel" x="20" y="360" width="300" height="200" rx="12"/><text class="h" x="36" y="390">emotional</text><text class="small" x="36" y="409">from feelings to their regulation</text><text class="sh" x="36" y="435">classroom signs</text><circle class="panel-a" cx="40" cy="448" r="3"/><text class="body" x="50" y="453">crying at wrong answers fades</text><circle class="panel-a" cx="40" cy="466" r="3"/><text class="body" x="50" y="471">pride in finished work</text><circle class="panel-a" cx="40" cy="484" r="3"/><text class="body" x="50" y="489">fear of new tasks</text></g><g id="node-social"><rect class="panel" x="460" y="360" width="300" height="200" rx="12"/><text class="h" x="476" y="390">social</text><text class="small" x="476" y="409">attachment, play and the peer group</text><text class="sh" x="476" y="435">classroom signs</text><circle class="panel-a" cx="480" cy="448" r="3"/><text class="body" x="490" y="453">who plays with whom</text><circle class="panel-a" cx="480" cy="466" r="3"/><text class="body" x="490" y="471">the isolated pupil</text><circle class="panel-a" cx="480" cy="484" r="3"/><text class="body" x="490" y="489">cooperative work becomes possible</text></g><g id="node-pupil"><ellipse class="panel-a" cx="390" cy="290" rx="110" ry="42"/><text class="h" x="390" y="284" text-anchor="middle">the developing</text><text class="h" x="390" y="304" text-anchor="middle">pupil</text></g></g><g id="layer-labels"><g id="label-feeds-left"><text class="small" x="24" y="50">each feeds</text><text class="small" x="24" y="67">the others</text></g><g id="label-feeds-right"><text class="small" x="756" y="50" text-anchor="end">each feeds</text><text class="small" x="756" y="67" text-anchor="end">the others</text></g><g id="label-feeds-bottom"><text class="small" x="390" y="528" text-anchor="middle">each feeds</text><text class="small" x="390" y="545" text-anchor="middle">the others</text></g><text aria-hidden="true" class="wm" x="768" y="580" text-anchor="end">textbook.com.pk</text></g></svg>
