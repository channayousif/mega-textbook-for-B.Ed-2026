<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of the developing pupil</title><desc id="d">A concept map of the developing pupil with three domain branches - cognitive, emotional and social - each carrying classroom signs, and dashed arrows showing that each domain feeds the others.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.solid{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--muted);stroke-width:2;stroke-dasharray:7 5;fill:none}.ah{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><path class="dash" d="M150 156C58 210 72 273 165 300" marker-end="url(#a)"/><path class="dash" d="M255 156C357 204 464 214 600 300" marker-end="url(#a)"/><path class="dash" d="M304 390C366 452 421 452 477 390" marker-end="url(#a)"/><text class="small" x="56" y="230">each feeds</text><text class="small" x="56" y="245">the others</text><text class="small" x="555" y="232">each feeds</text><text class="small" x="555" y="247">the others</text><text class="small" x="390" y="449" text-anchor="middle">each feeds the others</text><path class="solid" d="M247 156L331 191"/><path class="solid" d="M270 300L329 270"/><path class="solid" d="M510 300L451 270"/><rect class="panel" x="32" y="22" width="270" height="134" rx="12"/><text class="h" x="52" y="50">cognitive</text><text class="small" x="52" y="70">how thinking changes with age</text><text class="sh" x="52" y="96">Classroom signs</text><text class="body" x="52" y="116">• conservation answers vary by age</text><text class="body" x="52" y="134">• multi-step task rule-following</text><text class="body" x="52" y="152">• jokes that land differently</text><rect class="panel" x="35" y="300" width="270" height="142" rx="12"/><text class="h" x="55" y="328">emotional</text><text class="small" x="55" y="348">from feelings to their regulation</text><text class="sh" x="55" y="374">Classroom signs</text><text class="body" x="55" y="394">• crying at wrong answers fades</text><text class="body" x="55" y="412">• pride in finished work</text><text class="body" x="55" y="430">• fear of new tasks</text><rect class="panel" x="475" y="300" width="270" height="142" rx="12"/><text class="h" x="495" y="328">social</text><text class="small" x="495" y="348">attachment, play and the peer group</text><text class="sh" x="495" y="374">Classroom signs</text><text class="body" x="495" y="394">• who plays with whom</text><text class="body" x="495" y="412">• the isolated pupil</text><text class="body" x="495" y="430">• cooperative work becomes possible</text><ellipse class="ink" cx="390" cy="231" rx="128" ry="55" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="var(--bg)">the developing</text><text x="390" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="var(--bg)">pupil</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
