<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کے چار شعبوں کا موازنہ</title><desc id="d">نشوونما کے چار شعبوں، ادراکی، جذباتی، معاشرتی اور جسمانی، کا موازنہ: کیا بڑھتا ہے، جماعت 2 بمقابلہ جماعت 6 کا عام فرق، اور ہر ایک کی جماعت میں ایک نشانی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{font-size:13px;fill:var(--ink)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:11px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="14" y="20" width="752" height="58" rx="5"/><rect class="grid" x="14" y="20" width="752" height="406" rx="5"/><line class="grid" x1="645" y1="20" x2="645" y2="426"/><line class="grid" x1="495" y1="20" x2="495" y2="426"/><line class="grid" x1="205" y1="20" x2="205" y2="426"/><line class="grid" x1="14" y1="78" x2="766" y2="78"/><line class="grid" x1="14" y1="165" x2="766" y2="165"/><line class="grid" x1="14" y1="252" x2="766" y2="252"/><line class="grid" x1="14" y1="339" x2="766" y2="339"/><rect class="panel-a" x="645" y="78" width="121" height="87" rx="4"/><rect class="panel-b" x="645" y="165" width="121" height="87" rx="4"/><rect class="panel-c" x="645" y="252" width="121" height="87" rx="4"/><rect class="panel-d" x="645" y="339" width="121" height="87" rx="4"/><text class="h ink" x="705" y="54" text-anchor="middle">شعبہ</text><text class="h ink" x="570" y="54" text-anchor="middle">کیا بڑھتا ہے</text><text class="h ink" x="350" y="47" text-anchor="middle">جماعت 2 بمقابلہ</text><text class="h ink" x="350" y="66" text-anchor="middle">جماعت 6 کا فرق</text><text class="h ink" x="110" y="47" text-anchor="middle">جماعت کی</text><text class="h ink" x="110" y="66" text-anchor="middle">ایک نشانی</text><circle class="ink" cx="747" cy="120" r="7"/><text class="sh" x="733" y="116" text-anchor="end">ادراکی</text><text class="small muted" x="733" y="135" text-anchor="end">سوچ</text><text class="body" x="570" y="113" text-anchor="middle">سوچ اور</text><text class="body" x="570" y="133" text-anchor="middle">یادداشت</text><text class="body" x="350" y="104" text-anchor="middle">یقین کہ لمبا گلاس زیادہ پانی رکھتا ہے</text><text class="body" x="350" y="124" text-anchor="middle">بمقابلہ اُلٹنے کے اصول کی وضاحت</text><text class="body" x="110" y="104" text-anchor="middle">کثیر مرحلہ ہدایتیں یاد دہانی</text><text class="body" x="110" y="124" text-anchor="middle">کے بغیر پوری ہوتی ہیں</text><rect class="ink" x="740" y="201" width="14" height="14" rx="1"/><text class="sh" x="733" y="203" text-anchor="end">جذباتی</text><text class="small muted" x="733" y="222" text-anchor="end">ضبط</text><text class="body" x="570" y="200" text-anchor="middle">جذبات کا</text><text class="body" x="570" y="220" text-anchor="middle">ضبط</text><text class="body" x="350" y="200" text-anchor="middle">غلط جواب پر رونا بمقابلہ</text><text class="body" x="350" y="220" text-anchor="middle">شرماتے ہوئے دوبارہ کوشش</text><text class="body" x="110" y="190" text-anchor="middle">وہ شاگرد جو مارچ میں اُس پر ہنسے</text><text class="body" x="110" y="210" text-anchor="middle">جس پر ستمبر میں روئے تھے</text><text class="body" x="110" y="230" text-anchor="middle">&nbsp;</text><path class="ink" d="M747 278l-8 14h16z"/><text class="sh" x="733" y="290" text-anchor="end">معاشرتی</text><text class="small muted" x="733" y="309" text-anchor="end">ہم عمر اور کھیل</text><text class="body" x="570" y="287" text-anchor="middle">تعلقات،</text><text class="body" x="570" y="307" text-anchor="middle">کھیل، ہم عمر</text><text class="body" x="350" y="277" text-anchor="middle">دوسروں کے پاس بغیر ملاپ کھیل</text><text class="body" x="350" y="297" text-anchor="middle">بمقابلہ اصولوں پر متفق کھیل</text><text class="body" x="110" y="287" text-anchor="middle">بیٹھنے کا نقشہ کہ کون</text><text class="body" x="110" y="307" text-anchor="middle">کس کے ساتھ کام کرتا ہے</text><path class="ink" d="M747 365l8 8-8 8-8-8z"/><text class="sh" x="733" y="377" text-anchor="end">جسمانی</text><text class="small muted" x="733" y="396" text-anchor="end">موضوع 2.2 سے</text><text class="body" x="570" y="374" text-anchor="middle">جسم اور حرکی</text><text class="body" x="570" y="394" text-anchor="middle">کنٹرول</text><text class="body" x="350" y="374" text-anchor="middle">بڑے ڈگمگائے حروف بمقابلہ</text><text class="body" x="350" y="394" text-anchor="middle">چھوٹے برابر حروف</text><text class="body" x="110" y="374" text-anchor="middle">نئی مشق کی کاپی</text><text class="body" x="110" y="394" text-anchor="middle">پر لکھائی</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
