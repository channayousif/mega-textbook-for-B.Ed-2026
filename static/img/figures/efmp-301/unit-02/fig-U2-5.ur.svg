<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما پذیر شاگرد کا تصوری نقشہ</title><desc id="d">نشوونما پذیر شاگرد کا تصوری نقشہ تین شاخوں کے ساتھ: ادراکی، جذباتی اور معاشرتی، ہر ایک پر جماعت کی نشانیاں، اور باریک تیروں کے ساتھ کہ ہر شاخ دوسروں کو سہارا دیتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-pupil-cognitive" class="link" d="M390 248 V220"/><path id="edge-pupil-emotional" class="link" d="M500 290 C610 290 610 320 610 360"/><path id="edge-pupil-social" class="link" d="M280 290 C170 290 170 320 170 360"/><path id="edge-cognitive-emotional" class="dash" d="M540 120 C700 120 720 240 720 360" marker-start="url(#arrow-b)" marker-end="url(#arrow-b)"/><path id="edge-cognitive-social" class="dash" d="M240 120 C80 120 60 240 60 360" marker-start="url(#arrow-b)" marker-end="url(#arrow-b)"/><path id="edge-emotional-social" class="dash" d="M460 500 H320" marker-start="url(#arrow-b)" marker-end="url(#arrow-b)"/></g><g id="layer-nodes"><g id="node-cognitive"><rect class="panel" x="240" y="20" width="300" height="200" rx="12"/><text class="h" x="524" y="54" text-anchor="end">‏ادراکی‏</text><text class="small" x="524" y="80" text-anchor="end">‏سوچ عمر کے ساتھ کیسے بدلتی ہے‏</text><text class="sh" x="524" y="114" text-anchor="end">‏جماعت کی نشانیاں‏</text><circle class="panel-a" cx="520" cy="133" r="3"/><text class="body" x="510" y="140" text-anchor="end">‏بقا کے جواب عمر کے ساتھ بدلتے ہیں‏</text><circle class="panel-a" cx="520" cy="159" r="3"/><text class="body" x="510" y="166" text-anchor="end">‏کثیر مرحلہ کام میں اصول کی پیروی‏</text><circle class="panel-a" cx="520" cy="185" r="3"/><text class="body" x="510" y="192" text-anchor="end">‏لطیفے مختلف عمر پر مختلف بیٹھتے ہیں‏</text></g><g id="node-emotional"><rect class="panel" x="460" y="360" width="300" height="200" rx="12"/><text class="h" x="744" y="394" text-anchor="end">‏جذباتی‏</text><text class="small" x="744" y="420" text-anchor="end">‏جذبات سے ان کے ضبط تک‏</text><text class="sh" x="744" y="454" text-anchor="end">‏جماعت کی نشانیاں‏</text><circle class="panel-a" cx="740" cy="473" r="3"/><text class="body" x="730" y="480" text-anchor="end">‏غلط جواب پر رونا کم ہوتا ہے‏</text><circle class="panel-a" cx="740" cy="499" r="3"/><text class="body" x="730" y="506" text-anchor="end">‏مکمل کام پر فخر‏</text><circle class="panel-a" cx="740" cy="525" r="3"/><text class="body" x="730" y="532" text-anchor="end">‏نئے کاموں سے خوف‏</text></g><g id="node-social"><rect class="panel" x="20" y="360" width="300" height="200" rx="12"/><text class="h" x="304" y="394" text-anchor="end">‏معاشرتی‏</text><text class="small" x="304" y="420" text-anchor="end">‏وابستگی، کھیل اور ہم عمر گروہ‏</text><text class="sh" x="304" y="454" text-anchor="end">‏جماعت کی نشانیاں‏</text><circle class="panel-a" cx="300" cy="473" r="3"/><text class="body" x="290" y="480" text-anchor="end">‏کون کس کے ساتھ کھیلتا ہے‏</text><circle class="panel-a" cx="300" cy="499" r="3"/><text class="body" x="290" y="506" text-anchor="end">‏الگ تھلگ شاگرد‏</text><circle class="panel-a" cx="300" cy="525" r="3"/><text class="body" x="290" y="532" text-anchor="end">‏مل جل کر کام ممکن ہوتا ہے‏</text></g><g id="node-pupil"><ellipse class="panel-a" cx="390" cy="290" rx="110" ry="42"/><text class="h" x="390" y="282" text-anchor="middle">‏نشوونما پذیر‏</text><text class="h" x="390" y="308" text-anchor="middle">‏شاگرد‏</text></g></g><g id="layer-labels"><g id="label-feeds-left"><text class="small" x="756" y="50" text-anchor="end">‏ہر ایک دوسروں کو‏</text><text class="small" x="756" y="74" text-anchor="end">‏سہارا دیتی ہے‏</text></g><g id="label-feeds-right"><text class="small" x="24" y="50" text-anchor="start">‏ہر ایک دوسروں کو‏</text><text class="small" x="24" y="74" text-anchor="start">‏سہارا دیتی ہے‏</text></g><g id="label-feeds-bottom"><text class="small" x="390" y="530" text-anchor="middle">‏ہر ایک دوسروں کو‏</text><text class="small" x="390" y="554" text-anchor="middle">‏سہارا دیتی ہے‏</text></g><text aria-hidden="true" class="wm" x="12" y="590" text-anchor="start">textbook.com.pk</text></g></svg>
