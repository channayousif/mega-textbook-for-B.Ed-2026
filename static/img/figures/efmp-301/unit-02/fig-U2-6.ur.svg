<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کے چار شعبوں کا موازنہ</title><desc id="d">نشوونما کے چار شعبوں کا جدول: ادراکی، جذباتی، معاشرتی اور جسمانی، ہر ایک پر کیا بڑھتا ہے، جماعت دوم بمقابلہ جماعت ششم کا عام فرق، اور ہر ایک کی جماعت کی ایک نشانی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="410" rx="8"/><path id="region-header" class="head" d="M752 20 H28 A8 8 0 0 0 20 28 V100 H760 V28 A8 8 0 0 0 752 20 z"/><rect class="band" x="21" y="176" width="738" height="102"/><rect class="band" x="21" y="354" width="738" height="76"/><path class="grid" d="M630 20 V430 M490 20 V430 M240 20 V430 M760 176 H20 M760 278 H20 M760 354 H20"/><path class="rule" d="M760 100 H20"/><rect class="frame" x="20" y="20" width="740" height="410" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="748" y="65.6" text-anchor="end">‏شعبہ‏</text><text class="h" x="618" y="65.6" text-anchor="end">‏کیا بڑھتا ہے‏</text><text class="h" x="478" y="51.6" text-anchor="end">‏جماعت ⁦2⁩ بمقابلہ جماعت ⁦6⁩ کا‏</text><text class="h" x="478" y="79.6" text-anchor="end">‏فرق‏</text><text class="h" x="228" y="65.6" text-anchor="end">‏جماعت کی ایک نشانی‏</text></g><g id="node-row-cognitive"><text class="sh" x="748" y="131.2" text-anchor="end">‏ادراکی‏</text><text class="small" x="748" y="155.8" text-anchor="end">‏سوچ‏</text><text class="body" x="618" y="142.9" text-anchor="end">‏سوچ اور یادداشت‏</text><text class="body" x="478" y="129.9" text-anchor="end">‏یقین کہ لمبا گلاس زیادہ پانی رکھتا ہے‏</text><text class="body" x="478" y="155.9" text-anchor="end">‏بمقابلہ اُلٹنے کے اصول کی وضاحت‏</text><text class="body" x="228" y="129.9" text-anchor="end">‏کثیر مرحلہ ہدایتیں یاد دہانی‏</text><text class="body" x="228" y="155.9" text-anchor="end">‏کے بغیر پوری ہوتی ہیں‏</text></g><g id="node-row-emotional"><text class="sh" x="748" y="220.2" text-anchor="end">‏جذباتی‏</text><text class="small" x="748" y="244.8" text-anchor="end">‏ضبط‏</text><text class="body" x="618" y="231.9" text-anchor="end">‏جذبات کا ضبط‏</text><text class="body" x="478" y="218.9" text-anchor="end">‏غلط جواب پر رونا بمقابلہ‏</text><text class="body" x="478" y="244.9" text-anchor="end">‏شرماتے ہوئے دوبارہ کوشش‏</text><text class="body" x="228" y="205.9" text-anchor="end">‏وہ شاگرد جو مارچ میں اُس پر‏</text><text class="body" x="228" y="231.9" text-anchor="end">‏ہنسے جس پر ستمبر میں روئے‏</text><text class="body" x="228" y="257.9" text-anchor="end">‏تھے‏</text></g><g id="node-row-social"><text class="sh" x="748" y="309.2" text-anchor="end">‏معاشرتی‏</text><text class="small" x="748" y="333.8" text-anchor="end">‏ہم عمر اور کھیل‏</text><text class="body" x="618" y="307.9" text-anchor="end">‏تعلقات، کھیل، ہم‏</text><text class="body" x="618" y="333.9" text-anchor="end">‏عمر‏</text><text class="body" x="478" y="307.9" text-anchor="end">‏دوسروں کے پاس بغیر ملاپ کھیل‏</text><text class="body" x="478" y="333.9" text-anchor="end">‏بمقابلہ اصولوں پر متفق کھیل‏</text><text class="body" x="228" y="307.9" text-anchor="end">‏بیٹھنے کا نقشہ کہ کون کس کے‏</text><text class="body" x="228" y="333.9" text-anchor="end">‏ساتھ کام کرتا ہے‏</text></g><g id="node-row-physical"><text class="sh" x="748" y="385.2" text-anchor="end">‏جسمانی‏</text><text class="small" x="748" y="409.8" text-anchor="end">‏موضوع ⁦2.2⁩ سے‏</text><text class="body" x="618" y="383.9" text-anchor="end">‏جسم اور حرکی‏</text><text class="body" x="618" y="409.9" text-anchor="end">‏کنٹرول‏</text><text class="body" x="478" y="383.9" text-anchor="end">‏بڑے ڈگمگائے حروف بمقابلہ‏</text><text class="body" x="478" y="409.9" text-anchor="end">‏چھوٹے برابر حروف‏</text><text class="body" x="228" y="396.9" text-anchor="end">‏نئی مشق کی کاپی پر لکھائی‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="460" text-anchor="start">textbook.com.pk</text></g></svg>
