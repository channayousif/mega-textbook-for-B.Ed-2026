x="166" y="132">gross motor skills</text><text class="body" x="166" y="149">arriving</text><text class="body" x="344" y="106">furniture scale</text><text class="body" x="344" y="126">sand and blocks</text><text class="body" x="344" y="146">movement breaks</text><text class="body" x="582" y="116">that fine writing</text><text class="body" x="582" y="136">is carelessness</text><text class="sh" x="24" y="192">primary years</text><text class="small muted" x="24" y="212">6 to 11</text><text class="body" x="166" y="187">steady growth</text><text class="body" x="166" y="204">fine motor control</text><text class="body" x="166" y="221">maturing, permanent</text><text class="body" x="166" y="238">teeth</text><text class="body" x="344" y="184">pencil grips</text><text class="body" x="344" y="201">line spacing</text><text class="body" x="344" y="218">craft tools</text><text class="body" x="344" y="235">patience with</text><text class="body" x="344" y="252">handwriting</text><text class="body" x="582" y="205">that small-for-age</text><text class="body" x="582" y="225">means less able</text><text class="sh" x="24" y="281">puberty</text><text class="small muted" x="24" y="301">about 10 to 14</text><text class="body" x="166" y="276">second steep phase</text><text class="body" x="166" y="293">sexual maturation</text><text class="body" x="166" y="310">girls earlier than</text><text class="body" x="166" y="327">boys</text><text class="body" x="344" y="284">privacy, flexibility</text><text class="body" x="344" y="304">no body comments</text><text class="body" x="344" y="324">timetable sense</text><text class="body" x="582" y="294">that inconsistency</text><text class="body" x="582" y="314">is defiance</text><text class="sh" x="24" y="370">later adolescence</text><text class="small muted" x="24" y="390">14 to 18</text><text class="body" x="166" y="365">adult height</text><text class="body" x="166" y="382">approached</text><text class="body" x="166" y="399">strength and</text><text class