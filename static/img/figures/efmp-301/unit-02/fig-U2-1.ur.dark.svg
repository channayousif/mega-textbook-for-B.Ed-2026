<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کا تصوری نقشہ</title><desc id="d">نشوونما مرکز میں ہے، تین محرکوں سے جڑی: پختگی جو عمر کے ساتھ کھلتی ہے، سیکھنا جو تجربے سے آتا ہے، اور نشو جو جسمانی اضافہ ہے، اور یاد دہانی کہ جماعت کا زیادہ تر رویہ تینوں کا مل جل ہوتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-maturation-development" class="link" d="M650 200 C650 250 590 280 520 280"/><path id="edge-learning-development" class="link" d="M390 200 V240"/><path id="edge-growth-development" class="link" d="M130 200 C130 250 190 280 260 280"/><path id="edge-development-interaction" class="link" d="M390 320 V380"/></g><g id="layer-nodes"><g id="node-maturation"><rect class="panel" x="540" y="20" width="220" height="180" rx="12"/><text class="h" x="650" y="54" text-anchor="middle">‏پختگی‏</text><text class="body" x="650" y="86" text-anchor="middle">‏عمر کے ساتھ کھلنا‏</text><text class="small" x="650" y="118" text-anchor="middle">‏جیسے بلوغت‏</text><text class="small" x="650" y="142" text-anchor="middle">‏وقت کے ساتھ آتی ہے،‏</text><text class="small" x="650" y="166" text-anchor="middle">‏سکھانے سے نہیں‏</text></g><g id="node-learning"><rect class="panel" x="280" y="20" width="220" height="180" rx="12"/><text class="h" x="390" y="54" text-anchor="middle">‏سیکھنا‏</text><text class="body" x="390" y="86" text-anchor="middle">‏تجربے سے تبدیلی‏</text><text class="small" x="390" y="118" text-anchor="middle">‏اسکول کے صحن کے پرندے پہچاننا‏</text><text class="small" x="390" y="142" text-anchor="middle">‏مشق اور سکھانے‏</text><text class="small" x="390" y="166" text-anchor="middle">‏سے آتی ہے‏</text></g><g id="node-growth"><rect class="panel" x="20" y="20" width="220" height="180" rx="12"/><text class="h" x="130" y="54" text-anchor="middle">‏نشو‏</text><text class="body" x="130" y="86" text-anchor="middle">‏جسمانی اضافہ‏</text><text class="small" x="130" y="118" text-anchor="middle">‏جیسے قد‏</text><text class="small" x="130" y="142" text-anchor="middle">‏سینٹی میٹر میں‏</text><text class="small" x="130" y="166" text-anchor="middle">‏ناپا جاتا ہے‏</text></g><g id="node-development"><rect class="panel-a" x="260" y="240" width="260" height="80" rx="40"/><text class="h" x="390" y="272" text-anchor="middle">‏نشوونما‏</text><text class="small" x="390" y="304" text-anchor="middle">‏وقت کے ساتھ بدلتا شاگرد‏</text></g><g id="node-interaction"><rect class="panel" x="160" y="380" width="460" height="80" rx="12"/><text class="h" x="390" y="410" text-anchor="middle">‏ان کا باہمی ملاپ‏</text><text class="body" x="390" y="442" text-anchor="middle">‏جماعت کا زیادہ تر رویہ تینوں کا مل جل ہوتا ہے‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="490" text-anchor="start">textbook.com.pk</text></g></svg>
