<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the three engines of development</title><desc id="d">A table comparing the three engines of development - growth, maturation and learning - against what each is, an everyday example, and what a teacher can do about it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="20" width="756" height="401" rx="8"/><path class="grid" d="M138 20V421M338 20V421M556 20V421M12 82H768M12 195H768M12 308H768"/><path class="ink" d="M12 82H768V86H12z"/><text class="h" x="75" y="53" text-anchor="middle">engine</text><text class="h" x="238" y="53" text-anchor="middle">what it is</text><text class="h" x="447" y="46" text-anchor="middle">an everyday</text><text class="h" x="447" y="65" text-anchor="middle">example</text><text class="h" x="662" y="46" text-anchor="middle">what a teacher</text><text class="h" x="662" y="65" text-anchor="middle">can do</text><circle class="grid" cx="35" cy="117" r="11"/><text class="sh" x="35" y="122" text-anchor="middle">1</text><text class="h" x="75" y="151" text-anchor="middle">growth</text><text class="body" x="154" y="120">physical increase, measured</text><text class="body" x="154" y="142">in centimetres</text><text class="body" x="354" y="120">a pupil a head taller</text><text class="body" x="354" y="142">than last year</text><text class="body" x="572" y="120">adjust the desk and</text><text class="body" x="572" y="142">the seating plan</text><circle class="grid" cx="35" cy="230" r="11"/><text class="sh" x="35" y="235" text-anchor="middle">2</text><text class="h" x="75" y="264" text-anchor="middle">maturation</text><text class="body" x="154" y="222">a built-in programme</text><text class="body" x="154" y="244">unfolding with age</text><text class="body" x="354" y="222">puberty arriving on its</text><text class="body" x="354" y="244">own schedule</text><text class="body" x="572" y="222">wait, and prepare the</text><text class="body" x="572" y="244">pupil for it</text><circle class="grid" cx="35" cy="343" r="11"/><text class="sh" x="35" y="348" text-anchor="middle">3</text><text class="h" x="75" y="377" text-anchor="middle">learning</text><text class="body" x="154" y="335">change through experience</text><text class="body" x="154" y="357">and practice</text><text class="body" x="354" y="335">knowing the birds of</text><text class="body" x="354" y="357">the schoolyard</text><text class="body" x="572" y="335">teach it, and check the</text><text class="body" x="572" y="357">teaching worked</text><text class="muted" x="24" y="405">Three named engines, three different classroom responses</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
