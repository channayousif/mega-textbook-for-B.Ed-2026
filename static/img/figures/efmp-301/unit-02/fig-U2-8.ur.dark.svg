<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ عام جماعتی مشاہدات</title><desc id="d">پانچ عام جماعتی مشاہدوں کا جدول، ہر ایک کے ساتھ نشوونمائی قرأت جو اس کی وضاحت کرتی ہے اور ایک موزوں تدریسی جواب۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="550"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="444" rx="8"/><path id="region-header" class="head" d="M752 20 H28 A8 8 0 0 0 20 28 V84 H760 V28 A8 8 0 0 0 752 20 z"/><rect class="band" x="21" y="160" width="738" height="76"/><rect class="band" x="21" y="312" width="738" height="76"/><path class="grid" d="M510 20 V464 M260 20 V464 M760 160 H20 M760 236 H20 M760 312 H20 M760 388 H20"/><path class="rule" d="M760 84 H20"/><rect class="frame" x="20" y="20" width="740" height="444" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="748" y="57.6" text-anchor="end">‏جماعت میں جو دکھتا ہے‏</text><text class="h" x="498" y="57.6" text-anchor="end">‏نشوونمائی مطالعہ‏</text><text class="h" x="248" y="57.6" text-anchor="end">‏موزوں جواب‏</text></g><g id="node-row-copying"><text class="body" x="748" y="126.9" text-anchor="end">‏سمجھے بغیر نقل کرنا‏</text><text class="body" x="498" y="113.9" text-anchor="end">‏کام شاگردوں کی سوچ سے ایک مرحلہ‏</text><text class="body" x="498" y="139.9" text-anchor="end">‏آگے ہے‏</text><text class="body" x="248" y="113.9" text-anchor="end">‏پہلے ٹھوس مواد، پھر تصویریں،‏</text><text class="body" x="248" y="139.9" text-anchor="end">‏پھر علامتیں‏</text></g><g id="node-row-instructions"><text class="body" x="748" y="189.9" text-anchor="end">‏کثیر مرحلہ ہدایتیں راستے میں کھو‏</text><text class="body" x="748" y="215.9" text-anchor="end">‏جاتی ہیں‏</text><text class="body" x="498" y="202.9" text-anchor="end">‏پلٹنے کی صلاحیت ابھی نہیں آئی‏</text><text class="body" x="248" y="189.9" text-anchor="end">‏بورڈ پر گنتی والے مرحلے،‏</text><text class="body" x="248" y="215.9" text-anchor="end">‏بیرونی یاد دہانیاں‏</text></g><g id="node-row-handwriting"><text class="body" x="748" y="278.9" text-anchor="end">‏محنت کے باوجود بڑے ڈگمگائے حروف‏</text><text class="body" x="498" y="265.9" text-anchor="end">‏باریک حرکی کنٹرول ابھی پختہ ہو‏</text><text class="body" x="498" y="291.9" text-anchor="end">‏رہا ہے‏</text><text class="body" x="248" y="278.9" text-anchor="end">‏چوڑی لکیریں، بڑے خانے، صبر‏</text></g><g id="node-row-shouting"><text class="body" x="748" y="354.9" text-anchor="end">‏گروپ کام میں مایوسی پر چیخنا‏</text><text class="body" x="498" y="354.9" text-anchor="end">‏جذباتی ضبط ابھی بن رہا ہے‏</text><text class="body" x="248" y="341.9" text-anchor="end">‏گروپ میں ذمہ داری، نامزد حکمت‏</text><text class="body" x="248" y="367.9" text-anchor="end">‏عملی، وقت‏</text></g><g id="node-row-alone"><text class="body" x="748" y="430.9" text-anchor="end">‏وقفے میں ہمیشہ اکیلا شاگرد‏</text><text class="body" x="498" y="430.9" text-anchor="end">‏ہم عمر گروہ کے نقشے میں خلا ہے‏</text><text class="body" x="248" y="417.9" text-anchor="end">‏ترتیب شدہ جوڑی، سوچے سمجھے‏</text><text class="body" x="248" y="443.9" text-anchor="end">‏کردار‏</text></g></g><g id="layer-labels"><g id="label-caption"><text class="sh" x="760" y="490" text-anchor="end">‏مشاہدہ کریں، پڑھیں، جواب دیں:‏</text><text class="small" x="760" y="516" text-anchor="end">‏کام کو شاگرد کے اگلے مرحلے سے ملائیں۔‏</text></g><text aria-hidden="true" class="wm" x="12" y="540" text-anchor="start">textbook.com.pk</text></g></svg>
