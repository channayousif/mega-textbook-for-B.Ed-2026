<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ عام جماعتی مشاہدات</title><desc id="d">پانچ عام جماعتی مشاہدات کا جدول، ہر ایک کے ساتھ نشوونمائی مطالعہ جو اس کی وضاحت کرتا ہے اور موزوں تدریسی جواب۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:13px;fill:var(--ink)}.h{font-size:13.5px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="12" y="18" width="756" height="62" fill="var(--panel)"/><rect class="grid" x="12" y="18" width="756" height="392"/><path class="grid" d="M264 18V410M516 18V410M12 80H768M12 146H768M12 212H768M12 278H768M12 344H768"/><text class="h ink" x="642" y="56" text-anchor="middle">جماعت میں جو دکھتا ہے</text><text class="h ink" x="390" y="56" text-anchor="middle">نشوونمائی مطالعہ</text><text class="h ink" x="138" y="56" text-anchor="middle">موزوں جواب</text><text class="body" x="756" y="106" text-anchor="end">سمجھے بغیر نقل کرنا</text><text class="body" x="504" y="98" text-anchor="end">کام شاگردوں کی سوچ سے</text><text class="body" x="504" y="116" text-anchor="end">ایک مرحلہ آگے ہے</text><text class="body" x="252" y="98" text-anchor="end">پہلے ٹھوس مواد، پھر تصویریں،</text><text class="body" x="252" y="116" text-anchor="end">پھر علامتیں</text><text class="body" x="756" y="169" text-anchor="end">کثیر مرحلہ ہدایتیں راستے میں کھو جاتی ہیں</text><text class="body" x="504" y="164" text-anchor="end">پلٹنے کی صلاحیت ابھی نہیں آئی</text><text class="body" x="252" y="164" text-anchor="end">بورڈ پر گنتی والے مرحلے،</text><text class="body" x="252" y="182" text-anchor="end">بیرونی یاد دہانیاں</text><text class="body" x="756" y="230" text-anchor="end">محنت کے باوجود بڑے ڈگمگائے حروف</text><text class="body" x="504" y="230" text-anchor="end">باریک حرکی کنٹرول ابھی پختہ ہو رہا ہے</text><text class="body" x="252" y="230" text-anchor="end">چوڑی لکیریں، بڑے خانے،</text><text class="body" x="252" y="248" text-anchor="end">صبر</text><text class="body" x="756" y="296" text-anchor="end">گروپ کام میں مایوسی پر چیخنا</text><text class="body" x="504" y="296" text-anchor="end">جذباتی ضبط ابھی بن رہا ہے</text><text class="body" x="252" y="296" text-anchor="end">گروپ میں ذمہ داری، نامزد</text><text class="body" x="252" y="314" text-anchor="end">حکمت عملی، وقت</text><text class="body" x="756" y="362" text-anchor="end">وقفے میں ہمیشہ اکیلا شاگرد</text><text class="body" x="504" y="362" text-anchor="end">ہم عمر گروہ کے نقشے میں خلا ہے</text><text class="body" x="252" y="362" text-anchor="end">ترتیب شدہ جوڑی، سوچے سمجھے کردار</text><text class="sh" x="768" y="440" text-anchor="end">مشاہدہ کریں، پڑھیں، جواب دیں</text><text class="small muted" x="592" y="440" text-anchor="end">کام کو شاگرد کے اگلے مرحلے سے ملائیں۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
