<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A left-to-right timeline of four developmental stage bands</title><desc id="d">A left-to-right timeline of four developmental stage bands from early primary to later adolescence, each naming how thinking works at that band and what teaching suits it, with a caption noting that ages are approximate but the order is not.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="450"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="20" y1="360" x2="766" y2="360" marker-end="url(#arrow)"/><path class="stroke" d="M20 352v16M200 352v16M390 352v16M580 352v16M760 352v16"/><path class="grid" d="M105 320V352M295 320V352M485 320V352M675 320V352"/></g><g id="layer-nodes"><g id="node-early-primary"><rect class="panel" x="20" y="20" width="170" height="300" rx="10"/><text class="h" x="34" y="50">early</text><text class="h" x="34" y="70">primary</text><text class="small" x="34" y="88">about 5-7</text><path class="grid" d="M34 102H176"/><text class="sh" x="34" y="124">thinking</text><text class="body" x="34" y="142">led by how things</text><text class="body" x="34" y="160">look and feel</text><text class="sh" x="34" y="206">teaching</text><text class="body" x="34" y="224">real objects and</text><text class="body" x="34" y="242">pictures</text></g><g id="node-middle-primary"><rect class="panel" x="210" y="20" width="170" height="300" rx="10"/><text class="h" x="224" y="50">middle</text><text class="h" x="224" y="70">primary</text><text class="small" x="224" y="88">about 7-11</text><path class="grid" d="M224 102H366"/><text class="sh" x="224" y="124">thinking</text><text class="body" x="224" y="142">rules held over</text><text class="body" x="224" y="160">concrete objects</text><text class="sh" x="224" y="206">teaching</text><text class="body" x="224" y="224">materials,</text><text class="body" x="224" y="242">experiments, steps</text><text class="body" x="224" y="260">that can be reversed</text></g><g id="node-early-adolescence"><rect class="panel" x="400" y="20" width="170" height="300" rx="10"/><text class="h" x="414" y="50">early</text><text class="h" x="414" y="70">adolescence</text><text class="small" x="414" y="88">about 11-14</text><path class="grid" d="M414 102H556"/><text class="sh" x="414" y="124">thinking</text><text class="body" x="414" y="142">reasoning about</text><text class="body" x="414" y="160">possibilities begins</text><text class="sh" x="414" y="206">teaching</text><text class="body" x="414" y="224">real problems,</text><text class="body" x="414" y="242">counter-examples,</text><text class="body" x="414" y="260">debate</text></g><g id="node-later-adolescence"><rect class="panel" x="590" y="20" width="170" height="300" rx="10"/><text class="h" x="604" y="50">later</text><text class="h" x="604" y="70">adolescence</text><text class="small" x="604" y="88">about 14-16</text><path class="grid" d="M604 102H746"/><text class="sh" x="604" y="124">thinking</text><text class="body" x="604" y="142">systematic formal</text><text class="body" x="604" y="160">reasoning</text><text class="sh" x="604" y="206">teaching</text><text class="body" x="604" y="224">hypotheses, general</text><text class="body" x="604" y="242">claims to test,</text><text class="body" x="604" y="260">structured argument</text></g></g><g id="layer-labels"><g id="label-ages"><text class="small" x="20" y="386">5</text><text class="small" x="200" y="386" text-anchor="middle">7</text><text class="small" x="390" y="386" text-anchor="middle">11</text><text class="small" x="580" y="386" text-anchor="middle">14</text><text class="small" x="760" y="386" text-anchor="end">16</text></g><text id="label-caption" class="small" x="390" y="418" text-anchor="middle">ages approximate; order is not</text><text aria-hidden="true" class="wm" x="768" y="440" text-anchor="end">textbook.com.pk</text></g></svg>
