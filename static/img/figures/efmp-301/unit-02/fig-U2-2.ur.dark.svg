<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کے تین محرکوں کا موازنہ</title><desc id="d">ایک جدول جو نشوونما کے تین محرکوں، نشو، پختگی اور سیکھنے کا موازنہ کرتا ہے: یہ کیا ہے، روزمرہ کی مثال، اور استاد اس کے بارے میں کیا کر سکتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="20" width="756" height="401" rx="8"/><path class="grid" d="M642 20V421M442 20V421M224 20V421M12 82H768M12 195H768M12 308H768"/><path class="ink" d="M12 82H768V86H12z"/><text class="h" x="705" y="53" text-anchor="middle">محرک</text><text class="h" x="542" y="53" text-anchor="middle">یہ کیا ہے</text><text class="h" x="333" y="46" text-anchor="middle">روزمرہ کی</text><text class="h" x="333" y="65" text-anchor="middle">مثال</text><text class="h" x="118" y="46" text-anchor="middle">استاد کیا</text><text class="h" x="118" y="65" text-anchor="middle">کر سکتا ہے</text><circle class="grid" cx="745" cy="117" r="11"/><text class="sh" x="745" y="122" text-anchor="middle">1</text><text class="h" x="705" y="151" text-anchor="middle">نشو</text><text class="body" x="626" y="120" text-anchor="end">جسمانی اضافہ، سینٹی میٹر</text><text class="body" x="626" y="142" text-anchor="end">میں ناپا جانے والا</text><text class="body" x="426" y="120" text-anchor="end">پچھلے سال کے مقابلے میں</text><text class="body" x="426" y="142" text-anchor="end">ایک سر لمبا شاگرد</text><text class="body" x="208" y="120" text-anchor="end">میز اور بیٹھنے کی</text><text class="body" x="208" y="142" text-anchor="end">ترتیب بدلیں</text><circle class="grid" cx="745" cy="230" r="11"/><text class="sh" x="745" y="235" text-anchor="middle">2</text><text class="h" x="705" y="264" text-anchor="middle">پختگی</text><text class="body" x="626" y="222" text-anchor="end">اندرونی پروگرام جو عمر</text><text class="body" x="626" y="244" text-anchor="end">کے ساتھ کھلتا ہے</text><text class="body" x="426" y="222" text-anchor="end">بلوغت اپنے وقت پر</text><text class="body" x="426" y="244" text-anchor="end">آنے والی</text><text class="body" x="208" y="222" text-anchor="end">انتظار کریں، اور شاگرد کو</text><text class="body" x="208" y="244" text-anchor="end">اس کی تیاری کرائیں</text><circle class="grid" cx="745" cy="343" r="11"/><text class="sh" x="745" y="348" text-anchor="middle">3</text><text class="h" x="705" y="377" text-anchor="middle">سیکھنا</text><text class="body" x="626" y="335" text-anchor="end">تجربے اور مشق سے تبدیلی</text><text class="body" x="626" y="357" text-anchor="end">&nbsp;</text><text class="body" x="426" y="335" text-anchor="end">اسکول کے صحن کے</text><text class="body" x="426" y="357" text-anchor="end">پرندے پہچاننا</text><text class="body" x="208" y="335" text-anchor="end">سکھائیں، اور جانچیں کہ</text><text class="body" x="208" y="357" text-anchor="end">سکھانا کارگر ہوا</text><text class="muted" x="756" y="405" text-anchor="end">تین نامزد محرک، جماعت کے تین مختلف جواب</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
