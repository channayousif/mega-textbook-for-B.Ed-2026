<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نشوونما کے تین محرکوں کا موازنہ</title><desc id="d">نشوونما کے تین محرکوں کا جدول: نشو، پختگی اور تعلم، ہر ایک کے ساتھ یہ کہ وہ کیا ہے، روزمرہ کی مثال، اور استاد کیا کر سکتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="296" rx="8"/><path id="region-header" class="head" d="M752 20 H28 A8 8 0 0 0 20 28 V84 H760 V28 A8 8 0 0 0 752 20 z"/><rect class="band" x="21" y="162" width="738" height="76"/><path class="grid" d="M620 20 V316 M420 20 V316 M220 20 V316 M760 162 H20 M760 238 H20"/><path class="rule" d="M760 84 H20"/><rect class="frame" x="20" y="20" width="740" height="296" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="748" y="57.6" text-anchor="end">‏محرک‏</text><text class="h" x="608" y="57.6" text-anchor="end">‏یہ کیا ہے‏</text><text class="h" x="408" y="57.6" text-anchor="end">‏روزمرہ کی مثال‏</text><text class="h" x="208" y="57.6" text-anchor="end">‏استاد کیا کر سکتا ہے‏</text></g><g id="node-row-growth"><circle class="panel-a" cx="737" cy="123" r="11"/><text class="sh" x="737" y="128" text-anchor="middle">1</text><text class="sh" x="718" y="128.2" text-anchor="end">‏نشو‏</text><text class="body" x="608" y="114.9" text-anchor="end">‏جسمانی اضافہ، سینٹی میٹر‏</text><text class="body" x="608" y="140.9" text-anchor="end">‏میں ناپا جانے والا‏</text><text class="body" x="408" y="114.9" text-anchor="end">‏پچھلے سال کے مقابلے میں‏</text><text class="body" x="408" y="140.9" text-anchor="end">‏ایک سر لمبا شاگرد‏</text><text class="body" x="208" y="114.9" text-anchor="end">‏میز اور بیٹھنے کی ترتیب‏</text><text class="body" x="208" y="140.9" text-anchor="end">‏بدلیں‏</text></g><g id="node-row-maturation"><circle class="panel-a" cx="737" cy="200" r="11"/><text class="sh" x="737" y="205" text-anchor="middle">2</text><text class="sh" x="718" y="205.2" text-anchor="end">‏پختگی‏</text><text class="body" x="608" y="191.9" text-anchor="end">‏اندرونی پروگرام جو عمر کے‏</text><text class="body" x="608" y="217.9" text-anchor="end">‏ساتھ کھلتا ہے‏</text><text class="body" x="408" y="191.9" text-anchor="end">‏بلوغت اپنے وقت پر آنے‏</text><text class="body" x="408" y="217.9" text-anchor="end">‏والی‏</text><text class="body" x="208" y="191.9" text-anchor="end">‏انتظار کریں، اور شاگرد کو‏</text><text class="body" x="208" y="217.9" text-anchor="end">‏اس کی تیاری کرائیں‏</text></g><g id="node-row-learning"><circle class="panel-a" cx="737" cy="277" r="11"/><text class="sh" x="737" y="282" text-anchor="middle">3</text><text class="sh" x="718" y="282.2" text-anchor="end">‏سیکھنا‏</text><text class="body" x="608" y="281.9" text-anchor="end">‏تجربے اور مشق سے تبدیلی‏</text><text class="body" x="408" y="268.9" text-anchor="end">‏اسکول کے صحن کے پرندے‏</text><text class="body" x="408" y="294.9" text-anchor="end">‏پہچاننا‏</text><text class="body" x="208" y="268.9" text-anchor="end">‏سکھائیں، اور جانچیں کہ‏</text><text class="body" x="208" y="294.9" text-anchor="end">‏سکھانا کارگر ہوا‏</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="760" y="342" text-anchor="end">‏تین نامزد محرک، جماعت کے تین مختلف جواب‏</text><text aria-hidden="true" class="wm" x="12" y="370" text-anchor="start">textbook.com.pk</text></g></svg>
