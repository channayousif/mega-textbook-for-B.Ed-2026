<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A growth curve of height by age</title><desc id="d">A growth curve of height by age showing two steep phases in early childhood and adolescence, with a steady plateau between them, and two bands noting that gross motor skills mature before fine motor skills.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.yes{fill:var(--ink)}.no{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.curve{stroke-width:5}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><text class="h ink" x="92" y="32">Height increases at different speeds</text><line class="stroke" x1="92" y1="244" x2="92" y2="58" marker-end="url(#arrow)"/><line class="stroke" x1="92" y1="244" x2="710" y2="244" marker-end="url(#arrow)"/><text class="sh ink" x="28" y="71">height</text><text class="sh ink" x="690" y="268">age</text><g class="grid"><line x1="120" y1="244" x2="120" y2="76"/><line x1="260" y1="244" x2="260" y2="76"/><line x1="400" y1="244" x2="400" y2="76"/><line x1="610" y1="244" x2="610" y2="76"/><line x1="680" y1="244" x2="680" y2="76"/><line x1="92" y1="196" x2="700" y2="196"/><line x1="92" y1="148" x2="700" y2="148"/><line x1="92" y1="100" x2="700" y2="100"/></g><path class="stroke-a curve" d="M120 230 C154 215 198 171 260 154 C304 148 350 146 400 141 C447 127 526 80 610 55 C638 47 661 40 680 34"/><g class="small muted" text-anchor="middle"><text x="120" y="263">2</text><text x="260" y="263">6</text><text x="400" y="263">10</text><text x="610" y="263">16</text><text x="680" y="263">18</text></g><path class="stroke" d="M120 276 v10 h140 v-10"/><text class="sh" x="190" y="306" text-anchor="middle">first steep phase</text><text class="small muted" x="190" y="322" text-anchor="middle">early childhood, ages 2 to 6</text><path class="grid" stroke-dasharray="5 5" d="M260 286 H400"/><text class="sh" x="330" y="306" text-anchor="middle">school years: steady but slow</text><path class="stroke" d="M400 276 v10 h210 v-10"/><text class="sh" x="505" y="306" text-anchor="middle">second steep phase (puberty)</text><text class="small muted" x="505" y="322" text-anchor="middle">adolescence, ages 10 to 16</text><rect class="panel-a" x="92" y="340" width="610" height="42" rx="5"/><text class="body" x="106" y="358">gross motor skills: running, jumping, catching</text><line class="stroke-a" x1="510" y1="369" x2="588" y2="369" marker-end="url(#arrow-a)"/><text class="small muted" x="598" y="373">matures first</text><rect class="panel-b" x="92" y="396" width="610" height="42" rx="5"/><text class="body" x="106" y="414">fine motor skills: writing, threading, using scissors</text><line class="stroke" x1="510" y1="425" x2="646" y2="425" marker-end="url(#arrow)"/><text class="small muted" x="656" y="429">matures later</text><text class="small muted" x="92" y="457">Arrows show the later timing of fine-motor control.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
