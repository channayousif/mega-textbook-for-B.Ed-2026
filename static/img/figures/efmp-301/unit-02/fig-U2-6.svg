<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing the four developmental domains</title><desc id="d">A table comparing the four developmental domains - cognitive, emotional, social and physical - on what grows, a typical Class 2 versus Class 6 difference, and one classroom sign of each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="14" y="20" width="752" height="58" rx="5"/><rect class="grid" x="14" y="20" width="752" height="406" rx="5"/><line class="grid" x1="135" y1="20" x2="135" y2="426"/><line class="grid" x1="285" y1="20" x2="285" y2="426"/><line class="grid" x1="575" y1="20" x2="575" y2="426"/><line class="grid" x1="14" y1="78" x2="766" y2="78"/><line class="grid" x1="14" y1="165" x2="766" y2="165"/><line class="grid" x1="14" y1="252" x2="766" y2="252"/><line class="grid" x1="14" y1="339" x2="766" y2="339"/><rect class="panel-a" x="14" y="78" width="121" height="87" rx="4"/><rect class="panel-b" x="14" y="165" width="121" height="87" rx="4"/><rect class="panel-c" x="14" y="252" width="121" height="87" rx="4"/><rect class="panel-d" x="14" y="339" width="121" height="87" rx="4"/><text class="h ink" x="74" y="54" text-anchor="middle">domain</text><text class="h ink" x="210" y="54" text-anchor="middle">what grows</text><text class="h ink" x="430" y="47" text-anchor="middle">a Class 2 vs</text><text class="h ink" x="430" y="66" text-anchor="middle">Class 6 difference</text><text class="h ink" x="670" y="47" text-anchor="middle">one classroom</text><text class="h ink" x="670" y="66" text-anchor="middle">sign</text><circle class="ink" cx="33" cy="120" r="7"/><text class="sh" x="47" y="116">cognitive</text><text class="small muted" x="47" y="135">thinking</text><text class="body" x="210" y="113" text-anchor="middle">thinking and</text><text class="body" x="210" y="133" text-anchor="middle">memory</text><text class="body" x="430" y="104" text-anchor="middle">certain the tall glass holds more</text><text class="body" x="430" y="124" text-anchor="middle">vs explains the pour rule</text><text class="body" x="670" y="104" text-anchor="middle">multi-step instructions followed</text><text class="body" x="670" y="124" text-anchor="middle">without reminders</text><rect class="ink" x="26" y="201" width="14" height="14" rx="1"/><text class="sh" x="47" y="203">emotional</text><text class="small muted" x="47" y="222">regulation</text><text class="body" x="210" y="200" text-anchor="middle">regulation of</text><text class="body" x="210" y="220" text-anchor="middle">feelings</text><text class="body" x="430" y="200" text-anchor="middle">crying at a wrong answer vs</text><text class="body" x="430" y="220" text-anchor="middle">flushing and trying again</text><text class="body" x="670" y="190" text-anchor="middle">the pupil who laughs in March</text><text class="body" x="670" y="210" text-anchor="middle">at what made them cry</text><text class="body" x="670" y="230" text-anchor="middle">in September</text><path class="ink" d="M33 278l8 14H25z"/><text class="sh" x="47" y="290">social</text><text class="small muted" x="47" y="309">peers and play</text><text class="body" x="210" y="287" text-anchor="middle">relationships,</text><text class="body" x="210" y="307" text-anchor="middle">play, peers</text><text class="body" x="430" y="277" text-anchor="middle">parallel play beside others vs</text><text class="body" x="430" y="297" text-anchor="middle">negotiated games with rules</text><text class="body" x="670" y="287" text-anchor="middle">the seating map of who</text><text class="body" x="670" y="307" text-anchor="middle">works with whom</text><path class="ink" d="M33 365l8 8-8 8-8-8z"/><text class="sh" x="47" y="377">physical</text><text class="small muted" x="47" y="396">recalled from 2.2</text><text class="body" x="210" y="374" text-anchor="middle">body and motor</text><text class="body" x="210" y="394" text-anchor="middle">control</text><text class="body" x="430" y="374" text-anchor="middle">large shaky letters vs</text><text class="body" x="430" y="394" text-anchor="middle">small even letters</text><text class="body" x="670" y="374" text-anchor="middle">the handwriting on the</text><text class="body" x="670" y="394" text-anchor="middle">newest exercise book</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
