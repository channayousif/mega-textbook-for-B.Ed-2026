<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A left-to-right timeline of four developmental stage bands</title><desc id="d">A left-to-right timeline of four developmental stage bands from early primary to later adolescence, each naming how thinking works at that band and what teaching suits it, with a caption noting that ages are approximate but the order is not.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.p1{fill:var(--a1-fill);stroke:var(--a1)}.p2{fill:var(--a2-fill);stroke:var(--a2)}.p3{fill:var(--a3-fill);stroke:var(--a3)}.p4{fill:var(--a4-fill);stroke:var(--a4)}.guide{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah ink"/></marker></defs><rect class="panel p1" x="28" y="40" width="132" height="270" rx="10"/><text class="h" x="94" y="68" text-anchor="middle">EARLY PRIMARY</text><text class="small" x="94" y="86" text-anchor="middle">about 5-7</text><line class="stroke" x1="47" y1="100" x2="141" y2="100"/><text class="sh" x="47" y="123">Thinking</text><text class="body" x="47" y="143">led by how things</text><text class="body" x="47" y="159">look and feel</text><text class="sh" x="47" y="197">Teaching</text><text class="body" x="47" y="217">real objects and</text><text class="body" x="47" y="233">pictures</text><rect class="panel p2" x="160" y="40" width="260" height="270" rx="10"/><text class="h" x="290" y="68" text-anchor="middle">MIDDLE PRIMARY</text><text class="small" x="290" y="86" text-anchor="middle">about 7-11</text><line class="stroke" x1="180" y1="100" x2="400" y2="100"/><text class="sh" x="180" y="123">Thinking</text><text class="body" x="180" y="143">rules held over concrete objects</text><text class="sh" x="180" y="181">Teaching</text><text class="body" x="180" y="201">materials, experiments, steps</text><text class="body" x="180" y="217">that can be reversed</text><rect class="panel p3" x="420" y="40" width="196" height="270" rx="10"/><text class="h" x="518" y="68" text-anchor="middle">EARLY</text><text class="h" x="518" y="85" text-anchor="middle">ADOLESCENCE</text><text class="small" x="518" y="103" text-anchor="middle">about 11-14</text><line class="stroke" x1="440" y1="117" x2="596" y2="117"/><text class="sh" x="440" y="140">Thinking</text><text class="body" x="440" y="160">reasoning about</text><text class="body" x="440" y="176">possibilities begins</text><text class="sh" x="440" y="214">Teaching</text><text class="body" x="440" y="234">real problems,</text><text class="body" x="440" y="250">counter-examples, debate</text><rect class="panel p4" x="616" y="40" width="136" height="270" rx="10"/><text class="h" x="684" y="68" text-anchor="middle">LATER</text><text class="h" x="684" y="85" text-anchor="middle">ADOLESCENCE</text><text class="small" x="684" y="103" text-anchor="middle">about 14-16</text><line class="stroke" x1="635" y1="117" x2="733" y2="117"/><text class="sh" x="635" y="140">Thinking</text><text class="body" x="635" y="160">systematic</text><text class="body" x="635" y="176">formal reasoning</text><text class="sh" x="635" y="202">Teaching</text><text class="body" x="635" y="222">hypotheses,</text><text class="body" x="635" y="238">general claims</text><text class="body" x="635" y="254">to test, structured</text><text class="body" x="635" y="270">argument</text><path class="guide" d="M28 310 V346 M160 310 V346 M420 310 V346 M616 310 V346 M752 310 V346"/><line class="stroke" x1="28" y1="346" x2="752" y2="346" marker-end="url(#arrow)"/><path class="stroke" d="M28 338v16M160 338v16M420 338v16M616 338v16M752 338v16"/><text class="small" x="28" y="376" text-anchor="middle">5</text><text class="small" x="160" y="376" text-anchor="middle">7</text><text class="small" x="420" y="376" text-anchor="middle">11</text><text class="small" x="616" y="376" text-anchor="middle">14</text><text class="small" x="752" y="376" text-anchor="middle">16</text><text class="small muted" x="390" y="408" text-anchor="middle">ages approximate; order is not</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
