<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جسمانی نشوونما کے چار مرحلے</title><desc id="d">ابتدائی بچپن سے بعد کی مراہقت تک جسمانی نشوونما کے چار مراحل کا جدول، ہر مرحلے کی عام تبدیلیاں، جماعت کے لیے اس کا مطلب، اور جو مطلب وہ رکھتا نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="12" y="12" width="756" height="64" class="panel" fill="var(--panel)"/><rect x="12" y="12" width="756" height="420" class="grid"/><path d="M626 12V432M448 12V432M210 12V432M12 76H768M12 165H768M12 254H768M12 343H768"/><text class="h ink" x="756" y="49" text-anchor="end">مرحلہ</text><text class="h" x="610" y="39" text-anchor="end">عام</text><text class="h" x="610" y="59" text-anchor="end">تبدیلیاں</text><text class="h" x="432" y="30" text-anchor="end">جماعت کے لیے</text><text class="h" x="432" y="49" text-anchor="end">کیا مطلب</text><text class="h" x="432" y="68" text-anchor="end">رکھتا ہے</text><text class="h" x="198" y="30" text-anchor="end">یہ کیا مطلب</text><text class="h" x="198" y="49" text-anchor="end">ہرگز نہیں</text><text class="h" x="198" y="68" text-anchor="end">رکھتا</text><text class="sh" x="756" y="103" text-anchor="end">ابتدائی بچپن</text><text class="small muted" x="756" y="123" text-anchor="end">عمر 6 تک</text><text class="body" x="610" y="98" text-anchor="end">تیز ترین تناسبی نشو</text><text class="body" x="610" y="115" text-anchor="end">بڑی حرکی مہارتیں آتی ہیں</text><text class="body" x="610" y="132" text-anchor="end">&nbsp;</text><text class="body" x="432" y="106" text-anchor="end">فرنیچر کا مناسب سائز</text><text class="body" x="432" y="126" text-anchor="end">ریت اور بلاکس</text><text class="body" x="432" y="146" text-anchor="end">حرکت کے وقفے</text><text class="body" x="198" y="116" text-anchor="end">کہ باریک لکھائی</text><text class="body" x="198" y="136" text-anchor="end">لاپرواہی ہے</text><text class="sh" x="756" y="192" text-anchor="end">ابتدائی برس</text><text class="small muted" x="756" y="212" text-anchor="end">6 سے 11</text><text class="body" x="610" y="187" text-anchor="end">مسلسل نشو</text><text class="body" x="610" y="204" text-anchor="end">باریک حرکی کنٹرول پختہ ہونا</text><text class="body" x="610" y="221" text-anchor="end">مستقل دانت</text><text class="body" x="432" y="184" text-anchor="end">پنسل کی پکڑ</text><text class="body" x="432" y="201" text-anchor="end">لکیروں کا فاصلہ</text><text class="body" x="432" y="218" text-anchor="end">دستکاری کے اوزار</text><text class="body" x="432" y="235" text-anchor="end">لکھائی پر صبر</text><text class="body" x="198" y="205" text-anchor="end">کہ عمر سے کم قد</text><text class="body" x="198" y="225" text-anchor="end">کم صلاحیت کا ثبوت ہے</text><text class="sh" x="756" y="281" text-anchor="end">بلوغت</text><text class="small muted" x="756" y="301" text-anchor="end">تقریباً 10 سے 14</text><text class="body" x="610" y="276" text-anchor="end">دوسرا تیز مرحلہ</text><text class="body" x="610" y="293" text-anchor="end">جنسری پختگی</text><text class="body" x="610" y="310" text-anchor="end">لڑکیاں لڑکوں سے پہلے</text><text class="body" x="432" y="273" text-anchor="end">نجیت، لچک</text><text class="body" x="432" y="293" text-anchor="end">جسم پر تبصرے نہیں</text><text class="body" x="432" y="313" text-anchor="end">ٹائم ٹیبل کی سمجھ</text><text class="body" x="198" y="285" text-anchor="end">کہ غیر مستقل مزاجی</text><text class="body" x="198" y="305" text-anchor="end">سرکشی ہے</text><text class="sh" x="756" y="370" text-anchor="end">بعد کی مراہقت</text><text class="small muted" x="756" y="390" text-anchor="end">14 سے 18</text><text class="body" x="610" y="365" text-anchor="end">بالغ قد قریب</text><text class="body" x="610" y="382" text-anchor="end">طاقت اور برداشت بڑھتی ہے</text><text class="body" x="610" y="399" text-anchor="end">&nbsp;</text><text class="body" x="432" y="362" text-anchor="end">سنجیدہ کھیل</text><text class="body" x="432" y="382" text-anchor="end">لیب کا کام</text><text class="body" x="432" y="402" text-anchor="end">ذمہ داریاں</text><text class="body" x="198" y="374" text-anchor="end">کہ بالغ شکل بالغ</text><text class="body" x="198" y="394" text-anchor="end">سوچ کی ضمانت ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
