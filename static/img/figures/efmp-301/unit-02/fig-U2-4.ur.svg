<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جسمانی نشوونما کے چار مرحلے</title><desc id="d">جسمانی نشوونما کے چار مراحل کا جدول: ابتدائی بچپن سے بعد کی مراہقت تک، ہر مرحلے کی عام تبدیلیاں، جماعت کے لیے اس کا مطلب، اور جو مطلب وہ رکھتا نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="570"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="514" rx="8"/><path id="region-header" class="head" d="M752 20 H28 A8 8 0 0 0 20 28 V100 H760 V28 A8 8 0 0 0 752 20 z"/><rect class="band" x="21" y="202" width="738" height="128"/><rect class="band" x="21" y="432" width="738" height="102"/><path class="grid" d="M620 20 V534 M400 20 V534 M190 20 V534 M760 202 H20 M760 330 H20 M760 432 H20"/><path class="rule" d="M760 100 H20"/><rect class="frame" x="20" y="20" width="740" height="514" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="748" y="65.6" text-anchor="end">‏مرحلہ‏</text><text class="h" x="608" y="65.6" text-anchor="end">‏عام تبدیلیاں‏</text><text class="h" x="388" y="51.6" text-anchor="end">‏جماعت کے لیے کیا مطلب‏</text><text class="h" x="388" y="79.6" text-anchor="end">‏رکھتا ہے‏</text><text class="h" x="178" y="51.6" text-anchor="end">‏یہ کیا مطلب ہرگز‏</text><text class="h" x="178" y="79.6" text-anchor="end">‏نہیں رکھتا‏</text></g><g id="node-row-early-childhood"><text class="sh" x="748" y="144.2" text-anchor="end">‏ابتدائی بچپن‏</text><text class="small" x="748" y="168.8" text-anchor="end">‏عمر ⁦6⁩ تک‏</text><text class="body" x="608" y="142.9" text-anchor="end">‏تیز ترین تناسبی نشو‏</text><text class="body" x="608" y="168.9" text-anchor="end">‏بڑی حرکی مہارتیں آتی ہیں‏</text><text class="body" x="388" y="129.9" text-anchor="end">‏فرنیچر کا مناسب سائز‏</text><text class="body" x="388" y="155.9" text-anchor="end">‏ریت اور بلاکس‏</text><text class="body" x="388" y="181.9" text-anchor="end">‏حرکت کے وقفے‏</text><text class="body" x="178" y="142.9" text-anchor="end">‏کہ باریک لکھائی‏</text><text class="body" x="178" y="168.9" text-anchor="end">‏لاپرواہی ہے‏</text></g><g id="node-row-primary-years"><text class="sh" x="748" y="259.2" text-anchor="end">‏ابتدائی برس‏</text><text class="small" x="748" y="283.8" text-anchor="end">‏⁦6⁩ سے ⁦11⁩‏</text><text class="body" x="608" y="244.9" text-anchor="end">‏مسلسل نشو‏</text><text class="body" x="608" y="270.9" text-anchor="end">‏باریک حرکی کنٹرول پختہ ہونا‏</text><text class="body" x="608" y="296.9" text-anchor="end">‏مستقل دانت‏</text><text class="body" x="388" y="231.9" text-anchor="end">‏پنسل کی پکڑ‏</text><text class="body" x="388" y="257.9" text-anchor="end">‏لکیروں کا فاصلہ‏</text><text class="body" x="388" y="283.9" text-anchor="end">‏دستکاری کے اوزار‏</text><text class="body" x="388" y="309.9" text-anchor="end">‏لکھائی پر صبر‏</text><text class="body" x="178" y="257.9" text-anchor="end">‏کہ عمر سے کم قد کم‏</text><text class="body" x="178" y="283.9" text-anchor="end">‏صلاحیت کا ثبوت ہے‏</text></g><g id="node-row-puberty"><text class="sh" x="748" y="374.2" text-anchor="end">‏بلوغت‏</text><text class="small" x="748" y="398.8" text-anchor="end">‏تقریباً ⁦10⁩ سے ⁦14⁩‏</text><text class="body" x="608" y="359.9" text-anchor="end">‏دوسرا تیز مرحلہ‏</text><text class="body" x="608" y="385.9" text-anchor="end">‏جنسری پختگی‏</text><text class="body" x="608" y="411.9" text-anchor="end">‏لڑکیاں لڑکوں سے پہلے‏</text><text class="body" x="388" y="359.9" text-anchor="end">‏نجیت، لچک‏</text><text class="body" x="388" y="385.9" text-anchor="end">‏جسم پر تبصرے نہیں‏</text><text class="body" x="388" y="411.9" text-anchor="end">‏ٹائم ٹیبل کی سمجھ‏</text><text class="body" x="178" y="372.9" text-anchor="end">‏کہ غیر مستقل مزاجی‏</text><text class="body" x="178" y="398.9" text-anchor="end">‏سرکشی ہے‏</text></g><g id="node-row-later-adolescence"><text class="sh" x="748" y="476.2" text-anchor="end">‏بعد کی مراہقت‏</text><text class="small" x="748" y="500.8" text-anchor="end">‏⁦14⁩ سے ⁦18⁩‏</text><text class="body" x="608" y="474.9" text-anchor="end">‏بالغ قد قریب‏</text><text class="body" x="608" y="500.9" text-anchor="end">‏طاقت اور برداشت بڑھتی ہے‏</text><text class="body" x="388" y="461.9" text-anchor="end">‏سنجیدہ کھیل‏</text><text class="body" x="388" y="487.9" text-anchor="end">‏لیب کا کام‏</text><text class="body" x="388" y="513.9" text-anchor="end">‏ذمہ داریاں‏</text><text class="body" x="178" y="474.9" text-anchor="end">‏کہ بالغ شکل بالغ سوچ‏</text><text class="body" x="178" y="500.9" text-anchor="end">‏کی ضمانت ہے‏</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y=