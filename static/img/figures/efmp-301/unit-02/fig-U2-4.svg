<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four phases of physical development</title><desc id="d">A table of four phases of physical development from early childhood to later adolescence, each with its typical changes, what the phase means for the classroom, and what it does not mean.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--a2);stroke-width:2;fill:none;stroke-dasharray:7 5}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.band{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-b{fill:var(--a2)}</style><rect class="bg" x="0" y="0" width="780" height="570"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="514" rx="8"/><path id="region-header" class="head" d="M28 20H752A8 8 0 0 1 760 28V100H20V28A8 8 0 0 1 28 20z"/><rect class="band" x="21" y="202" width="738" height="128"/><rect class="band" x="21" y="432" width="738" height="102"/><path class="grid" d="M160 20V534M380 20V534M590 20V534M20 202H760M20 330H760M20 432H760"/><path class="rule" d="M20 100H760"/><rect class="frame" x="20" y="20" width="740" height="514" rx="8" fill-opacity="0"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="32" y="65.6">phase</text><text class="h" x="172" y="65.6">typical changes</text><text class="h" x="392" y="55.6">what it means for</text><text class="h" x="392" y="75.6">the classroom</text><text class="h" x="602" y="55.6">what it does</text><text class="h" x="602" y="75.6">NOT mean</text></g><g id="node-row-early-childhood"><text class="sh" x="32" y="137.1">early</text><text class="sh" x="32" y="155.1">childhood</text><text class="small" x="32" y="172.4">to age 6</text><text class="body" x="172" y="146.9">fastest proportional growth,</text><text class="body" x="172" y="164.9">gross motor skills arriving</text><text class="body" x="392" y="137.9">furniture scale,</text><text class="body" x="392" y="155.9">sand and blocks,</text><text class="body" x="392" y="173.9">movement breaks</text><text class="body" x="602" y="146.9">that fine writing</text><text class="body" x="602" y="164.9">is carelessness</text></g><g id="node-row-primary-years"><text class="sh" x="32" y="261.1">primary years</text><text class="small" x="32" y="278.4">6 to 11</text><text class="body" x="172" y="252.9">steady growth,</text><text class="body" x="172" y="270.9">fine motor control maturing,</text><text class="body" x="172" y="288.9">permanent teeth</text><text class="body" x="392" y="252.9">pencil grips, line spacing,</text><text class="body" x="392" y="270.9">craft tools,</text><text class="body" x="392" y="288.9">patience with handwriting</text><text class="body" x="602" y="261.9">that small-for-age</text><text class="body" x="602" y="279.9">means less able</text></g><g id="node-row-puberty"><text class="sh" x="32" y="376.1">puberty</text><text class="small" x="32" y="393.4">about 10 to 14</text><text class="body" x="172" y="367.9">second steep phase,</text><text class="body" x="172" y="385.9">sexual maturation,</text><text class="body" x="172" y="403.9">girls earlier than boys</text><text class="body" x="392" y="367.9">privacy, flexibility,</text><text class="body" x="392" y="385.9">no body comments,</text><text class="body" x="392" y="403.9">timetable sense</text><text class="body" x="602" y="376.9">that inconsistency</text><text class="body" x="602" y="394.9">is defiance</text></g><g id="node-row-later-adolescence"><text class="sh" x="32" y="469.1">later</text><text class="sh" x="32" y="487.1">adolescence</text><text class="small" x="32" y="504.4">14 to 18</text><text class="body" x="172" y="478.9">adult height approached,</text><text class="body" x="172" y="496.9">strength and endurance rising</text><text class="body" x="392" y="469.9">serious sport, lab work,</text><text class="body" x="392" y="487.9">load-bearing</text><text class="body" x="392" y="505.9">responsibilities</text><text class="body" x="602" y="469.9">that adult</text><text class="body" x="602" y="487.9">appearance means</text><text class="body" x="602" y="505.9">adult judgement</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="560" text-anchor="end">textbook.com.pk</text></g></svg>
