<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">رہنمائی بمقابلہ مشاورت</title><desc id="d">رہنمائی اور مشاورت کا موازنہ کرنے والا جدول: مقصد، مرکزی آلہ، اور کس کا کام ہر ایک ہے، استاد کا حصہ پہلی صف اور رجوع کے طور پر نام لیا گیا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><rect id="region-table" class="panel" x="12" y="14" width="756" height="408" rx="8"/><rect id="region-header" class="panel-a" x="12" y="14" width="756" height="60"/><path id="region-grid" class="grid" d="M628 14 V422 M320 14 V422 M768 190 H12 M768 306 H12"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-guidance"><text class="h" x="474" y="49" text-anchor="middle">‏رہنمائی‏</text></g><g id="node-head-counseling"><text class="h" x="166" y="49" text-anchor="middle">‏مشاورت‏</text></g><g id="node-aim-label"><text class="sh" x="698" y="137" text-anchor="middle">‏مقصد‏</text></g><g id="node-aim-guidance"><text class="body" x="616" y="127" text-anchor="end">‏رخ: اختیارات دیکھنا‏</text><text class="body" x="616" y="147" text-anchor="end">‏اور راستہ چنا‏</text></g><g id="node-aim-counseling"><text class="body" x="308" y="127" text-anchor="end">‏فہم: وہ چیز چھانٹنا‏</text><text class="body" x="308" y="147" text-anchor="end">‏جس تک معلومات نہیں پہنچتیں‏</text></g><g id="node-tool-label"><text class="sh" x="698" y="253" text-anchor="middle">‏بنیادی آلہ‏</text></g><g id="node-tool-guidance"><text class="body" x="616" y="243" text-anchor="end">‏درست معلومات، اس وقت‏</text><text class="body" x="616" y="263" text-anchor="end">‏جب انتخاب کھلا ہو‏</text></g><g id="node-tool-counseling"><text class="body" x="308" y="243" text-anchor="end">‏مہارت والا رشتہ: سننا،‏</text><text class="body" x="308" y="263" text-anchor="end">‏کھلتے سوال، رازداری‏</text></g><g id="node-whose-label"><text class="sh" x="698" y="359" text-anchor="middle">‏کام کس‏</text><text class="sh" x="698" y="379" text-anchor="middle">‏کا ہے‏</text></g><g id="node-whose-guidance"><text class="body" x="616" y="359" text-anchor="end">‏ایسا پروگرام جو کوئی‏</text><text class="body" x="616" y="379" text-anchor="end">‏تربیت یافتہ استاد چلا سکے‏</text></g><g id="node-whose-counseling"><text class="body" x="308" y="359" text-anchor="end">‏تربیت یافتہ مشیر؛ استاد صرف‏</text><text class="body" x="308" y="379" text-anchor="end">‏پہلی صف اور حوالہ سنبھالتا ہے‏</text></g></g><g id="layer-labels"><text id="label-caption-1" class="small" x="390" y="450" text-anchor="middle">‏دونوں اسکول میں ایک پروگرام ہیں؛‏</text><text id="label-caption-2" class="small" x="390" y="470" text-anchor="middle">‏استاد ہر ایک کی پہلی صف سنبھالتا ہے اور تیسرا حوالہ دیتا ہے۔‏</text></g><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>