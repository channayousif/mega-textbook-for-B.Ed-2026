<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">رہنمائی بمقابلہ مشاورت</title><desc id="d">رہنمائی اور مشاورت کا جدول: مقصد، بنیادی آلہ، اور کام کس کا ہے، استاد کا حصہ پہلی صف اور حوالہ بتاتے ہوئے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 648 14V426M436 14V426M12 74H768M12 190H768M12 306H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="708" y="48" text-anchor="middle"></text><text class="h" x="496" y="48" text-anchor="middle">رہنمائی</text><text class="h" x="178" y="48" text-anchor="middle">مشاورت</text><text class="sh" x="708" y="112" text-anchor="middle">مقصد</text><text class="body" x="636" y="102">رخ: اختیارات دیکھنا</text><text class="body" x="636" y="122">اور راستہ چنا</text><text class="body" x="332" y="102">فہم: وہ چیز چھانٹنا</text><text class="body" x="332" y="122">جس تک معلومات نہیں پہنچتیں</text><text class="sh" x="708" y="228" text-anchor="middle">بنیادی آلہ</text><text class="body" x="636" y="218">درست معلومات، اس وقت</text><text class="body" x="636" y="238">جب انتخاب کھلا ہو</text><text class="body" x="332" y="218">مہارت والا رشتہ: سننا،</text><text class="body" x="332" y="238">کھلتے سوال، رازداری</text><text class="sh" x="708" y="344" text-anchor="middle">کام کس</text><text class="sh" x="708" y="362" text-anchor="middle">کا ہے</text><text class="body" x="636" y="334">ایسا پروگرام جو کوئی</text><text class="body" x="636" y="354">تربیت یافتہ استاد چلا سکے</text><text class="body" x="332" y="334">تربیت یافتہ کاؤنسلر؛ استاد صرف</text><text class="body" x="332" y="354">پہلی صف اور حوالہ سنبھالتا ہے</text><text class="small" x="390" y="412" text-anchor="middle">دونوں اسکول میں ایک پروگرام ہیں؛ استاد ہر ایک کی پہلی صف سنبھالتا ہے اور تیسرا حوالہ دیتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
