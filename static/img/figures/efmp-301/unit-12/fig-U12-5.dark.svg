<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of the whole course</title><desc id="d">A concept map of the whole course with six branches: the learner and development, learning theories, the mind's work, difference motivation and the room, evidence and decisions, and well-being and the profession - each with its headline idea.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-course-learner" class="stroke" d="M340 215 C320 160 310 120 280 120"/><path id="edge-course-theories" class="stroke" d="M440 215 C460 160 470 120 500 120"/><line id="edge-course-mind" class="stroke" x1="320" y1="250" x2="280" y2="250"/><line id="edge-course-difference" class="stroke" x1="460" y1="250" x2="500" y2="250"/><path id="edge-course-evidence" class="stroke" d="M340 285 C320 340 310 380 280 380"/><path id="edge-course-wellbeing" class="stroke" d="M440 285 C460 340 470 380 500 380"/></g><g id="layer-nodes"><g id="node-course"><ellipse class="panel-a" cx="390" cy="250" rx="70" ry="50"/><text class="sh" x="390" y="245" text-anchor="middle">the course</text><text class="sh" x="390" y="267" text-anchor="middle">whole</text></g><g id="node-learner"><rect class="panel" x="10" y="70" width="270" height="100" rx="10"/><text class="bt" x="145" y="96" text-anchor="middle">the learner, development</text><text class="body" x="145" y="120" text-anchor="middle">where is this pupil, and what</text><text class="body" x="145" y="140" text-anchor="middle">is the next step (Units 1-2)</text></g><g id="node-theories"><rect class="panel" x="500" y="70" width="270" height="100" rx="10"/><text class="bt" x="635" y="96" text-anchor="middle">learning theories</text><text class="body" x="635" y="120" text-anchor="middle">behaviour, cognition, observation,</text><text class="body" x="635" y="140" text-anchor="middle">construction (Unit 3)</text></g><g id="node-mind"><rect class="panel" x="10" y="200" width="270" height="100" rx="10"/><text class="bt" x="145" y="226" text-anchor="middle">the mind's work</text><text class="body" x="145" y="250" text-anchor="middle">attention, memory, thinking</text><text class="body" x="145" y="270" text-anchor="middle">(Unit 4)</text></g><g id="node-difference"><rect class="panel" x="500" y="200" width="270" height="100" rx="10"/><text class="bt" x="635" y="226" text-anchor="middle">difference, motivation, the room</text><text class="body" x="635" y="250" text-anchor="middle">profiles, needs, environments</text><text class="body" x="635" y="270" text-anchor="middle">(Units 5-8)</text></g><g id="node-evidence"><rect class="panel" x="10" y="330" width="270" height="100" rx="10"/><text class="bt" x="145" y="356" text-anchor="middle">evidence and decisions</text><text class="body" x="145" y="380" text-anchor="middle">assessment for decisions,</text><text class="body" x="145" y="400" text-anchor="middle">design backward (Units 9-10)</text></g><g id="node-wellbeing"><rect class="panel" x="500" y="330" width="270" height="100" rx="10"/><text class="bt" x="635" y="356" text-anchor="middle">well-being, the profession</text><text class="body" x="635" y="380" text-anchor="middle">the balance, the referral,</text><text class="body" x="635" y="400" text-anchor="middle">the duties (Units 11-12)</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="40" text-anchor="middle">The course whole: six clusters, one question</text><text id="label-caption" class="small" x="390" y="466" text-anchor="middle">Sixteen weeks, one question: why does this pupil bother, and what will help?</text></g><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>