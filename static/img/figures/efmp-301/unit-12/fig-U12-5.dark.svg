<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of the whole course</title><desc id="d">A concept map of the whole course with six branches: the learner and development, learning theories, the mind's work, difference motivation and the room, evidence and decisions, and well-being and the profession - each with its headline idea.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle">The course whole: six clusters, one question</text><ellipse class="ink" cx="390" cy="240" rx="110" ry="48" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">the course</text><text x="390" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">whole</text><g class="stroke"><path d="M300 215 L170 150"/><path d="M480 215 L610 150"/><path d="M290 250 L170 250"/><path d="M490 250 L610 250"/><path d="M300 270 L170 350"/><path d="M480 270 L610 350"/></g><rect class="panel" x="40" y="90" width="220" height="66" rx="8"/><text class="sh" x="150" y="112" text-anchor="middle">the learner, development</text><text class="body" x="150" y="132" text-anchor="middle" font-size="11.5">where is this pupil, and what</text><text class="body" x="150" y="148" text-anchor="middle" font-size="11.5">is the next step (Units 1-2)</text><rect class="panel" x="520" y="90" width="220" height="66" rx="8"/><text class="sh" x="630" y="112" text-anchor="middle">learning theories</text><text class="body" x="630" y="132" text-anchor="middle" font-size="11.5">behaviour, cognition, observation,</text><text class="body" x="630" y="148" text-anchor="middle" font-size="11.5">construction (Unit 3)</text><rect class="panel" x="40" y="216" width="220" height="66" rx="8"/><text class="sh" x="150" y="238" text-anchor="middle">the mind's work</text><text class="body" x="150" y="258" text-anchor="middle" font-size="11.5">attention, memory, thinking</text><text class="body" x="150" y="274" text-anchor="middle" font-size="11.5">(Unit 4)</text><rect class="panel" x="520" y="216" width="220" height="66" rx="8"/><text class="sh" x="630" y="238" text-anchor="middle">difference, motivation, the room</text><text class="body" x="630" y="258" text-anchor="middle" font-size="11.5">profiles, needs, environments</text><text class="body" x="630" y="274" text-anchor="middle" font-size="11.5">(Units 5-8)</text><rect class="panel" x="40" y="316" width="220" height="66" rx="8"/><text class="sh" x="150" y="338" text-anchor="middle">evidence and decisions</text><text class="body" x="150" y="358" text-anchor="middle" font-size="11.5">assessment for decisions,</text><text class="body" x="150" y="374" text-anchor="middle" font-size="11.5">design backward (Units 9-10)</text><rect class="panel" x="520" y="316" width="220" height="66" rx="8"/><text class="sh" x="630" y="338" text-anchor="middle">well-being, the profession</text><text class="body" x="630" y="358" text-anchor="middle" font-size="11.5">the balance, the referral,</text><text class="body" x="630" y="374" text-anchor="middle" font-size="11.5">the duties (Units 11-12)</text><text class="small" x="390" y="440" text-anchor="middle">Sixteen weeks, one question: why does this pupil bother, and what will help?</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
