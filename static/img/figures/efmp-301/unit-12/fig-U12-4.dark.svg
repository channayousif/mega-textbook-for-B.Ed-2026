<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A decision path of four boxes</title><desc id="d">A decision path of four boxes: whose interest is served, which duty is honoured or broken, what the standards say, and what I will do and record - each with its note.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-interest-duty" class="stroke" x1="390" y1="150" x2="390" y2="190" marker-end="url(#arrow)"/><line id="edge-duty-standards" class="stroke" x1="390" y1="270" x2="390" y2="310" marker-end="url(#arrow)"/><line id="edge-standards-record" class="stroke" x1="390" y1="390" x2="390" y2="430" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-interest"><rect class="panel" x="100" y="70" width="580" height="80" rx="10"/><circle class="panel-a" cx="140" cy="110" r="20"/><text class="sh" x="140" y="115" text-anchor="middle">1</text><text class="sh" x="180" y="103" text-anchor="start">whose interest is served by each option? Name it.</text><text class="body" x="180" y="129" text-anchor="start">the pupil's welfare outranks reputation, results, convenience</text></g><g id="node-duty"><rect class="panel" x="100" y="190" width="580" height="80" rx="10"/><circle class="panel-a" cx="140" cy="230" r="20"/><text class="sh" x="140" y="235" text-anchor="middle">2</text><text class="sh" x="180" y="223" text-anchor="start">which duty does each option honour or break? Name the duty.</text><text class="body" x="180" y="249" text-anchor="start">fairness, confidentiality, boundaries, reporting, welfare</text></g><g id="node-standards"><rect class="panel" x="100" y="310" width="580" height="80" rx="10"/><circle class="panel-a" cx="140" cy="350" r="20"/><text class="sh" x="140" y="355" text-anchor="middle">3</text><text class="sh" x="180" y="343" text-anchor="start">what do the standards say? Name the source.</text><text class="body" x="180" y="369" text-anchor="start">the professional standards, the school's policy, the law</text></g><g id="node-record"><rect class="panel" x="100" y="430" width="580" height="80" rx="10"/><circle class="panel-a" cx="140" cy="470" r="20"/><text class="sh" x="140" y="475" text-anchor="middle">4</text><text class="sh" x="180" y="463" text-anchor="start">what will I do, and what will I record?</text><text class="body" x="180" y="489" text-anchor="start">the decision and its reason, written down</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="40" text-anchor="middle">The ethics decision path</text><text id="label-caption-1" class="small" x="390" y="548" text-anchor="middle">Four boxes, ninety seconds: the path names what pressure arrives dressed as.</text><text id="label-caption-2" class="small" x="390" y="570" text-anchor="middle">What is written is what happened; the record carries the argument.</text></g><text class="wm" x="768" y="590" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>