<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کورس کے سولہ ہفتوں کی ٹائم لائن</title><desc id="d">کورس کے سولہ ہفتوں کی ٹائم لائن: ہر ہفتے پر اس کے یونٹ کا نام اور مختصر سرخی، اور نیچے کورس کا ایک مستقل سوال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12px;font-weight:600;fill:var(--ink)}.body{font-size:11px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">کورس کے سولہ ہفتے</text><line class="stroke" x1="750" y1="110" x2="30" y2="110"/><g class="stroke"><path d="M 750 102v16 M 660 102v16 M 570 102v16 M 480 102v16 M 390 102v16 M 300 102v16 M 210 102v16 M 120 102v16 M 30 102v16"/></g><rect class="panel" x="680" y="140" width="80" height="90" rx="8"/><text class="sh" x="720" y="162" text-anchor="middle">ہ 1-2</text><text class="body" x="720" y="180" text-anchor="middle">یونٹ 1:</text><text class="body" x="720" y="196" text-anchor="middle">مضمون کیا</text><text class="body" x="720" y="212" text-anchor="middle">ہے</text><rect class="panel" x="590" y="140" width="80" height="90" rx="8"/><text class="sh" x="630" y="162" text-anchor="middle">ہ 3-4</text><text class="body" x="630" y="180" text-anchor="middle">یونٹ 2:</text><text class="body" x="630" y="196" text-anchor="middle">نشو-</text><text class="body" x="630" y="212" text-anchor="middle">نما</text><rect class="panel" x="500" y="140" width="80" height="90" rx="8"/><text class="sh" x="540" y="162" text-anchor="middle">ہ 5-7</text><text class="body" x="540" y="180" text-anchor="middle">یونٹ 3:</text><text class="body" x="540" y="196" text-anchor="middle">تعلم کے</text><text class="body" x="540" y="212" text-anchor="middle">نظریے</text><rect class="panel" x="410" y="140" width="80" height="90" rx="8"/><text class="sh" x="450" y="162" text-anchor="middle">ہ 8-9</text><text class="body" x="450" y="180" text-anchor="middle">یونٹ 4:</text><text class="body" x="450" y="196" text-anchor="middle">ادراکی</text><text class="body" x="450" y="212" text-anchor="middle">عملیں</text><rect class="panel" x="320" y="140" width="80" height="90" rx="8"/><text class="sh" x="360" y="162" text-anchor="middle">ہ 10</text><text class="body" x="360" y="180" text-anchor="middle">یونٹ 5:</text><text class="body" x="360" y="196" text-anchor="middle">ذہانت،</text><text class="body" x="360" y="212" text-anchor="middle">تخلیقیت</text><rect class="panel" x="230" y="140" width="80" height="90" rx="8"/><text class="sh" x="270" y="162" text-anchor="middle">ہ 11</text><text class="body" x="270" y="180" text-anchor="middle">یونٹ 6:</text><text class="body" x="270" y="196" text-anchor="middle">محرک،</text><text class="body" x="270" y="212" text-anchor="middle">جذبہ</text><rect class="panel" x="140" y="140" width="80" height="90" rx="8"/><text class="sh" x="180" y="162" text-anchor="middle">ہ 12</text><text class="body" x="180" y="180" text-anchor="middle">یونٹ 7:</text><text class="body" x="180" y="196" text-anchor="middle">انفرادی</text><text class="body" x="180" y="212" text-anchor="middle">اختلافات</text><rect class="panel" x="50" y="140" width="80" height="90" rx="8"/><text class="sh" x="90" y="162" text-anchor="middle">ہ 13</text><text class="body" x="90" y="180" text-anchor="middle">یونٹ 8:</text><text class="body" x="90" y="196" text-anchor="middle">جماعتی</text><text class="body" x="90" y="212" text-anchor="middle">انتظام</text><rect class="panel" x="590" y="250" width="80" height="90" rx="8"/><text class="sh" x="630" y="272" text-anchor="middle">ہ 14</text><text class="body" x="630" y="290" text-anchor="middle">یونٹ 9:</text><text class="body" x="630" y="306" text-anchor="middle">تشخیص</text><text class="body" x="630" y="322" text-anchor="middle">نما</text><rect class="panel" x="500" y="250" width="80" height="90" rx="8"/><text class="sh" x="540" y="272" text-anchor="middle">ہ 15</text><text class="body" x="540" y="290" text-anchor="middle">یونٹ 10:</text><text class="body" x="540" y="306" text-anchor="middle">تدریسی</text><text class="body" x="540" y="322" text-anchor="middle">تعلم کے</text><rect class="panel" x="380" y="250" width="110" height="90" rx="8"/><text class="sh" x="435" y="272" text-anchor="middle">ہ 16</text><text class="body" x="435" y="290" text-anchor="middle">یونٹ 11-12:</text><text class="body" x="435" y="306" text-anchor="middle">فلاح، رہنمائی،</text><text class="body" x="435" y="322" text-anchor="middle">اخلاقیات</text><text class="small" x="390" y="400" text-anchor="middle">سولہ ہفتے، ایک سوال: یہ شاگرد کیوں کوشش کرتا ہے، اور کیا مدد کرے گا؟</text><text class="small" x="390" y="422" text-anchor="middle">ہر یونٹ نے اس کا ایک حصہ جواب دیا؛ استاد سب حصے ایک ساتھ سنبھالتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
