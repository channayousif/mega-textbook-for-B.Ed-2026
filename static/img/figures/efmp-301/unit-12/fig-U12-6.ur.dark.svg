"296" text-anchor="middle">‏13‏</text></g><g id="node-week-14"><circle class="panel-a" cx="286" cy="310" r="6"/><text class="wk" x="286" y="296" text-anchor="middle">‏14‏</text></g><g id="node-week-15"><circle class="panel-a" cx="180" cy="310" r="6"/><text class="wk" x="180" y="296" text-anchor="middle">‏15‏</text></g><g id="node-week-16"><circle class="panel-a" cx="74" cy="310" r="6"/><text class="wk" x="74" y="296" text-anchor="middle">‏16‏</text></g><g id="node-unit-5"><rect class="panel" x="661" y="344" width="98" height="120" rx="8"/><text class="sh" x="710" y="366" text-anchor="middle">‏ہفتہ 10‏</text><text class="cb" x="710" y="388" text-anchor="middle">‏یونٹ 5:‏</text><text class="cb" x="710" y="410" text-anchor="middle">‏ذہانت،‏</text><text class="cb" x="710" y="430" text-anchor="middle">‏تخلیقیت‏</text></g><g id="node-unit-6"><rect class="panel" x="555" y="344" width="98" height="120" rx="8"/><text class="sh" x="604" y="366" text-anchor="middle">‏ہفتہ 11‏</text><text class="cb" x="604" y="388" text-anchor="middle">‏یونٹ 6:‏</text><text class="cb" x="604" y="410" text-anchor="middle">‏محرک،‏</text><text class="cb" x="604" y="430" text-anchor="middle">‏جذبہ‏</text></g><g id="node-unit-7"><rect class="panel" x="449" y="344" width="98" height="120" rx="8"/><text class="sh" x="498" y="366" text-anchor="middle">‏ہفتہ 12‏</text><text class="cb" x="498" y="388" text-anchor="middle">‏یونٹ 7:‏</text><text class="cb" x="498" y="410" text-anchor="middle">‏انفرادی‏</text><text class="cb" x="498" y="430" text-anchor="middle">‏اختلافات‏</text></g><g id="node-unit-8"><rect class="panel" x="343" y="344" width="98" height="120" rx="8"/><text class="sh" x="392" y="366" text-anchor="middle">‏ہفتہ 13‏</text><text class="cb" x="392" y="388" text-anchor="middle">‏یونٹ 8:‏</text><text class="cb" x="392" y="410" text-anchor="middle">‏جماعتی‏</text><text class="cb" x="392" y="430" text-anchor="middle">‏انتظام‏</text></g><g id="node-unit-9"><rect class="panel" x="237" y="344" width=