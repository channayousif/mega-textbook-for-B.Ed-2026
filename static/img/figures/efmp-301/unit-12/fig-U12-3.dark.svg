<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the teacher's five ethical duties</title><desc id="d">A table of the teacher's five ethical duties - fairness, confidentiality, boundaries, honest reporting, pupil welfare first - each against the dilemma it can raise and the professional line.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"><rect id="region-table" class="panel" x="12" y="14" width="756" height="410" rx="8"/><rect id="region-header" class="panel-a" x="12" y="14" width="756" height="60"/><path id="region-grid" class="grid" d="M172 14V424 M440 14V424 M12 144H768 M12 214H768 M12 284H768 M12 354H768"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-duty"><text class="h" x="92" y="49" text-anchor="middle">the duty</text></g><g id="node-head-dilemma"><text class="h" x="306" y="49" text-anchor="middle">the dilemma it can raise</text></g><g id="node-head-line"><text class="h" x="604" y="49" text-anchor="middle">the professional line</text></g><g id="node-fairness-duty"><text class="sh" x="92" y="114" text-anchor="middle">fairness</text></g><g id="node-fairness-dilemma"><text class="body" x="184" y="104" text-anchor="start">the patron's child, the</text><text class="body" x="184" y="124" text-anchor="start">colleague's request</text></g><g id="node-fairness-line"><text class="body" x="452" y="104" text-anchor="start">marks reflect the work,</text><text class="body" x="452" y="124" text-anchor="start">not the relationship</text></g><g id="node-confidentiality-duty"><text class="sh" x="92" y="184" text-anchor="middle">confidentiality</text></g><g id="node-confidentiality-dilemma"><text class="body" x="184" y="174" text-anchor="start">the disclosure that</text><text class="body" x="184" y="194" text-anchor="start">must be escalated</text></g><g id="node-confidentiality-line"><text class="body" x="452" y="174" text-anchor="start">never promised absolutely;</text><text class="body" x="452" y="194" text-anchor="start">safety outranks secrecy</text></g><g id="node-boundaries-duty"><text class="sh" x="92" y="254" text-anchor="middle">boundaries</text></g><g id="node-boundaries-dilemma"><text class="body" x="184" y="244" text-anchor="start">the pupil who wants to</text><text class="body" x="184" y="264" text-anchor="start">keep talking daily</text></g><g id="node-boundaries-line"><text class="body" x="452" y="244" text-anchor="start">the referral exists; the role is</text><text class="body" x="452" y="264" text-anchor="start">not a friendship or a clinic</text></g><g id="node-reporting-duty"><text class="sh" x="92" y="324" text-anchor="middle">honest reporting</text></g><g id="node-reporting-dilemma"><text class="body" x="184" y="314" text-anchor="start">the pressure to adjust,</text><text class="body" x="184" y="334" text-anchor="start">the easy number</text></g><g id="node-reporting-line"><text class="body" x="452" y="314" text-anchor="start">what is written is</text><text class="body" x="452" y="334" text-anchor="start">what happened</text></g><g id="node-welfare-duty"><text class="sh" x="92" y="384" text-anchor="middle">pupil welfare</text><text class="sh" x="92" y="404" text-anchor="middle">first</text></g><g id="node-welfare-dilemma"><text class="body" x="184" y="384" text-anchor="start">welfare against reputation,</text><text class="body" x="184" y="404" text-anchor="start">results, convenience</text></g><g id="node-welfare-line"><text class="body" x="452" y="384" text-anchor="start">when duties conflict, the pupil's</text><text class="body" x="452" y="404" text-anchor="start">welfare outranks them</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="450" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>