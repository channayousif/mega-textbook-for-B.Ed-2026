<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the teacher's five ethical duties</title><desc id="d">A table of the teacher's five ethical duties - fairness, confidentiality, boundaries, honest reporting, pupil welfare first - each against the dilemma it can raise and the professional line.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:13px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M142 14V426M398 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="77" y="48" text-anchor="middle">the duty</text><text class="h" x="270" y="40" text-anchor="middle">the dilemma it</text><text class="h" x="270" y="60" text-anchor="middle">can raise</text><text class="h" x="583" y="40" text-anchor="middle">the professional</text><text class="h" x="583" y="60" text-anchor="middle">line</text><text class="sh" x="77" y="112" text-anchor="middle">fairness</text><text class="body" x="154" y="102">the patron's child, the</text><text class="body" x="154" y="122">colleague's request</text><text class="body" x="410" y="102">marks reflect the work,</text><text class="body" x="410" y="122">not the relationship</text><text class="sh" x="77" y="196" text-anchor="middle">confidentiality</text><text class="body" x="154" y="186">the disclosure that</text><text class="body" x="154" y="206">must be escalated</text><text class="body" x="410" y="186">never promised absolutely;</text><text class="body" x="410" y="206">safety outranks secrecy</text><text class="sh" x="77" y="280" text-anchor="middle">boundaries</text><text class="body" x="154" y="270">the pupil who wants to</text><text class="body" x="154" y="290">keep talking daily</text><text class="body" x="410" y="270">the referral exists; the role is</text><text class="body" x="410" y="290">not a friendship or a clinic</text><text class="sh" x="77" y="364" text-anchor="middle">honest reporting</text><text class="body" x="154" y="354">the pressure to adjust,</text><text class="body" x="154" y="374">the easy number</text><text class="body" x="410" y="354">what is written is</text><text class="body" x="410" y="374">what happened</text><text class="sh" x="77" y="424" text-anchor="middle">pupil welfare first</text><text class="body" x="154" y="414" font-size="11.5">welfare against reputation, results, convenience</text><text class="body" x="410" y="414" font-size="11.5">when duties conflict, the pupil's welfare outranks them</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
