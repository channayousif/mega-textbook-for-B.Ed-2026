<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ پیشہ ورانہ فرائض</title><desc id="d">پانچ فرائض کا جدول: انصاف، رازداری، حدودیں، سچی رپورٹنگ، اور شاگرد کی فلاح سب سے پہلے، ہر ایک کے ساتھ وہ مخمصہ جو وہ پیدا کر سکتا ہے اور پیشہ ورانہ حد۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:12.5px;font-weight:700;fill:var(--ink)}.sh{font-size:11.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 638 14V426M382 14V426M12 74H768M12 144H768M12 215H768M12 285H768M12 356H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="703" y="48" text-anchor="middle">فرض</text><text class="h" x="510" y="40" text-anchor="middle">وہ مخمصہ جو</text><text class="h" x="510" y="60" text-anchor="middle">یہ پیدا کر سکتا ہے</text><text class="h" x="197" y="40" text-anchor="middle">پیشہ ورانہ</text><text class="h" x="197" y="60" text-anchor="middle">حد</text><text class="sh" x="703" y="112" text-anchor="middle">انصاف</text><text class="body" x="626" y="102" text-anchor="end">سرپرست کا بچہ،</text><text class="body" x="626" y="122" text-anchor="end">ساتھی کی درخواست</text><text class="body" x="370" y="102" text-anchor="end">نمبر کام کو دکھائیں،</text><text class="body" x="370" y="122" text-anchor="end">رشتے کو نہیں</text><text class="sh" x="703" y="183" text-anchor="middle">رازداری</text><text class="body" x="626" y="173" text-anchor="end">وہ انکشاف جسے</text><text class="body" x="626" y="193" text-anchor="end">آگے بتانا ضروری ہے</text><text class="body" x="370" y="173" text-anchor="end">کبھی مکمل وعدہ نہ کریں؛</text><text class="body" x="370" y="193" text-anchor="end">تحفظ رازداری سے بڑا ہے</text><text class="sh" x="703" y="254" text-anchor="middle">حدودیں</text><text class="body" x="626" y="244" text-anchor="end">وہ شاگرد جو روز</text><text class="body" x="626" y="264" text-anchor="end">بات کرنا چاہتا ہے</text><text class="body" x="370" y="244" text-anchor="end">حوالہ موجود ہے؛ یہ کردار</text><text class="body" x="370" y="264" text-anchor="end">دوستی یا کلینک نہیں</text><text class="sh" x="703" y="325" text-anchor="middle">سچی رپورٹنگ</text><text class="body" x="626" y="315" text-anchor="end">بدلنے کا دباؤ،</text><text class="body" x="626" y="335" text-anchor="end">آسان عدد</text><text class="body" x="370" y="315" text-anchor="end">جو لکھا گیا وہی</text><text class="body" x="370" y="335" text-anchor="end">ہوا ہے</text><text class="sh" x="703" y="393" text-anchor="middle">شاگرد کی فلاح مقدم</text><text class="body" x="626" y="383" text-anchor="end">فلاح بمقابلہ ساکھ،</text><text class="body" x="626" y="403" text-anchor="end">نتائج، سہولت</text><text class="body" x="370" y="383" text-anchor="end">جب فرائض ٹکرائیں، شاگرد کی</text><text class="body" x="370" y="403" text-anchor="end">فلاح سب سے بڑی ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
