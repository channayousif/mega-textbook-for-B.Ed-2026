<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اخلاقی فیصلے کا راستہ</title><desc id="d">فیصلے کے راستے کے چار خانے: کس کا فائدہ، کون سا فرض، معیارات کیا کہتے ہیں، اور میں کیا کروں گا اور کیا لکھوں گا - ہر ایک اپنی یاد دہانی کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">اخلاقی فیصلے کا راستہ</text><rect class="panel" x="420" y="70" width="300" height="100" rx="10"/><text class="sh" x="570" y="98" text-anchor="middle">1. ہر انتخاب کے پیچھے کس کا</text><text class="sh" x="570" y="116" text-anchor="middle">فائدہ ہے؟ نام لیں۔</text><text class="body" x="570" y="142" text-anchor="middle">شاگرد کی فلاح ساکھ، نتائج،</text><text class="body" x="570" y="160" text-anchor="middle">سہولت سے بڑی ہے</text><rect class="panel" x="60" y="70" width="300" height="100" rx="10"/><text class="sh" x="210" y="98" text-anchor="middle">2. ہر انتخاب کون سا فرض</text><text class="sh" x="210" y="116" text-anchor="middle">نبھاتا یا توڑتا ہے؟ فرض نام لیں۔</text><text class="body" x="210" y="142" text-anchor="middle">انصاف، رازداری، حدودیں،</text><text class="body" x="210" y="160" text-anchor="middle">رپورٹنگ، فلاح</text><rect class="panel" x="420" y="250" width="300" height="100" rx="10"/><text class="sh" x="570" y="278" text-anchor="middle">3. معیارات کیا کہتے ہیں؟</text><text class="sh" x="570" y="296" text-anchor="middle">حوالہ نام لیں۔</text><text class="body" x="570" y="322" text-anchor="middle">پیشہ ورانہ معیارات،</text><text class="body" x="570" y="340" text-anchor="middle">اسکول کی پالیسی، قانون</text><rect class="panel" x="60" y="250" width="300" height="100" rx="10"/><text class="sh" x="210" y="278" text-anchor="middle">4. میں کیا کروں گا،</text><text class="sh" x="210" y="296" text-anchor="middle">اور کیا لکھوں گا؟</text><text class="body" x="210" y="322" text-anchor="middle">فیصلہ اور اس کی وجہ،</text><text class="body" x="210" y="340" text-anchor="middle">لکھی ہوئی</text><defs><marker id="ap12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 780 0L 770 5L 780 10z" class="ink"/></marker></defs><g class="stroke"><path d="M 420 120L 360 120" marker-end="url(#ap12)"/><path d="M 210 170C 210 220 570 200 570 250" marker-end="url(#ap12)"/><path d="M 420 300L 360 300" marker-end="url(#ap12)"/></g><text class="small" x="390" y="410" text-anchor="middle">چار خانے، نوے سیکنڈ: راستہ وہ چیز نام لیتا ہے جس کے بھیس میں دباؤ آتا ہے۔</text><text class="small" x="390" y="432" text-anchor="middle">جو لکھا گیا وہی ہوا؛ ریکارڈ دلیل کو سنبھالتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
