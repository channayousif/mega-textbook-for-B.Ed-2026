<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اخلاقی فیصلے کا راستہ</title><desc id="d">چار خانوں کا فیصلہ راستہ: کس کا فائدہ، کون سا فرض پورا یا ٹوٹا، معیار کیا کہتے ہیں، اور میں کیا کروں گا اور ریکارڈ کروں گا: ہر ایک کے اپنے نوٹ کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-interest-duty" class="stroke" x1="390" y1="150" x2="390" y2="190" marker-end="url(#arrow)"/><line id="edge-duty-standards" class="stroke" x1="390" y1="270" x2="390" y2="310" marker-end="url(#arrow)"/><line id="edge-standards-record" class="stroke" x1="390" y1="390" x2="390" y2="430" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-interest"><rect class="panel" x="100" y="70" width="580" height="80" rx="10"/><circle class="panel-a" cx="640" cy="110" r="20"/><text class="sh" x="640" y="115" text-anchor="middle">‏1‏</text><text class="sh" x="600" y="103" text-anchor="end">‏ہر انتخاب کے پیچھے کس کا فائدہ ہے؟ نام لیں۔‏</text><text class="body" x="600" y="129" text-anchor="end">‏شاگرد کی فلاح ساکھ، نتائج، سہولت سے بڑی ہے‏</text></g><g id="node-duty"><rect class="panel" x="100" y="190" width="580" height="80" rx="10"/><circle class="panel-a" cx="640" cy="230" r="20"/><text class="sh" x="640" y="235" text-anchor="middle">‏2‏</text><text class="sh" x="600" y="223" text-anchor="end">‏ہر انتخاب کون سا فرض نبھاتا یا توڑتا ہے؟ فرض نام لیں۔‏</text><text class="body" x="600" y="249" text-anchor="end">‏انصاف، رازداری، حدودیں، رپورٹنگ، فلاح‏</text></g><g id="node-standards"><rect class="panel" x="100" y="310" width="580" height="80" rx="10"/><circle class="panel-a" cx="640" cy="350" r="20"/><text class="sh" x="640" y="355" text-anchor="middle">‏3‏</text><text class="sh" x="600" y="343" text-anchor="end">‏معیارات کیا کہتے ہیں؟ حوالہ نام لیں۔‏</text><text class="body" x="600" y="369" text-anchor="end">‏پیشہ ورانہ معیارات، اسکول کی پالیسی، قانون‏</text></g><g id="node-record"><rect class="panel" x="100" y="430" width="580" height="80" rx="10"/><circle class="panel-a" cx="640" cy="470" r="20"/><text class="sh" x="640" y="475" text-anchor="middle">‏4‏</text><text class="sh" x="600" y="463" text-anchor="end">‏میں کیا کروں گا، اور کیا لکھوں گا؟‏</text><text class="body" x="600" y="489" text-anchor="end">‏فیصلہ اور اس کی وجہ، لکھی ہوئی‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="40" text-anchor="middle">‏اخلاقی فیصلے کا راستہ‏</text><text id="label-caption-1" class="small" x="390" y="548" text-anchor="middle">‏چار خانے، نوے سیکنڈ: راستہ وہ چیز نام لیتا ہے جس کے بھیس میں دباؤ آتا ہے۔‏</text><text id="label-caption-2" class="small" x="390" y="570" text-anchor="middle">‏جو لکھا گیا وہی ہوا؛ ریکارڈ دلیل کو سنبھالتا ہے۔‏</text></g><text class="wm" x="12" y="590" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>