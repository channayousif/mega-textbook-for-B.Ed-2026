<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of the pupil who needs more</title><desc id="d">A concept map of the pupil who needs more than a lesson, with three branches - teaching aimed at learning, guidance aimed at direction, and counseling aimed at understanding through a skilled relationship - and a note that the teacher practises the first line of all three and refers the third.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke"><path d="M390 235 L390 140"/><path d="M390 235 L390 340"/><path d="M340 235 L170 235"/><path d="M440 235 L610 235"/></g><path class="dash" d="M170 340 C300 400 480 400 610 340"/><ellipse class="ink" cx="390" cy="235" rx="118" ry="48" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">the pupil who needs</text><text x="390" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">more than a lesson</text><rect class="panel" x="290" y="70" width="200" height="70" rx="10"/><text class="sh" x="390" y="94" text-anchor="middle">teaching</text><text class="body" x="390" y="114" text-anchor="middle">aims at learning:</text><text class="body" x="390" y="132" text-anchor="middle">the extra sums</text><rect class="panel" x="290" y="340" width="200" height="70" rx="10"/><text class="sh" x="390" y="364" text-anchor="middle">counseling</text><text class="body" x="390" y="384" text-anchor="middle">aims at understanding: a skilled</text><text class="body" x="390" y="402" text-anchor="middle">relationship that listens first</text><rect class="panel" x="20" y="200" width="200" height="70" rx="10"/><text class="sh" x="120" y="224" text-anchor="middle">guidance</text><text class="body" x="120" y="244" text-anchor="middle">aims at direction: information</text><text class="body" x="120" y="262" text-anchor="middle">about choices, the next step</text><rect class="panel" x="560" y="200" width="200" height="70" rx="10"/><text class="sh" x="660" y="224" text-anchor="middle">the teacher</text><text class="body" x="660" y="244" text-anchor="middle">practises the first line</text><text class="body" x="660" y="262" text-anchor="middle">of all three, refers the third</text><text class="small" x="390" y="440" text-anchor="middle">Three disciplines, three aims, one pupil: the teacher holds the first line of each.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
