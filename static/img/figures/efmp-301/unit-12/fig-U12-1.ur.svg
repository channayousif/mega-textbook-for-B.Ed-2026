<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">وہ شاگرد جسے سبق سے زیادہ چاہئے</title><desc id="d">وہ شاگرد جسے سبق سے زیادہ چاہئے، اس کا تصوری نقشہ: تین شاخیں - تدریس (تعلیم کا مقصد)، رہنمائی (رخ کا مقصد)، مشاورت (مہارت والے رشتے سے فہم) - اور یاد دہانی کہ استاد تینوں کی پہلی صف نبھاتا ہے اور تیسرا حوالہ دیتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke"><path d="M 390 235L 390 140"/><path d="M 390 235L 390 340"/><path d="M 440 235L 610 235"/><path d="M 340 235L 170 235"/></g><path class="dash" d="M 610 340C 480 400 300 400 170 340"/><ellipse class="ink" cx="390" cy="235" rx="118" ry="48" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">وہ شاگرد جسے سبق</text><text x="390" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">سے زیادہ چاہئے</text><rect class="panel" x="290" y="70" width="200" height="70" rx="10"/><text class="sh" x="390" y="94" text-anchor="middle">تدریس</text><text class="body" x="390" y="114" text-anchor="middle">مقصد تعلم:</text><text class="body" x="390" y="132" text-anchor="middle">اضافی سوالات</text><rect class="panel" x="290" y="340" width="200" height="70" rx="10"/><text class="sh" x="390" y="364" text-anchor="middle">مشاورت</text><text class="body" x="390" y="384" text-anchor="middle">مقصد فہم: ایک مہارت والا</text><text class="body" x="390" y="402" text-anchor="middle">رشتہ جو پہلے سنتا ہے</text><rect class="panel" x="560" y="200" width="200" height="70" rx="10"/><text class="sh" x="660" y="224" text-anchor="middle">رہنمائی</text><text class="body" x="660" y="244" text-anchor="middle">مقصد رخ: معلومات</text><text class="body" x="660" y="262" text-anchor="middle">اختیارات، اگلا قدم</text><rect class="panel" x="20" y="200" width="200" height="70" rx="10"/><text class="sh" x="120" y="224" text-anchor="middle">استاد</text><text class="body" x="120" y="244" text-anchor="middle">تینوں کی پہلی صف</text><text class="body" x="120" y="262" text-anchor="middle">نبھاتا ہے، تیسرا حوالہ دیتا ہے</text><text class="small" x="390" y="440" text-anchor="middle">تین علم، تین مقاصد، ایک شاگرد: استاد ہر ایک کی پہلی صف سنبھالتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
