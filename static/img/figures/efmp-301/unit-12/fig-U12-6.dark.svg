xt></g><g id="node-week-13"><circle class="panel-a" cx="388" cy="310" r="6"/><text class="wk" x="388" y="296" text-anchor="middle">13</text></g><g id="node-week-14"><circle class="panel-a" cx="494" cy="310" r="6"/><text class="wk" x="494" y="296" text-anchor="middle">14</text></g><g id="node-week-15"><circle class="panel-a" cx="600" cy="310" r="6"/><text class="wk" x="600" y="296" text-anchor="middle">15</text></g><g id="node-week-16"><circle class="panel-a" cx="706" cy="310" r="6"/><text class="wk" x="706" y="296" text-anchor="middle">16</text></g><g id="node-unit-5"><rect class="panel" x="21" y="344" width="98" height="120" rx="8"/><text class="sh" x="70" y="366" text-anchor="middle">week 10</text><text class="cb" x="70" y="388" text-anchor="middle">Unit 5:</text><text class="cb" x="70" y="410" text-anchor="middle">intelligence,</text><text class="cb" x="70" y="430" text-anchor="middle">creativity</text></g><g id="node-unit-6"><rect class="panel" x="127" y="344" width="98" height="120" rx="8"/><text class="sh" x="176" y="366" text-anchor="middle">week 11</text><text class="cb" x="176" y="388" text-anchor="middle">Unit 6:</text><text class="cb" x="176" y="410" text-anchor="middle">motivation,</text><text class="cb" x="176" y="430" text-anchor="middle">emotion</text></g><g id="node-unit-7"><rect class="panel" x="233" y="344" width="98" height="120" rx="8"/><text class="sh" x="282" y="366" text-anchor="middle">week 12</text><text class="cb" x="282" y="388" text-anchor="middle">Unit 7:</text><text class="cb" x="282" y="410" text-anchor="middle">individual</text><text class="cb" x="282" y="430" text-anchor="middle">differences</text></g><g id="node-unit-8"><rect class="panel" x="339" y="344" width="98" height="120" rx="8"/><text class="sh" x="388" y="366" text-anchor="middle">week 13</text><text class="cb" x="388" y="388" text-anchor="middle">Unit 8:</text><text class="cb" x="388" y="410" text-anchor="middle">classroom</text><text class="cb" x="388" y="430" text-anchor="middle">management</text></g><g id="node-unit-9"><rect class="panel" x="445" y="344" width="98" height="120" rx="8"/><text class="sh" x="494" y="366" text-anchor="middle">week 14</text><text class="cb" x="494" y="388" text-anchor="middle">Unit 9:</text><text class="cb" x="494" y="410" text-anchor="middle">assessment</text></g><g id="node-unit-10"><rect class="panel" x="551" y="344" width="98" height="120" rx="8"/><text class="sh" x="600" y="366" text-anchor="middle">week 15</text><text class="cb" x="600" y="388" text-anchor="middle">Unit 10:</text><text class="cb" x="600" y="410" text-anchor="middle">teaching-</text><text class="cb" x="600" y="430" text-anchor="middle">learning</text></g><g id="node-unit-11"><rect class="panel" x="657" y="344" width="98" height="120" rx="8"/><text class="sh" x="706" y="366" text-anchor="middle">week 16</text><text class="cb" x="706" y="388" text-anchor="middle">Units 11-12:</text><text class="cb" x="706" y="410" text-anchor="middle">well-being,</text><text class="cb" x="706" y="430" text-anchor="middle">guidance,</text><text class="cb" x="706" y="450" text-anchor="middle">ethics</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="40" text-anchor="middle">The course's sixteen weeks</text><text id="label-caption-1" class="small" x="390" y="490" text-anchor="middle">Sixteen weeks, one question: why does this pupil bother, and what will help?</text><text id="label-caption-2" class="small" x="390" y="512" text-anchor="middle">Every unit answered part of it; the teacher holds all the parts at once.</text></g><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>