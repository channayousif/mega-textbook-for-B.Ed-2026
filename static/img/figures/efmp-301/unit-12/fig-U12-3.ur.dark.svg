<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ پیشہ ورانہ فرائض</title><desc id="d">پانچ فرائض کا جدول: انصاف، رازداری، حدودیں، سچی رپورٹنگ، اور شاگرد کی فلاح سب سے پہلے، ہر ایک کے ساتھ وہ مخمصہ جو وہ پیدا کر سکتا ہے اور پیشہ ورانہ حد۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:12.5px;font-weight:700;fill:var(--ink)}.sh{font-size:11.5px;font-weight:600;fill:var(--ink)}.body{font-size:12px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 638 14V426M398 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="703" y="48" text-anchor="middle">فرض</text><text class="h" x="510" y="40" text-anchor="middle">وہ مخمصہ جو</text><text class="h" x="510" y="60" text-anchor="middle">یہ پیدا کر سکتا ہے</text><text class="h" x="197" y="40" text-anchor="middle">پیشہ ورانہ</text><text class="h" x="197" y="60" text-anchor="middle">حد</text><text class="sh" x="703" y="112" text-anchor="middle">انصاف</text><text class="body" x="626" y="102">سرپرست کا بچہ،</text><text class="body" x="626" y="122">ساتھی کی درخواست</text><text class="body" x="370" y="102">نمبر کام کو دکھائیں،</text><text class="body" x="370" y="122">رشتے کو نہیں</text><text class="sh" x="703" y="196" text-anchor="middle">رازداری</text><text class="body" x="626" y="186">وہ انکشاف جسے</text><text class="body" x="626" y="206">آگے بتانا ضروری ہے</text><text class="body" x="370" y="186">کبھی مکمل وعدہ نہ کریں؛</text><text class="body" x="370" y="206">تحفظ رازداری سے بڑا ہے</text><text class="sh" x="703" y="280" text-anchor="middle">حدودیں</text><text class="body" x="626" y="270">وہ شاگرد جو روز</text><text class="body" x="626" y="290">بات کرنا چاہتا ہے</text><text class="body" x="370" y="270">حوالہ موجود ہے؛ یہ کردار</text><text class="body" x="370" y="290">دوستی یا کلینک نہیں</text><text class="sh" x="703" y="364" text-anchor="middle">سچی رپورٹنگ</text><text class="body" x="626" y="354">بدلنے کا دباؤ،</text><text class="body" x="626" y="374">آسان عدد</text><text class="body" x="370" y="354">جو لکھا گیا وہی</text><text class="body" x="370" y="374">ہوا ہے</text><text class="sh" x="703" y="424" text-anchor="middle">شاگرد کی فلاح سب سے پہلے</text><text class="body" x="626" y="414" font-size="11.5">فلاح بمقابلہ ساکھ، نتائج، سہولت</text><text class="body" x="370" y="414" font-size="11.5">جب فرائض ٹکرائیں، شاگرد کی فلاح سب سے بڑی ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
