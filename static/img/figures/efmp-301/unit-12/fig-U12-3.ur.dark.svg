<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ پیشہ ورانہ فرائض</title><desc id="d">استاد کے پانچ اخلاقی فرائض کا جدول: انصاف، رازداری، حدودیں، ایماندار رپورٹنگ، شاگرد کی فلاح سب سے پہلے: ہر ایک کے ساتھ وہ دو پہلو جو یہ پیدا کر سکتا ہے اور پیشہ ورانہ لکیر۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"><rect id="region-table" class="panel" x="12" y="14" width="756" height="410" rx="8"/><rect id="region-header" class="panel-a" x="12" y="14" width="756" height="60"/><path id="region-grid" class="grid" d="M608 14 V424 M340 14 V424 M768 144 H12 M768 214 H12 M768 284 H12 M768 354 H12"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-duty"><text class="h" x="688" y="49" text-anchor="middle">‏فرض‏</text></g><g id="node-head-dilemma"><text class="h" x="474" y="49" text-anchor="middle">‏وہ مخمصہ جو یہ پیدا کر سکتا ہے‏</text></g><g id="node-head-line"><text class="h" x="176" y="49" text-anchor="middle">‏پیشہ ورانہ حد‏</text></g><g id="node-fairness-duty"><text class="sh" x="688" y="114" text-anchor="middle">‏انصاف‏</text></g><g id="node-fairness-dilemma"><text class="body" x="596" y="104" text-anchor="end">‏سرپرست کا بچہ،‏</text><text class="body" x="596" y="124" text-anchor="end">‏ساتھی کی درخواست‏</text></g><g id="node-fairness-line"><text class="body" x="328" y="104" text-anchor="end">‏نمبر کام کو دکھائیں،‏</text><text class="body" x="328" y="124" text-anchor="end">‏رشتے کو نہیں‏</text></g><g id="node-confidentiality-duty"><text class="sh" x="688" y="184" text-anchor="middle">‏رازداری‏</text></g><g id="node-confidentiality-dilemma"><text class="body" x="596" y="174" text-anchor="end">‏وہ انکشاف جسے‏</text><text class="body" x="596" y="194" text-anchor="end">‏آگے بتانا ضروری ہے‏</text></g><g id="node-confidentiality-line"><text class="body" x="328" y="174" text-anchor="end">‏کبھی مکمل وعدہ نہ کریں؛‏</text><text class="body" x="328" y="194" text-anchor="end">‏تحفظ رازداری سے بڑا ہے‏</text></g><g id="node-boundaries-duty"><text class="sh" x="688" y="254" text-anchor="middle">‏حدودیں‏</text></g><g id="node-boundaries-dilemma"><text class="body" x="596" y="244" text-anchor="end">‏وہ شاگرد جو روز‏</text><text class="body" x="596" y="264" text-anchor="end">‏بات کرنا چاہتا ہے‏</text></g><g id="node-boundaries-line"><text class="body" x="328" y="244" text-anchor="end">‏حوالہ موجود ہے؛ یہ کردار‏</text><text class="body" x="328" y="264" text-anchor="end">‏دوستی یا کلینک نہیں‏</text></g><g id="node-reporting-duty"><text class="sh" x="688" y="324" text-anchor="middle">‏ایماندار رپورٹنگ‏</text></g><g id="node-reporting-dilemma"><text class="body" x="596" y="314" text-anchor="end">‏بدلنے کا دباؤ،‏</text><text class="body" x="596" y="334" text-anchor="end">‏آسان عدد‏</text></g><g id="node-reporting-line"><text class="body" x="328" y="314" text-anchor="end">‏جو لکھا گیا وہی‏</text><text class="body" x="328" y="334" text-anchor="end">‏ہوا ہے‏</text></g><g id="node-welfare-duty"><text class="sh" x="688" y="384" text-anchor="middle">‏شاگرد کی‏</text><text class="sh" x="688" y="404" text-anchor="middle">‏فلاح مقدم‏</text></g><g id="node-welfare-dilemma"><text class="body" x="596" y="384" text-anchor="end">‏فلاح بمقابلہ ساکھ،‏</text><text class="body" x="596" y="404" text-anchor="end">‏نتائج، سہولت‏</text></g><g id="node-welfare-line"><text class="body" x="328" y="384" text-anchor="end">‏جب فرائض ٹکرائیں، شاگرد کی‏</text><text class="body" x="328" y="404" text-anchor="end">‏فلاح سب سے بڑی ہے‏</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="450" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>