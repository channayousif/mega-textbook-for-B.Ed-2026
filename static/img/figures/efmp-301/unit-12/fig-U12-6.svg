<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A timeline of the course's sixteen weeks</title><desc id="d">A left-to-right timeline of the course's sixteen weeks, each week labelled with its unit and a short headline, with a caption naming the course's one running question.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:12px;font-weight:600;fill:var(--ink)}.body{font-size:11px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">The course's sixteen weeks</text><line class="stroke" x1="30" y1="110" x2="750" y2="110"/><g class="stroke"><path d="M30 102 v16 M120 102 v16 M210 102 v16 M300 102 v16 M390 102 v16 M480 102 v16 M570 102 v16 M660 102 v16 M750 102 v16"/></g><rect class="panel" x="20" y="140" width="80" height="90" rx="8"/><text class="sh" x="60" y="162" text-anchor="middle">w 1-2</text><text class="body" x="60" y="180" text-anchor="middle">Unit 1:</text><text class="body" x="60" y="196" text-anchor="middle">what the</text><text class="body" x="60" y="212" text-anchor="middle">field is</text><rect class="panel" x="110" y="140" width="80" height="90" rx="8"/><text class="sh" x="150" y="162" text-anchor="middle">w 3-4</text><text class="body" x="150" y="180" text-anchor="middle">Unit 2:</text><text class="body" x="150" y="196" text-anchor="middle">develop-</text><text class="body" x="150" y="212" text-anchor="middle">ment</text><rect class="panel" x="200" y="140" width="80" height="90" rx="8"/><text class="sh" x="240" y="162" text-anchor="middle">w 5-7</text><text class="body" x="240" y="180" text-anchor="middle">Unit 3:</text><text class="body" x="240" y="196" text-anchor="middle">learning</text><text class="body" x="240" y="212" text-anchor="middle">theories</text><rect class="panel" x="290" y="140" width="80" height="90" rx="8"/><text class="sh" x="330" y="162" text-anchor="middle">w 8-9</text><text class="body" x="330" y="180" text-anchor="middle">Unit 4:</text><text class="body" x="330" y="196" text-anchor="middle">cognitive</text><text class="body" x="330" y="212" text-anchor="middle">processes</text><rect class="panel" x="380" y="140" width="80" height="90" rx="8"/><text class="sh" x="420" y="162" text-anchor="middle">w 10</text><text class="body" x="420" y="180" text-anchor="middle">Unit 5:</text><text class="body" x="420" y="196" text-anchor="middle">intelligence,</text><text class="body" x="420" y="212" text-anchor="middle">creativity</text><rect class="panel" x="470" y="140" width="80" height="90" rx="8"/><text class="sh" x="510" y="162" text-anchor="middle">w 11</text><text class="body" x="510" y="180" text-anchor="middle">Unit 6:</text><text class="body" x="510" y="196" text-anchor="middle">motivation,</text><text class="body" x="510" y="212" text-anchor="middle">emotion</text><rect class="panel" x="560" y="140" width="80" height="90" rx="8"/><text class="sh" x="600" y="162" text-anchor="middle">w 12</text><text class="body" x="600" y="180" text-anchor="middle">Unit 7:</text><text class="body" x="600" y="196" text-anchor="middle">individual</text><text class="body" x="600" y="212" text-anchor="middle">differences</text><rect class="panel" x="650" y="140" width="80" height="90" rx="8"/><text class="sh" x="690" y="162" text-anchor="middle">w 13</text><text class="body" x="690" y="180" text-anchor="middle">Unit 8:</text><text class="body" x="690" y="196" text-anchor="middle">classroom</text><text class="body" x="690" y="212" text-anchor="middle">management</text><rect class="panel" x="110" y="250" width="80" height="90" rx="8"/><text class="sh" x="150" y="272" text-anchor="middle">w 14</text><text class="body" x="150" y="290" text-anchor="middle">Unit 9:</text><text class="body" x="150" y="306" text-anchor="middle">assess-</text><text class="body" x="150" y="322" text-anchor="middle">ment</text><rect class="panel" x="200" y="250" width="80" height="90" rx="8"/><text class="sh" x="240" y="272" text-anchor="middle">w 15</text><text class="body" x="240" y="290" text-anchor="middle">Unit 10:</text><text class="body" x="240" y="306" text-anchor="middle">teaching-</text><text class="body" x="240" y="322" text-anchor="middle">learning</text><rect class="panel" x="290" y="250" width="110" height="90" rx="8"/><text class="sh" x="345" y="272" text-anchor="middle">w 16</text><text class="body" x="345" y="290" text-anchor="middle">Units 11-12:</text><text class="body" x="345" y="306" text-anchor="middle">well-being, guidance,</text><text class="body" x="345" y="322" text-anchor="middle">ethics</text><text class="small" x="390" y="400" text-anchor="middle">Sixteen weeks, one question: why does this pupil bother, and what will help?</text><text class="small" x="390" y="422" text-anchor="middle">Every unit answered part of it; the teacher holds all the parts at once.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
