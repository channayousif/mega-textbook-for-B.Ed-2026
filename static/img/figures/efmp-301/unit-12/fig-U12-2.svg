<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing guidance and counseling</title><desc id="d">A table comparing guidance and counseling on aim, main tool, and whose work each is, with the teacher's part named as the first line and the referral.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><rect id="region-table" class="panel" x="12" y="14" width="756" height="408" rx="8"/><rect id="region-header" class="panel-a" x="12" y="14" width="756" height="60"/><path id="region-grid" class="grid" d="M152 14V422 M460 14V422 M12 190H768 M12 306H768"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-guidance"><text class="h" x="306" y="49" text-anchor="middle">guidance</text></g><g id="node-head-counseling"><text class="h" x="614" y="49" text-anchor="middle">counseling</text></g><g id="node-aim-label"><text class="sh" x="82" y="137" text-anchor="middle">aim</text></g><g id="node-aim-guidance"><text class="body" x="164" y="127" text-anchor="start">direction: seeing the options</text><text class="body" x="164" y="147" text-anchor="start">and choosing a path</text></g><g id="node-aim-counseling"><text class="body" x="472" y="127" text-anchor="start">understanding: working through</text><text class="body" x="472" y="147" text-anchor="start">what information cannot touch</text></g><g id="node-tool-label"><text class="sh" x="82" y="253" text-anchor="middle">main tool</text></g><g id="node-tool-guidance"><text class="body" x="164" y="243" text-anchor="start">accurate information, at the</text><text class="body" x="164" y="263" text-anchor="start">moment the choice is open</text></g><g id="node-tool-counseling"><text class="body" x="472" y="243" text-anchor="start">a skilled relationship: listening,</text><text class="body" x="472" y="263" text-anchor="start">opening questions, confidentiality</text></g><g id="node-whose-label"><text class="sh" x="82" y="359" text-anchor="middle">whose</text><text class="sh" x="82" y="379" text-anchor="middle">work</text></g><g id="node-whose-guidance"><text class="body" x="164" y="359" text-anchor="start">a programme any trained</text><text class="body" x="164" y="379" text-anchor="start">teacher can help run</text></g><g id="node-whose-counseling"><text class="body" x="472" y="359" text-anchor="start">a trained counselor; the teacher holds</text><text class="body" x="472" y="379" text-anchor="start">only the first line and the referral</text></g></g><g id="layer-labels"><text id="label-caption-1" class="small" x="390" y="450" text-anchor="middle">Both are one programme in school;</text><text id="label-caption-2" class="small" x="390" y="470" text-anchor="middle">the teacher holds the first line of each and refers the third.</text></g><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>