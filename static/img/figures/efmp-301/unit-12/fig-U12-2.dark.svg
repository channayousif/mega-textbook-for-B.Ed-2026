<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing guidance and counseling</title><desc id="d">A table comparing guidance and counseling on aim, main tool, and whose work each is, with the teacher's part named as the first line and the referral.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M132 14V426M436 14V426M12 74H768M12 190H768M12 306H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="72" y="48" text-anchor="middle"></text><text class="h" x="284" y="48" text-anchor="middle">guidance</text><text class="h" x="602" y="48" text-anchor="middle">counseling</text><text class="sh" x="72" y="112" text-anchor="middle">aim</text><text class="body" x="144" y="102">direction: seeing the options</text><text class="body" x="144" y="122">and choosing a path</text><text class="body" x="448" y="102">understanding: working through</text><text class="body" x="448" y="122">what information cannot touch</text><text class="sh" x="72" y="228" text-anchor="middle">main tool</text><text class="body" x="144" y="218">accurate information, at the</text><text class="body" x="144" y="238">moment the choice is open</text><text class="body" x="448" y="218">a skilled relationship: listening,</text><text class="body" x="448" y="238">opening questions, confidentiality</text><text class="sh" x="72" y="344" text-anchor="middle">whose</text><text class="sh" x="72" y="362" text-anchor="middle">work</text><text class="body" x="144" y="334">a programme any trained</text><text class="body" x="144" y="354">teacher can help run</text><text class="body" x="448" y="334">a trained counselor; the teacher holds</text><text class="body" x="448" y="354">only the first line and the referral</text><text class="small" x="390" y="412" text-anchor="middle">Both are one programme in school; the teacher holds the first line of each and refers the third.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
