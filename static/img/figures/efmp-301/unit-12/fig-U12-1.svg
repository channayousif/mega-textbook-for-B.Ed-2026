<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of the pupil who needs more</title><desc id="d">A concept map of the pupil who needs more than a lesson, with three branches - teaching aimed at learning, guidance aimed at direction, and counseling aimed at understanding through a skilled relationship - and a note that the teacher practises the first line of all three and refers the third.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-pupil-teaching" class="stroke" x1="390" y1="160" x2="390" y2="120"/><line id="edge-pupil-counseling" class="stroke" x1="390" y1="260" x2="390" y2="300"/><line id="edge-pupil-guidance" class="stroke" x1="280" y1="210" x2="240" y2="210"/><line id="edge-pupil-teacher" class="stroke" x1="500" y1="210" x2="540" y2="210"/><path id="edge-guidance-counseling" class="dash" d="M130 270 C130 330 190 360 270 360"/></g><g id="layer-nodes"><g id="node-pupil"><ellipse class="panel-a" cx="390" cy="210" rx="110" ry="50"/><text class="sh" x="390" y="204" text-anchor="middle">the pupil who needs</text><text class="sh" x="390" y="226" text-anchor="middle">more than a lesson</text></g><g id="node-teaching"><rect class="panel" x="270" y="40" width="240" height="80" rx="10"/><text class="sh" x="390" y="66" text-anchor="middle">teaching</text><text class="body" x="390" y="90" text-anchor="middle">aims at learning:</text><text class="body" x="390" y="110" text-anchor="middle">the extra sums</text></g><g id="node-guidance"><rect class="panel" x="20" y="160" width="220" height="110" rx="10"/><text class="sh" x="130" y="186" text-anchor="middle">guidance</text><text class="body" x="130" y="210" text-anchor="middle">aims at direction: information</text><text class="body" x="130" y="230" text-anchor="middle">about choices, the next step</text></g><g id="node-teacher"><rect class="panel" x="540" y="160" width="220" height="110" rx="10"/><text class="sh" x="650" y="186" text-anchor="middle">the teacher</text><text class="body" x="650" y="210" text-anchor="middle">practises the first line</text><text class="body" x="650" y="230" text-anchor="middle">of all three, refers the third</text></g><g id="node-counseling"><rect class="panel" x="270" y="300" width="240" height="110" rx="10"/><text class="sh" x="390" y="326" text-anchor="middle">counseling</text><text class="body" x="390" y="350" text-anchor="middle">aims at understanding: a skilled</text><text class="body" x="390" y="370" text-anchor="middle">relationship that listens first</text></g></g><g id="layer-labels"><text id="label-one-programme" class="small" x="20" y="400" text-anchor="start">often one programme in school</text><text id="label-caption" class="small" x="390" y="446" text-anchor="middle">Three disciplines, three aims, one pupil: the teacher holds the first line of each.</text></g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>