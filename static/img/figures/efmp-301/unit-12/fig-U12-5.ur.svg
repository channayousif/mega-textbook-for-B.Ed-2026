<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پورے کورس کا تصوری نقشہ</title><desc id="d">پورے کورس کا تصوری نقشہ چھ شاخوں کے ساتھ: سیکھنے والا اور نشوونما، تعلم کے نظریے، ذہن کا کام، فرق حوصلہ اور کمرہ، ثبوت اور فیصلے، اور فلاح اور پیشہ: ہر ایک کے اپنے سرخی خیال کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.bt{font-size:13px;font-weight:600;fill:var(--ink)}.cb{font-size:12px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wk{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-course-learner" class="stroke" d="M440 215 C460 160 470 120 500 120"/><path id="edge-course-theories" class="stroke" d="M340 215 C320 160 310 120 280 120"/><line id="edge-course-mind" class="stroke" x1="460" y1="250" x2="500" y2="250"/><line id="edge-course-difference" class="stroke" x1="320" y1="250" x2="280" y2="250"/><path id="edge-course-evidence" class="stroke" d="M440 285 C460 340 470 380 500 380"/><path id="edge-course-wellbeing" class="stroke" d="M340 285 C320 340 310 380 280 380"/></g><g id="layer-nodes"><g id="node-course"><ellipse class="panel-a" cx="390" cy="250" rx="70" ry="50"/><text class="sh" x="390" y="245" text-anchor="middle">‏پورا‏</text><text class="sh" x="390" y="267" text-anchor="middle">‏کورس‏</text></g><g id="node-learner"><rect class="panel" x="500" y="70" width="270" height="100" rx="10"/><text class="bt" x="635" y="96" text-anchor="middle">‏سیکھنے والا، نشوونما‏</text><text class="body" x="635" y="120" text-anchor="middle">‏یہ شاگرد کہاں ہے، اور‏</text><text class="body" x="635" y="140" text-anchor="middle">‏اگلا مرحلہ کیا ہے (یونٹ 1-2)‏</text></g><g id="node-theories"><rect class="panel" x="10" y="70" width="270" height="100" rx="10"/><text class="bt" x="145" y="96" text-anchor="middle">‏تعلم کے نظریے‏</text><text class="body" x="145" y="120" text-anchor="middle">‏رویہ، ادراک، مشاہدہ،‏</text><text class="body" x="145" y="140" text-anchor="middle">‏تعمیر (یونٹ 3)‏</text></g><g id="node-mind"><rect class="panel" x="500" y="200" width="270" height="100" rx="10"/><text class="bt" x="635" y="226" text-anchor="middle">‏ذہن کا کام‏</text><text class="body" x="635" y="250" text-anchor="middle">‏توجہ، یادداشت، سوچ‏</text><text class="body" x="635" y="270" text-anchor="middle">‏(یونٹ 4)‏</text></g><g id="node-difference"><rect class="panel" x="10" y="200" width="270" height="100" rx="10"/><text class="bt" x="145" y="226" text-anchor="middle">‏فرق، محرک، جماعت کا ماحول‏</text><text class="body" x="145" y="250" text-anchor="middle">‏خاکے، ضرورتیں، ماحول‏</text><text class="body" x="145" y="270" text-anchor="middle">‏(یونٹ 5-8)‏</text></g><g id="node-evidence"><rect class="panel" x="500" y="330" width="270" height="100" rx="10"/><text class="bt" x="635" y="356" text-anchor="middle">‏ثبوت اور فیصلے‏</text><text class="body" x="635" y="380" text-anchor="middle">‏فیصلوں کے لیے تشخیص،‏</text><text class="body" x="635" y="400" text-anchor="middle">‏الٹی ڈیزائن (یونٹ 9-10)‏</text></g><g id="node-wellbeing"><rect class="panel" x="10" y="330" width="270" height="100" rx="10"/><text class="bt" x="145" y="356" text-anchor="middle">‏فلاح، پیشہ‏</text><text class="body" x="145" y="380" text-anchor="middle">‏توازن، حوالہ،‏</text><text class="body" x="145" y="400" text-anchor="middle">‏فرائض (یونٹ 11-12)‏</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="40" text-anchor="middle">‏پورا کورس: چھ جھرمٹ، ایک سوال‏</text><text id="label-caption" class="small" x="390" y="466" text-anchor="middle">‏سولہ ہفتے، ایک سوال: یہ شاگرد کیوں کوشش کرتا ہے، اور کیا مدد کرے گا؟‏</text></g><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>