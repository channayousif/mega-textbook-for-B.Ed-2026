<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پورے کورس کا تصوری نقشہ</title><desc id="d">پورے کورس کا تصوری نقشہ چھ شاخوں کے ساتھ: سیکھنے والا اور نشوونما، تعلم کے نظریے، ذہن کا کام، فرق محرک اور ماحول، شہادت اور فیصلے، اور فلاح اور پیشہ - ہر ایک اپنے سرخی کے خیال کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle">پورا کورس: چھ گچھے، ایک سوال</text><ellipse class="ink" cx="390" cy="240" rx="110" ry="48" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">پورا</text><text x="390" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bg)">کورس</text><g class="stroke"><path d="M 480 215L 610 150"/><path d="M 300 215L 170 150"/><path d="M 490 250L 610 250"/><path d="M 290 250L 170 250"/><path d="M 480 270L 610 350"/><path d="M 300 270L 170 350"/></g><rect class="panel" x="520" y="90" width="220" height="66" rx="8"/><text class="sh" x="630" y="112" text-anchor="middle">سیکھنے والا، نشوونما</text><text class="body" x="630" y="132" text-anchor="middle" font-size="11.5">یہ شاگرد کہاں ہے، اور</text><text class="body" x="630" y="148" text-anchor="middle" font-size="11.5">اگلا مرحلہ کیا ہے (یونٹ 1-2)</text><rect class="panel" x="40" y="90" width="220" height="66" rx="8"/><text class="sh" x="150" y="112" text-anchor="middle">تعلم کے نظریے</text><text class="body" x="150" y="132" text-anchor="middle" font-size="11.5">رویہ، ادراک، مشاہدہ،</text><text class="body" x="150" y="148" text-anchor="middle" font-size="11.5">تعمیر (یونٹ 3)</text><rect class="panel" x="520" y="216" width="220" height="66" rx="8"/><text class="sh" x="630" y="238" text-anchor="middle">ذہن کا کام</text><text class="body" x="630" y="258" text-anchor="middle" font-size="11.5">توجہ، یادداشت، سوچ</text><text class="body" x="630" y="274" text-anchor="middle" font-size="11.5">(یونٹ 4)</text><rect class="panel" x="40" y="216" width="220" height="66" rx="8"/><text class="sh" x="150" y="238" text-anchor="middle">فرق، محرک، جماعت کا ماحول</text><text class="body" x="150" y="258" text-anchor="middle" font-size="11.5">خاکے، ضرورتیں، ماحول</text><text class="body" x="150" y="274" text-anchor="middle" font-size="11.5">(یونٹ 5-8)</text><rect class="panel" x="520" y="316" width="220" height="66" rx="8"/><text class="sh" x="630" y="338" text-anchor="middle">شہادت اور فیصلے</text><text class="body" x="630" y="358" text-anchor="middle" font-size="11.5">فیصلوں کے لیے تشخیص،</text><text class="body" x="630" y="374" text-anchor="middle" font-size="11.5">الٹی ڈیزائن (یونٹ 9-10)</text><rect class="panel" x="40" y="316" width="220" height="66" rx="8"/><text class="sh" x="150" y="338" text-anchor="middle">فلاح، پیشہ</text><text class="body" x="150" y="358" text-anchor="middle" font-size="11.5">توازن، حوالہ،</text><text class="body" x="150" y="374" text-anchor="middle" font-size="11.5">فرائض (یونٹ 11-12)</text><text class="small" x="390" y="440" text-anchor="middle">سولہ ہفتے، ایک سوال: یہ شاگرد کیوں کوشش کرتا ہے، اور کیا مدد کرے گا؟</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
