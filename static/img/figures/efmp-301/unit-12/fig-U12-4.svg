<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A decision path of four boxes</title><desc id="d">A decision path of four boxes: whose interest is served, which duty is honoured or broken, what the standards say, and what I will do and record - each with its note.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">The ethics decision path</text><rect class="panel" x="60" y="70" width="300" height="100" rx="10"/><text class="sh" x="210" y="98" text-anchor="middle">1. whose interest is served</text><text class="sh" x="210" y="116" text-anchor="middle">by each option? Name it.</text><text class="body" x="210" y="142" text-anchor="middle">the pupil's welfare outranks reputation,</text><text class="body" x="210" y="160" text-anchor="middle">results, convenience</text><rect class="panel" x="420" y="70" width="300" height="100" rx="10"/><text class="sh" x="570" y="98" text-anchor="middle">2. which duty does each option</text><text class="sh" x="570" y="116" text-anchor="middle">honour or break? Name the duty.</text><text class="body" x="570" y="142" text-anchor="middle">fairness, confidentiality, boundaries,</text><text class="body" x="570" y="160" text-anchor="middle">reporting, welfare</text><rect class="panel" x="60" y="250" width="300" height="100" rx="10"/><text class="sh" x="210" y="278" text-anchor="middle">3. what do the standards say?</text><text class="sh" x="210" y="296" text-anchor="middle">Name the source.</text><text class="body" x="210" y="322" text-anchor="middle">the professional standards, the</text><text class="body" x="210" y="340" text-anchor="middle">school's policy, the law</text><rect class="panel" x="420" y="250" width="300" height="100" rx="10"/><text class="sh" x="570" y="278" text-anchor="middle">4. what will I do,</text><text class="sh" x="570" y="296" text-anchor="middle">and what will I record?</text><text class="body" x="570" y="322" text-anchor="middle">the decision and its reason,</text><text class="body" x="570" y="340" text-anchor="middle">written down</text><defs><marker id="ap12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><g class="stroke"><path d="M360 120 L420 120" marker-end="url(#ap12)"/><path d="M570 170 C570 220 210 200 210 250" marker-end="url(#ap12)"/><path d="M360 300 L420 300" marker-end="url(#ap12)"/></g><text class="small" x="390" y="410" text-anchor="middle">Four boxes, ninety seconds: the path names what pressure arrives dressed as.</text><text class="small" x="390" y="432" text-anchor="middle">What is written is what happened; the record carries the argument.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
