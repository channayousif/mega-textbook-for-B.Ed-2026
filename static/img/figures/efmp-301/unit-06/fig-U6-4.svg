<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of three classroom emotions</title><desc id="d">A table of three classroom emotions - anxiety, interest and curiosity - on what each does to learning, what triggers it, and one teacher move.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="16" width="756" height="398" rx="8"/><path class="grid" d="M152 16V414M392 16V414M600 16V414M12 78H768M12 190H768M12 302H768"/><path class="ink" d="M12 78H768V82H12z"/><text class="h" x="82" y="50" text-anchor="middle">emotion</text><text class="h" x="272" y="42" text-anchor="middle">what it does</text><text class="h" x="272" y="62" text-anchor="middle">to learning</text><text class="h" x="496" y="42" text-anchor="middle">what triggers</text><text class="h" x="496" y="62" text-anchor="middle">it</text><text class="h" x="684" y="42" text-anchor="middle">one teacher</text><text class="h" x="684" y="62" text-anchor="middle">move</text><text class="sh" x="82" y="128" text-anchor="middle">anxiety</text><text class="body" x="164" y="112">narrows the workbench</text><text class="body" x="164" y="132">until only the fear fits</text><text class="body" x="404" y="112">the public wrong answer,</text><text class="body" x="404" y="132">the high-stakes test</text><text class="body" x="612" y="112">familiarity with the format,</text><text class="body" x="612" y="132">known steps, calm naming</text><text class="sh" x="82" y="240" text-anchor="middle">interest</text><text class="body" x="164" y="224">widens attention</text><text class="body" x="164" y="244">and holds it</text><text class="body" x="404" y="224">the demonstration jar, the story</text><text class="body" x="404" y="244">that starts on their street</text><text class="body" x="612" y="224">catch situational, keep personal:</text><text class="body" x="612" y="244">return to what caught</text><text class="sh" x="82" y="352" text-anchor="middle">curiosity</text><text class="body" x="164" y="336">opens a specific gap</text><text class="body" x="164" y="356">and wants it filled</text><text class="body" x="404" y="336">a visible gap the pupil</text><text class="body" x="404" y="356">almost understands</text><text class="body" x="612" y="336">let questions live; do not answer</text><text class="body" x="612" y="356">the ones nobody asked</text><text class="small" x="24" y="400">Each move costs the teacher's attention, not money.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
