<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Maslow's hierarchy drawn as five rising steps, each with a classroom instance</title><desc id="d">Maslow's hierarchy drawn as five rising steps, each with a classroom instance: a hungry pupil cannot learn, a frightened pupil cannot risk, an isolated pupil cannot join, an unnoticed pupil cannot shine, a supported pupil can become.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="34" text-anchor="middle">Maslow's hierarchy: a classroom triage</text><text class="small" x="390" y="55" text-anchor="middle">Needs rise from relief toward growth</text><line class="stroke" x1="100" y1="402" x2="100" y2="78" marker-end="url(#arrow)"/><text class="body" x="-240" y="57" transform="rotate(-90)" text-anchor="middle">deficit needs first, then growth</text><line class="grid" x1="145" y1="424" x2="752" y2="424"/><rect class="panel-a" x="155" y="342" width="118" height="82" rx="8"/><text class="sh" x="165" y="365">1. physiological</text><text class="sh" x="165" y="382">needs</text><circle class="stroke-a" cx="246" cy="374" r="10"/><path class="stroke-a" d="M236 374h20M246 364v20M239 367l14 14M253 367l-14 14"/><text class="body" x="165" y="401">a hungry pupil</text><text class="body" x="165" y="417">cannot learn</text><rect class="panel-b" x="273" y="282" width="118" height="142" rx="8"/><text class="sh" x="283" y="305">2. safety</text><rect class="stroke" x="343" y="321" width="27" height="21" rx="3"/><path class="stroke" d="M349 321v-7a7.5 7.5 0 0 1 15 0v7M356.5 327v8"/><text class="body" x="283" y="371">a frightened</text><text class="body" x="283" y="388">pupil cannot risk</text><rect class="panel-c" x="391" y="222" width="118" height="202" rx="8"/><text class="sh" x="401" y="245">3. belonging</text><circle class="stroke" cx="428" cy="267" r="8"/><circle class="stroke" cx="469" cy="267" r="8"/><path class="stroke" d="M416 289c1-11 23-11 24 0M457 289c1-11 23-11 24 0M440 282h17"/><text class="body" x="401" y="318">an isolated</text><text class="body" x="401" y="335">pupil cannot join</text><rect class="panel-d" x="509" y="162" width="118" height="262" rx="8"/><text class="sh" x="519" y="185">4. esteem</text><path class="stroke" d="M568 198l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/><text class="body" x="519" y="252">an unnoticed</text><text class="body" x="519" y="269">pupil cannot shine</text><rect class="panel" x="627" y="102" width="118" height="322" rx="8"/><text class="sh" x="637" y="125">5. self-</text><text class="sh" x="637" y="142">actualization</text><path class="stroke" d="M646 177l19-18 13 10 27-29" marker-end="url(#arrow)"/><text class="body" x="637" y="211">a supported</text><text class="body" x="637" y="228">pupil can become</text><text class="small" x="155" y="445">Each step names a need and the classroom block it can create.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
