<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing Maslow, Herzberg and self-determination theory</title><desc id="d">A table comparing Maslow, Herzberg and self-determination theory on the question each asks, a school instance, and one limit.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="404" rx="8"/><path class="grid" d="M148 14V418M420 14V418M624 14V418M12 74H768M12 190H768M12 306H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="80" y="46" text-anchor="middle">theory</text><text class="h" x="284" y="38" text-anchor="middle">the question</text><text class="h" x="284" y="58" text-anchor="middle">it asks</text><text class="h" x="522" y="38" text-anchor="middle">a school</text><text class="h" x="522" y="58" text-anchor="middle">instance</text><text class="h" x="696" y="46" text-anchor="middle">one limit</text><text class="sh" x="80" y="118" text-anchor="middle">Maslow</text><text class="body" x="160" y="102">what must be met before</text><text class="body" x="160" y="120">growth can pull?</text><text class="body" x="432" y="102">the midday meal that changed</text><text class="body" x="432" y="120">Class 3's afternoons</text><text class="body" x="636" y="102">the strict order does</text><text class="body" x="636" y="120">not always hold</text><text class="sh" x="80" y="234" text-anchor="middle">Herzberg</text><text class="body" x="160" y="218">is this a satisfaction problem</text><text class="body" x="160" y="236">or a dissatisfaction problem?</text><text class="body" x="432" y="218">fans and water versus the</text><text class="body" x="432" y="236">chosen-topic project</text><text class="body" x="636" y="218">built on adult workers</text><text class="body" x="636" y="236">not pupils</text><text class="sh" x="80" y="345" text-anchor="middle">self-</text><text class="sh" x="80" y="363" text-anchor="middle">determination</text><text class="body" x="160" y="334">are autonomy, competence and</text><text class="body" x="160" y="352">relatedness being fed?</text><text class="body" x="432" y="334">the project that ran</text><text class="body" x="432" y="352">past the bell</text><text class="body" x="636" y="334">all three fed together</text><text class="body" x="636" y="352">not one at a time</text><text class="small" x="24" y="404">Three theories, three questions: the choice among them is the teacher's.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
