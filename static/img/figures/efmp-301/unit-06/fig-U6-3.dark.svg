<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of the attribution loop: an outcome arrives, the pupil explains it by effort, ability, luck or task difficulty along locus, stability and controllability</title><desc id="d">A flowchart of the attribution loop: an outcome arrives, the pupil explains it by effort, ability, luck or task difficulty along locus, stability and controllability, the explanation sets the next expectation into an approach loop or a protect loop, and the next attempt follows.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}text{font-size:15px;fill:var(--ink)}.approach{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.protect{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;stroke-dasharray:7 4}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" class="ah-a"/></marker></defs><text class="h" x="390" y="31" text-anchor="middle">The attribution loop</text><rect class="panel" x="35" y="90" width="165" height="95" rx="10"/><text class="sh" x="52" y="116">1. OUTCOME</text><line class="grid" x1="52" y1="126" x2="183" y2="126"/><text class="body" x="52" y="148">an outcome arrives:</text><text class="body" x="52" y="169">success or failure</text><rect class="panel" x="245" y="60" width="295" height="155" rx="10"/><text class="sh" x="262" y="86">2. EXPLANATION</text><line class="grid" x1="262" y1="96" x2="523" y2="96"/><text class="body" x="262" y="118">the pupil explains it:</text><text class="body" x="262" y="137">effort, ability, luck, task difficulty</text><text class="small" x="262" y="161">locus: inside or outside me</text><text class="small" x="262" y="180">stability: changeable or fixed</text><text class="small" x="262" y="199">controllability: can I affect it?</text><rect class="panel" x="570" y="75" width="175" height="130" rx="10"/><text class="sh" x="587" y="101">3. EXPECTATION</text><line class="grid" x1="587" y1="111" x2="728" y2="111"/><text class="body" x="587" y="135">the explanation</text><text class="body" x="587" y="154">sets the next</text><text class="body" x="587" y="173">expectation</text><path class="stroke-a" d="M200 137H245" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M540 137H570" marker-end="url(#arrow-a)"/><rect class="approach" x="310" y="250" width="205" height="70" rx="18"/><text class="sh" x="326" y="272">changeable cause</text><text class="small" x="326" y="290">try again, maybe differently</text><text class="small" x="326" y="307">the approach loop</text><rect class="protect" x="545" y="250" width="200" height="70" rx="4"/><text class="sh" x="561" y="272">fixed cause</text><text class="small" x="561" y="290">why try?</text><text class="small" x="561" y="307">the protect loop</text><path class="stroke-a" d="M604 205C570 229 492 235 411 250" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M695 205V250" marker-end="url(#arrow-a)"/><rect class="panel" x="285" y="355" width="240" height="70" rx="10"/><text class="sh" x="302" y="380">4. NEXT ATTEMPT</text><text class="body" x="302" y="404">the next attempt follows expectation</text><path class="stroke-a" d="M411 320C402 337 385 342 369 355" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M645 320C607 346 547 347 481 355" marker-end="url(#arrow-a)"/><path class="stroke" d="M285 390C102 418 12 315 84 185" marker-end="url(#arrow)"/><text class="small" x="100" y="328">next outcome</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
