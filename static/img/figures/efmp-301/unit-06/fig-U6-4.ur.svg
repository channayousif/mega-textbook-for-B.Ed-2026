<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین جماعتی جذبات</title><desc id="d">تین جماعتی جذبات کا جدول: اضطراب، دلچسپی اور تجسس، ہر ایک پر یہ کہ یہ تعلم کے ساتھ کیا کرتا ہے، کیا اسے جنم دیتا ہے، اور استاد کا ایک اقدام۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="16" width="756" height="398" rx="8"/><path class="grid" d="M 628 16V414M388 16V414M180 16V414M12 78H768M12 190H768M12 302H768"/><path class="ink" d="M 768 78H768V82H12z"/><text class="h" x="698" y="50" text-anchor="middle">جذبہ</text><text class="h" x="508" y="42" text-anchor="middle">یہ تعلم کے</text><text class="h" x="508" y="62" text-anchor="middle">ساتھ کیا کرتا ہے</text><text class="h" x="284" y="42" text-anchor="middle">کیا اسے</text><text class="h" x="284" y="62" text-anchor="middle">جنم دیتا ہے</text><text class="h" x="96" y="42" text-anchor="middle">استاد کا</text><text class="h" x="96" y="62" text-anchor="middle">ایک اقدام</text><text class="sh" x="698" y="128" text-anchor="middle">اضطراب</text><text class="body" x="616" y="112" text-anchor="end">کام کی میز تنگ کر دیتا ہے</text><text class="body" x="616" y="132" text-anchor="end">یہاں تک کہ صرف خوف سمائے</text><text class="body" x="376" y="112" text-anchor="end">سب کے سامنے غلط جواب،</text><text class="body" x="376" y="132" text-anchor="end">زیادہ نمبر والا امتحان</text><text class="body" x="168" y="112" text-anchor="end">سانچے کی واقفیت،</text><text class="body" x="168" y="132" text-anchor="end">معلوم مرحلے، پرسکون نام دینا</text><text class="sh" x="698" y="240" text-anchor="middle">دلچسپی</text><text class="body" x="616" y="224" text-anchor="end">توجہ وسیع کرتی ہے</text><text class="body" x="616" y="244" text-anchor="end">اور تھامے رکھتی ہے</text><text class="body" x="376" y="224" text-anchor="end">مظاہرے کا مرتبان، وہ کہانی جو</text><text class="body" x="376" y="244" text-anchor="end">ان کی گلی سے شروع ہو</text><text class="body" x="168" y="224" text-anchor="end">موقوفی دلچسپی پکڑیں، ذاتی کو رکھیں:</text><text class="body" x="168" y="244" text-anchor="end">جس نے پکڑا تھا اس پر لوٹیں</text><text class="sh" x="698" y="352" text-anchor="middle">تجسس</text><text class="body" x="616" y="336" text-anchor="end">ایک مخصوص خلا کھولتا ہے</text><text class="body" x="616" y="356" text-anchor="end">اور چاہتا ہے کہ وہ بھرے</text><text class="body" x="376" y="336" text-anchor="end">ایک نظر آنے والا خلا جسے شاگرد</text><text class="body" x="376" y="356" text-anchor="end">تقریباً سمجھ لے</text><text class="body" x="168" y="336" text-anchor="end">سوال زندہ رہنے دیں؛ جواب نہ دیں</text><text class="body" x="168" y="356" text-anchor="end">جنہیں کسی نے نہیں پوچھا</text><text class="small" x="756" y="400" text-anchor="end">ہر اقدام کی قیمت استاد کی توجہ ہے، پیسہ نہیں۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
