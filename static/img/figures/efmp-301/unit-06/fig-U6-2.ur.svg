<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین محرک نظریوں کا موازنہ</title><desc id="d">ماسلو، ہرزبرگ اور خود ارادیت نظریے کا جدول: ہر ایک کا سوال، اسکول کی مثال، اور ایک حد۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="404" rx="8"/><path class="grid" d="M 632 14V418M420 14V418M624 14V418M12 74H768M12 190H768M12 306H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="700" y="46" text-anchor="middle">نظریہ</text><text class="h" x="496" y="38" text-anchor="middle">وہ سوال</text><text class="h" x="496" y="58" text-anchor="middle">جو یہ پوچھتا ہے</text><text class="h" x="258" y="38" text-anchor="middle">اسکول کی</text><text class="h" x="258" y="58" text-anchor="middle">مثال</text><text class="h" x="84" y="46" text-anchor="middle">ایک حد</text><text class="sh" x="700" y="118" text-anchor="middle">ماسلو</text><text class="body" x="620" y="102">نشوونما کھینچنے سے پہلے</text><text class="body" x="620" y="120">کیا پورا ہونا ضروری ہے؟</text><text class="body" x="348" y="102">دوپہر کا کھانا جس نے جماعت 3</text><text class="body" x="348" y="120">کے بعد والے وقت بدل دیے</text><text class="body" x="144" y="102">سخت ترتیب ہر حال</text><text class="body" x="144" y="120">میں قائم نہیں رہتی</text><text class="sh" x="700" y="234" text-anchor="middle">ہرزبرگ</text><text class="body" x="620" y="218">کیا یہ مطمئن ہونے کا مسئلہ ہے</text><text class="body" x="620" y="236">یا بے چینی کا؟</text><text class="body" x="348" y="218">پنکھے اور پانی بمقابلہ</text><text class="body" x="348" y="236">اپنی پسند کا موضوع والا پروجیکٹ</text><text class="body" x="144" y="218">بالغ ملازموں پر بنیا،</text><text class="body" x="144" y="236">شاگردوں پر نہیں</text><text class="sh" x="700" y="345" text-anchor="middle">خود</text><text class="sh" x="700" y="363" text-anchor="middle">ارادیت</text><text class="body" x="620" y="334">کیا خود مختاری، مہارت اور</text><text class="body" x="620" y="352">تعلق پورے ہو رہے ہیں؟</text><text class="body" x="348" y="334">وہ پروجیکٹ جو گھنٹی</text><text class="body" x="348" y="352">کے بعد بھی چلتا رہا</text><text class="body" x="144" y="334">تینوں ضرورتیں ساتھ کھلائی جاتی ہیں،</text><text class="body" x="144" y="352">ایک ایک کر کے نہیں</text><text class="small" x="756" y="404">تین نظریے، تین سوال: ان میں انتخاب استاد کا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
