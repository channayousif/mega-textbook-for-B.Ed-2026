<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ماسلو کی ضروریات کی ترتیب</title><desc id="d">ماسلو کی ترتیب پانچ بڑھتی ہوئی سیڑیوں کے طور پر: بھوکا شاگرد نہیں سیکھ سکتا، خوفزدہ شاگرد خطرہ نہیں لے سکتا، الگ تھلگ شاگرد شامل نہیں ہو سکتا، نظر انداز شاگرد چمک نہیں سکتا، سہارا پانے والا شاگرد بن سکتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780 0L 770 5L 780 10z" class="ah"/></marker></defs><text class="h" x="390" y="34" text-anchor="middle">ماسلو کی ترتیب: جماعت کی جانچ پہچان</text><text class="small" x="390" y="55" text-anchor="middle">ضروریات راحت سے نشوونما کی طرف بڑھتی ہیں</text><line class="stroke" x1="680" y1="402" x2="680" y2="78" marker-end="url(#arrow)"/><text class="body" x="-240" y="57" transform="rotate(-90)" text-anchor="middle">پہلے خسارے کی ضروریات، پھر نشوونما</text><line class="grid" x1="635" y1="424" x2="28" y2="424"/><rect class="panel-a" x="507" y="342" width="118" height="82" rx="8"/><text class="sh" x="615" y="365" text-anchor="end">1. جسمانی</text><text class="sh" x="615" y="382" text-anchor="end">ضروریتیں</text><circle class="stroke-a" cx="534" cy="374" r="10"/><path class="stroke-a" d="M 544 374h20M246 364v20M239 367l14 14M253 367l-14 14"/><text class="body" x="615" y="401" text-anchor="end">بھوکا شاگرد</text><text class="body" x="615" y="417" text-anchor="end">نہیں سیکھ سکتا</text><rect class="panel-b" x="389" y="282" width="118" height="142" rx="8"/><text class="sh" x="497" y="305" text-anchor="end">2. تحفظ</text><rect class="stroke" x="410" y="321" width="27" height="21" rx="3"/><path class="stroke" d="M 431 321v-7a7.5 7.5 0 0 1 15 0v7M356.5 327v8"/><text class="body" x="497" y="371" text-anchor="end">خوفزدہ</text><text class="body" x="497" y="388" text-anchor="end">شاگرد خطرہ نہیں لے سکتا</text><rect class="panel-c" x="271" y="222" width="118" height="202" rx="8"/><text class="sh" x="379" y="245" text-anchor="end">3. تعلق</text><circle class="stroke" cx="352" cy="267" r="8"/><circle class="stroke" cx="311" cy="267" r="8"/><path class="stroke" d="M 364 289c1-11 23-11 24 0M457 289c1-11 23-11 24 0M440 282h17"/><text class="body" x="379" y="318" text-anchor="end">الگ تھلگ</text><text class="body" x="379" y="335" text-anchor="end">شاگرد شامل نہیں ہو سکتا</text><rect class="panel-d" x="153" y="162" width="118" height="262" rx="8"/><text class="sh" x="261" y="185" text-anchor="end">4. عزت</text><path class="stroke" d="M 212 198l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/><text class="body" x="261" y="252" text-anchor="end">نظر انداز</text><text class="body" x="261" y="269" text-anchor="end">شاگرد چمک نہیں سکتا</text><rect class="panel" x="35" y="102" width="118" height="322" rx="8"/><text class="sh" x="143" y="125" text-anchor="end">5. خود</text><text class="sh" x="143" y="142" text-anchor="end">ارتقا</text><path class="stroke" d="M 134 177l19-18 13 10 27-29" marker-end="url(#arrow)"/><text class="body" x="143" y="211" text-anchor="end">سہارا پانے والا</text><text class="body" x="143" y="228" text-anchor="end">شاگرد بن سکتا ہے</text><text class="small" x="625" y="445" text-anchor="end">ہر سیڑی ایک ضرورت اور وہ رکاوٹ بتاتی ہے جو جماعت میں رخ دیتی ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
