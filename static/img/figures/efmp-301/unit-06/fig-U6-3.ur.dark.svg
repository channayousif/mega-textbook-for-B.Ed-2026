<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نسبت دہی کا چکر</title><desc id="d">نسبت دہی کا چکر: نتیجہ آتا ہے، شاگرد اس کی وجہ بتاتا ہے (محنت، قابلیت، قسمت، کام کی مشکل) مقام، استحکام اور قابو پر، توضیح توقع بناتی ہے جو آگے بڑھنے یا بچاؤ کے چکر میں جاتی ہے، اور اگلی کوشش اسی طرح آتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.ink{fill:var(--ink)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:11.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.ah-a{fill:var(--a1)}text{font-size:13px;fill:var(--ink)}.approach{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.protect{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;stroke-dasharray:7 4}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780 0L10 5 0 10z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 780 0L10 5 0 10z" class="ah-a"/></marker></defs><text class="h" x="390" y="31" text-anchor="middle">نسبت دہی کا چکر</text><rect class="panel" x="580" y="90" width="165" height="95" rx="10"/><text class="sh" x="728" y="116">1. نتیجہ</text><line class="grid" x1="728" y1="126" x2="597" y2="126"/><text class="body" x="728" y="148">کامیابی یا ناکامی</text><text class="body" x="728" y="169">کا نتیجہ آتا ہے</text><rect class="panel" x="240" y="60" width="295" height="155" rx="10"/><text class="sh" x="518" y="86">2. توضیح</text><line class="grid" x1="518" y1="96" x2="257" y2="96"/><text class="body" x="518" y="118">شاگرد اس کی وجہ بتاتا ہے:</text><text class="body" x="518" y="137">محنت، قابلیت، قسمت، کام کی مشکل</text><text class="small" x="518" y="161">مقام: میرے اندر یا باہر</text><text class="small" x="518" y="180">استحکام: بدل سکتا یا پکا</text><text class="small" x="518" y="199">قابو: کیا میں اسے بدل سکتا ہوں؟</text><rect class="panel" x="35" y="75" width="175" height="130" rx="10"/><text class="sh" x="193" y="101">3. توقع</text><line class="grid" x1="193" y1="111" x2="52" y2="111"/><text class="body" x="193" y="135">توضیح اگلی</text><text class="body" x="193" y="154">توقع بناتی ہے</text><text class="body" x="193" y="173"></text><path class="stroke-a" d="M 580 137H245" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M 240 137H570" marker-end="url(#arrow-a)"/><rect class="approach" x="265" y="250" width="205" height="70" rx="18"/><text class="sh" x="454" y="272">بدلنے والی وجہ</text><text class="small" x="454" y="290">دوبارہ کوشش، شاید انداز بدل کر</text><text class="small" x="454" y="307">آگے بڑھنے کا چکر</text><rect class="protect" x="35" y="250" width="200" height="70" rx="4"/><text class="sh" x="219" y="272">پکی وجہ</text><text class="small" x="219" y="290">کوشش کیوں؟</text><text class="small" x="219" y="307">بچاؤ کا چکر</text><path class="stroke-a" d="M 176 205C570 229 492 235 411 250" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M 85 205V250" marker-end="url(#arrow-a)"/><rect class="panel" x="255" y="355" width="240" height="70" rx="10"/><text class="sh" x="478" y="380">4. اگلی کوشش</text><text class="body" x="478" y="404">اگلی کوشش توقع کے مطابق آتی ہے</text><path class="stroke-a" d="M 369 320C402 337 385 342 369 355" marker-end="url(#arrow-a)"/><path class="stroke-a" d="M 135 320C607 346 547 347 481 355" marker-end="url(#arrow-a)"/><path class="stroke" d="M 495 390C102 418 12 315 84 185" marker-end="url(#arrow)"/><text class="small" x="680" y="328">اگلا نتیجہ</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
