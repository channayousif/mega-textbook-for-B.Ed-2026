<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of classroom management</title><desc id="d">A concept map of classroom management with four branches - prevention, routine, engagement and consistency - each with its classroom meaning, serving learning time, safety and participation, with space, routines, rules and relationships as inputs.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="14" y="14" width="470" height="52" rx="8"/><text class="sh" x="249" y="46" text-anchor="middle">serves: learning time, safety, participation</text><rect class="panel" x="14" y="404" width="470" height="52" rx="8"/><text class="sh" x="249" y="436" text-anchor="middle">inputs: space, routines, rules, relationships</text><g class="stroke"><path d="M249 66 L249 130"/><path d="M249 404 L249 340"/><path d="M200 235 L130 235"/><path d="M298 235 L368 235"/></g><ellipse class="ink" cx="249" cy="235" rx="112" ry="52" stroke="var(--ink)" stroke-width="2.5"/><text x="249" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">classroom</text><text x="249" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">management</text><rect class="panel" x="530" y="60" width="230" height="86" rx="10"/><text class="sh" x="645" y="86" text-anchor="middle">prevention</text><text class="body" x="645" y="108" text-anchor="middle">the easiest problems to solve</text><text class="body" x="645" y="128" text-anchor="middle">are the ones that do not happen</text><rect class="panel" x="530" y="192" width="230" height="86" rx="10"/><text class="sh" x="645" y="218" text-anchor="middle">routine</text><text class="body" x="645" y="240" text-anchor="middle">the start of the day decided</text><text class="body" x="645" y="260" text-anchor="middle">once, in September</text><rect class="panel" x="530" y="324" width="230" height="86" rx="10"/><text class="sh" x="645" y="350" text-anchor="middle">engagement</text><text class="body" x="645" y="372" text-anchor="middle">work that can be started and</text><text class="body" x="645" y="392" text-anchor="middle">finished grips better than orders</text><rect class="panel" x="20" y="192" width="230" height="86" rx="10"/><text class="sh" x="135" y="218" text-anchor="middle">consistency</text><text class="body" x="135" y="240" text-anchor="middle">the same response to the same</text><text class="body" x="135" y="260" text-anchor="middle">behaviour, every time</text><text class="small" x="135" y="380" text-anchor="middle">not silence: a working class,</text><text class="small" x="135" y="398" text-anchor="middle">visible in the books</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
