<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 664" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of classroom management</title><desc id="d">A concept map of classroom management with four branches - prevention, routine, engagement and consistency - each with its classroom meaning, serving learning time, safety and participation, with space, routines, rules and relationships as inputs, and a tagline: not silence - a working class, visible in the books.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="664"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-management-serves" class="link" x1="390" y1="264" x2="390" y2="80"/><line id="edge-management-inputs" class="link" x1="390" y1="356" x2="390" y2="540"/><path id="edge-management-prevention" class="link" d="M270 310C160 310 160 310 160 240"/><path id="edge-management-routine" class="link" d="M510 310C620 310 620 310 620 240"/><path id="edge-management-engagement" class="link" d="M270 310C160 310 160 310 160 380"/><path id="edge-management-consistency" class="link" d="M510 310C620 310 620 310 620 380"/></g><g id="layer-nodes"><g id="node-serves"><rect class="panel" x="200" y="20" width="380" height="60" rx="10"/><text class="sh" x="390" y="53" text-anchor="middle">serves: learning time, safety, participation</text></g><g id="node-management"><ellipse class="panel-a" cx="390" cy="310" rx="120" ry="46"/><text class="h" x="390" y="303" text-anchor="middle">classroom</text><text class="h" x="390" y="324" text-anchor="middle">management</text></g><g id="node-prevention"><rect class="panel" x="20" y="120" width="280" height="120" rx="10"/><text class="sh" x="160" y="162" text-anchor="middle">prevention</text><text class="body" x="160" y="185" text-anchor="middle">the easiest problems to solve</text><text class="body" x="160" y="204" text-anchor="middle">are the ones that do not happen</text></g><g id="node-routine"><rect class="panel" x="480" y="120" width="280" height="120" rx="10"/><text class="sh" x="620" y="162" text-anchor="middle">routine</text><text class="body" x="620" y="185" text-anchor="middle">the start of the day decided</text><text class="body" x="620" y="204" text-anchor="middle">once, in September</text></g><g id="node-engagement"><rect class="panel" x="20" y="380" width="280" height="120" rx="10"/><text class="sh" x="160" y="422" text-anchor="middle">engagement</text><text class="body" x="160" y="445" text-anchor="middle">work that can be started and</text><text class="body" x="160" y="464" text-anchor="middle">finished grips better than orders</text></g><g id="node-consistency"><rect class="panel" x="480" y="380" width="280" height="120" rx="10"/><text class="sh" x="620" y="422" text-anchor="middle">consistency</text><text class="body" x="620" y="445" text-anchor="middle">the same response to the same</text><text class="body" x="620" y="464" text-anchor="middle">behaviour, every time</text></g><g id="node-inputs"><rect class="panel" x="200" y="540" width="380" height="60" rx="10"/><text class="sh" x="390" y="573" text-anchor="middle">inputs: space, routines, rules, relationships</text></g></g><g id="layer-labels"><text id="label-tagline" class="small" x="20" y="634" text-anchor="start">not silence: a working class, visible in the books</text><text aria-hidden="true" class="wm" x="768" y="654" text-anchor="end">textbook.com.pk</text></g></svg>
