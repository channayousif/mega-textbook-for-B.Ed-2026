<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ حصے اور پہلے ہفتے کے اقدام</title><desc id="d">مثبت تعلیمی ماحول کے پانچ حصوں کا جدول: جسمانی جگہ، معمول، تعلقات، شراکت کی رسمیں اور تاثرات، ہر ایک کے ساتھ اس کی شکل اور پہلے ہفتے کا ایک اقدام۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 628 14V426M436 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="698" y="48" text-anchor="middle">حصہ</text><text class="h" x="486" y="40" text-anchor="middle">کیسا</text><text class="h" x="486" y="60" text-anchor="middle">دکھتا ہے</text><text class="h" x="178" y="40" text-anchor="middle">پہلے ہفتے کا</text><text class="h" x="178" y="60" text-anchor="middle">ایک اقدام</text><text class="sh" x="698" y="112" text-anchor="middle">جسمانی جگہ</text><text class="body" x="616" y="98" text-anchor="end">ہر میز بورڈ دیکھ سکے؛ دیوار</text><text class="body" x="616" y="118" text-anchor="end">شاگردوں کا کام دکھائے</text><text class="body" x="332" y="98" text-anchor="end">دید کے لیے بیٹھنا؛ پہلے ہفتے میں</text><text class="body" x="332" y="118" text-anchor="end">شاگردوں کا ایک کام دیوار پر</text><text class="sh" x="698" y="196" text-anchor="middle">معمول</text><text class="body" x="616" y="182" text-anchor="end">دن کی شکل شاگرد</text><text class="body" x="616" y="202" text-anchor="end">جان سکیں</text><text class="body" x="332" y="182" text-anchor="end">8:05 مشق سے سکھائیں،</text><text class="body" x="332" y="202" text-anchor="end">اعلان سے نہیں</text><text class="sh" x="698" y="280" text-anchor="middle">تعلقات</text><text class="body" x="616" y="266" text-anchor="end">نام سے سلام؛ ضرورت</text><text class="body" x="616" y="286" text-anchor="end">سے پہلے جانا پہچانا</text><text class="body" x="332" y="266" text-anchor="end">پہلے دن بیٹھنے کا نقشہ؛</text><text class="body" x="332" y="286" text-anchor="end">دروازے پر سلام</text><text class="sh" x="698" y="352" text-anchor="middle">شراکت</text><text class="sh" x="698" y="370" text-anchor="middle">رسمیں</text><text class="body" x="616" y="350" text-anchor="end">بے یقینی میں بھی ہاتھ اٹھیں؛</text><text class="body" x="616" y="370" text-anchor="end">غلط جواب پر کام ہو</text><text class="body" x="332" y="350" text-anchor="end">پہلا غلط جواب اسی طرح دیں</text><text class="body" x="332" y="370" text-anchor="end">جیسے سب کا دیا جانا چاہتے ہیں</text><text class="sh" x="698" y="414" text-anchor="middle">تاثرات</text><text class="body" x="616" y="410" text-anchor="end">اگلا مرحلہ، فیصلہ نہیں</text><text class="body" x="332" y="410" text-anchor="end">پہلا کام صرف اگلے مرحلے کے لیے چیک کریں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
