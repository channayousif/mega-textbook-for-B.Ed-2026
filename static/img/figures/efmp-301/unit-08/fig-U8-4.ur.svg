<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ حصے اور پہلے ہفتے کے اقدام</title><desc id="d">مثبت تعلیمی ماحول کے پانچ حصوں کا جدول: جسمانی جگہ، معمولات، تعلقات، شرکت کے اصول اور بازخورد: ہر ایک کے ساتھ وہ کیسا دکھتا ہے اور ایک پہلا ہفتہ والا اقدام۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="470" rx="10"/><path id="region-header" class="head" d="M759 30 Q759 21 750 21 H30 Q21 21 21 30 V80 H759 Z"/><path id="region-grid" class="grid" d="M610 20 V490 M320 20 V490 M760 160 H20 M760 240 H20 M760 320 H20 M760 410 H20"/><line class="rule" x1="760" y1="80" x2="20" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="685" y="53" text-anchor="middle">حصہ</text><text class="h" x="598" y="53" text-anchor="end">کیسا دکھتا ہے</text><text class="h" x="308" y="53" text-anchor="end">پہلے ہفتے کا ایک اقدام</text></g><g id="node-space"><text class="sh" x="685" y="123" text-anchor="middle">جسمانی جگہ</text><text class="cell" x="598" y="110" text-anchor="end">ہر میز بورڈ دیکھ سکے؛ دیوار</text><text class="cell" x="598" y="135" text-anchor="end">شاگردوں کا کام دکھائے</text><text class="cell" x="308" y="110" text-anchor="end">دید کے لیے بیٹھنا؛ پہلے ہفتے میں</text><text class="cell" x="308" y="135" text-anchor="end">شاگردوں کا ایک کام دیوار پر</text></g><g id="node-routines"><text class="sh" x="685" y="203" text-anchor="middle">معمول</text><text class="cell" x="598" y="190" text-anchor="end">دن کی شکل شاگرد</text><text class="cell" x="598" y="215" text-anchor="end">جان سکیں</text><text class="cell" x="308" y="190" text-anchor="end">8:05 مشق سے سکھائیں،</text><text class="cell" x="308" y="215" text-anchor="end">اعلان سے نہیں</text></g><g id="node-relationships"><text class="sh" x="685" y="283" text-anchor="middle">تعلقات</text><text class="cell" x="598" y="270" text-anchor="end">نام سے سلام؛ ضرورت</text><text class="cell" x="598" y="295" text-anchor="end">سے پہلے جانا پہچانا</text><text class="cell" x="308" y="270" text-anchor="end">پہلے دن بیٹھنے کا نقشہ؛</text><text class="cell" x="308" y="295" text-anchor="end">دروازے پر سلام</text></g><g id="node-norms"><text class="sh" x="685" y="355" text-anchor="middle">شراکت</text><text class="sh" x="685" y="381" text-anchor="middle">رسمیں</text><text class="cell" x="598" y="355" text-anchor="end">بے یقینی میں بھی ہاتھ اٹھیں؛</text><text class="cell" x="598" y="380" text-anchor="end">غلط جواب پر کام ہو</text><text class="cell" x="308" y="355" text-anchor="end">پہلا غلط جواب اسی طرح دیں</text><text class="cell" x="308" y="380" text-anchor="end">جیسے سب کا دیا جانا چاہتے ہیں</text></g><g id="node-feedback"><text class="sh" x="685" y="453" text-anchor="middle">تاثرات</text><text class="cell" x="598" y="440" text-anchor="end">اگلا مرحلہ،</text><text class="cell" x="598" y="465" text-anchor="end">فیصلہ نہیں</text><text class="cell" x="308" y="440" text-anchor="end">پہلا کام صرف اگلے مرحلے</text><text class="cell" x="308" y="465" text-anchor="end">کے لیے چیک کریں</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="520" text-anchor="start">textbook.com.pk</text></g></svg>
