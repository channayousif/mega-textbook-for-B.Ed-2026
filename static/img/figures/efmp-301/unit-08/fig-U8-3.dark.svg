<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 562" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A floor plan of a positive learning environment</title><desc id="d">A floor plan of a positive learning environment with four zones around a centre: physical space, routines, relationships and participation norms, with feedback at the centre.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="562"/><g id="layer-regions"><rect id="region-room" class="frame" x="40" y="60" width="700" height="440" rx="10"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-space"><rect class="panel" x="60" y="80" width="300" height="170" rx="10"/><text class="sh" x="210" y="118" text-anchor="middle">physical space</text><text class="cell" x="210" y="140" text-anchor="middle">desks that see the board; a wall</text><text class="cell" x="210" y="158" text-anchor="middle">that shows pupils' own work</text><rect class="icon" x="150" y="189.60000000000002" width="120" height="24"/><line class="icon" x1="174" y1="189.60000000000002" x2="174" y2="213.60000000000002"/><line class="icon" x1="198" y1="189.60000000000002" x2="198" y2="213.60000000000002"/><line class="icon" x1="222" y1="189.60000000000002" x2="222" y2="213.60000000000002"/><line class="icon" x1="246" y1="189.60000000000002" x2="246" y2="213.60000000000002"/></g><g id="node-routines"><rect class="panel" x="420" y="80" width="300" height="170" rx="10"/><text class="sh" x="570" y="118" text-anchor="middle">routines</text><text class="cell" x="570" y="140" text-anchor="middle">the day starts the same way;</text><text class="cell" x="570" y="158" text-anchor="middle">the 8:05 knowable by pupils</text><circle class="icon" cx="570" cy="201.60000000000002" r="14"/><path class="icon" d="M570 201.60000000000002V192.60000000000002M570 201.60000000000002H577"/></g><g id="node-relationships"><rect class="panel" x="60" y="310" width="300" height="170" rx="10"/><text class="sh" x="210" y="370" text-anchor="middle">relationships</text><text class="cell" x="210" y="392" text-anchor="middle">greeted by name; known by the</text><text class="cell" x="210" y="410" text-anchor="middle">teacher before ever needed</text><circle class="icon" cx="192" cy="441" r="7"/><path class="icon" d="M180 461Q192 445 204 461"/><circle class="icon" cx="228" cy="441" r="7"/><path class="icon" d="M216 461Q228 445 240 461"/></g><g id="node-norms"><rect class="panel" x="420" y="310" width="300" height="170" rx="10"/><text class="sh" x="570" y="370" text-anchor="middle">participation norms</text><text class="cell" x="570" y="392" text-anchor="middle">hands go up even when unsure;</text><text class="cell" x="570" y="410" text-anchor="middle">wrong answers worked with</text><path class="icon" d="M570 461V441M564 445L570 435L576 445"/></g><g id="node-feedback"><rect class="panel-a" x="290" y="240" width="200" height="80" rx="10"/><text class="h" x="390" y="273" text-anchor="middle">feedback</text><text class="cell" x="390" y="295" text-anchor="middle">the next step, not a verdict</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="390" y="38" text-anchor="middle">A positive learning environment, drawn as one room</text><text id="label-caption" class="small" x="390" y="530" text-anchor="middle">Four zones around one centre: every part can be built, starved or broken.</text><text aria-hidden="true" class="wm" x="768" y="552" text-anchor="end">textbook.com.pk</text></g></svg>
