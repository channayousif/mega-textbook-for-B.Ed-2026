<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار عام رویے اور ان کا پہلا جواب</title><desc id="d">چار عام رویوں کا جدول: بلند آواز میں بولنا، سیٹ سے باہر، کام سے انکار اور لڑائی، ہر ایک کے ساتھ اس کی ممکنہ کارکردگی، پہلا جواب، اور کیا سے بچنا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:12.5px;font-weight:700;fill:var(--ink)}.sh{font-size:12px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 648 14V426M420 14V426M204 14V426M12 74H768M12 168H768M12 262H768M12 356H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="708" y="48" text-anchor="middle">جو دکھتا ہے</text><text class="h" x="534" y="40" text-anchor="middle">ممکنہ</text><text class="h" x="534" y="60" text-anchor="middle">کارکردگی</text><text class="h" x="312" y="40" text-anchor="middle">پہلا</text><text class="h" x="312" y="60" text-anchor="middle">جواب</text><text class="h" x="108" y="40" text-anchor="middle">کیا سے</text><text class="h" x="108" y="60" text-anchor="middle">بچنا ہے</text><text class="sh" x="708" y="112" text-anchor="middle">بلند آواز میں</text><text class="body" x="636" y="102" text-anchor="end">سب سے پہلے سنے جانے کے لیے،</text><text class="body" x="636" y="122" text-anchor="end">سوچ جاتے ہوئے</text><text class="body" x="408" y="102" text-anchor="end">قربت، پھر ذاتی بات؛</text><text class="body" x="408" y="122" text-anchor="end">باری کا قاعدہ</text><text class="body" x="192" y="102" text-anchor="end">شاگرد کا نام</text><text class="body" x="192" y="122" text-anchor="end">پوری جماعت کے سامنے</text><text class="sh" x="708" y="206" text-anchor="middle">سیٹ سے باہر</text><text class="body" x="636" y="196" text-anchor="end">کام کی پکڑ نہیں یا</text><text class="body" x="636" y="216" text-anchor="end">پہلا مرحلہ نہیں</text><text class="body" x="408" y="196" text-anchor="end">کام کا آغاز جانچیں؛</text><text class="body" x="408" y="216" text-anchor="end">ایسا کام جس میں چلنا پڑے</text><text class="body" x="192" y="196" text-anchor="end">پوری جماعت کو</text><text class="body" x="192" y="216" text-anchor="end">ڈانٹ</text><text class="sh" x="708" y="300" text-anchor="middle">کام سے انکار</text><text class="body" x="636" y="290" text-anchor="end">یقینی ناکامی، یا</text><text class="body" x="636" y="310" text-anchor="end">بچاؤ کا چکر</text><text class="body" x="408" y="290" text-anchor="end">گم شدہ مرحلہ ڈھونڈیں؛</text><text class="body" x="408" y="310" text-anchor="end">انتخاب، الٹی میٹم نہیں</text><text class="body" x="192" y="290" text-anchor="end">سب کے سامنے</text><text class="body" x="192" y="310" text-anchor="end">الٹی میٹم</text><text class="sh" x="708" y="394" text-anchor="middle">لڑائی</text><text class="body" x="636" y="384" text-anchor="end">بحث کا کوئی اور</text><text class="body" x="636" y="404" text-anchor="end">راستہ نہ تھا</text><text class="body" x="408" y="384" text-anchor="end">پرسکون الگ کریں؛ ریکارڈ</text><text class="body" x="408" y="404" text-anchor="end">اور ساتھ والدین سے ملاقات</text><text class="body" x="192" y="384" text-anchor="end">سب کے سامنے پوچھنا کس نے</text><text class="body" x="192" y="404" text-anchor="end">شروع کی</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
