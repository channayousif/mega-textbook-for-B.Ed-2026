<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four common behaviours</title><desc id="d">A table of four common behaviours - calling out, out of seat, work refusal and fighting - each against a likely function, the first response, and what to avoid.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="380" rx="10"/><path id="region-header" class="head" d="M21 30Q21 21 30 21H750Q759 21 759 30V80H21Z"/><path id="region-grid" class="grid" d="M160 20V400M350 20V400M590 20V400M20 160H760M20 240H760M20 320H760"/><line class="rule" x1="20" y1="80" x2="760" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="90" y="54" text-anchor="middle">what you see</text><text class="h" x="172" y="54" text-anchor="start">a likely function</text><text class="h" x="362" y="54" text-anchor="start">first response</text><text class="h" x="602" y="54" text-anchor="start">what to avoid</text></g><g id="node-calling-out"><text class="sh" x="90" y="123" text-anchor="middle">calling out</text><text class="cell" x="172" y="114" text-anchor="start">to be heard first,</text><text class="cell" x="172" y="132" text-anchor="start">before the thought goes</text><text class="cell" x="362" y="114" text-anchor="start">proximity, then the private</text><text class="cell" x="362" y="132" text-anchor="start">word; a turn rule</text><text class="cell" x="602" y="114" text-anchor="start">naming the pupil to</text><text class="cell" x="602" y="132" text-anchor="start">the room</text></g><g id="node-out-of-seat"><text class="sh" x="90" y="203" text-anchor="middle">out of seat</text><text class="cell" x="172" y="194" text-anchor="start">the task has no grip</text><text class="cell" x="172" y="212" text-anchor="start">or no first step</text><text class="cell" x="362" y="185" text-anchor="start">check the task's</text><text class="cell" x="362" y="203" text-anchor="start">startability; a job that</text><text class="cell" x="362" y="221" text-anchor="start">needs moving</text><text class="cell" x="602" y="203" text-anchor="start">whole-class scolding</text></g><g id="node-refusal"><text class="sh" x="90" y="283" text-anchor="middle">work refusal</text><text class="cell" x="172" y="274" text-anchor="start">guaranteed failure, or</text><text class="cell" x="172" y="292" text-anchor="start">the protect loop</text><text class="cell" x="362" y="274" text-anchor="start">find the missing step; the</text><text class="cell" x="362" y="292" text-anchor="start">choice, not the ultimatum</text><text class="cell" x="602" y="283" text-anchor="start">public ultimatum</text></g><g id="node-fighting"><text class="sh" x="90" y="363" text-anchor="middle">fighting</text><text class="cell" x="172" y="354" text-anchor="start">the argument had</text><text class="cell" x="172" y="372" text-anchor="start">nowhere else to go</text><text class="cell" x="362" y="354" text-anchor="start">separate calmly; the record</text><text class="cell" x="362" y="372" text-anchor="start">and the parent meeting with it</text><text class="cell" x="602" y="354" text-anchor="start">asking who started it</text><text class="cell" x="602" y="372" text-anchor="start">in front of everyone</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="430" text-anchor="end">textbook.com.pk</text></g></svg>
