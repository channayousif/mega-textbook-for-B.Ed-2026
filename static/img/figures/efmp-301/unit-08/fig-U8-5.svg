<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">An escalation ladder of five steps</title><desc id="d">An escalation ladder of five steps - proximity, the private word, the choice, the consequence, the parent meeting - each with the principle it serves, and a note that each step is tried before the next.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">The escalation ladder</text><path class="stroke" d="M120 400 L120 90" marker-end=""/><defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><path class="stroke" d="M120 400 L120 95" marker-end="url(#a5)"/><rect class="panel" x="160" y="70" width="440" height="56" rx="8"/><text class="sh" x="180" y="93">5. the parent meeting</text><text class="body" x="180" y="113">arrives with a record, not a mood - the relationship continues</text><rect class="panel" x="160" y="146" width="440" height="56" rx="8"/><text class="sh" x="180" y="169">4. the consequence</text><text class="body" x="180" y="189">stated before it is chosen, never invented in anger - logical, not arbitrary</text><rect class="panel" x="160" y="222" width="440" height="56" rx="8"/><text class="sh" x="180" y="245">3. the choice</text><text class="body" x="180" y="265">work now or at break, you decide - the pupil owns the decision</text><rect class="panel" x="160" y="298" width="440" height="56" rx="8"/><text class="sh" x="180" y="321">2. the private word</text><text class="body" x="180" y="341">at the desk, not to the room - dignity kept</text><rect class="panel" x="160" y="374" width="440" height="56" rx="8"/><text class="sh" x="180" y="397">1. proximity</text><text class="body" x="180" y="417">walk near, say nothing - the smallest intervention that works</text><text class="small" x="640" y="240">each step is tried</text><text class="small" x="640" y="260">before the next;</text><text class="small" x="640" y="280">going up is a choice,</text><text class="small" x="640" y="300">not a slip</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
