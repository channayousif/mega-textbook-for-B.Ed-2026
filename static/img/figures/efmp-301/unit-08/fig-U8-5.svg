<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">An escalation ladder of five steps</title><desc id="d">An escalation ladder of five steps - proximity, the private word, the choice, the consequence, the parent meeting - each with the principle it serves, and a note that each step is tried before the next.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="680"/><g id="layer-regions"><rect id="region-note" class="panel-b" x="80" y="580" width="680" height="60" rx="10"/></g><g id="layer-edges"><line id="edge-proximity-meeting" class="stroke" x1="40" y1="550" x2="40" y2="70" marker-end="url(#arrow)"/><line id="edge-proximity-principle" class="dash" x1="460" y1="510" x2="500" y2="510"/><line id="edge-word-principle" class="dash" x1="460" y1="410" x2="500" y2="410"/><line id="edge-choice-principle" class="dash" x1="460" y1="310" x2="500" y2="310"/><line id="edge-consequence-principle" class="dash" x1="460" y1="210" x2="500" y2="210"/><line id="edge-meeting-principle" class="dash" x1="460" y1="110" x2="500" y2="110"/></g><g id="layer-nodes"><g id="node-proximity"><rect class="panel" x="80" y="470" width="380" height="80" rx="10"/><text class="sh" x="96" y="502" text-anchor="start">1. proximity</text><text class="cell" x="96" y="524" text-anchor="start">walk near, say nothing</text></g><g id="node-proximity-principle"><rect class="panel-a" x="500" y="470" width="260" height="80" rx="10"/><text class="cell" x="630" y="504" text-anchor="middle">the smallest intervention that</text><text class="cell" x="630" y="522" text-anchor="middle">works</text></g><g id="node-word"><rect class="panel" x="80" y="370" width="380" height="80" rx="10"/><text class="sh" x="96" y="402" text-anchor="start">2. the private word</text><text class="cell" x="96" y="424" text-anchor="start">at the desk, not to the room</text></g><g id="node-word-principle"><rect class="panel-a" x="500" y="370" width="260" height="80" rx="10"/><text class="cell" x="630" y="413" text-anchor="middle">dignity kept</text></g><g id="node-choice"><rect class="panel" x="80" y="270" width="380" height="80" rx="10"/><text class="sh" x="96" y="302" text-anchor="start">3. the choice</text><text class="cell" x="96" y="324" text-anchor="start">work now or at break, you decide</text></g><g id="node-choice-principle"><rect class="panel-a" x="500" y="270" width="260" height="80" rx="10"/><text class="cell" x="630" y="313" text-anchor="middle">the pupil owns the decision</text></g><g id="node-consequence"><rect class="panel" x="80" y="170" width="380" height="80" rx="10"/><text class="sh" x="96" y="193" text-anchor="start">4. the consequence</text><text class="cell" x="96" y="215" text-anchor="start">stated before it is chosen,</text><text class="cell" x="96" y="233" text-anchor="start">never invented in anger</text></g><g id="node-consequence-principle"><rect class="panel-a" x="500" y="170" width="260" height="80" rx="10"/><text class="cell" x="630" y="213" text-anchor="middle">logical, not arbitrary</text></g><g id="node-meeting"><rect class="panel" x="80" y="70" width="380" height="80" rx="10"/><text class="sh" x="96" y="102" text-anchor="start">5. the parent meeting</text><text class="cell" x="96" y="124" text-anchor="start">arrives with a record, not a mood</text></g><g id="node-meeting-principle"><rect class="panel-a" x="500" y="70" width="260" height="80" rx="10"/><text class="cell" x="630" y="113" text-anchor="middle">the relationship continues</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="20" y="40" text-anchor="start">The escalation ladder</text><text class="cell" x="100" y="613" text-anchor="start">each step is tried before the next; going up is a choice, not a slip</text><text aria-hidden="true" class="wm" x="768" y="670" text-anchor="end">textbook.com.pk</text></g></svg>
