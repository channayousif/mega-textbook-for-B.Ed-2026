<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عروج کی سیڑھ</title><desc id="d">پانچ مرحلوں کی بڑھتی سیڑھی: قربت، نجی بات، انتخاب، نتیجہ، والدین کی میٹنگ: ہر ایک کے ساتھ وہ اصول جو وہ سہارا دیتا ہے، اور ایک نوٹ کہ ہر قدم اگلے سے پہلے آزمائی جاتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="680"/><g id="layer-regions"><rect id="region-note" class="panel-b" x="20" y="580" width="680" height="60" rx="10"/></g><g id="layer-edges"><line id="edge-proximity-meeting" class="stroke" x1="740" y1="550" x2="740" y2="70" marker-end="url(#arrow)"/><line id="edge-proximity-principle" class="dash" x1="320" y1="510" x2="280" y2="510"/><line id="edge-word-principle" class="dash" x1="320" y1="410" x2="280" y2="410"/><line id="edge-choice-principle" class="dash" x1="320" y1="310" x2="280" y2="310"/><line id="edge-consequence-principle" class="dash" x1="320" y1="210" x2="280" y2="210"/><line id="edge-meeting-principle" class="dash" x1="320" y1="110" x2="280" y2="110"/></g><g id="layer-nodes"><g id="node-proximity"><rect class="panel" x="320" y="470" width="380" height="80" rx="10"/><text class="sh" x="684" y="498" text-anchor="end">1. قربت</text><text class="cell" x="684" y="527" text-anchor="end">قریب چلیں، کچھ نہ کہیں</text></g><g id="node-proximity-principle"><rect class="panel-a" x="20" y="470" width="260" height="80" rx="10"/><text class="cell" x="150" y="513" text-anchor="middle">سب سے چھوٹا کارگر مداخلت</text></g><g id="node-word"><rect class="panel" x="320" y="370" width="380" height="80" rx="10"/><text class="sh" x="684" y="398" text-anchor="end">2. ذاتی بات</text><text class="cell" x="684" y="427" text-anchor="end">میز پر، پوری جماعت سے نہیں</text></g><g id="node-word-principle"><rect class="panel-a" x="20" y="370" width="260" height="80" rx="10"/><text class="cell" x="150" y="413" text-anchor="middle">عزت قائم</text></g><g id="node-choice"><rect class="panel" x="320" y="270" width="380" height="80" rx="10"/><text class="sh" x="684" y="298" text-anchor="end">3. انتخاب</text><text class="cell" x="684" y="327" text-anchor="end">ابھی یا وقفے میں، آپ فیصلہ کریں</text></g><g id="node-choice-principle"><rect class="panel-a" x="20" y="270" width="260" height="80" rx="10"/><text class="cell" x="150" y="313" text-anchor="middle">فیصلہ شاگرد کا</text></g><g id="node-consequence"><rect class="panel" x="320" y="170" width="380" height="80" rx="10"/><text class="sh" x="684" y="198" text-anchor="end">4. نتیجہ</text><text class="cell" x="684" y="227" text-anchor="end">چنے جانے سے پہلے بتایا جائے، غصے میں گھڑا نہ جائے</text></g><g id="node-consequence-principle"><rect class="panel-a" x="20" y="170" width="260" height="80" rx="10"/><text class="cell" x="150" y="213" text-anchor="middle">منطقی، من مانی نہیں</text></g><g id="node-meeting"><rect class="panel" x="320" y="70" width="380" height="80" rx="10"/><text class="sh" x="684" y="98" text-anchor="end">5. والدین سے ملاقات</text><text class="cell" x="684" y="127" text-anchor="end">ریکارڈ کے ساتھ آتی ہے، مزاج کے ساتھ نہیں</text></g><g id="node-meeting-principle"><rect class="panel-a" x="20" y="70" width="260" height="80" rx="10"/><text class="cell" x="150" y="113" text-anchor="middle">رشتہ جاری رہتا ہے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="40" text-anchor="end">عروج کی سیڑھ</text><text class="cell" x="680" y="613" text-anchor="end">ہر سیڑھ اگلی سے پہلے آزمائی جائے؛ اوپر جانا انتخاب ہے، سرپٹی نہیں</text><text aria-hidden="true" class="wm" x="12" y="670" text-anchor="start">textbook.com.pk</text></g></svg>
