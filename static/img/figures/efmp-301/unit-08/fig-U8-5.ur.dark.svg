<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عروج کی سیڑھ</title><desc id="d">عروج کی سیڑھ کے پانچ مرحلے: قربت، ذاتی بات، انتخاب، نتیجہ اور والدین سے ملاقات، ہر ایک کے ساتھ وہ اصول جو وہ نبھاتی ہے، اور یاد دہانی کہ ہر سیڑھ اگلی سے پہلے آزمائی جائے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">عروج کی سیڑھ</text><path class="stroke" d="M 660 400L 660 90" marker-end=""/><defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 780 0L 770 5L 780 10z" class="ink"/></marker></defs><path class="stroke" d="M 660 400L 660 95" marker-end="url(#a5)"/><rect class="panel" x="180" y="70" width="440" height="56" rx="8"/><text class="sh" x="600" y="93" text-anchor="end">5. والدین سے ملاقات</text><text class="body" x="600" y="113" text-anchor="end">ریکارڈ کے ساتھ آتی ہے، مزاج کے ساتھ نہیں - رشتہ جاری رہتا ہے</text><rect class="panel" x="180" y="146" width="440" height="56" rx="8"/><text class="sh" x="600" y="169" text-anchor="end">4. نتیجہ</text><text class="body" x="600" y="189" text-anchor="end">چنے جانے سے پہلے بتایا جائے، غصے میں گھڑا نہ جائے - منطقی، من مانی نہیں</text><rect class="panel" x="180" y="222" width="440" height="56" rx="8"/><text class="sh" x="600" y="245" text-anchor="end">3. انتخاب</text><text class="body" x="600" y="265" text-anchor="end">ابھی یا وقفے میں، آپ فیصلہ کریں - فیصلہ شاگرد کا</text><rect class="panel" x="180" y="298" width="440" height="56" rx="8"/><text class="sh" x="600" y="321" text-anchor="end">2. ذاتی بات</text><text class="body" x="600" y="341" text-anchor="end">میز پر، پوری جماعت سے نہیں - عزت قائم</text><rect class="panel" x="180" y="374" width="440" height="56" rx="8"/><text class="sh" x="600" y="397" text-anchor="end">1. قربت</text><text class="body" x="600" y="417" text-anchor="end">قریب چلیں، کچھ نہ کہیں - سب سے چھوٹا کارگر مداخلت</text><text class="small" x="140" y="240" text-anchor="end">ہر سیڑھ اگلی سے</text><text class="small" x="140" y="260" text-anchor="end">پہلے آزمائی جائے؛</text><text class="small" x="140" y="280" text-anchor="end">اوپر جانا انتخاب ہے،</text><text class="small" x="140" y="300" text-anchor="end">سرپٹی نہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
