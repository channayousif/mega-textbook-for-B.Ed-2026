<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">انتظام کے چار اصول</title><desc id="d">چار کاؤنٹرائزنگ اصولوں کا جدول: روک تھام، معمول، مشغولیت اور تسلسل: ہر ایک کے ساتھ وہ جماعت میں کیسا دکھتا ہے اور کیا اسے توڑتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="450"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="390" rx="10"/><path id="region-header" class="head" d="M759 30 Q759 21 750 21 H30 Q21 21 21 30 V90 H759 Z"/><path id="region-grid" class="grid" d="M620 20 V410 M320 20 V410 M760 170 H20 M760 250 H20 M760 330 H20"/><line class="rule" x1="760" y1="90" x2="20" y2="90"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="690" y="58" text-anchor="middle">اصول</text><text class="h" x="608" y="58" text-anchor="end">سندھ کی جماعت میں کیسا دکھتا ہے</text><text class="h" x="308" y="58" text-anchor="end">کیا اسے توڑتا ہے</text></g><g id="node-prevention"><text class="sh" x="690" y="133" text-anchor="middle">روک تھام</text><text class="cell" x="608" y="120" text-anchor="end">8:05 ستمبر میں طے شدہ؛</text><text class="cell" x="608" y="145" text-anchor="end">بیگ اور کتابیں گھنٹی سے پہلے</text><text class="cell" x="308" y="120" text-anchor="end">ایسا کام جو کوئی شروع نہ کر سکے؛</text><text class="cell" x="308" y="145" text-anchor="end">حاضری سبق کے بیچ میں</text></g><g id="node-routine"><text class="sh" x="690" y="213" text-anchor="middle">معمول</text><text class="cell" x="608" y="200" text-anchor="end">تاریخ اور عنوان، کل کے</text><text class="cell" x="608" y="225" text-anchor="end">سوالات بورڈ پر</text><text class="cell" x="308" y="200" text-anchor="end">ہر دن کا الگ آغاز،</text><text class="cell" x="308" y="225" text-anchor="end">مزاج کے مطابق</text></g><g id="node-engagement"><text class="sh" x="690" y="293" text-anchor="middle">مشغولیت</text><text class="cell" x="608" y="280" text-anchor="end">علاقے میں کام، نظر آنے والے</text><text class="cell" x="608" y="305" text-anchor="end">پہلے مرحلے کے ساتھ</text><text class="cell" x="308" y="280" text-anchor="end">ناقابلِ رسائی کام،</text><text class="cell" x="308" y="305" text-anchor="end">کوئی پہلا مرحلہ نہیں</text></g><g id="node-consistency"><text class="sh" x="690" y="373" text-anchor="middle">استقلال</text><text class="cell" x="608" y="360" text-anchor="end">ایک جیسے رویے کا ایک جیسا</text><text class="cell" x="608" y="385" text-anchor="end">جواب، ہر بار</text><text class="cell" x="308" y="360" text-anchor="end">قواعد مزاج یا شور سے</text><text class="cell" x="308" y="385" text-anchor="end">نافذ ہوں</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="440" text-anchor="start">textbook.com.pk</text></g></svg>
