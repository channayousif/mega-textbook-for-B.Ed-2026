<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">انتظام کے چار اصول</title><desc id="d">چار اصولوں کا جدول: روک تھام، معمول، مشغولیت اور استقلال، ہر ایک کے ساتھ سندھ کی جماعت میں اس کی مثال اور کیا اسے توڑتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 662 14V426M424 14V426M12 76H768M12 190H768M12 304H768"/><path class="ink" d="M 768 76H768V80H12z"/><text class="h" x="715" y="48" text-anchor="middle">اصول</text><text class="h" x="509" y="40" text-anchor="middle">سندھ کی جماعت میں</text><text class="h" x="509" y="60" text-anchor="middle">کیسا دکھتا ہے</text><text class="h" x="184" y="40" text-anchor="middle">کیا اسے</text><text class="h" x="184" y="60" text-anchor="middle">توڑتا ہے</text><text class="sh" x="715" y="120" text-anchor="middle">روک تھام</text><text class="body" x="650" y="106">8:05 ستمبر میں طے شدہ؛</text><text class="body" x="650" y="126">بیگ اور کتابیں گھنٹی سے پہلے</text><text class="body" x="344" y="106">ایسا کام جو کوئی شروع نہ کر سکے؛</text><text class="body" x="344" y="126">حاضری سبق کے بیچ میں</text><text class="sh" x="715" y="234" text-anchor="middle">معمول</text><text class="body" x="650" y="220">تاریخ اور عنوان، کل کے</text><text class="body" x="650" y="240">سوالات بورڈ پر</text><text class="body" x="344" y="220">ہر دن کا الگ آغاز،</text><text class="body" x="344" y="240">مزاج کے مطابق</text><text class="sh" x="715" y="348" text-anchor="middle">مشغولیت</text><text class="body" x="650" y="334">علاقے میں کام، نظر آنے والے</text><text class="body" x="650" y="354">پہلے مرحلے کے ساتھ</text><text class="body" x="344" y="334">ناقابلِ رسائی کام،</text><text class="body" x="344" y="354">کوئی پہلا مرحلہ نہیں</text><text class="sh" x="715" y="412" text-anchor="middle">استقلال</text><text class="body" x="650" y="398">ایک جیسے رویے کا ایک جیسا</text><text class="body" x="650" y="418">جواب، ہر بار</text><text class="body" x="344" y="398">قواعد مزاج یا شور سے</text><text class="body" x="344" y="418">نافذ ہوں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
