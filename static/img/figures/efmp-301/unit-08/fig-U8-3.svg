<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A floor plan of a positive learning environment</title><desc id="d">A floor plan of a positive learning environment with four zones around a centre: physical space, routines, relationships and participation norms, with feedback at the centre.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">A positive learning environment, drawn as one room</text><rect class="panel" x="60" y="70" width="660" height="340" rx="10"/><rect class="panel-a" x="90" y="100" width="280" height="120" rx="8"/><text class="sh" x="230" y="126" text-anchor="middle">physical space</text><text class="body" x="230" y="150" text-anchor="middle">desks that see the board; a wall</text><text class="body" x="230" y="170" text-anchor="middle">that shows pupils' own work</text><g class="grid"><rect x="150" y="182" width="160" height="26"/><line x1="175" y1="182" x2="175" y2="208"/><line x1="200" y1="182" x2="200" y2="208"/><line x1="225" y1="182" x2="225" y2="208"/><line x1="250" y1="182" x2="250" y2="208"/><line x1="275" y1="182" x2="275" y2="208"/></g><rect class="panel-b" x="410" y="100" width="280" height="120" rx="8"/><text class="sh" x="550" y="126" text-anchor="middle">routines</text><text class="body" x="550" y="150" text-anchor="middle">the day starts the same way;</text><text class="body" x="550" y="170" text-anchor="middle">the 8:05 knowable by pupils</text><circle class="grid" cx="550" cy="192" r="16"/><path class="ink" d="M550 182 v8 M550 202 v-6 M542 190 h16"/><rect class="panel-c" x="90" y="250" width="280" height="120" rx="8"/><text class="sh" x="230" y="276" text-anchor="middle">relationships</text><text class="body" x="230" y="300" text-anchor="middle">greeted by name; known by the</text><text class="body" x="230" y="320" text-anchor="middle">teacher before ever needed</text><circle class="grid" cx="212" cy="344" r="10"/><circle class="grid" cx="248" cy="344" r="10"/><rect class="panel-d" x="410" y="250" width="280" height="120" rx="8"/><text class="sh" x="550" y="276" text-anchor="middle">participation norms</text><text class="body" x="550" y="300" text-anchor="middle">hands go up even when unsure;</text><text class="body" x="550" y="320" text-anchor="middle">wrong answers worked with</text><path class="ink" d="M550 352 v-14 M544 344 l6 -8 l6 8"/><ellipse class="ink" cx="390" cy="235" rx="86" ry="40" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="231" text-anchor="middle" font-size="15" font-weight="700" fill="var(--bg)">feedback</text><text x="390" y="251" text-anchor="middle" font-size="12" fill="var(--bg)">the next step, not a verdict</text><text class="small" x="390" y="438" text-anchor="middle">Four zones around one centre: every part can be built, starved or broken.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
