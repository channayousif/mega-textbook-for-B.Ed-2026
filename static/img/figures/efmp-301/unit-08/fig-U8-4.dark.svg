<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the five parts and first-week moves</title><desc id="d">A table of the five parts of a positive learning environment - physical space, routines, relationships, participation norms and feedback - each against what it looks like and one first-week move.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:13.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M152 14V426M436 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="82" y="48" text-anchor="middle">part</text><text class="h" x="294" y="40" text-anchor="middle">what it</text><text class="h" x="294" y="60" text-anchor="middle">looks like</text><text class="h" x="602" y="40" text-anchor="middle">one first-week</text><text class="h" x="602" y="60" text-anchor="middle">move</text><text class="sh" x="82" y="112" text-anchor="middle">physical space</text><text class="body" x="164" y="98">every desk sees the board; the wall</text><text class="body" x="164" y="118">shows pupils' work</text><text class="body" x="448" y="98">seat for sight; one piece of pupil</text><text class="body" x="448" y="118">work up in week one</text><text class="sh" x="82" y="196" text-anchor="middle">routines</text><text class="body" x="164" y="182">the day's shape knowable</text><text class="body" x="164" y="202">by the pupils</text><text class="body" x="448" y="182">teach the 8:05 with practice,</text><text class="body" x="448" y="202">not announcement</text><text class="sh" x="82" y="280" text-anchor="middle">relationships</text><text class="body" x="164" y="266">greeted by name; known</text><text class="body" x="164" y="286">before needed</text><text class="body" x="448" y="266">a seating map on day one;</text><text class="body" x="448" y="286">the greeting at the door</text><text class="sh" x="82" y="352" text-anchor="middle">participation</text><text class="sh" x="82" y="370" text-anchor="middle">norms</text><text class="body" x="164" y="350">hands go up even when unsure;</text><text class="body" x="164" y="370">wrong answers worked with</text><text class="body" x="448" y="350">answer the first wrong answer the</text><text class="body" x="448" y="370">way you want all of them answered</text><text class="sh" x="82" y="414" text-anchor="middle">feedback</text><text class="body" x="164" y="410">the next step named, not a verdict</text><text class="body" x="448" y="410">mark the first work for the next step only</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
