<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the five parts and first-week moves</title><desc id="d">A table of the five parts of a positive learning environment - physical space, routines, relationships, participation norms and feedback - each against what it looks like and one first-week move.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="470" rx="10"/><path id="region-header" class="head" d="M21 30Q21 21 30 21H750Q759 21 759 30V80H21Z"/><path id="region-grid" class="grid" d="M170 20V490M460 20V490M20 160H760M20 240H760M20 320H760M20 410H760"/><line class="rule" x1="20" y1="80" x2="760" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="95" y="54" text-anchor="middle">part</text><text class="h" x="182" y="54" text-anchor="start">what it looks like</text><text class="h" x="472" y="54" text-anchor="start">one first-week move</text></g><g id="node-space"><text class="sh" x="95" y="123" text-anchor="middle">physical space</text><text class="cell" x="182" y="114" text-anchor="start">every desk sees the board; the</text><text class="cell" x="182" y="132" text-anchor="start">wall shows pupils' work</text><text class="cell" x="472" y="114" text-anchor="start">seat for sight; one piece of pupil</text><text class="cell" x="472" y="132" text-anchor="start">work up in week one</text></g><g id="node-routines"><text class="sh" x="95" y="203" text-anchor="middle">routines</text><text class="cell" x="182" y="194" text-anchor="start">the day's shape knowable</text><text class="cell" x="182" y="212" text-anchor="start">by the pupils</text><text class="cell" x="472" y="194" text-anchor="start">teach the 8:05 with practice,</text><text class="cell" x="472" y="212" text-anchor="start">not announcement</text></g><g id="node-relationships"><text class="sh" x="95" y="283" text-anchor="middle">relationships</text><text class="cell" x="182" y="274" text-anchor="start">greeted by name; known</text><text class="cell" x="182" y="292" text-anchor="start">before needed</text><text class="cell" x="472" y="274" text-anchor="start">a seating map on day one;</text><text class="cell" x="472" y="292" text-anchor="start">the greeting at the door</text></g><g id="node-norms"><text class="sh" x="95" y="359" text-anchor="middle">participation</text><text class="sh" x="95" y="378" text-anchor="middle">norms</text><text class="cell" x="182" y="359" text-anchor="start">hands go up even when unsure;</text><text class="cell" x="182" y="377" text-anchor="start">wrong answers worked with</text><text class="cell" x="472" y="359" text-anchor="start">answer the first wrong answer the</text><text class="cell" x="472" y="377" text-anchor="start">way you want all of them answered</text></g><g id="node-feedback"><text class="sh" x="95" y="453" text-anchor="middle">feedback</text><text class="cell" x="182" y="444" text-anchor="start">the next step named,</text><text class="cell" x="182" y="462" text-anchor="start">not a verdict</text><text class="cell" x="472" y="444" text-anchor="start">mark the first work for the</text><text class="cell" x="472" y="462" text-anchor="start">next step only</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="520" text-anchor="end">textbook.com.pk</text></g></svg>
