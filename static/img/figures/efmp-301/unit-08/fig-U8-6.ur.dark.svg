<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار عام رویے اور ان کا پہلا جواب</title><desc id="d">چار عام رویوں کا جدول: پکارنا، سیٹ سے باہر، کام سے انکار اور لڑائی: ہر ایک کے ساتھ ممکن فعل، پہلا جواب، اور کیا سے بچنا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="380" rx="10"/><path id="region-header" class="head" d="M759 30 Q759 21 750 21 H30 Q21 21 21 30 V80 H759 Z"/><path id="region-grid" class="grid" d="M620 20 V400 M430 20 V400 M190 20 V400 M760 160 H20 M760 240 H20 M760 320 H20"/><line class="rule" x1="760" y1="80" x2="20" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="690" y="53" text-anchor="middle">جو دکھتا ہے</text><text class="h" x="608" y="53" text-anchor="end">ممکنہ کارکردگی</text><text class="h" x="418" y="53" text-anchor="end">پہلا جواب</text><text class="h" x="178" y="53" text-anchor="end">کیا سے بچنا ہے</text></g><g id="node-calling-out"><text class="sh" x="690" y="123" text-anchor="middle">بلند آواز میں</text><text class="cell" x="608" y="110" text-anchor="end">سب سے پہلے سنے جانے کے لیے،</text><text class="cell" x="608" y="135" text-anchor="end">سوچ جاتے ہوئے</text><text class="cell" x="418" y="123" text-anchor="end">قربت، پھر ذاتی بات؛ باری کا قاعدہ</text><text class="cell" x="178" y="110" text-anchor="end">شاگرد کا نام پوری جماعت</text><text class="cell" x="178" y="135" text-anchor="end">کے سامنے</text></g><g id="node-out-of-seat"><text class="sh" x="690" y="203" text-anchor="middle">سیٹ سے باہر</text><text class="cell" x="608" y="190" text-anchor="end">کام کی پکڑ نہیں یا پہلا</text><text class="cell" x="608" y="215" text-anchor="end">مرحلہ نہیں</text><text class="cell" x="418" y="190" text-anchor="end">کام کا آغاز جانچیں؛ ایسا کام جس میں</text><text class="cell" x="418" y="215" text-anchor="end">چلنا پڑے</text><text class="cell" x="178" y="203" text-anchor="end">پوری جماعت کو ڈانٹ</text></g><g id="node-refusal"><text class="sh" x="690" y="283" text-anchor="middle">کام سے انکار</text><text class="cell" x="608" y="270" text-anchor="end">یقینی ناکامی، یا بچاؤ کا</text><text class="cell" x="608" y="295" text-anchor="end">چکر</text><text class="cell" x="418" y="270" text-anchor="end">گم شدہ مرحلہ ڈھونڈیں؛ انتخاب، الٹی</text><text class="cell" x="418" y="295" text-anchor="end">میٹم نہیں</text><text class="cell" x="178" y="283" text-anchor="end">سب کے سامنے الٹی میٹم</text></g><g id="node-fighting"><text class="sh" x="690" y="363" text-anchor="middle">لڑائی</text><text class="cell" x="608" y="350" text-anchor="end">بحث کا کوئی اور راستہ نہ</text><text class="cell" x="608" y="375" text-anchor="end">تھا</text><text class="cell" x="418" y="350" text-anchor="end">پرسکون الگ کریں؛ ریکارڈ اور ساتھ</text><text class="cell" x="418" y="375" text-anchor="end">والدین سے ملاقات</text><text class="cell" x="178" y="350" text-anchor="end">سب کے سامنے پوچھنا کس نے</text><text class="cell" x="178" y="375" text-anchor="end">شروع کی</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="12" y="430" text-anchor="start">textbook.com.pk</text></g></svg>
