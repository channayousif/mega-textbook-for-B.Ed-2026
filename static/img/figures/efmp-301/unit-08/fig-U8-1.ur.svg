<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعتی انتظام کا تصوری نقشہ</title><desc id="d">جماعتی انتظام کا تصوری نقشہ چار شاخوں کے ساتھ: روک تھام، معمول، مشغولیت اور استقلال، ہر ایک کا جماعتی مطلب، اوپر تعلمی وقت، تحفظ اور شراکت، نیچے جگہ، معمول، قواعد اور تعلقات بطور داخل۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="296" y="14" width="470" height="52" rx="8"/><text class="sh" x="531" y="46" text-anchor="middle">خدمت: تعلمی وقت، تحفظ، شراکت</text><rect class="panel" x="296" y="404" width="470" height="52" rx="8"/><text class="sh" x="531" y="436" text-anchor="middle">داخل: جگہ، معمول، قواعد، تعلقات</text><g class="stroke"><path d="M 531 66L 531 130"/><path d="M 531 404L 531 340"/><path d="M 580 235L 650 235"/><path d="M 482 235L 412 235"/></g><ellipse class="ink" cx="531" cy="235" rx="112" ry="52" stroke="var(--ink)" stroke-width="2.5"/><text x="531" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">جماعتی</text><text x="531" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">انتظام</text><rect class="panel" x="20" y="60" width="230" height="86" rx="10"/><text class="sh" x="135" y="86" text-anchor="middle">روک تھام</text><text class="body" x="135" y="108" text-anchor="middle">حل کرنے میں سب سے آسان</text><text class="body" x="135" y="128" text-anchor="middle">وہ مشکلیں ہیں جو پیش ہی نہیں آتیں</text><rect class="panel" x="20" y="192" width="230" height="86" rx="10"/><text class="sh" x="135" y="218" text-anchor="middle">معمول</text><text class="body" x="135" y="240" text-anchor="middle">دن کا آغاز ایک بار،</text><text class="body" x="135" y="260" text-anchor="middle">ستمبر میں طے شدہ</text><rect class="panel" x="20" y="324" width="230" height="86" rx="10"/><text class="sh" x="135" y="350" text-anchor="middle">مشغولیت</text><text class="body" x="135" y="372" text-anchor="middle">ایسا کام جو شروع اور مکمل</text><text class="body" x="135" y="392" text-anchor="middle">کیا جا سکے، حکم سے بہتر پکڑتا ہے</text><rect class="panel" x="530" y="192" width="230" height="86" rx="10"/><text class="sh" x="645" y="218" text-anchor="middle">استقلال</text><text class="body" x="645" y="240" text-anchor="middle">ایک جیسے رویے کا ایک جیسا</text><text class="body" x="645" y="260" text-anchor="middle">جواب، ہر بار</text><text class="small" x="645" y="380" text-anchor="middle">خاموشی نہیں: کام کرتے والی جماعت،</text><text class="small" x="645" y="398" text-anchor="middle">کاپیوں میں نظر آتی ہے</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
