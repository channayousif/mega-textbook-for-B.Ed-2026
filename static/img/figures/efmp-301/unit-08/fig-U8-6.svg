<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four common behaviours</title><desc id="d">A table of four common behaviours - calling out, out of seat, work refusal and fighting - each against a likely function, the first response, and what to avoid.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:13.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M132 14V426M360 14V426M576 14V426M12 74H768M12 168H768M12 262H768M12 356H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="72" y="48" text-anchor="middle">what you see</text><text class="h" x="246" y="40" text-anchor="middle">a likely</text><text class="h" x="246" y="60" text-anchor="middle">function</text><text class="h" x="468" y="40" text-anchor="middle">first</text><text class="h" x="468" y="60" text-anchor="middle">response</text><text class="h" x="672" y="40" text-anchor="middle">what to</text><text class="h" x="672" y="60" text-anchor="middle">avoid</text><text class="sh" x="72" y="112" text-anchor="middle">calling out</text><text class="body" x="144" y="102">to be heard first, before</text><text class="body" x="144" y="122">the thought goes</text><text class="body" x="372" y="102">proximity, then the private</text><text class="body" x="372" y="122">word; a turn rule</text><text class="body" x="588" y="102">naming the pupil</text><text class="body" x="588" y="122">to the room</text><text class="sh" x="72" y="206" text-anchor="middle">out of seat</text><text class="body" x="144" y="196">the task has no grip or</text><text class="body" x="144" y="216">no first step</text><text class="body" x="372" y="196">check the task's startability;</text><text class="body" x="372" y="216">a job that needs moving</text><text class="body" x="588" y="196">whole-class</text><text class="body" x="588" y="216">scolding</text><text class="sh" x="72" y="300" text-anchor="middle">work refusal</text><text class="body" x="144" y="290">guaranteed failure, or</text><text class="body" x="144" y="310">the protect loop</text><text class="body" x="372" y="290">find the missing step; the</text><text class="body" x="372" y="310">choice, not the ultimatum</text><text class="body" x="588" y="290">public</text><text class="body" x="588" y="310">ultimatum</text><text class="sh" x="72" y="394" text-anchor="middle">fighting</text><text class="body" x="144" y="384">the argument had</text><text class="body" x="144" y="404">nowhere else to go</text><text class="body" x="372" y="384">separate calmly; the record</text><text class="body" x="372" y="404">and the parent meeting with it</text><text class="body" x="588" y="384">asking who started it</text><text class="body" x="588" y="404">in front of everyone</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
