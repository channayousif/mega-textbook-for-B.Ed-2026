<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مثبت تعلیمی ماحول کا فرش نقشہ</title><desc id="d">مثبت تعلیمی ماحول کا فرش نقشہ: چار حصے ایک مرکز کے گرد - جسمانی جگہ، معمول، تعلقات اور شراکت کی رسمیں، اور بیچ میں تاثرات۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">مثبت تعلیمی ماحول، ایک کمرے کے طور پر</text><rect class="panel" x="60" y="70" width="660" height="340" rx="10"/><rect class="panel-a" x="410" y="100" width="280" height="120" rx="8"/><text class="sh" x="550" y="126" text-anchor="middle">جسمانی جگہ</text><text class="body" x="550" y="150" text-anchor="middle">میز جو بورڈ دیکھ سکیں؛ دیوار</text><text class="body" x="550" y="170" text-anchor="middle">جو شاگردوں کا اپنا کام دکھائے</text><g class="grid"><rect x="470" y="182" width="160" height="26"/><line x1="605" y1="182" x2="605" y2="208"/><line x1="580" y1="182" x2="580" y2="208"/><line x1="555" y1="182" x2="555" y2="208"/><line x1="530" y1="182" x2="530" y2="208"/><line x1="505" y1="182" x2="505" y2="208"/></g><rect class="panel-b" x="90" y="100" width="280" height="120" rx="8"/><text class="sh" x="230" y="126" text-anchor="middle">معمول</text><text class="body" x="230" y="150" text-anchor="middle">دن ایک ہی طرح شروع ہو؛</text><text class="body" x="230" y="170" text-anchor="middle">8:05 شاگردوں کے لیے جانا پہچانا</text><circle class="grid" cx="230" cy="192" r="16"/><path class="ink" d="M 230 182v8 M 230 202v-6 M 238 190h-16.0"/><rect class="panel-c" x="410" y="250" width="280" height="120" rx="8"/><text class="sh" x="550" y="276" text-anchor="middle">تعلقات</text><text class="body" x="550" y="300" text-anchor="middle">نام سے سلام؛ استاد انہیں</text><text class="body" x="550" y="320" text-anchor="middle">ضرورت سے پہلے جانتا ہو</text><circle class="grid" cx="568" cy="344" r="10"/><circle class="grid" cx="532" cy="344" r="10"/><rect class="panel-d" x="90" y="250" width="280" height="120" rx="8"/><text class="sh" x="230" y="276" text-anchor="middle">شراکت کی رسمیں</text><text class="body" x="230" y="300" text-anchor="middle">بے یقینی میں بھی ہاتھ اٹھیں؛</text><text class="body" x="230" y="320" text-anchor="middle">غلط جواب پر کام ہو</text><path class="ink" d="M 230 352v-14 M 236 344l -6-8 l -6 8"/><ellipse class="ink" cx="390" cy="235" rx="86" ry="40" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="231" text-anchor="middle" font-size="15" font-weight="700" fill="var(--bg)">تاثرات</text><text x="390" y="251" text-anchor="middle" font-size="12" fill="var(--bg)">اگلا مرحلہ، فیصلہ نہیں</text><text class="small" x="390" y="438" text-anchor="middle">ایک مرکز کے گرد چار حصے: ہر حصہ بنایا، بھوکا یا توڑا جا سکتا ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
