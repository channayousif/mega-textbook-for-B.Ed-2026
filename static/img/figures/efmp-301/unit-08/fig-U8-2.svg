<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the four management principles</title><desc id="d">A table of the four management principles - prevention, routine, engagement and consistency - each against what it looks like in a Sindh classroom and what breaks it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.icon{stroke:var(--ink);stroke-width:1.5;fill:none}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.frame{fill:var(--bg);stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="450"/><g id="layer-regions"><rect id="region-table" class="frame" x="20" y="20" width="740" height="390" rx="10"/><path id="region-header" class="head" d="M21 30Q21 21 30 21H750Q759 21 759 30V90H21Z"/><path id="region-grid" class="grid" d="M160 20V410M460 20V410M20 170H760M20 250H760M20 330H760"/><line class="rule" x1="20" y1="90" x2="760" y2="90"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="h" x="90" y="59" text-anchor="middle">principle</text><text class="h" x="172" y="48" text-anchor="start">what it looks like in a Sindh</text><text class="h" x="172" y="69" text-anchor="start">classroom</text><text class="h" x="472" y="59" text-anchor="start">what breaks it</text></g><g id="node-prevention"><text class="sh" x="90" y="133" text-anchor="middle">prevention</text><text class="cell" x="172" y="124" text-anchor="start">the 8:05 decided in September;</text><text class="cell" x="172" y="142" text-anchor="start">bags and books before the bell</text><text class="cell" x="472" y="124" text-anchor="start">the task nobody can start;</text><text class="cell" x="472" y="142" text-anchor="start">the register taken mid-lesson</text></g><g id="node-routine"><text class="sh" x="90" y="213" text-anchor="middle">routine</text><text class="cell" x="172" y="204" text-anchor="start">date and title, yesterday's</text><text class="cell" x="172" y="222" text-anchor="start">questions on the board</text><text class="cell" x="472" y="204" text-anchor="start">a different start every</text><text class="cell" x="472" y="222" text-anchor="start">day, by mood</text></g><g id="node-engagement"><text class="sh" x="90" y="293" text-anchor="middle">engagement</text><text class="cell" x="172" y="284" text-anchor="start">work in the zone with a</text><text class="cell" x="172" y="302" text-anchor="start">visible first step</text><text class="cell" x="472" y="284" text-anchor="start">unreachable tasks with</text><text class="cell" x="472" y="302" text-anchor="start">no first step</text></g><g id="node-consistency"><text class="sh" x="90" y="373" text-anchor="middle">consistency</text><text class="cell" x="172" y="364" text-anchor="start">the same response to the same</text><text class="cell" x="172" y="382" text-anchor="start">behaviour, every time</text><text class="cell" x="472" y="364" text-anchor="start">rules enforced by mood</text><text class="cell" x="472" y="382" text-anchor="start">or by volume</text></g></g><g id="layer-labels"><text aria-hidden="true" class="wm" x="768" y="440" text-anchor="end">textbook.com.pk</text></g></svg>
