<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of the four management principles</title><desc id="d">A table of the four management principles - prevention, routine, engagement and consistency - each against what it looks like in a Sindh classroom and what breaks it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M118 14V426M424 14V426M12 76H768M12 190H768M12 304H768"/><path class="ink" d="M12 76H768V80H12z"/><text class="h" x="65" y="48" text-anchor="middle">principle</text><text class="h" x="271" y="40" text-anchor="middle">what it looks like in a</text><text class="h" x="271" y="60" text-anchor="middle">Sindh classroom</text><text class="h" x="596" y="40" text-anchor="middle">what</text><text class="h" x="596" y="60" text-anchor="middle">breaks it</text><text class="sh" x="65" y="120" text-anchor="middle">prevention</text><text class="body" x="130" y="106">the 8:05 decided in September;</text><text class="body" x="130" y="126">bags and books before the bell</text><text class="body" x="436" y="106">the task nobody can start;</text><text class="body" x="436" y="126">the register taken mid-lesson</text><text class="sh" x="65" y="234" text-anchor="middle">routine</text><text class="body" x="130" y="220">date and title, yesterday's</text><text class="body" x="130" y="240">questions on the board</text><text class="body" x="436" y="220">a different start every</text><text class="body" x="436" y="240">day, by mood</text><text class="sh" x="65" y="348" text-anchor="middle">engagement</text><text class="body" x="130" y="334">work in the zone with a</text><text class="body" x="130" y="354">visible first step</text><text class="body" x="436" y="334">unreachable tasks with</text><text class="body" x="436" y="354">no first step</text><text class="sh" x="65" y="412" text-anchor="middle">consistency</text><text class="body" x="130" y="398">the same response to the same</text><text class="body" x="130" y="418">behaviour, every time</text><text class="body" x="436" y="398">rules enforced by mood</text><text class="body" x="436" y="418">or by volume</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
