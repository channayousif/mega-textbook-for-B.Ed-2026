<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">انتخاب کا فریم</title><desc id="d">انتخاب کے فریم کا خاکہ: اوپر مقصد، بیچ میں حدود، نیچے طریقہ، اور باریک تیر جو جانچتا ہے کہ چنا ہوا طریقہ اب بھی مقصد کی خدمت کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">انتخاب کا فریم: ایک فیصلہ، تین حصے</text><rect class="panel" x="90" y="66" width="600" height="82" rx="10"/><text class="sh" x="390" y="94" text-anchor="middle">1. مقصد</text><text class="body" x="390" y="116" text-anchor="middle">آخر تک شاگرد کیا کر سکنے چاہئے؟</text><text class="body" x="390" y="136" text-anchor="middle">فعل طریقے کے خاندان کا نام بتاتا ہے</text><rect class="panel" x="90" y="186" width="600" height="82" rx="10"/><text class="sh" x="390" y="214" text-anchor="middle">2. حدود</text><text class="body" x="390" y="236" text-anchor="middle">ساٹھ شاگرد، ایک بورڈ، چالیس منٹ، اس جماعت کے اصول</text><text class="body" x="390" y="256" text-anchor="middle">- وہ مواد جس میں ڈیزائن کام کرتا ہے</text><rect class="panel" x="90" y="306" width="600" height="82" rx="10"/><text class="sh" x="390" y="334" text-anchor="middle">3. طریقہ</text><text class="body" x="390" y="356" text-anchor="middle">آخر میں چنا جائے، مقصد کو</text><text class="body" x="390" y="376" text-anchor="middle">حدوں کے اندر فِٹ کرنے کے لیے</text><defs><marker id="a10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><g class="stroke"><path d="M 390 148L 390 186" marker-end="url(#a10)"/><path d="M 390 268L 390 306" marker-end="url(#a10)"/></g><path class="dash" d="M 90 347C 40 347 40 107 90 107" marker-end="url(#a10)"/><text class="small" x="40" y="230" text-anchor="middle">جانچ: کیا</text><text class="small" x="40" y="250" text-anchor="middle">چنا ہوا طریقہ</text><text class="small" x="40" y="270" text-anchor="middle">اب بھی مقصد</text><text class="small" x="40" y="290" text-anchor="middle">خدمت کرتا ہے؟</text><text class="small" x="390" y="430" text-anchor="middle">تین فیصلے نہیں: ایک فیصلہ، اسی ترتیب میں، پھر جانچا ہوا۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
