<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A diagram of the choosing frame</title><desc id="d">A diagram of the choosing frame: the purpose at the top, the constraints in the middle, the method at the bottom, with a dashed check arrow from the method back to the purpose.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">The choosing frame: one decision, three parts</text><rect class="panel" x="90" y="66" width="600" height="82" rx="10"/><text class="sh" x="390" y="94" text-anchor="middle">1. the purpose</text><text class="body" x="390" y="116" text-anchor="middle">what must pupils be able to DO by the end?</text><text class="body" x="390" y="136" text-anchor="middle">the verb names the method family</text><rect class="panel" x="90" y="186" width="600" height="82" rx="10"/><text class="sh" x="390" y="214" text-anchor="middle">2. the constraints</text><text class="body" x="390" y="236" text-anchor="middle">sixty pupils, one blackboard, forty minutes, this room's norms</text><text class="body" x="390" y="256" text-anchor="middle">- the material the design works in</text><rect class="panel" x="90" y="306" width="600" height="82" rx="10"/><text class="sh" x="390" y="334" text-anchor="middle">3. the method</text><text class="body" x="390" y="356" text-anchor="middle">chosen last, to fit the purpose</text><text class="body" x="390" y="376" text-anchor="middle">inside the constraints</text><defs><marker id="ar10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><g class="stroke"><path d="M390 148 L390 186" marker-end="url(#ar10)"/><path d="M390 268 L390 306" marker-end="url(#ar10)"/></g><path class="dash" d="M690 347 C740 347 740 107 690 107" marker-end="url(#ar10)"/><text class="small" x="740" y="230" text-anchor="middle">check: does</text><text class="small" x="740" y="250" text-anchor="middle">the method</text><text class="small" x="740" y="270" text-anchor="middle">still serve</text><text class="small" x="740" y="290" text-anchor="middle">purpose?</text><text class="small" x="390" y="430" text-anchor="middle">Not three decisions: one decision, taken in this order, and then checked.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
