<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of six teaching methods</title><desc id="d">A table of six teaching methods - lecture, demonstration, discussion, question-answer, group work and case study - each against what it is good for, what it demands, and one use named in the course guide.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:13px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:11px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="12" width="756" height="416" rx="8"/><path class="grid" d="M108 12V428M362 12V428M576 12V428M12 70H768M12 134H768M12 198H768M12 262H768M12 326H768M12 390H768"/><path class="ink" d="M12 70H768V74H12z"/><text class="h" x="60" y="42" text-anchor="middle">method</text><text class="h" x="235" y="34" text-anchor="middle">what it is</text><text class="h" x="235" y="54" text-anchor="middle">good for</text><text class="h" x="469" y="34" text-anchor="middle">what it</text><text class="h" x="469" y="54" text-anchor="middle">demands</text><text class="h" x="672" y="34" text-anchor="middle">one classroom</text><text class="h" x="672" y="54" text-anchor="middle">use</text><text class="sh" x="60" y="100" text-anchor="middle">lecture</text><text class="body" x="120" y="90">new ground covered fast;</text><text class="body" x="120" y="106">a shared framework</text><text class="body" x="374" y="90">listening stamina; the</text><text class="body" x="374" y="106">teacher's preparation</text><text class="body" x="588" y="90">introducing a new</text><text class="body" x="588" y="106">unit's map</text><text class="sh" x="60" y="164" text-anchor="middle">demonstration</text><text class="body" x="120" y="154">seeing the process; the</text><text class="body" x="120" y="170">surprise that hooks</text><text class="body" x="374" y="154">materials; visibility for</text><text class="body" x="374" y="170">sixty pupils</text><text class="body" x="588" y="154">the kettle and the</text><text class="body" x="588" y="170">cold plate</text><text class="sh" x="60" y="228" text-anchor="middle">discussion</text><text class="body" x="120" y="218">thinking aloud; hearing</text><text class="body" x="120" y="234">the room's ideas</text><text class="body" x="374" y="218">a question worth discussing;</text><text class="body" x="374" y="234">norms that keep talk safe</text><text class="body" x="588" y="218">the staff-room case</text><text class="body" x="588" y="234">argued openly</text><text class="sh" x="60" y="292" text-anchor="middle">question-</text><text class="sh" x="60" y="308" text-anchor="middle">answer</text><text class="body" x="120" y="282">checking understanding;</text><text class="body" x="120" y="298">stepwise thinking visible</text><text class="body" x="374" y="282">questions beyond yes</text><text class="body" x="374" y="298">and no; the pause</text><text class="body" x="588" y="282">the guided practice</text><text class="body" x="588" y="298">of a new skill</text><text class="sh" x="60" y="356" text-anchor="middle">group work</text><text class="body" x="120" y="346">rehearsal of ideas; social</text><text class="body" x="120" y="362">construction of understanding</text><text class="body" x="374" y="346">a task that needs the group;</text><text class="body" x="374" y="362">roles; monitoring</text><text class="body" x="588" y="346">the sealed-jar</text><text class="body" x="588" y="362">investigation</text><text class="sh" x="60" y="420" text-anchor="middle">case study</text><text class="body" x="120" y="410">analysis on real material;</text><text class="body" x="120" y="426">transfer to a real situation</text><text class="body" x="374" y="410">a real case; time</text><text class="body" x="374" y="426">to work it</text><text class="body" x="588" y="410">the two-schools</text><text class="body" x="588" y="426">case of Unit 7</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
