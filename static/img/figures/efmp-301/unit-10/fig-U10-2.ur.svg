<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">انتخاب کا فریم</title><desc id="d">انتخاب کے فریم کا خاکہ: اوپر مقصد، بیچ میں حدود، نیچے طریقہ، اور باریک تیر جو جانچتا ہے کہ چنا ہوا طریقہ اب بھی مقصد کی خدمت کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">انتخاب کا فریم: ایک فیصلہ، تین حصے</text><rect class="panel" x="90" y="66" width="600" height="82" rx="10"/><text class="sh" x="390" y="94" text-anchor="middle">1. مقصد</text><text class="body" x="390" y="116" text-anchor="middle">آخر تک شاگرد کیا کر سکنے چاہئے؟</text><text class="body" x="390" y="136" text-anchor="middle">فعل طریقے کے خاندان کا نام بتاتا ہے</text><rect class="panel" x="90" y="186" width="600" height="82" rx="10"/><text class="sh" x="390" y="214" text-anchor="middle">2. حدود</text><text class="body" x="390" y="236" text-anchor="middle">ساٹھ شاگرد، ایک بورڈ، چالیس منٹ، اس جماعت کے اصول</text><text class="body" x="390" y="256" text-anchor="middle">- وہ مواد جس میں ڈیزائن کام کرتا ہے</text><rect class="panel" x="90" y="306" width="600" height="82" rx="10"/><text class="sh" x="390" y="334" text-anchor="middle">3. طریقہ</text><text class="body" x="390" y="356" text-anchor="middle">آخر میں چنا جائے، مقصد کو</text><text class="body" x="390" y="376" text-anchor="middle">حدوں کے اندر فِٹ کرنے کے لیے</text><defs><marker id="a10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 780 0L 770 5L 780 10z" class="ink"/></marker></defs><g class="stroke"><path d="M 390 148L 390 186" marker-end="url(#a10)"/><path d="M 390 268L 390 306" marker-end="url(#a10)"/></g><path class="dash" d="M 90 347C 40 347 40 107 90 107" marker-end="url(#a10)"/><text class="small" x="40" y="230" text-anchor="middle">جانچ: کیا</text><text class="small" x="40" y="250" text-anchor="middle">چنا ہوا طریقہ</text><text class="small" x="40" y="270" text-anchor="middle">اب بھی مقصد</text><text class="small" x="40" y="290" text-anchor="middle">کی خدمت کرتا ہے؟</text><text class="small" x="390" y="430" text-anchor="middle">تین فیصلے نہیں: ایک فیصلہ، اسی ترتیب میں، پھر جانچا ہوا۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
