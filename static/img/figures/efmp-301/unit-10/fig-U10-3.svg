<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of backward design</title><desc id="d">A flowchart of backward design: the outcome at the top, the evidence second, the activity third, with a dashed forward-check arrow from the activity back to the outcome.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:15px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">Backward design: outcome, evidence, activity</text><rect class="panel" x="90" y="66" width="600" height="82" rx="10"/><text class="sh" x="390" y="94" text-anchor="middle">1. the outcome</text><text class="body" x="390" y="116" text-anchor="middle">what must pupils be able to DO by the end?</text><text class="body" x="390" y="136" text-anchor="middle">one sentence, a verb, a criterion</text><rect class="panel" x="90" y="186" width="600" height="82" rx="10"/><text class="sh" x="390" y="214" text-anchor="middle">2. the evidence</text><text class="body" x="390" y="236" text-anchor="middle">what would show the outcome is met?</text><text class="body" x="390" y="256" text-anchor="middle">the assessment designed before the activity, not after</text><rect class="panel" x="90" y="306" width="600" height="82" rx="10"/><text class="sh" x="390" y="334" text-anchor="middle">3. the activity</text><text class="body" x="390" y="356" text-anchor="middle">chosen to produce the evidence</text><text class="body" x="390" y="376" text-anchor="middle">- warm-up, explain, practise, close</text><defs><marker id="ar103" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><g class="stroke"><path d="M390 148 L390 186" marker-end="url(#ar103)"/><path d="M390 268 L390 306" marker-end="url(#ar103)"/></g><path class="dash" d="M690 347 C740 347 740 107 690 107" marker-end="url(#ar103)"/><text class="small" x="740" y="210" text-anchor="middle">the forward check:</text><text class="small" x="740" y="230" text-anchor="middle">does this activity</text><text class="small" x="740" y="250" text-anchor="middle">produce that evidence</text><text class="small" x="740" y="270" text-anchor="middle">for that outcome?</text><text class="small" x="390" y="430" text-anchor="middle">If the check fails, the activity changes - the outcome does not.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
