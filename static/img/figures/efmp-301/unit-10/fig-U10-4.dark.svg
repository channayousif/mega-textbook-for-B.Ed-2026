<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of five observable practices</title><desc id="d">A table of five observable practices of effective teaching, each against what it looks like and the unit of this course that taught it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:13px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M212 14V426M544 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="112" y="48" text-anchor="middle">observable practice</text><text class="h" x="378" y="40" text-anchor="middle">what it</text><text class="h" x="378" y="60" text-anchor="middle">looks like</text><text class="h" x="656" y="40" text-anchor="middle">the unit that</text><text class="h" x="656" y="60" text-anchor="middle">taught it</text><text class="sh" x="112" y="112" text-anchor="middle">plans backward</text><text class="body" x="224" y="102">the outcome sentence before</text><text class="body" x="224" y="122">the activity list</text><text class="body" x="556" y="112" text-anchor="middle">this unit</text><text class="sh" x="112" y="196" text-anchor="middle">runs the formative cycle</text><text class="body" x="224" y="186">elicits, interprets, acts,</text><text class="body" x="224" y="206">days not weeks</text><text class="body" x="556" y="196" text-anchor="middle">Unit 9</text><text class="sh" x="112" y="280" text-anchor="middle">aims attention, fits the load</text><text class="body" x="224" y="270">one demand at a time;</text><text class="body" x="224" y="290">steps made external</text><text class="body" x="556" y="280" text-anchor="middle">Unit 4</text><text class="sh" x="112" y="364" text-anchor="middle">feeds the three needs,</text><text class="sh" x="112" y="382" text-anchor="middle">keeps dignity</text><text class="body" x="224" y="354">choice, visible progress, the greeting,</text><text class="body" x="224" y="374">the private word</text><text class="body" x="556" y="364" text-anchor="middle">Units 6 and 8</text><text class="small" x="224" y="414">reads pupils developmentally: where is this pupil, and what is the next step</text><text class="body" x="556" y="414" text-anchor="middle">Unit 2</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
