<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">افادیت کی پانچ دکھی جانے والی مشقیں</title><desc id="d">افادیت کی پانچ مشقوں کا جدول: ہر ایک کے ساتھ وہ کیسا دکھتی ہے اور کورس کا وہ یونٹ جس نے اسے سکھایا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:12.5px;font-weight:700;fill:var(--ink)}.sh{font-size:11.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 568 14V426M544 14V426M12 74H768M12 158H768M12 242H768M12 326H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="668" y="48" text-anchor="middle">دیکھی جانے والی مشق</text><text class="h" x="402" y="40" text-anchor="middle">کیسا</text><text class="h" x="402" y="60" text-anchor="middle">دکھتی ہے</text><text class="h" x="124" y="40" text-anchor="middle">وہ یونٹ جس</text><text class="h" x="124" y="60" text-anchor="middle">نے سکھایا</text><text class="sh" x="668" y="112" text-anchor="middle">الٹی منصوبہ بندی</text><text class="body" x="556" y="102">نتیجے کا جملہ سرگرمیوں</text><text class="body" x="556" y="122">کی فہرست سے پہلے</text><text class="body" x="224" y="112" text-anchor="middle">یہی یونٹ</text><text class="sh" x="668" y="196" text-anchor="middle">تشکیلی چکر چلاتی ہے</text><text class="body" x="556" y="186">شہادت، تشریح، عمل،</text><text class="body" x="556" y="206">دن نہ کہ ہفتے</text><text class="body" x="224" y="196" text-anchor="middle">یونٹ 9</text><text class="sh" x="668" y="280" text-anchor="middle">توجہ لگاتی، بوجھ سنبھالتی</text><text class="body" x="556" y="270">ایک وقت میں ایک تقاضا؛</text><text class="body" x="556" y="290">مرحلے باہر لکھے ہوئے</text><text class="body" x="224" y="280" text-anchor="middle">یونٹ 4</text><text class="sh" x="668" y="364" text-anchor="middle">تین ضرورتیں پوری کرتی،</text><text class="sh" x="668" y="382" text-anchor="middle">عزت رکھتی</text><text class="body" x="556" y="354">انتخاب، دکھنے والی پیش رفت، سلام،</text><text class="body" x="556" y="374">ذاتی بات</text><text class="body" x="224" y="364" text-anchor="middle">یونٹ 6 اور 8</text><text class="small" x="556" y="414">نشوونما کی نظر سے پڑھتی: یہ شاگرد کہاں ہے، اور اگلا مرحلہ کیا ہے</text><text class="body" x="224" y="414" text-anchor="middle">یونٹ 2</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
