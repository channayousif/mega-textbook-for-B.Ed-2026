<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">تعلیمی نفسیات کیسے ایک شعبہ بنی</title><desc id="d">پانچ مرحلوں کی ایک بائیں سے دائیں ٹائم لائن جو دکھاتی ہے کہ تعلیمی نفسیات کیسے صرف تجربے سے نتیجہ نکالنے سے اپنے طریقوں والے شعبے تک پہنچی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .ax{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}.dot{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5}.tk{stroke:var(--a4);stroke-width:2}.st{font-size:12.5px}.cap{font-size:13px;fill:var(--muted);font-style:italic}</style><rect class="bg" x="0" y="0" width="900" height="362"/><defs><marker id="m3u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><path class="ax" d="M30 232 L866 232" marker-end="url(#m3u)"/><line class="tk" x1="110" y1="232" x2="110" y2="200"/><circle class="dot" cx="110" cy="232" r="9"/><text x="110" y="170" text-anchor="middle" class="st">اساتذہ صرف تجربے سے</text><text x="110" y="186" text-anchor="middle" class="st">نتیجہ نکالتے ہیں</text><line class="tk" x1="290" y1="232" x2="290" y2="248"/><circle class="dot" cx="290" cy="232" r="9"/><text x="290" y="278" text-anchor="middle" class="st">نفسیات فلسفے سے الگ ہو</text><text x="290" y="294" text-anchor="middle" class="st">کر پیمائش شروع کرتی ہے</text><line class="tk" x1="470" y1="232" x2="470" y2="200"/><circle class="dot" cx="470" cy="232" r="9"/><text x="470" y="154" text-anchor="middle" 