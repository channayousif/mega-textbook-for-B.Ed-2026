<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 292" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">تین فرق، ہر ایک کیسا دکھائی دیتا ہے اور اس کا مطلب کیا نہیں</title><desc id="d">چار خانوں کا نقشہ جو تین فرق - تیاری اور پچھلی معلومات، ترغیب اور دلچسپی، اور زبان و گھریلو پس منظر - کو اس کے مقابل رکھتا ہے کہ ہر ایک جماعت میں کیسا دکھائی دیتا ہے، اس کا مطلب کیا نہیں، اور استاد پہلی کوشش کیا کر سکتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .hd{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.key{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5}.c{font-size:12.5px}.q{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="852" height="292"/><rect class="hd" x="14" y="14" width="176" height="56" rx="4"/><text x="102.0" y="46.5" text-anchor="middle" class="h" font-size="12.5">فرق</text><rect class="hd" x="200" y="14" width="190" height="56" rx="4"/><text x="295.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">جماعت میں کیسا دکھائی</text><text x="295.0" y="54.0" text-anchor="middle" class="h" font-size="12.5">دیتا ہے</text><rect class="hd" x="400" y="14" width="178" height="56" rx="4"/><text x="489.0" y="46.5" text-anchor="middle" class="h" font-size="12.5">اس کا مطلب یہ نہیں</text><rect class="key" x="588" y="14" width="250" height="56" rx="4"/><text x="713.0" y="46.5" text-anchor="middle" class="h" font-size="12.5">پہلی کوشش کیا ہو</text><rect class="hd" x="14" y="80" width="176" height="54" rx="4"/><text x="102.0" y="104.0" text-anchor="middle" class="q">تیاری اور پچھلی</text><text x="102.0" y="120.0" text-anchor="middle" class="q">معلومات</text><rect class="cell" x="200" y="80" width="190" height="54" rx="4"/><text x="295.0" y="104.0" text-anchor="middle" class="c">نقل کرتی ہے مگر خود شروع</text><text x="295.0" y="120.0" text-anchor="middle" class="c">نہیں کر سکتی</text><rect class="cell" x="400" y="80" width="178" height="54" rx="4"/><text x="489.0" y="112.0" text-anchor="middle" class="c">کہ طالبہ سست ہے</text><rect class="key" x="588" y="80" width="250" height="54" rx="4"/><text x="713.0" y="104.0" text-anchor="middle" class="c">آج کا سبق دہرانے سے پہلے پچھلا</text><text x="713.0" y="120.0" text-anchor="middle" class="c">گمشدہ قدم تلاش کریں</text><rect class="hd" x="14" y="144" width="176" height="54" rx="4"/><text x="102.0" y="176.0" text-anchor="middle" class="q">ترغیب اور دلچسپی</text><rect class="cell" x="200" y="144" width="190" height="54" rx="4"/><text x="295.0" y="168.0" text-anchor="middle" class="c">جلد ختم کر کے بھٹکتی ہے،</text><text x="295.0" y="184.0" text-anchor="middle" class="c">یا کوشش چھوڑ دیتی ہے</text><rect class="cell" x="400" y="144" width="178" height="54" rx="4"/><text x="489.0" y="176.0" text-anchor="middle" class="c">کہ طالبہ کو پروا نہیں</text><rect class="key" x="588" y="144" width="250" height="54" rx="4"/><text x="713.0" y="176.0" text-anchor="middle" class="c">کام کا تقاضا بدلیں، اوپر یا نیچے</text><rect class="hd" x="14" y="208" width="176" height="54" rx="4"/><text x="102.0" y="232.0" text-anchor="middle" class="q">زبان اور گھریلو پس</text><text x="102.0" y="248.0" text-anchor="middle" class="q">منظر</text><rect class="cell" x="200" y="208" width="190" height="54" rx="4"/><text x="295.0" y="232.0" text-anchor="middle" class="c">بولنے میں خاموش مگر لکھنے</text><text x="295.0" y="248.0" text-anchor="middle" class="c">میں مضبوط</text><rect class="cell" x="400" y="208" width="178" height="54" rx="4"/><text x="489.0" y="240.0" text-anchor="middle" class="c">کہ طالبہ سمجھی نہیں</text><rect class="key" x="588" y="208" width="250" height="54" rx="4"/><text x="713.0" y="232.0" text-anchor="middle" class="c">پہلے کسی اور صورت میں سمجھ دکھانے</text><text x="713.0" y="248.0" text-anchor="middle" class="c">دیں</text><text class="wm" x="12" y="282" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
