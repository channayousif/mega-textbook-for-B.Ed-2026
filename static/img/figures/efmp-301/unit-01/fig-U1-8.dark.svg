<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 280" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The plan, teach, assess, reflect cycle</title><desc id="d">A four-step cycle - plan, teach, assess, reflect - drawn with arrows, where reflect feeds back into plan on a thicker arrow labelled as the step most often skipped, and a note beside assess reading that it is not the same as marking.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.fl{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.bk{stroke:var(--a3);stroke-width:3.5;fill:none}.ahb{fill:var(--a3)}.s{font-size:13px}.ttl{font-size:15px;font-weight:700}.tag{font-size:12px;fill:var(--a3);font-style:italic}.note{font-size:12px;fill:var(--muted);font-style:italic}</style><rect class="bg" x="0" y="0" width="888" height="280"/><defs><marker id="m8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><defs><marker id="m8b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahb"/></marker></defs><rect class="st" x="16" y="60" width="196" height="116" rx="6"/><text x="114" y="88" text-anchor="middle" class="ttl">plan</text><text x="114" y="112" text-anchor="middle" class="s">what do they already know,</text><text x="114" y="129" text-anchor="middle" class="s">what is the one thing?</text><path class="fl" d="M212 118 L248 118" marker-end="url(#m8)"/><rect class="st" x="236" y="60" width="196" height="116" rx="6"/><text x="334" y="88" text-anchor="middle" class="ttl">teach</text><text x="334" y="112" text-anchor="middle" class="s">show the move before</text><text x="334" y="129" text-anchor="middle" class="s">asking for it</text><path class="fl" d="M432 118 L468 118" marker-end="url(#m8)"/><rect class="st" x="456" y="60" width="196" height="116" rx="6"/><text x="554" y="88" text-anchor="middle" class="ttl">assess</text><text x="554" y="112" text-anchor="middle" class="s">find out what they can now</text><text x="554" y="129" text-anchor="middle" class="s">do without you</text><path class="fl" d="M652 118 L688 118" marker-end="url(#m8)"/><rect class="st" x="676" y="60" width="196" height="116" rx="6"/><text x="774" y="88" text-anchor="middle" class="ttl">reflect</text><text x="774" y="112" text-anchor="middle" class="s">what did that tell me,</text><text x="774" y="129" text-anchor="middle" class="s">and what changes next?</text><path class="bk" d="M774 176 L774 226 L114 226 L114 180" marker-end="url(#m8b)"/><text x="444" y="248" text-anchor="middle" class="tag">the step most often skipped</text><text x="554" y="46" text-anchor="middle" class="note">not the same as marking</text><text class="wm" x="876" y="270" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
