<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">ایک تحقیقی نتیجے سے جماعت کے فیصلے تک</title><desc id="d">پانچ مرحلوں کا بہاؤ نقشہ: ایک تحقیقی نتیجہ آپ تک پہنچتا ہے، یہ کیا دعویٰ کرتا ہے اور کن شرائط کے ساتھ، کیا وہ شرائط میری جماعت میں ہیں، ایک چیز بدلیں، اور ایسی شہادت جمع کریں جس میں آپ غلط ہو سکیں، ایک واپسی تیر کے ساتھ جو دعوے پر دوبارہ غور کراتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.dec{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5}.side{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;stroke-dasharray:6 5}.fl{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.rt{stroke:var(--a1);stroke-width:2;fill:none;stroke-dasharray:7 5}.s{font-size:13.5px}.tag{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="700" height="500"/><defs><marker id="m5u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="st" x="122" y="16" width="328" height="68" rx="6"/><text x="286" y="50" text-anchor="middle" class="s">ایک تحقیقی نتیجہ آپ تک پہنچتا ہے</text><path class="fl" d="M286 84 L286 100" marker-end="url(#m5u)"/><rect class="st" x="122" y="104" width="328" height="68" rx="6"/><text x="286" y="130" text-anchor="middle" class="s">یہ اصل میں کیا دعویٰ کرتا ہے،</text><text x="286" y="148" text-anchor="middle" class="s">اور کن شرائط کے ساتھ؟</text><path class="fl" d="M286 172 L286 198" marker-end="url(#m5u)"/><rect class="dec" x="122" y="202" width="328" height="76" rx="6"/><text x="286" y="228" text-anchor="middle" class="s">کیا وہ شرائط میری جماعت میں</text><text x="286" y="246" text-anchor="middle" class="s">موجود ہیں؟</text><path class="fl" d="M286 278 L286 306" marker-end="url(#m5u)"/><rect class="st" x="122" y="310" width="328" height="68" rx="6"/><text x="286" y="336" text-anchor="middle" class="s">ایک چیز بدلیں، ایسے کہ کسی طالبہ</text><text x="286" y="354" text-anchor="middle" class="s">کے ریکارڈ کو نقصان نہ ہو</text><path class="fl" d="M286 378 L286 400" marker-end="url(#m5u)"/><rect class="st" x="122" y="404" width="328" height="68" rx="6"/><text x="286" y="430" text-anchor="middle" class="s">ایسی شہادت جمع کریں جس میں</text><text x="286" y="448" text-anchor="middle" class="s">آپ غلط ہو سکیں، پھر موازنہ کریں</text><rect class="side" x="470" y="206" width="190" height="68" rx="6"/><text x="565" y="232" text-anchor="middle" class="tag">نہیں – ڈھالیں یا چھوڑ دیں،</text><text x="565" y="248" text-anchor="middle" class="tag">اور وجہ لکھیں</text><path class="fl" d="M450 240 L466 240" marker-end="url(#m5u)"/><text x="296" y="300" text-anchor="start" class="tag">ہاں</text><path class="rt" d="M122 438 L54 438 L54 138 L118 138"/><text class="tag" transform="translate(46 292) rotate(-90)" text-anchor="middle" font-size="11">دعوے کے بارے میں کیا معلوم ہوا؟</text><text class="wm" x="12" y="490" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
