<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 341" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">General psychology compared with educational psychology</title><desc id="d">A table comparing general psychology and educational psychology against four questions - what it asks, where it looks, what counts as evidence, and what it is used for.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .hd{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.key{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5}.c{font-size:12.5px}.q{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="702" height="341"/><rect class="hd" x="14" y="14" width="194" height="41" rx="4"/><rect class="hd" x="218" y="14" width="212" height="41" rx="4"/><text x="324.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">general psychology</text><rect class="key" x="440" y="14" width="248" height="41" rx="4"/><text x="564.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">educational psychology</text><rect class="hd" x="14" y="65" width="194" height="54" rx="4"/><text x="111.0" y="97.0" text-anchor="middle" class="q">what it asks</text><rect class="cell" x="218" y="65" width="212" height="54" rx="4"/><text x="324.0" y="97.0" text-anchor="middle" class="c">how does memory work?</text><rect class="key" x="440" y="65" width="248" height="54" rx="4"/><text x="564.0" y="89.0" text-anchor="middle" class="c">what should a teacher change on</text><text x="564.0" y="105.0" text-anchor="middle" class="c">Tuesday?</text><rect class="hd" x="14" y="129" width="194" height="54" rx="4"/><text x="111.0" y="161.0" text-anchor="middle" class="q">where it looks</text><rect class="cell" x="218" y="129" width="212" height="54" rx="4"/><text x="324.0" y="161.0" text-anchor="middle" class="c">laboratory and clinic</text><rect class="key" x="440" y="129" width="248" height="54" rx="4"/><text x="564.0" y="161.0" text-anchor="middle" class="c">classrooms and schools</text><rect class="hd" x="14" y="193" width="194" height="54" rx="4"/><text x="111.0" y="225.0" text-anchor="middle" class="q">what counts as evidence</text><rect class="cell" x="218" y="193" width="212" height="54" rx="4"/><text x="324.0" y="225.0" text-anchor="middle" class="c">controlled experiment</text><rect class="key" x="440" y="193" width="248" height="54" rx="4"/><text x="564.0" y="217.0" text-anchor="middle" class="c">experiment, observation, case</text><text x="564.0" y="233.0" text-anchor="middle" class="c">study</text><rect class="hd" x="14" y="257" width="194" height="54" rx="4"/><text x="111.0" y="289.0" text-anchor="middle" class="q">what it is used for</text><rect class="cell" x="218" y="257" width="212" height="54" rx="4"/><text x="324.0" y="289.0" text-anchor="middle" class="c">explaining the mind</text><rect class="key" x="440" y="257" width="248" height="54" rx="4"/><text x="564.0" y="289.0" text-anchor="middle" class="c">improving teaching and learning</text><text class="wm" x="690" y="331" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
