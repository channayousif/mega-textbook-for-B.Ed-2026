<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The three things educational psychology studies</title><desc id="d">A concept map with educational psychology at the centre, linked to three branches - the learner (readiness, prior knowledge, motivation, home background), the learning process (attention, memory, understanding, transfer), and the learning situation (the lesson, the classroom, the teacher, assessment).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.br{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.lk{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.sub{font-size:13px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="700" height="470"/><defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><g class="lk"><path d="M300 250 L392 108" marker-end="url(#m1)"/><path d="M300 250 L392 250" marker-end="url(#m1)"/><path d="M300 250 L392 392" marker-end="url(#m1)"/></g><ellipse class="core" cx="190" cy="250" rx="112" ry="54"/><text x="190" y="256" text-anchor="middle" class="h" font-size="17">educational psychology</text><rect class="br" x="400" y="40" width="272" height="122" rx="6"/><text x="536" y="68" text-anchor="middle" class="h" font-size="16">the learner</text><text x="536" y="92" text-anchor="middle" class="sub">readiness</text><text x="536" y="109" text-anchor="middle" class="sub">prior knowledge</text><text x="536" y="126" text-anchor="middle" class="sub">motivation</text><text x="536" y="143" text-anchor="middle" class="sub">home background</text><rect class="br" x="400" y="182" width="272" height="122" rx="6"/><text x="536" y="210" text-anchor="middle" class="h" font-size="16">the learning process</text><text x="536" y="234" text-anchor="middle" class="sub">attention</text><text x="536" y="251" text-anchor="middle" class="sub">memory</text><text x="536" y="268" text-anchor="middle" class="sub">understanding</text><text x="536" y="285" text-anchor="middle" class="sub">transfer</text><rect class="br" x="400" y="324" width="272" height="122" rx="6"/><text x="536" y="352" text-anchor="middle" class="h" font-size="16">the learning situation</text><text x="536" y="376" text-anchor="middle" class="sub">the lesson</text><text x="536" y="393" text-anchor="middle" class="sub">the classroom</text><text x="536" y="410" text-anchor="middle" class="sub">the teacher</text><text x="536" y="427" text-anchor="middle" class="sub">assessment</text><text class="wm" x="688" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
