<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 280" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">منصوبہ، تدریس، تشخیص، خود احتسابی کا چکر</title><desc id="d">چار مرحلوں کا چکر - منصوبہ، تدریس، تشخیص، خود احتسابی - تیروں کے ساتھ، جہاں خود احتسابی ایک موٹے تیر سے واپس منصوبے میں جاتی ہے اور اسے وہ قدم بتایا گیا ہے جو سب سے زیادہ چھوڑا جاتا ہے، اور جائزے کے پاس یہ نوٹ کہ یہ نمبر دینے کے برابر نہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.fl{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.bk{stroke:var(--a3);stroke-width:3.5;fill:none}.ahb{fill:var(--a3)}.s{font-size:13px}.ttl{font-size:15px;font-weight:700}.tag{font-size:12px;fill:var(--a3);font-style:italic}.note{font-size:12px;fill:var(--muted);font-style:italic}</style><rect class="bg" x="0" y="0" width="888" height="280"/><defs><marker id="m8u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><defs><marker id="m8bu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahb"/></marker></defs><rect class="st" x="676" y="60" width="196" height="116" rx="6"/><text x="774" y="88" text-anchor="middle" class="ttl">منصوبہ</text><text x="774" y="112" text-anchor="middle" class="s">وہ پہلے سے کیا جانتے ہیں،</text><text x="774" y="129" text-anchor="middle" class="s">اور ایک لازمی بات کیا ہے؟</text><path class="fl" d="M676 118 L640 118" marker-end="url(#m8u)"/><rect class="st" x="456" y="60" width="196" height="116" rx="6"/><text x="554" y="88" text-anchor="middle" class="ttl">تدریس</text><text x="554" y="112" text-anchor="middle" class="s">مانگنے سے پہلے</text><text x="554" y="129" text-anchor="middle" class="s">کر کے دکھائیں</text><path class="fl" d="M456 118 L420 118" marker-end="url(#m8u)"/><rect class="st" x="236" y="60" width="196" height="116" rx="6"/><text x="334" y="88" text-anchor="middle" class="ttl">تشخیص</text><text x="334" y="112" text-anchor="middle" class="s">معلوم کریں وہ اب آپ کے بغیر</text><text x="334" y="129" text-anchor="middle" class="s">کیا کر سکتے ہیں</text><path class="fl" d="M236 118 L200 118" marker-end="url(#m8u)"/><rect class="st" x="16" y="60" width="196" height="116" rx="6"/><text x="114" y="88" text-anchor="middle" class="ttl">خود احتسابی</text><text x="114" y="112" text-anchor="middle" class="s">اس سے کیا معلوم ہوا،</text><text x="114" y="129" text-anchor="middle" class="s">اور اگلی بار کیا بدلے گا؟</text><path class="bk" d="M114 176 L114 226 L774 226 L774 180" marker-end="url(#m8bu)"/><text x="444" y="248" text-anchor="middle" class="tag">وہ قدم جو سب سے زیادہ چھوڑا جاتا ہے</text><text x="334" y="46" text-anchor="middle" class="note">یہ نمبر دینے کے برابر نہیں</text><text class="wm" x="876" y="270" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
