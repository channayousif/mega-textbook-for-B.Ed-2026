<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 382" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">ایک جماعت میں سیکھنے والوں کے فرق</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں دو طالبات، ایک ہی سبق اور مختلف نتائج ہیں، اور تین شاخیں: آمادگی اور سابقہ علم، محرک اور دلچسپی، اور زبان و گھریلو پس منظر، ہر ایک کے تین ذیلی نکات کے ساتھ، اور نیچے یہ نوٹ کہ ان میں سے کوئی بھی صلاحیت کے برابر نہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .core{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}.br{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.lk{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.sub{font-size:12.5px;fill:var(--muted)}.note{font-size:13px;fill:var(--a3);font-style:italic}</style><rect class="bg" x="0" y="0" width="840" height="382"/><defs><marker id="m6u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><g class="lk"><path d="M413 116 L698 168" marker-end="url(#m6u)"/><path d="M413 116 L420 168" marker-end="url(#m6u)"/><path d="M413 116 L142 168" marker-end="url(#m6u)"/></g><rect class="core" x="241" y="26" width="344" height="84" rx="6"/><text x="413" y="58" text-anchor="middle" class="h" font-size="16">دو طالبات، ایک ہی سبق،</text><text x="413" y="80" text-anchor="middle" class="h" font-size="16">مختلف نتائج</text><rect class="br" x="570" y="174" width="256" height="148" rx="6"/><text x="698" y="200" text-anchor="middle" class="h" font-size="14">آمادگی اور سابقہ علم</text><text x="698" y="229" text-anchor="middle" class="sub">جو وہ پہلے سے جانتی ہیں</text><text x="698" y="246" text-anchor="middle" class="sub">پچھلے سالوں کے خلا</text><text x="698" y="263" text-anchor="middle" class="sub">اگلا قدم کیا ہو سکتا ہے</text><rect class="br" x="292" y="174" width="256" height="148" rx="6"/><text x="420" y="200" text-anchor="middle" class="h" font-size="14">محرک اور دلچسپی</text><text x="420" y="229" text-anchor="middle" class="sub">کوشش کیوں کریں</text><text x="420" y="246" text-anchor="middle" class="sub">کامیابی کی توقع</text><text x="420" y="263" text-anchor="middle" class="sub">یہ کام کس لیے ہے</text><rect class="br" x="14" y="174" width="256" height="148" rx="6"/><text x="142" y="200" text-anchor="middle" class="h" font-size="14">زبان اور گھریلو پس منظر</text><text x="142" y="229" text-anchor="middle" class="sub">اسکول اور گھر کی زبان</text><text x="142" y="246" text-anchor="middle" class="sub">پڑھنے کی جگہ اور وقت</text><text x="142" y="263" text-anchor="middle" class="sub">گھر پر کون مدد دے سکتا ہے</text><text x="413" y="352" text-anchor="middle" class="note">ان میں سے کوئی بھی صلاحیت کے برابر نہیں</text><text class="wm" x="828" y="372" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
