<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 277" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">عام نفسیات اور تعلیمی نفسیات کا موازنہ</title><desc id="d">ایک نقشہ جو عام نفسیات اور تعلیمی نفسیات کا چار سوالوں پر موازنہ کرتا ہے: کیا پوچھتی ہے، کہاں دیکھتی ہے، شہادت کیا مانی جاتی ہے، اور کس کام آتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .hd{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.key{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5}.c{font-size:12.5px}.q{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="702" height="277"/><rect class="hd" x="14" y="14" width="194" height="41" rx="4"/><rect class="hd" x="218" y="14" width="212" height="41" rx="4"/><text x="324.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">عام نفسیات</text><rect class="key" x="440" y="14" width="248" height="41" rx="4"/><text x="564.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">تعلیمی نفسیات</text><rect class="hd" x="14" y="65" width="194" height="38" rx="4"/><text x="111.0" y="89.0" text-anchor="middle" class="q">کیا پوچھتی ہے</text><rect class="cell" x="218" y="65" width="212" height="38" rx="4"/><text x="324.0" y="89.0" text-anchor="middle" class="c">یادداشت کیسے کام کرتی ہے؟</text><rect class="key" x="440" y="65" width="248" height="38" rx="4"/><text x="564.0" y="89.0" text-anchor="middle" class="c">استاد منگل کو کیا بدلے؟</text><rect class="hd" x="14" y="113" width="194" height="38" rx="4"/><text x="111.0" y="137.0" text-anchor="middle" class="q">کہاں دیکھتی ہے</text><rect class="cell" x="218" y="113" width="212" height="38" rx="4"/><text x="324.0" y="137.0" text-anchor="middle" class="c">تجربہ گاہ اور کلینک</text><rect class="key" x="440" y="113" width="248" height="38" rx="4"/><text x="564.0" y="137.0" text-anchor="middle" class="c">جماعتیں اور اسکول</text><rect class="hd" x="14" y="161" width="194" height="38" rx="4"/><text x="111.0" y="185.0" text-anchor="middle" class="q">شہادت کیا مانی جاتی ہے</text><rect class="cell" x="218" y="161" width="212" height="38" rx="4"/><text x="324.0" y="185.0" text-anchor="middle" class="c">کنٹرول شدہ تجربہ</text><rect class="key" x="440" y="161" width="248" height="38" rx="4"/><text x="564.0" y="185.0" text-anchor="middle" class="c">تجربہ، مشاہدہ، مطالعۂ حالات</text><rect class="hd" x="14" y="209" width="194" height="38" rx="4"/><text x="111.0" y="233.0" text-anchor="middle" class="q">کس کام آتی ہے</text><rect class="cell" x="218" y="209" width="212" height="38" rx="4"/><text x="324.0" y="233.0" text-anchor="middle" class="c">ذہن کی وضاحت</text><rect class="key" x="440" y="209" width="248" height="38" rx="4"/><text x="564.0" y="233.0" text-anchor="middle" class="c">تدریس اور سیکھنے میں بہتری</text><text class="wm" x="12" y="267" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
