<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 280" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">منصوبہ، تدریس، جائزہ، خود احتسابی کا چکر</title><desc id="d">چار مرحلوں کا چکر - منصوبہ، تدریس، جائزہ، خود احتسابی - تیروں کے ساتھ، جہاں خود احتسابی ایک موٹے تیر سے واپس منصوبے میں جاتی ہے اور اسے وہ قدم بتایا گیا ہے جو سب سے زیادہ چھوڑا جاتا ہے، اور جائزے کے پاس یہ نوٹ کہ یہ نمبر دینے کے برابر نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.fl{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.bk{stroke:var(--a3);stroke-width:3.5;fill:none}.ahb{fill:var(--a3)}.s{font-size:13px}.ttl{font-size:15px;font-weight:700}.tag{font-size:12px;fill:var(--a3);font-style:italic}.note{font-size:12px;fill:var(--muted);font-style:italic}</style><rect class="bg" x="0" y="0" width="888" height="280"/><defs><marker id="m8u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><defs><marker id="m8bu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahb"/></marker></defs><rect class="st" x="16" y="60" width="196" height="116" rx="6"/><text x="114" y="88" text-anchor="middle" class="ttl">منصوبہ</text><text x="114" y="112" text-anchor="middle" class="s">وہ پہلے سے کیا جانتی ہیں،</text><text x="114" y="129" text-anchor="middle" class="s">اور ایک لازمی بات کیا ہے؟</text><path class="fl" d="M212 118 L248 118" marker-end="url(#m8u)"/><rect class="st" x="236" y="60" width="196" height="116" rx="6"/><text x="334" y="88" text-anchor="middle" class="ttl">تدریس</text><text x="334" y="112" text-anchor="middle" class="s">مانگنے سے پہلے</text><text x="334" y="129" text-anchor="middle" class="s">کر کے دکھائیں</text><path class="fl" d="M432 118 L468 118" marker-end="url(#m8u)"/><rect class="st" x="456" y="60" width="196" height="116" rx="6"/><text x="554" y="88" text-anchor="middle" class="ttl">جائزہ</text><text x="554" y="112" text-anchor="middle" class="s">معلوم کریں وہ اب آپ کے بغیر</text><text x="554" y="129" text-anchor="middle" class="s">کیا کر سکتی ہیں</text><path class="fl" d="M652 118 L688 118" marker-end="url(#m8u)"/><rect class="st" x="676" y="60" width="196" height="116" rx="6"/><text x="774" y="88" text-anchor="middle" class="ttl">خود احتسابی</text><text x="774" y="112" text-anchor="middle" class="s">اس سے کیا معلوم ہوا،</text><text x="774" y="129" text-anchor="middle" class="s">اور اگلی بار کیا بدلے گا؟</text><path class="bk" d="M774 176 L774 226 L114 226 L114 180" marker-end="url(#m8bu)"/><text x="444" y="248" text-anchor="middle" class="tag">وہ قدم جو سب سے زیادہ چھوڑا جاتا ہے</text><text x="554" y="46" text-anchor="middle" class="note">یہ نمبر دینے کے برابر نہیں</text><text class="wm" x="12" y="270" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
