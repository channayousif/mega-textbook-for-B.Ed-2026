<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From a research finding to a classroom decision</title><desc id="d">A flowchart of five steps from a research finding reaching a teacher, through asking what it claims and under what conditions, a decision point on whether those conditions hold in this classroom, changing one thing in a way that cannot harm a pupil’s record, and gathering evidence to compare, with a dashed return arrow feeding back to reconsider the claim.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.dec{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5}.side{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;stroke-dasharray:6 5}.fl{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.rt{stroke:var(--a1);stroke-width:2;fill:none;stroke-dasharray:7 5}.s{font-size:13.5px}.tag{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="700" height="500"/><defs><marker id="m5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="st" x="122" y="16" width="328" height="68" rx="6"/><text x="286" y="50" text-anchor="middle" class="s">a research finding reaches you</text><path class="fl" d="M286 84 L286 100" marker-end="url(#m5)"/><rect class="st" x="122" y="104" width="328" height="68" rx="6"/><text x="286" y="130" text-anchor="middle" class="s">what exactly does it claim,</text><text x="286" y="148" text-anchor="middle" class="s">and under what conditions?</text><path class="fl" d="M286 172 L286 198" marker-end="url(#m5)"/><rect class="dec" x="122" y="202" width="328" height="76" rx="6"/><text x="286" y="228" text-anchor="middle" class="s">do those conditions hold</text><text x="286" y="246" text-anchor="middle" class="s">in my classroom?</text><path class="fl" d="M286 278 L286 306" marker-end="url(#m5)"/><rect class="st" x="122" y="310" width="328" height="68" rx="6"/><text x="286" y="336" text-anchor="middle" class="s">change ONE thing, in a way that</text><text x="286" y="354" text-anchor="middle" class="s">cannot harm a pupil’s record</text><path class="fl" d="M286 378 L286 400" marker-end="url(#m5)"/><rect class="st" x="122" y="404" width="328" height="68" rx="6"/><text x="286" y="430" text-anchor="middle" class="s">gather something you could be</text><text x="286" y="448" text-anchor="middle" class="s">wrong about, then compare</text><rect class="side" x="470" y="206" width="190" height="68" rx="6"/><text x="565" y="232" text-anchor="middle" class="tag">no – adapt it or set it</text><text x="565" y="248" text-anchor="middle" class="tag">aside, and say why</text><path class="fl" d="M450 240 L466 240" marker-end="url(#m5)"/><text x="296" y="300" text-anchor="start" class="tag">yes</text><path class="rt" d="M122 438 L54 438 L54 138 L118 138"/><text class="tag" transform="translate(46 292) rotate(-90)" text-anchor="middle" font-size="11">what did I learn about the claim?</text><text class="wm" x="688" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
