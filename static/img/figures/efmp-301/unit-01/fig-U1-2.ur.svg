<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 277" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">عام نفسیات اور تعلیمی نفسیات کا موازنہ</title><desc id="d">ایک نقشہ جو عام نفسیات اور تعلیمی نفسیات کا چار سوالوں پر موازنہ کرتا ہے: کیا پوچھتی ہے، کہاں دیکھتی ہے، شہادت کیا مانی جاتی ہے، اور کس کام آتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .hd{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.key{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5}.c{font-size:12.5px}.q{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="702" height="277"/><rect class="hd" x="14" y="14" width="194" height="41" rx="4"/><rect class="hd" x="218" y="14" width="212" height="41" rx="4"/><text x="324.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">عام نفسیات</text><rect class="key" x="440" y="14" width="248" height="41" rx="4"/><text x="564.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">تعلیمی نفسیات</text><rect class="hd" x="14" y="65" width="194" height="38" rx="4"/><text x="111.0" y="89.0" text-anchor="middle" class="q">کیا پوچھتی ہے</text><rect class="cell" x="218" y="65" width="212" height="38" rx="4"/><text x="324.0" y="89.0" text-anchor="middle" class="c">یادداشت کیسے کام کرتی ہے؟</text><rect class="key" x="440" y="65" width="248" height="38" rx="4"/><text x="564.0" y="89.0" text-anchor="middle" class="c">استاد منگل کو کیا بدلے؟</text><rect class="hd" x="14" y="113" width="194" height="38" rx="4"/><text x="111.0" y="137.0" text-anchor="middle" class="q">کہاں دیکھتی ہے</text><rect class="cell" x="218" y="113" width="212" height="38" rx="4"/><text x="324.0" y="137.0" text-anchor="middle" class="c">تجربہ گاہ اور کلینک</text><rect class="key" x="440" y="113" width="248" height="38" rx="4"/><text x="564.0" y="137.0" text-anchor="middle" class="c">جماعتیں اور اسکول</text><rect class="hd" x="14" y="161" width="194" height="38" rx="4"/><text x="111.0" y="185.0" text-anchor="middle" class="q">شہادت کیا مانی جاتی ہے</text><rect class="cell" x="218" y="161" width="212" height="38" rx="4"/><text x="324.0" y="185.0" text-anchor="middle" class="c">کنٹرول شدہ تجربہ</text><rect class="key" x="440" y="161" width="248" height="38" rx="4"/><text x="564.0" y="185.0" text-anchor="middle" class="c">تجربہ، مشاہدہ، مطالعۂ حالات</text><rect class="hd" x="14" y="209" width="194" height="38" rx="4"/><text x="111.0" y="233.0" text-anchor="middle" class="q">کس کام آتی ہے</text><rect class="cell" x="218" y="209" width="212" height="38" rx="4"/><text x="324.0" y="233.0" text-anchor="middle" class="c">ذہن کی وضاحت</text><rect class="key" x="440" y="209" width="248" height="38" rx="4"/><text x="564.0" y="233.0" text-anchor="middle" class="c">تدریس اور سیکھنے میں بہتری</text><text class="wm" x="12" y="267" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
