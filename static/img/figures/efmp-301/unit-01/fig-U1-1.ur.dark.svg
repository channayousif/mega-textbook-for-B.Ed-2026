<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">تعلیمی نفسیات کے مطالعے کے تین حصے</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں تعلیمی نفسیات ہے اور تین شاخیں ہیں: سیکھنے والا، سیکھنے کا عمل، اور سیکھنے کی صورتحال، ہر ایک کے چار ذیلی عنوانات کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.br{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.lk{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.sub{font-size:13px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="700" height="470"/><defs><marker id="m1u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><g class="lk"><path d="M400 250 L308 108" marker-end="url(#m1u)"/><path d="M400 250 L308 250" marker-end="url(#m1u)"/><path d="M400 250 L308 392" marker-end="url(#m1u)"/></g><ellipse class="core" cx="510" cy="250" rx="112" ry="54"/><text x="510" y="256" text-anchor="middle" class="h" font-size="17">تعلیمی نفسیات</text><rect class="br" x="28" y="40" width="272" height="122" rx="6"/><text x="164" y="68" text-anchor="middle" class="h" font-size="16">سیکھنے والا</text><text x="164" y="92" text-anchor="middle" class="sub">آمادگی</text><text x="164" y="109" text-anchor="middle" class="sub">سابقہ علم</text><text x="164" y="126" text-anchor="middle" class="sub">محرک</text><text x="164" y="143" text-anchor="middle" class="sub">گھریلو پس منظر</text><rect class="br" x="28" y="182" width="272" height="122" rx="6"/><text x="164" y="210" text-anchor="middle" class="h" font-size="16">سیکھنے کا عمل</text><text x="164" y="234" text-anchor="middle" class="sub">توجہ</text><text x="164" y="251" text-anchor="middle" class="sub">یادداشت</text><text x="164" y="268" text-anchor="middle" class="sub">فہم</text><text x="164" y="285" text-anchor="middle" class="sub">منتقلی</text><rect class="br" x="28" y="324" width="272" height="122" rx="6"/><text x="164" y="352" text-anchor="middle" class="h" font-size="16">سیکھنے کی صورتحال</text><text x="164" y="376" text-anchor="middle" class="sub">سبق</text><text x="164" y="393" text-anchor="middle" class="sub">جماعت</text><text x="164" y="410" text-anchor="middle" class="sub">استاد</text><text x="164" y="427" text-anchor="middle" class="sub">تشخیص</text><text class="wm" x="688" y="460" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
