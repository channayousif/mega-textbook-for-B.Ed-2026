<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 341" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">جماعت کے چار مشاہدے اور ان کے بجائے کیا دیکھنا چاہیے</title><desc id="d">تین خانوں کا نقشہ جو جماعت کے چار مشاہدوں کو عام تشریح اور اس کے مقابل رکھتا ہے کہ نفسیات استاد کو ان کے بجائے کیا دیکھنے کو کہتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .hd{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.key{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}.c{font-size:12.5px}.q{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="758" height="341"/><rect class="hd" x="14" y="14" width="232" height="41" rx="4"/><text x="130.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">آپ کیا دیکھتے ہیں</text><rect class="hd" x="256" y="14" width="178" height="41" rx="4"/><text x="345.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">عام تشریح</text><rect class="key" x="444" y="14" width="300" height="41" rx="4"/><text x="594.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">نفسیات کیا دیکھنے کو کہتی ہے</text><rect class="hd" x="14" y="65" width="232" height="54" rx="4"/><text x="130.0" y="89.0" text-anchor="middle" class="q">جماعت صاف نقل کرتی ہے مگر جواب</text><text x="130.0" y="105.0" text-anchor="middle" class="q">نہیں دے سکتی</text><rect class="cell" x="256" y="65" width="178" height="54" rx="4"/><text x="345.0" y="97.0" text-anchor="middle" class="c">وہ لاپروا تھیں</text><rect class="key" x="444" y="65" width="300" height="54" rx="4"/><text x="594.0" y="89.0" text-anchor="middle" class="c">نقل اور فہم ایک ہی محدود توجہ کے لیے</text><text x="594.0" y="105.0" text-anchor="middle" class="c">مقابلہ کرتے ہیں</text><rect class="hd" x="14" y="129" width="232" height="54" rx="4"/><text x="130.0" y="161.0" text-anchor="middle" class="q">کوئی سوال نہیں پوچھتا</text><rect class="cell" x="256" y="129" width="178" height="54" rx="4"/><text x="345.0" y="161.0" text-anchor="middle" class="c">وہ سمجھ گئیں</text><rect class="key" x="444" y="129" width="300" height="54" rx="4"/><text x="594.0" y="153.0" text-anchor="middle" class="c">کیا اس کمرے میں بلند آواز سے غلط ہونا</text><text x="594.0" y="169.0" text-anchor="middle" class="c">محفوظ ہے</text><rect class="hd" x="14" y="193" width="232" height="54" rx="4"/><text x="130.0" y="217.0" text-anchor="middle" class="q">دس منٹ بعد ایک طالبہ خلل ڈالتی</text><text x="130.0" y="233.0" text-anchor="middle" class="q">ہے</text><rect class="cell" x="256" y="193" width="178" height="54" rx="4"/><text x="345.0" y="225.0" text-anchor="middle" class="c">نظم کی کمی</text><rect class="key" x="444" y="193" width="300" height="54" rx="4"/><text x="594.0" y="217.0" text-anchor="middle" class="c">کیا کام شروع کیا جا سکتا ہے، یا ختم ہو</text><text x="594.0" y="233.0" text-anchor="middle" class="c">چکا ہے</text><rect class="hd" x="14" y="257" width="232" height="54" rx="4"/><text x="130.0" y="289.0" text-anchor="middle" class="q">نمبر بہتر ہوتے ہیں مگر فہم نہیں</text><rect class="cell" x="256" y="257" width="178" height="54" rx="4"/><text x="345.0" y="289.0" text-anchor="middle" class="c">ترقی</text><rect class="key" x="444" y="257" width="300" height="54" rx="4"/><text x="594.0" y="289.0" text-anchor="middle" class="c">جائزہ اصل میں کس چیز کا انعام دیتا ہے</text><text class="wm" x="12" y="331" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
