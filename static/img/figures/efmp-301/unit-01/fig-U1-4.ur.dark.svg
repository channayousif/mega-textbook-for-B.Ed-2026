<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">نفسیات اور تعلیم کا دوطرفہ رشتہ</title><desc id="d">نفسیات اور تعلیم کے دو خانوں کا نقشہ جو دو مخالف سمت کے تیروں سے جڑے ہیں: نفسیات نظریات، طریقے اور زبان دیتی ہے، اور تعلیم بدلے میں حقیقی حالات، نئے مسائل اور وہ نتائج دیتی ہے جو تجربہ گاہ سے باہر ناکام ہو جاتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .pl{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}.ar1{stroke:var(--a1);stroke-width:3;fill:none}.ah1{fill:var(--a1)}.ar2{stroke:var(--a3);stroke-width:3;fill:none}.ah2{fill:var(--a3)}.lb{font-size:13px}.tag{font-size:13px;font-weight:700}.t1{fill:var(--a1)}.t2{fill:var(--a3)}</style><rect class="bg" x="0" y="0" width="820" height="380"/><defs><marker id="m4u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah1"/></marker></defs><defs><marker id="m4bu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah2"/></marker></defs><rect class="pl" x="20" y="150" width="176" height="128" rx="6"/><text x="108" y="220" text-anchor="middle" class="h" font-size="18">نفسیات</text><rect class="pl" x="624" y="150" width="176" height="128" rx="6"/><text x="712" y="220" text-anchor="middle" class="h" font-size="18">تعلیم</text><path class="ar1" d="M200 186 L618 186" marker-end="url(#m4u)"/><path class="ar2" d="M620 246 L202 246" marker-end="url(#m4bu)"/><text x="410" y="176" text-anchor="middle" class="tag t1">دیتی ہے</text><text x="410" y="62" text-anchor="middle" class="lb">سیکھنے، یادداشت اور محرک کے</text><text x="410" y="79" text-anchor="middle" class="lb">نظریات</text><text x="410" y="96" text-anchor="middle" class="lb">شہادت جمع کرنے کے طریقے</text><text x="410" y="113" text-anchor="middle" class="lb">سیکھنے والوں کو بیان کرنے کی زبان</text><text x="410" y="268" text-anchor="middle" class="tag t2">واپس دیتی ہے</text><text x="410" y="300" text-anchor="middle" class="lb">جانچنے کے لیے حقیقی حالات</text><text x="410" y="317" text-anchor="middle" class="lb">ایسے مسائل جو تجربہ گاہ نہیں دیتی</text><text x="410" y="334" text-anchor="middle" class="lb">وہ نتائج جو باہر ناکام ہوں</text><text class="wm" x="12" y="370" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
