<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار اقسام کی تشخیص</title><desc id="d">چار اقسام کا جدول: تشخیصی، تشکیلی، مجموعی اور تصدیق، ہر ایک کے ساتھ کب ہوتی ہے، وہ فیصلہ جو وہ جاتی ہے، اور سندھ کی جماعت کی ایک مثال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 658 14V426M332 14V426M548 14V426M12 74H768M12 190H768M12 306H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="713" y="48" text-anchor="middle">قسم</text><text class="h" x="553" y="40" text-anchor="middle">کب ہوتی</text><text class="h" x="553" y="60" text-anchor="middle">ہے</text><text class="h" x="340" y="40" text-anchor="middle">وہ فیصلہ جو</text><text class="h" x="340" y="60" text-anchor="middle">وہ جاتی ہے</text><text class="h" x="122" y="40" text-anchor="middle">سندھ کی جماعت کی</text><text class="h" x="122" y="60" text-anchor="middle">ایک مثال</text><text class="sh" x="713" y="112" text-anchor="middle">تشخیصی</text><text class="body" x="646" y="102" text-anchor="end">تدریس سے پہلے</text><text class="body" x="436" y="102" text-anchor="end">کہاں سے شروع کریں؛ کیا</text><text class="body" x="436" y="122" text-anchor="end">پہلے درست کریں</text><text class="body" x="220" y="102" text-anchor="end">اپریل کا کسور والا جائزہ</text><text class="body" x="220" y="122" text-anchor="end">جس نے پندرہ دن بدل دیے</text><text class="sh" x="713" y="228" text-anchor="middle">تشکیلی</text><text class="body" x="646" y="218" text-anchor="end">تعلیم کے دوران،</text><text class="body" x="646" y="238" text-anchor="end">ہفتہ وار یا روزانہ</text><text class="body" x="436" y="218" text-anchor="end">دوبارہ سکھائیں، آگے بڑھیں،</text><text class="body" x="436" y="238" text-anchor="end">گروپ بدلیں</text><text class="body" x="220" y="218" text-anchor="end">منگل کا پنج سوال والا</text><text class="body" x="220" y="238" text-anchor="end">اختتامی کوئز</text><text class="sh" x="713" y="344" text-anchor="middle">مجموعی</text><text class="body" x="646" y="334" text-anchor="end">تدریس مکمل</text><text class="body" x="646" y="354" text-anchor="end">ہونے کے بعد</text><text class="body" x="436" y="334" text-anchor="end">مہارت، تیاری،</text><text class="body" x="436" y="354" text-anchor="end">نمبر</text><text class="body" x="220" y="334" text-anchor="end">دسمبر کا</text><text class="body" x="220" y="354" text-anchor="end">یونٹ امتحان</text><text class="sh" x="713" y="424" text-anchor="middle">تصدیق</text><text class="body" x="646" y="414" text-anchor="end">کورس یا مرحلے</text><text class="body" x="646" y="434" font-size="12.5" text-anchor="end">کے اختتام پر</text><text class="body" x="436" y="414" text-anchor="end">انتخاب اور</text><text class="body" x="436" y="434" text-anchor="end">اہلیت</text><text class="body" x="220" y="414" text-anchor="end">بورڈ کا امتحان</text><text class="body" x="220" y="434" text-anchor="end">اور اس کی سند</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
