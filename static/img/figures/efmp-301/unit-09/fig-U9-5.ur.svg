<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تشکیلی چکر</title><desc id="d">تشکیلی چکر کا خاکہ: ثبوت لیں، مقصد کے مقابلے تشریح کریں، اگلا تدریسی قدم بدلیں، اور دنوں کی رفتار سے اگلا چکر۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:13px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">تشکیلی چکر</text><rect class="panel" x="540" y="90" width="200" height="120" rx="10"/><text class="sh" x="640" y="118" text-anchor="middle">1. ثبوت لیں</text><text class="body" x="640" y="142" text-anchor="middle">ابھی کی تعلم کی ثبوت لیں:</text><text class="body" x="640" y="160" text-anchor="middle">اختتامی سوال، کیا ہوا</text><text class="body" x="640" y="178" text-anchor="middle">کام، دیکھی گئی گفتگو</text><rect class="panel" x="290" y="90" width="200" height="120" rx="10"/><text class="sh" x="390" y="118" text-anchor="middle">2. تشریح کریں</text><text class="body" x="390" y="142" text-anchor="middle">ثبوت کو مقصد کے مقابلے</text><text class="body" x="390" y="160" text-anchor="middle">پڑھیں: کیا بیٹھا، کیا</text><text class="body" x="390" y="178" text-anchor="middle">نہیں، کس کے لیے</text><rect class="panel" x="40" y="90" width="200" height="120" rx="10"/><text class="sh" x="140" y="118" text-anchor="middle">3. عمل کریں</text><text class="body" x="140" y="142" text-anchor="middle">اگلا تدریسی قدم بدلیں:</text><text class="body" x="140" y="160" text-anchor="middle">دوبارہ سکھائیں، آگے بڑھیں،</text><text class="body" x="140" y="178" text-anchor="middle">گروپ بدلیں</text><g class="stroke"><path d="M 540 150L 490 150"/><path d="M 290 150L 240 150"/></g><defs><marker id="a9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><g class="stroke"><path d="M 540 150L 494 150" marker-end="url(#a9)"/><path d="M 290 150L 244 150" marker-end="url(#a9)"/></g><path class="dash" d="M 140 210C 140 300 640 300 640 210" marker-end="url(#a9)"/><text class="small" x="390" y="290" text-anchor="middle">اگلا چکر، دن نہ کہ ہفتے</text><text class="small" x="390" y="360" text-anchor="middle">چکر تبھی تشکیلی ہے جب ثبوت کوئی فیصلہ بدلے</text><text class="small" x="390" y="382" text-anchor="middle">جبکہ تعلم جاری ہو: لی، سمجھی اور محفوظ کی گئی ثبوت</text><text class="small" x="390" y="404" text-anchor="middle">وہ مجموعی تشخیص ہے جو چھوٹا آلہ پہنے ہوئے ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
