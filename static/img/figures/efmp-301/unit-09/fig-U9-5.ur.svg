<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تشکیلی چکر</title><desc id="d">تشکیلی چکر کا فلو چارٹ: ثبوت جمع کریں، ہدف کے مقابل تشریح کریں، اگلے تدریسی قدم پر عمل کریں، اگلے چکر کے لیے بکھری واپسی تیر کے ساتھ، اور ایک نوٹ کہ یہ صرف تب تشکیلی ہے جب ثبوت فیصلہ بدلے جبکہ تعلم زندہ ہو۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-elicit-interpret" class="link" x1="540" y1="160" x2="500" y2="160" marker-end="url(#arrow)"/><line id="edge-interpret-act" class="link" x1="280" y1="160" x2="240" y2="160" marker-end="url(#arrow)"/><path id="edge-act-elicit" class="dash" d="M130 240 C130 340 650 340 650 240" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-elicit"><rect class="panel" x="540" y="80" width="220" height="160" rx="8"/><text class="sh" x="650" y="117" text-anchor="middle">‏1. ثبوت لیں‏</text><line class="grid" x1="740" y1="126" x2="560" y2="126"/><text class="cell" x="650" y="163" text-anchor="middle">‏ابھی کی تعلم کی ثبوت لیں:‏</text><text class="cell" x="650" y="189" text-anchor="middle">‏اختتامی سوال، کیا ہوا‏</text><text class="cell" x="650" y="215" text-anchor="middle">‏کام، دیکھی گئی گفتگو‏</text></g><g id="node-interpret"><rect class="panel" x="280" y="80" width="220" height="160" rx="8"/><text class="sh" x="390" y="117" text-anchor="middle">‏2. تشریح کریں‏</text><line class="grid" x1="480" y1="126" x2="300" y2="126"/><text class="cell" x="390" y="163" text-anchor="middle">‏ثبوت کو مقصد کے مقابلے‏</text><text class="cell" x="390" y="189" text-anchor="middle">‏پڑھیں: کیا بیٹھا، کیا‏</text><text class="cell" x="390" y="215" text-anchor="middle">‏نہیں، کس کے لیے‏</text></g><g id="node-act"><rect class="panel" x="20" y="80" width="220" height="160" rx="8"/><text class="sh" x="130" y="117" text-anchor="middle">‏3. عمل کریں‏</text><line class="grid" x1="220" y1="126" x2="40" y2="126"/><text class="cell" x="130" y="163" text-anchor="middle">‏اگلا تدریسی قدم بدلیں:‏</text><text class="cell" x="130" y="189" text-anchor="middle">‏دوبارہ سکھائیں، آگے بڑھیں،‏</text><text class="cell" x="130" y="215" text-anchor="middle">‏گروپ بدلیں‏</text></g></g><g id="layer-labels"><g id="label-heading"><text class="h" x="390" y="41" text-anchor="middle">‏تشکیلی چکر‏</text></g><g id="label-return"><text class="small" x="390" y="341" text-anchor="middle">‏اگلا چکر، دن نہ کہ ہفتے‏</text></g><g id="label-note"><text class="small" x="390" y="397" text-anchor="middle">‏چکر تبھی تشکیلی ہے جب ثبوت کوئی فیصلہ بدلے‏</text><text class="small" x="390" y="425" text-anchor="middle">‏جبکہ تعلم جاری ہو: لی، سمجھی اور محفوظ کی گئی ثبوت‏</text><text class="small" x="390" y="453" text-anchor="middle">‏وہ مجموعی تشخیص ہے جو چھوٹا آلہ پہنے ہوئے ہے۔‏</text></g><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>