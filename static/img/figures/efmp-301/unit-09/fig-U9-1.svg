<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A concept map of assessment purposes</title><desc id="d">A concept map of assessment with four purpose branches - diagnose, form, sum and certify - each with its question, the decision it feeds, and a real instance.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke"><path d="M390 235 L390 130"/><path d="M390 235 L390 350"/><path d="M340 235 L170 235"/><path d="M440 235 L610 235"/></g><ellipse class="ink" cx="390" cy="235" rx="96" ry="46" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">assessment</text><rect class="panel" x="290" y="60" width="200" height="70" rx="10"/><text class="sh" x="390" y="84" text-anchor="middle">diagnose</text><text class="body" x="390" y="104" text-anchor="middle">what do they bring?</text><text class="body" x="390" y="122" text-anchor="middle">feeds: where to start</text><text class="small" x="390" y="46" text-anchor="middle">the April check</text><rect class="panel" x="290" y="350" width="200" height="70" rx="10"/><text class="sh" x="390" y="374" text-anchor="middle">sum</text><text class="body" x="390" y="394" text-anchor="middle">what has been mastered?</text><text class="body" x="390" y="412" text-anchor="middle">feeds: readiness and grades</text><text class="small" x="390" y="446" text-anchor="middle">the December test</text><rect class="panel" x="20" y="200" width="200" height="70" rx="10"/><text class="sh" x="120" y="224" text-anchor="middle">form</text><text class="body" x="120" y="244" text-anchor="middle">what is landing now?</text><text class="body" x="120" y="262" text-anchor="middle">feeds: tomorrow's teaching</text><text class="small" x="120" y="292" text-anchor="middle">the Tuesday exit quiz</text><rect class="panel" x="560" y="200" width="200" height="70" rx="10"/><text class="sh" x="660" y="224" text-anchor="middle">certify</text><text class="body" x="660" y="244" text-anchor="middle">what can this person do?</text><text class="body" x="660" y="262" text-anchor="middle">feeds: selection, qualification</text><text class="small" x="660" y="292" text-anchor="middle">the board examination</text><text class="small" x="120" y="180" text-anchor="middle">every assessment feeds a decision;</text><text class="small" x="120" y="196" text-anchor="middle">name the decision and the type names itself</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
