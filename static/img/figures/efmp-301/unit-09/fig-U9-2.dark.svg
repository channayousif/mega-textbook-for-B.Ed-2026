<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four assessment types</title><desc id="d">A table of four assessment types - diagnostic, formative, summative and certification - each against when it happens, the decision it feeds, and one Sindh classroom instance.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="450"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="20" y="90" width="130" height="320"/><path class="grid" d="M150 20V410M320 20V410M540 20V410M20 170H760M20 250H760M20 330H760"/><path class="rule" d="M20 90H760"/><rect class="frame" x="20" y="20" width="740" height="390" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-0"><text class="sh" x="85" y="60" text-anchor="middle">type</text></g><g id="node-head-1"><text class="sh" x="235" y="60" text-anchor="middle">when it happens</text></g><g id="node-head-2"><text class="sh" x="430" y="60" text-anchor="middle">the decision it feeds</text></g><g id="node-head-3"><text class="sh" x="650" y="51" text-anchor="middle">one Sindh classroom</text><text class="sh" x="650" y="69" text-anchor="middle">instance</text></g><g id="node-row-diagnostic"><text class="sh" x="85" y="135" text-anchor="middle">diagnostic</text><text class="cell" x="162" y="135" text-anchor="start">before instruction</text><text class="cell" x="332" y="126" text-anchor="start">where to start; what to</text><text class="cell" x="332" y="144" text-anchor="start">repair first</text><text class="cell" x="552" y="126" text-anchor="start">the April fractions check</text><text class="cell" x="552" y="144" text-anchor="start">that re-planned a fortnight</text></g><g id="node-row-formative"><text class="sh" x="85" y="215" text-anchor="middle">formative</text><text class="cell" x="162" y="206" text-anchor="start">during learning,</text><text class="cell" x="162" y="224" text-anchor="start">weekly or daily</text><text class="cell" x="332" y="206" text-anchor="start">re-teach, advance,</text><text class="cell" x="332" y="224" text-anchor="start">re-group</text><text class="cell" x="552" y="206" text-anchor="start">the Tuesday five-question</text><text class="cell" x="552" y="224" text-anchor="start">exit quiz</text></g><g id="node-row-summative"><text class="sh" x="85" y="295" text-anchor="middle">summative</text><text class="cell" x="162" y="286" text-anchor="start">after instruction</text><text class="cell" x="162" y="304" text-anchor="start">is complete</text><text class="cell" x="332" y="286" text-anchor="start">mastery, readiness,</text><text class="cell" x="332" y="304" text-anchor="start">grades</text><text class="cell" x="552" y="286" text-anchor="start">the December</text><text class="cell" x="552" y="304" text-anchor="start">unit test</text></g><g id="node-row-certification"><text class="sh" x="85" y="375" text-anchor="middle">certification</text><text class="cell" x="162" y="366" text-anchor="start">end of course</text><text class="cell" x="162" y="384" text-anchor="start">or stage</text><text class="cell" x="332" y="366" text-anchor="start">selection and</text><text class="cell" x="332" y="384" text-anchor="start">qualification</text><text class="cell" x="552" y="366" text-anchor="start">the board examination</text><text class="cell" x="552" y="384" text-anchor="start">and its certificate</text></g></g><g id="layer-labels"><text class="wm" x="768" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>