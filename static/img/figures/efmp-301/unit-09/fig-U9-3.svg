<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing teacher-made and standardised tests</title><desc id="d">A table comparing teacher-made and standardised tests on who writes each, what stays fixed, what each trades away, and what each is for.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M162 14V426M392 14V426M12 74H768M12 250H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="87" y="48" text-anchor="middle">who writes it</text><text class="h" x="277" y="40" text-anchor="middle">what stays</text><text class="h" x="277" y="60" text-anchor="middle">fixed</text><text class="h" x="580" y="40" text-anchor="middle">what it trades away</text><text class="h" x="580" y="60" text-anchor="middle">and what for</text><text class="sh" x="87" y="112" text-anchor="middle">teacher-made</text><text class="body" x="174" y="98">the teacher, for this class,</text><text class="body" x="174" y="118">this week</text><text class="body" x="404" y="98">nothing: items, timing and</text><text class="body" x="404" y="118">scoring are free</text><text class="body" x="592" y="98">trades comparability</text><text class="body" x="592" y="118">for fit: this class's decisions</text><text class="sh" x="87" y="288" text-anchor="middle">standardised</text><text class="body" x="174" y="274">a test publisher or board,</text><text class="body" x="174" y="294">for many classes at once</text><text class="body" x="404" y="274">items, administration</text><text class="body" x="404" y="294">conditions, scoring rules</text><text class="body" x="592" y="274">trades fit to one class</text><text class="body" x="592" y="294">for comparability: beyond</text><text class="body" x="592" y="314">the classroom</text><text class="small" x="390" y="410" text-anchor="middle">Neither family is better: they answer different questions, and a school needs both.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
