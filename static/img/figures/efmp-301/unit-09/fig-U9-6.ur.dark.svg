<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تشکیلی بمقابلہ مجموعی جائزہ</title><desc id="d">تشکیلی اور مجموعی جائزے کا جدول: مقصد، وقت، کس کام کے لیے کبھی استعمال نہ کریں، اور گڈمڈی کی قیمت۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 658 14V426M344 14V426M12 74H768M12 154H768M12 234H768M12 314H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="713" y="48" text-anchor="middle"></text><text class="h" x="501" y="48" text-anchor="middle">تشکیلی</text><text class="h" x="178" y="48" text-anchor="middle">مجموعی</text><text class="sh" x="713" y="112" text-anchor="middle">مقصد</text><text class="body" x="646" y="102" text-anchor="end">تعلیم کے دوران اسے</text><text class="body" x="646" y="122" text-anchor="end">سانچے میں ڈھالیں</text><text class="body" x="332" y="102" text-anchor="end">مہارت، تیاری اور نمبر</text><text class="body" x="332" y="122" text-anchor="end">کی تصدیق کریں</text><text class="sh" x="713" y="192" text-anchor="middle">وقت</text><text class="body" x="646" y="182" text-anchor="end">تعلیم کے دوران،</text><text class="body" x="646" y="202" text-anchor="end">دن نہ کہ ہفتے</text><text class="body" x="332" y="182" text-anchor="end">تدریس مکمل</text><text class="body" x="332" y="202" text-anchor="end">ہونے کے بعد</text><text class="sh" x="713" y="272" text-anchor="middle">کبھی استعمال</text><text class="sh" x="713" y="290" text-anchor="middle">نہ کریں</text><text class="body" x="646" y="262" text-anchor="end">ٹرم ریکارڈ؛ شاگردوں کا</text><text class="body" x="646" y="282" text-anchor="end">آپس میں موازنہ</text><text class="body" x="332" y="262" text-anchor="end">جو وہ ڈھونڈے اس کی دوبارہ تدریس -</text><text class="body" x="332" y="282" text-anchor="end">وہ تدریس جو بدلتی، وہ ختم ہو چکی</text><text class="sh" x="713" y="352" text-anchor="middle">گڈمڈی کی</text><text class="sh" x="713" y="370" text-anchor="middle">قیمت</text><text class="body" x="646" y="342" text-anchor="end">معلومات خطرہ بن جاتی ہے؛</text><text class="body" x="646" y="362" text-anchor="end">بچاؤ کا چکر شروع ہوتا ہے</text><text class="body" x="332" y="342" text-anchor="end">خلا تب ملتا ہے جب کچھ</text><text class="body" x="332" y="362" text-anchor="end">نہیں کیا جا سکتا</text><text class="body" x="390" y="412" text-anchor="middle">پہلے فیصلہ نام کریں، پھر فیصلہ وقت چنے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
