<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تشکیلی بمقابلہ مجموعی جائزہ</title><desc id="d">تشکیلی اور مجموعی تشخیص کا تقابلی جدول: مقصد، وقت، ثبوت کے مزید ممکن استعمال، اور تشریح و بازخورد کی احتیاطیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="60"/><rect id="region-labels" class="side" x="620" y="80" width="140" height="320"/><path class="grid" d="M620 20 V400 M320 20 V400 M760 160 H20 M760 240 H20 M760 320 H20"/><path class="rule" d="M760 80 H20"/><rect class="frame" x="20" y="20" width="740" height="380" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="470" y="55" text-anchor="middle">‏تشکیلی‏</text></g><g id="node-head-2"><text class="sh" x="170" y="55" text-anchor="middle">‏مجموعی‏</text></g><g id="node-row-purpose"><text class="sh" x="690" y="125" text-anchor="middle">‏مقصد‏</text><text class="cell" x="608" y="112" text-anchor="end">‏تعلیم کے دوران اسے‏</text><text class="cell" x="608" y="138" text-anchor="end">‏سانچے میں ڈھالیں‏</text><text class="cell" x="308" y="112" text-anchor="end">‏مہارت، تیاری اور نمبر‏</text><text class="cell" x="308" y="138" text-anchor="end">‏کی تصدیق کریں‏</text></g><g id="node-row-timing"><text class="sh" x="690" y="205" text-anchor="middle">‏وقت‏</text><text class="cell" x="608" y="192" text-anchor="end">‏تعلیم کے دوران،‏</text><text class="cell" x="608" y="218" text-anchor="end">‏اگلے فیصلے سے پہلے‏</text><text class="cell" x="308" y="192" text-anchor="end">‏تدریس مکمل‏</text><text class="cell" x="308" y="218" text-anchor="end">‏ہونے کے بعد‏</text></g><g id="node-row-other-uses"><text class="sh" x="690" y="272" text-anchor="middle">‏ثبوت کے‏</text><text class="sh" x="690" y="298" text-anchor="middle">‏مزید استعمال‏</text><text class="cell" x="608" y="272" text-anchor="end">‏مناسب ثبوت ہو تو‏</text><text class="cell" x="608" y="298" text-anchor="end">‏نمبر بھی دیے جا سکتے ہیں‏</text><text class="cell" x="308" y="272" text-anchor="end">‏آئندہ مدد کی رہنمائی؛‏</text><text class="cell" x="308" y="298" text-anchor="end">‏گزرے سبق نہیں بدل سکتے‏</text></g><g id="node-row-cautions"><text class="sh" x="690" y="352" text-anchor="middle">‏استعمال کی‏</text><text class="sh" x="690" y="378" text-anchor="middle">‏احتیاطیں‏</text><text class="cell" x="608" y="352" text-anchor="end">‏استعمال سمجھائیں؛ مفید‏</text><text class="cell" x="608" y="378" text-anchor="end">‏بازخورد دیں؛ ردعمل جانچیں‏</text><text class="cell" x="308" y="352" text-anchor="end">‏مدد کا منصوبہ بنانے سے‏</text><text class="cell" x="308" y="378" text-anchor="end">‏پہلے تشریح جانچیں‏</text></g></g><g id="layer-labels"><g id="label-closing"><text class="body" x="390" y="441" text-anchor="middle">‏پہلے فیصلہ نام کریں، پھر فیصلہ وقت چنے۔‏</text></g><text class="wm" x="12" y="480" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>