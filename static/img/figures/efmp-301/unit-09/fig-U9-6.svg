<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing formative and summative evaluation</title><desc id="d">A table comparing formative and summative evaluation on purpose, timing, possible additional uses of evidence, and cautions about interpretation and feedback.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="60"/><rect id="region-labels" class="side" x="20" y="80" width="140" height="320"/><path class="grid" d="M160 20V400M460 20V400M20 160H760M20 240H760M20 320H760"/><path class="rule" d="M20 80H760"/><rect class="frame" x="20" y="20" width="740" height="380" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="310" y="55" text-anchor="middle">formative</text></g><g id="node-head-2"><text class="sh" x="610" y="55" text-anchor="middle">summative</text></g><g id="node-row-purpose"><text class="sh" x="90" y="125" text-anchor="middle">purpose</text><text class="cell" x="172" y="116" text-anchor="start">shape learning while it</text><text class="cell" x="172" y="134" text-anchor="start">is under way</text><text class="cell" x="472" y="116" text-anchor="start">certify mastery, readiness</text><text class="cell" x="472" y="134" text-anchor="start">and grades</text></g><g id="node-row-timing"><text class="sh" x="90" y="205" text-anchor="middle">timing</text><text class="cell" x="172" y="196" text-anchor="start">during learning,</text><text class="cell" x="172" y="214" text-anchor="start">before the next decision</text><text class="cell" x="472" y="196" text-anchor="start">after instruction</text><text class="cell" x="472" y="214" text-anchor="start">is complete</text></g><g id="node-row-other-uses"><text class="sh" x="90" y="276" text-anchor="middle">other uses</text><text class="sh" x="90" y="294" text-anchor="middle">of evidence</text><text class="cell" x="172" y="276" text-anchor="start">may also inform grades</text><text class="cell" x="172" y="294" text-anchor="start">if the evidence justifies it</text><text class="cell" x="472" y="276" text-anchor="start">can guide future support;</text><text class="cell" x="472" y="294" text-anchor="start">cannot change past lessons</text></g><g id="node-row-cautions"><text class="sh" x="90" y="356" text-anchor="middle">cautions</text><text class="sh" x="90" y="374" text-anchor="middle">for use</text><text class="cell" x="172" y="356" text-anchor="start">explain uses; give useful</text><text class="cell" x="172" y="374" text-anchor="start">feedback; check responses</text><text class="cell" x="472" y="356" text-anchor="start">check the interpretation</text><text class="cell" x="472" y="374" text-anchor="start">before planning support</text></g></g><g id="layer-labels"><g id="label-closing"><text class="body" x="390" y="441" text-anchor="middle">Name the decision first, and let the decision choose the timing.</text></g><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>