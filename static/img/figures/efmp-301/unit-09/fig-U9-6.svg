<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing formative and summative evaluation</title><desc id="d">A table comparing formative and summative evaluation on purpose, timing, what each must never be used for, and the cost of confusing them.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M122 14V426M436 14V426M12 74H768M12 154H768M12 234H768M12 314H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="67" y="48" text-anchor="middle"></text><text class="h" x="279" y="48" text-anchor="middle">formative</text><text class="h" x="602" y="48" text-anchor="middle">summative</text><text class="sh" x="67" y="112" text-anchor="middle">purpose</text><text class="body" x="134" y="102">shape learning while it</text><text class="body" x="134" y="122">is under way</text><text class="body" x="448" y="102">certify mastery, readiness</text><text class="body" x="448" y="122">and grades</text><text class="sh" x="67" y="192" text-anchor="middle">timing</text><text class="body" x="134" y="182">during learning,</text><text class="body" x="134" y="202">days not weeks</text><text class="body" x="448" y="182">after instruction</text><text class="body" x="448" y="202">is complete</text><text class="sh" x="67" y="272" text-anchor="middle">never use</text><text class="sh" x="67" y="290" text-anchor="middle">it for</text><text class="body" x="134" y="262">the term record; ranking</text><text class="body" x="134" y="282">pupils against each other</text><text class="body" x="448" y="262">re-teaching what it finds -</text><text class="body" x="448" y="282">the teaching it would shape is over</text><text class="sh" x="67" y="352" text-anchor="middle">cost of</text><text class="sh" x="67" y="370" text-anchor="middle">confusion</text><text class="body" x="134" y="342">information becomes threat;</text><text class="body" x="134" y="362">the protect loop begins</text><text class="body" x="448" y="342">the gap is found when nothing</text><text class="body" x="448" y="362">can be done about it</text><text class="body" x="390" y="412" text-anchor="middle">Name the decision first, and let the decision choose the timing.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
