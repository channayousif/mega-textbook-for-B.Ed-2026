<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار اقسام کی تشخیص</title><desc id="d">چار جانچ اقساموں کا جدول: تشخیصی، تشکیلی، مجموعی اور تصدیق: ہر ایک کے ساتھ یہ کب ہوتی ہے، کس فیصلے کو کھلاتی ہے، اور ایک سندھی جماعتی مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="450"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="630" y="90" width="130" height="320"/><path class="grid" d="M630 20 V410 M460 20 V410 M240 20 V410 M760 170 H20 M760 250 H20 M760 330 H20"/><path class="rule" d="M760 90 H20"/><rect class="frame" x="20" y="20" width="740" height="390" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-0"><text class="sh" x="695" y="60" text-anchor="middle">‏قسم‏</text></g><g id="node-head-1"><text class="sh" x="545" y="60" text-anchor="middle">‏کب ہوتی ہے‏</text></g><g id="node-head-2"><text class="sh" x="350" y="47" text-anchor="middle">‏وہ فیصلہ جو‏</text><text class="sh" x="350" y="73" text-anchor="middle">‏وہ جاتی ہے‏</text></g><g id="node-head-3"><text class="sh" x="130" y="47" text-anchor="middle">‏سندھ کی جماعت کی‏</text><text class="sh" x="130" y="73" text-anchor="middle">‏ایک مثال‏</text></g><g id="node-row-diagnostic"><text class="sh" x="695" y="135" text-anchor="middle">‏تشخیصی‏</text><text class="cell" x="618" y="135" text-anchor="end">‏تدریس سے پہلے‏</text><text class="cell" x="448" y="122" text-anchor="end">‏کہاں سے شروع کریں؛ کیا‏</text><text class="cell" x="448" y="148" text-anchor="end">‏پہلے درست کریں‏</text><text class="cell" x="228" y="122" text-anchor="end">‏اپریل کا کسور والا جائزہ‏</text><text class="cell" x="228" y="148" text-anchor="end">‏جس نے پندرہ دن بدل دیے‏</text></g><g id="node-row-formative"><text class="sh" x="695" y="215" text-anchor="middle">‏تشکیلی‏</text><text class="cell" x="618" y="202" text-anchor="end">‏تعلیم کے دوران،‏</text><text class="cell" x="618" y="228" text-anchor="end">‏ہفتہ وار یا روزانہ‏</text><text class="cell" x="448" y="202" text-anchor="end">‏دوبارہ سکھائیں، آگے بڑھیں،‏</text><text class="cell" x="448" y="228" text-anchor="end">‏گروپ بدلیں‏</text><text class="cell" x="228" y="202" text-anchor="end">‏منگل کا پنج سوال والا‏</text><text class="cell" x="228" y="228" text-anchor="end">‏اختتامی کوئز‏</text></g><g id="node-row-summative"><text class="sh" x="695" y="295" text-anchor="middle">‏مجموعی‏</text><text class="cell" x="618" y="282" text-anchor="end">‏تدریس مکمل‏</text><text class="cell" x="618" y="308" text-anchor="end">‏ہونے کے بعد‏</text><text class="cell" x="448" y="282" text-anchor="end">‏مہارت، تیاری،‏</text><text class="cell" x="448" y="308" text-anchor="end">‏نمبر‏</text><text class="cell" x="228" y="282" text-anchor="end">‏دسمبر کا‏</text><text class="cell" x="228" y="308" text-anchor="end">‏یونٹ امتحان‏</text></g><g id="node-row-certification"><text class="sh" x="695" y="375" text-anchor="middle">‏تصدیق‏</text><text class="cell" x="618" y="362" text-anchor="end">‏کورس یا مرحلے‏</text><text class="cell" x="618" y="388" text-anchor="end">‏کے اختتام پر‏</text><text class="cell" x="448" y="362" text-anchor="end">‏انتخاب اور‏</text><text class="cell" x="448" y="388" text-anchor="end">‏اہلیت‏</text><text class="cell" x="228" y="362" text-anchor="end">‏بورڈ کا امتحان‏</text><text class="cell" x="228" y="388" text-anchor="end">‏اور اس کی سند‏</text></g></g><g id="layer-labels"><text class="wm" x="12" y="440" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>