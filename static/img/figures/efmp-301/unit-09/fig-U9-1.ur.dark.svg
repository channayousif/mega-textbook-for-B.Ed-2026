<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تشخیص کے مقاصد کا تصوری نقشہ</title><desc id="d">تشخیص کا تصوری نقشہ چار مقصدوں کی شاخوں کے ساتھ: تشخیصِ آغاز، تشکیل، مجموعہ اور تصدیق، ہر ایک کا سوال، وہ فیصلہ جو وہ جاتی ہے، اور ایک حقیقی مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><g class="stroke"><path d="M 390 235L 390 130"/><path d="M 390 235L 390 350"/><path d="M 440 235L 610 235"/><path d="M 340 235L 170 235"/></g><ellipse class="ink" cx="390" cy="235" rx="96" ry="46" stroke="var(--ink)" stroke-width="2.5"/><text x="390" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bg)">تشخیص</text><rect class="panel" x="290" y="60" width="200" height="70" rx="10"/><text class="sh" x="390" y="84" text-anchor="middle">تشخیصِ آغاز</text><text class="body" x="390" y="104" text-anchor="middle">وہ کیا لے کر آتے ہیں؟</text><text class="body" x="390" y="122" text-anchor="middle">فیصلہ: کہاں سے شروع کریں</text><text class="small" x="390" y="46" text-anchor="middle">اپریل کا جائزہ</text><rect class="panel" x="290" y="350" width="200" height="70" rx="10"/><text class="sh" x="390" y="374" text-anchor="middle">مجموعہ</text><text class="body" x="390" y="394" text-anchor="middle">کیا آ چکا ہے؟</text><text class="body" x="390" y="412" text-anchor="middle">فیصلہ: تیاری اور نمبر</text><text class="small" x="390" y="446" text-anchor="middle">دسمبر کا امتحان</text><rect class="panel" x="560" y="200" width="200" height="70" rx="10"/><text class="sh" x="660" y="224" text-anchor="middle">تشکیل</text><text class="body" x="660" y="244" text-anchor="middle">ابھی کیا بیٹھ رہا ہے؟</text><text class="body" x="660" y="262" text-anchor="middle">فیصلہ: کل کی تدریس</text><text class="small" x="660" y="292" text-anchor="middle">منگل کا اختتامی کوئز</text><rect class="panel" x="20" y="200" width="200" height="70" rx="10"/><text class="sh" x="120" y="224" text-anchor="middle">تصدیق</text><text class="body" x="120" y="244" text-anchor="middle">یہ شخص کیا کر سکتا ہے؟</text><text class="body" x="120" y="262" text-anchor="middle">فیصلہ: انتخاب، اہلیت</text><text class="small" x="120" y="292" text-anchor="middle">بورڈ کا امتحان</text><text class="small" x="660" y="180" text-anchor="middle">ہر تشخیص کسی فیصلے کو جاتی ہے؛</text><text class="small" x="660" y="196" text-anchor="middle">فیصلہ نام کریں تو قسم خود بتا دے گی</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
