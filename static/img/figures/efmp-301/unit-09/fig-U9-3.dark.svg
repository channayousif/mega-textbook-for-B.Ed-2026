<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table comparing teacher-made and standardised tests</title><desc id="d">A table comparing teacher-made and standardised tests on who writes each, what stays fixed, what each trades away, and what each is for.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="20" y="90" width="130" height="200"/><path class="grid" d="M150 20V290M360 20V290M560 20V290M20 190H760"/><path class="rule" d="M20 90H760"/><rect class="frame" x="20" y="20" width="740" height="270" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="255" y="60" text-anchor="middle">who writes it</text></g><g id="node-head-2"><text class="sh" x="460" y="60" text-anchor="middle">what stays fixed</text></g><g id="node-head-3"><text class="sh" x="660" y="51" text-anchor="middle">what it trades away</text><text class="sh" x="660" y="69" text-anchor="middle">and what for</text></g><g id="node-row-teacher-made"><text class="sh" x="85" y="145" text-anchor="middle">teacher-made</text><text class="cell" x="162" y="136" text-anchor="start">the teacher, for this class,</text><text class="cell" x="162" y="154" text-anchor="start">this week</text><text class="cell" x="372" y="136" text-anchor="start">nothing: items, timing</text><text class="cell" x="372" y="154" text-anchor="start">and scoring are free</text><text class="cell" x="572" y="127" text-anchor="start">trades comparability</text><text class="cell" x="572" y="145" text-anchor="start">for fit: this class's</text><text class="cell" x="572" y="163" text-anchor="start">decisions</text></g><g id="node-row-standardised"><text class="sh" x="85" y="245" text-anchor="middle">standardised</text><text class="cell" x="162" y="236" text-anchor="start">a test publisher or board,</text><text class="cell" x="162" y="254" text-anchor="start">for many classes at once</text><text class="cell" x="372" y="236" text-anchor="start">items, administration</text><text class="cell" x="372" y="254" text-anchor="start">conditions, scoring rules</text><text class="cell" x="572" y="227" text-anchor="start">trades fit to one class</text><text class="cell" x="572" y="245" text-anchor="start">for comparability: beyond</text><text class="cell" x="572" y="263" text-anchor="start">the classroom</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="390" y="331" text-anchor="middle">Neither family is better: they answer different questions, and a school needs both.</text></g><text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>