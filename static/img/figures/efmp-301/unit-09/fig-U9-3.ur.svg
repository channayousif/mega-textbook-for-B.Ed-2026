<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد ساختہ بمقابلہ معیاری آزمائش</title><desc id="d">استاد ساختہ اور معیاری آزمائشوں کا جدول: کون لکھتا ہے، کیا پکا رہتا ہے، کیا چھوڑتا ہے اور کس کے لیے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 618 14V426M392 14V426M12 74H768M12 250H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="693" y="48" text-anchor="middle">کون لکھتا ہے</text><text class="h" x="503" y="40" text-anchor="middle">کیا پکا</text><text class="h" x="503" y="60" text-anchor="middle">رہتا ہے</text><text class="h" x="200" y="40" text-anchor="middle">کیا چھوڑتا ہے</text><text class="h" x="200" y="60" text-anchor="middle">اور کس کے لیے</text><text class="sh" x="693" y="112" text-anchor="middle">استاد ساختہ</text><text class="body" x="606" y="98" text-anchor="end">استاد، اسی جماعت کے لیے،</text><text class="body" x="606" y="118" text-anchor="end">اسی ہفتے</text><text class="body" x="376" y="98" text-anchor="end">کچھ نہیں: سوال، وقت اور</text><text class="body" x="376" y="118" text-anchor="end">نمبر دینا آزاد</text><text class="body" x="188" y="98" text-anchor="end">موازنہ اور دفاع چھوڑ کر</text><text class="body" x="188" y="118" text-anchor="end">مناسبت لیتا ہے: اسی جماعت کے فیصلے</text><text class="sh" x="693" y="288" text-anchor="middle">معیاری</text><text class="body" x="606" y="274" text-anchor="end">ٹیسٹ پبلشر یا بورڈ،</text><text class="body" x="606" y="294" text-anchor="end">ایک ساتھ کئی جماعتوں کے لیے</text><text class="body" x="376" y="274" text-anchor="end">سوال، انتظامی</text><text class="body" x="376" y="294" text-anchor="end">شرائط، نمبر کے قواعد</text><text class="body" x="188" y="274" text-anchor="end">کسی ایک جماعت کے سوال سے مناسبت چھوڑ کر</text><text class="body" x="188" y="294" text-anchor="end">موازنہ لیتا ہے: جماعت سے باہر کے فیصلے</text><text class="body" x="188" y="314" text-anchor="end"></text><text class="small" x="390" y="410" text-anchor="middle">کوئی خاندان بہتر نہیں: دونوں الگ سوالوں کے جواب ہیں، اور اسکول کو دونوں چاہئے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
