<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد ساختہ بمقابلہ معیاری آزمائش</title><desc id="d">استاد ساختہ اور معیاری آزمائشوں کا موازنہ کرنے والا جدول: کون لکھتا ہے، کیا طے رہتا ہے، ہر ایک کیا دیتا ہے، اور ہر ایک کس کام کے لیے ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"><rect id="region-head" class="head" x="20" y="20" width="740" height="70"/><rect id="region-labels" class="side" x="630" y="90" width="130" height="200"/><path class="grid" d="M630 20 V290 M420 20 V290 M220 20 V290 M760 190 H20"/><path class="rule" d="M760 90 H20"/><rect class="frame" x="20" y="20" width="740" height="270" rx="6"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="525" y="60" text-anchor="middle">‏کون لکھتا ہے‏</text></g><g id="node-head-2"><text class="sh" x="320" y="60" text-anchor="middle">‏کیا پکا رہتا ہے‏</text></g><g id="node-head-3"><text class="sh" x="120" y="47" text-anchor="middle">‏کیا چھوڑتا ہے‏</text><text class="sh" x="120" y="73" text-anchor="middle">‏اور کس کے لیے‏</text></g><g id="node-row-teacher-made"><text class="sh" x="695" y="145" text-anchor="middle">‏استاد ساختہ‏</text><text class="cell" x="618" y="132" text-anchor="end">‏استاد، اسی جماعت کے لیے،‏</text><text class="cell" x="618" y="158" text-anchor="end">‏اسی ہفتے‏</text><text class="cell" x="408" y="132" text-anchor="end">‏کچھ نہیں: سوال، وقت اور‏</text><text class="cell" x="408" y="158" text-anchor="end">‏نمبر دینا آزاد‏</text><text class="cell" x="208" y="132" text-anchor="end">‏موازنہ چھوڑ کر‏</text><text class="cell" x="208" y="158" text-anchor="end">‏مناسبت: اسی جماعت کے فیصلے‏</text></g><g id="node-row-standardised"><text class="sh" x="695" y="245" text-anchor="middle">‏معیاری‏</text><text class="cell" x="618" y="232" text-anchor="end">‏ٹیسٹ پبلشر یا بورڈ،‏</text><text class="cell" x="618" y="258" text-anchor="end">‏ایک ساتھ کئی جماعتوں کے لیے‏</text><text class="cell" x="408" y="232" text-anchor="end">‏سوال، انتظامی‏</text><text class="cell" x="408" y="258" text-anchor="end">‏شرائط، نمبر کے قواعد‏</text><text class="cell" x="208" y="219" text-anchor="end">‏ایک جماعت کی مناسبت چھوڑ کر‏</text><text class="cell" x="208" y="245" text-anchor="end">‏موازنہ لاتا ہے: جماعت سے‏</text><text class="cell" x="208" y="271" text-anchor="end">‏باہر کے فیصلے‏</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="390" y="331" text-anchor="middle">‏کوئی خاندان بہتر نہیں: دونوں الگ سوالوں کے جواب ہیں، اور اسکول کو دونوں چاہئے۔‏</text></g><text class="wm" x="12" y="370" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>