<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد ساختہ بمقابلہ معیاری آزمائش</title><desc id="d">استاد ساختہ اور معیاری آزمائشوں کا جدول: کون لکھتا ہے، کیا پکا رہتا ہے، کیا چھوڑتا ہے اور کس کے لیے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:13px;font-weight:700;fill:var(--ink)}.sh{font-size:12.5px;font-weight:600;fill:var(--ink)}.body{font-size:11.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M 618 14V426M392 14V426M12 74H768M12 250H768"/><path class="ink" d="M 768 74H768V78H12z"/><text class="h" x="693" y="48" text-anchor="middle">کون لکھتا ہے</text><text class="h" x="503" y="40" text-anchor="middle">کیا پکا</text><text class="h" x="503" y="60" text-anchor="middle">رہتا ہے</text><text class="h" x="200" y="40" text-anchor="middle">کیا چھوڑتا ہے</text><text class="h" x="200" y="60" text-anchor="middle">اور کس کے لیے</text><text class="sh" x="693" y="112" text-anchor="middle">استاد ساختہ</text><text class="body" x="606" y="98">استاد، اسی جماعت کے لیے،</text><text class="body" x="606" y="118">اسی ہفتے</text><text class="body" x="376" y="98">کچھ نہیں: سوال، وقت اور</text><text class="body" x="376" y="118">نمبر دینا آزاد</text><text class="body" x="188" y="98">موازنہ اور دفاع چھوڑ کر</text><text class="body" x="188" y="118">مناسبت لیتا ہے: اسی جماعت کے فیصلے</text><text class="sh" x="693" y="288" text-anchor="middle">معیاری</text><text class="body" x="606" y="274">ٹیسٹ پبلشر یا بورڈ،</text><text class="body" x="606" y="294">ایک ساتھ کئی جماعتوں کے لیے</text><text class="body" x="376" y="274">سوال، انتظامی</text><text class="body" x="376" y="294">شرائط، نمبر کے قواعد</text><text class="body" x="188" y="274">کسی ایک جماعت کے سوال سے مناسبت چھوڑ کر</text><text class="body" x="188" y="294">موازنہ لیتا ہے: جماعت سے باہر کے فیصلے</text><text class="body" x="188" y="314"></text><text class="small" x="390" y="410" text-anchor="middle">کوئی خاندان بہتر نہیں: دونوں الگ سوالوں کے جواب ہیں، اور اسکول کو دونوں چاہئے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
