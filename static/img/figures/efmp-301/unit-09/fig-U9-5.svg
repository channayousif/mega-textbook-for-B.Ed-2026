<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of the formative cycle</title><desc id="d">A flowchart of the formative cycle: elicit evidence, interpret against the goal, act on the next teaching move, with a dashed return arrow for the next round, and a note that it is formative only if the evidence changes a decision while learning is live.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-elicit-interpret" class="link" x1="240" y1="160" x2="280" y2="160" marker-end="url(#arrow)"/><line id="edge-interpret-act" class="link" x1="500" y1="160" x2="540" y2="160" marker-end="url(#arrow)"/><path id="edge-act-elicit" class="dash" d="M650 240C650 340 130 340 130 240" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-elicit"><rect class="panel" x="20" y="80" width="220" height="160" rx="8"/><text class="sh" x="130" y="113" text-anchor="middle">1. elicit</text><line class="grid" x1="40" y1="126" x2="220" y2="126"/><text class="cell" x="130" y="171" text-anchor="middle">gather evidence of learning</text><text class="cell" x="130" y="189" text-anchor="middle">now: the exit question, the</text><text class="cell" x="130" y="207" text-anchor="middle">worked task, the observed talk</text></g><g id="node-interpret"><rect class="panel" x="280" y="80" width="220" height="160" rx="8"/><text class="sh" x="390" y="113" text-anchor="middle">2. interpret</text><line class="grid" x1="300" y1="126" x2="480" y2="126"/><text class="cell" x="390" y="171" text-anchor="middle">read the evidence against</text><text class="cell" x="390" y="189" text-anchor="middle">the goal: what landed, what</text><text class="cell" x="390" y="207" text-anchor="middle">did not, for whom</text></g><g id="node-act"><rect class="panel" x="540" y="80" width="220" height="160" rx="8"/><text class="sh" x="650" y="113" text-anchor="middle">3. act</text><line class="grid" x1="560" y1="126" x2="740" y2="126"/><text class="cell" x="650" y="171" text-anchor="middle">change the next teaching</text><text class="cell" x="650" y="189" text-anchor="middle">move: re-teach, advance,</text><text class="cell" x="650" y="207" text-anchor="middle">re-group</text></g></g><g id="layer-labels"><g id="label-heading"><text class="h" x="390" y="41" text-anchor="middle">The formative cycle</text></g><g id="label-return"><text class="small" x="390" y="341" text-anchor="middle">next round, days not weeks</text></g><g id="label-note"><text class="small" x="390" y="405" text-anchor="middle">The cycle is formative only if the evidence changes a decision</text><text class="small" x="390" y="425" text-anchor="middle">while learning is still live: an elicited, interpreted and filed</text><text class="small" x="390" y="445" text-anchor="middle">evidence is a summative assessment wearing a small instrument.</text></g><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>