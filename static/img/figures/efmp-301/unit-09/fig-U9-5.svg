<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A flowchart of the formative cycle</title><desc id="d">A flowchart of the formative cycle: elicit evidence, interpret against the goal, act on the next teaching move, with a dashed return arrow for the next round, and a note that it is formative only if the evidence changes a decision while learning is live.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:15px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The formative cycle</text><rect class="panel" x="40" y="90" width="200" height="120" rx="10"/><text class="sh" x="140" y="118" text-anchor="middle">1. elicit</text><text class="body" x="140" y="142" text-anchor="middle">gather evidence of learning</text><text class="body" x="140" y="160" text-anchor="middle">now: the exit question, the</text><text class="body" x="140" y="178" text-anchor="middle">worked task, the observed talk</text><rect class="panel" x="290" y="90" width="200" height="120" rx="10"/><text class="sh" x="390" y="118" text-anchor="middle">2. interpret</text><text class="body" x="390" y="142" text-anchor="middle">read the evidence against</text><text class="body" x="390" y="160" text-anchor="middle">the goal: what landed, what</text><text class="body" x="390" y="178" text-anchor="middle">did not, for whom</text><rect class="panel" x="540" y="90" width="200" height="120" rx="10"/><text class="sh" x="640" y="118" text-anchor="middle">3. act</text><text class="body" x="640" y="142" text-anchor="middle">change the next teaching</text><text class="body" x="640" y="160" text-anchor="middle">move: re-teach, advance,</text><text class="body" x="640" y="178" text-anchor="middle">re-group</text><g class="stroke"><path d="M240 150 L290 150"/><path d="M490 150 L540 150"/></g><defs><marker id="a9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="ink"/></marker></defs><g class="stroke"><path d="M240 150 L286 150" marker-end="url(#a9)"/><path d="M490 150 L536 150" marker-end="url(#a9)"/></g><path class="dash" d="M640 210 C640 300 140 300 140 210" marker-end="url(#a9)"/><text class="small" x="390" y="290" text-anchor="middle">next round, days not weeks</text><text class="small" x="390" y="360" text-anchor="middle">The cycle is formative only if the evidence changes a decision</text><text class="small" x="390" y="382" text-anchor="middle">while learning is still live: an elicited, interpreted and filed</text><text class="small" x="390" y="404" text-anchor="middle">evidence is a summative assessment wearing a small instrument.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
