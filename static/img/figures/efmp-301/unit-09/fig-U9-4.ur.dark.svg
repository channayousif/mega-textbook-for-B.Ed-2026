<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">صداقت اور اعتمادیت کا نشانہ</title><desc id="d">نشانے کا خاکہ چار نشانوں کے ساتھ: معتبر اور درست سوراخ مرکز میں گروپ، معتبر مگر غیر درست سوراخ مرکز سے باہر گروپ، درست نشانے پر مگر غیر معتبر سوراخ مرکز کے گرد بکھرے، اور نہ وہ نہ یہ سوراخ نشانے سے باہر بکھرے، کیپشن کے ساتھ کہ دونوں خصوصیتیں آزاد ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-reliable-valid"><circle class="ring-o" cx="580" cy="150" r="70"/><circle class="ring" cx="580" cy="150" r="46"/><circle class="ring" cx="580" cy="150" r="22"/><circle class="hole" cx="580" cy="150" r="5"/><circle class="hole" cx="572" cy="146" r="5"/><circle class="hole" cx="586" cy="155" r="5"/><circle class="hole" cx="577" cy="158" r="5"/><text class="sh" x="580" y="255" text-anchor="middle">‏قابلِ اعتماد اور صحیح‏</text><text class="body" x="580" y="283" text-anchor="middle">‏مستقل، اور مطلب پر‏</text></g><g id="node-reliable-not-valid"><circle class="ring-o" cx="200" cy="150" r="70"/><circle class="ring" cx="200" cy="150" r="46"/><circle class="ring" cx="200" cy="150" r="22"/><circle class="hole" cx="166" cy="120" r="5"/><circle class="hole" cx="160" cy="128" r="5"/><circle class="hole" cx="172" cy="114" r="5"/><circle class="hole" cx="164" cy="112" r="5"/><text class="sh" x="200" y="255" text-anchor="middle">‏قابلِ اعتماد، صحیح نہیں‏</text><text class="body" x="200" y="283" text-anchor="middle">‏مستقل، مگر غلط چیز پر‏</text></g><g id="node-valid-not-reliable"><circle class="ring-o" cx="580" cy="400" r="70"/><circle class="ring" cx="580" cy="400" r="46"/><circle class="ring" cx="580" cy="400" r="22"/><circle class="hole" cx="610" cy="366" r="5"/><circle class="hole" cx="552" cy="362" r="5"/><circle class="hole" cx="618" cy="418" r="5"/><circle class="hole" cx="544" cy="430" r="5"/><text class="sh" x="580" y="505" text-anchor="middle">‏مقصد میں صحیح، قابلِ اعتماد نہیں‏</text><text class="body" x="580" y="533" text-anchor="middle">‏نشانہ درست، پھر بھی غیر مستقل‏</text></g><g id="node-neither"><circle class="ring-o" cx="200" cy="400" r="70"/><circle class="ring" cx="200" cy="400" r="46"/><circle class="ring" cx="200" cy="400" r="22"/><circle class="hole" cx="168" cy="366" r="5"/><circle class="hole" cx="140" cy="410" r="5"/><circle class="hole" cx="182" cy="446" r="5"/><circle class="hole" cx="156" cy="436" r="5"/><text class="sh" x="200" y="505" text-anchor="middle">‏دونوں سے خالی‏</text><text class="body" x="200" y="533" text-anchor="middle">‏بکھرے اور نشانے سے باہر‏</text></g></g><g id="layer-labels"><g id="label-heading"><text class="h" x="390" y="41" text-anchor="middle">‏صداقت اور اعتمادیت الگ الگ ہیں‏</text></g><g id="label-repair"><text class="small" x="390" y="591" text-anchor="middle">‏ہر خامی کا اپنا علاج ہے: غلط سوال (صداقت) کو بہتر آلہ چاہئے؛‏</text><text class="small" x="390" y="619" text-anchor="middle">‏غیر مستقل پیمائش کو بہتر معیارِ جانچ۔‏</text></g><text class="wm" x="12" y="650" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>