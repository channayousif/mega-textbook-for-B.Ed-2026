<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">صداقت اور اعتماديت کا نشانہ</title><desc id="d">نشانے کا خاکہ: چار نشانے - قابلِ اعتماد اور صحیح، قابلِ اعتماد مگر غلط، مقصد میں صحیح مگر غیر مستقل، اور دونوں سے خالی، اور یاد دہانی کہ دونوں خصوصیتیں الگ الگ ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:13px;fill:var(--ink)}.h{font-size:14px;font-weight:700;fill:var(--ink)}.sh{font-size:12px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">صداقت اور اعتماديت الگ الگ ہیں</text><g transform="translate(110,110)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="780" cy="0" r="5"/><circle class="ink" cx="772" cy="-4" r="5"/><circle class="ink" cx="-6" cy="5" r="5"/><circle class="ink" cx="777" cy="8" r="5"/></g><text class="sh" x="670" y="212" text-anchor="middle">قابلِ اعتماد اور صحیح</text><text class="body" x="670" y="232" text-anchor="middle">مستقل، اور مطلب پر</text><g transform="translate(390,110)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="746" cy="-30" r="5"/><circle class="ink" cx="740" cy="-22" r="5"/><circle class="ink" cx="752" cy="-36" r="5"/><circle class="ink" cx="744" cy="-38" r="5"/></g><text class="sh" x="390" y="212" text-anchor="middle">قابلِ اعتماد، صحیح نہیں</text><text class="body" x="390" y="232" text-anchor="middle">مستقل، مگر غلط چیز پر</text><g transform="translate(670,110)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="-30" cy="-34" r="5"/><circle class="ink" cx="752" cy="-38" r="5"/><circle class="ink" cx="-38" cy="18" r="5"/><circle class="ink" cx="744" cy="30" r="5"/></g><text class="sh" x="110" y="212" text-anchor="middle">مقصد میں صحیح، قابلِ اعتماد نہیں</text><text class="body" x="110" y="232" text-anchor="middle">نشانہ درست، پھر بھی غیر مستقل</text><g transform="translate(250,330)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="746" cy="-32" r="5"/><circle class="ink" cx="-36" cy="-30" r="5"/><circle class="ink" cx="738" cy="24" r="5"/><circle class="ink" cx="-30" cy="38" r="5"/></g><text class="sh" x="530" y="432" text-anchor="middle">دونوں سے خالی</text><text class="body" x="530" y="452" text-anchor="middle">بکھرے اور نشانے سے باہر</text><text class="small" x="250" y="330">ہر خامی کا اپنا علاج ہے:</text><text class="small" x="250" y="352">غلط سوال (صداقت) کو بہتر آلہ</text><text class="small" x="250" y="374">چاہئے؛ غیر مستقل پیمائش کو بہتر</text><text class="small" x="250" y="396">معیارِ جانچ۔ دونوں کا جواب مشکل سے نہیں ملتا۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
