<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تشخیص کے مقاصد کا تصوری نقشہ</title><desc id="d">جانچ کا تصوری نقشہ چار مقصد کی شاخوں کے ساتھ: تشخیص، تشکیلی، مجموعی اور تصدیق: ہر ایک کا سوال، وہ فیصلہ جو وہ کھلاتا ہے، اور ایک اصل مثال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-assessment-diagnose" class="link" d="M460 300 C620 300 620 300 620 200"/><path id="edge-assessment-form" class="link" d="M320 300 C160 300 160 300 160 200"/><path id="edge-assessment-sum" class="link" d="M460 300 C620 300 620 300 620 400"/><path id="edge-assessment-certify" class="link" d="M320 300 C160 300 160 300 160 400"/></g><g id="layer-nodes"><g id="node-assessment"><ellipse class="panel-a" cx="390" cy="300" rx="70" ry="40"/><text class="h" x="390" y="305" text-anchor="middle">‏تشخیص‏</text></g><g id="node-diagnose"><rect class="panel" x="480" y="40" width="280" height="160" rx="10"/><text class="sh" x="620" y="77" text-anchor="middle">‏تشخیصِ آغاز‏</text><text class="body" x="620" y="103" text-anchor="middle">‏وہ کیا لے کر آتے ہیں؟‏</text><text class="body" x="620" y="129" text-anchor="middle">‏فیصلہ: کہاں سے شروع کریں‏</text><line class="grid" x1="740" y1="152" x2="500" y2="152"/><text class="small" x="620" y="181" text-anchor="middle">‏اپریل کا جائزہ‏</text></g><g id="node-form"><rect class="panel" x="20" y="40" width="280" height="160" rx="10"/><text class="sh" x="160" y="77" text-anchor="middle">‏تشکیل‏</text><text class="body" x="160" y="103" text-anchor="middle">‏ابھی کیا بیٹھ رہا ہے؟‏</text><text class="body" x="160" y="129" text-anchor="middle">‏فیصلہ: کل کی تدریس‏</text><line class="grid" x1="280" y1="152" x2="40" y2="152"/><text class="small" x="160" y="181" text-anchor="middle">‏منگل کا اختتامی کوئز‏</text></g><g id="node-sum"><rect class="panel" x="480" y="400" width="280" height="160" rx="10"/><text class="sh" x="620" y="437" text-anchor="middle">‏مجموعہ‏</text><text class="body" x="620" y="463" text-anchor="middle">‏کیا آ چکا ہے؟‏</text><text class="body" x="620" y="489" text-anchor="middle">‏فیصلہ: تیاری اور نمبر‏</text><line class="grid" x1="740" y1="512" x2="500" y2="512"/><text class="small" x="620" y="541" text-anchor="middle">‏دسمبر کا امتحان‏</text></g><g id="node-certify"><rect class="panel" x="20" y="400" width="280" height="160" rx="10"/><text class="sh" x="160" y="437" text-anchor="middle">‏تصدیق‏</text><text class="body" x="160" y="463" text-anchor="middle">‏یہ شخص کیا کر سکتا ہے؟‏</text><text class="body" x="160" y="489" text-anchor="middle">‏فیصلہ: انتخاب، اہلیت‏</text><line class="grid" x1="280" y1="512" x2="40" y2="512"/><text class="small" x="160" y="541" text-anchor="middle">‏بورڈ کا امتحان‏</text></g></g><g id="layer-labels"><g id="label-note"><text class="small" x="390" y="591" text-anchor="middle">‏ہر تشخیص کسی فیصلے کو جاتی ہے؛‏</text><text class="small" x="390" y="619" text-anchor="middle">‏فیصلہ نام کریں تو قسم خود بتا دے گی‏</text></g><text class="wm" x="12" y="650" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>