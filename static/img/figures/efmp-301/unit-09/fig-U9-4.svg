<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A target diagram of validity and reliability</title><desc id="d">A target diagram with four targets: reliable and valid with holes grouped at centre, reliable but not valid with holes grouped off-centre, valid in aim but not reliable with holes scattered around centre, and neither with holes scattered off-target, with a caption that the two properties are independent.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring{stroke:var(--ink);stroke-width:2;fill:none}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:13.5px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12.5px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">Validity and reliability are independent</text><g transform="translate(110,110)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="0" cy="0" r="5"/><circle class="ink" cx="8" cy="-4" r="5"/><circle class="ink" cx="-6" cy="5" r="5"/><circle class="ink" cx="3" cy="8" r="5"/></g><text class="sh" x="110" y="212" text-anchor="middle">reliable and valid</text><text class="body" x="110" y="232" text-anchor="middle">consistent, and on the meaning</text><g transform="translate(390,110)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="34" cy="-30" r="5"/><circle class="ink" cx="40" cy="-22" r="5"/><circle class="ink" cx="28" cy="-36" r="5"/><circle class="ink" cx="36" cy="-38" r="5"/></g><text class="sh" x="390" y="212" text-anchor="middle">reliable, not valid</text><text class="body" x="390" y="232" text-anchor="middle">consistent, but on the wrong thing</text><g transform="translate(670,110)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="-30" cy="-34" r="5"/><circle class="ink" cx="28" cy="-38" r="5"/><circle class="ink" cx="-38" cy="18" r="5"/><circle class="ink" cx="36" cy="30" r="5"/></g><text class="sh" x="670" y="212" text-anchor="middle">valid in aim, not reliable</text><text class="body" x="670" y="232" text-anchor="middle">aimed right, inconsistent</text><g transform="translate(250,330)"><circle class="ring" r="70"/><circle class="ring" r="46"/><circle class="ring" r="22"/><circle class="ink" cx="34" cy="-32" r="5"/><circle class="ink" cx="-36" cy="-30" r="5"/><circle class="ink" cx="42" cy="24" r="5"/><circle class="ink" cx="-30" cy="38" r="5"/></g><text class="sh" x="250" y="432" text-anchor="middle">neither</text><text class="body" x="250" y="452" text-anchor="middle">scattered and off-target</text><text class="small" x="530" y="330">Each failure has its own repair:</text><text class="small" x="530" y="352">a wrong question (validity) needs a</text><text class="small" x="530" y="374">better instrument; an inconsistent</text><text class="small" x="530" y="396">measure needs a better rubric</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
