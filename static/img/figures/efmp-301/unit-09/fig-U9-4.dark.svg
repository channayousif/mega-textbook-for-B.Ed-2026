<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A target diagram of validity and reliability</title><desc id="d">A target diagram with four targets: reliable and valid with holes grouped at centre, reliable but not valid with holes grouped off-centre, valid in aim but not reliable with holes scattered around centre, and neither with holes scattered off-target, with a caption that the two properties are independent.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.frame{fill:none;stroke:var(--ink);stroke-width:2}.head{fill:var(--a1-fill)}.side{fill:var(--panel)}.link{stroke:var(--ink);stroke-width:2;fill:none}.dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:7 5}.ring{stroke:var(--ink);stroke-width:1.5;fill:none}.ring-o{stroke:var(--ink);stroke-width:2;fill:var(--panel)}.hole{fill:var(--ink);stroke:var(--bg);stroke-width:1.5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.rule{stroke:var(--ink);stroke-width:2;fill:none}text{font-size:15px;fill:var(--ink)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.cell{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-reliable-valid"><circle class="ring-o" cx="200" cy="150" r="70"/><circle class="ring" cx="200" cy="150" r="46"/><circle class="ring" cx="200" cy="150" r="22"/><circle class="hole" cx="200" cy="150" r="5"/><circle class="hole" cx="208" cy="146" r="5"/><circle class="hole" cx="194" cy="155" r="5"/><circle class="hole" cx="203" cy="158" r="5"/><text class="sh" x="200" y="255" text-anchor="middle">reliable and valid</text><text class="body" x="200" y="275" text-anchor="middle">consistent, and on the meaning</text></g><g id="node-reliable-not-valid"><circle class="ring-o" cx="580" cy="150" r="70"/><circle class="ring" cx="580" cy="150" r="46"/><circle class="ring" cx="580" cy="150" r="22"/><circle class="hole" cx="614" cy="120" r="5"/><circle class="hole" cx="620" cy="128" r="5"/><circle class="hole" cx="608" cy="114" r="5"/><circle class="hole" cx="616" cy="112" r="5"/><text class="sh" x="580" y="255" text-anchor="middle">reliable, not valid</text><text class="body" x="580" y="275" text-anchor="middle">consistent, but on the wrong thing</text></g><g id="node-valid-not-reliable"><circle class="ring-o" cx="200" cy="400" r="70"/><circle class="ring" cx="200" cy="400" r="46"/><circle class="ring" cx="200" cy="400" r="22"/><circle class="hole" cx="170" cy="366" r="5"/><circle class="hole" cx="228" cy="362" r="5"/><circle class="hole" cx="162" cy="418" r="5"/><circle class="hole" cx="236" cy="430" r="5"/><text class="sh" x="200" y="505" text-anchor="middle">valid in aim, not reliable</text><text class="body" x="200" y="525" text-anchor="middle">aimed right, inconsistent</text></g><g id="node-neither"><circle class="ring-o" cx="580" cy="400" r="70"/><circle class="ring" cx="580" cy="400" r="46"/><circle class="ring" cx="580" cy="400" r="22"/><circle class="hole" cx="612" cy="366" r="5"/><circle class="hole" cx="640" cy="410" r="5"/><circle class="hole" cx="598" cy="446" r="5"/><circle class="hole" cx="624" cy="436" r="5"/><text class="sh" x="580" y="505" text-anchor="middle">neither</text><text class="body" x="580" y="525" text-anchor="middle">scattered and off-target</text></g></g><g id="layer-labels"><g id="label-heading"><text class="h" x="390" y="41" text-anchor="middle">Validity and reliability are independent</text></g><g id="label-repair"><text class="small" x="390" y="595" text-anchor="middle">Each failure has its own repair: a wrong question (validity) needs a</text><text class="small" x="390" y="615" text-anchor="middle">better instrument; an inconsistent measure needs a better rubric</text></g><text class="wm" x="768" y="650" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>