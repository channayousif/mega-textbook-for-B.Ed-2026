<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A table of four assessment types</title><desc id="d">A table of four assessment types - diagnostic, formative, summative and certification - each against when it happens, the decision it feeds, and one Sindh classroom instance.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.ink{fill:var(--ink)}.muted{fill:var(--muted)}text{font-size:15px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:600;fill:var(--ink)}.body{font-size:12.5px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="12" y="14" width="756" height="412" rx="8"/><path class="grid" d="M122 14V426M332 14V426M548 14V426M12 74H768M12 190H768M12 306H768"/><path class="ink" d="M12 74H768V78H12z"/><text class="h" x="67" y="48" text-anchor="middle">type</text><text class="h" x="227" y="40" text-anchor="middle">when it</text><text class="h" x="227" y="60" text-anchor="middle">happens</text><text class="h" x="440" y="40" text-anchor="middle">the decision</text><text class="h" x="440" y="60" text-anchor="middle">it feeds</text><text class="h" x="658" y="40" text-anchor="middle">one Sindh classroom</text><text class="h" x="658" y="60" text-anchor="middle">instance</text><text class="sh" x="67" y="112" text-anchor="middle">diagnostic</text><text class="body" x="134" y="102">before instruction</text><text class="body" x="344" y="102">where to start; what to</text><text class="body" x="344" y="122">repair first</text><text class="body" x="560" y="102">the April fractions check</text><text class="body" x="560" y="122">that re-planned a fortnight</text><text class="sh" x="67" y="228" text-anchor="middle">formative</text><text class="body" x="134" y="218">during learning,</text><text class="body" x="134" y="238">weekly or daily</text><text class="body" x="344" y="218">re-teach, advance,</text><text class="body" x="344" y="238">re-group</text><text class="body" x="560" y="218">the Tuesday five-question</text><text class="body" x="560" y="238">exit quiz</text><text class="sh" x="67" y="344" text-anchor="middle">summative</text><text class="body" x="134" y="334">after instruction</text><text class="body" x="134" y="354">is complete</text><text class="body" x="344" y="334">mastery, readiness,</text><text class="body" x="344" y="354">grades</text><text class="body" x="560" y="334">the December</text><text class="body" x="560" y="354">unit test</text><text class="sh" x="67" y="424" text-anchor="middle">certification</text><text class="body" x="134" y="414">end of course</text><text class="body" x="134" y="434" font-size="12.5">or stage</text><text class="body" x="344" y="414">selection and</text><text class="body" x="344" y="434">qualification</text><text class="body" x="560" y="414">the board examination</text><text class="body" x="560" y="434">and its certificate</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
