<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 614" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے قدرتی وسائل کی جدول</title><desc id="d">چار شعبوں (زراعت، پانی، معدنیات اور توانائی) میں پاکستان کے قدرتی وسائل کی جدول، جس میں ہر شعبے کے اہم وسائل، وہ کہاں پائے جاتے ہیں، مثلاً تھر کا کوئلہ، سوئی گیس اور بلوچستان میں ریکوڈک کا تانبا اور سونا، اور خوراک، صنعت، روزگار اور توانائی کے لیے ان کی اہمیت دکھائی گئی ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1; } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="614"/><rect class="panel" x="656" y="12" width="112" height="52"/><text class="h" x="753" y="36" text-anchor="end"><tspan x="753" dy="0">شعبہ</tspan></text><rect class="panel" x="460" y="12" width="196" height="52"/><text class="h" x="641" y="36" text-anchor="end"><tspan x="641" dy="0">اہم وسائل</tspan></text><rect class="panel" x="216" y="12" width="244" height="52"/><text class="h" x="445" y="36" text-anchor="end"><tspan x="445" dy="0">کہاں پائے جاتے ہیں</tspan></text><rect class="panel" x="12" y="12" width="204" height="52"/><text class="h" x="201" y="36" text-anchor="end"><tspan x="201" dy="0">کیوں اہم ہیں</tspan></text><rect class="link" x="656" y="64" width="112" height="116"/><text class="ink" x="753" y="88" text-anchor="end"><tspan x="753" dy="0">زراعت</tspan></text><rect class="link" x="460" y="64" width="196" height="116"/><text class="ink" x="641" y="88" text-anchor="end"><tspan x="641" dy="0">زرخیز دریائی مٹی؛ نہری پانی؛</tspan><tspan x="641" dy="20">گندم، کپاس، چاول اور گنے</tspan><tspan x="641" dy="20">جیسی فصلیں؛ مویشی</tspan></text><rect class="link" x="216" y="64" width="244" height="116"/><text class="ink" x="445" y="88" text-anchor="end"><tspan x="445" dy="0">پنجاب اور سندھ کا سندھ میدان؛</tspan><tspan x="445" dy="20">مویشی بلوچستان اور تھر</tspan><tspan x="445" dy="20">میں بھی</tspan></text><rect class="link" x="12" y="64" width="204" height="116"/><text class="ink" x="201" y="88" text-anchor="end"><tspan x="201" dy="0">قوم کے لیے خوراک، ٹیکسٹائل</tspan><tspan x="201" dy="20">کے لیے خام مال، اور آبادی</tspan><tspan x="201" dy="20">کے بڑے حصے کے لیے روزگار</tspan></text><rect class="link" x="656" y="180" width="112" height="98"/><text class="ink" x="753" y="204" text-anchor="end"><tspan x="753" dy="0">پانی</tspan></text><rect class="link" x="460" y="180" width="196" height="98"/><text class="ink" x="641" y="204" text-anchor="end"><tspan x="641" dy="0">دریائے سندھ اور اس کے</tspan><tspan x="641" dy="20">معاون دریا؛ گلیشیئر؛</tspan><tspan x="641" dy="20">زیرِ زمین پانی</tspan></text><rect class="link" x="216" y="180" width="244" height="98"/><text class="ink" x="445" y="204" text-anchor="end"><tspan x="445" dy="0">شمال میں گلیشیئر؛ پورے</tspan><tspan x="445" dy="20">میدان میں دریا اور نہریں</tspan></text><rect class="link" x="12" y="180" width="204" height="98"/><text class="ink" x="201" y="204" text-anchor="end"><tspan x="201" dy="0">آب پاشی، پینے کا پانی، اور</tspan><tspan x="201" dy="20">تقریباً تمام کاشت کاری</tspan><tspan x="201" dy="20">کی بنیاد</tspan></text><rect class="link" x="656" y="278" width="112" height="152"/><text class="ink" x="753" y="302" text-anchor="end"><tspan x="753" dy="0">معدنیات</tspan></text><rect class="link" x="460" y="278" width="196" height="152"/><text class="ink" x="641" y="302" text-anchor="end"><tspan x="641" dy="0">چٹانی نمک؛ کوئلہ؛</tspan><tspan x="641" dy="20">تانبا اور سونا؛ کرومائٹ؛</tspan><tspan x="641" dy="20">چونے کا پتھر اور سنگِ مرمر</tspan></text><rect class="link" x="216" y="278" width="244" height="152"/><text class="ink" x="445" y="302" text-anchor="end"><tspan x="445" dy="0">کھیوڑہ (نمک)؛ تھر اور لاکھڑا</tspan><tspan x="445" dy="20">(کوئلہ)؛ بلوچستان میں ریکوڈک</tspan><tspan x="445" dy="20">اور سینڈک (تانبا اور سونا)؛</tspan><tspan x="445" dy="20">بلوچستان اور خیبر پختونخوا</tspan><tspan x="445" dy="20">(کرومائٹ، سنگِ مرمر)</tspan></text><rect class="link" x="12" y="278" width="204" height="152"/><text class="ink" x="201" y="302" text-anchor="end"><tspan x="201" dy="0">صنعت، برآمدات اور روزگار،</tspan><tspan x="201" dy="20">جن کا بڑا حصہ کم ترقی</tspan><tspan x="201" dy="20">یافتہ علاقوں میں ہے</tspan></text><rect class="link" x="656" y="430" width="112" height="152"/><text class="ink" x="753" y="454" text-anchor="end"><tspan x="753" dy="0">توانائی</tspan></text><rect class="link" x="460" y="430" width="196" height="152"/><text class="ink" x="641" y="454" text-anchor="end"><tspan x="641" dy="0">قدرتی گیس؛ تیل؛</tspan><tspan x="641" dy="20">پن بجلی؛ کوئلہ؛</tspan><tspan x="641" dy="20">ہوا اور شمسی توانائی</tspan></text><rect class="link" x="216" y="430" width="244" height="152"/><text class="ink" x="445" y="454" text-anchor="end"><tspan x="445" dy="0">بلوچستان اور سندھ میں سوئی</tspan><tspan x="445" dy="20">اور دوسرے ذخائر (گیس)؛ پوٹھوہار</tspan><tspan x="445" dy="20">(تیل)؛ تربیلا اور منگلا (پن بجلی)؛</tspan><tspan x="445" dy="20">تھر (کوئلہ)؛ سندھ میں جھمپیر</tspan><tspan x="445" dy="20">اور گھارو کی ہوائی راہداری</tspan></text><rect class="link" x="12" y="430" width="204" height="152"/><text class="ink" x="201" y="454" text-anchor="end"><tspan x="201" dy="0">گھروں، کھیتوں اور کارخانوں</tspan><tspan x="201" dy="20">کے لیے بجلی، اور درآمدی</tspan><tspan x="201" dy="20">ایندھن پر کم انحصار</tspan></text><text font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" class="wm" x="768" y="604" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
