<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں سول ملٹری تعلقات کا تصوراتی نقشہ</title><desc id="d">پاکستان میں سول ملٹری تعلقات کا تصوراتی نقشہ جس کی تین شاخیں ہیں: اسباب (کمزور ادارے، عدم تحفظ، منقسم جماعتوں کے مقابل مضبوط فوج، ادارہ جاتی مفادات)، انداز (براہِ راست فوجی حکمرانی، سول حکومتوں کے دوران اثر، منتخب حکومتوں کی برطرفی، 2008 سے منتخب حکمرانی) اور نتائج (آئینوں کی منسوخی یا معطلی، اداروں کی کمزوری، 1971 سے پہلے کی شکایات، ترقی پر بحث)؛ ایک دائرہ دکھاتا ہے کہ کمزور ادارے دوبارہ اسباب کو تقویت دیتے ہیں، اور ایک نوٹ آرٹیکل 245 کے آئینی اصول کے بارے میں ہے۔</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 2; }
.ink { font-size: 16px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="720"/><rect class="panel" x="210" y="20" width="360" height="66" rx="22"/><text class="h" x="390" y="47" text-anchor="middle"><tspan x="390" dy="0">پاکستان میں</tspan><tspan x="390" dy="20">سول ملٹری تعلقات</tspan></text><path class="link" d="M390 86V102M636 120V102H144V120M390 102V120"/><rect class="panel" x="526" y="120" width="220" height="38" rx="8"/><text class="h" x="636" y="145" text-anchor="middle"><tspan x="636" dy="0">اسباب</tspan></text><path class="link" d="M636 158V168H754V531"/><path class="link" d="M754 225H746"/><rect class="panel" x="526" y="180" width="220" height="90" rx="8"/><text class="ink" x="636" y="210" text-anchor="middle"><tspan x="636" dy="0">1948-1951 کے بعد</tspan><tspan x="636" dy="20">کمزور سیاسی</tspan><tspan x="636" dy="20">ادارے</tspan></text><path class="link" d="M754 327H746"/><rect class="panel" x="526" y="282" width="220" height="90" rx="8"/><text class="ink" x="636" y="312" text-anchor="middle"><tspan x="636" dy="0">عدم تحفظ: بھارت سے</tspan><tspan x="636" dy="20">کشیدگی، افغانستان</tspan><tspan x="636" dy="20">میں جنگ</tspan></text><path class="link" d="M754 429H746"/><rect class="panel" x="526" y="384" width="220" height="90" rx="8"/><text class="ink" x="636" y="424" text-anchor="middle"><tspan x="636" dy="0">منظم فوج بمقابلہ</tspan><tspan x="636" dy="20">منقسم جماعتیں</tspan></text><path class="link" d="M754 531H746"/><rect class="panel" x="526" y="486" width="220" height="90" rx="8"/><text class="ink" x="636" y="526" text-anchor="middle"><tspan x="636" dy="0">ادارہ جاتی مفادات:</tspan><tspan x="636" dy="20">بجٹ، خود مختاری</tspan></text><rect class="panel" x="280" y="120" width="220" height="38" rx="8"/><text class="h" x="390" y="145" text-anchor="middle"><tspan x="390" dy="0">انداز</tspan></text><path class="link" d="M390 158V168H508V531"/><path class="link" d="M508 225H500"/><rect class="panel" x="280" y="180" width="220" height="90" rx="8"/><text class="ink" x="390" y="210" text-anchor="middle"><tspan x="390" dy="0">براہِ راست فوجی حکمرانی</tspan><tspan x="390" dy="20">(1958، 1969،</tspan><tspan x="390" dy="20">1977، 1999)</tspan></text><path class="link" d="M508 327H500"/><rect class="panel" x="280" y="282" width="220" height="90" rx="8"/><text class="ink" x="390" y="322" text-anchor="middle"><tspan x="390" dy="0">سول حکومتوں کے</tspan><tspan x="390" dy="20">دوران اثر</tspan></text><path class="link" d="M508 429H500"/><rect class="panel" x="280" y="384" width="220" height="90" rx="8"/><text class="ink" x="390" y="424" text-anchor="middle"><tspan x="390" dy="0">منتخب حکومتوں کی</tspan><tspan x="390" dy="20">برطرفی 1988-1999</tspan></text><path class="link" d="M508 531H500"/><rect class="panel" x="280" y="486" width="220" height="90" rx="8"/><text class="ink" x="390" y="526" text-anchor="middle"><tspan x="390" dy="0">2008 سے</tspan><tspan x="390" dy="20">منتخب حکومتیں</tspan></text><rect class="panel" x="34" y="120" width="220" height="38" rx="8"/><text class="h" x="144" y="145" text-anchor="middle"><tspan x="144" dy="0">نتائج</tspan></text><path class="link" d="M144 158V168H262V531"/><path class="link" d="M262 225H254"/><rect class="panel" x="34" y="180" width="220" height="90" rx="8"/><text class="ink" x="144" y="220" text-anchor="middle"><tspan x="144" dy="0">آئین منسوخ</tspan><tspan x="144" dy="20">یا معطل</tspan></text><path class="link" d="M262 327H254"/><rect class="panel" x="34" y="282" width="220" height="90" rx="8"/><text class="ink" x="144" y="322" text-anchor="middle"><tspan x="144" dy="0">اداروں کو پنپنے کا</tspan><tspan x="144" dy="20">کم وقت ملا</tspan></text><path class="link" d="M262 429H254"/><rect class="panel" x="34" y="384" width="220" height="90" rx="8"/><text class="ink" x="144" y="434" text-anchor="middle"><tspan x="144" dy="0">1971 سے پہلے کی شکایات</tspan></text><path class="link" d="M262 531H254"/><rect class="panel" x="34" y="486" width="220" height="90" rx="8"/><text class="ink" x="144" y="526" text-anchor="middle"><tspan x="144" dy="0">ترقی اور نظم و ضبط</tspan><tspan x="144" dy="20">پر بحث</tspan></text><path class="link" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#arrow)" d="M34 327H16V610H768V225H746"/><text class="ink" x="390" y="601" text-anchor="middle"><tspan x="390" dy="0">چکر</tspan></text><rect class="panel" x="34" y="632" width="712" height="58" rx="4"/><text class="ink" x="390" y="654" text-anchor="middle"><tspan x="390" dy="0">آئینی اصول: آرٹیکل 245، مسلح افواج</tspan><tspan x="390" dy="20">وفاقی حکومت کی ہدایات کے تحت کام کرتی ہیں</tspan></text><text font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" class="wm" x="768" y="710" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
