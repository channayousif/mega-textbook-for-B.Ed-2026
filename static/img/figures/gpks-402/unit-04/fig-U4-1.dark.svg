<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 850" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of Pakistan's government under the 1973 Constitution in three columns</title><desc id="d">Diagram of Pakistan's government under the 1973 Constitution in three columns: the legislature (National Assembly and Senate), the executive (Prime Minister and Cabinet, with the President as Head of State acting on advice) and the judiciary (Supreme Court, High Courts and subordinate courts), with the same pattern repeated for a province and arrows showing how each branch checks the others.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.ink { fill: var(--ink); font-size: 14px; }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="850"/><rect class="panel" x="18" y="14" width="744" height="44" rx="6"/><text class="h" x="390" y="42" text-anchor="middle"><tspan x="390" dy="0">The Constitution of Pakistan (1973)</tspan></text><rect class="panel" x="18" y="76" width="236" height="82" rx="6"/><rect class="panel" x="272" y="76" width="236" height="82" rx="6"/><rect class="panel" x="526" y="76" width="236" height="82" rx="6"/><text class="h" x="136" y="102" text-anchor="middle"><tspan x="136" dy="0">Legislature</tspan></text><text class="ink" x="136" y="126" text-anchor="middle"><tspan x="136" dy="0">(makes laws)</tspan></text><text class="h" x="390" y="102" text-anchor="middle"><tspan x="390" dy="0">Executive</tspan></text><text class="ink" x="390" y="126" text-anchor="middle"><tspan x="390" dy="0">(carries out laws)</tspan></text><text class="h" x="644" y="102" text-anchor="middle"><tspan x="644" dy="0">Judiciary</tspan></text><text class="ink" x="644" y="126" text-anchor="middle"><tspan x="644" dy="0">(interprets laws and</tspan><tspan x="644" dy="18">settles disputes)</tspan></text><rect class="panel" x="18" y="176" width="236" height="58" rx="6"/><text class="ink" x="136" y="200" text-anchor="middle"><tspan x="136" dy="0">Majlis-e-Shoora</tspan><tspan x="136" dy="18">(Parliament)</tspan></text><path class="link" d="M136,234 V247 H26 V355 M26,280 H42 M26,355 H42"/><rect class="panel" x="42" y="254" width="212" height="58" rx="6"/><text class="ink" x="148" y="277" text-anchor="middle"><tspan x="148" dy="0">National Assembly -</tspan><tspan x="148" dy="18">elected by the people</tspan></text><rect class="panel" x="42" y="328" width="212" height="58" rx="6"/><text class="ink" x="148" y="351" text-anchor="middle"><tspan x="148" dy="0">Senate - equal seats</tspan><tspan x="148" dy="18">for each province</tspan></text><rect class="panel" x="272" y="176" width="236" height="76" rx="6"/><text class="ink" x="390" y="199" text-anchor="middle"><tspan x="390" dy="0">President - Head of</tspan><tspan x="390" dy="18">State, acts on advice</tspan></text><path class="link" d="M390,252 V278" stroke-dasharray="5 4"/><rect class="panel" x="272" y="278" width="236" height="76" rx="6"/><text class="ink" x="390" y="309" text-anchor="middle"><tspan x="390" dy="0">Prime Minister and</tspan><tspan x="390" dy="18">Federal Cabinet</tspan></text><rect class="panel" x="526" y="176" width="236" height="58" rx="6"/><text class="ink" x="644" y="200" text-anchor="middle"><tspan x="644" dy="0">Supreme Court of</tspan><tspan x="644" dy="18">Pakistan</tspan></text><path class="link" d="M644,234 V254"/><rect class="panel" x="526" y="254" width="236" height="66" rx="6"/><text class="ink" x="644" y="278" text-anchor="middle"><tspan x="644" dy="0">High Courts (one per</tspan><tspan x="644" dy="18">province and Islamabad)</tspan></text><path class="link" d="M644,320 V340"/><rect class="panel" x="526" y="340" width="236" height="58" rx="6"/><text class="ink" x="644" y="364" text-anchor="middle"><tspan x="644" dy="0">District and</tspan><tspan x="644" dy="18">subordinate courts</tspan></text><text class="h" x="390" y="435" text-anchor="middle"><tspan x="390" dy="0">Checks and appointments</tspan></text><text class="ink" x="136" y="469" text-anchor="middle"><tspan x="136" dy="0">National Assembly</tspan></text><text class="ink" x="644" y="469" text-anchor="middle"><tspan x="644" dy="0">Prime Minister</tspan></text><text class="ink" x="390" y="497" text-anchor="middle"><tspan x="390" dy="0">elects and removes</tspan><tspan x="390" dy="18">the Prime Minister</tspan></text><path class="link" d="M136,521 H644" marker-end="url(#arrow)"/><text class="ink" x="136" y="558" text-anchor="middle"><tspan x="136" dy="0">Legislature and executive</tspan></text><text class="ink" x="644" y="558" text-anchor="middle"><tspan x="644" dy="0">Judiciary</tspan></text><text class="ink" x="390" y="583" text-anchor="middle"><tspan x="390" dy="0">can strike down unconstitutional</tspan><tspan x="390" dy="18">laws and actions</tspan></text><path class="link" d="M644,607 H136" marker-end="url(#arrow)"/><text class="ink" x="136" y="642" text-anchor="middle"><tspan x="136" dy="0">Executive</tspan></text><text class="ink" x="644" y="642" text-anchor="middle"><tspan x="644" dy="0">Judiciary</tspan></text><text class="ink" x="390" y="666" text-anchor="middle"><tspan x="390" dy="0">judges appointed through</tspan><tspan x="390" dy="18">the Judicial Commission</tspan></text><path class="link" d="M136,690 H644" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="h" x="390" y="724" text-anchor="middle"><tspan x="390" dy="0">The same pattern in a province</tspan></text><rect class="panel" x="18" y="742" width="236" height="76" rx="6"/><rect class="panel" x="272" y="742" width="236" height="76" rx="6"/><rect class="panel" x="526" y="742" width="236" height="76" rx="6"/><text class="ink" x="136" y="782" text-anchor="middle"><tspan x="136" dy="0">Provincial Assembly</tspan></text><text class="ink" x="390" y="760" text-anchor="middle"><tspan x="390" dy="0">Chief Minister and</tspan><tspan x="390" dy="18">Provincial Cabinet</tspan><tspan x="390" dy="18">(Governor as head</tspan><tspan x="390" dy="18">of province)</tspan></text><text class="ink" x="644" y="782" text-anchor="middle"><tspan x="644" dy="0">High Court</tspan></text><text class="wm" x="768" y="840" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
