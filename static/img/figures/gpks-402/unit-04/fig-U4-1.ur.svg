<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 850" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1973 کے آئین کے تحت پاکستان کی حکومت کا تین کالموں والا خاکہ</title><desc id="d">1973 کے آئین کے تحت پاکستان کی حکومت کا تین کالموں والا خاکہ: مقننہ (قومی اسمبلی اور سینیٹ)، انتظامیہ (وزیرِ اعظم اور کابینہ، اور صدر بطور سربراہِ مملکت جو مشورے پر عمل کرتا ہے) اور عدلیہ (سپریم کورٹ، ہائی کورٹس اور ماتحت عدالتیں)؛ یہی ڈھانچہ ایک صوبے کے لیے دہرایا گیا ہے، اور تیر دکھاتے ہیں کہ ہر شعبہ دوسروں کی نگرانی کیسے کرتا ہے۔</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.ink { fill: var(--ink); font-size: 14px; }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="850"/><rect class="panel" x="18" y="14" width="744" height="44" rx="6"/><text class="h" x="390" y="42" text-anchor="middle"><tspan x="390" dy="0">پاکستان کا آئین (1973)</tspan></text><rect class="panel" x="526" y="76" width="236" height="82" rx="6"/><rect class="panel" x="272" y="76" width="236" height="82" rx="6"/><rect class="panel" x="18" y="76" width="236" height="82" rx="6"/><text class="h" x="644" y="102" text-anchor="middle"><tspan x="644" dy="0">مقننہ</tspan></text><text class="ink" x="644" y="126" text-anchor="middle"><tspan x="644" dy="0">(قانون بناتی ہے)</tspan></text><text class="h" x="390" y="102" text-anchor="middle"><tspan x="390" dy="0">انتظامیہ</tspan></text><text class="ink" x="390" y="126" text-anchor="middle"><tspan x="390" dy="0">(قانون پر عمل کراتی ہے)</tspan></text><text class="h" x="136" y="102" text-anchor="middle"><tspan x="136" dy="0">عدلیہ</tspan></text><text class="ink" x="136" y="126" text-anchor="middle"><tspan x="136" dy="0">(قانون کی تشریح اور</tspan><tspan x="136" dy="20">تنازعات کا فیصلہ)</tspan></text><rect class="panel" x="526" y="176" width="236" height="58" rx="6"/><text class="ink" x="644" y="200" text-anchor="middle"><tspan x="644" dy="0">مجلسِ شوریٰ</tspan><tspan x="644" dy="20">(پارلیمنٹ)</tspan></text><path class="link" d="M644 234V247H754V355M754 280H738M754 355H738"/><rect class="panel" x="526" y="254" width="212" height="58" rx="6"/><text class="ink" x="632" y="277" text-anchor="middle"><tspan x="632" dy="0">قومی اسمبلی:</tspan><tspan x="632" dy="20">عوام کی منتخب کردہ</tspan></text><rect class="panel" x="526" y="328" width="212" height="58" rx="6"/><text class="ink" x="632" y="351" text-anchor="middle"><tspan x="632" dy="0">سینیٹ: ہر صوبے کی</tspan><tspan x="632" dy="20">برابر نشستیں</tspan></text><rect class="panel" x="272" y="176" width="236" height="76" rx="6"/><text class="ink" x="390" y="199" text-anchor="middle"><tspan x="390" dy="0">صدر: سربراہِ مملکت،</tspan><tspan x="390" dy="20">مشورے پر عمل کرتا ہے</tspan></text><path class="link" d="M390 252V278" stroke-dasharray="5 4"/><rect class="panel" x="272" y="278" width="236" height="76" rx="6"/><text class="ink" x="390" y="309" text-anchor="middle"><tspan x="390" dy="0">وزیرِ اعظم اور</tspan><tspan x="390" dy="20">وفاقی کابینہ</tspan></text><rect class="panel" x="18" y="176" width="236" height="58" rx="6"/><text class="ink" x="136" y="200" text-anchor="middle"><tspan x="136" dy="0">سپریم کورٹ</tspan><tspan x="136" dy="20">آف پاکستان</tspan></text><path class="link" d="M136 234V254"/><rect class="panel" x="18" y="254" width="236" height="66" rx="6"/><text class="ink" x="136" y="278" text-anchor="middle"><tspan x="136" dy="0">ہائی کورٹس (ہر صوبے اور</tspan><tspan x="136" dy="20">اسلام آباد میں ایک)</tspan></text><path class="link" d="M136 320V340"/><rect class="panel" x="18" y="340" width="236" height="58" rx="6"/><text class="ink" x="136" y="364" text-anchor="middle"><tspan x="136" dy="0">ضلعی اور</tspan><tspan x="136" dy="20">ماتحت عدالتیں</tspan></text><text class="h" x="390" y="435" text-anchor="middle"><tspan x="390" dy="0">نگرانی اور تقرریاں</tspan></text><text class="ink" x="644" y="469" text-anchor="middle"><tspan x="644" dy="0">قومی اسمبلی</tspan></text><text class="ink" x="136" y="469" text-anchor="middle"><tspan x="136" dy="0">وزیرِ اعظم</tspan></text><text class="ink" x="390" y="497" text-anchor="middle"><tspan x="390" dy="0">وزیرِ اعظم کو منتخب کرتی</tspan><tspan x="390" dy="20">اور ہٹاتی ہے</tspan></text><path class="link" d="M644 521H136" marker-end="url(#arrow)"/><text class="ink" x="644" y="558" text-anchor="middle"><tspan x="644" dy="0">مقننہ اور انتظامیہ</tspan></text><text class="ink" x="136" y="558" text-anchor="middle"><tspan x="136" dy="0">عدلیہ</tspan></text><text class="ink" x="390" y="583" text-anchor="middle"><tspan x="390" dy="0">غیر آئینی قوانین اور اقدامات</tspan><tspan x="390" dy="20">کالعدم کر سکتی ہے</tspan></text><path class="link" d="M136 607H644" marker-end="url(#arrow)"/><text class="ink" x="644" y="642" text-anchor="middle"><tspan x="644" dy="0">انتظامیہ</tspan></text><text class="ink" x="136" y="642" text-anchor="middle"><tspan x="136" dy="0">عدلیہ</tspan></text><text class="ink" x="390" y="666" text-anchor="middle"><tspan x="390" dy="0">جج جوڈیشل کمیشن کے</tspan><tspan x="390" dy="20">ذریعے مقرر ہوتے ہیں</tspan></text><path class="link" d="M644 690H136" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="h" x="390" y="724" text-anchor="middle"><tspan x="390" dy="0">صوبے میں یہی ڈھانچہ</tspan></text><rect class="panel" x="526" y="742" width="236" height="76" rx="6"/><rect class="panel" x="272" y="742" width="236" height="76" rx="6"/><rect class="panel" x="18" y="742" width="236" height="76" rx="6"/><text class="ink" x="644" y="782" text-anchor="middle"><tspan x="644" dy="0">صوبائی اسمبلی</tspan></text><text class="ink" x="390" y="760" text-anchor="middle"><tspan x="390" dy="0">وزیرِ اعلیٰ اور</tspan><tspan x="390" dy="20">صوبائی کابینہ</tspan><tspan x="390" dy="20">(گورنر صوبے کا</tspan><tspan x="390" dy="20">سربراہ)</tspan></text><text class="ink" x="136" y="782" text-anchor="middle"><tspan x="136" dy="0">ہائی کورٹ</tspan></text><text font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" class="wm" x="768" y="840" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
