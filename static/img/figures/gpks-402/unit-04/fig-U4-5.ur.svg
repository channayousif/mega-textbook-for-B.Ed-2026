<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1300" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کسی بنیادی حق کی خلاف ورزی پر داد رسی کا فلو چارٹ</title><desc id="d">فلو چارٹ کہ کسی بنیادی حق کی خلاف ورزی پر شہری داد رسی کیسے حاصل کرتا ہے: جو ہوا اسے درج کریں، دفتر اور کسی اعلیٰ افسر سے شکایت کریں، پھر محتسب سے، پھر آرٹیکل 199 کے تحت ہائی کورٹ میں رٹ پٹیشن دائر کریں؛ سپریم کورٹ آرٹیکل 184(3) کے تحت عوامی اہمیت کے سوالات پر براہِ راست کارروائی کر سکتی ہے اور آرٹیکل 185 کے تحت اپیلیں سن سکتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 2; }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 20px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="1300"/><text class="h" x="390" y="36" text-anchor="middle"><tspan x="390" dy="0">جب کسی بنیادی حق کی خلاف ورزی ہو</tspan></text><rect class="panel" x="280" y="65" width="460" height="88" rx="18"/><text class="ink" x="510" y="96" text-anchor="middle"><tspan x="510" dy="0">کسی شخص کو یقین ہے کہ کسی سرکاری ادارے نے</tspan><tspan x="510" dy="20">اس کے بنیادی حق کی خلاف ورزی کی ہے</tspan><tspan x="510" dy="20">(ریاست، آرٹیکل 7)</tspan></text><path class="link" d="M510 153V180" marker-end="url(#arrow)"/><rect class="panel" x="280" y="180" width="460" height="70" rx="4"/><text class="ink" x="510" y="211" text-anchor="middle"><tspan x="510" dy="0">لکھیں کہ کیا ہوا، کب ہوا،</tspan><tspan x="510" dy="20">اور کون سا حق (آرٹیکل 9-28)</tspan></text><path class="link" d="M510 250V280" marker-end="url(#arrow)"/><rect class="panel" x="280" y="280" width="460" height="70" rx="4"/><text class="ink" x="510" y="311" text-anchor="middle"><tspan x="510" dy="0">متعلقہ دفتر کو تحریری شکایت کریں،</tspan><tspan x="510" dy="20">پھر کسی اعلیٰ افسر کو</tspan></text><path class="link" d="M510 350V378" marker-end="url(#arrow)"/><polygon class="panel" points="510,378 360,426 510,474 660,426"/><text class="ink" x="510" y="431" text-anchor="middle"><tspan x="510" dy="0">مسئلہ حل ہوا؟</tspan></text><path class="link" d="M360 426H220" marker-end="url(#arrow)"/><text class="ink" x="295" y="414" text-anchor="middle"><tspan x="295" dy="0">ہاں</tspan></text><rect class="panel" x="30" y="397" width="190" height="58" rx="18"/><text class="ink" x="125" y="422" text-anchor="middle"><tspan x="125" dy="0">جواب کی ایک نقل</tspan><tspan x="125" dy="20">محفوظ رکھیں</tspan></text><path class="link" d="M510 474V520" marker-end="url(#arrow)"/><text class="ink" x="488" y="500" text-anchor="middle"><tspan x="488" dy="0">نہیں</tspan></text><rect class="panel" x="280" y="520" width="460" height="70" rx="4"/><text class="ink" x="510" y="551" text-anchor="middle"><tspan x="510" dy="0">بدانتظامی کی شکایت</tspan><tspan x="510" dy="20">محتسب سے کریں</tspan></text><path class="link" d="M510 590V618" marker-end="url(#arrow)"/><polygon class="panel" points="510,618 360,666 510,714 660,666"/><text class="ink" x="510" y="671" text-anchor="middle"><tspan x="510" dy="0">مسئلہ حل ہوا؟</tspan></text><path class="link" d="M360 666H245V440H220" marker-end="url(#arrow)"/><text class="ink" x="300" y="654" text-anchor="middle"><tspan x="300" dy="0">ہاں</tspan></text><path class="link" d="M510 714V760" marker-end="url(#arrow)"/><text class="ink" x="488" y="740" text-anchor="middle"><tspan x="488" dy="0">نہیں</tspan></text><rect class="panel" x="280" y="760" width="460" height="58" rx="4"/><text class="ink" x="510" y="794" text-anchor="middle"><tspan x="510" dy="0">کسی وکیل یا قانونی امداد کی سروس سے مشورہ کریں</tspan></text><path class="link" d="M510 818V850" marker-end="url(#arrow)"/><polygon class="panel" points="510,850 290,930 510,1010 730,930"/><text class="ink" x="510" y="917" text-anchor="middle"><tspan x="510" dy="0">کیا یہ بہت سے لوگوں کو</tspan><tspan x="510" dy="20">متاثر کرنے والا عوامی</tspan><tspan x="510" dy="20">اہمیت کا سوال ہے؟</tspan></text><path class="link" d="M290 930H220" marker-end="url(#arrow)"/><text class="ink" x="255" y="917" text-anchor="middle"><tspan x="255" dy="0">ہاں</tspan></text><rect class="panel" x="30" y="884" width="190" height="92" rx="4"/><text class="ink" x="125" y="917" text-anchor="middle"><tspan x="125" dy="0">سپریم کورٹ براہِ راست</tspan><tspan x="125" dy="20">کارروائی کر سکتی ہے</tspan><tspan x="125" dy="20">(آرٹیکل 184(3))</tspan></text><path class="link" d="M510 1010V1050" marker-end="url(#arrow)"/><text class="ink" x="488" y="1036" text-anchor="middle"><tspan x="488" dy="0">نہیں</tspan></text><rect class="panel" x="280" y="1050" width="460" height="58" rx="4"/><text class="ink" x="510" y="1075" text-anchor="middle"><tspan x="510" dy="0">ہائی کورٹ میں رٹ پٹیشن دائر کریں</tspan><tspan x="510" dy="20">(آرٹیکل 199)</tspan></text><path class="link" d="M510 1108V1138" marker-end="url(#arrow)"/><rect class="panel" x="280" y="1138" width="460" height="70" rx="4"/><text class="ink" x="510" y="1169" text-anchor="middle"><tspan x="510" dy="0">عدالت عہدیدار کو عمل کا حکم دیتی ہے،</tspan><tspan x="510" dy="20">یا اقدام کو کالعدم قرار دیتی ہے (آرٹیکل 8)</tspan></text><path class="link" d="M510 1208V1238" marker-end="url(#arrow)"/><rect class="panel" x="280" y="1238" width="460" height="44" rx="18"/><text class="ink" x="510" y="1265" text-anchor="middle"><tspan x="510" dy="0">ضرورت ہو تو سپریم کورٹ میں اپیل (آرٹیکل 185)</tspan></text><text font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" class="wm" x="768" y="1295" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
