<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 870" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے طبعی خطوں کا نقشہ نما خاکہ</title><desc id="d">پاکستان کے طبعی خطوں کا نقشہ نما خاکہ: شمالی پہاڑ (ہمالیہ، قراقرم اور ہندوکش)، مغربی کوہِ سلیمان اور کیرتھر کے سلسلے، پوٹھوہار اور بلوچستان کی سطح ہائے مرتفع، سندھ کا بالائی اور زیریں میدان، تھل، چولستان، تھر اور خاران کے صحرا، اور مکران کا ساحل اور سندھ کا ڈیلٹا؛ دریائے سندھ اور اس کے معاون دریا بحیرۂ عرب کی طرف بہتے دکھائے گئے ہیں، اور چاروں پڑوسی ممالک کے نام درج ہیں۔</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.link{fill:none;stroke:var(--ink);stroke-width:1.5} .ink{fill:var(--ink);font-size:14px}
.muted{fill:var(--muted);font-size:14px} .h{fill:var(--ink);font-size:18px;font-weight:700}
.wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}
text{fill:var(--ink);font-size:14px} .label{fill:var(--ink);font-size:16px;font-weight:600}.lk{font-size:15px}
.zone{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.river{fill:none;stroke:var(--a2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tributary{fill:none;stroke:var(--a2);stroke-width:2.5;stroke-linecap:round}
.badge{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.halo{font-size:14px;fill:var(--ink);stroke:var(--bg);stroke-width:4;paint-order:stroke fill;stroke-linejoin:round}
</style><defs><pattern id="mountains" width="28" height="23" patternUnits="userSpaceOnUse"><rect width="28" height="23" fill="var(--a1-fill)"/><path d="M3 19 13 4 23 19" class="link"/></pattern><pattern id="plateau" width="13" height="13" patternUnits="userSpaceOnUse"><rect width="13" height="13" fill="var(--a3-fill)"/><path d="M0 13 13 0" stroke="var(--muted)" stroke-width="0.8"/></pattern><pattern id="plain" width="14" height="18" patternUnits="userSpaceOnUse"><rect width="14" height="18" fill="var(--a1-fill)"/><path d="M0 17H14" stroke="var(--muted)" stroke-width="0.7"/></pattern><pattern id="desert" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="var(--a3-fill)"/><circle cx="4" cy="4" r="1.3" class="ink"/></pattern><pattern id="coast" width="24" height="14" patternUnits="userSpaceOnUse"><rect width="24" height="14" fill="var(--a2-fill)"/><path d="M0 7Q6 1 12 7T24 7" class="link"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" width="780" height="870"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0">پاکستان: طبعی خطے اور دریا</tspan></text><text class="muted" x="756" y="57" text-anchor="end"><tspan x="756" dy="0">خاکہ، پیمانے کے مطابق نہیں۔ درست سرحدیں ظاہر نہیں کی گئیں۔</tspan></text><path class="zone" fill="url(#mountains)" d="M250 175 301 129 351 109 389 130 448 158 466 197 420 234 351 249 290 220Z"/><path class="zone" fill="url(#plateau)" d="M290 220 351 249 367 289 316 313 276 277Z"/><path class="zone" fill="url(#mountains)" d="M250 175 290 220 276 277 256 338 239 417 226 520 250 639 220 690 189 605 190 520 196 439 217 367 221 283Z"/><path class="zone" fill="url(#plateau)" d="M196 439 190 520 189 605 220 690 104 696 63 654 79 583 129 540 146 477Z"/><path class="zone" fill="url(#plain)" d="M276 277 316 313 367 289 433 344 450 422 396 476 356 508 348 573 373 656 350 