th class="link" d="M44 124V85" marker-end="url(#arrow)"/><text class="label" x="34" y="148" text-anchor="start"><tspan x="34" dy="0">شمال</tspan></text><rect class="panel" x="510" y="78" width="250" height="725" rx="8"/><text class="h" x="526" y="106" text-anchor="start"><tspan x="526" dy="0">کلید: طبعی خطے</tspan></text><rect x="526" y="123" width="28" height="24" fill="url(#mountains)" class="zone"/><text class="label lk" x="564" y="140" text-anchor="start"><tspan x="564" dy="0">1۔ شمالی پہاڑ</tspan></text><text x="526" y="166" text-anchor="start"><tspan x="526" dy="0">ہمالیہ، قراقرم (کے ٹو)،</tspan></text><text x="526" y="185" text-anchor="start"><tspan x="526" dy="0">ہندوکش</tspan></text><rect x="526" y="207" width="28" height="24" fill="url(#mountains)" class="zone"/><text class="label lk" x="564" y="224" text-anchor="start"><tspan x="564" dy="0">2۔ مغربی پہاڑ</tspan></text><text x="526" y="250" text-anchor="start"><tspan x="526" dy="0">کوہِ سلیمان اور کیرتھر کے سلسلے</tspan></text><rect x="526" y="274" width="28" height="24" fill="url(#plateau)" class="zone"/><text class="label" style="font-size:14px" x="564" y="291" text-anchor="start"><tspan x="564" dy="0">3۔ پوٹھوہار کی سطحِ مرتفع</tspan></text><rect x="526" y="320" width="28" height="24" fill="url(#plateau)" class="zone"/><text class="label" x="564" y="337" text-anchor="start"><tspan x="564" dy="0">4۔ بلوچستان کی</tspan></text><text x="564" y="358" text-anchor="start"><tspan x="564" dy="0">سطحِ مرتفع</tspan></text><rect x="526" y="380" width="28" height="24" fill="url(#plain)" class="zone"/><text class="label" x="564" y="397" text-anchor="start"><tspan x="564" dy="0">5۔ سندھ کا میدان</tspan></text><text x="526" y="423" text-anchor="start"><tspan x="526" dy="0">بالائی: پنجاب، پانچ دریا</tspan></text><text x="526" y="442" text-anchor="start"><tspan x="526" dy="0">زیریں: سندھ</tspan></text><rect x="526" y="466" width="28" height="24" fill="url(#desert)" class="zone"/><text class="label" x="564" y="483" text-a