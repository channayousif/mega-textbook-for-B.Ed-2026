20-7-5-7 5z"/><text class="zl halo" x="837" y="593" text-anchor="middle">N</text><path class="ib" d="M691 673h89M691 668v10M780 668v10"/><text class="halo" x="691" y="664">0</text><text class="halo" x="780" y="664" text-anchor="middle">200 km</text><text class="h" x="20" y="737">Key</text><rect class="pk" x="20" y="757" width="34" height="18"/><rect class="mt" x="20" y="757" width="34" height="18"/><rect class="frame" x="20" y="757" width="34" height="18"/><text class="kt" x="64" y="771">Mountains</text><rect class="pk" x="306" y="757" width="34" height="18"/><rect class="ds" x="306" y="757" width="34" height="18"/><rect class="frame" x="306" y="757" width="34" height="18"/><text class="kt" x="350" y="771">Desert (Thar and Cholistan)</text><rect class="pk" x="592" y="757" width="34" height="18"/><rect class="dl" x="592" y="757" width="34" height="18"/><rect class="frame" x="592" y="757" width="34" height="18"/><text class="kt" x="636" y="771">Indus Delta</text><rect class="pk" x="20" y="785" width="34" height="18"/><rect class="dz" x="20" y="785" width="34" height="18"/><rect class="frame" x="20" y="785" width="34" height="18"/><text class="kt" x="64" y="799">Disputed territory</text><path class="rv" d="M306 794h34"/><text class="kt" x="350" y="799">Indus River</text><path class="tr" d="M592 794h34"/><text class="kt" x="636" y="799">Tributary</text><path class="ib" d="M20 822h34"/><text class="kt" x="64" y="827">International boundary</text><path class="lc" d="M306 822h34"/><text class="kt" x="350" y="827">Line of Control (approximate)</text><path class="wb" d="M592 822h34"/><text class="kt" x="636" y="827">Working Boundary</text><path class="fu" d="M20 850h34"/><text class="kt" x="64" y="855">Frontier undefined</text><rect class="pt" x="308" y="846" width="8" height="8"/><circle class="ptw" cx="324" cy="850" r="4"/><rect class="ptw" x="332" y="846" width="8" height="8"/><text class="kt" x="350" y="855">Capital, city, dam</text><text class="note" x="20" y="883">Indian Illegally Occupied Jammu and Kashmir: disputed territory, final status to be decided in line with relevant UNSC resolutions.</text><text class="note" x="20" y="899">The dotted Line of Control is approximate. The state of Jammu and Kashmir and its accession is yet to be decided through a</text><text class="note" x="20" y="915">plebiscite under the relevant United Nations Security Council resolutions.</text><text class="note" x="20" y="931">Where FRONTIER UNDEFINED appears, the actual boundary will be decided by the sovereign authorities concerned after the final</text><text class="note" x="20" y="947">settlement of the Jammu and Kashmir dispute. Too small to show at this scale: Junagadh and Manavadar (south of the map area)</text><text class="note" x="20" y="963">and the Sir Creek boundary, which runs along the eastern bank of the creek. Region edges are generalised for teaching.</text><text class="note" x="20" y="979">Boundaries: Natural Earth 5.1.1 (public domain), Pakistan point of view, checked against the Survey of Pakistan folio map.</text><text class="wm" x="880" y="1001" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>