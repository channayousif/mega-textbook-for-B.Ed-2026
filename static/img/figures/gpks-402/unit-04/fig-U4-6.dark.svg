<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1009" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Map of Pakistan's physical regions and rivers</title><desc id="d">Map of Pakistan's physical regions and rivers: the northern and western mountains (Himalaya, Karakoram, Hindu Kush, Sulaiman and Kirthar ranges), the Potohar and Balochistan plateaus, the upper and lower Indus Plain, the Thal, Cholistan, Thar and Kharan deserts, and the Makran coast and Indus Delta, with the Indus and its tributaries the Jhelum, Chenab, Ravi and Sutlej flowing to the Arabian Sea; neighbouring Afghanistan, Iran, China and India are labelled, and Jammu and Kashmir is shown as disputed territory with the Line of Control, as on the Survey of Pakistan map.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .sea{fill:var(--a2-fill)} .nb{fill:var(--bg);stroke:var(--muted);stroke-width:1} .pk{fill:var(--a1-fill)} .dz{fill:url(#hd)} .mt{fill:url(#hm)} .ds{fill:url(#hs)} .dl{fill:url(#hl)} .hm{stroke:var(--a3);stroke-width:1.4} .hs{fill:var(--a3)} .hl{stroke:var(--a2);stroke-width:1.2} .hd{stroke:var(--a1);stroke-width:1} .ib{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round} .cs{fill:none;stroke:var(--a2);stroke-width:1.2} .fu{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 4} .lc{fill:none;stroke:var(--a3);stroke-width:2.6;stroke-dasharray:0.1 6;stroke-linecap:round} .wb{fill:none;stroke:var(--a4);stroke-width:2;stroke-dasharray:7 3} .rv{fill:none;stroke:var(--a2);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round} .tr{fill:none;stroke:var(--a2);stroke-width:1.8;stroke-linecap:round} .frame{fill:none;stroke:var(--muted);stroke-width:1} .pt{fill:var(--ink)} .ptw{fill:var(--bg);str