<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of civil-military relations in Pakistan from 1947 to the present</title><desc id="d">Timeline of civil-military relations in Pakistan from 1947 to the present, showing civilian periods (1947-1958, 1971-1977, 1988-1999 and from 2008) and periods of military rule under Ayub Khan (1958-1969), Yahya Khan (1969-1971), Zia ul Haq (1977-1988) and Pervez Musharraf (1999-2008), with markers for the 1956 and 1973 Constitutions and the 1985 and 2010 amendments.</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3}
.link{stroke:var(--ink);stroke-width:2;fill:none}
.ink{fill:var(--ink);font-size:14px}
.muted{fill:var(--muted);font-size:14px}
.h{fill:var(--ink);font-size:18px;font-weight:700}
.sh{fill:var(--ink);font-size:14px;font-weight:700}
.band{fill:var(--ink);font-size:12px}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
</style><rect class="bg" x="0" y="0" width="780" height="610"/><text class="h" x="24" y="28">Civil-military relations in Pakistan, 1947 to the present</text><text class="ink" x="96" y="68" text-anchor="middle">1956 first</text><text class="ink" x="96" y="86" text-anchor="middle">Constitution</text><path class="link" d="M96,96 V136"/><path class="ah" d="M92,130 L100,130 L96,138 Z"/><text class="ink" x="339" y="68" text-anchor="middle">1973</text><text class="ink" x="339" y="86" text-anchor="middle">Constitution</text><path class="link" d="M339,96 V136"/><path class="ah" d="M335,130 L343,130 L339,138 Z"/><text class="ink" x="456" y="68" text-anchor="middle">1985 Eighth</text><text class="ink" x="456" y="86" text-anchor="middle">Amendment</text><path class="link" d="M456,96 V136"/><path class="ah" d="M452,130 L460,130 L456,138 Z"/><text class="ink" x="690" y="68" text-anchor="middle">2010 Eighteenth</text><text class="ink" x="690" y="86" text-anchor="middle">Amendment</text><path class="link" d="M690,96 V136"/><path class="ah" d="M686,130 L694,130 L690,138 Z"/><rect class="panel-a" x="24" y="142" width="91.5" height="68"/><text class="sh" x="69.75" y="160" text-anchor="middle">1</text><text class="band" x="69.75" y="181" text-anchor="middle">1947-1958</text><text class="band" x="69.75" y="199" text-anchor="middle">Civilian</text><rect class="panel-b" x="115.5" y="142" width="91.5" height="68"/><text class="sh" x="161.25" y="160" text-anchor="middle">2</text><text class="band" x="161.25" y="181" text-anchor="middle">1958-1969</text><text class="band" x="161.25" y="199" text-anchor="middle">Military</text><rect class="panel-b" x="207" y="142" width="91.5" height="68"/><text class="sh" x="252.75" y="160" text-anchor="middle">3</text><text class="band" x="252.75" y="181" text-anchor="middle">1969-1971</text><text class="band" x="252.75" y="199" text-anchor="middle">Military</text><rect class="panel-a" x="298.5" y="142" width="91.5" height="68"/><text class="sh" x="344.25" y="160" text-anchor="middle">4</text><text class="band" x="344.25" y="181" text-anchor="middle">1971-1977</text><text class="band" x="344.25" y="199" text-anchor="middle">Civilian</text><rect class="panel-b" x="390" y="142" width="91.5" height="68"/><text class="sh" x="435.75" y="160" text-anchor="middle">5</text><text class="band" x="435.75" y="181" text-anchor="middle">1977-1988</text><text class="band" x="435.75" y="199" text-anchor="middle">Military</text><rect class="panel-a" x="481.5" y="142" width="91.5" height="68"/><text class="sh" x="527.25" y="160" text-anchor="middle">6</text><text class="band" x="527.25" y="181" text-anchor="middle">1988-1999</text><text class="band" x="527.25" y="199" text-anchor="middle">Civilian</text><rect class="panel-b" x="573" y="142" width="91.5" height="68"/><text class="sh" x="618.75" y="160" text-anchor="middle">7</text><text class="band" x="618.75" y="181" text-anchor="middle">1999-2008</text><text class="band" x="618.75" y="199" text-anchor="middle">Military</text><rect class="panel-a" x="664.5" y="142" width="91.5" height="68"/><text class="sh" x="710.25" y="160" text-anchor="middle">8</text><text class="band" x="710.25" y="181" text-anchor="middle">2008 onward</text><text class="band" x="710.25" y="199" text-anchor="middle">Civilian</text><text class="muted" x="24" y="233" text-anchor="start">Read left to right. Band widths are not to scale. Numbers link bands to details.</text><rect class="panel" x="24" y="249" width="174" height="145" rx="5"/><text class="sh" x="34" y="273" text-anchor="start">1. 1947-1958</text><text class="ink" x="34" y="300" text-anchor="start">civilian</text><text class="ink" x="34" y="319" text-anchor="start">governments</text><text class="ink" x="34" y="338" text-anchor="start">(frequent changes)</text><rect class="panel-b" x="210" y="249" width="174" height="145" rx="5"/><text class="sh" x="220" y="273" text-anchor="start">2. 1958-1969</text><text class="ink" x="220" y="300" text-anchor="start">Ayub Khan: martial</text><text class="ink" x="220" y="319" text-anchor="start">law, then 1962</text><text class="ink" x="220" y="338" text-anchor="start">Constitution</text><rect class="panel-b" x="396" y="249" width="174" height="145" rx="5"/><text class="sh" x="406" y="273" text-anchor="start">3. 1969-1971</text><text class="ink" x="406" y="300" text-anchor="start">Yahya Khan:</text><text class="ink" x="406" y="319" text-anchor="start">martial law</text><rect class="panel" x="582" y="249" width="174" height="145" rx="5"/><text class="sh" x="592" y="273" text-anchor="start">4. 1971-1977</text><text class="ink" x="592" y="300" text-anchor="start">civilian: 1973</text><text class="ink" x="592" y="319" text-anchor="start">Constitution made</text><rect class="panel-b" x="24" y="410" width="174" height="170" rx="5"/><text class="sh" x="34" y="434" text-anchor="start">5. 1977-1988</text><text class="ink" x="34" y="461" text-anchor="start">Zia ul Haq:</text><text class="ink" x="34" y="480" text-anchor="start">martial law to 1985</text><rect class="panel" x="210" y="410" width="174" height="170" rx="5"/><text class="sh" x="220" y="434" text-anchor="start">6. 1988-1999</text><text class="ink" x="220" y="461" text-anchor="start">elected</text><text class="ink" x="220" y="480" text-anchor="start">governments,</text><text class="ink" x="220" y="499" text-anchor="start">dismissed before</text><text class="ink" x="220" y="518" text-anchor="start">full term</text><rect class="panel-b" x="396" y="410" width="174" height="170" rx="5"/><text class="sh" x="406" y="434" text-anchor="start">7. 1999-2008</text><text class="ink" x="406" y="461" text-anchor="start">Pervez Musharraf</text><rect class="panel" x="582" y="410" width="174" height="170" rx="5"/><text class="sh" x="592" y="434" text-anchor="start">8. 2008 onward</text><text class="ink" x="592" y="461" text-anchor="start">elected</text><text class="ink" x="592" y="480" text-anchor="start">governments;</text><text class="ink" x="592" y="499" text-anchor="start">2013 first</text><text class="ink" x="592" y="518" text-anchor="start">completed term and</text><text class="ink" x="592" y="537" text-anchor="start">civilian transfer</text><text class="wm" x="768" y="600" text-anchor="end" aria-hidden="true">textbook.com.pk</text><text class="ink" x="592" y="556" text-anchor="start">of power</text></svg>
