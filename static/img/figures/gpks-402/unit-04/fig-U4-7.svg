<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 614" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of Pakistan's natural resources in four sectors (agriculture, water, minerals and energy)</title><desc id="d">Table of Pakistan's natural resources in four sectors (agriculture, water, minerals and energy), showing the main resources in each, where they are found, such as Thar coal, Sui gas and Reko Diq copper and gold in Balochistan, and why they matter for food, industry, jobs and energy.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1; } .ink { font-size: 14px; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="614"/><rect class="panel" x="12" y="12" width="112" height="52"/><text class="h" x="22" y="36">Sector</text><rect class="panel" x="124" y="12" width="196" height="52"/><text class="h" x="134" y="36">Main resources</text><rect class="panel" x="320" y="12" width="244" height="52"/><text class="h" x="330" y="36">Where they are found</text><rect class="panel" x="564" y="12" width="204" height="52"/><text class="h" x="574" y="36">Why they matter</text><rect class="link" x="12" y="64" width="112" height="116"/><text class="ink" x="22" y="88">Agriculture</text><rect class="link" x="124" y="64" width="196" height="116"/><text class="ink" x="134" y="88">fertile alluvial</text><text class="ink" x="134" y="106">soil; canal water;</text><text class="ink" x="134" y="124">crops such as wheat,</text><text class="ink" x="134" y="142">cotton, rice and</text><text class="ink" x="134" y="160">sugarcane; livestock</text><rect class="link" x="320" y="64" width="244" height="116"/><text class="ink" x="330" y="88">Indus Plain of Punjab and</text><text class="ink" x="330" y="106">Sindh; livestock also in</text><text class="ink" x="330" y="124">Balochistan and Thar</text><rect class="link" x="564" y="64" width="204" height="116"/><text class="ink" x="574" y="88">food for the nation,</text><text class="ink" x="574" y="106">raw material for</text><text class="ink" x="574" y="124">textiles, and work</text><text class="ink" x="574" y="142">for a large share of</text><text class="ink" x="574" y="160">the people</text><rect class="link" x="12" y="180" width="112" height="98"/><text class="ink" x="22" y="204">Water</text><rect class="link" x="124" y="180" width="196" height="98"/><text class="ink" x="134" y="204">the Indus and its</text><text class="ink" x="134" y="222">tributaries;</text><text class="ink" x="134" y="240">glaciers;</text><text class="ink" x="134" y="258">groundwater</text><rect class="link" x="320" y="180" width="244" height="98"/><text class="ink" x="330" y="204">glaciers in the north;</text><text class="ink" x="330" y="222">rivers and canals across</text><text class="ink" x="330" y="240">the plain</text><rect class="link" x="564" y="180" width="204" height="98"/><text class="ink" x="574" y="204">irrigation, drinking</text><text class="ink" x="574" y="222">water, and the base</text><text class="ink" x="574" y="240">of almost all farming</text><rect class="link" x="12" y="278" width="112" height="152"/><text class="ink" x="22" y="302">Minerals</text><rect class="link" x="124" y="278" width="196" height="152"/><text class="ink" x="134" y="302">rock salt; coal;</text><text class="ink" x="134" y="320">copper and gold;</text><text class="ink" x="134" y="338">chromite; limestone</text><text class="ink" x="134" y="356">and marble</text><rect class="link" x="320" y="278" width="244" height="152"/><text class="ink" x="330" y="302">Khewra (salt); Thar and</text><text class="ink" x="330" y="320">Lakhra (coal); Reko Diq</text><text class="ink" x="330" y="338">and Saindak in Balochistan</text><text class="ink" x="330" y="356">(copper and gold);</text><text class="ink" x="330" y="374">Balochistan and Khyber</text><text class="ink" x="330" y="392">Pakhtunkhwa (chromite,</text><text class="ink" x="330" y="410">marble)</text><rect class="link" x="564" y="278" width="204" height="152"/><text class="ink" x="574" y="302">industry, exports and</text><text class="ink" x="574" y="320">jobs, much of it in</text><text class="ink" x="574" y="338">less developed areas</text><rect class="link" x="12" y="430" width="112" height="152"/><text class="ink" x="22" y="454">Energy</text><rect class="link" x="124" y="430" width="196" height="152"/><text class="ink" x="134" y="454">natural gas; oil;</text><text class="ink" x="134" y="472">hydropower; coal;</text><text class="ink" x="134" y="490">wind and solar</text><rect class="link" x="320" y="430" width="244" height="152"/><text class="ink" x="330" y="454">Sui and other fields in</text><text class="ink" x="330" y="472">Balochistan and Sindh</text><text class="ink" x="330" y="490">(gas); Potohar (oil);</text><text class="ink" x="330" y="508">Tarbela and Mangla</text><text class="ink" x="330" y="526">(hydropower); Thar (coal);</text><text class="ink" x="330" y="544">Jhimpir and Gharo wind</text><text class="ink" x="330" y="562">corridor in Sindh</text><rect class="link" x="564" y="430" width="204" height="152"/><text class="ink" x="574" y="454">power for homes,</text><text class="ink" x="574" y="472">farms and factories,</text><text class="ink" x="574" y="490">and less dependence</text><text class="ink" x="574" y="508">on imported fuel</text><text class="wm" x="768" y="604" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
