<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1947 سے اب تک پاکستان میں سول ملٹری تعلقات کی ٹائم لائن</title><desc id="d">1947 سے اب تک پاکستان میں سول ملٹری تعلقات کی ٹائم لائن: سول ادوار (1947-1958، 1971-1977، 1988-1999 اور 2008 سے) اور ایوب خان (1958-1969)، یحییٰ خان (1969-1971)، ضیاء الحق (1977-1988) اور پرویز مشرف (1999-2008) کے تحت فوجی حکمرانی کے ادوار، اور 1956 اور 1973 کے آئینوں اور 1985 اور 2010 کی ترامیم کے نشانات۔</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--ink);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3}
.link{stroke:var(--ink);stroke-width:2;fill:none}
.ink{fill:var(--ink);font-size:14px}
.muted{fill:var(--muted);font-size:14px}
.h{fill:var(--ink);font-size:18px;font-weight:700}
.sh{fill:var(--ink);font-size:14px;font-weight:700}
.band{fill:var(--ink);font-size:12px}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
</style><rect class="bg" x="0" y="0" width="780" height="610"/><text class="h" x="751" y="28" text-anchor="end"><tspan x="751" dy="0">پاکستان میں سول ملٹری تعلقات، 1947 سے اب تک</tspan></text><text class="ink" x="684" y="68" text-anchor="middle"><tspan x="684" dy="0">1956 کا پہلا</tspan></text><text class="ink" x="684" y="86" text-anchor="middle"><tspan x="684" dy="0">آئین</tspan></text><path class="link" d="M684 96V136"/><path class="ah" d="M688 130L680 130L684 138 Z"/><text class="ink" x="441" y="68" text-anchor="middle"><tspan x="441" dy="0">1973 کا</tspan></text><text class="ink" x="441" y="86" text-anchor="middle"><tspan x="441" dy="0">آئین</tspan></text><path class="link" d="M441 96V136"/><path class="ah" d="M445 130L437 130L441 138 Z"/><text class="ink" x="324" y="68" text-anchor="middle"><tspan x="324" dy="0">1985 کی آٹھویں</tspan></text><text class="ink" x="324" y="86" text-anchor="middle"><tspan x="324" dy="0">ترمیم</tspan></text><path class="link" d="M324 96V136"/><path class="ah" d="M328 130L320 130L324 138 Z"/><text class="ink" x="90" y="68" text-anchor="middle"><tspan x="90" dy="0">2010 کی اٹھارویں</tspan></text><text class="ink" x="90" y="86" text-anchor="middle"><tspan x="90" dy="0">ترمیم</tspan></text><path class="link" d="M90 96V136"/><path class="ah" d="M94 130L86 130L90 138 Z"/><rect class="panel-a" x="664.5" y="142" width="91.5" height="68"/><text class="sh" x="710.25" y="160" text-anchor="middle"><tspan x="710.25" dy="0">1</tspan></text><text class="band" x="710.25" y="181" text-anchor="middle"><tspan x="710.25" dy="0">1947-1958</tspan></text><text class="band" x="710.25" y="199" text-anchor="middle"><tspan x="710.25" dy="0">سول</tspan></text><rect class="panel-b" x="573" y="142" width="91.5" height="68"/><text class="sh" x="618.75" y="160" text-anchor="middle"><tspan x="618.75" dy="0">2</tspan></text><text class="band" x="618.75" y="181" text-anchor="middle"><tspan x="618.75" dy="0">1958-1969</tspan></text><text class="band" x="618.75" y="199" text-anchor="middle"><tspan x="618.75" dy="0">فوجی</tspan></text><rect class="panel-b" x="481.5" y="142" width="91.5" height="68"/><text class="sh" x="527.25" y="160" text-anchor="middle"><tspan x="527.25" dy="0">3</tspan></text><text class="band" x="527.25" y="181" text-anchor="middle"><tspan x="527.25" dy="0">1969-1971</tspan></text><text class="band" x="527.25" y="199" text-anchor="middle"><tspan x="527.25" dy="0">فوجی</tspan></text><rect class="panel-a" x="390" y="142" width="91.5" height="68"/><text class="sh" x="435.75" y="160" text-anchor="middle"><tspan x="435.75" dy="0">4</tspan></text><text class="band" x="435.75" y="181" text-anchor="middle"><tspan x="435.75" dy="0">1971-1977</tspan></text><text class="band" x="435.75" y="199" text-anchor="middle"><tspan x="435.75" dy="0">سول</tspan></text><rect class="panel-b" x="298.5" y="142" width="91.5" height="68"/><text class="sh" x="344.25" y="160" text-anchor="middle"><tspan x="344.25" dy="0">5</tspan></text><text class="band" x="344.25" y="181" text-anchor="middle"><tspan x="344.25" dy="0">1977-1988</tspan></text><text class="band" x="344.25" y="199" text-anchor="middle"><tspan x="344.25" dy="0">فوجی</tspan></text><rect class="panel-a" x="207" y="142" width="91.5" height="68"/><text class="sh" x="252.75" y="160" text-anchor="middle"><tspan x="252.75" dy="0">6</tspan></text><text class="band" x="252.75" y="181" text-anchor="middle"><tspan x="252.75" dy="0">1988-1999</tspan></text><text class="band" x="252.75" y="199" text-anchor="middle"><tspan x="252.75" dy="0">سول</tspan></text><rect class="panel-b" x="115.5" y="142" width="91.5" height="68"/><text class="sh" x="161.25" y="160" text-anchor="middle"><tspan x="161.25" dy="0">7</tspan></text><text class="band" x="161.25" y="181" text-anchor="middle"><tspan x="161.25" dy="0">1999-2008</tspan></text><text class="band" x="161.25" y="199" text-anchor="middle"><tspan x="161.25" dy="0">فوجی</tspan></text><rect class="panel-a" x="24" y="142" width="91.5" height="68"/><text class="sh" x="69.75" y="160" text-anchor="middle"><tspan x="69.75" dy="0">8</tspan></text><text class="band" x="69.75" y="181" text-anchor="middle"><tspan x="69.75" dy="0">2008 سے</tspan></text><text class="band" x="69.75" y="199" text-anchor="middle"><tspan x="69.75" dy="0">سول</tspan></text><text class="muted" x="751" y="233" text-anchor="end"><tspan x="751" dy="0">دائیں سے بائیں پڑھیں۔ پٹیوں کی چوڑائی پیمانے کے مطابق نہیں۔ نمبر پٹیوں کو تفصیل سے جوڑتے ہیں۔</tspan></text><rect class="panel" x="582" y="249" width="174" height="145" rx="5"/><text class="sh" x="741" y="273" text-anchor="end"><tspan x="741" dy="0">1۔ 1947-1958</tspan></text><text class="ink" x="741" y="300" text-anchor="end"><tspan x="741" dy="0">سول حکومتیں</tspan><tspan x="741" dy="20">(بار بار تبدیلی)</tspan></text><rect class="panel-b" x="396" y="249" width="174" height="145" rx="5"/><text class="sh" x="555" y="273" text-anchor="end"><tspan x="555" dy="0">2۔ 1958-1969</tspan></text><text class="ink" x="555" y="300" text-anchor="end"><tspan x="555" dy="0">ایوب خان: مارشل لا،</tspan><tspan x="555" dy="20">پھر 1962 کا آئین</tspan></text><rect class="panel-b" x="210" y="249" width="174" height="145" rx="5"/><text class="sh" x="369" y="273" text-anchor="end"><tspan x="369" dy="0">3۔ 1969-1971</tspan></text><text class="ink" x="369" y="300" text-anchor="end"><tspan x="369" dy="0">یحییٰ خان:</tspan><tspan x="369" dy="20">مارشل لا</tspan></text><rect class="panel" x="24" y="249" width="174" height="145" rx="5"/><text class="sh" x="183" y="273" text-anchor="end"><tspan x="183" dy="0">4۔ 1971-1977</tspan></text><text class="ink" x="183" y="300" text-anchor="end"><tspan x="183" dy="0">سول: 1973 کا</tspan><tspan x="183" dy="20">آئین بنا</tspan></text><rect class="panel-b" x="582" y="410" width="174" height="170" rx="5"/><text class="sh" x="741" y="434" text-anchor="end"><tspan x="741" dy="0">5۔ 1977-1988</tspan></text><text class="ink" x="741" y="461" text-anchor="end"><tspan x="741" dy="0">ضیاء الحق: 1985</tspan><tspan x="741" dy="20">تک مارشل لا</tspan></text><rect class="panel" x="396" y="410" width="174" height="170" rx="5"/><text class="sh" x="555" y="434" text-anchor="end"><tspan x="555" dy="0">6۔ 1988-1999</tspan></text><text class="ink" x="555" y="461" text-anchor="end"><tspan x="555" dy="0">منتخب حکومتیں،</tspan><tspan x="555" dy="20">مدت پوری ہونے سے</tspan><tspan x="555" dy="20">پہلے برطرف</tspan></text><rect class="panel-b" x="210" y="410" width="174" height="170" rx="5"/><text class="sh" x="369" y="434" text-anchor="end"><tspan x="369" dy="0">7۔ 1999-2008</tspan></text><text class="ink" x="369" y="461" text-anchor="end"><tspan x="369" dy="0">پرویز مشرف</tspan></text><rect class="panel" x="24" y="410" width="174" height="170" rx="5"/><text class="sh" x="183" y="434" text-anchor="end"><tspan x="183" dy="0">8۔ 2008 سے</tspan></text><text class="ink" x="183" y="461" text-anchor="end"><tspan x="183" dy="0">منتخب حکومتیں؛</tspan><tspan x="183" dy="20">2013 میں پہلی بار</tspan><tspan x="183" dy="20">مدت مکمل اور</tspan><tspan x="183" dy="20">اقتدار کی سول</tspan><tspan x="183" dy="20">منتقلی</tspan></text><text font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" class="wm" x="768" y="600" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
