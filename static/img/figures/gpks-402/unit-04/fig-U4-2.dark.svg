<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of civil-military relations in Pakistan with three branches</title><desc id="d">Concept map of civil-military relations in Pakistan with three branches: causes (weak institutions, insecurity, a strong military facing divided parties, institutional interests), patterns (direct military rule, influence under civilian governments, dismissals of elected governments, elected rule since 2008) and consequences (constitutions abrogated or suspended, institutions weakened, grievances before 1971, debate about growth), with a loop showing that weakened institutions feed back into the causes, and a note on the constitutional rule in Article 245.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 2; }
.ink { font-size: 16px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="720"/><rect class="panel" x="210" y="20" width="360" height="66" rx="22"/><text class="h" x="390" y="47" text-anchor="middle"><tspan x="390" dy="0">Civil-military relations</tspan><tspan x="390" dy="23">in Pakistan</tspan></text><path class="link" d="M390 86 V102 M144 120 V102 H636 V120 M390 102 V120"/><rect class="panel" x="34" y="120" width="220" height="38" rx="8"/><text class="h" x="144" y="145" text-anchor="middle"><tspan x="144" dy="0">Causes</tspan></text><path class="link" d="M144 158 V168 H26 V531"/><path class="link" d="M26 225 H34"/><rect class="panel" x="34" y="180" width="220" height="90" rx="8"/><text class="ink" x="144" y="210" text-anchor="middle"><tspan x="144" dy="0">weak political</tspan><tspan x="144" dy="20">institutions after</tspan><tspan x="144" dy="20">1948-1951</tspan></text><path class="link" d="M26 327 H34"/><rect class="panel" x="34" y="282" width="220" height="90" rx="8"/><text class="ink" x="144" y="312" text-anchor="middle"><tspan x="144" dy="0">insecurity: tension</tspan><tspan x="144" dy="20">with India, war</tspan><tspan x="144" dy="20">in Afghanistan</tspan></text><path class="link" d="M26 429 H34"/><rect class="panel" x="34" y="384" width="220" height="90" rx="8"/><text class="ink" x="144" y="424" text-anchor="middle"><tspan x="144" dy="0">disciplined military</tspan><tspan x="144" dy="20">vs divided parties</tspan></text><path class="link" d="M26 531 H34"/><rect class="panel" x="34" y="486" width="220" height="90" rx="8"/><text class="ink" x="144" y="526" text-anchor="middle"><tspan x="144" dy="0">institutional interests:</tspan><tspan x="144" dy="20">budget, autonomy</tspan></text><rect class="panel" x="280" y="120" width="220" height="38" rx="8"/><text class="h" x="390" y="145" text-anchor="middle"><tspan x="390" dy="0">Patterns</tspan></text><path class="link" d="M390 158 V168 H272 V531"/><path class="link" d="M272 225 H280"/><rect class="panel" x="280" y="180" width="220" height="90" rx="8"/><text class="ink" x="390" y="210" text-anchor="middle"><tspan x="390" dy="0">direct military rule</tspan><tspan x="390" dy="20">(1958, 1969,</tspan><tspan x="390" dy="20">1977, 1999)</tspan></text><path class="link" d="M272 327 H280"/><rect class="panel" x="280" y="282" width="220" height="90" rx="8"/><text class="ink" x="390" y="322" text-anchor="middle"><tspan x="390" dy="0">influence under</tspan><tspan x="390" dy="20">civilian governments</tspan></text><path class="link" d="M272 429 H280"/><rect class="panel" x="280" y="384" width="220" height="90" rx="8"/><text class="ink" x="390" y="424" text-anchor="middle"><tspan x="390" dy="0">dismissal of elected</tspan><tspan x="390" dy="20">governments 1988-1999</tspan></text><path class="link" d="M272 531 H280"/><rect class="panel" x="280" y="486" width="220" height="90" rx="8"/><text class="ink" x="390" y="526" text-anchor="middle"><tspan x="390" dy="0">elected governments</tspan><tspan x="390" dy="20">since 2008</tspan></text><rect class="panel" x="526" y="120" width="220" height="38" rx="8"/><text class="h" x="636" y="145" text-anchor="middle"><tspan x="636" dy="0">Consequences</tspan></text><path class="link" d="M636 158 V168 H518 V531"/><path class="link" d="M518 225 H526"/><rect class="panel" x="526" y="180" width="220" height="90" rx="8"/><text class="ink" x="636" y="220" text-anchor="middle"><tspan x="636" dy="0">constitutions</tspan><tspan x="636" dy="20">abrogated or suspended</tspan></text><path class="link" d="M518 327 H526"/><rect class="panel" x="526" y="282" width="220" height="90" rx="8"/><text class="ink" x="636" y="322" text-anchor="middle"><tspan x="636" dy="0">institutions given</tspan><tspan x="636" dy="20">less time to grow</tspan></text><path class="link" d="M518 429 H526"/><rect class="panel" x="526" y="384" width="220" height="90" rx="8"/><text class="ink" x="636" y="434" text-anchor="middle"><tspan x="636" dy="0">grievances before 1971</tspan></text><path class="link" d="M518 531 H526"/><rect class="panel" x="526" y="486" width="220" height="90" rx="8"/><text class="ink" x="636" y="526" text-anchor="middle"><tspan x="636" dy="0">debate about growth</tspan><tspan x="636" dy="20">and order</tspan></text><path class="link" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#arrow)" d="M746 327 H764 V610 H12 V225 H34"/><text class="ink" x="390" y="601" text-anchor="middle"><tspan x="390" dy="0">cycle</tspan></text><rect class="panel" x="34" y="632" width="712" height="58" rx="4"/><text class="ink" x="390" y="654" text-anchor="middle"><tspan x="390" dy="0">Constitutional rule: Article 245, Armed Forces act under</tspan><tspan x="390" dy="20">the directions of the Federal Government</tspan></text><text class="wm" x="768" y="710" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
