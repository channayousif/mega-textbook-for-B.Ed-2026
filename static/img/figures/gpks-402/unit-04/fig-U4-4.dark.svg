<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 956" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of ten fundamental rights from Articles 9 to 28 of the 1973 Constitution</title><desc id="d">Table of ten fundamental rights from Articles 9 to 28 of the 1973 Constitution, showing for each the article, the right, who holds it, what it protects in plain words and a school example, such as Article 25A giving every child aged five to sixteen a right to free and compulsory education.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1; }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="956"/><rect class="panel" x="12" y="12" width="756" height="60"/><text class="h" x="18" y="38"><tspan x="18" dy="0">Article</tspan></text><text class="h" x="94" y="38"><tspan x="94" dy="0">Right</tspan></text><text class="h" x="230" y="38"><tspan x="230" dy="0">Who holds</tspan><tspan x="230" dy="18">it</tspan></text><text class="h" x="350" y="38"><tspan x="350" dy="0">What it protects (in</tspan><tspan x="350" dy="18">plain words)</tspan></text><text class="h" x="554" y="38"><tspan x="554" dy="0">A classroom-relevant</tspan><tspan x="554" dy="18">example</tspan></text><text class="ink" x="18" y="98"><tspan x="18" dy="0">9</tspan></text><text class="ink" x="94" y="98"><tspan x="94" dy="0">Security of</tspan><tspan x="94" dy="18">person</tspan></text><text class="ink" x="230" y="98"><tspan x="230" dy="0">every person</tspan></text><text class="ink" x="350" y="98"><tspan x="350" dy="0">life and liberty,</tspan><tspan x="350" dy="18">taken away only by law</tspan></text><text class="ink" x="554" y="98"><tspan x="554" dy="0">a pupil cannot be locked</tspan><tspan x="554" dy="18">up by a landlord to</tspan><tspan x="554" dy="18">force the family to work</tspan></text><text class="ink" x="18" y="176"><tspan x="18" dy="0">10A</tspan></text><text class="ink" x="94" y="176"><tspan x="94" dy="0">Fair trial</tspan></text><text class="ink" x="230" y="176"><tspan x="230" dy="0">every person</tspan></text><text class="ink" x="350" y="176"><tspan x="350" dy="0">a fair hearing and due</tspan><tspan x="350" dy="18">process</tspan></text><text class="ink" x="554" y="176"><tspan x="554" dy="0">a teacher accused of</tspan><tspan x="554" dy="18">misconduct must be heard</tspan><tspan x="554" dy="18">before being punished</tspan></text><text class="ink" x="18" y="254"><tspan x="18" dy="0">11</tspan></text><text class="ink" x="94" y="254"><tspan x="94" dy="0">No slavery or</tspan><tspan x="94" dy="18">forced labour</tspan></text><text class="ink" x="230" y="254"><tspan x="230" dy="0">every person</tspan></text><text class="ink" x="350" y="254"><tspan x="350" dy="0">no forced labour; no</tspan><tspan x="350" dy="18">child under 14 in</tspan><tspan x="350" dy="18">factories, mines or</tspan><tspan x="350" dy="18">hazardous work</tspan></text><text class="ink" x="554" y="254"><tspan x="554" dy="0">a 12-year-old cannot be</tspan><tspan x="554" dy="18">sent to work in a brick</tspan><tspan x="554" dy="18">kiln</tspan></text><text class="ink" x="18" y="350"><tspan x="18" dy="0">14</tspan></text><text class="ink" x="94" y="350"><tspan x="94" dy="0">Dignity; no</tspan><tspan x="94" dy="18">torture</tspan></text><text class="ink" x="230" y="350"><tspan x="230" dy="0">every person</tspan></text><text class="ink" x="350" y="350"><tspan x="350" dy="0">privacy of home and</tspan><tspan x="350" dy="18">dignity</tspan></text><text class="ink" x="554" y="350"><tspan x="554" dy="0">no humiliating</tspan><tspan x="554" dy="18">punishment in school</tspan></text><text class="ink" x="18" y="410"><tspan x="18" dy="0">15-17</tspan></text><text class="ink" x="94" y="410"><tspan x="94" dy="0">Movement,</tspan><tspan x="94" dy="18">assembly,</tspan><tspan x="94" dy="18">association</tspan></text><text class="ink" x="230" y="410"><tspan x="230" dy="0">every</tspan><tspan x="230" dy="18">citizen</tspan></text><text class="ink" x="350" y="410"><tspan x="350" dy="0">to move freely, meet</tspan><tspan x="350" dy="18">peacefully, form</tspan><tspan x="350" dy="18">unions and parties</tspan></text><text class="ink" x="554" y="410"><tspan x="554" dy="0">parents may form a</tspan><tspan x="554" dy="18">school committee</tspan></text><text class="ink" x="18" y="488"><tspan x="18" dy="0">19, 19A</tspan></text><text class="ink" x="94" y="488"><tspan x="94" dy="0">Speech;</tspan><tspan x="94" dy="18">information</tspan></text><text class="ink" x="230" y="488"><tspan x="230" dy="0">every</tspan><tspan x="230" dy="18">citizen</tspan></text><text class="ink" x="350" y="488"><tspan x="350" dy="0">to speak and publish,</tspan><tspan x="350" dy="18">and to obtain public</tspan><tspan x="350" dy="18">information, within</tspan><tspan x="350" dy="18">reasonable limits set</tspan><tspan x="350" dy="18">by law</tspan></text><text class="ink" x="554" y="488"><tspan x="554" dy="0">a parent can ask the</tspan><tspan x="554" dy="18">education office for the</tspan><tspan x="554" dy="18">school&#x27;s budget</tspan></text><text class="ink" x="18" y="602"><tspan x="18" dy="0">20, 22</tspan></text><text class="ink" x="94" y="602"><tspan x="94" dy="0">Religion;</tspan><tspan x="94" dy="18">religious</tspan><tspan x="94" dy="18">instruction</tspan></text><text class="ink" x="230" y="602"><tspan x="230" dy="0">every</tspan><tspan x="230" dy="18">citizen</tspan></text><text class="ink" x="350" y="602"><tspan x="350" dy="0">to practise one&#x27;s</tspan><tspan x="350" dy="18">religion; no one</tspan><tspan x="350" dy="18">forced to receive</tspan><tspan x="350" dy="18">instruction in another</tspan><tspan x="350" dy="18">religion</tspan></text><text class="ink" x="554" y="602"><tspan x="554" dy="0">a Hindu pupil is not</tspan><tspan x="554" dy="18">made to attend Islamiat</tspan><tspan x="554" dy="18">if the family chooses</tspan><tspan x="554" dy="18">ethics instead</tspan></text><text class="ink" x="18" y="716"><tspan x="18" dy="0">25</tspan></text><text class="ink" x="94" y="716"><tspan x="94" dy="0">Equality</tspan></text><text class="ink" x="230" y="716"><tspan x="230" dy="0">every</tspan><tspan x="230" dy="18">citizen</tspan></text><text class="ink" x="350" y="716"><tspan x="350" dy="0">equal before law; no</tspan><tspan x="350" dy="18">discrimination on the</tspan><tspan x="350" dy="18">basis of sex</tspan></text><text class="ink" x="554" y="716"><tspan x="554" dy="0">girls and boys have the</tspan><tspan x="554" dy="18">same right to a school</tspan><tspan x="554" dy="18">place</tspan></text><text class="ink" x="18" y="794"><tspan x="18" dy="0">25A</tspan></text><text class="ink" x="94" y="794"><tspan x="94" dy="0">Education</tspan></text><text class="ink" x="230" y="794"><tspan x="230" dy="0">every child</tspan><tspan x="230" dy="18">aged 5-16</tspan></text><text class="ink" x="350" y="794"><tspan x="350" dy="0">free and compulsory</tspan><tspan x="350" dy="18">education</tspan></text><text class="ink" x="554" y="794"><tspan x="554" dy="0">the State must provide a</tspan><tspan x="554" dy="18">school place for</tspan><tspan x="554" dy="18">Rukhsana&#x27;s sister</tspan></text><text class="ink" x="18" y="872"><tspan x="18" dy="0">28</tspan></text><text class="ink" x="94" y="872"><tspan x="94" dy="0">Language,</tspan><tspan x="94" dy="18">script and</tspan><tspan x="94" dy="18">culture</tspan></text><text class="ink" x="230" y="872"><tspan x="230" dy="0">any section</tspan><tspan x="230" dy="18">of citizens</tspan></text><text class="ink" x="350" y="872"><tspan x="350" dy="0">to preserve their</tspan><tspan x="350" dy="18">language and culture</tspan></text><text class="ink" x="554" y="872"><tspan x="554" dy="0">Sindhi or Balochi taught</tspan><tspan x="554" dy="18">alongside Urdu</tspan></text><path class="link" d="M12 12H768V924H12Z M88 12V924 M224 12V924 M344 12V924 M548 12V924 M12 72H768 M12 150H768 M12 228H768 M12 324H768 M12 384H768 M12 462H768 M12 576H768 M12 690H768 M12 768H768 M12 846H768"/><text class="wm" x="768" y="946" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
