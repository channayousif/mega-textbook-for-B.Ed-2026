<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 956" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1973 کے آئین کے آرٹیکل 9 تا 28 کے دس بنیادی حقوق کی جدول</title><desc id="d">1973 کے آئین کے آرٹیکل 9 تا 28 کے دس بنیادی حقوق کی جدول، جس میں ہر حق کے لیے آرٹیکل، حق، یہ حق کس کو حاصل ہے، یہ آسان الفاظ میں کس چیز کا تحفظ کرتا ہے، اور اسکول کی ایک مثال دکھائی گئی ہے؛ مثلاً آرٹیکل 25A پانچ سے سولہ سال کے ہر بچے کو مفت اور لازمی تعلیم کا حق دیتا ہے۔</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 1; }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="956"/><rect class="panel" x="12" y="12" width="756" height="60"/><text class="h" x="757" y="38" text-anchor="end"><tspan x="757" dy="0">آرٹیکل</tspan></text><text class="h" x="681" y="38" text-anchor="end"><tspan x="681" dy="0">حق</tspan></text><text class="h" x="545" y="38" text-anchor="end"><tspan x="545" dy="0">کس کو</tspan><tspan x="545" dy="19">حاصل ہے</tspan></text><text class="h" x="425" y="38" text-anchor="end"><tspan x="425" dy="0">کس چیز کا تحفظ</tspan><tspan x="425" dy="19">(آسان الفاظ میں)</tspan></text><text class="h" x="221" y="38" text-anchor="end"><tspan x="221" dy="0">جماعت سے متعلق</tspan><tspan x="221" dy="19">مثال</tspan></text><text class="ink" x="757" y="98" text-anchor="end"><tspan x="757" dy="0">9</tspan></text><text class="ink" x="681" y="98" text-anchor="end"><tspan x="681" dy="0">شخصی</tspan><tspan x="681" dy="19">تحفظ</tspan></text><text class="ink" x="545" y="98" text-anchor="end"><tspan x="545" dy="0">ہر شخص</tspan></text><text class="ink" x="425" y="98" text-anchor="end"><tspan x="425" dy="0">زندگی اور آزادی، جو صرف</tspan><tspan x="425" dy="19">قانون کے ذریعے چھینی جا سکے</tspan></text><text class="ink" x="221" y="98" text-anchor="end"><tspan x="221" dy="0">کوئی زمیندار خاندان سے کام</tspan><tspan x="221" dy="19">لینے کے لیے کسی طالب علم</tspan><tspan x="221" dy="19">کو بند نہیں رکھ سکتا</tspan></text><text class="ink" x="757" y="176" text-anchor="end"><tspan x="757" dy="0">10A</tspan></text><text class="ink" x="681" y="176" text-anchor="end"><tspan x="681" dy="0">منصفانہ سماعت</tspan></text><text class="ink" x="545" y="176" text-anchor="end"><tspan x="545" dy="0">ہر شخص</tspan></text><text class="ink" x="425" y="176" text-anchor="end"><tspan x="425" dy="0">منصفانہ سماعت اور</tspan><tspan x="425" dy="19">قانونی تقاضوں کی پابندی</tspan></text><text class="ink" x="221" y="176" text-anchor="end"><tspan x="221" dy="0">بدسلوکی کے الزام میں استاد کو</tspan><tspan x="221" dy="19">سزا سے پہلے سنا جانا</tspan><tspan x="221" dy="19">ضروری ہے</tspan></text><text class="ink" x="757" y="254" text-anchor="end"><tspan x="757" dy="0">11</tspan></text><text class="ink" x="681" y="254" text-anchor="end"><tspan x="681" dy="0">غلامی یا جبری</tspan><tspan x="681" dy="19">مشقت نہیں</tspan></text><text class="ink" x="545" y="254" text-anchor="end"><tspan x="545" dy="0">ہر شخص</tspan></text><text class="ink" x="425" y="254" text-anchor="end"><tspan x="425" dy="0">جبری مشقت نہیں؛ 14 سال سے</tspan><tspan x="425" dy="19">کم عمر کوئی بچہ کارخانے،</tspan><tspan x="425" dy="19">کان یا خطرناک کام</tspan><tspan x="425" dy="19">میں نہیں</tspan></text><text class="ink" x="221" y="254" text-anchor="end"><tspan x="221" dy="0">12 سال کے بچے کو اینٹوں</tspan><tspan x="221" dy="19">کے بھٹے پر کام کے لیے</tspan><tspan x="221" dy="19">نہیں بھیجا جا سکتا</tspan></text><text class="ink" x="757" y="350" text-anchor="end"><tspan x="757" dy="0">14</tspan></text><text class="ink" x="681" y="350" text-anchor="end"><tspan x="681" dy="0">وقار؛ تشدد</tspan><tspan x="681" dy="19">نہیں</tspan></text><text class="ink" x="545" y="350" text-anchor="end"><tspan x="545" dy="0">ہر شخص</tspan></text><text class="ink" x="425" y="350" text-anchor="end"><tspan x="425" dy="0">گھر کی رازداری اور</tspan><tspan x="425" dy="19">وقار</tspan></text><text class="ink" x="221" y="350" text-anchor="end"><tspan x="221" dy="0">اسکول میں ذلت آمیز</tspan><tspan x="221" dy="19">سزا نہیں</tspan></text><text class="ink" x="757" y="410" text-anchor="end"><tspan x="757" dy="0">15-17</tspan></text><text class="ink" x="681" y="410" text-anchor="end"><tspan x="681" dy="0">نقل و حرکت،</tspan><tspan x="681" dy="19">اجتماع،</tspan><tspan x="681" dy="19">انجمن سازی</tspan></text><text class="ink" x="545" y="410" text-anchor="end"><tspan x="545" dy="0">ہر</tspan><tspan x="545" dy="19">شہری</tspan></text><text class="ink" x="425" y="410" text-anchor="end"><tspan x="425" dy="0">آزادی سے آنا جانا، پرامن</tspan><tspan x="425" dy="19">طور پر ملنا، یونین اور</tspan><tspan x="425" dy="19">جماعتیں بنانا</tspan></text><text class="ink" x="221" y="410" text-anchor="end"><tspan x="221" dy="0">والدین اسکول کمیٹی</tspan><tspan x="221" dy="19">بنا سکتے ہیں</tspan></text><text class="ink" x="757" y="488" text-anchor="end"><tspan x="757" dy="0">19، 19A</tspan></text><text class="ink" x="681" y="488" text-anchor="end"><tspan x="681" dy="0">تقریر؛</tspan><tspan x="681" dy="19">معلومات</tspan></text><text class="ink" x="545" y="488" text-anchor="end"><tspan x="545" dy="0">ہر</tspan><tspan x="545" dy="19">شہری</tspan></text><text class="ink" x="425" y="488" text-anchor="end"><tspan x="425" dy="0">بولنا اور شائع کرنا، اور</tspan><tspan x="425" dy="19">عوامی معلومات حاصل کرنا،</tspan><tspan x="425" dy="19">قانون کی مقرر کردہ</tspan><tspan x="425" dy="19">معقول حدود میں</tspan></text><text class="ink" x="221" y="488" text-anchor="end"><tspan x="221" dy="0">والدین محکمۂ تعلیم سے اسکول</tspan><tspan x="221" dy="19">کا بجٹ پوچھ سکتے ہیں</tspan></text><text class="ink" x="757" y="602" text-anchor="end"><tspan x="757" dy="0">20، 22</tspan></text><text class="ink" x="681" y="602" text-anchor="end"><tspan x="681" dy="0">مذہب؛</tspan><tspan x="681" dy="19">مذہبی</tspan><tspan x="681" dy="19">تعلیم</tspan></text><text class="ink" x="545" y="602" text-anchor="end"><tspan x="545" dy="0">ہر</tspan><tspan x="545" dy="19">شہری</tspan></text><text class="ink" x="425" y="602" text-anchor="end"><tspan x="425" dy="0">اپنے مذہب پر عمل؛ کسی کو</tspan><tspan x="425" dy="19">دوسرے مذہب کی تعلیم</tspan><tspan x="425" dy="19">لینے پر مجبور نہیں</tspan><tspan x="425" dy="19">کیا جا سکتا</tspan></text><text class="ink" x="221" y="602" text-anchor="end"><tspan x="221" dy="0">اگر خاندان اخلاقیات کا</tspan><tspan x="221" dy="19">انتخاب کرے تو ہندو طالب علم</tspan><tspan x="221" dy="19">کو اسلامیات میں بیٹھنے پر</tspan><tspan x="221" dy="19">مجبور نہیں کیا جاتا</tspan></text><text class="ink" x="757" y="716" text-anchor="end"><tspan x="757" dy="0">25</tspan></text><text class="ink" x="681" y="716" text-anchor="end"><tspan x="681" dy="0">مساوات</tspan></text><text class="ink" x="545" y="716" text-anchor="end"><tspan x="545" dy="0">ہر</tspan><tspan x="545" dy="19">شہری</tspan></text><text class="ink" x="425" y="716" text-anchor="end"><tspan x="425" dy="0">قانون کی نظر میں برابر؛</tspan><tspan x="425" dy="19">جنس کی بنیاد پر</tspan><tspan x="425" dy="19">امتیاز نہیں</tspan></text><text class="ink" x="221" y="716" text-anchor="end"><tspan x="221" dy="0">لڑکیوں اور لڑکوں کا اسکول</tspan><tspan x="221" dy="19">میں جگہ پر یکساں حق</tspan></text><text class="ink" x="757" y="794" text-anchor="end"><tspan x="757" dy="0">25A</tspan></text><text class="ink" x="681" y="794" text-anchor="end"><tspan x="681" dy="0">تعلیم</tspan></text><text class="ink" x="545" y="794" text-anchor="end"><tspan x="545" dy="0">5-16 سال کا</tspan><tspan x="545" dy="19">ہر بچہ</tspan></text><text class="ink" x="425" y="794" text-anchor="end"><tspan x="425" dy="0">مفت اور لازمی</tspan><tspan x="425" dy="19">تعلیم</tspan></text><text class="ink" x="221" y="794" text-anchor="end"><tspan x="221" dy="0">ریاست رخسانہ کی بہن کو</tspan><tspan x="221" dy="19">اسکول میں جگہ دینے</tspan><tspan x="221" dy="19">کی پابند ہے</tspan></text><text class="ink" x="757" y="872" text-anchor="end"><tspan x="757" dy="0">28</tspan></text><text class="ink" x="681" y="872" text-anchor="end"><tspan x="681" dy="0">زبان، رسم الخط</tspan><tspan x="681" dy="19">اور ثقافت</tspan></text><text class="ink" x="545" y="872" text-anchor="end"><tspan x="545" dy="0">شہریوں کا</tspan><tspan x="545" dy="19">کوئی بھی طبقہ</tspan></text><text class="ink" x="425" y="872" text-anchor="end"><tspan x="425" dy="0">اپنی زبان اور ثقافت</tspan><tspan x="425" dy="19">محفوظ رکھنا</tspan></text><text class="ink" x="221" y="872" text-anchor="end"><tspan x="221" dy="0">اردو کے ساتھ سندھی</tspan><tspan x="221" dy="19">یا بلوچی کی تدریس</tspan></text><path class="link" d="M768 12H12V924H768ZM 692 12V924M556 12V924M436 12V924M232 12V924M768 72H12M768 150H12M768 228H12M768 324H12M768 384H12M768 462H12M768 576H12M768 690H12M768 768H12M768 846H12"/><text font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" class="wm" x="768" y="946" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
