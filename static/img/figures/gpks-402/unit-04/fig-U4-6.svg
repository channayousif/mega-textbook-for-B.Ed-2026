<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of Pakistan's five physical regions</title><desc id="d">Table of Pakistan's five physical regions: the northern and western mountains, the Potohar and Balochistan plateaus, the upper and lower Indus Plain, the Thal, Cholistan, Thar and Kharan deserts, and the coastal belt, showing what each is like, where it is and example places, with a note that the Indus and its tributaries link the regions.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .link { fill: none; stroke: var(--ink); stroke-width: 1; } .ink { font-size: 14px; fill: var(--ink); } .lab { font-size: 14px; font-weight: 700; fill: var(--ink); } .muted { font-size: 14px; fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="720"/><rect class="panel" x="12" y="12" width="150" height="52"/><text class="h" x="22" y="42">Region</text><rect class="panel" x="162" y="12" width="236" height="52"/><text class="h" x="172" y="42">What it is like</text><rect class="panel" x="398" y="12" width="214" height="52"/><text class="h" x="408" y="42">Where</text><rect class="panel" x="612" y="12" width="156" height="52"/><text class="h" x="622" y="42">Examples</text><rect class="link" x="12" y="64" width="150" height="130"/><text class="lab" x="22" y="88">1. Northern and</text><text class="lab" x="22" y="106">western</text><text class="lab" x="22" y="124">mountains</text><rect class="link" x="162" y="64" width="236" height="130"/><text class="ink" x="172" y="88">Himalaya, Karakoram and Hindu</text><text class="ink" x="172" y="106">Kush meet in the far north;</text><text class="ink" x="172" y="124">lower ranges (Safed Koh,</text><text class="ink" x="172" y="142">Sulaiman, Kirthar) run along</text><text class="ink" x="172" y="160">the west; glaciers feed the</text><text class="ink" x="172" y="178">rivers in summer</text><rect class="link" x="398" y="64" width="214" height="130"/><text class="ink" x="408" y="88">the far north (Gilgit-</text><text class="ink" x="408" y="106">Baltistan, Khyber</text><text class="ink" x="408" y="124">Pakhtunkhwa) and along the</text><text class="ink" x="408" y="142">western side of the</text><text class="ink" x="408" y="160">country</text><rect class="link" x="612" y="64" width="156" height="130"/><text class="ink" x="622" y="88">K2; Nanga Parbat;</text><text class="ink" x="622" y="106">Khyber Pass</text><rect class="link" x="12" y="194" width="150" height="112"/><text class="lab" x="22" y="218">2. Plateaus</text><rect class="link" x="162" y="194" width="236" height="112"/><text class="ink" x="172" y="218">Potohar: a high, broken upland</text><text class="ink" x="172" y="236">with oil fields and the salt</text><text class="ink" x="172" y="254">range; Balochistan: a large,</text><text class="ink" x="172" y="272">dry upland of ranges and</text><text class="ink" x="172" y="290">basins with few people</text><rect class="link" x="398" y="194" width="214" height="112"/><text class="ink" x="408" y="218">Potohar around Rawalpindi</text><text class="ink" x="408" y="236">and Chakwal; Balochistan</text><text class="ink" x="408" y="254">Plateau in the south-west</text><rect class="link" x="612" y="194" width="156" height="112"/><text class="ink" x="622" y="218">Khewra salt mine</text><rect class="link" x="12" y="306" width="150" height="112"/><text class="lab" x="22" y="330">3. Indus Plain</text><rect class="link" x="162" y="306" width="236" height="112"/><text class="ink" x="172" y="330">rich soil laid down by the</text><text class="ink" x="172" y="348">rivers; the upper plain is</text><text class="ink" x="172" y="366">crossed by five rivers and</text><text class="ink" x="172" y="384">doabs; the lower plain is</text><text class="ink" x="172" y="402">flatter and ends in a delta</text><rect class="link" x="398" y="306" width="214" height="112"/><text class="ink" x="408" y="330">upper plain in the Punjab;</text><text class="ink" x="408" y="348">lower plain in Sindh, with</text><text class="ink" x="408" y="366">the delta south of Thatta</text><rect class="link" x="612" y="306" width="156" height="112"/><text class="ink" x="622" y="330">Lahore,</text><text class="ink" x="622" y="348">Faisalabad,</text><text class="ink" x="622" y="366">Multan, Hyderabad</text><rect class="link" x="12" y="418" width="150" height="130"/><text class="lab" x="22" y="442">4. Deserts</text><rect class="link" x="162" y="418" width="236" height="130"/><text class="ink" x="172" y="442">four main deserts; the Thar is</text><text class="ink" x="172" y="460">sandy with dunes but supports</text><text class="ink" x="172" y="478">villages, livestock and</text><text class="ink" x="172" y="496">farming in good rain years</text><rect class="link" x="398" y="418" width="214" height="130"/><text class="ink" x="408" y="442">Thal (Punjab, between the</text><text class="ink" x="408" y="460">Indus and the Jhelum);</text><text class="ink" x="408" y="478">Cholistan (near</text><text class="ink" x="408" y="496">Bahawalpur); Thar (south-</text><text class="ink" x="408" y="514">eastern Sindh); Kharan</text><text class="ink" x="408" y="532">(Balochistan)</text><rect class="link" x="612" y="418" width="156" height="130"/><text class="ink" x="622" y="442">Mithi in</text><text class="ink" x="622" y="460">Tharparkar</text><rect class="link" x="12" y="548" width="150" height="94"/><text class="lab" x="22" y="572">5. Coastal belt</text><rect class="link" x="162" y="548" width="236" height="94"/><text class="ink" x="172" y="572">about 1,000 km of Arabian Sea</text><text class="ink" x="172" y="590">coast; the Makran coast is dry</text><text class="ink" x="172" y="608">and rocky; the delta has</text><text class="ink" x="172" y="626">creeks and mangrove forests</text><rect class="link" x="398" y="548" width="214" height="94"/><text class="ink" x="408" y="572">from the Indus Delta near</text><text class="ink" x="408" y="590">Karachi west to the</text><text class="ink" x="408" y="608">Iranian border</text><rect class="link" x="612" y="548" width="156" height="94"/><text class="ink" x="622" y="572">Karachi, Port</text><text class="ink" x="622" y="590">Qasim, Gwadar</text><text class="muted" x="12" y="668">The Indus links the regions: it rises in Tibet, is joined in the Punjab by the Jhelum, Chenab,</text><text class="muted" x="12" y="686">Ravi and Sutlej, and reaches the Arabian Sea through the delta.</text><text class="wm" x="768" y="710" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>