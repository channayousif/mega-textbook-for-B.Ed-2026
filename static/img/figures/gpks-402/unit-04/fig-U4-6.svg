<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 870" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Map-style diagram of Pakistan's physical zones</title><desc id="d">Map-style diagram of Pakistan's physical zones: the northern mountains (Himalaya, Karakoram and Hindu Kush), the western Sulaiman and Kirthar ranges, the Potohar and Balochistan plateaus, the upper and lower Indus Plain, the Thal, Cholistan, Thar and Kharan deserts, and the Makran coast and Indus Delta, with the Indus and its tributaries flowing to the Arabian Sea and the four neighbouring countries labelled.</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.link{fill:none;stroke:var(--ink);stroke-width:1.5} .ink{fill:var(--ink);font-size:14px}
.muted{fill:var(--muted);font-size:14px} .h{fill:var(--ink);font-size:18px;font-weight:700}
.wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}
text{fill:var(--ink);font-size:14px} .label{fill:var(--ink);font-size:16px;font-weight:600}.lk{font-size:15px}
.zone{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.river{fill:none;stroke:var(--a2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.tributary{fill:none;stroke:var(--a2);stroke-width:2.5;stroke-linecap:round}
.badge{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.halo{font-size:14px;fill:var(--ink);stroke:var(--bg);stroke-width:4;paint-order:stroke fill;stroke-linejoin:round}
</style><defs><pattern id="mountains" width="28" height="23" patternUnits="userSpaceOnUse"><rect width="28" height="23" fill="var(--a1-fill)"/><path d="M3 19 13 4 23 19" class="link"/></pattern><pattern id="plateau" width="13" height="13" patternUnits="userSpaceOnUse"><rect width="13" height="13" fill="var(--a3-fill)"/><path d="M0 13 13 0" stroke="var(--muted)" stroke-width="0.8"/></pattern><pattern id="plain" width="14" height="18" patternUnits="userSpaceOnUse"><rect width="14" height="18" fill="var(--a1-fill)"/><path d="M0 17H14" stroke="var(--muted)" stroke-width="0.7"/></pattern><pattern id="desert" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="var(--a3-fill)"/><circle cx="4" cy="4" r="1.3" class="ink"/></pattern><pattern id="coast" width="24" height="14" patternUnits="userSpaceOnUse"><rect width="24" height="14" fill="var(--a2-fill)"/><path d="M0 7Q6 1 12 7T24 7" class="link"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" width="780" height="870"/><text class="h" x="24" y="32">Pakistan: physical zones and rivers</text><text class="muted" x="24" y="57">Schematic, not to scale. No exact borders implied.</text><path class="zone" fill="url(#mountains)" d="M250 175 301 129 351 109 389 130 448 158 466 197 420 234 351 249 290 220Z"/><path class="zone" fill="url(#plateau)" d="M290 220 351 249 367 289 316 313 276 277Z"/><path class="zone" fill="url(#mountains)" d="M250 175 290 220 276 277 256 338 239 417 226 520 250 639 220 690 189 605 190 520 196 439 217 367 221 283Z"/><path class="zone" fill="url(#plateau)" d="M196 439 190 520 189 605 220 690 104 696 63 654 79 583 129 540 146 477Z"/><path class="zone" fill="url(#plain)" d="M276 277 316 313 367 289 433 344 450 422 396 476 356 508 348 573 373 656 350 710 281 703 250 639 226 520 239 417 256 338Z"/><path class="zone" fill="url(#coast)" d="M104 696 220 690 281 703 350 710 371 741 290 757 218 731 120 735 77 720Z"/><path class="zone" fill="url(#desert)" d="M277 363 305 355 318 415 291 443 273 417Z"/><path class="zone" fill="url(#desert)" d="M398 440 443 429 435 484 383 540 366 520Z"/><path class="zone" fill="url(#desert)" d="M357 571 399 591 420 673 379 705 352 650Z"/><path class="zone" fill="url(#desert)" d="M92 566 153 555 177 591 157 624 99 617Z"/><path class="river" d="M417 180 373 213 326 244 313 290 332 339 323 399 333 459 311 509 300 569 302 628 318 681 320 724 331 768"/><path class="tributary" d="M378 276 367 317 360 350 347 385 323 399"/><path class="tributary" d="M411 312 396 352 381 383 359 417 333 459"/><path class="tributary" d="M435 365 411 401 397 429 359 465 311 509"/><path class="tributary" d="M451 407 438 450 411 479 364 508 311 509"/><path class="tributary" d="M318 681 300 720 283 747M320 724 348 749"/><path class="link" d="M331 768V790" marker-end="url(#arrow)"/><circle class="badge" cx="340" cy="172" r="15"/><text class="label" x="340" y="178" text-anchor="middle">1</text><circle class="badge" cx="231" cy="361" r="15"/><text class="label" x="231" y="367" text-anchor="middle">2</text><circle class="badge" cx="301" cy="274" r="15"/><text class="label" x="301" y="280" text-anchor="middle">3</text><circle class="badge" cx="145" cy="653" r="15"/><text class="label" x="145" y="659" text-anchor="middle">4</text><circle class="badge" cx="345" cy="554" r="15"/><text class="label" x="345" y="560" text-anchor="middle">5</text><circle class="badge" cx="201" cy="714" r="15"/><text class="label" x="201" y="720" text-anchor="middle">6</text><text class="halo" x="266" y="362">Thal</text><text class="halo" x="390" y="502">Cholistan</text><text class="halo" x="373" y="636">Thar</text><text class="halo" x="105" y="590">Kharan</text><text class="halo" x="247" y="332">Upper plain</text><text class="halo" x="234" y="604">Lower plain</text><text class="halo" x="252" y="472">Indus</text><text class="halo" x="373" y="291">Jhelum</text><text class="halo" x="399" y="335">Chenab</text><text class="halo" x="426" y="389">Ravi</text><text class="halo" x="447" y="453">Sutlej</text><path class="badge" d="M307 284H319V296H307Z"/><path class="link" d="M307 290 238 254"/><text class="halo" x="141" y="242">Tarbela Dam</text><circle class="badge" cx="128" cy="725" r="4"/><path class="link" d="M128 729V763"/><text x="93" y="782">Gwadar</text><circle class="badge" cx="276" cy="742" r="4"/><path class="link" d="M273 745 253 772"/><text x="215" y="793">Karachi</text><text class="label" x="373" y="95">China</text><text class="label" x="30" y="192">Afghanistan</text><text class="label" x="24" y="548">Iran</text><text class="label" x="443" y="565">India</text><text class="label" x="269" y="818">Arabian Sea</text><path class="link" d="M44 124V85" marker-end="url(#arrow)"/><text class="label" x="34" y="148">N</text><rect class="panel" x="510" y="78" width="250" height="725" rx="8"/><text class="h" x="526" y="106">Key: physical zones</text><rect x="526" y="123" width="28" height="24" fill="url(#mountains)" class="zone"/><text class="label lk" x="564" y="140">1. Northern mountains</text><text x="526" y="166">Himalaya, Karakoram (K2),</text><text x="526" y="185">Hindu Kush</text><rect x="526" y="207" width="28" height="24" fill="url(#mountains)" class="zone"/><text class="label lk" x="564" y="224">2. Western mountains</text><text x="526" y="250">Sulaiman and Kirthar ranges</text><rect x="526" y="274" width="28" height="24" fill="url(#plateau)" class="zone"/><text class="label" x="564" y="291">3. Potohar Plateau</text><rect x="526" y="320" width="28" height="24" fill="url(#plateau)" class="zone"/><text class="label" x="564" y="337">4. Balochistan</text><text x="564" y="358">Plateau</text><rect x="526" y="380" width="28" height="24" fill="url(#plain)" class="zone"/><text class="label" x="564" y="397">5. Indus Plain</text><text x="526" y="423">Upper: Punjab, five rivers</text><text x="526" y="442">Lower: Sindh</text><rect x="526" y="466" width="28" height="24" fill="url(#desert)" class="zone"/><text class="label" x="564" y="483">Deserts: dotted areas</text><text x="526" y="509">Thal, Cholistan, Thar, Kharan</text><rect x="526" y="533" width="28" height="24" fill="url(#coast)" class="zone"/><text class="label" x="564" y="550">6. Coastal belt</text><text x="526" y="576">Makran coast and Indus Delta</text><path class="river" d="M526 606H553"/><text x="564" y="611">Indus River</text><path class="tributary" d="M526 638H553"/><text x="564" y="643">Tributary</text><path class="badge" d="M534 663H546V675H534Z"/><text x="564" y="675">Dam</text><circle class="badge" cx="540" cy="701" r="4"/><text x="564" y="707">Coastal town</text><path class="link" stroke-dasharray="5 4" d="M526 735H553"/><text x="564" y="740">Approximate zone edge</text><text class="muted" x="526" y="775">Zones are simplified.</text><text class="wm" x="768" y="860" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
