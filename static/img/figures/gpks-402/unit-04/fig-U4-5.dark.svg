<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of how a citizen seeks a remedy when a fundamental right is violated</title><desc id="d">Flowchart of how a citizen seeks a remedy when a fundamental right is violated: record what happened, complain to the office and a senior officer, then to an ombudsman, then file a writ petition in the High Court under Article 199, with the Supreme Court able to act directly on questions of public importance under Article 184(3) and to hear appeals under Article 185.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.link { fill: none; stroke: var(--ink); stroke-width: 2; }
.ink { font-size: 14px; fill: var(--ink); }
.muted { font-size: 14px; fill: var(--muted); }
.h { font-size: 20px; font-weight: 700; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="1300"/><text class="h" x="390" y="36" text-anchor="middle">When a fundamental right is violated</text><rect class="panel" x="40" y="65" width="460" height="88" rx="18"/><text class="ink" x="270.0" y="96.0" text-anchor="middle"><tspan x="270.0" dy="0">A person believes a fundamental right has been</tspan><tspan x="270.0" dy="18">violated by a government body</tspan><tspan x="270.0" dy="18">(the State, Article 7)</tspan></text><path class="link" d="M270 153 V180" marker-end="url(#arrow)"/><rect class="panel" x="40" y="180" width="460" height="70" rx="4"/><text class="ink" x="270.0" y="211.0" text-anchor="middle"><tspan x="270.0" dy="0">Write down what happened, when,</tspan><tspan x="270.0" dy="18">and which right (Articles 9-28)</tspan></text><path class="link" d="M270 250 V280" marker-end="url(#arrow)"/><rect class="panel" x="40" y="280" width="460" height="70" rx="4"/><text class="ink" x="270.0" y="311.0" text-anchor="middle"><tspan x="270.0" dy="0">Complain in writing to the office concerned,</tspan><tspan x="270.0" dy="18">then to a senior officer</tspan></text><path class="link" d="M270 350 V378" marker-end="url(#arrow)"/><polygon class="panel" points="270,378 420,426 270,474 120,426"/><text class="ink" x="270" y="431" text-anchor="middle"><tspan x="270" dy="0">Problem solved?</tspan></text><path class="link" d="M420 426 H560" marker-end="url(#arrow)"/><text class="ink" x="485" y="414" text-anchor="middle"><tspan x="485" dy="0">Yes</tspan></text><rect class="panel" x="560" y="397" width="190" height="58" rx="18"/><text class="ink" x="655.0" y="422.0" text-anchor="middle"><tspan x="655.0" dy="0">Keep a copy</tspan><tspan x="655.0" dy="18">of the reply</tspan></text><path class="link" d="M270 474 V520" marker-end="url(#arrow)"/><text class="ink" x="292" y="500" text-anchor="middle"><tspan x="292" dy="0">No</tspan></text><rect class="panel" x="40" y="520" width="460" height="70" rx="4"/><text class="ink" x="270.0" y="551.0" text-anchor="middle"><tspan x="270.0" dy="0">Complain to an ombudsman (Mohtasib)</tspan><tspan x="270.0" dy="18">for maladministration</tspan></text><path class="link" d="M270 590 V618" marker-end="url(#arrow)"/><polygon class="panel" points="270,618 420,666 270,714 120,666"/><text class="ink" x="270" y="671" text-anchor="middle"><tspan x="270" dy="0">Problem solved?</tspan></text><path class="link" d="M420 666 H535 V440 H560" marker-end="url(#arrow)"/><text class="ink" x="480" y="654" text-anchor="middle"><tspan x="480" dy="0">Yes</tspan></text><path class="link" d="M270 714 V760" marker-end="url(#arrow)"/><text class="ink" x="292" y="740" text-anchor="middle"><tspan x="292" dy="0">No</tspan></text><rect class="panel" x="40" y="760" width="460" height="58" rx="4"/><text class="ink" x="270.0" y="794.0" text-anchor="middle"><tspan x="270.0" dy="0">Consult a lawyer or legal aid service</tspan></text><path class="link" d="M270 818 V850" marker-end="url(#arrow)"/><polygon class="panel" points="270,850 490,930 270,1010 50,930"/><text class="ink" x="270" y="917" text-anchor="middle"><tspan x="270" dy="0">Is it a question of</tspan><tspan x="270" dy="18">public importance</tspan><tspan x="270" dy="18">affecting many people?</tspan></text><path class="link" d="M490 930 H560" marker-end="url(#arrow)"/><text class="ink" x="525" y="917" text-anchor="middle"><tspan x="525" dy="0">Yes</tspan></text><rect class="panel" x="560" y="884" width="190" height="92" rx="4"/><text class="ink" x="655.0" y="917.0" text-anchor="middle"><tspan x="655.0" dy="0">Supreme Court may</tspan><tspan x="655.0" dy="18">act directly</tspan><tspan x="655.0" dy="18">(Article 184(3))</tspan></text><path class="link" d="M270 1010 V1050" marker-end="url(#arrow)"/><text class="ink" x="292" y="1036" text-anchor="middle"><tspan x="292" dy="0">No</tspan></text><rect class="panel" x="40" y="1050" width="460" height="58" rx="4"/><text class="ink" x="270.0" y="1075.0" text-anchor="middle"><tspan x="270.0" dy="0">File a writ petition in the High Court</tspan><tspan x="270.0" dy="18">(Article 199)</tspan></text><path class="link" d="M270 1108 V1138" marker-end="url(#arrow)"/><rect class="panel" x="40" y="1138" width="460" height="70" rx="4"/><text class="ink" x="270.0" y="1169.0" text-anchor="middle"><tspan x="270.0" dy="0">Court orders the official to act,</tspan><tspan x="270.0" dy="18">or declares the action void (Article 8)</tspan></text><path class="link" d="M270 1208 V1238" marker-end="url(#arrow)"/><rect class="panel" x="40" y="1238" width="460" height="44" rx="18"/><text class="ink" x="270.0" y="1265.0" text-anchor="middle"><tspan x="270.0" dy="0">Appeal to the Supreme Court if needed (Article 185)</tspan></text><text class="wm" x="768" y="1290" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
