<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The Three Pillars of the Aligarh Movement</title><desc id="d">Diagram showing how the Aligarh Movement influenced education, socio-cultural revival, and political consciousness, leading to the Muslim intelligentsia.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.stroke{stroke:var(--ink);stroke-width:2;fill:none;}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;}.panel-center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5;}.panel-edu{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;}.panel-soc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;}.panel-pol{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;}.panel-out{fill:var(--panel);stroke:var(--line);stroke-width:2.5;}text{fill:var(--ink);font-size:13px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.sh{font-size:13px;font-weight:600;fill:var(--ink);}.muted{fill:var(--muted);font-size:12px;}.wm{fill:var(--wm);font-size:11px;}.arrow{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#ah);}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The Three Pillars of the Aligarh Movement</text><rect class="panel-center" x="270" y="60" width="240" height="70" rx="8"/><text class="h" x="390" y="90" text-anchor="middle">Aligarh Movement</text><text class="muted" x="390" y="112" text-anchor="middle">Sir Syed Ahmad Khan (1817–1898)</text><rect class="panel-edu" x="40" y="185" width="200" height="110" rx="6"/><text class="sh" x="140" y="212" text-anchor="middle">1. Modern Education</text><text x="55" y="238">• MAO College (1875)</text><text x="55" y="258">• Scientific Society</text><text class="muted" x="55" y="278">• Science and English</text><rect class="panel-soc" x="290" y="185" width="200" height="110" rx="6"/><text class="sh" x="390" y="212" text-anchor="middle">2. Social Reform</text><text x="305" y="238">• Tahzib-ul-Akhlaq</text><text x="305" y="258">• Rational inquiry</text><text class="muted" x="305" y="278">• Rejection of dogma</text><rect class="panel-pol" x="540" y="185" width="200" height="110" rx="6"/><text class="sh" x="640" y="212" text-anchor="middle">3. Political Realism</text><text x="555" y="238">• Hindi-Urdu crisis (1867)</text><text x="555" y="258">• Muslim representation</text><text class="muted" x="555" y="278">• Distinct identity</text><path class="arrow" d="M330,130 L160,185"/><path class="arrow" d="M390,130 L390,185"/><path class="arrow" d="M450,130 L620,185"/><rect class="panel-out" x="210" y="345" width="360" height="80" rx="8"/><text class="sh" x="390" y="372" text-anchor="middle">Emergence of Muslim Intelligentsia</text><text x="390" y="394" text-anchor="middle">Educated leaders, journalists, and legal scholars</text><text class="muted" x="390" y="412" text-anchor="middle">Foundation for All-India Muslim League (1906)</text><path class="arrow" d="M160,295 L290,345"/><path class="arrow" d="M390,295 L390,345"/><path class="arrow" d="M620,295 L490,345"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>