<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آزادی کا راستہ: اہم فیصلے 1940–1947</title><desc id="d">فلو چارٹ جو 1940 کی قراردادِ لاہور سے 1947 میں آزادی تک تحریکِ پاکستان کے اہم فیصلوں اور واقعات کی ترتیب دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;}.step-1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}.step-2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;}.step-3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;}.step-4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;}.step-5{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5;}text{fill:var(--ink);font-size:12px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.date{font-size:13px;font-weight:700;fill:var(--a1);}.name{font-size:13px;font-weight:600;fill:var(--ink);}.muted{fill:var(--muted);font-size:11px;}.wm{fill:var(--wm);font-size:11px;}.arrow{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#ah);}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">آزادی کا راستہ: اہم فیصلے 1940–1947</text><rect class="step-1" x="540" y="60" width="210" height="95" rx="6"/><text class="date" x="735" y="83" text-anchor="end">مارچ 1940</text><text class="name" x="735" y="103" text-anchor="end">قراردادِ لاہور</text><text x="735" y="124" text-anchor="end">آزاد اور خود مختار مسلم</text><text class="muted" x="735" y="145" text-anchor="end">ریاستوں کا مطالبہ</text><path class="arrow" d="M540,107 L495,107"/><rect class="step-2" x="285" y="60" width="210" height="95" rx="6"/><text class="date" x="480" y="83" text-anchor="end">مارچ 1942</text><text class="name" x="480" y="103" text-anchor="end">کرپس مشن</text><text x="480" y="124" text-anchor="end">برطانیہ نے صوبوں کا</text><text class="muted" x="480" y="145" text-anchor="end">عدم شمولیت کا حق تسلیم کیا</text><path class="arrow" d="M285,107 L240,107"/><rect class="step-3" x="30" y="60" width="210" height="95" rx="6"/><text class="date" x="225" y="83" text-anchor="end">موسمِ سرما 1945–1946</text><text class="name" x="225" y="103" text-anchor="end">عام انتخابات</text><text x="225" y="124" text-anchor="end">مرکزی مسلم نشستوں کا 100 فیصد</text><text class="muted" x="225" y="145" text-anchor="end">صوبائی مسلم نشستوں کا 87 فیصد</text><path class="arrow" d="M135,155 L135,210 L275,210"/><rect class="step-4" x="275" y="180" width="220" height="110" rx="6"/><text class="date" x="480" y="199" text-anchor="end">مئی–جون 1946</text><text class="name" x="480" y="219" text-anchor="end">کابینہ مشن منصوبہ</text><text x="480" y="241" text-anchor="end">تین درجوں والی گروہ بندی کی تجویز؛</text><text x="480" y="261" text-anchor="end">کانگریس کی شرائط کے نتیجے میں</text><text class="muted" x="480" y="281" text-anchor="end">لیگ کا یومِ راست اقدام</text><path class="arrow" d="M495,235 L590,235 L590,320"/><rect class="step-5" x="80" y="320" width="620" height="100" rx="8"/><text class="date" x="390" y="345" text-anchor="middle">جون–اگست 1947: تقسیم اور آزادی</text><text class="name" x="390" y="368" text-anchor="middle">منصوبۂ 3 جون اور قانونِ آزادیٔ ہند</text><text x="390" y="391" text-anchor="middle">برطانیہ نے اقتدار منتقل کیا؛ ریڈکلف کمیشن نے سرحدوں کی حد بندی کی</text><text class="h" x="390" y="414" text-anchor="middle">پاکستان کی خود مختار ریاست کا قیام: 14 اگست 1947</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
