<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جنوبی ایشیا میں مسلم اصلاح کے سنگِ میل (1703–1906)</title><desc id="d">جنوبی ایشیا میں مسلم اصلاح کے سنگِ میل کی ٹائم لائن، شاہ ولی اللہ سے لے کر 1875 میں الی گڑھ میں ایم اے او کالج کے قیام اور پھر 1906 میں آل انڈیا مسلم لیگ تک۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.stroke{stroke:var(--ink);stroke-width:2;fill:none;}.stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none;}.line-axis{stroke:var(--line);stroke-width:3;fill:none;}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;}text{fill:var(--ink);font-size:13px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.year{font-size:14px;font-weight:700;fill:var(--a1);}.muted{fill:var(--muted);font-size:12px;}.wm{fill:var(--wm);font-size:11px;}.node{fill:var(--bg);stroke:var(--line);stroke-width:3;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">جنوبی ایشیا میں مسلم اصلاح کے سنگِ میل (1703–1906)</text><line class="line-axis" x1="50" y1="230" x2="730" y2="230"/><rect class="panel-a" x="590" y="55" width="160" height="135" rx="6"/><text class="year" x="670" y="80" text-anchor="middle">1703–1762</text><text class="h" x="670" y="102" text-anchor="middle">شاہ ولی اللہ</text><text x="740" y="124" text-anchor="end">مذہبی احیا</text><text x="740" y="146" text-anchor="end">قرآن کا فارسی ترجمہ</text><text class="muted" x="740" y="168" text-anchor="end">مدرسۂ رحیمیہ</text><line class="stroke-a" x1="670" y1="190" x2="670" y2="230"/><circle class="node" cx="670" cy="230" r="7"/><rect class="panel-b" x="390" y="270" width="180" height="140" rx="6"/><text class="year" x="488" y="295" text-anchor="middle">1858–1864</text><text class="h" x="488" y="317" text-anchor="middle">جنگِ 1857 کے بعد کا تجزیہ</text><text x="560" y="340" text-anchor="end">اسبابِ بغاوتِ ہند (1859)</text><text x="560" y="362" text-anchor="end">سائنٹفک سوسائٹی (1864)</text><text class="muted" x="560" y="384" text-anchor="end">علم کا ترجمہ</text><line class="stroke" x1="488" y1="230" x2="488" y2="270"/><circle class="node" cx="488" cy="230" r="7"/><rect class="panel-c" x="210" y="55" width="165" height="135" rx="6"/><text class="year" x="293" y="80" text-anchor="middle">1875</text><text class="h" x="293" y="102" text-anchor="middle">ایم اے او کالج</text><text x="365" y="124" text-anchor="end">الی گڑھ میں قیام</text><text x="365" y="146" text-anchor="end">جدید تعلیم</text><text class="muted" x="365" y="168" text-anchor="end">تہذیب الاخلاق</text><line class="stroke" x1="293" y1="190" x2="293" y2="230"/><circle class="node" cx="293" cy="230" r="7"/><rect class="panel-d" x="30" y="270" width="160" height="140" rx="6"/><text class="year" x="110" y="295" text-anchor="middle">1906</text><text class="h" x="110" y="317" text-anchor="middle">مسلم لیگ</text><text x="180" y="340" text-anchor="end">ڈھاکہ میں قیام</text><text x="180" y="362" text-anchor="end">شملہ وفد</text><text class="muted" x="180" y="384" text-anchor="end">جداگانہ طریقہ انتخاب</text><line class="stroke" x1="110" y1="230" x2="110" y2="270"/><circle class="node" cx="110" cy="230" r="7"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
