<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Road to Independence: Key Decisions 1940–1947</title><desc id="d">Flowchart showing the progression of key decisions and events of the Pakistan Movement from the 1940 Lahore Resolution to independence in 1947.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;}.step-1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}.step-2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;}.step-3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;}.step-4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;}.step-5{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5;}text{fill:var(--ink);font-size:12px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.date{font-size:13px;font-weight:700;fill:var(--a1);}.name{font-size:13px;font-weight:600;fill:var(--ink);}.muted{fill:var(--muted);font-size:11px;}.wm{fill:var(--wm);font-size:11px;}.arrow{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#ah);}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Road to Independence: Key Decisions 1940–1947</text><rect class="step-1" x="30" y="60" width="210" height="95" rx="6"/><text class="date" x="45" y="85">March 1940</text><text class="name" x="45" y="105">Lahore Resolution</text><text x="45" y="125">Demand for independent</text><text class="muted" x="45" y="142">sovereign Muslim states</text><path class="arrow" d="M240,107 L285,107"/><rect class="step-2" x="285" y="60" width="210" height="95" rx="6"/><text class="date" x="300" y="85">March 1942</text><text class="name" x="300" y="105">Cripps Mission</text><text x="300" y="125">British recognize provincial</text><text class="muted" x="300" y="142">right of non-accession</text><path class="arrow" d="M495,107 L540,107"/><rect class="step-3" x="540" y="60" width="210" height="95" rx="6"/><text class="date" x="555" y="85">Winter 1945–1946</text><text class="name" x="555" y="105">General Elections</text><text x="555" y="125">100% Central Muslim seats</text><text class="muted" x="555" y="142">87% Provincial Muslim seats</text><path class="arrow" d="M645,155 L645,210 L505,210"/><rect class="step-4" x="285" y="180" width="220" height="110" rx="6"/><text class="date" x="300" y="205">May–June 1946</text><text class="name" x="300" y="225">Cabinet Mission Plan</text><text x="300" y="245">Three-tier group proposal;</text><text x="300" y="262">Congress conditions lead to</text><text class="muted" x="300" y="279">League Direct Action Day</text><path class="arrow" d="M285,235 L190,235 L190,320"/><rect class="step-5" x="80" y="320" width="620" height="100" rx="8"/><text class="date" x="390" y="348" text-anchor="middle">June–August 1947: Partition and Independence</text><text class="name" x="390" y="372" text-anchor="middle">3 June Plan &amp; Indian Independence Act</text><text x="390" y="393" text-anchor="middle">British transfer power; boundary demarcation by Radcliffe Commission</text><text class="h" x="390" y="412" text-anchor="middle">14 August 1947: Sovereign State of Pakistan Established</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>