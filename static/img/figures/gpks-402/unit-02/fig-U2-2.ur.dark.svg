<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تحریکِ الی گڑھ کے تین ستون</title><desc id="d">خاکہ جو دکھاتا ہے کہ تحریکِ الی گڑھ نے تعلیم، سماجی و ثقافتی احیا اور سیاسی شعور پر کیسے اثر ڈالا، جس کے نتیجے میں مسلم دانشور طبقہ ابھرا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.stroke{stroke:var(--ink);stroke-width:2;fill:none;}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;}.panel-center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5;}.panel-edu{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;}.panel-soc{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;}.panel-pol{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;}.panel-out{fill:var(--panel);stroke:var(--line);stroke-width:2.5;}text{fill:var(--ink);font-size:13px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.sh{font-size:13px;font-weight:600;fill:var(--ink);}.muted{fill:var(--muted);font-size:12px;}.wm{fill:var(--wm);font-size:11px;}.arrow{stroke:var(--line);stroke-width:2;fill:none;marker-end:url(#ah);}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">تحریکِ الی گڑھ کے تین ستون</text><rect class="panel-center" x="270" y="60" width="240" height="70" rx="8"/><text class="h" x="390" y="90" text-anchor="middle">تحریکِ الی گڑھ</text><text class="muted" x="390" y="112" text-anchor="middle">سر سید احمد خان (1817–1898)</text><rect class="panel-edu" x="540" y="185" width="200" height="110" rx="6"/><text class="sh" x="640" y="212" text-anchor="middle">پہلا ستون: جدید تعلیم</text><text x="725" y="236" text-anchor="end">ایم اے او کالج (1875)</text><text x="725" y="258" text-anchor="end">سائنٹفک سوسائٹی</text><text class="muted" x="725" y="280" text-anchor="end">سائنس اور انگریزی</text><rect class="panel-soc" x="290" y="185" width="200" height="110" rx="6"/><text class="sh" x="390" y="212" text-anchor="middle">دوسرا ستون: سماجی اصلاح</text><text x="475" y="236" text-anchor="end">تہذیب الاخلاق</text><text x="475" y="258" text-anchor="end">عقلی جستجو</text><text class="muted" x="475" y="280" text-anchor="end">جامد عقائد کا رد</text><rect class="panel-pol" x="40" y="185" width="200" height="110" rx="6"/><text class="sh" x="140" y="212" text-anchor="middle">تیسرا ستون: سیاسی حقیقت پسندی</text><text x="225" y="236" text-anchor="end">ہندی اردو تنازعہ (1867)</text><text x="225" y="258" text-anchor="end">مسلم نمائندگی</text><text class="muted" x="225" y="280" text-anchor="end">جداگانہ شناخت</text><path class="arrow" d="M450,130 L620,185"/><path class="arrow" d="M390,130 L390,185"/><path class="arrow" d="M330,130 L160,185"/><rect class="panel-out" x="210" y="345" width="360" height="80" rx="8"/><text class="sh" x="390" y="370" text-anchor="middle">مسلم دانشور طبقے کا ظہور</text><text x="390" y="393" text-anchor="middle">تعلیم یافتہ رہنما، صحافی اور قانون دان</text><text class="muted" x="390" y="415" text-anchor="middle">آل انڈیا مسلم لیگ (1906) کی بنیاد</text><path class="arrow" d="M620,295 L490,345"/><path class="arrow" d="M390,295 L390,345"/><path class="arrow" d="M160,295 L290,345"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
