<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Key Milestones of the Pakistan Movement</title><desc id="d">Comparison table outlining five landmark milestones of the Pakistan Movement from 1906 to 1947, detailing what happened and why each mattered.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.row-alt{fill:var(--a1-fill);}.row-even{fill:var(--panel);}.border{stroke:var(--ink);stroke-width:1;fill:none;}.th{fill:var(--ink);font-weight:700;font-size:13px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.year{font-size:13px;font-weight:700;fill:var(--a1);}.td{fill:var(--ink);font-size:12px;}.wm{fill:var(--wm);font-size:11px;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Key Milestones of the Pakistan Movement (1906–1947)</text><rect fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" x="25" y="48" width="730" height="32"/><text class="th" x="90" y="70" text-anchor="middle">Year / Milestone</text><text class="th" x="290" y="70" text-anchor="middle">What Happened</text><text class="th" x="575" y="70" text-anchor="middle">Significance for Pakistan</text><rect class="row-alt" x="25" y="80" width="730" height="65"/><rect class="border" x="25" y="80" width="730" height="65"/><text class="year" x="90" y="105" text-anchor="middle">1906</text><text class="td" x="90" y="125" text-anchor="middle" font-weight="600">Muslim League</text><text class="td" x="180" y="105">Founded at Dhaka following the Simla</text><text class="td" x="180" y="125">Deputation; demanded separate electorates</text><text class="td" x="430" y="105">First dedicated political platform to safeguard</text><text class="td" x="430" y="125">Muslim constitutional and political rights</text><rect class="row-even" x="25" y="145" width="730" height="65"/><rect class="border" x="25" y="145" width="730" height="65"/><text class="year" x="90" y="170" text-anchor="middle">1930</text><text class="td" x="90" y="190" text-anchor="middle" font-weight="600">Allahabad Address</text><text class="td" x="180" y="170">Allama Iqbal delivered presidential address</text><text class="td" x="180" y="190">proposing a consolidated northwestern state</text><text class="td" x="430" y="170">Provided the intellectual and philosophical</text><text class="td" x="430" y="190">foundation for a distinct Muslim nation-state</text><rect class="row-alt" x="25" y="210" width="730" height="65"/><rect class="border" x="25" y="210" width="730" height="65"/><text class="year" x="90" y="235" text-anchor="middle">1940</text><text class="td" x="90" y="255" text-anchor="middle" font-weight="600">Lahore Resolution</text><text class="td" x="180" y="235">Passed on 23 March at Minto Park, Lahore;</text><text class="td" x="180" y="255">presented by Bengal Premier A. K. Fazlul Huq</text><text class="td" x="430" y="235">Formally adopted independent Muslim homeland</text><text class="td" x="430" y="255">as the non-negotiable goal of the League</text><rect class="row-even" x="25" y="275" width="730" height="65"/><rect class="border" x="25" y="275" width="730" height="65"/><text class="year" x="90" y="300" text-anchor="middle">1945–1946</text><text class="td" x="90" y="320" text-anchor="middle" font-weight="600">General Elections</text><text class="td" x="180" y="300">Muslim League won 100% of Central seats</text><text class="td" x="180" y="320">and 87% of Provincial Muslim seats</text><text class="td" x="430" y="300">Delivered an undeniable democratic mandate</text><text class="td" x="430" y="320">proving the League represented Indian Muslims</text><rect class="row-alt" x="25" y="340" width="730" height="65"/><rect class="border" x="25" y="340" width="730" height="65"/><text class="year" x="90" y="365" text-anchor="middle">1947</text><text class="td" x="90" y="385" text-anchor="middle" font-weight="600">Independence</text><text class="td" x="180" y="365">3 June Plan accepted; Indian Independence</text><text class="td" x="180" y="385">Act passed; partition executed</text><text class="td" x="430" y="365">Establishment of Pakistan on 14 August 1947</text><text class="td" x="430" y="385">as a sovereign independent nation</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>