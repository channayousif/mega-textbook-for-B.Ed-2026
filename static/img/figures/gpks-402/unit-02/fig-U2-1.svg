<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Milestones of Muslim Reform in South Asia (1703–1906)</title><desc id="d">Timeline of South Asian Muslim reform milestones from Shah Waliullah through the founding of MAO College Aligarh in 1875 to the All-India Muslim League in 1906.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.stroke{stroke:var(--ink);stroke-width:2;fill:none;}.stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none;}.line-axis{stroke:var(--line);stroke-width:3;fill:none;}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5;}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;}text{fill:var(--ink);font-size:13px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.year{font-size:14px;font-weight:700;fill:var(--a1);}.muted{fill:var(--muted);font-size:12px;}.wm{fill:var(--wm);font-size:11px;}.node{fill:var(--bg);stroke:var(--line);stroke-width:3;}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Milestones of Muslim Reform in South Asia (1703–1906)</text><line class="line-axis" x1="50" y1="230" x2="730" y2="230"/><rect class="panel-a" x="30" y="55" width="160" height="135" rx="6"/><text class="year" x="110" y="80" text-anchor="middle">1703–1762</text><text class="h" x="110" y="102" text-anchor="middle">Shah Waliullah</text><text x="40" y="125">Religious revival</text><text x="40" y="145">Quran in Persian</text><text class="muted" x="40" y="165">Madrasah-i-Rahimiyah</text><line class="stroke-a" x1="110" y1="190" x2="110" y2="230"/><circle class="node" cx="110" cy="230" r="7"/><rect class="panel-b" x="210" y="270" width="180" height="140" rx="6"/><text class="year" x="292" y="295" text-anchor="middle">1858–1864</text><text class="h" x="292" y="317" text-anchor="middle">Post-1857 Analysis</text><text x="220" y="340">Causes of Revolt (1859)</text><text x="220" y="360">Scientific Society (1864)</text><text class="muted" x="220" y="380">Knowledge translation</text><line class="stroke" x1="292" y1="230" x2="292" y2="270"/><circle class="node" cx="292" cy="230" r="7"/><rect class="panel-c" x="405" y="55" width="165" height="135" rx="6"/><text class="year" x="487" y="80" text-anchor="middle">1875</text><text class="h" x="487" y="102" text-anchor="middle">MAO College</text><text x="415" y="125">Aligarh established</text><text x="415" y="145">Modern education</text><text class="muted" x="415" y="165">Tahzib-ul-Akhlaq</text><line class="stroke" x1="487" y1="190" x2="487" y2="230"/><circle class="node" cx="487" cy="230" r="7"/><rect class="panel-d" x="590" y="270" width="160" height="140" rx="6"/><text class="year" x="670" y="295" text-anchor="middle">1906</text><text class="h" x="670" y="317" text-anchor="middle">Muslim League</text><text x="600" y="340">Dhaka founding</text><text x="600" y="360">Simla Deputation</text><text class="muted" x="600" y="380">Separate electorates</text><line class="stroke" x1="670" y1="230" x2="670" y2="270"/><circle class="node" cx="670" cy="230" r="7"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>