<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تحریکِ پاکستان کے اہم سنگِ میل</title><desc id="d">موازنہ جاتی جدول جو 1906 سے 1947 تک تحریکِ پاکستان کے پانچ تاریخی سنگِ میل بیان کرتا ہے، اور بتاتا ہے کہ ہر ایک میں کیا ہوا اور وہ کیوں اہم تھا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg);}.ink{fill:var(--ink);}.row-alt{fill:var(--a1-fill);}.row-even{fill:var(--panel);}.border{stroke:var(--ink);stroke-width:1;fill:none;}.th{fill:var(--ink);font-weight:700;font-size:13px;}.h{font-size:15px;font-weight:700;fill:var(--ink);}.year{font-size:13px;font-weight:700;fill:var(--a1);}.td{fill:var(--ink);font-size:12px;}.wm{fill:var(--wm);font-size:11px;}</style><rect class="bg" x="0" y="0" width="820" height="470"/><text class="h" x="410" y="30" text-anchor="middle">تحریکِ پاکستان کے اہم سنگِ میل (1906–1947)</text><rect fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" x="25" y="48" width="770" height="32"/><text class="th" x="730" y="70" text-anchor="middle">سال / سنگِ میل</text><text class="th" x="530" y="70" text-anchor="middle">کیا ہوا</text><text class="th" x="210" y="70" text-anchor="middle">پاکستان کے لیے اہمیت</text><rect class="row-alt" x="25" y="80" width="770" height="65"/><rect class="border" x="25" y="80" width="770" height="65"/><text class="year" x="730" y="105" text-anchor="middle">1906</text><text class="td" x="730" y="125" text-anchor="middle" font-weight="600">مسلم لیگ</text><text class="td" x="640" y="105" text-anchor="end">شملہ وفد کے بعد ڈھاکہ میں قائم ہوئی؛</text><text class="td" x="640" y="125" text-anchor="end">جداگانہ طریقہ انتخاب کا مطالبہ کیا</text><text class="td" x="355" y="105" text-anchor="end">مسلمانوں کے آئینی اور سیاسی حقوق کے تحفظ کے</text><text class="td" x="355" y="125" text-anchor="end">لیے پہلا باقاعدہ سیاسی پلیٹ فارم</text><rect class="row-even" x="25" y="145" width="770" height="65"/><rect class="border" x="25" y="145" width="770" height="65"/><text class="year" x="730" y="170" text-anchor="middle">1930</text><text class="td" x="730" y="190" text-anchor="middle" font-weight="600">خطبۂ الہ آباد</text><text class="td" x="640" y="170" text-anchor="end">علامہ اقبال کا صدارتی خطبہ، جس میں شمال</text><text class="td" x="640" y="190" text-anchor="end">مغرب میں ایک متحد ریاست کی تجویز دی گئی</text><text class="td" x="355" y="170" text-anchor="end">ایک جداگانہ مسلم قومی ریاست کے لیے فکری</text><text class="td" x="355" y="190" text-anchor="end">اور فلسفیانہ بنیاد فراہم کی</text><rect class="row-alt" x="25" y="210" width="770" height="65"/><rect class="border" x="25" y="210" width="770" height="65"/><text class="year" x="730" y="235" text-anchor="middle">1940</text><text class="td" x="730" y="255" text-anchor="middle" font-weight="600">قراردادِ لاہور</text><text class="td" x="640" y="235" text-anchor="end">منٹو پارک لاہور میں 23 مارچ کو منظور ہوئی؛</text><text class="td" x="640" y="255" text-anchor="end">بنگال کے وزیرِ اعلیٰ اے کے فضل الحق نے پیش کی</text><text class="td" x="355" y="235" text-anchor="end">آزاد مسلم وطن کو باضابطہ طور پر لیگ کا</text><text class="td" x="355" y="255" text-anchor="end">ناقابلِ سودے بازی ہدف قرار دیا</text><rect class="row-even" x="25" y="275" width="770" height="65"/><rect class="border" x="25" y="275" width="770" height="65"/><text class="year" x="730" y="300" text-anchor="middle">1945–1946</text><text class="td" x="730" y="320" text-anchor="middle" font-weight="600">عام انتخابات</text><text class="td" x="640" y="300" text-anchor="end">مسلم لیگ نے مرکزی نشستوں کا 100 فیصد</text><text class="td" x="640" y="320" text-anchor="end">اور صوبائی مسلم نشستوں کا 87 فیصد جیتا</text><text class="td" x="355" y="300" text-anchor="end">ناقابلِ تردید جمہوری مینڈیٹ، جس نے ثابت کیا</text><text class="td" x="355" y="320" text-anchor="end">کہ لیگ ہندوستانی مسلمانوں کی نمائندہ ہے</text><rect class="row-alt" x="25" y="340" width="770" height="65"/><rect class="border" x="25" y="340" width="770" height="65"/><text class="year" x="730" y="365" text-anchor="middle">1947</text><text class="td" x="730" y="385" text-anchor="middle" font-weight="600">آزادی</text><text class="td" x="640" y="365" text-anchor="end">منصوبۂ 3 جون منظور ہوا؛ قانونِ آزادیٔ ہند</text><text class="td" x="640" y="385" text-anchor="end">منظور ہوا؛ تقسیم عمل میں آئی</text><text class="td" x="355" y="365" text-anchor="end">پاکستان کا قیام 14 اگست 1947 کو</text><text class="td" x="355" y="385" text-anchor="end">ایک خود مختار اور آزاد قوم کے طور پر</text><text class="wm" x="808" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
