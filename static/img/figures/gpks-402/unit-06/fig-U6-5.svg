<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Pathway from civic education to national integration</title>
  <desc id="d">Flowchart showing the progression from classroom civic education through school practice to social cohesion and national integration.</desc>
  <style>
    :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
    .bg      { fill: var(--bg); }
    .ink     { fill: var(--ink); }
    .panel   { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
    .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
    text     { font-size: 13px; fill: var(--ink); }
    .h       { font-size: 17px; font-weight: 700; fill: var(--ink); }
    .sh      { font-size: 14px; font-weight: 600; fill: var(--ink); }
    .body    { font-size: 12px; fill: var(--ink); }
    .wm      { fill: var(--wm); font-size: 11px; }
    .link    { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
    .ah      { fill: var(--ink); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,1 L9,5 L0,9 Z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="440"/>
  <text class="h" x="390" y="32" text-anchor="middle"><tspan x="390" dy="0">From Civic Education to National Integration</tspan></text>

  <!-- Flow Arrows -->
  <path class="link" d="M245 205 L280 205" marker-end="url(#arrow)"/>
  <path class="link" d="M500 205 L535 205" marker-end="url(#arrow)"/>

  <!-- Stage 1: Curriculum Foundations -->
  <rect class="panel" x="30" y="70" width="215" height="270" rx="8"/>
  <rect class="panel-a" x="30" y="70" width="215" height="38" rx="8"/>
  <text class="sh" x="137" y="95" text-anchor="middle"><tspan x="137" dy="0">1. Curriculum Foundations</tspan></text>
  <text class="body" x="45" y="130"><tspan x="45" dy="0">- Constitutional literacy</tspan><tspan x="55" dy="17">(Articles 8-28 rights & duties)</tspan></text>
  <text class="body" x="45" y="175"><tspan x="45" dy="0">- Valuing provincial, linguistic</tspan><tspan x="55" dy="17">and religious diversity</tspan></text>
  <text class="body" x="45" y="220"><tspan x="45" dy="0">- Evidence-based history</tspan><tspan x="55" dy="17">beyond rote memorisation</tspan></text>
  <text class="body" x="45" y="265"><tspan x="45" dy="0">- Shared environmental and</tspan><tspan x="55" dy="17">civic responsibility</tspan></text>

  <!-- Stage 2: Classroom & School Practice -->
  <rect class="panel" x="285" y="70" width="215" height="270" rx="8"/>
  <rect class="panel-a" x="285" y="70" width="215" height="38" rx="8"/>
  <text class="sh" x="392" y="95" text-anchor="middle"><tspan x="392" dy="0">2. School & Class Practice</tspan></text>
  <text class="body" x="300" y="130"><tspan x="300" dy="0">- Open, respectful dialogue</tspan><tspan x="310" dy="17">on contemporary issues</tspan></text>
  <text class="body" x="300" y="175"><tspan x="300" dy="0">- Equal dignity and care for</tspan><tspan x="310" dy="17">every student in the room</tspan></text>
  <text class="body" x="300" y="220"><tspan x="300" dy="0">- Collaborative inquiry and</tspan><tspan x="310" dy="17">group problem-solving</tspan></text>
  <text class="body" x="300" y="265"><tspan x="300" dy="0">- Student responsibility through</tspan><tspan x="310" dy="17">class councils & service</tspan></text>

  <!-- Stage 3: National Integration -->
  <rect class="panel" x="540" y="70" width="215" height="270" rx="8"/>
  <rect class="panel-b" x="540" y="70" width="215" height="38" rx="8"/>
  <text class="sh" x="647" y="95" text-anchor="middle"><tspan x="647" dy="0">3. National Integration</tspan></text>
  <text class="body" x="555" y="130"><tspan x="555" dy="0">- Mutual trust across</tspan><tspan x="565" dy="17">provinces and cultures</tspan></text>
  <text class="body" x="555" y="175"><tspan x="555" dy="0">- Cohesive sense of shared</tspan><tspan x="565" dy="17">democratic citizenship</tspan></text>
  <text class="body" x="555" y="220"><tspan x="555" dy="0">- Resilience against violent</tspan><tspan x="565" dy="17">extremism and prejudice</tspan></text>
  <text class="body" x="555" y="265"><tspan x="555" dy="0">- Constructive civic agency</tspan><tspan x="565" dy="17">for community welfare</tspan></text>

  <!-- Bottom banner -->
  <rect class="panel" x="30" y="360" width="725" height="42" rx="6"/>
  <text class="body" x="392" y="386" text-anchor="middle"><tspan x="392" dy="0">Education builds cohesion when democratic principles are experienced daily in the classroom.</tspan></text>

  <!-- Wordmark -->
  <text class="wm" x="768" y="425" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>