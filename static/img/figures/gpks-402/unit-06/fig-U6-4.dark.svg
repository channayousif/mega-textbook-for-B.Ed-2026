<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Contemporary national issues in Pakistan</title>
  <desc id="d">Table summarizing four contemporary national issues in Pakistan with their indicators, affected areas, and policy responses.</desc>
  <style>
    :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
    .bg      { fill: var(--bg); }
    .ink     { fill: var(--ink); }
    .panel   { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
    .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.5; }
    text     { font-size: 13px; fill: var(--ink); }
    .h       { font-size: 16px; font-weight: 700; fill: var(--ink); }
    .sh      { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .body    { font-size: 12px; fill: var(--ink); }
    .wm      { fill: var(--wm); font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="440"/>
  <text class="h" x="390" y="32" text-anchor="middle"><tspan x="390" dy="0">Profile of Contemporary National Challenges</tspan></text>

  <!-- Table Header -->
  <rect class="panel-a" x="30" y="52" width="720" height="38" rx="6"/>
  <text class="sh" x="42" y="76"><tspan x="42" dy="0">National Issue</tspan></text>
  <text class="sh" x="175" y="76"><tspan x="175" dy="0">Scale and Indicator</tspan></text>
  <text class="sh" x="345" y="76"><tspan x="345" dy="0">Most Affected Areas</tspan></text>
  <text class="sh" x="525" y="76"><tspan x="525" dy="0">Primary Policy Response</tspan></text>

  <!-- Row 1: Population Growth -->
  <rect class="panel" x="30" y="94" width="720" height="68" rx="4"/>
  <text class="sh" x="42" y="122"><tspan x="42" dy="0">Population</tspan><tspan x="42" dy="16" class="body">Growth</tspan></text>
  <text class="body" x="175" y="114"><tspan x="175" dy="0">241.5M (2023 Census);</tspan><tspan x="175" dy="17">2.55% annual growth</tspan><tspan x="175" dy="17">rate</tspan></text>
  <text class="body" x="345" y="114"><tspan x="345" dy="0">Rural interior Sindh,</tspan><tspan x="345" dy="17">Balochistan, peri-urban</tspan><tspan x="345" dy="17">hubs</tspan></text>
  <text class="body" x="525" y="114"><tspan x="525" dy="0">Family planning, female</tspan><tspan x="525" dy="17">education, Lady Health</tspan><tspan x="525" dy="17">Workers network</tspan></text>

  <!-- Row 2: Poverty & Unemployment -->
  <rect class="panel" x="30" y="166" width="720" height="68" rx="4"/>
  <text class="sh" x="42" y="194"><tspan x="42" dy="0">Poverty and</tspan><tspan x="42" dy="16" class="body">Unemployment</tspan></text>
  <text class="body" x="175" y="186"><tspan x="175" dy="0">~40% poverty</tspan><tspan x="175" dy="17">headcount; 2-3M youth</tspan><tspan x="175" dy="17">enter labour annually</tspan></text>
  <text class="body" x="345" y="186"><tspan x="345" dy="0">Southern Punjab,</tspan><tspan x="345" dy="17">interior Sindh, newly</tspan><tspan x="345" dy="17">merged KP districts</tspan></text>
  <text class="body" x="525" y="186"><tspan x="525" dy="0">BISP targeted income support,</tspan><tspan x="525" dy="17">NAVTTC skills training, SME</tspan><tspan x="525" dy="17">loans</tspan></text>

  <!-- Row 3: Terrorism & Extremism -->
  <rect class="panel" x="30" y="238" width="720" height="68" rx="4"/>
  <text class="sh" x="42" y="266"><tspan x="42" dy="0">Terrorism and</tspan><tspan x="42" dy="16" class="body">Extremism</tspan></text>
  <text class="body" x="175" y="258"><tspan x="175" dy="0">Over 70,000 lives</tspan><tspan x="175" dy="17">lost; severe economic</tspan><tspan x="175" dy="17">disruptions</tspan></text>
  <text class="body" x="345" y="258"><tspan x="345" dy="0">Border belt of KP and</tspan><tspan x="345" dy="17">Balochistan, major</tspan><tspan x="345" dy="17">urban centres</tspan></text>
  <text class="body" x="525" y="264"><tspan x="525" dy="0">National Action Plan (NAP),</tspan><tspan x="525" dy="17">Paigham-e-Pakistan consensus</tspan></text>

  <!-- Row 4: Environment & Climate -->
  <rect class="panel" x="30" y="310" width="720" height="74" rx="4"/>
  <text class="sh" x="42" y="338"><tspan x="42" dy="0">Environmental</tspan><tspan x="42" dy="16" class="body">Degradation</tspan></text>
  <text class="body" x="175" y="330"><tspan x="175" dy="0">Top-10 climate risk</tspan><tspan x="175" dy="17">index; water stress</tspan><tspan x="175" dy="17">(under 1,000 m3)</tspan></text>
  <text class="body" x="345" y="330"><tspan x="345" dy="0">Indus delta,</tspan><tspan x="345" dy="17">drought-prone</tspan><tspan x="345" dy="17">Balochistan, vulnerable</tspan><tspan x="345" dy="17">plains</tspan></text>
  <text class="body" x="525" y="330"><tspan x="525" dy="0">Updated Climate Change Policy</tspan><tspan x="525" dy="17">2021, afforestation, Living</tspan><tspan x="525" dy="17">Indus initiative</tspan></text>

  <!-- Wordmark -->
  <text class="wm" x="768" y="425" text-anchor="end" aria-hidden="true">textbook.com.pk</text>
</svg>