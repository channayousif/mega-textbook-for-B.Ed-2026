<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 728" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دیہی، شہری اور قبائلی جہتوں کا تقابلی جائزہ لینے والے سوالات</title><desc id="d">دیہی اور شہری آبادی کے سوالات کا خاندان، روزگار، تعلیمی رسائی اور روایات کے لحاظ سے باہم جڑے قبائلی تعلقات کے ساتھ تقابل کیا گیا ہے، بغیر کسی شخص پر مستقل خصوصیات تھوپے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="728"/><text class="h" x="756" y="34" text-anchor="end">جہتوں کا تقابل کریں، لوگوں کی طے شدہ اقسام کا نہیں</text><text class="body" x="756" y="62" text-anchor="end">دیہی اور شہری آبادی کی ترتیبات کو بیان کرتے ہیں۔</text><text class="body" x="756" y="86" text-anchor="end">قبائلی رشتے داری ایک باہم جڑی معاشرتی جہت ہے۔</text><rect class="accent" x="630" y="108" width="126" height="56" rx="0"/><text class="body" x="746" y="142" text-anchor="end">پہلو</text><rect class="accent" x="428" y="108" width="202" height="56" rx="0"/><text class="body" x="620" y="142" text-anchor="end">دیہی</text><rect class="accent" x="226" y="108" width="202" height="56" rx="0"/><text class="body" x="418" y="142" text-anchor="end">شہری</text><rect class="accent" x="24" y="108" width="202" height="56" rx="0"/><text class="body" x="216" y="142" text-anchor="end">قبائلی روابط</text><rect class="panel" x="630" y="164" width="126" height="116" rx="0"/><text class="body" x="746" y="195" text-anchor="end">خاندان</text><rect class="panel" x="428" y="164" width="202" height="116" rx="0"/><text class="body" x="620" y="195" text-anchor="end">رشتہ دار اور پڑوسی</text><text class="body" x="620" y="219" text-anchor="end">مل کر دیکھ بھال</text><text class="body" x="620" y="243" text-anchor="end">کر سکتے ہیں۔</text><rect class="panel" x="226" y="164" width="202" height="116" rx="0"/><text class="body" x="418" y="195" text-anchor="end">خاندانی مدد قریب اور</text><text class="body" x="418" y="219" text-anchor="end">دور کے گھرانوں کو</text><text class="body" x="418" y="243" text-anchor="end">جوڑ سکتی ہے۔</text><rect class="panel" x="24" y="164" width="202" height="116" rx="0"/><text class="body" x="216" y="195" text-anchor="end">رشتے داری کی مدد</text><text class="body" x="216" y="219" text-anchor="end">شہر اور گاؤں کی حدود</text><text class="body" x="216" y="243" text-anchor="end">سے پار ہو سکتی ہے۔</text><rect class="panel" x="630" y="280" width="126" height="116" rx="0"/><text class="body" x="746" y="311" text-anchor="end">روزگار</text><rect class="panel" x="428" y="280" width="202" height="116" rx="0"/><text class="body" x="620" y="311" text-anchor="end">کاشت کاری اور غیر</text><text class="body" x="620" y="335" text-anchor="end">زرعی کام باہم</text><text class="body" x="620" y="359" text-anchor="end">جڑ سکتے ہیں۔</text><rect class="panel" x="226" y="280" width="202" height="116" rx="0"/><text class="body" x="418" y="311" text-anchor="end">صنعت، خدمات اور</text><text class="body" x="418" y="335" text-anchor="end">دیگر کام باہم</text><text class="body" x="418" y="359" text-anchor="end">جڑ سکتے ہیں۔</text><rect class="panel" x="24" y="280" width="202" height="116" rx="0"/><text class="body" x="216" y="311" text-anchor="end">برادری کے نیٹ ورک</text><text class="body" x="216" y="335" text-anchor="end">متنوع پیشوں سے</text><text class="body" x="216" y="359" text-anchor="end">جوڑ سکتے ہیں۔</text><rect class="panel" x="630" y="396" width="126" height="116" rx="0"/><text class="body" x="746" y="427" text-anchor="end">تعلیمی</text><text class="body" x="746" y="451" text-anchor="end">رسائی</text><rect class="panel" x="428" y="396" width="202" height="116" rx="0"/><text class="body" x="620" y="427" text-anchor="end">فاصلہ، سواری اور</text><text class="body" x="620" y="451" text-anchor="end">دستیاب سہولیات</text><text class="body" x="620" y="475" text-anchor="end">دیکھیں۔</text><rect class="panel" x="226" y="396" width="202" height="116" rx="0"/><text class="body" x="418" y="427" text-anchor="end">راستے کا تحفظ، اخراجات</text><text class="body" x="418" y="451" text-anchor="end">اور اسکولوں کا ہجوم</text><text class="body" x="418" y="475" text-anchor="end">دیکھیں۔</text><rect class="panel" x="24" y="396" width="202" height="116" rx="0"/><text class="body" x="216" y="427" text-anchor="end">سپورٹ نیٹ ورک، جغرافیہ</text><text class="body" x="216" y="451" text-anchor="end">اور اختیارات کا فرق</text><text class="body" x="216" y="475" text-anchor="end">دیکھیں۔</text><rect class="panel" x="630" y="512" width="126" height="116" rx="0"/><text class="body" x="746" y="543" text-anchor="end">روایات</text><rect class="panel" x="428" y="512" width="202" height="116" rx="0"/><text class="body" x="620" y="543" text-anchor="end">مقامی سطح پر مشترک</text><text class="body" x="620" y="567" text-anchor="end">طور طریقے اور مباحث</text><text class="body" x="620" y="591" text-anchor="end">معلوم کریں۔</text><rect class="panel" x="226" y="512" width="202" height="116" rx="0"/><text class="body" x="418" y="543" text-anchor="end">معلوم کریں کہ مختلف</text><text class="body" x="418" y="567" text-anchor="end">گروہ کیسے طریقے</text><text class="body" x="418" y="591" text-anchor="end">اپناتے اور بدلتے ہیں۔</text><rect class="panel" x="24" y="512" width="202" height="116" rx="0"/><text class="body" x="216" y="543" text-anchor="end">معلوم کریں کہ موروثی</text><text class="body" x="216" y="567" text-anchor="end">وابستگیاں کیسے برقرار ہیں</text><text class="body" x="216" y="591" text-anchor="end">اور نئی شکل لیتی ہیں۔</text><text class="body" x="756" y="663" text-anchor="end">یہ وضاحتی سوالات ہیں، کوئی عالمگیر یا حتمی خصوصیات نہیں۔</text><text class="body" x="756" y="687" text-anchor="end">تمام جہتوں میں اندرونی تنوع پایا جاتا ہے اور وقت کے ساتھ تبدیلی ممکن ہے۔</text><text aria-hidden="true" class="wm" x="24" y="716" text-anchor="start">textbook.com.pk</text></svg>
