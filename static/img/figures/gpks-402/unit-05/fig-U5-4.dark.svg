<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 728" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Questions comparing rural urban and tribal dimensions</title><desc id="d">Rural and urban settlement questions are compared with overlapping tribal relationships across family livelihood education access and traditions, without assigning fixed traits to people.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="728"/><text class="h" x="24" y="34" text-anchor="start">Compare dimensions, not fixed types of people</text><text class="body" x="24" y="62" text-anchor="start">Rural and urban describe settlement settings.</text><text class="body" x="24" y="86" text-anchor="start">Tribal describes an overlapping kinship dimension.</text><rect class="accent" x="24" y="108" width="126" height="56" rx="0"/><text class="body" x="34" y="141" text-anchor="start">Question</text><rect class="accent" x="150" y="108" width="202" height="56" rx="0"/><text class="body" x="160" y="141" text-anchor="start">Rural</text><rect class="accent" x="352" y="108" width="202" height="56" rx="0"/><text class="body" x="362" y="141" text-anchor="start">Urban</text><rect class="accent" x="554" y="108" width="202" height="56" rx="0"/><text class="body" x="564" y="141" text-anchor="start">Tribal ties</text><rect class="panel" x="24" y="164" width="126" height="116" rx="0"/><text class="body" x="34" y="195" text-anchor="start">Family</text><rect class="panel" x="150" y="164" width="202" height="116" rx="0"/><text class="body" x="160" y="195" text-anchor="start">Relatives and</text><text class="body" x="160" y="219" text-anchor="start">neighbours may</text><text class="body" x="160" y="243" text-anchor="start">share care.</text><rect class="panel" x="352" y="164" width="202" height="116" rx="0"/><text class="body" x="362" y="195" text-anchor="start">Family support may</text><text class="body" x="362" y="219" text-anchor="start">connect nearby and</text><text class="body" x="362" y="243" text-anchor="start">distant households.</text><rect class="panel" x="554" y="164" width="202" height="116" rx="0"/><text class="body" x="564" y="195" text-anchor="start">Kinship support</text><text class="body" x="564" y="219" text-anchor="start">may cross city and</text><text class="body" x="564" y="243" text-anchor="start">village settings.</text><rect class="panel" x="24" y="280" width="126" height="116" rx="0"/><text class="body" x="34" y="311" text-anchor="start">Livelihood</text><rect class="panel" x="150" y="280" width="202" height="116" rx="0"/><text class="body" x="160" y="311" text-anchor="start">Farming and</text><text class="body" x="160" y="335" text-anchor="start">non-farm work</text><text class="body" x="160" y="359" text-anchor="start">can connect.</text><rect class="panel" x="352" y="280" width="202" height="116" rx="0"/><text class="body" x="362" y="311" text-anchor="start">Industry, services</text><text class="body" x="362" y="335" text-anchor="start">and other work</text><text class="body" x="362" y="359" text-anchor="start">can connect.</text><rect class="panel" x="554" y="280" width="202" height="116" rx="0"/><text class="body" x="564" y="311" text-anchor="start">Networks may link</text><text class="body" x="564" y="335" text-anchor="start">people to varied</text><text class="body" x="564" y="359" text-anchor="start">occupations.</text><rect class="panel" x="24" y="396" width="126" height="116" rx="0"/><text class="body" x="34" y="427" text-anchor="start">Education</text><text class="body" x="34" y="451" text-anchor="start">access</text><rect class="panel" x="150" y="396" width="202" height="116" rx="0"/><text class="body" x="160" y="427" text-anchor="start">Check distance,</text><text class="body" x="160" y="451" text-anchor="start">transport and</text><text class="body" x="160" y="475" text-anchor="start">available facilities.</text><rect class="panel" x="352" y="396" width="202" height="116" rx="0"/><text class="body" x="362" y="427" text-anchor="start">Check route safety,</text><text class="body" x="362" y="451" text-anchor="start">costs and</text><text class="body" x="362" y="475" text-anchor="start">school crowding.</text><rect class="panel" x="554" y="396" width="202" height="116" rx="0"/><text class="body" x="564" y="427" text-anchor="start">Check networks,</text><text class="body" x="564" y="451" text-anchor="start">geography and</text><text class="body" x="564" y="475" text-anchor="start">unequal authority.</text><rect class="panel" x="24" y="512" width="126" height="116" rx="0"/><text class="body" x="34" y="543" text-anchor="start">Traditions</text><rect class="panel" x="150" y="512" width="202" height="116" rx="0"/><text class="body" x="160" y="543" text-anchor="start">Ask what is shared,</text><text class="body" x="160" y="567" text-anchor="start">adapted or debated</text><text class="body" x="160" y="591" text-anchor="start">within a locality.</text><rect class="panel" x="352" y="512" width="202" height="116" rx="0"/><text class="body" x="362" y="543" text-anchor="start">Ask how practices</text><text class="body" x="362" y="567" text-anchor="start">are exchanged</text><text class="body" x="362" y="591" text-anchor="start">and adapted.</text><rect class="panel" x="554" y="512" width="202" height="116" rx="0"/><text class="body" x="564" y="543" text-anchor="start">Ask how affiliations</text><text class="body" x="564" y="567" text-anchor="start">are maintained</text><text class="body" x="564" y="591" text-anchor="start">and reinterpreted.</text><text class="body" x="24" y="663" text-anchor="start">Illustrative questions, not universal traits.</text><text class="body" x="24" y="687" text-anchor="start">All dimensions contain internal variation and can change over time.</text><text aria-hidden="true" class="wm" x="764" y="716" text-anchor="end">textbook.com.pk</text></svg>
