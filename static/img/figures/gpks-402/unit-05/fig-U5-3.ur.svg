<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ثقافتی تنوع اور پاکستان میں مشترکہ وابستگی</title><desc id="d">ثقافتی وابستگی زبانوں، روایات، فنون اور کھانوں کو صوبوں اور خطوں کے درمیان باہم جوڑتی ہے، جس میں باہم جڑی مثالیں شامل ہیں جو ہر رہائشی کے لیے ایک واحد ثقافت مخصوص نہیں کرتیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="730"/><text class="h" x="756" y="34" text-anchor="end">ثقافتی تنوع: تعلق کی باہم مربوط صورتیں</text><line class="link" x1="390" y1="150" x2="390" y2="204" marker-end="url(#arrow)"/><line class="link" x1="254" y1="250" x2="224" y2="250" marker-end="url(#arrow)"/><line class="link" x1="526" y1="250" x2="556" y2="250" marker-end="url(#arrow)"/><line class="link" x1="390" y1="296" x2="390" y2="350" marker-end="url(#arrow)"/><rect class="accent" x="240" y="70" width="300" height="80" rx="8"/><text class="body" x="390" y="104" text-anchor="middle">زبانیں</text><text class="body" x="390" y="130" text-anchor="middle">گھریلو اور مشترکہ زبانیں</text><rect class="accent" x="254" y="204" width="272" height="92" rx="8"/><text class="h" x="390" y="242" text-anchor="middle">پاکستان میں</text><text class="h" x="390" y="270" text-anchor="middle">مشترکہ وابستگی</text><rect class="panel" x="24" y="200" width="200" height="104" rx="8"/><text class="body" x="124" y="234" text-anchor="middle">فنون</text><text class="body" x="124" y="260" text-anchor="middle">نمونے، کہانیاں اور</text><text class="body" x="124" y="286" text-anchor="middle">دستکاری کی معلومات</text><rect class="panel" x="556" y="200" width="200" height="104" rx="8"/><text class="body" x="656" y="234" text-anchor="middle">روایات</text><text class="body" x="656" y="260" text-anchor="middle">منتقل ہونے والے اور</text><text class="body" x="656" y="286" text-anchor="middle">اپنائے گئے طریقے</text><rect class="panel" x="240" y="350" width="300" height="80" rx="8"/><text class="body" x="390" y="384" text-anchor="middle">کھانے اور پکوان</text><text class="body" x="390" y="410" text-anchor="middle">اجزاء، مہارتیں اور معانی</text><rect class="panel" x="24" y="464" width="732" height="190" rx="8"/><text class="h" x="736" y="493" text-anchor="end">خطوں سے وابستہ چند لسانی مثالیں</text><text class="body" x="736" y="525" text-anchor="end">سندھ: سندھی، اردو؛ پنجاب: پنجابی، سرائیکی</text><text class="body" x="736" y="549" text-anchor="end">خیبر پختونخوا: پشتو، ہندکو</text><text class="body" x="736" y="573" text-anchor="end">بلوچستان: بلوچی، براہوی؛ گلگت بلتستان: شینا، بلتی</text><text class="body" x="736" y="597" text-anchor="end">مثالیں باہم جڑی ہیں اور علاقائی حدود سے پار جاتی ہیں۔</text><text class="body" x="736" y="621" text-anchor="end">کوئی بھی بچہ پوری برادری کی نمائندگی نہیں کرتا۔</text><text class="body" x="756" y="685" text-anchor="end">برابر کا احترام اور باہمی تعاون لوگوں کو اختلافات کے باوجود جوڑتے ہیں۔</text><text aria-hidden="true" class="wm" x="24" y="718" text-anchor="start">textbook.com.pk</text></svg>
