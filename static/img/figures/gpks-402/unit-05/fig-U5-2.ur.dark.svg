<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 582" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم اور معاشی ترقی کو جوڑنے والا مشروط چکر</title><desc id="d">تعلیم ایسی مہارتیں پیدا کر سکتی ہے جو پیداواری کام، آمدنی اور دوبارہ سرمایہ کاری میں مدد دیں، جبکہ رسائی، ملازمتیں، بنیادی ڈھانچہ اور عوامی فیصلے اس چکر کے ہر ربط کو مشروط بناتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="582"/><text class="h" x="756" y="34" text-anchor="end">تعلیم اور ترقی: ایک مشروط چکر</text><line class="link" x1="450" y1="130" x2="330" y2="130" marker-end="url(#arrow)"/><line class="link" x1="184" y1="180" x2="184" y2="358" marker-end="url(#arrow)"/><line class="link" x1="330" y1="408" x2="450" y2="408" marker-end="url(#arrow)"/><line class="link" x1="596" y1="358" x2="596" y2="180" marker-end="url(#arrow)"/><rect class="accent" x="450" y="80" width="296" height="100" rx="8"/><text class="h" x="598" y="118" text-anchor="middle">قابلِ رسائی اور</text><text class="h" x="598" y="146" text-anchor="middle">مؤثر تعلیم</text><rect class="accent" x="34" y="80" width="296" height="100" rx="8"/><text class="h" x="182" y="118" text-anchor="middle">کارآمد مہارتیں اور</text><text class="h" x="182" y="146" text-anchor="middle">پیداواری کام</text><rect class="accent" x="34" y="358" width="296" height="100" rx="8"/><text class="h" x="182" y="396" text-anchor="middle">آمدنی اور</text><text class="h" x="182" y="424" text-anchor="middle">عوامی وسائل</text><rect class="accent" x="450" y="358" width="296" height="100" rx="8"/><text class="h" x="598" y="396" text-anchor="middle">تعلیم میں دوبارہ</text><text class="h" x="598" y="424" text-anchor="middle">سرمایہ کاری</text><rect class="panel" x="234" y="210" width="312" height="116" rx="8"/><text class="body" x="390" y="238" text-anchor="middle">روابط شرائط کے محتاج ہیں:</text><text class="body" x="390" y="262" text-anchor="middle">محفوظ رسائی؛ مناسب روزگار؛</text><text class="body" x="390" y="286" text-anchor="middle">قابلِ اعتماد بنیادی ڈھانچہ؛</text><text class="body" x="390" y="310" text-anchor="middle">منصفانہ عوامی فیصلے</text><text class="body" x="390" y="506" text-anchor="middle">کوئی بھی ربط ٹوٹ سکتا ہے۔ فوائد کی پہلے سے ضمانت نہیں۔</text><text class="small" x="390" y="534" text-anchor="middle">ہر ربط معاون حالات اور شرائط پر منحصر ہوتا ہے۔</text><text aria-hidden="true" class="wm" x="24" y="570" text-anchor="start">textbook.com.pk</text></svg>
