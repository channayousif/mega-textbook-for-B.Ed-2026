<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 594" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کی معیشت کے تین باہم مربوط شعبے</title><desc id="d">زراعت، صنعت اور خدمات مالی سال 2024-25 کے عبوری شعبہ جاتی جی ڈی پی جدول میں بالترتیب 23.54، 18.07 اور 58.39 فیصد حصہ رکھتے ہیں، ساتھ ہی ہر شعبے کی مثالیں اور چیلنجز بھی دیے گئے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="594"/><text class="h" x="756" y="34" text-anchor="end">تین باہم مربوط معاشی شعبے</text><text class="small" x="756" y="60" text-anchor="end">مالی سال 2024-25 کے عبوری جی ڈی پی حصص؛ مستقل قیمتیں مالی سال 2015-16</text><rect class="accent" x="600" y="84" width="156" height="60" rx="0"/><text class="body" x="744" y="112" text-anchor="end">شعبہ</text><rect class="accent" x="480" y="84" width="120" height="60" rx="0"/><text class="body" x="588" y="112" text-anchor="end">جی ڈی پی حصہ</text><rect class="accent" x="280" y="84" width="200" height="60" rx="0"/><text class="body" x="468" y="112" text-anchor="end">سرگرمیاں</text><rect class="accent" x="24" y="84" width="256" height="60" rx="0"/><text class="body" x="268" y="112" text-anchor="end">ممکنہ چیلنجز</text><rect class="panel" x="600" y="144" width="156" height="108" rx="0"/><rect class="panel" x="480" y="144" width="120" height="108" rx="0"/><rect class="panel" x="280" y="144" width="200" height="108" rx="0"/><rect class="panel" x="24" y="144" width="256" height="108" rx="0"/><text class="body" x="744" y="184" text-anchor="end">زراعت</text><text class="body" x="588" y="184" text-anchor="end">23.54%</text><text class="body" x="468" y="184" text-anchor="end">فصلیں، دودھ، مچھلی</text><text class="body" x="468" y="210" text-anchor="end">اور جنگلات</text><text class="body" x="268" y="184" text-anchor="end">پانی کا تعطل یا</text><text class="body" x="268" y="210" text-anchor="end">فصلوں کا نقصان</text><rect class="panel" x="600" y="252" width="156" height="108" rx="0"/><rect class="panel" x="480" y="252" width="120" height="108" rx="0"/><rect class="panel" x="280" y="252" width="200" height="108" rx="0"/><rect class="panel" x="24" y="252" width="256" height="108" rx="0"/><text class="body" x="744" y="292" text-anchor="end">صنعت</text><text class="body" x="588" y="292" text-anchor="end">18.07%</text><text class="body" x="468" y="292" text-anchor="end">کپڑا سازی، کان کنی</text><text class="body" x="468" y="318" text-anchor="end">اور تعمیرات</text><text class="body" x="268" y="292" text-anchor="end">بجلی کا تعطل یا</text><text class="body" x="268" y="318" text-anchor="end">مہنگی مشینری</text><rect class="panel" x="600" y="360" width="156" height="108" rx="0"/><rect class="panel" x="480" y="360" width="120" height="108" rx="0"/><rect class="panel" x="280" y="360" width="200" height="108" rx="0"/><rect class="panel" x="24" y="360" width="256" height="108" rx="0"/><text class="body" x="744" y="400" text-anchor="end">خدمات</text><text class="body" x="588" y="400" text-anchor="end">58.39%</text><text class="body" x="468" y="400" text-anchor="end">نقل و حمل، دکانیں،</text><text class="body" x="468" y="426" text-anchor="end">تعلیم اور صحت</text><text class="body" x="268" y="400" text-anchor="end">سڑکوں کی خرابی یا</text><text class="body" x="268" y="426" text-anchor="end">مہارتوں تک کم رسائی</text><text class="body" x="756" y="500" text-anchor="end">پیداوار میں حصہ ملازمتوں یا گھرانوں کا حصہ نہیں ہوتا۔</text><text class="small" x="756" y="530" text-anchor="end">ماخذ: وزارتِ خزانہ، پاکستان معاشی سروے 2024-25،</text><text class="small" x="756" y="554" text-anchor="end">باب 1، جدول 1.2۔ بعد کے تخمینوں میں ان حصص پر نظر ثانی ہو سکتی ہے۔</text><text aria-hidden="true" class="wm" x="24" y="582" text-anchor="start">textbook.com.pk</text></svg>
