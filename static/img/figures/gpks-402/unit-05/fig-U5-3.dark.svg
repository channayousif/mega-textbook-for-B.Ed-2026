<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 730" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Cultural diversity and shared belonging in Pakistan</title><desc id="d">Cultural belonging connects languages traditions arts and cuisine across provinces and regions, with overlapping examples that do not assign one culture to every resident.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="730"/><text class="h" x="24" y="34" text-anchor="start">Cultural diversity: connected forms of belonging</text><line class="link" x1="390" y1="150" x2="390" y2="204" marker-end="url(#arrow)"/><line class="link" x1="254" y1="250" x2="224" y2="250" marker-end="url(#arrow)"/><line class="link" x1="526" y1="250" x2="556" y2="250" marker-end="url(#arrow)"/><line class="link" x1="390" y1="296" x2="390" y2="350" marker-end="url(#arrow)"/><rect class="accent" x="240" y="70" width="300" height="80" rx="8"/><text class="body" x="390" y="100" text-anchor="middle">Languages</text><text class="body" x="390" y="124" text-anchor="middle">Home and shared languages</text><rect class="accent" x="254" y="204" width="272" height="92" rx="8"/><text class="h" x="390" y="237" text-anchor="middle">Shared belonging</text><text class="h" x="390" y="261" text-anchor="middle">in Pakistan</text><rect class="panel" x="24" y="200" width="200" height="104" rx="8"/><text class="body" x="124" y="231" text-anchor="middle">Arts</text><text class="body" x="124" y="255" text-anchor="middle">Patterns, stories,</text><text class="body" x="124" y="279" text-anchor="middle">craft knowledge</text><rect class="panel" x="556" y="200" width="200" height="104" rx="8"/><text class="body" x="656" y="231" text-anchor="middle">Traditions</text><text class="body" x="656" y="255" text-anchor="middle">Practices passed on</text><text class="body" x="656" y="279" text-anchor="middle">and adapted</text><rect class="panel" x="240" y="350" width="300" height="80" rx="8"/><text class="body" x="390" y="379" text-anchor="middle">Cuisine</text><text class="body" x="390" y="403" text-anchor="middle">Ingredients, skills, meanings</text><rect class="panel" x="24" y="464" width="732" height="190" rx="8"/><text class="h" x="42" y="493" text-anchor="start">Some language examples associated with regions</text><text class="body" x="42" y="525" text-anchor="start">Sindh: Sindhi, Urdu; Punjab: Punjabi, Saraiki</text><text class="body" x="42" y="549" text-anchor="start">Khyber Pakhtunkhwa: Pashto, Hindko</text><text class="body" x="42" y="573" text-anchor="start">Balochistan: Balochi, Brahui; Gilgit-Baltistan: Shina, Balti</text><text class="body" x="42" y="597" text-anchor="start">Examples overlap and cross regional boundaries.</text><text class="body" x="42" y="621" text-anchor="start">No child represents a whole community.</text><text class="body" x="24" y="685" text-anchor="start">Equal respect and cooperation connect people across differences.</text><text aria-hidden="true" class="wm" x="764" y="718" text-anchor="end">textbook.com.pk</text></svg>
