<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 582" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Conditional cycle linking education and economic development</title><desc id="d">Education can build skills that support productive work income and reinvestment, while access jobs infrastructure and public decisions condition each link in the cycle.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="582"/><text class="h" x="24" y="34" text-anchor="start">Education and development: a conditional cycle</text><line class="link" x1="330" y1="130" x2="450" y2="130" marker-end="url(#arrow)"/><line class="link" x1="596" y1="180" x2="596" y2="358" marker-end="url(#arrow)"/><line class="link" x1="450" y1="408" x2="330" y2="408" marker-end="url(#arrow)"/><line class="link" x1="184" y1="358" x2="184" y2="180" marker-end="url(#arrow)"/><rect class="accent" x="34" y="80" width="296" height="100" rx="8"/><text class="h" x="182" y="112" text-anchor="middle">Accessible, effective</text><text class="h" x="182" y="136" text-anchor="middle">education</text><rect class="accent" x="450" y="80" width="296" height="100" rx="8"/><text class="h" x="598" y="112" text-anchor="middle">Useful skills and</text><text class="h" x="598" y="136" text-anchor="middle">productive work</text><rect class="accent" x="450" y="358" width="296" height="100" rx="8"/><text class="h" x="598" y="392" text-anchor="middle">Income and</text><text class="h" x="598" y="416" text-anchor="middle">public resources</text><rect class="accent" x="34" y="358" width="296" height="100" rx="8"/><text class="h" x="182" y="392" text-anchor="middle">Reinvestment</text><text class="h" x="182" y="416" text-anchor="middle">in education</text><rect class="panel" x="234" y="210" width="312" height="116" rx="8"/><text class="body" x="390" y="239" text-anchor="middle">Links need conditions:</text><text class="body" x="390" y="263" text-anchor="middle">safe access; suitable jobs;</text><text class="body" x="390" y="287" text-anchor="middle">reliable infrastructure;</text><text class="body" x="390" y="311" text-anchor="middle">fair public decisions</text><text class="body" x="390" y="510" text-anchor="middle">Any link can be interrupted. Benefits are not guaranteed.</text><text class="small" x="390" y="540" text-anchor="middle">Each link depends on supporting conditions.</text><text aria-hidden="true" class="wm" x="764" y="570" text-anchor="end">textbook.com.pk</text></svg>
