<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 594" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three connected sectors of Pakistan’s economy</title><desc id="d">Agriculture industry and services contribute 23.54 18.07 and 58.39 percent respectively in the provisional FY2024-25 sectoral GDP table, alongside examples and challenges for each sector.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{stroke:var(--ink);stroke-width:2;fill:none}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="594"/><text class="h" x="24" y="34" text-anchor="start">Three connected sectors</text><text class="small" x="24" y="60" text-anchor="start">Provisional FY2024-25 GDP shares; constant FY2015-16 prices</text><rect class="accent" x="24" y="84" width="156" height="60" rx="0"/><text class="body" x="36" y="109" text-anchor="start">Sector</text><rect class="accent" x="180" y="84" width="120" height="60" rx="0"/><text class="body" x="192" y="109" text-anchor="start">GDP share</text><rect class="accent" x="300" y="84" width="200" height="60" rx="0"/><text class="body" x="312" y="109" text-anchor="start">Activities</text><rect class="accent" x="500" y="84" width="256" height="60" rx="0"/><text class="body" x="512" y="109" text-anchor="start">Possible challenges</text><rect class="panel" x="24" y="144" width="156" height="108" rx="0"/><rect class="panel" x="180" y="144" width="120" height="108" rx="0"/><rect class="panel" x="300" y="144" width="200" height="108" rx="0"/><rect class="panel" x="500" y="144" width="256" height="108" rx="0"/><text class="body" x="36" y="182" text-anchor="start">Agriculture</text><text class="body" x="192" y="182" text-anchor="start">23.54%</text><text class="body" x="312" y="182" text-anchor="start">Crops, livestock,</text><text class="body" x="312" y="206" text-anchor="start">forestry, fishing</text><text class="body" x="512" y="182" text-anchor="start">Water reliability,</text><text class="body" x="512" y="206" text-anchor="start">crop damage</text><rect class="panel" x="24" y="252" width="156" height="108" rx="0"/><rect class="panel" x="180" y="252" width="120" height="108" rx="0"/><rect class="panel" x="300" y="252" width="200" height="108" rx="0"/><rect class="panel" x="500" y="252" width="256" height="108" rx="0"/><text class="body" x="36" y="290" text-anchor="start">Industry</text><text class="body" x="192" y="290" text-anchor="start">18.07%</text><text class="body" x="312" y="290" text-anchor="start">Textiles, mining,</text><text class="body" x="312" y="314" text-anchor="start">construction</text><text class="body" x="512" y="290" text-anchor="start">Power interruption,</text><text class="body" x="512" y="314" text-anchor="start">costly equipment</text><rect class="panel" x="24" y="360" width="156" height="108" rx="0"/><rect class="panel" x="180" y="360" width="120" height="108" rx="0"/><rect class="panel" x="300" y="360" width="200" height="108" rx="0"/><rect class="panel" x="500" y="360" width="256" height="108" rx="0"/><text class="body" x="36" y="398" text-anchor="start">Services</text><text class="body" x="192" y="398" text-anchor="start">58.39%</text><text class="body" x="312" y="398" text-anchor="start">Transport, retail,</text><text class="body" x="312" y="422" text-anchor="start">education</text><text class="body" x="512" y="398" text-anchor="start">Road access,</text><text class="body" x="512" y="422" text-anchor="start">skills access</text><text class="body" x="24" y="500" text-anchor="start">Share of production is not a share of jobs or households.</text><text class="small" x="24" y="530" text-anchor="start">Source: Ministry of Finance, Pakistan Economic Survey 2024-25,</text><text class="small" x="24" y="554" text-anchor="start">Chapter 1, Table 1.2, printed p. 13. Later estimates may revise these shares.</text><text aria-hidden="true" class="wm" x="764" y="582" text-anchor="end">textbook.com.pk</text></svg>
