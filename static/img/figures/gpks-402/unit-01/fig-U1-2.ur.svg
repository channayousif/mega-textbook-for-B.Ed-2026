<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 545" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعت میں پاکستان کے مطالعہ</title><desc id="d">چار قطاروں (تاریخ، جغرافیہ، معیشت، شہریت) کی جدول جس میں ہر شعبے کا دائرہ، پاکستان سے ایک مثال، اور استاد کے لیے اس کی ضرورت دکھائی گئی ہے؛ مثلاً شہریت حقوق اور فرائض کا احاطہ کرتی ہے، شہریوں کی مساوات کے بارے میں آرٹیکل 25 کی مثال دیتی ہے، اور استاد کو ہر طالب علم سے منصفانہ سلوک کا نمونہ پیش کرنے میں مدد دیتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.link{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.tree{fill:none;stroke:var(--a1);stroke-width:14;stroke-linecap:round}.ah{fill:var(--ink)}text{font-size:14px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{font-size:12px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="545" rx="0"/><text class="h" x="390" y="30" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">جماعت میں پاکستان کے مطالعہ</tspan></text><rect class="panel" x="20" y="55" width="740" height="450" rx="0"/><rect class="accent" x="20" y="55" width="740" height="70" rx="0"/><path class="link" d="M640 55 V505"/><path class="link" d="M460 55 V505"/><path class="link" d="M270 55 V505"/><path class="link" d="M760 125 H20"/><path class="link" d="M760 220 H20"/><path class="link" d="M760 315 H20"/><path class="link" d="M760 410 H20"/><text class="sh" x="748" y="81" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">مضمون کا</tspan><tspan x="748" dy="28" text-anchor="end">شعبہ</tspan></text><text class="sh" x="628" y="81" text-anchor="end"><tspan x="628" dy="0" text-anchor="end">اس کا دائرہ</tspan></text><text class="sh" x="448" y="81" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">پاکستان سے مثال</tspan></text><text class="sh" x="258" y="81" text-anchor="end"><tspan x="258" dy="0" text-anchor="end">استاد کو کیوں درکار ہے</tspan></text><text class="body" x="748" y="152" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">تاریخ</tspan></text><text class="body" x="628" y="152" text-anchor="end"><tspan x="628" dy="0" text-anchor="end">پاکستان کیسے</tspan><tspan x="628" dy="28" text-anchor="end">وجود میں آیا</tspan></text><text class="body" x="448" y="152" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">1940 کی</tspan><tspan x="448" dy="28" text-anchor="end">قراردادِ لاہور</tspan></text><text class="body" x="258" y="152" text-anchor="end"><tspan x="258" dy="0" text-anchor="end">ماضی کی وضاحت ثبوت سے،</tspan><tspan x="258" dy="28" text-anchor="end">من گھڑت کہانیوں سے نہیں</tspan></text><text class="body" x="748" y="247" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">جغرافیہ</tspan></text><text class="body" x="628" y="247" text-anchor="end"><tspan x="628" dy="0" text-anchor="end">زمین، آب و ہوا،</tspan><tspan x="628" dy="28" text-anchor="end">وسائل</tspan></text><text class="body" x="448" y="247" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">دریائے سندھ</tspan><tspan x="448" dy="28" text-anchor="end">کا نظام</tspan></text><text class="body" x="258" y="247" text-anchor="end"><tspan x="258" dy="0" text-anchor="end">واقف جگہوں کو قومی</tspan><tspan x="258" dy="28" text-anchor="end">سوالوں سے جوڑنا</tspan></text><text class="body" x="748" y="342" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">معیشت</tspan></text><text class="body" x="628" y="342" text-anchor="end"><tspan x="628" dy="0" text-anchor="end">لوگ کیسے کماتے</tspan><tspan x="628" dy="28" text-anchor="end">اور تجارت کرتے ہیں</tspan></text><text class="body" x="448" y="342" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">سندھ اور پنجاب</tspan><tspan x="448" dy="28" text-anchor="end">میں زراعت</tspan></text><text class="body" x="258" y="342" text-anchor="end"><tspan x="258" dy="0" text-anchor="end">سبق کا طالب علموں کے</tspan><tspan x="258" dy="28" text-anchor="end">خاندانی روزگار سے تعلق</tspan></text><text class="body" x="748" y="437" text-anchor="end"><tspan x="748" dy="0" text-anchor="end">شہریت</tspan></text><text class="body" x="628" y="437" text-anchor="end"><tspan x="628" dy="0" text-anchor="end">حکومت، حقوق</tspan><tspan x="628" dy="28" text-anchor="end">اور فرائض</tspan></text><text class="body" x="448" y="437" text-anchor="end"><tspan x="448" dy="0" text-anchor="end">آرٹیکل 25،</tspan><tspan x="448" dy="28" text-anchor="end">شہریوں کی</tspan><tspan x="448" dy="28" text-anchor="end">مساوات</tspan></text><text class="body" x="258" y="437" text-anchor="end"><tspan x="258" dy="0" text-anchor="end">ہر طالب علم سے منصفانہ،</tspan><tspan x="258" dy="28" text-anchor="end">مساوی سلوک کا نمونہ</tspan></text><text font-family="system-ui, sans-serif" class="wm" x="12" y="533" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
