<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے مطالعہ کا دائرہ اور مقصد</title><desc id="d">تصوراتی نقشہ جس کے مرکز میں پاکستان کے مطالعہ ہے، پانچ شعبوں (تاریخ، جغرافیہ، آئین اور شہریت، معیشت، معاشرہ اور ثقافت) سے ایک ایک مثال کے ساتھ مربوط ہے، اور اساتذہ کی تعلیم میں اس کے مقصد سے بھی جڑا ہے: باخبر شہری، قومی یکجہتی، اور منصفانہ اور درست تدریس۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.link{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.tree{fill:none;stroke:var(--a1);stroke-width:14;stroke-linecap:round}.ah{fill:var(--ink)}text{font-size:14px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{font-size:12px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590" rx="0"/><text class="h" x="390" y="30" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">پاکستان کے مطالعہ کا دائرہ اور مقصد</tspan></text><path class="link" d="M450 205 L640 135" marker-end="url(#arrow)"/><path class="link" d="M390 205 L390 135" marker-end="url(#arrow)"/><path class="link" d="M330 205 L140 135" marker-end="url(#arrow)"/><path class="link" d="M490 240 H640 V300" marker-end="url(#arrow)"/><path class="link" d="M290 240 H140 V300" marker-end="url(#arrow)"/><path class="link" d="M390 265 V390" marker-end="url(#arrow)"/><text class="body" x="545" y="164" text-anchor="middle"><tspan x="545" dy="0" text-anchor="end">احاطہ</tspan></text><text class="body" x="390" y="174" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">احاطہ</tspan></text><text class="body" x="235" y="164" text-anchor="middle"><tspan x="235" dy="0" text-anchor="end">احاطہ</tspan></text><text class="body" x="640" y="277" text-anchor="middle"><tspan x="640" dy="0" text-anchor="end">احاطہ</tspan></text><text class="body" x="140" y="277" text-anchor="middle"><tspan x="140" dy="0" text-anchor="end">احاطہ</tspan></text><text class="body" x="390" y="350" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">معاونت</tspan></text><rect class="panel" x="525" y="55" width="230" height="80" rx="10"/><text class="sh" x="640" y="78" text-anchor="middle"><tspan x="640" dy="0" text-anchor="end">تاریخ</tspan></text><text class="body" x="640" y="119" text-anchor="middle"><tspan x="640" dy="0" text-anchor="end">1940 کی قراردادِ لاہور</tspan></text><rect class="panel" x="275" y="55" width="230" height="80" rx="10"/><text class="sh" x="390" y="78" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">جغرافیہ</tspan></text><text class="body" x="390" y="119" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">دریائے سندھ کا نظام</tspan></text><rect class="panel" x="25" y="55" width="230" height="80" rx="10"/><text class="sh" x="140" y="78" text-anchor="middle"><tspan x="140" dy="0" text-anchor="end">آئین اور شہریت</tspan></text><text class="body" x="140" y="119" text-anchor="middle"><tspan x="140" dy="0" text-anchor="end">بنیادی حقوق</tspan></text><rect class="panel" x="525" y="300" width="230" height="75" rx="10"/><text class="sh" x="640" y="326" text-anchor="middle"><tspan x="640" dy="0" text-anchor="end">معیشت</tspan></text><text class="body" x="640" y="352" text-anchor="middle"><tspan x="640" dy="0" text-anchor="end">زراعت اور تجارت</tspan></text><rect class="panel" x="25" y="300" width="230" height="75" rx="10"/><text class="sh" x="140" y="326" text-anchor="middle"><tspan x="140" dy="0" text-anchor="end">معاشرہ اور ثقافت</tspan></text><text class="body" x="140" y="352" text-anchor="middle"><tspan x="140" dy="0" text-anchor="end">زبانیں اور تہوار</tspan></text><rect class="accent" x="290" y="205" width="200" height="60" rx="10"/><text class="h" x="390" y="241" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">پاکستان کے مطالعہ</tspan></text><rect class="accent" x="240" y="390" width="300" height="65" rx="10"/><text class="sh" x="390" y="416" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">اساتذہ کی تعلیم میں مقصد</tspan></text><path class="l