<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 465" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے نظریے کے اہم مراحل</title><desc id="d">پاکستان کے نظریاتی مراحل کی زمانی ترتیب: 1857 کی جنگِ آزادی اور مسلم اصلاح کا آغاز، 1906 میں آل انڈیا مسلم لیگ کا قیام، 1930 میں اقبال کا خطبۂ الہ آباد، 1940 کی قراردادِ لاہور، اور 14 اگست 1947 کو آزادی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.link{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.tree{fill:none;stroke:var(--a1);stroke-width:14;stroke-linecap:round}.ah{fill:var(--ink)}text{font-size:14px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{font-size:12px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="465" rx="0"/><text class="h" x="390" y="30" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">پاکستان کے نظریے کے اہم مراحل</tspan></text><text class="body" x="390" y="57" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">مراحل برابر فاصلے پر ہیں؛ فاصلہ گزرے وقت کو ظاہر نہیں کرتا۔</tspan></text><path class="link" d="M690 108 H90"/><circle class="accent" cx="690" cy="108" r="7"/><text class="h" x="690" y="91" text-anchor="middle"><tspan x="690" dy="0" text-anchor="end">1857</tspan></text><path class="link" d="M690 115 V145"/><rect class="panel" x="624" y="145" width="132" height="280" rx="10"/><text class="body" x="690" y="175" text-anchor="middle"><tspan x="690" dy="0" text-anchor="middle">جنگِ آزادی؛</tspan><tspan x="690" dy="28" text-anchor="middle">مسلمانوں کا</tspan><tspan x="690" dy="28" text-anchor="middle">زوال اور</tspan><tspan x="690" dy="28" text-anchor="middle">اصلاح کا آغاز</tspan></text><circle class="accent" cx="540" cy="108" r="7"/><text class="h" x="540" y="91" text-anchor="middle"><tspan x="540" dy="0" text-anchor="end">1906</tspan></text><path class="link" d="M540 115 V145"/><rect class="panel" x="474" y="145" width="132" height="280" rx="10"/><text class="body" x="540" y="175" text-anchor="middle"><tspan x="540" dy="0" text-anchor="middle">ڈھاکا میں</tspan><tspan x="540" dy="28" text-anchor="middle">آل انڈیا</tspan><tspan x="540" dy="28" text-anchor="middle">مسلم لیگ</tspan><tspan x="540" dy="28" text-anchor="middle">کا قیام</tspan></text><circle class="accent" cx="390" cy="108" r="7"/><text class="h" x="390" y="91" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">1930</tspan></text><path class="link" d="M390 115 V145"/><rect class="panel" x="324" y="145" width="132" height="280" rx="10"/><text class="body" x="390" y="175" text-anchor="middle"><tspan x="390" dy="0" text-anchor="middle">علامہ اقبال</tspan><tspan x="390" dy="28" text-anchor="middle">کے خطبۂ</tspan><tspan x="390" dy="28" text-anchor="middle">الہ آباد میں</tspan><tspan x="390" dy="28" text-anchor="middle">شمال مغرب</tspan><tspan x="390" dy="28" text-anchor="middle">کی مسلم</tspan><tspan x="390" dy="28" text-anchor="middle">اکثریتی ریاست</tspan><tspan x="390" dy="28" text-anchor="middle">کی تجویز</tspan></text><circle class="accent" cx="240" cy="108" r="7"/><text class="h" x="240" y="91" text-anchor="middle"><tspan x="240" dy="0" text-anchor="end">1940</tspan></text><path class="link" d="M240 115 V145"/><rect class="panel" x="174" y="145" width="132" height="280" rx="10"/><text class="body" x="240" y="175" text-anchor="middle"><tspan x="240" dy="0" text-anchor="middle">قراردادِ لاہور؛</tspan><tspan x="240" dy="28" text-anchor="middle">قائدِ اعظم نے</tspan><tspan x="240" dy="28" text-anchor="middle">مسلمانوں کو</tspan><tspan x="240" dy="28" text-anchor="middle">قوم کہا</tspan></text><circle class="accent" cx="90" cy="108" r="7"/><text class="h" x="90" y="91" text-anchor="middle"><tspan x="90" dy="0" text-anchor="end">1947</tspan></text><path class="link" d="M90 115 V145"/><rect class="panel" x="24" y="145" width="132" height="280" rx="10"/><text class="body" x="90" y="175" text-anchor="middle"><tspan x="90" dy="0" text-anchor="middle">14 اگست کو</tspan><tspan 