<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 545" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table with four rows (history, geography, economy, civics)</title><desc id="d">Table with four rows (history, geography, economy, civics) showing for each what it covers, one example from Pakistan, and why a teacher needs it, for example civics covers rights and duties, uses Article 25 on equality of citizens, and helps a teacher model fair treatment of every pupil.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
