</tspan><tspan x="152" dy="20">to be</tspan></text><text class="body" x="332" y="152" text-anchor="start"><tspan x="332" dy="0">the Lahore</tspan><tspan x="332" dy="20">Resolution of 1940</tspan></text><text class="body" x="522" y="152" text-anchor="start"><tspan x="522" dy="0">to explain the past with</tspan><tspan x="522" dy="20">evidence, not myths</tspan></text><text class="body" x="32" y="247" text-anchor="start"><tspan x="32" dy="0">Geography</tspan></text><text class="body" x="152" y="247" text-anchor="start"><tspan x="152" dy="0">land, climate,</tspan><tspan x="152" dy="20">resources</tspan></text><text class="body" x="332" y="247" text-anchor="start"><tspan x="332" dy="0">the Indus River</tspan><tspan x="332" dy="20">system</tspan></text><text class="body" x="522" y="247" text-anchor="start"><tspan x="522" dy="0">to link places pupils know</tspan><tspan x="522" dy="20">to national questions</tspan></text><text class="body" x="32" y="342" text-anchor="start"><tspan x="32" dy="0">Economy</tspan></text><text class="body" x="152" y="342" text-anchor="start"><tspan x="152" dy="0">how people earn</tspan><tspan x="152" dy="20">and trade</tspan></text><text class="body" x="332" y="342" text-anchor="start"><tspan x="332" dy="0">agriculture in</tspan><tspan x="332" dy="20">Sindh and Punjab</tspan></text><text class="body" x="522" y="342" text-anchor="start"><tspan x="522" dy="0">to connect lessons to</tspan><tspan x="522" dy="20">pupils&#x27; family livelihoods</tspan></text><text class="body" x="32" y="437" text-anchor="start"><tspan x="32" dy="0">Civics</tspan></text><text class="body" x="152" y="437" text-anchor="start"><tspan x="152" dy="0">government, rights</tspan><tspan x="152" dy="20">and duties</tspan></text><text class="body" x="332" y="437" text-anchor="start"><tspan x="332" dy="0">Article 25,</tspan><tspan x="332" dy="20">equality of</tspan><tspan x="332" dy="20">citizens</tspan></text><text class="body" x="522" y="437" text-anchor="start"><tspan x="522" 