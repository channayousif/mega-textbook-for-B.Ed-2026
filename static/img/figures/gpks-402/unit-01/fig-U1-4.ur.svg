<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 850" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے نظریے کی بنیادیں</title><desc id="d">درخت کا خاکہ جس کی دو شاخیں، دو قومی نظریہ (مسلمان الگ قوم ہیں جسے وطن چاہیے) اور اسلامی تصورِ ریاست (حاکمیت اللہ کی ہے، اختیار امانت ہے، انصاف، مشاورت اور مساوی حقوق)، پاکستان کے نظریے کے عنوان والے ایک تنے میں ملتی ہیں؛ اس پر جمہوریت، عوامی زندگی میں اسلامی اصول اور سب کے لیے مساوی شہریت ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.link{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.tree{fill:none;stroke:var(--a1);stroke-width:14;stroke-linecap:round}.ah{fill:var(--ink)}text{font-size:14px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{font-size:12px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="660" height="850" rx="0"/><text class="h" x="330" y="36" text-anchor="middle"><tspan x="330" dy="0" text-anchor="end">پاکستان کے نظریے کی بنیادیں</tspan></text><path class="tree" d="M600 775 Q560 580 410 510 Q330 475 330 405 V280 M60 775 Q100 580 250 510 Q330 475 330 405 M330 300 Q450 270 545 185 M330 280 V180 M330 300 Q210 270 115 185"/><path class="accent" d="M540 80 Q440 80 440 145 Q440 210 540 225 Q640 210 640 145 Q640 80 540 80 Z"/><text class="sh" x="540" y="143" text-anchor="middle"><tspan x="540" dy="0" text-anchor="end">جمہوریت</tspan></text><path class="accent" d="M330 80 Q230 80 230 145 Q230 210 330 225 Q430 210 430 145 Q430 80 330 80 Z"/><text class="sh" x="330" y="143" text-anchor="middle"><tspan x="330" dy="0" text-anchor="end">عوامی زندگی میں</tspan><tspan x="330" dy="28" text-anchor="end">اسلامی اصول</tspan></text><path class="accent" d="M120 80 Q20 80 20 145 Q20 210 120 225 Q220 210 220 145 Q220 80 120 80 Z"/><text class="sh" x="120" y="143" text-anchor="middle"><tspan x="120" dy="0" text-anchor="end">سب کے لیے</tspan><tspan x="120" dy="28" text-anchor="end">مساوی شہریت</tspan></text><rect class="accent" x="195" y="350" width="270" height="85" rx="10"/><text class="h" x="330" y="385" text-anchor="middle"><tspan x="330" dy="0" text-anchor="end">پاکستان کے نظریے</tspan></text><rect class="panel" x="345" y="535" width="295" height="265" rx="10"/><text class="sh" x="492.5" y="565" text-anchor="middle"><tspan x="492.5" dy="0" text-anchor="end">دو قومی نظریہ</tspan></text><rect class="accent" x="362" y="598" width="261" height="52" rx="6"/><text class="body" x="492.5" y="620" text-anchor="middle"><tspan x="492.5" dy="0" text-anchor="end">مسلمان الگ قوم ہیں</tspan></text><rect class="accent" x="362" y="663" width="261" height="52" rx="6"/><text class="body" x="492.5" y="685" text-anchor="middle"><tspan x="492.5" dy="0" text-anchor="end">وطن کی ضرورت</tspan></text><rect class="panel" x="20" y="535" width="295" height="265" rx="10"/><text class="sh" x="167.5" y="565" text-anchor="middle"><tspan x="167.5" dy="0" text-anchor="end">اسلامی تصورِ ریاست</tspan></text><rect class="accent" x="37" y="598" width="261" height="52" rx="6"/><text class="body" x="167.5" y="620" text-anchor="middle"><tspan x="167.5" dy="0" text-anchor="end">حاکمیت اللہ کی ہے</tspan></text><rect class="accent" x="37" y="663" width="261" height="52" rx="6"/><text class="body" x="167.5" y="685" text-anchor="middle"><tspan x="167.5" dy="0" text-anchor="end">اختیار بطور امانت</tspan></text><rect class="accent" x="37" y="728" width="261" height="52" rx="6"/><text class="body" x="167.5" y="750" text-anchor="middle"><tspan x="167.5" dy="0" text-anchor="end">انصاف، مشاورت،</tspan><tspan x="167.5" dy="28" text-anchor="end">مساوی حقوق</tspan></text><text font-family="system-ui, sans-serif" class="wm" x="12" y="838" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
