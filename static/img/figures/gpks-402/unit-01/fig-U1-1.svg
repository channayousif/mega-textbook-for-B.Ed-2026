<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with Pakistan Studies at the centre</title><desc id="d">Concept map with Pakistan Studies at the centre, linked to five areas (history, geography, constitution and civics, economy, society and culture) with one example each, and to its purpose in teacher education: informed citizens, national integration, and fair and accurate teaching.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
