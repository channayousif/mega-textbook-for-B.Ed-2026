<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 465" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of the ideological milestones of Pakistan</title><desc id="d">Timeline of the ideological milestones of Pakistan: 1857 War of Independence and the start of Muslim reform, 1906 founding of the All-India Muslim League, 1930 Iqbal's Allahabad address, 1940 Lahore Resolution, and 1947 independence on 14 August.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.link{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.tree{fill:none;stroke:var(--a1);stroke-width:14;stroke-linecap:round}.ah{fill:var(--ink)}text{font-size:14px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{font-size:12px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="465" rx="0"/><text class="h" x="390" y="30" text-anchor="middle"><tspan x="390" dy="0">Milestones in the ideology of Pakistan</tspan></text><text class="body" x="390" y="57" text-anchor="middle"><tspan x="390" dy="0">Milestones are equally spaced; distances do not show elapsed time.</tspan></text><path class="link" d="M90 108 H690"/><circle class="accent" cx="90" cy="108" r="7"/><text class="h" x="90" y="91" text-anchor="middle"><tspan x="90" dy="0">1857</tspan></text><path class="link" d="M90 115 V145"/><rect class="panel" x="24" y="145" width="132" height="280" rx="10"/><text class="body" x="90" y="175" text-anchor="middle"><tspan x="90" dy="0">War of</tspan><tspan x="90" dy="21">Independence;</tspan><tspan x="90" dy="21">Muslim</tspan><tspan x="90" dy="21">decline and</tspan><tspan x="90" dy="21">the start of</tspan><tspan x="90" dy="21">reform</tspan></text><circle class="accent" cx="240" cy="108" r="7"/><text class="h" x="240" y="91" text-anchor="middle"><tspan x="240" dy="0">1906</tspan></text><path class="link" d="M240 115 V145"/><rect class="panel" x="174" y="145" width="132" height="280" rx="10"/><text class="body" x="240" y="175" text-anchor="middle"><tspan x="240" dy="0">All-India</tspan><tspan x="240" dy="21">Muslim League</tspan><tspan x="240" dy="21">founded at</tspan><tspan x="240" dy="21">Dhaka</tspan></text><circle class="accent" cx="390" cy="108" r="7"/><text class="h" x="390" y="91" text-anchor="middle"><tspan x="390" dy="0">1930</tspan></text><path class="link" d="M390 115 V145"/><rect class="panel" x="324" y="145" width="132" height="280" rx="10"/><text class="body" x="390" y="175" text-anchor="middle"><tspan x="390" dy="0">Allama</tspan><tspan x="390" dy="21">Iqbal's</tspan><tspan x="390" dy="21">Allahabad</tspan><tspan x="390" dy="21">address</tspan><tspan x="390" dy="21">proposes a</tspan><tspan x="390" dy="21">Muslim-</tspan><tspan x="390" dy="21">majority</tspan><tspan x="390" dy="21">state in the</tspan><tspan x="390" dy="21">north-west</tspan></text><circle class="accent" cx="540" cy="108" r="7"/><text class="h" x="540" y="91" text-anchor="middle"><tspan x="540" dy="0">1940</tspan></text><path class="link" d="M540 115 V145"/><rect class="panel" x="474" y="145" width="132" height="280" rx="10"/><text class="body" x="540" y="175" text-anchor="middle"><tspan x="540" dy="0">Lahore</tspan><tspan x="540" dy="21">Resolution;</tspan><tspan x="540" dy="21">Quaid-e-Azam</tspan><tspan x="540" dy="21">calls Muslims</tspan><tspan x="540" dy="21">a nation</tspan></text><circle class="accent" cx="690" cy="108" r="7"/><text class="h" x="690" y="91" text-anchor="middle"><tspan x="690" dy="0">1947</tspan></text><path class="link" d="M690 115 V145"/><rect class="panel" x="624" y="145" width="132" height="280" rx="10"/><text class="body" x="690" y="175" text-anchor="middle"><tspan x="690" dy="0">Pakistan</tspan><tspan x="690" dy="21">becomes</tspan><tspan x="690" dy="21">independent</tspan><tspan x="690" dy="21">on 14 August</tspan></text><text class="wm" x="768" y="453" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
