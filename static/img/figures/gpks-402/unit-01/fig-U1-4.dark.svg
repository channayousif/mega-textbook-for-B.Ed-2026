<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 850" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a tree in which two branches join into one trunk labelled Ideology of Pakistan</title><desc id="d">Diagram of a tree in which two branches, the Two-Nation Theory (Muslims are a separate nation that needs a homeland) and the Islamic concept of state (sovereignty belongs to Allah, authority is a trust, justice, consultation and equal rights), join into one trunk labelled Ideology of Pakistan, which carries democracy, Islamic principles in public life and equal citizenship for all.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.link{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.tree{fill:none;stroke:var(--a1);stroke-width:14;stroke-linecap:round}.ah{fill:var(--ink)}text{font-size:14px;fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.sh{font-size:16px;font-weight:600;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{font-size:12px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="bg" x="0" y="0" width="660" height="850" rx="0"/><text class="h" x="330" y="36" text-anchor="middle"><tspan x="330" dy="0">The foundations of Pakistan&#x27;s ideology</tspan></text><path class="tree" d="M60 775 Q100 580 250 510 Q330 475 330 405 V280 M600 775 Q560 580 410 510 Q330 475 330 405 M330 300 Q210 270 115 185 M330 280 V180 M330 300 Q450 270 545 185"/><path class="accent" d="M120 80 Q220 80 220 145 Q220 210 120 225 Q20 210 20 145 Q20 80 120 80 Z"/><text class="sh" x="120" y="143" text-anchor="middle"><tspan x="120" dy="0">democracy</tspan></text><path class="accent" d="M330 80 Q430 80 430 145 Q430 210 330 225 Q230 210 230 145 Q230 80 330 80 Z"/><text class="sh" x="330" y="143" text-anchor="middle"><tspan x="330" dy="0">Islamic principles</tspan><tspan x="330" dy="23">in public life</tspan></text><path class="accent" d="M540 80 Q640 80 640 145 Q640 210 540 225 Q440 210 440 145 Q440 80 540 80 Z"/><text class="sh" x="540" y="143" text-anchor="middle"><tspan x="540" dy="0">equal citizenship</tspan><tspan x="540" dy="23">for all</tspan></text><rect class="accent" x="195" y="350" width="270" height="85" rx="10"/><text class="h" x="330" y="385" text-anchor="middle"><tspan x="330" dy="0">Ideology of</tspan><tspan x="330" dy="25">Pakistan</tspan></text><rect class="panel" x="20" y="535" width="295" height="265" rx="10"/><text class="sh" x="167.5" y="565" text-anchor="middle"><tspan x="167.5" dy="0">Two-Nation Theory</tspan></text><rect class="accent" x="37" y="598" width="261" height="52" rx="6"/><text class="body" x="167.5" y="620" text-anchor="middle"><tspan x="167.5" dy="0">Muslims are a</tspan><tspan x="167.5" dy="20">separate nation</tspan></text><rect class="accent" x="37" y="663" width="261" height="52" rx="6"/><text class="body" x="167.5" y="685" text-anchor="middle"><tspan x="167.5" dy="0">need a homeland</tspan></text><rect class="panel" x="345" y="535" width="295" height="265" rx="10"/><text class="sh" x="492.5" y="565" text-anchor="middle"><tspan x="492.5" dy="0">Islamic concept</tspan><tspan x="492.5" dy="21">of state</tspan></text><rect class="accent" x="362" y="598" width="261" height="52" rx="6"/><text class="body" x="492.5" y="620" text-anchor="middle"><tspan x="492.5" dy="0">sovereignty belongs</tspan><tspan x="492.5" dy="20">to Allah</tspan></text><rect class="accent" x="362" y="663" width="261" height="52" rx="6"/><text class="body" x="492.5" y="685" text-anchor="middle"><tspan x="492.5" dy="0">authority as a trust</tspan></text><rect class="accent" x="362" y="728" width="261" height="52" rx="6"/><text class="body" x="492.5" y="750" text-anchor="middle"><tspan x="492.5" dy="0">justice, consultation,</tspan><tspan x="492.5" dy="20">equal rights</tspan></text><text class="wm" x="648" y="838" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
