<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Constitutional milestones</title><desc id="d">Constitutional milestones from the 1949 Objectives Resolution to the 1973 Constitution and selected later changes, with the interruptions of 1958 and 1969 marked separately.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><text x="28" y="35" class="h" text-anchor="start">Constitutional milestones</text><text x="28" y="63" class="small" text-anchor="start">Follow the arrows. Dashed boxes mark interruptions.</text><rect x="30" y="95" width="216" height="110" rx="8" class="accent"/><text x="46" y="124" class="date" text-anchor="start">1949</text><text x="46" y="155" class="body" text-anchor="start">Objectives</text><text x="46" y="179" class="body" text-anchor="start">Resolution</text><line x1="246" y1="150" x2="278" y2="150" class="link" marker-end="url(#arrow)"/><rect x="282" y="95" width="216" height="110" rx="8" class="accent"/><text x="298" y="124" class="date" text-anchor="start">1956</text><text x="298" y="155" class="body" text-anchor="start">First full</text><text x="298" y="179" class="body" text-anchor="start">Constitution</text><line x1="498" y1="150" x2="530" y2="150" class="link" marker-end="url(#arrow)"/><rect x="534" y="95" width="216" height="110" rx="8" class="interrupt"/><text x="550" y="124" class="date" text-anchor="start">1958</text><text x="550" y="155" class="body" text-anchor="start">Abrogation;</text><text x="550" y="179" class="body" text-anchor="start">martial law</text><line x1="642" y1="205" x2="642" y2="241" class="link" marker-end="url(#arrow)"/><rect x="534" y="245" width="216" height="110" rx="8" class="accent"/><text x="550" y="274" class="date" text-anchor="start">1962</text><text x="550" y="305" class="body" text-anchor="start">Presidential</text><text x="550" y="329" class="body" text-anchor="start">Constitution</text><line x1="534" y1="300" x2="502" y2="300" class="link" marker-end="url(#arrow)"/><rect x="282" y="245" width="216" height="110" rx="8" class="interrupt"/><text x="298" y="274" class="date" text-anchor="start">1969</text><text x="298" y="305" class="body" text-anchor="start">Abrogation;</text><text x="298" y="329" class="body" text-anchor="start">martial law</text><line x1="282" y1="300" x2="250" y2="300" class="link" marker-end="url(#arrow)"/><rect x="30" y="245" width="216" height="110" rx="8" class="accent"/><text x="46" y="274" class="date" text-anchor="start">1972</text><text x="46" y="305" class="body" text-anchor="start">Interim</text><text x="46" y="329" class="body" text-anchor="start">Constitution</text><line x1="138" y1="355" x2="138" y2="391" class="link" marker-end="url(#arrow)"/><rect x="30" y="395" width="216" height="110" rx="8" class="accent"/><text x="46" y="424" class="date" text-anchor="start">1973</text><text x="46" y="455" class="body" text-anchor="start">Parliamentary</text><text x="46" y="479" class="body" text-anchor="start">Constitution</text><line x1="246" y1="450" x2="278" y2="450" class="link" marker-end="url(#arrow)"/><rect x="282" y="395" width="216" height="110" rx="8" class="accent"/><text x="298" y="424" class="date" text-anchor="start">1985</text><text x="298" y="455" class="body" text-anchor="start">Article 2A:</text><text x="298" y="479" class="body" text-anchor="start">substantive status</text><line x1="498" y1="450" x2="530" y2="450" class="link" marker-end="url(#arrow)"/><rect x="534" y="395" width="216" height="110" rx="8" class="accent"/><text x="550" y="424" class="date" text-anchor="start">2010</text><text x="550" y="455" class="body" text-anchor="start">Eighteenth</text><text x="550" y="479" class="body" text-anchor="start">Amendment</text><text x="30" y="539" class="small" text-anchor="start">1973 Preamble precedes the 1985 substantive incorporation.</text><text x="762" y="566" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
