<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 690" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئینی آرٹیکلز تلاش کرنا</title><desc id="d">رہنما خاکہ آئین کے دیباچے، حصوں، جہاں موجود ہوں وہاں ابواب، آرٹیکلز، جدولوں اور ضمیمے کو جوڑتا ہے؛ مثالیں آرٹیکلز 2، 20، 50 اور 227 تلاش کرنے کا طریقہ دکھاتی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="690"/><text x="752" y="34" class="h" text-anchor="end">آئین میں دفعہ تلاش کرنا</text><text x="752" y="63" class="small" text-anchor="end">حوالے کا ایڈیشن: 28 فروری 2012 تک ترمیم شدہ۔</text><rect x="550" y="90" width="200" height="68" rx="8" class="accent"/><text x="650" y="131" class="h" text-anchor="middle">دیباچہ</text><rect x="30" y="90" width="460" height="68" rx="8" class="panel"/><text x="260" y="118" class="body" text-anchor="middle">مقاصد اور وعدے</text><text x="260" y="143" class="small" text-anchor="middle">نمبر وار دفعات سے پہلے پڑھیں</text><line x1="550" y1="124" x2="494" y2="124" class="link" marker-end="url(#arrow)"/><rect x="550" y="190" width="200" height="84" rx="8" class="accent"/><text x="650" y="222" class="h" text-anchor="middle">نمبر وار حصے</text><text x="650" y="250" class="small" text-anchor="middle">بڑے موضوعاتی شعبے</text><rect x="30" y="190" width="460" height="84" rx="8" class="panel"/><text x="470" y="222" class="body" text-anchor="end">حصہ I: آرٹیکل 2، ریاستی مذہب</text><text x="470" y="246" class="body" text-anchor="end">حصہ IX: آرٹیکل 227، قوانین کی مطابقت</text><line x1="550" y1="232" x2="494" y2="232" class="link" marker-end="url(#arrow)"/><rect x="550" y="306" width="200" height="84" rx="8" class="accent"/><text x="650" y="338" class="h" text-anchor="middle">ابواب</text><text x="650" y="366" class="small" text-anchor="middle">جہاں حصے میں موجود ہوں</text><rect x="30" y="306" width="460" height="84" rx="8" class="panel"/><text x="470" y="338" class="body" text-anchor="end">حصہ II، باب 1: آرٹیکل 20</text><text x="470" y="362" class="body" text-anchor="end">حصہ III، باب 2: آرٹیکل 50</text><line x1="550" y1="348" x2="494" y2="348" class="link" marker-end="url(#arrow)"/><line x1="650" y1="274" x2="650" y2="302" class="link" marker-end="url(#arrow)"/><line x1="650" y1="390" x2="650" y2="418" class="link" marker-end="url(#arrow)"/><rect x="550" y="422" width="200" height="70" rx="8" class="accent"/><text x="650" y="451" class="h" text-anchor="middle">آرٹیکلز</text><text x="650" y="477" class="small" text-anchor="middle">شقیں اور نوٹس پڑھیں</text><rect x="30" y="422" width="460" height="70" rx="8" class="panel"/><text x="470" y="451" class="body" text-anchor="end">آرٹیکل 20: مذہبی آزادی</text><text x="470" y="477" class="body" text-anchor="end">آرٹیکل 50: پارلیمان کے اجزا</text><line x1="550" y1="457" x2="494" y2="457" class="link" marker-end="url(#arrow)"/><rect x="30" y="530" width="720" height="78" rx="8" class="panel"/><text x="730" y="560" class="h" text-anchor="end">متعلقہ مواد: جدول اور ضمیمہ</text><text x="730" y="587" class="body" text-anchor="end">ضمیمے میں قراردادِ مقاصد درج ہے؛ آرٹیکل 2A دیکھیں۔</text><text x="750" y="644" class="small" text-anchor="end">ہر حصے میں باب نہیں: فہرست اور آرٹیکل نمبر سے مدد لیں۔</text><text x="18" y="676" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
