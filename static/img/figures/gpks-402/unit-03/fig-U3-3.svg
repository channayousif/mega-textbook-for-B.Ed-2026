<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 690" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Finding constitutional articles</title><desc id="d">A navigation diagram links the Constitution's Preamble, Parts, Chapters where used, Articles, Schedules and Annex, with examples showing how to locate Articles 2, 20, 50 and 227.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="690"/><text x="28" y="34" class="h" text-anchor="start">Finding a provision in the Constitution</text><text x="28" y="63" class="small" text-anchor="start">Reference edition: modified to 28 February 2012.</text><rect x="30" y="90" width="200" height="68" rx="8" class="accent"/><text x="130" y="131" class="h" text-anchor="middle">Preamble</text><rect x="290" y="90" width="460" height="68" rx="8" class="panel"/><text x="520" y="118" class="body" text-anchor="middle">Purposes and commitments</text><text x="520" y="143" class="small" text-anchor="middle">Read before the numbered provisions</text><line x1="230" y1="124" x2="286" y2="124" class="link" marker-end="url(#arrow)"/><rect x="30" y="190" width="200" height="84" rx="8" class="accent"/><text x="130" y="222" class="h" text-anchor="middle">Numbered Parts</text><text x="130" y="250" class="small" text-anchor="middle">Major subject areas</text><rect x="290" y="190" width="460" height="84" rx="8" class="panel"/><text x="310" y="222" class="body" text-anchor="start">Part I: Article 2, state religion</text><text x="310" y="246" class="body" text-anchor="start">Part IX: Article 227, conformity of laws</text><line x1="230" y1="232" x2="286" y2="232" class="link" marker-end="url(#arrow)"/><rect x="30" y="306" width="200" height="84" rx="8" class="accent"/><text x="130" y="338" class="h" text-anchor="middle">Chapters</text><text x="130" y="366" class="small" text-anchor="middle">Where the Part uses them</text><rect x="290" y="306" width="460" height="84" rx="8" class="panel"/><text x="310" y="338" class="body" text-anchor="start">Part II, Chapter 1: Article 20</text><text x="310" y="362" class="body" text-anchor="start">Part III, Chapter 2: Article 50</text><line x1="230" y1="348" x2="286" y2="348" class="link" marker-end="url(#arrow)"/><line x1="130" y1="274" x2="130" y2="302" class="link" marker-end="url(#arrow)"/><line x1="130" y1="390" x2="130" y2="418" class="link" marker-end="url(#arrow)"/><rect x="30" y="422" width="200" height="70" rx="8" class="accent"/><text x="130" y="451" class="h" text-anchor="middle">Articles</text><text x="130" y="477" class="small" text-anchor="middle">Read clauses and notes</text><rect x="290" y="422" width="460" height="70" rx="8" class="panel"/><text x="310" y="451" class="body" text-anchor="start">Article 20: religious freedom</text><text x="310" y="477" class="body" text-anchor="start">Article 50: components of Parliament</text><line x1="230" y1="457" x2="286" y2="457" class="link" marker-end="url(#arrow)"/><rect x="30" y="530" width="720" height="78" rx="8" class="panel"/><text x="50" y="560" class="h" text-anchor="start">Associated material: Schedules and Annex</text><text x="50" y="587" class="body" text-anchor="start">The Annex reproduces the Objectives Resolution; see Article 2A.</text><text x="30" y="644" class="small" text-anchor="start">Not every Part has a Chapter: use the contents and article number.</text><text x="762" y="676" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
