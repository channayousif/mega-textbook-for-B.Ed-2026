<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 695" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Islamic provisions and related safeguards</title><desc id="d">Islamic constitutional provisions are linked to their articles and functions, distinguishing the Council's advice from law-making, showing minority safeguards, and dating Article 2A to 1985.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="695"/><text x="28" y="35" class="h" text-anchor="start">Islamic provisions: functions and safeguards</text><text x="28" y="64" class="small" text-anchor="start">Read article, institution, action and date together.</text><rect x="235" y="93" width="310" height="70" rx="8" class="accent"/><text x="390" y="123" class="h" text-anchor="middle">Islamic constitutional</text><text x="390" y="148" class="h" text-anchor="middle">provisions</text><rect x="28" y="210" width="340" height="85" rx="8" class="panel"/><text x="44" y="237" class="h" text-anchor="start">Article 2</text><text x="44" y="263" class="body" text-anchor="start">Islam as state religion</text><rect x="412" y="210" width="340" height="85" rx="8" class="panel"/><text x="428" y="237" class="h" text-anchor="start">Article 31</text><text x="428" y="263" class="body" text-anchor="start">Policy for Muslim life</text><rect x="28" y="350" width="340" height="110" rx="8" class="panel"/><text x="44" y="377" class="h" text-anchor="start">Article 227</text><text x="44" y="403" class="small" text-anchor="start">Conformity of laws</text><text x="44" y="427" class="small" text-anchor="start">Clause (3): non-Muslim personal</text><text x="44" y="451" class="small" text-anchor="start">laws and citizenship safeguard</text><rect x="412" y="350" width="340" height="110" rx="8" class="panel"/><text x="428" y="377" class="h" text-anchor="start">Articles 228-231</text><text x="428" y="403" class="small" text-anchor="start">Council: advice and recommendations</text><text x="428" y="427" class="small" text-anchor="start">Law-making remains with</text><text x="428" y="451" class="small" text-anchor="start">the relevant legislature</text><path d="M390 163 V185 H198 V206 M390 185 H582 V206 M390 185 V322 H198 V346 M390 322 H582 V346" class="link"/><rect x="28" y="510" width="340" height="102" rx="8" class="accent"/><text x="44" y="539" class="h" text-anchor="start">Article 2A: added in 1985</text><text x="44" y="566" class="body" text-anchor="start">Objectives Resolution given</text><text x="44" y="590" class="body" text-anchor="start">substantive constitutional status</text><rect x="412" y="510" width="340" height="102" rx="8" class="panel"/><text x="428" y="539" class="h" text-anchor="start">Related protections</text><text x="428" y="566" class="body" text-anchor="start">Article 20: religious freedom</text><text x="428" y="590" class="body" text-anchor="start">Article 22: education safeguards</text><path d="M390 322 V486 H198 V506 M390 486 H582 V506" class="link"/><text x="28" y="652" class="small" text-anchor="start">A recommendation is not enactment. Consult the dated text.</text><text x="762" y="681" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
