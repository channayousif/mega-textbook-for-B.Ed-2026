<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 690" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین آئینی ڈھانچے</title><desc id="d">تین آئینی ڈھانچوں کا موازنہ: 1956 اور 1973 میں پارلیمانی، 1962 میں صدارتی، تینوں ساخت میں وفاقی؛ 1973 میں دو مرکزی ایوان متعارف ہوئے اور 1962 کے ڈھانچے کے حقوق پر تاریخ والا نوٹ دیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="690"/><text x="755" y="34" class="h" text-anchor="end">آئینی ڈھانچوں کا موازنہ</text><text x="755" y="62" class="small" text-anchor="end">تینوں خانوں میں ایک ہی خصوصیت کا موازنہ کریں۔</text><rect x="590" y="88" width="166" height="54" rx="8" class="accent"/><text x="744" y="122" class="h" text-anchor="end">خصوصیت</text><rect x="402" y="88" width="188" height="54" rx="8" class="accent"/><text x="578" y="122" class="h" text-anchor="end">1956</text><rect x="214" y="88" width="188" height="54" rx="8" class="accent"/><text x="390" y="122" class="h" text-anchor="end">1962</text><rect x="26" y="88" width="188" height="54" rx="8" class="accent"/><text 