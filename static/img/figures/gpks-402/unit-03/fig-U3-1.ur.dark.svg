<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئینی مراحل</title><desc id="d">1949 کی قراردادِ مقاصد سے 1973 کے آئین اور بعد کی منتخب تبدیلیوں تک آئینی مراحل، جن میں 1958 اور 1969 کے تعطل الگ نشان زد ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><text x="752" y="35" class="h" text-anchor="end">آئینی مراحل</text><text x="752" y="63" class="small" text-anchor="end">تیروں کے ساتھ چلیں۔ ٹوٹی لکیر والے خانے تعطل دکھاتے ہیں۔</text><rect x="534" y="95" width="216" height="110" rx="8" class="accent"/><text x="734" y="124" class="date" text-anchor="end">1949</text><text x="734" y="155" class="body" text-anchor="end">قراردادِ</text><text x="734" y="179" class="body" text-anchor="end">مقاصد</text><line x1="534" y1="150" x2="502" y2="150" class="link" marker-end="url(#arrow)"/><rect x="282" y="95" width="216" height="110" rx="8" class="accent"/><text x="482" y="124" class="date" text-anchor="end">1956</text><text x="482" y="155" class="body" text-anchor="end">پہلا مکمل</text><text x="482" y="179" class="body" text-anchor="end">آئین</text><line x1="282" y1="150" x2="250" y2="150" class="link" marker-end="url(#arrow)"/><rect x="30" y="95" width="216" height="110" rx="8" class="interrupt"/><text x="230" y="124" class="date" text-anchor="end">1958</text><text x="230" y="155" class="body" text-anchor="end">منسوخی؛</text><text x="230" y="179" class="body" text-anchor="end">مارشل لا</text><line x1="138" y1="205" x2="138" y2="241" class="link" marker-end="url(#arrow)"/><rect x="30" y="245" width="216" height="110" rx="8" class="accent"/><text x="230" y="274" class="date" text-anchor="end">1962</text><text x="230" y="305" class="body" text-anchor="end">صدارتی</text><text x="230" y="329" class="body" text-anchor="end">آئین</text><line x1="246" y1="300" x2="278" y2="300" class="link" marker-end="url(#arrow)"/><rect x="282" y="245" width="216" height="110" rx="8" class="interrupt"/><text x="482" y="274" class="date" text-anchor="end">1969</text><text x="482" y="305" class="body" text-anchor="end">منسوخی؛</text><text x="482" y="329" class="body" text-anchor="end">مارشل لا</text><line x1="498" y1="300" x2="530" y2="300" class="link" marker-end="url(#arrow)"/><rect x="534" y="245" width="216" height="110" rx="8" class="accent"/><text x="734" y="274" class="date" text-anchor="end">1972</text><text x="734" y="305" class="body" text-anchor="end">عبوری</text><text x="734" y="329" class="body" text-anchor="end">آئین</text><line x1="642" y1="355" x2="642" y2="391" class="link" marker-end="url(#arrow)"/><rect x="534" y="395" width="216" height="110" rx="8" class="accent"/><text x="734" y="424" class="date" text-anchor="end">1973</text><text x="734" y="455" class="body" text-anchor="end">پارلیمانی</text><text x="734" y="479" class="body" text-anchor="end">آئین</text><line x1="534" y1="450" x2="502" y2="450" class="link" marker-end="url(#arrow)"/><rect x="282" y="395" width="216" height="110" rx="8" class="accent"/><text x="482" y="424" class="date" text-anchor="end">1985</text><text x="482" y="455" class="body" text-anchor="end">آرٹیکل 2A:</text><text x="482" y="479" class="body" text-anchor="end">نافذ العمل حیثیت</text><line x1="282" y1="450" x2="250" y2="450" class="link" marker-end="url(#arrow)"/><rect x="30" y="395" width="216" height="110" rx="8" class="accent"/><text x="230" y="424" class="date" text-anchor="end">2010</text><text x="230" y="455" class="body" text-anchor="end">اٹھارہویں</text><text x="230" y="479" class="body" text-anchor="end">ترمیم</text><text x="750" y="539" class="small" text-anchor="end">1973 کا دیباچہ، 1985 کی نافذ العمل شمولیت سے پہلے ہے۔</text><text x="18" y="566" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
