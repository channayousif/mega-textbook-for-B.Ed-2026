<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 695" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسلامی دفعات اور متعلقہ تحفظات</title><desc id="d">اسلامی آئینی دفعات کو ان کے آرٹیکلز اور کاموں سے جوڑا گیا ہے؛ کونسل کے مشورے کو قانون سازی سے الگ کیا گیا، اقلیتی تحفظات دکھائے گئے اور آرٹیکل 2A کی تاریخ 1985 درج ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="695"/><text x="752" y="35" class="h" text-anchor="end">اسلامی دفعات: کام اور تحفظات</text><text x="752" y="64" class="small" text-anchor="end">آرٹیکل، ادارہ، اقدام اور تاریخ ساتھ پڑھیں۔</text><rect x="235" y="93" width="310" height="70" rx="8" class="accent"/><text x="390" y="123" class="h" text-anchor="middle">اسلامی آئینی</text><text x="390" y="148" class="h" text-anchor="middle">دفعات</text><rect x="412" y="210" width="340" height="85" rx="8" class="panel"/><text x="736" y="237" class="h" text-anchor="end">آرٹیکل 2</text><text x="736" y="263" class="body" text-anchor="end">اسلام بطور ریاستی مذہب</text><rect x="28" y="210" width="340" height="85" rx="8" class="panel"/><text x="352" y="237" class="h" text-anchor="end">آرٹیکل 31</text><text x="352" y="263" class="body" text-anchor="end">مسلم زندگی کی پالیسی</text><rect x="412" y="350" width="340" height="110" rx="8" class="panel"/><text x="736" y="377" class="h" text-anchor="end">آرٹیکل 227</text><text x="736" y="403" class="small" text-anchor="end">قوانین کی مطابقت</text><text x="736" y="427" class="small" text-anchor="end">شق (3): غیر مسلموں کے شخصی</text><text x="736" y="451" class="small" text-anchor="end">قوانین اور شہریت کا تحفظ</text><rect x="28" y="350" width="340" height="110" rx="8" class="panel"/><text x="352" y="377" class="h" text-anchor="end">آرٹیکلز 228-231</text><text x="352" y="403" class="small" text-anchor="end">کونسل: مشورے اور سفارشات</text><text x="352" y="427" class="small" text-anchor="end">قانون سازی متعلقہ</text><text x="352" y="451" class="small" text-anchor="end">مقننہ کے پاس رہتی ہے</text><path d="M390 163 V185 H582 V206 M390 185 H198 V206 M390 185 V322 H582 V346 M390 322 H198 V346" class="link"/><rect x="412" y="510" width="340" height="102" rx="8" class="accent"/><text x="736" y="539" class="h" text-anchor="end">آرٹیکل 2A: شمولیت 1985</text><text x="736" y="566" class="body" text-anchor="end">قراردادِ مقاصد کو ملی</text><text x="736" y="590" class="body" text-anchor="end">نافذ العمل آئینی حیثیت</text><rect x="28" y="510" width="340" height="102" rx="8" class="panel"/><text x="352" y="539" class="h" text-anchor="end">متعلقہ تحفظات</text><text x="352" y="566" class="body" text-anchor="end">آرٹیکل 20: مذہبی آزادی</text><text x="352" y="590" class="body" text-anchor="end">آرٹیکل 22: تعلیمی تحفظات</text><path d="M390 322 V486 H582 V506 M390 486 H198 V506" class="link"/><text x="752" y="652" class="small" text-anchor="end">سفارش قانون بننا نہیں۔ تاریخ والا متن دیکھیں۔</text><text x="18" y="681" class="wm" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
