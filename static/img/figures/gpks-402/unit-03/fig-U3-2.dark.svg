<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 690" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three constitutional frameworks</title><desc id="d">Comparison of three constitutional frameworks: parliamentary in 1956 and 1973, presidential in 1962, all formally federal, with two central chambers introduced in 1973 and a dated note on rights under the 1962 framework.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.interrupt{fill:var(--a3-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700}.date{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="690"/><text x="25" y="34" class="h" text-anchor="start">Comparing constitutional frameworks</text><text x="25" y="62" class="small" text-anchor="start">Compare the same feature across all three columns.</text><rect x="24" y="88" width="166" height="54" rx="8" class="accent"/><text x="36" y="122" class="h" text-anchor="start">Feature</text><rect x="190" y="88" width="188" height="54" rx="8" class="accent"/><text x="202" y="122" class="h" text-anchor="start">1956</text><rect x="378" y="88" width="188" height="54" rx="8" class="accent"/><text x="390" y="122" class="h" text-anchor="start">1962</text><rect x="566" y="88" width="188" height="54" rx="8" class="accent"/><text x="578" y="122" class="h" text-anchor="start">1973 framework</text><rect x="24" y="142" width="166" height="86" rx="8" class="panel"/><text x="36" y="176" class="body" text-anchor="start">Federal form</text><rect x="190" y="142" width="188" height="86" rx="8" class="panel"/><text x="202" y="176" class="body" text-anchor="start">Federal</text><rect x="378" y="142" width="188" height="86" rx="8" class="panel"/><text x="390" y="173" class="body" text-anchor="start">Federal; strong</text><text x="390" y="197" class="body" text-anchor="start">central control</text><rect x="566" y="142" width="188" height="86" rx="8" class="panel"/><text x="578" y="173" class="body" text-anchor="start">Federal; two</text><text x="578" y="197" class="body" text-anchor="start">representative bases</text><rect x="24" y="228" width="166" height="86" rx="8" class="panel"/><text x="36" y="262" class="body" text-anchor="start">Executive</text><rect x="190" y="228" width="188" height="86" rx="8" class="panel"/><text x="202" y="259" class="body" text-anchor="start">Parliamentary;</text><text x="202" y="283" class="body" text-anchor="start">Prime Minister</text><rect x="378" y="228" width="188" height="86" rx="8" class="panel"/><text x="390" y="259" class="body" text-anchor="start">Presidential;</text><text x="390" y="283" class="body" text-anchor="start">President</text><rect x="566" y="228" width="188" height="86" rx="8" class="panel"/><text x="578" y="259" class="body" text-anchor="start">Parliamentary;</text><text x="578" y="283" class="body" text-anchor="start">Prime Minister</text><rect x="24" y="314" width="166" height="86" rx="8" class="panel"/><text x="36" y="345" class="body" text-anchor="start">Central</text><text x="36" y="369" class="body" text-anchor="start">chambers</text><rect x="190" y="314" width="188" height="86" rx="8" class="panel"/><text x="202" y="348" class="body" text-anchor="start">One</text><rect x="378" y="314" width="188" height="86" rx="8" class="panel"/><text x="390" y="348" class="body" text-anchor="start">One</text><rect x="566" y="314" width="188" height="86" rx="8" class="panel"/><text x="578" y="345" class="body" text-anchor="start">Two: National</text><text x="578" y="369" class="body" text-anchor="start">Assembly and Senate</text><rect x="24" y="400" width="166" height="86" rx="8" class="panel"/><text x="36" y="431" class="body" text-anchor="start">Islamic</text><text x="36" y="455" class="body" text-anchor="start">provisions</text><rect x="190" y="400" width="188" height="86" rx="8" class="panel"/><text x="202" y="431" class="body" text-anchor="start">Islamic Republic;</text><text x="202" y="455" class="body" text-anchor="start">law conformity</text><rect x="378" y="400" width="188" height="86" rx="8" class="panel"/><text x="390" y="431" class="body" text-anchor="start">Advisory Council;</text><text x="390" y="455" class="body" text-anchor="start">title changed 1964</text><rect x="566" y="400" width="188" height="86" rx="8" class="panel"/><text x="578" y="431" class="body" text-anchor="start">State religion;</text><text x="578" y="455" class="body" text-anchor="start">Part IX provisions</text><rect x="24" y="486" width="166" height="86" rx="8" class="panel"/><text x="36" y="520" class="body" text-anchor="start">Rights</text><rect x="190" y="486" width="188" height="86" rx="8" class="panel"/><text x="202" y="520" class="body" text-anchor="start">Rights chapter</text><rect x="378" y="486" width="188" height="86" rx="8" class="panel"/><text x="390" y="517" class="body" text-anchor="start">Principles first;</text><text x="390" y="541" class="body" text-anchor="start">rights added 1964</text><rect x="566" y="486" width="188" height="86" rx="8" class="panel"/><text x="578" y="517" class="body" text-anchor="start">Rights chapter;</text><text x="578" y="541" class="body" text-anchor="start">later additions</text><text x="25" y="620" class="small" text-anchor="start">1964: First Amendment Act, 1963, effective January 1964.</text><text x="25" y="644" class="small" text-anchor="start">1973 column shows the framework, not a claim of unchanged text.</text><text x="762" y="676" class="wm" aria-hidden="true" text-anchor="end">textbook.com.pk</text></svg>
