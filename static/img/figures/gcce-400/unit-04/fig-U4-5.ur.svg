<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">اورنگی پائلٹ پروجیکٹ کا خطِ زمانی</title><desc id="d">اورنگی پائلٹ پروجیکٹ کا خطِ زمانی: 1980 میں قیام؛ 1983 سے 1993 کے درمیان نالیاں بنانے والی گلیوں میں شیر خوار بچوں کی اموات 128 سے گر کر 37 فی ہزار ہونا؛ 1988 میں چار الگ ادارے بننا؛ 1994 میں نوجوانوں کا میپنگ پروگرام اور سندھ کچی آبادی اتھارٹی کا یہ طریقہ اپنانا؛ 2004 میں کراچی کے نالوں پر فوکل گروپ میں شمولیت؛ اور 2006 تک پاکستان بھر کے 248 دیگر مقامات پر اس طریقے کا استعمال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:14px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.cell{font-size:13px;fill:var(--ink)}
.small{font-size:13px;fill:var(--muted)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="390" y="28" text-anchor="middle">اورنگی پائلٹ پروجیکٹ: 1980 سے 2006</text><line class="stroke" x1="756" y1="200" x2="24" y2="200" marker-end="url(#arrow)"/><rect class="panel" x="530" y="46" width="230" height="104" rx="10"/><text class="sh" x="748" y="68" text-anchor="end">1980</text><text class="cell" x="748" y="88" text-anchor="end">کراچی میں پروجیکٹ کا آغاز،</text><text class="cell" x="748" y="104" text-anchor="end">تاکہ ایسے حل تلاش ہوں جنہیں</text><text class="cell" x="748" y="120" text-anchor="end">لوگ خود چلا، فنانس کر اور بنا سکیں</text><circle class="panel-a" cx="710" cy="200" r="7"/><line class="grid" x1="645" y1="150" x2="710" y2="193"/><rect class="panel" x="530" y="254" width="230" height="104" rx="10"/><text class="sh" x="748" y="276" text-anchor="end">1983 سے 1993</text><text class="cell" x="748" y="296" text-anchor="end">نالیاں بنانے والی گلیوں میں</text><text class="cell" x="748" y="312" text-anchor="end">شیر خوار بچوں کی اموات 128</text><text class="cell" x="748" y="328" text-anchor="end">سے گر کر 37 فی ہزار رہ گئیں</text><circle class="panel-a" cx="580" cy="200" r="7"/><line class="grid" x1="580" y1="207" x2="645" y2="254"/><rect class="panel" x="275" y="46" width="230" height="104" rx="10"/><text class="sh" x="493" y="68" text-anchor="end">1988</text><text class="cell" x="493" y="88" text-anchor="end">پروجیکٹ چار الگ اداروں میں</text><text class="cell" x="493" y="104" text-anchor="end">تقسیم ہوا، بشمول ریسرچ</text><text class="cell" x="493" y="120" text-anchor="end">اینڈ ٹریننگ انسٹیٹیوٹ</text><circle class="panel-a" cx="450" cy="200" r="7"/><line class="grid" x1="390" y1="150" x2="450" y2="193"/><rect class="panel" x="275" y="254" width="230" height="104" rx="10"/><text class="sh" x="493" y="276" text-anchor="end">1994</text><text class="cell" x="493" y="296" text-anchor="end">نوجوانوں کا میپنگ پروگرام شروع؛</text><text class="cell" x="493" y="312" text-anchor="end">سندھ کچی آبادی اتھارٹی نے</text><text class="cell" x="493" y="328" text-anchor="end">او پی پی کا طریقہ اپنایا</text><circle class="panel-a" cx="320" cy="200" r="7"/><line class="grid" x1="320" y1="207" x2="390" y2="254"/><rect class="panel" x="20" y="46" width="230" height="104" rx="10"/><text class="sh" x="238" y="68" text-anchor="end">2004</text><text class="cell" x="238" y="88" text-anchor="end">نکاسی آب کے نقشوں کی بدولت</text><text class="cell" x="238" y="104" text-anchor="end">کراچی نالوں کے فوکل گروپ میں</text><text class="cell" x="238" y="120" text-anchor="end">شراکت کی دعوت ملی</text><circle class="panel-a" cx="190" cy="200" r="7"/><line class="grid" x1="135" y1="150" x2="190" y2="193"/><rect class="panel" x="20" y="254" width="230" height="104" rx="10"/><text class="sh" x="238" y="276" text-anchor="end">2006 تک</text><text class="cell" x="238" y="296" text-anchor="end">یہ طریقہ کار پاکستان بھر کے</text><text class="cell" x="238" y="312" text-anchor="end">دیگر 248 مقامات پر استعمال</text><text class="cell" x="238" y="328" text-anchor="end">ہونا شروع ہوا</text><circle class="panel-a" cx="60" cy="200" r="7"/><line class="grid" x1="60" y1="207" x2="135" y2="254"/><text class="small" x="756" y="392" text-anchor="end">ماخذ: حسن (2006)۔ تاریخیں اور اعداد و شمار جیسا کہ مضمون میں رپورٹ ہوئے۔</text><text class="wm" x="12" y="410" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>