<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">تصوراتی خاکہ: اخلاقی شہری سرگرمی مرکز میں اور اس سے وابستہ پانچ اقدار مع پاکستانی مثالیں</title><desc id="d">تصوراتی خاکہ جس میں اخلاقی شہری سرگرمی مرکز میں ہے اور پانچ متعلقہ اقدار مع پاکستانی مثالیں جڑی ہیں: جواب دہی، جیسے یونین کونسل چیئرمین سے مرمت کی رپورٹ مانگنا؛ عدم تشدد، جیسے دفعہ 16 کے تحت پرامن اور غیر مسلح اجتماع؛ سچائی، جیسے غیر مصدقہ افواہ پھیلانے سے گریز؛ مخالفین اور عہدیداروں کا احترام؛ اور ماؤں، اقلیتوں اور معذور شاگردوں کی شمولیت۔ ایک بیرونی حلقہ کہتا ہے دوسروں کو نقصان نہ پہنچائیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:14px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.cell{font-size:13px;fill:var(--ink)}
.small{font-size:13px;fill:var(--muted)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><rect class="dash" x="10" y="10" width="760" height="512" rx="24"/><text class="sh" x="390" y="36" text-anchor="middle">دوسروں کو نقصان نہ پہنچائیں</text><ellipse class="panel-a" cx="390" cy="300" rx="110" ry="44"/><text class="h" x="390" y="296" text-anchor="middle">اخلاقی شہری</text><text class="h" x="390" y="318" text-anchor="middle">سرگرمی</text><rect class="panel" x="275" y="50" width="230" height="112" rx="10"/><text class="sh" x="493" y="74" text-anchor="end">جواب دہی</text><text class="cell" x="493" y="98" text-anchor="end">فرائض اور فیصلوں کا حساب دینا؛</text><text class="cell" x="493" y="118" text-anchor="end">چیئرمین سے رپورٹ پیش</text><text class="cell" x="493" y="138" text-anchor="end">کرنے کا مطالبہ کرنا</text><rect class="panel" x="525" y="180" width="230" height="112" rx="10"/><text class="sh" x="743" y="204" text-anchor="end">عدم تشدد</text><text class="cell" x="743" y="228" text-anchor="end">لوگوں یا املاک کو نقصان نہیں،</text><text class="cell" x="743" y="248" text-anchor="end">نہ دھمکیاں؛ پرامن اور</text><text class="cell" x="743" y="268" text-anchor="end">غیر مسلح اجتماع (دفعہ 16)</text><rect class="panel" x="470" y="395" width="230" height="112" rx="10"/><text class="sh" x="688" y="419" text-anchor="end">سچائی اور دیانت</text><text class="cell" x="688" y="443" text-anchor="end">صرف سچے اور مصدقہ دعوے؛</text><text class="cell" x="688" y="463" text-anchor="end">ہیڈ ٹیچر کے بارے میں</text><text class="cell" x="688" y="483" text-anchor="end">غیر ثابت شدہ افواہ نہیں</text><rect class="panel" x="80" y="395" width="230" height="112" rx="10"/><text class="sh" x="298" y="419" text-anchor="end">احترام</text><text class="cell" x="298" y="443" text-anchor="end">مخالفین اور حکام کی عزت؛</text><text class="cell" x="298" y="463" text-anchor="end">بدزبانی یا نفرت انگیز</text><text class="cell" x="298" y="483" text-anchor="end">گفتگو سے پرہیز</text><rect class="panel" x="25" y="180" width="230" height="112" rx="10"/><text class="sh" x="243" y="204" text-anchor="end">شمولیت</text><text class="cell" x="243" y="228" text-anchor="end">ہر متاثرہ گروہ کی آواز ہو:</text><text class="cell" x="243" y="248" text-anchor="end">مائیں، اقلیتیں اور</text><text class="cell" x="243" y="268" text-anchor="end">معذور شاگرد</text><line class="stroke" x1="390" y1="255" x2="390" y2="164" marker-end="url(#arrow)"/><line class="stroke" x1="488" y1="284" x2="521" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="292" y1="284" x2="259" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="452" y1="336" x2="520" y2="391" marker-end="url(#arrow)"/><line class="stroke" x1="328" y1="336" x2="262" y2="391" marker-end="url(#arrow)"/><text class="wm" x="12" y="550" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>