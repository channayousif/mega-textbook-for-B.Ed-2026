<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing six methods for the same aim of a working school hand pump</title><desc id="d">Table comparing six methods for the same aim of a working school hand pump. A signed application, a peaceful delegation that includes mothers, and a public report-back meeting are ethical, keeping accountability and inclusion. Blocking the highway, an unproven theft accusation online, and filming pupils without permission are unethical, breaking do no harm, honesty, respect, and consent.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:15px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.small{font-size:13px;fill:var(--ink)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><text class="h" x="390" y="30" text-anchor="middle">Same aim: a working hand pump at the village girls' school</text><rect class="panel" x="20" y="48" width="740" height="38"/><text class="sh" x="30" y="72">Method</text><text class="sh" x="400" y="72">Ethical?</text><text class="sh" x="540" y="72">Value kept or broken</text><rect class="panel-a" x="20" y="86" width="740" height="58"/><text class="body" x="30" y="110">Signed application to the</text><text class="body" x="30" y="128">union council chairman</text><path class="yes" d="M404,115 l5,6 l10,-12"/><text class="body" x="428" y="120">Ethical</text><text class="body" x="540" y="110">Keeps accountability</text><rect class="panel-a" x="20" y="144" width="740" height="58"/><text class="body" x="30" y="168">Peaceful delegation of five parents,</text><text class="body" x="30" y="186">including two mothers</text><path class="yes" d="M404,173 l5,6 l10,-12"/><text class="body" x="428" y="178">Ethical</text><text class="body" x="540" y="168">Keeps inclusion and</text><text class="body" x="540" y="186">non-violence</text><rect class="panel-a" x="20" y="202" width="740" height="58"/><text class="body" x="30" y="226">Public meeting where the chairman</text><text class="body" x="30" y="244">reports on a fixed date</text><path class="yes" d="M404,231 l5,6 l10,-12"/><text class="body" x="428" y="236">Ethical</text><text class="body" x="540" y="226">Keeps accountability</text><text class="body" x="30" y="284">Blocking the highway and</text><text class="body" x="30" y="302">burning tyres</text><path class="no" d="M405,282 l13,13 M418,282 l-13,13"/><text class="body" x="428" y="294">Unethical</text><text class="body" x="540" y="284">Breaks do no harm and</text><text class="body" x="540" y="302">non-violence</text><text class="body" x="30" y="342">Video accusing the head teacher</text><text class="body" x="30" y="360">of theft without proof</text><path class="no" d="M405,340 l13,13 M418,340 l-13,13"/><text class="body" x="428" y="352">Unethical</text><text class="body" x="540" y="342">Breaks honesty and</text><text class="body" x="540" y="360">respect</text><text class="body" x="30" y="400">Filming pupils for social media</text><text class="body" x="30" y="418">without parents' permission</text><path class="no" d="M405,398 l13,13 M418,398 l-13,13"/><text class="body" x="428" y="410">Unethical</text><text class="body" x="540" y="400">Breaks consent and</text><text class="body" x="540" y="418">privacy</text><line class="grid" x1="20" y1="86" x2="760" y2="86"/><line class="grid" x1="20" y1="144" x2="760" y2="144"/><line class="grid" x1="20" y1="202" x2="760" y2="202"/><line class="grid" x1="20" y1="260" x2="760" y2="260"/><line class="grid" x1="20" y1="318" x2="760" y2="318"/><line class="grid" x1="20" y1="376" x2="760" y2="376"/><line class="grid" x1="20" y1="434" x2="760" y2="434"/><rect class="stroke" x="20" y="48" width="740" height="386"/><line class="grid" x1="390" y1="48" x2="390" y2="434"/><line class="grid" x1="530" y1="48" x2="530" y2="434"/><text class="cap" x="20" y="460">A tick marks an ethical method, a cross an unethical one.</text><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
