<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a school at the centre of its community, linked by two-way arrows to parents and families, the school management committee, local organisations such as health workers and community halls, and local government such as the union council and education offices</title><desc id="d">Diagram of a school at the centre of its community, linked by two-way arrows to parents and families, the school management committee, local organisations such as health workers and community halls, and local government such as the union council and education offices. Each link shows what flows in each direction, and a dotted circle labelled the community surrounds them all.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:15px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.small{font-size:13px;fill:var(--ink)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><rect class="dash" x="8" y="30" width="764" height="520" rx="40"/><text class="sh" x="390" y="56" text-anchor="middle">The community</text><rect class="panel-a" x="300" y="250" width="180" height="80" rx="10"/><text class="h" x="390" y="284" text-anchor="middle">School</text><text class="small" x="390" y="306" text-anchor="middle">a community institution</text><rect class="panel" x="20" y="74" width="300" height="118" rx="10"/><text class="sh" x="30" y="96">Parents and families</text><text class="small" x="30" y="116">To parents: reports, meetings,</text><text class="small" x="30" y="132">home visits</text><text class="small" x="30" y="148">To school: support learning at</text><text class="small" x="30" y="164">home, volunteer, raise concerns</text><rect class="panel" x="460" y="74" width="300" height="118" rx="10"/><text class="sh" x="470" y="96">School management committee</text><text class="small" x="470" y="116">Mainly parents chosen by the</text><text class="small" x="470" y="132">community; maintains the building,</text><text class="small" x="470" y="148">follows up absent pupils, checks</text><text class="small" x="470" y="164">teacher punctuality</text><rect class="panel" x="20" y="400" width="300" height="118" rx="10"/><text class="sh" x="30" y="422">Local organisations</text><text class="small" x="30" y="442">Health workers, mosque or</text><text class="small" x="30" y="458">community hall, NGOs: offer talks,</text><text class="small" x="30" y="474">space and help with events</text><rect class="panel" x="460" y="400" width="300" height="118" rx="10"/><text class="sh" x="470" y="422">Local government</text><text class="small" x="470" y="442">Union council and education</text><text class="small" x="470" y="458">offices: repairs, funds and</text><text class="small" x="470" y="474">accountability for services</text><line class="stroke" x1="290" y1="196" x2="330" y2="246" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="196" x2="450" y2="246" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line class="stroke" x1="290" y1="396" x2="330" y2="334" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="396" x2="450" y2="334" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="cap" x="390" y="372" text-anchor="middle">Two-way links</text><text class="wm" x="768" y="570" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
