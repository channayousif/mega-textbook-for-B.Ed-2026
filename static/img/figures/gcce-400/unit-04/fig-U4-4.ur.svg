<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">اسکول برادری کے مرکز میں: دو طرفہ تعلقات کا خاکہ</title><desc id="d">خاکہ جس میں اسکول اپنی برادری کے مرکز میں ہے اور دو طرفہ تیروں کے ذریعے والدین و خاندان، اسکول مینجمنٹ کمیٹی، مقامی تنظیموں (جیسے صحت کارکن اور مساجد یا کمیونٹی ہال)، اور مقامی حکومت (جیسے یونین کونسل اور تعلیمی دفاتر) سے جڑا ہے۔ ہر رابطہ دکھاتا ہے کہ دونوں طرف کیا تبادلہ ہوتا ہے، اور ایک نقطہ دار دائرہ برادری سب کے گرد ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:14px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.cell{font-size:13px;fill:var(--ink)}
.small{font-size:13px;fill:var(--muted)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><rect class="dash" x="8" y="30" width="764" height="520" rx="40"/><text class="sh" x="390" y="56" text-anchor="middle">برادری</text><rect class="panel-a" x="300" y="250" width="180" height="80" rx="10"/><text class="h" x="390" y="284" text-anchor="middle">اسکول</text><text class="small" x="390" y="306" text-anchor="middle">برادری کا ایک ادارہ</text><rect class="panel" x="460" y="74" width="300" height="118" rx="10"/><text class="sh" x="748" y="96" text-anchor="end">والدین اور خاندان</text><text class="cell" x="748" y="118" text-anchor="end">والدین کو: رپورٹس، اجلاس، گھر کا دورہ</text><text class="cell" x="748" y="136" text-anchor="end">اسکول کو: گھر پر تعلیم میں مدد،</text><text class="cell" x="748" y="154" text-anchor="end">رضاکارانہ خدمت، خدشات اٹھانا</text><rect class="panel" x="20" y="74" width="300" height="118" rx="10"/><text class="sh" x="308" y="96" text-anchor="end">اسکول مینجمنٹ کمیٹی</text><text class="cell" x="308" y="118" text-anchor="end">برادری کے منتخب کردہ والدین؛</text><text class="cell" x="308" y="136" text-anchor="end">عمارت کی دیکھ بھال، غیر حاضر بچوں</text><text class="cell" x="308" y="154" text-anchor="end">کی پیروی، اساتذہ کی حاضری کی جانچ</text><rect class="panel" x="460" y="400" width="300" height="118" rx="10"/><text class="sh" x="748" y="422" text-anchor="end">مقامی تنظیمیں</text><text class="cell" x="748" y="444" text-anchor="end">صحت کارکن، مسجد یا کمیونٹی ہال، این جی اوز:</text><text class="cell" x="748" y="462" text-anchor="end">معلوماتی گفتگو، جگہ اور تقاریب</text><text class="cell" x="748" y="480" text-anchor="end">میں عملی مدد</text><rect class="panel" x="20" y="400" width="300" height="118" rx="10"/><text class="sh" x="308" y="422" text-anchor="end">مقامی حکومت</text><text class="cell" x="308" y="444" text-anchor="end">یونین کونسل اور تعلیمی دفاتر:</text><text class="cell" x="308" y="462" text-anchor="end">مرمت، فنڈز اور بنیادی سہولیات</text><text class="cell" x="308" y="480" text-anchor="end">کی جواب دہی</text><line class="stroke" x1="490" y1="196" x2="450" y2="246" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line class="stroke" x1="290" y1="196" x2="330" y2="246" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="396" x2="450" y2="334" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line class="stroke" x1="290" y1="396" x2="330" y2="334" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="small" x="390" y="372" text-anchor="middle">دو طرفہ روابط</text><text class="wm" x="12" y="570" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>