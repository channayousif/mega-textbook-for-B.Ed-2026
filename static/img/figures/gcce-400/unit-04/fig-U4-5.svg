<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of the Orangi Pilot Project</title><desc id="d">Timeline of the Orangi Pilot Project: set up in 1980; infant mortality in lanes that built sewers falling from 128 to 37 per 1,000 between 1983 and 1993; becoming four institutions in 1988; a youth mapping programme and adoption of its method by the Sindh Katchi Abadi Authority in 1994; an invitation in 2004 to join the Karachi district government's group on nalas and drains; and use of the method in 248 other locations by 2006.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:15px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.small{font-size:13px;fill:var(--ink)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="390" y="28" text-anchor="middle">The Orangi Pilot Project, 1980 to 2006</text><line class="stroke" x1="24" y1="200" x2="760" y2="200" marker-end="url(#arrow)"/><rect class="panel" x="20" y="46" width="230" height="104" rx="10"/><text class="sh" x="30" y="68">1980</text><text class="small" x="30" y="88">Project set up in Karachi</text><text class="small" x="30" y="104">to find solutions people</text><text class="small" x="30" y="120">could manage, finance</text><text class="small" x="30" y="136">and build</text><circle class="panel-a" cx="60" cy="200" r="7"/><line class="grid" x1="135" y1="150" x2="60" y2="193"/><rect class="panel" x="20" y="254" width="230" height="104" rx="10"/><text class="sh" x="30" y="276">1983 to 1993</text><text class="small" x="30" y="296">Infant mortality in lanes</text><text class="small" x="30" y="312">that built sewers falls</text><text class="small" x="30" y="328">from 128 to 37 per 1,000</text><circle class="panel-a" cx="190" cy="200" r="7"/><line class="grid" x1="190" y1="207" x2="135" y2="254"/><rect class="panel" x="275" y="46" width="230" height="104" rx="10"/><text class="sh" x="285" y="68">1988</text><text class="small" x="285" y="88">The project becomes four</text><text class="small" x="285" y="104">separate institutions,</text><text class="small" x="285" y="120">including the Research</text><text class="small" x="285" y="136">and Training Institute</text><circle class="panel-a" cx="320" cy="200" r="7"/><line class="grid" x1="390" y1="150" x2="320" y2="193"/><rect class="panel" x="275" y="254" width="230" height="104" rx="10"/><text class="sh" x="285" y="276">1994</text><text class="small" x="285" y="296">Youth mapping programme</text><text class="small" x="285" y="312">begins; Sindh Katchi Abadi</text><text class="small" x="285" y="328">Authority adopts the</text><text class="small" x="285" y="344">OPP method</text><circle class="panel-a" cx="450" cy="200" r="7"/><line class="grid" x1="450" y1="207" x2="390" y2="254"/><rect class="panel" x="530" y="46" width="230" height="104" rx="10"/><text class="sh" x="540" y="68">2004</text><text class="small" x="540" y="88">Its drainage maps lead to</text><text class="small" x="540" y="104">an invitation to join</text><text class="small" x="540" y="120">Karachi's group on</text><text class="small" x="540" y="136">nalas and drains</text><circle class="panel-a" cx="580" cy="200" r="7"/><line class="grid" x1="645" y1="150" x2="580" y2="193"/><rect class="panel" x="530" y="254" width="230" height="104" rx="10"/><text class="sh" x="540" y="276">By 2006</text><text class="small" x="540" y="296">Method used in 248 other</text><text class="small" x="540" y="312">locations in Pakistan</text><circle class="panel-a" cx="710" cy="200" r="7"/><line class="grid" x1="710" y1="207" x2="645" y2="254"/><text class="cap" x="20" y="392">Source: Hasan (2006). Dates and figures as reported in the article.</text><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
