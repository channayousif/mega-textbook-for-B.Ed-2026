<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with ethical civic engagement at the centre and five linked values, each with a Pakistani example</title><desc id="d">Concept map with ethical civic engagement at the centre and five linked values, each with a Pakistani example: accountability, such as asking the union council chairman to report on a repair; non-violence, such as a peaceful unarmed gathering under Article 16; honesty, such as refusing to spread an unproven rumour; respect for opponents and officials; and inclusion of mothers, minorities and pupils with disabilities. An outer ring reads do no harm to others.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:15px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.small{font-size:13px;fill:var(--ink)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><rect class="dash" x="10" y="10" width="760" height="512" rx="24"/><text class="sh" x="390" y="36" text-anchor="middle">Do no harm to others</text><ellipse class="panel-a" cx="390" cy="300" rx="110" ry="44"/><text class="h" x="390" y="296" text-anchor="middle">Ethical civic</text><text class="h" x="390" y="316" text-anchor="middle">engagement</text><rect class="panel" x="275" y="50" width="230" height="112" rx="10"/><text class="sh" x="285" y="72">Accountability</text><text class="small" x="285" y="92">Answer for duties and</text><text class="small" x="285" y="108">decisions; ask the</text><text class="small" x="285" y="124">chairman to report back</text><rect class="panel" x="525" y="180" width="230" height="112" rx="10"/><text class="sh" x="535" y="202">Non-violence</text><text class="small" x="535" y="222">No harm to people or</text><text class="small" x="535" y="238">property, no threats;</text><text class="small" x="535" y="254">a peaceful, unarmed</text><text class="small" x="535" y="270">gathering (Article 16)</text><rect class="panel" x="470" y="395" width="230" height="112" rx="10"/><text class="sh" x="480" y="417">Honesty</text><text class="small" x="480" y="437">Only true, checked</text><text class="small" x="480" y="453">claims; no unproven</text><text class="small" x="480" y="469">rumour about the</text><text class="small" x="480" y="485">head teacher</text><rect class="panel" x="80" y="395" width="230" height="112" rx="10"/><text class="sh" x="90" y="417">Respect</text><text class="small" x="90" y="437">Dignity for opponents</text><text class="small" x="90" y="453">and officials; no abuse</text><text class="small" x="90" y="469">or hate speech</text><rect class="panel" x="25" y="180" width="230" height="112" rx="10"/><text class="sh" x="35" y="202">Inclusion</text><text class="small" x="35" y="222">Every affected group has</text><text class="small" x="35" y="238">a voice: mothers,</text><text class="small" x="35" y="254">minorities, pupils with</text><text class="small" x="35" y="270">disabilities</text><line class="stroke" x1="390" y1="255" x2="390" y2="164" marker-end="url(#arrow)"/><line class="stroke" x1="488" y1="284" x2="521" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="292" y1="284" x2="259" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="452" y1="336" x2="520" y2="391" marker-end="url(#arrow)"/><line class="stroke" x1="328" y1="336" x2="262" y2="391" marker-end="url(#arrow)"/><text class="wm" x="768" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
