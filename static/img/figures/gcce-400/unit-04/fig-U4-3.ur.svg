<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">برادری کی شمولیت کے پانچ مرحلہ وار چکر کا فلو چارٹ</title><desc id="d">برادری کی شمولیت کے پانچ مرحلہ وار چکر کا فلو چارٹ: ضرورت کی شناخت کریں، تمام متاثرہ افراد کو متحرک کریں، مل کر منصوبہ بندی کریں، عمل درآمد کریں، اور کھل کر رپورٹ دے کر جائزہ لیں۔ جائزے سے واپس اگلی ضرورت کی شناخت کی طرف ایک تیر جاتا ہے۔ مرکز میں ایک نوٹ ہے کہ شمولیت اور جواب دہی ہر مرحلے پر لاگو ہوتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:14px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.cell{font-size:13px;fill:var(--ink)}
.small{font-size:13px;fill:var(--muted)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><rect class="panel" x="285" y="26" width="210" height="96" rx="10"/><text class="sh" x="483" y="48" text-anchor="end">1. ضرورت کی شناخت</text><text class="cell" x="483" y="70" text-anchor="end">رہائشیوں کی سنیں اور حقائق</text><text class="cell" x="483" y="88" text-anchor="end">اکٹھے کریں: فصل پر لڑکیاں</text><text class="cell" x="483" y="106" text-anchor="end">کیوں غیر حاضر ہوتی ہیں</text><rect class="panel" x="25" y="156" width="210" height="96" rx="10"/><text class="sh" x="223" y="178" text-anchor="end">2. متحرک کرنا</text><text class="cell" x="223" y="200" text-anchor="end">ہر متاثرہ گروہ کو مناسب</text><text class="cell" x="223" y="218" text-anchor="end">وقت، جگہ اور زبان</text><text class="cell" x="223" y="236" text-anchor="end">میں مدعو کریں</text><rect class="panel" x="115" y="386" width="210" height="96" rx="10"/><text class="sh" x="313" y="408" text-anchor="end">3. مل کر منصوبہ بندی</text><text class="cell" x="313" y="430" text-anchor="end">مقاصد، کرداروں، رقم اور</text><text class="cell" x="313" y="448" text-anchor="end">ٹائم ٹیبل پر اتفاق کریں</text><rect class="panel" x="455" y="386" width="210" height="96" rx="10"/><text class="sh" x="653" y="408" text-anchor="end">4. عمل درآمد</text><text class="cell" x="653" y="430" text-anchor="end">منصوبے کو پورا کریں</text><text class="cell" x="653" y="448" text-anchor="end">اور ریکارڈ رکھیں</text><rect class="panel" x="545" y="156" width="210" height="96" rx="10"/><text class="sh" x="743" y="178" text-anchor="end">5. جائزہ لینا</text><text class="cell" x="743" y="200" text-anchor="end">دوبارہ ملیں، کھل کر رپورٹ</text><text class="cell" x="743" y="218" text-anchor="end">دیں، سیکھیں اور درست کریں</text><line class="stroke" x1="283" y1="80" x2="160" y2="154" marker-end="url(#arrow)"/><line class="stroke" x1="140" y1="254" x2="180" y2="384" marker-end="url(#arrow)"/><line class="stroke" x1="327" y1="434" x2="453" y2="434" marker-end="url(#arrow)"/><line class="stroke" x1="590" y1="382" x2="645" y2="254" marker-end="url(#arrow)"/><line class="stroke" x1="645" y1="154" x2="497" y2="84" marker-end="url(#arrow)"/><text class="small" x="580" y="104" text-anchor="middle">اگلی ضرورت</text><ellipse class="dash" cx="390" cy="262" rx="140" ry="44"/><text class="small" x="390" y="258" text-anchor="middle">ہر مرحلے پر شمولیت اور</text><text class="small" x="390" y="278" text-anchor="middle">جواب دہی ضروری ہے</text><text class="wm" x="12" y="510" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>