<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">گاؤں کے گرلز اسکول میں ہینڈ پمپ کی مرمت: چھ طریقوں کا موازنہ</title><desc id="d">جدول میں اسکول کے ہینڈ پمپ کی مرمت کے لیے چھ طریقوں کا موازنہ کیا گیا ہے۔ دستخط شدہ درخواست، ماؤں سمیت پرامن وفد، اور چیئرمین کی عوامی رپورٹ اخلاقی ہیں جو جواب دہی اور شمولیت کو برقرار رکھتے ہیں۔ شاہراہ بند کرنا، بغیر ثبوت چوری کا الزام، اور بغیر اجازت ویڈیو بنانا غیر اخلاقی ہیں جو نقصان نہ پہنچانے، سچائی، احترام اور رضامندی کے اصول توڑتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg{fill:var(--bg)}
.stroke{stroke:var(--ink);stroke-width:2.5;fill:none}
.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:8 6}
.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}
.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}
.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}
.yes{stroke:var(--ink);stroke-width:3;fill:none}
.no{stroke:var(--muted);stroke-width:3;fill:none}
text{font-size:14px;fill:var(--ink)}
.h{font-size:16px;font-weight:700;fill:var(--ink)}
.sh{font-size:14px;font-weight:600;fill:var(--ink)}
.body{font-size:14px;fill:var(--ink)}
.cell{font-size:13px;fill:var(--ink)}
.small{font-size:13px;fill:var(--muted)}
.cap{font-size:13px;fill:var(--muted)}
.wm{fill:var(--wm);font-size:11px}
.ah{fill:var(--ink)}
.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><text class="h" x="390" y="30" text-anchor="middle">یکساں مقصد: گاؤں کے گرلز اسکول میں چالو ہینڈ پمپ</text><rect class="panel" x="20" y="48" width="740" height="38"/><text class="sh" x="748" y="72" text-anchor="end">طریقہ کار</text><text class="sh" x="380" y="72" text-anchor="end">اخلاقی؟</text><text class="sh" x="240" y="72" text-anchor="end">برقرار یا پامال شدہ قدر</text><rect class="panel-a" x="20" y="86" width="740" height="58"/><text class="cell" x="748" y="110" text-anchor="end">یونین کونسل چیئرمین کو</text><text class="cell" x="748" y="128" text-anchor="end">دستخط شدہ درخواست</text><path class="yes" d="M366,115 l5,6 l10,-12"/><text class="cell" x="345" y="120" text-anchor="end">اخلاقی</text><text class="cell" x="240" y="119" text-anchor="end">جواب دہی کو برقرار رکھتا ہے</text><rect class="panel-a" x="20" y="144" width="740" height="58"/><text class="cell" x="748" y="168" text-anchor="end">پانچ والدین کا پرامن وفد،</text><text class="cell" x="748" y="186" text-anchor="end">جس میں دو مائیں شامل ہوں</text><path class="yes" d="M366,173 l5,6 l10,-12"/><text class="cell" x="345" y="178" text-anchor="end">اخلاقی</text><text class="cell" x="240" y="168" text-anchor="end">شمولیت اور عدم تشدد</text><text class="cell" x="240" y="186" text-anchor="end">کو برقرار رکھتا ہے</text><rect class="panel-a" x="20" y="202" width="740" height="58"/><text class="cell" x="748" y="226" text-anchor="end">عوامی اجلاس جہاں چیئرمین</text><text class="cell" x="748" y="244" text-anchor="end">مقررہ تاریخ پر رپورٹ دے</text><path class="yes" d="M366,231 l5,6 l10,-12"/><text class="cell" x="345" y="236" text-anchor="end">اخلاقی</text><text class="cell" x="240" y="235" text-anchor="end">جواب دہی کو برقرار رکھتا ہے</text><text class="cell" x="748" y="284" text-anchor="end">شاہراہ بند کرنا اور</text><text class="cell" x="748" y="302" text-anchor="end">ٹائر جلانا</text><path class="no" d="M366,282 l13,13 M379,282 l-13,13"/><text class="cell" x="345" y="294" text-anchor="end">غیر اخلاقی</text><text class="cell" x="240" y="284" text-anchor="end">نقصان نہ پہنچانے اور</text><text class="cell" x="240" y="302" text-anchor="end">عدم تشدد کو توڑتا ہے</text><text class="cell" x="748" y="342" text-anchor="end">بغیر ثبوت ہیڈ ٹیچر پر چوری کا</text><text class="cell" x="748" y="360" text-anchor="end">الزام لگانے والی ویڈیو پوسٹ کرنا</text><path class="no" d="M366,340 l13,13 M379,340 l-13,13"/><text class="cell" x="345" y="352" text-anchor="end">غیر اخلاقی</text><text class="cell" x="240" y="342" text-anchor="end">سچائی اور احترام</text><text class="cell" x="240" y="360" text-anchor="end">کو پامال کرتا ہے</text><text class="cell" x="748" y="400" text-anchor="end">والدین کی اجازت کے بغیر سوشل</text><text class="cell" x="748" y="418" text-anchor="end">میڈیا کے لیے شاگردوں کی فلم بنانا</text><path class="no" d="M366,398 l13,13 M379,398 l-13,13"/><text class="cell" x="345" y="410" text-anchor="end">غیر اخلاقی</text><text class="cell" x="240" y="400" text-anchor="end">رضامندی اور نجی زندگی</text><text class="cell" x="240" y="418" text-anchor="end">کے تحفظ کو توڑتا ہے</text><line class="grid" x1="20" y1="86" x2="760" y2="86"/><line class="grid" x1="20" y1="144" x2="760" y2="144"/><line class="grid" x1="20" y1="202" x2="760" y2="202"/><line class="grid" x1="20" y1="260" x2="760" y2="260"/><line class="grid" x1="20" y1="318" x2="760" y2="318"/><line class="grid" x1="20" y1="376" x2="760" y2="376"/><line class="grid" x1="20" y1="434" x2="760" y2="434"/><rect class="stroke" x="20" y="48" width="740" height="386"/><line class="grid" x1="410" y1="48" x2="410" y2="434"/><line class="grid" x1="260" y1="48" x2="260" y2="434"/><text class="small" x="756" y="460" text-anchor="end">صحیح کا نشان اخلاقی طریقہ کار کو ظاہر کرتا ہے، اور ضرب کا نشان غیر اخلاقی کو۔</text><text class="wm" x="12" y="480" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>