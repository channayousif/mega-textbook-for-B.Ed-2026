<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">برابری اور انصاف کے فرق کا خاکہ</title><desc id="d">برابری اور انصاف کے فرق کو ظاہر کرنے والا دو حصوں پر مشتمل خاکہ۔ برابری والے حصے میں مختلف قد کے تین بچے ایک جیسے ڈبوں پر کھڑے باڑ کے پار میچ دیکھ رہے ہیں؛ سب سے لمبا بچہ آسانی سے دیکھ رہا ہے، درمیانہ بمشکل، اور چھوٹا بچہ اب بھی نہیں دیکھ پا رہا۔ انصاف والے حصے میں وہی تین بچے ضرورت کے مطابق بانٹے گئے ڈبوں پر کھڑے ہیں: لمبا بچہ زمین پر، درمیانہ ایک ڈبے پر اور چھوٹا بچہ دو ڈبوں پر کھڑا ہے تاکہ تینوں دیکھ سکیں۔ وضاحت ہے کہ برابری سب کو یکساں مدد دیتی ہے، جبکہ انصاف ہر فرد کو اس کی ضرورت کے مطابق مدد دیتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="450"/><rect class="panel" x="404" y="52" width="352" height="340" rx="6"/><text class="h" x="736" y="86" text-anchor="end">برابری (Equality)</text><text class="small" x="736" y="106" text-anchor="end">سب کے لیے یکساں مدد</text><rect class="panel-b" x="420" y="180" width="320" height="14" rx="0"/><line class="stroke" x1="420" y1="320" x2="740" y2="320"/><rect class="box" x="452" y="275" width="56" height="45"/><rect class="box" x="542" y="275" width="56" height="45"/><rect class="box" x="632" y="275" width="56" height="45"/><rect class="box" x="468" y="145" width="24" height="130"/><circle class="panel-b" cx="480" cy="131" r="14"/><rect class="box" x="558" y="180" width="24" height="95"/><circle class="panel-b" cx="570" cy="167" r="13"/><rect class="box" x="648" y="210" width="24" height="65"/><circle class="panel-b" cx="660" cy="199" r="11"/><text class="small" x="480" y="344" text-anchor="middle">آسانی سے دیکھتا ہے</text><text class="small" x="570" y="344" text-anchor="middle">دیکھ سکتا ہے</text><text class="small" x="660" y="344" text-anchor="middle">نہیں دیکھ سکتا</text><rect class="panel" x="24" y="52" width="352" height="340" rx="6"/><text class="h" x="356" y="86" text-anchor="end">انصاف و شمولیت (Equity)</text><text class="small" x="356" y="106" text-anchor="end">ضرورت کے مطابق مدد کی فراہمی</text><rect class="panel-b" x="40" y="180" width="320" height="14" rx="0"/><line class="stroke" x1="40" y1="320" x2="360" y2="320"/><rect class="box" x="162" y="275" width="56" height="45"/><rect class="box" x="252" y="275" width="56" height="45"/><rect class="box" x="252" y="230" width="56" height="45"/><rect class="box" x="88" y="190" width="24" height="130"/><circle class="panel-b" cx="100" cy="176" r="14"/><rect class="box" x="178" y="180" width="24" height="95"/><circle class="panel-b" cx="190" cy="167" r="13"/><rect class="box" x="268" y="165" width="24" height="65"/><circle class="panel-b" cx="280" cy="154" r="11"/><text class="small" x="100" y="344" text-anchor="middle">دیکھ سکتا ہے</text><text class="small" x="190" y="344" text-anchor="middle">دیکھ سکتا ہے</text><text class="small" x="280" y="344" text-anchor="middle">دیکھ سکتا ہے</text><text class="small" x="756" y="414" text-anchor="end">برابری ہر کسی کو یکساں مدد فراہم کرتی ہے۔</text><text class="small" x="756" y="432" text-anchor="end">انصاف ہر فرد کو اس کی ضرورت کے مطابق مدد فراہم کرتا ہے۔</text><text class="wm" x="24" y="444" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>