<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 485" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">2023 کی مردم شماری کے مطابق پاکستان کی اہم مادری زبانیں</title><desc id="d">2023 کی مردم شماری کے مطابق پاکستان کی اہم مادری زبانوں کا جدول۔ چھ قطاریں زبان، آبادی میں اس کا تناسب اور بنیادی علاقہ ظاہر کرتی ہیں: پنجاب میں تقریباً 37 فیصد پنجابی، خیبر پختونخوا میں 18 فیصد پشتو، سندھ میں 14 فیصد سندھی، جنوبی پنجاب اور خیبر پختونخوا کے حصوں میں 12 فیصد سرائیکی، ملک بھر کے شہروں میں 9 فیصد اردو، اور بلوچستان میں 3 فیصد بلوچی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="485"/><text class="h" x="756" y="34" text-anchor="end">پاکستان کی اہم مادری زبانیں، مردم شماری 2023</text><rect class="panel-a" x="556" y="52" width="200" height="40" rx="0"/><text class="sh" x="740" y="77" text-anchor="end">زبان</text><rect class="panel-a" x="376" y="52" width="180" height="40" rx="0"/><text class="sh" x="540" y="77" text-anchor="end">آبادی کا تناسب</text><rect class="panel-a" x="24" y="52" width="352" height="40" rx="0"/><text class="sh" x="360" y="77" text-anchor="end">بنیادی طور پر کہاں بولی جاتی ہے</text><rect class="panel" x="556" y="92" width="200" height="56" rx="0"/><text class="sh" x="740" y="116" text-anchor="end">پنجابی</text><rect class="box" x="376" y="92" width="180" height="56" rx="0"/><text class="body" x="540" y="116" text-anchor="end">تقریباً 37 فیصد</text><rect class="box" x="24" y="92" width="352" height="56" rx="0"/><text class="body" x="360" y="116" text-anchor="end">پنجاب</text><rect class="panel" x="556" y="148" width="200" height="56" rx="0"/><text class="sh" x="740" y="172" text-anchor="end">پشتو</text><rect class="box" x="376" y="148" width="180" height="56" rx="0"/><text class="body" x="540" y="172" text-anchor="end">تقریباً 18 فیصد</text><rect class="box" x="24" y="148" width="352" height="56" rx="0"/><text class="body" x="360" y="172" text-anchor="end">خیبر پختونخوا</text><rect class="panel" x="556" y="204" width="200" height="56" rx="0"/><text class="sh" x="740" y="228" text-anchor="end">سندھی</text><rect class="box" x="376" y="204" width="180" height="56" rx="0"/><text class="body" x="540" y="228" text-anchor="end">تقریباً 14 فیصد</text><rect class="box" x="24" y="204" width="352" height="56" rx="0"/><text class="body" x="360" y="228" text-anchor="end">سندھ</text><rect class="panel" x="556" y="260" width="200" height="56" rx="0"/><text class="sh" x="740" y="284" text-anchor="end">سرائیکی</text><rect class="box" x="376" y="260" width="180" height="56" rx="0"/><text class="body" x="540" y="284" text-anchor="end">تقریباً 12 فیصد</text><rect class="box" x="24" y="260" width="352" height="56" rx="0"/><text class="body" x="360" y="284" text-anchor="end">جنوبی پنجاب، خیبر پختونخوا کے بعض علاقے</text><rect class="panel" x="556" y="316" width="200" height="56" rx="0"/><text class="sh" x="740" y="340" text-anchor="end">اردو</text><rect class="box" x="376" y="316" width="180" height="56" rx="0"/><text class="body" x="540" y="340" text-anchor="end">تقریباً 9 فیصد</text><rect class="box" x="24" y="316" width="352" height="56" rx="0"/><text class="body" x="360" y="340" text-anchor="end">پاکستان بھر کے شہر</text><rect class="panel" x="556" y="372" width="200" height="56" rx="0"/><text class="sh" x="740" y="396" text-anchor="end">بلوچی</text><rect class="box" x="376" y="372" width="180" height="56" rx="0"/><text class="body" x="540" y="396" text-anchor="end">تقریباً 3 فیصد</text><rect class="box" x="24" y="372" width="352" height="56" rx="0"/><text class="body" x="360" y="396" text-anchor="end">بلوچستان</text><text class="small" x="756" y="448" text-anchor="end">یہ تناسب 2023 کی مردم شماری میں مادری زبان بتانے والی آبادی پر مبنی ہے۔</text><text class="small" x="756" y="465" text-anchor="end">کوئی ایک زبان بھی ایسی نہیں جو زیادہ تر پاکستانی گھروں میں بولی جاتی ہو۔</text><text class="wm" x="24" y="479" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>