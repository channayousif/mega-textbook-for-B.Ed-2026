<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">تین سطحوں پر شامل کن شہریت کو فروغ دینے والے عملی اقدامات</title><desc id="d">تین سطحوں پر شامل کن شہریت کو فروغ دینے والے عملی اقدامات کا جدول۔ گھر پر: خاندان کے ہر فرد سے اس کی رائے پوچھنا، جنس کے تفریق کے بغیر کام بانٹنا، اور بچوں کو گھر کی زبان بولنے دینا۔ اسکول میں: طلباء کو ملا جلا کر بٹھانا اور گروپ بنانا، ایسی زبان میں مواد جو طلباء سمجھتے ہوں، ضرورت مند طالب علم کے لیے اضافی وقت یا مددگار، اور ایسا ضابطہ کہ کسی کے پس منظر کا مذاق نہ اڑایا جائے۔ برادری میں: اسکول کی تقریب میں ہر گروہ کو مدعو کرنا، ایک سے زائد زبانوں میں نوٹس بورڈ، اور اسکول مینجمنٹ کمیٹی میں خواتین اور اقلیتی اراکین کو شامل کرنا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="756" y="34" text-anchor="end">شامل کن شہریت کے فروغ کے عملی اقدامات</text><rect class="panel-a" x="626" y="52" width="130" height="40" rx="0"/><text class="sh" x="740" y="77" text-anchor="end">سطح</text><rect class="panel-a" x="24" y="52" width="602" height="40" rx="0"/><text class="sh" x="610" y="77" text-anchor="end">عملی اقدامات</text><rect class="panel" x="626" y="92" width="130" height="90" rx="0"/><text class="sh" x="740" y="128" text-anchor="end">گھر پر</text><text class="small" x="740" y="148" text-anchor="end">خاندانی عادات</text><rect class="box" x="24" y="92" width="602" height="90" rx="0"/><text class="body" x="610" y="122" text-anchor="end">خاندان کے ہر فرد سے اس کی رائے پوچھنا</text><text class="body" x="610" y="139" text-anchor="end">صنف کی تفریق کے بغیر گھریلو کام بانٹنا</text><text class="body" x="610" y="156" text-anchor="end">بچوں کو گھر کی مادری زبان بولنے کی آزادی دینا</text><rect class="panel" x="626" y="182" width="130" height="150" rx="0"/><text class="sh" x="740" y="242" text-anchor="end">اسکول میں</text><text class="small" x="740" y="262" text-anchor="end">کلاس روم اور</text><text class="small" x="740" y="279" text-anchor="end">پورا اسکول</text><rect class="box" x="24" y="182" width="602" height="150" rx="0"/><text class="body" x="610" y="212" text-anchor="end">طلباء کو ملا جلا کر بٹھانا اور متنوع گروپ بنانا</text><text class="body" x="610" y="229" text-anchor="end">ایسی زبان میں تدریسی مواد فراہم کرنا جو طلباء سمجھتے ہوں</text><text class="body" x="610" y="246" text-anchor="end">ضرورت مند طالب علم کے لیے اضافی وقت یا معاون فراہم کرنا</text><text class="body" x="610" y="263" text-anchor="end">سخت اصول کہ کسی کے پس منظر یا لہجے کا مذاق اڑانے کی اجازت نہ ہو</text><rect class="panel" x="626" y="332" width="130" height="120" rx="0"/><text class="sh" x="740" y="382" text-anchor="end">برادری میں</text><text class="small" x="740" y="402" text-anchor="end">مقامی ماحول</text><rect class="box" x="24" y="332" width="602" height="120" rx="0"/><text class="body" x="610" y="362" text-anchor="end">اسکول کی ہر تقریب میں تمام گروہوں کو مدعو کرنا</text><text class="body" x="610" y="379" text-anchor="end">معلوماتی نوٹس بورڈ کو ایک سے زائد زبانوں میں آویزاں کرنا</text><text class="body" x="610" y="396" text-anchor="end">اسکول مینجمنٹ کمیٹی میں خواتین اور اقلیتی اراکین کو شامل کرنا</text><text class="small" x="756" y="472" text-anchor="end">کاغذ پر موجود حقوق ان تینوں سطحوں پر عملی عادات بن کر ہی حقیقت بنتے ہیں۔</text><text class="wm" x="24" y="490" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>