<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Two-panel diagram contrasting equality and equity</title><desc id="d">Two-panel diagram contrasting equality and equity. The equality panel shows three children of different heights standing on identical boxes, watching a match over a fence; the tallest sees easily, the middle child just sees, and the shortest still cannot see. The equity panel shows the same three children with the boxes shared according to need: the tallest stands on the ground, the middle child on one box, and the shortest on two, so that all three can see. A caption reads that equality gives the same support to everyone, while equity gives each person the support they need.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="450"/><rect class="panel" x="24" y="52" width="352" height="340" rx="6"/><text class="h" x="40" y="86">Equality</text><text class="small" x="40" y="106">the same support for everyone</text><rect class="panel-b" x="40" y="180" width="320" height="14" rx="0"/><line class="stroke" x1="40" y1="320" x2="360" y2="320"/><rect class="box" x="72" y="275" width="56" height="45"/><rect class="box" x="162" y="275" width="56" height="45"/><rect class="box" x="252" y="275" width="56" height="45"/><rect class="box" x="88" y="145" width="24" height="130"/><circle class="panel-b" cx="100" cy="131" r="14"/><rect class="box" x="178" y="180" width="24" height="95"/><circle class="panel-b" cx="190" cy="167" r="13"/><rect class="box" x="268" y="210" width="24" height="65"/><circle class="panel-b" cx="280" cy="199" r="11"/><text class="small" x="100" y="344" text-anchor="middle">sees easily</text><text class="small" x="190" y="344" text-anchor="middle">sees</text><text class="small" x="280" y="344" text-anchor="middle">cannot see</text><rect class="panel" x="404" y="52" width="352" height="340" rx="6"/><text class="h" x="420" y="86">Equity</text><text class="small" x="420" y="106">support matched to need</text><rect class="panel-b" x="420" y="180" width="320" height="14" rx="0"/><line class="stroke" x1="420" y1="320" x2="740" y2="320"/><rect class="box" x="542" y="275" width="56" height="45"/><rect class="box" x="632" y="275" width="56" height="45"/><rect class="box" x="632" y="230" width="56" height="45"/><rect class="box" x="468" y="190" width="24" height="130"/><circle class="panel-b" cx="480" cy="176" r="14"/><rect class="box" x="558" y="180" width="24" height="95"/><circle class="panel-b" cx="570" cy="167" r="13"/><rect class="box" x="648" y="165" width="24" height="65"/><circle class="panel-b" cx="660" cy="154" r="11"/><text class="small" x="480" y="344" text-anchor="middle">sees</text><text class="small" x="570" y="344" text-anchor="middle">sees</text><text class="small" x="660" y="344" text-anchor="middle">sees</text><text class="small" x="24" y="414">Equality gives the same support to everyone.</text><text class="small" x="24" y="432">Equity gives each person the support they need.</text><text class="wm" x="768" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
