<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">پاکستان میں تنوع کے ابعاد کا تصوراتی خاکہ</title><desc id="d">پاکستان میں تنوع کے ابعاد کا تصوراتی خاکہ۔ مرکز میں 'پاکستان میں تنوع' کے گرد چھ خانے ہیں: زبان، قومیت، مذہب، علاقہ، معاشی طبقہ اور سیاسی نقطہ نظر۔ ہر خانے میں ایک پاکستانی مثال دی گئی ہے، جیسے جنوبی پنجاب میں بولی جانے والی سرائیکی، کسی مذہبی برادری کا تہوار، کوئٹہ کے قریب ایک گاؤں اور مقامی مسئلے پر خاندان کی آراء۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="756" y="34" text-anchor="end">پاکستان میں تنوع کے مختلف پہلو</text><line class="stroke" x1="555" y1="118" x2="470" y2="178" marker-end="url(#arrow)"/><line class="stroke" x1="225" y1="118" x2="310" y2="178" marker-end="url(#arrow)"/><line class="stroke" x1="552" y1="225" x2="493" y2="225" marker-end="url(#arrow)"/><line class="stroke" x1="228" y1="225" x2="287" y2="225" marker-end="url(#arrow)"/><line class="stroke" x1="555" y1="328" x2="470" y2="282" marker-end="url(#arrow)"/><line class="stroke" x1="225" y1="328" x2="310" y2="282" marker-end="url(#arrow)"/><rect class="panel-a" x="285" y="180" width="210" height="100" rx="6"/><text class="h" x="390" y="222" text-anchor="middle">پاکستان میں تنوع</text><text class="small" x="390" y="248" text-anchor="middle">ایک معاشرہ، کئی تفاوت</text><rect class="panel" x="550" y="40" width="200" height="80" rx="6"/><text class="sh" x="740" y="64" text-anchor="end">زبان</text><text class="body" x="740" y="85" text-anchor="end">جنوبی پنجاب میں سرائیکی؛</text><text class="body" x="740" y="102" text-anchor="end">شہروں میں اردو</text><rect class="panel" x="30" y="40" width="200" height="80" rx="6"/><text class="sh" x="220" y="64" text-anchor="end">قومیت و نسل</text><text class="body" x="220" y="85" text-anchor="end">پنجابی، سندھی،</text><text class="body" x="220" y="102" text-anchor="end">پشتون، بلوچ</text><rect class="panel" x="550" y="185" width="200" height="80" rx="6"/><text class="sh" x="740" y="209" text-anchor="end">مذہب</text><text class="body" x="740" y="230" text-anchor="end">کسی ایک برادری کا</text><text class="body" x="740" y="247" text-anchor="end">منایا جانے والا تہوار</text><rect class="panel" x="30" y="185" width="200" height="80" rx="6"/><text class="sh" x="220" y="209" text-anchor="end">علاقہ</text><text class="body" x="220" y="230" text-anchor="end">کوئٹہ کے قریب گاؤں؛</text><text class="body" x="220" y="247" text-anchor="end">کراچی کی ایک گلی</text><rect class="panel" x="550" y="330" width="200" height="80" rx="6"/><text class="sh" x="740" y="354" text-anchor="end">معاشی طبقہ</text><text class="body" x="740" y="375" text-anchor="end">خاندان کی آمدن،</text><text class="body" x="740" y="392" text-anchor="end">کام اور زمین</text><rect class="panel" x="30" y="330" width="200" height="80" rx="6"/><text class="sh" x="220" y="354" text-anchor="end">سیاسی نقطہ نظر</text><text class="body" x="220" y="375" text-anchor="end">انتخابات کے وقت مقامی</text><text class="body" x="220" y="392" text-anchor="end">مسئلے پر مختلف آراء</text><text class="wm" x="768" y="430" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>