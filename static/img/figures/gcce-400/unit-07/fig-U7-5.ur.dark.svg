<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">پاکستان میں سماجی عدم مساوات کی صورتیں، مردم شماری 2023</title><desc id="d">2023 کی مردم شماری کے مطابق پاکستان میں سماجی عدم مساوات کی چار صورتوں اور ان کے اشاریوں کا جدول۔ تعلیم: 5 سے 16 سال کے 35.60 فیصد بچے اسکول سے باہر۔ آمدن اور کام: 38.57 فیصد آبادی برسرِ روزگار، جن میں 59.68 فیصد مرد اور 16.10 فیصد خواتین۔ صنف: خواتین میں خواندگی 52.84 فیصد بمقابلہ مردوں میں 68.00 فیصد۔ علاقہ: بلوچستان میں خواندگی 42.01 فیصد بمقابلہ پنجاب میں 66.25 فیصد اور دیہی سندھ میں 38.14 فیصد۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="450"/><text class="h" x="756" y="34" text-anchor="end">پاکستان میں سماجی عدم مساوات کی صورتیں، مردم شماری 2023</text><rect class="panel-a" x="616" y="52" width="140" height="40" rx="0"/><text class="sh" x="740" y="77" text-anchor="end">صورت</text><rect class="panel-a" x="256" y="52" width="360" height="40" rx="0"/><text class="sh" x="600" y="77" text-anchor="end">اشاریہ</text><rect class="panel-a" x="24" y="52" width="232" height="40" rx="0"/><text class="sh" x="240" y="77" text-anchor="end">یہ کیا ظاہر کرتا ہے</text><rect class="panel" x="616" y="92" width="140" height="76" rx="0"/><text class="sh" x="740" y="120" text-anchor="end">تعلیم</text><text class="small" x="740" y="140" text-anchor="end">دفعہ 25A</text><rect class="box" x="256" y="92" width="360" height="76" rx="0"/><text class="body" x="600" y="120" text-anchor="end">5 سے 16 سال کے 35.60 فیصد بچے</text><text class="body" x="600" y="137" text-anchor="end">اسکول سے باہر ہیں</text><rect class="box" x="24" y="92" width="232" height="76" rx="0"/><text class="body" x="240" y="120" text-anchor="end">دفعہ 25A کا کیا گیا وعدہ</text><text class="body" x="240" y="137" text-anchor="end">ابھی پورا نہیں ہوا</text><rect class="panel" x="616" y="168" width="140" height="76" rx="0"/><text class="sh" x="740" y="196" text-anchor="end">آمدن و روزگار</text><text class="small" x="740" y="216" text-anchor="end">ملازمت کے مواقع</text><rect class="box" x="256" y="168" width="360" height="76" rx="0"/><text class="body" x="600" y="196" text-anchor="end">38.57 فیصد آبادی برسرِ روزگار؛</text><text class="body" x="600" y="213" text-anchor="end">59.68 فیصد مرد اور 16.10 فیصد خواتین</text><rect class="box" x="24" y="168" width="232" height="76" rx="0"/><text class="body" x="240" y="196" text-anchor="end">کام کون کرتا ہے، اور کس سے</text><text class="body" x="240" y="213" text-anchor="end">کام کی توقع کی جاتی ہے</text><rect class="panel" x="616" y="244" width="140" height="76" rx="0"/><text class="sh" x="740" y="272" text-anchor="end">صنف</text><text class="small" x="740" y="292" text-anchor="end">خواندگی 10 سال+</text><rect class="box" x="256" y="244" width="360" height="76" rx="0"/><text class="body" x="600" y="272" text-anchor="end">خواتین میں خواندگی 52.84 فیصد،</text><text class="body" x="600" y="289" text-anchor="end">مردوں میں 68.00 فیصد</text><rect class="box" x="24" y="244" width="232" height="76" rx="0"/><text class="body" x="240" y="272" text-anchor="end">صنفی فرق جو بعض صوبوں</text><text class="body" x="240" y="289" text-anchor="end">میں مزید وسیع ہو جاتا ہے</text><rect class="panel" x="616" y="320" width="140" height="76" rx="0"/><text class="sh" x="740" y="348" text-anchor="end">علاقہ</text><text class="small" x="740" y="368" text-anchor="end">خواندگی 10 سال+</text><rect class="box" x="256" y="320" width="360" height="76" rx="0"/><text class="body" x="600" y="348" text-anchor="end">بلوچستان میں خواندگی 42.01 فیصد،</text><text class="body" x="600" y="365" text-anchor="end">پنجاب میں 66.25 فیصد، دیہی سندھ 38.14 فیصد</text><rect class="box" x="24" y="320" width="232" height="76" rx="0"/><text class="body" x="240" y="348" text-anchor="end">بچے کی قسمت کا انحصار اس کی</text><text class="body" x="240" y="365" text-anchor="end">جائے پیدائش پر ہوتا ہے</text><text class="small" x="756" y="414" text-anchor="end">ہر اشاریہ ایک ایسے فرق کو ظاہر کرتا ہے جو منظم ہے اور جس کی پیمائش کی جا سکتی ہے۔</text><text class="wm" x="24" y="435" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>