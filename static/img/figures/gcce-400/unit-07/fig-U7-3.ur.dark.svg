<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">تین گروہوں کی شرکت اور درپیش رکاوٹیں</title><desc id="d">پاکستان میں تین گروہوں، شرکت کی ایک صورت اور ایک ایک رکاوٹ کا جدول۔ نوجوان: مقامی صفائی یا تدریس میں رضاکارانہ خدمات، بمقابلہ محدود وسائل، کم روزگار اور سنجیدگی سے نہ لیا جانا۔ خواتین: ویلفیئر ٹرسٹ چلانا یا یونین کونسل کی نشست کے لیے کھڑے ہونا، بمقابلہ سماجی پابندیاں، غیر مساوی اجرت اور تحفظ کے خدشات۔ اقلیتیں: اسکول کمیٹی یا سرکاری ملازمت میں خدمات، بمقابلہ تعصب اور ملازمتوں میں کم نمائندگی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="756" y="34" text-anchor="end">شرکت اور درپیش رکاوٹیں</text><rect class="panel-a" x="626" y="52" width="130" height="40" rx="0"/><text class="sh" x="740" y="77" text-anchor="end">گروہ</text><rect class="panel-a" x="306" y="52" width="320" height="40" rx="0"/><text class="sh" x="610" y="77" text-anchor="end">شرکت کی ایک صورت</text><rect class="panel-a" x="24" y="52" width="282" height="40" rx="0"/><text class="sh" x="290" y="77" text-anchor="end">ایک رکاوٹ</text><rect class="panel" x="626" y="92" width="130" height="72" rx="0"/><text class="sh" x="740" y="132" text-anchor="end">نوجوان</text><rect class="box" x="306" y="92" width="320" height="72" rx="0"/><text class="body" x="610" y="116" text-anchor="end">مقامی صفائی میں رضاکارانہ کام یا</text><text class="body" x="610" y="133" text-anchor="end">اسکول کے بعد بچوں کو پڑھانا</text><rect class="box" x="24" y="92" width="282" height="72" rx="0"/><text class="body" x="290" y="116" text-anchor="end">محدود وسائل، روزگار کی کمی، اور</text><text class="body" x="290" y="133" text-anchor="end">بڑوں کی طرف سے سنجیدہ نہ لینا</text><rect class="panel" x="626" y="164" width="130" height="72" rx="0"/><text class="sh" x="740" y="204" text-anchor="end">خواتین</text><rect class="box" x="306" y="164" width="320" height="72" rx="0"/><text class="body" x="610" y="188" text-anchor="end">ویلفیئر ٹرسٹ چلانا، یا یونین</text><text class="body" x="610" y="205" text-anchor="end">کونسل کی نشست کے لیے انتخاب لڑنا</text><rect class="box" x="24" y="164" width="282" height="72" rx="0"/><text class="body" x="290" y="188" text-anchor="end">سماجی پابندیاں، غیر مساوی اجرت،</text><text class="body" x="290" y="205" text-anchor="end">اور تحفظ کے مسائل</text><rect class="panel" x="626" y="236" width="130" height="72" rx="0"/><text class="sh" x="740" y="276" text-anchor="end">اقلیتیں</text><rect class="box" x="306" y="236" width="320" height="72" rx="0"/><text class="body" x="610" y="260" text-anchor="end">اسکول کمیٹی میں خدمات انجام دینا،</text><text class="body" x="610" y="277" text-anchor="end">یا سرکاری ملازمت کرنا</text><rect class="box" x="24" y="236" width="282" height="72" rx="0"/><text class="body" x="290" y="260" text-anchor="end">تعصب، اور ملازمتوں میں</text><text class="body" x="290" y="277" text-anchor="end">کم نمائندگی کا سامنا</text><text class="small" x="756" y="342" text-anchor="end">ہر گروہ حصہ لیتا ہے، اور ہر ایک کو رکاوٹ کا سامنا ہے۔ رکاوٹ دور کرنا ناممکن نہیں ہے۔</text><text class="wm" x="24" y="370" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>