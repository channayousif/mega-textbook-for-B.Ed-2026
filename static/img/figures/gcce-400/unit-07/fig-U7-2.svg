<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 485" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of Pakistan's main mother tongues from the 2023 census</title><desc id="d">Table of Pakistan's main mother tongues from the 2023 census. Six rows give the language, its share of the population and where it is mainly spoken: Punjabi about 37 percent in Punjab, Pashto 18 percent in Khyber Pakhtunkhwa, Sindhi 14 percent in Sindh, Saraiki 12 percent in southern Punjab and parts of Khyber Pakhtunkhwa, Urdu 9 percent in cities across Pakistan, and Balochi 3 percent in Balochistan.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="485"/><text class="h" x="24" y="34">Pakistan's main mother tongues, Census 2023</text><rect class="panel-a" x="24" y="52" width="200" height="40" rx="0"/><text class="sh" x="32" y="77">Language</text><rect class="panel-a" x="224" y="52" width="180" height="40" rx="0"/><text class="sh" x="232" y="77">Share of population</text><rect class="panel-a" x="404" y="52" width="352" height="40" rx="0"/><text class="sh" x="412" y="77">Mainly spoken in</text><rect class="panel" x="24" y="92" width="200" height="56" rx="0"/><text class="sh" x="32" y="116">Punjabi</text><rect class="box" x="224" y="92" width="180" height="56" rx="0"/><text class="body" x="232" y="116">about 37 percent</text><rect class="box" x="404" y="92" width="352" height="56" rx="0"/><text class="body" x="412" y="116">Punjab</text><rect class="panel" x="24" y="148" width="200" height="56" rx="0"/><text class="sh" x="32" y="172">Pashto</text><rect class="box" x="224" y="148" width="180" height="56" rx="0"/><text class="body" x="232" y="172">about 18 percent</text><rect class="box" x="404" y="148" width="352" height="56" rx="0"/><text class="body" x="412" y="172">Khyber Pakhtunkhwa</text><rect class="panel" x="24" y="204" width="200" height="56" rx="0"/><text class="sh" x="32" y="228">Sindhi</text><rect class="box" x="224" y="204" width="180" height="56" rx="0"/><text class="body" x="232" y="228">about 14 percent</text><rect class="box" x="404" y="204" width="352" height="56" rx="0"/><text class="body" x="412" y="228">Sindh</text><rect class="panel" x="24" y="260" width="200" height="56" rx="0"/><text class="sh" x="32" y="284">Saraiki</text><rect class="box" x="224" y="260" width="180" height="56" rx="0"/><text class="body" x="232" y="284">about 12 percent</text><rect class="box" x="404" y="260" width="352" height="56" rx="0"/><text class="body" x="412" y="284">Southern Punjab, parts of KP</text><rect class="panel" x="24" y="316" width="200" height="56" rx="0"/><text class="sh" x="32" y="340">Urdu</text><rect class="box" x="224" y="316" width="180" height="56" rx="0"/><text class="body" x="232" y="340">about 9 percent</text><rect class="box" x="404" y="316" width="352" height="56" rx="0"/><text class="body" x="412" y="340">Cities across Pakistan</text><rect class="panel" x="24" y="372" width="200" height="56" rx="0"/><text class="sh" x="32" y="396">Balochi</text><rect class="box" x="224" y="372" width="180" height="56" rx="0"/><text class="body" x="232" y="396">about 3 percent</text><rect class="box" x="404" y="372" width="352" height="56" rx="0"/><text class="body" x="412" y="396">Balochistan</text><text class="small" x="24" y="448">Shares are of the population reporting each mother tongue, Census 2023.</text><text class="small" x="24" y="465">No single language is spoken at home by most Pakistanis.</text><text class="wm" x="768" y="479" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
