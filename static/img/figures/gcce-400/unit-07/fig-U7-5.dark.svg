<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four forms of social inequality in Pakistan with an indicator for each</title><desc id="d">Table of four forms of social inequality in Pakistan with an indicator for each, from the 2023 census. Education: 35.60 percent of children aged five to sixteen out of school. Income and work: 38.57 percent of the population employed, with 59.68 percent of males and 16.10 percent of females. Gender: literacy 52.84 percent for females against 68.00 percent for males. Region: literacy 42.01 percent in Balochistan against 66.25 percent in Punjab, and 38.14 percent in rural Sindh.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="450"/><text class="h" x="24" y="34">Forms of social inequality in Pakistan, Census 2023</text><rect class="panel-a" x="24" y="52" width="140" height="40" rx="0"/><text class="sh" x="32" y="77">Form</text><rect class="panel-a" x="164" y="52" width="360" height="40" rx="0"/><text class="sh" x="172" y="77">Indicator</text><rect class="panel-a" x="524" y="52" width="232" height="40" rx="0"/><text class="sh" x="532" y="77">What it shows</text><rect class="panel" x="24" y="92" width="140" height="76" rx="0"/><text class="sh" x="32" y="120">Education</text><text class="small" x="32" y="140">Article 25A</text><rect class="box" x="164" y="92" width="360" height="76" rx="0"/><text class="body" x="172" y="120">35.60 percent of children aged</text><text class="body" x="172" y="137">five to sixteen out of school</text><rect class="box" x="524" y="92" width="232" height="76" rx="0"/><text class="body" x="532" y="120">A right promised by</text><text class="body" x="532" y="137">Article 25A is not yet met</text><rect class="panel" x="24" y="168" width="140" height="76" rx="0"/><text class="sh" x="32" y="196">Income</text><text class="small" x="32" y="216">and work</text><rect class="box" x="164" y="168" width="360" height="76" rx="0"/><text class="body" x="172" y="196">38.57 percent of the population</text><text class="body" x="172" y="213">employed; 59.68 percent of males,</text><text class="body" x="172" y="230">16.10 percent of females</text><rect class="box" x="524" y="168" width="232" height="76" rx="0"/><text class="body" x="532" y="196">Who works, and who is</text><text class="body" x="532" y="213">expected to work at all</text><rect class="panel" x="24" y="244" width="140" height="76" rx="0"/><text class="sh" x="32" y="272">Gender</text><text class="small" x="32" y="292">literacy 10+</text><rect class="box" x="164" y="244" width="360" height="76" rx="0"/><text class="body" x="172" y="272">Literacy 52.84 percent for</text><text class="body" x="172" y="289">females, 68.00 percent for males</text><rect class="box" x="524" y="244" width="232" height="76" rx="0"/><text class="body" x="532" y="272">A gap that widens in</text><text class="body" x="532" y="289">some provinces</text><rect class="panel" x="24" y="320" width="140" height="76" rx="0"/><text class="sh" x="32" y="348">Region</text><text class="small" x="32" y="368">literacy 10+</text><rect class="box" x="164" y="320" width="360" height="76" rx="0"/><text class="body" x="172" y="348">Literacy 42.01 percent in Balochistan,</text><text class="body" x="172" y="365">66.25 percent in Punjab, 38.14 percent</text><text class="body" x="172" y="382">in rural Sindh</text><rect class="box" x="524" y="320" width="232" height="76" rx="0"/><text class="body" x="532" y="348">Where a child is born</text><text class="body" x="532" y="365">shapes their chances</text><text class="small" x="24" y="428">Indicators are systematic differences that follow group lines and can be measured.</text><text class="wm" x="768" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
