<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 435" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of a civic response to injustice</title><desc id="d">Flowchart of a civic response to injustice, in four steps left to right. One: notice and name the problem. Two: gather evidence, such as attendance records, photographs, budget papers and census counts. Three: dialogue with the school, the union council or the education office. Four: advocacy through an association, the media, an elected representative or a peaceful gathering protected by Article 16. A final branch from dialogue leads to legal remedy through a court, under Article 25, Article 25A or Article 27.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="435"/><text class="h" x="24" y="34">A civic response to injustice</text><line class="stroke" x1="196" y1="150" x2="204" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="378" y1="150" x2="386" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="150" x2="568" y2="150" marker-end="url(#arrow)"/><line class="dline" x1="474" y1="250" x2="474" y2="298" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="60" width="172" height="190" rx="6"/><text class="sh" x="34" y="88">1. Notice and name</text><text class="body" x="34" y="122">Say what is wrong</text><text class="body" x="34" y="140">and who is harmed</text><text class="body" x="34" y="158">a leaking roof</text><rect class="panel-a" x="206" y="60" width="172" height="190" rx="6"/><text class="sh" x="216" y="88">2. Gather evidence</text><text class="body" x="216" y="122">Attendance records,</text><text class="body" x="216" y="140">photographs, budget</text><text class="body" x="216" y="158">papers, census data</text><rect class="panel-a" x="388" y="60" width="172" height="190" rx="6"/><text class="sh" x="398" y="88">3. Dialogue</text><text class="body" x="398" y="122">School or council,</text><text class="body" x="398" y="140">education office;</text><text class="body" x="398" y="158">ask for a decision</text><rect class="panel-a" x="570" y="60" width="172" height="190" rx="6"/><text class="sh" x="580" y="88">4. Advocacy</text><text class="body" x="580" y="122">Association, media,</text><text class="body" x="580" y="140">elected member,</text><text class="body" x="580" y="158">peaceful gathering</text><rect class="dash" x="388" y="300" width="172" height="90" rx="6"/><text class="sh" x="398" y="328">Legal remedy</text><text class="body" x="398" y="352">A court can enforce</text><text class="body" x="398" y="369">Article 25, 25A or 27</text><text class="small" x="24" y="412">The early steps are cheap. Escalate only when dialogue does not work.</text><text class="wm" x="768" y="425" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
