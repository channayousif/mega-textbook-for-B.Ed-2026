<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 435" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ناانصافی کے خلاف شہری ردعمل کا فلو چارٹ</title><desc id="d">ناانصافی کے خلاف شہری ردعمل کا فلو چارٹ، دائیں سے بائیں چار مراحل میں۔ اول: مسئلے کو دیکھنا اور نام دینا۔ دوم: شواہد جمع کرنا جیسے حاضری کا ریکارڈ، تصاویر، بجٹ کے کاغذات اور مردم شماری کا ڈیٹا۔ سوم: اسکول، یونین کونسل یا محکمہ تعلیم سے مکالمہ۔ چہارم: کسی انجمن، میڈیا، منتخب نمائندے یا دفعہ 16 کے تحت پرامن اجتماع کے ذریعے وکالت۔ مکالمے سے نکلنے والی ایک شاخ دفعہ 25، 25A یا 27 کے تحت عدالت کے ذریعے قانونی چارہ جوئی کی طرف جاتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="435"/><text class="h" x="756" y="34" text-anchor="end">ناانصافی کے خلاف شہری ردعمل کے مراحل</text><line class="stroke" x1="584" y1="150" x2="576" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="396" y1="150" x2="388" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="208" y1="150" x2="200" y2="150" marker-end="url(#arrow)"/><line class="dline" x1="294" y1="250" x2="294" y2="298" marker-end="url(#arrow)"/><rect class="panel-a" x="584" y="60" width="172" height="190" rx="6"/><text class="sh" x="744" y="88" text-anchor="end">1. دیکھنا اور نام دینا</text><text class="body" x="744" y="122" text-anchor="end">واضح کریں کہ کیا غلط ہے</text><text class="body" x="744" y="140" text-anchor="end">اور کسے نقصان پہنچا ہے؛</text><text class="body" x="744" y="158" text-anchor="end">جیسے ٹپکتی چھت</text><rect class="panel-a" x="396" y="60" width="172" height="190" rx="6"/><text class="sh" x="556" y="88" text-anchor="end">2. شواہد جمع کرنا</text><text class="body" x="556" y="122" text-anchor="end">حاضری کا ریکارڈ،</text><text class="body" x="556" y="140" text-anchor="end">تصاویر، بجٹ دستاویزات،</text><text class="body" x="556" y="158" text-anchor="end">مردم شماری ڈیٹا</text><rect class="panel-a" x="208" y="60" width="172" height="190" rx="6"/><text class="sh" x="368" y="88" text-anchor="end">3. مکالمہ</text><text class="body" x="368" y="122" text-anchor="end">اسکول، کونسل، یا</text><text class="body" x="368" y="140" text-anchor="end">محکمہ تعلیم سے رابطہ؛</text><text class="body" x="368" y="158" text-anchor="end">تحریری فیصلے کی طلب</text><rect class="panel-a" x="20" y="60" width="172" height="190" rx="6"/><text class="sh" x="180" y="88" text-anchor="end">4. وکالت (Advocacy)</text><text class="body" x="180" y="122" text-anchor="end">انجمن، میڈیا، منتخب</text><text class="body" x="180" y="140" text-anchor="end">نمائندہ، یا پرامن</text><text class="body" x="180" y="158" text-anchor="end">اجتماع (دفعہ 16)</text><rect class="dash" x="208" y="300" width="172" height="90" rx="6"/><text class="sh" x="368" y="328" text-anchor="end">قانونی چارہ جوئی</text><text class="body" x="368" y="352" text-anchor="end">عدالت دفعہ 25، 25A</text><text class="body" x="368" y="369" text-anchor="end">یا 27 کا نفاذ کرا سکتی ہے</text><text class="small" x="756" y="412" text-anchor="end">ابتدائی اقدامات آسان ہیں۔ جب مکالمہ ناکام ہو تب ہی معاملہ آگے بڑھائیں۔</text><text class="wm" x="24" y="425" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>