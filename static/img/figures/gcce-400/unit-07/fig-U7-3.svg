<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of three groups, one form of participation and one barrier each</title><desc id="d">Table of three groups in Pakistan, one form of participation and one barrier each. Youth: volunteering in a local clean-up or tutoring, against limited money, few jobs and being taken lightly. Women: running a welfare trust or standing for a union council seat, against social restrictions, unequal pay and safety concerns. Minorities: serving on a school committee or in public service, against prejudice and being under-represented in services.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="24" y="34">Participation and barriers</text><rect class="panel-a" x="24" y="52" width="130" height="40" rx="0"/><text class="sh" x="32" y="77">Group</text><rect class="panel-a" x="154" y="52" width="320" height="40" rx="0"/><text class="sh" x="162" y="77">One form of participation</text><rect class="panel-a" x="474" y="52" width="282" height="40" rx="0"/><text class="sh" x="482" y="77">One barrier</text><rect class="panel" x="24" y="92" width="130" height="72" rx="0"/><text class="sh" x="32" y="132">Youth</text><rect class="box" x="154" y="92" width="320" height="72" rx="0"/><text class="body" x="162" y="116">Volunteering in a local</text><text class="body" x="162" y="133">clean-up, or tutoring</text><text class="body" x="162" y="150">children after school</text><rect class="box" x="474" y="92" width="282" height="72" rx="0"/><text class="body" x="482" y="116">Limited money, few jobs,</text><text class="body" x="482" y="133">and being taken lightly</text><text class="body" x="482" y="150">by older people</text><rect class="panel" x="24" y="164" width="130" height="72" rx="0"/><text class="sh" x="32" y="204">Women</text><rect class="box" x="154" y="164" width="320" height="72" rx="0"/><text class="body" x="162" y="188">Running a welfare trust, or</text><text class="body" x="162" y="205">standing for a union</text><text class="body" x="162" y="222">council seat</text><rect class="box" x="474" y="164" width="282" height="72" rx="0"/><text class="body" x="482" y="188">Social restriction,</text><text class="body" x="482" y="205">unequal pay, and</text><text class="body" x="482" y="222">safety concerns</text><rect class="panel" x="24" y="236" width="130" height="72" rx="0"/><text class="sh" x="32" y="276">Minorities</text><rect class="box" x="154" y="236" width="320" height="72" rx="0"/><text class="body" x="162" y="260">Serving on a school</text><text class="body" x="162" y="277">committee, or in public</text><text class="body" x="162" y="294">service</text><rect class="box" x="474" y="236" width="282" height="72" rx="0"/><text class="body" x="482" y="260">Prejudice, and being</text><text class="body" x="482" y="277">under-represented in</text><text class="body" x="482" y="294">the services</text><text class="small" x="24" y="342">Each group takes part, and each meets a barrier. Removing one barrier often costs less than it appears.</text><text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
