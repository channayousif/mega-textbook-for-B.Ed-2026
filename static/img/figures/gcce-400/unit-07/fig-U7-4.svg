<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of five constitutional safeguards for equal participation</title><desc id="d">Diagram of five constitutional safeguards for equal participation, each in its own row with a one-line meaning. Article 25: all citizens are equal before law, with no discrimination on the basis of sex. Article 26: no discrimination in access to public places on grounds of race, religion, caste, sex, residence or place of birth. Article 27: no discrimination in appointment to the service of Pakistan. Article 36: the State safeguards the rights and interests of minorities, including their due representation in services. Article 37: the State shall promote, with special care, the educational and economic interests of backward classes or areas.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="410"/><text class="h" x="24" y="34">Constitutional safeguards for equal participation</text><rect class="panel-a" x="24" y="52" width="120" height="64" rx="6"/><text class="sh" x="32" y="90">Article 25</text><rect class="panel" x="144" y="52" width="612" height="64" rx="6"/><text class="sh" x="156" y="78">All citizens are equal before law</text><text class="small" x="156" y="100">No discrimination on the basis of sex</text><rect class="panel-a" x="24" y="116" width="120" height="64" rx="6"/><text class="sh" x="32" y="154">Article 26</text><rect class="panel" x="144" y="116" width="612" height="64" rx="6"/><text class="sh" x="156" y="142">No discrimination in access to public places</text><text class="small" x="156" y="164">On the ground only of race, religion, caste, sex, residence or place of birth</text><rect class="panel-a" x="24" y="180" width="120" height="64" rx="6"/><text class="sh" x="32" y="218">Article 27</text><rect class="panel" x="144" y="180" width="612" height="64" rx="6"/><text class="sh" x="156" y="206">No discrimination in appointment to service</text><text class="small" x="156" y="228">A qualified citizen may not be passed over</text><rect class="panel-a" x="24" y="244" width="120" height="64" rx="6"/><text class="sh" x="32" y="282">Article 36</text><rect class="panel" x="144" y="244" width="612" height="64" rx="6"/><text class="sh" x="156" y="270">The State safeguards minority rights</text><text class="small" x="156" y="292">Including their due representation in the services</text><rect class="panel-a" x="24" y="308" width="120" height="64" rx="6"/><text class="sh" x="32" y="346">Article 37</text><rect class="panel" x="144" y="308" width="612" height="64" rx="6"/><text class="sh" x="156" y="334">Special care for backward classes or areas</text><text class="small" x="156" y="356">Extra provision for an underserved district or class</text><text class="small" x="24" y="392">Each article places a duty on the State, not a favour on a citizen.</text><text class="wm" x="768" y="402" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
