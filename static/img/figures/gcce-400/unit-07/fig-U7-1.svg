<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the dimensions of diversity in Pakistan</title><desc id="d">Concept map of the dimensions of diversity in Pakistan. Six boxes surround a centre labelled Diversity in Pakistan: language, ethnicity, religion, region, economic class and political view. Each box carries one Pakistani example, such as Saraiki spoken in southern Punjab, a festival marked by one religious community, a village near Quetta and a family's views on a local issue.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><text class="h" x="24" y="34">Dimensions of diversity in Pakistan</text><line class="stroke" x1="225" y1="118" x2="310" y2="178" marker-end="url(#arrow)"/><line class="stroke" x1="555" y1="118" x2="470" y2="178" marker-end="url(#arrow)"/><line class="stroke" x1="228" y1="225" x2="287" y2="225" marker-end="url(#arrow)"/><line class="stroke" x1="548" y1="225" x2="497" y2="225" marker-end="url(#arrow)"/><line class="stroke" x1="225" y1="328" x2="310" y2="282" marker-end="url(#arrow)"/><line class="stroke" x1="555" y1="328" x2="470" y2="282" marker-end="url(#arrow)"/><rect class="panel-a" x="285" y="180" width="210" height="100" rx="6"/><text class="h" x="390" y="222" text-anchor="middle">Diversity in Pakistan</text><text class="small" x="390" y="248" text-anchor="middle">one society, many differences</text><rect class="panel" x="30" y="40" width="200" height="80" rx="6"/><text class="sh" x="40" y="64">Language</text><text class="body" x="40" y="85">Saraiki in southern</text><text class="body" x="40" y="102">Punjab; Urdu in cities</text><rect class="panel" x="550" y="40" width="200" height="80" rx="6"/><text class="sh" x="560" y="64">Ethnicity</text><text class="body" x="560" y="85">Punjabi, Sindhi,</text><text class="body" x="560" y="102">Pashtun, Baloch</text><rect class="panel" x="30" y="185" width="200" height="80" rx="6"/><text class="sh" x="40" y="209">Religion</text><text class="body" x="40" y="230">A festival marked by</text><text class="body" x="40" y="247">one community</text><rect class="panel" x="550" y="185" width="200" height="80" rx="6"/><text class="sh" x="560" y="209">Region</text><text class="body" x="560" y="230">A village near Quetta;</text><text class="body" x="560" y="247">a Karachi street</text><rect class="panel" x="30" y="330" width="200" height="80" rx="6"/><text class="sh" x="40" y="354">Economic class</text><text class="body" x="40" y="375">A family's income,</text><text class="body" x="40" y="392">work and land</text><rect class="panel" x="550" y="330" width="200" height="80" rx="6"/><text class="sh" x="560" y="354">Political view</text><text class="body" x="560" y="375">Views on a local issue</text><text class="body" x="560" y="392">at election time</text><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
