<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of practices that promote inclusive citizenship at three levels</title><desc id="d">Table of practices that promote inclusive citizenship at three levels. At home: asking each family member what they think, sharing chores regardless of sex, and letting children speak their home language. In school: seating and grouping that mix pupils, materials in a language pupils understand, extra time or a reader for a pupil who needs it, and a classroom rule that mockery of a person's background is not allowed. In the community: inviting every group to a school event, a notice board in more than one language, and a school management committee that includes women and minority members.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="24" y="34">Practices that promote inclusive citizenship</text><rect class="panel-a" x="24" y="52" width="130" height="40" rx="0"/><text class="sh" x="32" y="77">Level</text><rect class="panel-a" x="154" y="52" width="602" height="40" rx="0"/><text class="sh" x="162" y="77">Practices</text><rect class="panel" x="24" y="92" width="130" height="90" rx="0"/><text class="sh" x="32" y="128">At home</text><text class="small" x="32" y="148">family habits</text><rect class="box" x="154" y="92" width="602" height="90" rx="0"/><text class="body" x="162" y="122">Asking each family member what they think</text><text class="body" x="162" y="139">Sharing chores regardless of sex</text><text class="body" x="162" y="156">Letting children speak their home language</text><rect class="panel" x="24" y="182" width="130" height="150" rx="0"/><text class="sh" x="32" y="242">In school</text><text class="small" x="32" y="262">classroom and</text><text class="small" x="32" y="279">whole school</text><rect class="box" x="154" y="182" width="602" height="150" rx="0"/><text class="body" x="162" y="212">Seating and grouping that mix pupils</text><text class="body" x="162" y="229">Materials in a language pupils understand</text><text class="body" x="162" y="246">Extra time or a reader for a pupil who needs it</text><text class="body" x="162" y="263">A rule that mockery of a background is not allowed</text><rect class="panel" x="24" y="332" width="130" height="120" rx="0"/><text class="sh" x="32" y="382">In the</text><text class="sh" x="32" y="399">community</text><rect class="box" x="154" y="332" width="602" height="120" rx="0"/><text class="body" x="162" y="362">Inviting every group to a school event</text><text class="body" x="162" y="379">A notice board in more than one language</text><text class="body" x="162" y="396">A school management committee that includes</text><text class="body" x="162" y="413">women and minority members</text><text class="small" x="24" y="472">Rights on paper become real in habits at all three levels.</text><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
