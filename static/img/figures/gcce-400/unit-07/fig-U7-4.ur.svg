<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">برابر شرکت کے لیے آئینی تحفظات</title><desc id="d">برابر شرکت کے لیے پانچ آئینی تحفظات کا خاکہ، ہر ایک اپنی قطار میں ایک سطری مفہوم کے ساتھ۔ دفعہ 25: تمام شہری قانون کی نظر میں برابر ہیں، جنس کی بنیاد پر کوئی امتیاز نہیں۔ دفعہ 26: نسل، مذہب، ذات، جنس، جائے سکونت یا جائے پیدائش کی بنیاد پر عوامی مقامات تک رسائی میں کوئی امتیاز نہیں۔ دفعہ 27: سروس آف پاکستان میں تقرری میں کوئی امتیاز نہیں۔ دفعہ 36: ریاست اقلیتوں کے حقوق اور مفادات کا تحفظ کرے گی، بشمول خدمات میں مناسب نمائندگی۔ دفعہ 37: پسماندہ طبقات یا علاقوں کی تعلیمی اور معاشی بہتری پر خصوصی توجہ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="410"/><text class="h" x="756" y="34" text-anchor="end">برابر شرکت کے لیے آئینی تحفظات</text><rect class="panel-a" x="636" y="52" width="120" height="64" rx="6"/><text class="sh" x="696" y="90" text-anchor="middle">دفعہ 25</text><rect class="panel" x="24" y="52" width="612" height="64" rx="6"/><text class="sh" x="620" y="78" text-anchor="end">تمام شہری قانون کی نظر میں برابر ہیں</text><text class="small" x="620" y="100" text-anchor="end">جنس کی بنیاد پر کوئی امتیاز نہیں برتا جائے گا</text><rect class="panel-a" x="636" y="116" width="120" height="64" rx="6"/><text class="sh" x="696" y="154" text-anchor="middle">دفعہ 26</text><rect class="panel" x="24" y="116" width="612" height="64" rx="6"/><text class="sh" x="620" y="142" text-anchor="end">عوامی مقامات تک رسائی میں کوئی امتیاز نہیں</text><text class="small" x="620" y="164" text-anchor="end">نسل، مذہب، ذات، جنس، جائے سکونت یا جائے پیدائش کی بنیاد پر تفریق ممنوع ہے</text><rect class="panel-a" x="636" y="180" width="120" height="64" rx="6"/><text class="sh" x="696" y="218" text-anchor="middle">دفعہ 27</text><rect class="panel" x="24" y="180" width="612" height="64" rx="6"/><text class="sh" x="620" y="206" text-anchor="end">سرکاری ملازمتوں میں تقرری میں کوئی امتیاز نہیں</text><text class="small" x="620" y="228" text-anchor="end">اہل شہری کو امتیازی بنیادوں پر نظر انداز نہیں کیا جا سکتا</text><rect class="panel-a" x="636" y="244" width="120" height="64" rx="6"/><text class="sh" x="696" y="282" text-anchor="middle">دفعہ 36</text><rect class="panel" x="24" y="244" width="612" height="64" rx="6"/><text class="sh" x="620" y="270" text-anchor="end">ریاست اقلیتوں کے حقوق کا تحفظ کرے گی</text><text class="small" x="620" y="292" text-anchor="end">بشمول وفاقی و صوبائی ملازمتوں میں ان کی مناسب نمائندگی</text><rect class="panel-a" x="636" y="308" width="120" height="64" rx="6"/><text class="sh" x="696" y="346" text-anchor="middle">دفعہ 37</text><rect class="panel" x="24" y="308" width="612" height="64" rx="6"/><text class="sh" x="620" y="334" text-anchor="end">پسماندہ طبقات اور علاقوں پر خصوصی توجہ</text><text class="small" x="620" y="356" text-anchor="end">محروم اضلاع یا طبقات کے لیے تعلیمی اور معاشی خصوصی مراعات</text><text class="small" x="756" y="392" text-anchor="end">ہر دفعہ ریاست پر ایک فرض عائد کرتی ہے، یہ کسی شہری پر احسان نہیں۔</text><text class="wm" x="24" y="402" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>