<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The reciprocal balance between rights and responsibilities</title><desc id="d">Diagram showing the reciprocal balance between fundamental rights and civic responsibilities, showing that protections and freedoms depend upon citizens fulfilling duties like obeying the law and paying taxes.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="510"/><text class="h" x="24" y="34">The reciprocal balance: fundamental rights and civic responsibilities</text><rect class="panel-a" x="24" y="56" width="330" height="42" rx="6"/><text class="sh" x="36" y="82">Fundamental Rights (Articles 8-28)</text><rect class="panel" x="24" y="98" width="330" height="340" rx="6"/><text class="cell" x="36" y="124">What the State guarantees to citizens:</text><text class="cell" x="36" y="152">• Security of person and liberty (Article 9)</text><text class="cell" x="36" y="180">• Fair trial and due process (Article 10A)</text><text class="cell" x="36" y="208">• Inviolable dignity and home (Article 14)</text><text class="cell" x="36" y="236">• Freedom of speech and press (Article 19)</text><text class="cell" x="36" y="264">• Peaceful assembly (Article 16)</text><text class="cell" x="36" y="292">• Equality before the law (Article 25)</text><text class="cell" x="36" y="320">• Free, compulsory schooling (Article 25A)</text><text class="small" x="36" y="360">Enforceable under Article 199 in High Courts.</text><text class="small" x="36" y="378">Inconsistent laws are void under Article 8.</text><rect class="panel-b" x="426" y="56" width="330" height="42" rx="6"/><text class="sh" x="438" y="82">Civic Responsibilities (Article 5)</text><rect class="panel" x="426" y="98" width="330" height="340" rx="6"/><text class="cell" x="438" y="124">What the citizen owes to State and society:</text><text class="cell" x="438" y="152">• Basic duty of loyalty to State (Article 5(1))</text><text class="cell" x="438" y="180">• Inviolable obedience to law (Article 5(2))</text><text class="cell" x="438" y="208">• Honest tax payment to fund public goods</text><text class="cell" x="438" y="236">• Informed democratic voting (Article 51)</text><text class="cell" x="438" y="264">• Respecting equal rights of other citizens</text><text class="cell" x="438" y="292">• Protecting public property and spaces</text><text class="cell" x="438" y="320">• Peaceful resolution of local disputes</text><text class="small" x="438" y="360">Binds every citizen and resident in Pakistan.</text><text class="small" x="438" y="378">Sustains constitutional democracy in practice.</text><line class="stroke" x1="358" y1="170" x2="422" y2="170" marker-end="url(#arrow)"/><line class="stroke" x1="422" y1="290" x2="358" y2="290" marker-end="url(#arrow)"/><rect class="panel" x="366" y="210" width="48" height="40" rx="4"/><text class="cell" x="390" y="226" text-anchor="middle">Equal</text><text class="small" x="390" y="240" text-anchor="middle">balance</text><text class="small" x="24" y="465">Rights without duties lead to disorder; duties without rights lead to tyranny. Democracy needs both.</text><text class="wm" x="756" y="495" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>