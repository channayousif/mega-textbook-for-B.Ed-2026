<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">1973 کے آئین میں منتخب بنیادی حقوق (دفعات 8 تا 28)</title><desc id="d">1973 کے آئینِ پاکستان میں منتخب بنیادی حقوق کی جدول، جن میں دفعات 9، 10A، 14، 19، 25 اور 25A شامل ہیں، ان کی قانونی ضمانت اور شہریوں کے لیے عام زبان میں حفاظت درج ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="756" y="34" text-anchor="end">1973 کے آئین میں منتخب بنیادی حقوق (دفعات 8 تا 28)</text><rect class="panel-a" x="651" y="52" width="105" height="36"/><text class="sh" x="748" y="75" text-anchor="end">دفعہ</text><rect class="panel-a" x="500" y="52" width="151" height="36"/><text class="sh" x="643" y="75" text-anchor="end">حقوق کی ضمانت</text><rect class="panel-a" x="260" y="52" width="240" height="36"/><text class="sh" x="492" y="75" text-anchor="end">عام زبان میں مطلب</text><rect class="panel-a" x="24" y="52" width="236" height="36"/><text class="sh" x="252" y="75" text-anchor="end">شہریوں کی حفاظت</text><rect class="panel" x="651" y="88" width="105" height="66"/><text class="sh" x="748" y="116" text-anchor="end">دفعہ 9</text><rect class="bg" x="500" y="88" width="151" height="66"/><rect class="thin" x="500" y="88" width="151" height="66"/><text class="cell" x="643" y="114" text-anchor="end">شخص کی حفاظت</text><text class="small" x="643" y="132" text-anchor="end">جان اور آزادی</text><rect class="bg" x="260" y="88" width="240" height="66"/><rect class="thin" x="260" y="88" width="240" height="66"/><text class="cell" x="492" y="114" text-anchor="end">کوئی شخص قانون کے بغیر جان</text><text class="cell" x="492" y="132" text-anchor="end">یا آزادی سے محروم نہ ہو گا</text><rect class="bg" x="24" y="88" width="236" height="66"/><rect class="thin" x="24" y="88" width="236" height="66"/><text class="cell" x="252" y="114" text-anchor="end">غیر قانونی گرفتاری اور عدالت</text><text class="cell" x="252" y="132" text-anchor="end">سے باہر ہونے والے نقصان سے حفاظت</text><rect class="panel" x="651" y="154" width="105" height="66"/><text class="sh" x="748" y="182" text-anchor="end">دفعہ 10A</text><rect class="bg" x="500" y="154" width="151" height="66"/><rect class="thin" x="500" y="154" width="151" height="66"/><text class="cell" x="643" y="180" text-anchor="end">منصفانہ مقدمے کا حق</text><text class="small" x="643" y="198" text-anchor="end">2010 میں شامل ہوا</text><rect class="bg" x="260" y="154" width="240" height="66"/><rect class="thin" x="260" y="154" width="240" height="66"/><text class="cell" x="492" y="180" text-anchor="end">ہر قانونی نزاع میں منصفانہ</text><text class="cell" x="492" y="198" text-anchor="end">سننی اور مناسب قانونی طریقۂ کار</text><rect class="bg" x="24" y="154" width="236" height="66"/><rect class="thin" x="24" y="154" width="236" height="66"/><text class="cell" x="252" y="180" text-anchor="end">وکیل کی سہولت اور غیر</text><text class="cell" x="252" y="198" text-anchor="end">جانبدار سننی کی ضمانت</text><rect class="panel" x="651" y="220" width="105" height="66"/><text class="sh" x="748" y="248" text-anchor="end">دفعہ 14</text><rect class="bg" x="500" y="220" width="151" height="66"/><rect class="thin" x="500" y="220" width="151" height="66"/><text class="cell" x="643" y="246" text-anchor="end">انسان کا وقار</text><text class="small" x="643" y="264" text-anchor="end">اور گھر کی رازداری</text><rect class="bg" x="260" y="220" width="240" height="66"/><rect class="thin" x="260" y="220" width="240" height="66"/><text class="cell" x="492" y="246" text-anchor="end">وقار اور گھر کی نجی</text><text class="cell" x="492" y="264" text-anchor="end">زندگی ناقابلِ شکن ہے</text><rect class="bg" x="24" y="220" width="236" height="66"/><rect class="thin" x="24" y="220" width="236" height="66"/><text class="cell" x="252" y="246" text-anchor="end">تشدد، بیرحمی اور غیر قانونی</text><text class="cell" x="252" y="264" text-anchor="end">گھریلو تلاشی سے روکتا ہے</text><rect class="panel" x="651" y="286" width="105" height="66"/><text class="sh" x="748" y="314" text-anchor="end">دفعہ 19</text><rect class="bg" x="500" y="286" width="151" height="66"/><rect class="thin" x="500" y="286" width="151" height="66"/><text class="cell" x="643" y="312" text-anchor="end">آزادیِ اظہار</text><text class="small" x="643" y="330" text-anchor="end">اور آزاد پریس</text><rect class="bg" x="260" y="286" width="240" height="66"/><rect class="thin" x="260" y="286" width="240" height="66"/><text class="cell" x="492" y="312" text-anchor="end">معقول پابندیوں کے ساتھ</text><text class="cell" x="492" y="330" text-anchor="end">اظہار اور پریس کی آزادی</text><rect class="bg" x="24" y="286" width="236" height="66"/><rect class="thin" x="24" y="286" width="236" height="66"/><text class="cell" x="252" y="312" text-anchor="end">پُرامن اظہار اور ذمہ دار</text><text class="cell" x="252" y="330" text-anchor="end">صحافت کی حفاظت</text><rect class="panel" x="651" y="352" width="105" height="66"/><text class="sh" x="748" y="380" text-anchor="end">دفعہ 25</text><rect class="bg" x="500" y="352" width="151" height="66"/><rect class="thin" x="500" y="352" width="151" height="66"/><text class="cell" x="643" y="378" text-anchor="end">شہریوں کی مساوات</text><text class="small" x="643" y="396" text-anchor="end">قانونی مساوی تحفظ</text><rect class="bg" x="260" y="352" width="240" height="66"/><rect class="thin" x="260" y="352" width="240" height="66"/><text class="cell" x="492" y="378" text-anchor="end">تمام شہری قانون کے سامنے</text><text class="cell" x="492" y="396" text-anchor="end">برابر؛ جنس کی بنیاد پر کوئی امتیاز نہیں</text><rect class="bg" x="24" y="352" width="236" height="66"/><rect class="thin" x="24" y="352" width="236" height="66"/><text class="cell" x="252" y="378" text-anchor="end">امتیاز پر روک؛ خواتین کے</text><text class="cell" x="252" y="396" text-anchor="end">لیے فراخور تدابیر کی اجازت</text><rect class="panel" x="651" y="418" width="105" height="66"/><text class="sh" x="748" y="446" text-anchor="end">دفعہ 25A</text><rect class="bg" x="500" y="418" width="151" height="66"/><rect class="thin" x="500" y="418" width="151" height="66"/><text class="cell" x="643" y="444" text-anchor="end">تعلیم کا حق</text><text class="small" x="643" y="462" text-anchor="end">5 تا 16 سال</text><rect class="bg" x="260" y="418" width="240" height="66"/><rect class="thin" x="260" y="418" width="240" height="66"/><text class="cell" x="492" y="444" text-anchor="end">ریاست تمام بچوں کو مفت،</text><text class="cell" x="492" y="462" text-anchor="end">لازمی تعلیم دیتی ہے</text><rect class="bg" x="24" y="418" width="236" height="66"/><rect class="thin" x="24" y="418" width="236" height="66"/><text class="cell" x="252" y="444" text-anchor="end">اسکولی تعلیم کا نافذ ہونے</text><text class="cell" x="252" y="462" text-anchor="end">والا آئینی حق</text><rect class="stroke" x="24" y="52" width="732" height="432"/><text class="small" x="756" y="506" text-anchor="end">دفعہ 8 کے تحت، بنیادی حقوق سے متصادم کوئی بھی قانون یا رواج کالعدم ہے۔</text><text class="wm" x="12" y="526" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
