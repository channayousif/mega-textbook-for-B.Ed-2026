<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">باہمی توازن: بنیادی حقوق اور شہری ذمہ داریاں</title><desc id="d">ایک نقشہ جو بنیادی حقوق اور شہری ذمہ داریوں کے درمیان باہمی توازن دکھاتا ہے: تحفظ اور آزادیاں اس بات پر منحصر ہیں کہ شہری قانون کی پابندی اور محصول ادا کرنے جیسے فرائض پورے کرتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="510"/><text class="h" x="756" y="34" text-anchor="end">باہمی توازن: بنیادی حقوق اور شہری ذمہ داریاں</text><rect class="panel-a" x="426" y="56" width="330" height="42" rx="6"/><text class="sh" x="744" y="82" text-anchor="end">بنیادی حقوق (دفعات 8 تا 28)</text><rect class="panel" x="426" y="98" width="330" height="340" rx="6"/><text class="cell" x="744" y="124" text-anchor="end">وہ جو ریاست شہریوں کو ضمانت دیتی ہے:</text><text class="cell" x="744" y="152" text-anchor="end">• شخص اور آزادی کی حفاظت (دفعہ 9)</text><text class="cell" x="744" y="180" text-anchor="end">• منصفانہ مقدمہ اور مناسب قانونی طریقۂ کار (دفعہ 10A)</text><text class="cell" x="744" y="208" text-anchor="end">• ناقابلِ شکن وقار اور گھر (دفعہ 14)</text><text class="cell" x="744" y="236" text-anchor="end">• اظہار اور پریس کی آزادی (دفعہ 19)</text><text class="cell" x="744" y="264" text-anchor="end">• پُرامن اجتماع (دفعہ 16)</text><text class="cell" x="744" y="292" text-anchor="end">• قانون کے سامنے مساوات (دفعہ 25)</text><text class="cell" x="744" y="320" text-anchor="end">• مفت، لازمی اسکولی تعلیم (دفعہ 25A)</text><text class="small" x="744" y="360" text-anchor="end">ہائی کورٹوں میں دفعہ 199 کے تحت نافذ ہوتا ہے۔</text><text class="small" x="744" y="378" text-anchor="end">متصادم قوانین دفعہ 8 کے تحت کالعدم ہیں۔</text><rect class="panel-b" x="24" y="56" width="330" height="42" rx="6"/><text class="sh" x="342" y="82" text-anchor="end">شہری ذمہ داریاں (دفعہ 5)</text><rect class="panel" x="24" y="98" width="330" height="340" rx="6"/><text class="cell" x="342" y="124" text-anchor="end">وہ جو شہری کو ریاست اور معاشرے سے ادا کرنا ہے:</text><text class="cell" x="342" y="152" text-anchor="end">• ریاست سے وفاداری کا بنیادی فرض (دفعہ 5(1))</text><text class="cell" x="342" y="180" text-anchor="end">• قانون کی ناقابلِ شکن پابندی (دفعہ 5(2))</text><text class="cell" x="342" y="208" text-anchor="end">• عوامی خدمات کی مالی امداد کے لیے ایمانت داری سے محصول ادا کرنا</text><text class="cell" x="342" y="236" text-anchor="end">• باخبر جمہوری ووٹ (دفعہ 51)</text><text class="cell" x="342" y="264" text-anchor="end">• دیگر شہریوں کے مساوی حقوق کی عزت کرنا</text><text class="cell" x="342" y="292" text-anchor="end">• عوامی جائیداد اور مقامات کی حفاظت</text><text class="cell" x="342" y="320" text-anchor="end">• مقامی تنازعات کا پُرامن حل</text><text class="small" x="342" y="360" text-anchor="end">پاکستان میں ہر شہری اور رہائشی پر لازم ہے۔</text><text class="small" x="342" y="378" text-anchor="end">عملی طور پر آئینی جمہوریت کو سندھورتا ہے۔</text><line class="stroke" x1="422" y1="170" x2="358" y2="170" marker-end="url(#arrow)"/><line class="stroke" x1="358" y1="290" x2="422" y2="290" marker-end="url(#arrow)"/><rect class="panel" x="366" y="210" width="48" height="40" rx="4"/><text class="cell" x="390" y="226" text-anchor="middle">مساوی</text><text class="small" x="390" y="240" text-anchor="middle">توازن</text><text class="small" x="756" y="465" text-anchor="end">حقوق فرائض کے بغیر بے نظمی کی طرف لے جاتے ہیں؛ فرائض حقوق کے بغیر ظلم و جبر کی طرف۔ جمہوریت کو دونوں کی ضرورت ہے۔</text><text class="wm" x="12" y="495" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
