<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">پاکستان میں ایک شہری کے فرائض اور ذمہ داریاں</title><desc id="d">تصوری نقشہ: شہری کے فرائض اور ذمہ داریاں مرکزی نوڈ سے پانچ شعبوں میں منشعب ہیں: دفعہ 5 کے تحت ریاست سے وفاداری، قانون کی پابندی، محصول ادا کرنا، جمہوری انتخابات میں حصہ لینا، اور دوسروں کے حقوق کی عزت کرنا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="756" y="34" text-anchor="end">پاکستان میں ایک شہری کے فرائض اور ذمہ داریاں</text><line class="stroke" x1="480" y1="185" x2="526" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="300" y1="185" x2="254" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="480" y1="255" x2="526" y2="285" marker-end="url(#arrow)"/><line class="stroke" x1="300" y1="255" x2="254" y2="285" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="262" x2="390" y2="395" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="220" rx="130" ry="42"/><text class="h" x="390" y="216" text-anchor="middle">شہری کے فرائض اور</text><text class="h" x="390" y="234" text-anchor="middle">ذمہ داریاں</text><rect class="panel" x="24" y="60" width="230" height="108" rx="8"/><text class="sh" x="242" y="86" text-anchor="end">قانون کی پابندی</text><text class="cell" x="242" y="108" text-anchor="end">دفعہ 5(2): آئین اور قانون پر</text><text class="cell" x="242" y="125" text-anchor="end">عمل کرنے کا ناقابلِ شکن فرض</text><rect class="panel" x="526" y="60" width="230" height="108" rx="8"/><text class="sh" x="744" y="86" text-anchor="end">ریاست سے وفاداری</text><text class="cell" x="744" y="108" text-anchor="end">دفعہ 5(1): ہر شہری کا بنیادی</text><text class="cell" x="744" y="125" text-anchor="end">فرض؛ ریاست کی حاکمیت اور</text><text class="cell" x="744" y="142" text-anchor="end">عوامی امن کا تحفظ</text><rect class="panel" x="24" y="280" width="230" height="108" rx="8"/><text class="sh" x="242" y="306" text-anchor="end">جمہوری شرکت</text><text class="cell" x="242" y="328" text-anchor="end">دفعہ 51 کے تحت ووٹ دینا،</text><text class="cell" x="242" y="345" text-anchor="end">عوامی مسائل پر نظر رکھنا</text><text class="cell" x="242" y="362" text-anchor="end">اور شہری اجلاسوں میں حصہ لینا</text><rect class="panel" x="526" y="280" width="230" height="108" rx="8"/><text class="sh" x="744" y="306" text-anchor="end">ایمانت داری سے محصول ادا کرنا</text><text class="cell" x="744" y="328" text-anchor="end">عوامی اداروں کی مالی امداد:</text><text class="cell" x="744" y="345" text-anchor="end">سرکاری اسکول، ہسپتال،</text><text class="cell" x="744" y="362" text-anchor="end">سڑکیں اور صاف پانی</text><rect class="panel" x="275" y="395" width="230" height="108" rx="8"/><text class="sh" x="493" y="421" text-anchor="end">دوسروں کے حقوق کی عزت کرنا</text><text class="cell" x="493" y="443" text-anchor="end">وقار کا تحفظ (دفعہ 14)،</text><text class="cell" x="493" y="460" text-anchor="end">مذہب کی آزادی (دفعہ 20)</text><text class="cell" x="493" y="477" text-anchor="end">اور پُرامن رواداری</text><text class="small" x="756" y="525" text-anchor="end">دفعہ 5 آئین اور قانون کی پابندی کو ہر شہری اور رہائشی کا فرض بناتا ہے۔</text><text class="wm" x="12" y="528" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
