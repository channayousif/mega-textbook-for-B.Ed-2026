<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Duties and responsibilities of a citizen</title><desc id="d">Concept map showing citizen duties and responsibilities branching from a central node into five areas: constitutional loyalty under Article 5, obedience to law, paying taxes, democratic voting, and respecting others' rights.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="34">Duties and responsibilities of a citizen in Pakistan</text><line class="stroke" x1="300" y1="185" x2="254" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="480" y1="185" x2="526" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="300" y1="255" x2="254" y2="285" marker-end="url(#arrow)"/><line class="stroke" x1="480" y1="255" x2="526" y2="285" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="262" x2="390" y2="395" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="220" rx="130" ry="42"/><text class="h" x="390" y="216" text-anchor="middle">Citizen duties and</text><text class="h" x="390" y="234" text-anchor="middle">responsibilities</text><rect class="panel" x="24" y="60" width="230" height="108" rx="8"/><text class="sh" x="36" y="86">Loyalty to the State</text><text class="cell" x="36" y="108">Article 5(1): basic duty of</text><text class="cell" x="36" y="125">every citizen; defending state</text><text class="cell" x="36" y="142">sovereignty and public peace</text><rect class="panel" x="526" y="60" width="230" height="108" rx="8"/><text class="sh" x="538" y="86">Obedience to law</text><text class="cell" x="538" y="108">Article 5(2): inviolable</text><text class="cell" x="538" y="125">obligation to obey the</text><text class="cell" x="538" y="142">Constitution and statutory laws</text><rect class="panel" x="24" y="280" width="230" height="108" rx="8"/><text class="sh" x="36" y="306">Paying taxes honestly</text><text class="cell" x="36" y="328">Funding public institutions:</text><text class="cell" x="36" y="345">government schools, hospitals,</text><text class="cell" x="36" y="362">roads, and clean water</text><rect class="panel" x="526" y="280" width="230" height="108" rx="8"/><text class="sh" x="538" y="306">Democratic participation</text><text class="cell" x="538" y="328">Voting under Article 51,</text><text class="cell" x="538" y="345">following public issues, and</text><text class="cell" x="538" y="362">taking part in civic meetings</text><rect class="panel" x="275" y="395" width="230" height="108" rx="8"/><text class="sh" x="287" y="421">Respecting others' rights</text><text class="cell" x="287" y="443">Protecting dignity (Article 14),</text><text class="cell" x="287" y="460">religious freedom (Article 20),</text><text class="cell" x="287" y="477">and practicing peaceful tolerance</text><text class="small" x="24" y="525">Article 5 makes obedience to the Constitution and law the duty of every citizen and resident.</text><text class="wm" x="768" y="528" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>