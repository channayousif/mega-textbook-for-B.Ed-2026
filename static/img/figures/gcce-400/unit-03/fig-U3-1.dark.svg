<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Selected Fundamental Rights in the Constitution of Pakistan (1973)</title><desc id="d">Table of selected fundamental rights in the 1973 Constitution of Pakistan, listing Articles 9, 10A, 14, 19, 25 and 25A with their legal guarantee and plain-language safeguard for citizens.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="34">Selected Fundamental Rights in the 1973 Constitution (Articles 8-28)</text><rect class="panel-a" x="24" y="52" width="105" height="36"/><text class="sh" x="32" y="75">Article</text><rect class="panel-a" x="129" y="52" width="151" height="36"/><text class="sh" x="137" y="75">Right guaranteed</text><rect class="panel-a" x="280" y="52" width="240" height="36"/><text class="sh" x="288" y="75">Plain-language meaning</text><rect class="panel-a" x="520" y="52" width="236" height="36"/><text class="sh" x="528" y="75">Safeguard for citizens</text><rect class="panel" x="24" y="88" width="105" height="66"/><text class="sh" x="32" y="116">Article 9</text><rect class="bg" x="129" y="88" width="151" height="66"/><rect class="thin" x="129" y="88" width="151" height="66"/><text class="cell" x="137" y="114">Security of person</text><text class="small" x="137" y="132">Life and liberty</text><rect class="bg" x="280" y="88" width="240" height="66"/><rect class="thin" x="280" y="88" width="240" height="66"/><text class="cell" x="288" y="114">No person deprived of life or</text><text class="cell" x="288" y="132">liberty except by law</text><rect class="bg" x="520" y="88" width="236" height="66"/><rect class="thin" x="520" y="88" width="236" height="66"/><text class="cell" x="528" y="114">Protects against unlawful arrest</text><text class="cell" x="528" y="132">and extrajudicial harm</text><rect class="panel" x="24" y="154" width="105" height="66"/><text class="sh" x="32" y="182">Article 10A</text><rect class="bg" x="129" y="154" width="151" height="66"/><rect class="thin" x="129" y="154" width="151" height="66"/><text class="cell" x="137" y="180">Right to fair trial</text><text class="small" x="137" y="198">Added in 2010</text><rect class="bg" x="280" y="154" width="240" height="66"/><rect class="thin" x="280" y="154" width="240" height="66"/><text class="cell" x="288" y="180">Fair hearing and due process</text><text class="cell" x="288" y="198">in all legal disputes</text><rect class="bg" x="520" y="154" width="236" height="66"/><rect class="thin" x="520" y="154" width="236" height="66"/><text class="cell" x="528" y="180">Guarantees legal counsel and</text><text class="cell" x="528" y="198">an impartial hearing</text><rect class="panel" x="24" y="220" width="105" height="66"/><text class="sh" x="32" y="248">Article 14</text><rect class="bg" x="129" y="220" width="151" height="66"/><rect class="thin" x="129" y="220" width="151" height="66"/><text class="cell" x="137" y="246">Dignity of man</text><text class="small" x="137" y="264">and privacy of home</text><rect class="bg" x="280" y="220" width="240" height="66"/><rect class="thin" x="280" y="220" width="240" height="66"/><text class="cell" x="288" y="246">Dignity and private domestic life</text><text class="cell" x="288" y="264">are inviolable</text><rect class="bg" x="520" y="220" width="236" height="66"/><rect class="thin" x="520" y="220" width="236" height="66"/><text class="cell" x="528" y="246">Outlaws torture, cruelty, and</text><text class="cell" x="528" y="264">unlawful home searches</text><rect class="panel" x="24" y="286" width="105" height="66"/><text class="sh" x="32" y="314">Article 19</text><rect class="bg" x="129" y="286" width="151" height="66"/><rect class="thin" x="129" y="286" width="151" height="66"/><text class="cell" x="137" y="312">Freedom of speech</text><text class="small" x="137" y="330">and free press</text><rect class="bg" x="280" y="286" width="240" height="66"/><rect class="thin" x="280" y="286" width="240" height="66"/><text class="cell" x="288" y="312">Freedom of speech and press</text><text class="cell" x="288" y="330">under reasonable limits</text><rect class="bg" x="520" y="286" width="236" height="66"/><rect class="thin" x="520" y="286" width="236" height="66"/><text class="cell" x="528" y="312">Protects peaceful expression</text><text class="cell" x="528" y="330">and responsible journalism</text><rect class="panel" x="24" y="352" width="105" height="66"/><text class="sh" x="32" y="380">Article 25</text><rect class="bg" x="129" y="352" width="151" height="66"/><rect class="thin" x="129" y="352" width="151" height="66"/><text class="cell" x="137" y="378">Equality of citizens</text><text class="small" x="137" y="396">Equal legal protection</text><rect class="bg" x="280" y="352" width="240" height="66"/><rect class="thin" x="280" y="352" width="240" height="66"/><text class="cell" x="288" y="378">All citizens equal before law;</text><text class="cell" x="288" y="396">no gender discrimination</text><rect class="bg" x="520" y="352" width="236" height="66"/><rect class="thin" x="520" y="352" width="236" height="66"/><text class="cell" x="528" y="378">Bars discrimination; allows</text><text class="cell" x="528" y="396">affirmative action for women</text><rect class="panel" x="24" y="418" width="105" height="66"/><text class="sh" x="32" y="446">Article 25A</text><rect class="bg" x="129" y="418" width="151" height="66"/><rect class="thin" x="129" y="418" width="151" height="66"/><text class="cell" x="137" y="444">Right to education</text><text class="small" x="137" y="462">Ages 5 to 16</text><rect class="bg" x="280" y="418" width="240" height="66"/><rect class="thin" x="280" y="418" width="240" height="66"/><text class="cell" x="288" y="444">State provides free, compulsory</text><text class="cell" x="288" y="462">education to all children</text><rect class="bg" x="520" y="418" width="236" height="66"/><rect class="thin" x="520" y="418" width="236" height="66"/><text class="cell" x="528" y="444">Enforceable constitutional</text><text class="cell" x="528" y="462">entitlement to schooling</text><rect class="stroke" x="24" y="52" width="732" height="432"/><text class="small" x="24" y="506">Under Article 8, any law or custom conflicting with fundamental rights is void.</text><text class="wm" x="756" y="526" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>