<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">پاکستان کے آئینی حقوق کے اہم مراحل</title><desc id="d">پاکستان کی آئینی ترقی کی خط زمانی: 1956، 1962 اور 1973 کے آئین، اس کے بعد 2010 کی اٹھارہویں ترمیم جنہوں نے شہریوں کے لیے دفعہ 25A اور دفعہ 19A شامل کیے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><text class="h" x="756" y="34" text-anchor="end">پاکستان کے آئینی حقوق کے اہم مراحل</text><line class="stroke" x1="672" y1="93" x2="672" y2="485" marker-end="url(#arrow)"/><rect class="panel" x="24" y="56" width="606" height="74" rx="6"/><text class="sh" x="618" y="80" text-anchor="end">1956: پاکستان کا پہلا آئین</text><text class="cell" x="618" y="100" text-anchor="end">پاکستان کو اسلامی جمہوریہ قرار دیا گیا۔ اس میں عدالتوں کے</text><text class="cell" x="618" y="117" text-anchor="end">ذریعے نافذ ہونے والے بنیادی حقوق کا رسمی باب شامل تھا۔ اکتوبر 1958 میں منسوخ ہوا۔</text><line class="thin" x1="666" y1="93" x2="630" y2="93"/><circle class="dot" cx="672" cy="93" r="6"/><rect class="panel" x="24" y="148" width="606" height="74" rx="6"/><text class="sh" x="618" y="172" text-anchor="end">1962: دوسرا آئین</text><text class="cell" x="618" y="192" text-anchor="end">غیر براہِ راست انتخابات کے ساتھ صدارتی نظام متعارف کرایا گیا۔</text><text class="cell" x="618" y="209" text-anchor="end">بنیادی حقوق پہلے شامل نہیں تھے، پھر 1963 کی پہلی ترمیم سے بحال کر دیے گئے۔</text><line class="thin" x1="666" y1="185" x2="630" y2="185"/><circle class="dot" cx="672" cy="185" r="6"/><rect class="panel" x="24" y="240" width="606" height="86" rx="6"/><text class="sh" x="618" y="264" text-anchor="end">1973: تیسرا آئین (اجماعی چارہ جا)</text><text class="cell" x="618" y="284" text-anchor="end">14 اگست 1973 کو پارلیمانی اجماع سے نافذ ہوا۔ وفاقی پارلیمانی</text><text class="cell" x="618" y="301" text-anchor="end">جمہوریت قائم ہوئی اور بنیادی حقوق کو دفعات 8 تا 28 میں رکھا</text><text class="cell" x="618" y="318" text-anchor="end">گیا، جو ہائی کورٹوں (دفعہ 199) کے ذریعے نافذ ہوتے ہیں۔</text><line class="thin" x1="666" y1="283" x2="630" y2="283"/><circle class="dot" cx="672" cy="283" r="6"/><rect class="panel-a" x="24" y="344" width="606" height="86" rx="6"/><text class="sh" x="618" y="368" text-anchor="end">2010: اٹھارہویں ترمیم (حقوق کی وسعت)</text><text class="cell" x="618" y="388" text-anchor="end">تمام پارٹیوں کے درمیان اہم اصلاحات جن میں دفعہ 25A (5 تا 16 سال کے</text><text class="cell" x="618" y="405" text-anchor="end">بچوں کے لیے مفت اور لازمی تعلیم کا حق)، دفعہ 19A (معلومات کا حق)</text><text class="cell" x="618" y="422" text-anchor="end">اور دفعہ 10A (منصفانہ مقدمے کا حق) شامل ہوئے۔ صوبوں کی خودمختاری مضبوط ہوئی۔</text><line class="thin" x1="666" y1="387" x2="630" y2="387"/><circle class="dot" cx="672" cy="387" r="6"/><rect class="panel" x="24" y="448" width="606" height="74" rx="6"/><text class="sh" x="618" y="472" text-anchor="end">آج: اعلی قانون اور نافذ ہونے والے تحفظات</text><text class="cell" x="618" y="492" text-anchor="end">آئین اعلی قانونی مرجع ہے۔ اعلی عدالتیں بنیادی حقوق کی</text><text class="cell" x="618" y="509" text-anchor="end">حفاظت کرتی ہیں جبکہ دفعہ 5 ہر شہری کو ریاست سے وفاداری اور قانون کی پابندی پر لازم رکھتا ہے۔</text><line class="thin" x1="666" y1="485" x2="630" y2="485"/><circle class="dot" cx="672" cy="485" r="6"/><text class="small" x="756" y="555" text-anchor="end">1973 کا آئین پاکستان میں شہری حقوق کی زندہ قانونی بنیاد ہے۔</text><text class="wm" x="12" y="560" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
