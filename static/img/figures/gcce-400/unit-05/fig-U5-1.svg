<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of how public opinion forms on a civic issue</title><desc id="d">Flowchart showing five sequential steps in public opinion formation: 1. Public issue emerges, 2. Information spreads, 3. Public discussion and debate, 4. Public opinion crystallises, 5. Influence on public policy and decisions.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="34">How public opinion forms on a community issue</text><rect class="panel" x="50" y="50" width="680" height="66" rx="6"/><text class="sh" x="66" y="72">1. Public issue emerges</text><text class="cell" x="66" y="90">A shared community problem or policy concern arises (for example,</text><text class="cell" x="66" y="106">road safety outside schools).</text><line class="stroke" x1="390" y1="116" x2="390" y2="136" marker-end="url(#arrow)"/><rect class="panel" x="50" y="138" width="680" height="66" rx="6"/><text class="sh" x="66" y="160">2. Information spreads</text><text class="cell" x="66" y="178">Facts, news reports, and community experiences are shared through</text><text class="cell" x="66" y="194">media, schools, and social circles.</text><line class="stroke" x1="390" y1="204" x2="390" y2="224" marker-end="url(#arrow)"/><rect class="panel-a" x="50" y="226" width="680" height="66" rx="6"/><text class="sh" x="66" y="248">3. Public discussion and debate (public discourse)</text><text class="cell" x="66" y="266">Citizens, parents, and teachers exchange views, test arguments,</text><text class="cell" x="66" y="282">and weigh proposed solutions.</text><line class="stroke" x1="390" y1="292" x2="390" y2="312" marker-end="url(#arrow)"/><rect class="panel" x="50" y="314" width="680" height="66" rx="6"/><text class="sh" x="66" y="336">4. Public opinion crystallises</text><text class="cell" x="66" y="354">Broad collective agreement or clear alternative viewpoints take</text><text class="cell" x="66" y="370">definite shape among community members.</text><line class="stroke" x1="390" y1="380" x2="390" y2="400" marker-end="url(#arrow)"/><rect class="panel-b" x="50" y="402" width="680" height="66" rx="6"/><text class="sh" x="66" y="424">5. Influence on public decisions and action</text><text class="cell" x="66" y="442">Elected representatives, district officials, or school councils</text><text class="cell" x="66" y="458">respond with concrete policy, budgets, or rules.</text><text class="small" x="24" y="504">Public discourse in Step 3 is the engine that shapes reasoned and informed public opinion.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
