<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Sources of public opinion with strengths and risks</title><desc id="d">Table comparing four primary sources of public opinion: Family and community, Schools and education, Mass media and journalism, and Social media platforms, showing their main feature, key strength, and main risk.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="34">Sources of public opinion: features, strengths, and risks</text><rect class="panel-a" x="24" y="52" width="160" height="36" rx="4"/><text class="sh" x="32" y="75">Source</text><rect class="panel-a" x="188" y="52" width="186" height="36" rx="4"/><text class="sh" x="196" y="75">Main feature</text><rect class="panel-a" x="378" y="52" width="186" height="36" rx="4"/><text class="sh" x="386" y="75">Key strength</text><rect class="panel-a" x="568" y="52" width="188" height="36" rx="4"/><text class="sh" x="576" y="75">Main risk</text><rect class="panel" x="24" y="92" width="160" height="98" rx="4"/><text class="sh" x="32" y="118">Family and local</text><text class="sh" x="32" y="136">community</text><rect class="panel" x="188" y="92" width="186" height="98" rx="4"/><text class="cell" x="196" y="118">Oral conversations, shared</text><text class="cell" x="196" y="136">neighbourhood ties, and</text><text class="cell" x="196" y="154">trusted local elders</text><rect class="panel" x="378" y="92" width="186" height="98" rx="4"/><text class="cell" x="386" y="118">Builds strong social trust</text><text class="cell" x="386" y="136">and deep personal sense</text><text class="cell" x="386" y="154">of belonging</text><rect class="panel" x="568" y="92" width="188" height="98" rx="4"/><text class="cell" x="576" y="118">Can pass down biases or</text><text class="cell" x="576" y="136">isolate people from new</text><text class="cell" x="576" y="154">viewpoints</text><rect class="panel" x="24" y="194" width="160" height="98" rx="4"/><text class="sh" x="32" y="220">Schools and</text><text class="sh" x="32" y="238">institutions</text><rect class="panel" x="188" y="194" width="186" height="98" rx="4"/><text class="cell" x="196" y="220">Formal curriculum,</text><text class="cell" x="196" y="238">teacher-guided debate,</text><text class="cell" x="196" y="256">and civic education</text><rect class="panel" x="378" y="194" width="186" height="98" rx="4"/><text class="cell" x="386" y="220">Teaches evidence, critical</text><text class="cell" x="386" y="238">inquiry, and verified civic</text><text class="cell" x="386" y="256">knowledge</text><rect class="panel" x="568" y="194" width="188" height="98" rx="4"/><text class="cell" x="576" y="220">May lean on rote learning</text><text class="cell" x="576" y="238">if teachers avoid active</text><text class="cell" x="576" y="256">classroom discussion</text><rect class="panel" x="24" y="296" width="160" height="98" rx="4"/><text class="sh" x="32" y="322">Mass media and</text><text class="sh" x="32" y="340">journalism</text><rect class="panel" x="188" y="296" width="186" height="98" rx="4"/><text class="cell" x="196" y="322">Newspapers, radio, TV,</text><text class="cell" x="196" y="340">and formal investigative</text><text class="cell" x="196" y="358">reporting</text><rect class="panel" x="378" y="296" width="186" height="98" rx="4"/><text class="cell" x="386" y="322">Reaches wide audiences</text><text class="cell" x="386" y="340">with structured facts and</text><text class="cell" x="386" y="358">diverse commentary</text><rect class="panel" x="568" y="296" width="188" height="98" rx="4"/><text class="cell" x="576" y="322">Sensationalism or owners'</text><text class="cell" x="576" y="340">interests may distort the</text><text class="cell" x="576" y="358">real public balance</text><rect class="panel" x="24" y="398" width="160" height="98" rx="4"/><text class="sh" x="32" y="424">Social media</text><text class="sh" x="32" y="442">networks</text><rect class="panel" x="188" y="398" width="186" height="98" rx="4"/><text class="cell" x="196" y="424">User-generated posts,</text><text class="cell" x="196" y="442">interactive video, and</text><text class="cell" x="196" y="460">instant messaging</text><rect class="panel" x="378" y="398" width="186" height="98" rx="4"/><text class="cell" x="386" y="424">Fast sharing of local</text><text class="cell" x="386" y="442">voices and rapid civic</text><text class="cell" x="386" y="460">coordination</text><rect class="panel" x="568" y="398" width="188" height="98" rx="4"/><text class="cell" x="576" y="424">Echo chambers and bots</text><text class="cell" x="576" y="442">can amplify rumours and</text><text class="cell" x="576" y="460">fake popularity</text><text class="small" x="24" y="520">Responsible citizens cross-check claims across multiple sources before forming opinions.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
