<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing advocacy, lobbying, and protest</title><desc id="d">Comparison table showing the focus, primary methods, target audience, and a Pakistani educational example for advocacy, lobbying, and protest.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="490"/><text class="h" x="24" y="34">Advocacy, lobbying, and protest compared</text><rect class="panel-a" x="24" y="52" width="130" height="36" rx="4"/><text class="sh" x="32" y="75">Approach</text><rect class="panel-a" x="158" y="52" width="190" height="36" rx="4"/><text class="sh" x="166" y="75">Primary focus</text><rect class="panel-a" x="352" y="52" width="206" height="36" rx="4"/><text class="sh" x="360" y="75">Main methods</text><rect class="panel-a" x="562" y="52" width="194" height="36" rx="4"/><text class="sh" x="570" y="75">Pakistani example</text><rect class="panel" x="24" y="92" width="130" height="104" rx="4"/><text class="sh" x="32" y="118">Advocacy</text><rect class="panel" x="158" y="92" width="190" height="104" rx="4"/><text class="cell" x="166" y="118">Building public support</text><text class="cell" x="166" y="136">and coalition to solve a</text><text class="cell" x="166" y="154">shared community issue</text><rect class="panel" x="352" y="92" width="206" height="104" rx="4"/><text class="cell" x="360" y="118">Research, policy briefs,</text><text class="cell" x="360" y="136">community dialogue, and</text><text class="cell" x="360" y="154">public awareness work</text><rect class="panel" x="562" y="92" width="194" height="104" rx="4"/><text class="cell" x="570" y="118">Parents and teachers</text><text class="cell" x="570" y="136">document girl student</text><text class="cell" x="570" y="154">transport needs</text><rect class="panel" x="24" y="200" width="130" height="104" rx="4"/><text class="sh" x="32" y="226">Lobbying</text><rect class="panel" x="158" y="200" width="190" height="104" rx="4"/><text class="cell" x="166" y="226">Directly persuading</text><text class="cell" x="166" y="244">officials or legislators</text><text class="cell" x="166" y="262">on draft rules or bills</text><rect class="panel" x="352" y="200" width="206" height="104" rx="4"/><text class="cell" x="360" y="226">Delegations, formal</text><text class="cell" x="360" y="244">submissions, hearings,</text><text class="cell" x="360" y="262">and legal memoranda</text><rect class="panel" x="562" y="200" width="194" height="104" rx="4"/><text class="cell" x="570" y="226">Headteachers meet</text><text class="cell" x="570" y="244">officials to request</text><text class="cell" x="570" y="262">science lab funds</text><rect class="panel" x="24" y="308" width="130" height="104" rx="4"/><text class="sh" x="32" y="334">Protest</text><rect class="panel" x="158" y="308" width="190" height="104" rx="4"/><text class="cell" x="166" y="334">Demonstrating collective</text><text class="cell" x="166" y="352">dissent and urgent demand</text><text class="cell" x="166" y="370">in public (Article 16)</text><rect class="panel" x="352" y="308" width="206" height="104" rx="4"/><text class="cell" x="360" y="334">Peaceful assemblies,</text><text class="cell" x="360" y="352">marches, placards, and</text><text class="cell" x="360" y="370">public rallies</text><rect class="panel" x="562" y="308" width="194" height="104" rx="4"/><text class="cell" x="570" y="334">Citizens hold a peaceful</text><text class="cell" x="570" y="352">walk to demand school</text><text class="cell" x="570" y="370">repairs after floods</text><text class="small" x="24" y="442">Advocacy is the broadest framework: it often uses evidence, dialogue, and lobbying before protest.</text><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
