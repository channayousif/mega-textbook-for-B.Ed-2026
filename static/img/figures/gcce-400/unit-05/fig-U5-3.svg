<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the six steps in an advocacy plan</title><desc id="d">Flowchart illustrating the six steps of an advocacy cycle: 1. Identify the social issue, 2. Gather evidence and data, 3. Map target audience, 4. Craft clear message, 5. Take coordinated action, and 6. Review and assess impact.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="24" y="34">The six steps of a community advocacy cycle</text><rect class="panel-a" x="24" y="56" width="220" height="110" rx="6"/><text class="sh" x="34" y="80">1. Identify the issue</text><text class="cell" x="34" y="102">Define a concrete,</text><text class="cell" x="34" y="120">solvable community need</text><text class="cell" x="34" y="138">(e.g. school drinking water)</text><line class="stroke" x1="244" y1="111" x2="274" y2="111" marker-end="url(#arrow)"/><rect class="panel" x="280" y="56" width="220" height="110" rx="6"/><text class="sh" x="290" y="80">2. Gather evidence</text><text class="cell" x="290" y="102">Collect attendance logs,</text><text class="cell" x="290" y="120">clinic reports, and</text><text class="cell" x="290" y="138">verified facts</text><line class="stroke" x1="500" y1="111" x2="530" y2="111" marker-end="url(#arrow)"/><rect class="panel" x="536" y="56" width="220" height="110" rx="6"/><text class="sh" x="546" y="80">3. Map target audience</text><text class="cell" x="546" y="102">Identify officials with</text><text class="cell" x="546" y="120">authority (DEO, taluka</text><text class="cell" x="546" y="138">officer, or SMC members)</text><line class="stroke" x1="646" y1="166" x2="646" y2="198" marker-end="url(#arrow)"/><rect class="panel" x="536" y="204" width="220" height="110" rx="6"/><text class="sh" x="546" y="228">4. Craft clear message</text><text class="cell" x="546" y="250">Frame problem, data,</text><text class="cell" x="546" y="268">constitutional right (25A),</text><text class="cell" x="546" y="286">and practical remedy</text><line class="stroke" x1="536" y1="259" x2="506" y2="259" marker-end="url(#arrow)"/><rect class="panel" x="280" y="204" width="220" height="110" rx="6"/><text class="sh" x="290" y="228">5. Coordinated action</text><text class="cell" x="290" y="250">Conduct meetings, write</text><text class="cell" x="290" y="268">formal petitions, and</text><text class="cell" x="290" y="286">mobilise community allies</text><line class="stroke" x1="280" y1="259" x2="250" y2="259" marker-end="url(#arrow)"/><rect class="panel-b" x="24" y="204" width="220" height="110" rx="6"/><text class="sh" x="34" y="228">6. Review and assess</text><text class="cell" x="34" y="250">Evaluate what changed,</text><text class="cell" x="34" y="268">track progress, and plan</text><text class="cell" x="34" y="286">next steps or follow-up</text><line class="stroke" x1="134" y1="204" x2="134" y2="172" marker-end="url(#arrow)"/><text class="small" x="24" y="370">Advocacy is a cyclical process: review findings guide the next round of civic action.</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
