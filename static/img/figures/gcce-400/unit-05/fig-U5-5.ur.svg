<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سماجی تحریک کے چار مراحل کا ڈیاگرام</title><desc id="d">ڈیاگرام جو سماجی تحریک کے چار مراحل اوپن اسٹیکس سوشیالوجی 3e سے ماخوذ دکھاتا ہے: ابتداؤ، متحد ہونا، انتظامی شکل کی طرف رہنمائی، اور زوال، اور ہر مرحلے کی اہم خصوصیات کی وضاحت کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="760" y="34" text-anchor="end">سماجی تحریک کے چار مراحل (اوپن اسٹیکس سوشیالوجی 3e)</text><rect class="panel" x="590" y="56" width="170" height="280" rx="6"/><text class="sh" x="750" y="82" text-anchor="end">1. ابتداؤ</text><text class="small" x="750" y="100" text-anchor="end">ابتدائی مرحلہ</text><text class="cell" x="750" y="130" text-anchor="end">وسیع ناراضگی</text><text class="cell" x="750" y="148" text-anchor="end">شروع ہوتی ہے</text><text class="cell" x="750" y="166" text-anchor="end">کسی سماجی</text><text class="cell" x="750" y="184" text-anchor="end">حالت پر۔</text><text class="cell" x="750" y="200" text-anchor="end">عوام مسئلے</text><text class="cell" x="750" y="218" text-anchor="end">کا احساس کرتے</text><text class="cell" x="750" y="236" text-anchor="end">ہیں، اور ابتدائی</text><text class="cell" x="750" y="254" text-anchor="end">رہنما غصہ</text><text class="cell" x="750" y="272" text-anchor="end">ظاہر کرتے ہیں۔</text><rect class="panel-a" x="404" y="56" width="170" height="280" rx="6"/><text class="sh" x="564" y="82" text-anchor="end">2. متحد ہونا</text><text class="small" x="564" y="100" text-anchor="end">عوامی مرحلہ</text><text class="cell" x="564" y="130" text-anchor="end">لوگ اکٹھے آتے</text><text class="cell" x="564" y="148" text-anchor="end">ہیں اور اجتماعی</text><text class="cell" x="564" y="166" text-anchor="end">کارروائی کا</text><text class="cell" x="564" y="184" text-anchor="end">انتظام کرتے ہیں۔</text><text class="cell" x="564" y="200" text-anchor="end">اتحاد بنتے ہیں،</text><text class="cell" x="564" y="218" text-anchor="end">واضح مطالبات</text><text class="cell" x="564" y="236" text-anchor="end">اشہار ہوتے ہیں،</text><text class="cell" x="564" y="254" text-anchor="end">اور آگاہی تیزی</text><text class="cell" x="564" y="272" text-anchor="end">سے پھیلتی ہے۔</text><rect class="panel" x="218" y="56" width="170" height="280" rx="6"/><text class="sh" x="378" y="82" text-anchor="end">3. انتظامی شکل</text><text class="small" x="378" y="100" text-anchor="end">رسمی مرحلہ</text><text class="cell" x="378" y="130" text-anchor="end">تحریک رسمی</text><text class="cell" x="378" y="148" text-anchor="end">قیادت اور</text><text class="cell" x="378" y="166" text-anchor="end">باقاعدہ طریق</text><text class="cell" x="378" y="184" text-anchor="end">کار بناتی ہے۔</text><text class="cell" x="378" y="200" text-anchor="end">کمیٹیاں مالیات</text><text class="cell" x="378" y="218" text-anchor="end">اور منصوبہ بندی</text><text class="cell" x="378" y="236" text-anchor="end">سنبھالتی ہیں اور</text><text class="cell" x="378" y="254" text-anchor="end">مسلسل وکالتی</text><text class="cell" x="378" y="272" text-anchor="end">گفتگو قائم</text><text class="cell" x="378" y="290" text-anchor="end">رکھتی ہیں۔</text><rect class="panel-b" x="32" y="56" width="170" height="280" rx="6"/><text class="sh" x="192" y="82" text-anchor="end">4. زوال</text><text class="small" x="192" y="100" text-anchor="end">حل کا مرحلہ</text><text class="cell" x="192" y="130" text-anchor="end">تحریک اپنے</text><text class="cell" x="192" y="148" text-anchor="end">بلند ترین</text><text class="cell" x="192" y="166" text-anchor="end">مرحلے سے آگے</text><text class="cell" x="192" y="184" text-anchor="end">بڑھ جاتی ہے۔</text><text class="cell" x="192" y="200" text-anchor="end">مقاصد پورے</text><text class="cell" x="192" y="218" text-anchor="end">ہو جاتے ہیں</text><text class="cell" x="192" y="236" text-anchor="end">(قانون میں شامل)،</text><text class="cell" x="192" y="254" text-anchor="end">یا گروہ روزمرہ</text><text class="cell" x="192" y="272" text-anchor="end">زندگی میں</text><text class="cell" x="192" y="290" text-anchor="end">مل جاتے ہیں۔</text><line class="stroke" x1="574" y1="196" x2="590" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="388" y1="196" x2="404" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="202" y1="196" x2="218" y2="196" marker-end="url(#arrow)"/><text class="small" x="668" y="370" text-anchor="end">زوال کا مطلب ہمیشہ شکست نہیں: کامیاب تحریکیں اس وقت زوال پذیر ہوتی ہیں جب ان کے مقاصد باقاعدہ پالیسی میں شامل ہو جاتے ہیں۔</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>