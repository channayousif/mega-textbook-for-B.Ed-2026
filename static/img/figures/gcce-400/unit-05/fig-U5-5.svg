<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the four stages of a social movement</title><desc id="d">Diagram illustrating the four stages of a social movement adapted from OpenStax Sociology 3e: Emergence, Coalescence, Bureaucratisation, and Decline, with descriptions of key features at each stage.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 13.5px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="24" y="34">Four stages of a social movement (OpenStax Sociology 3e)</text><line class="stroke" x1="198" y1="196" x2="208" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="384" y1="196" x2="394" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="570" y1="196" x2="580" y2="196" marker-end="url(#arrow)"/><rect class="panel" x="20" y="56" width="174" height="280" rx="6"/><text class="sh" x="30" y="82">1. Emergence</text><text class="small" x="30" y="100">Preliminary stage</text><text class="cell" x="30" y="130">Widespread discontent</text><text class="cell" x="30" y="148">begins over a social</text><text class="cell" x="30" y="166">condition.</text><text class="cell" x="30" y="200">The public becomes</text><text class="cell" x="30" y="218">aware of an issue,</text><text class="cell" x="30" y="236">and early leaders</text><text class="cell" x="30" y="254">voice concern.</text><rect class="panel-a" x="210" y="56" width="170" height="280" rx="6"/><text class="sh" x="220" y="82">2. Coalescence</text><text class="small" x="220" y="100">Popular stage</text><text class="cell" x="220" y="130">People join together</text><text class="cell" x="220" y="148">and organize collective</text><text class="cell" x="220" y="166">action.</text><text class="cell" x="220" y="200">Alliances form, clear</text><text class="cell" x="220" y="218">demands are publicized,</text><text class="cell" x="220" y="236">and public awareness</text><text class="cell" x="220" y="254">spreads rapidly.</text><rect class="panel" x="396" y="56" width="170" height="280" rx="6"/><text class="sh" x="406" y="82">3. Bureaucracy</text><text class="small" x="406" y="100">Formal stage</text><text class="cell" x="406" y="130">Movement creates</text><text class="cell" x="406" y="148">formal leadership and</text><text class="cell" x="406" y="166">regular procedures.</text><text class="cell" x="406" y="200">Committees manage</text><text class="cell" x="406" y="218">finances and plans,</text><text class="cell" x="406" y="236">and sustain ongoing</text><text class="cell" x="406" y="254">advocacy talks.</text><rect class="panel-b" x="582" y="56" width="178" height="280" rx="6"/><text class="sh" x="592" y="82">4. Decline</text><text class="small" x="592" y="100">Resolution stage</text><text class="cell" x="592" y="130">Movement moves past</text><text class="cell" x="592" y="148">its peak phase.</text><text class="cell" x="592" y="180">Goals are achieved</text><text class="cell" x="592" y="198">(passed into law),</text><text class="cell" x="592" y="216">or groups disperse</text><text class="cell" x="592" y="234">into daily life.</text><text class="small" x="24" y="370">Decline does not always mean defeat: successful movements decline when their goals enter regular policy.</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
