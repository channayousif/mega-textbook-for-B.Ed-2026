<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">رائے عامہ کے مآخذ کا موازنہ</title><desc id="d">جدول جو رائے عامہ کے چار بنیادی مآخذ کا موازنہ کرتا ہے: خاندان اور محلہ، اسکول اور تعلیم، میس میڈیا اور صحافت، اور سوشل میڈیا پلیٹ فارمز، اور ہر ایک کی مرکزی خصوصیت، اہم طاقت اور اہم خطرہ دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="756" y="34" text-anchor="end">رائے عامہ کے مآخذ: خصوصیات، طاقتیں اور خطرات</text><rect class="panel-a" x="588" y="52" width="168" height="36" rx="4"/><text class="sh" x="748" y="75" text-anchor="end">ماخذ</text><rect class="panel-a" x="398" y="52" width="186" height="36" rx="4"/><text class="sh" x="576" y="75" text-anchor="end">مرکزی خصوصیت</text><rect class="panel-a" x="208" y="52" width="186" height="36" rx="4"/><text class="sh" x="386" y="75" text-anchor="end">اہم طاقت</text><rect class="panel-a" x="18" y="52" width="186" height="36" rx="4"/><text class="sh" x="196" y="75" text-anchor="end">اہم خطرہ</text><rect class="panel" x="588" y="92" width="168" height="100" rx="4"/><rect class="panel" x="398" y="92" width="186" height="100" rx="4"/><rect class="panel" x="208" y="92" width="186" height="100" rx="4"/><rect class="panel" x="18" y="92" width="186" height="100" rx="4"/><text class="sh" x="748" y="133" text-anchor="end">خاندان اور مقامی</text><text class="sh" x="748" y="151" text-anchor="end">معاشرہ</text><text class="cell" x="576" y="124" text-anchor="end">زبانی گفتگو، مشترکہ</text><text class="cell" x="576" y="142" text-anchor="end">محلے کے تعلقات اور</text><text class="cell" x="576" y="160" text-anchor="end">قابلِ اعتماد مقامی بزرگ</text><text class="cell" x="386" y="124" text-anchor="end">مضبوط سماجی اعتماد اور</text><text class="cell" x="386" y="142" text-anchor="end">گہرا ذاتی احساس</text><text class="cell" x="386" y="160" text-anchor="end">تعلق کا بناتا ہے</text><text class="cell" x="196" y="124" text-anchor="end">تعصب پھیلا سکتا ہے یا</text><text class="cell" x="196" y="142" text-anchor="end">لوگوں کو نئے نقطۂ نظر</text><text class="cell" x="196" y="160" text-anchor="end">سے الگ کر سکتا ہے</text><rect class="panel" x="588" y="196" width="168" height="100" rx="4"/><rect class="panel" x="398" y="196" width="186" height="100" rx="4"/><rect class="panel" x="208" y="196" width="186" height="100" rx="4"/><rect class="panel" x="18" y="196" width="186" height="100" rx="4"/><text class="sh" x="748" y="237" text-anchor="end">اسکول اور</text><text class="sh" x="748" y="255" text-anchor="end">ادارے</text><text class="cell" x="576" y="228" text-anchor="end">رسمی نصاب،</text><text class="cell" x="576" y="246" text-anchor="end">استاد کی رہنمائی والا</text><text class="cell" x="576" y="264" text-anchor="end">مباحثہ، اور شہری تعلیم</text><text class="cell" x="386" y="228" text-anchor="end">شواہد، تنقیدی تحقيق اور</text><text class="cell" x="386" y="246" text-anchor="end">تصدیق شدہ شہری</text><text class="cell" x="386" y="264" text-anchor="end">معلومات سکھاتے ہیں</text><text class="cell" x="196" y="228" text-anchor="end">رٹا لگانے پر جھک سکتا ہے</text><text class="cell" x="196" y="246" text-anchor="end">اگر اساتذہ فعال کلاس</text><text class="cell" x="196" y="264" text-anchor="end">مباحثے سے پرہیز کریں</text><rect class="panel" x="588" y="300" width="168" height="100" rx="4"/><rect class="panel" x="398" y="300" width="186" height="100" rx="4"/><rect class="panel" x="208" y="300" width="186" height="100" rx="4"/><rect class="panel" x="18" y="300" width="186" height="100" rx="4"/><text class="sh" x="748" y="341" text-anchor="end">میس میڈیا اور</text><text class="sh" x="748" y="359" text-anchor="end">صحافت</text><text class="cell" x="576" y="332" text-anchor="end">اخبارات، ریڈیو، ٹی وی،</text><text class="cell" x="576" y="350" text-anchor="end">اور رسمی تحقیقی</text><text class="cell" x="576" y="368" text-anchor="end">رپورٹنگ</text><text class="cell" x="386" y="332" text-anchor="end">وسیع سامعین تک پہنچتی ہے،</text><text class="cell" x="386" y="350" text-anchor="end">منظم حقائق اور</text><text class="cell" x="386" y="368" text-anchor="end">مختلف تبصروں کے ساتھ</text><text class="cell" x="196" y="332" text-anchor="end">نمایشی پن یا مالکان کے</text><text class="cell" x="196" y="350" text-anchor="end">مفادات حقیقی توازن</text><text class="cell" x="196" y="368" text-anchor="end">کو مسخ کر سکتے ہیں</text><rect class="panel" x="588" y="404" width="168" height="100" rx="4"/><rect class="panel" x="398" y="404" width="186" height="100" rx="4"/><rect class="panel" x="208" y="404" width="186" height="100" rx="4"/><rect class="panel" x="18" y="404" width="186" height="100" rx="4"/><text class="sh" x="748" y="445" text-anchor="end">سوشل میڈیا</text><text class="sh" x="748" y="463" text-anchor="end">نیٹ ورکس</text><text class="cell" x="576" y="436" text-anchor="end">صارف کی طرف سے پوسٹس،</text><text class="cell" x="576" y="454" text-anchor="end">انٹرایکٹو ویڈیو اور</text><text class="cell" x="576" y="472" text-anchor="end">فوری پیغام</text><text class="cell" x="386" y="436" text-anchor="end">مقامی آوازوں کی تیز</text><text class="cell" x="386" y="454" text-anchor="end">اشتراک اور تیز شہری</text><text class="cell" x="386" y="472" text-anchor="end">ہم آہنگی</text><text class="cell" x="196" y="436" text-anchor="end">گونج والے خانے اور بوٹس</text><text class="cell" x="196" y="454" text-anchor="end">افواہوں اور مصنوعی</text><text class="cell" x="196" y="472" text-anchor="end">مقبولیت کو بڑھا سکتے ہیں</text><text class="small" x="668" y="520" text-anchor="end">ذمہ دار شہری رائے بنانے سے پہلے متعدد مآخذ سے دعووں کی تصدیق کرتے ہیں۔</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>