<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں وکلاء کی تحریک کی ٹائم لائن (2007 - 2009)</title><desc id="d">ٹائم لائن جو پاکستان میں وکلاء کی تحریک کی مارچ 2007 سے مارچ 2009 تک اہم سنگ میل دکھاتی ہے، بتول وغیرہ (2019) کی بنا پر حقیقی تاریخ میں سماجی تحریک کے چار مراحل کی عکاسی کرتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><text class="h" x="756" y="34" text-anchor="end">پاکستان میں وکلاء کی تحریک کی ٹائم لائن (2007 - 2009)</text><line class="stroke" x1="700" y1="90" x2="700" y2="465" marker-end="url(#arrow)"/><circle class="dot" cx="700" cy="90" r="6"/><line class="thin" x1="694" y1="90" x2="692" y2="90"/><rect class="panel" x="172" y="56" width="520" height="68" rx="6"/><text class="sh" x="678" y="80" text-anchor="end">مارچ 2007: ابتداؤ (محرک)</text><text class="cell" x="678" y="100" text-anchor="end">چیف جسٹس کی معطلی سے خود بخود بار انجمنوں کی ریلیاں اور عدالت کا بائیکاٹ ہوا۔</text><circle class="dot" cx="700" cy="180" r="6"/><line class="thin" x1="694" y1="180" x2="692" y2="180"/><rect class="panel" x="172" y="140" width="520" height="80" rx="6"/><text class="sh" x="678" y="164" text-anchor="end">مئی تا اگست 2007: متحد ہونا (وسیع جماعت بندی)</text><text class="cell" x="678" y="184" text-anchor="end">مظاہرے شہروں میں پھیل گئے؛ سول سوسائٹی کے گروہ، صحافی</text><text class="cell" x="678" y="202" text-anchor="end">اور شاگردوں کی یونینیں تحریک میں یکجا ہو گئیں۔</text><circle class="dot" cx="700" cy="276" r="6"/><line class="thin" x1="694" y1="276" x2="692" y2="276"/><rect class="panel" x="172" y="236" width="520" height="80" rx="6"/><text class="sh" x="678" y="260" text-anchor="end">نومبر 2007: ایمرجنسی کے تحت انتظامی شکل</text><text class="cell" x="678" y="280" text-anchor="end">ایمرجنسی لگی؛ ہزاروں وکلاء گرفتار؛ بار کونسلز</text><text class="cell" x="678" y="298" text-anchor="end">منظم اور غیر تشددية تنظیم کو برقرار رکھا۔</text><circle class="dot" cx="700" cy="372" r="6"/><line class="thin" x1="694" y1="372" x2="692" y2="372"/><rect class="panel" x="172" y="332" width="520" height="80" rx="6"/><text class="sh" x="678" y="356" text-anchor="end">فروری 2008: سیاسی منتقلی</text><text class="cell" x="678" y="376" text-anchor="end">عام انتخابات سے جمہوری پارلیمنٹ واپس آئی؛ تحریک نے</text><text class="cell" x="678" y="394" text-anchor="end">مکمل قضاتی آزادی کے لیے مسلسل دباؤ برقرار رکھا۔</text><circle class="dot" cx="700" cy="465" r="6"/><line class="thin" x1="694" y1="465" x2="692" y2="465"/><rect class="panel-a" x="172" y="425" width="520" height="80" rx="6"/><text class="sh" x="678" y="449" text-anchor="end">مارچ 2009: لانگ مارچ اور حل (قانون میں زوال)</text><text class="cell" x="678" y="469" text-anchor="end">ملکی لانگ مارچ اسلام آباد کی طرف روانہ ہوا؛ حکومت</text><text class="cell" x="678" y="487" text-anchor="end">نے چیف جسٹس اور ججز کو بحال کیا، جس سے تحریک کا</text><text class="cell" x="678" y="502" text-anchor="end">بنیادی مقصد پورا ہوا۔</text><text class="small" x="756" y="534" text-anchor="end">بتول وغیرہ (2019) اس بات کا دستاویز کرتے ہیں کہ مسلسل شہری متحرک ہونے سے</text><text class="small" x="668" y="552" text-anchor="end">ہتھیاروں کے استعمال کے بغیر آئینی بحالی حاصل ہوئی۔</text><text class="wm" x="768" y="570" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>