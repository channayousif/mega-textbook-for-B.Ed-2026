<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">وکالتی منصوبے کے چھ مراحل کا فلو چارٹ</title><desc id="d">فلو چارٹ جو وکالتی چکر کے چھ مراحل دکھاتا ہے: 1. سماجی مسئلے کی نشاندہی، 2. شواہد اور اعداد و شمار اکٹھا کرنا، 3. ہدف کی جماعت کا نقشہ بنانا، 4. واضح پیغام تیار کرنا، 5. ہم آہنگ کارروائی، 6. اثر کا جائزہ لینا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="756" y="34" text-anchor="end">معاشرے کے وکالتی چکر کے چھ مراحل</text><rect class="panel-a" x="536" y="56" width="220" height="110" rx="6"/><text class="sh" x="746" y="80" text-anchor="end">1. مسئلے کی نشاندہی</text><text class="cell" x="746" y="102" text-anchor="end">ایک ٹھوس، حل ہو سکنے والی</text><text class="cell" x="746" y="120" text-anchor="end">معاشرے کی ضرورت منتخب</text><text class="cell" x="746" y="138" text-anchor="end">کریں (مثلاً اسکول کا پانی)</text><rect class="panel" x="280" y="56" width="220" height="110" rx="6"/><text class="sh" x="490" y="80" text-anchor="end">2. شواہد اکٹھا کرنا</text><text class="cell" x="490" y="102" text-anchor="end">حاضری کے رجسٹر، کلینک</text><text class="cell" x="490" y="120" text-anchor="end">کی رپورٹس اور تصدیق شدہ</text><text class="cell" x="490" y="138" text-anchor="end">حقائق جمع کریں</text><rect class="panel" x="24" y="56" width="220" height="110" rx="6"/><text class="sh" x="234" y="80" text-anchor="end">3. ہدف کی جماعت کا نقشہ</text><text class="cell" x="234" y="102" text-anchor="end">جو اختیار والے انڈرکرار</text><text class="cell" x="234" y="120" text-anchor="end">ہیں ان کی نشاندہی</text><text class="cell" x="234" y="138" text-anchor="end">کریں (DEO، TEO، SMC)</text><rect class="panel" x="536" y="204" width="220" height="110" rx="6"/><text class="sh" x="746" y="228" text-anchor="end">4. واضح پیغام تیار کرنا</text><text class="cell" x="746" y="250" text-anchor="end">مسئلہ، اعداد و شمار،</text><text class="cell" x="746" y="268" text-anchor="end">آئینی حق (25A) اور عملی</text><text class="cell" x="746" y="286" text-anchor="end">حل کو پیغام بنائیں</text><rect class="panel" x="280" y="204" width="220" height="110" rx="6"/><text class="sh" x="490" y="228" text-anchor="end">5. ہم آہنگ کارروائی</text><text class="cell" x="490" y="250" text-anchor="end">ملاقاتیں کریں، رسمی</text><text class="cell" x="490" y="268" text-anchor="end">درخواستیں لکھیں اور</text><text class="cell" x="490" y="286" text-anchor="end">معاشرے کے یار متحرک کریں</text><rect class="panel-b" x="24" y="204" width="220" height="110" rx="6"/><text class="sh" x="234" y="228" text-anchor="end">6. اثر کا جائزہ</text><text class="cell" x="234" y="250" text-anchor="end">کیا بدلا اس کا جائزہ لیں،</text><text class="cell" x="234" y="268" text-anchor="end">پیش رفت ٹریک کریں اور</text><text class="cell" x="234" y="286" text-anchor="end">اگلے قدم کا منصوبہ بنائیں</text><line class="stroke" x1="500" y1="111" x2="500" y2="111" marker-end="url(#arrow)"/><line class="stroke" x1="244" y1="111" x2="244" y2="111" marker-end="url(#arrow)"/><line class="stroke" x1="134" y1="166" x2="134" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="-12" y1="259" x2="500" y2="259" marker-end="url(#arrow)"/><line class="stroke" x1="244" y1="259" x2="756" y2="259" marker-end="url(#arrow)"/><line class="stroke" x1="34" y1="196" x2="34" y2="174" marker-end="url(#arrow)"/><line class="stroke" x1="34" y1="174" x2="646" y2="174" marker-end="url(#arrow)"/><line class="stroke" x1="646" y1="174" x2="646" y2="166" marker-end="url(#arrow)"/><text class="small" x="668" y="370" text-anchor="end">وکالت ایک چکری عمل ہے: جائزہ کے نتائج اگلے دور کی شہری کارروائی کی رہنمائی کرتے ہیں۔</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>