<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of the Lawyers' Movement in Pakistan (2007-2009)</title><desc id="d">Timeline showing key milestones of the Lawyers' Movement in Pakistan from March 2007 to March 2009, illustrating the four stages of a social movement in real history based on Batool et al. (2019).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><text class="h" x="24" y="34">Timeline of the Lawyers' Movement in Pakistan (2007 - 2009)</text><line class="stroke" x1="80" y1="90" x2="80" y2="465" marker-end="url(#arrow)"/><circle class="dot" cx="80" cy="90" r="6"/><line class="thin" x1="86" y1="90" x2="120" y2="90"/><rect class="panel" x="120" y="56" width="636" height="68" rx="6"/><text class="sh" x="134" y="80">March 2007: Emergence (Catalyst)</text><text class="cell" x="134" y="100">Suspension of the Chief Justice triggers spontaneous bar association rallies and court boycotts.</text><circle class="dot" cx="80" cy="180" r="6"/><line class="thin" x1="86" y1="180" x2="120" y2="180"/><rect class="panel" x="120" y="144" width="636" height="80" rx="6"/><text class="sh" x="134" y="168">May to August 2007: Coalescence (Broad Coalition)</text><text class="cell" x="134" y="188">Protests expand across cities; civil society groups, journalists,</text><text class="cell" x="134" y="206">and student unions join the movement in solidarity.</text><circle class="dot" cx="80" cy="276" r="6"/><line class="thin" x1="86" y1="276" x2="120" y2="276"/><rect class="panel" x="120" y="236" width="636" height="80" rx="6"/><text class="sh" x="134" y="258">November 2007: Bureaucratisation under Emergency</text><text class="cell" x="134" y="278">State of emergency declared; thousands of lawyers detained; bar councils sustain disciplined</text><text class="cell" x="134" y="296">non-violent organization and coordination.</text><circle class="dot" cx="80" cy="372" r="6"/><line class="thin" x1="86" y1="372" x2="120" y2="372"/><rect class="panel" x="120" y="332" width="636" height="80" rx="6"/><text class="sh" x="134" y="356">February 2008: Political Transition</text><text class="cell" x="134" y="376">General elections return a democratic parliament; the movement</text><text class="cell" x="134" y="394">maintains sustained pressure for complete judicial independence.</text><circle class="dot" cx="80" cy="465" r="6"/><line class="thin" x1="86" y1="465" x2="120" y2="465"/><rect class="panel-a" x="120" y="424" width="636" height="80" rx="6"/><text class="sh" x="134" y="446">March 2009: Long March and Resolution (Decline into Law)</text><text class="cell" x="134" y="466">Nationwide Long March heads to Islamabad; government restores the Chief Justice and judges,</text><text class="cell" x="134" y="484">culminating the movement's core objective.</text><text class="small" x="24" y="534">Batool et al. (2019) document how sustained civic mobilization achieved</text><text class="small" x="24" y="552">constitutional restoration without armed conflict.</text><text class="wm" x="768" y="570" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
