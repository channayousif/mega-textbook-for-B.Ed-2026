<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فلو چارٹ جو رائے عامہ کی تشکیل کے پانچ مراحل دکھاتا ہے</title><desc id="d">فلو چارٹ جو رائے عامہ کی تشکیل کے پانچ مراحل دکھاتا ہے: 1. عوامی مسئلہ ابھرتا ہے، 2. معلومات پھیلتی ہیں، 3. عوامی بحث و مباحثہ، 4. رائے عامہ منجمد ہوتی ہے، 5. عوامی پالیسی اور فیصلوں پر اثر۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="34">معاشرے کے مسئلے پر رائے عامہ کیسے بنتی ہے</text><rect class="panel" x="50" y="50" width="680" height="66" rx="6"/><text class="sh" x="66" y="72">1. عوامی مسئلہ ابھرتا ہے</text><text class="cell" x="66" y="90">ایک مشترکہ معاشرے کا مسئلہ یا پالیسی کا چیلنج پیدا ہوتا ہے (مثلاً،</text><text class="cell" x="66" y="106">اسکولوں کے باہر سڑک کی حفاظت)۔</text><line class="stroke" x1="390" y1="116" x2="390" y2="136" marker-end="url(#arrow)"/><rect class="panel" x="50" y="138" width="680" height="66" rx="6"/><text class="sh" x="66" y="160">2. معلومات پھیلتی ہیں</text><text class="cell" x="66" y="178">حقائق، خبروں کی رپورٹس اور معاشرے کے تجربات</text><text class="cell" x="66" y="194">میڈیا، اسکولوں اور سماجی حلقوں کے ذریعے اشتراک ہوتے ہیں۔</text><line class="stroke" x1="390" y1="204" x2="390" y2="224" marker-end="url(#arrow)"/><rect class="panel-a" x="50" y="226" width="680" height="66" rx="6"/><text class="sh" x="66" y="248">3. عوامی بحث و مباحثہ (عوامی مکالمہ)</text><text class="cell" x="66" y="266">شہری، والدین اور اساتذہ خیالات کا تبادلہ کرتے ہیں،</text><text class="cell" x="66" y="282">دلائل پرکھتے ہیں اور تجویز کردہ حلوں کا موازنہ کرتے ہیں۔</text><line class="stroke" x1="390" y1="292" x2="390" y2="312" marker-end="url(#arrow)"/><rect class="panel" x="50" y="314" width="680" height="66" rx="6"/><text class="sh" x="66" y="336">4. رائے عامہ منجمد ہوتی ہے</text><text class="cell" x="66" y="354">وسیع اجتماعی اتفاق یا واضح متبادل نقطۂ نظر</text><text class="cell" x="66" y="370">معاشرے کے ارکان میں ٹھوس شکل اختیار کرتے ہیں۔</text><line class="stroke" x1="390" y1="380" x2="390" y2="400" marker-end="url(#arrow)"/><rect class="panel-b" x="50" y="402" width="680" height="66" rx="6"/><text class="sh" x="66" y="424">5. عوامی فیصلوں اور کارروائی پر اثر</text><text class="cell" x="66" y="442">منتخب نمائندے، ضلعی انڈرکرار یا اسکول کونسلیں</text><text class="cell" x="66" y="458">ٹھوس پالیسی، بجٹ یا اصولوں کے ذریعے جواب دیتے ہیں۔</text><text class="small" x="24" y="504">مرحلہ 3 کا عوامی مکالمہ وہ محرک ہے جو منطقی اور باخبر رائے عامہ کو شکل دیتا ہے۔</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
