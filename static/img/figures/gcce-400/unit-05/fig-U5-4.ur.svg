<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">وکالت، لابی اور احتجاج کا موازنہ</title><desc id="d">موازنہ جدول جو وکالت، لابی اور احتجاج کی توجہ، بنیادی طریقے، ہدف کی جماعت اور پاکستانی تعلیمی مثال دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="490"/><text class="h" x="756" y="34" text-anchor="end">وکالت، لابی اور احتجاج کا موازنہ</text><rect class="panel-a" x="628" y="52" width="128" height="36" rx="4"/><text class="sh" x="748" y="75" text-anchor="end">طریقہ</text><rect class="panel-a" x="434" y="52" width="190" height="36" rx="4"/><text class="sh" x="616" y="75" text-anchor="end">بنیادی توجہ</text><rect class="panel-a" x="222" y="52" width="208" height="36" rx="4"/><text class="sh" x="422" y="75" text-anchor="end">اہم طریقے</text><rect class="panel-a" x="24" y="52" width="194" height="36" rx="4"/><text class="sh" x="210" y="75" text-anchor="end">پاکستانی مثال</text><rect class="panel" x="628" y="92" width="128" height="104" rx="4"/><rect class="panel" x="434" y="92" width="190" height="104" rx="4"/><rect class="panel" x="222" y="92" width="208" height="104" rx="4"/><rect class="panel" x="24" y="92" width="194" height="104" rx="4"/><text class="sh" x="748" y="149" text-anchor="end">وکالت</text><text class="cell" x="616" y="122" text-anchor="end">عوامی حمایت اور جماعت</text><text class="cell" x="616" y="140" text-anchor="end">بندی بنانا تاکہ ایک</text><text class="cell" x="616" y="158" text-anchor="end">مشترکہ معاشرے کا مسئلہ</text><text class="cell" x="616" y="176" text-anchor="end">حل ہو</text><text class="cell" x="422" y="131" text-anchor="end">تحقیق، پالیسی بریف،</text><text class="cell" x="422" y="149" text-anchor="end">معاشرے کا مکالمہ اور</text><text class="cell" x="422" y="167" text-anchor="end">عوامی آگاہی کا کام</text><text class="cell" x="210" y="131" text-anchor="end">والدین اور اساتذہ دختر</text><text class="cell" x="210" y="149" text-anchor="end">طلباء کی سفر کی</text><text class="cell" x="210" y="167" text-anchor="end">ضروریات درست کرتے ہیں</text><rect class="panel" x="628" y="200" width="128" height="104" rx="4"/><rect class="panel" x="434" y="200" width="190" height="104" rx="4"/><rect class="panel" x="222" y="200" width="208" height="104" rx="4"/><rect class="panel" x="24" y="200" width="194" height="104" rx="4"/><text class="sh" x="748" y="257" text-anchor="end">لابی</text><text class="cell" x="616" y="230" text-anchor="end">مسود اصول یا قوانین پر</text><text class="cell" x="616" y="248" text-anchor="end">انڈرکرار یا قانون سازوں</text><text class="cell" x="616" y="266" text-anchor="end">کو براہِ راست حوصلہ</text><text class="cell" x="616" y="284" text-anchor="end">افزائی کرنا</text><text class="cell" x="422" y="239" text-anchor="end">وفد، رسمی جمع کرانا،</text><text class="cell" x="422" y="257" text-anchor="end">سنوائی اور قانونی</text><text class="cell" x="422" y="275" text-anchor="end">میمورنڈم</text><text class="cell" x="210" y="239" text-anchor="end">ہیڈ ٹیچرز سائنس</text><text class="cell" x="210" y="257" text-anchor="end">لیبارٹری کے فنڈز کی</text><text class="cell" x="210" y="275" text-anchor="end">درخواست کے لیے ملتے ہیں</text><rect class="panel" x="628" y="308" width="128" height="104" rx="4"/><rect class="panel" x="434" y="308" width="190" height="104" rx="4"/><rect class="panel" x="222" y="308" width="208" height="104" rx="4"/><rect class="panel" x="24" y="308" width="194" height="104" rx="4"/><text class="sh" x="748" y="365" text-anchor="end">احتجاج</text><text class="cell" x="616" y="338" text-anchor="end">عوامی طور پر اجتماعی</text><text class="cell" x="616" y="356" text-anchor="end">شکایت اور فوری مطالبے</text><text class="cell" x="616" y="374" text-anchor="end">کا مظاہرہ کرنا</text><text class="cell" x="616" y="392" text-anchor="end">(دفعہ 16)</text><text class="cell" x="422" y="347" text-anchor="end">پُرامن اسمبلیاں،</text><text class="cell" x="422" y="365" text-anchor="end">جلوس، پلے کارڈ اور</text><text class="cell" x="422" y="383" text-anchor="end">عوامی ریلیاں</text><text class="cell" x="210" y="338" text-anchor="end">سیلاب کے بعد اسکول کی</text><text class="cell" x="210" y="356" text-anchor="end">مرمت کی مانگ کے لیے</text><text class="cell" x="210" y="374" text-anchor="end">شہری پُرامن سفر کرتے</text><text class="cell" x="210" y="392" text-anchor="end">ہیں</text><text class="small" x="668" y="442" text-anchor="end">وکالت سب سے وسیع چوکھٹ ہے: یہ اکثر احتجاج سے پہلے شواہد، گفتگو اور لابی استعمال کرتی ہے۔</text><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>