<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">چھ اقسام سیاسی شرکت، ہر ایک شہری سے کیا مطالبہ کرتی ہے اور ایک پاکستانی مثال</title><desc id="d">سیاسی شرکت کی چھ اقسام کی جدول، ہر ایک شہری سے کیا مطالبہ کرتی ہے اور ایک پاکستانی مثال: انتخاب میں ووٹ دینا، کسی نمائندے جیسے ایم پی اے سے رابطہ کرنا، کسی پارٹی یا مہم میں شامل ہونا، یونین کونسل کو درخواست بھیجنا، دفعہ 16 کے تحفظ میں پُرامن احتجاج، اور یونین کونسل کی نشست کے لیے امیدواری دینا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><text class="h" x="756" y="34" text-anchor="end">سیاسی شرکت کی اقسام</text><rect class="panel-a" x="564" y="52" width="192" height="40" rx="0"/><text class="sh" x="748" y="77" text-anchor="end">شرکت کی قسم</text><rect class="panel-a" x="276" y="52" width="266" height="40" rx="0"/><text class="sh" x="534" y="77" text-anchor="end">یہ شہری سے کیا مطالبہ کرتی ہے</text><rect class="panel-a" x="24" y="52" width="274" height="40" rx="0"/><text class="sh" x="290" y="77" text-anchor="end">پاکستانی مثال</text><rect class="panel" x="564" y="92" width="192" height="56" rx="0"/><text class="sh" x="748" y="116" text-anchor="end">ووٹ دینا</text><rect class="box" x="276" y="92" width="266" height="56" rx="0"/><text class="body" x="534" y="116" text-anchor="end">رجسٹرڈ ہو، باخبر رہو،</text><text class="body" x="534" y="133" text-anchor="end">اور پولنگ اسٹیشن جاؤ</text><rect class="box" x="24" y="92" width="274" height="56" rx="0"/><text class="body" x="290" y="116" text-anchor="end">عام یا مقامی انتخاب میں</text><text class="body" x="290" y="133" text-anchor="end">ووٹ دینا</text><rect class="panel" x="564" y="148" width="192" height="56" rx="0"/><text class="sh" x="748" y="172" text-anchor="end">نمائندے سے رابطہ</text><rect class="box" x="276" y="148" width="266" height="56" rx="0"/><text class="body" x="534" y="172" text-anchor="end">جانو کہ آپ کا نمائندہ کون ہے</text><text class="body" x="534" y="189" text-anchor="end">اور مسئلہ واضح کہو</text><rect class="box" x="24" y="148" width="274" height="56" rx="0"/><text class="body" x="290" y="172" text-anchor="end">والدین کا گروہ اپنے ایم پی اے سے</text><text class="body" x="290" y="189" text-anchor="end">اسکول کے بارے میں ملتا ہے</text><rect class="panel" x="564" y="204" width="192" height="56" rx="0"/><text class="sh" x="748" y="228" text-anchor="end">کسی پارٹی یا مہم میں</text><text class="sh" x="748" y="245" text-anchor="end">شامل ہونا</text><rect class="box" x="276" y="204" width="266" height="56" rx="0"/><text class="body" x="534" y="228" text-anchor="end">وقت، التزام اور دوسروں کے</text><text class="body" x="534" y="245" text-anchor="end">ساتھ کام کرنا</text><rect class="box" x="24" y="204" width="274" height="56" rx="0"/><text class="body" x="290" y="228" text-anchor="end">کسی امیدوار کی در در کے دورے میں</text><text class="body" x="290" y="245" text-anchor="end">رضاکارانہ حصہ لینا</text><rect class="panel" x="564" y="260" width="192" height="56" rx="0"/><text class="sh" x="748" y="284" text-anchor="end">درخواست یا تحریری شکایت</text><rect class="box" x="276" y="260" width="266" height="56" rx="0"/><text class="body" x="534" y="284" text-anchor="end">حقائق اور دستخط اکٹھے کرو،</text><text class="body" x="534" y="301" text-anchor="end">اور پیچھا کرو</text><rect class="box" x="24" y="260" width="274" height="56" rx="0"/><text class="body" x="290" y="284" text-anchor="end">باسیوں کی نکاسی کے بارے میں</text><text class="body" x="290" y="301" text-anchor="end">یونین کونسل کو درخواست</text><rect class="panel" x="564" y="316" width="192" height="56" rx="0"/><text class="sh" x="748" y="340" text-anchor="end">پُرامن احتجاج</text><rect class="box" x="276" y="316" width="266" height="56" rx="0"/><text class="body" x="534" y="340" text-anchor="end">پُرامن اور قانون کے اندر</text><text class="body" x="534" y="357" text-anchor="end">اہتمام کرو (دفعہ 16)</text><rect class="box" x="24" y="316" width="274" height="56" rx="0"/><text class="body" x="290" y="340" text-anchor="end">پانی کی کمی کے بارے میں پریس کلب</text><text class="body" x="290" y="357" text-anchor="end">کے باہر پُرامن اجتماع</text><rect class="panel" x="564" y="372" width="192" height="56" rx="0"/><text class="sh" x="748" y="396" text-anchor="end">انتخاب میں امیدواری</text><rect class="box" x="276" y="372" width="266" height="56" rx="0"/><text class="body" x="534" y="396" text-anchor="end">قانونی شرائط پوری کرو</text><text class="body" x="534" y="413" text-anchor="end">اور عوام کا اعتماد حاصل کرو</text><rect class="box" x="24" y="372" width="274" height="56" rx="0"/><text class="body" x="290" y="396" text-anchor="end">ایک استاد یونین کونسل کی نشست</text><text class="body" x="290" y="413" text-anchor="end">کے لیے امیدواری دیتا ہے</text><text class="small" x="756" y="454" text-anchor="end">ووٹ دینا چھ اقسام میں سے ایک ہے؛ اکثر اقسام انتخابات کے درمیان بھی استعمال ہو سکتی ہیں۔</text><text class="wm" x="12" y="470" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
