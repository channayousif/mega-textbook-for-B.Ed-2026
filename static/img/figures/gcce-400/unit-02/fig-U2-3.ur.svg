<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">سول سوسائٹی خاندان، منڈی اور ریاست کے درمیان</title><desc id="d">تصوری نقشہ جس میں سول سوسائٹی خاندان، منڈی اور ریاست کے درمیان کی جگہ پر ہے۔ سول سوسائٹی کے اندر پانچ اقسام کے گروہ پاکستانی مثالوں کے ساتھ ہیں: انجمنیں اور یونینیں، فلاحی ادارے، ذرائع ابلاغ اور پریس، محلہ کمیٹیاں جیسے برادری کے گروہ، اور پیشہ ورانہ و ثقافتی ادارے۔ تیر دکھاتے ہیں کہ سول سوسائٹی ریاست تک اپنی ضروریات پہنچاتی ہے اور اس پر نظر رکھتی ہے، اور ریاست انجمن، گفتگو اور اجتماع کی آزادیوں کی حفاظت کرتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/><text class="h" x="756" y="34" text-anchor="end">سول سوسائٹی کہاں ہے</text><rect class="panel-b" x="270" y="50" width="240" height="52" rx="6"/><text class="sh" x="390" y="74" text-anchor="middle">ریاست</text><text class="small" x="390" y="93" text-anchor="middle">قانون سے جڑی ہوتی ہے</text><rect class="panel-b" x="630" y="300" width="130" height="64" rx="6"/><text class="sh" x="695" y="326" text-anchor="middle">خاندان</text><text class="small" x="695" y="346" text-anchor="middle">رشت داری و محبت</text><rect class="panel-b" x="20" y="300" width="130" height="70" rx="6"/><text class="sh" x="85" y="326" text-anchor="middle">منڈی</text><text class="small" x="85" y="343" text-anchor="middle">خریدو فروخت</text><text class="small" x="85" y="358" text-anchor="middle">اور منافع</text><rect class="panel-a" x="165" y="200" width="450" height="370" rx="14"/><text class="h" x="390" y="228" text-anchor="middle">سول سوسائٹی</text><text class="small" x="390" y="247" text-anchor="middle">شہری اپنی مرضی سے اکٹھے ہوتے ہیں: رضاکارانہ، غیر ریاستی، غیر منافع کار</text><line class="dline" x1="150" y1="332" x2="165" y2="332"/><line class="dline" x1="615" y1="332" x2="630" y2="332"/><rect class="box" x="397" y="264" width="200" height="82" rx="6"/><text class="sh" x="587" y="286" text-anchor="end">انجمنیں، یونینیں</text><text class="small" x="587" y="308" text-anchor="end">اساتذہ کی انجمن،</text><text class="small" x="587" y="324" text-anchor="end">ٹریڈ یونین</text><rect class="box" x="183" y="264" width="200" height="82" rx="6"/><text class="sh" x="373" y="286" text-anchor="end">فلاحی ادارے</text><text class="small" x="373" y="308" text-anchor="end">فلاحی ٹرسٹ جو ایمبولینس</text><text class="small" x="373" y="324" text-anchor="end">یا اسکول چلاتا ہے</text><rect class="box" x="397" y="360" width="200" height="82" rx="6"/><text class="sh" x="587" y="382" text-anchor="end">ذرائع ابلاغ اور پریس</text><text class="small" x="587" y="404" text-anchor="end">پریس کلب، آزاد</text><text class="small" x="587" y="420" text-anchor="end">اخبارات</text><rect class="box" x="183" y="360" width="200" height="82" rx="6"/><text class="sh" x="373" y="382" text-anchor="end">برادری کے گروہ</text><text class="small" x="373" y="404" text-anchor="end">محلہ کمیٹی،</text><text class="small" x="373" y="420" text-anchor="end">ماؤں کا گروہ</text><rect class="box" x="260" y="456" width="260" height="82" rx="6"/><text class="sh" x="510" y="478" text-anchor="end">پیشہ ورانہ اور ثقافتی</text><text class="small" x="510" y="500" text-anchor="end">وکلاء کی انجمن،</text><text class="small" x="510" y="516" text-anchor="end">ادبی انجمن</text><line class="stroke" x1="480" y1="198" x2="480" y2="104" marker-end="url(#arrow)"/><text class="body" x="488" y="140">اپنی ضروریات پہنچاتی ہے</text><line class="stroke" x1="440" y1="198" x2="440" y2="104" marker-end="url(#arrow)"/><text class="body" x="448" y="172">نظر رکھتی ہے اور سوال کرتی ہے</text><line class="stroke" x1="320" y1="104" x2="320" y2="198" marker-end="url(#arrow)"/><text class="body" x="310" y="124" text-anchor="end">حفاظت کرتی ہے:</text><text class="body" x="310" y="141" text-anchor="end">انجمن، گفتگو اور</text><text class="body" x="310" y="158" text-anchor="end">اجتماع کی آزادی (دفعات 16، 17، 19)</text><text class="wm" x="12" y="590" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
