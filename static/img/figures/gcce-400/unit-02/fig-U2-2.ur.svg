<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 925" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">پاکستان میں حکومت کی تین سطحیں اور وفاقی بل کیسے قانون بنتا ہے</title><desc id="d">دو حصوں میں فلو چارٹ۔ پہلا حصہ پاکستان میں حکومت کی تین سطحیں دکھاتا ہے: وفاقی سطح جس میں پارلیمنٹ، وفاقی حکومت اور وفاقی عدالتیں ہیں؛ صوبائی سطح جس میں صوبائی اسمبلی، وزیرِ اعلیٰ کی حکومت، گورنر اور ہائی کورٹ ہیں؛ اور مقامی سطح جس میں صوبائی قانون کے تحت قائم شدہ منتخب کونسلیں ہیں۔ دوسرا حصہ وفاقی بل کو دکھاتا ہے جو پہلے ایک ایوان سے گزرتا ہے، پھر دوسرے سے، پھر دس دنوں کے اندر صدر کی منظوری کے لیے جاتا ہے، اور اگر دوسرا ایوان اسے مسترد کر دے یا 90 دنوں میں پاس نہ کرے تو دونوں ایوانوں کا مشترکہ اجلاس ہوتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="925"/><text class="h" x="756" y="34" text-anchor="end">حصہ 1: پاکستان میں حکومت کی تین سطحیں</text><rect class="panel-a" x="24" y="52" width="732" height="93" rx="6"/><text class="sh" x="744" y="103" text-anchor="end">وفاقی سطح</text><rect class="box" x="400" y="62" width="176" height="73" rx="6"/><text class="body" x="568" y="83" text-anchor="end">پارلیمنٹ: صدر،</text><text class="body" x="568" y="100" text-anchor="end">قومی اسمبلی اور</text><text class="body" x="568" y="117" text-anchor="end">سینیٹ</text><rect class="box" x="212" y="62" width="176" height="73" rx="6"/><text class="body" x="380" y="83" text-anchor="end">وفاقی حکومت:</text><text class="body" x="380" y="100" text-anchor="end">وزیرِ اعظم اور</text><text class="body" x="380" y="117" text-anchor="end">وفاقی وزراء</text><rect class="box" x="24" y="62" width="176" height="73" rx="6"/><text class="body" x="192" y="83" text-anchor="end">وفاقی آئینی عدالت</text><text class="body" x="192" y="100" text-anchor="end">اور سپریم کورٹ</text><line class="stroke" x1="390" y1="145" x2="390" y2="165" marker-end="url(#arrow)"/><rect class="panel-b" x="24" y="165" width="732" height="127" rx="6"/><text class="sh" x="744" y="233" text-anchor="end">صوبائی سطح</text><rect class="box" x="450" y="175" width="134" height="107" rx="6"/><text class="body" x="574" y="196" text-anchor="end">صوبائی اسمبلی</text><rect class="box" x="308" y="175" width="134" height="107" rx="6"/><text class="body" x="432" y="196" text-anchor="end">صوبائی حکومت:</text><text class="body" x="432" y="213" text-anchor="end">وزیرِ اعلیٰ اور</text><text class="body" x="432" y="230" text-anchor="end">صوبائی وزراء</text><rect class="box" x="166" y="175" width="134" height="107" rx="6"/><text class="body" x="290" y="196" text-anchor="end">گورنر، صدر کے</text><text class="body" x="290" y="213" text-anchor="end">تجویز پر تعینات</text><rect class="box" x="24" y="175" width="134" height="107" rx="6"/><text class="body" x="150" y="196" text-anchor="end">ہائی کورٹ</text><line class="stroke" x1="390" y1="292" x2="390" y2="312" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="312" width="732" height="76" rx="6"/><text class="sh" x="744" y="355" text-anchor="end">مقامی سطح</text><rect class="box" x="24" y="322" width="560" height="56" rx="6"/><text class="body" x="576" y="343" text-anchor="end">منتخب مقامی کونسلیں جو صوبائی قانون کے تحت قائم ہوں،</text><text class="body" x="576" y="360" text-anchor="end">مثلاً سندھ میں یونین کونسلیں اور میونسپل کمیٹیاں</text><text class="h" x="756" y="422" text-anchor="end">حصہ 2: وفاقی بل کیسے قانون بنتا ہے (دفعہ 70 اور 75)</text><rect class="box" x="380" y="440" width="380" height="54" rx="6"/><text class="body" x="750" y="464" text-anchor="end">بل کسی بھی ایوان سے شروع ہوتا ہے</text><text class="body" x="750" y="481" text-anchor="end">(مالیاتی بل صرف قومی اسمبلی سے)</text><line class="stroke" x1="570" y1="494" x2="570" y2="516" marker-end="url(#arrow)"/><rect class="box" x="380" y="516" width="380" height="37" rx="6"/><text class="body" x="750" y="540" text-anchor="end">اس ایوان کے ذریعے پاس ہوتا ہے</text><line class="stroke" x1="570" y1="553" x2="570" y2="575" marker-end="url(#arrow)"/><rect class="box" x="380" y="575" width="380" height="37" rx="6"/><text class="body" x="750" y="599" text-anchor="end">دوسرے ایوان کو بھیجا جاتا ہے</text><line class="stroke" x1="570" y1="612" x2="570" y2="634" marker-end="url(#arrow)"/><rect class="box" x="380" y="634" width="380" height="37" rx="6"/><text class="body" x="750" y="658" text-anchor="end">وہاں پاس ہوتا ہے</text><line class="stroke" x1="570" y1="671" x2="570" y2="693" marker-end="url(#arrow)"/><rect class="box" x="380" y="693" width="380" height="37" rx="6"/><text class="body" x="750" y="717" text-anchor="end">صدر کے سامنے پیش ہوتا ہے</text><line class="stroke" x1="570" y1="730" x2="570" y2="752" marker-end="url(#arrow)"/><rect class="box" x="380" y="752" width="380" height="54" rx="6"/><text class="body" x="750" y="776" text-anchor="end">صدر دس دنوں کے اندر منظوری دیتا ہے،</text><text class="body" x="750" y="793" text-anchor="end">یا اسے ایک بار پھر غور کے لیے واپس بھیجتا ہے</text><line class="stroke" x1="570" y1="806" x2="570" y2="828" marker-end="url(#arrow)"/><rect class="panel-a" x="380" y="828" width="380" height="37" rx="6"/><text class="sh" x="750" y="852" text-anchor="end">پارلیمنٹ کا قانون</text><rect class="dash" x="24" y="569" width="240" height="46" rx="6"/><text class="body" x="254" y="587" text-anchor="end">مسترد، یا 90 دنوں میں</text><text class="body" x="254" y="604" text-anchor="end">پاس نہیں ہوتا</text><line class="dline" x1="380" y1="593" x2="266" y2="593" marker-end="url(#arrow)"/><rect class="panel" x="24" y="689" width="240" height="46" rx="6"/><text class="body" x="254" y="708" text-anchor="end">دونوں ایوانوں کا مشترکہ اجلاس،</text><text class="body" x="254" y="725" text-anchor="end">اکثریت سے فیصلہ</text><line class="dline" x1="144" y1="615" x2="144" y2="687" marker-end="url(#arrow)"/><line class="dline" x1="266" y1="721" x2="378" y2="721" marker-end="url(#arrow)"/><text class="small" x="756" y="899" text-anchor="end">ٹھوس تیر: عام راستہ۔ نقطہ دار تیر: جب دوسرا ایوان بل کو پاس نہیں کرتا۔</text><text class="wm" x="12" y="915" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
