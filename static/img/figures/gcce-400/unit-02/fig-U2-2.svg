<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 925" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the three tiers of government in Pakistan and how a federal bill becomes law</title><desc id="d">Flowchart in two parts. The first shows the three tiers of government in Pakistan: the federal tier with Parliament, the Federal Government and the federal courts; the provincial tier with the Provincial Assembly, the Chief Minister's government, the Governor and the High Court; and the local tier of elected councils set up by provincial law. The second shows a federal bill passing one House, then the other, then going to the President for assent within ten days, with a joint sitting of both Houses if the second House rejects it or does not pass it in 90 days.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="925"/><text class="h" x="24" y="34">Part 1: Three tiers of government in Pakistan</text><rect class="panel-a" x="24" y="52" width="732" height="93" rx="6"/><text class="sh" x="36" y="103">Federal tier</text><rect class="box" x="160" y="62" width="192" height="73" rx="6"/><text class="body" x="168" y="83">Parliament: President,</text><text class="body" x="168" y="100">National Assembly and</text><text class="body" x="168" y="117">Senate</text><rect class="box" x="362" y="62" width="192" height="73" rx="6"/><text class="body" x="370" y="83">Federal Government:</text><text class="body" x="370" y="100">Prime Minister and</text><text class="body" x="370" y="117">Federal Ministers</text><rect class="box" x="564" y="62" width="192" height="73" rx="6"/><text class="body" x="572" y="83">Federal Constitutional</text><text class="body" x="572" y="100">Court and Supreme</text><text class="body" x="572" y="117">Court</text><line class="stroke" x1="390" y1="145" x2="390" y2="165" marker-end="url(#arrow)"/><rect class="panel-b" x="24" y="165" width="732" height="127" rx="6"/><text class="sh" x="36" y="233">Provincial tier</text><rect class="box" x="160" y="175" width="141" height="107" rx="6"/><text class="body" x="168" y="196">Provincial</text><text class="body" x="168" y="213">Assembly</text><rect class="box" x="311" y="175" width="141" height="107" rx="6"/><text class="body" x="319" y="196">Provincial</text><text class="body" x="319" y="213">Government:</text><text class="body" x="319" y="230">Chief Minister</text><text class="body" x="319" y="247">and Provincial</text><text class="body" x="319" y="264">Ministers</text><rect class="box" x="462" y="175" width="141" height="107" rx="6"/><text class="body" x="470" y="196">Governor,</text><text class="body" x="470" y="213">appointed by the</text><text class="body" x="470" y="230">President</text><rect class="box" x="613" y="175" width="141" height="107" rx="6"/><text class="body" x="621" y="196">High Court</text><line class="stroke" x1="390" y1="292" x2="390" y2="312" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="312" width="732" height="76" rx="6"/><text class="sh" x="36" y="355">Local tier</text><rect class="box" x="160" y="322" width="596" height="56" rx="6"/><text class="body" x="168" y="343">Elected local councils set up by provincial law under Article 140A, for</text><text class="body" x="168" y="360">example union councils and municipal committees in Sindh</text><text class="h" x="24" y="422">Part 2: How a federal bill becomes law (Articles 70 and 75)</text><rect class="box" x="40" y="440" width="380" height="54" rx="6"/><text class="body" x="50" y="464">Bill introduced in either House (a Money Bill</text><text class="body" x="50" y="481">only in the National Assembly)</text><line class="stroke" x1="230" y1="494" x2="230" y2="516" marker-end="url(#arrow)"/><rect class="box" x="40" y="516" width="380" height="37" rx="6"/><text class="body" x="50" y="540">Passed by that House</text><line class="stroke" x1="230" y1="553" x2="230" y2="575" marker-end="url(#arrow)"/><rect class="box" x="40" y="575" width="380" height="37" rx="6"/><text class="body" x="50" y="599">Sent to the other House</text><line class="stroke" x1="230" y1="612" x2="230" y2="634" marker-end="url(#arrow)"/><rect class="box" x="40" y="634" width="380" height="37" rx="6"/><text class="body" x="50" y="658">Passed there</text><line class="stroke" x1="230" y1="671" x2="230" y2="693" marker-end="url(#arrow)"/><rect class="box" x="40" y="693" width="380" height="37" rx="6"/><text class="body" x="50" y="717">Presented to the President</text><line class="stroke" x1="230" y1="730" x2="230" y2="752" marker-end="url(#arrow)"/><rect class="box" x="40" y="752" width="380" height="54" rx="6"/><text class="body" x="50" y="776">President assents within ten days, or returns</text><text class="body" x="50" y="793">it once for reconsideration</text><line class="stroke" x1="230" y1="806" x2="230" y2="828" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="828" width="380" height="37" rx="6"/><text class="sh" x="50" y="852">Act of Parliament</text><rect class="dash" x="500" y="569" width="240" height="46" rx="6"/><text class="body" x="510" y="587">Rejected, or not passed</text><text class="body" x="510" y="604">within 90 days</text><line class="dline" x1="420" y1="593" x2="498" y2="593" marker-end="url(#arrow)"/><rect class="panel" x="500" y="689" width="240" height="46" rx="6"/><text class="body" x="510" y="708">Joint sitting of both Houses,</text><text class="body" x="510" y="725">decided by majority</text><line class="dline" x1="620" y1="615" x2="620" y2="687" marker-end="url(#arrow)"/><line class="dline" x1="498" y1="721" x2="422" y2="721" marker-end="url(#arrow)"/><text class="small" x="24" y="899">Solid arrows: the usual path. Dashed arrows: the path when the second House does not pass the bill.</text><text class="wm" x="768" y="915" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
