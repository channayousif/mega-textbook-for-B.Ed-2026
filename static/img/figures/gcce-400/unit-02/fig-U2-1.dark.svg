<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the state resting on four elements</title><desc id="d">Diagram of the state resting on four elements: population, the people of Pakistan; territory, the four provinces and the Islamabad Capital Territory; government, the federal, provincial and local governments; and sovereignty, Pakistan's supreme power to make its own laws and deal with other states. A note says governments change at elections while the state continues.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="24" y="34">The four elements of a state</text><rect class="panel-a" x="24" y="52" width="732" height="60" rx="6"/><text class="big" x="390" y="80" text-anchor="middle">The State</text><text class="small" x="390" y="101" text-anchor="middle">exists only when all four elements are present</text><line class="stroke" x1="111" y1="148" x2="111" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="24" y="150" width="174" height="240" rx="6"/><text class="sh" x="34" y="176">Population</text><text class="body" x="34" y="200">The people who live</text><text class="body" x="34" y="217">in the state</text><text class="body" x="34" y="234">permanently</text><text class="small" x="34" y="264">In Pakistan:</text><text class="body" x="34" y="282">The citizens of</text><text class="body" x="34" y="299">Pakistan</text><line class="stroke" x1="297" y1="148" x2="297" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="210" y="150" width="174" height="240" rx="6"/><text class="sh" x="220" y="176">Territory</text><text class="body" x="220" y="200">A defined area of</text><text class="body" x="220" y="217">land, water and air</text><text class="body" x="220" y="234">space</text><text class="small" x="220" y="264">In Pakistan:</text><text class="body" x="220" y="282">The four provinces</text><text class="body" x="220" y="299">and the Islamabad</text><text class="body" x="220" y="316">Capital Territory</text><text class="body" x="220" y="333">(Article 1)</text><line class="stroke" x1="483" y1="148" x2="483" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="396" y="150" width="174" height="240" rx="6"/><text class="sh" x="406" y="176">Government</text><text class="body" x="406" y="200">The organisation</text><text class="body" x="406" y="217">that makes, carries</text><text class="body" x="406" y="234">out and applies</text><text class="body" x="406" y="251">laws</text><text class="small" x="406" y="281">In Pakistan:</text><text class="body" x="406" y="299">Federal, provincial</text><text class="body" x="406" y="316">and local</text><text class="body" x="406" y="333">governments</text><line class="stroke" x1="669" y1="148" x2="669" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="582" y="150" width="174" height="240" rx="6"/><text class="sh" x="592" y="176">Sovereignty</text><text class="body" x="592" y="200">Supreme power</text><text class="body" x="592" y="217">inside the</text><text class="body" x="592" y="234">territory, free</text><text class="body" x="592" y="251">from outside</text><text class="body" x="592" y="268">control</text><text class="small" x="592" y="298">In Pakistan:</text><text class="body" x="592" y="316">Pakistan makes its</text><text class="body" x="592" y="333">own laws and deals</text><text class="body" x="592" y="350">with other states</text><text class="body" x="592" y="367">as an equal</text><line class="dline" x1="483" y1="390" x2="483" y2="412"/><rect class="dash" x="276" y="412" width="414" height="46" rx="6"/><text class="body" x="483" y="440" text-anchor="middle">Governments change at elections; the state continues</text><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
