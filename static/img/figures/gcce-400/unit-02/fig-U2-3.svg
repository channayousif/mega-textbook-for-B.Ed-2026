<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map placing civil society in the space between the family, the market and the state</title><desc id="d">Concept map placing civil society in the space between the family, the market and the state. Inside civil society are five kinds of group with Pakistani examples: associations and unions, welfare organisations, media and press, community groups such as a mohalla committee, and professional and cultural bodies. Arrows show civil society voicing needs to the state and watching it, and the state protecting the freedoms of association, speech and assembly.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="600"/><text class="h" x="24" y="34">Where civil society sits</text><rect class="panel-b" x="270" y="50" width="240" height="52" rx="6"/><text class="sh" x="390" y="74" text-anchor="middle">State</text><text class="small" x="390" y="93" text-anchor="middle">held together by law</text><rect class="panel-b" x="20" y="300" width="130" height="64" rx="6"/><text class="sh" x="85" y="326" text-anchor="middle">Family</text><text class="small" x="85" y="346" text-anchor="middle">kinship and care</text><rect class="panel-b" x="630" y="300" width="130" height="70" rx="6"/><text class="sh" x="695" y="326" text-anchor="middle">Market</text><text class="small" x="695" y="343" text-anchor="middle">buying, selling</text><text class="small" x="695" y="358" text-anchor="middle">and profit</text><rect class="panel-a" x="165" y="200" width="450" height="370" rx="14"/><text class="h" x="390" y="228" text-anchor="middle">Civil society</text><text class="small" x="390" y="247" text-anchor="middle">citizens join by choice: voluntary, non-state, non-profit</text><line class="dline" x1="150" y1="332" x2="165" y2="332"/><line class="dline" x1="615" y1="332" x2="630" y2="332"/><rect class="box" x="183" y="264" width="200" height="82" rx="6"/><text class="sh" x="193" y="286">Associations, unions</text><text class="small" x="193" y="308">a teachers' association,</text><text class="small" x="193" y="324">a trade union</text><rect class="box" x="397" y="264" width="200" height="82" rx="6"/><text class="sh" x="407" y="286">Welfare organisations</text><text class="small" x="407" y="308">a welfare trust running</text><text class="small" x="407" y="324">ambulances or schools</text><rect class="box" x="183" y="360" width="200" height="82" rx="6"/><text class="sh" x="193" y="382">Media and press</text><text class="small" x="193" y="404">a press club, an</text><text class="small" x="193" y="420">independent newspaper</text><rect class="box" x="397" y="360" width="200" height="82" rx="6"/><text class="sh" x="407" y="382">Community groups</text><text class="small" x="407" y="404">a mohalla committee, a</text><text class="small" x="407" y="420">mothers' group</text><rect class="box" x="260" y="456" width="260" height="82" rx="6"/><text class="sh" x="270" y="478">Professional and cultural</text><text class="small" x="270" y="500">a bar association, a literary</text><text class="small" x="270" y="516">society</text><line class="stroke" x1="300" y1="198" x2="300" y2="104" marker-end="url(#arrow)"/><text class="body" x="292" y="140" text-anchor="end">voices needs</text><line class="stroke" x1="340" y1="198" x2="340" y2="104" marker-end="url(#arrow)"/><text class="body" x="332" y="172" text-anchor="end">watches and questions</text><line class="stroke" x1="460" y1="104" x2="460" y2="198" marker-end="url(#arrow)"/><text class="body" x="470" y="124">protects freedoms of</text><text class="body" x="470" y="141">association, speech and</text><text class="body" x="470" y="158">assembly (Articles 16, 17, 19)</text><text class="wm" x="768" y="590" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
