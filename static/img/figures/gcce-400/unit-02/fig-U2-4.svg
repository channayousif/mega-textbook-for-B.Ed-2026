<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six forms of political participation, what each asks of a citizen and a Pakistani example</title><desc id="d">Table of six forms of political participation, what each asks of a citizen and a Pakistani example: voting in an election, contacting a representative such as an MPA, joining a party campaign, sending a petition to the union council, peaceful protest protected by Article 16, and standing for a union council seat.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><text class="h" x="24" y="34">Forms of political participation</text><rect class="panel-a" x="24" y="52" width="192" height="40" rx="0"/><text class="sh" x="32" y="77">Form of participation</text><rect class="panel-a" x="216" y="52" width="266" height="40" rx="0"/><text class="sh" x="224" y="77">What it asks of the citizen</text><rect class="panel-a" x="482" y="52" width="274" height="40" rx="0"/><text class="sh" x="490" y="77">Pakistani example</text><rect class="panel" x="24" y="92" width="192" height="56" rx="0"/><text class="sh" x="32" y="116">Voting</text><rect class="box" x="216" y="92" width="266" height="56" rx="0"/><text class="body" x="224" y="116">Be registered, informed, and go</text><text class="body" x="224" y="133">to the polling station</text><rect class="box" x="482" y="92" width="274" height="56" rx="0"/><text class="body" x="490" y="116">Voting in a general or local</text><text class="body" x="490" y="133">government election</text><rect class="panel" x="24" y="148" width="192" height="56" rx="0"/><text class="sh" x="32" y="172">Contacting a</text><text class="sh" x="32" y="189">representative</text><rect class="box" x="216" y="148" width="266" height="56" rx="0"/><text class="body" x="224" y="172">Know who your representative is</text><text class="body" x="224" y="189">and state the problem clearly</text><rect class="box" x="482" y="148" width="274" height="56" rx="0"/><text class="body" x="490" y="172">A group of parents meeting their</text><text class="body" x="490" y="189">MPA about a school</text><rect class="panel" x="24" y="204" width="192" height="56" rx="0"/><text class="sh" x="32" y="228">Joining a party or</text><text class="sh" x="32" y="245">campaign</text><rect class="box" x="216" y="204" width="266" height="56" rx="0"/><text class="body" x="224" y="228">Time, commitment and working</text><text class="body" x="224" y="245">with others</text><rect class="box" x="482" y="204" width="274" height="56" rx="0"/><text class="body" x="490" y="228">Volunteering for a candidate's</text><text class="body" x="490" y="245">door-to-door campaign</text><rect class="panel" x="24" y="260" width="192" height="56" rx="0"/><text class="sh" x="32" y="284">Petition or written</text><text class="sh" x="32" y="301">complaint</text><rect class="box" x="216" y="260" width="266" height="56" rx="0"/><text class="body" x="224" y="284">Gather facts and signatures, and</text><text class="body" x="224" y="301">follow up</text><rect class="box" x="482" y="260" width="274" height="56" rx="0"/><text class="body" x="490" y="284">Residents' application to the</text><text class="body" x="490" y="301">union council about drainage</text><rect class="panel" x="24" y="316" width="192" height="56" rx="0"/><text class="sh" x="32" y="340">Peaceful protest</text><rect class="box" x="216" y="316" width="266" height="56" rx="0"/><text class="body" x="224" y="340">Organise peacefully and within</text><text class="body" x="224" y="357">the law (Article 16)</text><rect class="box" x="482" y="316" width="274" height="56" rx="0"/><text class="body" x="490" y="340">A peaceful gathering outside a</text><text class="body" x="490" y="357">press club about water shortage</text><rect class="panel" x="24" y="372" width="192" height="56" rx="0"/><text class="sh" x="32" y="396">Standing for</text><text class="sh" x="32" y="413">election</text><rect class="box" x="216" y="372" width="266" height="56" rx="0"/><text class="body" x="224" y="396">Meet the legal conditions and</text><text class="body" x="224" y="413">earn public trust</text><rect class="box" x="482" y="372" width="274" height="56" rx="0"/><text class="body" x="490" y="396">A teacher standing for a union</text><text class="body" x="490" y="413">council seat</text><text class="small" x="24" y="454">Voting is one form among six; most forms can be used between elections.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
