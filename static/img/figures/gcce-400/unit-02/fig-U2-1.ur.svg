<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ریاست کے چار عناصر</title><desc id="d">ریاست کے چار عناصر پر مبنی نقشہ: آبادی، یعنی پاکستان کے شہری؛ سرزمین، یعنی چار صوبے اور اسلام آباد کا دارالحکومتی علاقہ؛ حکومت، یعنی وفاقی، صوبائی اور مقامی حکومتیں؛ اور حاکمیت، یعنی پاکستان کا اپنے قوانین بنانے اور دوسرے ملکوں سے برابری کے ساتھ معاملہ کرنے کا اعلی اختیار۔ ایک نوٹ کہتا ہے کہ انتخابات میں حکومتیں بدلتی ہیں مگر ریاست قائم رہتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.box { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.dash { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 6 4; }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dline { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 18px; font-weight: 700; fill: var(--ink); }
.big { font-size: 20px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="756" y="34" text-anchor="end">ریاست کے چار عناصر</text><rect class="panel-a" x="24" y="52" width="732" height="60" rx="6"/><text class="big" x="390" y="80" text-anchor="middle">ریاست</text><text class="small" x="390" y="101" text-anchor="middle">تبھی قائم ہوتی ہے جب چاروں عناصر موجود ہوں</text><line class="stroke" x1="111" y1="148" x2="111" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="24" y="150" width="174" height="240" rx="6"/><text class="sh" x="188" y="176" text-anchor="end">حاکمیت</text><text class="body" x="188" y="200" text-anchor="end">سرزمین کے اندر اعلی</text><text class="body" x="188" y="219" text-anchor="end">طاقت، بیرونی تسلط سے</text><text class="body" x="188" y="238" text-anchor="end">آزاد</text><text class="small" x="188" y="278" text-anchor="end">پاکستان میں:</text><text class="body" x="188" y="298" text-anchor="end">پاکستان اپنے قوانین</text><text class="body" x="188" y="317" text-anchor="end">بناتا ہے اور دوسرے ملکوں</text><text class="body" x="188" y="336" text-anchor="end">سے برابری کے ساتھ</text><text class="body" x="188" y="355" text-anchor="end">معاملہ کرتا ہے</text><line class="stroke" x1="297" y1="148" x2="297" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="210" y="150" width="174" height="240" rx="6"/><text class="sh" x="374" y="176" text-anchor="end">حکومت</text><text class="body" x="374" y="200" text-anchor="end">وہ ادارہ جو قوانین</text><text class="body" x="374" y="219" text-anchor="end">بناتا، ان پر عمل کرتا</text><text class="body" x="374" y="238" text-anchor="end">اور لاگو کرتا ہے</text><text class="small" x="374" y="278" text-anchor="end">پاکستان میں:</text><text class="body" x="374" y="298" text-anchor="end">وفاقی، صوبائی اور</text><text class="body" x="374" y="317" text-anchor="end">مقامی حکومتیں</text><line class="stroke" x1="483" y1="148" x2="483" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="396" y="150" width="174" height="240" rx="6"/><text class="sh" x="560" y="176" text-anchor="end">سرزمین</text><text class="body" x="560" y="200" text-anchor="end">زمین، پانی اور فضائی</text><text class="body" x="560" y="219" text-anchor="end">علاقے کا متعین حصہ</text><text class="small" x="560" y="259" text-anchor="end">پاکستان میں:</text><text class="body" x="560" y="279" text-anchor="end">چار صوبے اور اسلام آباد</text><text class="body" x="560" y="298" text-anchor="end">کا دارالحکومتی علاقہ</text><text class="body" x="560" y="317" text-anchor="end">(دفعہ 1)</text><line class="stroke" x1="669" y1="148" x2="669" y2="116" marker-end="url(#arrow)"/><rect class="panel" x="582" y="150" width="174" height="240" rx="6"/><text class="sh" x="746" y="176" text-anchor="end">آبادی</text><text class="body" x="746" y="200" text-anchor="end">وے لوگ جو ریاست میں</text><text class="body" x="746" y="219" text-anchor="end">مستقل رہتے ہیں</text><text class="small" x="746" y="259" text-anchor="end">پاکستان میں:</text><text class="body" x="746" y="279" text-anchor="end">پاکستان کے شہری</text><line class="dline" x1="483" y1="390" x2="483" y2="412"/><rect class="dash" x="276" y="412" width="414" height="46" rx="6"/><text class="body" x="483" y="440" text-anchor="middle">انتخابات میں حکومتیں بدلتی ہیں، ریاست قائم رہتی ہے</text><text class="wm" x="12" y="490" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
