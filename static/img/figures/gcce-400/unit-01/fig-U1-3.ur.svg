<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 424" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شہریات شہریت کو کس طرح معلومات دیتی ہے</title><desc id="d">تصویر جس میں بائیں جانب شہریات ہے، جس کی وضاحت قوانین، اداروں، حقوق و فرائض اور حصہ لینے کے طریقے کے علم کے طور پر کی گئی ہے، اور دائیں جانب شہریت ہے جو رکنیت، حقوق، فرائض اور شرکت سے بنتی ہے۔ ایک بڑا تیر دکھاتا ہے کہ شہریات شہریت کو معلومات دیتی ہے، اور ایک واپسی کا تیر دکھاتا ہے کہ شہریت کا تجربہ شہری سمجھ کو گہرا کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="424"/><text class="h" x="756" y="34" text-anchor="end">شہریات اور شہریت کا تعلق کیسے ہے</text><rect class="panel" x="486" y="56" width="270" height="300" rx="10"/><text class="h" x="744" y="86" text-anchor="end">شہریات</text><text class="cell" x="744" y="108" text-anchor="end">معاشرے کے چلانے کا علم</text><rect class="panel-b" x="502" y="147" width="238" height="40" rx="6"/><text class="body" x="728" y="172" text-anchor="end">قوانین اور ادارے</text><rect class="panel-b" x="502" y="199" width="238" height="40" rx="6"/><text class="body" x="728" y="224" text-anchor="end">حقوق و فرائض</text><rect class="panel-b" x="502" y="251" width="238" height="40" rx="6"/><text class="body" x="728" y="276" text-anchor="end">حصہ لینے کے طریقے</text><rect class="panel" x="24" y="56" width="270" height="300" rx="10"/><text class="h" x="282" y="86" text-anchor="end">شہریت</text><text class="cell" x="282" y="108" text-anchor="end">بطور رکن ہم کون ہیں اور کیا</text><text class="cell" x="282" y="125" text-anchor="end">کرتے ہیں</text><rect class="panel-a" x="40" y="147" width="114" height="66" rx="6"/><text class="sh" x="97" y="185" text-anchor="middle">رکنیت</text><rect class="panel-a" x="164" y="147" width="114" height="66" rx="6"/><text class="sh" x="221" y="185" text-anchor="middle">حقوق</text><rect class="panel-a" x="40" y="223" width="114" height="66" rx="6"/><text class="sh" x="97" y="261" text-anchor="middle">فرائض</text><rect class="panel-a" x="164" y="223" width="114" height="66" rx="6"/><text class="sh" x="221" y="261" text-anchor="middle">شرکت</text><line class="stroke" x1="478" y1="166" x2="302" y2="166" marker-end="url(#arrow)"/><text class="cell" x="390" y="136" text-anchor="middle">معلومات دیتی ہے اور</text><text class="cell" x="390" y="153" text-anchor="middle">تیار کرتی ہے</text><line class="thin" x1="302" y1="276" x2="478" y2="276" marker-end="url(#arrow)"/><text class="cell" x="390" y="298" text-anchor="middle">تجربہ سمجھ کو</text><text class="cell" x="390" y="315" text-anchor="middle">گہرا کرتا ہے</text><text class="sh" x="390" y="390" text-anchor="middle">شہریات وہ ہے جو ہم سیکھتے ہیں؛ شہریت وہ ہے جو ہم ہیں اور جو ہم کرتے ہیں۔</text><text class="wm" x="12" y="414" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
