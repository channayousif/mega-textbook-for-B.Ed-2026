<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 424" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of how civics informs citizenship</title><desc id="d">Diagram with civics on the left, described as knowledge of laws, institutions, rights and duties and how to take part, and citizenship on the right, made of membership, rights, duties and participation. A main arrow shows civics informing citizenship, and a return arrow shows that experience of citizenship deepens civic understanding.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="424"/><text class="h" x="24" y="34">How civics and citizenship are related</text><rect class="panel" x="24" y="56" width="270" height="300" rx="10"/><text class="h" x="40" y="86">Civics</text><text class="cell" x="40" y="108">Knowledge of how society is</text><text class="cell" x="40" y="125">governed</text><rect class="panel-b" x="40" y="147" width="238" height="40" rx="6"/><text class="body" x="52" y="172">Laws and institutions</text><rect class="panel-b" x="40" y="199" width="238" height="40" rx="6"/><text class="body" x="52" y="224">Rights and duties</text><rect class="panel-b" x="40" y="251" width="238" height="40" rx="6"/><text class="body" x="52" y="276">How to take part</text><rect class="panel" x="486" y="56" width="270" height="300" rx="10"/><text class="h" x="502" y="86">Citizenship</text><text class="cell" x="502" y="108">Who we are and what we do as</text><text class="cell" x="502" y="125">members</text><rect class="panel-a" x="502" y="147" width="114" height="66" rx="6"/><text class="sh" x="559.0" y="185.0" text-anchor="middle">Membership</text><rect class="panel-a" x="626" y="147" width="114" height="66" rx="6"/><text class="sh" x="683.0" y="185.0" text-anchor="middle">Rights</text><rect class="panel-a" x="502" y="223" width="114" height="66" rx="6"/><text class="sh" x="559.0" y="261.0" text-anchor="middle">Duties</text><rect class="panel-a" x="626" y="223" width="114" height="66" rx="6"/><text class="sh" x="683.0" y="261.0" text-anchor="middle">Participation</text><line class="stroke" x1="302" y1="166" x2="478" y2="166" marker-end="url(#arrow)"/><text class="cell" x="390.0" y="136" text-anchor="middle">informs and</text><text class="cell" x="390.0" y="153" text-anchor="middle">prepares</text><line class="thin" x1="478" y1="276" x2="302" y2="276" marker-end="url(#arrow)"/><text class="cell" x="390.0" y="298" text-anchor="middle">experience deepens</text><text class="cell" x="390.0" y="315" text-anchor="middle">understanding</text><text class="sh" x="390.0" y="390" text-anchor="middle">Civics is what we learn; citizenship is who we are and what we do.</text><text class="wm" x="768" y="414" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
