<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شہری کے چار کردار زمنی ترتیب میں</title><desc id="d">جدول میں شہری کے چار کردار زمنی ترتیب میں ہیں۔ تابع حکمران کی تعمیل کرتا ہے اور چند حقوق رکھتا ہے، جیسے 1947 سے پہلے برطانوی ہندوستان میں۔ رأی دہندہ نمائندے منتخب کرتا ہے، جیسے 1970 کے عام انتخابات میں۔ شریک انتخابات کے درمیان حصہ لیتا ہے، جیسے اسکول مینجمنٹ کمیٹی پر کوئی والد۔ ڈیجیٹل شریک آن لائن حصہ لیتا ہے، جیسے ایک نوجوان گروہ جو تصدیق شدہ سیلاب امدادی معلومات شیئر کرتا ہے۔ ایک تیر دکھاتا ہے کہ کردار وقت کے ساتھ جمع ہوتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="512"/><text class="h" x="756" y="34" text-anchor="end">شہری کا کردار پہلے اور آج</text><rect class="panel-a" x="616" y="52" width="104" height="40"/><text class="sh" x="712" y="77" text-anchor="end">کردار</text><rect class="panel-a" x="396" y="52" width="220" height="40"/><text class="sh" x="608" y="77" text-anchor="end">شخص کیا کرتا ہے</text><rect class="panel-a" x="212" y="52" width="184" height="40"/><text class="sh" x="388" y="77" text-anchor="end">کیا امید کر سکتا ہے</text><rect class="panel-a" x="24" y="52" width="188" height="40"/><text class="sh" x="204" y="77" text-anchor="end">پاکستانی مثال</text><rect class="panel" x="616" y="92" width="104" height="73"/><text class="sh" x="712" y="112" text-anchor="end">تابع</text><rect class="bg" x="396" y="92" width="220" height="73"/><rect class="thin" x="396" y="92" width="220" height="73"/><text class="cell" x="608" y="112" text-anchor="end">حکمران کی تعمیل کرتا ہے اور</text><text class="cell" x="608" y="129" text-anchor="end">حکومت میں کوئی کردار نہیں</text><text class="cell" x="608" y="146" text-anchor="end">رکھتا</text><rect class="bg" x="212" y="92" width="184" height="73"/><rect class="thin" x="212" y="92" width="184" height="73"/><text class="cell" x="388" y="112" text-anchor="end">چند حقوق؛ صرف وہ</text><text class="cell" x="388" y="129" text-anchor="end">تحفظ جو حکمران دیتا</text><text class="cell" x="388" y="146" text-anchor="end">ہے</text><rect class="bg" x="24" y="92" width="188" height="73"/><rect class="thin" x="24" y="92" width="188" height="73"/><text class="cell" x="204" y="112" text-anchor="end">1947 سے پہلے برطانوی</text><text class="cell" x="204" y="129" text-anchor="end">ہندوستان کا رہنے والا</text><rect class="panel" x="616" y="165" width="104" height="73"/><text class="sh" x="712" y="185" text-anchor="end">رأی دہندہ</text><rect class="bg" x="396" y="165" width="220" height="73"/><rect class="thin" x="396" y="165" width="220" height="73"/><text class="cell" x="608" y="185" text-anchor="end">انتخابات میں نمائندے منتخب</text><text class="cell" x="608" y="202" text-anchor="end">کرتا ہے</text><rect class="bg" x="212" y="165" width="184" height="73"/><rect class="thin" x="212" y="165" width="184" height="73"/><text class="cell" x="388" y="185" text-anchor="end">سیاسی حقوق، جیسے رأی</text><rect class="bg" x="24" y="165" width="188" height="73"/><rect class="thin" x="24" y="165" width="188" height="73"/><text class="cell" x="204" y="185" text-anchor="end">1970 کے عام انتخابات میں</text><text class="cell" x="204" y="202" text-anchor="end">رأی دینے والا شہری</text><rect class="panel" x="616" y="238" width="104" height="90"/><text class="sh" x="712" y="258" text-anchor="end">شریک</text><rect class="bg" x="396" y="238" width="220" height="90"/><rect class="thin" x="396" y="238" width="220" height="90"/><text class="cell" x="608" y="258" text-anchor="end">انتخابات کے درمیان انجمنوں،</text><text class="cell" x="608" y="275" text-anchor="end">اجلاسات اور برادری کے کام کے</text><text class="cell" x="608" y="292" text-anchor="end">ذریعے حصہ لیتا ہے</text><rect class="bg" x="212" y="238" width="184" height="90"/><rect class="thin" x="212" y="238" width="184" height="90"/><text class="cell" x="388" y="258" text-anchor="end">فیصلوں میں جو روزمرہ</text><text class="cell" x="388" y="275" text-anchor="end">زندگی کو متاثر کرتے ہیں</text><text class="cell" x="388" y="292" text-anchor="end">ان میں آواز</text><rect class="bg" x="24" y="238" width="188" height="90"/><rect class="thin" x="24" y="238" width="188" height="90"/><text class="cell" x="204" y="258" text-anchor="end">اسکول مینجمنٹ کمیٹی پر</text><text class="cell" x="204" y="275" text-anchor="end">کوئی والد</text><rect class="panel" x="616" y="328" width="104" height="107"/><text class="sh" x="712" y="348" text-anchor="end">ڈیجیٹل شریک</text><rect class="bg" x="396" y="328" width="220" height="107"/><rect class="thin" x="396" y="328" width="220" height="107"/><text class="cell" x="608" y="348" text-anchor="end">آن لائن حصہ لیتا ہے، مثلاً</text><text class="cell" x="608" y="365" text-anchor="end">حکومتی شکایت پورٹل یا ذمہ</text><text class="cell" x="608" y="382" text-anchor="end">دارانہ مہم کے ذریعے</text><rect class="bg" x="212" y="328" width="184" height="107"/><rect class="thin" x="212" y="328" width="184" height="107"/><text class="cell" x="388" y="348" text-anchor="end">سنے جانے کے نئے طریقے،</text><text class="cell" x="388" y="365" text-anchor="end">جہاں رسائی ہو</text><rect class="bg" x="24" y="328" width="188" height="107"/><rect class="thin" x="24" y="328" width="188" height="107"/><text class="cell" x="204" y="348" text-anchor="end">ایک نوجوان گروہ جو تصدیق</text><text class="cell" x="204" y="365" text-anchor="end">شدہ سیلاب امدادی معلومات</text><text class="cell" x="204" y="382" text-anchor="end">شیئر کرتا ہے</text><rect class="stroke" x="24" y="52" width="696" height="383"/><line class="stroke" x1="742" y1="100" x2="742" y2="427" marker-end="url(#arrow)"/><text class="small" x="756" y="465" text-anchor="end">تیر دکھاتا ہے کہ کردار وقت کے ساتھ جمع ہوتے ہیں: آج کا شہری</text><text class="small" x="756" y="482" text-anchor="end">چاروں کردار ادا کر سکتا ہے۔</text><text class="wm" x="12" y="502" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
