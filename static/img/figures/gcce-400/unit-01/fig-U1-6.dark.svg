<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 466" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of citizenship as the foundation of modern society</title><desc id="d">Diagram of a building labelled modern society, standing on a base labelled citizenship and held up by four pillars: law, with the same rules for every citizen; rights, with equal rights for all citizens under Article 25; participation, with citizens choosing and questioning those who govern under Article 51; and shared identity, a sense of belonging to one political community.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="466"/><text class="h" x="24" y="34">Citizenship as a foundation of modern society</text><polygon class="panel-a" points="390,52 744,128 36,128"/><text class="h" x="390" y="112" text-anchor="middle">Modern society</text><rect class="panel" x="36" y="128" width="708" height="44"/><text class="body" x="390" y="156" text-anchor="middle">People who do not know one another live and decide together</text><rect class="panel" x="36" y="184" width="162" height="186"/><text class="sh" x="117.0" y="212" text-anchor="middle">Law</text><text class="cell" x="117.0" y="240" text-anchor="middle">The same rules</text><text class="cell" x="117.0" y="257" text-anchor="middle">apply to every</text><text class="cell" x="117.0" y="274" text-anchor="middle">citizen (Articles</text><text class="cell" x="117.0" y="291" text-anchor="middle">4 and 5)</text><rect class="panel" x="218" y="184" width="162" height="186"/><text class="sh" x="299.0" y="212" text-anchor="middle">Rights</text><text class="cell" x="299.0" y="240" text-anchor="middle">Equal rights for</text><text class="cell" x="299.0" y="257" text-anchor="middle">all citizens</text><text class="cell" x="299.0" y="274" text-anchor="middle">(Article 25)</text><rect class="panel" x="400" y="184" width="162" height="186"/><text class="sh" x="481.0" y="212" text-anchor="middle">Participation</text><text class="cell" x="481.0" y="240" text-anchor="middle">Citizens choose</text><text class="cell" x="481.0" y="257" text-anchor="middle">and question those</text><text class="cell" x="481.0" y="274" text-anchor="middle">who govern</text><text class="cell" x="481.0" y="291" text-anchor="middle">(Article 51)</text><rect class="panel" x="582" y="184" width="162" height="186"/><text class="sh" x="663.0" y="212" text-anchor="middle">Shared identity</text><text class="cell" x="663.0" y="240" text-anchor="middle">A sense of</text><text class="cell" x="663.0" y="257" text-anchor="middle">belonging to one</text><text class="cell" x="663.0" y="274" text-anchor="middle">political</text><text class="cell" x="663.0" y="291" text-anchor="middle">community</text><rect class="panel-b" x="24" y="382" width="732" height="48"/><text class="h" x="390" y="412" text-anchor="middle">Citizenship</text><text class="wm" x="768" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
