<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 548" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شہری سرگرمی کی اقسام کا تصوری نقشہ</title><desc id="d">تصوری نقشہ جس میں شہری سرگرمی درمیان میں ہے اور پانچ منسلک اقسام ہیں، ہر ایک کے ساتھ ایک پاکستانی مثال: انتخاب میں رأی دینا، سیلاب امدادی کیمپ میں رضاکارانہ خدمت، گلی کا نالہ صاف کرنے جیسا برادری کا کام، اسکول کمیٹی کے اجلاس میں عوامی بحث، اور دفعہ 16 کے تحت صاف پانی کے لیے پرامن احتجاج۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="548"/><text class="h" x="756" y="34" text-anchor="end">شہری سرگرمی کی اقسام، ہر ایک کی پاکستانی مثال کے ساتھ</text><line class="stroke" x1="471.0" y1="189.0" x2="522.3" y2="169.4" marker-end="url(#arrow)"/><line class="stroke" x1="309.0" y1="189.0" x2="257.7" y2="169.4" marker-end="url(#arrow)"/><line class="stroke" x1="459.4" y1="254.3" x2="528.1" y2="288.2" marker-end="url(#arrow)"/><line class="stroke" x1="320.6" y1="254.3" x2="251.9" y2="288.2" marker-end="url(#arrow)"/><line class="stroke" x1="390.0" y1="262.0" x2="390.0" y2="396.0" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="220" rx="120" ry="42"/><text class="h" x="390" y="226" text-anchor="middle">شہری سرگرمی</text><rect class="panel" x="526" y="70" width="230" height="108" rx="8"/><text class="sh" x="744" y="96" text-anchor="end">رأی دینا</text><text class="cell" x="744" y="118" text-anchor="end">مقامی حکومت یا عام انتخاب</text><text class="cell" x="744" y="135" text-anchor="end">میں رأی ڈالنا</text><rect class="panel" x="24" y="70" width="230" height="108" rx="8"/><text class="sh" x="242" y="96" text-anchor="end">رضاکارانہ خدمت</text><text class="cell" x="242" y="118" text-anchor="end">سندھ میں سیلاب امدادی</text><text class="cell" x="242" y="135" text-anchor="end">کیمپ میں مدد</text><rect class="panel" x="526" y="290" width="230" height="108" rx="8"/><text class="sh" x="744" y="316" text-anchor="end">برادری کا کام</text><text class="cell" x="744" y="338" text-anchor="end">پڑوسی بند نالہ صاف کرتے</text><text class="cell" x="744" y="355" text-anchor="end">ہیں یا اسکول کی دیوار</text><text class="cell" x="744" y="372" text-anchor="end">مرمت کرتے ہیں</text><rect class="panel" x="24" y="290" width="230" height="108" rx="8"/><text class="sh" x="242" y="316" text-anchor="end">عوامی بحث</text><text class="cell" x="242" y="338" text-anchor="end">اسکول مینجمنٹ کمیٹی کے</text><text class="cell" x="242" y="355" text-anchor="end">اجلاس میں بولنا یا اخبار</text><text class="cell" x="242" y="372" text-anchor="end">کو خط لکھنا</text><rect class="panel" x="275" y="400" width="230" height="108" rx="8"/><text class="sh" x="493" y="426" text-anchor="end">پرامن احتجاج</text><text class="cell" x="493" y="448" text-anchor="end">صاف پانی کے لیے پرامن، غیر</text><text class="cell" x="493" y="465" text-anchor="end">ہتھیار اجتماع (دفعہ 16)</text><text class="small" x="756" y="534" text-anchor="end">رأی دینا پانچ اقسام میں سے ایک ہے۔</text><text class="wm" x="12" y="538" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
