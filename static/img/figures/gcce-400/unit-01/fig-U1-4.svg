<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four roles of the citizen in time order</title><desc id="d">Table of four roles of the citizen in time order. A subject obeys a ruler with few rights, as in British India before 1947. A voter chooses representatives, as in the 1970 general elections. A participant takes part between elections, such as a parent on a school management committee. A digital participant takes part online, such as a youth group sharing verified flood relief information. An arrow shows the roles add up over time.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="512"/><text class="h" x="24" y="34">The citizen's role then and now</text><rect class="panel-a" x="60" y="52" width="104" height="40"/><text class="sh" x="68" y="77">Role</text><rect class="panel-a" x="164" y="52" width="220" height="40"/><text class="sh" x="172" y="77">What the person does</text><rect class="panel-a" x="384" y="52" width="184" height="40"/><text class="sh" x="392" y="77">Can expect</text><rect class="panel-a" x="568" y="52" width="188" height="40"/><text class="sh" x="576" y="77">Pakistani example</text><rect class="panel" x="60" y="92" width="104" height="73"/><text class="sh" x="68" y="112">Subject</text><rect class="bg" x="164" y="92" width="220" height="73"/><rect class="thin" x="164" y="92" width="220" height="73"/><text class="cell" x="172" y="112">Obeys the ruler and has no</text><text class="cell" x="172" y="129">say in government</text><rect class="bg" x="384" y="92" width="184" height="73"/><rect class="thin" x="384" y="92" width="184" height="73"/><text class="cell" x="392" y="112">Few rights;</text><text class="cell" x="392" y="129">protection only as</text><text class="cell" x="392" y="146">the ruler allows</text><rect class="bg" x="568" y="92" width="188" height="73"/><rect class="thin" x="568" y="92" width="188" height="73"/><text class="cell" x="576" y="112">A resident of British</text><text class="cell" x="576" y="129">India before 1947</text><rect class="panel" x="60" y="165" width="104" height="73"/><text class="sh" x="68" y="185">Voter</text><rect class="bg" x="164" y="165" width="220" height="73"/><rect class="thin" x="164" y="165" width="220" height="73"/><text class="cell" x="172" y="185">Chooses representatives at</text><text class="cell" x="172" y="202">elections</text><rect class="bg" x="384" y="165" width="184" height="73"/><rect class="thin" x="384" y="165" width="184" height="73"/><text class="cell" x="392" y="185">Political rights,</text><text class="cell" x="392" y="202">such as the vote</text><rect class="bg" x="568" y="165" width="188" height="73"/><rect class="thin" x="568" y="165" width="188" height="73"/><text class="cell" x="576" y="185">A citizen voting in</text><text class="cell" x="576" y="202">the 1970 general</text><text class="cell" x="576" y="219">elections</text><rect class="panel" x="60" y="238" width="104" height="90"/><text class="sh" x="68" y="258">Participant</text><rect class="bg" x="164" y="238" width="220" height="90"/><rect class="thin" x="164" y="238" width="220" height="90"/><text class="cell" x="172" y="258">Takes part between</text><text class="cell" x="172" y="275">elections through</text><text class="cell" x="172" y="292">associations, meetings and</text><text class="cell" x="172" y="309">community work</text><rect class="bg" x="384" y="238" width="184" height="90"/><rect class="thin" x="384" y="238" width="184" height="90"/><text class="cell" x="392" y="258">A voice in decisions</text><text class="cell" x="392" y="275">that affect daily</text><text class="cell" x="392" y="292">life</text><rect class="bg" x="568" y="238" width="188" height="90"/><rect class="thin" x="568" y="238" width="188" height="90"/><text class="cell" x="576" y="258">A parent on a school</text><text class="cell" x="576" y="275">management committee</text><rect class="panel" x="60" y="328" width="104" height="107"/><text class="sh" x="68" y="348">Digital</text><text class="sh" x="68" y="365">participant</text><rect class="bg" x="164" y="328" width="220" height="107"/><rect class="thin" x="164" y="328" width="220" height="107"/><text class="cell" x="172" y="348">Takes part online, for</text><text class="cell" x="172" y="365">example through a</text><text class="cell" x="172" y="382">government complaint</text><text class="cell" x="172" y="399">portal or a responsible</text><text class="cell" x="172" y="416">campaign</text><rect class="bg" x="384" y="328" width="184" height="107"/><rect class="thin" x="384" y="328" width="184" height="107"/><text class="cell" x="392" y="348">New ways to be heard,</text><text class="cell" x="392" y="365">where there is access</text><rect class="bg" x="568" y="328" width="188" height="107"/><rect class="thin" x="568" y="328" width="188" height="107"/><text class="cell" x="576" y="348">A youth group sharing</text><text class="cell" x="576" y="365">verified flood relief</text><text class="cell" x="576" y="382">information</text><rect class="stroke" x="60" y="52" width="696" height="383"/><line class="stroke" x1="38" y1="100" x2="38" y2="427" marker-end="url(#arrow)"/><text class="small" x="24" y="465">The arrow on the left shows that the roles add up over time: a citizen today can play all</text><text class="small" x="24" y="482">four.</text><text class="wm" x="768" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
