<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of civic participation from ancient Athens to Pakistan today</title><desc id="d">Timeline of civic participation from ancient Athens, where only free adult men could take part, through Roman legal citizenship and the restricted franchise of 1946, to Pakistan's provincial elections on adult franchise from 1951, the 1970 general elections on universal adult franchise, and today's right to vote at 18 under Article 51. A widening band shows that more people were included at each step.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="610"/><text class="h" x="24" y="34">How civic participation widened over time</text><polygon class="panel-a" points="104,74.5 112,74.5 140,523.0 76,523.0"/><rect class="panel" x="150" y="56" width="606" height="65" rx="6"/><text class="sh" x="162" y="80">5th century BCE, Athens: an assembly of citizens</text><text class="cell" x="162" y="100">Only free adult men took part. Women, slaves and foreigners were left out.</text><line class="thin" x1="118" y1="88.5" x2="150" y2="88.5"/><rect class="panel" x="150" y="135" width="606" height="65" rx="6"/><text class="sh" x="162" y="159">Rome: citizenship as legal protection</text><text class="cell" x="162" y="179">Citizens were protected by the law more than they helped to make it.</text><line class="thin" x1="118" y1="167.5" x2="150" y2="167.5"/><rect class="panel" x="150" y="214" width="606" height="65" rx="6"/><text class="sh" x="162" y="238">1946, British India: provincial elections</text><text class="cell" x="162" y="258">Held on a restricted franchise, so many adults could not vote.</text><line class="thin" x1="118" y1="246.5" x2="150" y2="246.5"/><rect class="panel" x="150" y="293" width="606" height="65" rx="6"/><text class="sh" x="162" y="317">1951 to 1954, Pakistan: provincial elections</text><text class="cell" x="162" y="337">First held on adult franchise. Sindh voted in 1953.</text><line class="thin" x1="118" y1="325.5" x2="150" y2="325.5"/><rect class="panel" x="150" y="372" width="606" height="82" rx="6"/><text class="sh" x="162" y="396">1970, Pakistan: general elections</text><text class="cell" x="162" y="416">The first national elections on universal adult franchise: one person, one</text><text class="cell" x="162" y="433">vote.</text><line class="thin" x1="118" y1="413.0" x2="150" y2="413.0"/><rect class="panel" x="150" y="468" width="606" height="82" rx="6"/><text class="sh" x="162" y="492">Today: Constitution, Article 51</text><text class="cell" x="162" y="512">Every citizen aged 18 or over whose name is on the electoral roll can</text><text class="cell" x="162" y="529">vote.</text><line class="thin" x1="118" y1="509.0" x2="150" y2="509.0"/><line class="stroke" x1="108" y1="88.5" x2="108" y2="509.0" marker-end="url(#arrow)"/><circle class="dot" cx="108" cy="88.5" r="6"/><circle class="dot" cx="108" cy="167.5" r="6"/><circle class="dot" cx="108" cy="246.5" r="6"/><circle class="dot" cx="108" cy="325.5" r="6"/><circle class="dot" cx="108" cy="413.0" r="6"/><circle class="dot" cx="108" cy="509.0" r="6"/><text class="small" x="24" y="580">The widening band shows that more people were included at each step.</text><text class="wm" x="768" y="600" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
