<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 466" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شہریت بطور جدید معاشرے کی بنیاد</title><desc id="d">تصویر ایک عمارت کی ہے جس پر لکھا ہے جدید معاشرہ: ایسے لوگ جو ایک دوسرے کو نہیں جانتے ساتھ رہتے ہیں اور فیصلہ کرتے ہیں، جو شہریت نامی بنیاد پر کھڑی ہے اور چار ستونوں سے تھامی ہے: قانون، ہر شہری کے لیے یکساں اصول؛ حقوق، دفعہ 25 کے تحت تمام شہریوں کے لیے برابر حقوق؛ شرکت، شہری انتخاب کرتے ہیں اور دفعہ 51 کے تحت حکمرانوں کو سوال کرتے ہیں؛ اور مشترکہ شناخت، ایک سیاسی برادری سے تعلق کا احساس۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="466"/><text class="h" x="756" y="34" text-anchor="end">شہریت بطور جدید معاشرے کی بنیاد</text><polygon class="panel-a" points="390,52 36,128 744,128"/><text class="h" x="390" y="112" text-anchor="middle">جدید معاشرہ</text><rect class="panel" x="36" y="128" width="708" height="44"/><text class="body" x="390" y="156" text-anchor="middle">ایسے لوگ جو ایک دوسرے کو نہیں جانتے ساتھ رہتے ہیں اور فیصلہ کرتے ہیں</text><rect class="panel" x="36" y="184" width="162" height="186"/><text class="sh" x="117" y="212" text-anchor="middle">مشترکہ شناخت</text><text class="cell" x="117" y="240" text-anchor="middle">ایک سیاسی برادری</text><text class="cell" x="117" y="257" text-anchor="middle">سے تعلق کا</text><text class="cell" x="117" y="274" text-anchor="middle">احساس</text><rect class="panel" x="218" y="184" width="162" height="186"/><text class="sh" x="299" y="212" text-anchor="middle">شرکت</text><text class="cell" x="299" y="240" text-anchor="middle">شہری انتخاب کرتے</text><text class="cell" x="299" y="257" text-anchor="middle">ہیں اور حکمرانوں کو</text><text class="cell" x="299" y="274" text-anchor="middle">سوال کرتے ہیں</text><text class="cell" x="299" y="291" text-anchor="middle">(دفعہ 51)</text><rect class="panel" x="400" y="184" width="162" height="186"/><text class="sh" x="481" y="212" text-anchor="middle">حقوق</text><text class="cell" x="481" y="240" text-anchor="middle">تمام شہریوں کے لیے</text><text class="cell" x="481" y="257" text-anchor="middle">برابر حقوق</text><text class="cell" x="481" y="274" text-anchor="middle">(دفعہ 25)</text><rect class="panel" x="582" y="184" width="162" height="186"/><text class="sh" x="663" y="212" text-anchor="middle">قانون</text><text class="cell" x="663" y="240" text-anchor="middle">ہر شہری پر یکساں</text><text class="cell" x="663" y="257" text-anchor="middle">اصول (دفعات 4</text><text class="cell" x="663" y="274" text-anchor="middle">اور 5)</text><rect class="panel-b" x="24" y="382" width="732" height="48"/><text class="h" x="390" y="412" text-anchor="middle">شہریت</text><text class="wm" x="12" y="456" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
