<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 461" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing active, participatory and digital citizenship</title><desc id="d">Table comparing active, participatory and digital citizenship by main feature, what the citizen does, a Pakistani example and a key question. Active citizenship is acting responsibly in public life, like volunteering at a flood relief camp. Participatory citizenship is organising collective effort, like a woman organising her street to cook for flood families. Digital citizenship is taking part through digital tools, like sharing verified relief information. A note says one action can belong to more than one kind.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="461"/><text class="h" x="24" y="34">Active, participatory and digital citizenship compared</text><rect class="panel-a" x="24" y="52" width="116" height="40"/><text class="sh" x="32" y="77"></text><rect class="panel-a" x="140" y="52" width="206" height="40"/><text class="sh" x="148" y="77">Active</text><rect class="panel-a" x="346" y="52" width="206" height="40"/><text class="sh" x="354" y="77">Participatory</text><rect class="panel-a" x="552" y="52" width="204" height="40"/><text class="sh" x="560" y="77">Digital</text><rect class="panel" x="24" y="92" width="116" height="73"/><text class="sh" x="32" y="112">Main feature</text><rect class="bg" x="140" y="92" width="206" height="73"/><rect class="thin" x="140" y="92" width="206" height="73"/><text class="cell" x="148" y="112">Takes part in public</text><text class="cell" x="148" y="129">life, peacefully and</text><text class="cell" x="148" y="146">within the law</text><rect class="bg" x="346" y="92" width="206" height="73"/><rect class="thin" x="346" y="92" width="206" height="73"/><text class="cell" x="354" y="112">Organises or joins</text><text class="cell" x="354" y="129">collective efforts and</text><text class="cell" x="354" y="146">institutions</text><rect class="bg" x="552" y="92" width="204" height="73"/><rect class="thin" x="552" y="92" width="204" height="73"/><text class="cell" x="560" y="112">Uses digital tools to</text><text class="cell" x="560" y="129">take part safely and</text><text class="cell" x="560" y="146">responsibly</text><rect class="panel" x="24" y="165" width="116" height="90"/><text class="sh" x="32" y="185">What the</text><text class="sh" x="32" y="202">citizen does</text><rect class="bg" x="140" y="165" width="206" height="90"/><rect class="thin" x="140" y="165" width="206" height="90"/><text class="cell" x="148" y="185">Votes, stays informed,</text><text class="cell" x="148" y="202">volunteers, reports a</text><text class="cell" x="148" y="219">problem</text><rect class="bg" x="346" y="165" width="206" height="90"/><rect class="thin" x="346" y="165" width="206" height="90"/><text class="cell" x="354" y="185">Forms committees,</text><text class="cell" x="354" y="202">associations and</text><text class="cell" x="354" y="219">community projects</text><rect class="bg" x="552" y="165" width="204" height="90"/><rect class="thin" x="552" y="165" width="204" height="90"/><text class="cell" x="560" y="185">Uses complaint portals,</text><text class="cell" x="560" y="202">joins responsible</text><text class="cell" x="560" y="219">campaigns, checks facts</text><text class="cell" x="560" y="236">before sharing</text><rect class="panel" x="24" y="255" width="116" height="73"/><text class="sh" x="32" y="275">Pakistani</text><text class="sh" x="32" y="292">example</text><rect class="bg" x="140" y="255" width="206" height="73"/><rect class="thin" x="140" y="255" width="206" height="73"/><text class="cell" x="148" y="275">A young man gives two</text><text class="cell" x="148" y="292">days at a flood relief</text><text class="cell" x="148" y="309">camp</text><rect class="bg" x="346" y="255" width="206" height="73"/><rect class="thin" x="346" y="255" width="206" height="73"/><text class="cell" x="354" y="275">A woman organises her</text><text class="cell" x="354" y="292">street to cook for flood</text><text class="cell" x="354" y="309">families</text><rect class="bg" x="552" y="255" width="204" height="73"/><rect class="thin" x="552" y="255" width="204" height="73"/><text class="cell" x="560" y="275">A youth checks relief</text><text class="cell" x="560" y="292">camp numbers, then</text><text class="cell" x="560" y="309">shares them online</text><rect class="panel" x="24" y="328" width="116" height="73"/><text class="sh" x="32" y="348">Key question</text><rect class="bg" x="140" y="328" width="206" height="73"/><rect class="thin" x="140" y="328" width="206" height="73"/><text class="cell" x="148" y="348">Does the person act in</text><text class="cell" x="148" y="365">public life?</text><rect class="bg" x="346" y="328" width="206" height="73"/><rect class="thin" x="346" y="328" width="206" height="73"/><text class="cell" x="354" y="348">Does the person work</text><text class="cell" x="354" y="365">with others in an</text><text class="cell" x="354" y="382">organised way?</text><rect class="bg" x="552" y="328" width="204" height="73"/><rect class="thin" x="552" y="328" width="204" height="73"/><text class="cell" x="560" y="348">Does the action happen</text><text class="cell" x="560" y="365">through digital tools?</text><rect class="stroke" x="24" y="52" width="732" height="349"/><text class="small" x="24" y="431">One action can belong to more than one kind.</text><text class="wm" x="768" y="451" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
