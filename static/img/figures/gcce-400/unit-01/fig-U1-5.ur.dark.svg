<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 461" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">فعال، شراکتی اور ڈیجیٹل شہریت کا موازنہ</title><desc id="d">جدول جو فعال، شراکتی اور ڈیجیٹل شہریت کا مرکزی خصوصیت، شہری کا کام، پاکستانی مثال اور اہم سوال کے ساتھ موازنہ کرتی ہے۔ فعال شہریت عوامی زندگی میں ذمہ دارانہ کام کرنا ہے، جیسے سیلاب امدادی کیمپ میں رضاکارانہ خدمت۔ شراکتی شہریت اجتماعی کوششوں کا منظم کرنا ہے، جیسے ایک عورت اپنی گلی کو سیلاب زدگان کے کھانے پکانے کے لیے منظم کرتی ہے۔ ڈیجیٹل شہریت ڈیجیٹل اوزار کے ذریعے حصہ لینا ہے، جیسے تصدیق شدہ امدادی معلومات شیئر کرنا۔ ایک نوٹ کہتی ہے کہ ایک کام ایک سے زیادہ قسم کا ہو سکتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="461"/><text class="h" x="756" y="34" text-anchor="end">فعال، شراکتی اور ڈیجیٹل شہریت کا موازنہ</text><rect class="panel-a" x="640" y="52" width="116" height="40"/><text class="sh" x="748" y="77" text-anchor="end"></text><rect class="panel-a" x="434" y="52" width="206" height="40"/><text class="sh" x="632" y="77" text-anchor="end">فعال</text><rect class="panel-a" x="228" y="52" width="206" height="40"/><text class="sh" x="426" y="77" text-anchor="end">شراکتی</text><rect class="panel-a" x="24" y="52" width="204" height="40"/><text class="sh" x="220" y="77" text-anchor="end">ڈیجیٹل</text><rect class="panel" x="640" y="92" width="116" height="73"/><text class="sh" x="748" y="112" text-anchor="end">مرکزی</text><text class="sh" x="748" y="129" text-anchor="end">خصوصیت</text><rect class="bg" x="434" y="92" width="206" height="73"/><rect class="thin" x="434" y="92" width="206" height="73"/><text class="cell" x="632" y="112" text-anchor="end">عوامی زندگی میں حصہ لیتا ہے،</text><text class="cell" x="632" y="129" text-anchor="end">پرامن اور قانون کے اندر</text><rect class="bg" x="228" y="92" width="206" height="73"/><rect class="thin" x="228" y="92" width="206" height="73"/><text class="cell" x="426" y="112" text-anchor="end">اجتماعی کوششوں اور اداروں کو</text><text class="cell" x="426" y="129" text-anchor="end">منظم کرتا ہے یا ان میں شامل</text><text class="cell" x="426" y="146" text-anchor="end">ہوتا ہے</text><rect class="bg" x="24" y="92" width="204" height="73"/><rect class="thin" x="24" y="92" width="204" height="73"/><text class="cell" x="220" y="112" text-anchor="end">ڈیجیٹل اوزار استعمال کرتا</text><text class="cell" x="220" y="129" text-anchor="end">ہے تاکہ محفوظ اور ذمہ دارانہ</text><text class="cell" x="220" y="146" text-anchor="end">انداز میں حصہ لے</text><rect class="panel" x="640" y="165" width="116" height="90"/><text class="sh" x="748" y="185" text-anchor="end">شہری کیا</text><text class="sh" x="748" y="202" text-anchor="end">کرتا ہے</text><rect class="bg" x="434" y="165" width="206" height="90"/><rect class="thin" x="434" y="165" width="206" height="90"/><text class="cell" x="632" y="185" text-anchor="end">رأی دیتا ہے، مطلع رہتا ہے،</text><text class="cell" x="632" y="202" text-anchor="end">رضاکارانہ خدمت کرتا ہے،</text><text class="cell" x="632" y="219" text-anchor="end">مسئلہ کی اطلاع دیتا ہے</text><rect class="bg" x="228" y="165" width="206" height="90"/><rect class="thin" x="228" y="165" width="206" height="90"/><text class="cell" x="426" y="185" text-anchor="end">کمیٹیاں، انجمنیں اور برادری</text><text class="cell" x="426" y="202" text-anchor="end">کے منصوبے بناتا ہے</text><rect class="bg" x="24" y="165" width="204" height="90"/><rect class="thin" x="24" y="165" width="204" height="90"/><text class="cell" x="220" y="185" text-anchor="end">شکایت پورٹل استعمال کرتا</text><text class="cell" x="220" y="202" text-anchor="end">ہے، ذمہ دارانہ مہمات میں شامل</text><text class="cell" x="220" y="219" text-anchor="end">ہوتا ہے، شیئر کرنے سے پہلے</text><text class="cell" x="220" y="236" text-anchor="end">حقائق چیک کرتا ہے</text><rect class="panel" x="640" y="255" width="116" height="73"/><text class="sh" x="748" y="275" text-anchor="end">پاکستانی</text><text class="sh" x="748" y="292" text-anchor="end">مثال</text><rect class="bg" x="434" y="255" width="206" height="73"/><rect class="thin" x="434" y="255" width="206" height="73"/><text class="cell" x="632" y="275" text-anchor="end">ایک نوجوان سیلاب امدادی</text><text class="cell" x="632" y="292" text-anchor="end">کیمپ میں دو دن دیتا ہے</text><rect class="bg" x="228" y="255" width="206" height="73"/><rect class="thin" x="228" y="255" width="206" height="73"/><text class="cell" x="426" y="275" text-anchor="end">ایک عورت اپنی گلی کو سیلاب</text><text class="cell" x="426" y="292" text-anchor="end">زدگان کے لیے کھانا پکانے کے</text><text class="cell" x="426" y="309" text-anchor="end">لیے منظم کرتی ہے</text><rect class="bg" x="24" y="255" width="204" height="73"/><rect class="thin" x="24" y="255" width="204" height="73"/><text class="cell" x="220" y="275" text-anchor="end">ایک نوجوان امدادی کیمپوں</text><text class="cell" x="220" y="292" text-anchor="end">کے نمبر چیک کرتا ہے، پھر</text><text class="cell" x="220" y="309" text-anchor="end">انہیں آن لائن شیئر کرتا ہے</text><rect class="panel" x="640" y="328" width="116" height="73"/><text class="sh" x="748" y="348" text-anchor="end">اہم سوال</text><rect class="bg" x="434" y="328" width="206" height="73"/><rect class="thin" x="434" y="328" width="206" height="73"/><text class="cell" x="632" y="348" text-anchor="end">کیا شخص عوامی زندگی میں</text><text class="cell" x="632" y="365" text-anchor="end">کام کرتا ہے؟</text><rect class="bg" x="228" y="328" width="206" height="73"/><rect class="thin" x="228" y="328" width="206" height="73"/><text class="cell" x="426" y="348" text-anchor="end">کیا شخص دوسروں کے ساتھ</text><text class="cell" x="426" y="365" text-anchor="end">منظم انداز میں کام کرتا</text><text class="cell" x="426" y="382" text-anchor="end">ہے؟</text><rect class="bg" x="24" y="328" width="204" height="73"/><rect class="thin" x="24" y="328" width="204" height="73"/><text class="cell" x="220" y="348" text-anchor="end">کیا کام ڈیجیٹل اوزار کے</text><text class="cell" x="220" y="365" text-anchor="end">ذریعے ہوتا ہے؟</text><rect class="stroke" x="24" y="52" width="732" height="349"/><text class="small" x="756" y="431" text-anchor="end">ایک کام ایک سے زیادہ قسم کا ہو سکتا ہے۔</text><text class="wm" x="12" y="451" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
