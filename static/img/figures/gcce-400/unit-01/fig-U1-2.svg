<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 548" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the forms of civic engagement</title><desc id="d">Concept map with civic engagement at the centre and five linked forms, each with a Pakistani example: voting in an election, volunteering at a flood relief camp, community work such as clearing a drain, public debate at a school committee meeting, and peaceful protest for clean water under Article 16.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="548"/><text class="h" x="24" y="34">Forms of civic engagement, with a Pakistani example of each</text><line class="stroke" x1="309.0" y1="189.0" x2="257.7" y2="169.4" marker-end="url(#arrow)"/><line class="stroke" x1="471.0" y1="189.0" x2="522.3" y2="169.4" marker-end="url(#arrow)"/><line class="stroke" x1="320.6" y1="254.3" x2="251.9" y2="288.2" marker-end="url(#arrow)"/><line class="stroke" x1="459.4" y1="254.3" x2="528.1" y2="288.2" marker-end="url(#arrow)"/><line class="stroke" x1="390.0" y1="262.0" x2="390.0" y2="396.0" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="220" rx="120" ry="42"/><text class="h" x="390" y="226" text-anchor="middle">Civic engagement</text><rect class="panel" x="24" y="70" width="230" height="108" rx="8"/><text class="sh" x="36" y="96">Voting</text><text class="cell" x="36" y="118">Casting a vote in a local</text><text class="cell" x="36" y="135">government or general</text><text class="cell" x="36" y="152">election</text><rect class="panel" x="526" y="70" width="230" height="108" rx="8"/><text class="sh" x="538" y="96">Volunteering</text><text class="cell" x="538" y="118">Helping at a flood relief</text><text class="cell" x="538" y="135">camp in Sindh</text><rect class="panel" x="24" y="290" width="230" height="108" rx="8"/><text class="sh" x="36" y="316">Community work</text><text class="cell" x="36" y="338">Neighbours clearing a</text><text class="cell" x="36" y="355">blocked drain or repairing</text><text class="cell" x="36" y="372">a school wall</text><rect class="panel" x="526" y="290" width="230" height="108" rx="8"/><text class="sh" x="538" y="316">Public debate</text><text class="cell" x="538" y="338">Speaking at a school</text><text class="cell" x="538" y="355">management committee</text><text class="cell" x="538" y="372">meeting or writing to a</text><text class="cell" x="538" y="389">newspaper</text><rect class="panel" x="275" y="400" width="230" height="108" rx="8"/><text class="sh" x="287" y="426">Peaceful protest</text><text class="cell" x="287" y="448">A peaceful, unarmed</text><text class="cell" x="287" y="465">gathering to demand clean</text><text class="cell" x="287" y="482">water (Article 16)</text><text class="small" x="24" y="534">Voting is one form among five.</text><text class="wm" x="768" y="538" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
