<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شہری شرکت وقت کے ساتھ کس طرح وسیع ہوئی</title><desc id="d">شہری شرکت کی خطِ زمانی: قدیم ایتھنز سے جہاں صرف آزاد بالغ مرد حصہ لے سکتے تھے، رومن قانونی شہریت اور 1946 کی محدود رأی دہی سے گزر کر پاکستان کے 1951 سے صوبائی انتخابات عام رأی دہی پر، 1970 کے عام انتخابات عام بالغ رأی دہی پر، اور آج دفعہ 51 کے تحت 18 سال یا زائد عمر کے شہریوں کو رأی دینے کا حق۔ ایک پھیلتا ہوا پٹّا دکھاتا ہے کہ ہر مرحلے پر مزید لوگ شامل ہوئے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="700"/><text class="h" x="756" y="34" text-anchor="end">شہری شرکت وقت کے ساتھ کس طرح وسیع ہوئی</text><polygon class="panel-a" points="676,74.5 668,74.5 640,580 704,580"/><rect class="panel" x="24" y="56" width="606" height="84" rx="6"/><text class="sh" x="618" y="82" text-anchor="end">قبل مسیح پانچویں صدی، ایتھنز: شہریوں کی اسمبلی</text><text class="cell" x="618" y="104" text-anchor="end">صرف آزاد بالغ مرد حصہ لیتے تھے۔ عورتیں، غلام اور غیر ملکی</text><text class="cell" x="618" y="122" text-anchor="end">لوگ باہر رہ جاتے تھے۔</text><line class="thin" x1="630" y1="98" x2="662" y2="98"/><rect class="panel" x="24" y="150" width="606" height="84" rx="6"/><text class="sh" x="618" y="176" text-anchor="end">روم: شہریت بطور قانونی تحفظ</text><text class="cell" x="618" y="198" text-anchor="end">شہری قانون بنانے میں مدد کے بجائے زیادہ قانون</text><text class="cell" x="618" y="216" text-anchor="end">کے تحفظ میں رہتے تھے۔</text><line class="thin" x1="630" y1="192" x2="662" y2="192"/><rect class="panel" x="24" y="244" width="606" height="84" rx="6"/><text class="sh" x="618" y="270" text-anchor="end">1946، برطانوی ہندوستان: صوبائی انتخابات</text><text class="cell" x="618" y="292" text-anchor="end">محدود رأی دہی پر منعقد ہوئے، اس لیے بہت سے</text><text class="cell" x="618" y="310" text-anchor="end">بالغ رأی نہیں دے سکتے تھے۔</text><line class="thin" x1="630" y1="286" x2="662" y2="286"/><rect class="panel" x="24" y="338" width="606" height="84" rx="6"/><text class="sh" x="618" y="364" text-anchor="end">1951 سے 1954، پاکستان: صوبائی انتخابات</text><text class="cell" x="618" y="386" text-anchor="end">پہلی بار عام رأی دہی پر منعقد ہوئے۔ سندھ</text><text class="cell" x="618" y="404" text-anchor="end">نے 1953 میں رأی دی۔</text><line class="thin" x1="630" y1="380" x2="662" y2="380"/><rect class="panel" x="24" y="432" width="606" height="92" rx="6"/><text class="sh" x="618" y="458" text-anchor="end">1970، پاکستان: عام انتخابات</text><text class="cell" x="618" y="480" text-anchor="end">پہلے قومی انتخابات عام بالغ رأی دہی پر:</text><text class="cell" x="618" y="498" text-anchor="end">ایک شخص، ایک رأی۔</text><line class="thin" x1="630" y1="478" x2="662" y2="478"/><rect class="panel" x="24" y="534" width="606" height="92" rx="6"/><text class="sh" x="618" y="560" text-anchor="end">آج: آئین، دفعہ 51</text><text class="cell" x="618" y="582" text-anchor="end">ہر شہری جس کی عمر 18 سال یا اس سے زیادہ ہو اور</text><text class="cell" x="618" y="600" text-anchor="end">نام رأی دہندگان کی فہرست میں ہو رأی دے سکتا ہے۔</text><line class="thin" x1="630" y1="580" x2="662" y2="580"/><line class="stroke" x1="672" y1="98" x2="672" y2="580" marker-end="url(#arrow)"/><circle class="dot" cx="672" cy="98" r="6"/><circle class="dot" cx="672" cy="192" r="6"/><circle class="dot" cx="672" cy="286" r="6"/><circle class="dot" cx="672" cy="380" r="6"/><circle class="dot" cx="672" cy="478" r="6"/><circle class="dot" cx="672" cy="580" r="6"/><text class="small" x="756" y="660" text-anchor="end">پھیلتا ہوا پٹّا دکھاتا ہے کہ ہر مرحلے پر مزید لوگ شامل ہوئے۔</text><text class="wm" x="12" y="690" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
