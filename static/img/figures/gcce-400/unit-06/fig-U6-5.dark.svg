<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four kinds of digital divide</title><desc id="d">Diagram of four kinds of digital divide around a central label: the access divide (no device or signal), the usage divide (no skills or confidence), the socioeconomic divide (cost, income and education), and the geographic divide (urban against rural and remote areas).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><text class="h" x="24" y="34">Four kinds of digital divide</text><line class="stroke" x1="264" y1="120" x2="330" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="516" y1="120" x2="450" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="264" y1="380" x2="330" y2="280" marker-end="url(#arrow)"/><line class="stroke" x1="516" y1="380" x2="450" y2="280" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="250" rx="120" ry="40"/><text class="h" x="390" y="256" text-anchor="middle">Digital divide</text><rect class="panel" x="24" y="60" width="240" height="110" rx="8"/><text class="sh" x="36" y="88">Access divide</text><text class="cell" x="36" y="110">No device, no signal, or</text><text class="cell" x="36" y="128">no electricity to charge</text><text class="cell" x="36" y="146">a phone.</text><rect class="panel" x="516" y="60" width="240" height="110" rx="8"/><text class="sh" x="528" y="88">Usage divide</text><text class="cell" x="528" y="110">A phone but no skills or</text><text class="cell" x="528" y="128">confidence to use it well.</text><rect class="panel" x="24" y="330" width="240" height="110" rx="8"/><text class="sh" x="36" y="358">Socioeconomic divide</text><text class="cell" x="36" y="380">Cost, income, education,</text><text class="cell" x="36" y="398">gender and age limit use.</text><rect class="panel" x="516" y="330" width="240" height="110" rx="8"/><text class="sh" x="528" y="358">Geographic divide</text><text class="cell" x="528" y="380">Cities and towns are served</text><text class="cell" x="528" y="398">better than villages and</text><text class="cell" x="528" y="416">remote areas.</text><text class="small" x="24" y="466">One person can face more than one divide.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
