<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ڈیجیٹل شہری سرگرمی کا تصوراتی خاکہ</title><desc id="d">تصوراتی خاکہ جس کے مرکز میں ڈیجیٹل شہری سرگرمی ہے اور اس سے جڑے پانچ طریقے ہیں، ہر ایک کی پاکستانی مثال کے ساتھ: اسکول کی دیوار کے لیے آن لائن درخواست، پاکستان سٹیزنز پورٹل پر شکایت، صاف پانی کے لیے آن لائن مہم، واٹس ایپ پر کمیونٹی گروپ، اور سیلاب زدگان کی امداد کے لیے آن لائن رضاکارانہ خدمات۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550"/><text class="h" x="756" y="34" text-anchor="end">ڈیجیٹل شہری سرگرمی اور ہر ایک کی پاکستانی مثال</text><line class="stroke" x1="254" y1="120" x2="320" y2="246" marker-end="url(#arrow)"/><line class="stroke" x1="526" y1="120" x2="460" y2="246" marker-end="url(#arrow)"/><line class="stroke" x1="254" y1="288" x2="272" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="526" y1="288" x2="508" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="400" x2="390" y2="322" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="280" rx="125" ry="42"/><text class="h" x="390" y="286" text-anchor="middle">ڈیجیٹل شہری سرگرمی</text><rect class="panel" x="526" y="60" width="230" height="96" rx="8"/><text class="sh" x="744" y="86" text-anchor="end">آن لائن درخواست (E-petition)</text><text class="cell" x="744" y="108" text-anchor="end">اسکول کی دیوار کی مرمت کے لیے</text><text class="cell" x="744" y="128" text-anchor="end">آن لائن درخواست</text><rect class="panel" x="24" y="60" width="230" height="96" rx="8"/><text class="sh" x="242" y="86" text-anchor="end">سٹیزن پورٹل (Citizen portal)</text><text class="cell" x="242" y="108" text-anchor="end">پاکستان سٹیزنز پورٹل پر</text><text class="cell" x="242" y="128" text-anchor="end">شکایت کا اندراج</text><rect class="panel" x="526" y="240" width="230" height="96" rx="8"/><text class="sh" x="744" y="266" text-anchor="end">آن لائن مہم (Online campaign)</text><text class="cell" x="744" y="288" text-anchor="end">شہر میں صاف پانی کی فراہمی</text><text class="cell" x="744" y="308" text-anchor="end">کے لیے مہم</text><rect class="panel" x="24" y="240" width="230" height="96" rx="8"/><text class="sh" x="242" y="266" text-anchor="end">کمیونٹی گروپ (Community group)</text><text class="cell" x="242" y="288" text-anchor="end">اسکول کے والدین کا باہمی</text><text class="cell" x="242" y="308" text-anchor="end">واٹس ایپ گروپ</text><rect class="panel" x="275" y="400" width="230" height="96" rx="8"/><text class="sh" x="493" y="426" text-anchor="end">آن لائن رضاکارانہ خدمات</text><text class="cell" x="493" y="448" text-anchor="end">سیلاب زدگان کی امداد کے لیے</text><text class="cell" x="493" y="468" text-anchor="end">آن لائن فنڈز جمع کرنا</text><text class="small" x="756" y="534" text-anchor="end">ایک ہی عمل میں ایک سے زیادہ طریقے استعمال ہو سکتے ہیں۔</text><text class="wm" x="12" y="540" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>