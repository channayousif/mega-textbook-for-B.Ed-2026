<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شیئر کرنے سے پہلے پانچ جانچیں</title><desc id="d">عوامی مسئلے سے متعلق پوسٹ شیئر کرنے سے پہلے پانچ جانچوں کا فلو چارٹ: ذریعہ دیکھیں، تاریخ دیکھیں، ثبوت دیکھیں، نقصان پر غور کریں، پھر فیصلہ کریں کہ مختصر وضاحت کے ساتھ شیئر کریں یا رک کر تصحیح کریں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><text class="h" x="756" y="34" text-anchor="end">شیئر کرنے سے پہلے پانچ جانچیں</text><line class="stroke" x1="390" y1="108" x2="390" y2="132" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="186" x2="390" y2="212" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="266" x2="390" y2="292" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="346" x2="390" y2="372" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="426" x2="240" y2="475" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="426" x2="540" y2="475" marker-end="url(#arrow)"/><rect class="panel" x="200" y="60" width="380" height="48" rx="8"/><text class="body" x="390" y="90" text-anchor="middle">عوامی مسئلے سے متعلق پوسٹ سامنے آنا</text><rect class="panel" x="190" y="132" width="400" height="54" rx="8"/><text class="cell" x="575" y="154" text-anchor="end">ذریعہ دیکھیں: پوسٹ کس نے کی ہے،</text><text class="cell" x="575" y="174" text-anchor="end">اور کیا وہ قابلِ اعتماد ہے؟</text><rect class="panel" x="190" y="212" width="400" height="54" rx="8"/><text class="cell" x="575" y="234" text-anchor="end">تاریخ دیکھیں: کیا یہ حالیہ معاملہ ہے،</text><text class="cell" x="575" y="254" text-anchor="end">یا کوئی پرانی خبر ہے؟</text><rect class="panel" x="190" y="292" width="400" height="54" rx="8"/><text class="cell" x="575" y="314" text-anchor="end">ثبوت دیکھیں: کیا حقائق کی جانچ یا</text><text class="cell" x="575" y="334" text-anchor="end">سرکاری صفحہ اس کی تصدیق کرتا ہے؟</text><rect class="panel" x="190" y="372" width="400" height="54" rx="8"/><text class="cell" x="575" y="394" text-anchor="end">نقصان پر غور کریں: کیا اس سے کسی شخص</text><text class="cell" x="575" y="414" text-anchor="end">یا برادری کو نقصان پہنچ سکتا ہے؟</text><rect class="panel-a" x="410" y="475" width="260" height="48" rx="8"/><text class="body" x="540" y="505" text-anchor="middle">مختصر وضاحت کے ساتھ شیئر کریں</text><rect class="panel-b" x="110" y="475" width="260" height="48" rx="8"/><text class="body" x="240" y="505" text-anchor="middle">رکیں، اور اس کی تصحیح کریں</text><text class="wm" x="768" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>