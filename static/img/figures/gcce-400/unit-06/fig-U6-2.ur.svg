<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ڈیجیٹل پلیٹ فارمز کے مواقع اور خطرات</title><desc id="d">شہری شرکت کے لیے ڈیجیٹل پلیٹ فارمز کے چار مواقع اور چار خطرات کا جدول۔ مواقع: تیز اور وسیع رسائی، کم لاگت، تصویر اور ویڈیو کا ثبوت، اور جواب دینے والوں کا ریکارڈ۔ خطرات: غلط معلومات کا تیزی سے پھیلنا، ہم خیال حلقوں میں سخت نظریات، انٹرنیٹ سے محروم افراد کا اخراج، اور ذاتی ڈیٹا کا افشا ہونا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="756" y="34" text-anchor="end">ڈیجیٹل پلیٹ فارمز کے مواقع اور خطرات</text><line class="thin" x1="24" y1="80" x2="756" y2="80"/><line class="thin" x1="24" y1="100" x2="756" y2="100"/><line class="thin" x1="396" y1="80" x2="396" y2="364"/><line class="thin" x1="24" y1="166" x2="756" y2="166"/><line class="thin" x1="24" y1="232" x2="756" y2="232"/><line class="thin" x1="24" y1="298" x2="756" y2="298"/><text class="h" x="740" y="70" text-anchor="end">مواقع</text><text class="h" x="380" y="70" text-anchor="end">خطرات</text><text class="body" x="740" y="128" text-anchor="end">تیز اور وسیع رسائی: ایک پوسٹ چند</text><text class="body" x="740" y="148" text-anchor="end">منٹوں میں پورے شہر تک پہنچ سکتی ہے۔</text><text class="body" x="740" y="194" text-anchor="end">کم لاگت: آن لائن شکایت یا مہم پر</text><text class="body" x="740" y="214" text-anchor="end">بہت کم خرچ آتا ہے۔</text><text class="body" x="740" y="260" text-anchor="end">تصویر اور ویڈیو کا ثبوت: بند گٹر کی</text><text class="body" x="740" y="280" text-anchor="end">تصویر جھٹلانا مشکل ہوتا ہے۔</text><text class="body" x="740" y="326" text-anchor="end">جواب دینے والوں کا ریکارڈ: پورٹل پر</text><text class="body" x="740" y="346" text-anchor="end">محکمے کا جواب ریکارڈ پر رہتا ہے۔</text><text class="body" x="380" y="128" text-anchor="end">غلط معلومات کی تیز ترسیل: تصدیق</text><text class="body" x="380" y="148" text-anchor="end">سے پہلے ہی افواہ پھیل جاتی ہے۔</text><text class="body" x="380" y="194" text-anchor="end">ہم خیال حلقے: لوگ صرف انہی باتوں کو</text><text class="body" x="380" y="214" text-anchor="end">سنتے ہیں جن سے وہ متفق ہوں۔</text><text class="body" x="380" y="260" text-anchor="end">انٹرنیٹ سے محروم افراد کا اخراج: آف لائن</text><text class="body" x="380" y="280" text-anchor="end">افراد مہم سے بے خبر رہ جاتے ہیں۔</text><text class="body" x="380" y="326" text-anchor="end">ذاتی ڈیٹا کا افشا: نام، تصویر یا پتہ</text><text class="body" x="380" y="346" text-anchor="end">عوامی سطح پر ظاہر ہو سکتا ہے۔</text><text class="small" x="756" y="384" text-anchor="end">ہر موقع اپنے ساتھ ایک خطرہ بھی لاتا ہے۔</text><text class="wm" x="12" y="390" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>