<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ڈیجیٹل تقسیم کی چار اقسام</title><desc id="d">مرکزی عنوان کے گرد ڈیجیٹل تقسیم کی چار اقسام کا خاکہ: رسائی کی تقسیم (کوئی آلہ یا سگنل نہ ہونا)، استعمال کی تقسیم (مہارت یا اعتماد کی کمی)، سماجی و معاشی تقسیم (لاگت، آمدنی اور تعلیم)، اور جغرافیائی تقسیم (شہری بمقابلہ دیہی اور دور دراز علاقے)۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><text class="h" x="756" y="34" text-anchor="end">ڈیجیٹل تقسیم کی چار اقسام</text><line class="stroke" x1="264" y1="120" x2="330" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="516" y1="120" x2="450" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="264" y1="380" x2="330" y2="280" marker-end="url(#arrow)"/><line class="stroke" x1="516" y1="380" x2="450" y2="280" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="250" rx="120" ry="40"/><text class="h" x="390" y="256" text-anchor="middle">ڈیجیٹل تقسیم</text><rect class="panel" x="516" y="60" width="240" height="110" rx="8"/><text class="sh" x="744" y="88" text-anchor="end">رسائی کی تقسیم (Access divide)</text><text class="cell" x="744" y="110" text-anchor="end">کوئی آلہ، سگنل یا موبائل چارج</text><text class="cell" x="744" y="130" text-anchor="end">کرنے کے لیے بجلی نہ ہونا۔</text><rect class="panel" x="24" y="60" width="240" height="110" rx="8"/><text class="sh" x="252" y="88" text-anchor="end">استعمال کی تقسیم (Usage divide)</text><text class="cell" x="252" y="110" text-anchor="end">فون موجود ہو مگر درست مہارت</text><text class="cell" x="252" y="130" text-anchor="end">اور اعتماد کا فقدان ہو۔</text><rect class="panel" x="516" y="330" width="240" height="110" rx="8"/><text class="sh" x="744" y="358" text-anchor="end">سماجی و معاشی تقسیم</text><text class="cell" x="744" y="380" text-anchor="end">لاگت، آمدنی، تعلیم، صنف اور</text><text class="cell" x="744" y="400" text-anchor="end">عمر استعمال کو محدود کرتے ہیں۔</text><rect class="panel" x="24" y="330" width="240" height="110" rx="8"/><text class="sh" x="252" y="358" text-anchor="end">جغرافیائی تقسیم</text><text class="cell" x="252" y="380" text-anchor="end">شہروں اور قصبات میں دیہات اور</text><text class="cell" x="252" y="400" text-anchor="end">دور دراز علاقوں سے بہتر سہولیات ہیں۔</text><text class="small" x="756" y="466" text-anchor="end">ایک ہی شخص کو ایک سے زیادہ اقسام کی تقسیم کا سامنا ہو سکتا ہے۔</text><text class="wm" x="12" y="470" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>