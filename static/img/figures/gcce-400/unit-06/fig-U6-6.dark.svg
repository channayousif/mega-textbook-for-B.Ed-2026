<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Barriers to ICT use in Pakistan</title><desc id="d">Table of six barriers to ICT use in Pakistan reported by Shair and colleagues: ICT infrastructure, access to technology, socioeconomic status, demographics, region, and supply-side conditions, each with a short note.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="24" y="34">Barriers to ICT use in Pakistan</text><line class="thin" x1="24" y1="80" x2="756" y2="80"/><line class="thin" x1="24" y1="100" x2="756" y2="100"/><line class="thin" x1="244" y1="80" x2="244" y2="460"/><line class="thin" x1="24" y1="160" x2="756" y2="160"/><line class="thin" x1="24" y1="220" x2="756" y2="220"/><line class="thin" x1="24" y1="280" x2="756" y2="280"/><line class="thin" x1="24" y1="340" x2="756" y2="340"/><line class="thin" x1="24" y1="400" x2="756" y2="400"/><text class="h" x="40" y="70">Barrier to ICT use</text><text class="h" x="260" y="70">What the study found</text><text class="body" x="40" y="136">ICT infrastructure</text><text class="body" x="40" y="196">Access to technology</text><text class="body" x="40" y="256">Socioeconomic status</text><text class="body" x="40" y="316">Demographics</text><text class="body" x="40" y="376">Region</text><text class="body" x="40" y="436">Supply-side conditions</text><text class="body" x="260" y="128">Networks and equipment are the leading</text><text class="body" x="260" y="146">determinant of the divide.</text><text class="body" x="260" y="188">A device and a connection come before</text><text class="body" x="260" y="206">anything else.</text><text class="body" x="260" y="248">Income and education shape who gets online</text><text class="body" x="260" y="266">and what they do there.</text><text class="body" x="260" y="308">Age and gender change the chance of using ICT.</text><text class="body" x="260" y="368">Provinces and districts differ in networks</text><text class="body" x="260" y="386">and services.</text><text class="body" x="260" y="428">The availability and quality of services and</text><text class="body" x="260" y="446">support matter.</text><text class="small" x="24" y="484">Barriers reported by Shair and colleagues (2022).</text><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
