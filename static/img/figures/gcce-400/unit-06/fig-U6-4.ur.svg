<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ذمہ دارانہ انتخاب اور ہر ایک سے ظاہر ہونے والا اصول</title><desc id="d">چار آن لائن صورتحالوں پر مبنی جدول جس میں ذمہ دارانہ انتخاب، غیر ذمہ دارانہ رویہ اور اخلاقی اصول دکھایا گیا ہے: شیئر کرنے سے پہلے تصدیق (دیانت)، شاگرد کی تصویر سے پہلے اجازت (رازداری کا احترام)، افواہ کا حقیقت سے جواب (ذمہ داری)، اور اجنبی سے شناختی ڈیٹا چھپانا (خود کی حفاظت)۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="410"/><text class="h" x="756" y="34" text-anchor="end">ذمہ دارانہ انتخاب اور ہر ایک سے ظاہر ہونے والا اصول</text><line class="thin" x1="24" y1="80" x2="756" y2="80"/><line class="thin" x1="24" y1="100" x2="756" y2="100"/><line class="thin" x1="234" y1="80" x2="234" y2="372"/><line class="thin" x1="546" y1="80" x2="546" y2="372"/><line class="thin" x1="24" y1="168" x2="756" y2="168"/><line class="thin" x1="24" y1="236" x2="756" y2="236"/><line class="thin" x1="24" y1="304" x2="756" y2="304"/><text class="h" x="740" y="70" text-anchor="end">صورتحال</text><text class="h" x="530" y="70" text-anchor="end">ذمہ دارانہ انتخاب</text><text class="h" x="218" y="70" text-anchor="end">اخلاقی اصول</text><text class="body" x="740" y="128" text-anchor="end">کوئی پوسٹ جسے آپ</text><text class="body" x="740" y="148" text-anchor="end">شیئر کرنا چاہتے ہیں</text><text class="body" x="740" y="196" text-anchor="end">کلاس روم میں شاگرد</text><text class="body" x="740" y="216" text-anchor="end">کی تصویر</text><text class="body" x="740" y="270" text-anchor="end">گروپ میں کوئی افواہ</text><text class="body" x="740" y="332" text-anchor="end">اجنبی کا آپ سے شناختی</text><text class="body" x="740" y="352" text-anchor="end">کارڈ نمبر مانگنا</text><text class="body" x="530" y="138" text-anchor="end">پہلے ذریعہ اور ثبوت چیک کریں</text><text class="body" x="530" y="206" text-anchor="end">پوسٹ کرنے سے پہلے رضامندی لیں</text><text class="body" x="530" y="270" text-anchor="end">معتبر ذریعے سے سچی خبر دے کر جواب دیں</text><text class="body" x="530" y="342" text-anchor="end">نظر انداز کریں اور رپورٹ کریں</text><text class="body" x="218" y="138" text-anchor="end">دیانت اور سچائی</text><text class="body" x="218" y="206" text-anchor="end">نجی زندگی کا احترام</text><text class="body" x="218" y="270" text-anchor="end">ذمہ داری</text><text class="body" x="218" y="342" text-anchor="end">خود کی حفاظت</text><text class="small" x="756" y="394" text-anchor="end">ہر صورتحال میں ایک غیر ذمہ دارانہ انتخاب بھی ہوتا ہے؛ اصول بتاتا ہے کہ ایسا کیوں ہے۔</text><text class="wm" x="12" y="400" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>