<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of digital civic engagement</title><desc id="d">Concept map with digital civic engagement at the centre and five linked forms, each with a Pakistani example: an e-petition for a school wall, a complaint on the Pakistan Citizen's Portal, an online campaign for clean water, a community group on WhatsApp, and online volunteering for flood relief.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dot { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550"/><text class="h" x="24" y="34">Digital civic engagement, with a Pakistani example of each</text><line class="stroke" x1="254" y1="120" x2="320" y2="246" marker-end="url(#arrow)"/><line class="stroke" x1="526" y1="120" x2="460" y2="246" marker-end="url(#arrow)"/><line class="stroke" x1="254" y1="288" x2="272" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="526" y1="288" x2="508" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="400" x2="390" y2="322" marker-end="url(#arrow)"/><ellipse class="panel-a" cx="390" cy="280" rx="120" ry="42"/><text class="h" x="390" y="286" text-anchor="middle">Digital civic engagement</text><rect class="panel" x="24" y="60" width="230" height="96" rx="8"/><text class="sh" x="36" y="86">E-petition</text><text class="cell" x="36" y="108">A petition to repair</text><text class="cell" x="36" y="125">a school boundary wall</text><rect class="panel" x="526" y="60" width="230" height="96" rx="8"/><text class="sh" x="538" y="86">Citizen portal</text><text class="cell" x="538" y="108">A complaint on the</text><text class="cell" x="538" y="125">Pakistan Citizen's Portal</text><rect class="panel" x="24" y="240" width="230" height="96" rx="8"/><text class="sh" x="36" y="266">Online campaign</text><text class="cell" x="36" y="288">A campaign for clean</text><text class="cell" x="36" y="305">water in a town</text><rect class="panel" x="526" y="240" width="230" height="96" rx="8"/><text class="sh" x="538" y="266">Community group</text><text class="cell" x="538" y="288">A school parents'</text><text class="cell" x="538" y="305">WhatsApp group</text><rect class="panel" x="275" y="400" width="230" height="96" rx="8"/><text class="sh" x="287" y="426">Online volunteering</text><text class="cell" x="287" y="448">Raising funds for</text><text class="cell" x="287" y="465">flood relief</text><text class="small" x="24" y="534">One action can use more than one form.</text><text class="wm" x="768" y="540" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
