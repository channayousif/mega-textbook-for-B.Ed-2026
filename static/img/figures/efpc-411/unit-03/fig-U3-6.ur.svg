<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بااختیار اور غیر پابند جماعتی انتظام کے طریقوں کا موازنہ</title><desc id="d">ایک جدول جو بااختیار اور غیر پابند جماعتی انتظام کے طریقوں کا قواعد، معمولات، لب و لہجہ اور طلبہ کے ردعمل کے لحاظ سے موازنہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">پہلو</text><text class="h" x="560" y="83" text-anchor="end">بااختیار (باضابطہ)</text><text class="h" x="290" y="83" text-anchor="end">غیر پابند (بے ضابطہ)</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="744" y="128" text-anchor="end">1. قواعد اور</text><text class="sh" x="744" y="148" text-anchor="end">توقعات</text><text class="cell" x="560" y="128" text-anchor="end">واضح، متفقہ قواعد؛ طلبہ کے</text><text class="cell" x="560" y="148" text-anchor="end">سامنے وجوہات کی وضاحت</text><text class="cell" x="290" y="128" text-anchor="end">چند واضح قواعد؛ مبہم معیارات؛</text><text class="cell" x="290" y="148" text-anchor="end">توقعات روز بروز بدلتی ہیں</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="744" y="210" text-anchor="end">2. جماعتی</text><text class="sh" x="744" y="230" text-anchor="end">معمولات</text><text class="cell" x="560" y="210" text-anchor="end">داخلے، منتقلی، سوالات اور</text><text class="cell" x="560" y="230" text-anchor="end">مواد کے پیشگوئی کے قابل طریقے</text><text class="cell" x="290" y="210" text-anchor="end">غیر متوقع منتقلی؛ انتشار انگیز</text><text class="cell" x="290" y="230" text-anchor="end">مواد کی تقسیم؛ وقت کا زیاں</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="744" y="292" text-anchor="end">3. استاد کا</text><text class="sh" x="744" y="312" text-anchor="end">لب و لہجہ</text><text class="cell" x="560" y="292" text-anchor="end">پختہ، پرسکون، باوقار اور معاون؛</text><text class="cell" x="560" y="312" text-anchor="end">چیخنے یا طنز سے مکمل گریز</text><text class="cell" x="290" y="292" text-anchor="end">حد سے زیادہ نرم یا جھنجھلاہٹ؛</text><text class="cell" x="290" y="312" text-anchor="end">خاموشی کے لیے التجائیں کرنا</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="744" y="374" text-anchor="end">4. طلبہ کا</text><text class="sh" x="744" y="394" text-anchor="end">ردعمل</text><text class="cell" x="560" y="374" text-anchor="end">اعلیٰ خود انضباطی؛ فعال توجہ؛</text><text class="cell" x="560" y="394" text-anchor="end">طلبہ شرکت میں تحفظ محسوس کرتے ہیں</text><text class="cell" x="290" y="374" text-anchor="end">کام سے بار بار دھیان ہٹنا؛ اضطراب؛</text><text class="cell" x="290" y="394" text-anchor="end">تدریس میں مسلسل خلل واقع ہونا</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">بااختیار اور غیر پابند جماعتی انتظام کے طریقوں کا موازنہ</text><text id="label-caption" class="small" x="756" y="460" text-anchor="end">باضابطہ بااختیار انتظام خود انضباطی، تعلیمی تحفظ اور فعال تعلم کو فروغ دیتا ہے۔</text><text class="wm" x="12" y="485" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>