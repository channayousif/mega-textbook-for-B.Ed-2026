<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایلیمنٹری اسکول کے لیے مکمل شدہ اسکول پروفائل ٹیمپلیٹ</title><desc id="d">ایک جدول جو مستند سرکاری اسکول کے ماحول کے لیے مکمل شدہ اسکول پروفائل ٹیمپلیٹ پیش کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">پروفائل کا پہلو</text><text class="h" x="550" y="83" text-anchor="end">ٹیمپلیٹ کے توجہ کے شعبے</text><text class="h" x="320" y="83" text-anchor="end">پریکٹیکم کا نمونہ ریکارڈ</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="744" y="128" text-anchor="end">1. ادارہ جاتی</text><text class="sh" x="744" y="148" text-anchor="end">شناخت</text><text class="cell" x="550" y="128" text-anchor="end">نام، EMIS کوڈ، سطح،</text><text class="cell" x="550" y="148" text-anchor="end">جنس کی قسم، دائرہ اختیار</text><text class="cell" x="320" y="128" text-anchor="end">GGES قاسم آباد (EMIS: 418010204)؛</text><text class="cell" x="320" y="148" text-anchor="end">ایلیمنٹری (درجات 1-8)؛ طالبات</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="744" y="210" text-anchor="end">2. مادی</text><text class="sh" x="744" y="230" text-anchor="end">سہولیات</text><text class="cell" x="550" y="210" text-anchor="end">کمرہ جماعت، چاردیواری،</text><text class="cell" x="550" y="230" text-anchor="end">پانی، بجلی، بیت الخلاء</text><text class="cell" x="320" y="210" text-anchor="end">6 پکے کمرے؛ محفوظ چاردیواری؛</text><text class="cell" x="320" y="230" text-anchor="end">بجلی فعال؛ 2 بیت الخلاء</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="744" y="292" text-anchor="end">3. تعلیمی</text><text class="sh" x="744" y="312" text-anchor="end">وسائل</text><text class="cell" x="550" y="292" text-anchor="end">درسی کتب، سائنس کٹ،</text><text class="cell" x="550" y="312" text-anchor="end">بلیک بورڈز، طلبہ و استاد تناسب</text><text class="cell" x="320" y="292" text-anchor="end">فی کمرہ ایک بورڈ؛ 1 سائنس کٹ؛</text><text class="cell" x="320" y="312" text-anchor="end">280 داخل طلبہ؛ تناسب 1:46</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="744" y="374" text-anchor="end">4. معمولات اور</text><text class="sh" x="744" y="394" text-anchor="end">اسکول کی ثقافت</text><text class="cell" x="550" y="374" text-anchor="end">صبح کی اسمبلی، پیریڈ کا دورانیہ،</text><text class="cell" x="550" y="394" text-anchor="end">نظم و ضبط، SMC سرگرمی</text><text class="cell" x="320" y="374" text-anchor="end">08:00 اسمبلی؛ 35 منٹ کے پیریڈ؛</text><text class="cell" x="320" y="394" text-anchor="end">مانیٹر کا نظام؛ فعال ماہانہ SMC</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">ایلیمنٹری اسکول کے لیے مکمل شدہ اسکول پروفائل ٹیمپلیٹ</text><text id="label-caption" class="small" x="756" y="460" text-anchor="end">کم استنتاجی دستاویز کاری کلاس روم کے مشاہدات کو ادارہ جاتی حقیقت پر قائم کرتی ہے۔</text><text class="wm" x="12" y="485" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>