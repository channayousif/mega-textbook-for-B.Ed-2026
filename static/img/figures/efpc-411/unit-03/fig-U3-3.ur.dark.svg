<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعت پنجم سائنس کے لیے مکمل شدہ سبقی مشاہدہ پروفارما</title><desc id="d">ایک جدول جو جماعت پنجم کے سائنس کے سبق کے لیے مکمل شدہ سبقی مشاہدہ پروفارما دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="510"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">سبق کا پہلو</text><text class="h" x="550" y="83" text-anchor="end">توجہ کا شعبہ</text><text class="h" x="330" y="83" text-anchor="end">جماعت 5 کا مشاہداتی ریکارڈ</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="744" y="128" text-anchor="end">1. سیاق اور</text><text class="sh" x="744" y="148" text-anchor="end">مقاصد</text><text class="cell" x="550" y="128" text-anchor="end">موضوع، جماعت کی تعداد، اور</text><text class="cell" x="550" y="148" text-anchor="end">طے شدہ SLOs کی وضاحت</text><text class="cell" x="330" y="128" text-anchor="end">موضوع: پھولدار پودے؛ 46 طلبہ؛</text><text class="cell" x="330" y="148" text-anchor="end">SLO زبانی اور بورڈ پر لکھا گیا</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="744" y="210" text-anchor="end">2. طریقہ تدریس</text><text class="sh" x="744" y="230" text-anchor="end">اور ہدایات</text><text class="cell" x="550" y="210" text-anchor="end">آغاز، براہ راست تدریس،</text><text class="cell" x="550" y="230" text-anchor="end">رہنمائی اور جوڑیوں میں کام</text><text class="cell" x="330" y="210" text-anchor="end">10 منٹ لیکچر؛ 15 منٹ جوڑیوں میں جانچ؛</text><text class="cell" x="330" y="230" text-anchor="end">10 منٹ انفرادی نوٹ بک لیبلنگ</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="744" y="292" text-anchor="end">3. تدریسی</text><text class="sh" x="744" y="312" text-anchor="end">وسائل</text><text class="cell" x="550" y="292" text-anchor="end">بورڈ، حقیقی اشیاء،</text><text class="cell" x="550" y="312" text-anchor="end">چارٹس اور امدادی اشیاء</text><text class="cell" x="330" y="292" text-anchor="end">بلیک بورڈ ڈایاگرام؛ اصلی پتے؛</text><text class="cell" x="330" y="312" text-anchor="end">جوڑیوں میں درسی کتاب کے خاکے</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="744" y="374" text-anchor="end">4. سوالات</text><text class="sh" x="744" y="394" text-anchor="end">اور جانچ</text><text class="cell" x="550" y="374" text-anchor="end">یادداشت بمقابلہ تجزیاتی اشیاء؛</text><text class="cell" x="550" y="394" text-anchor="end">انتظار کا وقت، اختتامی جانچ</text><text class="cell" x="330" y="374" text-anchor="end">8 یادداشت، 4 تجزیاتی سوالات؛</text><text class="cell" x="330" y="394" text-anchor="end">3 سیکنڈ انتظار؛ ایگزٹ ٹکٹ چیک</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">جماعت پنجم سائنس کے لیے مکمل شدہ سبقی مشاہدہ پروفارما</text><text id="label-caption" class="small" x="756" y="465" text-anchor="end">منظم پروفارما تدریسی مراحل، وسائل اور سوالات کے نمونوں کو درج کرتا ہے۔</text><text class="wm" x="12" y="495" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>