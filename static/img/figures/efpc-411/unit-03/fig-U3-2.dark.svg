<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Completed school profile template for an elementary school</title><desc id="d">Table presenting a completed school profile template for an authentic government school setting.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Profile Dimension</text><text class="h" x="220" y="83">Template Focus Area</text><text class="h" x="450" y="83">Sample Placement Record</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="36" y="128">1. Institutional</text><text class="sh" x="36" y="148">Identity</text><text class="cell" x="220" y="128">Name, EMIS code, level,</text><text class="cell" x="220" y="148">gender type, jurisdiction</text><text class="cell" x="450" y="128">GGES Qasimabad (EMIS: 418010204);</text><text class="cell" x="450" y="148">Elementary (Grades 1-8); Girls</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="36" y="210">2. Physical</text><text class="sh" x="36" y="230">Facilities</text><text class="cell" x="220" y="210">Classrooms, boundary wall,</text><text class="cell" x="220" y="230">water, electricity, toilets</text><text class="cell" x="450" y="210">6 pucca classrooms; boundary wall;</text><text class="cell" x="450" y="230">electricity active; 2 toilets</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="36" y="292">3. Learning</text><text class="sh" x="36" y="312">Resources</text><text class="cell" x="220" y="292">Textbooks, science kits,</text><text class="cell" x="220" y="312">blackboards, pupil ratio</text><text class="cell" x="450" y="292">Single board per room; 1 science kit;</text><text class="cell" x="450" y="312">280 students enrolled; ratio 1:46</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="36" y="374">4. Routines and</text><text class="sh" x="36" y="394">School Culture</text><text class="cell" x="220" y="374">Assembly, period duration,</text><text class="cell" x="220" y="394">discipline, SMC activity</text><text class="cell" x="450" y="374">08:00 assembly; 35-min periods;</text><text class="cell" x="450" y="394">monitor system; active monthly SMC</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Completed school profile template for an elementary school</text><text id="label-caption" class="small" x="24" y="460">Low-inference documentation grounds classroom observations in institutional reality.</text><text class="wm" x="768" y="485" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
