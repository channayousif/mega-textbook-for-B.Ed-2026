<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعتی انتظام اور طلبہ مشغولیت کا مشاہداتی لاگ</title><desc id="d">ایک جدول جو جماعتی انتظام کی مشاہداتی شیٹ کو درج شدہ رویوں کے واقعات اور استاد کے ردعمل کے ساتھ دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">وقت</text><text class="h" x="650" y="83" text-anchor="end">جماعتی واقعہ</text><text class="h" x="420" y="83" text-anchor="end">استاد کا ردعمل</text><text class="h" x="180" y="83" text-anchor="end">طلبہ پر اثر</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="744" y="128" text-anchor="end">09:00 -</text><text class="sh" x="744" y="148" text-anchor="end">09:05</text><text class="cell" x="650" y="128" text-anchor="end">صبح کا داخلہ اور ڈیسکوں پر</text><text class="cell" x="650" y="148" text-anchor="end">نوٹ بکس کی تقسیم</text><text class="cell" x="420" y="128" text-anchor="end">دو طلبہ مانیٹر تقسیم کرتے ہیں</text><text class="cell" x="420" y="148" text-anchor="end">جبکہ استاد بورڈ پر لکھتے ہیں</text><text class="cell" x="180" y="128" text-anchor="end">پرسکون آغاز؛ 3 منٹ کے اندر</text><text class="cell" x="180" y="148" text-anchor="end">تمام طلبہ نشستوں پر</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="744" y="210" text-anchor="end">09:15 -</text><text class="sh" x="744" y="230" text-anchor="end">09:18</text><text class="cell" x="650" y="210" text-anchor="end">وضاحت کے دوران قطار 4 میں</text><text class="cell" x="650" y="230" text-anchor="end">تین طلبہ کی سرگوشیاں</text><text class="cell" x="420" y="210" text-anchor="end">استاد رکتے ہیں، قریب جاتے ہیں</text><text class="cell" x="420" y="230" text-anchor="end">اور نظروں کا رابطہ بناتے ہیں</text><text class="cell" x="180" y="210" text-anchor="end">سرگوشیاں بند ہو گئیں؛</text><text class="cell" x="180" y="230" text-anchor="end">سبق باقاعدہ جاری رہا</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="744" y="292" text-anchor="end">09:25 -</text><text class="sh" x="744" y="312" text-anchor="end">09:28</text><text class="cell" x="650" y="292" text-anchor="end">لیکچر سے جوڑیوں میں کام کی</text><text class="cell" x="650" y="312" text-anchor="end">طرف سرگرمی کی منتقلی</text><text class="cell" x="420" y="292" text-anchor="end">کتابیں کھولنے سے قبل دو واضح</text><text class="cell" x="420" y="312" text-anchor="end">مرحلہ وار ہدایات فراہم کیں</text><text class="cell" x="180" y="292" text-anchor="end">جوڑیاں 90 سیکنڈ سے کم</text><text class="cell" x="180" y="312" text-anchor="end">وقت میں کام میں مصروف</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="744" y="374" text-anchor="end">09:35 -</text><text class="sh" x="744" y="394" text-anchor="end">09:38</text><text class="cell" x="650" y="374" text-anchor="end">مشق کے دوران طالب علم کو</text><text class="cell" x="650" y="394" text-anchor="end">کسر کے سوال میں الجھن</text><text class="cell" x="420" y="374" text-anchor="end">ڈیسک کے پاس جھک کر بیٹھتے ہیں</text><text class="cell" x="420" y="394" text-anchor="end">اور رہنمائی کے سوالات کرتے ہیں</text><text class="cell" x="180" y="374" text-anchor="end">طالب علم نے پورے اعتماد</text><text class="cell" x="180" y="394" text-anchor="end">سے اپنی غلطی درست کی</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">جماعت انتظام اور طلبہ مشغولیت کا مشاہداتی لاگ</text><text id="label-caption" class="small" x="756" y="460" text-anchor="end">معمولات، منتقلیوں اور استاد کے مداخلتی اقدامات کا جائزہ باضابطہ انتظام کے نمونے ظاہر کرتا ہے۔</text><text class="wm" x="12" y="485" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>