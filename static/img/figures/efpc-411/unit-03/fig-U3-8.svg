<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">SMART professional development action plan template</title><desc id="d">Table presenting a professional development action plan template with targets, concrete actions, evidence indicators, and timelines.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Development Area</text><text class="h" x="210" y="83">Target (SMART)</text><text class="h" x="440" y="83">Action Strategy &amp; Metric</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="36" y="128">1. Higher-Order</text><text class="sh" x="36" y="148">Questioning</text><text class="cell" x="210" y="128">Increase analytical questions</text><text class="cell" x="210" y="148">to >= 4 per lesson in Science</text><text class="cell" x="440" y="128">Script 4 open questions in lesson plan;</text><text class="cell" x="440" y="148">Peer tally log; target: Week 2, Sem 5</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="36" y="210">2. Classroom</text><text class="sh" x="36" y="230">Transitions</text><text class="cell" x="210" y="210">Reduce group task transition</text><text class="cell" x="210" y="230">time to under two minutes</text><text class="cell" x="440" y="210">Rehearse group signals and monitors;</text><text class="cell" x="440" y="230">Stopwatch record; target: Week 3, Sem 5</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="36" y="292">3. Formative</text><text class="sh" x="36" y="312">Written Feedback</text><text class="cell" x="210" y="292">Provide descriptive comments</text><text class="cell" x="210" y="312">on 100% of corrected notebooks</text><text class="cell" x="440" y="292">Write specific error guidance + next step;</text><text class="cell" x="440" y="312">Supervisor notebook audit; target: Week 4</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="36" y="374">4. Inclusive</text><text class="sh" x="36" y="394">Support</text><text class="cell" x="210" y="374">Pair struggling learners with</text><text class="cell" x="210" y="394">peer buddies during math</text><text class="cell" x="440" y="374">Prepare bilingual glossary flashcards;</text><text class="cell" x="440" y="394">Task completion check; target: Week 5</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">SMART professional development action plan template</text><text id="label-caption" class="small" x="24" y="460">Translating diagnosed growth areas into concrete, verifiable developmental commitments.</text><text class="wm" x="768" y="485" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
