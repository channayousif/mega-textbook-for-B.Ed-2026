<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پیشہ ورانہ ترقی کے لیے SMART عملی منصوبہ ٹیمپلیٹ</title><desc id="d">ایک جدول جو اہداف، ٹھوس اقدامات، شواہد کے اشاریے اور مدت کے ساتھ پیشہ ورانہ ترقی کے عملی منصوبے کا ٹیمپلیٹ پیش کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">ترقی کا شعبہ</text><text class="h" x="560" y="83" text-anchor="end">ہدف (SMART)</text><text class="h" x="330" y="83" text-anchor="end">عملی حکمت عملی اور پیمانہ</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="744" y="128" text-anchor="end">1. اعلیٰ سطحی</text><text class="sh" x="744" y="148" text-anchor="end">سوالات</text><text class="cell" x="560" y="128" text-anchor="end">سائنس میں تجزیاتی سوالات</text><text class="cell" x="560" y="148" text-anchor="end">کی تعداد &gt;= 4 فی سبق کرنا</text><text class="cell" x="330" y="128" text-anchor="end">سبقی منصوبے میں 4 کھلے سوالات لکھنا؛</text><text class="cell" x="330" y="148" text-anchor="end">ہم پیشہ کی ٹالی شیٹ؛ سمسٹر 5 ہفتہ 2</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="744" y="210" text-anchor="end">2. جماعتی</text><text class="sh" x="744" y="230" text-anchor="end">منتقلی</text><text class="cell" x="560" y="210" text-anchor="end">گروہی کام کی منتقلی کا وقت</text><text class="cell" x="560" y="230" text-anchor="end">دو منٹ سے کم کرنا</text><text class="cell" x="330" y="210" text-anchor="end">گروہی اشاروں اور مانیٹرز کی مشق؛</text><text class="cell" x="330" y="230" text-anchor="end">اسٹاپ واچ لاگ؛ سمسٹر 5 ہفتہ 3</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="744" y="292" text-anchor="end">3. تشکیلی</text><text class="sh" x="744" y="312" text-anchor="end">تحریری تاثرات</text><text class="cell" x="560" y="292" text-anchor="end">درست کی گئی 100% نوٹ بکس</text><text class="cell" x="560" y="312" text-anchor="end">پر وضاحتی تاثرات دینا</text><text class="cell" x="330" y="292" text-anchor="end">مخصوص غلطی کی رہنمائی اور اگلا قدم؛</text><text class="cell" x="330" y="312" text-anchor="end">سپروائزر کا آڈٹ؛ ہفتہ 4</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="744" y="374" text-anchor="end">4. شمولیتی</text><text class="sh" x="744" y="394" text-anchor="end">تعاون</text><text class="cell" x="560" y="374" text-anchor="end">ریاضی میں کمزور سیکھنے والوں</text><text class="cell" x="560" y="394" text-anchor="end">کو ہم عمر ساتھیوں سے جوڑنا</text><text class="cell" x="330" y="374" text-anchor="end">دو لسانی اصطلاحات کے فلیش کارڈز؛</text><text class="cell" x="330" y="394" text-anchor="end">کام کی تکمیل کی جانچ؛ ہفتہ 5</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">پیشہ ورانہ ترقی کے لیے SMART عملی منصوبہ ٹیمپلیٹ</text><text id="label-caption" class="small" x="756" y="460" text-anchor="end">تشخیص شدہ ترقیاتی شعبوں کو ٹھوس اور قابل تصدیق پیشہ ورانہ وعدوں میں تبدیل کرنا۔</text><text class="wm" x="12" y="485" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>