<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ہفتہ وار تامل سے حتمی رپورٹ تک ترکیبی راستہ</title><desc id="d">ہفتہ وار تامل سے حتمی رپورٹ تک چار مرحلہ وار ترکیبی عمل کی وضاحت کرنے والا فلو چارٹ: جمع کرنا، نمونے تلاش کرنا، جانچنا، اور منصوبہ بنانا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-flow"><rect class="panel-a" x="424" y="65" width="320" height="135" rx="8"/><text class="h" x="728" y="93" text-anchor="end">1. شواہد جمع کرنا</text><text class="cell" x="728" y="117" text-anchor="end">- 15 دن کے فیلڈ لاگز جمع کرنا</text><text class="cell" x="728" y="137" text-anchor="end">- 3 سے 4 سبقی پروفارما کا جائزہ</text><text class="cell" x="728" y="157" text-anchor="end">- جماعتی انتظام کے ریکارڈ کی تدوین</text><text class="cell" x="728" y="177" text-anchor="end">- 3 ہفتہ وار تاملی اندراجات کی ترتیب</text><line class="stroke" x1="424" y1="132" x2="356" y2="132" marker-end="url(#arrow)"/><rect class="panel-b" x="36" y="65" width="320" height="135" rx="8"/><text class="h" x="340" y="93" text-anchor="end">2. بار بار سامنے آنے والے نمونے</text><text class="cell" x="340" y="117" text-anchor="end">- مشاہداتی واقعات کا باہمی موازنہ</text><text class="cell" x="340" y="137" text-anchor="end">- مسلسل تدریسی چیلنجز کی نشاندہی</text><text class="cell" x="340" y="157" text-anchor="end">- موثر تدریسی معمولات کا مشاہدہ</text><text class="cell" x="340" y="177" text-anchor="end">- نتائج کی موضوعاتی رجحانات میں درجہ بندی</text><line class="stroke" x1="196" y1="200" x2="196" y2="248" marker-end="url(#arrow)"/><rect class="panel-c" x="36" y="248" width="320" height="135" rx="8"/><text class="h" x="340" y="276" text-anchor="end">3. خوبیوں اور خامیوں کی جانچ</text><text class="cell" x="340" y="300" text-anchor="end">- ذاتی تدریسی قابلیتوں کا جائزہ</text><text class="cell" x="340" y="320" text-anchor="end">- مخصوص تدریسی کمزوریوں کی تشخیص</text><text class="cell" x="340" y="340" text-anchor="end">- شواہد اور مفروضات میں فرق کرنا</text><text class="cell" x="340" y="360" text-anchor="end">- مینٹور اور فیکلٹی فیڈبیک کو شامل کرنا</text><line class="stroke" x1="356" y1="315" x2="424" y2="315" marker-end="url(#arrow)"/><rect class="panel-d" x="424" y="248" width="320" height="135" rx="8"/><text class="h" x="728" y="276" text-anchor="end">4. ٹھوس اہداف کی منصوبہ بندی</text><text class="cell" x="728" y="300" text-anchor="end">- قابل پیمائش SMART اہداف کا تعین</text><text class="cell" x="728" y="320" text-anchor="end">- عملی تدریسی اقدامات کی وضاحت</text><text class="cell" x="728" y="340" text-anchor="end">- ترقی کے تصدیق پذیر پیمانے قائم کرنا</text><text class="cell" x="728" y="360" text-anchor="end">- سمسٹر 5 کے پریکٹیکم کی مدت طے کرنا</text><line class="stroke" x1="584" y1="248" x2="584" y2="200" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">ہفتہ وار تامل سے حتمی رپورٹ تک ترکیبی راستہ</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">چار مرحلہ وار تجزیاتی پیش رفت جو روزمرہ کے مشاہدات کو مستقبل کے تدریسی اہداف سے جوڑتی ہے۔</text><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>