<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Completed lesson observation proforma for Grade 5 science</title><desc id="d">Table displaying a completed lesson observation proforma for a Grade 5 science lesson.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="510"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Lesson Dimension</text><text class="h" x="220" y="83">Focus Area</text><text class="h" x="440" y="83">Grade 5 Observation Record</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="36" y="128">1. Context and</text><text class="sh" x="36" y="148">Objectives</text><text class="cell" x="220" y="128">Topic, class size, and</text><text class="cell" x="220" y="148">clarity of stated SLOs</text><text class="cell" x="440" y="128">Topic: Flowering plants; 46 students;</text><text class="cell" x="440" y="148">SLO stated orally and written on board</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="36" y="210">2. Methods and</text><text class="sh" x="36" y="230">Instruction</text><text class="cell" x="220" y="210">Opening, direct teaching,</text><text class="cell" x="220" y="230">guided and paired tasks</text><text class="cell" x="440" y="210">10-min lecture; 15-min paired check;</text><text class="cell" x="440" y="230">10-min individual notebook labeling</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="36" y="292">3. Teaching</text><text class="sh" x="36" y="312">Resources</text><text class="cell" x="220" y="292">Use of board, realia,</text><text class="cell" x="220" y="312">charts, and student aids</text><text class="cell" x="440" y="292">Blackboard term sketches; textbook diagrams</text><text class="cell" x="440" y="312">used by pairs; no real leaves</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="36" y="374">4. Questioning</text><text class="sh" x="36" y="394">and Checks</text><text class="cell" x="220" y="374">Recall vs analytical items;</text><text class="cell" x="220" y="394">wait time, closure check</text><text class="cell" x="440" y="374">8 recall items, 4 analytical questions;</text><text class="cell" x="440" y="394">3-sec wait time; exit ticket check</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Completed lesson observation proforma for Grade 5 science</text><text id="label-caption" class="small" x="24" y="465">Structured proformas capture instructional staging, resources, and questioning patterns.</text><text class="wm" x="768" y="495" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
