<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four-stage reflective teaching model</title><desc id="d">Flowchart illustrating the four-stage reflective cycle: describe, analyse, interpret, and plan.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-flow"><rect class="panel-a" x="36" y="65" width="320" height="135" rx="8"/><text class="h" x="52" y="93">1. Describe (What happened?)</text><text class="cell" x="52" y="117">- Factual summary of lesson event</text><text class="cell" x="52" y="137">- Specific instructional episode</text><text class="cell" x="52" y="157">- Observable student behaviors</text><text class="cell" x="52" y="177">- Free from personal value judgements</text><line class="stroke" x1="356" y1="132" x2="424" y2="132" marker-end="url(#arrow)"/><rect class="panel-b" x="424" y="65" width="320" height="135" rx="8"/><text class="h" x="440" y="93">2. Analyse (Why did it happen?)</text><text class="cell" x="440" y="117">- Underlying instructional causes</text><text class="cell" x="440" y="137">- Task clarity, pacing, and materials</text><text class="cell" x="440" y="157">- Student prior knowledge factors</text><text class="cell" x="440" y="177">- Teacher decisions and expectations</text><line class="stroke" x1="584" y1="200" x2="584" y2="248" marker-end="url(#arrow)"/><rect class="panel-c" x="424" y="248" width="320" height="135" rx="8"/><text class="h" x="440" y="276">3. Interpret (What does it mean?)</text><text class="cell" x="440" y="300">- Connecting event to learning theory</text><text class="cell" x="440" y="320">- Impact on student understanding</text><text class="cell" x="440" y="340">- Inclusivity and participation issues</text><text class="cell" x="440" y="360">- Pedagogical insights gained</text><line class="stroke" x1="424" y1="315" x2="356" y2="315" marker-end="url(#arrow)"/><rect class="panel-d" x="36" y="248" width="320" height="135" rx="8"/><text class="h" x="52" y="276">4. Plan (What next?)</text><text class="cell" x="52" y="300">- Actionable alternative strategies</text><text class="cell" x="52" y="320">- Changes to scaffolding and modeling</text><text class="cell" x="52" y="340">- Concrete targets for future teaching</text><text class="cell" x="52" y="360">- Measurable indicators of improvement</text><line class="stroke" x1="196" y1="248" x2="196" y2="200" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">The four-stage reflective cycle for lesson observation</text><text id="label-caption" class="small" x="24" y="445">Systematic inquiry transforms descriptive field notes into actionable pedagogical growth.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
