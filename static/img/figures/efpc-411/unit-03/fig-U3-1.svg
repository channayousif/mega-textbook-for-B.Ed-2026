<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Eight required components of the school observation portfolio</title><desc id="d">Diagram showing the eight required components of the school observation portfolio in chronological binding order.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-boxes"><rect class="panel-a" x="24" y="60" width="165" height="90" rx="6"/><text class="sh" x="34" y="86">1. Cover Page</text><text class="cell" x="34" y="108">Name, roll number,</text><text class="cell" x="34" y="126">institution, school</text><line class="stroke" x1="189" y1="105" x2="219" y2="105" marker-end="url(#arrow)"/><rect class="panel-a" x="219" y="60" width="165" height="90" rx="6"/><text class="sh" x="229" y="86">2. Contents</text><text class="cell" x="229" y="108">Detailed section list</text><text class="cell" x="229" y="126">with page numbers</text><line class="stroke" x1="384" y1="105" x2="414" y2="105" marker-end="url(#arrow)"/><rect class="panel-b" x="414" y="60" width="165" height="90" rx="6"/><text class="sh" x="424" y="86">3. School Profile</text><text class="cell" x="424" y="108">EMIS, facilities, and</text><text class="cell" x="424" y="126">institutional context</text><line class="stroke" x1="579" y1="105" x2="609" y2="105" marker-end="url(#arrow)"/><rect class="panel-b" x="609" y="60" width="147" height="90" rx="6"/><text class="sh" x="619" y="86">4. Observations</text><text class="cell" x="619" y="108">3 to 4 completed</text><text class="cell" x="619" y="126">lesson proformas</text><line class="stroke" x1="682" y1="150" x2="682" y2="240" marker-end="url(#arrow)"/><rect class="panel-c" x="609" y="240" width="147" height="90" rx="6"/><text class="sh" x="619" y="266">5. Management</text><text class="cell" x="619" y="288">Discipline tracking</text><text class="cell" x="619" y="306">and feedback logs</text><line class="stroke" x1="609" y1="285" x2="579" y2="285" marker-end="url(#arrow)"/><rect class="panel-c" x="414" y="240" width="165" height="90" rx="6"/><text class="sh" x="424" y="266">6. Reflections</text><text class="cell" x="424" y="288">Weekly reflective</text><text class="cell" x="424" y="306">entries (Weeks 1-3)</text><line class="stroke" x1="414" y1="285" x2="384" y2="285" marker-end="url(#arrow)"/><rect class="panel-d" x="219" y="240" width="165" height="90" rx="6"/><text class="sh" x="229" y="266">7. Final Report</text><text class="cell" x="229" y="288">Learning summary</text><text class="cell" x="229" y="306">and action plan</text><line class="stroke" x1="219" y1="285" x2="189" y2="285" marker-end="url(#arrow)"/><rect class="panel-d" x="24" y="240" width="165" height="90" rx="6"/><text class="sh" x="34" y="266">8. Verification</text><text class="cell" x="34" y="288">Headteacher signed</text><text class="cell" x="34" y="306">attendance sheet</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Eight required components of the school observation portfolio</text><text id="label-caption" class="small" x="24" y="475">The portfolio organizes field evidence sequentially to demonstrate practical teaching competencies.</text><text class="wm" x="768" y="505" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
