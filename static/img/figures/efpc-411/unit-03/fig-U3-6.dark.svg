<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of authoritative and permissive classroom management styles</title><desc id="d">Table comparing authoritative and permissive classroom management styles across rules, routines, tone, and pupil response.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Dimension</text><text class="h" x="210" y="83">Authoritative (Structured)</text><text class="h" x="480" y="83">Permissive (Unstructured)</text><rect class="panel-a" x="24" y="102" width="732" height="75" rx="6"/><text class="sh" x="36" y="128">1. Rules and</text><text class="sh" x="36" y="148">Expectations</text><text class="cell" x="210" y="128">Explicit, agreed rules;</text><text class="cell" x="210" y="148">reasoning explained to learners</text><text class="cell" x="480" y="128">Few explicit rules; vague standards;</text><text class="cell" x="480" y="148">expectations shift from day to day</text><rect class="panel-b" x="24" y="184" width="732" height="75" rx="6"/><text class="sh" x="36" y="210">2. Classroom</text><text class="sh" x="36" y="230">Routines</text><text class="cell" x="210" y="210">Predictable procedures for entry,</text><text class="cell" x="210" y="230">transitions, questions, materials</text><text class="cell" x="480" y="210">Unpredictable transitions; chaotic</text><text class="cell" x="480" y="230">material distribution; lost time</text><rect class="panel-c" x="24" y="266" width="732" height="75" rx="6"/><text class="sh" x="36" y="292">3. Teacher Tone</text><text class="sh" x="36" y="312">and Demeanor</text><text class="cell" x="210" y="292">Firm, calm, respectful, supportive;</text><text class="cell" x="210" y="312">avoids shouting or sarcasm</text><text class="cell" x="480" y="292">Overly indulgent or frustrated;</text><text class="cell" x="480" y="312">pleads for silence or yields control</text><rect class="panel-d" x="24" y="348" width="732" height="75" rx="6"/><text class="sh" x="36" y="374">4. Pupil Response</text><text class="sh" x="36" y="394">and Outcomes</text><text class="cell" x="210" y="374">High self-discipline; active focus;</text><text class="cell" x="210" y="394">students feel secure to participate</text><text class="cell" x="480" y="374">Frequent off-task behavior; anxiety;</text><text class="cell" x="480" y="394">instruction frequently interrupted</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Comparison of authoritative and permissive classroom management styles</text><text id="label-caption" class="small" x="24" y="460">Structured authoritative management fosters self-regulation, academic safety, and active learning.</text><text class="wm" x="768" y="485" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
