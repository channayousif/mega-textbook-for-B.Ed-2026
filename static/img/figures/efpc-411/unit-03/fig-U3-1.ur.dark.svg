<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول مشاہداتی پورٹ فولیو کے آٹھ لازمی اجزاء</title><desc id="d">ایک خاکہ جو اسکول مشاہداتی پورٹ فولیو کے آٹھ لازمی اجزاء کو مجلد کرنے کی وقتی ترتیب میں دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-boxes"><rect class="panel-a" x="591" y="60" width="165" height="90" rx="6"/><text class="sh" x="746" y="86" text-anchor="end">1. سرورق</text><text class="cell" x="746" y="108" text-anchor="end">نام، رول نمبر،</text><text class="cell" x="746" y="126" text-anchor="end">ادارہ اور اسکول</text><line class="stroke" x1="591" y1="105" x2="561" y2="105" marker-end="url(#arrow)"/><rect class="panel-a" x="396" y="60" width="165" height="90" rx="6"/><text class="sh" x="551" y="86" text-anchor="end">2. فہرستِ عنوانات</text><text class="cell" x="551" y="108" text-anchor="end">صفحات کے نمبروں کے ساتھ</text><text class="cell" x="551" y="126" text-anchor="end">تفصیلی سیکشن لسٹ</text><line class="stroke" x1="396" y1="105" x2="366" y2="105" marker-end="url(#arrow)"/><rect class="panel-b" x="201" y="60" width="165" height="90" rx="6"/><text class="sh" x="356" y="86" text-anchor="end">3. اسکول پروفائل</text><text class="cell" x="356" y="108" text-anchor="end">EMIS، سہولیات اور</text><text class="cell" x="356" y="126" text-anchor="end">ادارہ جاتی سیاق</text><line class="stroke" x1="201" y1="105" x2="171" y2="105" marker-end="url(#arrow)"/><rect class="panel-b" x="24" y="60" width="147" height="90" rx="6"/><text class="sh" x="161" y="86" text-anchor="end">4. مشاہدات</text><text class="cell" x="161" y="108" text-anchor="end">3 سے 4 مکمل شدہ</text><text class="cell" x="161" y="126" text-anchor="end">سبقی پروفارما</text><line class="stroke" x1="98" y1="150" x2="98" y2="240" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="240" width="147" height="90" rx="6"/><text class="sh" x="161" y="266" text-anchor="end">5. جماعتی انتظام</text><text class="cell" x="161" y="288" text-anchor="end">نظم و ضبط کا اندراج</text><text class="cell" x="161" y="306" text-anchor="end">اور تاثرات کے لاگ</text><line class="stroke" x1="171" y1="285" x2="201" y2="285" marker-end="url(#arrow)"/><rect class="panel-c" x="201" y="240" width="165" height="90" rx="6"/><text class="sh" x="356" y="266" text-anchor="end">6. تاملی اندراجات</text><text class="cell" x="356" y="288" text-anchor="end">ہفتہ وار تاملی</text><text class="cell" x="356" y="306" text-anchor="end">تحریریں (ہفتہ 1 تا 3)</text><line class="stroke" x1="366" y1="285" x2="396" y2="285" marker-end="url(#arrow)"/><rect class="panel-d" x="396" y="240" width="165" height="90" rx="6"/><text class="sh" x="551" y="266" text-anchor="end">7. حتمی رپورٹ</text><text class="cell" x="551" y="288" text-anchor="end">تعلیمی خلاصہ</text><text class="cell" x="551" y="306" text-anchor="end">اور عملی منصوبہ</text><line class="stroke" x1="561" y1="285" x2="591" y2="285" marker-end="url(#arrow)"/><rect class="panel-d" x="591" y="240" width="165" height="90" rx="6"/><text class="sh" x="746" y="266" text-anchor="end">8. تصدیق</text><text class="cell" x="746" y="288" text-anchor="end">ہیڈ ٹیچر کی دستخط شدہ</text><text class="cell" x="746" y="306" text-anchor="end">حاضری شیٹ</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">اسکول مشاہداتی پورٹ فولیو کے آٹھ لازمی اجزاء</text><text id="label-caption" class="small" x="756" y="475" text-anchor="end">پورٹ فولیو عملی تدریسی صلاحیتوں کے مظاہرے کے لیے فیلڈ شواہد کو ترتیب وار منظم کرتا ہے۔</text><text class="wm" x="12" y="505" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>