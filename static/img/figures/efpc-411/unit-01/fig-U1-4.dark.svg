<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of four classroom observation tools</title><desc id="d">Comparative table of four observation instruments showing purpose, sample entry, strengths, and limitations.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Tool</text><text class="h" x="160" y="83">Primary Focus</text><text class="h" x="345" y="83">Sample Entry</text><text class="h" x="555" y="83">Strengths and Limits</text><rect class="panel-a" x="24" y="102" width="732" height="78" rx="6"/><text class="sh" x="36" y="126">Checklist</text><text class="cell" x="160" y="126">Verifying presence or</text><text class="cell" x="160" y="144">absence of specific items</text><text class="cell" x="345" y="126">[Yes] Learning objectives</text><text class="cell" x="345" y="144">written on board at start</text><text class="cell" x="555" y="126">+ Fast and objective to score</text><text class="cell" x="555" y="144">- Misses nuance and quality</text><rect class="panel-b" x="24" y="186" width="732" height="78" rx="6"/><text class="sh" x="36" y="210">Rating Scale</text><text class="cell" x="160" y="210">Measuring degree or</text><text class="cell" x="160" y="228">frequency along a scale</text><text class="cell" x="345" y="210">Teacher provides wait time:</text><text class="cell" x="345" y="228">3 - Usually (3-4 seconds)</text><text class="cell" x="555" y="210">+ Captures levels of quality</text><text class="cell" x="555" y="228">- Needs clear rubric anchors</text><rect class="panel-c" x="24" y="270" width="732" height="78" rx="6"/><text class="sh" x="36" y="294">Anecdotal</text><text class="sh" x="36" y="312">Record</text><text class="cell" x="160" y="294">Narrative description of</text><text class="cell" x="160" y="312">significant critical events</text><text class="cell" x="345" y="294">9:14 AM: Teacher redirected</text><text class="cell" x="345" y="312">off-task pair by name calmly</text><text class="cell" x="555" y="294">+ Rich contextual evidence</text><text class="cell" x="555" y="312">- Heavy writing burden</text><rect class="panel-d" x="24" y="354" width="732" height="78" rx="6"/><text class="sh" x="36" y="378">Reflective</text><text class="sh" x="36" y="396">Journal</text><text class="cell" x="160" y="378">Observer analysis and</text><text class="cell" x="160" y="396">personal learning targets</text><text class="cell" x="345" y="378">I noticed peer work helped</text><text class="cell" x="345" y="396">shy girls speak with confidence</text><text class="cell" x="555" y="378">+ Deep personal self-growth</text><text class="cell" x="555" y="396">- Subjective without raw data</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Comparison of four standard classroom observation tools</text><text id="label-caption" class="small" x="24" y="455">Select instruments based on whether the goal requires quick verification or rich narrative.</text><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>