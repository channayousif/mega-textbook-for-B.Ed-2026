<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of four classroom observation models</title><desc id="d">Table comparing formal, informal, peer, and supervisor-led classroom observation across purpose, observer, and outcomes.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="510"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Model</text><text class="h" x="180" y="83">Primary Purpose</text><text class="h" x="390" y="83">Who Observes</text><text class="h" x="590" y="83">Typical Outcome</text><rect class="panel-a" x="24" y="102" width="732" height="80" rx="6"/><text class="sh" x="36" y="128">Formal</text><text class="sh" x="36" y="148">Observation</text><text class="cell" x="180" y="128">Verify teaching competencies</text><text class="cell" x="180" y="148">against official standards</text><text class="cell" x="390" y="128">Headteachers and</text><text class="cell" x="390" y="148">district inspectors</text><text class="cell" x="590" y="128">Official evaluation report</text><text class="cell" x="590" y="148">and appraisal record</text><rect class="panel-b" x="24" y="188" width="732" height="80" rx="6"/><text class="sh" x="36" y="214">Informal</text><text class="sh" x="36" y="234">Walkthrough</text><text class="cell" x="180" y="214">Gauge classroom climate</text><text class="cell" x="180" y="234">and general pupil engagement</text><text class="cell" x="390" y="214">School mentors and</text><text class="cell" x="390" y="234">practicum coordinators</text><text class="cell" x="590" y="214">Brief verbal coaching</text><text class="cell" x="590" y="234">and climate adjustments</text><rect class="panel-c" x="24" y="274" width="732" height="80" rx="6"/><text class="sh" x="36" y="300">Peer</text><text class="sh" x="36" y="320">Observation</text><text class="cell" x="180" y="300">Collaborative learning on</text><text class="cell" x="180" y="320">shared pedagogical questions</text><text class="cell" x="390" y="300">Fellow student-teachers</text><text class="cell" x="390" y="320">and teacher colleagues</text><text class="cell" x="590" y="300">Non-threatening debrief</text><text class="cell" x="590" y="320">and mutual reflection</text><rect class="panel-d" x="24" y="360" width="732" height="80" rx="6"/><text class="sh" x="36" y="386">Supervisor-Led</text><text class="sh" x="36" y="406">Practicum</text><text class="cell" x="180" y="386">Monitor practicum growth</text><text class="cell" x="180" y="406">and verify course standards</text><text class="cell" x="390" y="386">University practicum</text><text class="cell" x="390" y="406">faculty supervisors</text><text class="cell" x="590" y="386">Structured rubric scoring</text><text class="cell" x="590" y="406">and growth targets</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Comparison of four classroom observation models</text><text id="label-caption" class="small" x="24" y="468">Different models serve distinct administrative, developmental, and evaluative purposes.</text><text class="wm" x="768" y="500" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>