<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five core ethical principles of classroom observation</title><desc id="d">Concept map illustrating the five core ethical principles governing classroom observation in schools.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-edges"><line class="stroke" x1="330" y1="230" x2="244" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="230" x2="536" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="330" y1="290" x2="244" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="290" x2="536" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="300" x2="390" y2="400" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="center-node"><ellipse class="panel-a" cx="390" cy="260" rx="130" ry="40"/><text class="h" x="390" y="258" text-anchor="middle">Ethics of Observation</text><text class="small" x="390" y="278" text-anchor="middle">Foundational professional standards</text></g><g id="node-1"><rect class="panel" x="20" y="70" width="235" height="85" rx="8"/><text class="sh" x="32" y="96">1. Official Permission</text><text class="cell" x="32" y="118">Obtain written approval</text><text class="cell" x="32" y="136">from school head and teacher</text></g><g id="node-2"><rect class="panel" x="525" y="70" width="235" height="85" rx="8"/><text class="sh" x="537" y="96">2. Pupil Anonymity</text><text class="cell" x="537" y="118">Use neutral codes, no full</text><text class="cell" x="537" y="136">names or student photos</text></g><g id="node-3"><rect class="panel" x="20" y="370" width="235" height="85" rx="8"/><text class="sh" x="32" y="396">3. Strict Confidentiality</text><text class="cell" x="32" y="418">Keep notes private; share</text><text class="cell" x="32" y="436">only with mentor and faculty</text></g><g id="node-4"><rect class="panel" x="525" y="370" width="235" height="85" rx="8"/><text class="sh" x="537" y="396">4. Objective Evidence</text><text class="cell" x="537" y="418">Record descriptive facts</text><text class="cell" x="537" y="436">rather than personal bias</text></g><g id="node-5"><rect class="panel" x="272" y="405" width="235" height="85" rx="8"/><text class="sh" x="284" y="431">5. Professional Respect</text><text class="cell" x="284" y="453">Arrive early, dress modestly,</text><text class="cell" x="284" y="471">and avoid any disruption</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Core ethical principles governing classroom observation</text><text id="label-caption" class="small" x="24" y="515">Observation protects the rights of pupils and professional dignity of classroom teachers.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>