<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مشاہداتی نتائج کو خود بہتری کے اہداف میں بدلنا</title><desc id="d">ایک جدول جو مشاہداتی نتائج کو تجزیاتی بصیرتوں اور ذاتی پیشہ ورانہ ترقی کے اہداف میں بدلنے کا خاکہ دکھاتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">مشاہدہ کیا گیا نتیجہ</text><text class="h" x="520" y="83" text-anchor="end">تجزیاتی بصیرت</text><text class="h" x="280" y="83" text-anchor="end">ذاتی عمل کا ہدف</text><rect class="panel-a" x="24" y="102" width="732" height="74" rx="6"/><text class="sh" x="744" y="126" text-anchor="end">ریاضی کے دستکاری آلے</text><text class="cell" x="744" y="144" text-anchor="end">لکڑی کی چھڑیوں کے ساتھ جوڑے کا کام</text><text class="cell" x="520" y="126" text-anchor="end">مادی امدادات بیک وقتی ختم کرتی ہیں</text><text class="cell" x="520" y="144" text-anchor="end">اور ریاضی کے مراحل کی وضاحت کرتی ہیں</text><text class="cell" x="280" y="126" text-anchor="end">10 چھڑیوں کا گٹھا تیار کریں</text><text class="cell" x="280" y="144" text-anchor="end">ہر میز کے جوڑے کے لیے، منگل کے کلاس میں</text><rect class="panel-b" x="24" y="182" width="732" height="74" rx="6"/><text class="sh" x="744" y="206" text-anchor="end">سوال کا انتظار وقت</text><text class="cell" x="744" y="224" text-anchor="end">استاد نے 4 سیکنڈ انتظار کیا</text><text class="cell" x="520" y="206" text-anchor="end">طویل وقفہ نے طلبہ کے جوابات</text><text class="cell" x="520" y="224" text-anchor="end">دوگنے کر دیے، خاموش بچوں سے</text><text class="cell" x="280" y="206" text-anchor="end">ہر سوال کے بعد چار تک خاموشی سے</text><text class="cell" x="280" y="224" text-anchor="end">گنیں، پھر طالب علم کو بلائیں</text><rect class="panel-c" x="24" y="262" width="732" height="74" rx="6"/><text class="sh" x="744" y="286" text-anchor="end">چاک بورڈ پر کام</text><text class="cell" x="744" y="304" text-anchor="end">مدھم تحریر سے بات چیت ہوئی</text><text class="cell" x="520" y="286" text-anchor="end">پچھلی قطاروں میں ناقابلِ پڑھنے تحریر</text><text class="cell" x="520" y="304" text-anchor="end">طلبہ کی بے ترتیبی کا باعث بنتی ہے</text><text class="cell" x="280" y="286" text-anchor="end">3 انچ کے بلاک حروف میں لکھیں اور</text><text class="cell" x="280" y="304" text-anchor="end">لکھتے ہوئے سوالات بلند آواز میں پڑھیں</text><rect class="panel-d" x="24" y="342" width="732" height="74" rx="6"/><text class="sh" x="744" y="366" text-anchor="end">منتقلی کی عادت</text><text class="cell" x="744" y="384" text-anchor="end">رویہ دار تالی سے کمرہ پرامن ہوا</text><text class="cell" x="520" y="366" text-anchor="end">سمعی اشارہ توجہ دوبارہ</text><text class="cell" x="520" y="384" text-anchor="end">متحرک کلاس پر غرق کرتا ہے، چیخنے کے بغیر</text><text class="cell" x="280" y="366" text-anchor="end">دو تالیوں کی عادت سکھائیں</text><text class="cell" x="280" y="384" text-anchor="end">پلیسمنٹ کے پہلے 5 منٹ میں</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">مشاہداتی نتائج سے ذاتی تدریسی اہداف تک</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">دوسروں کا مشاہدہ نمونے اور بصیرتیں فراہم کرتا ہے جو قابلِ ناپ ذاتی تدریسی اہداف کو شکل دیتی ہیں۔</text><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
