<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کلاس روم مشاہدے کے پانچ بنیادی توجہ کے پہلو</title><desc id="d">ایک تصوراتی نقشہ جو پانچ کلاس روم مشاہدے کے توجہ کے پہلوؤں کا خاکہ دکھاتا ہے، ہر پہلو کے ساتھ رہنمائی کن تجزیاتی سوالات شامل ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550"/><g id="layer-edges"><line class="stroke" x1="460" y1="235" x2="536" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="320" y1="235" x2="244" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="460" y1="295" x2="536" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="320" y1="295" x2="244" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="305" x2="390" y2="405" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="center-node"><ellipse class="panel-b" cx="390" cy="265" rx="140" ry="40"/><text class="h" x="390" y="262" text-anchor="middle">مشاہدے کے توجہ کے پہلو</text><text class="small" x="390" y="282" text-anchor="middle">کلاس روم مشق کے پانچ پہلو</text></g><g id="focus-1"><rect class="panel" x="530" y="65" width="230" height="100" rx="8"/><text class="sh" x="748" y="90" text-anchor="end">1. سبق کے مقاصد</text><text class="cell" x="748" y="112" text-anchor="end">کیا اہداف واضح طور پر بیان ہیں؟</text><text class="cell" x="748" y="132" text-anchor="end">کیا سبق منصوبے کے مطابق چلتا ہے؟</text><text class="cell" x="748" y="150" text-anchor="end">کیا پیشگی تصورات جڑے ہوئے ہیں؟</text></g><g id="focus-2"><rect class="panel" x="20" y="65" width="230" height="100" rx="8"/><text class="sh" x="238" y="90" text-anchor="end">2. تدریسی حکمتِ تدریس</text><text class="cell" x="238" y="112" text-anchor="end">کیا انداز فعال ہے؟</text><text class="cell" x="238" y="132" text-anchor="end">کیا سوالات کھلے ہیں؟</text><text class="cell" x="238" y="150" text-anchor="end">غلطیوں سے کیسے نمٹا جاتا ہے؟</text></g><g id="focus-3"><rect class="panel" x="530" y="370" width="230" height="100" rx="8"/><text class="sh" x="748" y="395" text-anchor="end">3. کلاس روم کا ماحول</text><text class="cell" x="748" y="417" text-anchor="end">منتقلی کتنی ہموار ہے؟</text><text class="cell" x="748" y="437" text-anchor="end">کیا واضح قواعد برقرار ہیں؟</text><text class="cell" x="748" y="455" text-anchor="end">جگہ کیسے منظم ہے؟</text></g><g id="focus-4"><rect class="panel" x="20" y="370" width="230" height="100" rx="8"/><text class="sh" x="238" y="395" text-anchor="end">4. شاگرد کی مشغولیت</text><text class="cell" x="238" y="417" text-anchor="end">کیا تمام طلبہ شامل ہیں؟</text><text class="cell" x="238" y="437" text-anchor="end">کام پر کتنا وقت صرف ہوتا ہے؟</text><text class="cell" x="238" y="455" text-anchor="end">کیا سوالات یکساں تقسیم ہیں؟</text></g><g id="focus-5"><rect class="panel" x="275" y="410" width="230" height="100" rx="8"/><text class="sh" x="493" y="435" text-anchor="end">5. تدریسی امدادات</text><text class="cell" x="493" y="457" text-anchor="end">کیا چاک بورڈ پڑھنے کے قابل ہے؟</text><text class="cell" x="493" y="477" text-anchor="end">کیا مادی امدادات استعمال ہوتی ہیں؟</text><text class="cell" x="493" y="495" text-anchor="end">کیا امدادات سیکھنے کی مدد کرتی ہیں؟</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">منظم کلاس روم مشاہدے کے پانچ بنیادی توجہ کے پہلو</text><text id="label-caption" class="small" x="756" y="530" text-anchor="end">رہنمائی کن سوالات مشاہدہ کاروں کو کلیدی پہلوؤں میں گہرا، کم استنتاجی شواہد اکٹھا کرنے میں مدد دیتے ہیں۔</text><text class="wm" x="12" y="540" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
