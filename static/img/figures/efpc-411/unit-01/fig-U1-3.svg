<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five core classroom observation focus areas</title><desc id="d">Concept map outlining five classroom observation focus areas with guiding analytical questions for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550"/><g id="layer-edges"><line class="stroke" x1="320" y1="235" x2="244" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="460" y1="235" x2="536" y2="160" marker-end="url(#arrow)"/><line class="stroke" x1="320" y1="295" x2="244" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="460" y1="295" x2="536" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="305" x2="390" y2="405" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="center-node"><ellipse class="panel-b" cx="390" cy="265" rx="140" ry="40"/><text class="h" x="390" y="262" text-anchor="middle">Observation Focus Areas</text><text class="small" x="390" y="282" text-anchor="middle">Five dimensions of classroom practice</text></g><g id="focus-1"><rect class="panel" x="20" y="65" width="230" height="100" rx="8"/><text class="sh" x="32" y="90">1. Lesson Objectives</text><text class="cell" x="32" y="112">- Are goals clearly stated?</text><text class="cell" x="32" y="132">- Does lesson follow plan?</text><text class="cell" x="32" y="150">- Are prior concepts linked?</text></g><g id="focus-2"><rect class="panel" x="530" y="65" width="230" height="100" rx="8"/><text class="sh" x="542" y="90">2. Teaching Strategies</text><text class="cell" x="542" y="112">- Is approach active?</text><text class="cell" x="542" y="132">- Are questions open-ended?</text><text class="cell" x="542" y="150">- How are errors addressed?</text></g><g id="focus-3"><rect class="panel" x="20" y="370" width="230" height="100" rx="8"/><text class="sh" x="32" y="395">3. Classroom Climate</text><text class="cell" x="32" y="417">- How smooth are transitions?</text><text class="cell" x="32" y="437">- Are clear rules maintained?</text><text class="cell" x="32" y="455">- How is space organised?</text></g><g id="focus-4"><rect class="panel" x="530" y="370" width="230" height="100" rx="8"/><text class="sh" x="542" y="395">4. Pupil Engagement</text><text class="cell" x="542" y="417">- Are all pupils involved?</text><text class="cell" x="542" y="437">- How long is time-on-task?</text><text class="cell" x="542" y="455">- Are questions evenly spread?</text></g><g id="focus-5"><rect class="panel" x="275" y="410" width="230" height="100" rx="8"/><text class="sh" x="287" y="435">5. Teaching Aids</text><text class="cell" x="287" y="457">- Is chalkboard legible?</text><text class="cell" x="287" y="477">- Are concrete aids utilised?</text><text class="cell" x="287" y="495">- Do aids support learning?</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Five core focus areas for structured classroom observation</text><text id="label-caption" class="small" x="24" y="530">Guiding questions help observers gather deep, low-inference evidence across key dimensions.</text><text class="wm" x="768" y="540" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>