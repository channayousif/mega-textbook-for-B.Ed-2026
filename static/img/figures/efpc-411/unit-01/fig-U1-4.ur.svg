<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار کلاس روم مشاہدہ آلات کا موازنہ</title><desc id="d">چار مشاہدہ آلات کا موازنہ کرتی جدول: چیک لسٹ، ریٹنگ اسکیل، واقعاتی ریکارڈ اور تاملی جریدہ، مقصد، نمونہ اندراج، طاقت اور حدود کے لحاظ سے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">آلہ</text><text class="h" x="620" y="83" text-anchor="end">بنیادی توجہ</text><text class="h" x="435" y="83" text-anchor="end">نمونہ اندراج</text><text class="h" x="225" y="83" text-anchor="end">طاقت اور حدود</text><rect class="panel-a" x="24" y="102" width="732" height="78" rx="6"/><text class="sh" x="744" y="126" text-anchor="end">چیک لسٹ</text><text class="cell" x="620" y="126" text-anchor="end">موجودگی یا عدم موجودگی کی</text><text class="cell" x="620" y="144" text-anchor="end">تصدیق، مخصوص شے کے لیے</text><text class="cell" x="435" y="126" text-anchor="end">[ہاں] سیکھنے کے مقاصد</text><text class="cell" x="435" y="144" text-anchor="end">شروع میں بورڈ پر لکھے جاتے ہیں</text><text class="cell" x="225" y="126" text-anchor="end">+ اسکور کرنے میں تیز اور معروضی</text><text class="cell" x="225" y="144" text-anchor="end">- جزئیات اور کیفیت پر نظر نہیں</text><rect class="panel-b" x="24" y="186" width="732" height="78" rx="6"/><text class="sh" x="744" y="210" text-anchor="end">ریٹنگ اسکیل</text><text class="cell" x="620" y="210" text-anchor="end">پیمانے پر درجہ یا</text><text class="cell" x="620" y="228" text-anchor="end">تعدد ناپنا</text><text class="cell" x="435" y="210" text-anchor="end">استاد انتظار کا وقت دیتا ہے:</text><text class="cell" x="435" y="228" text-anchor="end">3 - عادةً (3-4 سیکنڈ)</text><text class="cell" x="225" y="210" text-anchor="end">+ کیفیت کے درجے پکڑتا ہے</text><text class="cell" x="225" y="228" text-anchor="end">- واضح معیارِ جانچ لنگر درکار</text><rect class="panel-c" x="24" y="270" width="732" height="78" rx="6"/><text class="sh" x="744" y="294" text-anchor="end">واقعاتی</text><text class="sh" x="744" y="312" text-anchor="end">ریکارڈ</text><text class="cell" x="620" y="294" text-anchor="end">سرگزشتی بیان، اہم</text><text class="cell" x="620" y="312" text-anchor="end">اور نقطہ کار واقعات</text><text class="cell" x="435" y="294" text-anchor="end">9:14 بجے: استاد نے غیر کام والے</text><text class="cell" x="435" y="312" text-anchor="end">جوڑے کو نام لے کر پرامن کیا</text><text class="cell" x="225" y="294" text-anchor="end">+ سیاقی شواہد میں امیر</text><text class="cell" x="225" y="312" text-anchor="end">- تحریر کا بھاری بوجھ</text><rect class="panel-d" x="24" y="354" width="732" height="78" rx="6"/><text class="sh" x="744" y="378" text-anchor="end">تاملی</text><text class="sh" x="744" y="396" text-anchor="end">جریدہ</text><text class="cell" x="620" y="378" text-anchor="end">مشاہدہ کار کا تجزیہ اور</text><text class="cell" x="620" y="396" text-anchor="end">ذاتی سیکھنے کے اہداف</text><text class="cell" x="435" y="378" text-anchor="end">میں نے دیکھا کہ ہم پیشہ کام نے</text><text class="cell" x="435" y="396" text-anchor="end">شرمیلی لڑکیوں کو اعتماد سے</text><text class="cell" x="435" y="414" text-anchor="end">بولنے میں مدد دی</text><text class="cell" x="225" y="378" text-anchor="end">+ گہرا ذاتی خود ترقی</text><text class="cell" x="225" y="396" text-anchor="end">- خام ڈیٹا کے بغیر ذاتی</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">چار معیاری کلاس روم مشاہدہ آلات کا موازنہ</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">اس بات کی بنیاد پر آلہ منتخب کریں کہ مقصد کو جلد تصدیق درکار ہے یا امیر سرگزشت۔</text><text class="wm" x="12" y="480" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
