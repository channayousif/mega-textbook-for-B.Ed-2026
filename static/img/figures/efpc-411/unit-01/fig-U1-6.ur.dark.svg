<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جانبدار زیادہ استنتاجی نوٹس بمقابلہ معروضی کم استنتاجی ریکارڈ</title><desc id="d">ایک جدول جو چار کلاس روم کے مناظر میں جانبدار مشاہدہ نوٹس اور معروضی حقیقی شواہد کا موازنہ کرتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">کلاس کا لمحہ</text><text class="h" x="600" y="83" text-anchor="end">جانبدار زیادہ استنتاجی نوٹ</text><text class="h" x="320" y="83" text-anchor="end">معروضی کم استنتاجی ریکارڈ</text><rect class="panel" x="24" y="102" width="732" height="76" rx="6"/><text class="sh" x="744" y="128" text-anchor="end">سبق کا آغاز</text><text class="cell" x="600" y="128" text-anchor="end">"استاد دیر سے آئے اور</text><text class="cell" x="600" y="148" text-anchor="end">کلاس کے لیے واضح طور پر تیار نہیں تھے۔"</text><text class="cell" x="320" y="128" text-anchor="end">"کلاس 9:07 بجے شروع ہوا۔ استاد نے</text><text class="cell" x="320" y="148" text-anchor="end">3 منٹ عنوان اور صفحہ نمبر لکھنے میں صرف کیے۔"</text><rect class="panel-a" x="24" y="184" width="732" height="76" rx="6"/><text class="sh" x="744" y="210" text-anchor="end">بیان</text><text class="cell" x="600" y="210" text-anchor="end">"طلبہ بور تھے اور</text><text class="cell" x="600" y="230" text-anchor="end">موضوع میں بالکل دلچسپی نہیں رکھتے تھے۔"</text><text class="cell" x="320" y="210" text-anchor="end">"12 منٹ کی گفتگو میں 4 طلبہ سر ٹیکے،</text><text class="cell" x="320" y="230" text-anchor="end">سوال پوچھے جانے پر 2 نے ہاتھ اٹھایا۔"</text><rect class="panel" x="24" y="266" width="732" height="76" rx="6"/><text class="sh" x="744" y="292" text-anchor="end">سوالات</text><text class="cell" x="600" y="292" text-anchor="end">"استاد پسندیدہ چنتا رہا اور</text><text class="cell" x="600" y="312" text-anchor="end">کمزور بچوں کو نظر انداز کیا۔"</text><text class="cell" x="320" y="292" text-anchor="end">"استاد نے اگلی قطار کے 6 طلبہ</text><text class="cell" x="320" y="312" text-anchor="end">اور پچھلی بائیں بینچ کے 1 طالب علم کو بلایا۔"</text><rect class="panel-a" x="24" y="348" width="732" height="76" rx="6"/><text class="sh" x="744" y="374" text-anchor="end">گروہی سرگرمی</text><text class="cell" x="600" y="374" text-anchor="end">"مکمل بے ترتیبی پھیل گئی؛ استاد کا</text><text class="cell" x="600" y="394" text-anchor="end">طلبہ پر کوئی اثر نہیں۔"</text><text class="cell" x="320" y="374" text-anchor="end">"36 طلبہ میں سے 14 کھڑے ہو کر بولے</text><text class="cell" x="320" y="394" text-anchor="end">6 منٹ کاغذی شیٹس کے انتظار میں۔"</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">زیادہ استنتاجی لیبلز اور کم استنتاجی حقیقی شواہد کا موازنہ</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">کم استنتاجی ڈیٹا کیمرے کی طرح مشاہدے کے قابل واقعات بیان کرتا ہے، جس سے مثمر تامل ممکن ہوتا ہے۔</text><text class="wm" x="12" y="500" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
