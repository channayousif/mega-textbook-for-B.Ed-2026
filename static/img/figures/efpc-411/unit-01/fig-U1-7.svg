<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four-step protocol for constructive post-observation feedback</title><desc id="d">Flowchart mapping the four-step constructive post-observation feedback protocol.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-steps"><rect class="panel-a" x="24" y="65" width="340" height="135" rx="8"/><text class="h" x="40" y="93">Step 1: Invite Self-Reflection</text><text class="cell" x="40" y="117">- Ask open-ended opening question:</text><text class="cell" x="40" y="137">  "How did you feel about the lesson?"</text><text class="cell" x="40" y="157">- Allow the teacher to speak first</text><text class="cell" x="40" y="177">- Establish an empathetic, trusting tone</text><line class="stroke" x1="364" y1="132" x2="416" y2="132" marker-end="url(#arrow)"/><rect class="panel-b" x="416" y="65" width="340" height="135" rx="8"/><text class="h" x="432" y="93">Step 2: Ground in Evidence</text><text class="cell" x="432" y="117">- Present low-inference factual data</text><text class="cell" x="432" y="137">- Highlight genuine instructional strengths</text><text class="cell" x="432" y="157">- Cite verbatim student responses</text><text class="cell" x="432" y="177">- Celebrate effective pedagogical moves</text><line class="stroke" x1="586" y1="200" x2="586" y2="248" marker-end="url(#arrow)"/><rect class="panel-c" x="416" y="248" width="340" height="135" rx="8"/><text class="h" x="432" y="276">Step 3: Examine Priority Area</text><text class="cell" x="432" y="300">- Avoid overwhelming with multiple flaws</text><text class="cell" x="432" y="320">- Focus deeply on one key leverage area</text><text class="cell" x="432" y="340">- Frame area as a collaborative problem</text><text class="cell" x="432" y="360">- Explore underlying causes together</text><line class="stroke" x1="416" y1="315" x2="364" y2="315" marker-end="url(#arrow)"/><rect class="panel-d" x="24" y="248" width="340" height="135" rx="8"/><text class="h" x="40" y="276">Step 4: Agree Next Steps</text><text class="cell" x="40" y="300">- Jointly formulate practical strategy</text><text class="cell" x="40" y="320">- Set measurable target for next class</text><text class="cell" x="40" y="340">- Record target in reflective journal</text><text class="cell" x="40" y="360">- Schedule follow-up visit to review</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Four-step protocol for constructive post-observation feedback</text><text id="label-caption" class="small" x="24" y="445">A structured debriefing model that builds trust, validates strengths, and focuses on actionable growth.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>