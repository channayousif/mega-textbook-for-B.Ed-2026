<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعمیری بعد از مشاہدہ تاثرات دینے کا چار مرحلوں والا طریقہ کار</title><desc id="d">ایک فلو چارٹ جو تعمیری بعد از مشاہدہ تاثرات دینے کے چار مرحلوں والے طریقہ کار کا خاکہ دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-steps"><rect class="panel-a" x="416" y="65" width="340" height="135" rx="8"/><text class="h" x="740" y="93" text-anchor="end">مرحلہ 1: خود تامل کی دعوت</text><text class="cell" x="740" y="117" text-anchor="end">کھلا افتتاحی سوال پوچھیں:</text><text class="cell" x="740" y="137" text-anchor="end"> "آپ کو سبق کے بارے میں کیا لگا؟"</text><text class="cell" x="740" y="157" text-anchor="end">استاد کو پہلے بولنے کی اجازت دیں</text><text class="cell" x="740" y="177" text-anchor="end">ہمدردانہ، اعتماد کا لہجہ قائم کریں</text><line class="stroke" x1="416" y1="132" x2="364" y2="132" marker-end="url(#arrow)"/><rect class="panel-b" x="24" y="65" width="340" height="135" rx="8"/><text class="h" x="348" y="93" text-anchor="end">مرحلہ 2: شواہد پر مبنی</text><text class="cell" x="348" y="117" text-anchor="end">کم استنتاجی حقیقی ڈیٹا پیش کریں</text><text class="cell" x="348" y="137" text-anchor="end">حقیقی تدریسی طاقتوں کو نمایاں کریں</text><text class="cell" x="348" y="157" text-anchor="end">طلبہ کے اصل جوابات کا حوالہ دیں</text><text class="cell" x="348" y="177" text-anchor="end">مؤثر تدرسی اقدامات کی تعریف کریں</text><line class="stroke" x1="194" y1="200" x2="194" y2="248" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="248" width="340" height="135" rx="8"/><text class="h" x="348" y="276" text-anchor="end">مرحلہ 3: ترجیحی پہلو کا جائزہ</text><text class="cell" x="348" y="300" text-anchor="end">متعدد خامیوں سے بوجھ نہ لیں</text><text class="cell" x="348" y="320" text-anchor="end">ایک کلیدی مؤثر پہلو پر گہرائی سے توجہ دیں</text><text class="cell" x="348" y="340" text-anchor="end">پہلو کو اشتراکی مسئلہ بنائیں</text><text class="cell" x="348" y="360" text-anchor="end">بنیادی وجوہات کا ساتھ غور کریں</text><line class="stroke" x1="364" y1="315" x2="416" y2="315" marker-end="url(#arrow)"/><rect class="panel-d" x="416" y="248" width="340" height="135" rx="8"/><text class="h" x="740" y="276" text-anchor="end">مرحلہ 4: اگلے اقدامات پر اتفاق</text><text class="cell" x="740" y="300" text-anchor="end">مشترکہ طور پر عملی حکمتِ تدریس وضع کریں</text><text class="cell" x="740" y="320" text-anchor="end">اگلے کلاس کے لیے قابلِ ناپ ہدف مقرر کریں</text><text class="cell" x="740" y="340" text-anchor="end">ہدف کو تاملی جریدہ میں ریکارڈ کریں</text><text class="cell" x="740" y="360" text-anchor="end">جائزے کے لیے بعد کے دورے کا شیڈول بنائیں</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">تعمیری بعد از مشاہدہ تاثرات دینے کا چار مرحلوں والا طریقہ کار</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">ایک منظم دوبارہ بریفنگ کا نمونہ جو اعتماد بناتا ہے، طاقتوں کی تصدیق کرتا ہے، اور قابلِ عمل ترقی پر مرکوز رہتا ہے۔</text><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
