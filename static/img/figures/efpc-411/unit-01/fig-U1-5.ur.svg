<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کلاس روم مشاہداتی چکر کے چار مراحل</title><desc id="d">ایک فلو چارٹ جو کلاس روم مشاہداتی چکر کے چار تسلسل وار مراحل کا خاکہ دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-flow"><rect class="panel-a" x="424" y="65" width="320" height="135" rx="8"/><text class="h" x="728" y="93" text-anchor="end">1. قبل از مشاہدہ بریفنگ</text><text class="cell" x="728" y="117" text-anchor="end">تعاون کرنے والے استاد سے 15 منٹ پہلے ملاقات</text><text class="cell" x="728" y="137" text-anchor="end">مخصوص سیکھنے کے مقاصد کی وضاحت</text><text class="cell" x="728" y="157" text-anchor="end">ہدف کی مشاہدہ توجہ پر اتفاق</text><text class="cell" x="728" y="177" text-anchor="end">لاجسٹک اور بٹھائی کی جگہ کی تصدیق</text><line class="stroke" x1="424" y1="132" x2="356" y2="132" marker-end="url(#arrow)"/><rect class="panel-b" x="36" y="65" width="320" height="135" rx="8"/><text class="h" x="340" y="93" text-anchor="end">2. مشاہدہ اور ریکارڈ</text><text class="cell" x="340" y="117" text-anchor="end">تدریس میں مداخلت کیے بغیر خاموشی سے بیٹھیں</text><text class="cell" x="340" y="137" text-anchor="end">کم استنتاجی حقیقی شواہد ریکارڈ کریں</text><text class="cell" x="340" y="157" text-anchor="end">وقت کے نشان، گنتی اور اقتباس لگائیں</text><text class="cell" x="340" y="177" text-anchor="end">ذاتی ادراکی جانبداری سے بچیں</text><line class="stroke" x1="196" y1="200" x2="196" y2="248" marker-end="url(#arrow)"/><rect class="panel-c" x="36" y="248" width="320" height="135" rx="8"/><text class="h" x="340" y="276" text-anchor="end">3. بعد از مشاہدہ تامل</text><text class="cell" x="340" y="300" text-anchor="end">خام نوٹس کا فوری جائزہ اور صفائی</text><text class="cell" x="340" y="320" text-anchor="end">حقیقی ڈیٹا اور رائے کا امتیاز</text><text class="cell" x="340" y="340" text-anchor="end">تدریسی نمونوں اور کمیوں کی نشاندہی</text><text class="cell" x="340" y="360" text-anchor="end">حمایت کرنے والے دوبارہ بریفنگ کے سوالات تیار کریں</text><line class="stroke" x1="356" y1="315" x2="424" y2="315" marker-end="url(#arrow)"/><rect class="panel-d" x="424" y="248" width="320" height="135" rx="8"/><text class="h" x="728" y="276" text-anchor="end">4. اشتراکی تاثرات</text><text class="cell" x="728" y="300" text-anchor="end">پہلے استاد کے خود تامل کی دعوت</text><text class="cell" x="728" y="320" text-anchor="end">معروضی شواہد اور طاقتیں شیئر کریں</text><text class="cell" x="728" y="340" text-anchor="end">ایک ترجیحی ترقیاتی پہلو پر غور کریں</text><text class="cell" x="728" y="360" text-anchor="end">اگلے سبق کے قابلِ عمل اقدامات پر اتفاق</text><line class="stroke" x1="584" y1="248" x2="584" y2="200" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">چار مرحلوں والا کلینیکل کلاس روم مشاہداتی چکر</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">ایک مسلسل، ترقیاتی چکر جو بریفنگ، مشاہدہ، تامل اور ترقی کو جوڑتا ہے۔</text><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
