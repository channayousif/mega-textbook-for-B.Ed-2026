<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کلاس روم مشاہدے کے پانچ بنیادی اخلاقی اصول</title><desc id="d">ایک تصوراتی نقشہ جو اسکولوں میں کلاس روم مشاہدے کو پانچ بنیادی اخلاقی اصولوں سے جوڑتا ہے: ادارے کی اجازت، شاگرد کی رازداری، پیشہ ورانہ احترام، معروضی شواہد اور شاگرد کی گمنامی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-edges"><line class="stroke" x1="450" y1="230" x2="536" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="330" y1="230" x2="244" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="290" x2="536" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="330" y1="290" x2="244" y2="370" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="300" x2="390" y2="400" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="center-node"><ellipse class="panel-a" cx="390" cy="260" rx="130" ry="40"/><text class="h" x="390" y="258" text-anchor="middle">مشاہدے کے اخلاقیات</text><text class="small" x="390" y="278" text-anchor="middle">بنیادی پیشہ ورانہ معیارات</text></g><g id="node-1"><rect class="panel" x="525" y="70" width="235" height="85" rx="8"/><text class="sh" x="748" y="96" text-anchor="end">1. ادارے کی اجازت</text><text class="cell" x="748" y="118" text-anchor="end">تحریری منظوری حاصل کریں</text><text class="cell" x="748" y="136" text-anchor="end">اسکول کے سربراہ اور استاد سے</text></g><g id="node-2"><rect class="panel" x="20" y="70" width="235" height="85" rx="8"/><text class="sh" x="243" y="96" text-anchor="end">2. شاگرد کی گمنامی</text><text class="cell" x="243" y="118" text-anchor="end">غیر جانبدار کوڈز استعمال کریں، پورا</text><text class="cell" x="243" y="136" text-anchor="end">نام یا طلبہ کی تصاویر نہیں</text></g><g id="node-3"><rect class="panel" x="525" y="370" width="235" height="85" rx="8"/><text class="sh" x="748" y="396" text-anchor="end">3. سخت رازداری</text><text class="cell" x="748" y="418" text-anchor="end">نوٹس نجی رکھیں؛ شیئر کریں</text><text class="cell" x="748" y="436" text-anchor="end">صرف مینٹور اور فیکلٹی کے ساتھ</text></g><g id="node-4"><rect class="panel" x="20" y="370" width="235" height="85" rx="8"/><text class="sh" x="243" y="396" text-anchor="end">4. معروضی شواہد</text><text class="cell" x="243" y="418" text-anchor="end">بیانی حقیقت ریکارڈ کریں</text><text class="cell" x="243" y="436" text-anchor="end">ذاتی جانبداری کے بجائے</text></g><g id="node-5"><rect class="panel" x="273" y="405" width="235" height="85" rx="8"/><text class="sh" x="496" y="431" text-anchor="end">5. پیشہ ورانہ احترام</text><text class="cell" x="496" y="453" text-anchor="end">پہلے پہنچیں، متواضع لباس،</text><text class="cell" x="496" y="471" text-anchor="end">اور کسی بھی رکاوٹ سے بچیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کلاس روم مشاہدے پر حاکم بنیادی اخلاقی اصول</text><text id="label-caption" class="small" x="756" y="515" text-anchor="end">مشاہدہ طلبہ کے حقوق اور کلاس روم اساتذہ کی پیشہ ورانہ عزت کی حفاظت کرتا ہے۔</text><text class="wm" x="12" y="530" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
