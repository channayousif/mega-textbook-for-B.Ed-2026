<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Biased high-inference notes versus objective low-inference records</title><desc id="d">Table contrasting biased observation notes with objective factual evidence across four classroom scenarios.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Class Moment</text><text class="h" x="180" y="83">Biased High-Inference Note</text><text class="h" x="460" y="83">Objective Low-Inference Record</text><rect class="panel" x="24" y="102" width="732" height="76" rx="6"/><text class="sh" x="36" y="128">Lesson Start</text><text class="cell" x="180" y="128">"The teacher arrived late and was</text><text class="cell" x="180" y="148">clearly unprepared for class."</text><text class="cell" x="460" y="128">"Class began at 9:07 AM. Teacher spent</text><text class="cell" x="460" y="148">3 mins writing title and page numbers."</text><rect class="panel-a" x="24" y="184" width="732" height="76" rx="6"/><text class="sh" x="36" y="210">Exposition</text><text class="cell" x="180" y="210">"The students were bored and</text><text class="cell" x="180" y="230">completely uninterested in topic."</text><text class="cell" x="460" y="210">"In 12-min talk, 4 pupils rested heads;</text><text class="cell" x="460" y="230">2 raised hands when question was asked."</text><rect class="panel" x="24" y="266" width="732" height="76" rx="6"/><text class="sh" x="36" y="292">Questioning</text><text class="cell" x="180" y="292">"Teacher picked favourites and</text><text class="cell" x="180" y="312">ignored struggling children."</text><text class="cell" x="460" y="292">"Teacher called on 6 front-row pupils</text><text class="cell" x="460" y="312">and 1 pupil from the back left bench."</text><rect class="panel-a" x="24" y="348" width="732" height="76" rx="6"/><text class="sh" x="36" y="374">Group Activity</text><text class="cell" x="180" y="374">"Total chaos erupted; teacher</text><text class="cell" x="180" y="394">has no authority over pupils."</text><text class="cell" x="460" y="374">"14 of 36 students stood and spoke</text><text class="cell" x="460" y="394">while waiting 6 mins for paper sheets."</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Contrasting high-inference labels with low-inference factual evidence</text><text id="label-caption" class="small" x="24" y="455">Low-inference data describes observable events like a camera, enabling productive reflection.</text><text class="wm" x="768" y="500" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>