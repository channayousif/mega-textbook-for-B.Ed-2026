<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Translating observation findings into self-improvement targets</title><desc id="d">Table showing translation of observation findings into analytical insights and personal professional development targets.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="36" y="83">Observed Finding</text><text class="h" x="260" y="83">Analytical Insight</text><text class="h" x="500" y="83">Personal Action Target</text><rect class="panel-a" x="24" y="102" width="732" height="74" rx="6"/><text class="sh" x="36" y="126">Math Manipulatives</text><text class="cell" x="36" y="144">Pair work with wooden sticks</text><text class="cell" x="260" y="126">Concrete aids eliminate idle</text><text class="cell" x="260" y="144">time and clarify math steps</text><text class="cell" x="500" y="126">Prepare bundle of 10 sticks for</text><text class="cell" x="500" y="144">each desk pair in Tuesday's class</text><rect class="panel-b" x="24" y="182" width="732" height="74" rx="6"/><text class="sh" x="36" y="206">Question Wait-Time</text><text class="cell" x="36" y="224">Teacher waited 4 seconds</text><text class="cell" x="260" y="206">Longer pause doubled student</text><text class="cell" x="260" y="224">replies from quiet children</text><text class="cell" x="500" y="206">Silently count to four after every</text><text class="cell" x="500" y="224">question before calling on a pupil</text><rect class="panel-c" x="24" y="262" width="732" height="74" rx="6"/><text class="sh" x="36" y="286">Chalkboard Work</text><text class="cell" x="36" y="304">Faint text caused talking</text><text class="cell" x="260" y="286">Illegible text in back rows</text><text class="cell" x="260" y="304">triggers student disruption</text><text class="cell" x="500" y="286">Write in 3-inch block letters and</text><text class="cell" x="500" y="304">read questions aloud while writing</text><rect class="panel-d" x="24" y="342" width="732" height="74" rx="6"/><text class="sh" x="36" y="366">Transition Routine</text><text class="cell" x="36" y="384">Rhythmic clap quieted room</text><text class="cell" x="260" y="366">Auditory signal re-focuses</text><text class="cell" x="260" y="384">energetic class without yelling</text><text class="cell" x="500" y="366">Teach a two-clap call routine</text><text class="cell" x="500" y="384">during first 5 minutes of placement</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">From observational findings to personal teaching targets</text><text id="label-caption" class="small" x="24" y="445">Observing others provides models and insights that shape measurable personal instructional goals.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>