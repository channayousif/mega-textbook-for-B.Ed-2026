<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار کلاس روم مشاہدے نمونوں کا موازنہ</title><desc id="d">ایک جدول جو چار کلاس روم مشاہدے کے نمونوں کا موازنہ کرتی ہے: باقاعدہ، غیر باقاعدہ، ہم پیشہ اور سپروائزر کی ہدایت میں، مقصد، مشاہدہ کار اور نتائج کے لحاظ سے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="510"/><g id="layer-table"><rect class="panel" x="24" y="60" width="732" height="35" rx="6"/><text class="h" x="744" y="83" text-anchor="end">نمونہ</text><text class="h" x="600" y="83" text-anchor="end">بنیادی مقصد</text><text class="h" x="390" y="83" text-anchor="end">کون مشاہدہ کرتا ہے</text><text class="h" x="190" y="83" text-anchor="end">عام نتیجہ</text><rect class="panel-a" x="24" y="102" width="732" height="80" rx="6"/><text class="sh" x="744" y="128" text-anchor="end">باقاعدہ</text><text class="sh" x="744" y="148" text-anchor="end">مشاہدہ</text><text class="cell" x="600" y="128" text-anchor="end">تدریسی قابلیتوں کی تصدیق</text><text class="cell" x="600" y="148" text-anchor="end">سرکاری معیارات کے مطابق</text><text class="cell" x="390" y="128" text-anchor="end">ہیڈ ٹیچرز اور</text><text class="cell" x="390" y="148" text-anchor="end">ضلعی معائنہ کار</text><text class="cell" x="190" y="128" text-anchor="end">باقاعدہ جائزہ رپورٹ</text><text class="cell" x="190" y="148" text-anchor="end">اور درجہ بندی کا ریکارڈ</text><rect class="panel-b" x="24" y="188" width="732" height="80" rx="6"/><text class="sh" x="744" y="214" text-anchor="end">غیر باقاعدہ</text><text class="sh" x="744" y="234" text-anchor="end">گھوماؤ</text><text class="cell" x="600" y="214" text-anchor="end">کلاس روم کے ماحول کا اندازہ</text><text class="cell" x="600" y="234" text-anchor="end">اور عمومی شاگرد مشغولیت</text><text class="cell" x="390" y="214" text-anchor="end">اسکول مینٹورز اور</text><text class="cell" x="390" y="234" text-anchor="end">پریکٹیکم راہنما</text><text class="cell" x="190" y="214" text-anchor="end">مختصر زبانی کوچنگ</text><text class="cell" x="190" y="234" text-anchor="end">اور ماحول کی تبدیلی</text><rect class="panel-c" x="24" y="274" width="732" height="80" rx="6"/><text class="sh" x="744" y="300" text-anchor="end">ہم پیشہ</text><text class="sh" x="744" y="320" text-anchor="end">مشاہدہ</text><text class="cell" x="600" y="300" text-anchor="end">اشتراکی سیکھنا</text><text class="cell" x="600" y="320" text-anchor="end">مشترکہ تدریسی سوالات</text><text class="cell" x="390" y="300" text-anchor="end">ہم تربیت زیرِ تربیت اساتذہ</text><text class="cell" x="390" y="320" text-anchor="end">اور استاد ہم پیشہ لوگ</text><text class="cell" x="190" y="300" text-anchor="end">غیر مہدید دوبارہ بریفنگ</text><text class="cell" x="190" y="320" text-anchor="end">اور باہمی تامل</text><rect class="panel-d" x="24" y="360" width="732" height="80" rx="6"/><text class="sh" x="744" y="386" text-anchor="end">سپروائزر کی ہدایت</text><text class="sh" x="744" y="406" text-anchor="end">پریکٹیکم</text><text class="cell" x="600" y="386" text-anchor="end">پریکٹیکم کی ترقی کی نگرانی</text><text class="cell" x="600" y="406" text-anchor="end">اور کورس کے معیارات کی تصدیق</text><text class="cell" x="390" y="386" text-anchor="end">یونیورسٹی پریکٹیکم</text><text class="cell" x="390" y="406" text-anchor="end">فیکلٹی سپروائزرز</text><text class="cell" x="190" y="386" text-anchor="end">منظم معیارِ جانچ اسکورنگ</text><text class="cell" x="190" y="406" text-anchor="end">اور ترقی کے اہداف</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">چار کلاس روم مشاہدے نمونوں کا موازنہ</text><text id="label-caption" class="small" x="756" y="468" text-anchor="end">مختلف نمونے الگ الگ انتظامی، ترقیاتی اور جانچنے والے مقاصد پورے کرتے ہیں۔</text><text class="wm" x="12" y="500" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
