<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Time on task tally across a 35 minute lesson</title><desc id="d">A time-on-task tally for a 35-minute lesson in five-minute blocks, with the proportion of pupils on task in each block.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="430"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="34"/><rect class="panel-b" x="32" y="136" width="716" height="34"/><rect class="panel-c" x="32" y="170" width="716" height="34"/><rect class="panel-d" x="32" y="204" width="716" height="34"/><rect class="panel-a" x="32" y="238" width="716" height="34"/><rect class="panel-b" x="32" y="272" width="716" height="34"/><rect class="panel-c" x="32" y="306" width="716" height="34"/><rect class="panel-d" x="32" y="340" width="716" height="34"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Time on task across a 35 minute lesson</text><text class="h" x="44" y="82">Block</text><text class="h" x="270" y="82">Observer snapshot</text><text class="h" x="520" y="82">Pupils on task</text><text class="cell" x="44" y="124">0 to 5 min</text><text class="cell" x="270" y="124">teacher explaining</text><text class="cell" x="520" y="124">32 of 38</text><text class="cell" x="44" y="158">5 to 10 min</text><text class="cell" x="270" y="158">pupils writing</text><text class="cell" x="520" y="158">34 of 38</text><text class="cell" x="44" y="192">10 to 15 min</text><text class="cell" x="270" y="192">pupils writing</text><text class="cell" x="520" y="192">33 of 38</text><text class="cell" x="44" y="226">15 to 20 min</text><text class="cell" x="270" y="226">transition to groups</text><text class="cell" x="520" y="226">18 of 38</text><text class="cell" x="44" y="260">20 to 25 min</text><text class="cell" x="270" y="260">group work</text><text class="cell" x="520" y="260">28 of 38</text><text class="cell" x="44" y="294">25 to 30 min</text><text class="cell" x="270" y="294">group work</text><text class="cell" x="520" y="294">31 of 38</text><text class="cell" x="44" y="328">30 to 35 min</text><text class="cell" x="270" y="328">summary and exit ticket</text><text class="cell" x="520" y="328">30 of 38</text><text class="sh" x="44" y="362">Average</text><text class="cell" x="270" y="362">across seven blocks</text><text class="cell" x="520" y="362">29 of 38</text><text id="label-caption" class="small" x="24" y="392">The dip follows the transition, not the topic; that is the kind of pattern a tally reveals.</text><text class="wm" x="768" y="412" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
