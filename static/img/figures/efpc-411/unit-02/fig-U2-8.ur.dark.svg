<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">شمولیتی طریقہ ہائے تدریس اور ان کے قابلِ مشاہدہ مظاہر</title><desc id="d">چار شمولیتی طریقہ ہائے تدریس مع ہر ایک کے لیے قابلِ مشاہدہ مظہر، شرکت اور گروہ بندی سے لے کر غیر جانبدارانہ گفتگو تک۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="62"/><rect class="panel-b" x="32" y="164" width="716" height="62"/><rect class="panel-c" x="32" y="226" width="716" height="62"/><rect class="panel-d" x="32" y="288" width="716" height="62"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">شمولیتی طریقہ ہائے تدریس اور ان کے قابلِ مشاہدہ مظاہر</text><text class="h" x="728" y="82" text-anchor="end">شمولیتی طریقہ کار</text><text class="h" x="420" y="82" text-anchor="end">قابلِ مشاہدہ مظہر</text><text class="sh" x="728" y="136" text-anchor="end">شرکت کے متعدد طریقے</text><text class="cell" x="420" y="126" text-anchor="end">جوڑی میں گفتگو، سلیٹ پر کام اور گروہ میں کردار،</text><text class="cell" x="420" y="143" text-anchor="end">نہ کہ محض ہاتھ اٹھانا</text><text class="sh" x="728" y="190" text-anchor="end">بٹھک اور گروہ بندی</text><text class="sh" x="728" y="207" text-anchor="end">میں سب کی شمولیت</text><text class="cell" x="420" y="190" text-anchor="end">استاد پیچھے اور دور کونوں میں بیٹھے طلبہ</text><text class="cell" x="420" y="207" text-anchor="end">کی طرف جاتا ہے</text><text class="sh" x="728" y="262" text-anchor="end">انفرادی ضروریات کا خیال رکھنا</text><text class="cell" x="420" y="254" text-anchor="end">ضرورت مند طالب علم کے لیے اضافی وقت،</text><text class="cell" x="420" y="271" text-anchor="end">مختلف کام یا قابلِ استعمال مواد</text><text class="sh" x="728" y="312" text-anchor="end">استاد کی گفتگو میں کوئی</text><text class="sh" x="728" y="329" text-anchor="end">تعصب یا فرسودہ تصور نہیں</text><text class="cell" x="420" y="312" text-anchor="end">کسی گروہ کی شناخت کی بنا پر اس کی</text><text class="cell" x="420" y="329" text-anchor="end">تعریف، مذمت یا نظر اندازی نہیں ہوتی</text><text id="label-caption" class="small" x="756" y="368" text-anchor="end">شمولیت کا فیصلہ اس بات سے ہوتا ہے کہ کون شریک ہے، نہ کہ اس سے کہ کس کی کوئی تشخیص ہوئی ہے۔</text><text class="wm" x="12" y="388" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>