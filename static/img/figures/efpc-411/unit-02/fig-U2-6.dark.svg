<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Assessment methods from informal to formal</title><desc id="d">A continuum of assessment methods from informal to formal, with five methods placed along it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="310"/><g id="layer-edges"><line class="stroke" x1="70" y1="180" x2="710" y2="180" marker-end="url(#arrow)"/></g><g id="layer-nodes"><circle class="panel-a" cx="70" cy="180" r="10"/><circle class="panel-a" cx="225" cy="180" r="10"/><circle class="panel-a" cx="380" cy="180" r="10"/><circle class="panel-a" cx="545" cy="180" r="10"/><circle class="panel-a" cx="710" cy="180" r="10"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Assessment methods from informal to formal</text><text class="sh" x="70" y="150">informal</text><text class="sh" x="710" y="150" text-anchor="end">formal</text><text class="small" x="390" y="165" text-anchor="middle">increasing formality</text><text class="cell" x="70" y="215" text-anchor="middle">Oral questions</text><text class="cell" x="225" y="215" text-anchor="middle">Group work observation</text><text class="cell" x="380" y="215" text-anchor="middle">Short quizzes</text><text class="cell" x="545" y="215" text-anchor="middle">Homework checks</text><text class="cell" x="710" y="215" text-anchor="middle">Written test</text><text class="small" x="70" y="233" text-anchor="middle">during teaching</text><text class="small" x="225" y="233" text-anchor="middle">watching pupils</text><text class="small" x="380" y="233" text-anchor="middle">short and quick</text><text class="small" x="545" y="233" text-anchor="middle">marked and returned</text><text class="small" x="710" y="233" text-anchor="middle">end of a unit</text><text id="label-caption" class="small" x="24" y="270">Informal methods happen during teaching; formal methods come at the end of a unit.</text><text class="wm" x="768" y="290" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
