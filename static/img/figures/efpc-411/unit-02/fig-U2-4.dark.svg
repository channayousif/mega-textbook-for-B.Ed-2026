<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Stages of a lesson an observer tracks</title><desc id="d">Flowchart of the five stages of a lesson an observer tracks, from opening to closure.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="390"/><g id="layer-regions"><rect class="panel-a" x="40" y="80" width="220" height="110" rx="8"/><rect class="panel-b" x="280" y="80" width="220" height="110" rx="8"/><rect class="panel-c" x="520" y="80" width="220" height="110" rx="8"/><rect class="panel-b" x="40" y="210" width="220" height="110" rx="8"/><rect class="panel-c" x="280" y="210" width="220" height="110" rx="8"/><rect class="panel-a" x="520" y="245" width="220" height="40" rx="20"/></g><g id="layer-edges"><line class="stroke" x1="260" y1="135" x2="280" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="500" y1="135" x2="520" y2="135" marker-end="url(#arrow)"/><path class="stroke" d="M630,190 L630,200 L150,200 L150,210" marker-end="url(#arrow)"/><line class="stroke" x1="260" y1="265" x2="280" y2="265" marker-end="url(#arrow)"/><line class="stroke" x1="500" y1="265" x2="520" y2="265" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Stages of a lesson an observer tracks</text><text class="h" x="52" y="104">Opening</text><text class="cell" x="52" y="126">greeting and recap,</text><text class="cell" x="52" y="144">share the objective</text><text class="h" x="292" y="104">Presentation</text><text class="cell" x="292" y="126">new content with</text><text class="cell" x="292" y="144">examples and modelling</text><text class="h" x="532" y="104">Practice</text><text class="cell" x="532" y="126">guided then</text><text class="cell" x="532" y="144">independent work</text><text class="h" x="52" y="234">Check</text><text class="cell" x="52" y="256">questions and feedback</text><text class="cell" x="52" y="274">on understanding</text><text class="h" x="292" y="234">Closure</text><text class="cell" x="292" y="256">summary and link</text><text class="cell" x="292" y="274">to the next lesson</text><text class="sh" x="630" y="271" text-anchor="middle">lesson ends</text><text id="label-caption" class="small" x="24" y="352">A lesson reads as one shape: each stage sets up the next, and the check feeds the closure.</text><text class="wm" x="768" y="372" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
