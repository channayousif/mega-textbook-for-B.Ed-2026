<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Classroom seating map with interaction codes</title><desc id="d">A classroom seating map with the observer's interaction codes: teacher to pupil (T-P), pupil to pupil (P-P) and pupil to teacher (P-T).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><rect class="panel" x="24" y="60" width="440" height="400"/><rect class="panel-b" x="44" y="76" width="180" height="24"/><rect class="panel-a" x="254" y="76" width="180" height="40"/><rect class="panel" x="480" y="60" width="276" height="240"/></g><g id="layer-nodes"><g id="node-desk-r1c1"><rect class="panel" x="44" y="150" width="56" height="28"/></g><g id="node-desk-r1c2"><rect class="panel" x="144" y="150" width="56" height="28"/></g><g id="node-desk-r1c3"><rect class="panel" x="244" y="150" width="56" height="28"/></g><g id="node-desk-r1c4"><rect class="panel" x="344" y="150" width="56" height="28"/></g><g id="node-desk-r2c1"><rect class="panel" x="44" y="214" width="56" height="28"/></g><g id="node-desk-r2c2"><rect class="panel" x="144" y="214" width="56" height="28"/></g><g id="node-desk-r2c3"><rect class="panel" x="244" y="214" width="56" height="28"/></g><g id="node-desk-r2c4"><rect class="panel" x="344" y="214" width="56" height="28"/></g><g id="node-desk-r3c1"><rect class="panel" x="44" y="278" width="56" height="28"/></g><g id="node-desk-r3c2"><rect class="panel" x="144" y="278" width="56" height="28"/></g><g id="node-desk-r3c3"><rect class="panel" x="244" y="278" width="56" height="28"/></g><g id="node-desk-r3c4"><rect class="panel" x="344" y="278" width="56" height="28"/></g><g id="node-desk-r4c1"><rect class="panel" x="44" y="342" width="56" height="28"/></g><g id="node-desk-r4c2"><rect class="panel" x="144" y="342" width="56" height="28"/></g><g id="node-desk-r4c3"><rect class="panel" x="244" y="342" width="56" height="28"/></g><g id="node-desk-r4c4"><rect class="panel" x="344" y="342" width="56" height="28"/></g></g><g id="layer-edges"><line class="stroke" x1="372" y1="116" x2="372" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="100" y1="238" x2="144" y2="238" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path class="stroke" d="M344,356 L322,356 L322,116" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Classroom seating map with interaction codes</text><text class="cell" x="54" y="93">Chalkboard</text><text class="cell" x="264" y="100">Teacher desk</text><text class="small" x="382" y="138">T-P</text><text class="small" x="104" y="224">P-P</text><text class="small" x="300" y="392">P-T</text><text class="h" x="492" y="88">Interaction codes</text><text class="sh" x="492" y="122">T-P</text><text class="cell" x="540" y="122">teacher to pupil</text><text class="sh" x="492" y="152">P-P</text><text class="cell" x="540" y="152">pupil to pupil</text><text class="sh" x="492" y="182">P-T</text><text class="cell" x="540" y="182">pupil to teacher</text><text class="small" x="492" y="222">Arrows show who speaks</text><text class="small" x="492" y="240">to whom in the period.</text><text class="small" x="492" y="270">A raised hand is a</text><text class="small" x="492" y="288">pupil-to-teacher move.</text><text id="label-caption" class="small" x="24" y="478">A seating map records who speaks to whom; the codes keep the record factual.</text><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
