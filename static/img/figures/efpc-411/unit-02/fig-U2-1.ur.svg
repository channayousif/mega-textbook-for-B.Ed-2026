<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کلاس روم بٹھک کا نقشہ مع تعاملی کوڈز</title><desc id="d">ایک کلاس روم بٹھک کا نقشہ مع مشاہدہ کار کے تعاملی کوڈز: استاد سے شاگرد (T-P)، شاگرد سے شاگرد (P-P) اور شاگرد سے استاد (P-T)۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><rect class="panel" x="316" y="60" width="440" height="400"/><rect class="panel-b" x="556" y="76" width="180" height="24"/><rect class="panel-a" x="346" y="76" width="180" height="40"/><rect class="panel" x="24" y="60" width="276" height="240"/></g><g id="layer-nodes"><g id="node-desk-r1c1"><rect class="panel" x="680" y="150" width="56" height="28"/></g><g id="node-desk-r1c2"><rect class="panel" x="580" y="150" width="56" height="28"/></g><g id="node-desk-r1c3"><rect class="panel" x="480" y="150" width="56" height="28"/></g><g id="node-desk-r1c4"><rect class="panel" x="380" y="150" width="56" height="28"/></g><g id="node-desk-r2c1"><rect class="panel" x="680" y="214" width="56" height="28"/></g><g id="node-desk-r2c2"><rect class="panel" x="580" y="214" width="56" height="28"/></g><g id="node-desk-r2c3"><rect class="panel" x="480" y="214" width="56" height="28"/></g><g id="node-desk-r2c4"><rect class="panel" x="380" y="214" width="56" height="28"/></g><g id="node-desk-r3c1"><rect class="panel" x="680" y="278" width="56" height="28"/></g><g id="node-desk-r3c2"><rect class="panel" x="580" y="278" width="56" height="28"/></g><g id="node-desk-r3c3"><rect class="panel" x="480" y="278" width="56" height="28"/></g><g id="node-desk-r3c4"><rect class="panel" x="380" y="278" width="56" height="28"/></g><g id="node-desk-r4c1"><rect class="panel" x="680" y="342" width="56" height="28"/></g><g id="node-desk-r4c2"><rect class="panel" x="580" y="342" width="56" height="28"/></g><g id="node-desk-r4c3"><rect class="panel" x="480" y="342" width="56" height="28"/></g><g id="node-desk-r4c4"><rect class="panel" x="380" y="342" width="56" height="28"/></g></g><g id="layer-edges"><line class="stroke" x1="408" y1="116" x2="408" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="680" y1="238" x2="636" y2="238" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path class="stroke" d="M436,356 L458,356 L458,116" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کلاس روم بٹھک کا نقشہ مع تعاملی کوڈز</text><text class="cell" x="646" y="93" text-anchor="middle">تختہ تحریر</text><text class="cell" x="436" y="100" text-anchor="middle">استاد کی میز</text><text class="small" x="398" y="138" text-anchor="end">T-P</text><text class="small" x="658" y="224" text-anchor="middle">P-P</text><text class="small" x="466" y="392" text-anchor="start">P-T</text><text class="h" x="280" y="88" text-anchor="end">تعاملی کوڈز</text><text class="sh" x="280" y="122" text-anchor="end">T-P</text><text class="cell" x="240" y="122" text-anchor="end">استاد سے شاگرد</text><text class="sh" x="280" y="152" text-anchor="end">P-P</text><text class="cell" x="240" y="152" text-anchor="end">شاگرد سے شاگرد</text><text class="sh" x="280" y="182" text-anchor="end">P-T</text><text class="cell" x="240" y="182" text-anchor="end">شاگرد سے استاد</text><text class="small" x="280" y="222" text-anchor="end">تیر ظاہر کرتے ہیں کہ گھنٹے کے</text><text class="small" x="280" y="240" text-anchor="end">دوران کون کس سے بات کرتا ہے۔</text><text class="small" x="280" y="270" text-anchor="end">اٹھایا گیا ہاتھ شاگرد سے</text><text class="small" x="280" y="288" text-anchor="end">استاد کی جانب پیش قدمی ہے۔</text><text id="label-caption" class="small" x="756" y="478" text-anchor="end">بٹھک کا نقشہ ریکارڈ کرتا ہے کہ کون کس سے بات کرتا ہے؛ کوڈز ریکارڈ کو معروضی رکھتے ہیں۔</text><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>