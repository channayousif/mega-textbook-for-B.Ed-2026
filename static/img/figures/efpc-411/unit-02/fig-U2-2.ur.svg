<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے ماحول کی مشاہداتی شیٹ</title><desc id="d">اسکول کے ماحول کی مشاہداتی شیٹ: پانچ شعبے، کیا نوٹ کرنا ہے اور ہر ایک کے لیے ایک نمونہ اندراج۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="68"/><rect class="panel-b" x="32" y="170" width="716" height="68"/><rect class="panel-c" x="32" y="238" width="716" height="68"/><rect class="panel-d" x="32" y="306" width="716" height="68"/><rect class="panel" x="32" y="374" width="716" height="68"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">اسکول کے ماحول کی مشاہداتی شیٹ</text><text class="h" x="728" y="82" text-anchor="end">شعبہ</text><text class="h" x="518" y="82" text-anchor="end">کیا نوٹ کرنا ہے</text><text class="h" x="258" y="82" text-anchor="end">نمونہ اندراج</text><text class="sh" x="728" y="126" text-anchor="end">عمارت اور</text><text class="sh" x="728" y="143" text-anchor="end">میدان</text><text class="cell" x="518" y="126" text-anchor="end">کمرے، چاردیواری، کھیل کا</text><text class="cell" x="518" y="143" text-anchor="end">میدان، فرش اور چھت</text><text class="cell" x="258" y="126" text-anchor="end">دو کمرہ ہائے جماعت؛</text><text class="cell" x="258" y="143" text-anchor="end">چاردیواری موجود نہیں۔</text><text class="sh" x="728" y="194" text-anchor="end">پانی، صفائی</text><text class="sh" x="728" y="211" text-anchor="end">اور تحفظ</text><text class="cell" x="518" y="194" text-anchor="end">نل یا ہینڈ پمپ،</text><text class="cell" x="518" y="211" text-anchor="end">بیت الخلاء، محفوظ راستہ</text><text class="cell" x="258" y="194" text-anchor="end">ایک ہینڈ پمپ؛ 96 طلبہ کے</text><text class="cell" x="258" y="211" text-anchor="end">لیے ایک بیت الخلاء۔</text><text class="sh" x="728" y="262" text-anchor="end">تدریسی وسائل</text><text class="cell" x="518" y="262" text-anchor="end">درسی کتب، چاک،</text><text class="cell" x="518" y="279" text-anchor="end">چارٹس، کتب خانے کا گوشہ</text><text class="cell" x="258" y="262" text-anchor="end">96 طلبہ کے لیے ریاضی کی</text><text class="cell" x="258" y="279" text-anchor="end">18 درسی کتب۔</text><text class="sh" x="728" y="330" text-anchor="end">نظمی نظام</text><text class="cell" x="518" y="330" text-anchor="end">آویزاں اصول، اسمبلی،</text><text class="cell" x="518" y="347" text-anchor="end">ذمہ داریاں</text><text class="cell" x="258" y="330" text-anchor="end">گیٹ پر اصول آویزاں ہیں؛</text><text class="cell" x="258" y="347" text-anchor="end">روزانہ اسمبلی۔</text><text class="sh" x="728" y="398" text-anchor="end">روزانہ کا شیڈول</text><text class="cell" x="518" y="398" text-anchor="end">اسمبلی، گھنٹوں کا دورانیہ،</text><text class="cell" x="518" y="415" text-anchor="end">وقفہ، حاضری</text><text class="cell" x="258" y="398" text-anchor="end">ٹائم ٹیبل میں 40 منٹ کے</text><text class="cell" x="258" y="415" text-anchor="end">6 گھنٹے درج ہیں۔</text><text id="label-caption" class="small" x="756" y="462" text-anchor="end">ہر اندراج بیان کرتا ہے کہ کیا موجود ہے، کتنا ہے، اور استاد اس کا کیا استعمال کرتا ہے۔</text><text class="wm" x="12" y="482" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>