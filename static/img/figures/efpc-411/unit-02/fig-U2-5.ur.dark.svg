<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">35 منٹ کے سبق میں کام پر صرف ہونے والے وقت کی شماری</title><desc id="d">35 منٹ کے سبق میں کام پر صرف ہونے والے وقت کی شماری پانچ منٹ کے وقفوں میں، جس میں ہر وقفے میں کام میں مصروف طلبہ کا تناسب درج ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="430"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="34"/><rect class="panel-b" x="32" y="136" width="716" height="34"/><rect class="panel-c" x="32" y="170" width="716" height="34"/><rect class="panel-d" x="32" y="204" width="716" height="34"/><rect class="panel-a" x="32" y="238" width="716" height="34"/><rect class="panel-b" x="32" y="272" width="716" height="34"/><rect class="panel-c" x="32" y="306" width="716" height="34"/><rect class="panel-d" x="32" y="340" width="716" height="34"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">35 منٹ کے سبق میں کام پر صرف ہونے والے وقت کی شماری</text><text class="h" x="728" y="82" text-anchor="end">وقفہ</text><text class="h" x="508" y="82" text-anchor="end">مشاہدہ کار کا جھلک جائزہ</text><text class="h" x="248" y="82" text-anchor="end">کام میں مصروف طلبہ</text><text class="cell" x="728" y="124" text-anchor="end">0 تا 5 منٹ</text><text class="cell" x="508" y="124" text-anchor="end">استاد کی وضاحت</text><text class="cell" x="248" y="124" text-anchor="end">38 میں سے 32</text><text class="cell" x="728" y="158" text-anchor="end">5 تا 10 منٹ</text><text class="cell" x="508" y="158" text-anchor="end">طلبہ کی تحریر</text><text class="cell" x="248" y="158" text-anchor="end">38 میں سے 34</text><text class="cell" x="728" y="192" text-anchor="end">10 تا 15 منٹ</text><text class="cell" x="508" y="192" text-anchor="end">طلبہ کی تحریر</text><text class="cell" x="248" y="192" text-anchor="end">38 میں سے 33</text><text class="cell" x="728" y="226" text-anchor="end">15 تا 20 منٹ</text><text class="cell" x="508" y="226" text-anchor="end">گروہوں میں منتقلی</text><text class="cell" x="248" y="226" text-anchor="end">38 میں سے 18</text><text class="cell" x="728" y="260" text-anchor="end">20 تا 25 منٹ</text><text class="cell" x="508" y="260" text-anchor="end">گروہی کام</text><text class="cell" x="248" y="260" text-anchor="end">38 میں سے 28</text><text class="cell" x="728" y="294" text-anchor="end">25 تا 30 منٹ</text><text class="cell" x="508" y="294" text-anchor="end">گروہی کام</text><text class="cell" x="248" y="294" text-anchor="end">38 میں سے 31</text><text class="cell" x="728" y="328" text-anchor="end">30 تا 35 منٹ</text><text class="cell" x="508" y="328" text-anchor="end">خلاصہ اور ایگزٹ ٹکٹ</text><text class="cell" x="248" y="328" text-anchor="end">38 میں سے 30</text><text class="sh" x="728" y="362" text-anchor="end">اوسط</text><text class="cell" x="508" y="362" text-anchor="end">سات وقفوں کے دوران</text><text class="cell" x="248" y="362" text-anchor="end">38 میں سے 29</text><text id="label-caption" class="small" x="756" y="392" text-anchor="end">یہ کمی منتقلی کے بعد آتی ہے، نہ کہ موضوع کی وجہ سے؛ شماری اسی قسم کا نمونہ سامنے لاتی ہے۔</text><text class="wm" x="12" y="412" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>