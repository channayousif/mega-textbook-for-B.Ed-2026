<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سبقی مشاہدے کا پروفارما</title><desc id="d">سبقی مشاہدے کا پروفارما جس میں توجہ کے پانچ شعبے اور ہر ایک کے لیے نمونہ اندراج شامل ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="62"/><rect class="panel-b" x="32" y="164" width="716" height="62"/><rect class="panel-c" x="32" y="226" width="716" height="62"/><rect class="panel-d" x="32" y="288" width="716" height="62"/><rect class="panel" x="32" y="350" width="716" height="62"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">سبقی مشاہدے کا پروفارما</text><text class="h" x="728" y="82" text-anchor="end">توجہ کا مرکز</text><text class="h" x="518" y="82" text-anchor="end">مشاہدہ کار کیا ریکارڈ کرتا ہے</text><text class="h" x="258" y="82" text-anchor="end">نمونہ اندراج</text><text class="sh" x="728" y="126" text-anchor="end">سبقی مقاصد</text><text class="cell" x="518" y="126" text-anchor="end">آیا یہ بتایا گیا اور</text><text class="cell" x="518" y="143" text-anchor="end">سرگرمیاں اس سے مطابقت رکھتی ہیں</text><text class="cell" x="258" y="126" text-anchor="end">مقصد تختے پر درج؛</text><text class="cell" x="258" y="143" text-anchor="end">سرگرمیاں اس سے ہم آہنگ تھیں۔</text><text class="sh" x="728" y="188" text-anchor="end">تدریسی طریقے</text><text class="sh" x="728" y="205" text-anchor="end">اور حکمت ہائے عملی</text><text class="cell" x="518" y="188" text-anchor="end">اصل حکمتِ عملی، تعداد</text><text class="cell" x="518" y="205" text-anchor="end">اور مواد کے ساتھ</text><text class="cell" x="258" y="188" text-anchor="end">تیلیوں سے 12 منٹ تک</text><text class="cell" x="258" y="205" text-anchor="end">مقامی قیمت واضح کی۔</text><text class="sh" x="728" y="250" text-anchor="end">تدریسی معاونات</text><text class="cell" x="518" y="250" text-anchor="end">درسی کتاب، تختہ، اشیاء،</text><text class="cell" x="518" y="267" text-anchor="end">کم لاگت مواد</text><text class="cell" x="258" y="250" text-anchor="end">10 تیلیوں کے 3 بنڈل؛</text><text class="cell" x="258" y="267" text-anchor="end">کوئی درسی کتاب استعمال نہ ہوئی۔</text><text class="sh" x="728" y="312" text-anchor="end">طلبہ کی شرکت</text><text class="cell" x="518" y="312" text-anchor="end">کتنے جواب دیتے ہیں،</text><text class="cell" x="518" y="329" text-anchor="end">مشق کرتے ہیں یا کام بناتے ہیں</text><text class="cell" x="258" y="312" text-anchor="end">34 میں سے 21 طلبہ نے</text><text class="cell" x="258" y="329" text-anchor="end">سلیٹ پیپر پر مشق کی۔</text><text class="sh" x="728" y="374" text-anchor="end">استاد کی سوالات</text><text class="sh" x="728" y="391" text-anchor="end">پوچھنے کی تکنیک</text><text class="cell" x="518" y="374" text-anchor="end">سوالات کی اقسام، کون</text><text class="cell" x="518" y="391" text-anchor="end">جواب دیتا ہے، وقفہ تامل</text><text class="cell" x="258" y="374" text-anchor="end">11 سوالات؛ 4 آزادانہ؛</text><text class="cell" x="258" y="391" text-anchor="end">وقفہ تامل تقریباً 2 سیکنڈ۔</text><text id="label-caption" class="small" x="756" y="432" text-anchor="end">ہر قطار ایک ایسا ریکارڈ مانگتی ہے جسے قاری جانچ سکے، نہ کہ کوئی صفت۔</text><text class="wm" x="12" y="452" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>