<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One complete 35 minute lesson on a timeline</title><desc id="d">A minute-by-minute timeline of one complete 35-minute lesson, from entry to the exit ticket.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.tick { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="330"/><g id="layer-edges"><line class="stroke" x1="70" y1="230" x2="730" y2="230" marker-end="url(#arrow)"/><line class="tick" x1="70" y1="230" x2="70" y2="238"/><line class="tick" x1="164" y1="230" x2="164" y2="238"/><line class="tick" x1="259" y1="230" x2="259" y2="238"/><line class="tick" x1="353" y1="230" x2="353" y2="238"/><line class="tick" x1="447" y1="230" x2="447" y2="238"/><line class="tick" x1="541" y1="230" x2="541" y2="238"/><line class="tick" x1="636" y1="230" x2="636" y2="238"/><line class="tick" x1="730" y1="230" x2="730" y2="238"/></g><g id="layer-nodes"><circle class="panel-a" cx="70" cy="230" r="4"/><circle class="panel-a" cx="164" cy="230" r="4"/><circle class="panel-a" cx="202" cy="230" r="4"/><circle class="panel-a" cx="409" cy="230" r="4"/><circle class="panel-a" cx="523" cy="230" r="4"/><circle class="panel-a" cx="598" cy="230" r="4"/><circle class="panel-a" cx="673" cy="230" r="4"/><circle class="panel-a" cx="711" cy="230" r="4"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">One complete 35 minute lesson</text><text class="cell" x="70" y="120" text-anchor="middle">Assembly and entry</text><text class="cell" x="409" y="120" text-anchor="middle">Guided practice</text><text class="cell" x="673" y="120" text-anchor="middle">Summary</text><text class="cell" x="164" y="160" text-anchor="middle">Objective on the board</text><text class="cell" x="523" y="160" text-anchor="middle">Group work</text><text class="cell" x="711" y="160" text-anchor="middle">Exit ticket</text><text class="cell" x="202" y="200" text-anchor="middle">Explanation with counters</text><text class="cell" x="598" y="200" text-anchor="middle">Teacher questioning</text><text class="small" x="70" y="254" text-anchor="middle">0</text><text class="small" x="164" y="254" text-anchor="middle">5</text><text class="small" x="259" y="254" text-anchor="middle">10</text><text class="small" x="353" y="254" text-anchor="middle">15</text><text class="small" x="447" y="254" text-anchor="middle">20</text><text class="small" x="541" y="254" text-anchor="middle">25</text><text class="small" x="636" y="254" text-anchor="middle">30</text><text class="small" x="730" y="254" text-anchor="middle">35</text><text id="label-caption" class="small" x="24" y="290">The lesson reads as one shape: entry, objective, explanation, practice, work, questioning, summary, exit.</text><text class="wm" x="768" y="312" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
