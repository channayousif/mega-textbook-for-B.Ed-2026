<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سبق کے مراحل جن کا مشاہدہ کار سراغ لگاتا ہے</title><desc id="d">فلو چارٹ: سبق کے پانچ مراحل جن کا مشاہدہ کار آغاز سے اختتام تک سراغ لگاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="390"/><g id="layer-regions"><rect class="panel-a" x="520" y="80" width="220" height="110" rx="8"/><rect class="panel-b" x="280" y="80" width="220" height="110" rx="8"/><rect class="panel-c" x="40" y="80" width="220" height="110" rx="8"/><rect class="panel-b" x="520" y="210" width="220" height="110" rx="8"/><rect class="panel-c" x="280" y="210" width="220" height="110" rx="8"/><rect class="panel-a" x="40" y="245" width="220" height="40" rx="20"/></g><g id="layer-edges"><line class="stroke" x1="520" y1="135" x2="500" y2="135" marker-end="url(#arrow)"/><line class="stroke" x1="280" y1="135" x2="260" y2="135" marker-end="url(#arrow)"/><path class="stroke" d="M150,190 L150,200 L630,200 L630,210" marker-end="url(#arrow)"/><line class="stroke" x1="520" y1="265" x2="500" y2="265" marker-end="url(#arrow)"/><line class="stroke" x1="280" y1="265" x2="260" y2="265" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">سبق کے مراحل جن کا مشاہدہ کار سراغ لگاتا ہے</text><text class="h" x="728" y="104" text-anchor="end">آغاز</text><text class="cell" x="728" y="126" text-anchor="end">سلام اور پچھلا اعادہ،</text><text class="cell" x="728" y="144" text-anchor="end">مقصد کا اشتراک</text><text class="h" x="488" y="104" text-anchor="end">پیشکش</text><text class="cell" x="488" y="126" text-anchor="end">مثالوں اور عملی نمونے</text><text class="cell" x="488" y="144" text-anchor="end">کے ساتھ نیا مواد</text><text class="h" x="248" y="104" text-anchor="end">مشق</text><text class="cell" x="248" y="126" text-anchor="end">رہنمائی کے تحت اور</text><text class="cell" x="248" y="144" text-anchor="end">پھر آزادانہ کام</text><text class="h" x="728" y="234" text-anchor="end">جانچ</text><text class="cell" x="728" y="256" text-anchor="end">فہم کی جانچ کے لیے</text><text class="cell" x="728" y="274" text-anchor="end">سوالات اور تاثرات</text><text class="h" x="488" y="234" text-anchor="end">اختتام</text><text class="cell" x="488" y="256" text-anchor="end">خلاصہ اور اگلے</text><text class="cell" x="488" y="274" text-anchor="end">سبق سے ربط</text><text class="sh" x="150" y="271" text-anchor="middle">سبق ختم ہوتا ہے</text><text id="label-caption" class="small" x="756" y="352" text-anchor="end">سبق ایک مربوط ساخت ہے: ہر مرحلہ اگلے کی تیاری کرتا ہے اور جانچ اختتام کو مواد دیتی ہے۔</text><text class="wm" x="12" y="372" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>