<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">School environment observation sheet</title><desc id="d">Observation sheet for the school environment: five areas with what to note and one example entry for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="68"/><rect class="panel-b" x="32" y="170" width="716" height="68"/><rect class="panel-c" x="32" y="238" width="716" height="68"/><rect class="panel-d" x="32" y="306" width="716" height="68"/><rect class="panel" x="32" y="374" width="716" height="68"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">School environment observation sheet</text><text class="h" x="44" y="82">Area</text><text class="h" x="230" y="82">What to note</text><text class="h" x="490" y="82">Example entry</text><text class="sh" x="44" y="126">Building and</text><text class="sh" x="44" y="143">grounds</text><text class="cell" x="230" y="126">Classrooms, boundary,</text><text class="cell" x="230" y="143">playground, floor, roof</text><text class="cell" x="490" y="126">Two classrooms; no</text><text class="cell" x="490" y="143">boundary wall.</text><text class="sh" x="44" y="194">Water, sanitation</text><text class="sh" x="44" y="211">and safety</text><text class="cell" x="230" y="194">Tap or hand pump,</text><text class="cell" x="230" y="211">toilets, safe entry</text><text class="cell" x="490" y="194">One hand pump; one toilet</text><text class="cell" x="490" y="211">for 96 pupils.</text><text class="sh" x="44" y="262">Learning resources</text><text class="cell" x="230" y="262">Textbooks, chalk,</text><text class="cell" x="230" y="279">charts, library corner</text><text class="cell" x="490" y="262">18 mathematics textbooks</text><text class="cell" x="490" y="279">for 96 pupils.</text><text class="sh" x="44" y="330">Discipline system</text><text class="cell" x="230" y="330">Displayed rules,</text><text class="cell" x="230" y="347">assembly, responsibilities</text><text class="cell" x="490" y="330">Rules painted at the gate;</text><text class="cell" x="490" y="347">assembly daily.</text><text class="sh" x="44" y="398">Daily schedule</text><text class="cell" x="230" y="398">Assembly, period lengths,</text><text class="cell" x="230" y="415">break, attendance</text><text class="cell" x="490" y="398">Timetable shows 6 periods</text><text class="cell" x="490" y="415">of 40 minutes.</text><text id="label-caption" class="small" x="24" y="462">Every entry states what is there, how many, and what the teacher does with it.</text><text class="wm" x="768" y="482" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
