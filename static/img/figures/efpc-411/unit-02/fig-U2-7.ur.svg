<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ٹائم لائن پر ایک مکمل 35 منٹ کا سبق</title><desc id="d">ایک مکمل 35 منٹ کے سبق کی منٹ بہ منٹ ٹائم لائن، آمد سے ایگزٹ ٹکٹ تک۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.tick { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="330"/><g id="layer-edges"><line class="stroke" x1="710" y1="230" x2="50" y2="230" marker-end="url(#arrow)"/><line class="tick" x1="710" y1="230" x2="710" y2="238"/><line class="tick" x1="616" y1="230" x2="616" y2="238"/><line class="tick" x1="521" y1="230" x2="521" y2="238"/><line class="tick" x1="427" y1="230" x2="427" y2="238"/><line class="tick" x1="333" y1="230" x2="333" y2="238"/><line class="tick" x1="239" y1="230" x2="239" y2="238"/><line class="tick" x1="144" y1="230" x2="144" y2="238"/><line class="tick" x1="50" y1="230" x2="50" y2="238"/></g><g id="layer-nodes"><circle class="panel-a" cx="710" cy="230" r="4"/><circle class="panel-a" cx="616" cy="230" r="4"/><circle class="panel-a" cx="578" cy="230" r="4"/><circle class="panel-a" cx="371" cy="230" r="4"/><circle class="panel-a" cx="257" cy="230" r="4"/><circle class="panel-a" cx="182" cy="230" r="4"/><circle class="panel-a" cx="107" cy="230" r="4"/><circle class="panel-a" cx="69" cy="230" r="4"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">ٹائم لائن پر ایک مکمل 35 منٹ کا سبق</text><text class="cell" x="710" y="120" text-anchor="middle">اسمبلی اور آمد</text><text class="cell" x="371" y="120" text-anchor="middle">رہنمائی میں مشق</text><text class="cell" x="107" y="120" text-anchor="middle">خلاصہ</text><text class="cell" x="616" y="160" text-anchor="middle">تختے پر مقصد</text><text class="cell" x="257" y="160" text-anchor="middle">گروہی کام</text><text class="cell" x="69" y="160" text-anchor="middle">ایگزٹ ٹکٹ</text><text class="cell" x="578" y="200" text-anchor="middle">گنتی اشیاء سے وضاحت</text><text class="cell" x="182" y="200" text-anchor="middle">استاد کے سوالات</text><text class="small" x="710" y="254" text-anchor="middle">0</text><text class="small" x="616" y="254" text-anchor="middle">5</text><text class="small" x="521" y="254" text-anchor="middle">10</text><text class="small" x="427" y="254" text-anchor="middle">15</text><text class="small" x="333" y="254" text-anchor="middle">20</text><text class="small" x="239" y="254" text-anchor="middle">25</text><text class="small" x="144" y="254" text-anchor="middle">30</text><text class="small" x="50" y="254" text-anchor="middle">35</text><text id="label-caption" class="small" x="756" y="290" text-anchor="end">سبق ایک مکمل ساخت کے طور پر پڑھا جاتا ہے: آمد، مقصد، وضاحت، مشق، کام، سوالات، خلاصہ، ایگزٹ۔</text><text class="wm" x="12" y="312" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>