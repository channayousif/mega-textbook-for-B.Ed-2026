<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Inclusive practices and their observable signs</title><desc id="d">Four inclusive practices with an observable sign for each, from participation and grouping to unbiased teacher talk.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="62"/><rect class="panel-b" x="32" y="164" width="716" height="62"/><rect class="panel-c" x="32" y="226" width="716" height="62"/><rect class="panel-d" x="32" y="288" width="716" height="62"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Inclusive practices and their observable signs</text><text class="h" x="44" y="82">Inclusive practice</text><text class="h" x="370" y="82">Observable sign</text><text class="sh" x="44" y="126">Multiple ways to take part</text><text class="cell" x="370" y="126">Pair talk, slate work and a group role,</text><text class="cell" x="370" y="143">not only putting up a hand</text><text class="sh" x="44" y="190">Seating and grouping include everyone</text><text class="cell" x="370" y="190">The teacher moves towards pupils at the back</text><text class="cell" x="370" y="207">and in the far corners</text><text class="sh" x="44" y="254">Responding to individual needs</text><text class="cell" x="370" y="254">More time, a different task or a usable</text><text class="cell" x="370" y="271">material for a pupil who needs it</text><text class="sh" x="44" y="312">No bias or stereotype</text><text class="sh" x="44" y="329">in the teacher's talk</text><text class="cell" x="370" y="312">No group is praised, blamed or ignored</text><text class="cell" x="370" y="329">because of who they are</text><text id="label-caption" class="small" x="24" y="368">Inclusion is judged by who takes part, not by who has a diagnosis.</text><text class="wm" x="768" y="388" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
