<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Lesson observation proforma</title><desc id="d">A lesson-observation proforma with five focus rows and an example entry for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-table"><rect class="panel" x="32" y="60" width="716" height="34"/><rect class="panel-a" x="32" y="102" width="716" height="62"/><rect class="panel-b" x="32" y="164" width="716" height="62"/><rect class="panel-c" x="32" y="226" width="716" height="62"/><rect class="panel-d" x="32" y="288" width="716" height="62"/><rect class="panel" x="32" y="350" width="716" height="62"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Lesson observation proforma</text><text class="h" x="44" y="82">Focus</text><text class="h" x="240" y="82">What the observer records</text><text class="h" x="500" y="82">Example entry</text><text class="sh" x="44" y="126">Lesson objectives</text><text class="cell" x="240" y="126">Whether it is shared and</text><text class="cell" x="240" y="143">matched by the activities</text><text class="cell" x="500" y="126">Objective on board;</text><text class="cell" x="500" y="143">activities matched it.</text><text class="sh" x="44" y="188">Teaching methods</text><text class="sh" x="44" y="205">and strategies</text><text class="cell" x="240" y="188">The actual strategy, with</text><text class="cell" x="240" y="205">counts and materials</text><text class="cell" x="500" y="188">Explained place value for 12</text><text class="cell" x="500" y="205">minutes using sticks.</text><text class="sh" x="44" y="250">Teaching aids</text><text class="cell" x="240" y="250">Textbook, board, objects,</text><text class="cell" x="240" y="267">low-cost materials</text><text class="cell" x="500" y="250">3 bundles of 10 sticks;</text><text class="cell" x="500" y="267">no textbook used.</text><text class="sh" x="44" y="312">Pupil participation</text><text class="cell" x="240" y="312">How many answer, practise</text><text class="cell" x="240" y="329">or produce work</text><text class="cell" x="500" y="312">21 of 34 pupils practised</text><text class="cell" x="500" y="329">on slate paper.</text><text class="sh" x="44" y="374">Teacher questioning</text><text class="cell" x="240" y="374">Question types, who answers,</text><text class="cell" x="240" y="391">wait time</text><text class="cell" x="500" y="374">11 questions; 4 open-ended;</text><text class="cell" x="500" y="391">wait time about 2 seconds.</text><text id="label-caption" class="small" x="24" y="432">Each row asks for a record a reader could check, not an adjective.</text><text class="wm" x="768" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
