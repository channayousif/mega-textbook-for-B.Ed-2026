<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک آئینی قدر کلاس روم تک کیسے پہنچتی ہے</title><desc id="d">فلو چارٹ جو دکھاتا ہے کہ ایک آئینی قدر درس، سرگرمی، تامل اور پورے اسکول کے طریقۂ کار کے ذریعے کلاس روم میں کیسے پہنچتی ہے اور وہ طریقۂ کار اس قدر کو کیسے واپس مزید مضبوط کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><text class="h" x="24" y="32">ایک آئینی قدر کلاس روم تک کیسے پہنچتی ہے</text><rect class="panel-a" x="180" y="56" width="420" height="58" rx="8"/><text class="sh" x="390" y="80" text-anchor="middle">ایک آئینی قدر</text><text class="cell" x="390" y="100" text-anchor="middle">برابر شہریت، باہمی احترام، قانون کی حاکمی</text><line class="stroke" x1="390" y1="114" x2="390" y2="146" marker-end="url(#arrow)"/><rect class="panel" x="180" y="150" width="420" height="58" rx="8"/><text class="sh" x="390" y="174" text-anchor="middle">درس</text><text class="cell" x="390" y="194" text-anchor="middle">استاد آرٹیکل کی وضاحت کرتا ہے</text><line class="stroke" x1="390" y1="208" x2="390" y2="240" marker-end="url(#arrow)"/><rect class="panel" x="180" y="244" width="420" height="58" rx="8"/><text class="sh" x="390" y="268" text-anchor="middle">سرگرمی</text><text class="cell" x="390" y="288" text-anchor="middle">طلبہ حقیقی مسئلے پر کام کرتے ہیں</text><line class="stroke" x1="390" y1="302" x2="390" y2="334" marker-end="url(#arrow)"/><rect class="panel" x="180" y="338" width="420" height="58" rx="8"/><text class="sh" x="390" y="362" text-anchor="middle">تامل</text><text class="cell" x="390" y="382" text-anchor="middle">طلبہ تجربے کو قدر سے جوڑتے ہیں</text><line class="stroke" x1="390" y1="396" x2="390" y2="428" marker-end="url(#arrow)"/><rect class="panel-b" x="180" y="432" width="420" height="58" rx="8"/><text class="sh" x="390" y="456" text-anchor="middle">اسکول کا طریقۂ کار</text><text class="cell" x="390" y="476" text-anchor="middle">قدر اسکول کی زندگی کا حصہ بن جاتی ہے</text><path class="dash" d="M600 461 H715 V85 H602" marker-end="url(#arrowm)"/><text class="small" x="658" y="265" text-anchor="middle">طریقۂ کار قدر کو</text><text class="small" x="658" y="282" text-anchor="middle">مزید مضبوط کرتا ہے</text><text class="wm" x="768" y="550" text-anchor="end" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
