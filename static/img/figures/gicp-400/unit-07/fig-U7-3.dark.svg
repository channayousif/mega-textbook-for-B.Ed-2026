<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of national integration</title><desc id="d">Concept map of national integration. The central idea is unity in diversity, fed by shared constitutional values, respect for many languages, the four provinces in one federation, and the school's daily work of inclusion.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="32">National integration: unity in diversity</text><rect class="panel-a" x="24" y="52" width="240" height="104" rx="8"/><text class="sh" x="144" y="76" text-anchor="middle">Shared values</text><text class="cell" x="36" y="100">equal citizenship</text><text class="cell" x="36" y="120">mutual respect</text><text class="cell" x="36" y="140">rule of law</text><rect class="panel-b" x="516" y="52" width="240" height="104" rx="8"/><text class="sh" x="636" y="76" text-anchor="middle">Languages</text><text class="cell" x="528" y="100">Urdu as the national language</text><text class="cell" x="528" y="120">provincial languages protected</text><text class="cell" x="528" y="140">by Article 251</text><rect class="panel-c" x="24" y="314" width="240" height="104" rx="8"/><text class="sh" x="144" y="338" text-anchor="middle">Regions</text><text class="cell" x="36" y="362">four provinces</text><text class="cell" x="36" y="382">one federation</text><text class="cell" x="36" y="402">equal citizenship across both</text><rect class="panel-d" x="516" y="314" width="240" height="104" rx="8"/><text class="sh" x="636" y="338" text-anchor="middle">The school's role</text><text class="cell" x="528" y="362">inclusive curriculum</text><text class="cell" x="528" y="382">collaborative tasks</text><text class="cell" x="528" y="402">language respect</text><rect class="panel" x="270" y="196" width="240" height="78" rx="8"/><text class="h" x="390" y="228" text-anchor="middle">National integration</text><text class="cell" x="390" y="250" text-anchor="middle">one citizenship, many cultures</text><line class="stroke" x1="264" y1="120" x2="272" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="516" y1="120" x2="508" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="264" y1="356" x2="272" y2="252" marker-end="url(#arrow)"/><line class="stroke" x1="516" y1="356" x2="508" y2="252" marker-end="url(#arrow)"/><text class="small" x="390" y="446" text-anchor="middle">Arrows show what feeds the centre.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
