<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">شہری تعلیم کے لیے استاد کی ذمہ داریاں</title><desc id="d">شہری تعلیم کے لیے استاد کی پانچ ذمہ داریوں کی جدول، ہر ایک کے ساتھ اس کا مطلب اور کلاس روم کا مثال، آئین اور حقوق سکھانے سے لے کر منصفانہ اور غیر جانبدار رہنے تک۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="24" y="32">شہری تعلیم کے لیے استاد کی ذمہ داریاں</text><rect class="panel-a" x="24" y="44" width="736" height="36" rx="6"/><text class="sh" x="36" y="68">ذمہ داری</text><text class="sh" x="212" y="68">اس کا مطلب</text><text class="sh" x="460" y="68">کلاس روم کی مثال</text><line class="grid" x1="24" y1="88" x2="760" y2="88"/><rect class="panel" x="24" y="88" width="736" height="76" rx="6"/><text class="cell" x="36" y="112">آئین اور حقوق</text><text class="cell" x="36" y="132">سکھانا</text><text class="cell" x="212" y="112">آرٹیکل اور حقوق کی</text><text class="cell" x="212" y="132">سادہ زبان میں وضاحت</text><text class="cell" x="460" y="112">کلاس 9 کا درس آرٹیکل 25A</text><text class="cell" x="460" y="132">اور تعلیم کا حق</text><line class="grid" x1="24" y1="172" x2="760" y2="172"/><rect class="panel" x="24" y="172" width="736" height="76" rx="6"/><text class="cell" x="36" y="196">جمہوری عمل کا</text><text class="cell" x="36" y="216">نمونہ بنانا</text><text class="cell" x="212" y="196">کلاس روم کو منصفانہ</text><text class="cell" x="212" y="216">اور کھلے انداز میں چلانا</text><text class="cell" x="460" y="196">کلاس روم کے تنازعے میں</text><text class="cell" x="460" y="216">دونوں طرف کی بات سننا</text><line class="grid" x1="24" y1="256" x2="760" y2="256"/><rect class="panel" x="24" y="256" width="736" height="76" rx="6"/><text class="cell" x="36" y="280">شامل کرنے والا</text><text class="cell" x="36" y="300">کلاس روم</text><text class="cell" x="212" y="280">ہر طالب علم کو محسوس</text><text class="cell" x="212" y="300">کرانا کہ اس کی قدر ہو</text><text class="cell" x="460" y="280">مخلوط گروہی کام اور</text><text class="cell" x="460" y="300">زبان کا احترام</text><line class="grid" x1="24" y1="340" x2="760" y2="340"/><rect class="panel" x="24" y="340" width="736" height="76" rx="6"/><text class="cell" x="36" y="364">اسکول کو معاشرے</text><text class="cell" x="36" y="384">سے جوڑنا</text><text class="cell" x="212" y="364">سیکھنے کو عوامی</text><text class="cell" x="212" y="384">زندگی سے جوڑنا</text><text class="cell" x="460" y="364">مقامی کونسل کو خط</text><text class="cell" x="460" y="384">بند نالے کے بارے میں</text><line class="grid" x1="24" y1="424" x2="760" y2="424"/><rect class="panel" x="24" y="424" width="736" height="76" rx="6"/><text class="cell" x="36" y="448">منصفانہ رہنا</text><text class="cell" x="36" y="468">اور غیر جانبدار</text><text class="cell" x="212" y="448">آئین پڑھانا،</text><text class="cell" x="212" y="468">کسی جماعت کا نہیں</text><text class="cell" x="460" y="448">غیر موزوں سوال کا خیرمقدم</text><text class="cell" x="460" y="468">شواہد کے ساتھ کرنا</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>
