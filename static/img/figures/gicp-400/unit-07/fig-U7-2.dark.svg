<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Teacher responsibilities for civic education</title><desc id="d">Table of five teacher responsibilities for civic education, each with its meaning and a classroom example, from teaching the Constitution and rights to staying fair and non-partisan.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="24" y="32">Teacher responsibilities for civic education</text><rect class="panel-a" x="24" y="44" width="736" height="36" rx="6"/><text class="sh" x="36" y="68">Responsibility</text><text class="sh" x="212" y="68">What it means</text><text class="sh" x="460" y="68">Classroom example</text><line class="grid" x1="24" y1="88" x2="760" y2="88"/><rect class="panel" x="24" y="88" width="736" height="76" rx="6"/><text class="cell" x="36" y="112">Teaching the Constitution</text><text class="cell" x="36" y="132">and rights</text><text class="cell" x="212" y="112">explaining articles and rights</text><text class="cell" x="212" y="132">in plain words</text><text class="cell" x="460" y="112">a Class 9 lesson on Article 25A</text><text class="cell" x="460" y="132">and the right to education</text><line class="grid" x1="24" y1="172" x2="760" y2="172"/><rect class="panel" x="24" y="172" width="736" height="76" rx="6"/><text class="cell" x="36" y="196">Modelling democratic</text><text class="cell" x="36" y="216">practice</text><text class="cell" x="212" y="196">running the classroom fairly</text><text class="cell" x="212" y="216">and openly</text><text class="cell" x="460" y="196">hearing both sides in a</text><text class="cell" x="460" y="216">classroom dispute</text><line class="grid" x1="24" y1="256" x2="760" y2="256"/><rect class="panel" x="24" y="256" width="736" height="76" rx="6"/><text class="cell" x="36" y="280">Building an inclusive</text><text class="cell" x="36" y="300">classroom</text><text class="cell" x="212" y="280">making every pupil feel</text><text class="cell" x="212" y="300">valued and heard</text><text class="cell" x="460" y="280">mixed-group work and</text><text class="cell" x="460" y="300">language respect</text><line class="grid" x1="24" y1="340" x2="760" y2="340"/><rect class="panel" x="24" y="340" width="736" height="76" rx="6"/><text class="cell" x="36" y="364">Linking school</text><text class="cell" x="36" y="384">to community</text><text class="cell" x="212" y="364">connecting learning to</text><text class="cell" x="212" y="384">public life</text><text class="cell" x="460" y="364">a letter to the local council</text><text class="cell" x="460" y="384">about a blocked drain</text><line class="grid" x1="24" y1="424" x2="760" y2="424"/><rect class="panel" x="24" y="424" width="736" height="76" rx="6"/><text class="cell" x="36" y="448">Staying fair</text><text class="cell" x="36" y="468">and non-partisan</text><text class="cell" x="212" y="448">teaching the Constitution,</text><text class="cell" x="212" y="468">not a party</text><text class="cell" x="460" y="448">welcoming an awkward question</text><text class="cell" x="460" y="468">with evidence</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
