<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How a constitutional value reaches the classroom</title><desc id="d">Flowchart showing how a constitutional value travels into the classroom through a lesson, an activity, reflection and whole-school practice, and how the practice feeds back into the value.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><text class="h" x="24" y="32">How a constitutional value reaches the classroom</text><rect class="panel-a" x="180" y="56" width="420" height="58" rx="8"/><text class="sh" x="390" y="80" text-anchor="middle">A constitutional value</text><text class="cell" x="390" y="100" text-anchor="middle">equal citizenship, mutual respect, rule of law</text><line class="stroke" x1="390" y1="114" x2="390" y2="146" marker-end="url(#arrow)"/><rect class="panel" x="180" y="150" width="420" height="58" rx="8"/><text class="sh" x="390" y="174" text-anchor="middle">A lesson</text><text class="cell" x="390" y="194" text-anchor="middle">the teacher explains the article</text><line class="stroke" x1="390" y1="208" x2="390" y2="240" marker-end="url(#arrow)"/><rect class="panel" x="180" y="244" width="420" height="58" rx="8"/><text class="sh" x="390" y="268" text-anchor="middle">An activity</text><text class="cell" x="390" y="288" text-anchor="middle">pupils work on a real problem</text><line class="stroke" x1="390" y1="302" x2="390" y2="334" marker-end="url(#arrow)"/><rect class="panel" x="180" y="338" width="420" height="58" rx="8"/><text class="sh" x="390" y="362" text-anchor="middle">Reflection</text><text class="cell" x="390" y="382" text-anchor="middle">pupils connect the experience to the value</text><line class="stroke" x1="390" y1="396" x2="390" y2="428" marker-end="url(#arrow)"/><rect class="panel-b" x="180" y="432" width="420" height="58" rx="8"/><text class="sh" x="390" y="456" text-anchor="middle">School practice</text><text class="cell" x="390" y="476" text-anchor="middle">the value becomes part of the school's life</text><path class="dash" d="M600 461 H690 V85 H602" marker-end="url(#arrowm)"/><text class="small" x="698" y="275" text-anchor="middle">practice feeds the value</text><text class="wm" x="768" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
