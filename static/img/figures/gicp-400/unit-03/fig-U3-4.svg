<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">Power in the 1962 presidential system</title><desc id="d">Diagram illustrating the centralised power structure of the 1962 Constitution centered on the President, the Basic Democracies electoral college, and the National Assembly.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="650" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">Power in the 1962 presidential system</tspan></text><rect class="accent" x="210" y="65" width="360" height="160" rx="6"/><text class="label" x="230" y="95"><tspan x="230" dy="0">President</tspan></text><text class="body" x="230" y="123"><tspan x="230" dy="0">Head of state and government</tspan><tspan x="230" dy="23">Appoints ministers and governors</tspan><tspan x="230" dy="23">Strong veto and ordinance powers</tspan><tspan x="230" dy="23">Constitutional limits still apply</tspan></text><rect class="panel" x="24" y="285" width="310" height="120" rx="6"/><text class="label" x="40" y="315"><tspan x="40" dy="0">Governors and ministers</tspan></text><text class="body" x="40" y="343"><tspan x="40" dy="0">Appointed by the President</tspan><tspan x="40" dy="23">Executive responsibility to him</tspan></text><rect class="panel" x="444" y="285" width="310" height="120" rx="6"/><text class="label" x="460" y="315"><tspan x="460" dy="0">National Assembly</tspan></text><text class="body" x="460" y="343"><tspan x="460" dy="0">156 seats: 78 in each wing</tspan><tspan x="460" dy="23">Makes laws; limited budget votes</tspan></text><line class="link" x1="260" y1="225" x2="180" y2="280" marker-end="url(#arrow)"/><line class="link" x1="530" y1="225" x2="600" y2="280" marker-end="url(#arrow)"/><text class="body" x="36" y="261"><tspan x="36" dy="0">Appoints</tspan></text><text class="body" x="605" y="261"><tspan x="605" dy="0">Veto powers</tspan></text><rect class="accent" x="115" y="465" width="550" height="110" rx="6"/><text class="label" x="135" y="495"><tspan x="135" dy="0">Basic Democrats: indirect electoral college</tspan></text><text class="body" x="135" y="522"><tspan x="135" dy="0">80,000 local electors: 40,000 in each wing</tspan><tspan x="135" dy="23">Citizens directly elect these local representatives</tspan></text><line class="link" x1="390" y1="465" x2="390" y2="230" marker-end="url(#arrow)"/><text class="body" x="398" y="437"><tspan x="398" dy="0">Elects President</tspan></text><line class="link" x1="630" y1="465" x2="630" y2="410" marker-end="url(#arrow)"/><text class="body" x="24" y="612"><tspan x="24" dy="0">The same electoral college also chose national and provincial assemblies.</tspan></text><text class="wm" x="756" y="638" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
