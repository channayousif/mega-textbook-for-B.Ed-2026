<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئین سازی: چار سنگِ میل، 1947 تا 1956</title><desc id="d">پاکستان کے آئینی سنگِ میل کی ٹائم لائن: 1947 کے ترمیم شدہ عبوری آئین سے 1949 کی قراردادِ مقاصد اور 1954 میں اسمبلی کی تحلیل سے ہوتے ہوئے 1956 کے آئین تک۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">آئین سازی: چار سنگِ میل، 1947 تا 1956</tspan></text><rect class="accent" x="581" y="68" width="175" height="84" rx="6"/><text class="label" x="741" y="100" text-anchor="end"><tspan x="741" dy="0" text-anchor="end">اگست 1947</tspan></text><rect class="panel" x="25" y="68" width="510" height="84" rx="6"/><text class="label" x="517" y="99" text-anchor="end"><tspan x="517" dy="0" text-anchor="end">ترمیم شدہ ایکٹ 1935</tspan><tspan x="517" dy="23" text-anchor="end">عبوری ڈھانچہ</tspan></text><line class="link" x1="670" y1="152" x2="670" y2="179" marker-end="url(#arrow)"/><rect class="accent" x="581" y="180" width="175" height="84" rx="6"/><text class="label" x="741" y="212" text-anchor="end"><tspan x="741" dy="0" text-anchor="end">مارچ 1949</tspan></text><rect class="panel" x="25" y="180" width="510" height="84" rx="6"/><text class="label" x="517" y="211" text-anchor="end"><tspan x="517" dy="0" text-anchor="end">قراردادِ مقاصد</tspan><tspan x="517" dy="23" text-anchor="end">رہنما اصول</tspan></text><line class="link" x1="670" y1="264" x2="670" y2="291" marker-end="url(#arrow)"/><rect class="accent" x="581" y="292" width="175" height="84" rx="6"/><text class="label" x="741" y="324" text-anchor="end"><tspan x="741" dy="0" text-anchor="end">اکتوبر 1954</tspan></text><rect class="panel" x="25" y="292" width="510" height="84" rx="6"/><text class="label" x="517" y="323" text-anchor="end"><tspan x="517" dy="0" text-anchor="end">پہلی اسمبلی</tspan><tspan x="517" dy="23" text-anchor="end">تحلیل</tspan></text><line class="link" x1="670" y1="376" x2="670" y2="403" marker-end="url(#arrow)"/><rect class="accent" x="581" y="404" width="175" height="84" rx="6"/><text class="label" x="741" y="436" text-anchor="end"><tspan x="741" dy="0" text-anchor="end">مارچ 1956</tspan></text><rect class="panel" x="25" y="404" width="510" height="84" rx="6"/><text class="label" x="517" y="435" text-anchor="end"><tspan x="517" dy="0" text-anchor="end">پہلا آئین</tspan><tspan x="517" dy="23" text-anchor="end">اسلامی جمہوریہ</tspan></text><text class="wm" x="24" y="538" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
