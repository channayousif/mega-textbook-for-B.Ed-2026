<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">Objectives Resolution: principles and later texts</title><desc id="d">Table mapping key principles of the 1949 Objectives Resolution to their implementation in Pakistan's 1956, 1962, and 1973 constitutions.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="650" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">Objectives Resolution: principles and later texts</tspan></text><rect class="accent" x="24" y="62" width="155" height="56" rx="6"/><text class="label" x="36" y="95"><tspan x="36" dy="0">Principle</tspan></text><rect class="accent" x="185" y="62" width="275" height="56" rx="6"/><text class="label" x="197" y="95"><tspan x="197" dy="0">Meaning</tspan></text><rect class="accent" x="466" y="62" width="290" height="56" rx="6"/><text class="label" x="478" y="95"><tspan x="478" dy="0">Later location</tspan></text><rect class="panel" x="24" y="124" width="155" height="94" rx="6"/><text class="body" x="36" y="151"><tspan x="36" dy="0">Sovereignty</tspan></text><rect class="panel" x="185" y="124" width="275" height="94" rx="6"/><text class="body" x="197" y="151"><tspan x="197" dy="0">Allah is sovereign; public</tspan><tspan x="197" dy="23">authority is a sacred trust.</tspan></text><rect class="panel" x="466" y="124" width="290" height="94" rx="6"/><text class="body" x="478" y="151"><tspan x="478" dy="0">Preambles: 1956, 1962, 1973;</tspan><tspan x="478" dy="23">Article 2A added in 1985.</tspan></text><rect class="panel" x="24" y="224" width="155" height="94" rx="6"/><text class="body" x="36" y="251"><tspan x="36" dy="0">Representation</tspan></text><rect class="panel" x="185" y="224" width="275" height="94" rx="6"/><text class="body" x="197" y="251"><tspan x="197" dy="0">People govern through</tspan><tspan x="197" dy="23">chosen representatives.</tspan></text><rect class="panel" x="466" y="224" width="290" height="94" rx="6"/><text class="body" x="478" y="251"><tspan x="478" dy="0">Preambles; institutions differ</tspan><tspan x="478" dy="23">across the three constitutions.</tspan></text><rect class="panel" x="24" y="324" width="155" height="94" rx="6"/><text class="body" x="36" y="351"><tspan x="36" dy="0">Islamic values</tspan></text><rect class="panel" x="185" y="324" width="275" height="94" rx="6"/><text class="body" x="197" y="351"><tspan x="197" dy="0">Democracy, equality, tolerance</tspan><tspan x="197" dy="23">and social justice guide life.</tspan></text><rect class="panel" x="466" y="324" width="290" height="94" rx="6"/><text class="body" x="478" y="351"><tspan x="478" dy="0">Preambles; 1973 Principles</tspan><tspan x="478" dy="23">of Policy, including Article 31.</tspan></text><rect class="panel" x="24" y="424" width="155" height="94" rx="6"/><text class="body" x="36" y="451"><tspan x="36" dy="0">Rights and</tspan><tspan x="36" dy="23">minorities</tspan></text><rect class="panel" x="185" y="424" width="275" height="94" rx="6"/><text class="body" x="197" y="451"><tspan x="197" dy="0">Rights, religious practice</tspan><tspan x="197" dy="23">and cultures are protected.</tspan></text><rect class="panel" x="466" y="424" width="290" height="94" rx="6"/><text class="body" x="478" y="451"><tspan x="478" dy="0">1956 rights; 1962 rights added</tspan><tspan x="478" dy="23">in 1964; 1973 rights chapter.</tspan></text><rect class="panel" x="24" y="524" width="155" height="94" rx="6"/><text class="body" x="36" y="551"><tspan x="36" dy="0">Independent</tspan><tspan x="36" dy="23">judiciary</tspan></text><rect class="panel" x="185" y="524" width="275" height="94" rx="6"/><text class="body" x="197" y="551"><tspan x="197" dy="0">Courts should be free</tspan><tspan x="197" dy="23">from executive interference.</tspan></text><rect class="panel" x="466" y="524" width="290" height="94" rx="6"/><text class="body" x="478" y="551"><tspan x="478" dy="0">Stated in the preambles;</tspan><tspan x="478" dy="23">practice needs separate scrutiny.</tspan></text><text class="wm" x="756" y="638" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
