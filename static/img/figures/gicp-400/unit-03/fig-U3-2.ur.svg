<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قراردادِ مقاصد: اصول اور بعد کے متون</title><desc id="d">جدول جس میں 1949 کی قراردادِ مقاصد کے اہم اصولوں کو پاکستان کے 1956، 1962 اور 1973 کے آئینوں میں ان کے نفاذ سے ملایا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="650" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">قراردادِ مقاصد: اصول اور بعد کے متون</tspan></text><rect class="accent" x="601" y="62" width="155" height="56" rx="6"/><text class="label" x="744" y="95" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">اصول</tspan></text><rect class="accent" x="320" y="62" width="275" height="56" rx="6"/><text class="label" x="583" y="95" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">مفہوم</tspan></text><rect class="accent" x="24" y="62" width="290" height="56" rx="6"/><text class="label" x="302" y="95" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">بعد کا مقام</tspan></text><rect class="panel" x="601" y="124" width="155" height="94" rx="6"/><text class="body" x="744" y="151" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">حاکمیت</tspan></text><rect class="panel" x="320" y="124" width="275" height="94" rx="6"/><text class="body" x="583" y="151" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">حاکمیت اللہ کی ہے؛ عوامی</tspan><tspan x="583" dy="23" text-anchor="end">اختیار ایک مقدس امانت ہے۔</tspan></text><rect class="panel" x="24" y="124" width="290" height="94" rx="6"/><text class="body" x="302" y="151" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">دیباچے: 1956، 1962، 1973؛</tspan><tspan x="302" dy="23" text-anchor="end">دفعہ 2A کا اضافہ 1985 میں۔</tspan></text><rect class="panel" x="601" y="224" width="155" height="94" rx="6"/><text class="body" x="744" y="251" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">نمائندگی</tspan></text><rect class="panel" x="320" y="224" width="275" height="94" rx="6"/><text class="body" x="583" y="251" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">عوام منتخب نمائندوں کے</tspan><tspan x="583" dy="23" text-anchor="end">ذریعے حکومت کرتے ہیں۔</tspan></text><rect class="panel" x="24" y="224" width="290" height="94" rx="6"/><text class="body" x="302" y="251" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">دیباچے؛ تینوں آئینوں میں</tspan><tspan x="302" dy="23" text-anchor="end">ادارے مختلف ہیں۔</tspan></text><rect class="panel" x="601" y="324" width="155" height="94" rx="6"/><text class="body" x="744" y="351" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">اسلامی اقدار</tspan></text><rect class="panel" x="320" y="324" width="275" height="94" rx="6"/><text class="body" x="583" y="351" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">جمہوریت، مساوات، رواداری اور</tspan><tspan x="583" dy="23" text-anchor="end">سماجی انصاف زندگی کے رہنما ہیں۔</tspan></text><rect class="panel" x="24" y="324" width="290" height="94" rx="6"/><text class="body" x="302" y="351" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">دیباچے؛ 1973 میں حکمتِ عملی کے</tspan><tspan x="302" dy="23" text-anchor="end">اصول، بشمول دفعہ 31۔</tspan></text><rect class="panel" x="601" y="424" width="155" height="94" rx="6"/><text class="body" x="744" y="451" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">حقوق اور</tspan><tspan x="744" dy="23" text-anchor="end">اقلیتیں</tspan></text><rect class="panel" x="320" y="424" width="275" height="94" rx="6"/><text class="body" x="583" y="451" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">حقوق، مذہبی عمل اور</tspan><tspan x="583" dy="23" text-anchor="end">ثقافتوں کا تحفظ ہے۔</tspan></text><rect class="panel" x="24" y="424" width="290" height="94" rx="6"/><text class="body" x="302" y="451" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">1956 کے حقوق؛ 1962 میں حقوق کا</tspan><tspan x="302" dy="23" text-anchor="end">اضافہ 1964 میں؛ 1973 کا حقوق کا باب۔</tspan></text><rect class="panel" x="601" y="524" width="155" height="94" rx="6"/><text class="body" x="744" y="551" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">آزاد</tspan><tspan x="744" dy="23" text-anchor="end">عدلیہ</tspan></text><rect class="panel" x="320" y="524" width="275" height="94" rx="6"/><text class="body" x="583" y="551" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">عدالتوں کو انتظامیہ کی</tspan><tspan x="583" dy="23" text-anchor="end">مداخلت سے آزاد ہونا چاہیے۔</tspan></text><rect class="panel" x="24" y="524" width="290" height="94" rx="6"/><text class="body" x="302" y="551" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">دیباچوں میں مذکور؛</tspan><tspan x="302" dy="23" text-anchor="end">عمل کی الگ جانچ ضروری ہے۔</tspan></text><text class="wm" x="24" y="638" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
