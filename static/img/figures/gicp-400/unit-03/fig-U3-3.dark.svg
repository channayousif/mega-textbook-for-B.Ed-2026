<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 750" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">Comparing the 1956 and 1962 constitutions</title><desc id="d">Table comparing the 1956 and 1962 constitutions across government system, legislature, executive authority, electoral system, and fundamental rights.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="750" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">Comparing the 1956 and 1962 constitutions</tspan></text><rect class="accent" x="24" y="62" width="155" height="56" rx="6"/><text class="label" x="36" y="95"><tspan x="36" dy="0">Dimension</tspan></text><rect class="accent" x="185" y="62" width="275" height="56" rx="6"/><text class="label" x="197" y="95"><tspan x="197" dy="0">1956</tspan></text><rect class="accent" x="466" y="62" width="290" height="56" rx="6"/><text class="label" x="478" y="95"><tspan x="478" dy="0">1962</tspan></text><rect class="panel" x="24" y="124" width="155" height="94" rx="6"/><text class="body" x="36" y="151"><tspan x="36" dy="0">Government</tspan></text><rect class="panel" x="185" y="124" width="275" height="94" rx="6"/><text class="body" x="197" y="151"><tspan x="197" dy="0">Parliamentary: cabinet needs</tspan><tspan x="197" dy="23">Assembly confidence.</tspan></text><rect class="panel" x="466" y="124" width="290" height="94" rx="6"/><text class="body" x="478" y="151"><tspan x="478" dy="0">Presidential: ministers</tspan><tspan x="478" dy="23">answer to the President.</tspan></text><rect class="panel" x="24" y="224" width="155" height="94" rx="6"/><text class="body" x="36" y="251"><tspan x="36" dy="0">Legislature</tspan></text><rect class="panel" x="185" y="224" width="275" height="94" rx="6"/><text class="body" x="197" y="251"><tspan x="197" dy="0">One chamber: 300 general</tspan><tspan x="197" dy="23">seats plus 10 women’s seats.</tspan></text><rect class="panel" x="466" y="224" width="290" height="94" rx="6"/><text class="body" x="478" y="251"><tspan x="478" dy="0">One chamber: 156 seats,</tspan><tspan x="478" dy="23">including 6 women’s seats.</tspan></text><rect class="panel" x="24" y="324" width="155" height="94" rx="6"/><text class="body" x="36" y="351"><tspan x="36" dy="0">Federal structure</tspan></text><rect class="panel" x="185" y="324" width="275" height="94" rx="6"/><text class="body" x="197" y="351"><tspan x="197" dy="0">East and West Pakistan;</tspan><tspan x="197" dy="23">equal wing representation.</tspan></text><rect class="panel" x="466" y="324" width="290" height="94" rx="6"/><text class="body" x="478" y="351"><tspan x="478" dy="0">East and West Pakistan;</tspan><tspan x="478" dy="23">central executive dominant.</tspan></text><rect class="panel" x="24" y="424" width="155" height="94" rx="6"/><text class="body" x="36" y="451"><tspan x="36" dy="0">National elections</tspan></text><rect class="panel" x="185" y="424" width="275" height="94" rx="6"/><text class="body" x="197" y="451"><tspan x="197" dy="0">Direct adult voting provided;</tspan><tspan x="197" dy="23">no general election held.</tspan></text><rect class="panel" x="466" y="424" width="290" height="94" rx="6"/><text class="body" x="478" y="451"><tspan x="478" dy="0">Indirect: 80,000 local electors</tspan><tspan x="478" dy="23">choose national representatives.</tspan></text><rect class="panel" x="24" y="524" width="155" height="94" rx="6"/><text class="body" x="36" y="551"><tspan x="36" dy="0">Rights</tspan></text><rect class="panel" x="185" y="524" width="275" height="94" rx="6"/><text class="body" x="197" y="551"><tspan x="197" dy="0">Court-enforceable rights</tspan><tspan x="197" dy="23">included from the start.</tspan></text><rect class="panel" x="466" y="524" width="290" height="94" rx="6"/><text class="body" x="478" y="551"><tspan x="478" dy="0">Initially not enforceable;</tspan><tspan x="478" dy="23">rights added in 1964.</tspan></text><rect class="panel" x="24" y="624" width="155" height="94" rx="6"/><text class="body" x="36" y="651"><tspan x="36" dy="0">Islamic provisions</tspan></text><rect class="panel" x="185" y="624" width="275" height="94" rx="6"/><text class="body" x="197" y="651"><tspan x="197" dy="0">Islamic Republic; Muslim</tspan><tspan x="197" dy="23">President; Islamic law clause.</tspan></text><rect class="panel" x="466" y="624" width="290" height="94" rx="6"/><text class="body" x="478" y="651"><tspan x="478" dy="0">Muslim President; advisory</tspan><tspan x="478" dy="23">Islamic council; title restored.</tspan></text><text class="wm" x="756" y="738" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
