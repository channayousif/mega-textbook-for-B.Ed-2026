<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, &apos;Segoe UI&apos;, Roboto, sans-serif"><title id="t">Constitution-making: four milestones, 1947-1956</title><desc id="d">Timeline of Pakistan constitutional milestones from the 1947 adapted interim constitution through the 1949 Objectives Resolution and 1954 assembly dissolution to the 1956 Constitution.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550" rx="6"/><text class="h" x="24" y="34"><tspan x="24" dy="0">Constitution-making: four milestones, 1947-1956</tspan></text><rect class="accent" x="24" y="68" width="175" height="84" rx="6"/><text class="label" x="39" y="100"><tspan x="39" dy="0">August 1947</tspan></text><rect class="panel" x="245" y="68" width="510" height="84" rx="6"/><text class="label" x="263" y="99"><tspan x="263" dy="0">Adapted 1935 Act</tspan><tspan x="263" dy="23">Interim framework</tspan></text><line class="link" x1="110" y1="152" x2="110" y2="179" marker-end="url(#arrow)"/><rect class="accent" x="24" y="180" width="175" height="84" rx="6"/><text class="label" x="39" y="212"><tspan x="39" dy="0">March 1949</tspan></text><rect class="panel" x="245" y="180" width="510" height="84" rx="6"/><text class="label" x="263" y="211"><tspan x="263" dy="0">Objectives Resolution</tspan><tspan x="263" dy="23">Guiding principles</tspan></text><line class="link" x1="110" y1="264" x2="110" y2="291" marker-end="url(#arrow)"/><rect class="accent" x="24" y="292" width="175" height="84" rx="6"/><text class="label" x="39" y="324"><tspan x="39" dy="0">October 1954</tspan></text><rect class="panel" x="245" y="292" width="510" height="84" rx="6"/><text class="label" x="263" y="323"><tspan x="263" dy="0">First Assembly</tspan><tspan x="263" dy="23">dissolved</tspan></text><line class="link" x1="110" y1="376" x2="110" y2="403" marker-end="url(#arrow)"/><rect class="accent" x="24" y="404" width="175" height="84" rx="6"/><text class="label" x="39" y="436"><tspan x="39" dy="0">March 1956</tspan></text><rect class="panel" x="245" y="404" width="510" height="84" rx="6"/><text class="label" x="263" y="435"><tspan x="263" dy="0">First constitution</tspan><tspan x="263" dy="23">Islamic Republic</tspan></text><text class="wm" x="756" y="538" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
