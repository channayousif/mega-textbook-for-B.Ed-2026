<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 650" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1962 کے صدارتی نظام میں طاقت</title><desc id="d">خاکہ جس میں 1962 کے آئین کا مرکزی طاقت کا ڈھانچہ دکھایا گیا ہے، جس کے مرکز میں صدر، بنیادی جمہوریتوں کا انتخابی ادارہ اور قومی اسمبلی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="650" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">1962 کے صدارتی نظام میں طاقت</tspan></text><rect class="accent" x="210" y="65" width="360" height="160" rx="6"/><text class="label" x="550" y="95" text-anchor="end"><tspan x="550" dy="0" text-anchor="end">صدر</tspan></text><text class="body" x="550" y="123" text-anchor="end"><tspan x="550" dy="0" text-anchor="end">سربراہِ مملکت اور سربراہِ حکومت</tspan><tspan x="550" dy="23" text-anchor="end">وزرا اور گورنروں کا تقرر</tspan><tspan x="550" dy="23" text-anchor="end">ویٹو اور آرڈیننس کے مضبوط اختیارات</tspan><tspan x="550" dy="23" text-anchor="end">آئینی حدود پھر بھی لاگو</tspan></text><rect class="panel" x="446" y="285" width="310" height="120" rx="6"/><text class="label" x="740" y="315" text-anchor="end"><tspan x="740" dy="0" text-anchor="end">گورنر اور وزرا</tspan></text><text class="body" x="740" y="343" text-anchor="end"><tspan x="740" dy="0" text-anchor="end">صدر کے مقرر کردہ</tspan><tspan x="740" dy="23" text-anchor="end">انتظامی جوابدہی صدر کے سامنے</tspan></text><rect class="panel" x="26" y="285" width="310" height="120" rx="6"/><text class="label" x="320" y="315" text-anchor="end"><tspan x="320" dy="0" text-anchor="end">قومی اسمبلی</tspan></text><text class="body" x="320" y="343" text-anchor="end"><tspan x="320" dy="0" text-anchor="end">156 نشستیں: ہر بازو میں 78</tspan><tspan x="320" dy="23" text-anchor="end">قانون سازی؛ بجٹ پر محدود ووٹ</tspan></text><line class="link" x1="520" y1="225" x2="600" y2="280" marker-end="url(#arrow)"/><line class="link" x1="250" y1="225" x2="180" y2="280" marker-end="url(#arrow)"/><text class="body" x="744" y="261" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">تقرر</tspan></text><text class="body" x="175" y="261" text-anchor="end"><tspan x="175" dy="0" text-anchor="end">ویٹو کے اختیارات</tspan></text><rect class="accent" x="115" y="465" width="550" height="110" rx="6"/><text class="label" x="645" y="495" text-anchor="end"><tspan x="645" dy="0" text-anchor="end">بنیادی جمہوری ارکان: بالواسطہ انتخابی ادارہ</tspan></text><text class="body" x="645" y="522" text-anchor="end"><tspan x="645" dy="0" text-anchor="end">80,000 مقامی انتخاب کنندگان: ہر بازو میں 40,000</tspan><tspan x="645" dy="23" text-anchor="end">شہری ان مقامی نمائندوں کو براہِ راست چنتے ہیں</tspan></text><line class="link" x1="390" y1="465" x2="390" y2="230" marker-end="url(#arrow)"/><text class="body" x="382" y="437" text-anchor="end"><tspan x="382" dy="0" text-anchor="end">صدر کا انتخاب</tspan></text><line class="link" x1="150" y1="465" x2="150" y2="410" marker-end="url(#arrow)"/><text class="body" x="756" y="612" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">یہی انتخابی ادارہ قومی اور صوبائی اسمبلیاں بھی چنتا تھا۔</tspan></text><text class="wm" x="24" y="638" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
