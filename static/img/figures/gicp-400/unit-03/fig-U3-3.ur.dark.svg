<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 750" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">1956 اور 1962 کے آئینوں کا موازنہ</title><desc id="d">جدول جس میں 1956 اور 1962 کے آئینوں کا نظامِ حکومت، مقننہ، انتظامی اختیار، انتخابی نظام اور بنیادی حقوق کے لحاظ سے موازنہ کیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}text{fill:var(--ink);font-size:14px}.body{fill:var(--ink);font-size:14px}.h{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:600}.wm{font-size:11px;fill:var(--wm)}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="750" rx="6"/><text class="h" x="756" y="34" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">1956 اور 1962 کے آئینوں کا موازنہ</tspan></text><rect class="accent" x="601" y="62" width="155" height="56" rx="6"/><text class="label" x="744" y="95" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">پہلو</tspan></text><rect class="accent" x="320" y="62" width="275" height="56" rx="6"/><text class="label" x="583" y="95" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">1956</tspan></text><rect class="accent" x="24" y="62" width="290" height="56" rx="6"/><text class="label" x="302" y="95" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">1962</tspan></text><rect class="panel" x="601" y="124" width="155" height="94" rx="6"/><text class="body" x="744" y="151" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">حکومت</tspan></text><rect class="panel" x="320" y="124" width="275" height="94" rx="6"/><text class="body" x="583" y="151" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">پارلیمانی: کابینہ کو اسمبلی کے</tspan><tspan x="583" dy="23" text-anchor="end">اعتماد کی ضرورت۔</tspan></text><rect class="panel" x="24" y="124" width="290" height="94" rx="6"/><text class="body" x="302" y="151" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">صدارتی: وزرا صدر کو</tspan><tspan x="302" dy="23" text-anchor="end">جوابدہ۔</tspan></text><rect class="panel" x="601" y="224" width="155" height="94" rx="6"/><text class="body" x="744" y="251" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">مقننہ</tspan></text><rect class="panel" x="320" y="224" width="275" height="94" rx="6"/><text class="body" x="583" y="251" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">ایک ایوان: 300 عام نشستیں اور</tspan><tspan x="583" dy="23" text-anchor="end">خواتین کی 10 نشستیں۔</tspan></text><rect class="panel" x="24" y="224" width="290" height="94" rx="6"/><text class="body" x="302" y="251" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">ایک ایوان: 156 نشستیں، جن میں</tspan><tspan x="302" dy="23" text-anchor="end">خواتین کی 6 نشستیں شامل۔</tspan></text><rect class="panel" x="601" y="324" width="155" height="94" rx="6"/><text class="body" x="744" y="351" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">وفاقی ڈھانچہ</tspan></text><rect class="panel" x="320" y="324" width="275" height="94" rx="6"/><text class="body" x="583" y="351" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">مشرقی اور مغربی پاکستان؛</tspan><tspan x="583" dy="23" text-anchor="end">بازوؤں کی مساوی نمائندگی۔</tspan></text><rect class="panel" x="24" y="324" width="290" height="94" rx="6"/><text class="body" x="302" y="351" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">مشرقی اور مغربی پاکستان؛</tspan><tspan x="302" dy="23" text-anchor="end">مرکزی انتظامیہ کا غلبہ۔</tspan></text><rect class="panel" x="601" y="424" width="155" height="94" rx="6"/><text class="body" x="744" y="451" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">قومی انتخابات</tspan></text><rect class="panel" x="320" y="424" width="275" height="94" rx="6"/><text class="body" x="583" y="451" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">براہِ راست بالغ ووٹ کی گنجائش؛</tspan><tspan x="583" dy="23" text-anchor="end">عام انتخاب نہیں ہوا۔</tspan></text><rect class="panel" x="24" y="424" width="290" height="94" rx="6"/><text class="body" x="302" y="451" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">بالواسطہ: 80,000 مقامی ارکان</tspan><tspan x="302" dy="23" text-anchor="end">قومی نمائندے چنتے ہیں۔</tspan></text><rect class="panel" x="601" y="524" width="155" height="94" rx="6"/><text class="body" x="744" y="551" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">حقوق</tspan></text><rect class="panel" x="320" y="524" width="275" height="94" rx="6"/><text class="body" x="583" y="551" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">عدالت سے قابلِ نفاذ حقوق</tspan><tspan x="583" dy="23" text-anchor="end">شروع سے شامل۔</tspan></text><rect class="panel" x="24" y="524" width="290" height="94" rx="6"/><text class="body" x="302" y="551" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">شروع میں ناقابلِ نفاذ؛</tspan><tspan x="302" dy="23" text-anchor="end">حقوق 1964 میں شامل۔</tspan></text><rect class="panel" x="601" y="624" width="155" height="94" rx="6"/><text class="body" x="744" y="651" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">اسلامی دفعات</tspan></text><rect class="panel" x="320" y="624" width="275" height="94" rx="6"/><text class="body" x="583" y="651" text-anchor="end"><tspan x="583" dy="0" text-anchor="end">اسلامی جمہوریہ؛ مسلمان صدر؛</tspan><tspan x="583" dy="23" text-anchor="end">اسلامی قانون کی شق۔</tspan></text><rect class="panel" x="24" y="624" width="290" height="94" rx="6"/><text class="body" x="302" y="651" text-anchor="end"><tspan x="302" dy="0" text-anchor="end">مسلمان صدر؛ مشاورتی اسلامی</tspan><tspan x="302" dy="23" text-anchor="end">کونسل؛ نام بحال۔</tspan></text><text class="wm" x="24" y="738" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
