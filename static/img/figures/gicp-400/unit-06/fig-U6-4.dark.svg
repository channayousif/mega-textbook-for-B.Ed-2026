<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 335" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing the 18th, 19th and 25th Amendments</title><desc id="d">Table comparing the 18th, 19th and 25th Amendments by year, main change and effect on federalism. The 18th, 2010, removed the Concurrent List, limited the President's powers, added rights and created the Judicial Commission; its effect was large, with law-making and resources moving toward the Provinces. The 19th, in force 2011, changed how judges are appointed under Article 175A; its effect was small and indirect. The 25th, 2018, merged the tribal areas into the Provinces and reduced seats in both Houses; its effect was large for the merged areas, where federal rule ended and provincial government began.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="335"/><text class="h" x="24" y="30">Three amendments compared</text><rect class="panel" x="24" y="42" width="732" height="32" rx="6"/><text class="sh" x="32" y="63">Amendment</text><text class="sh" x="144" y="63">Year</text><text class="sh" x="218" y="63">Main change</text><text class="sh" x="488" y="63">Effect on federalism</text><rect class="panel-a" x="24" y="74" width="732" height="92" rx="6"/><text class="sh" x="32" y="98">18th</text><text class="cell" x="144" y="98">2010</text><text class="cell" x="218" y="98">Removed the Concurrent List,</text><text class="cell" x="218" y="115">limited the President's powers,</text><text class="cell" x="218" y="132">added rights and created the</text><text class="cell" x="218" y="149">Judicial Commission</text><text class="cell" x="488" y="98">Large: law-making and resources</text><text class="cell" x="488" y="115">moved toward the Provinces, and</text><text class="cell" x="488" y="132">shared councils grew stronger</text><rect class="panel-b" x="24" y="166" width="732" height="58" rx="6"/><text class="sh" x="32" y="190">19th</text><text class="cell" x="144" y="190">In force</text><text class="cell" x="144" y="207">2011</text><text class="cell" x="218" y="190">Changed how judges are appointed</text><text class="cell" x="218" y="207">under Article 175A</text><text class="cell" x="488" y="190">Small and indirect</text><rect class="panel-c" x="24" y="224" width="732" height="75" rx="6"/><text class="sh" x="32" y="248">25th</text><text class="cell" x="144" y="248">2018</text><text class="cell" x="218" y="248">Merged the tribal areas into the</text><text class="cell" x="218" y="265">Provinces and reduced seats in both</text><text class="cell" x="218" y="282">Houses</text><text class="cell" x="488" y="248">Large for the merged areas: federal</text><text class="cell" x="488" y="265">rule ended and provincial government</text><text class="cell" x="488" y="282">began</text><text class="wm" x="768" y="325" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
