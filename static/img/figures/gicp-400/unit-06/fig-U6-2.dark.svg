<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 437" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing the legislature, the executive and the judiciary</title><desc id="d">Table comparing the legislature, the executive and the judiciary. The legislature is the President, the National Assembly and the Senate; voters and party lists fill the Assembly and Provincial Assemblies elect the Senate; it makes federal laws, controls federal money, holds the government to account and amends the Constitution. The executive is the President, the Prime Minister and the Federal Ministers; an electoral college elects the President, the National Assembly elects the Prime Minister, and ministers are appointed on the Prime Minister's advice; it carries out the law and runs the government. The judiciary is the judges of the courts; for the superior courts the Judicial Commission nominates and the President appoints; it interprets the law, decides disputes and enforces rights.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="437"/><text class="h" x="24" y="30">Who is in each organ, how they are chosen, and what they do</text><rect class="panel" x="24" y="42" width="732" height="32" rx="6"/><text class="sh" x="32" y="63">Organ</text><text class="sh" x="134" y="63">Who is in it</text><text class="sh" x="324" y="63">How they are chosen</text><text class="sh" x="554" y="63">Main powers</text><rect class="panel-a" x="24" y="74" width="732" height="109" rx="6"/><text class="sh" x="32" y="98">Legislature</text><text class="cell" x="134" y="98">President, National</text><text class="cell" x="134" y="115">Assembly and Senate</text><text class="cell" x="324" y="98">Voters and party lists fill</text><text class="cell" x="324" y="115">the Assembly. Provincial</text><text class="cell" x="324" y="132">Assemblies elect the Senate</text><text class="cell" x="554" y="98">Makes federal laws,</text><text class="cell" x="554" y="115">controls federal money,</text><text class="cell" x="554" y="132">holds the government to</text><text class="cell" x="554" y="149">account, amends the</text><text class="cell" x="554" y="166">Constitution</text><rect class="panel-b" x="24" y="183" width="732" height="126" rx="6"/><text class="sh" x="32" y="207">Executive</text><text class="cell" x="134" y="207">President, Prime</text><text class="cell" x="134" y="224">Minister and Federal</text><text class="cell" x="134" y="241">Ministers</text><text class="cell" x="324" y="207">An electoral college elects</text><text class="cell" x="324" y="224">the President. The National</text><text class="cell" x="324" y="241">Assembly elects the Prime</text><text class="cell" x="324" y="258">Minister. Ministers are</text><text class="cell" x="324" y="275">appointed on the Prime</text><text class="cell" x="324" y="292">Minister's advice</text><text class="cell" x="554" y="207">Carries out the law and</text><text class="cell" x="554" y="224">runs the government through</text><text class="cell" x="554" y="241">the Prime Minister</text><rect class="panel-c" x="24" y="309" width="732" height="92" rx="6"/><text class="sh" x="32" y="333">Judiciary</text><text class="cell" x="134" y="333">Judges of the courts</text><text class="cell" x="324" y="333">For the superior courts, the</text><text class="cell" x="324" y="350">Judicial Commission nominates</text><text class="cell" x="324" y="367">and the President appoints</text><text class="cell" x="324" y="384">(Article 175A)</text><text class="cell" x="554" y="333">Interprets the law, decides</text><text class="cell" x="554" y="350">disputes and enforces</text><text class="cell" x="554" y="367">rights</text><text class="wm" x="768" y="427" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
