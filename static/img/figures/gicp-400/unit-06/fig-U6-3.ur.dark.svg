<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1472.0" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آرٹیکل 239 کے تحت آئینی ترمیم کا بہاؤ خاکہ</title><desc id="d">آرٹیکل 239 کے تحت آئینی ترمیم کا بہاؤ خاکہ۔ بل کسی بھی ایوان سے شروع ہوتا ہے اور وہاں کل رکنیت کے دو تہائی، پھر دوسرے ایوان کی کل رکنیت کے دو تہائی ووٹ درکار ہیں؛ کسی بھی جگہ ووٹ کم ہوں تو بل ناکام ہوتا ہے۔ دوسرا ایوان بل بدلے تو پہلے ایوان کو بدلا ہوا بل اپنی کل رکنیت کے دو تہائی سے منظور کرنا ہوتا ہے۔ صوبے کی حدود بدلنے والے بل کو اس صوبائی اسمبلی کی کل رکنیت کے دو تہائی ووٹ بھی درکار ہیں۔ پھر بل صدر کی منظوری کے لیے جاتا ہے اور آئین میں ترمیم ہوتی ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0.0" width="780" height="1472.0"/><text class="h" x="756" y="69.0" text-anchor="end">آئینی ترمیم کا بل کیسے منظور ہوتا ہے (آرٹیکل 239)</text><rect class="panel" x="240" y="101.2" width="300" height="85.1" rx="6"/><text class="sh" x="390" y="151.8" text-anchor="middle">کسی بھی ایوان میں بل پیش</text><line class="stroke" x1="390" y1="186.3" x2="390" y2="243.8" marker-end="url(#arrow)"/><rect class="panel-b" x="240" y="248.4" width="300" height="124.2" rx="20"/><text class="cell" x="390" y="299.0" text-anchor="middle">اس ایوان کی کل رکنیت کے</text><text class="cell" x="390" y="338.1" text-anchor="middle">دو تہائی سے منظور؟</text><text class="small" x="382" y="427.8" text-anchor="end">ہاں</text><line class="stroke" x1="390" y1="372.6" x2="390" y2="437.0" marker-end="url(#arrow)"/><rect class="panel" x="240" y="441.6" width="300" height="85.1" rx="6"/><text class="sh" x="390" y="492.2" text-anchor="middle">دوسرے ایوان کو ارسال</text><line class="stroke" x1="390" y1="526.7" x2="390" y2="584.2" marker-end="url(#arrow)"/><rect class="panel-b" x="240" y="588.8" width="300" height="124.2" rx="20"/><text class="cell" x="390" y="639.4" text-anchor="middle">اس کی کل رکنیت کے</text><text class="cell" x="390" y="678.5" text-anchor="middle">دو تہائی سے منظور؟</text><text class="small" x="382" y="768.2" text-anchor="end">ہاں</text><line class="stroke" x1="390" y1="713.0" x2="390" y2="777.4" marker-end="url(#arrow)"/><rect class="panel-d" x="24" y="266.8" width="156" height="85.1" rx="6"/><text class="sh" x="102" y="317.4" text-anchor="middle">بل ناکام</text><line class="stroke" x1="240" y1="310.5" x2="182" y2="310.5" marker-end="url(#arrow)"/><text class="small" x="232" y="294.4" text-anchor="end">نہیں</text><path class="stroke" d="M240 650.9 L102 650.9 L102 356.5" marker-end="M 540 650.9 L 678 650.9 L 678 356.5"/><text class="small" x="232" y="634.8" text-anchor="end">نہیں</text><rect class="panel-a" x="566" y="588.8" width="190" height="202.4" rx="6"/><text class="cell" x="661" y="639.4" text-anchor="middle">تبدیلی کے ساتھ منظور:</text><text class="cell" x="661" y="678.5" text-anchor="middle">پہلا ایوان بدلا ہوا بل</text><text class="cell" x="661" y="717.6" text-anchor="middle">اپنی کل رکنیت کے</text><text class="cell" x="661" y="756.7" text-anchor="middle">دو تہائی سے منظور کرے</text><line class="stroke" x1="540" y1="650.9" x2="564" y2="650.9" marker-end="url(#arrow)"/><path class="stroke" d="M661 791.2 L661 841.8 L542 841.8" marker-end="M 119 791.2 L 119 841.8 L 238 841.8"/><rect class="panel-b" x="240" y="782.0" width="300" height="124.2" rx="20"/><text class="cell" x="390" y="832.6" text-anchor="middle">کیا کسی صوبے کی</text><text class="cell" x="390" y="871.7" text-anchor="middle">حدود بدلیں گی؟</text><text class="small" x="382" y="961.4" text-anchor="end">نہیں</text><line class="stroke" x1="390" y1="906.2" x2="390" y2="1021.2" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="759.0" width="160" height="202.4" rx="6"/><text class="cell" x="104" y="809.6" text-anchor="middle">متعلقہ صوبائی</text><text class="cell" x="104" y="848.7" text-anchor="middle">اسمبلی اپنی</text><text class="cell" x="104" y="887.8" text-anchor="middle">کل رکنیت کے دو</text><text class="cell" x="104" y="926.9" text-anchor="middle">تہائی سے منظور کرے</text><line class="stroke" x1="240" y1="841.8" x2="186" y2="841.8" marker-end="url(#arrow)"/><text class="small" x="232" y="825.7" text-anchor="end">ہاں</text><path class="stroke" d="M104 956.8 L104 1069.5 L238 1069.5" marker-end="M 676 956.8 L 676 1069.5 L 542 1069.5"/><rect class="panel" x="240" y="1025.8" width="300" height="124.2" rx="6"/><text class="sh" x="390" y="1076.4" text-anchor="middle">منظوری کے لیے</text><text class="sh" x="390" y="1115.5" text-anchor="middle">صدر کو پیش</text><line class="stroke" x1="390" y1="1150.0" x2="390" y2="1209.8" marker-end="url(#arrow)"/><rect class="panel-a" x="240" y="1214.4" width="300" height="85.1" rx="6"/><text class="sh" x="390" y="1265.0" text-anchor="middle">آئین میں ترمیم</text><text class="small" x="756" y="1357.0" text-anchor="end">کل رکنیت یعنی تمام نشستیں: قومی اسمبلی میں 336 میں سے 224، سینیٹ میں 96 میں سے 64۔</text><text class="small" x="756" y="1398.4" text-anchor="end">آرٹیکل 239 میں مشترکہ اجلاس نہیں: ہر ایوان کو الگ دو تہائی حاصل کرنا ہوگا۔</text><text class="wm" x="12" y="1449.0" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
