<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 770.5" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اٹھارویں، انیسویں اور پچیسویں ترامیم کا سال، اہم تبدیلی اور وفاقی نظام پر اثر کے لحاظ سے تقابلی جدول</title><desc id="d">اٹھارویں، انیسویں اور پچیسویں ترامیم کا سال، اہم تبدیلی اور وفاقی نظام پر اثر کے لحاظ سے تقابلی جدول۔ اٹھارویں، 2010، نے مشترکہ فہرست ختم کی، صدارتی اختیارات محدود کیے، حقوق شامل کیے اور جوڈیشل کمیشن بنایا؛ اس کا اثر بڑا تھا اور قانون سازی اور وسائل صوبوں کی طرف منتقل ہوئے۔ انیسویں، نافذ 2011، نے آرٹیکل 175A کے تحت ججوں کی تقرری بدلی؛ اس کا اثر چھوٹا اور بالواسطہ تھا۔ پچیسویں، 2018، نے قبائلی علاقے صوبوں میں ضم کیے اور دونوں ایوانوں کی نشستیں کم کیں؛ ضم شدہ علاقوں کے لیے اثر بڑا تھا، جہاں وفاقی حکمرانی ختم اور صوبائی حکومت شروع ہوئی۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0.0" width="780" height="770.5"/><text class="h" x="756" y="69.0" text-anchor="end">تین ترامیم کا تقابل</text><rect class="panel" x="24" y="96.6" width="732" height="73.6" rx="6"/><text class="sh" x="748" y="144.9" text-anchor="end">ترمیم</text><text class="sh" x="636" y="144.9" text-anchor="end">سال</text><text class="sh" x="562" y="144.9" text-anchor="end">اہم تبدیلی</text><text class="sh" x="292" y="144.9" text-anchor="end">وفاقی نظام پر اثر</text><rect class="panel-a" x="24" y="170.2" width="732" height="211.6" rx="6"/><text class="sh" x="748" y="225.4" text-anchor="end">اٹھارویں</text><text class="cell" x="636" y="225.4" text-anchor="end">2010</text><text class="cell" x="562" y="225.4" text-anchor="end">مشترکہ فہرست ختم،</text><text class="cell" x="562" y="264.5" text-anchor="end">صدارتی اختیارات محدود،</text><text class="cell" x="562" y="303.6" text-anchor="end">حقوق شامل اور</text><text class="cell" x="562" y="342.7" text-anchor="end">جوڈیشل کمیشن قائم</text><text class="cell" x="292" y="225.4" text-anchor="end">بڑا: قانون سازی اور وسائل</text><text class="cell" x="292" y="264.5" text-anchor="end">صوبوں کی طرف منتقل،</text><text class="cell" x="292" y="303.6" text-anchor="end">مشترکہ کونسلیں مضبوط</text><rect class="panel-b" x="24" y="381.8" width="732" height="133.4" rx="6"/><text class="sh" x="748" y="437.0" text-anchor="end">انیسویں</text><text class="cell" x="636" y="437.0" text-anchor="end">نافذ</text><text class="cell" x="636" y="476.1" text-anchor="end">2011</text><text class="cell" x="562" y="437.0" text-anchor="end">ججوں کی تقرری کا طریقہ بدلا</text><text class="cell" x="562" y="476.1" text-anchor="end">آرٹیکل ⁦175A⁩ کے تحت</text><text class="cell" x="292" y="437.0" text-anchor="end">چھوٹا اور بالواسطہ</text><rect class="panel-c" x="24" y="515.2" width="732" height="172.5" rx="6"/><text class="sh" x="748" y="570.4" text-anchor="end">پچیسویں</text><text class="cell" x="636" y="570.4" text-anchor="end">2018</text><text class="cell" x="562" y="570.4" text-anchor="end">قبائلی علاقے صوبوں میں ضم،</text><text class="cell" x="562" y="609.5" text-anchor="end">اور دونوں ایوانوں کی</text><text class="cell" x="562" y="648.6" text-anchor="end">نشستیں کم</text><text class="cell" x="292" y="570.4" text-anchor="end">ضم شدہ علاقوں میں بڑا:</text><text class="cell" x="292" y="609.5" text-anchor="end">وفاقی حکمرانی ختم،</text><text class="cell" x="292" y="648.6" text-anchor="end">صوبائی حکومت شروع</text><text class="wm" x="12" y="747.5" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
