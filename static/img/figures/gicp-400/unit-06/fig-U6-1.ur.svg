<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1081.0" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">وفاقی حکومت کے تین شعبوں کا خاکہ</title><desc id="d">وفاقی حکومت کے تین شعبوں کا خاکہ۔ مقننہ وفاقی قانون بناتی ہے اور مجلسِ شوریٰ پر مشتمل ہے، جس میں صدر، قومی اسمبلی اور سینیٹ شامل ہیں۔ انتظامیہ قانون پر عمل درآمد کرتی ہے اور اس میں صدر بطور سربراہِ مملکت، وزیرِ اعظم بطور چیف ایگزیکٹو، وفاقی وزرا اور کابینہ شامل ہیں۔ عدلیہ قانون کی تشریح کرتی ہے اور اس میں وفاقی آئینی عدالت، سپریم کورٹ، وفاقی شرعی عدالت، ہائی کورٹس اور ماتحت عدالتیں شامل ہیں۔ صدر مقننہ اور انتظامیہ دونوں میں دکھایا گیا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0.0" width="780" height="1081.0"/><text class="h" x="756" y="69.0" text-anchor="end">وفاقی حکومت کے تین شعبے</text><rect class="panel" x="24" y="101.2" width="732" height="85.1" rx="6"/><text class="sh" x="390" y="151.8" text-anchor="middle">پاکستان کی وفاقی حکومت</text><line class="stroke" x1="640" y1="186.3" x2="640" y2="257.6" marker-end="url(#arrow)"/><rect class="panel-a" x="524" y="262.2" width="232" height="124.2" rx="6"/><text class="sh" x="640" y="312.8" text-anchor="middle">مقننہ</text><text class="cell" x="640" y="351.9" text-anchor="middle">وفاقی قانون بناتی ہے</text><rect class="panel-a" x="524" y="404.8" width="232" height="85.1" rx="6"/><text class="cell" x="640" y="455.4" text-anchor="middle">مجلسِ شوریٰ (پارلیمنٹ)</text><rect class="panel-a" x="524" y="508.3" width="232" height="85.1" rx="6"/><text class="cell" x="640" y="558.9" text-anchor="middle">صدر (آرٹیکل 50)</text><rect class="panel-a" x="524" y="611.8" width="232" height="124.2" rx="6"/><text class="cell" x="640" y="662.4" text-anchor="middle">قومی اسمبلی:</text><text class="cell" x="640" y="701.5" text-anchor="middle">336 نشستیں</text><rect class="panel-a" x="524" y="754.4" width="232" height="124.2" rx="6"/><text class="cell" x="640" y="805.0" text-anchor="middle">سینیٹ:</text><text class="cell" x="640" y="844.1" text-anchor="middle">96 ارکان</text><line class="stroke" x1="390" y1="186.3" x2="390" y2="257.6" marker-end="url(#arrow)"/><rect class="panel-b" x="274" y="262.2" width="232" height="124.2" rx="6"/><text class="sh" x="390" y="312.8" text-anchor="middle">انتظامیہ</text><text class="cell" x="390" y="351.9" text-anchor="middle">قانون پر عمل کرتی ہے</text><rect class="panel-b" x="274" y="404.8" width="232" height="124.2" rx="6"/><text class="cell" x="390" y="455.4" text-anchor="middle">صدر:</text><text class="cell" x="390" y="494.5" text-anchor="middle">سربراہِ مملکت</text><rect class="panel-b" x="274" y="547.4" width="232" height="124.2" rx="6"/><text class="cell" x="390" y="598.0" text-anchor="middle">وزیرِ اعظم:</text><text class="cell" x="390" y="637.1" text-anchor="middle">چیف ایگزیکٹو</text><rect class="panel-b" x="274" y="690.0" width="232" height="124.2" rx="6"/><text class="cell" x="390" y="740.6" text-anchor="middle">وفاقی وزرا</text><text class="cell" x="390" y="779.7" text-anchor="middle">اور کابینہ</text><line class="stroke" x1="140" y1="186.3" x2="140" y2="257.6" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="262.2" width="232" height="124.2" rx="6"/><text class="sh" x="140" y="312.8" text-anchor="middle">عدلیہ</text><text class="cell" x="140" y="351.9" text-anchor="middle">قانون کی تشریح کرتی ہے</text><rect class="panel-c" x="24" y="404.8" width="232" height="85.1" rx="6"/><text class="cell" x="140" y="455.4" text-anchor="middle">وفاقی آئینی عدالت</text><rect class="panel-c" x="24" y="508.3" width="232" height="85.1" rx="6"/><text class="cell" x="140" y="558.9" text-anchor="middle">سپریم کورٹ</text><rect class="panel-c" x="24" y="611.8" width="232" height="85.1" rx="6"/><text class="cell" x="140" y="662.4" text-anchor="middle">وفاقی شرعی عدالت</text><rect class="panel-c" x="24" y="715.3" width="232" height="85.1" rx="6"/><text class="cell" x="140" y="765.9" text-anchor="middle">ہائی کورٹس</text><rect class="panel-c" x="24" y="818.8" width="232" height="85.1" rx="6"/><text class="cell" x="140" y="869.4" text-anchor="middle">ماتحت عدالتیں</text><text class="small" x="756" y="984.4" text-anchor="end">صدر دو جگہ ہے: آرٹیکل 50 میں پارلیمنٹ کا حصہ، آرٹیکل 41 میں سربراہِ مملکت۔</text><text class="small" x="756" y="1025.8" text-anchor="end">عدالتیں 2025 کی ستائیسویں ترمیم کے بعد کی صورت میں دکھائی گئی ہیں۔</text><text class="wm" x="12" y="1058.0" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
