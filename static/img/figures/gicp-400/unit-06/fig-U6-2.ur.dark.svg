<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1005.1" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مقننہ، انتظامیہ اور عدلیہ کا تقابلی جدول</title><desc id="d">مقننہ، انتظامیہ اور عدلیہ کا تقابلی جدول۔ مقننہ میں صدر، قومی اسمبلی اور سینیٹ ہیں؛ ووٹر اور جماعتی فہرستیں اسمبلی کے ارکان لاتے ہیں اور صوبائی اسمبلیاں سینیٹ منتخب کرتی ہیں؛ یہ وفاقی قانون بناتی، وفاقی مالی امور پر اختیار رکھتی، حکومت کو جواب دہ رکھتی اور آئین میں ترمیم کرتی ہے۔ انتظامیہ میں صدر، وزیرِ اعظم اور وفاقی وزرا ہیں؛ انتخابی کالج صدر اور قومی اسمبلی وزیرِ اعظم منتخب کرتی ہے، اور وزرا وزیرِ اعظم کے مشورے پر مقرر ہوتے ہیں؛ یہ قانون پر عمل درآمد کرتی اور حکومت چلاتی ہے۔ عدلیہ عدالتوں کے ججوں پر مشتمل ہے؛ اعلیٰ عدالتوں کے لیے جوڈیشل کمیشن نامزدگی اور صدر تقرری کرتا ہے؛ یہ قانون کی تشریح، تنازعات کے فیصلے اور حقوق کا نفاذ کرتی ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0.0" width="780" height="1005.1"/><text class="h" x="756" y="69.0" text-anchor="end">ہر شعبے کے ارکان، ان کا انتخاب اور کام</text><rect class="panel" x="24" y="96.6" width="732" height="73.6" rx="6"/><text class="sh" x="748" y="144.9" text-anchor="end">شعبہ</text><text class="sh" x="646" y="144.9" text-anchor="end">ارکان</text><text class="sh" x="456" y="144.9" text-anchor="end">انتخاب کا طریقہ</text><text class="sh" x="226" y="144.9" text-anchor="end">اہم اختیارات</text><rect class="panel-a" x="24" y="170.2" width="732" height="250.7" rx="6"/><text class="sh" x="748" y="225.4" text-anchor="end">مقننہ</text><text class="cell" x="646" y="225.4" text-anchor="end">صدر، قومی اسمبلی</text><text class="cell" x="646" y="264.5" text-anchor="end">اور سینیٹ</text><text class="cell" x="456" y="225.4" text-anchor="end">ووٹر اور جماعتی فہرستیں</text><text class="cell" x="456" y="264.5" text-anchor="end">اسمبلی بناتے ہیں۔ صوبائی</text><text class="cell" x="456" y="303.6" text-anchor="end">اسمبلیاں سینیٹ چنتی ہیں</text><text class="cell" x="226" y="225.4" text-anchor="end">وفاقی قانون بنانا،</text><text class="cell" x="226" y="264.5" text-anchor="end">وفاقی مالی امور چلانا،</text><text class="cell" x="226" y="303.6" text-anchor="end">حکومت سے جواب طلبی،</text><text class="cell" x="226" y="342.7" text-anchor="end">آئین میں</text><text class="cell" x="226" y="381.8" text-anchor="end">ترمیم کرنا</text><rect class="panel-b" x="24" y="420.9" width="732" height="289.8" rx="6"/><text class="sh" x="748" y="476.1" text-anchor="end">انتظامیہ</text><text class="cell" x="646" y="476.1" text-anchor="end">صدر، وزیرِ اعظم</text><text class="cell" x="646" y="515.2" text-anchor="end">اور وفاقی</text><text class="cell" x="646" y="554.3" text-anchor="end">وزرا</text><text class="cell" x="456" y="476.1" text-anchor="end">انتخابی کالج صدر چنتا ہے۔</text><text class="cell" x="456" y="515.2" text-anchor="end">قومی اسمبلی</text><text class="cell" x="456" y="554.3" text-anchor="end">وزیرِ اعظم چنتی ہے۔</text><text class="cell" x="456" y="593.4" text-anchor="end">وزرا کی تقرری</text><text class="cell" x="456" y="632.5" text-anchor="end">وزیرِ اعظم کے</text><text class="cell" x="456" y="671.6" text-anchor="end">مشورے پر ہوتی ہے</text><text class="cell" x="226" y="476.1" text-anchor="end">قانون پر عمل درآمد،</text><text class="cell" x="226" y="515.2" text-anchor="end">وزیرِ اعظم کے ذریعے</text><text class="cell" x="226" y="554.3" text-anchor="end">حکومت چلانا</text><rect class="panel-c" x="24" y="710.7" width="732" height="211.6" rx="6"/><text class="sh" x="748" y="765.9" text-anchor="end">عدلیہ</text><text class="cell" x="646" y="765.9" text-anchor="end">عدالتوں کے جج</text><text class="cell" x="456" y="765.9" text-anchor="end">اعلیٰ عدالتوں کے لیے</text><text class="cell" x="456" y="805.0" text-anchor="end">جوڈیشل کمیشن نامزد کرتا ہے</text><text class="cell" x="456" y="844.1" text-anchor="end">اور صدر مقرر کرتا ہے</text><text class="cell" x="456" y="883.2" text-anchor="end">(آرٹیکل ⁦175A⁩)</text><text class="cell" x="226" y="765.9" text-anchor="end">قانون کی تشریح،</text><text class="cell" x="226" y="805.0" text-anchor="end">تنازعات کا فیصلہ،</text><text class="cell" x="226" y="844.1" text-anchor="end">حقوق کا نفاذ</text><text class="wm" x="12" y="982.1" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
