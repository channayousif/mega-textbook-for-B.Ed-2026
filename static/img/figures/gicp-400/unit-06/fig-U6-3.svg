<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of a constitutional amendment under Article 239</title><desc id="d">Flowchart of a constitutional amendment under Article 239. A Bill starts in either House and needs two-thirds of the total membership there, then two-thirds of the total membership of the other House; if either vote falls short, the Bill fails. If the second House changes the Bill, the first House must pass the changed Bill by two-thirds of its total membership. A Bill altering the limits of a Province also needs two-thirds of the total membership of that Provincial Assembly. It then goes to the President for assent, and the Constitution is amended.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="640"/><text class="h" x="24" y="30">How a Constitution Amendment Bill passes (Article 239)</text><rect class="panel" x="240" y="44" width="300" height="37" rx="6"/><text class="sh" x="390" y="66" text-anchor="middle">Bill introduced in either House</text><line class="stroke" x1="390" y1="81" x2="390" y2="106" marker-end="url(#arrow)"/><rect class="panel-b" x="240" y="108" width="300" height="54" rx="20"/><text class="cell" x="390" y="130" text-anchor="middle">Passed by two-thirds of the total</text><text class="cell" x="390" y="147" text-anchor="middle">membership of that House?</text><text class="small" x="398" y="186">Yes</text><line class="stroke" x1="390" y1="162" x2="390" y2="190" marker-end="url(#arrow)"/><rect class="panel" x="240" y="192" width="300" height="37" rx="6"/><text class="sh" x="390" y="214" text-anchor="middle">Sent to the other House</text><line class="stroke" x1="390" y1="229" x2="390" y2="254" marker-end="url(#arrow)"/><rect class="panel-b" x="240" y="256" width="300" height="54" rx="20"/><text class="cell" x="390" y="278" text-anchor="middle">Passed by two-thirds of its</text><text class="cell" x="390" y="295" text-anchor="middle">total membership?</text><text class="small" x="398" y="334">Yes</text><line class="stroke" x1="390" y1="310" x2="390" y2="338" marker-end="url(#arrow)"/><rect class="panel-d" x="600" y="116" width="156" height="37" rx="6"/><text class="sh" x="678" y="138" text-anchor="middle">Bill fails</text><line class="stroke" x1="540" y1="135" x2="598" y2="135" marker-end="url(#arrow)"/><text class="small" x="548" y="128">No</text><path class="stroke" d="M 540 283 L 678 283 L 678 155" marker-end="url(#arrow)"/><text class="small" x="548" y="276">No</text><rect class="panel-a" x="24" y="256" width="190" height="88" rx="6"/><text class="cell" x="119" y="278" text-anchor="middle">Passed with amendment:</text><text class="cell" x="119" y="295" text-anchor="middle">first House must pass the</text><text class="cell" x="119" y="312" text-anchor="middle">changed Bill by two-thirds</text><text class="cell" x="119" y="329" text-anchor="middle">of its total membership</text><line class="stroke" x1="240" y1="283" x2="216" y2="283" marker-end="url(#arrow)"/><path class="stroke" d="M 119 344 L 119 366 L 238 366" marker-end="url(#arrow)"/><rect class="panel-b" x="240" y="340" width="300" height="54" rx="20"/><text class="cell" x="390" y="362" text-anchor="middle">Would it alter the limits</text><text class="cell" x="390" y="379" text-anchor="middle">of a Province?</text><text class="small" x="398" y="418">No</text><line class="stroke" x1="390" y1="394" x2="390" y2="444" marker-end="url(#arrow)"/><rect class="panel-c" x="596" y="330" width="160" height="88" rx="6"/><text class="cell" x="676" y="352" text-anchor="middle">That Provincial</text><text class="cell" x="676" y="369" text-anchor="middle">Assembly must pass it</text><text class="cell" x="676" y="386" text-anchor="middle">by two-thirds of its</text><text class="cell" x="676" y="403" text-anchor="middle">total membership</text><line class="stroke" x1="540" y1="366" x2="594" y2="366" marker-end="url(#arrow)"/><text class="small" x="548" y="359">Yes</text><path class="stroke" d="M 676 416 L 676 465 L 542 465" marker-end="url(#arrow)"/><rect class="panel" x="240" y="446" width="300" height="54" rx="6"/><text class="sh" x="390" y="468" text-anchor="middle">Presented to the</text><text class="sh" x="390" y="485" text-anchor="middle">President for assent</text><line class="stroke" x1="390" y1="500" x2="390" y2="526" marker-end="url(#arrow)"/><rect class="panel-a" x="240" y="528" width="300" height="37" rx="6"/><text class="sh" x="390" y="550" text-anchor="middle">Constitution amended</text><text class="small" x="24" y="590">Total membership means all the seats: 224 of 336 in the National Assembly, 64 of 96 in the Senate.</text><text class="small" x="24" y="608">Article 239 has no joint sitting route, so each House must reach two-thirds by itself.</text><text class="wm" x="768" y="630" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
