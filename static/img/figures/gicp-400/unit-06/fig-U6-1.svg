<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the federal government as three organs</title><desc id="d">Diagram of the federal government as three organs. The legislature makes federal law and is the Majlis-e-Shoora, made up of the President, the National Assembly and the Senate. The executive carries out the law and has the President as Head of State, the Prime Minister as chief executive, and the Federal Ministers and Cabinet. The judiciary interprets the law and has the Federal Constitutional Court, the Supreme Court, the Federal Shariat Court, the High Courts and the subordinate courts. The President appears under both the legislature and the executive.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="30">The three organs of the federal government</text><rect class="panel" x="24" y="44" width="732" height="37" rx="6"/><text class="sh" x="390" y="66" text-anchor="middle">Federal government of Pakistan</text><line class="stroke" x1="140" y1="81" x2="140" y2="112" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="114" width="232" height="54" rx="6"/><text class="sh" x="140" y="136" text-anchor="middle">Legislature</text><text class="cell" x="140" y="153" text-anchor="middle">Makes federal law</text><rect class="panel-a" x="24" y="176" width="232" height="37" rx="6"/><text class="cell" x="140" y="198" text-anchor="middle">Majlis-e-Shoora (Parliament)</text><rect class="panel-a" x="24" y="221" width="232" height="37" rx="6"/><text class="cell" x="140" y="243" text-anchor="middle">President (Article 50)</text><rect class="panel-a" x="24" y="266" width="232" height="54" rx="6"/><text class="cell" x="140" y="288" text-anchor="middle">National Assembly:</text><text class="cell" x="140" y="305" text-anchor="middle">336 seats</text><rect class="panel-a" x="24" y="328" width="232" height="54" rx="6"/><text class="cell" x="140" y="350" text-anchor="middle">Senate:</text><text class="cell" x="140" y="367" text-anchor="middle">96 members</text><line class="stroke" x1="390" y1="81" x2="390" y2="112" marker-end="url(#arrow)"/><rect class="panel-b" x="274" y="114" width="232" height="54" rx="6"/><text class="sh" x="390" y="136" text-anchor="middle">Executive</text><text class="cell" x="390" y="153" text-anchor="middle">Carries out the law</text><rect class="panel-b" x="274" y="176" width="232" height="54" rx="6"/><text class="cell" x="390" y="198" text-anchor="middle">President:</text><text class="cell" x="390" y="215" text-anchor="middle">Head of State</text><rect class="panel-b" x="274" y="238" width="232" height="54" rx="6"/><text class="cell" x="390" y="260" text-anchor="middle">Prime Minister:</text><text class="cell" x="390" y="277" text-anchor="middle">chief executive</text><rect class="panel-b" x="274" y="300" width="232" height="54" rx="6"/><text class="cell" x="390" y="322" text-anchor="middle">Federal Ministers</text><text class="cell" x="390" y="339" text-anchor="middle">and Cabinet</text><line class="stroke" x1="640" y1="81" x2="640" y2="112" marker-end="url(#arrow)"/><rect class="panel-c" x="524" y="114" width="232" height="54" rx="6"/><text class="sh" x="640" y="136" text-anchor="middle">Judiciary</text><text class="cell" x="640" y="153" text-anchor="middle">Interprets the law</text><rect class="panel-c" x="524" y="176" width="232" height="37" rx="6"/><text class="cell" x="640" y="198" text-anchor="middle">Federal Constitutional Court</text><rect class="panel-c" x="524" y="221" width="232" height="37" rx="6"/><text class="cell" x="640" y="243" text-anchor="middle">Supreme Court</text><rect class="panel-c" x="524" y="266" width="232" height="37" rx="6"/><text class="cell" x="640" y="288" text-anchor="middle">Federal Shariat Court</text><rect class="panel-c" x="524" y="311" width="232" height="37" rx="6"/><text class="cell" x="640" y="333" text-anchor="middle">High Courts</text><rect class="panel-c" x="524" y="356" width="232" height="37" rx="6"/><text class="cell" x="640" y="378" text-anchor="middle">Subordinate courts</text><text class="small" x="24" y="428">The President appears twice: as part of Parliament under Article 50, and as Head of State under Article 41.</text><text class="small" x="24" y="446">Courts shown as they stand after the Twenty-seventh Amendment of 2025.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
