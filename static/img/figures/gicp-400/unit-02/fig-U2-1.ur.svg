<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین مختلف سیاسی حصے</title><desc id="d">سر سید کی تعلیمی اصلاح، اقبال کے مسلم خود حکمرانی کے رؤیے اور جناح کی قیادت و مساوی شہریت کے اصولوں کا موازنہ، مخصوص ادوار اور شہادت کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">تین رہنما، مختلف قسم کے حصے</tspan></text><rect class="accent" x="571" y="62" width="185" height="48" rx="8"/><text class="small" x="744" y="92" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">رہنما اور دور</tspan></text><rect class="accent" x="391" y="62" width="170" height="48" rx="8"/><text class="small" x="549" y="92" text-anchor="end"><tspan x="549" dy="0" text-anchor="end">بنیادی خیال</tspan></text><rect class="accent" x="211" y="62" width="170" height="48" rx="8"/><text class="small" x="369" y="92" text-anchor="end"><tspan x="369" dy="0" text-anchor="end">کام یا خطاب</tspan></text><rect class="accent" x="24" y="62" width="177" height="48" rx="8"/><text class="small" x="189" y="92" text-anchor="end"><tspan x="189" dy="0" text-anchor="end">حصہ</tspan></text><rect class="panel" x="571" y="124" width="185" height="102" rx="8"/><text class="body" x="744" y="153" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">سر سید</tspan><tspan x="744" dy="23" text-anchor="end">احمد خان</tspan></text><rect class="panel" x="391" y="124" width="170" height="102" rx="8"/><text class="body" x="549" y="153" text-anchor="end"><tspan x="549" dy="0" text-anchor="end">تعلیم اور</tspan><tspan x="549" dy="23" text-anchor="end">عوامی صلاحیت</tspan></text><rect class="panel" x="211" y="124" width="170" height="102" rx="8"/><text class="body" x="369" y="153" text-anchor="end"><tspan x="369" dy="0" text-anchor="end">تحریکِ الی گڑھ</tspan><tspan x="369" dy="23" text-anchor="end">ایم اے او کالج</tspan></text><rect class="panel" x="24" y="124" width="177" height="102" rx="8"/><text class="body" x="189" y="153" text-anchor="end"><tspan x="189" dy="0" text-anchor="end">بعد کے عوامی</tspan><tspan x="189" dy="23" text-anchor="end">زندگی کے لیے</tspan><tspan x="189" dy="23" text-anchor="end">تعلیم اور مہارت</tspan></text><text class="small" x="744" y="209" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">انیسویں صدی</tspan></text><rect class="panel" x="571" y="236" width="185" height="102" rx="8"/><text class="body" x="744" y="265" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">محمد اقبال</tspan></text><rect class="panel" x="391" y="236" width="170" height="102" rx="8"/><text class="body" x="549" y="265" text-anchor="end"><tspan x="549" dy="0" text-anchor="end">خودی اور</tspan><tspan x="549" dy="23" text-anchor="end">مسلم اجتماعی</tspan><tspan x="549" dy="23" text-anchor="end">خود حکمرانی</tspan></text><rect class="panel" x="211" y="236" width="170" height="102" rx="8"/><text class="body" x="369" y="265" text-anchor="end"><tspan x="369" dy="0" text-anchor="end">الٰہ آباد</tspan><tspan x="369" dy="23" text-anchor="end">خطاب، 1930</tspan></text><rect class="panel" x="24" y="236" width="177" height="102" rx="8"/><text class="body" x="189" y="265" text-anchor="end"><tspan x="189" dy="0" text-anchor="end">سیاسی رؤیہ،</tspan><tspan x="189" dy="23" text-anchor="end">حتمی حدود نہیں</tspan></text><text class="small" x="744" y="321" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">ابتدائی بیسویں صدی</tspan></text><rect class="panel" x="571" y="348" width="185" height="102" rx="8"/><text class="body" x="744" y="377" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">محمد علی</tspan><tspan x="744" dy="23" text-anchor="end">جناح</tspan></text><rect class="panel" x="391" y="348" width="170" height="102" rx="8"/><text class="body" x="549" y="377" text-anchor="end"><tspan x="549" dy="0" text-anchor="end">نمائندگی اور</tspan><tspan x="549" dy="23" text-anchor="end">مساوی شہریت</tspan></text><rect class="panel" x="211" y="348" width="170" height="102" rx="8"/><text class="body" x="369" y="377" text-anchor="end"><tspan x="369" dy="0" text-anchor="end">سیاسی قیادت</tspan><tspan x="369" dy="23" text-anchor="end">اسمبلی خطاب،</tspan><tspan x="369" dy="23" text-anchor="end">اگست 1947</tspan></text><rect class="panel" x="24" y="348" width="177" height="102" rx="8"/><text class="body" x="189" y="377" text-anchor="end"><tspan x="189" dy="0" text-anchor="end">تنظیم اور</tspan><tspan x="189" dy="23" text-anchor="end">حکومت کے</tspan><tspan x="189" dy="23" text-anchor="end">اصول</tspan></text><text class="small" x="744" y="433" text-anchor="end"><tspan x="744" dy="0" text-anchor="end">بیسویں صدی</tspan></text><text class="small" x="756" y="491" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">جڑے ہوئے حصے ایک ہی پروگرام کا مطلب نہیں۔</tspan></text><text class="wm" x="12" y="520" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
