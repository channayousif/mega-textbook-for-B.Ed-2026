<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 735" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Decisions between demand and independence</title><desc id="d">Steps between the Lahore Resolution and Pakistan's independence show electoral support, unsuccessful negotiations, partition planning, legislation and transfer, distinguishing 14 August commemoration from the Act's 15 August appointed day.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="735"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">From political demand to independence</tspan></text><rect class="panel" x="30" y="61" width="720" height="77" rx="8"/><text class="h" x="47" y="89" text-anchor="start"><tspan x="47" dy="0">March 1940</tspan></text><text class="h" x="243" y="89" text-anchor="start"><tspan x="243" dy="0">Lahore Resolution</tspan></text><text class="body" x="243" y="117" text-anchor="start"><tspan x="243" dy="0">Demand expressed</tspan></text><line class="link" x1="390" y1="138" x2="390" y2="157"/><polygon class="ah" points="390,157 386,149 394,149"/><rect class="panel" x="30" y="161" width="720" height="77" rx="8"/><text class="h" x="47" y="189" text-anchor="start"><tspan x="47" dy="0">1945-1946</tspan></text><text class="h" x="243" y="189" text-anchor="start"><tspan x="243" dy="0">Elections</tspan></text><text class="body" x="243" y="217" text-anchor="start"><tspan x="243" dy="0">Representative claim strengthened</tspan></text><line class="link" x1="390" y1="238" x2="390" y2="257"/><polygon class="ah" points="390,257 386,249 394,249"/><rect class="panel" x="30" y="261" width="720" height="77" rx="8"/><text class="h" x="47" y="289" text-anchor="start"><tspan x="47" dy="0">1946</tspan></text><text class="h" x="243" y="289" text-anchor="start"><tspan x="243" dy="0">Cabinet Mission</tspan></text><text class="body" x="243" y="317" text-anchor="start"><tspan x="243" dy="0">No lasting constitutional settlement</tspan></text><line class="link" x1="390" y1="338" x2="390" y2="357"/><polygon class="ah" points="390,357 386,349 394,349"/><rect class="panel" x="30" y="361" width="720" height="77" rx="8"/><text class="h" x="47" y="389" text-anchor="start"><tspan x="47" dy="0">3 June 1947</tspan></text><text class="h" x="243" y="389" text-anchor="start"><tspan x="243" dy="0">Partition plan</tspan></text><text class="body" x="243" y="417" text-anchor="start"><tspan x="243" dy="0">Division and transfer planned</tspan></text><line class="link" x1="390" y1="438" x2="390" y2="457"/><polygon class="ah" points="390,457 386,449 394,449"/><rect class="panel" x="30" y="461" width="720" height="77" rx="8"/><text class="h" x="47" y="489" text-anchor="start"><tspan x="47" dy="0">18 July 1947</tspan></text><text class="h" x="243" y="489" text-anchor="start"><tspan x="243" dy="0">Independence Act</tspan></text><text class="body" x="243" y="517" text-anchor="start"><tspan x="243" dy="0">Legal arrangements established</tspan></text><line class="link" x1="390" y1="538" x2="390" y2="557"/><polygon class="ah" points="390,557 386,549 394,549"/><rect class="panel" x="30" y="561" width="720" height="77" rx="8"/><text class="h" x="47" y="589" text-anchor="start"><tspan x="47" dy="0">14 August 1947</tspan></text><text class="h" x="243" y="589" text-anchor="start"><tspan x="243" dy="0">Karachi transfer ceremony</tspan></text><text class="body" x="243" y="617" text-anchor="start"><tspan x="243" dy="0">Pakistan commemorates independence</tspan></text><text class="small" x="24" y="693" text-anchor="start"><tspan x="24" dy="0">Act appointed day: 15 August 1947. Arrows show steps, not inevitability.</tspan></text><text class="wm" x="768" y="725" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
