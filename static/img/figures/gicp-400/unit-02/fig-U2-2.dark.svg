<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 565" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Iqbal: ideas and self-government</title><desc id="d">Iqbal's selfhood, Muslim community and Islamic ethical principles connect to self-government, while his 1930 homeland proposal is distinguished from Pakistan's final 1947 borders.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="565"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Iqbal: responsible persons and collective life</tspan></text><rect class="panel" x="30" y="68" width="230" height="105" rx="8"/><text class="h" x="145" y="97" text-anchor="middle"><tspan x="145" dy="0">Responsible selfhood</tspan></text><text class="body" x="145" y="126" text-anchor="middle"><tspan x="145" dy="0">Purpose and agency</tspan></text><rect class="panel" x="520" y="68" width="230" height="105" rx="8"/><text class="h" x="635" y="97" text-anchor="middle"><tspan x="635" dy="0">Islamic ethics</tspan></text><text class="body" x="635" y="126" text-anchor="middle"><tspan x="635" dy="0">Equality, solidarity,</tspan><tspan x="635" dy="23">freedom</tspan></text><rect class="panel" x="30" y="252" width="230" height="100" rx="8"/><text class="h" x="145" y="281" text-anchor="middle"><tspan x="145" dy="0">Muslim community</tspan></text><text class="body" x="145" y="310" text-anchor="middle"><tspan x="145" dy="0">Shared collective life</tspan></text><rect class="panel" x="290" y="252" width="200" height="100" rx="8"/><text class="h" x="390" y="281" text-anchor="middle"><tspan x="390" dy="0">Self-government</tspan></text><text class="body" x="390" y="310" text-anchor="middle"><tspan x="390" dy="0">Political authority</tspan></text><rect class="panel" x="520" y="252" width="230" height="100" rx="8"/><text class="h" x="635" y="281" text-anchor="middle"><tspan x="635" dy="0">Public institutions</tspan></text><text class="body" x="635" y="310" text-anchor="middle"><tspan x="635" dy="0">Give values effect</tspan></text><line class="link" x1="145" y1="173" x2="145" y2="247"/><polygon class="ah" points="145,247 141,239 149,239"/><text class="small" x="158" y="211" text-anchor="start"><tspan x="158" dy="0">supports</tspan></text><line class="link" x1="635" y1="173" x2="635" y2="247"/><polygon class="ah" points="635,247 631,239 639,239"/><text class="small" x="648" y="211" text-anchor="start"><tspan x="648" dy="0">guides</tspan></text><line class="link" x1="260" y1="302" x2="285" y2="302"/><polygon class="ah" points="285,302 277,306 277,298"/><line class="link" x1="490" y1="302" x2="515" y2="302"/><polygon class="ah" points="515,302 507,306 507,298"/><line class="link" x1="390" y1="352" x2="390" y2="405"/><polygon class="ah" points="390,405 386,397 394,397"/><text class="small" x="404" y="386" text-anchor="start"><tspan x="404" dy="0">informs</tspan></text><rect class="panel" x="200" y="410" width="380" height="85" rx="8"/><text class="h" x="390" y="439" text-anchor="middle"><tspan x="390" dy="0">1930 homeland proposal</tspan></text><text class="body" x="390" y="468" text-anchor="middle"><tspan x="390" dy="0">North-western Muslim unit</tspan></text><text class="small" x="390" y="526" text-anchor="middle"><tspan x="390" dy="0">A proposal, not Pakistan's final 1947 borders.</tspan></text><text class="wm" x="768" y="555" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
