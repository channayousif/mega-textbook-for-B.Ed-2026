<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 735" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مطالبے اور آزادی کے درمیان فیصلے</title><desc id="d">قراردادِ لاہور اور پاکستان کی آزادی کے درمیان کے مراحل انتخابی حمایت، ناکام مذاکرات، تقسیم کا منصوبہ، قانون سازی اور منتقلی دکھاتے ہیں، 14 اگست یومِ یاد کو ایکٹ کے 15 اگست مقررہ دن سے الگ کرتے ہوئے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="735"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">سیاسی مطالبے سے آزادی تک</tspan></text><rect class="panel" x="30" y="61" width="720" height="77" rx="8"/><text class="h" x="733" y="89" text-anchor="end"><tspan x="733" dy="0" text-anchor="end">مارچ 1940</tspan></text><text class="h" x="537" y="89" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">قراردادِ لاہور</tspan></text><text class="body" x="537" y="117" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">مطالبے کا اظہار</tspan></text><line class="link" x1="390" y1="138" x2="390" y2="157"/><polygon class="ah" points="390,157 394,149 386,149"/><rect class="panel" x="30" y="161" width="720" height="77" rx="8"/><text class="h" x="733" y="189" text-anchor="end"><tspan x="733" dy="0" text-anchor="end">1945-1946</tspan></text><text class="h" x="537" y="189" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">انتخابات</tspan></text><text class="body" x="537" y="217" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">نمائندگی دعویٰ مضبوط ہوا</tspan></text><line class="link" x1="390" y1="238" x2="390" y2="257"/><polygon class="ah" points="390,257 394,249 386,249"/><rect class="panel" x="30" y="261" width="720" height="77" rx="8"/><text class="h" x="733" y="289" text-anchor="end"><tspan x="733" dy="0" text-anchor="end">1946</tspan></text><text class="h" x="537" y="289" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">کابینہ مشن</tspan></text><text class="body" x="537" y="317" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">کوئی مستقل آئینی تصفیہ نہیں</tspan></text><line class="link" x1="390" y1="338" x2="390" y2="357"/><polygon class="ah" points="390,357 394,349 386,349"/><rect class="panel" x="30" y="361" width="720" height="77" rx="8"/><text class="h" x="733" y="389" text-anchor="end"><tspan x="733" dy="0" text-anchor="end">3 جون 1947</tspan></text><text class="h" x="537" y="389" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">تقسیم کا منصوبہ</tspan></text><text class="body" x="537" y="417" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">تقسیم اور منتقلی کا منصوبہ</tspan></text><line class="link" x1="390" y1="438" x2="390" y2="457"/><polygon class="ah" points="390,457 394,449 386,449"/><rect class="panel" x="30" y="461" width="720" height="77" rx="8"/><text class="h" x="733" y="489" text-anchor="end"><tspan x="733" dy="0" text-anchor="end">18 جولائی 1947</tspan></text><text class="h" x="537" y="489" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">آزادی ایکٹ</tspan></text><text class="body" x="537" y="517" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">قانونی انتظام قائم ہوا</tspan></text><line class="link" x1="390" y1="538" x2="390" y2="557"/><polygon class="ah" points="390,557 394,549 386,549"/><rect class="panel" x="30" y="561" width="720" height="77" rx="8"/><text class="h" x="733" y="589" text-anchor="end"><tspan x="733" dy="0" text-anchor="end">14 اگست 1947</tspan></text><text class="h" x="537" y="589" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">کراچی تقریبِ منتقلی</tspan></text><text class="body" x="537" y="617" text-anchor="end"><tspan x="537" dy="0" text-anchor="end">پاکستان آزادی یوم مناتا ہے</tspan></text><text class="small" x="756" y="693" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">ایکٹ کا مقررہ دن: 15 اگست 1947۔ تیر مراحل دکھاتے ہیں، ناگزیریت نہیں۔</tspan></text><text class="wm" x="12" y="725" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
