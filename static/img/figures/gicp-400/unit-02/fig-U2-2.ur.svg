<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 565" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اقبال: خیالات اور خود حکمرانی</title><desc id="d">اقبال کی خودی، مسلم اجتماع اور اسلامی اخلاقی اصول خود حکمرانی سے جڑتے ہیں، جبکہ ان کا 1930 ہوم لینڈ کا تجویز پاکستان کی 1947 کی آخری سرحدوں سے الگ کیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="565"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">اقبال: ذمہ دار افراد اور اجتماعی زندگی</tspan></text><rect class="panel" x="520" y="68" width="230" height="105" rx="8"/><text class="h" x="635" y="97" text-anchor="middle"><tspan x="635" dy="0" text-anchor="end">ذمہ دار خودی</tspan></text><text class="body" x="635" y="126" text-anchor="middle"><tspan x="635" dy="0" text-anchor="end">مقصد اور عملی صلاحیت</tspan></text><rect class="panel" x="30" y="68" width="230" height="105" rx="8"/><text class="h" x="145" y="97" text-anchor="middle"><tspan x="145" dy="0" text-anchor="end">اسلامی اخلاقیات</tspan></text><text class="body" x="145" y="126" text-anchor="middle"><tspan x="145" dy="0" text-anchor="end">مساوات، یک جہتی،</tspan><tspan x="145" dy="23" text-anchor="end">آزادی</tspan></text><rect class="panel" x="520" y="252" width="230" height="100" rx="8"/><text class="h" x="635" y="281" text-anchor="middle"><tspan x="635" dy="0" text-anchor="end">مسلم اجتماع</tspan></text><text class="body" x="635" y="310" text-anchor="middle"><tspan x="635" dy="0" text-anchor="middle">مشترکہ اجتماعی زندگی</tspan></text><rect class="panel" x="290" y="252" width="200" height="100" rx="8"/><text class="h" x="390" y="281" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">خود حکمرانی</tspan></text><text class="body" x="390" y="310" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">سیاسی اختیار</tspan></text><rect class="panel" x="30" y="252" width="230" height="100" rx="8"/><text class="h" x="145" y="281" text-anchor="middle"><tspan x="145" dy="0" text-anchor="end">عوامی ادارے</tspan></text><text class="body" x="145" y="310" text-anchor="middle"><tspan x="145" dy="0" text-anchor="end">اقدار کو اثر دینا</tspan></text><line class="link" x1="635" y1="173" x2="635" y2="247"/><polygon class="ah" points="635,247 639,239 631,239"/><text class="small" x="622" y="211" text-anchor="end"><tspan x="622" dy="0" text-anchor="end">حمایت کرتا ہے</tspan></text><line class="link" x1="145" y1="173" x2="145" y2="247"/><polygon class="ah" points="145,247 149,239 141,239"/><text class="small" x="132" y="211" text-anchor="end"><tspan x="132" dy="0" text-anchor="end">رہنمائی کرتا ہے</tspan></text><line class="link" x1="520" y1="302" x2="495" y2="302"/><polygon class="ah" points="495,302 503,306 503,298"/><line class="link" x1="290" y1="302" x2="265" y2="302"/><polygon class="ah" points="265,302 273,306 273,298"/><line class="link" x1="390" y1="352" x2="390" y2="405"/><polygon class="ah" points="390,405 394,397 386,397"/><text class="small" x="376" y="386" text-anchor="end"><tspan x="376" dy="0" text-anchor="end">شکل دیتا ہے</tspan></text><rect class="panel" x="200" y="410" width="380" height="85" rx="8"/><text class="h" x="390" y="439" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">1930 ہوم لینڈ کا تجویز</tspan></text><text class="body" x="390" y="468" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">شمال مغربی مسلم یونٹ</tspan></text><text class="small" x="390" y="526" text-anchor="middle"><tspan x="390" dy="0" text-anchor="end">ایک تجویز، پاکستان کی 1947 کی حتمی حدود نہیں۔</tspan></text><text class="wm" x="12" y="555" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
