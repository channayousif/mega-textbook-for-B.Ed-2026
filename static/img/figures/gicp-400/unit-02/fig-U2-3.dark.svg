<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Milestones of the Pakistan Movement</title><desc id="d">Five milestones distinguish Muslim League organisation in 1906, Iqbal's proposal in 1930, the Lahore Resolution in 1940, electoral support and negotiations in 1946, and Pakistan's creation in 1947.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Five anchors: organisation to state creation</tspan></text><line class="link" x1="91" y1="84" x2="91" y2="515"/><circle class="accent" cx="91" cy="103" r="7"/><text class="h" x="30" y="109" text-anchor="start"><tspan x="30" dy="0">1906</tspan></text><rect class="panel" x="123" y="68" width="630" height="76" rx="8"/><text class="h" x="141" y="96" text-anchor="start"><tspan x="141" dy="0">Muslim League founded</tspan></text><text class="body" x="141" y="124" text-anchor="start"><tspan x="141" dy="0">Organise representation</tspan></text><circle class="accent" cx="91" cy="194" r="7"/><text class="h" x="30" y="200" text-anchor="start"><tspan x="30" dy="0">1930</tspan></text><rect class="panel" x="123" y="159" width="630" height="76" rx="8"/><text class="h" x="141" y="187" text-anchor="start"><tspan x="141" dy="0">Allahabad Address</tspan></text><text class="body" x="141" y="215" text-anchor="start"><tspan x="141" dy="0">Propose Muslim self-government</tspan></text><circle class="accent" cx="91" cy="285" r="7"/><text class="h" x="30" y="291" text-anchor="start"><tspan x="30" dy="0">1940</tspan></text><rect class="panel" x="123" y="250" width="630" height="76" rx="8"/><text class="h" x="141" y="278" text-anchor="start"><tspan x="141" dy="0">Lahore Resolution</tspan></text><text class="body" x="141" y="306" text-anchor="start"><tspan x="141" dy="0">Express a political demand</tspan></text><circle class="accent" cx="91" cy="376" r="7"/><text class="h" x="30" y="382" text-anchor="start"><tspan x="30" dy="0">1946</tspan></text><rect class="panel" x="123" y="341" width="630" height="76" rx="8"/><text class="h" x="141" y="369" text-anchor="start"><tspan x="141" dy="0">Elections and negotiations</tspan></text><text class="body" x="141" y="397" text-anchor="start"><tspan x="141" dy="0">Gain support and seek agreement</tspan></text><circle class="accent" cx="91" cy="467" r="7"/><text class="h" x="30" y="473" text-anchor="start"><tspan x="30" dy="0">1947</tspan></text><rect class="panel" x="123" y="432" width="630" height="76" rx="8"/><text class="h" x="141" y="460" text-anchor="start"><tspan x="141" dy="0">Independence</tspan></text><text class="body" x="141" y="488" text-anchor="start"><tspan x="141" dy="0">Establish governing authority</tspan></text><text class="small" x="24" y="551" text-anchor="start"><tspan x="24" dy="0">The next event still required choices, support and decisions.</tspan></text><text class="wm" x="768" y="580" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
