<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three distinct political contributions</title><desc id="d">Comparison of Sir Syed's educational reform, Iqbal's vision of Muslim self-government and Jinnah's leadership and equal-citizenship principles, with distinct periods and evidence.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><text class="h" x="24" y="32" text-anchor="start"><tspan x="24" dy="0">Three leaders, different kinds of contribution</tspan></text><rect class="accent" x="24" y="62" width="185" height="48" rx="8"/><text class="small" x="36" y="92" text-anchor="start"><tspan x="36" dy="0">Leader and period</tspan></text><rect class="accent" x="219" y="62" width="170" height="48" rx="8"/><text class="small" x="231" y="92" text-anchor="start"><tspan x="231" dy="0">Main idea</tspan></text><rect class="accent" x="399" y="62" width="170" height="48" rx="8"/><text class="small" x="411" y="92" text-anchor="start"><tspan x="411" dy="0">Work or speech</tspan></text><rect class="accent" x="579" y="62" width="177" height="48" rx="8"/><text class="small" x="591" y="92" text-anchor="start"><tspan x="591" dy="0">Contribution</tspan></text><rect class="panel" x="24" y="124" width="185" height="102" rx="8"/><text class="body" x="36" y="153" text-anchor="start"><tspan x="36" dy="0">Sir Syed</tspan><tspan x="36" dy="23">Ahmad Khan</tspan></text><rect class="panel" x="219" y="124" width="170" height="102" rx="8"/><text class="body" x="231" y="153" text-anchor="start"><tspan x="231" dy="0">Education and</tspan><tspan x="231" dy="23">public capacity</tspan></text><rect class="panel" x="399" y="124" width="170" height="102" rx="8"/><text class="body" x="411" y="153" text-anchor="start"><tspan x="411" dy="0">Aligarh Movement</tspan><tspan x="411" dy="23">MAO College</tspan></text><rect class="panel" x="579" y="124" width="177" height="102" rx="8"/><text class="body" x="591" y="153" text-anchor="start"><tspan x="591" dy="0">Learning and</tspan><tspan x="591" dy="23">skills for later</tspan><tspan x="591" dy="23">public life</tspan></text><text class="small" x="36" y="209" text-anchor="start"><tspan x="36" dy="0">Nineteenth century</tspan></text><rect class="panel" x="24" y="236" width="185" height="102" rx="8"/><text class="body" x="36" y="265" text-anchor="start"><tspan x="36" dy="0">Muhammad Iqbal</tspan></text><rect class="panel" x="219" y="236" width="170" height="102" rx="8"/><text class="body" x="231" y="265" text-anchor="start"><tspan x="231" dy="0">Selfhood and</tspan><tspan x="231" dy="23">Muslim collective</tspan><tspan x="231" dy="23">self-government</tspan></text><rect class="panel" x="399" y="236" width="170" height="102" rx="8"/><text class="body" x="411" y="265" text-anchor="start"><tspan x="411" dy="0">Allahabad</tspan><tspan x="411" dy="23">Address, 1930</tspan></text><rect class="panel" x="579" y="236" width="177" height="102" rx="8"/><text class="body" x="591" y="265" text-anchor="start"><tspan x="591" dy="0">Political vision,</tspan><tspan x="591" dy="23">not final borders</tspan></text><text class="small" x="36" y="321" text-anchor="start"><tspan x="36" dy="0">Early twentieth century</tspan></text><rect class="panel" x="24" y="348" width="185" height="102" rx="8"/><text class="body" x="36" y="377" text-anchor="start"><tspan x="36" dy="0">Muhammad Ali</tspan><tspan x="36" dy="23">Jinnah</tspan></text><rect class="panel" x="219" y="348" width="170" height="102" rx="8"/><text class="body" x="231" y="377" text-anchor="start"><tspan x="231" dy="0">Representation and</tspan><tspan x="231" dy="23">equal citizenship</tspan></text><rect class="panel" x="399" y="348" width="170" height="102" rx="8"/><text class="body" x="411" y="377" text-anchor="start"><tspan x="411" dy="0">Political leadership</tspan><tspan x="411" dy="23">Assembly address,</tspan><tspan x="411" dy="23">August 1947</tspan></text><rect class="panel" x="579" y="348" width="177" height="102" rx="8"/><text class="body" x="591" y="377" text-anchor="start"><tspan x="591" dy="0">Organisation and</tspan><tspan x="591" dy="23">principles for</tspan><tspan x="591" dy="23">governing</tspan></text><text class="small" x="36" y="433" text-anchor="start"><tspan x="36" dy="0">Twentieth century</tspan></text><text class="small" x="24" y="491" text-anchor="start"><tspan x="24" dy="0">Connected contributions do not imply an identical programme.</tspan></text><text class="wm" x="768" y="520" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
