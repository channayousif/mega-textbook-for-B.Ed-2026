<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تحریکِ پاکستان کے سنگ میل</title><desc id="d">پانچ سنگ میل مسلم لیگ کی 1906 میں تنظیم، اقبال کے 1930 میں تجویز، قراردادِ لاہور 1940، 1946 میں انتخابی حمایت اور مذاکرات، اور 1947 میں پاکستان کے قیام کو الگ کرتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.accent{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.link{fill:none;stroke:var(--ink);stroke-width:2}.ah{fill:var(--ink)}text{fill:var(--ink)}.h{font-size:18px;font-weight:700;fill:var(--ink)}.body{font-size:16px;fill:var(--ink)}.small{font-size:14px;fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0 10 5 0 10Z"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><text class="h" x="756" y="32" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">پانچ لنگر: تنظیم سے ریاست کے قیام تک</tspan></text><line class="link" x1="689" y1="84" x2="689" y2="515"/><circle class="accent" cx="689" cy="103" r="7"/><text class="h" x="750" y="109" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">1906</tspan></text><rect class="panel" x="27" y="68" width="630" height="76" rx="8"/><text class="h" x="639" y="96" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">مسلم لیگ کا قیام</tspan></text><text class="body" x="639" y="124" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">نمائندگی کا انتظام</tspan></text><circle class="accent" cx="689" cy="194" r="7"/><text class="h" x="750" y="200" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">1930</tspan></text><rect class="panel" x="27" y="159" width="630" height="76" rx="8"/><text class="h" x="639" y="187" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">الٰہ آباد خطاب</tspan></text><text class="body" x="639" y="215" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">مسلم خود حکمرانی کا تجویز</tspan></text><circle class="accent" cx="689" cy="285" r="7"/><text class="h" x="750" y="291" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">1940</tspan></text><rect class="panel" x="27" y="250" width="630" height="76" rx="8"/><text class="h" x="639" y="278" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">قراردادِ لاہور</tspan></text><text class="body" x="639" y="306" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">سیاسی مطالبے کا اظہار</tspan></text><circle class="accent" cx="689" cy="376" r="7"/><text class="h" x="750" y="382" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">1946</tspan></text><rect class="panel" x="27" y="341" width="630" height="76" rx="8"/><text class="h" x="639" y="369" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">انتخابات اور مذاکرات</tspan></text><text class="body" x="639" y="397" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">حمایت حاصل کرنا اور اتفاق چاہنا</tspan></text><circle class="accent" cx="689" cy="467" r="7"/><text class="h" x="750" y="473" text-anchor="end"><tspan x="750" dy="0" text-anchor="end">1947</tspan></text><rect class="panel" x="27" y="432" width="630" height="76" rx="8"/><text class="h" x="639" y="460" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">آزادی</tspan></text><text class="body" x="639" y="488" text-anchor="end"><tspan x="639" dy="0" text-anchor="end">حکومتی اختیار قائم کرنا</tspan></text><text class="small" x="756" y="551" text-anchor="end"><tspan x="756" dy="0" text-anchor="end">اگلے واقعے کے لیے ابھی بھی انتخاب، حمایت اور فیصلے درکار تھے۔</tspan></text><text class="wm" x="12" y="580" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
