<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 652" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing Fundamental Rights and Principles of Policy</title><desc id="d">Table comparing Fundamental Rights and Principles of Policy across eight rows. Fundamental Rights are in Articles 8 to 28, protect people by limiting the State, make a conflicting law void and can be enforced in the High Court and the Federal Constitutional Court. Principles of Policy are in Articles 29 to 40, guide the State towards national goals, may depend on available resources and cannot be used in court to challenge a law or action, so they are checked through a yearly report to the assemblies and by voters. The education example is Article 25A for rights and Article 37(b) for principles.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="652"/><text class="h" x="24" y="30">Fundamental Rights and Principles of Policy compared</text><rect class="panel" x="24" y="42" width="732" height="32" rx="6"/><text class="sh" x="32" y="63">Feature</text><text class="sh" x="160" y="63">Fundamental Rights</text><text class="sh" x="462" y="63">Principles of Policy</text><rect class="panel-a" x="24" y="74" width="732" height="68" rx="6"/><text class="sh" x="32" y="94">Where</text><text class="cell" x="160" y="94">Part II, Chapter 1: Articles 8-28</text><text class="cell" x="462" y="94">Part II, Chapter 2: Articles 29-40</text><rect class="panel-b" x="24" y="142" width="732" height="68" rx="6"/><text class="sh" x="32" y="162">Purpose</text><text class="cell" x="160" y="162">Protect people by limiting the State</text><text class="cell" x="462" y="162">Guide the State towards national goals</text><rect class="panel-a" x="24" y="210" width="732" height="68" rx="6"/><text class="sh" x="32" y="230">Typical</text><text class="sh" x="32" y="248">wording</text><text class="cell" x="160" y="230">"Every citizen shall have the right ..."</text><text class="cell" x="462" y="230">"The State shall ..." or "shall</text><text class="cell" x="462" y="247">endeavour ..."</text><rect class="panel-b" x="24" y="278" width="732" height="68" rx="6"/><text class="sh" x="32" y="298">Force on laws</text><text class="cell" x="160" y="298">A law that takes away the right is void</text><text class="cell" x="160" y="315">(Article 8(2))</text><text class="cell" x="462" y="298">A law cannot be challenged for failing</text><text class="cell" x="462" y="315">a Principle (Article 30(2))</text><rect class="panel-a" x="24" y="346" width="732" height="68" rx="6"/><text class="sh" x="32" y="366">In court</text><text class="cell" x="160" y="366">Enforced: High Court (Article 199),</text><text class="cell" x="160" y="383">Federal Constitutional Court (Article</text><text class="cell" x="160" y="400">175E(3))</text><text class="cell" x="462" y="366">No action lies against the State on</text><text class="cell" x="462" y="383">this ground (Article 30(2))</text><rect class="panel-b" x="24" y="414" width="732" height="68" rx="6"/><text class="sh" x="32" y="434">Resources</text><text class="cell" x="160" y="434">Limits come only as the Constitution</text><text class="cell" x="160" y="451">allows</text><text class="cell" x="462" y="434">May depend on resources being available</text><text class="cell" x="462" y="451">(Article 29(2))</text><rect class="panel-a" x="24" y="482" width="732" height="68" rx="6"/><text class="sh" x="32" y="502">Who checks</text><text class="cell" x="160" y="502">Courts, on a petition</text><text class="cell" x="462" y="502">The organ itself (Article 30(1));</text><text class="cell" x="462" y="519">assemblies through a yearly report</text><text class="cell" x="462" y="536">(Article 29(3)); voters</text><rect class="panel-b" x="24" y="550" width="732" height="68" rx="6"/><text class="sh" x="32" y="570">Education</text><text class="sh" x="32" y="588">example</text><text class="cell" x="160" y="570">Article 25A: free, compulsory education,</text><text class="cell" x="160" y="587">ages 5 to 16</text><text class="cell" x="462" y="570">Article 37(b): remove illiteracy;</text><text class="cell" x="462" y="587">secondary education within minimum</text><text class="cell" x="462" y="604">possible period</text><text class="wm" x="768" y="642" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
