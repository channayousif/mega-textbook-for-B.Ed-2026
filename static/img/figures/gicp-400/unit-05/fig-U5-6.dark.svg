<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of three Principles of Policy, each linked to a State duty</title><desc id="d">Diagram linking three Principles of Policy to State duties. The Islamic way of life (Article 31) leads to the duty to enable Muslims to order their lives by Islam and to try to make teaching of the Holy Quran and Islamiat compulsory for Muslims. Social justice and equality (Articles 33, 34, 36, 37 and 38) lead to the duty to raise living standards, reduce inequality, discourage prejudice and safeguard minorities. Promotion of education (Article 37) leads to the duty to remove illiteracy, provide secondary education and make higher education accessible on merit. A bar below shows that each may depend on resources and none can be enforced in court.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><text class="h" x="24" y="30">Three Principles of Policy, each linked to a State duty</text><rect class="panel-a" x="24" y="46" width="250" height="96" rx="6"/><text class="sh" x="34" y="66">Islamic way of life</text><text class="cell" x="34" y="84">Article 31</text><line class="stroke" x1="274" y1="94" x2="340" y2="94" marker-end="url(#arrow)"/><rect class="panel-a" x="342" y="46" width="414" height="96" rx="6"/><text class="sh" x="352" y="66">State duty</text><text class="cell" x="352" y="84">Take steps to enable Muslims to order their lives by</text><text class="cell" x="352" y="101">Islam. Try to make teaching of the Holy Quran and</text><text class="cell" x="352" y="118">Islamiat compulsory for Muslims.</text><rect class="panel-b" x="24" y="158" width="250" height="96" rx="6"/><text class="sh" x="34" y="178">Social justice and</text><text class="sh" x="34" y="196">equality</text><text class="cell" x="34" y="214">Articles 33, 34, 36, 37, 38</text><line class="stroke" x1="274" y1="206" x2="340" y2="206" marker-end="url(#arrow)"/><rect class="panel-b" x="342" y="158" width="414" height="96" rx="6"/><text class="sh" x="352" y="178">State duty</text><text class="cell" x="352" y="196">Raise living standards and reduce inequality.</text><text class="cell" x="352" y="213">Discourage prejudice. Ensure women take full part.</text><text class="cell" x="352" y="230">Safeguard minorities.</text><rect class="panel-c" x="24" y="270" width="250" height="96" rx="6"/><text class="sh" x="34" y="290">Promotion of education</text><text class="cell" x="34" y="308">Article 37(a), (b), (c), (f)</text><line class="stroke" x1="274" y1="318" x2="340" y2="318" marker-end="url(#arrow)"/><rect class="panel-c" x="342" y="270" width="414" height="96" rx="6"/><text class="sh" x="352" y="290">State duty</text><text class="cell" x="352" y="308">Remove illiteracy. Provide free, compulsory secondary</text><text class="cell" x="352" y="325">education within minimum possible period. Make higher</text><text class="cell" x="352" y="342">education accessible on merit.</text><rect class="panel" x="24" y="384" width="732" height="76" rx="6"/><text class="sh" x="34" y="404">All three: Articles 29 and 30</text><text class="cell" x="34" y="422">Every organ of the State must act on them (29(1)). Each may depend on resources (29(2)). A yearly</text><text class="cell" x="34" y="439">report goes to the assemblies (29(3)). No court action on this ground (30(2)).</text><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
