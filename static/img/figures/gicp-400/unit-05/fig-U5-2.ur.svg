<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اختیارات کی علیحدگی: تین ادارے جو ایک دوسرے پر نظر رکھتے ہیں</title><desc id="d">اختیارات کی علیحدگی کا تصوراتی نقشہ۔ مقننہ، انتظامیہ اور عدلیہ کا ہر ایک کا اپنا اہم کام ہے، اور تیر ان کے درمیان نگرانی دکھاتے ہیں۔ قومی اسمبلی عدم اعتماد کی رأی سے وزیرِ اعظم کو ہٹا سکتی ہے، اور وزیرِ اعظم قومی اسمبلی تحلیل کرنے کا مشورہ دے سکتا ہے۔ عدالتیں ایسا قانون جو بنیادی حقوق چھین لے اسے کالعدم قرار دے سکتی ہیں، اور دونوں ایوانوں کے اراکین جوڈیشل کمیشن میں بیٹھتے ہیں جو جج کی نامزدگی کرتا ہے۔ ہائی کورٹس افسران کو ہدایات دے سکتے ہیں، اور وفاقی وزیرِ قانون جوڈیشل کمیشن میں بیٹھتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><text class="h" x="756" y="30" text-anchor="end">اختیارات کی علیحدگی: تین ادارے جو ایک دوسرے پر نظر رکھتے ہیں</text><rect class="panel-b" x="24" y="44" width="732" height="52" rx="6"/><text class="sh" x="390" y="64" text-anchor="middle">مقننہ: مجلسِ شوریٰ (پارلیمنٹ)۔ اہم کام: قوانین بنانا</text><line class="stroke" x1="744" y1="96" x2="744" y2="328" marker-end="url(#arrow)"/><text class="cell" x="732" y="126" text-anchor="end">قومی اسمبلی</text><text class="cell" x="732" y="143" text-anchor="end">ہٹا سکتی ہے</text><text class="cell" x="732" y="160" text-anchor="end">وزیرِ اعظم کو</text><text class="cell" x="732" y="177" text-anchor="end">عدم اعتماد کی</text><text class="cell" x="732" y="194" text-anchor="end">رأی سے (دفعہ 95)۔</text><text class="cell" x="732" y="211" text-anchor="end">کابینہ</text><text class="cell" x="732" y="228" text-anchor="end">دونوں ایوانوں کے</text><text class="cell" x="732" y="245" text-anchor="end">جوابدہ ہے (دفعہ</text><text class="cell" x="732" y="262" text-anchor="end">91(6))۔</text><line class="stroke" x1="574" y1="328" x2="574" y2="98" marker-end="url(#arrow)"/><text class="cell" x="564" y="126" text-anchor="end">وزیرِ اعظم قومی</text><text class="cell" x="564" y="143" text-anchor="end">اسمبلی تحلیل کرنے کا</text><text class="cell" x="564" y="160" text-anchor="end">مشورہ صدر کو دے</text><text class="cell" x="564" y="177" text-anchor="end">سکتا ہے</text><text class="cell" x="564" y="194" text-anchor="end">(دفعہ 58(1))۔</text><line class="stroke" x1="370" y1="328" x2="370" y2="98" marker-end="url(#arrow)"/><text class="cell" x="360" y="126" text-anchor="end">جو قانون بنیادی</text><text class="cell" x="360" y="143" text-anchor="end">حقوق چھین لے</text><text class="cell" x="360" y="160" text-anchor="end">وہ کالعدم ہے</text><text class="cell" x="360" y="177" text-anchor="end">(دفعہ 8(2))۔</text><text class="cell" x="360" y="194" text-anchor="end">عدالتیں ایسے</text><text class="cell" x="360" y="211" text-anchor="end">معاملات کا فیصلہ کرتی ہیں۔</text><line class="stroke" x1="200" y1="96" x2="200" y2="328" marker-end="url(#arrow)"/><text class="cell" x="190" y="126" text-anchor="end">دونوں ایوانوں کے اراکین</text><text class="cell" x="190" y="143" text-anchor="end">جوڈیشل کمیشن میں</text><text class="cell" x="190" y="160" text-anchor="end">بیٹھتے ہیں جو جج کی</text><text class="cell" x="190" y="177" text-anchor="end">نامزدگی کرتی ہے</text><text class="cell" x="190" y="194" text-anchor="end">(دفعہ 175A)۔</text><rect class="panel-a" x="404" y="330" width="352" height="60" rx="6"/><text class="sh" x="580" y="350" text-anchor="middle">انتظامیہ: وزیرِ اعظم اور کابینہ</text><text class="cell" x="580" y="368" text-anchor="middle">اہم کام: حکومت چلانا، قوانین پر عمل</text><rect class="panel-c" x="24" y="330" width="352" height="60" rx="6"/><text class="sh" x="200" y="350" text-anchor="middle">عدلیہ: عدالتیں</text><text class="cell" x="200" y="368" text-anchor="middle">اہم کام: تنازعات کا فیصلہ، قانون کی تشریح</text><path class="stroke" d="M80 390 L80 412 L480 412 L480 392" marker-end="url(#arrow)"/><text class="cell" x="470" y="432" text-anchor="end">ہائی کورٹس افسران اور حکومتوں کو</text><text class="cell" x="470" y="449" text-anchor="end">ہدایات دے سکتے ہیں (دفعہ 199)۔</text><path class="stroke" d="M680 390 L680 470 L40 470 L40 392" marker-end="url(#arrow)"/><text class="cell" x="670" y="490" text-anchor="end">وفاقی وزیرِ قانون و انصاف جوڈیشل کمیشن میں بیٹھتا ہے (دفعہ</text><text class="cell" x="670" y="507" text-anchor="end">175A)۔</text><text class="small" x="756" y="532" text-anchor="end">ہر تیر اس ادارے کی طرف اشارہ کرتا ہے جس پر نظر رکھی جا رہی ہے۔ وزراء پارلیمنٹ میں بیٹھتے ہیں، اس لیے علیحدگی</text><text class="small" x="756" y="549" text-anchor="end">عدالتوں کے لیے سب سے واضح ہے (دفعہ 175(3))۔</text><text class="wm" x="12" y="570" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
