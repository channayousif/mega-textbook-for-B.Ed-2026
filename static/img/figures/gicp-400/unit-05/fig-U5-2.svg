<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of separation of powers and the checks between the three organs</title><desc id="d">Concept map of separation of powers. The legislature, the executive and the judiciary each have their own main job, and arrows show the checks between them. The National Assembly can remove the Prime Minister by a vote of no-confidence, and the Prime Minister can advise dissolving the National Assembly. Courts can treat a law that takes away Fundamental Rights as void, and members of both Houses sit on the Judicial Commission that nominates judges. High Courts can give directions to officials, and the Federal Law Minister sits on the Judicial Commission.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="580"/><text class="h" x="24" y="30">Separation of powers: three organs that check each other</text><rect class="panel-b" x="24" y="44" width="732" height="52" rx="6"/><text class="sh" x="390.0" y="64" text-anchor="middle">Legislature: Majlis-e-Shoora (Parliament). Main job: makes laws</text><line class="stroke" x1="36" y1="96" x2="36" y2="328" marker-end="url(#arrow)"/><text class="cell" x="48" y="126">National Assembly</text><text class="cell" x="48" y="143">can remove the</text><text class="cell" x="48" y="160">Prime Minister by</text><text class="cell" x="48" y="177">a no-confidence</text><text class="cell" x="48" y="194">vote (Article 95).</text><text class="cell" x="48" y="211">The Cabinet</text><text class="cell" x="48" y="228">answers to both</text><text class="cell" x="48" y="245">Houses (Article</text><text class="cell" x="48" y="262">91(6)).</text><line class="stroke" x1="206" y1="328" x2="206" y2="98" marker-end="url(#arrow)"/><text class="cell" x="216" y="126">Prime Minister can</text><text class="cell" x="216" y="143">advise the President</text><text class="cell" x="216" y="160">to dissolve the</text><text class="cell" x="216" y="177">National Assembly</text><text class="cell" x="216" y="194">(Article 58(1)).</text><line class="stroke" x1="410" y1="328" x2="410" y2="98" marker-end="url(#arrow)"/><text class="cell" x="420" y="126">A law that takes</text><text class="cell" x="420" y="143">away Fundamental</text><text class="cell" x="420" y="160">Rights is void</text><text class="cell" x="420" y="177">(Article 8(2)).</text><text class="cell" x="420" y="194">Courts decide such</text><text class="cell" x="420" y="211">cases.</text><line class="stroke" x1="580" y1="96" x2="580" y2="328" marker-end="url(#arrow)"/><text class="cell" x="590" y="126">Members of both</text><text class="cell" x="590" y="143">Houses sit on the</text><text class="cell" x="590" y="160">Judicial Commission</text><text class="cell" x="590" y="177">that nominates judges</text><text class="cell" x="590" y="194">(Article 175A).</text><rect class="panel-a" x="24" y="330" width="352" height="60" rx="6"/><text class="sh" x="200.0" y="350" text-anchor="middle">Executive: Prime Minister and Cabinet</text><text class="cell" x="200.0" y="368" text-anchor="middle">Main job: runs government, applies laws</text><rect class="panel-c" x="404" y="330" width="352" height="60" rx="6"/><text class="sh" x="580.0" y="350" text-anchor="middle">Judiciary: the courts</text><text class="cell" x="580.0" y="368" text-anchor="middle">Main job: decides disputes, interprets law</text><path class="stroke" d="M 700 390 L 700 412 L 300 412 L 300 392" marker-end="url(#arrow)"/><text class="cell" x="310" y="432">High Courts can give directions to officials and</text><text class="cell" x="310" y="449">governments (Article 199).</text><path class="stroke" d="M 100 390 L 100 470 L 740 470 L 740 392" marker-end="url(#arrow)"/><text class="cell" x="110" y="490">The Federal Minister for Law and Justice sits on the Judicial Commission (Article</text><text class="cell" x="110" y="507">175A).</text><text class="small" x="24" y="532">Each arrow points at the organ being checked. Ministers sit in Parliament, so the separation is</text><text class="small" x="24" y="549">sharpest for the courts (Article 175(3)).</text><text class="wm" x="768" y="570" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
