<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کسی بنیادی حق کے نفاذ کا راستہ</title><desc id="d">کسی بنیادی حق کے نفاذ کا راستہ دکھانے والا فلو چارٹ۔ جو شخص خیال کرتا ہے کہ کسی عوامی ادارے نے کوئی حق توڑا ہے، وہ پہلے پوچھتا ہے کہ کیا قانون کوئی اور مناسب قانونی علاج دیتا ہے، اور اگر دیتا ہے تو وہی استعمال کرتا ہے۔ اگر نہیں دیتا، تو متاثرہ شخص دفعہ 199(1)(c) کے تحت ہائی کورٹ میں درخواست دیتا ہے۔ ہائی کورٹ ہدایات دے سکتی ہے، اور وفاقی آئینی عدالت میں اپیل کے لیے دفعہ 175F(1)(c) کے تحت اس عدالت کی اجازت چاہیے۔ عوامی اہمیت کا سوال دفعہ 175E(3) کے تحت وفاقی آئینی عدالت میں درخواست دے کر بھی لایا جا سکتا ہے، جو اختیار سپریم کورٹ دفعہ 184(3) کے تحت 13 نومبر 2025 تک رکھتی تھی۔ طارئی حالت کے دوران صدر دفعہ 233(2) کے تحت خصوصی حقوق کے لیے عدالت جانے کا حق معطل کر سکتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="610"/><text class="h" x="756" y="30" text-anchor="end">کسی بنیادی حق کے نفاذ کا راستہ</text><rect class="panel-b" x="336" y="44" width="420" height="56" rx="6"/><text class="sh" x="746" y="64" text-anchor="end">شروع: کوئی عوامی ادارہ یا افسر کسی</text><text class="sh" x="746" y="82" text-anchor="end">بنیادی حق توڑنے لگتا ہے</text><line class="stroke" x1="546" y1="100" x2="546" y2="128" marker-end="url(#arrow)"/><rect class="panel-a" x="336" y="130" width="420" height="52" rx="6"/><text class="sh" x="746" y="150" text-anchor="end">کیا قانون کوئی اور مناسب قانونی علاج دیتا ہے؟</text><path class="stroke" d="M546 182 L546 212" marker-end="url(#arrow)"/><text class="sh" x="536" y="204" text-anchor="end">نہیں</text><path class="stroke" d="M336 156 L313 156 L313 276 L292 276" marker-end="url(#arrow)"/><text class="sh" x="332" y="146" text-anchor="end">ہاں</text><rect class="panel" x="24" y="240" width="266" height="74" rx="6"/><text class="sh" x="280" y="260" text-anchor="end">پہلے وہی علاج استعمال کریں</text><text class="cell" x="280" y="278" text-anchor="end">مثلاً کسی محکمے کی اپیل</text><text class="cell" x="280" y="295" text-anchor="end">یا کوئی عام عدالت</text><rect class="panel-a" x="336" y="214" width="420" height="84" rx="6"/><text class="sh" x="746" y="234" text-anchor="end">متاثرہ شخص رٹ درخواست دیتا ہے</text><text class="sh" x="746" y="252" text-anchor="end">ہائی کورٹ میں</text><text class="cell" x="746" y="270" text-anchor="end">دفعہ 199(1)(c)۔ سندھ میں یہ سندھ ہائی</text><text class="cell" x="746" y="287" text-anchor="end">کورٹ ہے۔</text><line class="stroke" x1="546" y1="298" x2="546" y2="326" marker-end="url(#arrow)"/><rect class="panel-a" x="336" y="328" width="420" height="56" rx="6"/><text class="sh" x="746" y="348" text-anchor="end">ہائی کورٹ نفاذ کے لیے ہدایات دے سکتی ہے</text><text class="sh" x="746" y="366" text-anchor="end">حق کے</text><line class="stroke" x1="546" y1="384" x2="546" y2="412" marker-end="url(#arrow)"/><rect class="panel-a" x="336" y="414" width="420" height="74" rx="6"/><text class="sh" x="746" y="434" text-anchor="end">اپیل وفاقی آئینی عدالت میں جاتی ہے</text><text class="sh" x="746" y="452" text-anchor="end">صرف اس کی اجازت کے ساتھ</text><text class="cell" x="746" y="470" text-anchor="end">دفعہ 175F(1)(c)</text><line class="stroke" x1="336" y1="72" x2="292" y2="72" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="44" width="266" height="180" rx="6"/><text class="sh" x="280" y="64" text-anchor="end">عوامی اہمیت کا</text><text class="sh" x="280" y="82" text-anchor="end">سوال؟</text><text class="cell" x="280" y="100" text-anchor="end">وفاقی آئینی عدالت میں</text><text class="cell" x="280" y="117" text-anchor="end">درخواست، دفعہ</text><text class="cell" x="280" y="134" text-anchor="end">175E(3)۔ 13 نومبر 2025 تک</text><text class="cell" x="280" y="151" text-anchor="end">یہ اختیار سپریم کورٹ</text><text class="cell" x="280" y="168" text-anchor="end">کے پاس تھا، دفعہ 184(3)۔ پرانی</text><text class="cell" x="280" y="185" text-anchor="end">کتابیں اب بھی ایسا ہی کہتی ہیں۔</text><rect class="panel" x="24" y="504" width="732" height="76" rx="6"/><text class="sh" x="746" y="524" text-anchor="end">اعلانِ طارئی حالت کے دوران</text><text class="cell" x="746" y="542" text-anchor="end">صدر اس حکم میں نام کیے گئے حقوق کے لیے عدالت جانے کا حق معطل کر سکتا ہے (دفعہ</text><text class="cell" x="746" y="559" text-anchor="end">233(2))۔ ہر حکم دونوں ایوانوں کی منظوری کے لیے پیش ہوتا ہے (دفعہ 233(3))۔</text><text class="wm" x="12" y="600" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
