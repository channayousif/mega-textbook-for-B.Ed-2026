<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 572" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منتخب بنیادی حقوق (دفعات 8-28) اسکولی زندگی میں</title><desc id="d">نو منتخب بنیادی حقوق کی جدول، ہر حق کے ساتھ اس کا دفعہ اور اسکولی زندگی کی مثال۔ دفعہ 11(3) چودہ سال سے کم عمر کے بچوں کو فیکٹریوں، کانوں اور خطرناک کاموں سے دور رکھتا ہے۔ دفعہ 14(1) عزت کا تحفظ کرتا ہے۔ دفعہ 19 مناسب حدود کے ساتھ اظہارِ رائے کی آزادی دیتا ہے۔ دفعہ 19A عوامی معلومات تک رسائی دیتا ہے۔ دفعہ 20 مذہب کا تحفظ کرتا ہے۔ دفعہ 22 جبری مذہبی تعلیم اور ناانصاف داخلے کو حرام کرتا ہے۔ دفعہ 25 قانون کے سامنے مساوات دیتا ہے۔ دفعہ 25A پانچ سے سولہ سال کی عمر میں مفت اور لازمی تعلیم دیتا ہے۔ دفعہ 28 زبان اور ثقافت کا تحفظ کرتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="572"/><text class="h" x="756" y="30" text-anchor="end">منتخب بنیادی حقوق (دفعات 8-28) اسکولی زندگی میں</text><rect class="panel" x="24" y="42" width="732" height="32" rx="6"/><text class="sh" x="748" y="63" text-anchor="end">دفعہ</text><text class="sh" x="650" y="63" text-anchor="end">یہ کیا محفوظ کرتا ہے</text><text class="sh" x="394" y="63" text-anchor="end">اسکولی زندگی کی مثال</text><rect class="panel-a" x="24" y="74" width="732" height="50" rx="6"/><text class="sh" x="748" y="94" text-anchor="end">11(3)</text><text class="cell" x="650" y="94" text-anchor="end">چودہ سال سے کم بچہ فیکٹری،</text><text class="cell" x="650" y="111" text-anchor="end">کان یا خطرناک کام میں نہیں</text><text class="cell" x="394" y="94" text-anchor="end">چھٹی جماعت کا طالب علم آمد بند کرتا ہے کیونکہ خاندان</text><text class="cell" x="394" y="111" text-anchor="end">بچے کو فیکٹری بھیج دیتا ہے۔</text><rect class="panel-b" x="24" y="124" width="732" height="50" rx="6"/><text class="sh" x="748" y="144" text-anchor="end">14(1)</text><text class="cell" x="650" y="144" text-anchor="end">شخص کی عزت</text><text class="cell" x="650" y="161" text-anchor="end">ناقابلِ خدشن ہے</text><text class="cell" x="394" y="144" text-anchor="end">استاد کو کسی طالب علم کو کلاس کے سامنے</text><text class="cell" x="394" y="161" text-anchor="end">ذلیل نہیں کرنا چاہیے۔</text><rect class="panel-a" x="24" y="174" width="732" height="50" rx="6"/><text class="sh" x="748" y="194" text-anchor="end">19</text><text class="cell" x="650" y="194" text-anchor="end">اظہارِ رائے کی آزادی،</text><text class="cell" x="650" y="211" text-anchor="end">قانون کے تحت مناسب حدود کے ساتھ</text><text class="cell" x="394" y="194" text-anchor="end">طلبہ بحث میں اختلاف کر سکتے ہیں۔ گفتگو ہر</text><text class="cell" x="394" y="211" text-anchor="end">حد سے آزاد نہیں۔</text><rect class="panel-b" x="24" y="224" width="732" height="50" rx="6"/><text class="sh" x="748" y="244" text-anchor="end">19A</text><text class="cell" x="650" y="244" text-anchor="end">عوامی اہمیت کی معلومات تک</text><text class="cell" x="650" y="261" text-anchor="end">رسائی</text><text class="cell" x="394" y="244" text-anchor="end">والد اسکول کو متاثر کرنے والے معاملے کی</text><text class="cell" x="394" y="261" text-anchor="end">عوامی معلومات مانگتا ہے۔</text><rect class="panel-a" x="24" y="274" width="732" height="50" rx="6"/><text class="sh" x="748" y="294" text-anchor="end">20</text><text class="cell" x="650" y="294" text-anchor="end">مذہب کا اعلان، عبادت اور تبلیغ</text><text class="cell" x="650" y="311" text-anchor="end">کرنا، قانون کے تابع</text><text class="cell" x="394" y="294" text-anchor="end">ہر مذہب کے طلبہ اپنا مذہب</text><text class="cell" x="394" y="311" text-anchor="end">مان سکتے ہیں۔</text><rect class="panel-b" x="24" y="324" width="732" height="50" rx="6"/><text class="sh" x="748" y="344" text-anchor="end">22(1),</text><text class="sh" x="748" y="362" text-anchor="end" font-size="12">22(3)(b)</text><text class="cell" x="650" y="344" text-anchor="end">کوئی جبری مذہبی تعلیم نہیں؛</text><text class="cell" x="650" y="361" text-anchor="end">منصفانہ داخلہ</text><text class="cell" x="394" y="344" text-anchor="end">طالب علم کو دوسرے مذہب کا سبق لینے کا مجبور نہیں۔</text><text class="cell" x="394" y="361" text-anchor="end">امداد یافتہ اسکول بچے کو ذات پر انکار نہیں کر سکتا۔</text><rect class="panel-a" x="24" y="374" width="732" height="50" rx="6"/><text class="sh" x="748" y="394" text-anchor="end">25</text><text class="cell" x="650" y="394" text-anchor="end">قانون کے سامنے مساوات؛</text><text class="cell" x="650" y="411" text-anchor="end">جنس کی بنیاد پر امتیاز نہیں</text><text class="cell" x="394" y="394" text-anchor="end">لڑکیوں اور لڑکوں کو یکساں تحفظ کا حق دار ہے۔</text><text class="cell" x="394" y="411" text-anchor="end">لڑکیوں کے لیے خصوصی انتظام جائز ہے (25(3))۔</text><rect class="panel-b" x="24" y="424" width="732" height="50" rx="6"/><text class="sh" x="748" y="444" text-anchor="end">25A</text><text class="cell" x="650" y="444" text-anchor="end">مفت اور لازمی تعلیم،</text><text class="cell" x="650" y="461" text-anchor="end">پانچ سے سولہ سال کی عمر</text><text class="cell" x="394" y="444" text-anchor="end">دس سالہ بچے کو مفت اسکول کا حق ہے۔</text><rect class="panel-a" x="24" y="474" width="732" height="50" rx="6"/><text class="sh" x="748" y="494" text-anchor="end">28</text><text class="cell" x="650" y="494" text-anchor="end">زبان، رسمِ الخط اور ثقافت</text><text class="cell" x="650" y="511" text-anchor="end">کا تحفظ، دفعہ 251 کے تابع</text><text class="cell" x="394" y="494" text-anchor="end">سندھی یا دھاتکی بولنے والا برادری اپنی زبان</text><text class="cell" x="394" y="511" text-anchor="end">برقرار رکھ سکتا ہے اور فروغ دے سکتا ہے۔</text><text class="wm" x="12" y="562" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
