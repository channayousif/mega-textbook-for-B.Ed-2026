<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 572" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of selected Fundamental Rights with their article and a school-life example</title><desc id="d">Table of nine selected Fundamental Rights, each with its article and a school-life example. Article 11(3) keeps children under 14 out of factories, mines and hazardous work. Article 14(1) protects dignity. Article 19 gives freedom of speech with reasonable limits. Article 19A gives access to public information. Article 20 protects religion. Article 22 bars forced religious instruction and unfair admission. Article 25 gives equality before law. Article 25A gives free and compulsory education at ages five to sixteen. Article 28 protects language and culture.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="572"/><text class="h" x="24" y="30">Selected Fundamental Rights (Articles 8-28) in school life</text><rect class="panel" x="24" y="42" width="732" height="32" rx="6"/><text class="sh" x="32" y="63">Article</text><text class="sh" x="130" y="63">What it protects</text><text class="sh" x="386" y="63">School-life example</text><rect class="panel-a" x="24" y="74" width="732" height="50" rx="6"/><text class="sh" x="32" y="94">11(3)</text><text class="cell" x="130" y="94">No child under 14 in a factory,</text><text class="cell" x="130" y="111">mine or hazardous work</text><text class="cell" x="386" y="94">A Class 6 pupil stops coming because the family</text><text class="cell" x="386" y="111">sends the child to a factory.</text><rect class="panel-b" x="24" y="124" width="732" height="50" rx="6"/><text class="sh" x="32" y="144">14(1)</text><text class="cell" x="130" y="144">Dignity of the person is</text><text class="cell" x="130" y="161">inviolable</text><text class="cell" x="386" y="144">A teacher must not humiliate a pupil in front of</text><text class="cell" x="386" y="161">the class.</text><rect class="panel-a" x="24" y="174" width="732" height="50" rx="6"/><text class="sh" x="32" y="194">19</text><text class="cell" x="130" y="194">Freedom of speech, with</text><text class="cell" x="130" y="211">reasonable limits set by law</text><text class="cell" x="386" y="194">Pupils may disagree in a debate. Speech is not</text><text class="cell" x="386" y="211">free of every limit.</text><rect class="panel-b" x="24" y="224" width="732" height="50" rx="6"/><text class="sh" x="32" y="244">19A</text><text class="cell" x="130" y="244">Access to information of public</text><text class="cell" x="130" y="261">importance</text><text class="cell" x="386" y="244">A parent asks for public information about a</text><text class="cell" x="386" y="261">matter that affects the school.</text><rect class="panel-a" x="24" y="274" width="732" height="50" rx="6"/><text class="sh" x="32" y="294">20</text><text class="cell" x="130" y="294">Profess, practise and propagate</text><text class="cell" x="130" y="311">religion, subject to law</text><text class="cell" x="386" y="294">Pupils of every faith may practise their own</text><text class="cell" x="386" y="311">religion.</text><rect class="panel-b" x="24" y="324" width="732" height="50" rx="6"/><text class="sh" x="32" y="344">22(1),</text><text class="sh" x="32" y="362">22(3)(b)</text><text class="cell" x="130" y="344">No forced religious instruction;</text><text class="cell" x="130" y="361">fair admission</text><text class="cell" x="386" y="344">A pupil need not join a lesson in another faith.</text><text class="cell" x="386" y="361">An aided school cannot refuse a child for caste.</text><rect class="panel-a" x="24" y="374" width="732" height="50" rx="6"/><text class="sh" x="32" y="394">25</text><text class="cell" x="130" y="394">Equality before law; no</text><text class="cell" x="130" y="411">discrimination on basis of sex</text><text class="cell" x="386" y="394">Girls and boys are entitled to equal protection.</text><text class="cell" x="386" y="411">Special provision for girls is allowed (25(3)).</text><rect class="panel-b" x="24" y="424" width="732" height="50" rx="6"/><text class="sh" x="32" y="444">25A</text><text class="cell" x="130" y="444">Free and compulsory education,</text><text class="cell" x="130" y="461">ages five to sixteen</text><text class="cell" x="386" y="444">A child of ten has a right to free schooling.</text><rect class="panel-a" x="24" y="474" width="732" height="50" rx="6"/><text class="sh" x="32" y="494">28</text><text class="cell" x="130" y="494">Preserve language, script and</text><text class="cell" x="130" y="511">culture, subject to Article 251</text><text class="cell" x="386" y="494">A Sindhi or Dhatki-speaking community may keep</text><text class="cell" x="386" y="511">and promote its language.</text><text class="wm" x="768" y="562" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
