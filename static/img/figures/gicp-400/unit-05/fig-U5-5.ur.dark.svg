<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 652" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بنیادی حقوق اور حکمتِ عملی کے اصول کا موازنہ</title><desc id="d">بنیادی حقوق اور حکمتِ عملی کے اصول کا موازنہ کرنے والی جدول، آٹھ قطاروں میں۔ بنیادی حقوق دفعات 8 تا 28 میں ہیں، ریاست کو محدود کر کے لوگوں کی حفاظت کرتے ہیں، متصادم قانون کو کالعدم کرتے ہیں، اور ہائی کورٹ اور وفاقی آئینی عدالت میں نافذ کیے جا سکتے ہیں۔ حکمتِ عملی کے اصول دفعات 29 تا 40 میں ہیں، ریاست کو قومی مقاصد کی طرف رہنمائی کرتے ہیں، دستیاب وسائل پر منحصر ہو سکتے ہیں، اور عدالت میں کسی قانون یا کارروائی کو چیلنج کرنے کے لیے استعمال نہیں ہو سکتے، اس لیے انہیں اسمبلیوں کو سالانہ رپورٹ اور ووٹرز کے ذریعے چیک کیا جاتا ہے۔ تعلیم کی مثال حقوق کے لیے دفعہ 25A اور اصولوں کے لیے دفعہ 37(b) ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="652"/><text class="h" x="756" y="30" text-anchor="end">بنیادی حقوق اور حکمتِ عملی کے اصول کا موازنہ</text><rect class="panel" x="24" y="42" width="732" height="32" rx="6"/><text class="sh" x="748" y="63" text-anchor="end">خصوصیت</text><text class="sh" x="620" y="63" text-anchor="end">بنیادی حقوق</text><text class="sh" x="318" y="63" text-anchor="end">حکمتِ عملی کے اصول</text><rect class="panel-a" x="24" y="74" width="732" height="68" rx="6"/><text class="sh" x="748" y="94" text-anchor="end">کہاں</text><text class="cell" x="620" y="94" text-anchor="end">حصہ دوم، باب 1: دفعات 8-28</text><text class="cell" x="318" y="94" text-anchor="end">حصہ دوم، باب 2: دفعات 29-40</text><rect class="panel-b" x="24" y="142" width="732" height="68" rx="6"/><text class="sh" x="748" y="162" text-anchor="end">مقصد</text><text class="cell" x="620" y="162" text-anchor="end">ریاست کو محدود کر کے لوگوں کی حفاظت</text><text class="cell" x="318" y="162" text-anchor="end">ریاست کو قومی مقاصد کی طرف رہنمائی</text><rect class="panel-a" x="24" y="210" width="732" height="68" rx="6"/><text class="sh" x="748" y="230" text-anchor="end">عام</text><text class="sh" x="748" y="248" text-anchor="end">الفاظ</text><text class="cell" x="620" y="230" text-anchor="end">"ہر شہری کو حق ہوگا ..."</text><text class="cell" x="318" y="230" text-anchor="end">"ریاست کرے گی ..." یا "کوشش</text><text class="cell" x="318" y="247" text-anchor="end">کرے گی ..."</text><rect class="panel-b" x="24" y="278" width="732" height="68" rx="6"/><text class="sh" x="748" y="298" text-anchor="end">قوانین پر قوت</text><text class="cell" x="620" y="298" text-anchor="end">جو قانون حق چھین لے وہ کالعدم ہے</text><text class="cell" x="620" y="315" text-anchor="end">(دفعہ 8(2))</text><text class="cell" x="318" y="298" text-anchor="end">کسی قانون کو اصول پر عمل نہ کرنے</text><text class="cell" x="318" y="315" text-anchor="end">کی بنیاد پر چیلنج نہیں کیا جا سکتا (دفعہ 30(2))</text><rect class="panel-a" x="24" y="346" width="732" height="68" rx="6"/><text class="sh" x="748" y="366" text-anchor="end">عدالت میں</text><text class="cell" x="620" y="366" text-anchor="end">نافذ: ہائی کورٹ (دفعہ 199)،</text><text class="cell" x="620" y="383" text-anchor="end">وفاقی آئینی عدالت (دفعہ</text><text class="cell" x="620" y="400" text-anchor="end">175E(3))</text><text class="cell" x="318" y="366" text-anchor="end">ریاست خلاف اس بنیاد پر</text><text class="cell" x="318" y="383" text-anchor="end">کوئی دعویٰ نہیں (دفعہ 30(2))</text><rect class="panel-b" x="24" y="414" width="732" height="68" rx="6"/><text class="sh" x="748" y="434" text-anchor="end">وسائل</text><text class="cell" x="620" y="434" text-anchor="end">حدود صرف اس طرح آتی ہیں جس کی آئین</text><text class="cell" x="620" y="451" text-anchor="end">اجازت دیتی ہے</text><text class="cell" x="318" y="434" text-anchor="end">وسائل کی دستیابی پر منحصر ہو سکتے ہیں</text><text class="cell" x="318" y="451" text-anchor="end">(دفعہ 29(2))</text><rect class="panel-a" x="24" y="482" width="732" height="68" rx="6"/><text class="sh" x="748" y="502" text-anchor="end">کون چیک کرتا ہے</text><text class="cell" x="620" y="502" text-anchor="end">عدالتیں، درخواست پر</text><text class="cell" x="318" y="502" text-anchor="end">خود ادارہ (دفعہ 30(1))؛</text><text class="cell" x="318" y="519" text-anchor="end">اسمبلیاں سالانہ رپورٹ کے ذریعے</text><text class="cell" x="318" y="536" text-anchor="end">(دفعہ 29(3))؛ ووٹرز</text><rect class="panel-b" x="24" y="550" width="732" height="68" rx="6"/><text class="sh" x="748" y="570" text-anchor="end">تعلیم</text><text class="sh" x="748" y="588" text-anchor="end">کی مثال</text><text class="cell" x="620" y="570" text-anchor="end">دفعہ 25A: مفت، لازمی تعلیم،</text><text class="cell" x="620" y="587" text-anchor="end">پانچ سے 16 سال</text><text class="cell" x="318" y="570" text-anchor="end">دفعہ 37(b): ناخواندگی کا خاتمہ؛</text><text class="cell" x="318" y="587" text-anchor="end">کم سے کم مدت میں ثانوی تعلیم</text><text class="cell" x="318" y="604" text-anchor="end">کا اہتمام</text><text class="wm" x="12" y="642" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
