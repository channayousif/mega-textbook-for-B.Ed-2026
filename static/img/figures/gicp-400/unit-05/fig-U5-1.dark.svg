<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the federation and its law-making areas</title><desc id="d">Diagram of the federation. The Constitution at the top divides law-making power between two levels. Parliament alone makes laws on the Federal Legislative List, such as defence, external affairs and currency. The four Provincial Assemblies of Balochistan, Khyber Pakhtunkhwa, Punjab and Sindh make laws on every matter not on that list, such as school education. Both levels may legislate on criminal law, criminal procedure and evidence, and a valid Act of Parliament prevails over a conflicting provincial Act.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="24" y="30">The federation: who makes which laws</text><rect class="panel" x="180" y="44" width="420" height="56" rx="6"/><text class="sh" x="390.0" y="64" text-anchor="middle">The Constitution of Pakistan</text><text class="cell" x="390.0" y="82" text-anchor="middle">divides law-making power (Articles 141-143)</text><line class="stroke" x1="290" y1="100" x2="150" y2="136" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="100" x2="630" y2="136" marker-end="url(#arrow)"/><rect class="panel-b" x="24" y="138" width="352" height="132" rx="6"/><text class="sh" x="34" y="158">Federal level: Majlis-e-Shoora</text><text class="sh" x="34" y="176">(Parliament)</text><text class="cell" x="34" y="194">Exclusive power over the Federal Legislative</text><text class="cell" x="34" y="211">List. Examples: defence (entry 1), external</text><text class="cell" x="34" y="228">affairs (entry 3), currency (entry 8),</text><text class="cell" x="34" y="245">standards in higher education (Part II, entry</text><text class="cell" x="34" y="262">12). Also areas not in any Province.</text><rect class="panel-a" x="404" y="138" width="352" height="132" rx="6"/><text class="sh" x="414" y="158">Provincial level: four Provincial</text><text class="sh" x="414" y="176">Assemblies</text><text class="cell" x="414" y="194">Power over every matter not on the Federal</text><text class="cell" x="414" y="211">Legislative List. Example: school education,</text><text class="cell" x="414" y="228">as in the Sindh Right of Children to Free and</text><text class="cell" x="414" y="245">Compulsory Education Act 2013.</text><line class="stroke" x1="580" y1="270" x2="580" y2="306" marker-end="url(#arrow)"/><text class="cell" x="24" y="296">Article 1(2) names the four Provinces: one federation, not four countries.</text><rect class="panel-a" x="24" y="308" width="177" height="40" rx="6"/><text class="cell" x="112" y="333" text-anchor="middle">Balochistan</text><rect class="panel-a" x="209" y="308" width="177" height="40" rx="6"/><text class="cell" x="297" y="333" text-anchor="middle">Khyber Pakhtunkhwa</text><rect class="panel-a" x="394" y="308" width="177" height="40" rx="6"/><text class="cell" x="482" y="333" text-anchor="middle">Punjab</text><rect class="panel-a" x="579" y="308" width="177" height="40" rx="6"/><text class="cell" x="667" y="333" text-anchor="middle">Sindh</text><rect class="panel-c" x="24" y="360" width="732" height="40" rx="6"/><text class="sh" x="34" y="380">Both levels: criminal law, criminal procedure and evidence (Article 142(b))</text><rect class="panel" x="24" y="412" width="732" height="58" rx="6"/><text class="sh" x="34" y="432">If they conflict</text><text class="cell" x="34" y="450">A valid Act of Parliament prevails over the conflicting provincial Act (Article 143).</text><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
