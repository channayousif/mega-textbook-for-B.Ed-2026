<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of seeking enforcement of a Fundamental Right</title><desc id="d">Flowchart of seeking enforcement of a Fundamental Right. A person who believes a public body has broken a right first asks whether the law gives another adequate remedy, and if it does, uses that. If it does not, the aggrieved person files a petition in the High Court under Article 199(1)(c). The High Court can give directions, and an appeal to the Federal Constitutional Court needs that court's leave under Article 175F(1)(c). A question of public importance can also go by application to the Federal Constitutional Court under Article 175E(3), a power the Supreme Court held under Article 184(3) until 13 November 2025. During an emergency the President may suspend the right to go to court for specified rights under Article 233(2).</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="610"/><text class="h" x="24" y="30">Seeking enforcement of a Fundamental Right</text><rect class="panel-b" x="24" y="44" width="420" height="56" rx="6"/><text class="sh" x="34" y="64">Start: a public body or official seems to have</text><text class="sh" x="34" y="82">broken a Fundamental Right</text><line class="stroke" x1="234" y1="100" x2="234" y2="128" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="130" width="420" height="52" rx="6"/><text class="sh" x="34" y="150">Does the law give another adequate remedy?</text><path class="stroke" d="M 234 182 L 234 212" marker-end="url(#arrow)"/><text class="sh" x="244" y="204">No</text><path class="stroke" d="M 444 156 L 467 156 L 467 276 L 488 276" marker-end="url(#arrow)"/><text class="sh" x="448" y="146">Yes</text><rect class="panel" x="490" y="240" width="266" height="74" rx="6"/><text class="sh" x="500" y="260">Use that remedy first</text><text class="cell" x="500" y="278">for example a departmental appeal</text><text class="cell" x="500" y="295">or an ordinary court</text><rect class="panel-a" x="24" y="214" width="420" height="84" rx="6"/><text class="sh" x="34" y="234">The aggrieved person files a writ petition in</text><text class="sh" x="34" y="252">the High Court</text><text class="cell" x="34" y="270">Article 199(1)(c). In Sindh, this is the Sindh High</text><text class="cell" x="34" y="287">Court.</text><line class="stroke" x1="234" y1="298" x2="234" y2="326" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="328" width="420" height="56" rx="6"/><text class="sh" x="34" y="348">The High Court can give directions to enforce</text><text class="sh" x="34" y="366">the right</text><line class="stroke" x1="234" y1="384" x2="234" y2="412" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="414" width="420" height="74" rx="6"/><text class="sh" x="34" y="434">An appeal goes to the Federal Constitutional</text><text class="sh" x="34" y="452">Court only with its leave</text><text class="cell" x="34" y="470">Article 175F(1)(c)</text><line class="stroke" x1="444" y1="72" x2="488" y2="72" marker-end="url(#arrow)"/><rect class="panel-c" x="490" y="44" width="266" height="180" rx="6"/><text class="sh" x="500" y="64">Question of public</text><text class="sh" x="500" y="82">importance?</text><text class="cell" x="500" y="100">Application to the Federal</text><text class="cell" x="500" y="117">Constitutional Court, Article</text><text class="cell" x="500" y="134">175E(3). Until 13 November 2025</text><text class="cell" x="500" y="151">this power was with the Supreme</text><text class="cell" x="500" y="168">Court, Article 184(3). Older</text><text class="cell" x="500" y="185">books still say so.</text><rect class="panel" x="24" y="504" width="732" height="76" rx="6"/><text class="sh" x="34" y="524">During a Proclamation of Emergency</text><text class="cell" x="34" y="542">The President may suspend the right to go to court for the rights named in the Order (Article</text><text class="cell" x="34" y="559">233(2)). Each Order goes before both Houses for approval (Article 233(3)).</text><text class="wm" x="768" y="600" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
