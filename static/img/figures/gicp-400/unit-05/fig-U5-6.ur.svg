<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین حکمتِ عملی کے اصول، ہر ایک ریاستی فریضے سے جڑا ہوا</title><desc id="d">تین حکمتِ عملی کے اصول کو ریاستی فرائض سے جوڑنے والا نقشہ۔ اسلامی طرزِ زندگی (دفعہ 31) مسلمانوں کو اسلام کے مطابق زندگی گزارنے کے قابل بنانے اور مسلمانوں کے لیے قرآنِ کریم اور اسلامیات کی تعلیم لازمی بنانے کی کوشش کرنے کے فریضے کی طرف لے جاتا ہے۔ سماجی انصاف اور مساوات (دفعات 33، 34، 36، 37 اور 38) معیارِ زندگی بلند کرنے، تفاوت کم کرنے، تعصب کم کرنے اور اقلیتوں کا تحفظ کرنے کے فریضے کی طرف لے جاتے ہیں۔ فروغِ تعلیم (دفعہ 37) ناخواندگی کا خاتمہ کرنے، ثانوی تعلیم فراہم کرنے اور اعلیٰ تعلیم کو قابلیت کی بنیاد پر دستیاب بنانے کے فریضے کی طرف لے جاتا ہے۔ نیچے ایک بار دکھاتا ہے کہ ہر ایک وسائل پر منحصر ہو سکتا ہے اور کوئی بھی عدالت میں نافذ نہیں ہو سکتا۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><text class="h" x="756" y="30" text-anchor="end">تین حکمتِ عملی کے اصول، ہر ایک ریاستی فریضے سے جڑا ہوا</text><rect class="panel-a" x="506" y="46" width="250" height="96" rx="6"/><text class="sh" x="746" y="66" text-anchor="end">اسلامی طرزِ زندگی</text><text class="cell" x="746" y="84" text-anchor="end">دفعہ 31</text><line class="stroke" x1="506" y1="94" x2="440" y2="94" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="46" width="414" height="96" rx="6"/><text class="sh" x="428" y="66" text-anchor="end">ریاستی فریضہ</text><text class="cell" x="428" y="84" text-anchor="end">مسلمانوں کو اسلام کے مطابق زندگی گزارنے کے قابل</text><text class="cell" x="428" y="101" text-anchor="end">بنانے کے لیے اقدامات۔ قرآنِ کریم اور اسلامیات کی</text><text class="cell" x="428" y="118" text-anchor="end">تعلیم مسلمانوں کے لیے لازمی بنانے کی کوشش۔</text><rect class="panel-b" x="506" y="158" width="250" height="96" rx="6"/><text class="sh" x="746" y="178" text-anchor="end">سماجی انصاف اور</text><text class="sh" x="746" y="196" text-anchor="end">مساوات</text><text class="cell" x="746" y="214" text-anchor="end">دفعات 33، 34، 36، 37، 38</text><line class="stroke" x1="506" y1="206" x2="440" y2="206" marker-end="url(#arrow)"/><rect class="panel-b" x="24" y="158" width="414" height="96" rx="6"/><text class="sh" x="428" y="178" text-anchor="end">ریاستی فریضہ</text><text class="cell" x="428" y="196" text-anchor="end">معیارِ زندگی بلند کرنا اور تفاوت کم کرنا۔</text><text class="cell" x="428" y="213" text-anchor="end">تعصب کم کرنا۔ خواتین کو مکمل شرکت یقینی بنانا۔</text><text class="cell" x="428" y="230" text-anchor="end">اقلیتوں کا تحفظ۔</text><rect class="panel-c" x="506" y="270" width="250" height="96" rx="6"/><text class="sh" x="746" y="290" text-anchor="end">فروغِ تعلیم</text><text class="cell" x="746" y="308" text-anchor="end">دفعہ 37(a)، (b)، (c)، (f)</text><line class="stroke" x1="506" y1="318" x2="440" y2="318" marker-end="url(#arrow)"/><rect class="panel-c" x="24" y="270" width="414" height="96" rx="6"/><text class="sh" x="428" y="290" text-anchor="end">ریاستی فریضہ</text><text class="cell" x="428" y="308" text-anchor="end">ناخواندگی کا خاتمہ۔ مفت، لازمی ثانوی</text><text class="cell" x="428" y="325" text-anchor="end">تعلیم کم سے کم مدت میں فراہم کرنا۔ اعلیٰ تعلیم</text><text class="cell" x="428" y="342" text-anchor="end">کو قابلیت کی بنیاد پر دستیاب بنانا۔</text><rect class="panel" x="24" y="384" width="732" height="76" rx="6"/><text class="sh" x="746" y="404" text-anchor="end">تینوں: دفعات 29 اور 30</text><text class="cell" x="746" y="422" text-anchor="end">ریاست کا ہر ادارہ ان پر عمل کرے گا (29(1))۔ ہر ایک وسائل پر منحصر ہو سکتا ہے (29(2))۔ سالانہ</text><text class="cell" x="746" y="439" text-anchor="end">رپورٹ اسمبلیوں کو جاتی ہے (29(3))۔ اس بنیاد پر کوئی عدالتی کارروائی نہیں (30(2))۔</text><text class="wm" x="12" y="480" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
