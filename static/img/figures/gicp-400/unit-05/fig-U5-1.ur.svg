<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">وفاق: کون کون سے قوانین بناتا ہے</title><desc id="d">وفاق کا نقشہ۔ اوپر آئین قانون سازی کے اختیارات کو دو سطحوں کے درمیان تقسیم کرتی ہے۔ پارلیمنٹ وفاقی قانون سازی کی فہرست میں درج معاملات پر صرف وہی قانون بناتی ہے، جیسے دفاع، خارجہ امور اور کرنسی۔ بلوچستان، خیبر پختونخوا، پنجاب اور سندھ کی چار صوبائی اسمبلیاں اس فہرست میں نہیں آنے والے ہر معاملے پر قانون بناتی ہیں، جیسے اسکول کی تعلیم۔ دونوں سطحیں جرم کا قانون، جرم کے مقدمے کا طریقہ اور شواہد پر قانون بنا سکتی ہیں، اور تصادم کی صورت میں پارلیمنٹ کا درست قانون صوبائی قانون پر حاوی رہتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="756" y="30" text-anchor="end">وفاق: کون کون سے قوانین بناتا ہے</text><rect class="panel" x="180" y="44" width="420" height="56" rx="6"/><text class="sh" x="390" y="64" text-anchor="middle">پاکستان کا آئین</text><text class="cell" x="390" y="82" text-anchor="middle">قانون سازی کے اختیارات تقسیم کرتا ہے (دفعات 141-143)</text><line class="stroke" x1="490" y1="100" x2="630" y2="136" marker-end="url(#arrow)"/><line class="stroke" x1="290" y1="100" x2="150" y2="136" marker-end="url(#arrow)"/><rect class="panel-b" x="404" y="138" width="352" height="132" rx="6"/><text class="sh" x="746" y="158" text-anchor="end">وفاقی سطح: مجلسِ شوریٰ</text><text class="sh" x="746" y="176" text-anchor="end">(پارلیمنٹ)</text><text class="cell" x="746" y="194" text-anchor="end">وفاقی قانون سازی کی فہرست پر مختص اختیار۔</text><text class="cell" x="746" y="211" text-anchor="end">مثالیں: دفاع (مدخل 1)، خارجہ</text><text class="cell" x="746" y="228" text-anchor="end">امور (مدخل 3)، کرنسی (مدخل 8)،</text><text class="cell" x="746" y="245" text-anchor="end">اعلیٰ تعلیم کے معیارات (حصہ دوم،</text><text class="cell" x="746" y="262" text-anchor="end">مدخل 12)۔ اور علاقے جو کسی صوبے میں نہیں۔</text><rect class="panel-a" x="24" y="138" width="352" height="132" rx="6"/><text class="sh" x="366" y="158" text-anchor="end">صوبائی سطح: چار صوبائی</text><text class="sh" x="366" y="176" text-anchor="end">اسمبلیاں</text><text class="cell" x="366" y="194" text-anchor="end">وفاقی فہرست میں نہیں آنے والے ہر</text><text class="cell" x="366" y="211" text-anchor="end">معاملے پر اختیار۔ مثال: اسکول کی تعلیم،</text><text class="cell" x="366" y="228" text-anchor="end">جیساً سندھ کا قانونِ حقِ بچہ برائے</text><text class="cell" x="366" y="245" text-anchor="end">مفت اور لازمی تعلیم 2013۔</text><line class="stroke" x1="200" y1="270" x2="200" y2="306" marker-end="url(#arrow)"/><text class="cell" x="756" y="296" text-anchor="end">دفعہ 1(2) چار صوبوں کے نام بتاتا ہے: ایک وفاق، چار ملک نہیں۔</text><rect class="panel-a" x="579" y="308" width="177" height="40" rx="6"/><text class="cell" x="668" y="333" text-anchor="middle">بلوچستان</text><rect class="panel-a" x="394" y="308" width="177" height="40" rx="6"/><text class="cell" x="483" y="333" text-anchor="middle">خیبر پختونخوا</text><rect class="panel-a" x="209" y="308" width="177" height="40" rx="6"/><text class="cell" x="298" y="333" text-anchor="middle">پنجاب</text><rect class="panel-a" x="24" y="308" width="177" height="40" rx="6"/><text class="cell" x="113" y="333" text-anchor="middle">سندھ</text><rect class="panel-c" x="24" y="360" width="732" height="40" rx="6"/><text class="sh" x="746" y="380" text-anchor="end">دونوں سطحیں: جرم کا قانون، جرم کے مقدمے کا طریقہ اور شواہد (دفعہ 142(b))</text><rect class="panel" x="24" y="412" width="732" height="58" rx="6"/><text class="sh" x="746" y="432" text-anchor="end">اگر تصادم ہو</text><text class="cell" x="746" y="450" text-anchor="end">پارلیمنٹ کا درست قانون متصادم صوبائی قانون پر حاوی رہتا ہے (دفعہ 143)۔</text><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
