<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نظریے اور آئین کا تعلق</title><desc id="d">نظریے اور آئین کا تعلق دکھانے والا تصوراتی نقشہ: مساوات اور انصاف جیسی مشترکہ اقدار قراردادِ مقاصد اور دیباچے میں اصول بنتی ہیں، اور اصول دفعات 25، 25A اور 227 جیسی پابند کرنے والی دفعات بنتے ہیں۔ واپسی کا تیر دکھاتا ہے کہ شہری ان دفعات کے ذریعے ریاست کو ان اقدار کا پابند کرتے ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="756" y="32" text-anchor="end">نظریے اور آئین کا تعلق</text><rect class="panel-a" x="556" y="52" width="200" height="62" rx="8"/><text class="h" x="656" y="76" text-anchor="middle">نظریہ</text><text class="small" x="656" y="96" text-anchor="middle">مشترکہ خیالات؛ خود پابند نہیں کرتا</text><rect class="panel-b" x="24" y="52" width="466" height="62" rx="8"/><text class="h" x="257" y="76" text-anchor="middle">آئین</text><text class="small" x="257" y="96" text-anchor="middle">سب سے بڑا قانون؛ ہر شہری اور ریاست کو پابند کرتا ہے</text><line class="thin" x1="656" y1="114" x2="656" y2="150" marker-end="url(#arrow)"/><line class="thin" x1="390" y1="114" x2="390" y2="150" marker-end="url(#arrow)"/><line class="thin" x1="124" y1="114" x2="124" y2="150" marker-end="url(#arrow)"/><rect class="panel-a" x="556" y="150" width="200" height="170" rx="8"/><text class="h" x="656" y="176" text-anchor="middle">اقدار</text><text class="body" x="744" y="204" text-anchor="end">مساوات</text><text class="body" x="744" y="221" text-anchor="end">انصاف</text><text class="body" x="744" y="238" text-anchor="end">اجتماعی زندگی میں مذہب</text><text class="body" x="744" y="255" text-anchor="end">خود حکمرانی</text><text class="body" x="744" y="272" text-anchor="end">سب کے لیے تعلیم</text><rect class="panel-c" x="290" y="150" width="200" height="170" rx="8"/><text class="h" x="390" y="176" text-anchor="middle">اصول</text><text class="body" x="478" y="204" text-anchor="end">قراردادِ مقاصد</text><text class="body" x="478" y="221" text-anchor="end">(1949)</text><text class="body" x="478" y="238" text-anchor="end"></text><text class="body" x="478" y="255" text-anchor="end">آئین کا</text><text class="body" x="478" y="272" text-anchor="end">دیباچہ</text><rect class="panel-b" x="24" y="150" width="200" height="170" rx="8"/><text class="h" x="124" y="176" text-anchor="middle">دفعات</text><text class="body" x="212" y="204" text-anchor="end">دفعہ 25: مساوات</text><text class="body" x="212" y="221" text-anchor="end">دفعہ 25A: تعلیم</text><text class="body" x="212" y="238" text-anchor="end">دفعہ 36: اقلیتیں</text><text class="body" x="212" y="255" text-anchor="end">دفعہ 227: قوانین اور</text><text class="body" x="212" y="272" text-anchor="end">احکامِ اسلام</text><line class="stroke" x1="556" y1="245" x2="492" y2="245" marker-end="url(#arrow)"/><text class="small" x="523" y="233" text-anchor="middle">بنتی ہیں</text><line class="stroke" x1="290" y1="245" x2="226" y2="245" marker-end="url(#arrow)"/><text class="small" x="257" y="233" text-anchor="middle">بنتے ہیں</text><path class="dash" d="M124 320 V360 H656 V323" marker-end="url(#arrowm)"/><text class="body" x="390" y="384" text-anchor="middle">شہری دفعات سے ریاست کو ان اقدار کا پابند کرتے ہیں</text><text class="small" x="390" y="408" text-anchor="middle">دفعہ کی بنیاد جاننے کے لیے دائیں سے بائیں پڑھیں۔</text><text class="small" x="390" y="426" text-anchor="middle">قدر کا عملی مطلب جاننے کے لیے بائیں سے دائیں پڑھیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
