<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 368" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئین کے کام اور آئینِ پاکستان کی دفعات</title><desc id="d">آئین کے تین کاموں کی جدول، ہر کام کے ساتھ پاکستانی دفعہ: یہ ادارے قائم کرتا ہے (دفعہ 50 پارلیمنٹ اور دفعہ 175 عدالتیں قائم کرتی ہے)، اختیار محدود کرتا ہے (دفعہ 8 ریاست کو بنیادی حقوق چھیننے والا قانون بنانے سے روکتی ہے)، اور حقوق کا تحفظ کرتا ہے (دفعہ 25 قانون کے سامنے مساوات اور دفعہ 25A مفت اور لازمی تعلیم سے متعلق ہے)۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="368"/><text class="h" x="756" y="32" text-anchor="end">آئین کے کام اور آئینِ پاکستان کی دفعات</text><rect class="panel" x="24" y="52" width="732" height="40"/><text class="sh" x="746" y="78" text-anchor="end">کام</text><text class="sh" x="596" y="78" text-anchor="end">مطلب</text><text class="sh" x="364" y="78" text-anchor="end">آئینِ پاکستان میں</text><rect class="panel-a" x="606" y="92" width="150" height="92"/><text class="sh" x="746" y="117" text-anchor="end">ادارے قائم</text><text class="sh" x="746" y="134" text-anchor="end">کرتا ہے</text><text class="body" x="596" y="117" text-anchor="end">بتاتا ہے کون سے ادارے ہیں</text><text class="body" x="596" y="134" text-anchor="end">اور ہر ایک کیا کرتا ہے</text><text class="body" x="364" y="117" text-anchor="end">دفعہ 50: پارلیمنٹ صدر اور</text><text class="body" x="364" y="134" text-anchor="end">دو ایوانوں، قومی اسمبلی اور</text><text class="body" x="364" y="151" text-anchor="end">سینیٹ پر مشتمل ہے</text><text class="body" x="364" y="168" text-anchor="end">دفعہ 175: عدالتیں قائم کرتی ہے</text><line class="thin" x1="606" y1="184" x2="24" y2="184"/><rect class="panel-a" x="606" y="184" width="150" height="75"/><text class="sh" x="746" y="209" text-anchor="end">اختیار کی حد</text><text class="body" x="596" y="209" text-anchor="end">حکومت قواعد کے اندر ہی</text><text class="body" x="596" y="226" text-anchor="end">کام کر سکتی ہے۔ پارلیمنٹ</text><text class="body" x="596" y="243" text-anchor="end">بھی ان کے ماتحت ہے</text><text class="body" x="364" y="209" text-anchor="end">دفعہ 8(2): ریاست بنیادی حقوق</text><text class="body" x="364" y="226" text-anchor="end">چھیننے والا قانون نہیں بنائے گی؛</text><text class="body" x="364" y="243" text-anchor="end">ایسا قانون تصادم کی حد تک کالعدم ہے</text><line class="thin" x1="606" y1="259" x2="24" y2="259"/><rect class="panel-a" x="606" y="259" width="150" height="75"/><text class="sh" x="746" y="284" text-anchor="end">حقوق کا تحفظ</text><text class="body" x="596" y="284" text-anchor="end">لوگوں کے حقوق حکومت</text><text class="body" x="596" y="301" text-anchor="end">جب چاہے ختم</text><text class="body" x="596" y="318" text-anchor="end">نہیں کر سکتی</text><text class="body" x="364" y="284" text-anchor="end">دفعہ 25: سب شہری قانون کے سامنے برابر</text><text class="body" x="364" y="301" text-anchor="end">دفعہ 25A: مفت اور لازمی تعلیم</text><text class="body" x="364" y="318" text-anchor="end">پانچ سے سولہ سال کے بچوں کے لیے</text><line class="thin" x1="606" y1="334" x2="24" y2="334"/><path class="thin" d="M756 334 H24"/><line class="thin" x1="606" y1="52" x2="606" y2="334"/><line class="thin" x1="374" y1="52" x2="374" y2="334"/><line class="thin" x1="24" y1="52" x2="24" y2="334"/><text class="wm" x="12" y="358" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
