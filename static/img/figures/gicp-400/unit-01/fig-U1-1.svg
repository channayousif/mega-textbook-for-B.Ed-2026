<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map showing how ideology and constitution are linked</title><desc id="d">Concept map showing how ideology and constitution are linked: shared values such as equality and justice become principles in the Objectives Resolution and the Preamble, and principles become binding articles such as Articles 25, 25A and 227. A return arrow shows that citizens then use the articles to hold the State to those values.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="32">How ideology and constitution are linked</text><rect class="panel-a" x="24" y="52" width="200" height="62" rx="8"/><text class="h" x="124" y="76" text-anchor="middle">IDEOLOGY</text><text class="small" x="124" y="96" text-anchor="middle">shared ideas; binds nobody</text><rect class="panel-b" x="290" y="52" width="466" height="62" rx="8"/><text class="h" x="523" y="76" text-anchor="middle">CONSTITUTION</text><text class="small" x="523" y="96" text-anchor="middle">the highest law; binds every citizen and the State</text><line class="thin" x1="124" y1="114" x2="124" y2="150" marker-end="url(#arrow)"/><line class="thin" x1="390" y1="114" x2="390" y2="150" marker-end="url(#arrow)"/><line class="thin" x1="656" y1="114" x2="656" y2="150" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="150" width="200" height="170" rx="8"/><text class="h" x="124" y="176" text-anchor="middle">Values</text><text class="body" x="36" y="204">equality</text><text class="body" x="36" y="221">justice</text><text class="body" x="36" y="238">faith in public life</text><text class="body" x="36" y="255">self-government</text><text class="body" x="36" y="272">education for all</text><rect class="panel-c" x="290" y="150" width="200" height="170" rx="8"/><text class="h" x="390" y="176" text-anchor="middle">Principles</text><text class="body" x="302" y="204">Objectives Resolution</text><text class="body" x="302" y="221">(1949)</text><text class="body" x="302" y="238"></text><text class="body" x="302" y="255">Preamble of the</text><text class="body" x="302" y="272">Constitution</text><rect class="panel-b" x="556" y="150" width="200" height="170" rx="8"/><text class="h" x="656" y="176" text-anchor="middle">Articles</text><text class="body" x="568" y="204">Article 25: equality</text><text class="body" x="568" y="221">Article 25A: education</text><text class="body" x="568" y="238">Article 36: minorities</text><text class="body" x="568" y="255">Article 227: laws and</text><text class="body" x="568" y="272">the Injunctions of Islam</text><line class="stroke" x1="224" y1="245" x2="288" y2="245" marker-end="url(#arrow)"/><text class="small" x="257" y="233" text-anchor="middle">become</text><line class="stroke" x1="490" y1="245" x2="554" y2="245" marker-end="url(#arrow)"/><text class="small" x="523" y="233" text-anchor="middle">become</text><path class="dash" d="M656 320 V360 H124 V323" marker-end="url(#arrowm)"/><text class="body" x="390" y="384" text-anchor="middle">Citizens use the articles to hold the State to these values</text><text class="small" x="390" y="408" text-anchor="middle">Read left to right to see where an article came from.</text><text class="small" x="390" y="426" text-anchor="middle">Read right to left to see what a value means in practice.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
