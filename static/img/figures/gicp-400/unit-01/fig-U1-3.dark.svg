<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a tree with two roots feeding the Ideology of Pakistan</title><desc id="d">Diagram of a tree: two roots, labelled Two-Nation Theory (Muslims of South Asia as a nation, with a right to self-government) and Islamic concept of state (sovereignty of Allah, authority as a trust, justice, consultation, equality), feed one trunk labelled Ideology of Pakistan, whose three branches are self-government, Islamic principles in public life, and equal citizenship.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><text class="h" x="24" y="32">Two roots, one trunk, three branches</text><rect class="panel-b" x="24" y="52" width="220" height="64" rx="8"/><text class="sh" x="134" y="80" text-anchor="middle">Self-government</text><rect class="panel-b" x="280" y="52" width="220" height="64" rx="8"/><text class="sh" x="390" y="70" text-anchor="middle">Islamic principles</text><text class="sh" x="390" y="87" text-anchor="middle">in public life</text><rect class="panel-b" x="536" y="52" width="220" height="64" rx="8"/><text class="sh" x="646" y="70" text-anchor="middle">Democracy and</text><text class="sh" x="646" y="87" text-anchor="middle">equal citizenship</text><path class="stroke" d="M340 190 C340 150 134 150 134 118" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="190" x2="390" y2="118" marker-end="url(#arrow)"/><path class="stroke" d="M440 190 C440 150 646 150 646 118" marker-end="url(#arrow)"/><rect class="panel-c" x="280" y="190" width="220" height="130" rx="8"/><text class="h" x="390" y="246" text-anchor="middle">Ideology of Pakistan</text><text class="small" x="390" y="270" text-anchor="middle">the trunk</text><line class="dash" x1="24" y1="360" x2="756" y2="360"/><text class="small" x="24" y="352">founding ideas above ground</text><text class="small" x="24" y="378">roots below ground</text><rect class="panel-a" x="24" y="400" width="340" height="120" rx="8"/><text class="h" x="194" y="426" text-anchor="middle">Two-Nation Theory</text><text class="body" x="194" y="452" text-anchor="middle">The Muslims of South Asia are a nation,</text><text class="body" x="194" y="469" text-anchor="middle">with a right to self-government</text><rect class="panel-a" x="416" y="400" width="340" height="120" rx="8"/><text class="h" x="586" y="426" text-anchor="middle">Islamic concept of state</text><text class="body" x="586" y="452" text-anchor="middle">Sovereignty of Allah; authority as a trust;</text><text class="body" x="586" y="469" text-anchor="middle">justice; consultation; equality</text><path class="stroke" d="M194 400 C194 350 340 370 340 322" marker-end="url(#arrow)"/><path class="stroke" d="M586 400 C586 350 440 370 440 322" marker-end="url(#arrow)"/><text class="wm" x="768" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
