<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 351" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین تصورات: مطلب، اہم بیان اور عام غلط تعبیر</title><desc id="d">تین تصورات، ان کے معنی، اہم بیان اور عام غلط تعبیر کی جدول: دو قومی نظریہ (مسلمان ایک قوم ہیں جسے خود حکمرانی کا حق ہے؛ غلط تعبیر کہ مسلمان اور ہندو ساتھ نہیں رہ سکتے)، ریاست کا اسلامی تصور (اللہ کی حاکمیت کے تحت اختیار بطور امانت؛ غلط تعبیر کہ مذہبی رہنما حکومت کریں)، اور پاکستان کے نظریے (خود حکمرانی، اسلامی اصول اور برابر کی شہریت؛ غلط تعبیر کہ صرف اسلام یا صرف نعرہ مراد ہے)۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="351"/><text class="h" x="756" y="32" text-anchor="end">تین تصورات: مطلب، اہم بیان اور عام غلط تعبیر</text><rect class="panel" x="24" y="52" width="732" height="40"/><text class="sh" x="746" y="78" text-anchor="end">تصور</text><text class="sh" x="614" y="78" text-anchor="end">مطلب</text><text class="sh" x="414" y="78" text-anchor="end">اہم بیان</text><text class="sh" x="202" y="78" text-anchor="end">عام غلط تعبیر</text><rect class="panel-a" x="624" y="92" width="132" height="75"/><text class="sh" x="746" y="117" text-anchor="end">دو قومی</text><text class="sh" x="746" y="134" text-anchor="end">نظریہ</text><text class="cell" x="614" y="117" text-anchor="end">جنوبی ایشیا کے مسلمان</text><text class="cell" x="614" y="134" text-anchor="end">ایک قوم تھے جنہیں</text><text class="cell" x="614" y="151" text-anchor="end">خود حکمرانی کا حق تھا</text><text class="cell" x="414" y="117" text-anchor="end">"مسلمان ہر تعریف کے</text><text class="cell" x="414" y="134" text-anchor="end">لحاظ سے ایک قوم ہیں"</text><text class="cell" x="414" y="151" text-anchor="end">(Jinnah, 1940)</text><text class="cell" x="202" y="117" text-anchor="end">مسلمان اور ہندو</text><text class="cell" x="202" y="134" text-anchor="end">ساتھ نہیں رہ سکتے</text><line class="thin" x1="624" y1="167" x2="24" y2="167"/><rect class="panel-a" x="624" y="167" width="132" height="75"/><text class="sh" x="746" y="192" text-anchor="end">ریاست کا</text><text class="sh" x="746" y="209" text-anchor="end">اسلامی تصور</text><text class="cell" x="614" y="192" text-anchor="end">حاکمیت اللہ کی ہے؛</text><text class="cell" x="614" y="209" text-anchor="end">لوگ اختیار</text><text class="cell" x="614" y="226" text-anchor="end">امانت سمجھ کر رکھتے ہیں</text><text class="cell" x="414" y="192" text-anchor="end">"حاکمیت ... صرف</text><text class="cell" x="414" y="209" text-anchor="end">اللہ تعالیٰ کی ہے"</text><text class="cell" x="414" y="226" text-anchor="end">(دیباچہ)</text><text class="cell" x="202" y="192" text-anchor="end">مذہبی رہنماؤں کے</text><text class="cell" x="202" y="209" text-anchor="end">طبقے کی حکومت</text><line class="thin" x1="624" y1="242" x2="24" y2="242"/><rect class="panel-a" x="624" y="242" width="132" height="75"/><text class="sh" x="746" y="267" text-anchor="end">پاکستان کے</text><text class="sh" x="746" y="284" text-anchor="end">نظریے</text><text class="cell" x="614" y="267" text-anchor="end">خود حکمرانی، اسلامی</text><text class="cell" x="614" y="284" text-anchor="end">اصول اور برابر</text><text class="cell" x="614" y="301" text-anchor="end">کی شہریت</text><text class="cell" x="414" y="267" text-anchor="end">"جمہوریت، آزادی،</text><text class="cell" x="414" y="284" text-anchor="end">مساوات، رواداری اور</text><text class="cell" x="414" y="301" text-anchor="end">سماجی انصاف" (دیباچہ)</text><text class="cell" x="202" y="267" text-anchor="end">صرف اسلام مراد ہے،</text><text class="cell" x="202" y="284" text-anchor="end">یا یہ محض نعرہ ہے</text><line class="thin" x1="624" y1="317" x2="24" y2="317"/><path class="thin" d="M756 317 H24"/><line class="thin" x1="624" y1="52" x2="624" y2="317"/><line class="thin" x1="424" y1="52" x2="424" y2="317"/><line class="thin" x1="212" y1="52" x2="212" y2="317"/><line class="thin" x1="24" y1="52" x2="24" y2="317"/><text class="wm" x="12" y="341" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
