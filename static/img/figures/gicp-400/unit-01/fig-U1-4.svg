<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 351" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of three ideas with their meaning, a key statement and a common misreading</title><desc id="d">Table of three ideas with their meaning, a key statement and a common misreading: the Two-Nation Theory (Muslims as a nation with a right to self-government; misread as saying Muslims and Hindus cannot live side by side), the Islamic concept of state (authority as a trust under Allah's sovereignty; misread as rule by religious leaders), and the Ideology of Pakistan (self-government, Islamic principles and equal citizenship; misread as meaning only Islam or only a slogan).</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="351"/><text class="h" x="24" y="32">Three ideas: meaning, key statement and common misreading</text><rect class="panel" x="24" y="52" width="732" height="40"/><text class="sh" x="34" y="78">Idea</text><text class="sh" x="166" y="78">Meaning</text><text class="sh" x="366" y="78">Key statement</text><text class="sh" x="578" y="78">Common misreading</text><rect class="panel-a" x="24" y="92" width="132" height="75"/><text class="sh" x="34" y="117">Two-Nation</text><text class="sh" x="34" y="134">Theory</text><text class="cell" x="166" y="117">The Muslims of South Asia</text><text class="cell" x="166" y="134">were a nation, with a right</text><text class="cell" x="166" y="151">to self-government</text><text class="cell" x="366" y="117">"The Mussalmans are a</text><text class="cell" x="366" y="134">nation by any definition"</text><text class="cell" x="366" y="151">(Jinnah, 1940)</text><text class="cell" x="578" y="117">Muslims and Hindus</text><text class="cell" x="578" y="134">cannot live side by side</text><line class="thin" x1="156" y1="167" x2="756" y2="167"/><rect class="panel-a" x="24" y="167" width="132" height="75"/><text class="sh" x="34" y="192">Islamic concept</text><text class="sh" x="34" y="209">of state</text><text class="cell" x="166" y="192">Sovereignty belongs to</text><text class="cell" x="166" y="209">Allah; people hold</text><text class="cell" x="166" y="226">authority as a trust</text><text class="cell" x="366" y="192">"sovereignty ... belongs to</text><text class="cell" x="366" y="209">Almighty Allah alone"</text><text class="cell" x="366" y="226">(Preamble)</text><text class="cell" x="578" y="192">Rule by a class of</text><text class="cell" x="578" y="209">religious leaders</text><line class="thin" x1="156" y1="242" x2="756" y2="242"/><rect class="panel-a" x="24" y="242" width="132" height="75"/><text class="sh" x="34" y="267">Ideology of</text><text class="sh" x="34" y="284">Pakistan</text><text class="cell" x="166" y="267">Self-government, Islamic</text><text class="cell" x="166" y="284">principles and equal</text><text class="cell" x="166" y="301">citizenship</text><text class="cell" x="366" y="267">"democracy, freedom,</text><text class="cell" x="366" y="284">equality, tolerance and</text><text class="cell" x="366" y="301">social justice" (Preamble)</text><text class="cell" x="578" y="267">It means only Islam,</text><text class="cell" x="578" y="284">or it is only a slogan</text><line class="thin" x1="156" y1="317" x2="756" y2="317"/><path class="thin" d="M24 317 H756"/><line class="thin" x1="156" y1="52" x2="156" y2="317"/><line class="thin" x1="356" y1="52" x2="356" y2="317"/><line class="thin" x1="568" y1="52" x2="568" y2="317"/><line class="thin" x1="756" y1="52" x2="756" y2="317"/><text class="wm" x="768" y="341" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
