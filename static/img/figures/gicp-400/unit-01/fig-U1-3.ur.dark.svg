<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دو جڑیں، ایک تنا، تین شاخیں</title><desc id="d">درخت کا خاکہ: دو جڑیں، دو قومی نظریہ (جنوبی ایشیا کے مسلمان ایک قوم، جسے خود حکمرانی کا حق ہے) اور ریاست کا اسلامی تصور (اللہ کی حاکمیت، اختیار بطور امانت، انصاف، مشاورت، مساوات)، پاکستان کے نظریے نامی ایک تنے کو غذا دیتی ہیں۔ اس کی تین شاخیں خود حکمرانی، اجتماعی زندگی میں اسلامی اصول اور برابر کی شہریت ہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><text class="h" x="756" y="32" text-anchor="end">دو جڑیں، ایک تنا، تین شاخیں</text><rect class="panel-b" x="536" y="52" width="220" height="64" rx="8"/><text class="sh" x="646" y="80" text-anchor="middle">خود حکمرانی</text><rect class="panel-b" x="280" y="52" width="220" height="64" rx="8"/><text class="sh" x="390" y="70" text-anchor="middle">اجتماعی زندگی میں</text><text class="sh" x="390" y="87" text-anchor="middle">اسلامی اصول</text><rect class="panel-b" x="24" y="52" width="220" height="64" rx="8"/><text class="sh" x="134" y="70" text-anchor="middle">جمہوریت اور</text><text class="sh" x="134" y="87" text-anchor="middle">برابر کی شہریت</text><path class="stroke" d="M440 190 C440 150 646 150 646 118" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="190" x2="390" y2="118" marker-end="url(#arrow)"/><path class="stroke" d="M340 190 C340 150 134 150 134 118" marker-end="url(#arrow)"/><rect class="panel-c" x="280" y="190" width="220" height="130" rx="8"/><text class="h" x="390" y="246" text-anchor="middle">پاکستان کے نظریے</text><text class="small" x="390" y="270" text-anchor="middle">تنا</text><line class="dash" x1="756" y1="360" x2="24" y2="360"/><text class="small" x="756" y="352" text-anchor="end">زمین کے اوپر بنیادی تصورات</text><text class="small" x="756" y="378" text-anchor="end">زمین کے نیچے جڑیں</text><rect class="panel-a" x="416" y="400" width="340" height="120" rx="8"/><text class="h" x="586" y="426" text-anchor="middle">دو قومی نظریہ</text><text class="body" x="586" y="452" text-anchor="middle">جنوبی ایشیا کے مسلمان ایک قوم ہیں،</text><text class="body" x="586" y="469" text-anchor="middle">جنہیں خود حکمرانی کا حق ہے</text><rect class="panel-a" x="24" y="400" width="340" height="120" rx="8"/><text class="h" x="194" y="426" text-anchor="middle">ریاست کا اسلامی تصور</text><text class="body" x="194" y="452" text-anchor="middle">اللہ کی حاکمیت؛ اختیار بطور امانت؛</text><text class="body" x="194" y="469" text-anchor="middle">انصاف؛ مشاورت؛ مساوات</text><path class="stroke" d="M586 400 C586 350 440 370 440 322" marker-end="url(#arrow)"/><path class="stroke" d="M194 400 C194 350 340 370 340 322" marker-end="url(#arrow)"/><text class="wm" x="12" y="550" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
