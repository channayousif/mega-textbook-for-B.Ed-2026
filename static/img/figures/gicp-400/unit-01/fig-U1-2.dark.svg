<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 368" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of three jobs of a constitution with a Pakistani article for each</title><desc id="d">Table of three jobs of a constitution with a Pakistani article for each: it sets up institutions (Article 50 creates Parliament, Article 175 establishes the courts), it limits power (Article 8 stops the State making a law that takes away Fundamental Rights), and it protects rights (Article 25 on equality before law, Article 25A on free and compulsory education).</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .thin { stroke: var(--ink); stroke-width: 1.5; fill: none; } .dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .cell { font-size: 13px; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .ahm { fill: var(--muted); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="368"/><text class="h" x="24" y="32">What a constitution does, with articles of the Constitution of Pakistan</text><rect class="panel" x="24" y="52" width="732" height="40"/><text class="sh" x="34" y="78">Job</text><text class="sh" x="184" y="78">What it means</text><text class="sh" x="416" y="78">In the Constitution of Pakistan</text><rect class="panel-a" x="24" y="92" width="150" height="92"/><text class="sh" x="34" y="117">Sets up</text><text class="sh" x="34" y="134">institutions</text><text class="body" x="184" y="117">Says which bodies exist and</text><text class="body" x="184" y="134">what each one does</text><text class="body" x="416" y="117">Article 50: Parliament is the President and</text><text class="body" x="416" y="134">two Houses, the National Assembly and</text><text class="body" x="416" y="151">the Senate</text><text class="body" x="416" y="168">Article 175: establishes the courts</text><line class="thin" x1="174" y1="184" x2="756" y2="184"/><rect class="panel-a" x="24" y="184" width="150" height="75"/><text class="sh" x="34" y="209">Limits power</text><text class="body" x="184" y="209">Government may act only</text><text class="body" x="184" y="226">within the rules. Even</text><text class="body" x="184" y="243">Parliament is under them</text><text class="body" x="416" y="209">Article 8(2): the State shall not make a law</text><text class="body" x="416" y="226">that takes away Fundamental Rights; a</text><text class="body" x="416" y="243">law that does so is void to that extent</text><line class="thin" x1="174" y1="259" x2="756" y2="259"/><rect class="panel-a" x="24" y="259" width="150" height="75"/><text class="sh" x="34" y="284">Protects rights</text><text class="body" x="184" y="284">People hold rights that a</text><text class="body" x="184" y="301">government cannot remove</text><text class="body" x="184" y="318">whenever it wishes</text><text class="body" x="416" y="284">Article 25: all citizens are equal before law</text><text class="body" x="416" y="301">Article 25A: free and compulsory education</text><text class="body" x="416" y="318">for children aged five to sixteen</text><line class="thin" x1="174" y1="334" x2="756" y2="334"/><path class="thin" d="M24 334 H756"/><line class="thin" x1="174" y1="52" x2="174" y2="334"/><line class="thin" x1="406" y1="52" x2="406" y2="334"/><line class="thin" x1="756" y1="52" x2="756" y2="334"/><text class="wm" x="768" y="358" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
