<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عمل درآمد: متن، ادارے اور عملی صورتحال</title><desc id="d">آئینی عمل درآمد تحریری عہد، ذمہ دار اداروں اور مشاہدے میں آنے والے عمل کو جوڑتا ہے، جس میں شواہد اور شکایات کے ذریعے فیڈ بیک شامل ہے؛ دفعہ 25A کو 2010 کا اضافہ قرار دیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:15px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="600" /><text x="754.0" y="36" text-anchor="end" class="heading"><tspan x="754.0" dy="0">عمل درآمد: متن، ادارے اور عملی صورتحال</tspan></text><rect class="accent" x="86.67" y="75" width="580.67" height="100" rx="8" /><text x="651.34" y="105" text-anchor="end" class="label"><tspan x="651.34" dy="0">متن: کیا وعدہ کیا گیا ہے؟</tspan><tspan x="651.34" dy="24">مثال: دفعہ 25A، جو 2010 میں شامل کی گئی</tspan><tspan x="651.34" dy="24">5 تا 16 سال کی عمر کے لیے مفت اور لازمی تعلیم</tspan></text><path d="M377.0,177 L377.0,212" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="225" width="580.67" height="100" rx="8" /><text x="651.34" y="255" text-anchor="end" class="label"><tspan x="651.34" dy="0">ادارے: کسے عمل کرنا ہے؟</tspan><tspan x="651.34" dy="24">ذمہ دار سرکاری ادارے، قوانین اور انتظامیہ</tspan><tspan x="651.34" dy="24">بجٹ اور طریقہ کار فرائض کو عملی اقدام سے جوڑتے ہیں</tspan></text><path d="M377.0,327 L377.0,362" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="86.67" y="375" width="580.67" height="100" rx="8" /><text x="651.34" y="405" text-anchor="end" class="label"><tspan x="651.34" dy="0">عملی صورتحال: کیا واقع ہوتا ہے؟</tspan><tspan x="651.34" dy="24">اسکولوں تک رسائی، حاضری اور فعال سہولیات کے شواہد</tspan><tspan x="651.34" dy="24">صرف تحریری عہد تکمیل کا ثبوت نہیں ہوتا</tspan></text><path d="M108.33,425 L52.0,425 L52.0,275 L108.33,275" class="arrow" marker-end="url(#arr)" /><text x="667.34" y="523" text-anchor="end" class="label"><tspan x="667.34" dy="0">شواہد اور شکایات کا عمل اداروں کے اقدامات پر اثر انداز ہوتا ہے۔</tspan><tspan x="667.34" dy="24">پوچھیں کہ ہر سطح کیا ثابت کرتی ہے، اور کون سے شواہد ابھی باقی ہیں۔</tspan></text><text x="12" y="586" text-anchor="start" class="wm" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>