<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 675" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From crisis to a permanent constitutional settlement</title><desc id="d">The Constitution emerged through an interim settlement and committee drafting, followed by passage on 10 April, authentication on 12 April and commencement on 14 August 1973.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="675" /><text x="26.0" y="36" class="heading"><tspan x="26.0" dy="0">From crisis to a permanent constitutional settlement</tspan></text><rect class="accent" x="86.67" y="66" width="606.67" height="60" rx="8" /><text x="102.27" y="95" class="label"><tspan x="102.27" dy="0">1971 crisis: separation and disputed authority</tspan></text><path d="M390.0,128 L390.0,149" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="154" width="606.67" height="60" rx="8" /><text x="102.27" y="183" class="label"><tspan x="102.27" dy="0">April 1972: interim settlement and Constitution Committee</tspan></text><path d="M390.0,216 L390.0,237" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="86.67" y="242" width="606.67" height="60" rx="8" /><text x="102.27" y="271" class="label"><tspan x="102.27" dy="0">31 December 1972: committee draft presented</tspan></text><path d="M390.0,304 L390.0,325" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="330" width="606.67" height="60" rx="8" /><text x="102.27" y="359" class="label"><tspan x="102.27" dy="0">10 April 1973: Assembly passes the Constitution</tspan></text><path d="M390.0,392 L390.0,413" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="86.67" y="418" width="606.67" height="60" rx="8" /><text x="102.27" y="447" class="label"><tspan x="102.27" dy="0">12 April 1973: text authenticated</tspan></text><path d="M390.0,480 L390.0,501" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="506" width="606.67" height="60" rx="8" /><text x="102.27" y="535" class="label"><tspan x="102.27" dy="0">14 August 1973: Constitution commences</tspan></text><text x="86.67" y="627" class="label"><tspan x="86.67" dy="0">Name the action as well as the date.</tspan></text><text x="766.13" y="661" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
