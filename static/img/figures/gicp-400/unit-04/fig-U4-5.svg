<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three constitutions in historical perspective</title><desc id="d">The 1956 and 1962 constitutions ended by abrogation, while the 1973 framework survived through revival and amendment despite interrupted operation.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="600" /><text x="26.0" y="36" class="heading"><tspan x="26.0" dy="0">Three constitutions in historical perspective</tspan></text><text x="26.0" y="80" class="label"><tspan x="26.0" dy="0">Framework and system</tspan></text><text x="286.0" y="80" class="label"><tspan x="286.0" dy="0">Operating history and fate</tspan></text><rect class="panel" x="26.0" y="100" width="238.33" height="105" rx="8" /><text x="41.6" y="129" class="label"><tspan x="41.6" dy="0">1956: parliamentary</tspan><tspan x="41.6" dy="22">One central chamber</tspan></text><rect class="accent" x="281.67" y="100" width="472.33" height="105" rx="8" /><text x="297.27" y="129" class="label"><tspan x="297.27" dy="0">23 March 1956 to 7 October 1958</tspan><tspan x="297.27" dy="22">About two and a half years, then abrogated</tspan></text><rect class="panel" x="26.0" y="226" width="238.33" height="105" rx="8" /><text x="41.6" y="255" class="label"><tspan x="41.6" dy="0">1962: presidential</tspan><tspan x="41.6" dy="22">One central chamber</tspan></text><rect class="accent" x="281.67" y="226" width="472.33" height="105" rx="8" /><text x="297.27" y="255" class="label"><tspan x="297.27" dy="0">8 June 1962 to 25 March 1969</tspan><tspan x="297.27" dy="22">Under seven years, then abrogated</tspan></text><rect class="panel" x="26.0" y="352" width="238.33" height="105" rx="8" /><text x="41.6" y="381" class="label"><tspan x="41.6" dy="0">1973: parliamentary</tspan><tspan x="41.6" dy="22">Two central Houses</tspan></text><rect class="accent" x="281.67" y="352" width="472.33" height="105" rx="8" /><text x="297.27" y="381" class="label"><tspan x="297.27" dy="0">From 14 August 1973; operation interrupted</tspan><tspan x="297.27" dy="22">Revived after 1977 and 1999; amended</tspan><tspan x="297.27" dy="22">A further interruption occurred in 2007</tspan></text><text x="26.0" y="520" class="label"><tspan x="26.0" dy="0">Survival of a framework does not prove uninterrupted operation.</tspan><tspan x="26.0" dy="22">Duration alone does not measure successful implementation.</tspan></text><text x="766.13" y="586" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
