<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 675" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بحران سے مستقل آئینی تصفیے تک</title><desc id="d">آئین ایک عبوری تصفیے اور کمیٹی کے مسودے کے ذریعے سامنے آیا، جس کے بعد 10 اپریل کو منظوری، 12 اپریل کو توثیق اور 14 اگست 1973 کو نفاذ ہوا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:15px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="675" /><text x="754.0" y="36" text-anchor="end" class="heading"><tspan x="754.0" dy="0">بحران سے مستقل آئینی تصفیے تک</tspan></text><rect class="accent" x="86.67" y="66" width="606.67" height="60" rx="8" /><text x="677.34" y="100" text-anchor="end" class="label"><tspan x="677.34" dy="0">1971 کا بحران: علیحدگی اور متنازع اختیارات</tspan></text><path d="M390.0,128 L390.0,149" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="154" width="606.67" height="60" rx="8" /><text x="677.34" y="188" text-anchor="end" class="label"><tspan x="677.34" dy="0">اپریل 1972: عبوری تصفیہ اور آئینی کمیٹی</tspan></text><path d="M390.0,216 L390.0,237" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="86.67" y="242" width="606.67" height="60" rx="8" /><text x="677.34" y="276" text-anchor="end" class="label"><tspan x="677.34" dy="0">31 دسمبر 1972: کمیٹی کا تیار کردہ مسودہ پیش کیا گیا</tspan></text><path d="M390.0,304 L390.0,325" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="330" width="606.67" height="60" rx="8" /><text x="677.34" y="364" text-anchor="end" class="label"><tspan x="677.34" dy="0">10 اپریل 1973: قومی اسمبلی نے آئین منظور کیا</tspan></text><path d="M390.0,392 L390.0,413" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="86.67" y="418" width="606.67" height="60" rx="8" /><text x="677.34" y="452" text-anchor="end" class="label"><tspan x="677.34" dy="0">12 اپریل 1973: آئینی متن کی توثیق ہوئی</tspan></text><path d="M390.0,480 L390.0,501" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="506" width="606.67" height="60" rx="8" /><text x="677.34" y="540" text-anchor="end" class="label"><tspan x="677.34" dy="0">14 اگست 1973: آئین نافذ ہوا</tspan></text><text x="693.34" y="627" text-anchor="end" class="label"><tspan x="693.34" dy="0">تاریخ کے ساتھ ساتھ متعلقہ آئینی اقدام کا بھی ذکر کریں۔</tspan></text><text x="12" y="661" text-anchor="start" class="wm" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>