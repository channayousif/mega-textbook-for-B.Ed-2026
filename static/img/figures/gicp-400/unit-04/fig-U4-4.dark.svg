<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 665" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Islamic provisions within the constitutional framework</title><desc id="d">Islamic commitments sit within representative institutions and citizenship safeguards, with the 1980 Federal Shariat Court and 1985 Article 2A clearly separated from the original 1973 settlement.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="665" /><text x="26.0" y="36" class="heading"><tspan x="26.0" dy="0">Islamic provisions within the constitutional framework</tspan></text><rect class="accent" x="164.67" y="65" width="450.67" height="60" rx="8" /><text x="180.27" y="94" class="label"><tspan x="180.27" dy="0">1973 constitutional arrangement</tspan></text><path d="M286.0,127 L203.67,170" class="arrow" marker-end="url(#arr)" /><path d="M494.0,127 L576.33,170" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="26.0" y="180" width="355.33" height="205" rx="8" /><text x="41.6" y="209" class="label"><tspan x="41.6" dy="0">Original Islamic commitments</tspan><tspan x="41.6" dy="22">Art. 2: state religion</tspan><tspan x="41.6" dy="22">Art. 31: policy responsibility</tspan><tspan x="41.6" dy="22">Art. 227: conformity of laws</tspan><tspan x="41.6" dy="22">Arts. 228-230: advisory Council</tspan></text><rect class="accent" x="398.67" y="180" width="355.33" height="205" rx="8" /><text x="414.27" y="209" class="label"><tspan x="414.27" dy="0">Citizenship safeguards</tspan><tspan x="414.27" dy="22">Art. 20: religious freedom</tspan><tspan x="414.27" dy="22">Art. 22: religious education safeguards</tspan><tspan x="414.27" dy="22">Art. 25: equality before law</tspan><tspan x="414.27" dy="22">Read commitments and safeguards</tspan><tspan x="414.27" dy="22">together</tspan></text><path d="M203.67,387 L203.67,425" class="arrow" marker-end="url(#arr)" /><path d="M576.33,387 L576.33,425" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="26.0" y="438" width="728.0" height="105" rx="8" /><text x="41.6" y="467" class="label"><tspan x="41.6" dy="0">Later additions to the same framework</tspan><tspan x="41.6" dy="22">1980: Federal Shariat Court (judicial institution)</tspan><tspan x="41.6" dy="22">1985: Article 2A (Objectives Resolution becomes substantive)</tspan></text><text x="26.0" y="585" class="label"><tspan x="26.0" dy="0">Advice, legislation and adjudication are different functions.</tspan><tspan x="26.0" dy="22">The title 1973 does not date every provision in an amended edition.</tspan></text><text x="766.13" y="651" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
