<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three constitutions in historical perspective</title><desc id="d">The 1956 and 1962 constitutions ended by abrogation, while the 1973 framework survived through revival and amendment despite interrupted operation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="600" /><text x="26.0" y="36" class="heading"><tspan x="26.0" dy="0">Three constitutions in historical perspective</tspan></text><text x="26.0" y="80" class="label"><tspan x="26.0" dy="0">Framework and system</tspan></text><text x="286.0" y="80" class="label"><tspan x="286.0" dy="0">Operating history and fate</tspan></text><rect class="panel" x="26.0" y="100" width="238.33" height="105" rx="8" /><text x="41.6" y="129" class="label"><tspan x="41.6" dy="0">1956: parliamentary</tspan><tspan x="41.6" dy="22">One central chamber</tspan></text><rect class="accent" x="281.67" y="100" width="472.33" height="105" rx="8" /><text x="297.27" y="129" class="label"><tspan x="297.27" dy="0">23 March 1956 to 7 October 1958</tspan><tspan x="297.27" dy="22">About two and a half years, then abrogated</tspan></text><rect class="panel" x="26.0" y="226" width="238.33" height="105" rx="8" /><text x="41.6" y="255" class="label"><tspan x="41.6" dy="0">1962: presidential</tspan><tspan x="41.6" dy="22">One central chamber</tspan></text><rect class="accent" x="281.67" y="226" width="472.33" height="105" rx="8" /><text x="297.27" y="255" class="label"><tspan x="297.27" dy="0">8 June 1962 to 25 March 1969</tspan><tspan x="297.27" dy="22">Under seven years, then abrogated</tspan></text><rect class="panel" x="26.0" y="352" width="238.33" height="105" rx="8" /><text x="41.6" y="381" class="label"><tspan x="41.6" dy="0">1973: parliamentary</tspan><tspan x="41.6" dy="22">Two central Houses</tspan></text><rect class="accent" x="281.67" y="352" width="472.33" height="105" rx="8" /><text x="297.27" y="381" class="label"><tspan x="297.27" dy="0">From 14 August 1973; operation interrupted</tspan><tspan x="297.27" dy="22">Revived after 1977 and 1999; amended</tspan><tspan x="297.27" dy="22">A further interruption occurred in 2007</tspan></text><text x="26.0" y="520" class="label"><tspan x="26.0" dy="0">Survival of a framework does not prove uninterrupted operation.</tspan><tspan x="26.0" dy="22">Duration alone does not measure successful implementation.</tspan></text><text x="766.13" y="586" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
