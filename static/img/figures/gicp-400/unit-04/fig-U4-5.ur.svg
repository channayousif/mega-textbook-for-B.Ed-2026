<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تاریخی تناظر میں تینوں دساتیر</title><desc id="d">1956 اور 1962 کے دساتیر تنسیخ کے ذریعے ختم ہوئے، جبکہ 1973 کا ڈھانچہ تعطلات کے باوجود بحالی اور ترمیم کے ذریعے برقرار رہا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:15px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="600" /><text x="754.0" y="36" text-anchor="end" class="heading"><tspan x="754.0" dy="0">تاریخی تناظر میں تینوں دساتیر</tspan></text><text x="754.0" y="80" text-anchor="end" class="label"><tspan x="754.0" dy="0">ڈھانچہ اور نظامِ حکومت</tspan></text><text x="498.33" y="80" text-anchor="end" class="label"><tspan x="498.33" dy="0">نفاذ کی مدت اور انجام</tspan></text><rect class="panel" x="515.67" y="100" width="238.33" height="105" rx="8" /><rect class="accent" x="26.0" y="100" width="472.33" height="105" rx="8" /><text x="738.4" y="132" text-anchor="end" class="label"><tspan x="738.4" dy="0">1956: پارلیمانی نظام</tspan><tspan x="738.4" dy="24">ایک مرکزی ایوان</tspan></text><text x="482.73" y="132" text-anchor="end" class="label"><tspan x="482.73" dy="0">23 مارچ 1956 تا 7 اکتوبر 1958</tspan><tspan x="482.73" dy="24">تقریباً ڈھائی سال، پھر منسوخ ہوا</tspan></text><rect class="panel" x="515.67" y="226" width="238.33" height="105" rx="8" /><rect class="accent" x="26.0" y="226" width="472.33" height="105" rx="8" /><text x="738.4" y="258" text-anchor="end" class="label"><tspan x="738.4" dy="0">1962: صدارتی نظام</tspan><tspan x="738.4" dy="24">ایک مرکزی ایوان</tspan></text><text x="482.73" y="258" text-anchor="end" class="label"><tspan x="482.73" dy="0">8 جون 1962 تا 25 مارچ 1969</tspan><tspan x="482.73" dy="24">سات سال سے کم، پھر منسوخ ہوا</tspan></text><rect class="panel" x="515.67" y="352" width="238.33" height="105" rx="8" /><rect class="accent" x="26.0" y="352" width="472.33" height="105" rx="8" /><text x="738.4" y="384" text-anchor="end" class="label"><tspan x="738.4" dy="0">1973: پارلیمانی نظام</tspan><tspan x="738.4" dy="24">دو مرکزی ایوان</tspan></text><text x="482.73" y="384" text-anchor="end" class="label"><tspan x="482.73" dy="0">14 اگست 1973 سے نفاذ؛ عمل میں تعطلات آئے</tspan><tspan x="482.73" dy="24">1977 اور 1999 کے بعد بحال و ترمیم شدہ</tspan><tspan x="482.73" dy="24">2007 میں ایک اور تعطل واقع ہوا</tspan></text><text x="754.0" y="520" text-anchor="end" class="label"><tspan x="754.0" dy="0">کسی ڈھانچے کا برقرار رہنا بلا تعطل نفاذ کا ثبوت نہیں ہے۔</tspan><tspan x="754.0" dy="24">صرف مدت کامیاب عمل درآمد کی پیمائش نہیں کرتی۔</tspan></text><text x="12" y="586" text-anchor="start" class="wm" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>