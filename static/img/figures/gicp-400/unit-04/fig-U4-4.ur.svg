<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 665" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئینی ڈھانچے کے اندر اسلامی دفعات</title><desc id="d">اسلامی وعدے نمائندہ اداروں اور شہریت کے تحفظات کے ساتھ جڑے ہیں، جبکہ 1980 کی وفاقی شرعی عدالت اور 1985 کی دفعہ 2A کو 1973 کے اصل تصفیے سے واضح طور پر الگ رکھا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:15px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="665" /><text x="754.0" y="36" text-anchor="end" class="heading"><tspan x="754.0" dy="0">آئینی ڈھانچے کے اندر اسلامی دفعات</tspan></text><rect class="accent" x="164.67" y="65" width="450.67" height="60" rx="8" /><text x="390.0" y="100" text-anchor="middle" class="label"><tspan x="390.0" dy="0">1973 کا آئینی بندوبست</tspan></text><path d="M494.0,127 L576.33,170" class="arrow" marker-end="url(#arr)" /><path d="M286.0,127 L203.67,170" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="398.67" y="180" width="355.33" height="205" rx="8" /><text x="738.4" y="210" text-anchor="end" class="label"><tspan x="738.4" dy="0">اصل اسلامی وعدے</tspan><tspan x="738.4" dy="24">دفعہ 2: مملکتی مذہب</tspan><tspan x="738.4" dy="24">دفعہ 31: پالیسی کی ذمہ داری</tspan><tspan x="738.4" dy="24">دفعہ 227: قوانین کی مطابقت</tspan><tspan x="738.4" dy="24">دفعات 228-230: مشاورتی کونسل</tspan></text><rect class="accent" x="26.0" y="180" width="355.33" height="205" rx="8" /><text x="365.73" y="210" text-anchor="end" class="label"><tspan x="365.73" dy="0">شہریت کے تحفظات</tspan><tspan x="365.73" dy="24">دفعہ 20: مذہبی آزادی</tspan><tspan x="365.73" dy="24">دفعہ 22: مذہبی تعلیم کے تحفظات</tspan><tspan x="365.73" dy="24">دفعہ 25: قانون کے سامنے برابری</tspan><tspan x="365.73" dy="24">وعدوں اور تحفظات کو ملا کر پڑھیں</tspan></text><path d="M576.33,387 L576.33,425" class="arrow" marker-end="url(#arr)" /><path d="M203.67,387 L203.67,425" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="26.0" y="438" width="728.0" height="105" rx="8" /><text x="738.4" y="470" text-anchor="end" class="label"><tspan x="738.4" dy="0">اسی آئینی ڈھانچے میں بعد کی ترامیم</tspan><tspan x="738.4" dy="24">1980: وفاقی شرعی عدالت (عدالتی ادارہ)</tspan><tspan x="738.4" dy="24">1985: دفعہ 2A (قراردادِ مقاصد آئین کا مؤثر حصہ بنی)</tspan></text><text x="754.0" y="585" text-anchor="end" class="label"><tspan x="754.0" dy="0">مشورہ، قانون سازی اور عدالتی فیصلہ الگ الگ افعال ہیں۔</tspan><tspan x="754.0" dy="24">عنوان 1973 ترمیم شدہ ایڈیشن میں ہر شق کی تاریخ کا تعین نہیں کرتا۔</tspan></text><text x="12" y="651" text-anchor="start" class="wm" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>