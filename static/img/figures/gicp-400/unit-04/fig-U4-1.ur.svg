<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 615" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آئینی تعطلات اور بحالی کے مراحل</title><desc id="d">بحالی کے مراحل سے جڑے چار تعطلات: 1958 سے 1962 کا ڈھانچہ، 1969 سے 1972 کے عبوری قواعد اور 1973 کا آئین، 1977 سے 1985 کے انتخابات اور 1988 کے جماعتی انتخابات، اور 1999 سے 2002 کے انتخابات اور 2008 کی سویلین منتقلی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:15px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="615" /><text x="754.0" y="36" text-anchor="end" class="heading"><tspan x="754.0" dy="0">آئینی تعطلات اور بحالی کے مراحل</tspan></text><text x="754.0" y="73" text-anchor="end" class="label"><tspan x="754.0" dy="0">تعطل</tspan></text><text x="429.0" y="73" text-anchor="end" class="label"><tspan x="429.0" dy="0">بحالی کے مراحل</tspan></text><rect class="panel" x="489.67" y="94" width="264.33" height="82" rx="8" /><path d="M481.0,135 L437.0,135" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="26.0" y="94" width="403.0" height="82" rx="8" /><text x="738.4" y="123" text-anchor="end" class="label"><tspan x="738.4" dy="0">1958: مارشل لا</tspan><tspan x="738.4" dy="24">1956 کا آئین منسوخ</tspan></text><text x="413.4" y="123" text-anchor="end" class="label"><tspan x="413.4" dy="0">1962: نیا صدارتی آئین</tspan><tspan x="413.4" dy="24">تحریری ڈھانچے کی واپسی</tspan></text><rect class="panel" x="489.67" y="206" width="264.33" height="82" rx="8" /><path d="M481.0,247 L437.0,247" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="26.0" y="206" width="403.0" height="82" rx="8" /><text x="738.4" y="235" text-anchor="end" class="label"><tspan x="738.4" dy="0">1969: مارشل لا</tspan><tspan x="738.4" dy="24">1962 کا آئین منسوخ</tspan></text><text x="413.4" y="235" text-anchor="end" class="label"><tspan x="413.4" dy="0">1970: انتخابات؛ اقتدار کی منتقلی ناکام</tspan><tspan x="413.4" dy="24">1972: عبوری قواعد؛ 1973: مستقل تصفیہ</tspan></text><rect class="panel" x="489.67" y="318" width="264.33" height="82" rx="8" /><path d="M481.0,359 L437.0,359" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="26.0" y="318" width="403.0" height="82" rx="8" /><text x="738.4" y="347" text-anchor="end" class="label"><tspan x="738.4" dy="0">1977: مارشل لا</tspan><tspan x="738.4" dy="24">1973 کا آئین معطل</tspan></text><text x="413.4" y="347" text-anchor="end" class="label"><tspan x="413.4" dy="0">1985: انتخابات، بحالی، مارشل لا کا خاتمہ</tspan><tspan x="413.4" dy="24">1988: جماعتی انتخابات اور سویلین حکومت</tspan></text><rect class="panel" x="489.67" y="430" width="264.33" height="82" rx="8" /><path d="M481.0,471 L437.0,471" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="26.0" y="430" width="403.0" height="82" rx="8" /><text x="738.4" y="459" text-anchor="end" class="label"><tspan x="738.4" dy="0">1999: فوجی اقتدار</tspan><tspan x="738.4" dy="24">1973 کا آئین معطل</tspan></text><text x="413.4" y="459" text-anchor="end" class="label"><tspan x="413.4" dy="0">2002: فوجی صدارت کے تحت انتخابات</tspan><tspan x="413.4" dy="24">2008: انتخابات اور سویلین منتقلی</tspan></text><text x="754.0" y="568" text-anchor="end" class="label"><tspan x="754.0" dy="0">ہر قطار کی اپنی ترتیب ہے۔ یہ قطاریں ایک مسلسل زمانی محور نہیں ہیں۔</tspan></text><text x="12" y="601" text-anchor="start" class="wm" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>