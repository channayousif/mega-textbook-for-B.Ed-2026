<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 575" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Different breakdowns, different constitutional fates</title><desc id="d">Comparison separates abrogation in 1958 and 1969 from holding the 1973 Constitution in abeyance in 1977 and 1999, and records different stages of restoration.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="575" /><text x="26.0" y="36" class="heading"><tspan x="26.0" dy="0">Different breakdowns, different constitutional fates</tspan></text><text x="26.0" y="78" class="label"><tspan x="26.0" dy="0">Breakdown</tspan></text><text x="143.0" y="78" class="label"><tspan x="143.0" dy="0">Effect on constitutional text</tspan></text><text x="411.67" y="78" class="label"><tspan x="411.67" dy="0">How government returned</tspan></text><rect class="panel" x="26.0" y="96" width="95.33" height="82" rx="8" /><text x="41.6" y="125" class="label"><tspan x="41.6" dy="0">1958</tspan></text><rect class="panel" x="134.33" y="96" width="260.0" height="82" rx="8" /><text x="149.93" y="125" class="label"><tspan x="149.93" dy="0">1956 Constitution</tspan><tspan x="149.93" dy="22">abrogated</tspan></text><rect class="accent" x="407.33" y="96" width="346.67" height="82" rx="8" /><text x="422.93" y="125" class="label"><tspan x="422.93" dy="0">1962 Constitution</tspan><tspan x="422.93" dy="22">Presidential framework</tspan></text><rect class="panel" x="26.0" y="196" width="95.33" height="82" rx="8" /><text x="41.6" y="225" class="label"><tspan x="41.6" dy="0">1969</tspan></text><rect class="panel" x="134.33" y="196" width="260.0" height="82" rx="8" /><text x="149.93" y="225" class="label"><tspan x="149.93" dy="0">1962 Constitution</tspan><tspan x="149.93" dy="22">abrogated</tspan></text><rect class="accent" x="407.33" y="196" width="346.67" height="82" rx="8" /><text x="422.93" y="225" class="label"><tspan x="422.93" dy="0">1972 interim Constitution</tspan><tspan x="422.93" dy="22">1973 permanent settlement</tspan></text><rect class="panel" x="26.0" y="296" width="95.33" height="82" rx="8" /><text x="41.6" y="325" class="label"><tspan x="41.6" dy="0">1977</tspan></text><rect class="panel" x="134.33" y="296" width="260.0" height="82" rx="8" /><text x="149.93" y="325" class="label"><tspan x="149.93" dy="0">1973 framework in</tspan><tspan x="149.93" dy="22">abeyance</tspan></text><rect class="accent" x="407.33" y="296" width="346.67" height="82" rx="8" /><text x="422.93" y="325" class="label"><tspan x="422.93" dy="0">1985 revival and amendment</tspan><tspan x="422.93" dy="22">1988 party-based election</tspan></text><rect class="panel" x="26.0" y="396" width="95.33" height="82" rx="8" /><text x="41.6" y="425" class="label"><tspan x="41.6" dy="0">1999</tspan></text><rect class="panel" x="134.33" y="396" width="260.0" height="82" rx="8" /><text x="149.93" y="425" class="label"><tspan x="149.93" dy="0">1973 framework in</tspan><tspan x="149.93" dy="22">abeyance</tspan></text><rect class="accent" x="407.33" y="396" width="346.67" height="82" rx="8" /><text x="422.93" y="425" class="label"><tspan x="422.93" dy="0">2002 elected assemblies</tspan><tspan x="422.93" dy="22">2008 civilian transition</tspan></text><text x="26.0" y="530" class="label"><tspan x="26.0" dy="0">Abrogation ends the framework. Abeyance interrupts its operation.</tspan></text><text x="766.13" y="561" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
