<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Implementation: text, institutions and practice</title><desc id="d">Constitutional implementation links a written commitment, responsible institutions and observable practice, with feedback through evidence and complaints; Article 25A is identified as a 2010 addition.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="600" /><text x="26.0" y="36" class="heading"><tspan x="26.0" dy="0">Implementation: text, institutions and practice</tspan></text><rect class="accent" x="86.67" y="75" width="580.67" height="100" rx="8" /><text x="102.27" y="104" class="label"><tspan x="102.27" dy="0">TEXT: What is promised?</tspan><tspan x="102.27" dy="22">Example: Article 25A, added in 2010</tspan><tspan x="102.27" dy="22">Free and compulsory education, ages 5-16</tspan></text><path d="M377.0,177 L377.0,212" class="arrow" marker-end="url(#arr)" /><rect class="panel" x="86.67" y="225" width="580.67" height="100" rx="8" /><text x="102.27" y="254" class="label"><tspan x="102.27" dy="0">INSTITUTIONS: Who must act?</tspan><tspan x="102.27" dy="22">Responsible public bodies, laws and administration</tspan><tspan x="102.27" dy="22">Budgets and procedures connect duties with action</tspan></text><path d="M377.0,327 L377.0,362" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="86.67" y="375" width="580.67" height="100" rx="8" /><text x="102.27" y="404" class="label"><tspan x="102.27" dy="0">PRACTICE: What happens?</tspan><tspan x="102.27" dy="22">Evidence of access, attendance and functioning schools</tspan><tspan x="102.27" dy="22">A written commitment alone does not prove fulfilment</tspan></text><path d="M671.67,425 L728.0,425 L728.0,275 L671.67,275" class="arrow" marker-end="url(#arr)" /><text x="86.67" y="523" class="label"><tspan x="86.67" dy="0">Evidence and complaints feed back into institutional action.</tspan><tspan x="86.67" dy="22">Ask what each layer proves, and what evidence is still missing.</tspan></text><text x="766.13" y="586" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
