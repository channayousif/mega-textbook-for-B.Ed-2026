<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 615" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Interruptions and stages of return</title><desc id="d">Four interruptions linked to stages of return: 1958 to the 1962 framework, 1969 to interim rule in 1972 and the 1973 Constitution, 1977 to 1985 elections and 1988 party elections, and 1999 to 2002 elections and the 2008 civilian transition.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:16px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="615" /><text x="26.0" y="36" class="heading"><tspan x="26.0" dy="0">Interruptions and stages of return</tspan></text><text x="26.0" y="73" class="label"><tspan x="26.0" dy="0">Interruption</tspan></text><text x="355.33" y="73" class="label"><tspan x="355.33" dy="0">Stages of return</tspan></text><rect class="panel" x="26.0" y="94" width="264.33" height="82" rx="8" /><text x="41.6" y="123" class="label"><tspan x="41.6" dy="0">1958: martial law</tspan><tspan x="41.6" dy="22">1956 text abrogated</tspan></text><path d="M299.0,135 L338.0,135" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="351.0" y="94" width="403.0" height="82" rx="8" /><text x="366.6" y="123" class="label"><tspan x="366.6" dy="0">1962: new presidential Constitution</tspan><tspan x="366.6" dy="22">Written framework returns</tspan></text><rect class="panel" x="26.0" y="206" width="264.33" height="82" rx="8" /><text x="41.6" y="235" class="label"><tspan x="41.6" dy="0">1969: martial law</tspan><tspan x="41.6" dy="22">1962 text abrogated</tspan></text><path d="M299.0,247 L338.0,247" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="351.0" y="206" width="403.0" height="82" rx="8" /><text x="366.6" y="235" class="label"><tspan x="366.6" dy="0">1970: election; transfer fails</tspan><tspan x="366.6" dy="22">1972: interim rules; 1973: permanent</tspan><tspan x="366.6" dy="22">settlement</tspan></text><rect class="panel" x="26.0" y="318" width="264.33" height="82" rx="8" /><text x="41.6" y="347" class="label"><tspan x="41.6" dy="0">1977: martial law</tspan><tspan x="41.6" dy="22">1973 text in abeyance</tspan></text><path d="M299.0,359 L338.0,359" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="351.0" y="318" width="403.0" height="82" rx="8" /><text x="366.6" y="347" class="label"><tspan x="366.6" dy="0">1985: election, revival, end of martial law</tspan><tspan x="366.6" dy="22">1988: party election and civilian government</tspan></text><rect class="panel" x="26.0" y="430" width="264.33" height="82" rx="8" /><text x="41.6" y="459" class="label"><tspan x="41.6" dy="0">1999: military takeover</tspan><tspan x="41.6" dy="22">1973 text in abeyance</tspan></text><path d="M299.0,471 L338.0,471" class="arrow" marker-end="url(#arr)" /><rect class="accent" x="351.0" y="430" width="403.0" height="82" rx="8" /><text x="366.6" y="459" class="label"><tspan x="366.6" dy="0">2002: election under military-led presidency</tspan><tspan x="366.6" dy="22">2008: election and civilian transition</tspan></text><text x="26.0" y="568" class="label"><tspan x="26.0" dy="0">Each row has its own sequence. The rows are not one continuous time axis.</tspan></text><text x="766.13" y="601" text-anchor="end" class="wm" aria-hidden="true">textbook.com.pk</text></svg>
