<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 575" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مختلف تعطلات، مختلف آئینی نتائج</title><desc id="d">یہ موازنہ 1958 اور 1969 کی تنسیخ کو 1977 اور 1999 میں 1973 کے آئین کے التوا سے الگ کرتا ہے، اور بحالی کے مختلف مراحل درج کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.accent{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.heading{font-size:18px;font-weight:700;fill:var(--ink)}.label{font-size:15px;fill:var(--ink)}.arrow{stroke:var(--ink);stroke-width:2;fill:none}.tip{fill:var(--ink)}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip" /></marker></defs><rect class="bg" x="0.0" y="0" width="780.0" height="575" /><text x="754.0" y="36" text-anchor="end" class="heading"><tspan x="754.0" dy="0">مختلف تعطلات، مختلف آئینی نتائج</tspan></text><text x="754.0" y="78" text-anchor="end" class="label"><tspan x="754.0" dy="0">تعطل</tspan></text><text x="645.67" y="78" text-anchor="end" class="label"><tspan x="645.67" dy="0">آئینی متن پر اثر</tspan></text><text x="372.67" y="78" text-anchor="end" class="label"><tspan x="372.67" dy="0">حکومت کی واپسی کی نوعیت</tspan></text><rect class="panel" x="658.67" y="96" width="95.33" height="82" rx="8" /><rect class="panel" x="385.67" y="96" width="260.0" height="82" rx="8" /><rect class="accent" x="26.0" y="96" width="346.67" height="82" rx="8" /><text x="706.33" y="142" text-anchor="middle" class="label"><tspan x="706.33" dy="0">1958</tspan></text><text x="630.0" y="125" text-anchor="end" class="label"><tspan x="630.0" dy="0">1956 کا آئین</tspan><tspan x="630.0" dy="24">منسوخ</tspan></text><text x="356.67" y="125" text-anchor="end" class="label"><tspan x="356.67" dy="0">1962 کا آئین</tspan><tspan x="356.67" dy="24">صدارتی ڈھانچہ</tspan></text><rect class="panel" x="658.67" y="196" width="95.33" height="82" rx="8" /><rect class="panel" x="385.67" y="196" width="260.0" height="82" rx="8" /><rect class="accent" x="26.0" y="196" width="346.67" height="82" rx="8" /><text x="706.33" y="242" text-anchor="middle" class="label"><tspan x="706.33" dy="0">1969</tspan></text><text x="630.0" y="225" text-anchor="end" class="label"><tspan x="630.0" dy="0">1962 کا آئین</tspan><tspan x="630.0" dy="24">منسوخ</tspan></text><text x="356.67" y="225" text-anchor="end" class="label"><tspan x="356.67" dy="0">1972 عبوری آئین</tspan><tspan x="356.67" dy="24">1973 مستقل تصفیہ</tspan></text><rect class="panel" x="658.67" y="296" width="95.33" height="82" rx="8" /><rect class="panel" x="385.67" y="296" width="260.0" height="82" rx="8" /><rect class="accent" x="26.0" y="296" width="346.67" height="82" rx="8" /><text x="706.33" y="342" text-anchor="middle" class="label"><tspan x="706.33" dy="0">1977</tspan></text><text x="630.0" y="325" text-anchor="end" class="label"><tspan x="630.0" dy="0">1973 کا ڈھانچہ</tspan><tspan x="630.0" dy="24">معطل</tspan></text><text x="356.67" y="325" text-anchor="end" class="label"><tspan x="356.67" dy="0">1985 بحالی اور ترمیم</tspan><tspan x="356.67" dy="24">1988 جماعتی انتخابات</tspan></text><rect class="panel" x="658.67" y="396" width="95.33" height="82" rx="8" /><rect class="panel" x="385.67" y="396" width="260.0" height="82" rx="8" /><rect class="accent" x="26.0" y="396" width="346.67" height="82" rx="8" /><text x="706.33" y="442" text-anchor="middle" class="label"><tspan x="706.33" dy="0">1999</tspan></text><text x="630.0" y="425" text-anchor="end" class="label"><tspan x="630.0" dy="0">1973 کا ڈھانچہ</tspan><tspan x="630.0" dy="24">معطل</tspan></text><text x="356.67" y="425" text-anchor="end" class="label"><tspan x="356.67" dy="0">2002 منتخب اسمبلیاں</tspan><tspan x="356.67" dy="24">2008 سویلین منتقلی</tspan></text><text x="754.0" y="530" text-anchor="end" class="label"><tspan x="754.0" dy="0">تنسیخ آئینی ڈھانچے کو ختم کرتی ہے۔ التوا اس کے نفاذ کو عارضی طور پر روکتا ہے۔</tspan></text><text x="12" y="561" text-anchor="start" class="wm" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></svg>