<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Start-up budget and first-month income statement</title><desc id="d">Two tables for one tuition centre: a start-up budget totalling 50,000 rupees, and a first-month income statement showing revenue of 30,000, variable costs of 6,000, fixed costs of 20,000 and net income of 4,000 rupees.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="380"/><g id="layer-regions"><rect id="region-left-header" class="panel-a" x="24" y="56" width="360" height="40"/><rect id="region-left-total" class="panel-a" x="24" y="296" width="360" height="40"/><rect id="region-right-header" class="panel-a" x="396" y="56" width="360" height="40"/><rect id="region-right-net" class="panel-a" x="396" y="216" width="360" height="40"/><rect id="region-left-frame" class="frame" x="24" y="56" width="360" height="280"/><rect id="region-right-frame" class="frame" x="396" y="56" width="360" height="200"/></g><g id="layer-edges"><line class="grid" x1="24" y1="96" x2="384" y2="96"/><line class="grid" x1="24" y1="136" x2="384" y2="136"/><line class="grid" x1="24" y1="176" x2="384" y2="176"/><line class="grid" x1="24" y1="216" x2="384" y2="216"/><line class="grid" x1="24" y1="256" x2="384" y2="256"/><line class="grid" x1="24" y1="296" x2="384" y2="296"/><line class="grid" x1="280" y1="56" x2="280" y2="336"/><line class="grid" x1="396" y1="96" x2="756" y2="96"/><line class="grid" x1="396" y1="136" x2="756" y2="136"/><line class="grid" x1="396" y1="176" x2="756" y2="176"/><line class="grid" x1="396" y1="216" x2="756" y2="216"/><line class="grid" x1="652" y1="56" x2="652" y2="256"/></g><g id="layer-nodes"><g id="node-left-header"><text class="sh" x="36" y="82">Start-up budget (one-time)</text></g><g id="node-left-rows"><text class="body" x="36" y="122">Rent deposit and first month's rent</text><text class="body" x="372" y="122" text-anchor="end">16,000</text><text class="body" x="36" y="162">Furniture and a whiteboard</text><text class="body" x="372" y="162" text-anchor="end">20,000</text><text class="body" x="36" y="202">Books and printed worksheets</text><text class="body" x="372" y="202" text-anchor="end">8,000</text><text class="body" x="36" y="242">Fan and fittings</text><text class="body" x="372" y="242" text-anchor="end">4,000</text><text class="body" x="36" y="282">Registration</text><text class="body" x="372" y="282" text-anchor="end">2,000</text><text class="sh" x="36" y="322">Total start-up costs</text><text class="sh" x="372" y="322" text-anchor="end">50,000</text></g><g id="node-right-header"><text class="sh" x="408" y="82">First-month income statement</text></g><g id="node-right-rows"><text class="body" x="408" y="122">Revenue: 15 pupils at Rs 2,000</text><text class="body" x="744" y="122" text-anchor="end">30,000</text><text class="body" x="408" y="162">Variable costs: 15 at Rs 400</text><text class="body" x="744" y="162" text-anchor="end">6,000</text><text class="body" x="408" y="202">Fixed costs</text><text class="body" x="744" y="202" text-anchor="end">20,000</text><text class="sh" x="408" y="242">Net income</text><text class="sh" x="744" y="242" text-anchor="end">4,000</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Start-up budget and first-month income statement</text><text id="label-caption" class="small" x="24" y="364">Amounts in rupees. Net income is revenue minus variable and fixed costs.</text><text class="wm" x="768" y="368" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
