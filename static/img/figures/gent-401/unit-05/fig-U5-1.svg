<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Break-even chart for a tuition centre</title><desc id="d">Break-even chart for a tuition centre: fixed costs of 20,000 rupees a month, total costs rising by 400 rupees per pupil, and revenue rising by 2,000 rupees per pupil; the lines cross at 12.5 pupils and 25,000 rupees, so 13 pupils are needed to break even.</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.stroke-a { stroke: var(--a1); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.body { font-size: 14px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ah-a { fill: var(--a1); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"></g><g id="layer-edges"><line class="grid" x1="90" y1="110" x2="720" y2="110"/><line class="grid" x1="90" y1="197.5" x2="720" y2="197.5"/><line class="grid" x1="90" y1="285" x2="720" y2="285"/><line class="grid" x1="90" y1="372.5" x2="720" y2="372.5"/><line class="grid" x1="247.5" y1="80" x2="247.5" y2="460"/><line class="grid" x1="405" y1="80" x2="405" y2="460"/><line class="grid" x1="562.5" y1="80" x2="562.5" y2="460"/><line class="stroke" x1="90" y1="460" x2="720" y2="460" marker-end="url(#arrow)"/><line class="stroke" x1="90" y1="460" x2="90" y2="80" marker-end="url(#arrow)"/><line class="dash" x1="90" y1="285" x2="720" y2="285"/><line class="stroke-a" x1="90" y1="285" x2="720" y2="215"/><line class="stroke-a" x1="90" y1="460" x2="720" y2="110"/><line class="dash" x1="483.75" y1="241.25" x2="483.75" y2="460"/><line class="dash" x1="90" y1="241.25" x2="483.75" y2="241.25"/></g><g id="layer-nodes"><circle id="node-breakeven" class="panel-a" cx="483.75" cy="241.25" r="6"/><g id="node-axis-labels"><text class="small" x="90" y="478" text-anchor="middle">0</text><text class="small" x="247.5" y="478" text-anchor="middle">5</text><text class="small" x="405" y="478" text-anchor="middle">10</text><text class="small" x="562.5" y="478" text-anchor="middle">15</text><text class="small" x="720" y="478" text-anchor="middle">20</text><text class="small" x="82" y="464" text-anchor="end">0</text><text class="small" x="82" y="376.5" text-anchor="end">10,000</text><text class="small" x="82" y="289" text-anchor="end">20,000</text><text class="small" x="82" y="201.5" text-anchor="end">30,000</text><text class="small" x="82" y="114" text-anchor="end">40,000</text></g><g id="node-line-labels"><text class="small" x="110" y="303">Fixed costs (Rs 20,000)</text><text class="small" x="600" y="140" text-anchor="end">Revenue (Rs 2,000 per pupil)</text><text class="small" x="720" y="245" text-anchor="end">Total costs</text><text class="body" x="498" y="268">Break-even: 13 pupils</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Break-even chart for a tuition centre</text><text id="label-y" class="small" x="90" y="60">rupees per month</text><text id="label-x" class="small" x="405" y="502" text-anchor="middle">pupils per month</text><text id="label-caption" class="small" x="24" y="520">Dashed lines mark the break-even point.</text><text class="wm" x="768" y="520" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
