<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سرمایہ کاری کے پانچ ذرائع کا موازنہ</title><desc id="d">جدول جس میں سرمایہ کاری کے پانچ ذرائع کا موازنہ کیا گیا ہے: بوٹ اسٹریپنگ، بینک قرض، اینجل سرمایہ کار، وینچر کیپیٹل اور کراؤڈ فنڈنگ، بلحاظ فراہم کنندہ، قربانی اور موزوں ترین حالات۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-frame" class="frame" x="24" y="56" width="732" height="400"/></g><g id="layer-edges"><line class="grid" x1="24" y1="96" x2="756" y2="96"/><line class="grid" x1="24" y1="168" x2="756" y2="168"/><line class="grid" x1="24" y1="240" x2="756" y2="240"/><line class="grid" x1="24" y1="312" x2="756" y2="312"/><line class="grid" x1="24" y1="384" x2="756" y2="384"/><line class="grid" x1="24" y1="456" x2="756" y2="456"/><line class="grid" x1="626" y1="56" x2="626" y2="456"/><line class="grid" x1="446" y1="56" x2="446" y2="456"/><line class="grid" x1="256" y1="56" x2="256" y2="456"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="82" text-anchor="end">ذریعہ</text><text class="sh" x="614" y="82" text-anchor="end">یہ کون فراہم کرتا ہے</text><text class="sh" x="434" y="82" text-anchor="end">آپ کیا قربان کرتے ہیں</text><text class="sh" x="244" y="82" text-anchor="end">بہترین استعمال کب ہے</text></g><g id="node-row1"><text class="cell" x="744" y="122" text-anchor="end">بوٹ اسٹریپنگ</text><text class="cell" x="614" y="122" text-anchor="end">بانی کی ذاتی بچت اور</text><text class="cell" x="614" y="139" text-anchor="end">ابتدائی آمدنی</text><text class="cell" x="434" y="122" text-anchor="end">کچھ نہیں، لیکن ترقی</text><text class="cell" x="434" y="139" text-anchor="end">دھیمی ہوتی ہے</text><text class="cell" x="244" y="122" text-anchor="end">چھوٹا منصوبہ جو کم</text><text class="cell" x="244" y="139" text-anchor="end">وسائل سے شروع ہو سکے</text></g><g id="node-row2"><text class="cell" x="744" y="194" text-anchor="end">بینک قرض</text><text class="cell" x="614" y="194" text-anchor="end">بینک یا کوئی دوسرا</text><text class="cell" x="614" y="211" text-anchor="end">قرض دہندہ ادارہ</text><text class="cell" x="434" y="194" text-anchor="end">سود اور باقاعدہ قسطیں،</text><text class="cell" x="434" y="211" text-anchor="end">اکثر ضمانت (رہن)</text><text class="cell" x="244" y="194" text-anchor="end">منصوبہ واضح ہو اور</text><text class="cell" x="244" y="211" text-anchor="end">واپسی کی صلاحیت ہو</text></g><g id="node-row3"><text class="cell" x="744" y="266" text-anchor="end">اینجل سرمایہ کار</text><text class="cell" x="614" y="266" text-anchor="end">کوئی باوسائل نجی</text><text class="cell" x="614" y="283" text-anchor="end">فرد</text><text class="cell" x="434" y="266" text-anchor="end">جزوی ملکیت، مشورے اور</text><text class="cell" x="434" y="283" text-anchor="end">مشترکہ فیصلے</text><text class="cell" x="244" y="266" text-anchor="end">منصوبہ ابتدائی ہو اور اسے</text><text class="cell" x="244" y="283" text-anchor="end">رقم و رہنمائی چاہیے ہو</text></g><g id="node-row4"><text class="cell" x="744" y="338" text-anchor="end">وینچر کیپیٹل</text><text class="cell" x="614" y="338" text-anchor="end">سرمایہ کاری کا ماہر</text><text class="cell" x="614" y="355" text-anchor="end">ادارہ یا گروپ</text><text class="cell" x="434" y="338" text-anchor="end">جزوی ملکیت اور تیز رفتار</text><text class="cell" x="434" y="355" text-anchor="end">ترقی کا دباؤ</text><text class="cell" x="244" y="338" text-anchor="end">منصوبہ تیزی اور بڑے</text><text class="cell" x="244" y="355" text-anchor="end">پیمانے پر پھیل سکے</text></g><g id="node-row5"><text class="cell" x="744" y="410" text-anchor="end">کراؤڈ فنڈنگ</text><text class="cell" x="614" y="410" text-anchor="end">بہت سے لوگ، عام طور</text><text class="cell" x="614" y="427" text-anchor="end">پر انٹرنیٹ کے ذریعے</text><text class="cell" x="434" y="410" text-anchor="end">وقت، مہم، اور عام طور</text><text class="cell" x="434" y="427" text-anchor="end">پر انعامات یا حصے</text><text class="cell" x="244" y="410" text-anchor="end">منصوبے کا مضبوط مقصد</text><text class="cell" x="244" y="427" text-anchor="end">اور وسیع رابطہ نیٹ ورک ہو</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">سرمایہ کاری کے پانچ ذرائع کا موازنہ</text><text id="label-caption" class="small" x="756" y="470" text-anchor="end">اس جدول کو فلو چارٹ کے ساتھ پڑھیں: انتخاب کا دارومدار رقم، کنٹرول اور رفتار پر ہے۔</text><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>