<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart for choosing a funding source</title><desc id="d">Flowchart for choosing a funding source: start small from savings leads to bootstrapping; otherwise, unwillingness to give up ownership leads to a loan, willingness leads to venture capital if fast growth is needed and to an angel investor or crowdfunding if it is not.</desc><style>
:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-start-d1" class="stroke" x1="390" y1="80" x2="390" y2="110" marker-end="url(#arrow)"/><line id="edge-d1-bootstrapping" class="stroke" x1="240" y1="165" x2="190" y2="165" marker-end="url(#arrow)"/><line id="edge-d1-d2" class="stroke" x1="390" y1="220" x2="390" y2="275" marker-end="url(#arrow)"/><line id="edge-d2-debt" class="stroke" x1="240" y1="330" x2="190" y2="330" marker-end="url(#arrow)"/><line id="edge-d2-d3" class="stroke" x1="390" y1="385" x2="390" y2="425" marker-end="url(#arrow)"/><line id="edge-d3-vc" class="stroke" x1="240" y1="480" x2="190" y2="480" marker-end="url(#arrow)"/><line id="edge-d3-angel" class="stroke" x1="540" y1="480" x2="590" y2="480" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-start"><rect class="panel-a" x="270" y="50" width="240" height="50" rx="25"/><text class="body" x="390" y="81" text-anchor="middle">How much money is needed?</text></g><g id="node-d1"><polygon class="panel" points="390,110 540,165 390,220 240,165"/><text class="body" x="390" y="156" text-anchor="middle">Can it start small from</text><text class="body" x="390" y="173" text-anchor="middle">the founder's own savings</text><text class="body" x="390" y="190" text-anchor="middle">and low costs?</text></g><g id="node-d2"><polygon class="panel" points="390,275 540,330 390,385 240,330"/><text class="body" x="390" y="321" text-anchor="middle">Is the founder willing</text><text class="body" x="390" y="338" text-anchor="middle">to give up part</text><text class="body" x="390" y="355" text-anchor="middle">ownership?</text></g><g id="node-d3"><polygon class="panel" points="390,425 540,480 390,535 240,480"/><text class="body" x="390" y="473" text-anchor="middle">Does it need fast,</text><text class="body" x="390" y="490" text-anchor="middle">large-scale growth?</text></g><g id="node-bootstrapping"><rect class="panel" x="24" y="115" width="166" height="110" rx="8"/><text class="body" x="36" y="152">Bootstrapping:</text><text class="body" x="36" y="174">keep control,</text><text class="body" x="36" y="196">grow slowly</text></g><g id="node-debt"><rect class="panel" x="24" y="280" width="166" height="110" rx="8"/><text class="body" x="36" y="317">Debt: a bank or</text><text class="body" x="36" y="339">family loan,</text><text class="body" x="36" y="361">repay with interest</text></g><g id="node-vc"><rect class="panel" x="24" y="430" width="166" height="110" rx="8"/><text class="body" x="36" y="467">Venture capital:</text><text class="body" x="36" y="489">equity for high-</text><text class="body" x="36" y="511">growth ventures</text></g><g id="node-angel"><rect class="panel" x="590" y="430" width="166" height="110" rx="8"/><text class="body" x="602" y="467">Angel investor or</text><text class="body" x="602" y="489">crowdfunding:</text><text class="body" x="602" y="511">equity or rewards</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Choosing a funding source</text><text id="label-yes-1" class="small" x="215" y="156" text-anchor="middle">yes</text><text id="label-no-1" class="small" x="402" y="252">no</text><text id="label-no-2" class="small" x="215" y="321" text-anchor="middle">no</text><text id="label-yes-2" class="small" x="402" y="410">yes</text><text id="label-yes-3" class="small" x="215" y="471" text-anchor="middle">yes</text><text id="label-no-3" class="small" x="565" y="471" text-anchor="middle">no</text><text id="label-caption" class="small" x="390" y="590" text-anchor="middle">Many ventures mix several sources.</text><text class="wm" x="768" y="612" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
