<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing five funding sources</title><desc id="d">Table comparing five funding sources - bootstrapping, a bank loan, an angel investor, venture capital and crowdfunding - by who provides the money, what the founder gives up and when each fits best.</desc><style>
:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-frame" class="frame" x="24" y="56" width="732" height="400"/></g><g id="layer-edges"><line class="grid" x1="24" y1="96" x2="756" y2="96"/><line class="grid" x1="24" y1="168" x2="756" y2="168"/><line class="grid" x1="24" y1="240" x2="756" y2="240"/><line class="grid" x1="24" y1="312" x2="756" y2="312"/><line class="grid" x1="24" y1="384" x2="756" y2="384"/><line class="grid" x1="24" y1="456" x2="756" y2="456"/><line class="grid" x1="154" y1="56" x2="154" y2="456"/><line class="grid" x1="334" y1="56" x2="334" y2="456"/><line class="grid" x1="524" y1="56" x2="524" y2="456"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Funding source</text><text class="sh" x="166" y="82">Who provides it</text><text class="sh" x="346" y="82">What you give up</text><text class="sh" x="536" y="82">Best when</text></g><g id="node-row1"><text class="cell" x="36" y="122">Bootstrapping</text><text class="cell" x="166" y="122">The founder's own</text><text class="cell" x="166" y="139">savings and early</text><text class="cell" x="166" y="156">income</text><text class="cell" x="346" y="122">Nothing, but</text><text class="cell" x="346" y="139">growth is slow</text><text class="cell" x="536" y="122">A small venture</text><text class="cell" x="536" y="139">that can start small</text></g><g id="node-row2"><text class="cell" x="36" y="194">Bank loan</text><text class="cell" x="166" y="194">A bank or</text><text class="cell" x="166" y="211">another lender</text><text class="cell" x="346" y="194">Interest and regular</text><text class="cell" x="346" y="211">repayment, often</text><text class="cell" x="346" y="228">collateral</text><text class="cell" x="536" y="194">The venture has a</text><text class="cell" x="536" y="211">plan and can repay</text></g><g id="node-row3"><text class="cell" x="36" y="266">Angel investor</text><text class="cell" x="166" y="266">A wealthy private</text><text class="cell" x="166" y="283">individual</text><text class="cell" x="346" y="266">Part ownership,</text><text class="cell" x="346" y="283">advice and shared</text><text class="cell" x="346" y="300">control</text><text class="cell" x="536" y="266">The venture is early</text><text class="cell" x="536" y="283">and needs money</text><text class="cell" x="536" y="300">and guidance</text></g><g id="node-row4"><text class="cell" x="36" y="338">Venture capital</text><text class="cell" x="166" y="338">A specialist</text><text class="cell" x="166" y="355">investment group</text><text class="cell" x="346" y="338">Part ownership and</text><text class="cell" x="346" y="355">pressure for fast</text><text class="cell" x="346" y="372">growth</text><text class="cell" x="536" y="338">The venture can</text><text class="cell" x="536" y="355">grow large and</text><text class="cell" x="536" y="372">quickly</text></g><g id="node-row5"><text class="cell" x="36" y="410">Crowdfunding</text><text class="cell" x="166" y="410">Many people,</text><text class="cell" x="166" y="427">usually online</text><text class="cell" x="346" y="410">Time, a campaign,</text><text class="cell" x="346" y="427">and usually rewards</text><text class="cell" x="346" y="444">or equity</text><text class="cell" x="536" y="410">The venture has a</text><text class="cell" x="536" y="427">story and a network</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="32">Five funding sources compared</text><text id="label-caption" class="small" x="24" y="470">Read the table with the flowchart: the choice depends on amount, control and growth.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
