<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سرمایہ کاری کا ذریعہ منتخب کرنا</title><desc id="d">سرمایہ کاری کے انتخاب کا فلو چارٹ: ذاتی بچت سے چھوٹے پیمانے پر شروعات بوٹ اسٹریپنگ کی طرف لے جاتی ہے؛ بصورتِ دیگر، ملکیت نہ چھوڑنے کی صورت میں قرض، جبکہ تیز رفتار ترقی کے لیے وینچر کیپیٹل اور عام رفتار کے لیے اینجل انویسٹر یا کراؤڈ فنڈنگ مناسب ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-start-d1" class="stroke" x1="390" y1="80" x2="390" y2="110" marker-end="url(#arrow)"/><line id="edge-d1-bootstrapping" class="stroke" x1="540" y1="165" x2="590" y2="165" marker-end="url(#arrow)"/><line id="edge-d1-d2" class="stroke" x1="390" y1="220" x2="390" y2="275" marker-end="url(#arrow)"/><line id="edge-d2-debt" class="stroke" x1="540" y1="330" x2="590" y2="330" marker-end="url(#arrow)"/><line id="edge-d2-d3" class="stroke" x1="390" y1="385" x2="390" y2="425" marker-end="url(#arrow)"/><line id="edge-d3-vc" class="stroke" x1="540" y1="480" x2="590" y2="480" marker-end="url(#arrow)"/><line id="edge-d3-angel" class="stroke" x1="240" y1="480" x2="190" y2="480" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-start"><rect class="panel-a" x="270" y="50" width="240" height="50" rx="25"/><text class="body" x="390" y="81" text-anchor="middle">کتنی رقم درکار ہے؟</text></g><g id="node-d1"><polygon class="panel" points="390,110 540,165 390,220 240,165"/><text class="body" x="390" y="156" text-anchor="middle">کیا بانی کی ذاتی بچت اور کم</text><text class="body" x="390" y="173" text-anchor="middle">اخراجات سے چھوٹے پیمانے پر</text><text class="body" x="390" y="190" text-anchor="middle">شروعات ممکن ہے؟</text></g><g id="node-d2"><polygon class="panel" points="390,275 540,330 390,385 240,330"/><text class="body" x="390" y="321" text-anchor="middle">کیا بانی کاروبار میں</text><text class="body" x="390" y="338" text-anchor="middle">ملکیت کا کچھ حصہ</text><text class="body" x="390" y="355" text-anchor="middle">چھوڑنے پر تیار ہے؟</text></g><g id="node-d3"><polygon class="panel" points="390,425 540,480 390,535 240,480"/><text class="body" x="390" y="473" text-anchor="middle">کیا منصوبے کو تیز رفتار</text><text class="body" x="390" y="490" text-anchor="middle">اور بڑے پیمانے پر</text><text class="body" x="390" y="507" text-anchor="middle">ترقی کی ضرورت ہے؟</text></g><g id="node-bootstrapping"><rect class="panel" x="590" y="115" width="166" height="110" rx="8"/><text class="body" x="744" y="152" text-anchor="end">بوٹ اسٹریپنگ:</text><text class="body" x="744" y="174" text-anchor="end">کنٹرول اپنے پاس،</text><text class="body" x="744" y="196" text-anchor="end">دھیمی رفتار سے ترقی</text></g><g id="node-debt"><rect class="panel" x="590" y="280" width="166" height="110" rx="8"/><text class="body" x="744" y="317" text-anchor="end">قرض: بینک یا</text><text class="body" x="744" y="339" text-anchor="end">خاندانی قرض،</text><text class="body" x="744" y="361" text-anchor="end">سود سمیت واپسی</text></g><g id="node-vc"><rect class="panel" x="590" y="430" width="166" height="110" rx="8"/><text class="body" x="744" y="467" text-anchor="end">وینچر کیپیٹل:</text><text class="body" x="744" y="489" text-anchor="end">تیز رفتار ترقی کے لیے</text><text class="body" x="744" y="511" text-anchor="end">حصہ داری (ایکویٹی)</text></g><g id="node-angel"><rect class="panel" x="24" y="430" width="166" height="110" rx="8"/><text class="body" x="178" y="467" text-anchor="end">اینجل سرمایہ کار یا</text><text class="body" x="178" y="489" text-anchor="end">کراؤڈ فنڈنگ:</text><text class="body" x="178" y="511" text-anchor="end">ایکویٹی یا انعامات</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">سرمایہ کاری کا ذریعہ منتخب کرنا</text><text id="label-yes-1" class="small" x="565" y="156" text-anchor="middle">ہاں</text><text id="label-no-1" class="small" x="402" y="252">نہیں</text><text id="label-no-2" class="small" x="565" y="321" text-anchor="middle">نہیں</text><text id="label-yes-2" class="small" x="402" y="410">ہاں</text><text id="label-yes-3" class="small" x="565" y="471" text-anchor="middle">ہاں</text><text id="label-no-3" class="small" x="215" y="471" text-anchor="middle">نہیں</text><text id="label-caption" class="small" x="390" y="590" text-anchor="middle">بہت سے کاروباری منصوبے متعدد ذرائع کو یکجا کرتے ہیں۔</text><text class="wm" x="12" y="612" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>