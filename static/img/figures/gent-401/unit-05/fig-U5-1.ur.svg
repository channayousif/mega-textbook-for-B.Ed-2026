<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ٹیوشن سینٹر کے لیے بریک ایوین چارٹ</title><desc id="d">ٹیوشن سینٹر کے لیے بریک ایوین چارٹ: ماہانہ مقررہ اخراجات ۲۰،۰۰۰ روپے، فی طالب علم ۴۰۰ روپے سے بڑھتے ہوئے کل اخراجات، اور فی طالب علم ۲،۰۰۰ روپے سے بڑھتی ہوئی آمدنی؛ دونوں لکیریں ۱۳ طلبہ پر ملتی ہیں جہاں آمدنی اخراجات کو بالکل پورا کرتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.stroke-a { stroke: var(--a1); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.body { font-size: 14px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ah-a { fill: var(--a1); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"></g><g id="layer-edges"><line class="grid" x1="90" y1="110" x2="720" y2="110"/><line class="grid" x1="90" y1="197.5" x2="720" y2="197.5"/><line class="grid" x1="90" y1="285" x2="720" y2="285"/><line class="grid" x1="90" y1="372.5" x2="720" y2="372.5"/><line class="grid" x1="247.5" y1="80" x2="247.5" y2="460"/><line class="grid" x1="405" y1="80" x2="405" y2="460"/><line class="grid" x1="562.5" y1="80" x2="562.5" y2="460"/><line class="stroke" x1="90" y1="460" x2="720" y2="460" marker-end="url(#arrow)"/><line class="stroke" x1="90" y1="460" x2="90" y2="80" marker-end="url(#arrow)"/><line class="dash" x1="90" y1="270" x2="720" y2="270"/><line class="stroke-a" x1="90" y1="270" x2="720" y2="194"/><line class="stroke-a" x1="90" y1="460" x2="720" y2="80"/><line class="dash" x1="484" y1="222" x2="484" y2="460"/><line class="dash" x1="90" y1="222" x2="484" y2="222"/></g><g id="layer-nodes"><circle id="node-breakeven" class="panel-a" cx="484" cy="222" r="6"/><g id="node-axis-labels"><text class="small" x="90" y="478" text-anchor="middle">0</text><text class="small" x="247.5" y="478" text-anchor="middle">5</text><text class="small" x="405" y="478" text-anchor="middle">10</text><text class="small" x="562.5" y="478" text-anchor="middle">15</text><text class="small" x="720" y="478" text-anchor="middle">20</text><text class="small" x="82" y="464" text-anchor="end">0</text><text class="small" x="82" y="376.5" text-anchor="end">10,000</text><text class="small" x="82" y="289" text-anchor="end">20,000</text><text class="small" x="82" y="201.5" text-anchor="end">30,000</text><text class="small" x="82" y="114" text-anchor="end">40,000</text></g><g id="node-line-labels"><text class="small" x="110" y="262">مقررہ اخراجات (20,000 روپے)</text><text class="small" x="720" y="150" text-anchor="end">آمدنی (2,000 روپے فی طالب علم)</text><text class="small" x="650" y="190" text-anchor="end">کل اخراجات</text><text class="body" x="498" y="248">بریک ایوین: 13 طلبہ</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">ٹیوشن سینٹر کے لیے بریک ایوین چارٹ</text><text id="label-y" class="small" x="90" y="60">ماہانہ روپے</text><text id="label-x" class="small" x="405" y="502" text-anchor="middle">طلبہ فی ماہ</text><text id="label-caption" class="small" x="756" y="520" text-anchor="end">نقطہ دار لکیریں بریک ایوین پوائنٹ کو ظاہر کرتی ہیں۔</text><text class="wm" x="12" y="520" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>