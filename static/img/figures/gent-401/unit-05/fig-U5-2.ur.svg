<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ابتدائی بجٹ اور پہلے مہینے کا انکم اسٹیٹمنٹ</title><desc id="d">ایک ٹیوشن سینٹر کے دو گوشوارے: ابتدائی بجٹ کل ۵۰،۰۰۰ روپے، اور پہلے مہینے کا انکم اسٹیٹمنٹ جس میں آمدنی ۳۰،۰۰۰ روپے، متغیر اخراجات ۶،۰۰۰ روپے، مقررہ اخراجات ۲۰،۰۰۰ روپے اور خالص منافع ۴،۰۰۰ روپے ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
