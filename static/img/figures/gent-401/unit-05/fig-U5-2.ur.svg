x="408" y="242" text-anchor="start">4,000</text><text class="body" x="744" y="282" text-anchor="end">رجسٹریشن</text><text class="body" x="408" y="282" text-anchor="start">2,000</text><text class="sh" x="744" y="322" text-anchor="end">کل ابتدائی اخراجات</text><text class="sh" x="408" y="322" text-anchor="start">50,000</text></g><g id="node-left-header"><text class="sh" x="372" y="82" text-anchor="end">پہلے مہینے کا انکم اسٹیٹمنٹ</text></g><g id="node-left-rows"><text class="body" x="372" y="122" text-anchor="end">آمدنی: 15 طلبہ ضرب 2,000 روپے</text><text class="body" x="36" y="122" text-anchor="start">30,000</text><text class="body" x="372" y="162" text-anchor="end">متغیر اخراجات: 15 ضرب 400 روپے</text><text class="body" x="36" y="162" text-anchor="start">6,000</text><text class="body" x="372" y="202" text-anchor="end">مقررہ اخراجات</text><text class="body" x="36" y="202" text-anchor="start">20,000</text><text class="sh" x="372" y="242" text-anchor="end">خالص آمدنی (منافع)</text><text class="sh" x="36" y="242" text-anchor="start">4,000</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="32" text-anchor="end">ابتدائی بجٹ اور پہلے مہینے کا انکم اسٹیٹمنٹ</text><text id="label-caption" class="small" x="756" y="364" text-anchor="end">رقم روپوں میں ہے۔ خالص آمدنی سے مراد آمدنی منہا متغیر اور مقررہ اخراجات ہے۔</text><text class="wm" x="12" y="368" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>