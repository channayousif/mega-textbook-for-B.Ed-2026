<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Market positioning map of educational ventures</title><desc id="d">A two-axis market positioning map plotting four educational ventures by price and quality to demonstrate strategic market space.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><g id="layer-regions"><rect id="region-quad-topleft" class="panel-a" x="65" y="70" width="325" height="210" rx="6" opacity="0.4"/><rect id="region-quad-topright" class="panel-b" x="390" y="70" width="325" height="210" rx="6" opacity="0.3"/><rect id="region-quad-botleft" class="panel" x="65" y="280" width="325" height="210" rx="6" opacity="0.4"/><rect id="region-quad-botright" class="panel" x="390" y="280" width="325" height="210" rx="6" opacity="0.25"/></g><g id="layer-edges"><line id="edge-axis-x" class="stroke" x1="60" y1="280" x2="720" y2="280" marker-end="url(#arrow)"/><line id="edge-axis-y" class="stroke" x1="390" y1="500" x2="390" y2="60" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-stem-kit"><rect class="panel-a" x="90" y="115" width="240" height="85" rx="8"/><text class="sh" x="105" y="142">Hands-on STEM Kit</text><text class="cell" x="105" y="165">Affordable, high practical value</text><text class="cell" x="105" y="184">Direct curriculum alignment</text></g><g id="node-academy-chain"><rect class="panel-b" x="430" y="115" width="240" height="85" rx="8"/><text class="sh" x="445" y="142">Commercial Academy</text><text class="cell" x="445" y="165">High fee, extensive drills</text><text class="cell" x="445" y="184">Rigid exam focus</text></g><g id="node-street-photocopy"><rect class="panel" x="90" y="340" width="240" height="85" rx="8"/><text class="sh" x="105" y="367">Street Photocopier</text><text class="cell" x="105" y="390">Very low cost, low quality</text><text class="cell" x="105" y="409">Blurry notes, errors</text></g><g id="node-overpriced-tutor"><rect class="panel" x="430" y="340" width="240" height="85" rx="8"/><text class="sh" x="445" y="367">Unverified Tutor</text><text class="cell" x="445" y="390">High fee, basic lecture</text><text class="cell" x="445" y="409">Poor student outcomes</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Market positioning map for educational ventures</text><text id="label-y-high" class="sh" x="405" y="85">High quality</text><text id="label-y-low" class="sh" x="405" y="480">Low quality</text><text id="label-x-low" class="sh" x="75" y="265">Low price</text><text id="label-x-high" class="sh" x="625" y="265">High price</text><text id="label-opp" class="sh" x="90" y="98" fill="var(--a1)">Opportunity: high quality, fair price</text><text id="label-caption" class="small" x="24" y="555">Positioning maps plot customer criteria to reveal market gaps and differentiate a new enterprise.</text><text class="wm" x="768" y="575" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>