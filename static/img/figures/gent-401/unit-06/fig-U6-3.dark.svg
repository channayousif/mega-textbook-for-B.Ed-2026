<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Process of company registration in Pakistan with SECP</title><desc id="d">A vertical process flowchart showing the sequential steps for company incorporation in Pakistan through SECP's digital eZfile system.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-step1-step2" class="stroke" x1="390" y1="125" x2="390" y2="155" marker-end="url(#arrow)"/><line id="edge-step2-step3" class="stroke" x1="390" y1="220" x2="390" y2="250" marker-end="url(#arrow)"/><line id="edge-step3-scrutiny" class="stroke" x1="390" y1="315" x2="390" y2="345" marker-end="url(#arrow)"/><line id="edge-scrutiny-yes" class="stroke" x1="390" y1="420" x2="390" y2="470" marker-end="url(#arrow)"/><path id="edge-scrutiny-no" class="dash" d="M 570 385 L 670 385 L 670 285 L 565 285" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-step1"><rect class="panel" x="220" y="65" width="340" height="60" rx="8"/><text class="sh" x="235" y="89">Step 1: Reserve Company Name</text><text class="cell" x="235" y="110">Online availability check via SECP eZfile</text></g><g id="node-step2"><rect class="panel" x="220" y="160" width="340" height="60" rx="8"/><text class="sh" x="235" y="184">Step 2: Draft Constitutive Documents</text><text class="cell" x="235" y="205">Memorandum and Articles of Association</text></g><g id="node-step3"><rect class="panel" x="220" y="255" width="340" height="60" rx="8"/><text class="sh" x="235" y="279">Step 3: Online Submission &amp; Fee</text><text class="cell" x="235" y="300">Upload founder CNICs and pay statutory fee</text></g><g id="node-scrutiny"><polygon class="panel-b" points="390,350 570,385 390,420 210,385"/><text class="sh" x="390" y="380" text-anchor="middle">Compliance Scrutiny by SECP</text><text class="cell" x="390" y="398" text-anchor="middle">Do documents meet legal standards?</text></g><g id="node-incorporation"><rect class="panel-a" x="190" y="475" width="400" height="70" rx="8"/><text class="sh" x="390" y="501" text-anchor="middle">Certificate of Incorporation Issued</text><text class="cell" x="390" y="523" text-anchor="middle">Unique CUIN assigned; separate legal personality created</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Company registration process in Pakistan (SECP eZfile)</text><text id="label-yes" class="sh" x="400" y="448">Yes: approved</text><text id="label-no" class="sh" x="585" y="375">No: fix errors</text><text id="label-resubmit" class="small" x="585" y="300">Resubmit forms</text><text id="label-caption" class="small" x="24" y="595">Incorporation under Companies Act 2017 establishes limited liability.</text><text class="wm" x="768" y="605" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>