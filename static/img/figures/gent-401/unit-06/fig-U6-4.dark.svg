<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Branches of intellectual property under IPO-Pakistan</title><desc id="d">Table detailing four types of intellectual property under IPO-Pakistan: trademark, copyright, patent, and industrial design with legal scope and practical examples.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><rect id="region-table" class="panel" x="24" y="65" width="732" height="385" rx="6"/><rect id="region-header" class="panel-a" x="24" y="65" width="732" height="45" rx="6"/></g><g id="layer-edges"><line id="edge-h1" class="grid" x1="24" y1="110" x2="756" y2="110"/><line id="edge-h2" class="grid" x1="24" y1="195" x2="756" y2="195"/><line id="edge-h3" class="grid" x1="24" y1="280" x2="756" y2="280"/><line id="edge-h4" class="grid" x1="24" y1="365" x2="756" y2="365"/><line id="edge-v1" class="grid" x1="134" y1="65" x2="134" y2="450"/><line id="edge-v2" class="grid" x1="324" y1="65" x2="324" y2="450"/><line id="edge-v3" class="grid" x1="454" y1="65" x2="454" y2="450"/></g><g id="layer-nodes"><g id="node-r0"><text class="sh" x="36" y="93">Type of IP</text><text class="sh" x="146" y="93">What It Protects</text><text class="sh" x="336" y="93">Governing Law</text><text class="sh" x="466" y="93">Classroom Example</text></g><g id="node-r1"><text class="sh" x="36" y="138">Trademark</text><text class="cell" x="146" y="138">Distinguishing names,</text><text class="cell" x="146" y="157">logos, slogans and</text><text class="cell" x="146" y="176">commercial symbols</text><text class="cell" x="336" y="138">Trade Marks</text><text class="cell" x="336" y="157">Ordinance, 2001</text><text class="cell" x="336" y="176">(renewable 10 yrs)</text><text class="cell" x="466" y="138">Unique brand name and logo for</text><text class="cell" x="466" y="157">an educational publishing house</text><text class="cell" x="466" y="176">or teacher training academy</text></g><g id="node-r2"><text class="sh" x="36" y="223">Copyright</text><text class="cell" x="146" y="223">Original written text,</text><text class="cell" x="146" y="242">illustrations, software,</text><text class="cell" x="146" y="261">and teaching manuals</text><text class="cell" x="336" y="223">Copyright</text><text class="cell" x="336" y="242">Ordinance, 1962</text><text class="cell" x="336" y="261">(life + 50 years)</text><text class="cell" x="466" y="223">Original written text in a</text><text class="cell" x="466" y="242">Sindhi geometry workbook or</text><text class="cell" x="466" y="261">lesson demonstration video</text></g><g id="node-r3"><text class="sh" x="36" y="308">Patent</text><text class="cell" x="146" y="308">New, inventive,</text><text class="cell" x="146" y="327">non-obvious functional</text><text class="cell" x="146" y="346">technical solutions</text><text class="cell" x="336" y="308">Patents</text><text class="cell" x="336" y="327">Ordinance, 2000</text><text class="cell" x="336" y="346">(20 years term)</text><text class="cell" x="466" y="308">Novel mechanical paper-binding</text><text class="cell" x="466" y="327">tool invented to bind student</text><text class="cell" x="466" y="346">workbooks at half normal cost</text></g><g id="node-r4"><text class="sh" x="36" y="393">Industrial</text><text class="sh" x="36" y="412">Design</text><text class="cell" x="146" y="393">Unique visual shape,</text><text class="cell" x="146" y="412">ergonomic pattern, or</text><text class="cell" x="146" y="431">surface appearance</text><text class="cell" x="336" y="393">Registered Designs</text><text class="cell" x="336" y="412">Ordinance, 2000</text><text class="cell" x="336" y="431">(up to 20 years)</text><text class="cell" x="466" y="393">The distinctive ergonomic</text><text class="cell" x="466" y="412">curved plastic shape of a</text><text class="cell" x="466" y="431">classroom desk and chair</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="36">Four branches of intellectual property under IPO-Pakistan</text><text id="label-caption" class="small" x="24" y="475">Intellectual property protects expressions, symbols, and novel inventions.</text><text class="wm" x="768" y="485" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>