<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی کاروباری منصوبوں کا مارکیٹ پوزیشننگ نقشہ</title><desc id="d">ایک دو محوری مارکیٹ پوزیشننگ نقشہ جو چار تعلیمی کاروباری منصوبوں کو قیمت اور معیار کے لحاظ سے دکھاتا ہے، تاکہ مارکیٹ میں سوچی سمجھی حکمت عملی کے تحت خالی جگہ واضح ہو۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><g id="layer-regions"><rect id="region-quad-topleft" class="panel-a" x="390" y="70" width="325" height="210" rx="6" opacity="0.4"/><rect id="region-quad-topright" class="panel-b" x="65" y="70" width="325" height="210" rx="6" opacity="0.3"/><rect id="region-quad-botleft" class="panel" x="390" y="280" width="325" height="210" rx="6" opacity="0.4"/><rect id="region-quad-botright" class="panel" x="65" y="280" width="325" height="210" rx="6" opacity="0.25"/></g><g id="layer-edges"><line id="edge-axis-x" class="stroke" x1="720" y1="280" x2="60" y2="280" marker-end="url(#arrow)"/><line id="edge-axis-y" class="stroke" x1="390" y1="500" x2="390" y2="60" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-stem-kit"><rect class="panel-a" x="270" y="115" width="240" height="85" rx="8"/><text class="sh" x="495" y="142" text-anchor="end">‫عملی سائنس کٹ‬</text><text class="cell" x="495" y="165" text-anchor="end">‫درمیانہ قیمت، اعلیٰ معیار‬</text><text class="cell" x="495" y="184" text-anchor="end">‫نصاب سے ہم آہنگ، دوبارہ قابلِ استعمال‬</text></g><g id="node-academy-chain"><rect class="panel-b" x="65" y="150" width="190" height="85" rx="8"/><text class="sh" x="240" y="177" text-anchor="end">‫اکیڈمیوں کا سلسلہ‬</text><text class="cell" x="240" y="200" text-anchor="end">‫بہت زیادہ فیس‬</text><text class="cell" x="240" y="219" text-anchor="end">‫امتحان کی سخت مشقیں‬</text></g><g id="node-street-photocopy"><rect class="panel" x="460" y="385" width="240" height="85" rx="8"/><text class="sh" x="685" y="412" text-anchor="end">‫سڑک کنارے فوٹو کاپی والا‬</text><text class="cell" x="685" y="435" text-anchor="end">‫بہت کم قیمت اور معیار‬</text><text class="cell" x="685" y="454" text-anchor="end">‫دھندلے نوٹس، غلطیاں‬</text></g><g id="node-bookstore"><rect class="panel" x="270" y="238" width="240" height="85" rx="8"/><text class="sh" x="495" y="265" text-anchor="end">‫عام درسی کتب کی دکان‬</text><text class="cell" x="495" y="288" text-anchor="end">‫درمیانہ قیمت اور معیار‬</text><text class="cell" x="495" y="307" text-anchor="end">‫سرکاری درسی کتب‬</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‫تعلیمی کاروباری منصوبوں کا مارکیٹ پوزیشننگ نقشہ‬</text><text id="label-y-high" class="sh" x="375" y="85" text-anchor="end">‫اعلیٰ معیار‬</text><text id="label-y-low" class="sh" x="375" y="480" text-anchor="end">‫کم معیار‬</text><text id="label-x-low" class="sh" x="705" y="265" text-anchor="end">‫کم قیمت‬</text><text id="label-x-high" class="sh" x="155" y="265" text-anchor="end">‫زیادہ قیمت‬</text><text id="label-opp" class="sh" x="690" y="98" fill="var(--a1)" text-anchor="end">‫موقع: اعلیٰ معیار، مناسب قیمت‬</text><text id="label-caption" class="small" x="756" y="555" text-anchor="end">‫پوزیشننگ نقشے گاہک کی کسوٹیوں کو دکھا کر مارکیٹ کے خلا ظاہر کرتے ہیں اور نئے ادارے کو منفرد بناتے ہیں۔‬</text><text class="wm" x="12" y="575" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>