<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of startup promotion channels</title><desc id="d">Comparison table of four startup promotion channels: word of mouth, print materials, social media, and community events with cost, reach, and suitable use cases.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-table" class="panel" x="24" y="65" width="732" height="370" rx="6"/><rect id="region-header" class="panel-a" x="24" y="65" width="732" height="45" rx="6"/></g><g id="layer-edges"><line id="edge-h1" class="grid" x1="24" y1="110" x2="756" y2="110"/><line id="edge-h2" class="grid" x1="24" y1="190" x2="756" y2="190"/><line id="edge-h3" class="grid" x1="24" y1="270" x2="756" y2="270"/><line id="edge-h4" class="grid" x1="24" y1="350" x2="756" y2="350"/><line id="edge-v1" class="grid" x1="154" y1="65" x2="154" y2="435"/><line id="edge-v2" class="grid" x1="274" y1="65" x2="274" y2="435"/><line id="edge-v3" class="grid" x1="434" y1="65" x2="434" y2="435"/></g><g id="layer-nodes"><g id="node-r0"><text class="sh" x="36" y="93">Channel</text><text class="sh" x="166" y="93">Relative Cost</text><text class="sh" x="286" y="93">Target Reach</text><text class="sh" x="446" y="93">Suitable Startup Application</text></g><g id="node-r1"><text class="sh" x="36" y="138">Word of mouth</text><text class="cell" x="166" y="138">Zero cash</text><text class="cell" x="166" y="157">High trust</text><text class="cell" x="286" y="138">School circles</text><text class="cell" x="286" y="157">Personal network</text><text class="cell" x="446" y="138">Essential for early credibility; parents</text><text class="cell" x="446" y="157">and teachers recommend proven results</text></g><g id="node-r2"><text class="sh" x="36" y="218">Targeted print</text><text class="cell" x="166" y="218">Low cost</text><text class="cell" x="166" y="237">(under 1k PKR)</text><text class="cell" x="286" y="218">Stationery shops</text><text class="cell" x="286" y="237">Noticeboards</text><text class="cell" x="446" y="218">Concise notices placed where buyers</text><text class="cell" x="446" y="237">gather; avoids random street distribution</text></g><g id="node-r3"><text class="sh" x="36" y="298">Digital &amp; social</text><text class="cell" x="166" y="298">Low data cost</text><text class="cell" x="166" y="317">Flexible</text><text class="cell" x="286" y="298">Town or district</text><text class="cell" x="286" y="317">Mobile users</text><text class="cell" x="446" y="298">WhatsApp Business catalogs, teaching tips</text><text class="cell" x="446" y="317">and lesson clips via community groups</text></g><g id="node-r4"><text class="sh" x="36" y="378">Demonstrations</text><text class="cell" x="166" y="378">Sample cost</text><text class="cell" x="166" y="397">Direct travel</text><text class="cell" x="286" y="378">Headteachers and</text><text class="cell" x="286" y="397">subject teachers</text><text class="cell" x="446" y="378">Live classroom trials that eliminate buyer</text><text class="cell" x="446" y="397">skepticism and secure direct group orders</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="36">Promotion channels for early-stage ventures</text><text id="label-caption" class="small" x="24" y="462">Bootstrap marketing emphasizes high-trust, low-cost channels over mass commercial advertising.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>