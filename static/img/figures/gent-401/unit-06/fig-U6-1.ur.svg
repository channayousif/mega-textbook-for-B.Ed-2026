<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی کاروباری منصوبوں کا مارکیٹ پوزیشننگ نقشہ</title><desc id="d">ایک دو محوری مارکیٹ پوزیشننگ نقشہ جو چار تعلیمی کاروباری منصوبوں کو قیمت اور معیار کے لحاظ سے دکھاتا ہے، تاکہ مارکیٹ میں سوچی سمجھی حکمت عملی کے تحت خالی جگہ واضح ہو۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><g id="layer-regions"><rect id="region-quad-topleft" class="panel-a" x="390" y="70" width="325" height="210" rx="6" opacity="0.4"/><rect id="region-quad-topright" class="panel-b" x="65" y="70" width="325" height="210" rx="6" opacity="0.3"/><rect id="region-quad-botleft" class="panel" x="390" y="280" width="325" height="210" rx="6" opacity="0.4"/><rect id="region-quad-botright" class="panel" x="65" y="280" width="325" height="210" rx="6" opacity="0.25"/></g><g id="layer-edges"><line id="edge-axis-x" class="stroke" x1="720" y1="280" x2="60" y2="280" marker-end="url(#arrow)"/><line id="edge-axis-y" class="stroke" x1="390" y1="500" x2="390" y2="60" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-stem-kit"><rect class="panel-a" x="450" y="115" width="240" height="85" rx="8"/><text class="sh" x="675" y="142" text-anchor="end">‫عملی سائنس کٹ‬</text><text class="cell" x="675" y="165" text-anchor="end">‫مناسب قیمت، زیادہ عملی افادیت‬</text><text class="cell" x="675" y="184" text-anchor="end">‫نصاب سے براہِ راست ہم آہنگ‬</text></g><g id="node-academy-chain"><rect class="panel-b" x="110" y="115" width="240" height="85" rx="8"/><text class="sh" x="335" y="142" text-anchor="end">‫تجارتی اکیڈمی‬</text><text class="cell" x="335" y="165" text-anchor="end">‫زیادہ فیس، طویل مشقیں‬</text><text class="cell" x="335" y="184" text-anchor="end">‫صرف امتحان پر سخت توجہ‬</text></g><g id="node-street-photocopy"><rect class="panel" x="450" y="340" width="240" height="85" rx="8"/><text class="sh" x="675" y="367" text-anchor="end">‫سڑک کنارے فوٹو کاپی والا‬</text><text class="cell" x="675" y="390" text-anchor="end">‫بہت کم قیمت، کم معیار‬</text><text class="cell" x="675" y="409" text-anchor="end">‫دھندلے نوٹس، غلطیاں‬</text></g><g id="node-overpriced-tutor"><rect class="panel" x="110" y="340" width="240" height="85" rx="8"/><text class="sh" x="335" y="367" text-anchor="end">‫غیر تصدیق شدہ ٹیوٹر‬</text><text class="cell" x="335" y="390" text-anchor="end">‫زیادہ فیس، معمولی لیکچر‬</text><text class="cell" x="335" y="409" text-anchor="end">‫طلبہ کے کمزور نتائج‬</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‫تعلیمی کاروباری منصوبوں کا مارکیٹ پوزیشننگ نقشہ‬</text><text id="label-y-high" class="sh" x="375" y="85" text-anchor="end">‫اعلیٰ معیار‬</text><text id="label-y-low" class="sh" x="375" y="480" text-anchor="end">‫کم معیار‬</text><text id="label-x-low" class="sh" x="705" y="265" text-anchor="end">‫کم قیمت‬</text><text id="label-x-high" class="sh" x="155" y="265" text-anchor="end">‫زیادہ قیمت‬</text><text id="label-opp" class="sh" x="690" y="98" fill="var(--a1)" text-anchor="end">‫موقع: اعلیٰ معیار، مناسب قیمت‬</text><text id="label-caption" class="small" x="756" y="555" text-anchor="end">‫پوزیشننگ نقشے گاہک کی کسوٹیوں کو دکھا کر مارکیٹ کے خلا ظاہر کرتے ہیں اور نئے ادارے کو منفرد بناتے ہیں۔‬</text><text class="wm" x="12" y="575" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>