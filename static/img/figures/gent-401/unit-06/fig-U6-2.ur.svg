<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نئے کاروبار کے تشہیری ذرائع کا موازنہ</title><desc id="d">نئے کاروبار کے چار تشہیری ذرائع کا موازنہ کرنے والا جدول: زبانی تشہیر، طباعت شدہ مواد، سوشل میڈیا اور کمیونٹی تقریبات، ہر ایک کی لاگت، رسائی اور موزوں استعمال کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-table" class="panel" x="24" y="65" width="732" height="370" rx="6"/><rect id="region-header" class="panel-a" x="24" y="65" width="732" height="45" rx="6"/></g><g id="layer-edges"><line id="edge-h1" class="grid" x1="756" y1="110" x2="24" y2="110"/><line id="edge-h2" class="grid" x1="756" y1="190" x2="24" y2="190"/><line id="edge-h3" class="grid" x1="756" y1="270" x2="24" y2="270"/><line id="edge-h4" class="grid" x1="756" y1="350" x2="24" y2="350"/><line id="edge-v1" class="grid" x1="626" y1="65" x2="626" y2="435"/><line id="edge-v2" class="grid" x1="506" y1="65" x2="506" y2="435"/><line id="edge-v3" class="grid" x1="346" y1="65" x2="346" y2="435"/></g><g id="layer-nodes"><g id="node-r0"><text class="sh" x="744" y="93" text-anchor="end">‫ذریعہ‬</text><text class="sh" x="614" y="93" text-anchor="end">‫نسبتی لاگت‬</text><text class="sh" x="494" y="93" text-anchor="end">‫ہدف رسائی‬</text><text class="sh" x="334" y="93" text-anchor="end">‫نئے کاروبار کے لیے موزوں استعمال‬</text></g><g id="node-r1"><text class="sh" x="744" y="138" text-anchor="end">‫زبانی تشہیر‬</text><text class="cell" x="614" y="138" text-anchor="end">‫کوئی نقد خرچ نہیں‬</text><text class="cell" x="614" y="157" text-anchor="end">‫زیادہ اعتماد‬</text><text class="cell" x="494" y="138" text-anchor="end">‫اسکولوں کے حلقے‬</text><text class="cell" x="494" y="157" text-anchor="end">‫ذاتی تعلقات‬</text><text class="cell" x="334" y="138" text-anchor="end">‫ابتدائی ساکھ کے لیے لازمی؛ والدین اور‬</text><text class="cell" x="334" y="157" text-anchor="end">‫اساتذہ آزمودہ نتائج کی سفارش کرتے ہیں‬</text></g><g id="node-r2"><text class="sh" x="744" y="218" text-anchor="end">‫ہدفی طباعت‬</text><text class="cell" x="614" y="218" text-anchor="end">‫کم لاگت‬</text><text class="cell" x="614" y="237" text-anchor="end">‫1 ہزار روپے سے کم‬</text><text class="cell" x="494" y="218" text-anchor="end">‫اسٹیشنری کی دکانیں‬</text><text class="cell" x="494" y="237" text-anchor="end">‫نوٹس بورڈ‬</text><text class="cell" x="334" y="218" text-anchor="end">‫مختصر اعلانات وہاں جہاں خریدار جمع‬</text><text class="cell" x="334" y="237" text-anchor="end">‫ہوتے ہیں؛ سڑکوں پر بے ترتیب تقسیم سے گریز‬</text></g><g id="node-r3"><text class="sh" x="744" y="298" text-anchor="end">‫ڈیجیٹل اور سوشل‬</text><text class="cell" x="614" y="298" text-anchor="end">‫ڈیٹا کی کم لاگت‬</text><text class="cell" x="614" y="317" text-anchor="end">‫لچک دار‬</text><text class="cell" x="494" y="298" text-anchor="end">‫قصبہ یا ضلع‬</text><text class="cell" x="494" y="317" text-anchor="end">‫موبائل صارفین‬</text><text class="cell" x="334" y="298" text-anchor="end">‫واٹس ایپ بزنس کیٹلاگ، تدریسی مشورے‬</text><text class="cell" x="334" y="317" text-anchor="end">‫اور سبق کی ویڈیوز کمیونٹی گروپس میں‬</text></g><g id="node-r4"><text class="sh" x="744" y="378" text-anchor="end">‫عملی مظاہرے‬</text><text class="cell" x="614" y="378" text-anchor="end">‫نمونے کی لاگت‬</text><text class="cell" x="614" y="397" text-anchor="end">‫براہِ راست سفر‬</text><text class="cell" x="494" y="378" text-anchor="end">‫صدر معلمین اور‬</text><text class="cell" x="494" y="397" text-anchor="end">‫مضمون کے اساتذہ‬</text><text class="cell" x="334" y="378" text-anchor="end">‫کمرۂ جماعت میں براہِ راست آزمائش جو خریدار‬</text><text class="cell" x="334" y="397" text-anchor="end">‫کا شک دور کرے اور گروہی آرڈر دلائے‬</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="36" text-anchor="end">‫ابتدائی مرحلے کے کاروبار کے لیے تشہیری ذرائع‬</text><text id="label-caption" class="small" x="756" y="462" text-anchor="end">‫کم خرچ مارکیٹنگ عام تجارتی اشتہارات کے بجائے زیادہ اعتماد اور کم لاگت والے ذرائع پر زور دیتی ہے۔‬</text><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>