<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں SECP کے ذریعے کمپنی کی رجسٹریشن کا عمل</title><desc id="d">ایک عمودی فلو چارٹ جو پاکستان میں SECP کے ڈیجیٹل eZfile نظام کے ذریعے کمپنی کی تشکیل (انکارپوریشن) کے ترتیب وار مراحل دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-step1-step2" class="stroke" x1="390" y1="125" x2="390" y2="155" marker-end="url(#arrow)"/><line id="edge-step2-step3" class="stroke" x1="390" y1="220" x2="390" y2="250" marker-end="url(#arrow)"/><line id="edge-step3-scrutiny" class="stroke" x1="390" y1="315" x2="390" y2="345" marker-end="url(#arrow)"/><line id="edge-scrutiny-yes" class="stroke" x1="390" y1="420" x2="390" y2="470" marker-end="url(#arrow)"/><path id="edge-scrutiny-no" class="dash" d="M210 385 L110 385 L110 285 L215 285" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-step1"><rect class="panel" x="220" y="65" width="340" height="60" rx="8"/><text class="sh" x="545" y="89" text-anchor="end">‫مرحلہ 1: کمپنی کا نام محفوظ کرائیں‬</text><text class="cell" x="545" y="110" text-anchor="end">‫SECP eZfile پر نام کی دستیابی کی آن لائن جانچ‬</text></g><g id="node-step2"><rect class="panel" x="220" y="160" width="340" height="60" rx="8"/><text class="sh" x="545" y="184" text-anchor="end">‫مرحلہ 2: بنیادی دستاویزات تیار کریں‬</text><text class="cell" x="545" y="205" text-anchor="end">‫میمورنڈم اور آرٹیکلز آف ایسوسی ایشن‬</text></g><g id="node-step3"><rect class="panel" x="220" y="255" width="340" height="60" rx="8"/><text class="sh" x="545" y="279" text-anchor="end">‫مرحلہ 3: آن لائن جمع کرانا اور فیس‬</text><text class="cell" x="545" y="300" text-anchor="end">‫بانیوں کے CNIC اپ لوڈ کریں، سرکاری فیس ادا کریں‬</text></g><g id="node-scrutiny"><polygon class="panel-b" points="390,350 210,385 390,420 570,385"/><text class="sh" x="390" y="380" text-anchor="middle">‫SECP کی جانب سے قانونی جانچ‬</text><text class="cell" x="390" y="398" text-anchor="middle">‫کیا دستاویزات قانونی معیار پر پوری اترتی ہیں؟‬</text></g><g id="node-incorporation"><rect class="panel-a" x="190" y="475" width="400" height="70" rx="8"/><text class="sh" x="390" y="501" text-anchor="middle">‫سرٹیفکیٹ آف انکارپوریشن جاری‬</text><text class="cell" x="390" y="523" text-anchor="middle">‫منفرد CUIN جاری؛ الگ قانونی شخصیت وجود میں آ گئی‬</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‫پاکستان میں SECP eZfile کے ذریعے کمپنی کی رجسٹریشن‬</text><text id="label-yes" class="sh" x="380" y="448" text-anchor="end">‫ہاں: منظور‬</text><text id="label-no" class="sh" x="195" y="375" text-anchor="end">‫نہیں: غلطیاں درست کریں‬</text><text id="label-resubmit" class="small" x="195" y="300" text-anchor="end">‫فارم دوبارہ جمع کرائیں‬</text><text id="label-caption" class="small" x="756" y="595" text-anchor="end">‫کمپنیز ایکٹ 2017 کے تحت تشکیل محدود ذمہ داری قائم کرتی ہے۔‬</text><text class="wm" x="12" y="605" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>