<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">IPO-Pakistan کے تحت دانشورانہ ملکیت کی شاخیں</title><desc id="d">IPO-Pakistan کے تحت دانشورانہ ملکیت کی چار اقسام کی تفصیل دینے والا جدول: ٹریڈ مارک، کاپی رائٹ، پیٹنٹ اور صنعتی ڈیزائن، ان کے قانونی دائرے اور عملی مثالوں کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><rect id="region-table" class="panel" x="24" y="65" width="732" height="385" rx="6"/><rect id="region-header" class="panel-a" x="24" y="65" width="732" height="45" rx="6"/></g><g id="layer-edges"><line id="edge-h1" class="grid" x1="756" y1="110" x2="24" y2="110"/><line id="edge-h2" class="grid" x1="756" y1="195" x2="24" y2="195"/><line id="edge-h3" class="grid" x1="756" y1="280" x2="24" y2="280"/><line id="edge-h4" class="grid" x1="756" y1="365" x2="24" y2="365"/><line id="edge-v1" class="grid" x1="646" y1="65" x2="646" y2="450"/><line id="edge-v2" class="grid" x1="456" y1="65" x2="456" y2="450"/><line id="edge-v3" class="grid" x1="326" y1="65" x2="326" y2="450"/></g><g id="layer-nodes"><g id="node-r0"><text class="sh" x="744" y="85" text-anchor="end">‫ملکیت کی‬</text><text class="sh" x="744" y="103" text-anchor="end">‫قسم‬</text><text class="sh" x="634" y="85" text-anchor="end">‫یہ کس چیز کا‬</text><text class="sh" x="634" y="103" text-anchor="end">‫تحفظ کرتی ہے‬</text><text class="sh" x="444" y="93" text-anchor="end">‫متعلقہ قانون‬</text><text class="sh" x="314" y="93" text-anchor="end">‫کمرۂ جماعت کی مثال‬</text></g><g id="node-r1"><text class="sh" x="744" y="138" text-anchor="end">‫ٹریڈ مارک‬</text><text class="cell" x="634" y="138" text-anchor="end">‫امتیازی نام، لوگو،‬</text><text class="cell" x="634" y="157" text-anchor="end">‫نعرے اور تجارتی‬</text><text class="cell" x="634" y="176" text-anchor="end">‫علامتیں‬</text><text class="cell" x="444" y="138" text-anchor="end">‫ٹریڈ مارکس‬</text><text class="cell" x="444" y="157" text-anchor="end">‫آرڈیننس، 2001‬</text><text class="cell" x="444" y="176" text-anchor="end">‫10 سال، قابلِ تجدید‬</text><text class="cell" x="314" y="138" text-anchor="end">‫کسی تعلیمی اشاعتی ادارے یا اساتذہ کی‬</text><text class="cell" x="314" y="157" text-anchor="end">‫تربیتی اکیڈمی کا منفرد برانڈ نام‬</text><text class="cell" x="314" y="176" text-anchor="end">‫اور لوگو‬</text></g><g id="node-r2"><text class="sh" x="744" y="223" text-anchor="end">‫کاپی رائٹ‬</text><text class="cell" x="634" y="223" text-anchor="end">‫اصل تحریری متن،‬</text><text class="cell" x="634" y="242" text-anchor="end">‫تصاویر، سافٹ ویئر‬</text><text class="cell" x="634" y="261" text-anchor="end">‫اور تدریسی کتابچے‬</text><text class="cell" x="444" y="223" text-anchor="end">‫کاپی رائٹ‬</text><text class="cell" x="444" y="242" text-anchor="end">‫آرڈیننس، 1962‬</text><text class="cell" x="444" y="261" text-anchor="end">‫زندگی بھر اور 50 سال‬</text><text class="cell" x="314" y="223" text-anchor="end">‫سندھی زبان کی جیومیٹری ورک بک‬</text><text class="cell" x="314" y="242" text-anchor="end">‫کا اصل تحریری متن یا سبق کے‬</text><text class="cell" x="314" y="261" text-anchor="end">‫مظاہرے کی ویڈیو‬</text></g><g id="node-r3"><text class="sh" x="744" y="308" text-anchor="end">‫پیٹنٹ‬</text><text class="cell" x="634" y="308" text-anchor="end">‫نئے، اختراعی،‬</text><text class="cell" x="634" y="327" text-anchor="end">‫غیر بدیہی عملی‬</text><text class="cell" x="634" y="346" text-anchor="end">‫تکنیکی حل‬</text><text class="cell" x="444" y="308" text-anchor="end">‫پیٹنٹس‬</text><text class="cell" x="444" y="327" text-anchor="end">‫آرڈیننس، 2000‬</text><text class="cell" x="444" y="346" text-anchor="end">‫مدت 20 سال‬</text><text class="cell" x="314" y="308" text-anchor="end">‫طلبہ کی ورک بکس کو عام لاگت‬</text><text class="cell" x="314" y="327" text-anchor="end">‫سے آدھی قیمت پر باندھنے والا‬</text><text class="cell" x="314" y="346" text-anchor="end">‫نیا مشینی جلد بندی آلہ‬</text></g><g id="node-r4"><text class="sh" x="744" y="393" text-anchor="end">‫صنعتی‬</text><text class="sh" x="744" y="412" text-anchor="end">‫ڈیزائن‬</text><text class="cell" x="634" y="393" text-anchor="end">‫منفرد ظاہری شکل،‬</text><text class="cell" x="634" y="412" text-anchor="end">‫آرام دہ ساخت یا‬</text><text class="cell" x="634" y="431" text-anchor="end">‫سطح کی بناوٹ‬</text><text class="cell" x="444" y="393" text-anchor="end">‫رجسٹرڈ ڈیزائنز‬</text><text class="cell" x="444" y="412" text-anchor="end">‫آرڈیننس، 2000‬</text><text class="cell" x="444" y="431" text-anchor="end">‫زیادہ سے زیادہ 20 سال‬</text><text class="cell" x="314" y="393" text-anchor="end">‫کمرۂ جماعت کی میز اور کرسی‬</text><text class="cell" x="314" y="412" text-anchor="end">‫کی منفرد، آرام دہ اور خم دار‬</text><text class="cell" x="314" y="431" text-anchor="end">‫پلاسٹک کی شکل‬</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="36" text-anchor="end">‫IPO-Pakistan کے تحت دانشورانہ ملکیت کی چار شاخیں‬</text><text id="label-caption" class="small" x="756" y="475" text-anchor="end">‫دانشورانہ ملکیت اظہار، علامتوں اور نئی ایجادات کا تحفظ کرتی ہے۔‬</text><text class="wm" x="12" y="485" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>