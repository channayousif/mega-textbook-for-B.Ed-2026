<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ڈیٹا جمع کرنے کے چار طریقے</title><desc id="d">ڈیٹا جمع کرنے کے چار طریقوں (سروے، انٹرویو، مشاہدہ اور ثانوی ڈیٹا) کا جدول، ہر ایک کی اندازاً لاگت اور اس سے کیا پتا چلتا ہے، اور یہ نوٹ کہ کوئی ایک طریقہ اکیلا کافی نہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"></g><g id="layer-edges"><line class="grid" x1="756" y1="60" x2="24" y2="60"/><line class="grid" x1="756" y1="100" x2="24" y2="100"/><line class="grid" x1="756" y1="176" x2="24" y2="176"/><line class="grid" x1="756" y1="252" x2="24" y2="252"/><line class="grid" x1="756" y1="328" x2="24" y2="328"/><line class="grid" x1="756" y1="404" x2="24" y2="404"/><line class="grid" x1="756" y1="60" x2="756" y2="404"/><line class="grid" x1="566" y1="60" x2="566" y2="404"/><line class="grid" x1="394" y1="60" x2="394" y2="404"/><line class="grid" x1="24" y1="60" x2="24" y2="404"/></g><g id="layer-nodes"><g id="node-head-method"><text class="sh" x="744" y="86" text-anchor="end">طریقہ</text></g><g id="node-head-cost"><text class="sh" x="542" y="86" text-anchor="end">اندازاً لاگت</text></g><g id="node-head-reveal"><text class="sh" x="370" y="86" text-anchor="end">اس سے کیا پتا چلتا ہے</text></g><g id="node-survey"><text class="sh" x="744" y="124" text-anchor="end">سروے</text><text class="cell" x="744" y="146" text-anchor="end">بہت سے لوگوں سے ایک جیسے</text><text class="cell" x="744" y="167" text-anchor="end">تحریری سوال پوچھنا</text><text class="cell" x="542" y="124" text-anchor="end">کم؛ آپ کا وقت</text><text class="cell" x="542" y="146" text-anchor="end">اور چھپائی</text><text class="cell" x="370" y="124" text-anchor="end">لوگ کیا کہتے ہیں کہ وہ کیا کرتے</text><text class="cell" x="370" y="146" text-anchor="end">اور چاہتے ہیں، گنے جا سکنے والے اعداد میں</text></g><g id="node-interview"><text class="sh" x="744" y="200" text-anchor="end">انٹرویو</text><text class="cell" x="744" y="222" text-anchor="end">ایک شخص کے ساتھ بیٹھ کر</text><text class="cell" x="744" y="243" text-anchor="end">کھلے سوال پوچھنا</text><text class="cell" x="542" y="200" text-anchor="end">کم سے درمیانی؛</text><text class="cell" x="542" y="222" text-anchor="end">زیادہ تر وقت</text><text class="cell" x="370" y="200" text-anchor="end">لوگ جو کرتے ہیں وہ کیوں کرتے ہیں، اور</text><text class="cell" x="370" y="222" text-anchor="end">وہ بات جو فارم پر نہیں لکھی جا سکتی</text></g><g id="node-observation"><text class="sh" x="744" y="276" text-anchor="end">مشاہدہ</text><text class="cell" x="744" y="298" text-anchor="end">دیکھنا کہ لوگ اصل میں کیا</text><text class="cell" x="744" y="319" text-anchor="end">کرتے ہیں، یا انہیں گننا</text><text class="cell" x="542" y="276" text-anchor="end">کم؛ وقت اور ایک</text><text class="cell" x="542" y="298" text-anchor="end">نوٹ بک</text><text class="cell" x="370" y="276" text-anchor="end">اصل رویہ، جو اکثر لوگوں کی</text><text class="cell" x="370" y="298" text-anchor="end">کہی ہوئی بات سے مختلف ہوتا ہے</text></g><g id="node-secondary"><text class="sh" x="744" y="352" text-anchor="end">ثانوی ڈیٹا</text><text class="cell" x="744" y="374" text-anchor="end">دوسروں کے پہلے سے شائع کردہ</text><text class="cell" x="744" y="395" text-anchor="end">اعداد و شمار اور رپورٹیں پڑھنا</text><text class="cell" x="542" y="352" text-anchor="end">عموماً مفت؛</text><text class="cell" x="542" y="374" text-anchor="end">تلاش کا وقت</text><text class="cell" x="370" y="352" text-anchor="end">مارکیٹ کتنی بڑی ہے، اور وقت کے</text><text class="cell" x="370" y="374" text-anchor="end">ساتھ کیا بدلا ہے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">ڈیٹا جمع کرنے کے چار طریقے</text><text id="label-note-1" class="small" x="756" y="434" text-anchor="end">کوئی ایک طریقہ اکیلا کافی نہیں۔ کسی نتیجے کی تصدیق کے لیے کم از کم دو</text><text id="label-note-2" class="small" x="756" y="460" text-anchor="end">طریقے استعمال کریں، ایک بنیادی اور ایک ثانوی۔</text><text class="wm" x="12" y="480" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
