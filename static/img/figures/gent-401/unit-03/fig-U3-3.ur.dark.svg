<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کاروباری ماڈل کینوس کے نو خانے</title><desc id="d">کاروباری ماڈل کینوس کا خاکہ جس کے نو نام زد خانے ہفتے کے روز چلنے والے ایک سائنس کلب کے لیے بھرے گئے ہیں: اہم شراکت دار، اہم سرگرمیاں، اہم وسائل، قدر کی پیشکش، گاہکوں سے تعلق، رسائی کے ذرائع، گاہکوں کے طبقات، لاگت کا ڈھانچہ اور آمدنی کے ذرائع۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"><rect id="region-partners" class="panel" x="516" y="60" width="240" height="150"/><rect id="region-activities" class="panel" x="264" y="60" width="240" height="150"/><rect id="region-resources" class="panel" x="24" y="60" width="228" height="150"/><rect id="region-value" class="panel-a" x="516" y="222" width="240" height="150"/><rect id="region-relationships" class="panel" x="264" y="222" width="240" height="150"/><rect id="region-channels" class="panel" x="24" y="222" width="228" height="150"/><rect id="region-segments" class="panel-b" x="516" y="384" width="240" height="150"/><rect id="region-cost" class="panel" x="264" y="384" width="240" height="150"/><rect id="region-revenue" class="panel-a" x="24" y="384" width="228" height="150"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-partners"><text class="sh" x="742" y="88" text-anchor="end">اہم شراکت دار</text><text class="cell" x="742" y="112" text-anchor="end">اسکول: کمرہ، طلبہ اور</text><text class="cell" x="742" y="133" text-anchor="end">ہیڈ ٹیچر</text><text class="cell" x="742" y="157" text-anchor="end">ایک مقامی سائنس ٹیچر</text><text class="cell" x="742" y="178" text-anchor="end">جو مدد کر سکے</text></g><g id="node-activities"><text class="sh" x="490" y="88" text-anchor="end">اہم سرگرمیاں</text><text class="cell" x="490" y="112" text-anchor="end">سادہ تجربات کی منصوبہ بندی</text><text class="cell" x="490" y="133" text-anchor="end">ہفتے کے روز سیشن چلانا</text><text class="cell" x="490" y="157" text-anchor="end">ہر طالب علم کا کام جانچنا</text></g><g id="node-resources"><text class="sh" x="238" y="88" text-anchor="end">اہم وسائل</text><text class="cell" x="238" y="112" text-anchor="end">ایک کٹ باکس</text><text class="cell" x="238" y="133" text-anchor="end">چھپی ہوئی ورک شیٹس</text><text class="cell" x="238" y="157" text-anchor="end">ایک کلاس روم</text><text class="cell" x="238" y="178" text-anchor="end">بلال کا اپنا وقت</text></g><g id="node-value"><text class="sh" x="742" y="250" text-anchor="end">قدر کی پیشکش</text><text class="cell" x="742" y="274" text-anchor="end">اسکول سے غیر حاضر رہنے والے</text><text class="cell" x="742" y="295" text-anchor="end">طلبہ سائنس کی کمی پوری کریں</text><text class="cell" x="742" y="319" text-anchor="end">والدین ہر ٹرم حقیقی</text><text class="cell" x="742" y="340" text-anchor="end">پیش رفت دیکھیں</text></g><g id="node-relationships"><text class="sh" x="490" y="250" text-anchor="end">گاہکوں سے تعلق</text><text class="cell" x="490" y="274" text-anchor="end">ہفتہ وار آمنے سامنے سیشن</text><text class="cell" x="490" y="295" text-anchor="end">والدین کے نام نوٹس</text><text class="cell" x="490" y="319" text-anchor="end">جماعت کا واٹس ایپ گروپ</text></g><g id="node-channels"><text class="sh" x="238" y="250" text-anchor="end">رسائی کے ذرائع</text><text class="cell" x="238" y="274" text-anchor="end">اسکول کا گیٹ</text><text class="cell" x="238" y="295" text-anchor="end">ہیڈ ٹیچر کا اعلان</text><text class="cell" x="238" y="319" text-anchor="end">جماعت کا واٹس ایپ گروپ</text></g><g id="node-segments"><text class="sh" x="742" y="412" text-anchor="end">گاہکوں کے طبقات</text><text class="cell" x="742" y="436" text-anchor="end">آٹھویں جماعت کے وہ طلبہ</text><text class="cell" x="742" y="457" text-anchor="end">جنہیں سائنس میں مدد چاہیے</text><text class="cell" x="742" y="481" text-anchor="end">ان کے والدین، جو ادائیگی کرتے ہیں</text></g><g id="node-cost"><text class="sh" x="490" y="412" text-anchor="end">لاگت کا ڈھانچہ</text><text class="cell" x="490" y="436" text-anchor="end">چھپائی اور کٹ کا سامان</text><text class="cell" x="490" y="457" text-anchor="end">آمد و رفت</text><text class="cell" x="490" y="481" text-anchor="end">بلال کا وقت</text></g><g id="node-revenue"><text class="sh" x="238" y="412" text-anchor="end">آمدنی کے ذرائع</text><text class="cell" x="238" y="436" text-anchor="end">والدین سے ماہانہ فیس</text><text class="cell" x="238" y="457" text-anchor="end">ورک شیٹ پیک کی</text><text class="cell" x="238" y="478" text-anchor="end">ایک چھوٹی فیس</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کاروباری ماڈل کینوس کے نو خانے</text><text id="label-case" class="small" x="756" y="554" text-anchor="end">سکھر میں بلال کے ہفتے کے روز والے سائنس کلب کے لیے بھرا گیا۔</text><text id="label-key" class="small" x="756" y="582" text-anchor="end">دو رنگین خانے گاہک اور پیسے کو دکھاتے ہیں۔</text><text class="wm" x="12" y="590" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
