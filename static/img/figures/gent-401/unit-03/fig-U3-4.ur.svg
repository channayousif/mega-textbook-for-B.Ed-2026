<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آمدنی کے پانچ عام ذرائع</title><desc id="d">آمدنی کے پانچ عام ذرائع (فروخت، اشتراک، خدمت کی فیس، اشتہار اور لائسنسنگ) کا جدول، ہر ایک کے ساتھ یہ مختصر نوٹ کہ یہ کیسے کام کرتا ہے اور اسکول سے جڑے کسی کاروبار کی ایک مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"></g><g id="layer-edges"><line class="grid" x1="756" y1="60" x2="24" y2="60"/><line class="grid" x1="756" y1="100" x2="24" y2="100"/><line class="grid" x1="756" y1="184" x2="24" y2="184"/><line class="grid" x1="756" y1="268" x2="24" y2="268"/><line class="grid" x1="756" y1="352" x2="24" y2="352"/><line class="grid" x1="756" y1="436" x2="24" y2="436"/><line class="grid" x1="756" y1="520" x2="24" y2="520"/><line class="grid" x1="756" y1="60" x2="756" y2="520"/><line class="grid" x1="594" y1="60" x2="594" y2="520"/><line class="grid" x1="312" y1="60" x2="312" y2="520"/><line class="grid" x1="24" y1="60" x2="24" y2="520"/></g><g id="layer-nodes"><g id="node-head-stream"><text class="sh" x="744" y="86" text-anchor="end">ذریعہ</text></g><g id="node-head-how"><text class="sh" x="582" y="86" text-anchor="end">یہ کیسے کام کرتا ہے</text></g><g id="node-head-example"><text class="sh" x="300" y="86" text-anchor="end">ایک مثال</text></g><g id="node-sale"><text class="sh" x="744" y="130" text-anchor="end">فروخت</text><text class="cell" x="582" y="130" text-anchor="end">گاہک چیز ایک بار خریدتا ہے</text><text class="cell" x="582" y="151" text-anchor="end">اور اس کا مالک بن جاتا ہے</text><text class="cell" x="300" y="130" text-anchor="end">ایک طالب علم 50 روپے میں چھپا</text><text class="cell" x="300" y="151" text-anchor="end">ہوا ورک شیٹ پیک خریدتا ہے</text></g><g id="node-subscription"><text class="sh" x="744" y="214" text-anchor="end">اشتراک (سبسکرپشن)</text><text class="cell" x="582" y="214" text-anchor="end">گاہک مسلسل رسائی کے لیے بار بار</text><text class="cell" x="582" y="235" text-anchor="end">ایک ہی رقم ادا کرتا ہے</text><text class="cell" x="300" y="214" text-anchor="end">والدین ہفتے کے روز کے چار سیشنوں</text><text class="cell" x="300" y="235" text-anchor="end">کے لیے 200 روپے ماہانہ دیتے ہیں</text></g><g id="node-fee"><text class="sh" x="744" y="298" text-anchor="end">خدمت کی فیس</text><text class="cell" x="582" y="298" text-anchor="end">گاہک اپنے لیے کیے گئے کسی</text><text class="cell" x="582" y="319" text-anchor="end">کام کی ادائیگی کرتا ہے</text><text class="cell" x="300" y="298" text-anchor="end">اسکول کمپیوٹر کی مرمت کے لیے</text><text class="cell" x="300" y="319" text-anchor="end">ٹیکنیشن کو 150 روپے دیتا ہے</text></g><g id="node-advertising"><text class="sh" x="744" y="382" text-anchor="end">اشتہار</text><text class="cell" x="582" y="382" text-anchor="end">کوئی دوسرا کاروبار آپ کے گاہکوں</text><text class="cell" x="582" y="403" text-anchor="end">تک پہنچنے کے لیے ادائیگی کرتا ہے</text><text class="cell" x="300" y="382" text-anchor="end">اسٹیشنری کی ایک دکان ہر پیک میں اپنا</text><text class="cell" x="300" y="403" text-anchor="end">پرچہ رکھنے کے لیے 300 روپے دیتی ہے</text></g><g id="node-licensing"><text class="sh" x="744" y="466" text-anchor="end">لائسنسنگ</text><text class="cell" x="582" y="466" text-anchor="end">کوئی دوسرا کاروبار آپ کا نام، ڈیزائن یا</text><text class="cell" x="582" y="487" text-anchor="end">مواد استعمال کرنے کے حق کی قیمت دیتا ہے</text><text class="cell" x="300" y="466" text-anchor="end">ایک ناشر آپ کی ورک شیٹ سیریز</text><text class="cell" x="300" y="487" text-anchor="end">اپنے نام سے چھاپنے کی قیمت دیتا ہے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">آمدنی کے پانچ عام ذرائع</text><text id="label-note-1" class="small" x="756" y="550" text-anchor="end">چھوٹے کاروبار کے لیے عموماً ایک یا دو موزوں ذرائع</text><text id="label-note-2" class="small" x="756" y="576" text-anchor="end">بہت سے ادھورے ذرائع سے بہتر ہوتے ہیں۔</text><text class="wm" x="12" y="590" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
