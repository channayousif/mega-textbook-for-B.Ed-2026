<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of a small market-research cycle</title><desc id="d">Flowchart of a small market-research cycle: define the question, choose the method, collect the data, analyse it, then decide whether to go on, change the idea or stop, with an arrow back from analyse to define the question when the data is unclear.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="680"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-question-method" class="stroke" x1="400" y1="116" x2="400" y2="154" marker-end="url(#arrow)"/><line id="edge-method-collect" class="stroke" x1="400" y1="212" x2="400" y2="250" marker-end="url(#arrow)"/><line id="edge-collect-analyse" class="stroke" x1="400" y1="308" x2="400" y2="346" marker-end="url(#arrow)"/><line id="edge-analyse-decide" class="stroke" x1="400" y1="404" x2="400" y2="422" marker-end="url(#arrow)"/><line id="edge-clear-go" class="stroke" x1="400" y1="536" x2="400" y2="582" marker-end="url(#arrow)"/><path id="edge-unclear-question" class="dash" d="M220,480 L120,480 L120,88 L228,88" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-question"><rect class="panel-a" x="230" y="60" width="340" height="56" rx="28"/><text class="sh" x="400" y="84" text-anchor="middle">Define the question</text><text class="cell" x="400" y="103" text-anchor="middle">what do you need to know?</text></g><g id="node-method"><rect class="panel" x="230" y="156" width="340" height="56" rx="8"/><text class="sh" x="400" y="180" text-anchor="middle">Choose the method</text><text class="cell" x="400" y="199" text-anchor="middle">primary, secondary, or both</text></g><g id="node-collect"><rect class="panel" x="230" y="252" width="340" height="56" rx="8"/><text class="sh" x="400" y="276" text-anchor="middle">Collect the data</text><text class="cell" x="400" y="295" text-anchor="middle">ask, watch, or read</text></g><g id="node-analyse"><rect class="panel" x="230" y="348" width="340" height="56" rx="8"/><text class="sh" x="400" y="372" text-anchor="middle">Analyse the data</text><text class="cell" x="400" y="391" text-anchor="middle">what pattern appears?</text></g><g id="node-clear"><polygon class="panel-b" points="400,424 580,480 400,536 220,480"/><text class="sh" x="400" y="476" text-anchor="middle">Is the answer</text><text class="sh" x="400" y="494" text-anchor="middle">clear?</text></g><g id="node-go"><rect class="panel-a" x="230" y="584" width="340" height="56" rx="28"/><text class="sh" x="400" y="608" text-anchor="middle">Decide</text><text class="cell" x="400" y="627" text-anchor="middle">go on, change the idea, or stop</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">A small market-research cycle</text><text id="label-no" class="small" x="200" y="470" text-anchor="end">no</text><text id="label-yes" class="small" x="412" y="562">yes</text><text id="label-ask-1" class="small" x="132" y="272">ask a</text><text id="label-ask-2" class="small" x="132" y="289">better</text><text id="label-ask-3" class="small" x="132" y="306">question</text><text id="label-key-1" class="small" x="610" y="610">the dashed arrow</text><text id="label-key-2" class="small" x="610" y="627">is the way back</text><text class="wm" x="768" y="670" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
