<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The nine blocks of a business-model canvas</title><desc id="d">Diagram of a business-model canvas with nine labelled blocks filled for a weekend science club: key partners, key activities, key resources, value propositions, customer relationships, channels, customer segments, cost structure and revenue streams.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"><rect id="region-partners" class="panel" x="24" y="60" width="240" height="150"/><rect id="region-activities" class="panel" x="276" y="60" width="240" height="150"/><rect id="region-resources" class="panel" x="528" y="60" width="228" height="150"/><rect id="region-value" class="panel-a" x="24" y="222" width="240" height="150"/><rect id="region-relationships" class="panel" x="276" y="222" width="240" height="150"/><rect id="region-channels" class="panel" x="528" y="222" width="228" height="150"/><rect id="region-segments" class="panel-b" x="24" y="384" width="240" height="150"/><rect id="region-cost" class="panel" x="276" y="384" width="240" height="150"/><rect id="region-revenue" class="panel-a" x="528" y="384" width="228" height="150"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-partners"><text class="sh" x="38" y="88">Key partners</text><text class="cell" x="38" y="112">the school: a room, pupils,</text><text class="cell" x="38" y="129">the head teacher</text><text class="cell" x="38" y="153">a local science teacher</text><text class="cell" x="38" y="170">who can help</text></g><g id="node-activities"><text class="sh" x="290" y="88">Key activities</text><text class="cell" x="290" y="112">plan simple experiments</text><text class="cell" x="290" y="129">run Saturday sessions</text><text class="cell" x="290" y="153">check each pupil's work</text></g><g id="node-resources"><text class="sh" x="542" y="88">Key resources</text><text class="cell" x="542" y="112">a kit box</text><text class="cell" x="542" y="129">printed worksheets</text><text class="cell" x="542" y="153">a classroom</text><text class="cell" x="542" y="170">Bilal's own time</text></g><g id="node-value"><text class="sh" x="38" y="250">Value propositions</text><text class="cell" x="38" y="274">pupils who miss school</text><text class="cell" x="38" y="291">catch up on science</text><text class="cell" x="38" y="315">parents see real progress</text><text class="cell" x="38" y="332">each term</text></g><g id="node-relationships"><text class="sh" x="290" y="250">Customer relationships</text><text class="cell" x="290" y="274">weekly face-to-face sessions</text><text class="cell" x="290" y="291">a notice to parents</text><text class="cell" x="290" y="315">a class WhatsApp group</text></g><g id="node-channels"><text class="sh" x="542" y="250">Channels</text><text class="cell" x="542" y="274">the school gate</text><text class="cell" x="542" y="291">the head teacher's notice</text><text class="cell" x="542" y="315">a class WhatsApp group</text></g><g id="node-segments"><text class="sh" x="38" y="412">Customer segments</text><text class="cell" x="38" y="436">Class 8 pupils who need</text><text class="cell" x="38" y="453">science support</text><text class="cell" x="38" y="477">their parents, who pay</text></g><g id="node-cost"><text class="sh" x="290" y="412">Cost structure</text><text class="cell" x="290" y="436">printing and kit materials</text><text class="cell" x="290" y="453">transport</text><text class="cell" x="290" y="477">Bilal's time</text></g><g id="node-revenue"><text class="sh" x="542" y="412">Revenue streams</text><text class="cell" x="542" y="436">a monthly fee from parents</text><text class="cell" x="542" y="453">a small fee for the</text><text class="cell" x="542" y="470">worksheet pack</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">The nine blocks of a business-model canvas</text><text id="label-case" class="small" x="24" y="560">Filled for Bilal's Saturday science club in Sukkur.</text><text id="label-key" class="small" x="24" y="580">The two shaded blocks are the customer and the money.</text><text class="wm" x="768" y="590" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
