<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five common revenue streams</title><desc id="d">Table of five common revenue streams - sale, subscription, fee, advertising and licensing - each with a short note on how it works and one example from a school-based venture.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="600"/><g id="layer-regions"></g><g id="layer-edges"><line class="grid" x1="24" y1="60" x2="756" y2="60"/><line class="grid" x1="24" y1="100" x2="756" y2="100"/><line class="grid" x1="24" y1="184" x2="756" y2="184"/><line class="grid" x1="24" y1="268" x2="756" y2="268"/><line class="grid" x1="24" y1="352" x2="756" y2="352"/><line class="grid" x1="24" y1="436" x2="756" y2="436"/><line class="grid" x1="24" y1="520" x2="756" y2="520"/><line class="grid" x1="24" y1="60" x2="24" y2="520"/><line class="grid" x1="186" y1="60" x2="186" y2="520"/><line class="grid" x1="468" y1="60" x2="468" y2="520"/><line class="grid" x1="756" y1="60" x2="756" y2="520"/></g><g id="layer-nodes"><g id="node-head-stream"><text class="sh" x="36" y="86">Stream</text></g><g id="node-head-how"><text class="sh" x="198" y="86">How it works</text></g><g id="node-head-example"><text class="sh" x="480" y="86">An example</text></g><g id="node-sale"><text class="sh" x="36" y="130">Sale</text><text class="cell" x="198" y="130">the customer buys the thing once</text><text class="cell" x="198" y="147">and owns it</text><text class="cell" x="480" y="130">a pupil buys a printed worksheet</text><text class="cell" x="480" y="147">pack for 50 rupees</text></g><g id="node-subscription"><text class="sh" x="36" y="214">Subscription</text><text class="cell" x="198" y="214">the customer pays the same amount</text><text class="cell" x="198" y="231">again and again for continued</text><text class="cell" x="198" y="248">access</text><text class="cell" x="480" y="214">parents pay 200 rupees a month for</text><text class="cell" x="480" y="231">four Saturday sessions</text></g><g id="node-fee"><text class="sh" x="36" y="298">Fee for service</text><text class="cell" x="198" y="298">the customer pays for a task</text><text class="cell" x="198" y="315">done for them</text><text class="cell" x="480" y="298">the school pays a technician 150</text><text class="cell" x="480" y="315">rupees to repair a computer</text></g><g id="node-advertising"><text class="sh" x="36" y="382">Advertising</text><text class="cell" x="198" y="382">another business pays to reach</text><text class="cell" x="198" y="399">your audience</text><text class="cell" x="480" y="382">a stationery shop pays 300 rupees</text><text class="cell" x="480" y="399">to put its leaflet in every pack</text></g><g id="node-licensing"><text class="sh" x="36" y="466">Licensing</text><text class="cell" x="198" y="466">another business pays for the right</text><text class="cell" x="198" y="483">to use your name, design or material</text><text class="cell" x="480" y="466">a publisher pays to print your</text><text class="cell" x="480" y="483">worksheet series under its name</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Five common revenue streams</text><text id="label-note-1" class="small" x="24" y="556">A small venture is usually better with one or two streams</text><text id="label-note-2" class="small" x="24" y="573">that fit than with many half-built ones.</text><text class="wm" x="768" y="590" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
