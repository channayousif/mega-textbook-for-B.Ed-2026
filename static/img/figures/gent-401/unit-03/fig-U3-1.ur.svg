<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مارکیٹ ریسرچ کے ایک چھوٹے چکر کا فلو چارٹ</title><desc id="d">مارکیٹ ریسرچ کے ایک چھوٹے چکر کا فلو چارٹ: سوال طے کریں، طریقہ چنیں، ڈیٹا جمع کریں، اس کا تجزیہ کریں، پھر فیصلہ کریں کہ آگے بڑھنا ہے، خیال بدلنا ہے یا رک جانا ہے، اور ڈیٹا واضح نہ ہو تو تجزیے سے واپس سوال طے کرنے تک ایک تیر۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="680"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-question-method" class="stroke" x1="380" y1="116" x2="380" y2="154" marker-end="url(#arrow)"/><line id="edge-method-collect" class="stroke" x1="380" y1="212" x2="380" y2="250" marker-end="url(#arrow)"/><line id="edge-collect-analyse" class="stroke" x1="380" y1="308" x2="380" y2="346" marker-end="url(#arrow)"/><line id="edge-analyse-decide" class="stroke" x1="380" y1="404" x2="380" y2="422" marker-end="url(#arrow)"/><line id="edge-clear-go" class="stroke" x1="380" y1="536" x2="380" y2="582" marker-end="url(#arrow)"/><path id="edge-unclear-question" class="dash" d="M560 480 L660 480 L660 88 L552 88" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-question"><rect class="panel-a" x="210" y="60" width="340" height="56" rx="28"/><text class="sh" x="380" y="84" text-anchor="middle">سوال طے کریں</text><text class="cell" x="380" y="103" text-anchor="middle">آپ کو کیا جاننا ہے؟</text></g><g id="node-method"><rect class="panel" x="210" y="156" width="340" height="56" rx="8"/><text class="sh" x="380" y="180" text-anchor="middle">طریقہ چنیں</text><text class="cell" x="380" y="199" text-anchor="middle">بنیادی، ثانوی، یا دونوں</text></g><g id="node-collect"><rect class="panel" x="210" y="252" width="340" height="56" rx="8"/><text class="sh" x="380" y="276" text-anchor="middle">ڈیٹا جمع کریں</text><text class="cell" x="380" y="295" text-anchor="middle">پوچھیں، دیکھیں، یا پڑھیں</text></g><g id="node-analyse"><rect class="panel" x="210" y="348" width="340" height="56" rx="8"/><text class="sh" x="380" y="372" text-anchor="middle">ڈیٹا کا تجزیہ کریں</text><text class="cell" x="380" y="391" text-anchor="middle">کون سا رجحان سامنے آتا ہے؟</text></g><g id="node-clear"><polygon class="panel-b" points="380,424 200,480 380,536 560,480"/><text class="sh" x="380" y="476" text-anchor="middle">کیا جواب</text><text class="sh" x="380" y="494" text-anchor="middle">واضح ہے؟</text></g><g id="node-go"><rect class="panel-a" x="210" y="584" width="340" height="56" rx="28"/><text class="sh" x="380" y="608" text-anchor="middle">فیصلہ کریں</text><text class="cell" x="380" y="626" text-anchor="middle">آگے بڑھیں، خیال بدلیں، یا رک جائیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">مارکیٹ ریسرچ کا ایک چھوٹا چکر</text><text id="label-no" class="small" x="580" y="470" text-anchor="start">نہیں</text><text id="label-yes" class="small" x="368" y="562" text-anchor="end">ہاں</text><text id="label-ask-1" class="small" x="648" y="266" text-anchor="end">بہتر</text><text id="label-ask-2" class="small" x="648" y="288" text-anchor="end">سوال</text><text id="label-ask-3" class="small" x="648" y="310" text-anchor="end">پوچھیں</text><text id="label-key-1" class="small" x="170" y="604" text-anchor="end">ٹوٹی لکیر والا تیر</text><text id="label-key-2" class="small" x="170" y="626" text-anchor="end">واپسی کا راستہ ہے</text><text class="wm" x="12" y="670" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
