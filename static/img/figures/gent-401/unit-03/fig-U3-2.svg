<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four ways to collect data</title><desc id="d">Table of four data-collection methods - survey, interview, observation and secondary data - with a rough cost and what each one reveals, and a note that no single method is enough on its own.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .cell { font-size: 13px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"></g><g id="layer-edges"><line class="grid" x1="24" y1="60" x2="756" y2="60"/><line class="grid" x1="24" y1="100" x2="756" y2="100"/><line class="grid" x1="24" y1="176" x2="756" y2="176"/><line class="grid" x1="24" y1="252" x2="756" y2="252"/><line class="grid" x1="24" y1="328" x2="756" y2="328"/><line class="grid" x1="24" y1="404" x2="756" y2="404"/><line class="grid" x1="24" y1="60" x2="24" y2="404"/><line class="grid" x1="214" y1="60" x2="214" y2="404"/><line class="grid" x1="386" y1="60" x2="386" y2="404"/><line class="grid" x1="756" y1="60" x2="756" y2="404"/></g><g id="layer-nodes"><g id="node-head-method"><text class="sh" x="36" y="86">Method</text></g><g id="node-head-cost"><text class="sh" x="238" y="86">Rough cost</text></g><g id="node-head-reveal"><text class="sh" x="410" y="86">What it reveals</text></g><g id="node-survey"><text class="sh" x="36" y="128">Survey</text><text class="cell" x="36" y="150">ask many people the same</text><text class="cell" x="36" y="167">written questions</text><text class="cell" x="238" y="128">Low; your time</text><text class="cell" x="238" y="150">and printing</text><text class="cell" x="410" y="128">what people say they do and</text><text class="cell" x="410" y="150">want, in numbers you can count</text></g><g id="node-interview"><text class="sh" x="36" y="204">Interview</text><text class="cell" x="36" y="226">sit with one person and ask</text><text class="cell" x="36" y="243">open questions</text><text class="cell" x="238" y="204">Low to medium;</text><text class="cell" x="238" y="226">mostly time</text><text class="cell" x="410" y="204">why people do what they do, and</text><text class="cell" x="410" y="226">what they cannot put on a form</text></g><g id="node-observation"><text class="sh" x="36" y="280">Observation</text><text class="cell" x="36" y="302">watch what people actually</text><text class="cell" x="36" y="319">do, or count them</text><text class="cell" x="238" y="280">Low; time and a</text><text class="cell" x="238" y="302">notebook</text><text class="cell" x="410" y="280">real behaviour, which often</text><text class="cell" x="410" y="302">differs from what people say</text></g><g id="node-secondary"><text class="sh" x="36" y="356">Secondary data</text><text class="cell" x="36" y="378">read figures and reports</text><text class="cell" x="36" y="395">others already published</text><text class="cell" x="238" y="356">Usually free;</text><text class="cell" x="238" y="378">search time</text><text class="cell" x="410" y="356">how big the market is, and what</text><text class="cell" x="410" y="378">has changed over time</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Four ways to collect data</text><text id="label-note-1" class="small" x="24" y="440">No single method is enough on its own. Use at least two,</text><text id="label-note-2" class="small" x="24" y="457">one primary and one secondary, to confirm a finding.</text><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
