<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 538" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کامیاب کاروباری افراد کی خصوصیات کا جدول</title><desc id="d">کامیاب کاروباری افراد کی سات خصوصیات کا جدول، ہر ایک کے ساتھ روزمرہ کا ایسا عمل درج ہے جو اسے ظاہر کرے، جیسے کسی ایسی ضرورت پر غور کرنا جسے دوسرے نظرانداز کر دیں سے لے کر گاہکوں کی شکایات سن کر مصنوعات میں تبدیلی لانا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="538"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="432"/></g><g id="layer-edges"><line class="grid" x1="24" y1="152" x2="756" y2="152"/><line class="grid" x1="24" y1="208" x2="756" y2="208"/><line class="grid" x1="24" y1="264" x2="756" y2="264"/><line class="grid" x1="24" y1="320" x2="756" y2="320"/><line class="grid" x1="24" y1="376" x2="756" y2="376"/><line class="grid" x1="24" y1="432" x2="756" y2="432"/><line class="frame" x1="496" y1="56" x2="496" y2="488"/><line class="frame" x1="24" y1="96" x2="756" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="82" text-anchor="end">خصوصیت</text><text class="sh" x="484" y="82" text-anchor="end">ایسا عمل جو اسے ظاہر کرے</text></g><g id="node-curiosity"><text class="sh" x="744" y="129" text-anchor="end">تجسس اور چوکنا پن</text><text class="body" x="484" y="118" text-anchor="end">ایسی ضرورت پر غور کرنا جسے دوسرے نظرانداز کر دیں، جیسے</text><text class="body" x="484" y="135" text-anchor="end">پریکٹس شیٹس کے بغیر طلبہ</text></g><g id="node-creativity"><text class="sh" x="744" y="185" text-anchor="end">تخلیقیت</text><text class="body" x="484" y="185" text-anchor="end">ضرورت پوری کرنے کے لیے نیا طریقہ سوچنا</text></g><g id="node-persistence"><text class="sh" x="744" y="241" text-anchor="end">ثابت قدمی</text><text class="body" x="484" y="241" text-anchor="end">پہلی کوشش ناکام ہونے کے بعد بھی کام جاری رکھنا</text></g><g id="node-risk"><text class="sh" x="744" y="286" text-anchor="end">سوچے سمجھے خطرات</text><text class="sh" x="744" y="303" text-anchor="end">مول لینے پر آمادگی</text><text class="body" x="484" y="297" text-anchor="end">تمام بچت خرچ کرنے سے پہلے چھوٹے بیچ پر آزمائش کرنا</text></g><g id="node-problem-solving"><text class="sh" x="744" y="353" text-anchor="end">مسئلہ حل کرنا</text><text class="body" x="484" y="353" text-anchor="end">پرنٹنگ کا دن بدل کر ترسیل میں تاخیر کا حل نکالنا</text></g><g id="node-confidence"><text class="sh" x="744" y="409" text-anchor="end">خود اعتمادی</text><text class="body" x="484" y="409" text-anchor="end">ہیڈ ٹیچر کو مصنوعات کی واضح وضاحت کرنا</text></g><g id="node-learning"><text class="sh" x="744" y="465" text-anchor="end">سیکھنے کے لیے آمادگی</text><text class="body" x="484" y="465" text-anchor="end">گاہکوں سے شکایات سننا اور مصنوعات میں بہتری لانا</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کامیاب کاروباری افراد کی خصوصیات اور ان کا عملی اظہار</text><text id="label-caption" class="small" x="756" y="516" text-anchor="end">خصوصیت کا تبھی شمار ہوتا ہے جب کوئی عمل اسے ظاہر کرے۔</text><text class="wm" x="12" y="528" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>