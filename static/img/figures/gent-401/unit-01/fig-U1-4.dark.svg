<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing entrepreneurial and managerial thinking</title><desc id="d">Table comparing entrepreneurial and managerial thinking on goals, risk, resources and decisions, with a note that a growing venture needs both kinds of thinking.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="412"/><g id="layer-regions"><rect id="region-entrepreneurial" class="panel-a" x="184" y="56" width="286" height="44"/><rect id="region-managerial" class="panel-b" x="470" y="56" width="286" height="44"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="300"/></g><g id="layer-edges"><line class="grid" x1="24" y1="164" x2="756" y2="164"/><line class="grid" x1="24" y1="228" x2="756" y2="228"/><line class="grid" x1="24" y1="292" x2="756" y2="292"/><line class="frame" x1="184" y1="56" x2="184" y2="356"/><line class="frame" x1="470" y1="56" x2="470" y2="356"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="84">Dimension</text><text class="sh" x="196" y="84">Entrepreneurial thinking</text><text class="sh" x="482" y="84">Managerial thinking</text></g><g id="node-goals"><text class="sh" x="36" y="137">Goals</text><text class="body" x="196" y="128">Create something new that</text><text class="body" x="196" y="145">meets an unmet need</text><text class="body" x="482" y="128">Run the existing system well</text><text class="body" x="482" y="145">and meet set targets</text></g><g id="node-risk"><text class="sh" x="36" y="201">Risk</text><text class="body" x="196" y="192">Accepts calculated risk and</text><text class="body" x="196" y="209">uncertainty</text><text class="body" x="482" y="192">Reduces risk and avoids</text><text class="body" x="482" y="209">surprises</text></g><g id="node-resources"><text class="sh" x="36" y="265">Resources</text><text class="body" x="196" y="256">Starts from the opportunity</text><text class="body" x="196" y="273">and finds the resources</text><text class="body" x="482" y="256">Starts from the resources</text><text class="body" x="482" y="273">already available</text></g><g id="node-decisions"><text class="sh" x="36" y="329">Decisions</text><text class="body" x="196" y="320">Quick, made with incomplete</text><text class="body" x="196" y="337">information, learns by testing</text><text class="body" x="482" y="320">Careful, follows rules,</text><text class="body" x="482" y="337">procedures and past data</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Entrepreneurial and managerial thinking compared</text><text id="label-note" class="body" x="24" y="388">A growing venture needs both kinds of thinking.</text><text class="wm" x="768" y="402" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
