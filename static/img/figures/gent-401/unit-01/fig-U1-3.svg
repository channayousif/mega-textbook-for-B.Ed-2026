<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 760" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart from a problem to an innovation</title><desc id="d">Flowchart of the steps from a problem to an innovation: notice a problem, ask questions, generate ideas, test a small version, then decide whether it solves the problem; if yes, improve and grow into an innovation that adds value; if no, learn from the test and return to generating ideas.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="760"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-notice-ask" class="stroke" x1="400" y1="116" x2="400" y2="154" marker-end="url(#arrow)"/><line id="edge-ask-generate" class="stroke" x1="400" y1="212" x2="400" y2="250" marker-end="url(#arrow)"/><line id="edge-generate-test" class="stroke" x1="400" y1="308" x2="400" y2="346" marker-end="url(#arrow)"/><line id="edge-test-decide" class="stroke" x1="400" y1="404" x2="400" y2="422" marker-end="url(#arrow)"/><line id="edge-decide-improve" class="stroke" x1="400" y1="536" x2="400" y2="582" marker-end="url(#arrow)"/><line id="edge-improve-end" class="stroke" x1="400" y1="640" x2="400" y2="678" marker-end="url(#arrow)"/><path id="edge-decide-generate" class="stroke" d="M220,480 L80,480 L80,280.0 L228,280.0" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-notice"><rect class="panel-a" x="230" y="60" width="340" height="56" rx="28.0"/><text class="sh" x="400" y="84" text-anchor="middle">Notice a problem</text><text class="cell" x="400" y="103" text-anchor="middle">pupils come to school hungry</text></g><g id="node-ask"><rect class="panel" x="230" y="156" width="340" height="56" rx="8"/><text class="sh" x="400" y="180" text-anchor="middle">Ask questions</text><text class="cell" x="400" y="199" text-anchor="middle">why? who is affected? what do they do now?</text></g><g id="node-generate"><rect class="panel" x="230" y="252" width="340" height="56" rx="8"/><text class="sh" x="400" y="276" text-anchor="middle">Generate ideas</text><text class="cell" x="400" y="295" text-anchor="middle">list many solutions without judging them</text></g><g id="node-test"><rect class="panel" x="230" y="348" width="340" height="56" rx="8"/><text class="sh" x="400" y="372" text-anchor="middle">Test a small version</text><text class="cell" x="400" y="391" text-anchor="middle">sell 20 rolls on two mornings</text></g><g id="node-decide"><polygon class="panel-b" points="400,424 580,480 400,536 220,480"/><text class="sh" x="400" y="476" text-anchor="middle">Does it solve the problem</text><text class="sh" x="400" y="494" text-anchor="middle">for the people who have it?</text></g><g id="node-improve"><rect class="panel" x="230" y="584" width="340" height="56" rx="8"/><text class="sh" x="400" y="608" text-anchor="middle">Improve and grow</text><text class="cell" x="400" y="627" text-anchor="middle">adjust price and filling, sell more</text></g><g id="node-end"><rect class="panel-a" x="230" y="680" width="340" height="48" rx="24"/><text class="sh" x="400" y="709" text-anchor="middle">An innovation that adds value</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">From a problem to an innovation</text><text id="label-no" class="small" x="210" y="470" text-anchor="end">no</text><text id="label-yes" class="small" x="412" y="562">yes</text><text id="label-learn-1" class="small" x="92" y="380">learn from</text><text id="label-learn-2" class="small" x="92" y="397">the test</text><text id="label-key-1" class="small" x="600" y="708">Start and end</text><text id="label-key-2" class="small" x="600" y="725">are rounded.</text><text class="wm" x="768" y="750" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
