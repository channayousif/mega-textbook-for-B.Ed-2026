<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کاروباری اور انتظامی سوچ کا موازنہ</title><desc id="d">مقاصد، خطرہ، وسائل اور فیصلوں کے لحاظ سے کاروباری اور انتظامی سوچ کا موازنہ کرنے والا جدول، اس وضاحت کے ساتھ کہ ترقی کرتے ہوئے کاروباری منصوبے کو دونوں طرح کی سوچ کی ضرورت ہوتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="412"/><g id="layer-regions"><rect id="region-entrepreneurial" class="panel-a" x="310" y="56" width="286" height="44"/><rect id="region-managerial" class="panel-b" x="24" y="56" width="286" height="44"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="300"/></g><g id="layer-edges"><line class="grid" x1="24" y1="164" x2="756" y2="164"/><line class="grid" x1="24" y1="228" x2="756" y2="228"/><line class="grid" x1="24" y1="292" x2="756" y2="292"/><line class="frame" x1="596" y1="56" x2="596" y2="356"/><line class="frame" x1="310" y1="56" x2="310" y2="356"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="84" text-anchor="end">پہلو</text><text class="sh" x="584" y="84" text-anchor="end">کاروباری سوچ</text><text class="sh" x="298" y="84" text-anchor="end">انتظامی سوچ</text></g><g id="node-goals"><text class="sh" x="744" y="137" text-anchor="end">مقاصد</text><text class="body" x="584" y="128" text-anchor="end">کچھ نیا بنانا جو کسی</text><text class="body" x="584" y="145" text-anchor="end">ادھوری ضرورت کو پورا کرے</text><text class="body" x="298" y="128" text-anchor="end">موجودہ نظام کو اچھے انداز میں چلانا</text><text class="body" x="298" y="145" text-anchor="end">اور مقررہ اہداف حاصل کرنا</text></g><g id="node-risk"><text class="sh" x="744" y="201" text-anchor="end">خطرہ</text><text class="body" x="584" y="192" text-anchor="end">سوچے سمجھے خطرے اور</text><text class="body" x="584" y="209" text-anchor="end">غیر یقینی صورتحال کو قبول کرنا</text><text class="body" x="298" y="192" text-anchor="end">خطرہ کم کرنا اور</text><text class="body" x="298" y="209" text-anchor="end">غیر متوقع صورتحال سے بچنا</text></g><g id="node-resources"><text class="sh" x="744" y="265" text-anchor="end">وسائل</text><text class="body" x="584" y="256" text-anchor="end">موقع سے آغاز کرنا اور</text><text class="body" x="584" y="273" text-anchor="end">وسائل تلاش کرنا</text><text class="body" x="298" y="256" text-anchor="end">پہلے سے دستیاب وسائل</text><text class="body" x="298" y="273" text-anchor="end">سے آغاز کرنا</text></g><g id="node-decisions"><text class="sh" x="744" y="329" text-anchor="end">فیصلے</text><text class="body" x="584" y="320" text-anchor="end">نامکمل معلومات کے ساتھ فوری فیصلے،</text><text class="body" x="584" y="337" text-anchor="end">آزمائش سے سیکھنا</text><text class="body" x="298" y="320" text-anchor="end">محتاط، قواعد، طریقہ کار</text><text class="body" x="298" y="337" text-anchor="end">اور ماضی کے اعداد و شمار پر عمل</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کاروباری اور انتظامی سوچ کا موازنہ</text><text id="label-note" class="body" x="756" y="388" text-anchor="end">ترقی کرتے ہوئے کاروباری منصوبے کو دونوں طرح کی سوچ کی ضرورت ہوتی ہے۔</text><text class="wm" x="12" y="402" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>