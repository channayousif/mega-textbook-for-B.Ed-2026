<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ: کاروباری صلاحیت معاشی ترقی کو کیسے آگے بڑھاتی ہے</title><desc id="d">تصوراتی نقشہ جس کے مرکز میں کاروباری صلاحیت ہے جو معاشی ترقی کے پانچ اثرات کی طرف لے جاتی ہے: روزگار، جدت، آمدنی، مقابلہ اور کمیونٹی کی بہبود، ہر ایک کے ساتھ ایک چھوٹی پاکستانی مثال، اور ایک واپسی کا تیر جو ظاہر کرتا ہے کہ نئی ضروریات نئے مواقع پیدا کرتی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-entrepreneurship-jobs" class="stroke" x1="446.1" y1="172.9" x2="524" y2="120" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-innovation" class="stroke" x1="333.9" y1="172.9" x2="256" y2="120" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-income" class="stroke" x1="446.1" y1="247.1" x2="524" y2="300" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-competition" class="stroke" x1="333.9" y1="247.1" x2="256" y2="300" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-welfare" class="stroke" x1="430" y1="249.6" x2="430" y2="438" marker-end="url(#arrow)"/><line id="edge-welfare-entrepreneurship" class="dash" x1="350" y1="440" x2="350" y2="251.6" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-entrepreneurship"><ellipse class="panel-a" cx="390" cy="210" rx="120" ry="42"/><text class="h" x="390" y="216" text-anchor="middle">کاروباری صلاحیت</text></g><g id="node-jobs"><rect class="panel" x="526" y="70" width="230" height="100" rx="8"/><text class="sh" x="744" y="96" text-anchor="end">روزگار</text><text class="cell" x="744" y="118" text-anchor="end">ورک شیٹ کا کاروبار دو مددگاروں</text><text class="cell" x="744" y="135" text-anchor="end">کو ملازمت دیتا ہے</text></g><g id="node-innovation"><rect class="panel" x="24" y="70" width="230" height="100" rx="8"/><text class="sh" x="242" y="96" text-anchor="end">جدت</text><text class="cell" x="242" y="118" text-anchor="end">ایک نئی مصنوع یا کام کا</text><text class="cell" x="242" y="135" text-anchor="end">بہتر طریقہ</text></g><g id="node-income"><rect class="panel" x="526" y="250" width="230" height="100" rx="8"/><text class="sh" x="744" y="276" text-anchor="end">آمدنی</text><text class="cell" x="744" y="298" text-anchor="end">ملازمین کے لیے اجرت، مالک کے لیے</text><text class="cell" x="744" y="315" text-anchor="end">منافع، ریاست کے لیے ٹیکس</text></g><g id="node-competition"><rect class="panel" x="24" y="250" width="230" height="100" rx="8"/><text class="sh" x="242" y="276" text-anchor="end">مقابلہ</text><text class="cell" x="242" y="298" text-anchor="end">گاہک برقرار رکھنے کے لیے دکانیں</text><text class="cell" x="242" y="315" text-anchor="end">معیار اور قیمتیں بہتر بناتی ہیں</text></g><g id="node-welfare"><rect class="panel" x="300" y="440" width="230" height="100" rx="8"/><text class="sh" x="518" y="466" text-anchor="end">کمیونٹی کی بہبود</text><text class="cell" x="518" y="488" text-anchor="end">طلبہ کو سستا تعلیمی مواد</text><text class="cell" x="518" y="505" text-anchor="end">ملتا ہے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کاروباری صلاحیت معاشی ترقی کو کیسے آگے بڑھاتی ہے</text><text id="label-return-1" class="small" x="338" y="382" text-anchor="end">نئی ضروریات نئے</text><text id="label-return-2" class="small" x="338" y="399" text-anchor="end">مواقع پیدا کرتی ہیں</text><text id="label-caption" class="small" x="756" y="572" text-anchor="end">ٹھوس تیر: کاروباری صلاحیت کے اثرات۔ نقطہ دار تیر: آغاز کی طرف واپسی۔</text><text class="wm" x="12" y="580" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>