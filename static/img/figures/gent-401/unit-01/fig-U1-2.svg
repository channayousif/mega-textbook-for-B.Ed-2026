<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 538" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of characteristics of successful entrepreneurs</title><desc id="d">Table of seven characteristics of successful entrepreneurs, each paired with an everyday behaviour that shows it, from noticing a need others walk past to changing a product after listening to customers' complaints.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="538"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="432"/></g><g id="layer-edges"><line class="grid" x1="24" y1="152" x2="756" y2="152"/><line class="grid" x1="24" y1="208" x2="756" y2="208"/><line class="grid" x1="24" y1="264" x2="756" y2="264"/><line class="grid" x1="24" y1="320" x2="756" y2="320"/><line class="grid" x1="24" y1="376" x2="756" y2="376"/><line class="grid" x1="24" y1="432" x2="756" y2="432"/><line class="frame" x1="284" y1="56" x2="284" y2="488"/><line class="frame" x1="24" y1="96" x2="756" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Characteristic</text><text class="sh" x="296" y="82">A behaviour that shows it</text></g><g id="node-curiosity"><text class="sh" x="36" y="129">Curiosity and alertness</text><text class="body" x="296" y="118">Notices a need others walk past, such as pupils</text><text class="body" x="296" y="135">without practice sheets</text></g><g id="node-creativity"><text class="sh" x="36" y="185">Creativity</text><text class="body" x="296" y="185">Thinks of a new way to meet the need</text></g><g id="node-persistence"><text class="sh" x="36" y="241">Persistence</text><text class="body" x="296" y="241">Keeps going after a first attempt fails</text></g><g id="node-risk"><text class="sh" x="36" y="286">Willingness to take</text><text class="sh" x="36" y="303">calculated risks</text><text class="body" x="296" y="297">Tests a small batch before spending all savings</text></g><g id="node-problem-solving"><text class="sh" x="36" y="353">Problem-solving</text><text class="body" x="296" y="353">Fixes a delivery delay by changing the printing day</text></g><g id="node-confidence"><text class="sh" x="36" y="409">Confidence</text><text class="body" x="296" y="409">Explains the product clearly to a head teacher</text></g><g id="node-learning"><text class="sh" x="36" y="465">Openness to learning</text><text class="body" x="296" y="465">Asks customers for complaints and changes the product</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Characteristics of successful entrepreneurs and how they show</text><text id="label-caption" class="small" x="24" y="516">A characteristic counts only when an action shows it.</text><text class="wm" x="768" y="528" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
