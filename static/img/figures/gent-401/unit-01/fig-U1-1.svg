<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of how entrepreneurship drives economic development</title><desc id="d">Concept map showing entrepreneurship at the centre leading to five effects in economic development: jobs, innovation, income, competition and community welfare, each with a small Pakistani example, and a return arrow showing that new community needs create new opportunities.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="590"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-entrepreneurship-jobs" class="stroke" x1="333.9" y1="172.9" x2="256" y2="120.0" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-innovation" class="stroke" x1="446.1" y1="172.9" x2="524" y2="120.0" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-income" class="stroke" x1="333.9" y1="247.1" x2="256" y2="300.0" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-competition" class="stroke" x1="446.1" y1="247.1" x2="524" y2="300.0" marker-end="url(#arrow)"/><line id="edge-entrepreneurship-welfare" class="stroke" x1="350" y1="249.6" x2="350" y2="438" marker-end="url(#arrow)"/><line id="edge-welfare-entrepreneurship" class="dash" x1="430" y1="440" x2="430" y2="251.6" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-entrepreneurship"><ellipse class="panel-a" cx="390" cy="210" rx="120" ry="42"/><text class="h" x="390" y="216" text-anchor="middle">Entrepreneurship</text></g><g id="node-jobs"><rect class="panel" x="24" y="70" width="230" height="100" rx="8"/><text class="sh" x="36" y="96">Jobs</text><text class="cell" x="36" y="118">A worksheet business hires</text><text class="cell" x="36" y="135">two helpers</text></g><g id="node-innovation"><rect class="panel" x="526" y="70" width="230" height="100" rx="8"/><text class="sh" x="538" y="96">Innovation</text><text class="cell" x="538" y="118">A new product or a better</text><text class="cell" x="538" y="135">way of working</text></g><g id="node-income"><rect class="panel" x="24" y="250" width="230" height="100" rx="8"/><text class="sh" x="36" y="276">Income</text><text class="cell" x="36" y="298">Wages for workers, earnings</text><text class="cell" x="36" y="315">for the owner, taxes for</text><text class="cell" x="36" y="332">the state</text></g><g id="node-competition"><rect class="panel" x="526" y="250" width="230" height="100" rx="8"/><text class="sh" x="538" y="276">Competition</text><text class="cell" x="538" y="298">Shops improve quality and</text><text class="cell" x="538" y="315">prices to keep customers</text></g><g id="node-welfare"><rect class="panel" x="250" y="440" width="230" height="100" rx="8"/><text class="sh" x="262" y="466">Community welfare</text><text class="cell" x="262" y="488">Pupils get cheaper learning</text><text class="cell" x="262" y="505">materials</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">How entrepreneurship drives economic development</text><text id="label-return-1" class="small" x="442" y="382">new needs create</text><text id="label-return-2" class="small" x="442" y="399">new opportunities</text><text id="label-caption" class="small" x="24" y="572">Solid arrows: effects of entrepreneurship. Dashed arrow: returns to the start.</text><text class="wm" x="768" y="580" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
