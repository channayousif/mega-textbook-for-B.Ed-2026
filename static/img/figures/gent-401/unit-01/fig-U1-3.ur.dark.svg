<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 760" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مسئلے سے جدت تک کا فلو چارٹ</title><desc id="d">مسئلے سے جدت تک کے مراحل کا فلو چارٹ: مسئلے پر غور کریں، سوالات پوچھیں، خیالات پیدا کریں، چھوٹے پیمانے پر آزمائش کریں، پھر فیصلہ کریں کہ کیا یہ مسئلہ حل کرتا ہے؛ اگر ہاں، تو بہتری اور وسعت لا کر قدر میں اضافہ کرنے والی جدت بنائیں؛ اگر نہیں، تو آزمائش سے سیکھیں اور دوبارہ خیالات پیدا کرنے کی طرف لوٹیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="760"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-notice-ask" class="stroke" x1="380" y1="116" x2="380" y2="154" marker-end="url(#arrow)"/><line id="edge-ask-generate" class="stroke" x1="380" y1="212" x2="380" y2="250" marker-end="url(#arrow)"/><line id="edge-generate-test" class="stroke" x1="380" y1="308" x2="380" y2="346" marker-end="url(#arrow)"/><line id="edge-test-decide" class="stroke" x1="380" y1="404" x2="380" y2="422" marker-end="url(#arrow)"/><line id="edge-decide-improve" class="stroke" x1="380" y1="536" x2="380" y2="582" marker-end="url(#arrow)"/><line id="edge-improve-end" class="stroke" x1="380" y1="640" x2="380" y2="678" marker-end="url(#arrow)"/><path id="edge-decide-generate" class="stroke" d="M560,480 L700,480 L700,280 L552,280" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-notice"><rect class="panel-a" x="210" y="60" width="340" height="56" rx="28"/><text class="sh" x="380" y="84" text-anchor="middle">مسئلے پر غور کریں</text><text class="cell" x="380" y="103" text-anchor="middle">طلبہ بھوکے اسکول آتے ہیں</text></g><g id="node-ask"><rect class="panel" x="210" y="156" width="340" height="56" rx="8"/><text class="sh" x="380" y="180" text-anchor="middle">سوالات پوچھیں</text><text class="cell" x="380" y="199" text-anchor="middle">کیوں؟ کون متاثر ہے؟ وہ اب کیا کرتے ہیں؟</text></g><g id="node-generate"><rect class="panel" x="210" y="252" width="340" height="56" rx="8"/><text class="sh" x="380" y="276" text-anchor="middle">خیالات پیدا کریں</text><text class="cell" x="380" y="295" text-anchor="middle">پرکھے بغیر کئی حل کی فہرست بنائیں</text></g><g id="node-test"><rect class="panel" x="210" y="348" width="340" height="56" rx="8"/><text class="sh" x="380" y="372" text-anchor="middle">چھوٹے پیمانے پر آزمائش کریں</text><text class="cell" x="380" y="391" text-anchor="middle">دو صبحوں میں 20 رول فروخت کریں</text></g><g id="node-decide"><polygon class="panel-b" points="380,424 200,480 380,536 560,480"/><text class="sh" x="380" y="476" text-anchor="middle">کیا یہ ان لوگوں کا مسئلہ حل کرتا ہے</text><text class="sh" x="380" y="494" text-anchor="middle">جنہیں یہ درپیش ہے؟</text></g><g id="node-improve"><rect class="panel" x="210" y="584" width="340" height="56" rx="8"/><text class="sh" x="380" y="608" text-anchor="middle">بہتری اور وسعت لائیں</text><text class="cell" x="380" y="627" text-anchor="middle">قیمت اور فلنگ میں ردوبدل کریں، مزید فروخت کریں</text></g><g id="node-end"><rect class="panel-a" x="210" y="680" width="340" height="48" rx="24"/><text class="sh" x="380" y="709" text-anchor="middle">ایسی جدت جو قدر میں اضافہ کرے</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">مسئلے سے جدت تک کا سفر</text><text id="label-no" class="small" x="570" y="470" text-anchor="start">نہیں</text><text id="label-yes" class="small" x="392" y="562">ہاں</text><text id="label-learn-1" class="small" x="688" y="380" text-anchor="end">آزمائش سے</text><text id="label-learn-2" class="small" x="688" y="397" text-anchor="end">سیکھیں</text><text id="label-key-1" class="small" x="180" y="708" text-anchor="end">آغاز اور انجام</text><text id="label-key-2" class="small" x="180" y="725" text-anchor="end">گول ہیں۔</text><text class="wm" x="12" y="750" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>