<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 782" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart from an idea to an opportunity</title><desc id="d">Flowchart from an idea to an opportunity: generate more ideas, screen each one against three criteria, set aside the ones that fail, test the ones that pass with real customers, and keep only the ideas customers want and will pay for.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="782"/><g id="layer-regions"><rect id="node-aside" class="panel" x="580" y="440" width="180" height="56" rx="8"/></g><g id="layer-edges"><line id="edge-idea-generate" class="stroke" x1="400" y1="108" x2="400" y2="146" marker-end="url(#arrow)"/><line id="edge-generate-screen" class="stroke" x1="400" y1="202" x2="400" y2="240" marker-end="url(#arrow)"/><line id="edge-screen-decide1" class="stroke" x1="400" y1="296" x2="400" y2="314" marker-end="url(#arrow)"/><line id="edge-decide1-test" class="stroke" x1="400" y1="426" x2="400" y2="472" marker-end="url(#arrow)"/><line id="edge-test-decide2" class="stroke" x1="400" y1="528" x2="400" y2="546" marker-end="url(#arrow)"/><line id="edge-decide2-end" class="stroke" x1="400" y1="658" x2="400" y2="704" marker-end="url(#arrow)"/><path id="edge-decide1-aside" class="stroke" d="M580,370 L670,370 L670,438" marker-end="url(#arrow)"/><path id="edge-decide2-generate" class="stroke" d="M220,602 L30,602 L30,174 L228,174" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-idea"><rect class="panel-a" x="230" y="56" width="340" height="52" rx="26"/><text class="sh" x="400" y="79" text-anchor="middle">An idea</text><text class="cell" x="400" y="97" text-anchor="middle">six ideas for the school</text></g><g id="node-generate"><rect class="panel" x="230" y="146" width="340" height="56" rx="8"/><text class="sh" x="400" y="170" text-anchor="middle">Generate more ideas</text><text class="cell" x="400" y="189" text-anchor="middle">brainstorm, crowdsourcing, storyboarding</text></g><g id="node-screen"><rect class="panel" x="230" y="240" width="340" height="56" rx="8"/><text class="sh" x="400" y="264" text-anchor="middle">Screen each idea</text><text class="cell" x="400" y="283" text-anchor="middle">demand, market, margins and resources</text></g><g id="node-decide1"><polygon class="panel-b" points="400,314 580,370 400,426 220,370"/><text class="sh" x="400" y="366" text-anchor="middle">Does it pass the three</text><text class="sh" x="400" y="384" text-anchor="middle">criteria?</text></g><g id="node-test"><rect class="panel" x="230" y="472" width="340" height="56" rx="8"/><text class="sh" x="400" y="496" text-anchor="middle">Test it with real customers</text><text class="cell" x="400" y="515" text-anchor="middle">ask, survey, sell a small batch</text></g><g id="node-decide2"><polygon class="panel-b" points="400,546 580,602 400,658 220,602"/><text class="sh" x="400" y="598" text-anchor="middle">Do customers want it and</text><text class="sh" x="400" y="616" text-anchor="middle">will they pay?</text></g><g id="node-end"><rect class="panel-a" x="230" y="704" width="340" height="48" rx="24"/><text class="sh" x="400" y="733" text-anchor="middle">An opportunity worth planning</text></g><g id="node-aside-text"><text class="cell" x="592" y="464">Put it aside,</text><text class="cell" x="592" y="481">keep the learning</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">From an idea to an opportunity</text><text id="label-yes1" class="small" x="412" y="452">yes</text><text id="label-no1" class="small" x="604" y="360">no</text><text id="label-yes2" class="small" x="412" y="684">yes</text><text id="label-no2" class="small" x="208" y="592">no</text><text id="label-learn" class="small" x="42" y="380">learn and</text><text id="label-learn2" class="small" x="42" y="397">try again</text><text id="label-key" class="small" x="600" y="738">Start and end are rounded.</text><text class="wm" x="768" y="772" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
