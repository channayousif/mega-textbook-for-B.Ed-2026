<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Weighted idea-screening checklist</title><desc id="d">A weighted idea-screening checklist comparing a tuck shop, a plant nursery and a water filter stall on five criteria, with weighted totals of 360, 310 and 340, and a note that the highest score informs the decision rather than replacing judgement.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-total" class="panel-a" x="24" y="296" width="732" height="44"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="284"/></g><g id="layer-edges"><line class="grid" x1="24" y1="136" x2="756" y2="136"/><line class="grid" x1="24" y1="176" x2="756" y2="176"/><line class="grid" x1="24" y1="216" x2="756" y2="216"/><line class="grid" x1="24" y1="256" x2="756" y2="256"/><line class="grid" x1="24" y1="296" x2="756" y2="296"/><line class="frame" x1="194" y1="56" x2="194" y2="340"/><line class="frame" x1="254" y1="56" x2="254" y2="340"/><line class="frame" x1="414" y1="56" x2="414" y2="340"/><line class="frame" x1="574" y1="56" x2="574" y2="340"/><line class="frame" x1="24" y1="96" x2="756" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Criterion</text><text class="sh" x="224" y="82" text-anchor="middle">Weight</text><text class="sh" x="334" y="82" text-anchor="middle">Tuck shop</text><text class="sh" x="494" y="82" text-anchor="middle">Plant nursery</text><text class="sh" x="665" y="82" text-anchor="middle">Water filter stall</text></g><g id="node-demand"><text class="cell" x="36" y="122">Demand</text><text class="cell" x="224" y="122" text-anchor="middle">30</text><text class="cell" x="334" y="122" text-anchor="middle">4</text><text class="cell" x="494" y="122" text-anchor="middle">3</text><text class="cell" x="665" y="122" text-anchor="middle">5</text></g><g id="node-margin"><text class="cell" x="36" y="162">Margin</text><text class="cell" x="224" y="162" text-anchor="middle">25</text><text class="cell" x="334" y="162" text-anchor="middle">2</text><text class="cell" x="494" y="162" text-anchor="middle">4</text><text class="cell" x="665" y="162" text-anchor="middle">4</text></g><g id="node-cost"><text class="cell" x="36" y="202">Low start-up cost</text><text class="cell" x="224" y="202" text-anchor="middle">20</text><text class="cell" x="334" y="202" text-anchor="middle">4</text><text class="cell" x="494" y="202" text-anchor="middle">3</text><text class="cell" x="665" y="202" text-anchor="middle">2</text></g><g id="node-skills"><text class="cell" x="36" y="242">Matches our skills</text><text class="cell" x="224" y="242" text-anchor="middle">15</text><text class="cell" x="334" y="242" text-anchor="middle">4</text><text class="cell" x="494" y="242" text-anchor="middle">2</text><text class="cell" x="665" y="242" text-anchor="middle">2</text></g><g id="node-time"><text class="cell" x="36" y="282">Time to first sale</text><text class="cell" x="224" y="282" text-anchor="middle">10</text><text class="cell" x="334" y="282" text-anchor="middle">5</text><text class="cell" x="494" y="282" text-anchor="middle">3</text><text class="cell" x="665" y="282" text-anchor="middle">2</text></g><g id="node-total"><text class="sh" x="36" y="324">Weighted total</text><text class="sh" x="224" y="324" text-anchor="middle">100</text><text class="sh" x="334" y="324" text-anchor="middle">360</text><text class="sh" x="494" y="324" text-anchor="middle">310</text><text class="sh" x="665" y="324" text-anchor="middle">340</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">A weighted idea-screening checklist</text><text id="label-caption" class="small" x="24" y="372">The highest score informs the decision; it does not replace judgement.</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
