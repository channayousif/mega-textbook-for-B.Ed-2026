<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خیالات کی جانچ کے لیے وزن والی فہرست</title><desc id="d">خیالات کی جانچ کے لیے وزن والی فہرست جو کھانے پینے کی دکان، پودوں کی نرسری اور پانی کے فلٹر کے اسٹال کا پانچ معیارات پر موازنہ کرتی ہے، وزنی مجموعے 360، 310 اور 340 ہیں، اور یہ نوٹ کہ سب سے زیادہ نمبر فیصلے میں مدد دیتے ہیں، سوچ سمجھ کر کیے گئے فیصلے کی جگہ نہیں لیتے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-total" class="panel-a" x="24" y="296" width="732" height="44"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="284"/></g><g id="layer-edges"><line class="grid" x1="756" y1="136" x2="24" y2="136"/><line class="grid" x1="756" y1="176" x2="24" y2="176"/><line class="grid" x1="756" y1="216" x2="24" y2="216"/><line class="grid" x1="756" y1="256" x2="24" y2="256"/><line class="grid" x1="756" y1="296" x2="24" y2="296"/><line class="frame" x1="586" y1="56" x2="586" y2="340"/><line class="frame" x1="526" y1="56" x2="526" y2="340"/><line class="frame" x1="366" y1="56" x2="366" y2="340"/><line class="frame" x1="206" y1="56" x2="206" y2="340"/><line class="frame" x1="756" y1="96" x2="24" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="82" text-anchor="end">معیار</text><text class="sh" x="556" y="82" text-anchor="middle">وزن</text><text class="sh" x="446" y="82" text-anchor="middle">کھانے پینے کی دکان</text><text class="sh" x="286" y="82" text-anchor="middle">پودوں کی نرسری</text><text class="sh" x="115" y="82" text-anchor="middle">پانی کے فلٹر کا اسٹال</text></g><g id="node-demand"><text class="cell" x="744" y="122" text-anchor="end">مانگ</text><text class="cell" x="556" y="122" text-anchor="middle">30</text><text class="cell" x="446" y="122" text-anchor="middle">4</text><text class="cell" x="286" y="122" text-anchor="middle">3</text><text class="cell" x="115" y="122" text-anchor="middle">5</text></g><g id="node-margin"><text class="cell" x="744" y="162" text-anchor="end">منافع</text><text class="cell" x="556" y="162" text-anchor="middle">25</text><text class="cell" x="446" y="162" text-anchor="middle">2</text><text class="cell" x="286" y="162" text-anchor="middle">4</text><text class="cell" x="115" y="162" text-anchor="middle">4</text></g><g id="node-cost"><text class="cell" x="744" y="202" text-anchor="end">آغاز کی کم لاگت</text><text class="cell" x="556" y="202" text-anchor="middle">20</text><text class="cell" x="446" y="202" text-anchor="middle">4</text><text class="cell" x="286" y="202" text-anchor="middle">3</text><text class="cell" x="115" y="202" text-anchor="middle">2</text></g><g id="node-skills"><text class="cell" x="744" y="242" text-anchor="end">ہمارے ہنر سے مطابقت</text><text class="cell" x="556" y="242" text-anchor="middle">15</text><text class="cell" x="446" y="242" text-anchor="middle">4</text><text class="cell" x="286" y="242" text-anchor="middle">2</text><text class="cell" x="115" y="242" text-anchor="middle">2</text></g><g id="node-time"><text class="cell" x="744" y="282" text-anchor="end">پہلی فروخت تک کا وقت</text><text class="cell" x="556" y="282" text-anchor="middle">10</text><text class="cell" x="446" y="282" text-anchor="middle">5</text><text class="cell" x="286" y="282" text-anchor="middle">3</text><text class="cell" x="115" y="282" text-anchor="middle">2</text></g><g id="node-total"><text class="sh" x="744" y="324" text-anchor="end">وزنی مجموعہ</text><text class="sh" x="556" y="324" text-anchor="middle">100</text><text class="sh" x="446" y="324" text-anchor="middle">360</text><text class="sh" x="286" y="324" text-anchor="middle">310</text><text class="sh" x="115" y="324" text-anchor="middle">340</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">خیالات کی جانچ کے لیے وزن والی فہرست</text><text id="label-caption" class="small" x="756" y="372" text-anchor="end">سب سے زیادہ نمبر فیصلے میں مدد دیتے ہیں؛ سوچ سمجھ کر کیے گئے فیصلے کی جگہ نہیں لیتے۔</text><text class="wm" x="12" y="390" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
