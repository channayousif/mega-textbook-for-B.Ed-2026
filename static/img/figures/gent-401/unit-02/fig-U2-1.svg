<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 415" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing a small business, a scalable start-up and a social enterprise</title><desc id="d">Table comparing a small business, a scalable start-up and a social enterprise on main aim, growth, money and a Pakistani example, with a note that all three are entrepreneurship.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="415"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="289"/></g><g id="layer-edges"><line class="grid" x1="24" y1="154" x2="756" y2="154"/><line class="grid" x1="24" y1="212" x2="756" y2="212"/><line class="grid" x1="24" y1="270" x2="756" y2="270"/><line class="grid" x1="24" y1="345" x2="756" y2="345"/><line class="frame" x1="190" y1="56" x2="190" y2="345"/><line class="frame" x1="380" y1="56" x2="380" y2="345"/><line class="frame" x1="570" y1="56" x2="570" y2="345"/><line class="frame" x1="24" y1="96" x2="756" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Form</text><text class="sh" x="202" y="82">Small business</text><text class="sh" x="392" y="82">Scalable start-up</text><text class="sh" x="582" y="82">Social enterprise</text></g><g id="node-aim"><text class="sh" x="36" y="121">Main aim</text><text class="cell" x="202" y="121">Earn a living for the</text><text class="cell" x="202" y="138">owner and family</text><text class="cell" x="392" y="121">Grow fast and reach</text><text class="cell" x="392" y="138">many customers</text><text class="cell" x="582" y="121">Meet a social or</text><text class="cell" x="582" y="138">environmental need</text></g><g id="node-growth"><text class="sh" x="36" y="179">Growth</text><text class="cell" x="202" y="179">Stays small and local</text><text class="cell" x="392" y="179">Aims to grow quickly</text><text class="cell" x="582" y="179">Grows only as far as</text><text class="cell" x="582" y="196">the mission needs</text></g><g id="node-money"><text class="sh" x="36" y="237">Money</text><text class="cell" x="202" y="237">Owner's savings and</text><text class="cell" x="202" y="254">small loans</text><text class="cell" x="392" y="237">Outside investors and</text><text class="cell" x="392" y="254">reinvested profit</text><text class="cell" x="582" y="237">Sales income plus</text><text class="cell" x="582" y="254">grants</text></g><g id="node-example"><text class="sh" x="36" y="295">Pakistani</text><text class="sh" x="36" y="312">example</text><text class="cell" x="202" y="295">A general store in a</text><text class="cell" x="202" y="312">bazaar</text><text class="cell" x="392" y="295">A phone-repair</text><text class="cell" x="392" y="312">business with branches</text><text class="cell" x="392" y="329">in three towns</text><text class="cell" x="582" y="295">A tailoring centre</text><text class="cell" x="582" y="312">that trains</text><text class="cell" x="582" y="329">out-of-school girls</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Three forms of entrepreneurship</text><text id="label-caption" class="small" x="24" y="373">All three are entrepreneurship. The difference is the aim, the growth and the money.</text><text class="wm" x="768" y="405" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
