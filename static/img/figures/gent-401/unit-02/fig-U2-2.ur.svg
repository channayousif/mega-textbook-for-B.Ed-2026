<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کاروباریت کی اقسام کا تصوراتی نقشہ</title><desc id="d">تصوراتی نقشہ جس کے مرکز میں کاروباریت ہے اور اس کے گرد پانچ اقسام ہیں: چھوٹا کاروبار، قابل توسیع اسٹارٹ اپ، سماجی کاروباری ادارہ، اندرونی کاروباریت اور خواتین کی کاروباریت، اور یہ دکھایا گیا ہے کہ خواتین کی کاروباریت اور اندرونی کاروباریت دوسری اقسام کے ساتھ مل سکتی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"><ellipse id="region-centre" class="panel-a" cx="390" cy="300" rx="105" ry="58"/></g><g id="layer-edges"><line id="edge-small-centre" class="stroke" x1="570" y1="275" x2="492" y2="288" marker-end="url(#arrow)"/><line id="edge-startup-centre" class="stroke" x1="210" y1="275" x2="288" y2="288" marker-end="url(#arrow)"/><line id="edge-social-centre" class="stroke" x1="570" y1="430" x2="458" y2="348" marker-end="url(#arrow)"/><line id="edge-intra-centre" class="stroke" x1="390" y1="140" x2="390" y2="238" marker-end="url(#arrow)"/><line id="edge-women-centre" class="stroke" x1="390" y1="540" x2="390" y2="362" marker-end="url(#arrow)"/><path id="edge-women-social" class="dash" d="M450 540 C480 500 520 470 535 432" marker-end="url(#arrow)"/><path id="edge-intra-small" class="dash" d="M450 95 C480 140 560 190 628 228" marker-end="url(#arrow)"/><path id="edge-intra-startup" class="dash" d="M330 95 C300 140 220 190 142 228" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-centre"><text class="h" x="390" y="306" text-anchor="middle">کاروباریت</text></g><g id="node-small"><rect class="panel" x="570" y="230" width="180" height="90" rx="8"/><text class="sh" x="738" y="254" text-anchor="end">چھوٹا کاروبار</text><text class="cell" x="738" y="278" text-anchor="end">مقامی بازار،</text><text class="cell" x="738" y="302" text-anchor="end">مالک کی آمدنی</text></g><g id="node-startup"><rect class="panel" x="30" y="230" width="180" height="90" rx="8"/><text class="sh" x="198" y="254" text-anchor="end">قابل توسیع اسٹارٹ اپ</text><text class="cell" x="198" y="278" text-anchor="end">تیز ترقی،</text><text class="cell" x="198" y="302" text-anchor="end">باہر کا پیسہ</text></g><g id="node-social"><rect class="panel" x="480" y="430" width="180" height="90" rx="8"/><text class="sh" x="648" y="454" text-anchor="end">سماجی کاروباری ادارہ</text><text class="cell" x="648" y="478" text-anchor="end">سماجی مقصد،</text><text class="cell" x="648" y="502" text-anchor="end">کمائی ہوئی آمدنی</text></g><g id="node-intra"><rect class="panel-b" x="300" y="50" width="180" height="90" rx="8"/><text class="sh" x="468" y="74" text-anchor="end">اندرونی کاروباریت</text><text class="cell" x="468" y="98" text-anchor="end">کسی موجودہ ادارے</text><text class="cell" x="468" y="122" text-anchor="end">کے اندر</text></g><g id="node-women"><rect class="panel-b" x="300" y="540" width="180" height="90" rx="8"/><text class="sh" x="468" y="566" text-anchor="end">خواتین کی کاروباریت</text><text class="cell" x="468" y="590" text-anchor="end">خواتین شروع کرتی</text><text class="cell" x="468" y="614" text-anchor="end">اور چلاتی ہیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کاروباریت کی اقسام</text><text id="label-caption" class="small" x="756" y="645" text-anchor="end">کٹی ہوئی لکیروں والے تیر: یہ دو اقسام باقی کسی بھی قسم کے اندر ہو سکتی ہیں۔</text><text class="wm" x="12" y="650" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
