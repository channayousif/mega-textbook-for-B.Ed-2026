<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 782" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خیال سے موقع تک کا فلو چارٹ</title><desc id="d">خیال سے موقع تک کا فلو چارٹ: مزید خیالات پیدا کریں، ہر ایک کو تین معیارات پر جانچیں، ناکام ہونے والوں کو الگ رکھ دیں، کامیاب ہونے والوں کو حقیقی گاہکوں کے ساتھ آزمائیں، اور صرف وہ خیالات رکھیں جو گاہک چاہتے ہیں اور جن کے لیے وہ پیسے دیں گے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="782"/><g id="layer-regions"><rect id="node-aside" class="panel" x="20" y="440" width="180" height="56" rx="8"/></g><g id="layer-edges"><line id="edge-idea-generate" class="stroke" x1="380" y1="108" x2="380" y2="146" marker-end="url(#arrow)"/><line id="edge-generate-screen" class="stroke" x1="380" y1="202" x2="380" y2="240" marker-end="url(#arrow)"/><line id="edge-screen-decide1" class="stroke" x1="380" y1="296" x2="380" y2="314" marker-end="url(#arrow)"/><line id="edge-decide1-test" class="stroke" x1="380" y1="426" x2="380" y2="472" marker-end="url(#arrow)"/><line id="edge-test-decide2" class="stroke" x1="380" y1="528" x2="380" y2="546" marker-end="url(#arrow)"/><line id="edge-decide2-end" class="stroke" x1="380" y1="658" x2="380" y2="704" marker-end="url(#arrow)"/><path id="edge-decide1-aside" class="stroke" d="M200 370 L110 370 L110 438" marker-end="url(#arrow)"/><path id="edge-decide2-generate" class="stroke" d="M560 602 L750 602 L750 174 L552 174" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-idea"><rect class="panel-a" x="210" y="56" width="340" height="52" rx="26"/><text class="sh" x="380" y="77" text-anchor="middle">ایک خیال</text><text class="cell" x="380" y="100" text-anchor="middle">اسکول کے لیے چھ خیالات</text></g><g id="node-generate"><rect class="panel" x="210" y="146" width="340" height="56" rx="8"/><text class="sh" x="380" y="168" text-anchor="middle">مزید خیالات پیدا کریں</text><text class="cell" x="380" y="193" text-anchor="middle">ذہنی طوفان، کراؤڈ سورسنگ، اسٹوری بورڈنگ</text></g><g id="node-screen"><rect class="panel" x="210" y="240" width="340" height="56" rx="8"/><text class="sh" x="380" y="262" text-anchor="middle">ہر خیال کی جانچ کریں</text><text class="cell" x="380" y="287" text-anchor="middle">مانگ، بازار، منافع اور وسائل</text></g><g id="node-decide1"><polygon class="panel-b" points="380,314 200,370 380,426 560,370"/><text class="sh" x="380" y="362" text-anchor="middle">کیا یہ تینوں معیارات</text><text class="sh" x="380" y="386" text-anchor="middle">پر پورا اترتا ہے؟</text></g><g id="node-test"><rect class="panel" x="210" y="472" width="340" height="56" rx="8"/><text class="sh" x="380" y="494" text-anchor="middle">اسے حقیقی گاہکوں کے ساتھ آزمائیں</text><text class="cell" x="380" y="519" text-anchor="middle">پوچھیں، سروے کریں، تھوڑا سا مال بیچیں</text></g><g id="node-decide2"><polygon class="panel-b" points="380,546 200,602 380,658 560,602"/><text class="sh" x="380" y="594" text-anchor="middle">کیا گاہک اسے چاہتے ہیں اور</text><text class="sh" x="380" y="618" text-anchor="middle">کیا وہ پیسے دیں گے؟</text></g><g id="node-end"><rect class="panel-a" x="210" y="704" width="340" height="48" rx="24"/><text class="sh" x="380" y="732" text-anchor="middle">منصوبہ بندی کے لائق ایک موقع</text></g><g id="node-aside-text"><text class="cell" x="188" y="462" text-anchor="end">اسے الگ رکھ دیں،</text><text class="cell" x="188" y="486" text-anchor="end">سیکھی ہوئی بات یاد رکھیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">خیال سے موقع تک</text><text id="label-yes1" class="small" x="368" y="452" text-anchor="end">ہاں</text><text id="label-no1" class="small" x="176" y="360" text-anchor="end">نہیں</text><text id="label-yes2" class="small" x="368" y="684" text-anchor="end">ہاں</text><text id="label-no2" class="small" x="620" y="592" text-anchor="end">نہیں</text><text id="label-learn" class="small" x="738" y="378" text-anchor="end">سیکھیں اور</text><text id="label-learn2" class="small" x="738" y="400" text-anchor="end">دوبارہ کوشش کریں</text><text id="label-key" class="small" x="180" y="738" text-anchor="end">آغاز اور اختتام گول ہیں۔</text><text class="wm" x="12" y="772" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
