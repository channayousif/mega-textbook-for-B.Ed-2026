<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 415" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھوٹے کاروبار، قابل توسیع اسٹارٹ اپ اور سماجی کاروباری ادارے کا موازنہ کرنے والا جدول</title><desc id="d">چھوٹے کاروبار، قابل توسیع اسٹارٹ اپ اور سماجی کاروباری ادارے کا بنیادی مقصد، ترقی، پیسے اور ایک پاکستانی مثال کے لحاظ سے موازنہ کرنے والا جدول، اور یہ نوٹ کہ تینوں کاروباریت ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="415"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="289"/></g><g id="layer-edges"><line class="grid" x1="756" y1="154" x2="24" y2="154"/><line class="grid" x1="756" y1="212" x2="24" y2="212"/><line class="grid" x1="756" y1="270" x2="24" y2="270"/><line class="grid" x1="756" y1="345" x2="24" y2="345"/><line class="frame" x1="590" y1="56" x2="590" y2="345"/><line class="frame" x1="400" y1="56" x2="400" y2="345"/><line class="frame" x1="210" y1="56" x2="210" y2="345"/><line class="frame" x1="756" y1="96" x2="24" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="82" text-anchor="end">قسم</text><text class="sh" x="578" y="82" text-anchor="end">چھوٹا کاروبار</text><text class="sh" x="388" y="82" text-anchor="end">قابل توسیع اسٹارٹ اپ</text><text class="sh" x="198" y="82" text-anchor="end">سماجی کاروباری ادارہ</text></g><g id="node-aim"><text class="sh" x="744" y="121" text-anchor="end">بنیادی مقصد</text><text class="cell" x="578" y="119" text-anchor="end">مالک اور خاندان کے لیے</text><text class="cell" x="578" y="142" text-anchor="end">روزی کمانا</text><text class="cell" x="388" y="119" text-anchor="end">تیزی سے بڑھنا اور</text><text class="cell" x="388" y="142" text-anchor="end">بہت سے گاہکوں تک پہنچنا</text><text class="cell" x="198" y="119" text-anchor="end">کسی سماجی یا ماحولیاتی</text><text class="cell" x="198" y="142" text-anchor="end">ضرورت پوری کرنا</text></g><g id="node-growth"><text class="sh" x="744" y="179" text-anchor="end">ترقی</text><text class="cell" x="578" y="179" text-anchor="end">چھوٹا اور مقامی رہتا ہے</text><text class="cell" x="388" y="179" text-anchor="end">تیزی سے بڑھنے کا مقصد</text><text class="cell" x="198" y="177" text-anchor="end">اتنا ہی بڑھتا ہے جتنا</text><text class="cell" x="198" y="200" text-anchor="end">مقصد کو ضرورت ہو</text></g><g id="node-money"><text class="sh" x="744" y="237" text-anchor="end">پیسہ</text><text class="cell" x="578" y="235" text-anchor="end">مالک کی بچت اور</text><text class="cell" x="578" y="258" text-anchor="end">چھوٹے قرض</text><text class="cell" x="388" y="235" text-anchor="end">بیرونی سرمایہ کار اور</text><text class="cell" x="388" y="258" text-anchor="end">دوبارہ لگایا گیا منافع</text><text class="cell" x="198" y="235" text-anchor="end">فروخت کی آمدنی اور</text><text class="cell" x="198" y="258" text-anchor="end">امدادی رقم</text></g><g id="node-example"><text class="sh" x="744" y="294" text-anchor="end">پاکستانی</text><text class="sh" x="744" y="318" text-anchor="end">مثال</text><text class="cell" x="578" y="294" text-anchor="end">بازار میں پرچون کی</text><text class="cell" x="578" y="318" text-anchor="end">دکان</text><text class="cell" x="388" y="294" text-anchor="end">فون کی مرمت کا کاروبار،</text><text class="cell" x="388" y="318" text-anchor="end">تین قصبوں میں شاخیں</text><text class="cell" x="198" y="294" text-anchor="end">اسکول سے باہر لڑکیوں کی</text><text class="cell" x="198" y="318" text-anchor="end">تربیت کا سلائی مرکز</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کاروباریت کی تین اقسام</text><text id="label-caption" class="small" x="756" y="373" text-anchor="end">تینوں کاروباریت ہیں۔ فرق مقصد، ترقی اور پیسے کا ہے۔</text><text class="wm" x="12" y="405" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>
