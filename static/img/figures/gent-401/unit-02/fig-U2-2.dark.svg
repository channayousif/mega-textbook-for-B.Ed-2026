<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the forms of entrepreneurship</title><desc id="d">Concept map placing entrepreneurship at the centre with five forms around it: small business, scalable start-up, social enterprise, intrapreneurship and women's entrepreneurship, showing that women's entrepreneurship and intrapreneurship can overlap with the other forms.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"><ellipse id="region-centre" class="panel-a" cx="390" cy="300" rx="105" ry="58"/></g><g id="layer-edges"><line id="edge-small-centre" class="stroke" x1="210" y1="275" x2="288" y2="288" marker-end="url(#arrow)"/><line id="edge-startup-centre" class="stroke" x1="570" y1="275" x2="492" y2="288" marker-end="url(#arrow)"/><line id="edge-social-centre" class="stroke" x1="210" y1="430" x2="322" y2="348" marker-end="url(#arrow)"/><line id="edge-intra-centre" class="stroke" x1="390" y1="140" x2="390" y2="238" marker-end="url(#arrow)"/><line id="edge-women-centre" class="stroke" x1="390" y1="540" x2="390" y2="362" marker-end="url(#arrow)"/><path id="edge-women-social" class="dash" d="M330,540 C300,500 260,470 245,432" marker-end="url(#arrow)"/><path id="edge-intra-small" class="dash" d="M330,95 C300,140 220,190 152,228" marker-end="url(#arrow)"/><path id="edge-intra-startup" class="dash" d="M450,95 C480,140 560,190 638,228" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-centre"><text class="h" x="390" y="306" text-anchor="middle">Entrepreneurship</text></g><g id="node-small"><rect class="panel" x="30" y="230" width="180" height="90" rx="8"/><text class="sh" x="42" y="256">Small business</text><text class="cell" x="42" y="275">local market,</text><text class="cell" x="42" y="292">owner's income</text></g><g id="node-startup"><rect class="panel" x="570" y="230" width="180" height="90" rx="8"/><text class="sh" x="582" y="256">Scalable start-up</text><text class="cell" x="582" y="275">fast growth,</text><text class="cell" x="582" y="292">outside money</text></g><g id="node-social"><rect class="panel" x="120" y="430" width="180" height="90" rx="8"/><text class="sh" x="132" y="456">Social enterprise</text><text class="cell" x="132" y="475">social cause,</text><text class="cell" x="132" y="492">earned income</text></g><g id="node-intra"><rect class="panel-b" x="300" y="50" width="180" height="90" rx="8"/><text class="sh" x="312" y="76">Intrapreneurship</text><text class="cell" x="312" y="95">inside an existing</text><text class="cell" x="312" y="112">organisation</text></g><g id="node-women"><rect class="panel-b" x="300" y="540" width="180" height="90" rx="8"/><text class="sh" x="312" y="566">Women's</text><text class="sh" x="312" y="583">entrepreneurship</text><text class="cell" x="312" y="602">started and run</text><text class="cell" x="312" y="619">by women</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Forms of entrepreneurship</text><text id="label-caption" class="small" x="24" y="645">Dashed arrows: these two forms can sit inside any of the others.</text><text class="wm" x="768" y="650" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
