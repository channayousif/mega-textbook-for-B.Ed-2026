<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھوٹے تعلیمی منصوبے کا روزمرہ عملیاتی بہاؤ</title><desc id="d">فلو چارٹ جس میں گاہک کے آرڈر سے لے کر ترسیل تک چھوٹے ادارے کے روزمرہ عملیات دکھائے گئے ہیں، بشمول کوالٹی کنٹرول کی جانچ، روانگی اور فیڈ بیک لوپ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="720"/><g id="layer-regions"></g><g id="layer-edges"><line class="stroke" x1="390" y1="112" x2="390" y2="142" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="200" x2="390" y2="230" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="288" x2="390" y2="318" marker-end="url(#arrow)"/><path class="stroke" d="M570,370 L680,370 L680,260 L572,260" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="420" x2="390" y2="452" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="510" x2="390" y2="540" marker-end="url(#arrow)"/><path class="dash" d="M210,570 L100,570 L100,172 L208,172" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-step1"><rect class="panel-a" x="210" y="56" width="360" height="56" rx="28"/><text class="sh" x="390" y="80" text-anchor="middle">۱. آرڈر کی وصولی اور اندراج</text><text class="cell" x="390" y="98" text-anchor="middle">اسکول آرڈر دیتا ہے؛ تعداد اور ادائیگی کی تصدیق</text></g><g id="node-step2"><rect class="panel" x="210" y="144" width="360" height="56" rx="8"/><text class="sh" x="390" y="168" text-anchor="middle">۲. انوینٹری اور پرزوں کی جانچ</text><text class="cell" x="390" y="186" text-anchor="middle">اسٹاک میں سرگرمی کارڈز، ڈبے اور اوزار چیک کریں</text></g><g id="node-step3"><rect class="panel" x="210" y="232" width="360" height="56" rx="8"/><text class="sh" x="390" y="256" text-anchor="middle">۳. تیاری اور پیکنگ</text><text class="cell" x="390" y="274" text-anchor="middle">تصدیق شدہ پیکنگ لسٹ کے مطابق کٹ کا سامان پیک کریں</text></g><g id="node-decision"><polygon class="panel-b" points="390,320 570,370 390,420 210,370"/><text class="sh" x="390" y="365" text-anchor="middle">۴. معیار کی جانچ</text><text class="cell" x="390" y="383" text-anchor="middle">کیا پیکٹ مطلوبہ معیار پر پورا اترتا ہے؟</text></g><g id="node-step5"><rect class="panel" x="210" y="454" width="360" height="56" rx="8"/><text class="sh" x="390" y="478" text-anchor="middle">۵. روانگی اور ترسیل</text><text class="cell" x="390" y="496" text-anchor="middle">ڈلیوری سروس کے حوالے کریں؛ اسکول کو ٹریکنگ نمبر بھیجیں</text></g><g id="node-step6"><rect class="panel-a" x="210" y="542" width="360" height="56" rx="28"/><text class="sh" x="390" y="566" text-anchor="middle">۶. گاہک کی تصدیق اور تاثرات</text><text class="cell" x="390" y="584" text-anchor="middle">ترسیل کی تصدیق کریں؛ بہتری کے لیے استاد کی رائے درج کریں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">چھوٹے تعلیمی منصوبے کا روزمرہ عملیاتی بہاؤ</text><text id="label-no-1" class="small" x="690" y="338" text-anchor="start">نہیں: واپس</text><text id="label-no-2" class="small" x="690" y="354" text-anchor="start">تیاری کی طرف</text><text id="label-yes" class="small" x="390" y="438" text-anchor="middle">ہاں: منظور شدہ</text><text id="label-feed-1" class="small" x="24" y="358" text-anchor="start">انوینٹری کے لیے</text><text id="label-feed-2" class="small" x="24" y="374" text-anchor="start">مسلسل تاثرات کا</text><text id="label-feed-3" class="small" x="24" y="390" text-anchor="start">دائرہ (لوپ)</text><text id="label-caption" class="small" x="756" y="675" text-anchor="end">ہر آرڈر روانگی سے پہلے معیار کی سخت جانچ کے ساتھ ایک مخصوص راستے سے گزرتا ہے۔</text><text class="wm" x="12" y="705" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
