<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصور اور مقصد کے بیانات کا تقابلی جدول</title><desc id="d">پانچ پہلوؤں پر تصور اور مقصد کے بیانات کا تقابلی جدول، بشمول سندھ کے ایک تعلیمی منصوبے کے لیے واضح متضاد مثالیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="374"/></g><g id="layer-edges"><line class="grid" x1="24" y1="156" x2="756" y2="156"/><line class="grid" x1="24" y1="216" x2="756" y2="216"/><line class="grid" x1="24" y1="276" x2="756" y2="276"/><line class="grid" x1="24" y1="346" x2="756" y2="346"/><line class="frame" x1="616" y1="56" x2="616" y2="430"/><line class="frame" x1="320" y1="56" x2="320" y2="430"/><line class="frame" x1="24" y1="96" x2="756" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="82" text-anchor="end">بنیادی پہلو</text><text class="sh" x="604" y="82" text-anchor="end">تصور کا بیان</text><text class="sh" x="308" y="82" text-anchor="end">مقصد کا بیان</text></g><g id="node-focus"><text class="sh" x="744" y="124" text-anchor="end">مرکزی توجہ</text><text class="cell" x="604" y="120" text-anchor="end">مستقبل کی منزل: ادارہ طویل مدت میں</text><text class="cell" x="604" y="137" text-anchor="end">کیا بننا چاہتا ہے</text><text class="cell" x="308" y="120" text-anchor="end">موجودہ مقصد: ادارہ آج کیا کام کرتا ہے</text><text class="cell" x="308" y="137" text-anchor="end">اور کن افراد کی خدمت کرتا ہے</text></g><g id="node-time"><text class="sh" x="744" y="184" text-anchor="end">وقت کا دائرہ</text><text class="cell" x="604" y="180" text-anchor="end">طویل مدتی: ۵ سے ۱۰ سال یا ایک</text><text class="cell" x="604" y="197" text-anchor="end">پائیدار اور بلند نظر منزل</text><text class="cell" x="308" y="180" text-anchor="end">فوری اور جاری: جو روزمرہ کے</text><text class="cell" x="308" y="197" text-anchor="end">عملیاتی کاموں کی رہنمائی کرے</text></g><g id="node-question"><text class="sh" x="744" y="244" text-anchor="end">کلیدی سوال</text><text class="cell" x="604" y="240" text-anchor="end">”ہم مستقبل میں اپنے کام کو</text><text class="cell" x="604" y="257" text-anchor="end">کس مقام پر لے جانا چاہتے ہیں؟“</text><text class="cell" x="308" y="240" text-anchor="end">”ہم کون ہیں، کیا پیش کرتے ہیں،</text><text class="cell" x="308" y="257" text-anchor="end">اور خریداروں کی خدمت کیسے کرتے ہیں؟“</text></g><g id="node-weak"><text class="sh" x="744" y="304" text-anchor="end">کمزور مثال</text><text class="cell" x="604" y="300" text-anchor="end">”پاکستان کا سب سے مشہور تعلیمی</text><text class="cell" x="604" y="317" text-anchor="end">ادارہ بننا۔“</text><text class="cell" x="308" y="300" text-anchor="end">”ہم اسکولوں کو کٹس بیچتے ہیں</text><text class="cell" x="308" y="317" text-anchor="end">اور اچھا منافع کماتے ہیں۔“</text></g><g id="node-strong"><text class="sh" x="744" y="372" text-anchor="end">مضبوط مثال</text><text class="sh" x="744" y="389" text-anchor="end">(سندھ کا منصوبہ)</text><text class="cell" x="604" y="368" text-anchor="end">”ایسا سندھ جہاں پرائمری کا ہر بچہ</text><text class="cell" x="604" y="385" text-anchor="end">اپنی کلاس میں عملی کٹس کے ذریعے</text><text class="cell" x="604" y="402" text-anchor="end">سائنس دریافت کرے۔“</text><text class="cell" x="308" y="368" text-anchor="end">”ہم سندھ کے دیہی اسکولوں کو نصاب سے</text><text class="cell" x="308" y="385" text-anchor="end">ہم آہنگ، سستی سائنس کٹس اور اساتذہ</text><text class="cell" x="308" y="402" text-anchor="end">کی عملی گائیڈز فراہم کرتے ہیں۔“</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">تصور اور مقصد کے بیانات کا تقابلی جدول</text><text id="label-caption" class="small" x="756" y="456" text-anchor="end">تصور حتمی منزل کا جذبہ ابھارتا ہے؛ مقصد ہفتہ وار وسائل اور عملے کی کوششوں کو سمت دیتا ہے۔</text><text class="wm" x="12" y="475" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
