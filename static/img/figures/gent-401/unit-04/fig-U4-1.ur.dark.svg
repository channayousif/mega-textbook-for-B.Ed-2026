<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کاروباری منصوبے کے معیاری اجزاء بلحاظ ترتیب</title><desc id="d">ڈایاگرام جس میں ایک کاروباری منصوبے کے نو معیاری حصے انتظامی خلاصے سے لے کر ضمیمہ جات تک منطقی ترتیب میں دکھائے گئے ہیں، اور یہ واضح کیا گیا ہے کہ انتظامی خلاصہ سب سے پہلے رکھا جاتا ہے لیکن سب کے بعد لکھا جاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="callout-box" class="panel-b" x="24" y="52" width="732" height="42" rx="6"/></g><g id="layer-edges"><line class="stroke" x1="528" y1="152" x2="504" y2="152" marker-end="url(#arrow)"/><line class="stroke" x1="276" y1="152" x2="252" y2="152" marker-end="url(#arrow)"/><path class="stroke" d="M138,198 L138,216 L642,216 L642,228" marker-end="url(#arrow)"/><line class="stroke" x1="528" y1="268" x2="504" y2="268" marker-end="url(#arrow)"/><line class="stroke" x1="276" y1="268" x2="252" y2="268" marker-end="url(#arrow)"/><path class="stroke" d="M138,308 L138,324 L642,324 L642,336" marker-end="url(#arrow)"/><line class="stroke" x1="528" y1="376" x2="504" y2="376" marker-end="url(#arrow)"/><line class="stroke" x1="276" y1="376" x2="252" y2="376" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-callout"><text class="sh" x="744" y="78" text-anchor="end">بنیادی اصول: انتظامی خلاصہ سب سے پہلے رکھا جاتا ہے، مگر تمام دیگر حصوں کے بعد آخر میں تیار کیا جاتا ہے۔</text></g><g id="node-s1"><rect class="panel-a" x="528" y="108" width="228" height="88" rx="8"/><text class="sh" x="744" y="132" text-anchor="end">۱. انتظامی خلاصہ</text><text class="cell" x="744" y="152" text-anchor="end">مسئلے، حل، مارکیٹ اور ٹیم کا</text><text class="cell" x="744" y="169" text-anchor="end">مختصر جائزہ (منصوبے کی تکمیل</text><text class="cell" x="744" y="186" text-anchor="end">کے بعد سب کے آخر میں تحریر)</text></g><g id="node-s2"><rect class="panel" x="276" y="108" width="228" height="88" rx="8"/><text class="sh" x="492" y="132" text-anchor="end">۲. کمپنی کا تعارف</text><text class="cell" x="492" y="152" text-anchor="end">مقصد، تصور، بنیادی اقدار،</text><text class="cell" x="492" y="169" text-anchor="end">ملکیت، قانونی حیثیت اور قیام کا</text><text class="cell" x="492" y="186" text-anchor="end">پس منظر</text></g><g id="node-s3"><rect class="panel" x="24" y="108" width="228" height="88" rx="8"/><text class="sh" x="240" y="132" text-anchor="end">۳. مصنوعات اور خدمات</text><text class="cell" x="240" y="152" text-anchor="end">آپ کیا پیش کرتے ہیں، گاہکوں</text><text class="cell" x="240" y="169" text-anchor="end">کے فوائد، انفرادیت، اور ملکیتی</text><text class="cell" x="240" y="186" text-anchor="end">ڈیزائن</text></g><g id="node-s4"><rect class="panel" x="528" y="232" width="228" height="88" rx="8"/><text class="sh" x="744" y="256" text-anchor="end">۴. مارکیٹ کا تجزیہ</text><text class="cell" x="744" y="276" text-anchor="end">ہدف گاہک، مارکیٹ کا حجم،</text><text class="cell" x="744" y="293" text-anchor="end">خریداروں کی عادات اور حریفوں</text><text class="cell" x="744" y="310" text-anchor="end">کی طاقت</text></g><g id="node-s5"><rect class="panel" x="276" y="232" width="228" height="88" rx="8"/><text class="sh" x="492" y="256" text-anchor="end">۵. مارکیٹنگ اور فروخت</text><text class="cell" x="492" y="276" text-anchor="end">قیمت کی حکمت عملی، فروخت کے</text><text class="cell" x="492" y="293" text-anchor="end">ذرائع، تشہیری منصوبہ اور گاہکوں</text><text class="cell" x="492" y="310" text-anchor="end">کی خدمت</text></g><g id="node-s6"><rect class="panel" x="24" y="232" width="228" height="88" rx="8"/><text class="sh" x="240" y="256" text-anchor="end">۶. عملیاتی منصوبہ</text><text class="cell" x="240" y="276" text-anchor="end">جسمانی سہولیات، اوزار، روزمرہ</text><text class="cell" x="240" y="293" text-anchor="end">کا بہاؤ، سپلائرز اور کوالٹی</text><text class="cell" x="240" y="310" text-anchor="end">کنٹرول</text></g><g id="node-s7"><rect class="panel" x="528" y="340" width="228" height="88" rx="8"/><text class="sh" x="744" y="364" text-anchor="end">۷. تنظیم اور ٹیم</text><text class="cell" x="744" y="384" text-anchor="end">کردار، رپورٹنگ کا نظام، کلیدی</text><text class="cell" x="744" y="401" text-anchor="end">عملے کے کوائف اور مشاورتی</text><text class="cell" x="744" y="418" text-anchor="end">مدد</text></g><g id="node-s8"><rect class="panel" x="276" y="340" width="228" height="88" rx="8"/><text class="sh" x="492" y="364" text-anchor="end">۸. مالیاتی منصوبہ</text><text class="cell" x="492" y="384" text-anchor="end">ابتدائی اخراجات، فروخت کے</text><text class="cell" x="492" y="401" text-anchor="end">اہداف، کیش فلو تخمینہ اور بریک</text><text class="cell" x="492" y="418" text-anchor="end">ایون کا حساب</text></g><g id="node-s9"><rect class="panel" x="24" y="340" width="228" height="88" rx="8"/><text class="sh" x="240" y="364" text-anchor="end">۹. ضمیمہ جات</text><text class="cell" x="240" y="384" text-anchor="end">حمایتی خطوط، اجازت نامے،</text><text class="cell" x="240" y="401" text-anchor="end">سروے، مصنوعات کی تصاویر اور</text><text class="cell" x="240" y="418" text-anchor="end">قیمتوں کی فہرستیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">کاروباری منصوبے کے معیاری اجزاء بلحاظ ترتیب</text><text id="label-caption" class="small" x="756" y="452" text-anchor="end">تیر بیرونی شراکت داروں اور سرمایہ کاروں کے لیے پڑھنے کی ترتیب کو ظاہر کرتے ہیں۔</text><text class="wm" x="12" y="475" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
