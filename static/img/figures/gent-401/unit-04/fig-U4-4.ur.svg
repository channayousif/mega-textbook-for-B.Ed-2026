<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ترقی پاتے ہوئے اداروں کے تنظیمی ڈھانچے</title><desc id="d">ایک کاروباری اقدام کے تنظیمی ڈھانچے کے تین مراحل: اکیلا بانی، پانچ افراد کی ٹیم، اور شعبہ جاتی تنظیم کے ساتھ بیس افراد کی کمپنی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="frame-stage1" class="frame" x="528" y="56" width="228" height="370" rx="8"/><rect id="frame-stage2" class="frame" x="276" y="56" width="228" height="370" rx="8"/><rect id="frame-stage3" class="frame" x="24" y="56" width="228" height="370" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="642" y1="166" x2="642" y2="188" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="164" x2="390" y2="188"/><path class="stroke" d="M337,188 L446,188"/><line class="stroke" x1="337" y1="188" x2="337" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="446" y1="188" x2="446" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="138" y1="164" x2="138" y2="188"/><path class="stroke" d="M64,188 L212,188"/><line class="stroke" x1="64" y1="188" x2="64" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="138" y1="188" x2="138" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="212" y1="188" x2="212" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="64" y1="240" x2="64" y2="252" marker-end="url(#arrow)"/><line class="stroke" x1="138" y1="240" x2="138" y2="252" marker-end="url(#arrow)"/><line class="stroke" x1="212" y1="240" x2="212" y2="252" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-head1"><rect class="panel-a" x="528" y="56" width="228" height="46" rx="8"/><text class="sh" x="642" y="78" text-anchor="middle">ایک فرد کا منصوبہ</text><text class="cell" x="642" y="94" text-anchor="middle">اکیلا بانی (تمام ذمہ داریاں)</text></g><g id="node-founder"><rect class="panel-b" x="548" y="118" width="188" height="48" rx="8"/><text class="sh" x="642" y="147" text-anchor="middle">بانی / مالک</text></g><g id="node-f-tasks"><rect class="panel" x="548" y="190" width="188" height="38" rx="4"/><text class="cell" x="642" y="214" text-anchor="middle">۱. مصنوعات اور نصاب</text><rect class="panel" x="548" y="238" width="188" height="38" rx="4"/><text class="cell" x="642" y="262" text-anchor="middle">۲. مارکیٹنگ اور فروخت</text><rect class="panel" x="548" y="286" width="188" height="38" rx="4"/><text class="cell" x="642" y="310" text-anchor="middle">۳. تیاری اور ترسیل</text><rect class="panel" x="548" y="334" width="188" height="38" rx="4"/><text class="cell" x="642" y="358" text-anchor="middle">۴. کیش اور کھاتہ داری</text><text class="small" x="642" y="405" text-anchor="middle">تمام کام بانی خود انجام دیتا ہے</text></g><g id="node-head2"><rect class="panel-a" x="276" y="56" width="228" height="46" rx="8"/><text class="sh" x="390" y="78" text-anchor="middle">پانچ افراد کی ٹیم</text><text class="cell" x="390" y="94" text-anchor="middle">مخصوص شعبہ جاتی کردار</text></g><g id="node-gm2"><rect class="panel-b" x="296" y="118" width="188" height="46" rx="8"/><text class="sh" x="390" y="146" text-anchor="middle">بانی / ٹیم سربراہ</text></g><g id="node-roles2"><rect class="panel" x="398" y="200" width="96" height="44" rx="4"/><text class="cell" x="446" y="218" text-anchor="middle">مصنوع اور</text><text class="cell" x="446" y="234" text-anchor="middle">ڈیزائن (۱)</text><rect class="panel" x="286" y="200" width="102" height="44" rx="4"/><text class="cell" x="337" y="218" text-anchor="middle">مارکیٹنگ اور</text><text class="cell" x="337" y="234" text-anchor="middle">فروخت (۱)</text><rect class="panel" x="398" y="254" width="96" height="44" rx="4"/><text class="cell" x="446" y="272" text-anchor="middle">تیاری اور</text><text class="cell" x="446" y="288" text-anchor="middle">پیکنگ (۱)</text><rect class="panel" x="286" y="254" width="102" height="44" rx="4"/><text class="cell" x="337" y="272" text-anchor="middle">فنانس اور</text><text class="cell" x="337" y="288" text-anchor="middle">ایڈمن (۱)</text><text class="cell" x="390" y="340" text-anchor="middle">فرائض کی واضح تقسیم؛ ہر</text><text class="cell" x="390" y="358" text-anchor="middle">رکن کا اپنا ورک فلو</text><text class="small" x="390" y="405" text-anchor="middle">براہ راست بانی کو رپورٹنگ</text></g><g id="node-head3"><rect class="panel-a" x="24" y="56" width="228" height="46" rx="8"/><text class="sh" x="138" y="78" text-anchor="middle">بیس افراد کا ادارہ</text><text class="cell" x="138" y="94" text-anchor="middle">شعبہ جاتی درجہ بندی</text></g><g id="node-md3"><rect class="panel-b" x="44" y="118" width="188" height="46" rx="8"/><text class="sh" x="138" y="146" text-anchor="middle">منیجنگ ڈائریکٹر</text></g><g id="node-depts3"><rect class="panel" x="180" y="200" width="64" height="40" rx="4"/><text class="cell" x="212" y="216" text-anchor="middle">سربراہ</text><text class="cell" x="212" y="230" text-anchor="middle">عملیات</text><rect class="panel" x="106" y="200" width="64" height="40" rx="4"/><text class="cell" x="138" y="216" text-anchor="middle">سربراہ</text><text class="cell" x="138" y="230" text-anchor="middle">مارکیٹنگ</text><rect class="panel" x="32" y="200" width="64" height="40" rx="4"/><text class="cell" x="64" y="216" text-anchor="middle">سربراہ</text><text class="cell" x="64" y="230" text-anchor="middle">فنانس</text><rect class="panel" x="180" y="254" width="64" height="84" rx="4"/><text class="cell" x="212" y="280" text-anchor="middle">۸ افراد</text><text class="cell" x="212" y="300" text-anchor="middle">(پیداوار و</text><text class="cell" x="212" y="318" text-anchor="middle">ترسیل)</text><rect class="panel" x="106" y="254" width="64" height="84" rx="4"/><text class="cell" x="138" y="280" text-anchor="middle">۵ افراد</text><text class="cell" x="138" y="300" text-anchor="middle">(فروخت و</text><text class="cell" x="138" y="318" text-anchor="middle">رابطہ)</text><rect class="panel" x="32" y="254" width="64" height="84" rx="4"/><text class="cell" x="64" y="280" text-anchor="middle">۴ افراد</text><text class="cell" x="64" y="300" text-anchor="middle">(اکاؤنٹس و</text><text class="cell" x="64" y="318" text-anchor="middle">ایڈمن)</text><text class="small" x="138" y="405" text-anchor="middle">شعبہ جاتی سربراہ ٹیم چلاتے ہیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">ترقی پاتے ہوئے اداروں کے تنظیمی ڈھانچے</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">کاروبار کے پھیلاؤ کے ساتھ عمومی فرائض مخصوص شعبہ جاتی کرداروں میں تقسیم ہو جاتے ہیں۔</text><text class="wm" x="12" y="475" text-anchor="start" aria-hidden="true" font-family="system-ui, sans-serif">textbook.com.pk</text></g></svg>
