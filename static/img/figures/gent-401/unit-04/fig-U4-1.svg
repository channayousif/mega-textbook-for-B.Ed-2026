<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram showing the sections of a business plan in order</title><desc id="d">Diagram showing the nine standard sections of a business plan in logical order from executive summary to appendices, noting that the executive summary appears first but is written last.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="callout-box" class="panel-b" x="24" y="52" width="732" height="42" rx="6"/></g><g id="layer-edges"><line class="stroke" x1="252" y1="152" x2="276" y2="152" marker-end="url(#arrow)"/><line class="stroke" x1="504" y1="152" x2="528" y2="152" marker-end="url(#arrow)"/><path class="stroke" d="M642,198 L642,216 L138,216 L138,228" marker-end="url(#arrow)"/><line class="stroke" x1="252" y1="268" x2="276" y2="268" marker-end="url(#arrow)"/><line class="stroke" x1="504" y1="268" x2="528" y2="268" marker-end="url(#arrow)"/><path class="stroke" d="M642,308 L642,324 L138,324 L138,336" marker-end="url(#arrow)"/><line class="stroke" x1="252" y1="376" x2="276" y2="376" marker-end="url(#arrow)"/><line class="stroke" x1="504" y1="376" x2="528" y2="376" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-callout"><text class="sh" x="36" y="78">Core rule: The executive summary is placed first, but drafted last after all other sections.</text></g><g id="node-s1"><rect class="panel-a" x="24" y="108" width="228" height="88" rx="8"/><text class="sh" x="36" y="132">1. Executive Summary</text><text class="cell" x="36" y="152">Brief snapshot of problem,</text><text class="cell" x="36" y="169">solution, market and team</text><text class="cell" x="36" y="186">(drafted last before sharing)</text></g><g id="node-s2"><rect class="panel" x="276" y="108" width="228" height="88" rx="8"/><text class="sh" x="288" y="132">2. Company Profile</text><text class="cell" x="288" y="152">Mission, vision, core values,</text><text class="cell" x="288" y="169">ownership, legal form, and</text><text class="cell" x="288" y="186">founding background</text></g><g id="node-s3"><rect class="panel" x="528" y="108" width="228" height="88" rx="8"/><text class="sh" x="540" y="132">3. Products and Services</text><text class="cell" x="540" y="152">What you offer, customer</text><text class="cell" x="540" y="169">benefits, uniqueness, and</text><text class="cell" x="540" y="186">intellectual property</text></g><g id="node-s4"><rect class="panel" x="24" y="232" width="228" height="88" rx="8"/><text class="sh" x="36" y="256">4. Market Analysis</text><text class="cell" x="36" y="276">Target customers, market</text><text class="cell" x="36" y="293">size, buyer habits, and</text><text class="cell" x="36" y="310">competitor strengths</text></g><g id="node-s5"><rect class="panel" x="276" y="232" width="228" height="88" rx="8"/><text class="sh" x="288" y="256">5. Marketing and Sales</text><text class="cell" x="288" y="276">Pricing strategy, selling</text><text class="cell" x="288" y="293">channels, promotion plan,</text><text class="cell" x="288" y="310">and customer service</text></g><g id="node-s6"><rect class="panel" x="528" y="232" width="228" height="88" rx="8"/><text class="sh" x="540" y="256">6. Operational Plan</text><text class="cell" x="540" y="276">Physical facilities, tools,</text><text class="cell" x="540" y="293">daily workflow, suppliers,</text><text class="cell" x="540" y="310">and quality control</text></g><g id="node-s7"><rect class="panel" x="24" y="340" width="228" height="88" rx="8"/><text class="sh" x="36" y="364">7. Organization and Team</text><text class="cell" x="36" y="384">Roles, reporting hierarchy,</text><text class="cell" x="36" y="401">key staff profiles, and</text><text class="cell" x="36" y="418">advisory support</text></g><g id="node-s8"><rect class="panel" x="276" y="340" width="228" height="88" rx="8"/><text class="sh" x="288" y="364">8. Financial Plan</text><text class="cell" x="288" y="384">Start-up costs, sales goals,</text><text class="cell" x="288" y="401">cash-flow projections, and</text><text class="cell" x="288" y="418">break-even calculation</text></g><g id="node-s9"><rect class="panel" x="528" y="340" width="228" height="88" rx="8"/><text class="sh" x="540" y="364">9. Appendices</text><text class="cell" x="540" y="384">Letters of support, permits,</text><text class="cell" x="540" y="401">surveys, product photos,</text><text class="cell" x="540" y="418">and price lists</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Standard sections of a business plan in sequence</text><text id="label-caption" class="small" x="24" y="452">Arrows indicate the reading order for external partners and investors.</text><text class="wm" x="768" y="475" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>