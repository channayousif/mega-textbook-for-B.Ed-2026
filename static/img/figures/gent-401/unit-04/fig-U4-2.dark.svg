<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing vision and mission statements</title><desc id="d">Table comparing vision and mission statements across five dimensions, including clear contrasting examples for a Pakistani educational venture.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/><rect id="region-table" class="frame" x="24" y="56" width="732" height="374"/></g><g id="layer-edges"><line class="grid" x1="24" y1="156" x2="756" y2="156"/><line class="grid" x1="24" y1="216" x2="756" y2="216"/><line class="grid" x1="24" y1="276" x2="756" y2="276"/><line class="grid" x1="24" y1="346" x2="756" y2="346"/><line class="frame" x1="164" y1="56" x2="164" y2="430"/><line class="frame" x1="460" y1="56" x2="460" y2="430"/><line class="frame" x1="24" y1="96" x2="756" y2="96"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Dimension</text><text class="sh" x="176" y="82">Vision Statement</text><text class="sh" x="472" y="82">Mission Statement</text></g><g id="node-focus"><text class="sh" x="36" y="124">Core focus</text><text class="cell" x="176" y="120">Future destination: what the</text><text class="cell" x="176" y="137">venture strives to become</text><text class="cell" x="472" y="120">Present purpose: what the</text><text class="cell" x="472" y="137">venture does today and for whom</text></g><g id="node-time"><text class="sh" x="36" y="184">Time horizon</text><text class="cell" x="176" y="180">Long term: 5 to 10 years or</text><text class="cell" x="176" y="197">an enduring aspirational target</text><text class="cell" x="472" y="180">Immediate and ongoing: guides</text><text class="cell" x="472" y="197">daily operations right now</text></g><g id="node-question"><text class="sh" x="36" y="244">Key question</text><text class="cell" x="176" y="240">&quot;Where do we want our</text><text class="cell" x="176" y="257">work to lead in the future?&quot;</text><text class="cell" x="472" y="240">&quot;Who are we, what do we offer,</text><text class="cell" x="472" y="257">and how do we serve buyers?&quot;</text></g><g id="node-weak"><text class="sh" x="36" y="304">Weak example</text><text class="cell" x="176" y="300">&quot;To become the most famous</text><text class="cell" x="176" y="317">learning enterprise in Pakistan.&quot;</text><text class="cell" x="472" y="300">&quot;We sell activity kits to schools</text><text class="cell" x="472" y="317">and earn a good profit.&quot;</text></g><g id="node-strong"><text class="sh" x="36" y="372">Strong example</text><text class="sh" x="36" y="389">(Sindh venture)</text><text class="cell" x="176" y="368">&quot;A Sindh where every primary pupil</text><text class="cell" x="176" y="385">discovers science through hands-on</text><text class="cell" x="176" y="402">activity kits in their classroom.&quot;</text><text class="cell" x="472" y="368">&quot;We supply low-cost, curriculum-linked</text><text class="cell" x="472" y="385">science kits to rural Sindh schools</text><text class="cell" x="472" y="402">backed by practical teacher guides.&quot;</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Vision and mission statements compared</text><text id="label-caption" class="small" x="24" y="456">A vision inspires the ultimate goal; a mission directs weekly resources and staff effort.</text><text class="wm" x="768" y="475" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>