<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram showing simple organisational structures as ventures grow</title><desc id="d">Diagram showing three stages of organizational structure for an entrepreneurial venture: solo founder, five-person team, and twenty-person company with functional departments.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><rect id="frame-stage1" class="frame" x="24" y="56" width="228" height="370" rx="8"/><rect id="frame-stage2" class="frame" x="276" y="56" width="228" height="370" rx="8"/><rect id="frame-stage3" class="frame" x="528" y="56" width="228" height="370" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="138" y1="166" x2="138" y2="188" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="164" x2="390" y2="188"/><path class="stroke" d="M337,188 L446,188"/><line class="stroke" x1="337" y1="188" x2="337" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="446" y1="188" x2="446" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="642" y1="164" x2="642" y2="188"/><path class="stroke" d="M568,188 L716,188"/><line class="stroke" x1="568" y1="188" x2="568" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="642" y1="188" x2="642" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="716" y1="188" x2="716" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="568" y1="240" x2="568" y2="252" marker-end="url(#arrow)"/><line class="stroke" x1="642" y1="240" x2="642" y2="252" marker-end="url(#arrow)"/><line class="stroke" x1="716" y1="240" x2="716" y2="252" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-head1"><rect class="panel-a" x="24" y="56" width="228" height="46" rx="8"/><text class="sh" x="138" y="78" text-anchor="middle">One-Person Venture</text><text class="cell" x="138" y="94" text-anchor="middle">Solo founder (all functions)</text></g><g id="node-founder"><rect class="panel-b" x="44" y="118" width="188" height="48" rx="8"/><text class="sh" x="138" y="147" text-anchor="middle">Founder / Owner</text></g><g id="node-f-tasks"><rect class="panel" x="44" y="190" width="188" height="38" rx="4"/><text class="cell" x="138" y="214" text-anchor="middle">1. Product &amp; Curriculum</text><rect class="panel" x="44" y="238" width="188" height="38" rx="4"/><text class="cell" x="138" y="262" text-anchor="middle">2. Marketing &amp; Sales</text><rect class="panel" x="44" y="286" width="188" height="38" rx="4"/><text class="cell" x="138" y="310" text-anchor="middle">3. Assembly &amp; Delivery</text><rect class="panel" x="44" y="334" width="188" height="38" rx="4"/><text class="cell" x="138" y="358" text-anchor="middle">4. Cash &amp; Invoices</text><text class="small" x="138" y="405" text-anchor="middle">Direct execution by founder</text></g><g id="node-head2"><rect class="panel-a" x="276" y="56" width="228" height="46" rx="8"/><text class="sh" x="390" y="78" text-anchor="middle">Five-Person Team</text><text class="cell" x="390" y="94" text-anchor="middle">Specialised team roles</text></g><g id="node-gm2"><rect class="panel-b" x="296" y="118" width="188" height="46" rx="8"/><text class="sh" x="390" y="146" text-anchor="middle">Founder / Team Lead</text></g><g id="node-roles2"><rect class="panel" x="286" y="200" width="102" height="44" rx="4"/><text class="cell" x="337" y="218" text-anchor="middle">Product &amp;</text><text class="cell" x="337" y="234" text-anchor="middle">Design (1)</text><rect class="panel" x="398" y="200" width="96" height="44" rx="4"/><text class="cell" x="446" y="218" text-anchor="middle">Marketing &amp;</text><text class="cell" x="446" y="234" text-anchor="middle">Sales (1)</text><rect class="panel" x="286" y="254" width="102" height="44" rx="4"/><text class="cell" x="337" y="272" text-anchor="middle">Assembly &amp;</text><text class="cell" x="337" y="288" text-anchor="middle">Packing (1)</text><rect class="panel" x="398" y="254" width="96" height="44" rx="4"/><text class="cell" x="446" y="272" text-anchor="middle">Finance &amp;</text><text class="cell" x="446" y="288" text-anchor="middle">Admin (1)</text><text class="cell" x="390" y="340" text-anchor="middle">Clear division of duties;</text><text class="cell" x="390" y="358" text-anchor="middle">each owns one workflow</text><text class="small" x="390" y="405" text-anchor="middle">Direct reporting to founder</text></g><g id="node-head3"><rect class="panel-a" x="528" y="56" width="228" height="46" rx="8"/><text class="sh" x="642" y="78" text-anchor="middle">Twenty-Person Venture</text><text class="cell" x="642" y="94" text-anchor="middle">Functional departments</text></g><g id="node-md3"><rect class="panel-b" x="548" y="118" width="188" height="46" rx="8"/><text class="sh" x="642" y="146" text-anchor="middle">Managing Director</text></g><g id="node-depts3"><rect class="panel" x="536" y="200" width="64" height="40" rx="4"/><text class="cell" x="568" y="216" text-anchor="middle">Ops</text><text class="cell" x="568" y="230" text-anchor="middle">Lead</text><rect class="panel" x="610" y="200" width="64" height="40" rx="4"/><text class="cell" x="642" y="216" text-anchor="middle">Market</text><text class="cell" x="642" y="230" text-anchor="middle">Lead</text><rect class="panel" x="684" y="200" width="64" height="40" rx="4"/><text class="cell" x="716" y="216" text-anchor="middle">Finance</text><text class="cell" x="716" y="230" text-anchor="middle">Lead</text><rect class="panel" x="536" y="254" width="64" height="84" rx="4"/><text class="cell" x="568" y="280" text-anchor="middle">8 Staff</text><text class="cell" x="568" y="300" text-anchor="middle">(making,</text><text class="cell" x="568" y="318" text-anchor="middle">dispatch)</text><rect class="panel" x="610" y="254" width="64" height="84" rx="4"/><text class="cell" x="642" y="280" text-anchor="middle">5 Staff</text><text class="cell" x="642" y="300" text-anchor="middle">(sales,</text><text class="cell" x="642" y="318" text-anchor="middle">support)</text><rect class="panel" x="684" y="254" width="64" height="84" rx="4"/><text class="cell" x="716" y="280" text-anchor="middle">4 Staff</text><text class="cell" x="716" y="300" text-anchor="middle">(accounts,</text><text class="cell" x="716" y="318" text-anchor="middle">admin)</text><text class="small" x="642" y="405" text-anchor="middle">Department heads lead teams</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Simple organisational structures for growing ventures</text><text id="label-caption" class="small" x="24" y="455">As venture scale increases, generalist tasks divide into specialised functional roles.</text><text class="wm" x="768" y="475" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>