<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Daily operational workflow of a small venture</title><desc id="d">Flowchart illustrating the daily operations of a small venture from customer order to delivery, showing quality inspection check, dispatch, and feedback loop.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="720"/><g id="layer-regions"></g><g id="layer-edges"><line class="stroke" x1="390" y1="112" x2="390" y2="142" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="200" x2="390" y2="230" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="288" x2="390" y2="318" marker-end="url(#arrow)"/><path class="stroke" d="M210,370 L100,370 L100,260 L208,260" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="420" x2="390" y2="452" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="510" x2="390" y2="540" marker-end="url(#arrow)"/><path class="dash" d="M570,570 L680,570 L680,172 L572,172" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-step1"><rect class="panel-a" x="210" y="56" width="360" height="56" rx="28"/><text class="sh" x="390" y="80" text-anchor="middle">1. Order received and logged</text><text class="cell" x="390" y="98" text-anchor="middle">School places order; verify quantity and payment</text></g><g id="node-step2"><rect class="panel" x="210" y="144" width="360" height="56" rx="8"/><text class="sh" x="390" y="168" text-anchor="middle">2. Inventory and parts check</text><text class="cell" x="390" y="186" text-anchor="middle">Check activity cards, containers and tools in stock</text></g><g id="node-step3"><rect class="panel" x="210" y="232" width="360" height="56" rx="8"/><text class="sh" x="390" y="256" text-anchor="middle">3. Assembly and packaging</text><text class="cell" x="390" y="274" text-anchor="middle">Pack kit items using verified unit packing checklist</text></g><g id="node-decision"><polygon class="panel-b" points="390,320 570,370 390,420 210,370"/><text class="sh" x="390" y="365" text-anchor="middle">4. Quality check</text><text class="cell" x="390" y="383" text-anchor="middle">Does package meet standard?</text></g><g id="node-step5"><rect class="panel" x="210" y="454" width="360" height="56" rx="8"/><text class="sh" x="390" y="478" text-anchor="middle">5. Dispatch and delivery</text><text class="cell" x="390" y="496" text-anchor="middle">Hand to courier; share tracking notice with school</text></g><g id="node-step6"><rect class="panel-a" x="210" y="542" width="360" height="56" rx="28"/><text class="sh" x="390" y="566" text-anchor="middle">6. Customer confirmation and feedback</text><text class="cell" x="390" y="584" text-anchor="middle">Confirm delivery; record teacher review for upgrades</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Daily operational workflow of a small educational venture</text><text id="label-no-1" class="small" x="110" y="338">no: return to</text><text id="label-no-2" class="small" x="110" y="354">assembly</text><text id="label-yes" class="small" x="402" y="438">yes: approved</text><text id="label-feed-1" class="small" x="756" y="358" text-anchor="end">Continuous</text><text id="label-feed-2" class="small" x="756" y="374" text-anchor="end">feedback loop</text><text id="label-feed-3" class="small" x="756" y="390" text-anchor="end">to inventory</text><text id="label-caption" class="small" x="24" y="675">Every order follows a repeatable path with a strict quality checkpoint before dispatch.</text><text class="wm" x="768" y="705" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>