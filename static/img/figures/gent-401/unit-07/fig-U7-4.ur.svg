<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پچ کے فیصلے کا تعین کرنے والی پانچ عادات</title><desc id="d">پچ میں کیا کریں اور کیا نہ کریں کے پانچ نکات کا جدول، جن میں سے ہر ایک رابطے کی ایک مخصوص مہارت سے جڑا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect id="region-table" class="frame" x="24" y="56" width="732" height="414"/><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/></g><g id="layer-edges"><line class="frame" x1="24" y1="96" x2="756" y2="96"/><line class="grid" x1="24" y1="174" x2="756" y2="174"/><line class="grid" x1="24" y1="252" x2="756" y2="252"/><line class="grid" x1="24" y1="330" x2="756" y2="330"/><line class="grid" x1="24" y1="408" x2="756" y2="408"/><line class="frame" x1="606" y1="56" x2="606" y2="470"/><line class="frame" x1="315" y1="56" x2="315" y2="470"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="82" text-anchor="end">مہارت</text><text class="sh" x="594" y="82" text-anchor="end">کیا کریں</text><text class="sh" x="303" y="82" text-anchor="end">کیا نہ کریں</text></g><g id="node-open"><text class="body" x="744" y="139" text-anchor="end">مؤثر آغاز</text><text class="body" x="594" y="130" text-anchor="end">سامعین کی دلچسپی کی کہانی یا عدد</text><text class="body" x="594" y="150" text-anchor="end">سے گفتگو کا آغاز کریں</text><text class="body" x="303" y="130" text-anchor="end">اپنے اسکول کی لمبی تاریخ اور ٹیم</text><text class="body" x="303" y="150" text-anchor="end">کی تصاویر دکھانے سے شروع کریں</text></g><g id="node-ask"><text class="body" x="744" y="217" text-anchor="end">واضح مانگ</text><text class="body" x="594" y="208" text-anchor="end">صاف بتائیں کہ کیا چاہیے: مخصوص رقم</text><text class="body" x="594" y="228" text-anchor="end">اور اس سے کیا خریدا جائے گا</text><text class="body" x="303" y="208" text-anchor="end">بغیر کسی مانگ کے صرف 'شکریہ' کہہ</text><text class="body" x="303" y="228" text-anchor="end">کر بات ختم کر دیں</text></g><g id="node-eye"><text class="body" x="744" y="295" text-anchor="end">غیر لفظی وقار</text><text class="body" x="594" y="286" text-anchor="end">پینل کے تمام ارکان کی طرف دیکھیں</text><text class="body" x="594" y="306" text-anchor="end">اور جواب دینے سے پہلے تھوڑا رکیں</text><text class="body" x="303" y="286" text-anchor="end">اسکرین کی طرف منہ کر کے مسلسل</text><text class="body" x="303" y="306" text-anchor="end">اپنی سلائیڈیں پڑھتے رہیں</text></g><g id="node-question"><text class="body" x="744" y="373" text-anchor="end">دیانتدارانہ سماعت</text><text class="body" x="594" y="364" text-anchor="end">پوچھے گئے سوال کا سیدھا جواب دیں اور</text><text class="body" x="594" y="384" text-anchor="end">جس کا علم نہ ہو، صاف تسلیم کریں</text><text class="body" x="303" y="364" text-anchor="end">اعتراض کے باوجود ہر عدد کا بلا جواز</text><text class="body" x="303" y="384" text-anchor="end">دفاع کرنے کی کوشش کریں</text></g><g id="node-time"><text class="body" x="744" y="442" text-anchor="end">وقت کی پابندی</text><text class="body" x="594" y="442" text-anchor="end">اپنے مقررہ وقت کی سختی سے پابندی کریں</text><text class="body" x="303" y="434" text-anchor="end">طویل بولتے رہیں اور امید رکھیں کہ</text><text class="body" x="303" y="452" text-anchor="end">پینل آپ کو نہیں ٹوکے گا</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">پچ کے فیصلے کا تعین کرنے والی پانچ عادات</text><text id="label-caption" class="small" x="756" y="498" text-anchor="end">ہر عادت رابطے کی عملی مہارت ہے، محض کوئی تدبیر یا دکھاوا نہیں۔</text><text class="wm" x="24" y="508" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>