<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین منٹ کی پچ کے سات اہم حصے</title><desc id="d">مختصر پچ کا فلو چارٹ جو ہک، مسئلے، حل، مارکیٹ، ماڈل اور ٹیم سے لے کر مانگ اور اگلے قدم تک جاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"><rect id="region-start" class="panel-a" x="290" y="48" width="200" height="44" rx="22"/><rect id="region-end" class="panel-b" x="290" y="528" width="200" height="52" rx="12"/></g><g id="layer-edges"><line id="edge-hook-problem" class="stroke" x1="390" y1="92" x2="390" y2="128" marker-end="url(#arrow)"/><line id="edge-problem-solution" class="stroke" x1="390" y1="172" x2="390" y2="208" marker-end="url(#arrow)"/><line id="edge-solution-market" class="stroke" x1="390" y1="252" x2="390" y2="288" marker-end="url(#arrow)"/><line id="edge-market-model" class="stroke" x1="390" y1="332" x2="390" y2="368" marker-end="url(#arrow)"/><line id="edge-model-team" class="stroke" x1="390" y1="412" x2="390" y2="448" marker-end="url(#arrow)"/><line id="edge-team-ask" class="stroke" x1="390" y1="492" x2="390" y2="526" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-hook"><text class="sh" x="390" y="76" text-anchor="middle">ہک (آغاز)</text><text class="small" x="510" y="76">کہانی، سوال یا چونکا دینے والا عدد</text></g><g id="node-problem"><rect class="panel" x="290" y="130" width="200" height="42" rx="8"/><text class="sh" x="390" y="156" text-anchor="middle">مسئلہ</text><text class="small" x="510" y="156">ایک جملے میں ضرورت کا بیان</text></g><g id="node-solution"><rect class="panel" x="290" y="210" width="200" height="42" rx="8"/><text class="sh" x="390" y="236" text-anchor="middle">حل</text><text class="small" x="510" y="236">آپ کی پیشکش اور اس کی برتری</text></g><g id="node-market"><rect class="panel" x="290" y="290" width="200" height="42" rx="8"/><text class="sh" x="390" y="316" text-anchor="middle">مارکیٹ</text><text class="small" x="510" y="316">خریدار کون ہیں اور گنتی کیا ہے</text></g><g id="node-model"><rect class="panel" x="290" y="370" width="200" height="42" rx="8"/><text class="sh" x="390" y="396" text-anchor="middle">ماڈل</text><text class="small" x="510" y="396">آمدن اور اخراجات کا طریقہ</text></g><g id="node-team"><rect class="panel" x="290" y="450" width="200" height="42" rx="8"/><text class="sh" x="390" y="476" text-anchor="middle">ٹیم</text><text class="small" x="510" y="476">کام کون اور کیوں کرے گا</text></g><g id="node-ask"><text class="sh" x="390" y="558" text-anchor="middle">مانگ اور اگلا قدم</text><text class="small" x="510" y="552">مطلوبہ رقم یا مدد کی وضاحت</text><text class="small" x="510" y="568">اور سامعین کا اگلا قدم</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">تین منٹ کی پچ کے سات اہم حصے</text><text id="label-caption" class="small" x="756" y="630" text-anchor="end">زیادہ وقت مسئلے اور حل پر لگائیں؛ اختتام پر واضح مانگ اور اگلا قدم رکھیں۔</text><text class="wm" x="24" y="642" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>