<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Pitch do's and don'ts</title><desc id="d">Table of five pitch do's and don'ts, each linked to a named communication skill, from opening with a story or number to keeping to the time given.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"><rect id="region-table" class="frame" x="24" y="56" width="732" height="414"/><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/></g><g id="layer-edges"><line class="frame" x1="24" y1="96" x2="756" y2="96"/><line class="grid" x1="24" y1="174" x2="756" y2="174"/><line class="grid" x1="24" y1="252" x2="756" y2="252"/><line class="grid" x1="24" y1="330" x2="756" y2="330"/><line class="grid" x1="24" y1="408" x2="756" y2="408"/><line class="frame" x1="174" y1="56" x2="174" y2="470"/><line class="frame" x1="465" y1="56" x2="465" y2="470"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Skill</text><text class="sh" x="186" y="82">Do</text><text class="sh" x="477" y="82">Don't</text></g><g id="node-open"><text class="body" x="36" y="139">Engaging opening</text><text class="body" x="186" y="130">Open with a story or a number</text><text class="body" x="186" y="148">that matters to the listener</text><text class="body" x="477" y="130">Open with your school's history</text><text class="body" x="477" y="148">and the team's photographs</text></g><g id="node-ask"><text class="body" x="36" y="217">Clarity of ask</text><text class="body" x="186" y="208">Say what you want: an amount</text><text class="body" x="186" y="226">and what it buys</text><text class="body" x="477" y="208">End with "thank you" and</text><text class="body" x="477" y="226">no ask</text></g><g id="node-eye"><text class="body" x="36" y="295">Non-verbal poise</text><text class="body" x="186" y="286">Look at the whole panel and</text><text class="body" x="186" y="304">pause before you answer</text><text class="body" x="477" y="286">Read your slides while facing</text><text class="body" x="477" y="304">the screen</text></g><g id="node-question"><text class="body" x="36" y="373">Honest listening</text><text class="body" x="186" y="364">Answer the question asked, and</text><text class="body" x="186" y="382">admit what you do not know</text><text class="body" x="477" y="364">Defend every number even when</text><text class="body" x="477" y="382">it is challenged</text></g><g id="node-time"><text class="body" x="36" y="442">Time discipline</text><text class="body" x="186" y="442">Keep to the time you were given</text><text class="body" x="477" y="434">Run long and hope the panel</text><text class="body" x="477" y="452">will not stop you</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Five delivery habits linked to communication skills</text><text id="label-caption" class="small" x="24" y="498">Each habit is a communication skill, not a trick.</text><text class="wm" x="756" y="508" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>