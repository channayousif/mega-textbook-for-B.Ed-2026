<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ترقی کی حکمت عملی کے فائدے اور خطرات</title><desc id="d">ترقی کی چار حکمت عملیوں کا جدول، ہر ایک کے فائدے اور خطرے کے ساتھ، نئی مارکیٹ میں داخلے سے لے کر آن لائن فروخت تک۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect id="region-table" class="frame" x="24" y="56" width="732" height="432"/><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/></g><g id="layer-edges"><line class="frame" x1="24" y1="96" x2="756" y2="96"/><line class="grid" x1="24" y1="182" x2="756" y2="182"/><line class="grid" x1="24" y1="268" x2="756" y2="268"/><line class="grid" x1="24" y1="354" x2="756" y2="354"/><line class="grid" x1="24" y1="440" x2="756" y2="440"/><line class="frame" x1="528" y1="56" x2="528" y2="488"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="744" y="82" text-anchor="end">ترقی کی حکمت عملی</text><text class="sh" x="516" y="82" text-anchor="end">فائدہ اور خطرہ</text></g><g id="node-market"><text class="sh" x="744" y="130" text-anchor="end">نئی مارکیٹ</text><text class="body" x="744" y="152" text-anchor="end">دوسرا شہر یا اسکولوں</text><text class="body" x="744" y="170" text-anchor="end">کا نیا کلسٹر</text><text class="body" x="516" y="125" text-anchor="end">فائدہ: زیادہ گاہک اور مسلسل نئے آرڈرز</text><text class="body" x="516" y="150" text-anchor="end">خطرہ: دور دراز طلب کم ہو سکتی ہے اور سفری اخراجات بڑھتے ہیں</text></g><g id="node-product"><text class="sh" x="744" y="216" text-anchor="end">نئی پروڈکٹ</text><text class="body" x="744" y="238" text-anchor="end">نیا مضمون یا انگریزی</text><text class="body" x="744" y="256" text-anchor="end">میڈیم کا نیا نسخہ</text><text class="body" x="516" y="211" text-anchor="end">فائدہ: انہی اسکولوں کو مزید مضامین کی دوبارہ فروخت</text><text class="body" x="516" y="236" text-anchor="end">خطرہ: فروخت سے پہلے چھپائی اور اسٹاک کے اخراجات بڑھتے ہیں</text></g><g id="node-franchise"><text class="sh" x="744" y="302" text-anchor="end">فرنچائز</text><text class="body" x="744" y="324" text-anchor="end">دوسرے شہر کی دکان فیس</text><text class="body" x="744" y="342" text-anchor="end">لے کر آپ کے نام پر بیچے</text><text class="body" x="516" y="297" text-anchor="end">فائدہ: دوسرے کی دکان اور عملے سے تیز رفتار پھیلاؤ</text><text class="body" x="516" y="322" text-anchor="end">خطرہ: معیار اور آپ کی شہرت دوسرے شخص کے ہاتھوں میں ہوتی ہے</text></g><g id="node-online"><text class="sh" x="744" y="388" text-anchor="end">آن لائن فروخت</text><text class="body" x="744" y="410" text-anchor="end">فون یا میسج سے آرڈر،</text><text class="body" x="744" y="428" text-anchor="end">ڈاک یا وین سے ترسیل</text><text class="body" x="516" y="383" text-anchor="end">فائدہ: دور دراز کے اسکولوں اور والدین تک براہ راست رسائی</text><text class="body" x="516" y="408" text-anchor="end">خطرہ: آرڈرز، رقوم اور ترسیل کی مسلسل نگرانی اور جواب درکار ہیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">چھوٹے منصوبے کی ترقی کے چار راستے</text><text id="label-caption" class="small" x="756" y="522" text-anchor="end">ہر حکمت عملی فائدے کے ساتھ خطرہ لاتی ہے۔ وہی راستہ چنیں جسے ادارہ سنبھال سکے۔</text><text class="wm" x="24" y="522" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
