<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین منٹ کی پچ کے سات اہم حصے</title><desc id="d">مختصر پچ کا فلو چارٹ جو ہک، مسئلے، حل، مارکیٹ، ماڈل اور ٹیم سے لے کر مانگ تک جاتا ہے اور ایک واضح اگلے قدم پر ختم ہوتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="720"/><g id="layer-regions"><rect id="region-start" class="panel-a" x="290" y="48" width="200" height="44" rx="22"/><rect id="region-ask" class="panel-b" x="290" y="520" width="200" height="44"/><rect id="region-end" class="panel-c" x="290" y="640" width="200" height="44" rx="22"/></g><g id="layer-edges"><line id="edge-start-problem" class="stroke" x1="390" y1="92" x2="390" y2="118" marker-end="url(#arrow)"/><line id="edge-problem-solution" class="stroke" x1="390" y1="162" x2="390" y2="188" marker-end="url(#arrow)"/><line id="edge-solution-market" class="stroke" x1="390" y1="232" x2="390" y2="258" marker-end="url(#arrow)"/><line id="edge-market-model" class="stroke" x1="390" y1="302" x2="390" y2="328" marker-end="url(#arrow)"/><line id="edge-model-team" class="stroke" x1="390" y1="372" x2="390" y2="398" marker-end="url(#arrow)"/><line id="edge-team-ask" class="stroke" x1="390" y1="442" x2="390" y2="518" marker-end="url(#arrow)"/><line id="edge-ask-end" class="stroke" x1="390" y1="564" x2="390" y2="638" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-hook"><text class="sh" x="390" y="76" text-anchor="middle">ہک (آغاز)</text><text class="small" x="510" y="76">کہانی، سوال یا چونکا دینے والا عدد</text></g><g id="node-problem"><rect class="panel" x="290" y="120" width="200" height="42" rx="8"/><text class="sh" x="390" y="146" text-anchor="middle">مسئلہ</text></g><g id="node-solution"><rect class="panel" x="290" y="190" width="200" height="42" rx="8"/><text class="sh" x="390" y="216" text-anchor="middle">حل</text></g><g id="node-market"><rect class="panel" x="290" y="260" width="200" height="42" rx="8"/><text class="sh" x="390" y="286" text-anchor="middle">مارکیٹ</text></g><g id="node-model"><rect class="panel" x="290" y="330" width="200" height="42" rx="8"/><text class="sh" x="390" y="356" text-anchor="middle">ماڈل</text></g><g id="node-team"><rect class="panel" x="290" y="400" width="200" height="42" rx="8"/><text class="sh" x="390" y="426" text-anchor="middle">ٹیم</text></g><g id="node-ask"><text class="sh" x="390" y="548" text-anchor="middle">مانگ (طلب)</text><text class="small" x="510" y="548">مطلوبہ رقم یا مدد کی وضاحت</text></g><g id="node-end"><text class="sh" x="390" y="668" text-anchor="middle">اگلا قدم</text><text class="small" x="510" y="668">سامعین اب کیا عملی قدم اٹھا سکتے ہیں</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">تین منٹ کی پچ کے سات اہم حصے</text><text id="label-caption" class="small" x="756" y="700" text-anchor="end">زیادہ وقت مسئلے اور حل پر لگائیں؛ اختتام پر واضح مانگ رکھیں۔</text><text class="wm" x="24" y="712" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
