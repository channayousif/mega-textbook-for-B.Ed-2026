<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Scaling strategies with their benefit and risk</title><desc id="d">Table of four scaling strategies, each with its benefit and its risk, from entering a new market to selling online.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect id="region-table" class="frame" x="24" y="56" width="732" height="432"/><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/></g><g id="layer-edges"><line class="frame" x1="24" y1="96" x2="756" y2="96"/><line class="grid" x1="24" y1="182" x2="756" y2="182"/><line class="grid" x1="24" y1="268" x2="756" y2="268"/><line class="grid" x1="24" y1="354" x2="756" y2="354"/><line class="grid" x1="24" y1="440" x2="756" y2="440"/><line class="frame" x1="252" y1="56" x2="252" y2="488"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Scaling strategy</text><text class="sh" x="264" y="82">Benefit and risk</text></g><g id="node-market"><text class="sh" x="36" y="132">New market</text><text class="body" x="36" y="151">a second town or</text><text class="body" x="36" y="168">school cluster</text><text class="body" x="264" y="123">Benefit: more customers and steadier orders</text><text class="body" x="264" y="143">Risk: demand may fail, travel costs rise</text></g><g id="node-product"><text class="sh" x="36" y="218">New product</text><text class="body" x="36" y="237">a new subject or an</text><text class="body" x="36" y="254">English-medium version</text><text class="body" x="264" y="209">Benefit: sells again to the same schools</text><text class="body" x="264" y="229">Risk: printing and stock costs rise first</text></g><g id="node-franchise"><text class="sh" x="36" y="304">Franchise</text><text class="body" x="36" y="323">another shop sells your</text><text class="body" x="36" y="340">packs under your name</text><text class="body" x="264" y="295">Benefit: fast growth on someone else's shop</text><text class="body" x="264" y="315">Risk: quality and your name are in their hands</text></g><g id="node-online"><text class="sh" x="36" y="390">Online</text><text class="body" x="36" y="409">orders by phone or message,</text><text class="body" x="36" y="426">delivered by van or post</text><text class="body" x="264" y="381">Benefit: reaches parents and schools far away</text><text class="body" x="264" y="401">Risk: orders, payments and deliveries need</text><text class="body" x="264" y="418">tracking, and someone must answer</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Four ways a small venture can grow</text><text id="label-caption" class="small" x="24" y="522">Every strategy buys reach with a risk. Choose the one the venture can carry.</text><text class="wm" x="768" y="532" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
