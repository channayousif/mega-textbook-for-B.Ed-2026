<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 508" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Pitch do's and don'ts</title><desc id="d">Table of five pitch do's and don'ts, each linked to a communication skill, from opening with a story or number to keeping to the time given.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="508"/><g id="layer-regions"><rect id="region-table" class="frame" x="24" y="56" width="732" height="404"/><rect id="region-header" class="panel-a" x="24" y="56" width="732" height="40"/></g><g id="layer-edges"><line class="frame" x1="24" y1="96" x2="756" y2="96"/><line class="grid" x1="24" y1="174" x2="756" y2="174"/><line class="grid" x1="24" y1="252" x2="756" y2="252"/><line class="grid" x1="24" y1="330" x2="756" y2="330"/><line class="grid" x1="24" y1="416" x2="756" y2="416"/><line class="frame" x1="390" y1="56" x2="390" y2="460"/></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="36" y="82">Do</text><text class="sh" x="402" y="82">Don't</text></g><g id="node-open"><text class="body" x="36" y="132">Open with a story or a number</text><text class="body" x="36" y="150">that matters to the listener</text><text class="body" x="402" y="132">Open with your school's history</text><text class="body" x="402" y="150">and the team's photographs</text></g><g id="node-ask"><text class="body" x="36" y="210">Say what you want: an amount</text><text class="body" x="36" y="228">and what it buys</text><text class="body" x="402" y="210">End with "thank you" and</text><text class="body" x="402" y="228">no ask</text></g><g id="node-eye"><text class="body" x="36" y="288">Look at the whole panel and</text><text class="body" x="36" y="306">pause before you answer</text><text class="body" x="402" y="288">Read your slides while facing</text><text class="body" x="402" y="306">the screen</text></g><g id="node-question"><text class="body" x="36" y="366">Answer the question asked, and</text><text class="body" x="36" y="384">admit what you do not know</text><text class="body" x="402" y="366">Defend every number even when</text><text class="body" x="402" y="384">it is challenged</text></g><g id="node-time"><text class="body" x="36" y="434">Keep to the time you were given</text><text class="body" x="402" y="434">Run long and hope the panel</text><text class="body" x="402" y="452">will not stop you</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Five delivery habits that decide a pitch</text><text id="label-caption" class="small" x="24" y="490">Each habit is a communication skill, not a trick.</text><text class="wm" x="768" y="500" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
