<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Structure of a short pitch</title><desc id="d">Flowchart of a short pitch from hook through problem, solution, market, model and team to the ask and next step.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="660"/><g id="layer-regions"><rect id="region-start" class="panel-a" x="290" y="48" width="200" height="44" rx="22"/><rect id="region-end" class="panel-b" x="290" y="528" width="200" height="52" rx="12"/></g><g id="layer-edges"><line id="edge-hook-problem" class="stroke" x1="390" y1="92" x2="390" y2="128" marker-end="url(#arrow)"/><line id="edge-problem-solution" class="stroke" x1="390" y1="172" x2="390" y2="208" marker-end="url(#arrow)"/><line id="edge-solution-market" class="stroke" x1="390" y1="252" x2="390" y2="288" marker-end="url(#arrow)"/><line id="edge-market-model" class="stroke" x1="390" y1="332" x2="390" y2="368" marker-end="url(#arrow)"/><line id="edge-model-team" class="stroke" x1="390" y1="412" x2="390" y2="448" marker-end="url(#arrow)"/><line id="edge-team-ask" class="stroke" x1="390" y1="492" x2="390" y2="526" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-hook"><text class="sh" x="390" y="76" text-anchor="middle">hook</text><text class="small" x="510" y="76">a story, a question or a number</text></g><g id="node-problem"><rect class="panel" x="290" y="130" width="200" height="42" rx="8"/><text class="sh" x="390" y="156" text-anchor="middle">problem</text><text class="small" x="510" y="156">the unmet need in one sentence</text></g><g id="node-solution"><rect class="panel" x="290" y="210" width="200" height="42" rx="8"/><text class="sh" x="390" y="236" text-anchor="middle">solution</text><text class="small" x="510" y="236">what you offer and why it is better</text></g><g id="node-market"><rect class="panel" x="290" y="290" width="200" height="42" rx="8"/><text class="sh" x="390" y="316" text-anchor="middle">market</text><text class="small" x="510" y="316">who wants it, and how you know</text></g><g id="node-model"><rect class="panel" x="290" y="370" width="200" height="42" rx="8"/><text class="sh" x="390" y="396" text-anchor="middle">model</text><text class="small" x="510" y="396">how the venture earns money</text></g><g id="node-team"><rect class="panel" x="290" y="450" width="200" height="42" rx="8"/><text class="sh" x="390" y="476" text-anchor="middle">team</text><text class="small" x="510" y="476">who does the work and why</text></g><g id="node-ask"><text class="sh" x="390" y="558" text-anchor="middle">ask and next step</text><text class="small" x="510" y="552">the amount or help wanted</text><text class="small" x="510" y="568">and what to do now</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Seven parts of a three-minute pitch</text><text id="label-caption" class="small" x="24" y="630">Spend most of the time on the problem and the solution; end with a specific ask and next step.</text><text class="wm" x="768" y="642" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>