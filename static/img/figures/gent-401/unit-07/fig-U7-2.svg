<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Risk matrix of likelihood against impact</title><desc id="d">Risk matrix of likelihood against impact, with four example risks from a small printing venture placed in the quadrants and a note to act first on high-likelihood, high-impact risks.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.dot-a { fill: var(--a1); }
.dot-b { fill: var(--a2); }
.dot-c { fill: var(--a3); }
.dot-d { fill: var(--a4); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560"/><g id="layer-regions"><rect id="region-plot" class="frame" x="100" y="80" width="600" height="360"/><rect id="region-tl" class="panel-a" x="100" y="80" width="300" height="180"/><rect id="region-tr" class="panel-b" x="400" y="80" width="300" height="180"/></g><g id="layer-edges"><line class="grid" x1="400" y1="80" x2="400" y2="440"/><line class="grid" x1="100" y1="260" x2="700" y2="260"/><line class="stroke" x1="100" y1="440" x2="700" y2="440"/><line class="stroke" x1="100" y1="440" x2="100" y2="72"/><line class="stroke" x1="700" y1="440" x2="688" y2="434"/><line class="stroke" x1="700" y1="440" x2="688" y2="446"/><line class="stroke" x1="100" y1="80" x2="88" y2="92"/><line class="stroke" x1="100" y1="80" x2="112" y2="92"/></g><g id="layer-nodes"><g id="node-flood"><circle class="dot-a" cx="200" cy="155" r="9"/><text class="body" x="140" y="190">flood damages</text><text class="body" x="140" y="208">paper stock</text></g><g id="node-competitor"><circle class="dot-b" cx="600" cy="155" r="9"/><text class="body" x="480" y="190">a new printer offers</text><text class="body" x="480" y="208">cheaper sheets</text></g><g id="node-helper"><circle class="dot-c" cx="600" cy="350" r="9"/><text class="body" x="510" y="380">a helper leaves</text><text class="body" x="510" y="398">in exam season</text></g><g id="node-accident"><circle class="dot-d" cx="200" cy="350" r="9"/><text class="body" x="140" y="380">a small delivery</text><text class="body" x="140" y="398">accident</text></g></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Sort each risk by likelihood and impact</text><text class="small" x="115" y="460">low</text><text class="small" x="400" y="475" text-anchor="middle">likelihood of the risk</text><text class="small" x="685" y="460" text-anchor="end">high</text><text class="small" x="80" y="95" text-anchor="end">high</text><text class="small" x="80" y="260" text-anchor="end">impact</text><text class="small" x="80" y="435" text-anchor="end">low</text><text class="small" x="415" y="102">high likelihood,</text><text class="small" x="415" y="118">high impact: act now</text><text class="small" x="115" y="102">high impact, low</text><text class="small" x="115" y="118">likelihood: insure</text><text class="small" x="415" y="282">high likelihood, low</text><text class="small" x="415" y="298">impact: reduce with routines</text><text class="small" x="115" y="282">low likelihood, low</text><text class="small" x="115" y="298">impact: accept</text><text id="label-caption" class="small" x="24" y="525">Act first on top-right; prepare for top-left; reduce bottom-right with routines; accept bottom-left.</text><text class="wm" x="768" y="548" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>