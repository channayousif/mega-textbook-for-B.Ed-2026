<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین بڑے عمرانی نقطہ نظر</title><desc id="d">ایک تصوراتی خاکہ جو تین بڑے عمرانی نقطہ نظر اور ان کی بنیادی فرضیات کو دکھاتا ہے: فعلیت (دورکائم)، نظریہ تنازع (مارکس)، علامتی باہمی تعامل (میڈ اور بلومر)۔</desc>
<style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center-panel{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
<rect class="bg" x="0" y="0" width="780" height="470"/>

<!-- Center -->
<rect class="center-panel" x="250" y="40" width="280" height="70" rx="8"/>
<text class="h" x="390" y="68" fill="var(--a1)">تین بڑے نقطہ نظر</text>
<text class="m" x="390" y="88">معاشرے کے تجزیے کے لیے نظریاتی عدسے</text>

<!-- Left: Functionalism -->
<rect class="panel" x="20" y="180" width="230" height="235" rx="8"/>
<text class="h" x="135" y="210" fill="var(--a2)">فعلیت پسندی</text>
<text class="m" x="135" y="230">کلیدی مفکرین: دورکائم، پارسنز</text>
<line x1="35" y1="245" x2="235" y2="245" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="135" y="270">بنیادی فرضیات:</text>
<text x="135" y="292">معاشرہ ایک پیچیدہ نظام ہے</text>
<text x="135" y="310">تمام حصے استحکام کے لیے کام کرتے ہیں</text>
<text x="135" y="328">ادارے سماجی ضروریات پوری کرتے ہیں</text>
<text class="h" x="135" y="358">تجزیاتی مرکز:</text>
<text x="135" y="378">ترتیب، افعال اور خرابیِ افعال</text>
<text x="135" y="396">میکرو سطح پر سماجی اتفاقِ رائے</text>

<!-- Center: Conflict Theory -->
<rect class="panel" x="275" y="180" width="230" height="235" rx="8"/>
<text class="h" x="390" y="210" fill="var(--a3)">نظریہ تنازع</text>
<text class="m" x="390" y="230">کلیدی مفکر: کارل مارکس</text>
<line x1="290" y1="245" x2="490" y2="245" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="390" y="270">بنیادی فرضیات:</text>
<text x="390" y="292">معاشرہ عدم مساوات میں بٹا ہوا ہے</text>
<text x="390" y="310">گروہ وسائل کے لیے مقابلہ کرتے ہیں</text>
<text x="390" y="328">طاقت کے ڈھانچے مراعات یافتہ طبقے کے لیے</text>
<text class="h" x="390" y="358">تجزیاتی مرکز:</text>
<text x="390" y="378">عدم مساوات، طاقت اور استحصال</text>
<text x="390" y="396">میکرو سطح پر سماجی جدوجہد</text>

<!-- Right: Symbolic Interactionism -->
<rect class="panel" x="530" y="180" width="230" height="235" rx="8"/>
<text class="h" x="645" y="210" fill="var(--a4)">علامتی باہمی تعامل</text>
<text class="m" x="645" y="230">کلیدی مفکرین: میڈ، بلومر</text>
<line x1="545" y1="245" x2="745" y2="245" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="645" y="270">بنیادی فرضیات:</text>
<text x="645" y="292">معاشرہ باہمی عمل سے تعمیر ہوتا ہے</text>
<text x="645" y="310">مشترکہ علامتیں حقیقت کا تعین کرتی ہیں</text>
<text x="645" y="328">معنی باہمی تعامل کے دوران ابھرتے ہیں</text>
<text class="h" x="645" y="358">تجزیاتی مرکز:</text>
<text x="645" y="378">معنی، شناخت اور علامتیں</text>
<text x="645" y="396">مائیکرو سطح پر روزمرہ تعامل</text>

<!-- Connector lines -->
<line class="link" x1="310" y1="110" x2="155" y2="180" marker-end="url(#ar)"/>
<line class="link" x1="390" y1="110" x2="390" y2="180" marker-end="url(#ar)"/>
<line class="link" x1="470" y1="110" x2="625" y2="180" marker-end="url(#ar)"/>
<text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
