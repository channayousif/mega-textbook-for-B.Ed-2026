<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of Major Sociological Perspectives</title><desc id="d">A comparison table of the three major sociological perspectives showing their core assumptions and levels of analysis.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hdr{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .th{font-size:14px;font-weight:700;fill:var(--a1);text-anchor:middle} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="25" y="35" width="730" height="385" fill="none" stroke="var(--ink)" stroke-width="2"/><rect class="hdr" x="25" y="35" width="730" height="55"/><line x1="210" y1="35" x2="210" y2="420" stroke="var(--ink)" stroke-width="1.5"/><line x1="560" y1="35" x2="560" y2="420" stroke="var(--ink)" stroke-width="1.5"/><text class="th" x="117" y="68">Perspective</text><text class="th" x="385" y="68">Core assumption</text><text class="th" x="655" y="68">Level of analysis</text><line x1="25" y1="170" x2="755" y2="170" stroke="var(--ink)" stroke-width="1"/><text class="h" x="40" y="115" fill="var(--a2)">Functionalism</text><text x="40" y="135" fill="var(--muted)">Durkheim, Parsons</text><text x="225" y="115">Society is a system of interrelated parts</text><text x="225" y="132">working together to maintain stability,</text><text x="225" y="149">harmony, and order.</text><text class="h" x="580" y="115">Macro-level</text><text x="580" y="135">Whole institutions</text><text x="580" y="153">&amp; society</text><line x1="25" y1="290" x2="755" y2="290" stroke="var(--ink)" stroke-width="1"/><text class="h" x="40" y="235" fill="var(--a3)">Conflict theory</text><text x="40" y="255" fill="var(--muted)">Karl Marx</text><text x="225" y="225">Society is characterized by widespread</text><text x="225" y="242">inequality; social groups compete for power</text><text x="225" y="259">and scarce resources; institutions maintain</text><text x="225" y="276">dominant group privilege.</text><text class="h" x="580" y="235">Macro-level</text><text x="580" y="255">Social classes &amp;</text><text x="580" y="273">power structures</text><text class="h" x="40" y="355" fill="var(--a4)">Symbolic</text><text class="h" x="40" y="375" fill="var(--a4)">interactionism</text><text x="40" y="395" fill="var(--muted)">Mead, Blumer</text><text x="225" y="345">Society is built through daily face-to-face</text><text x="225" y="362">interactions; people attach shared meanings</text><text x="225" y="379">to symbols and gestures which guide their</text><text x="225" y="396">behaviour and self-concept.</text><text class="h" x="580" y="355">Micro-level</text><text x="580" y="375">Interpersonal</text><text x="580" y="393">communication</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
