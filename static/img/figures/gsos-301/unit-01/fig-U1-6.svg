<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of Major Sociological Perspectives</title><desc id="d">A comparison table of the three major sociological perspectives showing their core assumptions and levels of analysis.</desc>
<style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hdr{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .th{font-size:14px;font-weight:700;fill:var(--a1);text-anchor:middle}} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style>
<rect class="bg" x="0" y="0" width="780" height="470"/>
<!-- Table Boundary -->
<rect x="25" y="35" width="730" height="385" fill="none" stroke="var(--ink)" stroke-width="2"/>

<!-- Header Row -->
<rect class="hdr" x="25" y="35" width="730" height="55"/>
<line x1="210" y1="35" x2="210" y2="420" stroke="var(--ink)" stroke-width="1.5"/>
<line x1="560" y1="35" x2="560" y2="420" stroke="var(--ink)" stroke-width="1.5"/>

<text class="th" x="117" y="68">Perspective</text>
<text class="th" x="385" y="68">Core assumption</text>
<text class="th" x="655" y="68">Level of analysis</text>

<!-- Row 1: Functionalism -->
<line x1="25" y1="170" x2="755" y2="170" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="40" y="115" fill="var(--a2)">Functionalism</text>
<text x="40" y="135" fill="var(--muted)">Durkheim, Parsons</text>
<text x="225" y="115">Society is a system of interrelated parts working</text>
<text x="225" y="135">together to maintain stability, harmony, and order.</text>
<text class="h" x="580" y="115">Macro-level</text>
<text x="580" y="135">Whole institutions &amp; society</text>

<!-- Row 2: Conflict Theory -->
<line x1="25" y1="290" x2="755" y2="290" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="40" y="235" fill="var(--a3)">Conflict theory</text>
<text x="40" y="255" fill="var(--muted)">Karl Marx</text>
<text x="225" y="225">Society is characterized by widespread inequality;</text>
<text x="225" y="245">social groups compete for power and scarce resources;</text>
<text x="225" y="265">institutions maintain dominant group privilege.</text>
<text class="h" x="580" y="235">Macro-level</text>
<text x="580" y="255">Social classes &amp; power</text>
<text x="580" y="275">structures</text>

<!-- Row 3: Symbolic Interactionism -->
<text class="h" x="40" y="355" fill="var(--a4)">Symbolic interactionism</text>
<text x="40" y="375" fill="var(--muted)">Mead, Blumer</text>
<text x="225" y="345">Society is built through daily face-to-face interactions;</text>
<text x="225" y="365">people attach shared meanings to symbols and gestures</text>
<text x="225" y="385">which guide their behaviour and self-concept.</text>
<text class="h" x="580" y="355">Micro-level</text>
<text x="580" y="375">Interpersonal communication</text>
<text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
