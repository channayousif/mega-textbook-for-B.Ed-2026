<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Sociology and Related Fields</title><desc id="d">A Venn diagram showing sociology overlapping with common sense, psychology and social work but with its own distinct zone labelled systematic study of groups, institutions and social patterns.</desc>
<style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .circle{fill:var(--panel);stroke:var(--line);stroke-width:2;fill-opacity:0.45} .soc-circle{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3;fill-opacity:0.6} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style>
<rect class="bg" x="0" y="0" width="780" height="470"/>
<!-- Overlapping Circles -->
<circle class="circle" cx="240" cy="170" r="120"/>
<circle class="circle" cx="540" cy="170" r="120"/>
<circle class="circle" cx="390" cy="320" r="110"/>
<!-- Central Sociology Circle -->
<ellipse class="soc-circle" cx="390" cy="210" rx="140" ry="110"/>

<!-- Outer Circle Labels -->
<text class="h" x="180" y="120" fill="var(--a2)">Common sense</text>
<text class="m" x="180" y="140">Unexamined everyday beliefs</text>
<text class="m" x="180" y="155">&amp; anecdotal assumptions</text>

<text class="h" x="600" y="120" fill="var(--a3)">Psychology</text>
<text class="m" x="600" y="140">Individual mental processes,</text>
<text class="m" x="600" y="155">cognition &amp; private traits</text>

<text class="h" x="390" y="395" fill="var(--a4)">Social work</text>
<text class="m" x="390" y="415">Applied intervention, clinical welfare</text>
<text class="m" x="390" y="430">&amp; individual practice</text>

<!-- Sociology Central Distinct Zone -->
<text class="h" x="390" y="195" fill="var(--a1)">Sociology</text>
<text class="m" x="390" y="215" font-weight="600">Distinct zone:</text>
<text class="m" x="390" y="232">systematic study of groups,</text>
<text class="m" x="390" y="247">institutions and social patterns</text>

<!-- Overlap Explanations -->
<text class="m" x="290" y="185">Shared daily life</text>
<text class="m" x="490" y="185">Social psychology</text>
<text class="m" x="390" y="285">Institutional analysis</text>
<text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
