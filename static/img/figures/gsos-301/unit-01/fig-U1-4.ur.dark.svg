<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عمرانیاتی بانیوں کا تقابل</title><desc id="d">عمرانیات کے چار بانیوں کا تقابلی جدول جس میں ان کے کلیدی تصورات، طریقۂ کار اور تاریخی میراث دکھائی گئی ہے۔</desc>
<style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hdr{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} .cell{stroke:var(--ink);stroke-width:1;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .th{font-size:13px;font-weight:700;fill:var(--a1);text-anchor:middle}} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style>
<rect class="bg" x="0" y="0" width="780" height="470"/>
<!-- Table Boundary -->
<rect x="20" y="30" width="740" height="395" fill="none" stroke="var(--ink)" stroke-width="2"/>

<!-- Header Row -->
<rect class="hdr" x="20" y="30" width="740" height="50"/>
<line x1="160" y1="30" x2="160" y2="425" stroke="var(--ink)" stroke-width="1.5"/>
<line x1="350" y1="30" x2="350" y2="425" stroke="var(--ink)" stroke-width="1.5"/>
<line x1="530" y1="30" x2="530" y2="425" stroke="var(--ink)" stroke-width="1.5"/>

<text class="th" x="90" y="60">بانی</text>
<text class="th" x="255" y="60">کلیدی تصور</text>
<text class="th" x="440" y="60">طریقۂ کار</text>
<text class="th" x="635" y="60">تاریخی میراث</text>

<!-- Row 1: Comte -->
<line x1="20" y1="165" x2="760" y2="165" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="30" y="110">آگسٹ کومٹ</text>
<text x="30" y="128" fill="var(--muted)">1798-1857 (فرانس)</text>
<text x="170" y="105">مثبتیت، فکر کے تین مراحل،</text>
<text x="170" y="122">سماجی جمود اور</text>
<text x="170" y="139">سماجی ارتقا</text>
<text x="360" y="112">سائنسی مشاہدہ، سماجی ترتیب</text>
<text x="360" y="130">کا تجربی مطالعہ</text>
<text x="540" y="112">شعبے کو نام دیا؛ معاشرہ</text>
<text x="540" y="130">قوانین کے تحت کام کرتا ہے</text>

<!-- Row 2: Marx -->
<line x1="20" y1="250" x2="760" y2="250" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="30" y="195">کارل مارکس</text>
<text x="30" y="213" fill="var(--muted)">1818-1883 (جرمنی)</text>
<text x="170" y="190">طبقاتی تنازع، تاریخی مادیت،</text>
<text x="170" y="207">بورژوازی اور پرولتاریہ،</text>
<text x="170" y="224">بیگانگی کا تصور</text>
<text x="360" y="197">مادی پیداوار اور معاشی طاقت</text>
<text x="360" y="215">کا تاریخی تجزیہ</text>
<text x="540" y="197">نظریہ تنازع کی بنیاد رکھی؛</text>
<text x="540" y="215">ساختی عدم مساوات پر تنقید</text>

<!-- Row 3: Durkheim -->
<line x1="20" y1="335" x2="760" y2="335" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="30" y="280">ایمائل دورکائم</text>
<text x="30" y="298" fill="var(--muted)">1858-1917 (فرانس)</text>
<text x="170" y="275">سماجی حقائق، میکانکی و</text>
<text x="170" y="292">نامیاتی یکجہتی، انومی،</text>
<text x="170" y="309">اجتماعی شعور</text>
<text x="360" y="282">شماریاتی تجزیہ، گروہوں کے</text>
<text x="360" y="300">سماجی تناسب کا تقابل</text>
<text x="540" y="282">پہلا شعبہ قائم کیا؛</text>
<text x="540" y="300">فعلیت پسندی کی</text>
<text x="540" y="318">بنیاد رکھی</text>

<!-- Row 4: Weber -->
<text class="h" x="30" y="365">میکس ویبر</text>
<text x="30" y="383" fill="var(--muted)">1864-1920 (جرمنی)</text>
<text x="170" y="360">ویرشٹین، معقولیت،</text>
<text x="170" y="377">پروٹسٹنٹ اخلاقیات، افسر شاہی،</text>
<text x="170" y="394">مثالی نمونے</text>
<text x="360" y="367">تفہیمی عمرانیات، تاریخی</text>
<text x="360" y="385">تقابلی مطالعہ</text>
<text x="540" y="367">کثیر جہتی طاقت (طبقہ، حیثیت)</text>
<text x="540" y="385">اور سماجی عمل کا تجزیہ</text>
<text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
