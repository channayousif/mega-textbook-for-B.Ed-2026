<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of Sociological Founders</title><desc id="d">A comparison table of the four founders of sociology showing their key concepts, methods and legacies.</desc>
<style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hdr{fill:var(--a1-fill);stroke:var(--ink);stroke-width:1.5} .cell{stroke:var(--ink);stroke-width:1;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .th{font-size:13px;font-weight:700;fill:var(--a1);text-anchor:middle} .wm{fill:var(--wm);font-size:11px}</style>
<rect class="bg" x="0" y="0" width="780" height="470"/>
<!-- Table Boundary -->
<rect x="20" y="30" width="740" height="395" fill="none" stroke="var(--ink)" stroke-width="2"/>

<!-- Header Row -->
<rect class="hdr" x="20" y="30" width="740" height="50"/>
<line x1="160" y1="30" x2="160" y2="425" stroke="var(--ink)" stroke-width="1.5"/>
<line x1="350" y1="30" x2="350" y2="425" stroke="var(--ink)" stroke-width="1.5"/>
<line x1="530" y1="30" x2="530" y2="425" stroke="var(--ink)" stroke-width="1.5"/>

<text class="th" x="90" y="60">Founder</text>
<text class="th" x="255" y="60">Key concept</text>
<text class="th" x="440" y="60">Method</text>
<text class="th" x="635" y="60">Legacy</text>

<!-- Row 1: Comte -->
<line x1="20" y1="165" x2="760" y2="165" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="30" y="110">Auguste Comte</text>
<text x="30" y="128" fill="var(--muted)">1798-1857 (France)</text>
<text x="170" y="105">Positivism, three stages of</text>
<text x="170" y="122">thought, social statics</text>
<text x="170" y="139">&amp; social dynamics</text>
<text x="360" y="112">Scientific observation, empirical</text>
<text x="360" y="130">study of social order</text>
<text x="540" y="112">Named the discipline; argued</text>
<text x="540" y="130">society follows lawful patterns</text>

<!-- Row 2: Marx -->
<line x1="20" y1="250" x2="760" y2="250" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="30" y="195">Karl Marx</text>
<text x="30" y="213" fill="var(--muted)">1818-1883 (Germany)</text>
<text x="170" y="190">Class conflict, historical</text>
<text x="170" y="207">materialism, bourgeoisie</text>
<text x="170" y="224">&amp; proletariat, alienation</text>
<text x="360" y="197">Historical analysis of material</text>
<text x="360" y="215">production and economic power</text>
<text x="540" y="197">Foundational for conflict theory;</text>
<text x="540" y="215">critique of structural inequality</text>

<!-- Row 3: Durkheim -->
<line x1="20" y1="335" x2="760" y2="335" stroke="var(--ink)" stroke-width="1"/>
<text class="h" x="30" y="280">Emile Durkheim</text>
<text x="30" y="298" fill="var(--muted)">1858-1917 (France)</text>
<text x="170" y="275">Social facts, mechanical &amp;</text>
<text x="170" y="292">organic solidarity, anomie,</text>
<text x="170" y="309">collective consciousness</text>
<text x="360" y="282">Statistical analysis, cross-group</text>
<text x="360" y="300">comparison of social rates</text>
<text x="540" y="282">Established first university</text>
<text x="540" y="300">department; foundation of functionalism</text>

<!-- Row 4: Weber -->
<text class="h" x="30" y="365">Max Weber</text>
<text x="30" y="383" fill="var(--muted)">1864-1920 (Germany)</text>
<text x="170" y="360">Verstehen, rationalization,</text>
<text x="170" y="377">Protestant ethic, bureaucracy,</text>
<text x="170" y="394">ideal types</text>
<text x="360" y="367">Interpretive sociology, historical</text>
<text x="360" y="385">comparative case studies</text>
<text x="540" y="367">Analyzed multidimensional power</text>
<text x="540" y="385">(class, status, party) &amp; social action</text>
<text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
