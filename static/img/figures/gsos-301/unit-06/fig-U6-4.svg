<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Key social problems in Pakistan</title><desc id="d">A table of Pakistan major social problems, each row giving the sociological explanation, a concrete Pakistani example and one possible structural response.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="15" width="155" height="35" rx="5"/><text class="sh" x="98" y="38" text-anchor="middle">Social problem</text><rect class="panel-a" x="180" y="15" width="195" height="35" rx="5"/><text class="sh" x="278" y="38" text-anchor="middle">Sociological explanation</text><rect class="panel-a" x="380" y="15" width="195" height="35" rx="5"/><text class="sh" x="478" y="38" text-anchor="middle">Pakistani example</text><rect class="panel-a" x="580" y="15" width="180" height="35" rx="5"/><text class="sh" x="670" y="38" text-anchor="middle">Structural response</text><rect class="panel" x="20" y="55" width="155" height="75" rx="5"/><text class="body" x="98" y="82" text-anchor="middle">Poverty</text><text class="small" x="98" y="100" text-anchor="middle">material lack</text><rect class="panel" x="180" y="55" width="195" height="75" rx="5"/><text class="body" x="278" y="78" text-anchor="middle">Unequal distribution</text><text class="body" x="278" y="94" text-anchor="middle">of land, schools, jobs</text><rect class="panel" x="380" y="55" width="195" height="75" rx="5"/><text class="body" x="478" y="78" text-anchor="middle">Rural Sindh landless</text><text class="body" x="478" y="94" text-anchor="middle">households below poverty line</text><rect class="panel" x="580" y="55" width="180" height="75" rx="5"/><text class="body" x="670" y="78" text-anchor="middle">Land reform,</text><text class="body" x="670" y="94" text-anchor="middle">invest in public schools</text><rect class="panel" x="20" y="135" width="155" height="75" rx="5"/><text class="body" x="98" y="162" text-anchor="middle">Crime and deviance</text><text class="small" x="98" y="180" text-anchor="middle">law and norm breaking</text><rect class="panel" x="180" y="135" width="195" height="75" rx="5"/><text class="body" x="278" y="158" text-anchor="middle">Few legitimate chances</text><text class="body" x="278" y="174" text-anchor="middle">plus weak deterrents</text><rect class="panel" x="380" y="135" width="195" height="75" rx="5"/><text class="body" x="478" y="158" text-anchor="middle">Theft in high-unemployment</text><text class="body" x="478" y="174" text-anchor="middle">neighbourhoods</text><rect class="panel" x="580" y="135" width="180" height="75" rx="5"/><text class="body" x="670" y="158" text-anchor="middle">Job programmes,</text><text class="body" x="670" y="174" text-anchor="middle">fair policing</text><rect class="panel" x="20" y="215" width="155" height="75" rx="5"/><text class="body" x="98" y="242" text-anchor="middle">Unemployment</text><text class="small" x="98" y="260" text-anchor="middle">no paid work</text><rect class="panel" x="180" y="215" width="195" height="75" rx="5"/><text class="body" x="278" y="238" text-anchor="middle">Education outputs do not</text><text class="body" x="278" y="254" text-anchor="middle">match labour market needs</text><rect class="panel" x="380" y="215" width="195" height="75" rx="5"/><text class="body" x="478" y="238" text-anchor="middle">Graduate unemployment</text><text class="body" x="478" y="254" text-anchor="middle">in Lahore, Karachi</text><rect class="panel" x="580" y="215" width="180" height="75" rx="5"/><text class="body" x="670" y="238" text-anchor="middle">Skills training,</text><text class="body" x="670" y="254" text-anchor="middle">industrial policy</text><rect class="panel" x="20" y="295" width="155" height="75" rx="5"/><text class="body" x="98" y="322" text-anchor="middle">Media issues</text><text class="small" x="98" y="340" text-anchor="middle">stereotypes, concentration</text><rect class="panel" x="180" y="295" width="195" height="75" rx="5"/><text class="body" x="278" y="318" text-anchor="middle">Few owners, narrow views,</text><text class="body" x="278" y="334" text-anchor="middle">digital divide</text><rect class="panel" x="380" y="295" width="195" height="75" rx="5"/><text class="body" x="478" y="318" text-anchor="middle">Women shown in passive</text><text class="body" x="478" y="334" text-anchor="middle">roles on TV</text><rect class="panel" x="580" y="295" width="180" height="75" rx="5"/><text class="body" x="670" y="318" text-anchor="middle">Media diversity rules,</text><text class="body" x="670" y="334" text-anchor="middle">broadband access</text><rect class="panel" x="20" y="375" width="155" height="80" rx="5"/><text class="body" x="98" y="400" text-anchor="middle">Human rights and</text><text class="body" x="98" y="418" text-anchor="middle">environment</text><rect class="panel" x="180" y="375" width="195" height="80" rx="5"/><text class="body" x="278" y="398" text-anchor="middle">Rights on paper but weak</text><text class="body" x="278" y="416" text-anchor="middle">institutions, unequal impact</text><rect class="panel" x="380" y="375" width="195" height="80" rx="5"/><text class="body" x="478" y="398" text-anchor="middle">Air pollution in cities,</text><text class="body" x="478" y="416" text-anchor="middle">flood risk for the poor</text><rect class="panel" x="580" y="375" width="180" height="80" rx="5"/><text class="body" x="670" y="398" text-anchor="middle">Enforce law, fund courts,</text><text class="body" x="670" y="416" text-anchor="middle">climate adaptation</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
