<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Drivers of social change</title><desc id="d">A concept map placing the three drivers of social change at the centre, each linked to its outcomes and to each other through feedback loops, showing that the drivers do not act in isolation.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel-a" x="280" y="170" width="220" height="70" rx="8"/><text class="h" x="390" y="200" text-anchor="middle">Modernization</text><text class="body" x="390" y="222" text-anchor="middle">industrial, urban, techintensive</text><rect class="panel-b" x="60" y="40" width="200" height="70" rx="8"/><text class="h" x="160" y="70" text-anchor="middle">Globalization</text><text class="body" x="160" y="92" text-anchor="middle">trade, media, migration links</text><rect class="panel-c" x="520" y="40" width="200" height="70" rx="8"/><text class="h" x="620" y="70" text-anchor="middle">Technology</text><text class="body" x="620" y="92" text-anchor="middle">speed and scale of change</text><rect class="panel" x="20" y="340" width="170" height="60" rx="6"/><text class="body" x="105" y="365" text-anchor="middle">New norms</text><text class="small" x="105" y="383" text-anchor="middle">family, gender, work</text><rect class="panel" x="205" y="340" width="170" height="60" rx="6"/><text class="body" x="290" y="365" text-anchor="middle">Migration</text><text class="small" x="290" y="383" text-anchor="middle">rural to urban, abroad</text><rect class="panel" x="390" y="340" width="170" height="60" rx="6"/><text class="body" x="475" y="365" text-anchor="middle">Media and culture</text><text class="small" x="475" y="383" text-anchor="middle">new values and tastes</text><rect class="panel" x="575" y="340" width="185" height="60" rx="6"/><text class="body" x="668" y="365" text-anchor="middle">Inequality</text><text class="small" x="668" y="383" text-anchor="middle">digital divide, new gaps</text><rect class="panel" x="100" y="410" width="200" height="40" rx="6"/><text class="small" x="200" y="435" text-anchor="middle">Environmental strain</text><rect class="panel" x="480" y="410" width="200" height="40" rx="6"/><text class="small" x="580" y="435" text-anchor="middle">Feedback loops between drivers</text><line class="stroke" x1="160" y1="110" x2="320" y2="180" marker-end="url(#arrow)"/><line class="stroke" x1="620" y1="110" x2="460" y2="180" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="170" x2="390" y2="110" marker-end="url(#arrow)"/><line class="stroke" x1="320" y1="230" x2="100" y2="350"/><line class="stroke" x1="390" y1="240" x2="290" y2="340"/><line class="stroke" x1="420" y1="240" x2="475" y2="340"/><line class="stroke" x1="460" y1="230" x2="650" y2="350"/><path class="stroke" d="M160,110 Q60,260 100,350" marker-end="url(#arrow)"/><path class="stroke" d="M620,110 Q720,260 660,350" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
