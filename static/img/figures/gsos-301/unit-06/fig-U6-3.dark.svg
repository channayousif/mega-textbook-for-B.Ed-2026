<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Social problems and structural causes</title><desc id="d">A concept map placing social problems in Pakistan at the centre, each linked to its structural cause and cross-linked to show how problems reinforce one another.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel-a" x="250" y="180" width="280" height="60" rx="8"/><text class="h" x="390" y="206" text-anchor="middle">Social problems in Pakistan</text><text class="small" x="390" y="226" text-anchor="middle">each produced by structures, not only individuals</text><rect class="panel-b" x="20" y="30" width="180" height="60" rx="6"/><text class="sh" x="110" y="56" text-anchor="middle">Poverty</text><text class="small" x="110" y="74" text-anchor="middle">lack of resources</text><rect class="panel-b" x="210" y="30" width="180" height="60" rx="6"/><text class="sh" x="300" y="56" text-anchor="middle">Crime and deviance</text><text class="small" x="300" y="74" text-anchor="middle">breaking laws and norms</text><rect class="panel-b" x="400" y="30" width="180" height="60" rx="6"/><text class="sh" x="490" y="56" text-anchor="middle">Unemployment</text><text class="small" x="490" y="74" text-anchor="middle">no paid work available</text><rect class="panel-c" x="20" y="340" width="180" height="60" rx="6"/><text class="sh" x="110" y="366" text-anchor="middle">Inequality</text><text class="small" x="110" y="384" text-anchor="middle">class, caste, gender gaps</text><rect class="panel-c" x="210" y="340" width="180" height="60" rx="6"/><text class="sh" x="300" y="366" text-anchor="middle">Institutions</text><text class="small" x="300" y="384" text-anchor="middle">family, education, economy</text><rect class="panel-d" x="400" y="340" width="180" height="60" rx="6"/><text class="sh" x="490" y="366" text-anchor="middle">Economic arrangements</text><text class="small" x="490" y="384" text-anchor="middle">land, jobs, wealth</text><rect class="panel-d" x="590" y="340" width="170" height="60" rx="6"/><text class="sh" x="675" y="366" text-anchor="middle">Weak regulation</text><text class="small" x="675" y="384" text-anchor="middle">laws not enforced fairly</text><rect class="panel-a" x="590" y="110" width="170" height="50" rx="6"/><text class="body" x="675" y="132" text-anchor="middle">Cross links</text><text class="small" x="675" y="148" text-anchor="middle">problems reinforce each other</text><line class="stroke" x1="110" y1="90" x2="320" y2="180"/><line class="stroke" x1="300" y1="90" x2="370" y2="180"/><line class="stroke" x1="490" y1="90" x2="430" y2="180"/><line class="stroke" x1="390" y1="240" x2="110" y2="340"/><line class="stroke" x1="390" y1="240" x2="300" y2="340"/><line class="stroke" x1="390" y1="240" x2="490" y2="340"/><line class="stroke" x1="390" y1="240" x2="675" y2="340"/><line class="stroke" x1="200" y1="60" x2="290" y2="60"/><line class="stroke" x1="390" y1="60" x2="480" y2="60"/><line class="stroke" x1="110" y1="370" x2="200" y2="370"/><line class="stroke" x1="390" y1="370" x2="480" y2="370"/><line class="stroke" x1="580" y1="370" x2="620" y2="370"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
