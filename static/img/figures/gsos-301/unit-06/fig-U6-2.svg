<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Modernization and tradition compared</title><desc id="d">A side-by-side comparison table of modernization and tradition across five dimensions, each row grounded in a concrete Pakistani example.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="20" width="370" height="40" rx="6"/><text class="h" x="205" y="46" text-anchor="middle">Modernization</text><rect class="panel-b" x="400" y="20" width="360" height="40" rx="6"/><text class="h" x="580" y="46" text-anchor="middle">Tradition</text><rect class="panel" x="20" y="68" width="100" height="75" rx="6"/><text class="sh" x="70" y="95" text-anchor="middle">Authority</text><rect class="panel" x="130" y="68" width="260" height="75" rx="6"/><text class="body" x="260" y="95" text-anchor="middle">Law, constitutions, elected</text><text class="small" x="260" y="115" text-anchor="middle">governments (e.g. local council)</text><rect class="panel" x="400" y="68" width="100" height="75" rx="6"/><text class="sh" x="450" y="95" text-anchor="middle">Authority</text><rect class="panel" x="510" y="68" width="250" height="75" rx="6"/><text class="body" x="635" y="95" text-anchor="middle">Custom, elders, religious</text><text class="small" x="635" y="115" text-anchor="middle">leaders (e.g. village headman)</text><rect class="panel" x="20" y="151" width="100" height="75" rx="6"/><text class="sh" x="70" y="178" text-anchor="middle">Family form</text><rect class="panel" x="130" y="151" width="260" height="75" rx="6"/><text class="body" x="260" y="178" text-anchor="middle">Nuclear households, choice</text><text class="small" x="260" y="198" text-anchor="middle">in marriage grow in cities</text><rect class="panel" x="400" y="151" width="100" height="75" rx="6"/><text class="sh" x="450" y="178" text-anchor="middle">Family form</text><rect class="panel" x="510" y="151" width="250" height="75" rx="6"/><text class="body" x="635" y="178" text-anchor="middle">Joint families, arranged</text><text class="small" x="635" y="198" text-anchor="middle">marriage common in rural areas</text><rect class="panel" x="20" y="234" width="100" height="75" rx="6"/><text class="sh" x="70" y="261" text-anchor="middle">Education</text><rect class="panel" x="130" y="234" width="260" height="75" rx="6"/><text class="body" x="260" y="261" text-anchor="middle">Formal schools, universities,</text><text class="small" x="260" y="281" text-anchor="middle">skills for a changing economy</text><rect class="panel" x="400" y="234" width="100" height="75" rx="6"/><text class="sh" x="450" y="261" text-anchor="middle">Education</text><rect class="panel" x="510" y="234" width="250" height="75" rx="6"/><text class="body" x="635" y="261" text-anchor="middle">Informal, apprenticeship,</text><text class="small" x="635" y="281" text-anchor="middle">religious schooling in many villages</text><rect class="panel" x="20" y="317" width="100" height="75" rx="6"/><text class="sh" x="70" y="344" text-anchor="middle">Gender roles</text><rect class="panel" x="130" y="317" width="260" height="75" rx="6"/><text class="body" x="260" y="344" text-anchor="middle">Women in formal employment,</text><text class="small" x="260" y="364" text-anchor="middle">girls' schooling expanding</text><rect class="panel" x="400" y="317" width="100" height="75" rx="6"/><text class="sh" x="450" y="344" text-anchor="middle">Gender roles</text><rect class="panel" x="510" y="317" width="250" height="75" rx="6"/><text class="body" x="635" y="344" text-anchor="middle">Domestic roles for women,</text><text class="small" x="635" y="364" text-anchor="middle">male authority in many areas</text><rect class="panel" x="20" y="400" width="100" height="55" rx="6"/><text class="sh" x="70" y="424" text-anchor="middle">Past</text><rect class="panel" x="130" y="400" width="260" height="55" rx="6"/><text class="body" x="260" y="430" text-anchor="middle">Seen as something to move beyond</text><rect class="panel" x="400" y="400" width="100" height="55" rx="6"/><text class="sh" x="450" y="424" text-anchor="middle">Past</text><rect class="panel" x="510" y="400" width="250" height="55" rx="6"/><text class="body" x="635" y="430" text-anchor="middle">Honoured, a guide for present life</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
