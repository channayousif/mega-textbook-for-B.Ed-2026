<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three directions of social mobility compared</title><desc id="d">Mobility can be classified by direction and time comparison; a labourer's son becoming a teacher illustrates upward intergenerational mobility, while a same-grade transfer may be horizontal.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .stroke{stroke:var(--ink);stroke-width:1.5;fill:none} .grid{stroke:var(--ink);stroke-width:1;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:13px;font-weight:600;fill:var(--ink)} .small{font-size:11px;fill:var(--muted)} .muted{fill:var(--muted)}.ink{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="390" y="30" text-anchor="middle">Classify mobility by direction and by time comparison</text><line class="grid" x1="20" y1="50" x2="760" y2="50"/><text class="sh" x="160" y="72" text-anchor="middle">Direction</text><text class="sh" x="390" y="72" text-anchor="middle">Time comparison</text><text class="sh" x="620" y="72" text-anchor="middle">Fictional Pakistani case</text><line class="stroke" x1="20" y1="84" x2="760" y2="84"/><rect class="panel-a" x="20" y="92" width="300" height="100" rx="6"/><text class="h" x="170" y="118" text-anchor="middle">Upward mobility</text><text class="ink" x="170" y="140" text-anchor="middle">Movement to a more advantaged position</text><text class="ink" x="170" y="162" text-anchor="middle">Greater security or resources</text><line class="grid" x1="330" y1="92" x2="330" y2="192"/><rect class="panel" x="330" y="92" width="220" height="46" rx="4"/><text class="sh" x="440" y="112" text-anchor="middle">Intergenerational</text><text class="small" x="440" y="130" text-anchor="middle">Compare across generations</text><rect class="panel" x="330" y="146" width="220" height="38" rx="4"/><text class="sh" x="440" y="166" text-anchor="middle">Intragenerational</text><text class="small" x="440" y="182" text-anchor="middle">Compare one person over time</text><line class="grid" x1="560" y1="92" x2="560" y2="192"/><rect class="panel" x="560" y="92" width="200" height="100" rx="6"/><text class="ink" x="660" y="120" text-anchor="middle">A labourer's son in Sanghar</text><text class="ink" x="660" y="140" text-anchor="middle">qualifies as a teacher: upward</text><text class="ink" x="660" y="160" text-anchor="middle">intergenerational mobility</text><text class="small" x="660" y="182" text-anchor="middle">father and son compared</text><line class="stroke" x1="20" y1="198" x2="760" y2="198"/><rect class="panel-b" x="20" y="206" width="300" height="100" rx="6"/><text class="h" x="170" y="232" text-anchor="middle">Downward mobility</text><text class="ink" x="170" y="254" text-anchor="middle">Movement to a less advantaged position</text><text class="ink" x="170" y="276" text-anchor="middle">Loss of security or resources</text><line class="grid" x1="330" y1="206" x2="330" y2="306"/><rect class="panel" x="330" y="206" width="220" height="46" rx="4"/><text class="sh" x="440" y="226" text-anchor="middle">Intergenerational</text><text class="small" x="440" y="244" text-anchor="middle">Compare across generations</text><rect class="panel" x="330" y="260" width="220" height="38" rx="4"/><text class="sh" x="440" y="280" text-anchor="middle">Intragenerational</text><text class="small" x="440" y="296" text-anchor="middle">Compare one person over time</text><line class="grid" x1="560" y1="206" x2="560" y2="306"/><rect class="panel" x="560" y="206" width="200" height="100" rx="6"/><text class="ink" x="660" y="234" text-anchor="middle">A shopkeeper loses a business</text><text class="ink" x="660" y="254" text-anchor="middle">after a flood: downward mobility</text><text class="ink" x="660" y="274" text-anchor="middle">Blame is not an explanation</text><text class="small" x="660" y="296" text-anchor="middle">examine assets, debt, security</text><line class="stroke" x1="20" y1="312" x2="760" y2="312"/><rect class="panel-c" x="20" y="320" width="300" height="120" rx="6"/><text class="h" x="170" y="346" text-anchor="middle">Horizontal mobility</text><text class="ink" x="170" y="368" text-anchor="middle">Change of position at a similar rank</text><text class="ink" x="170" y="390" text-anchor="middle">Broadly similar resources</text><line class="grid" x1="330" y1="320" x2="330" y2="440"/><rect class="panel" x="330" y="320" width="220" height="60" rx="4"/><text class="sh" x="440" y="340" text-anchor="middle">Intergenerational</text><text class="small" x="440" y="358" text-anchor="middle">Compare across generations</text><rect class="panel" x="330" y="388" width="220" height="52" rx="4"/><text class="sh" x="440" y="408" text-anchor="middle">Intragenerational</text><text class="small" x="440" y="426" text-anchor="middle">Compare one person over time</text><line class="grid" x1="560" y1="320" x2="560" y2="440"/><rect class="panel" x="560" y="320" width="200" height="120" rx="6"/><text class="ink" x="660" y="348" text-anchor="middle">A teacher transfers to another</text><text class="ink" x="660" y="365" text-anchor="middle">school on the same</text><text class="ink" x="660" y="382" text-anchor="middle">grade: may be</text><text class="ink" x="660" y="399" text-anchor="middle">horizontal mobility</text><text class="small" x="660" y="416" text-anchor="middle">check housing and commuting cost</text><text class="wm" x="768" y="450" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
