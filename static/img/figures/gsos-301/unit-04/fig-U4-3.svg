<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How learned gender roles connect to gender inequality</title><desc id="d">Gender expectations can shape task allocation and unequal opportunities, whose outcomes may reinforce stereotypes; feminist responses address both equal access and the organisation of work and power.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .stroke{stroke:var(--ink);stroke-width:2;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .stroke-b{stroke:var(--a2);stroke-width:2;fill:none} .arw{stroke:var(--a1);stroke-width:2;fill:none} .arw-b{stroke:var(--a3);stroke-width:2;fill:none} .ah{fill:var(--a1)}.ah-b{fill:var(--a3)} text{font-size:13px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:13px;font-weight:600;fill:var(--ink)} .small{font-size:11px;fill:var(--muted)} .muted{fill:var(--muted)}.ink{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker><marker id="a1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="560"/><text class="h" x="430" y="28" text-anchor="middle">From learned roles to inequality, and two feminist responses</text><rect class="panel-a" x="320" y="48" width="220" height="64" rx="8"/><text class="sh" x="430" y="72" text-anchor="middle">Learned gender roles</text><text class="small" x="430" y="92" text-anchor="middle">Expectations tied to gender, not biology</text><rect class="panel-b" x="80" y="160" width="200" height="56" rx="8"/><text class="sh" x="180" y="184" text-anchor="middle">Gender stereotypes</text><text class="small" x="180" y="204" text-anchor="middle">Overgeneralised group beliefs</text><rect class="panel-c" x="330" y="160" width="200" height="56" rx="8"/><text class="sh" x="430" y="184" text-anchor="middle">Task allocation</text><text class="small" x="430" y="204" text-anchor="middle">Who does what, and who practises</text><rect class="panel-d" x="580" y="160" width="200" height="56" rx="8"/><text class="sh" x="680" y="184" text-anchor="middle">Unequal practice</text><text class="small" x="680" y="204" text-anchor="middle">Different experience, different confidence</text><rect class="panel" x="320" y="270" width="220" height="56" rx="8"/><text class="sh" x="430" y="294" text-anchor="middle">Gender inequality</text><text class="small" x="430" y="314" text-anchor="middle">Unequal opportunities and outcomes</text><rect class="panel-c" x="80" y="380" width="220" height="56" rx="8"/><text class="sh" x="190" y="404" text-anchor="middle">Unequal outcomes</text><text class="small" x="190" y="424" text-anchor="middle">Reinforce the original stereotypes</text><rect class="panel-a" x="320" y="380" width="220" height="56" rx="8"/><text class="sh" x="430" y="404" text-anchor="middle">Liberal feminist response</text><text class="small" x="430" y="424" text-anchor="middle">Equal rights, remove discriminatory rules</text><rect class="panel-b" x="580" y="380" width="220" height="56" rx="8"/><text class="sh" x="690" y="404" text-anchor="middle">Structural feminist response</text><text class="small" x="690" y="424" text-anchor="middle">Change unpaid work, power and economic dependence</text><line class="arw" x1="430" y1="112" x2="180" y2="158" marker-end="url(#a1)"/><line class="arw" x1="430" y1="112" x2="430" y2="158" marker-end="url(#a1)"/><line class="arw" x1="430" y1="112" x2="680" y2="158" marker-end="url(#a1)"/><line class="arw" x1="180" y1="216" x2="400" y2="268" marker-end="url(#a1)"/><line class="arw" x1="430" y1="216" x2="430" y2="268" marker-end="url(#a1)"/><line class="arw" x1="680" y1="216" x2="460" y2="268" marker-end="url(#a1)"/><line class="arw-b" x1="430" y1="326" x2="190" y2="378" marker-end="url(#a3)" stroke-dasharray="6 3"/><text class="small" x="280" y="360" text-anchor="middle">feedback loop</text><line class="arw" x1="380" y1="326" x2="380" y2="378" marker-end="url(#a1)"/><line class="arw" x1="480" y1="326" x2="680" y2="378" marker-end="url(#a1)"/><rect x="290" y="460" width="280" height="60" rx="8" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="sh" x="430" y="484" text-anchor="middle">Both responses can work together</text><text class="small" x="430" y="504" text-anchor="middle">equal access rules and structural changes are both needed</text><line class="stroke" stroke-dasharray="4 3" x1="430" y1="436" x2="430" y2="458"/><text class="wm" x="848" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
