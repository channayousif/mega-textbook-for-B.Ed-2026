<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three dimensions of stratification</title><desc id="d">Class, caste and status describe different bases of ranking; a respected teacher may have modest income and inherited group boundaries may persist despite income change.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .ink{fill:var(--ink)}.muted{fill:var(--muted)} text{font-size:14px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:13px;font-weight:600;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="390" y="32" text-anchor="middle">Three separate dimensions of stratification</text><text class="small" x="390" y="52" text-anchor="middle">Each dimension is a different basis of ranking. They need not match for any one person.</text><rect class="panel-a" x="24" y="72" width="232" height="200" rx="8"/><text class="h" x="140" y="104" text-anchor="middle">Class</text><text class="sh" x="140" y="128" text-anchor="middle">Economic position</text><line class="stroke-a" x1="40" y1="142" x2="240" y2="142"/><text class="ink" x="140" y="166" text-anchor="middle">Income: a flow, such as wages</text><text class="ink" x="140" y="190" text-anchor="middle">Wealth: a stock, such as land</text><text class="small" x="140" y="218" text-anchor="middle">Example: a household may rent</text><text class="small" x="140" y="238" text-anchor="middle">its home and live on daily wages</text><text class="small" x="140" y="260" text-anchor="middle">or own valuable land with little cash</text><rect class="panel-b" x="274" y="72" width="232" height="200" rx="8"/><text class="h" x="390" y="104" text-anchor="middle">Caste</text><text class="sh" x="390" y="128" text-anchor="middle">Inherited group boundaries</text><line class="stroke" stroke="var(--a2)" x1="290" y1="142" x2="490" y2="142" style="stroke:var(--a2);stroke-width:2;fill:none"/><text class="ink" x="390" y="166" text-anchor="middle">Assigned at birth</text><text class="ink" x="390" y="190" text-anchor="middle">Rules may restrict marriage or</text><text class="ink" x="390" y="210" text-anchor="middle">work across group boundaries</text><text class="small" x="390" y="238" text-anchor="middle">A biradari is a kinship network;</text><text class="small" x="390" y="260" text-anchor="middle">ask what it actually does</text><rect class="panel-c" x="524" y="72" width="232" height="200" rx="8"/><text class="h" x="640" y="104" text-anchor="middle">Status</text><text class="sh" x="640" y="128" text-anchor="middle">Social respect or esteem</text><line class="stroke" stroke="var(--a3)" x1="540" y1="142" x2="740" y2="142" style="stroke:var(--a3);stroke-width:2;fill:none"/><text class="ink" x="640" y="166" text-anchor="middle">The respect people receive</text><text class="ink" x="640" y="190" text-anchor="middle">Prestige, power and wealth can</text><text class="ink" x="640" y="210" text-anchor="middle">overlap without being identical</text><text class="small" x="640" y="238" text-anchor="middle">A retired teacher may be widely</text><text class="small" x="640" y="260" text-anchor="middle">respected with modest wealth</text><rect class="panel" x="24" y="300" width="732" height="190" rx="8"/><text class="h" x="390" y="330" text-anchor="middle">A fictional Sindh teacher - the dimensions need not match</text><text class="sh" x="140" y="364" text-anchor="middle">Class: modest income</text><text class="sh" x="390" y="364" text-anchor="middle">Caste: inherited boundaries persist</text><text class="sh" x="640" y="364" text-anchor="middle">Status: widely respected</text><text class="ink" x="140" y="392" text-anchor="middle">Government salary, rents flat</text><text class="ink" x="390" y="392" text-anchor="middle">Marriage and networks follow</text><text class="ink" x="390" y="412" text-anchor="middle">inherited community lines</text><text class="ink" x="640" y="392" text-anchor="middle">Families trust her advice on</text><text class="ink" x="640" y="412" text-anchor="middle">learning and school choices</text><text class="small" x="390" y="448" text-anchor="middle">The three rankings are different. Do not read one from another.</text><text class="small" x="390" y="468" text-anchor="middle">An advantage in one dimension is not proof of ability or worth.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
