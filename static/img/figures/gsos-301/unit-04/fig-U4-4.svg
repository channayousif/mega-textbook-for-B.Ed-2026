<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Gender inequality evidence across three domains</title><desc id="d">The education row gives published 2023 literacy percentages; the work and health rows ask what comparable evidence is needed and do not present invented numerical gaps.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .stroke{stroke:var(--ink);stroke-width:1.5;fill:none} .grid{stroke:var(--ink);stroke-width:1;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .small{font-size:11px;fill:var(--muted)} .muted{fill:var(--muted)}.ink{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="390" y="28" text-anchor="middle">Gender inequality: published evidence and evidence still needed</text><text class="sh" x="130" y="58" text-anchor="middle">Domain</text><text class="sh" x="390" y="58" text-anchor="middle">Indicator and evidence</text><text class="sh" x="640" y="58" text-anchor="middle">What to check before explaining a gap</text><line class="stroke" x1="20" y1="68" x2="760" y2="68"/><rect class="panel-a" x="20" y="78" width="220" height="94" rx="6"/><text class="h" x="130" y="106" text-anchor="middle">Education</text><line class="grid" x1="250" y1="78" x2="250" y2="172"/><rect class="panel" x="250" y="78" width="260" height="94" rx="6"/><text class="ink" x="380" y="102" text-anchor="middle">Literacy at age ten and above</text><text class="ink" x="380" y="122" text-anchor="middle">Census 2023, Table 10.2</text><text class="sh" x="380" y="144" text-anchor="middle">male 68.00% | female 52.84%</text><text class="sh" x="380" y="162" text-anchor="middle">transgender 40.15%</text><line class="grid" x1="520" y1="78" x2="520" y2="172"/><rect class="panel" x="520" y="78" width="240" height="94" rx="6"/><text class="ink" x="640" y="102" text-anchor="middle">Age coverage and geographic scope</text><text class="ink" x="640" y="122" text-anchor="middle">This is not current enrolment</text><text class="small" x="640" y="144" text-anchor="middle">Aggregate gap; does not describe</text><text class="small" x="640" y="160" text-anchor="middle">an individual child's ability</text><line class="stroke" x1="20" y1="176" x2="760" y2="176"/><rect class="panel-b" x="20" y="186" width="220" height="94" rx="6"/><text class="h" x="130" y="214" text-anchor="middle">Work</text><line class="grid" x1="250" y1="186" x2="250" y2="280"/><rect class="panel" x="250" y="186" width="260" height="94" rx="6"/><text class="ink" x="380" y="210" text-anchor="middle">Labour-force participation by sex</text><text class="sh" x="380" y="232" text-anchor="middle">No numerical estimate supplied here</text><text class="small" x="380" y="254" text-anchor="middle">The row asks what comparable</text><text class="small" x="380" y="270" text-anchor="middle">evidence is needed</text><line class="grid" x1="520" y1="186" x2="520" y2="280"/><rect class="panel" x="520" y="186" width="240" height="94" rx="6"/><text class="ink" x="640" y="210" text-anchor="middle">Source year and age range</text><text class="ink" x="640" y="230" text-anchor="middle">Definition of employment</text><text class="small" x="640" y="252" text-anchor="middle">Is unpaid family or domestic</text><text class="small" x="640" y="268" text-anchor="middle">work counted?</text><line class="stroke" x1="20" y1="284" x2="760" y2="284"/><rect class="panel-c" x="20" y="294" width="220" height="88" rx="6"/><text class="h" x="130" y="320" text-anchor="middle">Health</text><line class="grid" x1="250" y1="294" x2="250" y2="382"/><rect class="panel" x="250" y="294" width="260" height="88" rx="6"/><text class="ink" x="380" y="318" text-anchor="middle">Access to needed care by sex or gender</text><text class="sh" x="380" y="338" text-anchor="middle">No numerical estimate supplied here</text><text class="small" x="380" y="360" text-anchor="middle">Evidence questions only</text><line class="grid" x1="520" y1="294" x2="520" y2="382"/><rect class="panel" x="520" y="294" width="240" height="88" rx="6"/><text class="ink" x="640" y="318" text-anchor="middle">Comparable need and age group</text><text class="ink" x="640" y="338" text-anchor="middle">Travel, cost and access barriers</text><text class="small" x="640" y="360" text-anchor="middle">Different needs are not identical</text><text class="wm" x="768" y="392" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
