<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک خاکہ جس کے مرکز میں ایک استانی ہے اور اس سے کئی مقامات شاخوں کی صورت نکلتے ہیں (استاد، کھیلوں کی منتظم، کمیٹی کی رکن، نائب، خاندان کی فرد)، ہر مقام اپنے کردار سے جڑا ہے، اور ایک دوسرے پر چڑھتے تیر کردار کے تناؤ کو ظاہر کرتے ہیں۔</title><desc id="d">ایک خاکہ جس کے مرکز میں ایک استانی ہے اور اس سے کئی مقامات شاخوں کی صورت نکلتے ہیں (استاد، کھیلوں کی منتظم، کمیٹی کی رکن، نائب، خاندان کی فرد)، ہر مقام اپنے کردار سے جڑا ہے، اور ایک دوسرے پر چڑھتے تیر کردار کے تناؤ کو ظاہر کرتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.body{font-size:16px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="780" height="470" fill="var(--bg)"/><rect x="285" y="180" width="210" height="72" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="390.0" y="212" text-anchor="middle" class="h"><tspan x="390.0" dy="0">استاد</tspan></text><path d="M390,180 L650,125" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="35" width="210" height="90" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text x="650.0" y="67" text-anchor="middle" class="body"><tspan x="650.0" dy="0">استاد</tspan><tspan x="650.0" dy="29">منصوبہ بندی اور جانچ</tspan></text><path d="M390,180 L390,125" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="35" width="210" height=