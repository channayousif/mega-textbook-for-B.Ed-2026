<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دیہی اور شہری پاکستان میں معاشرتی تعامل کے انداز کا تقابلی جدول، جس میں ماحول، غالب انداز، تنازع کے حل، ابلاغ کے انداز اور مثالوں کے فرق دکھائے گئے ہیں۔</title><desc id="d">دیہی اور شہری پاکستان میں معاشرتی تعامل کے انداز کا تقابلی جدول، جس میں ماحول، غالب انداز، تنازع کے حل، ابلاغ کے انداز اور مثالوں کے فرق دکھائے گئے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.body{font-size:16px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="780" height="470" fill="var(--bg)"/><rect x="510" y="20" width="240" height="64" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="630.0" y="52" text-anchor="middle" class="h"><tspan x="630.0" dy="0">تعامل کا پہلو</tspan></text><rect x="270" y="20" width="240" height="64" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="390.0" y="52" text-anchor="middle" class="h"><tspan x="390.0" dy="0">دیہی پاکستان</tspan></text><rect x="30" y="20" width="240" height="64" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="150.0" y="52" text-anchor="middle" class="h"><tspan x="150.0" dy="0">شہری پاکستان</tspan></text><rect x="510" y="84" width="240" height="66" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/><text x="630" y="110" text-anchor="middle" class="body"><tspan x="630" dy="0">عام ماحول</tspan></text><rect x="270" y="84" width="