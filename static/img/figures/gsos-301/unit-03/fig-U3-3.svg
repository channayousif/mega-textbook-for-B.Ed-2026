<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t">A flowchart showing three social interaction processes branching from a situation: cooperation leads to shared success, competition leads to winner and loser within rules, and conflict leads to resolution or escalation.</title><desc id="d">A flowchart showing three social interaction processes branching from a situation: cooperation leads to shared success, competition leads to winner and loser within rules, and conflict leads to resolution or escalation.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.body{font-size:16px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="780" height="470" fill="var(--bg)"/><rect x="270" y="15" width="240" height="55" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="390.0" y="47" text-anchor="middle" class="h"><tspan x="390.0" dy="0">Social situation</tspan></text><path d="M390,70 L390,95" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><polygon points="390,90 570,143 390,196 210,143" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><text x="390" y="138" text-anchor="middle" class="body"><tspan x="390" dy="0">Shared goal or</tspan><tspan x="390" dy="29">opposed goal?</tspan></text><path d="M390,196 L140,220" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="220" width="230" height="105" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text x="140.0" y="252" text-anchor="middle" class="h"><tspan x="140.0" dy="0">Cooperation</tspan><tspan x="140.0" dy="29">Shared goal</tspan><tspan x="140.0" dy="29">Joint effort</tspan></text><path d="M140,325 L140,350" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="350" width="230" height="78" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text x="140.0" y="382" text-anchor="middle" class="body"><tspan x="140.0" dy="0">Shared success</tspan></text><path d="M390,196 L390,220" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="220" width="230" height="105" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="390.0" y="252" text-anchor="middle" class="h"><tspan x="390.0" dy="0">Competition</tspan><tspan x="390.0" dy="29">Opposed goal</tspan><tspan x="390.0" dy="29">Rule-bound rivalry</tspan></text><path d="M390,325 L390,350" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="350" width="230" height="78" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="390.0" y="382" text-anchor="middle" class="body"><tspan x="390.0" dy="0">Winner and loser</tspan><tspan x="390.0" dy="29">within rules</tspan></text><path d="M390,196 L640,220" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="525" y="220" width="230" height="105" rx="10" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text x="640.0" y="252" text-anchor="middle" class="h"><tspan x="640.0" dy="0">Conflict</tspan><tspan x="640.0" dy="29">Opposed goal</tspan><tspan x="640.0" dy="29">Direct opposition</tspan></text><path d="M640,325 L640,350" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="525" y="350" width="230" height="78" rx="10" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text x="640.0" y="382" text-anchor="middle" class="body"><tspan x="640.0" dy="0">Resolution or</tspan><tspan x="640.0" dy="29">escalation</tspan></text><text class="wm" x="768" y="457" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
