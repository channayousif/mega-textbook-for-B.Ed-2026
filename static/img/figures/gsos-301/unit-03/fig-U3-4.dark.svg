<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="t">A comparison table of social interaction patterns in rural and urban Pakistan, showing differences in setting, dominant pattern, conflict resolution, communication style and examples.</title><desc id="d">A comparison table of social interaction patterns in rural and urban Pakistan, showing differences in setting, dominant pattern, conflict resolution, communication style and examples.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.body{font-size:16px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="780" height="470" fill="var(--bg)"/><rect x="30" y="20" width="240" height="64" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="150.0" y="52" text-anchor="middle" class="h"><tspan x="150.0" dy="0">Interaction aspect</tspan></text><rect x="270" y="20" width="240" height="64" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="390.0" y="52" text-anchor="middle" class="h"><tspan x="390.0" dy="0">Rural Pakistan</tspan></text><rect x="510" y="20" width="240" height="64" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="630.0" y="52" text-anchor="middle" class="h"><tspan x="630.0" dy="0">Urban Pakistan</tspan></text><rect x="30" y="84" width="240" height="66" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/><text x="150" y="110" text-anchor="middle" class="body"><tspan x="150" dy="0">Typical setting</tspan></text><rect x="270" y="84" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="390" y="110" text-anchor="middle" class="body"><tspan x="390" dy="0">Village community</tspan></text><rect x="510" y="84" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="630" y="110" text-anchor="middle" class="body"><tspan x="630" dy="0">Large city school</tspan></text><rect x="30" y="150" width="240" height="66" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/><text x="150" y="176" text-anchor="middle" class="body"><tspan x="150" dy="0">Dominant pattern</tspan></text><rect x="270" y="150" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="390" y="176" text-anchor="middle" class="body"><tspan x="390" dy="0">Personal ties;</tspan><tspan x="390" dy="29">cooperation</tspan></text><rect x="510" y="150" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="630" y="176" text-anchor="middle" class="body"><tspan x="630" dy="0">Formal exchanges;</tspan><tspan x="630" dy="29">competition</tspan></text><rect x="30" y="216" width="240" height="66" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/><text x="150" y="242" text-anchor="middle" class="body"><tspan x="150" dy="0">Conflict resolution</tspan></text><rect x="270" y="216" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="390" y="242" text-anchor="middle" class="body"><tspan x="390" dy="0">Community elders</tspan></text><rect x="510" y="216" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="630" y="242" text-anchor="middle" class="body"><tspan x="630" dy="0">Formal procedures</tspan></text><rect x="30" y="282" width="240" height="66" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/><text x="150" y="308" text-anchor="middle" class="body"><tspan x="150" dy="0">Communication style</tspan></text><rect x="270" y="282" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="390" y="308" text-anchor="middle" class="body"><tspan x="390" dy="0">Face-to-face</tspan></text><rect x="510" y="282" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="630" y="308" text-anchor="middle" class="body"><tspan x="630" dy="0">Notices and</tspan><tspan x="630" dy="29">digital messages</tspan></text><rect x="30" y="348" width="240" height="66" fill="var(--panel)" stroke="var(--ink)" stroke-width="1"/><text x="150" y="374" text-anchor="middle" class="body"><tspan x="150" dy="0">Example</tspan></text><rect x="270" y="348" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="390" y="374" text-anchor="middle" class="body"><tspan x="390" dy="0">Neighbours share</tspan><tspan x="390" dy="29">farm work</tspan></text><rect x="510" y="348" width="240" height="66" fill="var(--bg)" stroke="var(--ink)" stroke-width="1"/><text x="630" y="374" text-anchor="middle" class="body"><tspan x="630" dy="0">Teachers use</tspan><tspan x="630" dy="29">official notices</tspan></text><text class="wm" x="768" y="457" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
