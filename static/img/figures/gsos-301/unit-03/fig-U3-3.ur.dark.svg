<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک بہاؤ چارٹ جس میں ایک صورتحال سے معاشرتی تعامل کے تین عمل شاخوں کی صورت نکلتے ہیں: تعاون مشترکہ کامیابی تک لے جاتا ہے، مقابلہ قواعد کے اندر جیت اور ہار تک، اور تصادم حل یا شدت میں اضافے تک۔</title><desc id="d">ایک بہاؤ چارٹ جس میں ایک صورتحال سے معاشرتی تعامل کے تین عمل شاخوں کی صورت نکلتے ہیں: تعاون مشترکہ کامیابی تک لے جاتا ہے، مقابلہ قواعد کے اندر جیت اور ہار تک، اور تصادم حل یا شدت میں اضافے تک۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}text{fill:var(--ink);font-size:16px}.h{font-size:18px;font-weight:700}.body{font-size:16px}.wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs><rect width="780" height="470" fill="var(--bg)"/><rect x="270" y="15" width="240" height="55" rx="10" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text x="390.0" y="47" text-anchor="middle" class="h"><tspan x="390.0" dy="0">معاشرتی صورت حال</tspan></text><path d="M390,70 L390,95" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><polygon points="390,90 570,143 390,196 210,143" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><text x="390" y="138" text-anchor="middle" class="body"><tspan x="390" dy="0">مشترکہ مقصد یا</tspan><tspan x="390" dy="29">مخالف مقصد؟</tspan></text><path d="M390,196 L640,220" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="525" y="220" width="230" height="105" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text x="