roke="var(--a1)" stroke-width="2"/><text x="390.0" y="67" text-anchor="middle" class="body"><tspan x="390.0" dy="0">Sports coordinator</tspan><tspan x="390.0" dy="29">Organise tournament</tspan></text><path d="M390,180 L650,125" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="35" width="210" height="90" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text x="650.0" y="67" text-anchor="middle" class="body"><tspan x="650.0" dy="0">Committee member</tspan><tspan x="650.0" dy="29">Prepare examinations</tspan></text><path d="M390,252 L130,300" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="300" width="210" height="90" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text x="130.0" y="332" text-anchor="middle" class="body"><tspan x="130.0" dy="0">Deputy</tspan><tspan x="130.0" dy="29">Manage discipline</tspan></text><path d="M390,252 L650,300" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="300" width="210" height="90" rx="10" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text x="650.0" y="332" text-anchor="middle" class="body"><tspan x="650.0" dy="0">Wife / daughter-in-law</tspan><tspan x="650.0" dy="29">Care for household</tspan></text><path d="M230,285 L550,285" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M550,278 L230,278" fill="none" stroke="var(--ink)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="390" y="420" text-anchor="middle" class="body"><tspan x="390" dy="0">Overlapping demands: role strain</tspan></text><text class="wm" x="768" y="457" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
