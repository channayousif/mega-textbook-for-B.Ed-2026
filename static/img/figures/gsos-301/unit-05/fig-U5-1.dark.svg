<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Family, education and religion as social institutions</title><desc id="d">A concept map with the idea of a social institution at the top linked to family, education and religion; each institution lists its main functions, and two-way arrows between the three show that each one shapes the others.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.arw{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--a1)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}text{font-size:14px;fill:var(--ink)}.h{font-size:17px;font-weight:700;fill:var(--ink)}.sh{font-size:15px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="520"/><text class="h" x="430" y="30" text-anchor="middle"><tspan x="430" dy="0">Three social institutions and how they shape one another</tspan></text><rect class="panel" x="205" y="48" width="450" height="64" rx="10"/><text class="sh" x="430" y="74" text-anchor="middle"><tspan x="430" dy="0">Social institution</tspan></text><text class="small" x="430" y="96" text-anchor="middle"><tspan x="430" dy="0">a lasting pattern of norms and roles that meets a basic need</tspan></text><rect class="panel-a" x="20" y="180" width="240" height="150" rx="10"/><text class="sh" x="140" y="208" text-anchor="middle"><tspan x="140" dy="0">Family</tspan></text><text class="body" x="38" y="238" text-anchor="start"><tspan x="38" dy="0">- raises and socialises children</tspan><tspan x="38" dy="24">- gives support and identity</tspan><tspan x="38" dy="24">- form changes: joint, nuclear</tspan></text><line class="arw" x1="430" y1="112" x2="140" y2="176" marker-end="url(#ar)"/><rect class="panel-b" x="310" y="180" width="240" height="150" rx="10"/><text class="sh" x="430" y="208" text-anchor="middle"><tspan x="430" dy="0">Education</tspan></text><text class="body" x="328" y="238" text-anchor="start"><tspan x="328" dy="0">- passes on knowledge and skills</tspan><tspan x="328" dy="24">- sorts people by examinations</tspan><tspan x="328" dy="24">- teaches a hidden curriculum</tspan></text><line class="arw" x1="430" y1="112" x2="430" y2="176" marker-end="url(#ar)"/><rect class="panel-c" x="600" y="180" width="240" height="150" rx="10"/><text class="sh" x="720" y="208" text-anchor="middle"><tspan x="720" dy="0">Religion</tspan></text><text class="body" x="618" y="238" text-anchor="start"><tspan x="618" dy="0">- gives meaning and comfort</tspan><tspan x="618" dy="24">- sets moral norms</tspan><tspan x="618" dy="24">- builds cohesion and identity</tspan></text><line class="arw" x1="430" y1="112" x2="720" y2="176" marker-end="url(#ar)"/><line class="arw" x1="264" y1="255" x2="306" y2="255" marker-start="url(#ar)" marker-end="url(#ar)"/><line class="arw" x1="554" y1="255" x2="596" y2="255" marker-start="url(#ar)" marker-end="url(#ar)"/><path class="arw" d="M140,334 C140,400 720,400 720,334" marker-start="url(#ar)" marker-end="url(#ar)"/><rect class="panel" x="150" y="426" width="560" height="62" rx="8"/><text class="sh" x="430" y="450" text-anchor="middle"><tspan x="430" dy="0">Interdependence: a change in one moves the others</tspan></text><text class="small" x="430" y="472" text-anchor="middle"><tspan x="430" dy="0">Example: a family&#x27;s income and childcare needs affect a girl&#x27;s school attendance</tspan></text><text class="wm" x="848" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
