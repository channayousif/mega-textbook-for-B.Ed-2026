<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One mill closure traced through several institutions</title><desc id="d">A concept map tracing a mill closure: the economy box links to family, education, healthcare and politics, with a short label on each arrow such as lost wages, boys leave school, missed vaccinations and a demand for help.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.arw{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--a1)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}text{font-size:14px;fill:var(--ink)}.h{font-size:17px;font-weight:700;fill:var(--ink)}.sh{font-size:15px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="520"/><text class="h" x="430" y="30" text-anchor="middle"><tspan x="430" dy="0">How one economic event moves other institutions</tspan></text><rect class="panel-c" x="300" y="200" width="260" height="90" rx="10"/><text class="sh" x="430" y="232" text-anchor="middle"><tspan x="430" dy="0">Economy</tspan></text><text class="body" x="430" y="256" text-anchor="middle"><tspan x="430" dy="0">A textile mill near Kotri closes;</tspan><tspan x="430" dy="18">daily-wage workers lose income</tspan></text><rect class="panel-a" x="40" y="60" width="270" height="80" rx="10"/><text class="sh" x="175" y="86" text-anchor="middle"><tspan x="175" dy="0">Family</tspan></text><text class="body" x="175" y="108" text-anchor="middle"><tspan x="175" dy="0">savings run out; some</tspan><tspan x="175" dy="17">families move to Karachi</tspan></text><line class="arw" x1="330" y1="200" x2="250" y2="142" marker-end="url(#ar)"/><text class="small" x="278" y="175" text-anchor="end"><tspan x="278" dy="0">lost wages</tspan></text><rect class="panel-b" x="550" y="60" width="270" height="80" rx="10"/><text class="sh" x="685" y="86" text-anchor="middle"><tspan x="685" dy="0">Education</tspan></text><text class="body" x="685" y="108" text-anchor="middle"><tspan x="685" dy="0">Class 7 attendance falls;</tspan><tspan x="685" dy="17">some boys work in the market</tspan></text><line class="arw" x1="530" y1="200" x2="610" y2="142" marker-end="url(#ar)"/><text class="small" x="582" y="175" text-anchor="start"><tspan x="582" dy="0">boys leave school</tspan></text><rect class="panel-d" x="40" y="380" width="270" height="80" rx="10"/><text class="sh" x="175" y="406" text-anchor="middle"><tspan x="175" dy="0">Healthcare</tspan></text><text class="body" x="175" y="428" text-anchor="middle"><tspan x="175" dy="0">fewer babies taken to the</tspan><tspan x="175" dy="17">Basic Health Unit for vaccines</tspan></text><line class="arw" x1="330" y1="290" x2="250" y2="378" marker-end="url(#ar)"/><text class="small" x="278" y="338" text-anchor="end"><tspan x="278" dy="0">missed vaccinations</tspan></text><rect class="panel" x="550" y="380" width="270" height="80" rx="10"/><text class="sh" x="685" y="406" text-anchor="middle"><tspan x="685" dy="0">Politics</tspan></text><text class="body" x="685" y="428" text-anchor="middle"><tspan x="685" dy="0">councillor calls a meeting</tspan><tspan x="685" dy="17">to demand provincial help</tspan></text><line class="arw" x1="530" y1="290" x2="610" y2="378" marker-end="url(#ar)"/><text class="small" x="582" y="338" text-anchor="start"><tspan x="582" dy="0">demand for help</tspan></text><path class="arw" stroke-dasharray="6 4" d="M780,378 C800,300 700,250 563,245" marker-end="url(#ar)"/><text class="small" x="580" y="232" text-anchor="start"><tspan x="580" dy="0">possible response: relief or new jobs</tspan></text><text class="wm" x="848" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
