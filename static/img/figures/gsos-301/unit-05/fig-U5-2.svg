<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 454" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparing family, education and religion</title><desc id="d">A table comparing family, education and religion by their main functions, typical norms and roles, and a Pakistani example, such as a joint household pooling income, a board examination sorting pupils, and Eid sharing between neighbours.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.arw{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--a1)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}text{font-size:14px;fill:var(--ink)}.h{font-size:17px;font-weight:700;fill:var(--ink)}.sh{font-size:15px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="454"/><text class="h" x="430" y="28" text-anchor="middle"><tspan x="430" dy="0">Family, education and religion compared</tspan></text><rect class="panel" x="20" y="44" width="820" height="40"/><text class="sh" x="30" y="70" text-anchor="start"><tspan x="30" dy="0">Institution</tspan></text><text class="sh" x="180" y="70" text-anchor="start"><tspan x="180" dy="0">Main functions</tspan></text><text class="sh" x="410" y="70" text-anchor="start"><tspan x="410" dy="0">Norms and roles</tspan></text><text class="sh" x="640" y="70" text-anchor="start"><tspan x="640" dy="0">Pakistani example</tspan></text><rect class="panel-a" x="20" y="84" width="150" height="116"/><text class="sh" x="30" y="108" text-anchor="start"><tspan x="30" dy="0">Family</tspan></text><text class="body" x="180" y="108" text-anchor="start"><tspan x="180" dy="0">Raises and socialises</tspan><tspan x="180" dy="18">children; gives emotional and</tspan><tspan x="180" dy="18">economic support; passes on a</tspan><tspan x="180" dy="18">name and identity</tspan></text><text class="body" x="410" y="108" text-anchor="start"><tspan x="410" dy="0">Who earns, who cares for</tspan><tspan x="410" dy="18">children, who decides, who</tspan><tspan x="410" dy="18">looks after elders</tspan></text><text class="body" x="640" y="108" text-anchor="start"><tspan x="640" dy="0">A joint household in</tspan><tspan x="640" dy="18">Hyderabad where a</tspan><tspan x="640" dy="18">grandmother minds the</tspan><tspan x="640" dy="18">children and three incomes</tspan><tspan x="640" dy="18">are pooled</tspan></text><line class="grid" x1="20" y1="200" x2="840" y2="200"/><rect class="panel-b" x="20" y="200" width="150" height="116"/><text class="sh" x="30" y="224" text-anchor="start"><tspan x="30" dy="0">Education</tspan></text><text class="body" x="180" y="224" text-anchor="start"><tspan x="180" dy="0">Passes on knowledge and</tspan><tspan x="180" dy="18">skills; sorts people by</tspan><tspan x="180" dy="18">examinations and certificates;</tspan><tspan x="180" dy="18">teaches norms</tspan></text><text class="body" x="410" y="224" text-anchor="start"><tspan x="410" dy="0">Teachers teach and assess;</tspan><tspan x="410" dy="18">pupils attend, obey rules and</tspan><tspan x="410" dy="18">sit examinations</tspan></text><text class="body" x="640" y="224" text-anchor="start"><tspan x="640" dy="0">The Class 10 board</tspan><tspan x="640" dy="18">examination certifies</tspan><tspan x="640" dy="18">learning and also sorts</tspan><tspan x="640" dy="18">pupils from different</tspan><tspan x="640" dy="18">schools</tspan></text><line class="grid" x1="20" y1="316" x2="840" y2="316"/><rect class="panel-c" x="20" y="316" width="150" height="98"/><text class="sh" x="30" y="340" text-anchor="start"><tspan x="30" dy="0">Religion</tspan></text><text class="body" x="180" y="340" text-anchor="start"><tspan x="180" dy="0">Gives meaning and comfort;</tspan><tspan x="180" dy="18">sets moral norms; builds</tspan><tspan x="180" dy="18">cohesion and identity</tspan></text><text class="body" x="410" y="340" text-anchor="start"><tspan x="410" dy="0">Shared rituals, festivals and</tspan><tspan x="410" dy="18">life-course ceremonies;</tspan><tspan x="410" dy="18">religious leaders guide</tspan></text><text class="body" x="640" y="340" text-anchor="start"><tspan x="640" dy="0">Sharing sacrificial meat</tspan><tspan x="640" dy="18">at Eid ul Adha with</tspan><tspan x="640" dy="18">relatives, neighbours and</tspan><tspan x="640" dy="18">the poor</tspan></text><line class="grid" x1="20" y1="414" x2="840" y2="414"/><rect class="stroke" x="20" y="44" width="820" height="370"/><line class="grid" x1="170" y1="44" x2="170" y2="414"/><line class="grid" x1="400" y1="44" x2="400" y2="414"/><line class="grid" x1="630" y1="44" x2="630" y2="414"/><text class="wm" x="848" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
