<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 364" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparing the economy, politics and healthcare</title><desc id="d">A table comparing the economy, politics and healthcare by their main functions, typical norms and roles, and a Pakistani example, such as informal daily-wage work, a union council deciding on a drain, and a Lady Health Worker home visit.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2}.stroke{stroke:var(--ink);stroke-width:2;fill:none}.arw{stroke:var(--a1);stroke-width:2;fill:none}.ah{fill:var(--a1)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}text{font-size:14px;fill:var(--ink)}.h{font-size:17px;font-weight:700;fill:var(--ink)}.sh{font-size:15px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="364"/><text class="h" x="430" y="28" text-anchor="middle"><tspan x="430" dy="0">Economy, politics and healthcare compared</tspan></text><rect class="panel" x="20" y="44" width="820" height="40"/><text class="sh" x="30" y="70" text-anchor="start"><tspan x="30" dy="0">Institution</tspan></text><text class="sh" x="180" y="70" text-anchor="start"><tspan x="180" dy="0">Main functions</tspan></text><text class="sh" x="410" y="70" text-anchor="start"><tspan x="410" dy="0">Norms and roles</tspan></text><text class="sh" x="640" y="70" text-anchor="start"><tspan x="640" dy="0">Pakistani example</tspan></text><rect class="panel-a" x="20" y="84" width="150" height="80"/><text class="sh" x="30" y="108" text-anchor="start"><tspan x="30" dy="0">Economy</tspan></text><text class="body" x="180" y="108" text-anchor="start"><tspan x="180" dy="0">Organises production,</tspan><tspan x="180" dy="18">distribution and use of goods</tspan><tspan x="180" dy="18">and services</tspan></text><text class="body" x="410" y="108" text-anchor="start"><tspan x="410" dy="0">Ideas of fair wages, who</tspan><tspan x="410" dy="18">should earn and what counts as</tspan><tspan x="410" dy="18">real work</tspan></text><text class="body" x="640" y="108" text-anchor="start"><tspan x="640" dy="0">Informal daily-wage work</tspan><tspan x="640" dy="18">that stops at once when a</tspan><tspan x="640" dy="18">mill closes</tspan></text><line class="grid" x1="20" y1="164" x2="840" y2="164"/><rect class="panel-b" x="20" y="164" width="150" height="80"/><text class="sh" x="30" y="188" text-anchor="start"><tspan x="30" dy="0">Politics</tspan></text><text class="body" x="180" y="188" text-anchor="start"><tspan x="180" dy="0">Makes and enforces shared</tspan><tspan x="180" dy="18">decisions; distributes power</tspan><tspan x="180" dy="18">and authority</tspan></text><text class="body" x="410" y="188" text-anchor="start"><tspan x="410" dy="0">Traditional, charismatic and</tspan><tspan x="410" dy="18">legal-rational authority; laws</tspan><tspan x="410" dy="18">and budgets</tspan></text><text class="body" x="640" y="188" text-anchor="start"><tspan x="640" dy="0">A union council deciding</tspan><tspan x="640" dy="18">which street gets a new</tspan><tspan x="640" dy="18">drain</tspan></text><line class="grid" x1="20" y1="244" x2="840" y2="244"/><rect class="panel-c" x="20" y="244" width="150" height="80"/><text class="sh" x="30" y="268" text-anchor="start"><tspan x="30" dy="0">Healthcare</tspan></text><text class="body" x="180" y="268" text-anchor="start"><tspan x="180" dy="0">Prevents illness, treats the</tspan><tspan x="180" dy="18">sick and protects public</tspan><tspan x="180" dy="18">health</tspan></text><text class="body" x="410" y="268" text-anchor="start"><tspan x="410" dy="0">When and where people seek</tspan><tspan x="410" dy="18">care; who in the family</tspan><tspan x="410" dy="18">decides</tspan></text><text class="body" x="640" y="268" text-anchor="start"><tspan x="640" dy="0">A Lady Health Worker</tspan><tspan x="640" dy="18">visiting a mother at home</tspan><tspan x="640" dy="18">to support vaccination</tspan></text><line class="grid" x1="20" y1="324" x2="840" y2="324"/><rect class="stroke" x="20" y="44" width="820" height="280"/><line class="grid" x1="170" y1="44" x2="170" y2="324"/><line class="grid" x1="400" y1="44" x2="400" y2="324"/><line class="grid" x1="630" y1="44" x2="630" y2="324"/><text class="wm" x="848" y="354" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
