<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four Elements of Culture</title><desc id="d">A labelled diagram showing the four elements of culture branching from a central "Culture" circle, each with a Pakistani example: norms (standing for the national anthem), values (respect for elders), beliefs (Islamic principles), symbols (the crescent on the flag).</desc>
<style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center-circle{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
<rect class="bg" x="0" y="0" width="780" height="470"/>

<!-- Center Circle -->
<ellipse class="center-circle" cx="390" cy="235" rx="85" ry="50"/>
<text class="h" x="390" y="232" fill="var(--a1)">Culture</text>
<text class="m" x="390" y="250">Shared way of life</text>

<!-- Box 1 (top-left): Norms -->
<rect class="panel" x="30" y="45" width="260" height="110" rx="8"/>
<text class="h" x="160" y="75" fill="var(--a2)">Norms</text>
<text class="m" x="160" y="95">Rules and expectations of behaviour</text>
<line x1="50" y1="108" x2="270" y2="108" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="160" y="125" font-weight="600">Pakistani example:</text>
<text x="160" y="142">standing for the national anthem</text>

<!-- Box 2 (top-right): Values -->
<rect class="panel" x="490" y="45" width="260" height="110" rx="8"/>
<text class="h" x="620" y="75" fill="var(--a3)">Values</text>
<text class="m" x="620" y="95">Shared ideals and moral standards</text>
<line x1="510" y1="108" x2="730" y2="108" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="620" y="125" font-weight="600">Pakistani example:</text>
<text x="620" y="142">respect for elders</text>

<!-- Box 3 (bottom-left): Beliefs -->
<rect class="panel" x="30" y="315" width="260" height="110" rx="8"/>
<text class="h" x="160" y="345" fill="var(--a4)">Beliefs</text>
<text class="m" x="160" y="365">Specific convictions held to be true</text>
<line x1="50" y1="378" x2="270" y2="378" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="160" y="395" font-weight="600">Pakistani example:</text>
<text x="160" y="412">Islamic principles</text>

<!-- Box 4 (bottom-right): Symbols -->
<rect class="panel" x="490" y="315" width="260" height="110" rx="8"/>
<text class="h" x="620" y="345" fill="var(--a1)">Symbols</text>
<text class="m" x="620" y="365">Objects or gestures carrying cultural meaning</text>
<line x1="510" y1="378" x2="730" y2="378" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="620" y="395" font-weight="600">Pakistani example:</text>
<text x="620" y="412">the crescent on the flag</text>

<!-- Connector lines -->
<line class="link" x1="325" y1="195" x2="230" y2="155" marker-end="url(#ar)"/>
<line class="link" x1="455" y1="195" x2="550" y2="155" marker-end="url(#ar)"/>
<line class="link" x1="325" y1="275" x2="230" y2="315" marker-end="url(#ar)"/>
<line class="link" x1="455" y1="275" x2="550" y2="315" marker-end="url(#ar)"/>
<text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
