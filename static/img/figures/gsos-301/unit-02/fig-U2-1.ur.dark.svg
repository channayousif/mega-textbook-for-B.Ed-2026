<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ثقافت کے چار عناصر</title><desc id="d">ثقافت کے چار عناصر کو ظاہر کرنے والا خاکہ، جو درمیانی دائرے 'ثقافت' سے نکلتے ہیں اور ہر ایک کی پاکستانی مثال دی گئی ہے: معیار (قومی ترانے پر کھڑا ہونا)، قدریں (بزرگوں کا احترام)، عقائد (اسلامی اصول)، علامتیں (پرچم پر ہلال)۔</desc>
<style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center-circle{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px;text-anchor:end}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
<rect class="bg" x="0" y="0" width="780" height="470"/>

<!-- Center Circle -->
<ellipse class="center-circle" cx="390" cy="235" rx="85" ry="50"/>
<text class="h" x="390" y="232" fill="var(--a1)">ثقافت</text>
<text class="m" x="390" y="252">مشترکہ طرز زندگی</text>

<!-- Box 1 (top-right in RTL reading): Norms (معیار) -->
<rect class="panel" x="490" y="45" width="260" height="110" rx="8"/>
<text class="h" x="620" y="75" fill="var(--a2)">معیار</text>
<text class="m" x="620" y="95">رویے کے اصول اور توقعات</text>
<line x1="510" y1="108" x2="730" y2="108" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="620" y="125" font-weight="600">پاکستانی مثال:</text>
<text x="620" y="142">قومی ترانے کے احترام میں کھڑا ہونا</text>

<!-- Box 2 (top-left in RTL reading): Values (قدریں) -->
<rect class="panel" x="30" y="45" width="260" height="110" rx="8"/>
<text class="h" x="160" y="75" fill="var(--a3)">قدریں</text>
<text class="m" x="160" y="95">مشترکہ مثالیات اور اخلاقی معیارات</text>
<line x1="50" y1="108" x2="270" y2="108" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="160" y="125" font-weight="600">پاکستانی مثال:</text>
<text x="160" y="142">بزرگوں کا احترام</text>

<!-- Box 3 (bottom-right in RTL reading): Beliefs (عقائد) -->
<rect class="panel" x="490" y="315" width="260" height="110" rx="8"/>
<text class="h" x="620" y="345" fill="var(--a4)">عقائد</text>
<text class="m" x="620" y="365">مخصوص خیالات جو سچ مانے جائیں</text>
<line x1="510" y1="378" x2="730" y2="378" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="620" y="395" font-weight="600">پاکستانی مثال:</text>
<text x="620" y="412">اسلامی اصول</text>

<!-- Box 4 (bottom-left in RTL reading): Symbols (علامتیں) -->
<rect class="panel" x="30" y="315" width="260" height="110" rx="8"/>
<text class="h" x="160" y="345" fill="var(--a1)">علامتیں</text>
<text class="m" x="160" y="365">ثقافتی معنی کی حامل اشیاء یا اشارے</text>
<line x1="50" y1="378" x2="270" y2="378" stroke="var(--ink)" stroke-width="1"/>
<text class="m" x="160" y="395" font-weight="600">پاکستانی مثال:</text>
<text x="160" y="412">پرچم پر ہلال</text>

<!-- Connector lines -->
<line class="link" x1="455" y1="195" x2="550" y2="155" marker-end="url(#ar)"/>
<line class="link" x1="325" y1="195" x2="230" y2="155" marker-end="url(#ar)"/>
<line class="link" x1="455" y1="275" x2="550" y2="315" marker-end="url(#ar)"/>
<line class="link" x1="325" y1="275" x2="230" y2="315" marker-end="url(#ar)"/>
<text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
