<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of purposes of evaluation in science</title><desc id="d">Concept map showing the four major purposes of evaluation in science education: placement, formative feedback, diagnostic identification of learning hurdles, and summative grading and improvement.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="300" y1="210" x2="220" y2="124" marker-end="url(#arrow)"/>
<line class="stroke" x1="480" y1="210" x2="560" y2="124" marker-end="url(#arrow)"/>
<line class="stroke" x1="300" y1="270" x2="220" y2="356" marker-end="url(#arrow)"/>
<line class="stroke" x1="480" y1="270" x2="560" y2="356" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-placement"><rect class="panel-a" x="30" y="40" width="250" height="90" rx="8"/><text class="h" x="46" y="68">Placement &amp; Readiness</text><text class="cell" x="46" y="92">Assess prerequisite concepts and</text><text class="cell" x="46" y="110">entry skills before instruction</text></g>
<g id="node-formative"><rect class="panel-a" x="500" y="40" width="250" height="90" rx="8"/><text class="h" x="516" y="68">Formative Feedback</text><text class="cell" x="516" y="92">Monitor ongoing progress to adapt</text><text class="cell" x="516" y="110">teaching and guide learners</text></g>
<g id="node-diagnostic"><rect class="panel-a" x="30" y="340" width="250" height="90" rx="8"/><text class="h" x="46" y="368">Diagnostic Probing</text><text class="cell" x="46" y="392">Pinpoint root causes of persistent</text><text class="cell" x="46" y="410">misconceptions and hurdles</text></g>
<g id="node-summative"><rect class="panel-a" x="500" y="340" width="250" height="90" rx="8"/><text class="h" x="516" y="368">Summative Certification</text><text class="cell" x="516" y="392">Certify cumulative attainment of</text><text class="cell" x="516" y="410">national SLOs and grade work</text></g>
<g id="node-center"><ellipse class="panel-b" cx="390" cy="240" rx="110" ry="42"/><text class="h" x="390" y="236" text-anchor="middle">Evaluation</text><text class="sh" x="390" y="256" text-anchor="middle">in Science</text></g>
</g><g id="layer-labels">
<text class="small" x="30" y="460">Four major complementary purposes of evaluation in secondary science teaching.</text>
</g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>