<rect class="plain" x="24" y="262" width="732" height="66"/>
</g><g id="layer-edges">
<line class="grid" x1="180" y1="24" x2="180" y2="328"/>
<line class="grid" x1="430" y1="24" x2="430" y2="328"/>
</g><g id="layer-nodes">
<text class="sh" x="34" y="49">Misconception</text>
<text class="sh" x="194" y="49">Cognitive Origin</text>
<text class="sh" x="444" y="49">Targeted Remedial Intervention</text>

<text class="sh" x="34" y="94">Plant Respiration</text>
<text class="cell" x="34" y="112">"Respiring only at night"</text>
<text class="cell" x="194" y="86">Confuses breathing with cellular</text>
<text class="cell" x="194" y="104">respiration; views photosynthesis</text>
<text class="cell" x="194" y="120">as replacing respiration in day</text>
<text class="cell" x="444" y="86">Germinating seeds demo: limewater turns</text>
<text class="cell" x="444" y="104">milky in daylight in closed flask,</text>
<text class="cell" x="444" y="120">proving CO2 output without leaves</text>

<text class="sh" x="34" y="160">Falling Bodies</text>
<text class="cell" x="34" y="178">"Heavy falls faster"</text>
<text class="cell" x="194" y="152">Air drag on flat objects;</text>
<text class="cell" x="194" y="170">conflates gravitational force</text>
<text class="cell" x="194" y="186">with acceleration rate</text>
<text class="cell" x="444" y="152">Discrepant event: drop flat sheet vs</text>
<text class="cell" x="444" y="170">crumpled paper of equal mass; drop</text>
<text class="cell" x="444" y="186">paper disc resting on falling coin</text>

<text class="sh" x="34" y="226">Electric Current</text>
<text class="cell" x="34" y="244">"Current used up in bulb"</text>
<text class="cell" x="194" y="218">Source-consumer intuition;</text>
<text class="cell" x="194" y="236">assumes bulb consumes fluid</text>
<text class="cell" x="194" y="252">rather than converting energy</text>
<text class="cell" x="444" y="218">Dual ammeters in series: measure current</text>
<text class="cell" x="444" y="236">before and after glowing bulb to prove</text>
<text class="cell" x="444" y="252">charge flow rate is fully conserved</text>

<text class="sh" x="34" y="292">Heat vs Temperature</text>
<text class="cell" x="34" y="310">"Heat equals temp"</text>
<text class="cell" x="194" y="284">Sensory perception; lacks concept</text>
<text class="cell" x="194" y="302">of total internal kinetic energy</text>
<text class="cell" x="194" y="318">versus average kinetic motion</text>
<text class="cell" x="444" y="284">Dual beaker demo: heat 100 mL and 500 mL</text>
<text class="cell" x="444" y="302">to 80 deg C; compare time needed</text>
<text class="cell" x="444" y="318">to melt identical ice blocks</text>
</g><g id="layer-labels">
<text class="small" x="30" y="360">Five common secondary science misconceptions with targeted inquiry remedial activities.</text>
</g><text class="wm" x="768" y="380" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>