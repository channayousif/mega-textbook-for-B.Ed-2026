</g><g id="layer-nodes">
<text class="sh" x="34" y="49">Feature</text>
<text class="sh" x="174" y="49">Formative (Assessment for Learning)</text>
<text class="sh" x="464" y="49">Summative (Assessment of Learning)</text>

<text class="sh" x="34" y="94">Primary Goal</text>
<text class="cell" x="174" y="86">Improve learning, identify gaps, and</text>
<text class="cell" x="174" y="104">adapt ongoing instructional pacing</text>
<text class="cell" x="464" y="86">Certify achievement, assign formal</text>
<text class="cell" x="464" y="104">grades, and evaluate program quality</text>

<text class="sh" x="34" y="160">Timing</text>
<text class="cell" x="174" y="152">Continuous throughout daily lessons</text>
<text class="cell" x="174" y="170">and each phase of the inquiry cycle</text>
<text class="cell" x="464" y="152">At the conclusion of a unit, school</text>
<text class="cell" x="464" y="170">term, semester, or academic year</text>

<text class="sh" x="34" y="226">Feedback Type</text>
<text class="cell" x="174" y="218">Descriptive, non-punitive guidance</text>
<text class="cell" x="174" y="236">explaining how to correct misconceptions</text>
<text class="cell" x="464" y="218">Evaluative numerical marks, letter</text>
<text class="cell" x="464" y="236">grades, or percentile rankings</text>

<text class="sh" x="34" y="292">Class Example</text>
<text class="cell" x="174" y="284">Hinge question on plant mass to</text>
<text class="cell" x="174" y="302">check concepts before teaching food chains</text>
<text class="cell" x="464" y="284">End-of-term 50-mark written test on</text>
<text class="cell" x="464" y="302">living systems and chemical change</text>
</g><g id="layer-labels">
<text class="small" x="30" y="360">Contrasting formative and summative assessment in science instruction.</text>
</g><text class="wm" x="768" y="380" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>