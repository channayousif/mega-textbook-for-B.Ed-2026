<text class="sh" x="34" y="49">Tool</text>
<text class="sh" x="174" y="49">Domain Measured</text>
<text class="sh" x="374" y="49">Pedagogical Strength</text>
<text class="sh" x="574" y="49">Science Application</text>

<text class="sh" x="34" y="96">Written Test</text>
<text class="cell" x="174" y="88">Concepts, recall, and</text>
<text class="cell" x="174" y="105">analytical reasoning</text>
<text class="cell" x="374" y="88">Standardized, wide sampling,</text>
<text class="cell" x="374" y="105">efficient for large cohorts</text>
<text class="cell" x="574" y="88">Unit achievement tests</text>
<text class="cell" x="574" y="105">and board examinations</text>

<text class="sh" x="34" y="150">Performance Task</text>
<text class="cell" x="174" y="142">Manipulative lab skills</text>
<text class="cell" x="174" y="159">and apparatus setup</text>
<text class="cell" x="374" y="142">Direct authentic evidence</text>
<text class="cell" x="374" y="159">of manual laboratory mastery</text>
<text class="cell" x="574" y="142">Assessing filtration,</text>
<text class="cell" x="574" y="159">titration, or circuit wiring</text>

<text class="sh" x="34" y="204">Checklist</text>
<text class="cell" x="174" y="196">Presence or absence of</text>
<text class="cell" x="174" y="213">key procedure and safety</text>
<text class="cell" x="374" y="196">Rapid recording, high scoring</text>
<text class="cell" x="374" y="213">consistency across observers</text>
<text class="cell" x="574" y="196">Monitoring burner safety</text>
<text class="cell" x="574" y="213">and meniscus reading</text>

<text class="sh" x="34" y="258">Analytic Rubric</text>
<text class="cell" x="174" y="250">Inquiry process quality</text>
<text class="cell" x="174" y="267">and data interpretation</text>
<text class="cell" x="374" y="250">Explicit criteria descriptions,</text>
<text class="cell" x="374" y="267">fair diagnostic grading</text>
<text class="cell" x="574" y="250">Evaluating open investigation</text>
<text class="cell" x="574" y="267">reports and experiments</text>

<text class="sh" x="34" y="312">Science Portfolio</text>
<text class="cell" x="174" y="304">Growth over time and</text>
<text class="cell" x="174" y="321">reflective habits</text>
<text class="cell" x="374" y="304">Longitudinal development,</text>
<text class="cell" x="374" y="321">fosters self-regulation</text>
<text class="cell" x="574" y="304">Cumulative project files</text>
<text class="cell" x="574" y="321">and nature study logs</text>
