<line class="grid" x1="140" y1="24" x2="140" y2="328"/>
<line class="grid" x1="330" y1="24" x2="330" y2="328"/>
<line class="grid" x1="530" y1="24" x2="530" y2="328"/>
</g><g id="layer-nodes">
<text class="sh" x="34" y="49">Dimension</text>
<text class="sh" x="150" y="49">Measurement</text>
<text class="sh" x="340" y="49">Assessment</text>
<text class="sh" x="540" y="49">Evaluation</text>

<text class="sh" x="34" y="94">Core Nature</text>
<text class="cell" x="150" y="86">Assigning numbers or scores</text>
<text class="cell" x="150" y="104">by explicit testing rules</text>
<text class="cell" x="340" y="86">Gathering multi-source data</text>
<text class="cell" x="340" y="104">on learner understanding</text>
<text class="cell" x="540" y="86">Passing qualitative value</text>
<text class="cell" x="540" y="104">judgments against standards</text>

<text class="sh" x="34" y="160">Data Form</text>
<text class="cell" x="150" y="152">Purely quantitative</text>
<text class="cell" x="150" y="170">(marks, raw counts, scales)</text>
<text class="cell" x="340" y="152">Quantitative &amp; qualitative</text>
<text class="cell" x="340" y="170">(work samples, rubrics)</text>
<text class="cell" x="540" y="152">Evaluative &amp; interpretive</text>
<text class="cell" x="540" y="170">(quality, program decisions)</text>

<text class="sh" x="34" y="226">Core Question</text>
<text class="cell" x="150" y="218">"How much or how many</text>
<text class="cell" x="150" y="236">points did the pupil get?"</text>
<text class="cell" x="340" y="218">"What evidence shows what</text>
<text class="cell" x="340" y="236">the pupil knows and can do?"</text>
<text class="cell" x="540" y="218">"How good is it, and what</text>
<text class="cell" x="540" y="236">teaching steps should follow?"</text>

<text class="sh" x="34" y="292">Class Example</text>
<text class="cell" x="150" y="284">Scoring 14/20 on a written</text>
<text class="cell" x="150" y="302">test on separation methods</text>
<text class="cell" x="340" y="284">Observing lab filtration and</text>
<text class="cell" x="340" y="302">reviewing student notebooks</text>
<text class="cell" x="540" y="284">Judging inquiry competence</text>
<text class="cell" x="540" y="302">and adapting pore-size demo</text>
</g><g id="layer-labels">
<text class="small" x="30" y="360">Systematic differentiation among measurement, assessment, and evaluation in science.</text>
</g><text class="wm" x="768" y="380" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>