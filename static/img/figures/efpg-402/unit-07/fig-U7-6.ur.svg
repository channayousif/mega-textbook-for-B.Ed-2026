<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی مہارتوں کے تجزیاتی معیارِ جانچ کا ڈایاگرام</title><desc id="d">ڈایاگرام جو عملی مہارتوں کے تجزیاتی معیارِ جانچ کی ساخت دکھاتا ہے جس میں چار بنیادی معیارات ہیں: آلات کی ترتیب اور حفاظت، پیمائش کی درستی، منظم مشاہدہ، اور سائنسی وضاحت۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-nodes">
<g id="box1"><rect class="panel-a" x="405" y="35" width="345" height="190" rx="8"/><text class="h" x="734" y="68">1. آلات کی ترتیب اور حفاظت</text><text class="sh" x="734" y="98">حرکی اہلیت اور حفاظتی احتیاطیں</text><text class="cell" x="734" y="128">درست آلات کا انتخاب؛ زیرو ایرر کی تصدیق؛</text><text class="cell" x="734" y="154">حفاظتی سامان پہننا؛ شیشے اور حرارت کا</text><text class="cell" x="734" y="180">محتاط استعمال؛ کام کی جگہ صاف رکھنا۔</text></g>
<g id="box2"><rect class="panel-b" x="30" y="35" width="345" height="190" rx="8"/><text class="h" x="359" y="68">2. پیمائش کی درستی</text><text class="sh" x="359" y="98">آلات کی درستی اور اکائیاں</text><text class="cell" x="359" y="128">اسکیل اور مینیسکس میں پیرالیکس سے بچاؤ؛</text><text class="cell" x="359" y="154">تسلسل کے لیے پیمائش کا اعادہ؛ حجم، کمیت</text><text class="cell" x="359" y="180">اور وقت کی درست SI اکائیاں استعمال کرنا۔</text></g>
<g id="box3"><rect class="panel-b" x="405" y="260" width="345" height="190" rx="8"/><text class="h" x="734" y="293">3. منظم مشاہدہ</text><text class="sh" x="734" y="323">ڈیٹا کا اندراج اور پیشکش</text><text class="cell" x="734" y="353">کیفی تبدیلیوں اور مقداری اعداد و شمار کا جداول</text><text class="cell" x="734" y="379">میں فوری اندراج؛ مناسب اسکیل اور لیبل والے</text><text class="cell" x="734" y="405">صاف ستھرے گراف بنانا۔</text></g>
<g id="box4"><rect class="panel-a" x="30" y="260" width="345" height="190" rx="8"/><text class="h" x="359" y="293">4. سائنسی استدلال</text><text class="sh" x="359" y="323">شواہد پر مبنی استدلال</text><text class="cell" x="359" y="353">درج شدہ اعداد کی روشنی میں منطقی نتائج اخذ کرنا؛</text><text class="cell" x="359" y="379">تجرباتی خامیوں اور غیر معمولی عوامل کی نشاندہی؛</text><text class="cell" x="359" y="405">نتائج کو براہِ راست سائنسی قوانین سے جوڑنا۔</text></g>
</g><g id="layer-labels">
<text class="small" x="750" y="485">مستند تجربہ گاہی کارکردگی کے معیارِ جانچ کے چار بنیادی ابعاد۔</text>
</g><text class="wm" x="12" y="515" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
