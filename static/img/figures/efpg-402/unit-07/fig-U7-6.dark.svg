<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a practical-skills analytic rubric structure</title><desc id="d">Diagram showing a practical-skills analytic rubric with four core criteria: apparatus setup and safety, measurement precision, systematic observation, and scientific explanation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-nodes">
<g id="box1"><rect class="panel-a" x="30" y="30" width="345" height="150" rx="8"/><text class="h" x="46" y="58">1. Apparatus Setup &amp; Safety</text><text class="sh" x="46" y="82">Manipulative competence &amp; precautions</text><text class="cell" x="46" y="106">Selects correct apparatus; verifies zero error;</text><text class="cell" x="46" y="124">wears protective gear; handles heat &amp; glass</text><text class="cell" x="46" y="142">safely; keeps workspace organized and clean.</text></g>
<g id="box2"><rect class="panel-b" x="405" y="30" width="345" height="150" rx="8"/><text class="h" x="421" y="58">2. Measurement Precision</text><text class="sh" x="421" y="82">Instrument accuracy &amp; units</text><text class="cell" x="421" y="106">Avoids parallax when reading scales &amp; meniscus;</text><text class="cell" x="421" y="124">repeats readings to ensure consistency; uses</text><text class="cell" x="421" y="142">correct SI units of volume, mass, and time.</text></g>
<g id="box3"><rect class="panel-b" x="30" y="210" width="345" height="150" rx="8"/><text class="h" x="46" y="238">3. Systematic Observation</text><text class="sh" x="46" y="262">Data capture &amp; representation</text><text class="cell" x="46" y="286">Records qualitative changes and numerical data</text><text class="cell" x="46" y="304">promptly in structured tables; constructs neat,</text><text class="cell" x="46" y="322">properly scaled and labelled line graphs.</text></g>
<g id="box4"><rect class="panel-a" x="405" y="210" width="345" height="150" rx="8"/><text class="h" x="421" y="238">4. Scientific Deduction</text><text class="sh" x="421" y="262">Evidence-based reasoning</text><text class="cell" x="421" y="286">Draws logical conclusions rooted in recorded data;</text><text class="cell" x="421" y="304">identifies experimental errors and anomalies;</text><text class="cell" x="421" y="322">relates findings directly to scientific laws.</text></g>
</g><g id="layer-labels">
<text class="small" x="30" y="390">Four core dimensions of an authentic laboratory performance assessment rubric.</text>
</g><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>