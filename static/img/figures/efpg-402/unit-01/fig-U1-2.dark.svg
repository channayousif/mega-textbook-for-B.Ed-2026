<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 335" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing science, common sense and superstition</title><desc id="d">Table comparing science, common sense and superstition on where each comes from, how it is checked and what happens when evidence goes against it, with one classroom example each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="335"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="728" height="40" rx="6"/><rect id="region-row-1" class="panel" x="24" y="64" width="728" height="56"/><rect id="region-row-2" class="plain" x="24" y="120" width="728" height="56"/><rect id="region-row-3" class="panel" x="24" y="176" width="728" height="56"/><rect id="region-row-4" class="plain" x="24" y="232" width="728" height="73"/></g><g id="layer-edges"><line class="grid" x1="194" y1="24" x2="194" y2="305"/><line class="grid" x1="380" y1="24" x2="380" y2="305"/><line class="grid" x1="566" y1="24" x2="566" y2="305"/></g><g id="layer-nodes"><text class="sh" x="32" y="48"></text><text class="sh" x="202" y="48">Science</text><text class="sh" x="388" y="48">Common sense</text><text class="sh" x="574" y="48">Belief or superstition</text><text class="sh" x="32" y="88">Where it</text><text class="sh" x="32" y="105">comes from</text><text class="cell" x="202" y="88">systematic observation</text><text class="cell" x="202" y="105">and experiment</text><text class="cell" x="388" y="88">everyday experience</text><text class="cell" x="574" y="88">tradition or authority</text><text class="sh" x="32" y="144">How it is</text><text class="sh" x="32" y="161">checked</text><text class="cell" x="202" y="144">planned tests,</text><text class="cell" x="202" y="161">repeated by others</text><text class="cell" x="388" y="144">rarely checked</text><text class="cell" x="574" y="144">not checked</text><text class="sh" x="32" y="200">When it meets</text><text class="sh" x="32" y="217">contrary evidence</text><text class="cell" x="202" y="200">it changes</text><text class="cell" x="388" y="200">it may change</text><text class="cell" x="574" y="200">it usually stays</text><text class="cell" x="574" y="217">the same</text><text class="sh" x="32" y="256">Classroom</text><text class="sh" x="32" y="273">example</text><text class="cell" x="202" y="256">"Seeds need water to</text><text class="cell" x="202" y="273">germinate", tested</text><text class="cell" x="202" y="290">in class</text><text class="cell" x="388" y="256">"Frogs croak</text><text class="cell" x="388" y="273">before rain"</text><text class="cell" x="574" y="256">"A black cat brings</text><text class="cell" x="574" y="273">bad luck"</text></g><g id="layer-labels"></g><text class="wm" x="768" y="325" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
