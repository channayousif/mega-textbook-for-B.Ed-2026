<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 686" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مقصد سے ہدف اور جماعتی نتیجے تک کا خاکہ</title><desc id="d">تین جڑے ہوئے خانوں کا خاکہ جو اوپر سے نیچے تنگ ہوتے جاتے ہیں: سائنسی خواندگی پیدا کرنے کا طویل مدتی مقصد، خوراک کا راستہ دکھانے کے بارے میں ایک سبق کا ہدف، اور جماعت کا وہ نتیجہ جو استاد تب دیکھ سکتا ہے جب شاگرد خاکے پر راستہ بناتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="686"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-aim-objective" class="stroke" x1="390" y1="154" x2="390" y2="238" marker-end="url(#arrow)"/><line id="edge-objective-outcome" class="stroke" x1="390" y1="364" x2="390" y2="448" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-aim"><rect class="panel-a" x="40" y="42" width="700" height="112" rx="8"/><text class="h" x="390" y="86.8" text-anchor="middle">مقصد (برسوں پر محیط)</text><text class="cell" x="390" y="123.2" text-anchor="middle">سائنسی خواندگی پیدا کرنا</text></g><g id="node-objective"><rect class="panel-a" x="110" y="238" width="560" height="126" rx="8"/><text class="h" x="390" y="282.8" text-anchor="middle">ہدف (ایک سبق)</text><text class="cell" x="390" y="322" text-anchor="middle">شاگرد منہ سے بڑی آنت تک خوراک کا راستہ دکھائیں گے</text></g><g id="node-outcome"><rect class="panel-a" x="180" y="448" width="420" height="145.6" rx="8"/><text class="h" x="390" y="492.8" text-anchor="middle">جماعتی نتیجہ (گھنٹی بجنے پر نظر آئے)</text><text class="cell" x="390" y="532" text-anchor="middle">ہر شاگرد خاکے پر تیر بنا کر</text><text class="cell" x="390" y="555.8" text-anchor="middle">راستہ درست دکھاتا ہے</text></g></g><g id="layer-labels"><text id="label-broken-down" class="small" x="376" y="203">تقسیم ہوتا ہے</text><text id="label-checked-by" class="small" x="376" y="413">جانچا جاتا ہے</text><text id="label-caption" class="small" x="756" y="638.4">ہر قدم دائرہ تنگ کرتا ہے: برسوں کی اسکولنگ سے ایک سبق، پھر گھنٹی پر نظر آنے والی چیز تک۔</text></g><text class="wm" x="12" y="676" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
