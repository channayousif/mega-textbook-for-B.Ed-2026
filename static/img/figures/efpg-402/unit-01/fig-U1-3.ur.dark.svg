<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 798" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حلقے کی صورت میں سائنسی تحقیق کا فلو چارٹ</title><desc id="d">سائنسی تحقیق کے چھ مراحل کا فلو چارٹ جو ایک حلقے کی صورت میں بنایا گیا ہے: مشاہدہ، سوال پوچھنا، مفروضہ بنانا، آزمائش، نتیجہ اخذ کرنا اور نتیجہ دوسروں تک پہنچانا؛ جب مفروضے کی تائید نہ ہو یا نئے سوالات پیدا ہوں تو تیر پہلے مراحل کی طرف لوٹتے ہیں: یہ مراحل رہنمائی ہیں، کوئی مقررہ نسخہ نہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="798"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-observe-question" class="stroke" x1="295" y1="126" x2="190" y2="212.8" marker-end="url(#arrow)"/><line id="edge-question-hypothesis" class="stroke" x1="190" y1="291.2" x2="190" y2="464.8" marker-end="url(#arrow)"/><line id="edge-hypothesis-test" class="stroke" x1="190" y1="543.2" x2="295" y2="630" marker-end="url(#arrow)"/><line id="edge-test-conclude" class="stroke" x1="485" y1="630" x2="590" y2="543.2" marker-end="url(#arrow)"/><line id="edge-conclude-communicate" class="stroke" x1="590" y1="464.8" x2="590" y2="291.2" marker-end="url(#arrow)"/><line id="edge-communicate-observe" class="dash" x1="590" y1="212.8" x2="485" y2="126" marker-end="url(#arrow)"/><line id="edge-conclude-hypothesis" class="dash" x1="495" y1="504" x2="285" y2="504" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-observe"><rect class="panel-a" x="295" y="86.8" width="190" height="78.4" rx="8"/><text class="sh" x="390" y="133" text-anchor="middle">مشاہدہ</text></g><g id="node-question"><rect class="panel-a" x="95" y="212.8" width="190" height="78.4" rx="8"/><text class="sh" x="190" y="259" text-anchor="middle">سوال پوچھنا</text></g><g id="node-hypothesis"><rect class="panel-a" x="95" y="464.8" width="190" height="78.4" rx="8"/><text class="sh" x="190" y="511" text-anchor="middle">مفروضہ بنانا</text></g><g id="node-test"><rect class="panel-a" x="295" y="590.8" width="190" height="78.4" rx="8"/><text class="sh" x="390" y="624.4" text-anchor="middle">آزمائش</text><text class="cell" x="390" y="649.6" text-anchor="middle">(تجربہ یا سروے)</text></g><g id="node-conclude"><rect class="panel-a" x="495" y="464.8" width="190" height="78.4" rx="8"/><text class="sh" x="590" y="511" text-anchor="middle">نتیجہ اخذ کرنا</text></g><g id="node-communicate"><rect class="panel-a" x="495" y="212.8" width="190" height="78.4" rx="8"/><text class="sh" x="590" y="259" text-anchor="middle">نتیجہ پہنچانا</text></g></g><g id="layer-labels"><text id="label-new-questions" class="small" x="602" y="156.8" text-anchor="end">نئے سوالات</text><text id="label-not-supported" class="small" x="390" y="487.2" text-anchor="middle">مفروضے کی تائید نہ ہوئی</text><text id="label-caption" class="small" x="756" y="722.4">حقیقی سائنس دان مراحل میں آگے پیچھے جاتے ہیں؛ یہ رہنمائی ہے، مقررہ نسخہ نہیں۔</text><text id="label-key" class="small" x="756" y="747.6">ٹھوس تیر: اگلا مرحلہ۔ نقطہ دار تیر: پہلے مرحلے کی طرف واپسی۔</text></g><text class="wm" x="12" y="788" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
