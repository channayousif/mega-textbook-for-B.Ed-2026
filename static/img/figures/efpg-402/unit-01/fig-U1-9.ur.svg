<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 566" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں روزمرہ زندگی کے چار شعبوں کا جدول جنہیں سائنس شکل دیتی ہے</title><desc id="d">پاکستان میں روزمرہ زندگی کے چار شعبوں، صحت، زراعت، توانائی اور مواصلات، کا جدول: ہر ایک کے پیچھے کی سائنس، مقامی سطح پر اس کی صورت، اور ایک فیصلہ جو شہریوں کو کرنا پڑتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="565.6"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="81.2" rx="6"/><rect id="region-row-1" class="panel" x="24" y="114.8" width="732" height="102.2"/><rect id="region-row-2" class="plain" x="24" y="217" width="732" height="126"/><rect id="region-row-3" class="panel" x="24" y="343" width="732" height="102.2"/><rect id="region-row-4" class="plain" x="24" y="445.2" width="732" height="78.4"/></g><g id="layer-edges"><line class="grid" x1="614" y1="33.6" x2="614" y2="523.6"/><line class="grid" x1="450" y1="33.6" x2="450" y2="523.6"/><line class="grid" x1="214" y1="33.6" x2="214" y2="523.6"/></g><g id="layer-nodes"><text class="sh" x="748" y="67.2">زندگی کا شعبہ</text><text class="sh" x="606" y="67.2">پیچھے کی سائنس</text><text class="sh" x="442" y="67.2">پاکستان میں</text><text class="sh" x="442" y="92.4">اس کی صورت</text><text class="sh" x="206" y="67.2">شہریوں کے</text><text class="sh" x="206" y="92.4">لیے سوال</text><text class="sh" x="748" y="148.4">صحت</text><text class="cell" x="606" y="148.4">جراثیم، مدافعت،</text><text class="cell" x="606" y="172.2">ویکسین</text><text class="cell" x="442" y="148.4">ہر بچے کے لیے معمول کے</text><text class="cell" x="442" y="172.2">حفاظتی ٹیکے؛ پولیو اور</text><text class="cell" x="442" y="196">ٹائیفائیڈ کی ویکسین مہمیں</text><text class="cell" x="206" y="148.4">کیا مجھے اپنے بچے کو</text><text class="cell" x="206" y="172.2">ویکسین لگوانی چاہیے؟</text><text class="sh" x="748" y="250.6">زراعت</text><text class="cell" x="606" y="250.6">پودوں کی حیاتیات،</text><text class="cell" x="606" y="274.4">مٹی کی کیمیا،</text><text class="cell" x="606" y="298.2">حیاتیاتی ٹیکنالوجی</text><text class="cell" x="442" y="250.6">بہتر بیج، کھاد، زیادہ</text><text class="cell" x="442" y="274.4">غذائیت کے لیے تیار کی گئی</text><text class="cell" x="442" y="298.2">فصلیں، مثلاً زیادہ</text><text class="cell" x="442" y="322">آئرن والا چاول</text><text class="cell" x="206" y="250.6">کتنی کھاد یا کیڑے مار</text><text class="cell" x="206" y="274.4">دوا نہر کے لیے</text><text class="cell" x="206" y="298.2">محفوظ ہے؟</text><text class="sh" x="748" y="376.6">توانائی</text><text class="cell" x="606" y="376.6">بجلی، شمسی</text><text class="cell" x="606" y="400.4">توانائی، توانائی</text><text class="cell" x="606" y="424.2">کی منتقلی</text><text class="cell" x="442" y="376.6">گھروں، اسکولوں اور</text><text class="cell" x="442" y="400.4">ٹیوب ویلوں پر شمسی پینل</text><text class="cell" x="206" y="376.6">میرا گاؤں توانائی کا کون</text><text class="cell" x="206" y="400.4">سا ذریعہ استعمال کرے؟</text><text class="sh" x="748" y="478.8">مواصلات</text><text class="cell" x="606" y="478.8">بجلی، لہریں،</text><text class="cell" x="606" y="502.6">الیکٹرانکس</text><text class="cell" x="442" y="478.8">موبائل فون، انٹرنیٹ،</text><text class="cell" x="442" y="502.6">ریڈیو اسباق</text><text class="cell" x="206" y="478.8">کیا میرے فون پر صحت</text><text class="cell" x="206" y="502.6">کا یہ پیغام سچ ہے؟</text></g><g id="layer-labels"></g><text class="wm" x="12" y="556" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
