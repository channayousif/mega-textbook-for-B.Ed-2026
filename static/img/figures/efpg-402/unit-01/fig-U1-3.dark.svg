<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of scientific enquiry drawn as a loop</title><desc id="d">Flowchart drawn as a loop of six steps of scientific enquiry: observe, ask a question, form a hypothesis, test, conclude and communicate; arrows return to earlier steps when a hypothesis is not supported or new questions arise, showing the steps are a guide, not a fixed recipe.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="570"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-observe-question" class="stroke" x1="485" y1="90" x2="590" y2="152" marker-end="url(#arrow)"/><line id="edge-question-hypothesis" class="stroke" x1="590" y1="208" x2="590" y2="332" marker-end="url(#arrow)"/><line id="edge-hypothesis-test" class="stroke" x1="590" y1="388" x2="485" y2="450" marker-end="url(#arrow)"/><line id="edge-test-conclude" class="stroke" x1="295" y1="450" x2="190" y2="388" marker-end="url(#arrow)"/><line id="edge-conclude-communicate" class="stroke" x1="190" y1="332" x2="190" y2="208" marker-end="url(#arrow)"/><line id="edge-communicate-observe" class="dash" x1="190" y1="152" x2="295" y2="90" marker-end="url(#arrow)"/><line id="edge-conclude-hypothesis" class="dash" x1="285" y1="360" x2="495" y2="360" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-observe"><rect class="panel-a" x="295" y="62" width="190" height="56" rx="8"/><text class="sh" x="390" y="95" text-anchor="middle">Observe</text></g><g id="node-question"><rect class="panel-a" x="495" y="152" width="190" height="56" rx="8"/><text class="sh" x="590" y="185" text-anchor="middle">Ask a question</text></g><g id="node-hypothesis"><rect class="panel-a" x="495" y="332" width="190" height="56" rx="8"/><text class="sh" x="590" y="365" text-anchor="middle">Form a hypothesis</text></g><g id="node-test"><rect class="panel-a" x="295" y="422" width="190" height="56" rx="8"/><text class="sh" x="390" y="446" text-anchor="middle">Test</text><text class="cell" x="390" y="464" text-anchor="middle">(experiment or survey)</text></g><g id="node-conclude"><rect class="panel-a" x="95" y="332" width="190" height="56" rx="8"/><text class="sh" x="190" y="365" text-anchor="middle">Conclude</text></g><g id="node-communicate"><rect class="panel-a" x="95" y="152" width="190" height="56" rx="8"/><text class="sh" x="190" y="185" text-anchor="middle">Communicate</text></g></g><g id="layer-labels"><text id="label-new-questions" class="small" x="178" y="112" text-anchor="end">new questions</text><text id="label-not-supported" class="small" x="390" y="348" text-anchor="middle">hypothesis not supported</text><text id="label-caption" class="small" x="24" y="516">Real scientists move back and forth between steps; this is a guide, not a fixed recipe.</text><text id="label-key" class="small" x="24" y="534">Solid arrow: next step. Dashed arrow: back to an earlier step.</text></g><text class="wm" x="768" y="560" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
