<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 469" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنس، عام فہم اور توہم کا تقابلی جدول</title><desc id="d">سائنس، عام فہم اور توہم کا تقابلی جدول: ہر ایک کہاں سے آتا ہے، اسے کیسے پرکھا جاتا ہے، اور شواہد اس کے خلاف جائیں تو کیا ہوتا ہے، ہر ایک کی جماعت سے ایک مثال کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="469"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="28" y="33.6" width="728" height="56" rx="6"/><rect id="region-row-1" class="panel" x="28" y="89.6" width="728" height="78.4"/><rect id="region-row-2" class="plain" x="28" y="168" width="728" height="78.4"/><rect id="region-row-3" class="panel" x="28" y="246.4" width="728" height="78.4"/><rect id="region-row-4" class="plain" x="28" y="324.8" width="728" height="102.2"/></g><g id="layer-edges"><line class="grid" x1="586" y1="33.6" x2="586" y2="427"/><line class="grid" x1="400" y1="33.6" x2="400" y2="427"/><line class="grid" x1="214" y1="33.6" x2="214" y2="427"/></g><g id="layer-nodes"><text class="sh" x="748" y="67.2"></text><text class="sh" x="578" y="67.2">سائنس</text><text class="sh" x="392" y="67.2">عام فہم</text><text class="sh" x="206" y="67.2">عقیدہ یا توہم</text><text class="sh" x="748" y="123.2">یہ کہاں سے</text><text class="sh" x="748" y="147">آتا ہے</text><text class="cell" x="578" y="123.2">منظم مشاہدہ</text><text class="cell" x="578" y="147">اور تجربہ</text><text class="cell" x="392" y="123.2">روزمرہ تجربہ</text><text class="cell" x="206" y="123.2">روایت یا اختیار</text><text class="sh" x="748" y="201.6">اسے کیسے</text><text class="sh" x="748" y="225.4">پرکھا جاتا ہے</text><text class="cell" x="578" y="201.6">منصوبہ بند آزمائشیں،</text><text class="cell" x="578" y="225.4">دوسروں کی دہرائی ہوئی</text><text class="cell" x="392" y="201.6">کبھی کبھار پرکھا جاتا ہے</text><text class="cell" x="206" y="201.6">پرکھا نہیں جاتا</text><text class="sh" x="748" y="280">مخالف شواہد</text><text class="sh" x="748" y="303.8">ملنے پر</text><text class="cell" x="578" y="280">یہ بدل جاتا ہے</text><text class="cell" x="392" y="280">یہ بدل سکتا ہے</text><text class="cell" x="206" y="280">عموماً ویسا ہی</text><text class="cell" x="206" y="303.8">رہتا ہے</text><text class="sh" x="748" y="358.4">جماعت کی</text><text class="sh" x="748" y="382.2">مثال</text><text class="cell" x="578" y="358.4">”بیجوں کو انکرنے کے</text><text class="cell" x="578" y="382.2">لیے پانی چاہیے“،</text><text class="cell" x="578" y="406">جماعت میں آزمایا گیا</text><text class="cell" x="392" y="358.4">”بارش سے پہلے</text><text class="cell" x="392" y="382.2">مینڈک ٹرّاتے ہیں“</text><text class="cell" x="206" y="358.4">”کالی بلی بدقسمتی</text><text class="cell" x="206" y="382.2">لاتی ہے“</text></g><g id="layer-labels"></g><text class="wm" x="12" y="459" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
