<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 742" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنس کی پانچ خصوصیات کا تصوراتی نقشہ</title><desc id="d">تصوراتی نقشہ جس کے مرکز میں سائنس ہے اور اس کے گرد پانچ خصوصیات: تجربی، قابلِ آزمائش، غیر حتمی، تراکمی اور خود اصلاح کرنے والی، ہر ایک کا مختصر مفہوم؛ ایک تیر دکھاتا ہے کہ خود اصلاح علم کو غیر حتمی رکھتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="742"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-science-empirical" class="stroke" x1="390" y1="324.8" x2="390" y2="159.6" marker-end="url(#arrow)"/><line id="edge-science-testable" class="stroke" x1="480" y1="366.8" x2="510" y2="310.8" marker-end="url(#arrow)"/><line id="edge-science-tentative" class="stroke" x1="300" y1="366.8" x2="270" y2="310.8" marker-end="url(#arrow)"/><line id="edge-science-cumulative" class="stroke" x1="450" y1="415.8" x2="580" y2="504" marker-end="url(#arrow)"/><line id="edge-science-self-correcting" class="stroke" x1="330" y1="415.8" x2="200" y2="504" marker-end="url(#arrow)"/><line id="edge-self-correcting-tentative" class="dash" x1="80" y1="504" x2="80" y2="355.6" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-empirical"><rect class="panel-a" x="270" y="42" width="240" height="117.6" rx="8"/><text class="h" x="496" y="81.2">تجربی</text><text class="cell" x="496" y="112">مشاہدے اور تجربے سے حاصل</text><text class="cell" x="496" y="135.8">شواہد پر مبنی</text></g><g id="node-testable"><rect class="panel-a" x="510" y="238" width="240" height="117.6" rx="8"/><text class="h" x="736" y="277.2">قابلِ آزمائش</text><text class="cell" x="736" y="308">دعوے پرکھے جا سکتے ہیں</text><text class="cell" x="736" y="331.8">اور غلط بھی نکل سکتے ہیں</text></g><g id="node-tentative"><rect class="panel-a" x="30" y="238" width="240" height="117.6" rx="8"/><text class="h" x="256" y="277.2">غیر حتمی</text><text class="cell" x="256" y="308">قابلِ اعتبار، مگر نئے</text><text class="cell" x="256" y="331.8">شواہد سے تبدیلی ممکن</text></g><g id="node-cumulative"><rect class="panel-a" x="490" y="504" width="240" height="117.6" rx="8"/><text class="h" x="716" y="543.2">تراکمی</text><text class="cell" x="716" y="574">نیا علم پہلے کے علم</text><text class="cell" x="716" y="597.8">پر تعمیر ہوتا ہے</text></g><g id="node-self-correcting"><rect class="panel-a" x="50" y="504" width="240" height="117.6" rx="8"/><text class="h" x="276" y="543.2">خود اصلاح کرنے والا</text><text class="cell" x="276" y="574">مزید آزمائش سے غلطیاں</text><text class="cell" x="276" y="597.8">پکڑی اور درست ہوتی ہیں</text></g><g id="node-science"><ellipse class="panel-b" cx="390" cy="378" rx="90" ry="53.2"/><text class="h" x="390" y="386.4" text-anchor="middle">سائنس</text></g></g><g id="layer-labels"><text id="label-new-evidence" class="small" x="90" y="436.8" text-anchor="end">نئے شواہد</text><text id="label-caption" class="small" x="756" y="663.6">سائنسی علم پہچاننے کی پانچ خصوصیات۔</text><text id="label-key" class="small" x="756" y="688.8">نقطہ دار تیر: نئے شواہد علم کو غیر حتمی رکھتے ہیں۔</text></g><text class="wm" x="12" y="732" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
