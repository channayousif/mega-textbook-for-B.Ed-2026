<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 728" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنس کے تین رخوں کا مثلثی خاکہ</title><desc id="d">مثلثی خاکہ جس کے مرکز میں سائنس ہے اور کونوں پر اس کے تین رخ: عمل، حاصل اور رویہ، ہر ایک مثالوں کے ساتھ؛ اضلاع پر تیر دکھاتے ہیں کہ ہر رخ دوسروں کو کیسے سہارا دیتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="728"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-process-product" class="stroke" x1="470" y1="162.4" x2="610" y2="532" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-attitude-process" class="stroke" x1="170" y1="532" x2="310" y2="162.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-product-attitude" class="stroke" x1="496" y1="592.2" x2="284" y2="592.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-process"><rect class="panel-a" x="270" y="42" width="240" height="120.4" rx="8"/><text class="h" x="496" y="78.4">عمل</text><text class="cell" x="496" y="109.2">ہم کیسے دریافت کرتے ہیں</text><text class="cell" x="496" y="133">مشاہدہ، پیمائش، آزمائش</text></g><g id="node-product"><rect class="panel-a" x="496" y="532" width="260" height="120.4" rx="8"/><text class="h" x="742" y="568.4">حاصل</text><text class="cell" x="742" y="599.2">ہم کیا جانتے ہیں</text><text class="cell" x="742" y="623">حقائق، تصورات، قوانین، نظریات</text></g><g id="node-attitude"><rect class="panel-a" x="24" y="532" width="260" height="144.2" rx="8"/><text class="h" x="270" y="568.4">رویہ</text><text class="cell" x="270" y="599.2">ہم کیسے سوچتے ہیں</text><text class="cell" x="270" y="623">تجسس، کھلا ذہن،</text><text class="cell" x="270" y="646.8">دیانت داری</text></g><g id="node-science"><ellipse class="panel-b" cx="390" cy="378" rx="80" ry="50.4"/><text class="h" x="390" y="386.4" text-anchor="middle">سائنس</text></g></g><g id="layer-labels"><text class="small" x="558" y="330.4" text-anchor="end">عمل حاصل کو</text><text class="small" x="558" y="354.2" text-anchor="end">تعمیر کرتا ہے</text><text class="small" x="222" y="330.4">رویہ عمل کی</text><text class="small" x="222" y="354.2">رہنمائی کرتا ہے</text><text class="small" x="390" y="632.8" text-anchor="middle">حاصل نیا تجسس</text><text class="small" x="390" y="656.6" text-anchor="middle">جگاتا ہے</text></g><text class="wm" x="12" y="718" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
