<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of five characteristics of science</title><desc id="d">Concept map with science at the centre and five characteristics around it: empirical, testable, tentative, cumulative and self-correcting, each with a short meaning; an arrow shows that self-correction keeps knowledge tentative.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="530"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-science-empirical" class="stroke" x1="390" y1="232" x2="390" y2="114" marker-end="url(#arrow)"/><line id="edge-science-testable" class="stroke" x1="300" y1="262" x2="270" y2="222" marker-end="url(#arrow)"/><line id="edge-science-tentative" class="stroke" x1="480" y1="262" x2="510" y2="222" marker-end="url(#arrow)"/><line id="edge-science-cumulative" class="stroke" x1="330" y1="297" x2="200" y2="360" marker-end="url(#arrow)"/><line id="edge-science-self-correcting" class="stroke" x1="450" y1="297" x2="580" y2="360" marker-end="url(#arrow)"/><line id="edge-self-correcting-tentative" class="dash" x1="700" y1="360" x2="700" y2="254" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-empirical"><rect class="panel-a" x="270" y="30" width="240" height="84" rx="8"/><text class="h" x="284" y="58">Empirical</text><text class="cell" x="284" y="80">based on evidence from</text><text class="cell" x="284" y="97">observation and experiment</text></g><g id="node-testable"><rect class="panel-a" x="30" y="170" width="240" height="84" rx="8"/><text class="h" x="44" y="198">Testable</text><text class="cell" x="44" y="220">claims can be checked</text><text class="cell" x="44" y="237">and could turn out wrong</text></g><g id="node-tentative"><rect class="panel-a" x="510" y="170" width="240" height="84" rx="8"/><text class="h" x="524" y="198">Tentative</text><text class="cell" x="524" y="220">reliable, but open to</text><text class="cell" x="524" y="237">change with new evidence</text></g><g id="node-cumulative"><rect class="panel-a" x="50" y="360" width="240" height="84" rx="8"/><text class="h" x="64" y="388">Cumulative</text><text class="cell" x="64" y="410">new knowledge builds</text><text class="cell" x="64" y="427">on earlier knowledge</text></g><g id="node-self-correcting"><rect class="panel-a" x="490" y="360" width="240" height="84" rx="8"/><text class="h" x="504" y="388">Self-correcting</text><text class="cell" x="504" y="410">errors are found and fixed</text><text class="cell" x="504" y="427">by further testing</text></g><g id="node-science"><ellipse class="panel-b" cx="390" cy="270" rx="90" ry="38"/><text class="h" x="390" y="276" text-anchor="middle">Science</text></g></g><g id="layer-labels"><text id="label-new-evidence" class="small" x="690" y="312" text-anchor="end">new evidence</text><text id="label-caption" class="small" x="24" y="474">Five characteristics used to recognise scientific knowledge.</text><text id="label-key" class="small" x="24" y="492">Dashed arrow: new evidence keeps knowledge tentative.</text></g><text class="wm" x="768" y="520" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
