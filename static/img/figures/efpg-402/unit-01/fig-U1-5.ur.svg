<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 651" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنس پڑھانے کے چھ مقاصد اور قومی نصاب کا جدول</title><desc id="d">سائنس پڑھانے کے چھ مقاصد کا جدول، تصورات کی سمجھ سے لے کر مزید تعلیم کی تیاری تک، ہر مقصد کے سامنے سائنس کے قومی نصاب پاکستان 2022-23، جماعت 4 تا 8، کا وہ حصہ جو اسے ظاہر کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="651"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="81.2" rx="6"/><rect id="region-row-1" class="panel" x="24" y="114.8" width="732" height="78.4"/><rect id="region-row-2" class="plain" x="24" y="193.2" width="732" height="78.4"/><rect id="region-row-3" class="panel" x="24" y="271.6" width="732" height="78.4"/><rect id="region-row-4" class="plain" x="24" y="350" width="732" height="78.4"/><rect id="region-row-5" class="panel" x="24" y="428.4" width="732" height="102.2"/><rect id="region-row-6" class="plain" x="24" y="530.6" width="732" height="78.4"/></g><g id="layer-edges"><line class="grid" x1="516" y1="33.6" x2="516" y2="609"/></g><g id="layer-nodes"><text class="sh" x="748" y="67.2">سائنس پڑھانے کا مقصد</text><text class="sh" x="508" y="67.2">قومی نصاب پاکستان 2022-23</text><text class="sh" x="508" y="92.4">(سائنس، جماعت 4 تا 8) اسے کہاں دکھاتا ہے</text><text class="sh" x="748" y="148.4">اہم سائنسی تصورات</text><text class="sh" x="748" y="172.2">کی سمجھ</text><text class="cell" x="508" y="148.4">رٹا لگانے سے تصور پر مبنی تعلم کی طرف منتقلی؛</text><text class="cell" x="508" y="172.2">تین شعبے: حیاتیاتی، طبعی، زمین اور خلا کی سائنس</text><text class="sh" x="748" y="226.8">تحقیقی (عملی)</text><text class="sh" x="748" y="250.6">مہارتیں پیدا کرنا</text><text class="cell" x="508" y="226.8">سائنسی تحقیق کا حصہ: سوال پوچھنا، منصفانہ آزمائش،</text><text class="cell" x="508" y="250.6">ریکارڈ کرنا، نتیجہ اخذ کرنا</text><text class="sh" x="748" y="305.2">سائنسی رویے</text><text class="sh" x="748" y="329">پیدا کرنا</text><text class="cell" x="508" y="305.2">سائنسی تحقیق: بہتری تجویز کرنا،</text><text class="cell" x="508" y="329">استدلال پر مبنی نتائج</text><text class="sh" x="748" y="383.6">روزمرہ زندگی میں</text><text class="sh" x="748" y="407.4">سائنس کا اطلاق</text><text class="cell" x="508" y="383.6">معیارِ مطلوب: روزمرہ مسائل حل کرنے کے لیے</text><text class="cell" x="508" y="407.4">سائنس اور ٹیکنالوجی کی اہمیت پہچاننا</text><text class="sh" x="748" y="462">معاشرے اور</text><text class="sh" x="748" y="485.8">ماحول میں</text><text class="sh" x="748" y="509.6">سائنس کی سمجھ</text><text class="cell" x="508" y="462">سیاق میں سائنس کا حصہ: ماحول پر</text><text class="cell" x="508" y="485.8">مثبت اور منفی اثرات</text><text class="sh" x="748" y="564.2">مزید تعلیم اور</text><text class="sh" x="748" y="588">کام کی تیاری</text><text class="cell" x="508" y="564.2">سیاق میں سائنس: اپنے علاقے میں پیشے میں</text><text class="cell" x="508" y="588">سائنس استعمال کرنے والوں کی نشاندہی</text></g><g id="layer-labels"></g><text class="wm" x="12" y="641" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
