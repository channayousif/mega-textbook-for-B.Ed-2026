<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the values a science lesson can build</title><desc id="d">Concept map showing a science lesson building intellectual, moral and social values, each with three examples, and a link showing that honesty makes evidence trustworthy for reasoning.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-lesson-intellectual" class="stroke" x1="390" y1="80" x2="144" y2="150" marker-end="url(#arrow)"/><line id="edge-intellectual-spine" class="stroke" x1="38" y1="200" x2="38" y2="380"/><line id="edge-intellectual-asking" class="stroke" x1="38" y1="260" x2="54" y2="260" marker-end="url(#arrow)"/><line id="edge-intellectual-problem" class="stroke" x1="38" y1="320" x2="54" y2="320" marker-end="url(#arrow)"/><line id="edge-intellectual-reasoning" class="stroke" x1="38" y1="380" x2="54" y2="380" marker-end="url(#arrow)"/><line id="edge-lesson-moral" class="stroke" x1="390" y1="80" x2="390" y2="150" marker-end="url(#arrow)"/><line id="edge-moral-spine" class="stroke" x1="284" y1="200" x2="284" y2="380"/><line id="edge-moral-humility" class="stroke" x1="284" y1="260" x2="300" y2="260" marker-end="url(#arrow)"/><line id="edge-moral-respect" class="stroke" x1="284" y1="320" x2="300" y2="320" marker-end="url(#arrow)"/><line id="edge-moral-honesty" class="stroke" x1="284" y1="380" x2="300" y2="380" marker-end="url(#arrow)"/><line id="edge-lesson-social" class="stroke" x1="390" y1="80" x2="636" y2="150" marker-end="url(#arrow)"/><line id="edge-social-spine" class="stroke" x1="530" y1="200" x2="530" y2="380"/><line id="edge-social-cooperation" class="stroke" x1="530" y1="260" x2="546" y2="260" marker-end="url(#arrow)"/><line id="edge-social-community" class="stroke" x1="530" y1="320" x2="546" y2="320" marker-end="url(#arrow)"/><line id="edge-social-care" class="stroke" x1="530" y1="380" x2="546" y2="380" marker-end="url(#arrow)"/><path id="edge-honesty-reasoning" class="dash" d="M405,400 L405,440 L159,440 L159,400" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-lesson"><rect class="panel-b" x="290" y="30" width="200" height="50" rx="8"/><text class="h" x="390" y="61" text-anchor="middle">A science lesson</text></g><g id="node-intellectual"><rect class="panel-a" x="24" y="150" width="240" height="50" rx="8"/><text class="h" x="144" y="181" text-anchor="middle">Intellectual values</text></g><g id="node-intellectual-asking"><rect class="panel" x="54" y="240" width="210" height="40" rx="8"/><text class="cell" x="66" y="265">asking how do you know?</text></g><g id="node-intellectual-problem"><rect class="panel" x="54" y="300" width="210" height="40" rx="8"/><text class="cell" x="66" y="325">problem solving</text></g><g id="node-intellectual-reasoning"><rect class="panel" x="54" y="360" width="210" height="40" rx="8"/><text class="cell" x="66" y="385">reasoning from evidence</text></g><g id="node-moral"><rect class="panel-a" x="270" y="150" width="240" height="50" rx="8"/><text class="h" x="390" y="181" text-anchor="middle">Moral values</text></g><g id="node-moral-humility"><rect class="panel" x="300" y="240" width="210" height="40" rx="8"/><text class="cell" x="312" y="265">humility</text></g><g id="node-moral-respect"><rect class="panel" x="300" y="300" width="210" height="40" rx="8"/><text class="cell" x="312" y="325">respect for life</text></g><g id="node-moral-honesty"><rect class="panel" x="300" y="360" width="210" height="40" rx="8"/><text class="cell" x="312" y="385">honesty</text></g><g id="node-social"><rect class="panel-a" x="516" y="150" width="240" height="50" rx="8"/><text class="h" x="636" y="181" text-anchor="middle">Social values</text></g><g id="node-social-cooperation"><rect class="panel" x="546" y="240" width="210" height="40" rx="8"/><text class="cell" x="558" y="265">cooperation</text></g><g id="node-social-community"><rect class="panel" x="546" y="300" width="210" height="40" rx="8"/><text class="cell" x="558" y="325">community health</text></g><g id="node-social-care"><rect class="panel" x="546" y="360" width="