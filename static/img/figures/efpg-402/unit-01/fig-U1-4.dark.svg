<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Triangle diagram of the three faces of science</title><desc id="d">Triangle diagram with science in the centre and its three faces at the corners: process, product and attitude, each with examples; arrows along the sides show how each face supports the others.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-process-product" class="stroke" x1="310" y1="116" x2="170" y2="380" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-attitude-process" class="stroke" x1="610" y1="380" x2="470" y2="116" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line id="edge-product-attitude" class="stroke" x1="284" y1="423" x2="496" y2="423" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-process"><rect class="panel-a" x="270" y="30" width="240" height="86" rx="8"/><text class="h" x="284" y="56">Process</text><text class="cell" x="284" y="78">how we find out</text><text class="cell" x="284" y="95">observe, measure, test</text></g><g id="node-product"><rect class="panel-a" x="24" y="380" width="260" height="86" rx="8"/><text class="h" x="38" y="406">Product</text><text class="cell" x="38" y="428">what we know</text><text class="cell" x="38" y="445">facts, concepts, laws, theories</text></g><g id="node-attitude"><rect class="panel-a" x="496" y="380" width="260" height="103" rx="8"/><text class="h" x="510" y="406">Attitude</text><text class="cell" x="510" y="428">how we think</text><text class="cell" x="510" y="445">curiosity, open-mindedness,</text><text class="cell" x="510" y="462">honesty</text></g><g id="node-science"><ellipse class="panel-b" cx="390" cy="270" rx="80" ry="36"/><text class="h" x="390" y="276" text-anchor="middle">Science</text></g></g><g id="layer-labels"><text class="small" x="222" y="236" text-anchor="end">process builds</text><text class="small" x="222" y="253" text-anchor="end">the product</text><text class="small" x="558" y="236">attitude guides</text><text class="small" x="558" y="253">the process</text><text class="small" x="390" y="452" text-anchor="middle">the product sparks</text><text class="small" x="390" y="469" text-anchor="middle">new curiosity</text></g><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
