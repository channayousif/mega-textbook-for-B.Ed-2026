<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 404" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four areas of daily life in Pakistan shaped by science</title><desc id="d">Table showing four areas of daily life in Pakistan, health, agriculture, energy and communication, with the science behind each, what it looks like locally and one decision citizens face.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="404"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="58" rx="6"/><rect id="region-row-1" class="panel" x="24" y="82" width="732" height="73"/><rect id="region-row-2" class="plain" x="24" y="155" width="732" height="90"/><rect id="region-row-3" class="panel" x="24" y="245" width="732" height="73"/><rect id="region-row-4" class="plain" x="24" y="318" width="732" height="56"/></g><g id="layer-edges"><line class="grid" x1="166" y1="24" x2="166" y2="374"/><line class="grid" x1="330" y1="24" x2="330" y2="374"/><line class="grid" x1="566" y1="24" x2="566" y2="374"/></g><g id="layer-nodes"><text class="sh" x="32" y="48">Area of life</text><text class="sh" x="174" y="48">Science behind it</text><text class="sh" x="338" y="48">What it looks like</text><text class="sh" x="338" y="66">in Pakistan</text><text class="sh" x="574" y="48">A question</text><text class="sh" x="574" y="66">for citizens</text><text class="sh" x="32" y="106">Health</text><text class="cell" x="174" y="106">germs, immunity,</text><text class="cell" x="174" y="123">vaccines</text><text class="cell" x="338" y="106">routine immunization</text><text class="cell" x="338" y="123">for every child; polio and</text><text class="cell" x="338" y="140">typhoid vaccination campaigns</text><text class="cell" x="574" y="106">Should I vaccinate</text><text class="cell" x="574" y="123">my child?</text><text class="sh" x="32" y="179">Agriculture</text><text class="cell" x="174" y="179">plant biology, soil</text><text class="cell" x="174" y="196">chemistry,</text><text class="cell" x="174" y="213">biotechnology</text><text class="cell" x="338" y="179">improved seed, fertiliser,</text><text class="cell" x="338" y="196">crops bred for more</text><text class="cell" x="338" y="213">nutrition, such as rice</text><text class="cell" x="338" y="230">with more iron</text><text class="cell" x="574" y="179">How much fertiliser or</text><text class="cell" x="574" y="196">pesticide is safe</text><text class="cell" x="574" y="213">for the canal?</text><text class="sh" x="32" y="269">Energy</text><text class="cell" x="174" y="269">electricity, solar</text><text class="cell" x="174" y="286">energy, energy</text><text class="cell" x="174" y="303">transfer</text><text class="cell" x="338" y="269">solar panels on homes,</text><text class="cell" x="338" y="286">schools and tube wells</text><text class="cell" x="574" y="269">Which energy source</text><text class="cell" x="574" y="286">should my village use?</text><text class="sh" x="32" y="342">Communication</text><text class="cell" x="174" y="342">electricity, waves,</text><text class="cell" x="174" y="359">electronics</text><text class="cell" x="338" y="342">mobile phones, internet,</text><text class="cell" x="338" y="359">radio lessons</text><text class="cell" x="574" y="342">Is this health message</text><text class="cell" x="574" y="359">on my phone true?</text></g><g id="layer-labels"></g><text class="wm" x="768" y="394" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
