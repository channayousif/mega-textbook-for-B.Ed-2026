<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 672" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے حفاظتی ٹیکہ جات پروگرام میں شامل ویکسینوں کی ٹائم لائن، 1978 سے 2021</title><desc id="d">1978 سے 2021 تک کی ٹائم لائن جو دکھاتی ہے کہ پاکستان کا حفاظتی ٹیکہ جات پروگرام بچپن کی چھ ویکسینوں سے شروع ہوا اور اس میں ہیپاٹائٹس بی، Hib، نیوموکوکل، غیر فعال پولیو، روٹا وائرس اور ٹائیفائیڈ کی ویکسین شامل ہوئیں، اور ٹائیفائیڈ ویکسین سب سے پہلے 2019 میں سندھ پہنچی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="672"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="740" y1="350" x2="30" y2="350" marker-end="url(#arrow)"/><line id="edge-tick-1978" class="stroke" x1="680" y1="350" x2="680" y2="294"/><line id="edge-tick-2002" class="stroke" x1="596" y1="350" x2="596" y2="406"/><line id="edge-tick-2009" class="stroke" x1="512" y1="350" x2="512" y2="294"/><line id="edge-tick-2012" class="stroke" x1="428" y1="350" x2="428" y2="406"/><line id="edge-tick-2015" class="stroke" x1="344" y1="350" x2="344" y2="294"/><line id="edge-tick-2017" class="stroke" x1="260" y1="350" x2="260" y2="406"/><line id="edge-tick-2019" class="stroke" x1="176" y1="350" x2="176" y2="294"/><line id="edge-tick-2021" class="stroke" x1="92" y1="350" x2="92" y2="406"/></g><g id="layer-nodes"><circle id="node-dot-1978" class="ah" cx="680" cy="350" r="6"/><g id="node-year-1978"><rect class="panel-a" x="600" y="126" width="160" height="168" rx="8"/><text class="h" x="750" y="156.8">1978</text><text class="cell" x="750" y="182">پروگرام کا آغاز:</text><text class="cell" x="750" y="205.8">تپِ دق، پولیو،</text><text class="cell" x="750" y="229.6">خناق، کالی</text><text class="cell" x="750" y="253.4">کھانسی، تشنج،</text><text class="cell" x="750" y="277.2">خسرہ</text></g><circle id="node-dot-2002" class="ah" cx="596" cy="350" r="6"/><g id="node-year-2002"><rect class="panel-a" x="516" y="406" width="160" height="96.6" rx="8"/><text class="h" x="666" y="436.8">2002</text><text class="cell" x="666" y="462">ہیپاٹائٹس بی کی</text><text class="cell" x="666" y="485.8">ویکسین شامل</text></g><circle id="node-dot-2009" class="ah" cx="512" cy="350" r="6"/><g id="node-year-2009"><rect class="panel-a" x="432" y="197.4" width="160" height="96.6" rx="8"/><text class="h" x="582" y="228.2">2009</text><text class="cell" x="582" y="253.4">Hib ویکسین</text><text class="cell" x="582" y="277.2">شامل</text></g><circle id="node-dot-2012" class="ah" cx="428" cy="350" r="6"/><g id="node-year-2012"><rect class="panel-a" x="348" y="406" width="160" height="96.6" rx="8"/><text class="h" x="498" y="436.8">2012</text><text class="cell" x="498" y="462">نیوموکوکل</text><text class="cell" x="498" y="485.8">ویکسین شامل</text></g><circle id="node-dot-2015" class="ah" cx="344" cy="350" r="6"/><g id="node-year-2015"><rect class="panel-a" x="264" y="197.4" width="160" height="96.6" rx="8"/><text class="h" x="414" y="228.2">2015</text><text class="cell" x="414" y="253.4">غیر فعال پولیو</text><text class="cell" x="414" y="277.2">ویکسین شامل</text></g><circle id="node-dot-2017" class="ah" cx="260" cy="350" r="6"/><g id="node-year-2017"><rect class="panel-a" x="180" y="406" width="160" height="96.6" rx="8"/><text class="h" x="330" y="436.8">2017</text><text class="cell" x="330" y="462">روٹا وائرس</text><text class="cell" x="330" y="485.8">ویکسین شامل</text></g><circle id="node-dot-2019" class="ah" cx="176" cy="350" r="6"/><g id="node-year-2019"><rect class="panel-a" x="96" y="173.6" width="160" height="120.4" rx="8"/><text class="h" x="246" y="204.4">2019</text><text class="cell" x="246" y="229.6">ٹائیفائیڈ کنجوگیٹ</text><text class="cell" x="246" y="253.4">ویکسین سندھ</text><text class="cell" x="246" y="277.2">میں متعارف</text></g><circle id="node-dot-2021" class="ah" cx="92" cy="350" r="6"/><g id="node-year-2021"><rect class="panel-a" x="12" y="406" width="160" height="120.4" rx="8"/><text class="h" x="162" y="436.8">2021</text><text class="cell" x="162" y="462">ٹائیفائیڈ کنجوگیٹ</text><text class="cell" x="162" y="485.8">ویکسین پنجاب اور</text><text class="cell" x="162" y="509.6">اسلام آباد میں</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="756" y="602">ہر ویکسین سائنسی تحقیق سے شروع ہوئی اور ایک عوامی پروگرام کے ذریعے پاکستانی بچوں تک پہنچی۔</text><text id="label-source" class="small" x="756" y="627.2">سال برابر فاصلے پر ہیں، پیمانے کے مطابق نہیں۔ تاریخیں: EPI پاکستان فیکٹ فائل۔</text></g><text class="wm" x="12" y="662" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
