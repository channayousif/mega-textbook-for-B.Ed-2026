<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 391" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنسی تعلیم کی ذہنی، اخلاقی اور سماجی اقدار کا جدول</title><desc id="d">سائنسی تعلیم کی تین اقدار، ذہنی، اخلاقی اور سماجی، کا جدول: ہر ایک کا مختصر مفہوم اور پاکستانی ایلیمنٹری اسکول سے ایک مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="390.6"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="56" rx="6"/><rect id="region-row-1" class="panel" x="24" y="89.6" width="732" height="78.4"/><rect id="region-row-2" class="plain" x="24" y="168" width="732" height="78.4"/><rect id="region-row-3" class="panel" x="24" y="246.4" width="732" height="102.2"/></g><g id="layer-edges"><line class="grid" x1="626" y1="33.6" x2="626" y2="348.6"/><line class="grid" x1="366" y1="33.6" x2="366" y2="348.6"/></g><g id="layer-nodes"><text class="sh" x="748" y="67.2">قدر</text><text class="sh" x="618" y="67.2">اس کا مطلب</text><text class="sh" x="358" y="67.2">جماعت سے مثال</text><text class="sh" x="748" y="123.2">ذہنی</text><text class="cell" x="618" y="123.2">واضح استدلال، شواہد کو</text><text class="cell" x="618" y="147">پرکھنا، مسئلہ حل کرنا</text><text class="cell" x="358" y="123.2">شاگرد اپنے نتائج سے طے کرتے ہیں کہ</text><text class="cell" x="358" y="147">کیا صابن سادہ پانی سے زیادہ چاک ہٹاتا ہے</text><text class="sh" x="748" y="201.6">اخلاقی</text><text class="cell" x="618" y="201.6">دیانت داری، ذمہ داری،</text><text class="cell" x="618" y="225.4">زندگی کا احترام</text><text class="cell" x="358" y="201.6">گروہ دوسرے گروہ کی نقل کے بجائے بتاتا</text><text class="cell" x="358" y="225.4">ہے کہ اس کے بیج نہیں پھوٹے</text><text class="sh" x="748" y="280">سماجی</text><text class="cell" x="618" y="280">تعاون، برادری کی</text><text class="cell" x="618" y="303.8">صحت اور ماحول</text><text class="cell" x="618" y="327.6">کی فکر</text><text class="cell" x="358" y="280">شاگرد اسکول کے لیے ہاتھ دھونے کا پوسٹر</text><text class="cell" x="358" y="303.8">بناتے اور مشترکہ نلکے پر باری لیتے ہیں</text></g><g id="layer-labels"></g><text class="wm" x="12" y="381" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
