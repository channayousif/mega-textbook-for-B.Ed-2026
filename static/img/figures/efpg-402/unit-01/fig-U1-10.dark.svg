<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of vaccines added to Pakistan's immunization programme, 1978 to 2021</title><desc id="d">Timeline from 1978 to 2021 showing Pakistan's immunization programme starting with six childhood vaccines and adding hepatitis B, Hib, pneumococcal, inactivated polio, rotavirus and typhoid vaccines, with typhoid vaccine reaching Sindh first in 2019.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-axis" class="stroke" x1="40" y1="250" x2="750" y2="250" marker-end="url(#arrow)"/><line id="edge-tick-1978" class="stroke" x1="100" y1="250" x2="100" y2="210"/><line id="edge-tick-2002" class="stroke" x1="184" y1="250" x2="184" y2="290"/><line id="edge-tick-2009" class="stroke" x1="268" y1="250" x2="268" y2="210"/><line id="edge-tick-2012" class="stroke" x1="352" y1="250" x2="352" y2="290"/><line id="edge-tick-2015" class="stroke" x1="436" y1="250" x2="436" y2="210"/><line id="edge-tick-2017" class="stroke" x1="520" y1="250" x2="520" y2="290"/><line id="edge-tick-2019" class="stroke" x1="604" y1="250" x2="604" y2="210"/><line id="edge-tick-2021" class="stroke" x1="688" y1="250" x2="688" y2="290"/></g><g id="layer-nodes"><circle id="node-dot-1978" class="ah" cx="100" cy="250" r="6"/><g id="node-year-1978"><rect class="panel-a" x="20" y="90" width="160" height="120" rx="8"/><text class="h" x="30" y="112">1978</text><text class="cell" x="30" y="130">programme launched</text><text class="cell" x="30" y="147">for tuberculosis,</text><text class="cell" x="30" y="164">polio, diphtheria,</text><text class="cell" x="30" y="181">whooping cough,</text><text class="cell" x="30" y="198">tetanus, measles</text></g><circle id="node-dot-2002" class="ah" cx="184" cy="250" r="6"/><g id="node-year-2002"><rect class="panel-a" x="104" y="290" width="160" height="69" rx="8"/><text class="h" x="114" y="312">2002</text><text class="cell" x="114" y="330">hepatitis B</text><text class="cell" x="114" y="347">vaccine added</text></g><circle id="node-dot-2009" class="ah" cx="268" cy="250" r="6"/><g id="node-year-2009"><rect class="panel-a" x="188" y="141" width="160" height="69" rx="8"/><text class="h" x="198" y="163">2009</text><text class="cell" x="198" y="181">Hib vaccine</text><text class="cell" x="198" y="198">added</text></g><circle id="node-dot-2012" class="ah" cx="352" cy="250" r="6"/><g id="node-year-2012"><rect class="panel-a" x="272" y="290" width="160" height="69" rx="8"/><text class="h" x="282" y="312">2012</text><text class="cell" x="282" y="330">pneumococcal</text><text class="cell" x="282" y="347">vaccine added</text></g><circle id="node-dot-2015" class="ah" cx="436" cy="250" r="6"/><g id="node-year-2015"><rect class="panel-a" x="356" y="141" width="160" height="69" rx="8"/><text class="h" x="366" y="163">2015</text><text class="cell" x="366" y="181">inactivated polio</text><text class="cell" x="366" y="198">vaccine added</text></g><circle id="node-dot-2017" class="ah" cx="520" cy="250" r="6"/><g id="node-year-2017"><rect class="panel-a" x="440" y="290" width="160" height="69" rx="8"/><text class="h" x="450" y="312">2017</text><text class="cell" x="450" y="330">rotavirus</text><text class="cell" x="450" y="347">vaccine added</text></g><circle id="node-dot-2019" class="ah" cx="604" cy="250" r="6"/><g id="node-year-2019"><rect class="panel-a" x="524" y="124" width="160" height="86" rx="8"/><text class="h" x="534" y="146">2019</text><text class="cell" x="534" y="164">typhoid conjugate</text><text class="cell" x="534" y="181">vaccine introduced</text><text class="cell" x="534" y="198">in Sindh</text></g><circle id="node-dot-2021" class="ah" cx="688" cy="250" r="6"/><g id="node-year-2021"><rect class="panel-a" x="608" y="290" width="160" height="86" rx="8"/><text class="h" x="618" y="312">2021</text><text class="cell" x="618" y="330">typhoid conjugate</text><text class="cell" x="618" y="347">vaccine in Punjab</text><text class="cell" x="618" y="364">and Islamabad</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="24" y="430">Each vaccine began as scientific research and reached Pakistani children through a public programme.</text><text id="label-source" class="small" x="24" y="448">Years are evenly spaced, not drawn to scale. Dates: EPI Pakistan fact file.</text></g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
