<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 465" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six aims of teaching science matched to the National Curriculum</title><desc id="d">Table matching six aims of teaching science, from understanding concepts to preparing for further study, with the part of Pakistan's National Curriculum 2022-23 for Science, Grades 4-8, that shows each aim.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="465"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="58" rx="6"/><rect id="region-row-1" class="panel" x="24" y="82" width="732" height="56"/><rect id="region-row-2" class="plain" x="24" y="138" width="732" height="56"/><rect id="region-row-3" class="panel" x="24" y="194" width="732" height="56"/><rect id="region-row-4" class="plain" x="24" y="250" width="732" height="56"/><rect id="region-row-5" class="panel" x="24" y="306" width="732" height="73"/><rect id="region-row-6" class="plain" x="24" y="379" width="732" height="56"/></g><g id="layer-edges"><line class="grid" x1="264" y1="24" x2="264" y2="435"/></g><g id="layer-nodes"><text class="sh" x="32" y="48">Aim of teaching science</text><text class="sh" x="272" y="48">Where the National Curriculum of Pakistan 2022-23</text><text class="sh" x="272" y="66">(Science, Grades 4-8) shows it</text><text class="sh" x="32" y="106">Understand key</text><text class="sh" x="32" y="123">scientific concepts</text><text class="cell" x="272" y="106">shift from rote learning to concept-based learning;</text><text class="cell" x="272" y="123">three domains: life, physical, earth and space sciences</text><text class="sh" x="32" y="162">Develop enquiry</text><text class="sh" x="32" y="179">(process) skills</text><text class="cell" x="272" y="162">Scientific Enquiry strand: ask questions, fair test,</text><text class="cell" x="272" y="179">record, conclude</text><text class="sh" x="32" y="218">Develop scientific</text><text class="sh" x="32" y="235">attitudes</text><text class="cell" x="272" y="218">Scientific Enquiry: suggest improvements, conclusions</text><text class="cell" x="272" y="235">informed by reasoning</text><text class="sh" x="32" y="274">Apply science to</text><text class="sh" x="32" y="291">daily life</text><text class="cell" x="272" y="274">Benchmark: recognise the importance of science and</text><text class="cell" x="272" y="291">technology to solve everyday problems</text><text class="sh" x="32" y="330">Understand science in</text><text class="sh" x="32" y="347">society and the</text><text class="sh" x="32" y="364">environment</text><text class="cell" x="272" y="330">Science in Context strand: positive and negative</text><text class="cell" x="272" y="347">environmental effects</text><text class="sh" x="32" y="403">Prepare for further</text><text class="sh" x="32" y="420">study and work</text><text class="cell" x="272" y="403">Science in Context: identify people who use science</text><text class="cell" x="272" y="420">professionally in their area</text></g><g id="layer-labels"></g><text class="wm" x="768" y="455" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
