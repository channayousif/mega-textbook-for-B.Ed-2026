<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the science teacher's laboratory management duties</title><desc id="d">Concept map showing the teacher's key management responsibilities before, during, and after practical laboratory work.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><g id="layer-regions">
<rect class="panel-a" x="30" y="40" width="220" height="95" rx="8"/>
<rect class="panel-a" x="530" y="40" width="220" height="95" rx="8"/>
<ellipse class="panel-b" cx="390" cy="180" rx="105" ry="38"/>
<rect class="panel-a" x="265" y="255" width="250" height="90" rx="8"/>
</g><g id="layer-edges">
<line class="stroke" x1="300" y1="160" x2="250" y2="115" marker-end="url(#arrow)"/>
<line class="stroke" x1="480" y1="160" x2="530" y2="115" marker-end="url(#arrow)"/>
<line class="stroke" x1="390" y1="218" x2="390" y2="255" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<text class="h" x="45" y="68">1. Pre-Lab Prep</text>
<text class="cell" x="45" y="92">Trial test of experiment,</text>
<text class="cell" x="45" y="110">pre-measuring reagents, and</text>
<text class="cell" x="45" y="126">checking eyewash and exits</text>

<text class="h" x="545" y="68">3. Post-Lab Tasks</text>
<text class="cell" x="545" y="92">Supervising glass washing,</text>
<text class="cell" x="545" y="110">safe waste collection, and</text>
<text class="cell" x="545" y="126">shutting gas and power</text>

<text class="h" x="390" y="176" text-anchor="middle">Science Teacher's</text>
<text class="sh" x="390" y="196" text-anchor="middle">Laboratory Duties</text>

<text class="h" x="280" y="283">2. Live Supervision</text>
<text class="cell" x="280" y="307">Active presence across benches,</text>
<text class="cell" x="280" y="325">enforcing PPE and safety rules</text>
</g><g id="layer-labels">
<text class="small" x="24" y="375">Three phases of laboratory management: pre-lab preparation, supervision, and security.</text>
</g><text class="wm" x="768" y="415" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>