<ellipse class="panel-b" cx="390" cy="180" rx="105" ry="38"/>
</g><g id="layer-edges">
<line class="stroke" x1="300" y1="160" x2="250" y2="110" marker-end="url(#arrow)"/>
<line class="stroke" x1="480" y1="160" x2="530" y2="110" marker-end="url(#arrow)"/>
<line class="stroke" x1="300" y1="200" x2="250" y2="255" marker-end="url(#arrow)"/>
<line class="stroke" x1="480" y1="200" x2="530" y2="255" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<text class="h" x="45" y="68">Manipulative Skills</text>
<text class="cell" x="45" y="92">Accurate measuring and</text>
<text class="cell" x="45" y="110">safe handling of apparatus</text>
<text class="h" x="545" y="68">Conceptual Clarity</text>
<text class="cell" x="545" y="92">Verifying physical laws and</text>
<text class="cell" x="545" y="110">testing abstract theories</text>
<text class="h" x="45" y="263">Scientific Attitude</text>
<text class="cell" x="45" y="287">Curiosity, objectivity, and</text>
<text class="cell" x="45" y="305">respect for evidence</text>
