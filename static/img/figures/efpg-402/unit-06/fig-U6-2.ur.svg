<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مخصوص لیبارٹری کے بغیر اسکولوں کے لیے عملی تدریسی متبادل</title><desc id="d">جدول جو مخصوص لیبارٹری کے بغیر اسکولوں کے لیے چار متبادل عملی تدریسی حکمتِ عملیوں کو ظاہر کرتا ہے، جو قومی نصاب کی ہدایات سے ماخوذ ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="390"/><g id="layer-regions">
<rect class="panel-b" x="24" y="24" width="732" height="40" rx="6"/>
<rect class="panel" x="24" y="64" width="732" height="60"/>
<rect class="plain" x="24" y="124" width="732" height="60"/>
<rect class="panel" x="24" y="184" width="732" height="60"/>
<rect class="plain" x="24" y="244" width="732" height="60"/>
</g><g id="layer-edges">
<line class="grid" x1="560" y1="24" x2="560" y2="304"/>
<line class="grid" x1="290" y1="24" x2="290" y2="304"/>
</g><g id="layer-nodes">
<text class="sh" x="744" y="49">عملی حکمتِ عملی</text>
<text class="sh" x="548" y="49">کلاس روم میں اطلاق</text>
<text class="sh" x="278" y="49">سائنس کے مطلوبہ نتائج</text>

<text class="sh" x="744" y="94">متحرک سائنس کٹ</text>
<text class="small" x="744" y="112">(پورٹ ایبل کٹ بکس)</text>
<text class="cell" x="548" y="89">بنیادی نالیاں، برنرز اور لینز</text>
<text class="cell" x="548" y="107">محفوظ ڈبے میں رکھنا</text>
<text class="cell" x="278" y="89">بصریات، تیزاب اساس جانچ،</text>
<text class="cell" x="278" y="107">اور سادہ برقی سرکٹس</text>

<text class="sh" x="744" y="154">استاد کی ڈیمو میز</text>
<text class="small" x="744" y="172">(سامنے کا ورک اسٹیشن)</text>
<text class="cell" x="548" y="149">پانی کے برتن اور ٹرے والی</text>
<text class="cell" x="548" y="167">مضبوط میز مع محفوظ فاصلہ</text>
<text class="cell" x="278" y="149">حرارتی تبدیلیاں، گیس کا اخراج،</text>
<text class="cell" x="278" y="167">اور کیمیائی ردِ عمل</text>

<text class="sh" x="744" y="214">طلبہ کی سرگرمی کا گوشہ</text>
<text class="small" x="744" y="232">(کونے کے ورک اسپیس)</text>
<text class="cell" x="548" y="209">پچھلی میز پر محفوظ گھریلو اشیا</text>
<text class="cell" x="548" y="227">جیسے سرکہ، بوتلیں اور بیج</text>
<text class="cell" x="278" y="209">پودوں کا اگنا، مائع کی کثافت،</text>
<text class="cell" x="278" y="227">اور پانی کی فلٹریشن</text>

<text class="sh" x="744" y="274">کیمپس کے باہر تحقیق</text>
<text class="small" x="744" y="292">(اسکول کا میدان)</text>
<text class="cell" x="548" y="269">مٹی، پودوں اور مقامی</text>
<text class="cell" x="548" y="287">پانی کی منظم تحقیقات</text>
<text class="cell" x="278" y="269">ایکو سسٹم، مٹی کا نفوذ،</text>
<text class="cell" x="278" y="287">اور ماحولیاتی مشاہدات</text>
</g><g id="layer-labels">
<text class="small" x="756" y="340">مخصوص لیبارٹری روم کے بغیر عملی سائنس پڑھانے کی قابلِ عمل تدریسی حکمتِ عملیاں۔</text>
</g><text class="wm" x="12" y="375" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>