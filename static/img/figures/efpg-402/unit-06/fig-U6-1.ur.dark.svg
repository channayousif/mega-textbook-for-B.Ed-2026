<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنس لیبارٹری سے حاصل ہونے والی صلاحیتوں کا تصوراتی نقشہ</title><desc id="d">تصوراتی نقشہ جو ظاہر کرتا ہے کہ لیبارٹری کیا چیزیں پروان چڑھاتی ہے: عملی مہارتیں، سائنسی رویے، تصوراتی فہم اور مسائل حل کرنے کی صلاحیتیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-regions">
<rect class="panel-a" x="530" y="40" width="220" height="90" rx="8"/>
<rect class="panel-a" x="30" y="40" width="220" height="90" rx="8"/>
<rect class="panel-a" x="530" y="235" width="220" height="90" rx="8"/>
<rect class="panel-a" x="30" y="235" width="220" height="90" rx="8"/>
<ellipse class="panel-b" cx="390" cy="180" rx="105" ry="38"/>
</g><g id="layer-edges">
<line class="stroke" x1="480" y1="160" x2="530" y2="110" marker-end="url(#arrow)"/>
<line class="stroke" x1="300" y1="160" x2="250" y2="110" marker-end="url(#arrow)"/>
<line class="stroke" x1="480" y1="200" x2="530" y2="255" marker-end="url(#arrow)"/>
<line class="stroke" x1="300" y1="200" x2="250" y2="255" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<text class="h" x="735" y="68">عملی مہارتیں</text>
<text class="cell" x="735" y="92">درست پیمائش اور</text>
<text class="cell" x="735" y="110">آلات کا محفوظ استعمال</text>
<text class="h" x="235" y="68">تصوراتی وضاحت</text>
<text class="cell" x="235" y="92">طبعی قوانین کی تصدیق اور</text>
<text class="cell" x="235" y="110">تجریدی نظریات کی جانچ</text>
<text class="h" x="735" y="263">سائنسی رویہ</text>
<text class="cell" x="735" y="287">تجسس، معروضیت اور</text>
<text class="cell" x="735" y="305">شواہد کا احترام</text>
<text class="h" x="235" y="263">تحقیقی سوچ</text>
<text class="cell" x="235" y="287">سوالات وضع کرنا اور</text>
<text class="cell" x="235" y="305">مدلل نتائج اخذ کرنا</text>
<text class="h" x="390" y="176" text-anchor="middle">سائنس لیبارٹری</text>
<text class="sh" x="390" y="196" text-anchor="middle">اسکول کی تعلیم میں</text>
</g><g id="layer-labels">
<text class="small" x="756" y="380">اسکول سائنس لیبارٹریوں میں تجربی تحقیق کے ذریعے پروان چڑھنے والے چار تدریسی شعبے۔</text>
</g><text class="wm" x="12" y="420" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>