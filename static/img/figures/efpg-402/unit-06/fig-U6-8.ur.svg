</g><g id="layer-nodes">
<text class="h" x="390" y="65" text-anchor="middle">ہائیڈروکلورک ایسڈ، ہلکا (Hydrochloric Acid, Dilute)</text>
<text class="sh" x="390" y="88" text-anchor="middle">کیمیائی فارمولا: HCl (1.0 M آبی محلول)</text>

<text class="sh" x="675" y="165" text-anchor="middle" fill="var(--a3)">تیزاب</text>

<text class="h" x="615" y="138" fill="var(--a3)">اشاراتی لفظ: خطرہ (DANGER)</text>
<text class="sh" x="615" y="160">خطرے کا بیان: جلد کو شدید جلانے اور آنکھوں کو نقصان پہنچانے کا سبب بنتا ہے۔</text>
<text class="cell" x="615" y="180">احتیاطی تدابیر: حفاظتی چشمہ اور دستانے پہنیں۔ جلد کو فوری پانی سے دھوئیں؛ ہوادار جگہ میں استعمال کریں۔</text>

<text class="sh" x="710" y="248">انتظامی اور احتسابی معلومات:</text>
<text class="cell" x="710" y="272">تاریخ تیاری: 14 اکتوبر 2026</text>
