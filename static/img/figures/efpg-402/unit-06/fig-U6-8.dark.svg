<text class="cell" x="380" y="308">Storage Location: Acid Cupboard B (Bottom shelf)</text>
<text class="cell" x="85" y="331">Batch No: LAB-2026-088</text>
<text class="cell" x="380" y="331">Emergency Contact: Health Clinic Ext 12</text>
</g><g id="layer-labels">
<text class="small" x="24" y="385">Standard label components: chemical identity, GHS hazard warning, and stock metadata.</text>
