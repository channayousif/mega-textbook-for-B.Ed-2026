<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ماڈل اسکول سائنس لیبارٹری کے نقشے کا خاکہ</title><desc id="d">اسکول سائنس لیبارٹری کا مثالی منصوبہ جو طلبہ کی میزیں، بیرونی دیواروں پر سنک، استاد کے مظاہرے کی میز، تیاری کا کمرہ، دو طرفہ ہنگامی اخراج اور حفاظتی اسٹیشن دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><g id="layer-regions">
<rect class="panel" x="30" y="25" width="720" height="340" rx="8"/>
<rect class="panel-b" x="220" y="40" width="340" height="40" rx="4"/>
<rect class="panel-a" x="585" y="40" width="150" height="85" rx="4"/>
<rect class="plain" x="415" y="115" width="145" height="65" rx="4"/>
<rect class="plain" x="220" y="115" width="145" height="65" rx="4"/>
<rect class="plain" x="415" y="205" width="145" height="65" rx="4"/>
<rect class="plain" x="220" y="205" width="145" height="65" rx="4"/>
<rect class="panel-a" x="45" y="40" width="135" height="75" rx="4"/>
<rect class="panel" x="45" y="150" width="120" height="50" rx="4"/>
<rect class="panel" x="45" y="220" width="120" height="50" rx="4"/>
</g><g id="layer-edges">
<line class="stroke" x1="30" y1="310" x2="30" y2="340"/>
<line class="stroke" x1="750" y1="310" x2="750" y2="340"/>
</g><g id="layer-nodes">
<text class="sh" x="390" y="65" text-anchor="middle">استاد کی مظاہرے کی میز اور مین بورڈ</text>

<text class="sh" x="660" y="62" text-anchor="middle">تیاری اور اسٹور روم</text>
<text class="small" x="660" y="82" text-anchor="middle">مقفل کیمیکل الماری</text>
<text class="small" x="660" y="102" text-anchor="middle">ہوادار شیلفیں</text>

<text class="sh" x="487" y="142" text-anchor="middle">طلبہ کی میز 1</text>
<text class="small" x="487" y="162" text-anchor="middle">6 تا 8 طلبہ</text>

<text class="sh" x="292" y="142" text-anchor="middle">طلبہ کی میز 2</text>
<text class="small" x="292" y="162" text-anchor="middle">6 تا 8 طلبہ</text>

<text class="sh" x="487" y="232" text-anchor="middle">طلبہ کی میز 3</text>
<text class="small" x="487" y="252" text-anchor="middle">6 تا 8 طلبہ</text>

<text class="sh" x="292" y="232" text-anchor="middle">طلبہ کی میز 4</text>
<text class="small" x="292" y="252" text-anchor="middle">6 تا 8 طلبہ</text>

<text class="sh" x="112" y="65" text-anchor="middle">حفاظتی اسٹیشن</text>
<text class="small" x="112" y="85" text-anchor="middle">آنکھ دھونا اور فرسٹ ایڈ</text>
<text class="small" x="112" y="103" text-anchor="middle">کمبل اور ریت کی بالٹی</text>

<text class="sh" x="105" y="172" text-anchor="middle">بیرونی سنک</text>
<text class="small" x="105" y="190" text-anchor="middle">دھلائی کے بیسن</text>

<text class="sh" x="105" y="242" text-anchor="middle">بیرونی سنک</text>
<text class="small" x="105" y="260" text-anchor="middle">دھلائی کے بیسن</text>

<text class="sh" x="730" y="335">&lt; اخراج 1</text>
<text class="sh" x="50" y="335" text-anchor="start">اخراج 2 &gt;</text>

<text class="small" x="390" y="295" text-anchor="middle">مرکزی راستہ: تمام میزوں کے درمیان 1.5 میٹر کشادہ جگہ</text>
</g><g id="layer-labels">
<text class="small" x="756" y="390">معیاری نقشہ جو کشادہ راستے، دو طرفہ اخراج، اور الگ کیمیکل اسٹوریج فراہم کرتا ہے۔</text>
</g><text class="wm" x="12" y="415" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>