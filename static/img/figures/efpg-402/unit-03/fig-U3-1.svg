<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 374" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing the lecture method and the discussion method</title><desc id="d">Table comparing the lecture method and the discussion method on what each is, when to use it, its strengths and its limits.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="374"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="36" rx="6"/><rect id="region-row-1" class="panel" x="24" y="60" width="732" height="70"/><rect id="region-row-2" class="plain" x="24" y="130" width="732" height="70"/><rect id="region-row-3" class="panel" x="24" y="200" width="732" height="70"/><rect id="region-row-4" class="plain" x="24" y="270" width="732" height="70"/></g><g id="layer-edges"><line class="grid" x1="174" y1="24" x2="174" y2="340"/><line class="grid" x1="465" y1="24" x2="465" y2="340"/></g><g id="layer-nodes"><g id="node-head-1"></g><g id="node-head-2"><text class="sh" x="182" y="46">Lecture method</text></g><g id="node-head-3"><text class="sh" x="473" y="46">Discussion method</text></g><g id="node-row-1"><text class="sh" x="32" y="82">What it is</text><text class="cell" x="182" y="82">the teacher explains a topic orally</text><text class="cell" x="182" y="99">while pupils listen and note</text><text class="cell" x="473" y="82">teacher and pupils share ideas</text><text class="cell" x="473" y="99">through talk about one question, the</text><text class="cell" x="473" y="116">teacher guiding</text></g><g id="node-row-2"><text class="sh" x="32" y="152">When to use it</text><text class="cell" x="182" y="152">new background knowledge, history of</text><text class="cell" x="182" y="169">a discovery, a large class, short</text><text class="cell" x="182" y="186">time</text><text class="cell" x="473" y="152">a question with more than one</text><text class="cell" x="473" y="169">reasonable answer, checking ideas,</text><text class="cell" x="473" y="186">after an experiment or reading</text></g><g id="node-row-3"><text class="sh" x="32" y="222">Strengths</text><text class="cell" x="182" y="222">covers content quickly, clear</text><text class="cell" x="182" y="239">structure, the teacher models</text><text class="cell" x="182" y="256">scientific thinking</text><text class="cell" x="473" y="222">pupils think aloud, hidden wrong</text><text class="cell" x="473" y="239">ideas come out, pupils learn from</text><text class="cell" x="473" y="256">each other</text></g><g id="node-row-4"><text class="sh" x="32" y="292">Limits</text><text class="cell" x="182" y="292">pupils are passive, attention drifts</text><text class="cell" x="182" y="309">in long talk, the teacher cannot see</text><text class="cell" x="182" y="326">who understands</text><text class="cell" x="473" y="292">takes time, a few pupils may</text><text class="cell" x="473" y="309">dominate, needs some prior knowledge</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="364" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
