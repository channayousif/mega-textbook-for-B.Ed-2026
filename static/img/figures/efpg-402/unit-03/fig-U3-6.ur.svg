<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 553" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنسی اور مسئلہ حل کرنے کے طریقوں کا موازنہ</title><desc id="d">جدول جو سائنسی طریقے اور مسئلہ حل کرنے کے طریقے کا موازنہ نقطۂ آغاز، عام سوال، اہم مراحل، حاصل اور استاد کے کردار پر کرتا ہے، اور بتاتا ہے کہ دونوں شواہد استعمال کرتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="553"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="50.4" rx="6"/><rect id="region-row-1" class="panel" x="24" y="84" width="732" height="74.2"/><rect id="region-row-2" class="plain" x="24" y="158.2" width="732" height="74.2"/><rect id="region-row-3" class="panel" x="24" y="232.4" width="732" height="74.2"/><rect id="region-row-4" class="plain" x="24" y="306.6" width="732" height="74.2"/><rect id="region-row-5" class="panel" x="24" y="380.8" width="732" height="74.2"/><rect id="region-footer" class="panel-a" x="24" y="455" width="732" height="50.4"/></g><g id="layer-edges"><line class="grid" x1="606" y1="33.6" x2="606" y2="455"/><line class="grid" x1="315" y1="33.6" x2="315" y2="455"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="748" y="64.4">خصوصیت</text></g><g id="node-head-2"><text class="sh" x="598" y="64.4">سائنسی طریقہ</text></g><g id="node-head-3"><text class="sh" x="307" y="64.4">مسئلہ حل کرنے کا طریقہ</text></g><g id="node-row-1"><text class="sh" x="748" y="114.8">نقطۂ آغاز</text><text class="cell" x="598" y="114.8">فطرت پر سوال اٹھانے</text><text class="cell" x="598" y="138.6">والا مشاہدہ</text><text class="cell" x="307" y="114.8">روزمرہ زندگی میں محسوس مشکل</text></g><g id="node-row-2"><text class="sh" x="748" y="189">عام</text><text class="sh" x="748" y="212.8">سوال</text><text class="cell" x="598" y="189">”مٹی کا گھڑا پانی ٹھنڈا</text><text class="cell" x="598" y="212.8">کیوں رکھتا ہے؟“</text><text class="cell" x="307" y="189">”ہم بوتل کا پانی ٹھنڈا</text><text class="cell" x="307" y="212.8">کیسے رکھیں؟“</text></g><g id="node-row-3"><text class="sh" x="748" y="263.2">اہم مراحل</text><text class="cell" x="598" y="263.2">مشاہدہ، سوال، مفروضہ، جانچ،</text><text class="cell" x="598" y="287">نتیجہ، ابلاغ</text><text class="cell" x="307" y="263.2">محسوس کرنا، تعریف، حل تجویز،</text><text class="cell" x="307" y="287">استدلال، آزمائش، نتیجہ اور عمل</text></g><g id="node-row-4"><text class="sh" x="748" y="337.4">حاصل</text><text class="cell" x="598" y="337.4">ایک وضاحت، جس کی شواہد</text><text class="cell" x="598" y="361.2">تائید کریں یا نہ کریں</text><text class="cell" x="307" y="337.4">کارآمد حل، اور اس کے</text><text class="cell" x="307" y="361.2">پیچھے کی سائنس</text></g><g id="node-row-5"><text class="sh" x="748" y="411.6">استاد کا کردار</text><text class="cell" x="598" y="411.6">منصفانہ جانچ ترتیب دینے اور</text><text class="cell" x="598" y="435.4">شواہد پرکھنے میں مدد</text><text class="cell" x="307" y="411.6">مسئلے کی تعریف میں مدد، اور</text><text class="cell" x="307" y="435.4">اٹکنے پر رہنمائی</text></g><g id="node-footer"><text class="sh" x="748" y="485.8">دونوں شواہد استعمال کرتے ہیں؛ مسئلہ حل کرنے میں اکثر منصفانہ جانچ بھی ہوتی ہے</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="543" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
