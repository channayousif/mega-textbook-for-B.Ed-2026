</style><rect class="bg" x="0" y="0" width="780" height="395"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="36" rx="6"/><rect id="region-row-1" class="panel" x="24" y="60" width="732" height="53"/><rect id="region-row-2" class="plain" x="24" y="113" width="732" height="53"/><rect id="region-row-3" class="panel" x="24" y="166" width="732" height="53"/><rect id="region-row-4" class="plain" x="24" y="219" width="732" height="53"/><rect id="region-row-5" class="panel" x="24" y="272" width="732" height="53"/><rect id="region-footer" class="panel-a" x="24" y="325" width="732" height="36"/></g><g id="layer-edges"><line class="grid" x1="174" y1="24" x2="174" y2="325"/><line class="grid" x1="465" y1="24" x2="465" y2="325"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="32" y="46">Feature</text></g><g id="node-head-2"><text class="sh" x="182" y="46">Scientific method</text></g><g id="node-head-3"><text class="sh" x="473" y="46">Problem-solving method</text></g><g id="node-row-1"><text class="sh" x="32" y="82">Starting point</text><text class="cell" x="182" y="82">an observation that raises a</text><text class="cell" x="182" y="99">question about nature</text><text class="cell" x="473" y="82">a felt difficulty in daily life</text></g><g id="node-row-2"><text class="sh" x="32" y="135">Typical</text><text class="sh" x="32" y="152">question</text><text class="cell" x="182" y="135">"Why does a clay pot keep water</text><text class="cell" x="182" y="152">cool?"</text><text class="cell" x="473" y="135">"How can we keep our bottled water</text><text class="cell" x="473" y="152">cool?"</text></g><g id="node-row-3"><text class="sh" x="32" y="188">Main steps</text><text class="cell" x="182" y="188">observe, question, hypothesis, test,</text><text class="cell" x="182" y="205">conclude, communicate</text><text class="cell" x="473" y="188">sense, define, suggest solutions,</text><text class="cell" x="473" y="205">reason, test, conclude and act</text></g><g id="node-row-4"><text class="sh" x="32" y="241">Product</text><text class="cell" x="182" y="241">an explanation, supported or not by</text><text class="cell" x="182" y="258">evidence</text><text class="cell" x="473" y="241">a solution that works, and the</text><text class="cell" x="473" y="258">science behind it</text></g><g id="node-row-5"><text class="sh" x="32" y="294">Teacher's role</text><text class="cell" x="182" y="294">helps pupils plan fair tests and</text><text class="cell" x="182" y="311">judge evidence</text><text class="cell" x="473" y="294">helps define the problem and guides</text><text class="cell" x="473" y="311">when pupils are stuck</text></g><g id="node-footer"><text class="sh" x="32" y="347">Both use evidence; problem-solving often uses a fair test along the way</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="385" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
