<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 523.6" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">لیکچر اور مباحثے کے طریقوں کا موازنہ</title><desc id="d">جدول جو لیکچر کے طریقے اور مباحثے کے طریقے کا موازنہ کرتا ہے کہ ہر ایک کیا ہے، کب استعمال ہوتا ہے، اس کی خوبیاں اور حدود کیا ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="523.6"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="50.4" rx="6"/><rect id="region-row-1" class="panel" x="24" y="84" width="732" height="98"/><rect id="region-row-2" class="plain" x="24" y="182" width="732" height="98"/><rect id="region-row-3" class="panel" x="24" y="280" width="732" height="98"/><rect id="region-row-4" class="plain" x="24" y="378" width="732" height="98"/></g><g id="layer-edges"><line class="grid" x1="606" y1="33.6" x2="606" y2="476"/><line class="grid" x1="315" y1="33.6" x2="315" y2="476"/></g><g id="layer-nodes"><g id="node-head-1"></g><g id="node-head-2"><text class="sh" x="598" y="64.4">لیکچر کا طریقہ</text></g><g id="node-head-3"><text class="sh" x="307" y="64.4">مباحثے کا طریقہ</text></g><g id="node-row-1"><text class="sh" x="748" y="114.8">یہ کیا ہے</text><text class="cell" x="598" y="114.8">استاد موضوع کی زبانی وضاحت کرتا ہے</text><text class="cell" x="598" y="138.6">جبکہ شاگرد سنتے اور نوٹ لیتے ہیں</text><text class="cell" x="307" y="114.8">استاد اور شاگرد ایک سوال پر</text><text class="cell" x="307" y="138.6">گفتگو سے خیالات بانٹتے ہیں،</text><text class="cell" x="307" y="162.4">استاد رہنمائی کرتا ہے</text></g><g id="node-row-2"><text class="sh" x="748" y="212.8">کب استعمال کریں</text><text class="cell" x="598" y="212.8">نیا پس منظر کا علم، کسی دریافت</text><text class="cell" x="598" y="236.6">کی تاریخ، بڑی جماعت، کم وقت</text><text class="cell" x="307" y="212.8">ایک سے زیادہ معقول جواب والا</text><text class="cell" x="307" y="236.6">سوال، خیالات کی جانچ، کسی</text><text class="cell" x="307" y="260.4">تجربے یا مطالعے کے بعد</text></g><g id="node-row-3"><text class="sh" x="748" y="310.8">خوبیاں</text><text class="cell" x="598" y="310.8">مواد تیزی سے، واضح ترتیب،</text><text class="cell" x="598" y="334.6">استاد سائنسی سوچ کا نمونہ</text><text class="cell" x="598" y="358.4">پیش کرتا ہے</text><text class="cell" x="307" y="310.8">شاگرد بلند آواز میں سوچتے ہیں،</text><text class="cell" x="307" y="334.6">چھپے غلط خیالات سامنے آتے ہیں،</text><text class="cell" x="307" y="358.4">شاگرد ایک دوسرے سے سیکھتے ہیں</text></g><g id="node-row-4"><text class="sh" x="748" y="408.8">حدود</text><text class="cell" x="598" y="408.8">شاگرد غیر فعال، لمبی گفتگو میں</text><text class="cell" x="598" y="432.6">توجہ بھٹکتی ہے، استاد نہیں دیکھ</text><text class="cell" x="598" y="456.4">سکتا کہ کون سمجھا</text><text class="cell" x="307" y="408.8">وقت لیتا ہے، چند شاگرد حاوی</text><text class="cell" x="307" y="432.6">ہو سکتے ہیں، کچھ پیشگی علم ضروری</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="513.6" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
