<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600.6" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک ہی تصور کا استقرائی اور استخراجی سبق</title><desc id="d">جدول جو چھٹی جماعت کا ایک ہی تصور، کہ دھاتیں لکڑی اور پلاسٹک سے بہتر حرارت منتقل کرتی ہیں، مرحلہ وار دکھاتا ہے: استقرائی طور پر چمچ کے تجربے سے اصول تک، اور استخراجی طور پر اصول سے مثالوں تک۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="600.6"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="50.4" rx="6"/><rect id="region-row-1" class="panel" x="24" y="84" width="732" height="98"/><rect id="region-row-2" class="plain" x="24" y="182" width="732" height="98"/><rect id="region-row-3" class="panel" x="24" y="280" width="732" height="74.2"/><rect id="region-row-4" class="plain" x="24" y="354.2" width="732" height="74.2"/><rect id="region-row-5" class="panel" x="24" y="428.4" width="732" height="74.2"/><rect id="region-footer" class="panel-a" x="24" y="502.6" width="732" height="50.4"/></g><g id="layer-edges"><line class="grid" x1="616" y1="33.6" x2="616" y2="502.6"/><line class="grid" x1="320" y1="33.6" x2="320" y2="502.6"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="748" y="64.4">سبق کا مرحلہ</text></g><g id="node-head-2"><text class="sh" x="608" y="64.4">استقرائی سبق</text></g><g id="node-head-3"><text class="sh" x="312" y="64.4">استخراجی سبق</text></g><g id="node-row-1"><text class="sh" x="748" y="114.8">آغاز</text><text class="cell" x="608" y="114.8">شاگرد گرم پانی کے کپ میں</text><text class="cell" x="608" y="138.6">اسٹیل، لکڑی اور پلاسٹک کا</text><text class="cell" x="608" y="162.4">چمچ پکڑتے ہیں</text><text class="cell" x="312" y="114.8">استاد تختے پر اصول لکھتا ہے</text></g><g id="node-row-2"><text class="sh" x="748" y="212.8">درمیان</text><text class="cell" x="608" y="212.8">ایک منٹ بعد شاگرد ہر چمچ کا</text><text class="cell" x="608" y="236.6">اوپری حصہ چھو کر درج کرتے</text><text class="cell" x="608" y="260.4">ہیں کہ کون سا سب سے گرم ہے</text><text class="cell" x="312" y="212.8">استاد ایصالِ حرارت سمجھاتا اور</text><text class="cell" x="312" y="236.6">دھاتوں کو اچھا موصل بتاتا ہے</text></g><g id="node-row-3"><text class="sh" x="748" y="310.8">نمونہ یا</text><text class="sh" x="748" y="334.6">اصول</text><text class="cell" x="608" y="310.8">شاگرد کہتے ہیں: دھاتی چمچ سب سے</text><text class="cell" x="608" y="334.6">تیز گرم ہوا، پس دھاتیں بہترین موصل</text><text class="cell" x="312" y="310.8">استاد مثال کے طور پر پلاسٹک</text><text class="cell" x="312" y="334.6">کے دستے والی دیگچی دکھاتا ہے</text></g><g id="node-row-4"><text class="sh" x="748" y="385">اطلاق</text><text class="cell" x="608" y="385">شاگرد پیش گوئی کرتے ہیں کہ چولہے</text><text class="cell" x="608" y="408.8">پر کون سا دستہ استعمال ہو</text><text class="cell" x="312" y="385">شاگرد دس چیزوں کو اچھے اور</text><text class="cell" x="312" y="408.8">کمزور موصل میں چھانٹتے ہیں</text></g><g id="node-row-5"><text class="sh" x="748" y="459.2">جانچ</text><text class="cell" x="608" y="459.2">شاگرد ایک پیش گوئی آزماتے ہیں</text><text class="cell" x="312" y="459.2">استاد جوابات جانچتا اور</text><text class="cell" x="312" y="483">غلطیاں درست کرتا ہے</text></g><g id="node-footer"><text class="sh" x="748" y="533.4">استقرائی: سست، گہری سمجھ۔ استخراجی: تیز، رٹنے کا خطرہ</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="590.6" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
