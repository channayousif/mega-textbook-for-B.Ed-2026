</style><rect class="bg" x="0" y="0" width="780" height="378"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="36" rx="6"/><rect id="region-row-1" class="panel" x="24" y="60" width="732" height="53"/><rect id="region-row-2" class="plain" x="24" y="113" width="732" height="36"/><rect id="region-row-3" class="panel" x="24" y="149" width="732" height="36"/><rect id="region-row-4" class="plain" x="24" y="185" width="732" height="70"/><rect id="region-row-5" class="panel" x="24" y="255" width="732" height="36"/><rect id="region-row-6" class="plain" x="24" y="291" width="732" height="53"/></g><g id="layer-edges"><line class="grid" x1="194" y1="24" x2="194" y2="344"/><line class="grid" x1="475" y1="24" x2="475" y2="344"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="32" y="46">Feature</text></g><g id="node-head-2"><text class="sh" x="202" y="46">Laboratory method</text></g><g id="node-head-3"><text class="sh" x="483" y="46">Demonstration method</text></g><g id="node-row-1"><text class="sh" x="32" y="82">Who handles the</text><text class="sh" x="32" y="99">materials</text><text class="cell" x="202" y="82">pupils, in groups</text><text class="cell" x="483" y="82">the teacher or one pupil helper</text></g><g id="node-row-2"><text class="sh" x="32" y="135">Materials needed</text><text class="cell" x="202" y="135">one set per group</text><text class="cell" x="483" y="135">one set for the class</text></g><g id="node-row-3"><text class="sh" x="32" y="171">Time</text><text class="cell" x="202" y="171">more</text><text class="cell" x="483" y="171">less</text></g><g id="node-row-4"><text class="sh" x="32" y="207">Best for</text><text class="cell" x="202" y="207">practical skills, evidence from</text><text class="cell" x="202" y="224">pupils' own work</text><text class="cell" x="483" y="207">dangerous, delicate or costly</text><text class="cell" x="483" y="224">apparatus, a surprising event to</text><text class="cell" x="483" y="241">start a lesson</text></g><g id="node-row-5"><text class="sh" x="32" y="277">Main risk</text><text class="cell" x="202" y="277">a recipe followed without thinking</text><text class="cell" x="483" y="277">pupils only watch</text></g><g id="node-row-6"><text class="sh" x="32" y="313">Grade 6-8 example</text><text class="cell" x="202" y="313">testing household liquids with</text><text class="cell" x="202" y="330">turmeric water</text><text class="cell" x="483" y="313">a card holding water in an</text><text class="cell" x="483" y="330">upside-down glass</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="368" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
