<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 378" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing the laboratory method and the demonstration method on who handles the materials, materials needed, time, best use, main risk and a Grade 6 to 8 example</title><desc id="d">Table comparing the laboratory method and the demonstration method on who handles the materials, materials needed, time, best use, main risk and a Grade 6 to 8 example.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
