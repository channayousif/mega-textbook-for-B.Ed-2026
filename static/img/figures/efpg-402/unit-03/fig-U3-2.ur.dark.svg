<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 534.8" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بخارات پر 40 منٹ کا ایک سبق</title><desc id="d">بخارات بننے پر 40 منٹ کے ایک سبق کا خاکہ جو 10 منٹ کے لیکچر، 10 منٹ کے مظاہرے، 15 منٹ کے چھوٹے گروہی مباحثے اور 5 منٹ کے تحریری خلاصے میں بٹا ہے، اور دکھاتا ہے کہ گفتگو استاد سے شاگردوں کی طرف منتقل ہوتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="534.8"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-lecture-card" class="stroke" d="M664.5,207.2 L669,294"/><path id="edge-demonstration-card" class="stroke" d="M481.5,207.2 L483,294"/><path id="edge-discussion-card" class="stroke" d="M252.75,207.2 L297,294"/><path id="edge-summary-card" class="stroke" d="M69.75,207.2 L111,294"/></g><g id="layer-nodes"><g id="node-lecture"><rect class="panel-b" x="573" y="128.8" width="183" height="78.4"/><text class="sh" x="664.5" y="159.6" text-anchor="middle">لیکچر</text><text class="cell" x="664.5" y="183.4" text-anchor="middle">10 منٹ</text></g><g id="node-card-lecture"><rect class="plain" x="582" y="294" width="174" height="98" rx="8"/><text class="sh" x="746" y="324.8">لیکچر، 10 منٹ</text><text class="cell" x="746" y="348.6">بخارات بننا کیا ہے،</text><text class="cell" x="746" y="372.4">تختے پر خاکے کے ساتھ</text></g><g id="node-demonstration"><rect class="panel-a" x="390" y="128.8" width="183" height="78.4"/><text class="sh" x="481.5" y="159.6" text-anchor="middle">مظاہرہ</text><text class="cell" x="481.5" y="183.4" text-anchor="middle">10 منٹ</text></g><g id="node-card-demonstration"><rect class="plain" x="396" y="294" width="174" height="169.4" rx="8"/><text class="sh" x="560" y="324.8">مظاہرہ، 10 منٹ</text><text class="cell" x="560" y="372.4">مٹی کے گھڑے پر</text><text class="cell" x="560" y="396.2">گیلا کپڑا اور خشک</text><text class="cell" x="560" y="420">گھڑا، تھرمامیٹر کی</text><text class="cell" x="560" y="443.8">ریڈنگ کا موازنہ</text></g><g id="node-discussion"><rect class="panel-c" x="115.5" y="128.8" width="274.5" height="78.4"/><text class="sh" x="252.75" y="159.6" text-anchor="middle">چھوٹا گروہی مباحثہ</text><text class="cell" x="252.75" y="183.4" text-anchor="middle">15 منٹ</text></g><g id="node-card-discussion"><rect class="plain" x="210" y="294" width="174" height="193.2" rx="8"/><text class="sh" x="374" y="324.8">چھوٹا گروہی</text><text class="sh" x="374" y="348.6">مباحثہ، 15 منٹ</text><text class="cell" x="374" y="396.2">مٹکا پانی ٹھنڈا</text><text class="cell" x="374" y="420">کیوں رکھتا ہے؟</text><text class="cell" x="374" y="443.8">ہر گروہ شواہد کے</text><text class="cell" x="374" y="467.6">ساتھ ایک وجہ دے</text></g><g id="node-summary"><rect class="panel" x="24" y="128.8" width="91.5" height="78.4"/><text class="sh" x="69.75" y="159.6" text-anchor="middle">خلاصہ</text><text class="cell" x="69.75" y="183.4" text-anchor="middle">5 منٹ</text></g><g id="node-card-summary"><rect class="plain" x="24" y="294" width="174" height="121.8" rx="8"/><text class="sh" x="188" y="324.8">خلاصہ، 5 منٹ</text><text class="cell" x="188" y="348.6">شاگرد اپنے</text><text class="cell" x="188" y="372.4">الفاظ میں دو</text><text class="cell" x="188" y="396.2">سطریں لکھیں</text></g></g><g id="layer-labels"><g id="label-title"><text class="sh" x="756" y="42">بخارات پر چھٹی جماعت کا 40 منٹ کا ایک سبق</text></g><g id="label-who"><text class="small" x="756" y="81.2">سب سے زیادہ کون بولتا ہے:</text></g><g id="label-who-lecture"><text class="small" x="664.5" y="112" text-anchor="middle">استاد</text></g><g id="label-who-demonstration"><text class="small" x="481.5" y="112" text-anchor="middle">استاد اور شاگرد</text></g><g id="label-who-discussion"><text class="small" x="252.75" y="112" text-anchor="middle">شاگرد</text></g><g id="label-who-summary"><text class="small" x="69.75" y="112" text-anchor="middle">شاگرد</text></g><text class="small" x="756" y="232.4" text-anchor="start">0 منٹ</text><text class="small" x="573" y="232.4" text-anchor="middle">10 منٹ</text><text class="small" x="390" y="232.4" text-anchor="middle">20 منٹ</text><text class="small" x="207" y="232.4" text-anchor="middle">30 منٹ</text><text class="small" x="24" y="232.4" text-anchor="end">40 منٹ</text></g><text class="wm" x="12" y="524.8" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
