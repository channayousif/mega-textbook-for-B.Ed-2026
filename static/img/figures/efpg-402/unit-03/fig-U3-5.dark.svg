<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the problem-solving method applied to a Grade 7 class problem</title><desc id="d">Flowchart of the problem-solving method applied to a Grade 7 class problem: feel the difficulty of hot drinking water, define the problem, suggest three solutions, reason and plan a fair test, test by measuring temperature, return to new solutions if none works, and otherwise conclude and act.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="418"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-difficulty-define" class="stroke" d="M189,102 L213,102" marker-end="url(#arrow)"/><path id="edge-define-suggest" class="stroke" d="M378,102 L402,102" marker-end="url(#arrow)"/><path id="edge-suggest-plan" class="stroke" d="M567,102 L591,102" marker-end="url(#arrow)"/><path id="edge-plan-test" class="stroke" d="M673.5,180 L673.5,266" marker-end="url(#arrow)"/><path id="edge-test-check" class="stroke" d="M620,322 L574.5,322" marker-end="url(#arrow)"/><path id="edge-check-suggest" class="dash" d="M484.5,247 L484.5,180" marker-end="url(#arrow)"/><path id="edge-check-act" class="stroke" d="M394.5,322 L189,322" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-difficulty"><rect class="panel" x="24" y="24" width="165" height="156" rx="30"/><text class="sh" x="34" y="46">1. Felt</text><text class="sh" x="34" y="63">difficulty</text><text class="cell" x="34" y="80">our bottled water</text><text class="cell" x="34" y="97">is hot by the</text><text class="cell" x="34" y="114">second period</text></g><g id="node-define"><rect class="panel" x="213" y="24" width="165" height="156" rx="8"/><text class="sh" x="223" y="46">2. Define the</text><text class="sh" x="223" y="63">problem</text><text class="cell" x="223" y="80">which way of</text><text class="cell" x="223" y="97">storing a bottle</text><text class="cell" x="223" y="114">keeps the water</text><text class="cell" x="223" y="131">coolest until 12</text><text class="cell" x="223" y="148">noon?</text></g><g id="node-suggest"><rect class="panel" x="402" y="24" width="165" height="156" rx="8"/><text class="sh" x="412" y="46">3. Suggest</text><text class="sh" x="412" y="63">possible</text><text class="sh" x="412" y="80">solutions</text><text class="cell" x="412" y="97">wrap the bottle in</text><text class="cell" x="412" y="114">a wet cloth; keep</text><text class="cell" x="412" y="131">it in a clay pot;</text><text class="cell" x="412" y="148">keep it in the</text><text class="cell" x="412" y="165">shade</text></g><g id="node-plan"><rect class="panel" x="591" y="24" width="165" height="156" rx="8"/><text class="sh" x="601" y="46">4. Reason and</text><text class="sh" x="601" y="63">plan</text><text class="cell" x="601" y="80">which should work,</text><text class="cell" x="601" y="97">and why? plan a</text><text class="cell" x="601" y="114">fair test with the</text><text class="cell" x="601" y="131">same bottles and</text><text class="cell" x="601" y="148">the same starting</text><text class="cell" x="601" y="165">water</text></g><g id="node-test"><rect class="panel" x="620" y="266" width="136" height="121" rx="8"/><text class="sh" x="630" y="288">5. Test</text><text class="cell" x="630" y="305">measure the</text><text class="cell" x="630" y="322">water</text><text class="cell" x="630" y="339">temperature at</text><text class="cell" x="630" y="356">8 a.m. and at</text><text class="cell" x="630" y="373">12 noon</text></g><g id="node-check"><polygon class="panel-b" points="484.5,247 574.5,322 484.5,397 394.5,322"/><text class="cell" x="484.5" y="310" text-anchor="middle">Did any solution</text><text class="cell" x="484.5" y="327" text-anchor="middle">keep the water</text><text class="cell" x="484.5" y="344" text-anchor="middle">clearly cooler?</text></g><g id="node-act"><rect class="panel-a" x="24" y="266" width="165" height="121" rx="30"/><text class="sh" x="34" y="288">6. Conclude and</text><text class="sh" x="34" y="305">act</text><text class="cell" x="34" y="322">wrap bottles in wet</text><text class="cell" x="34" y="339">cloth; share the</text><text class="cell" x="34" y="356">result with the</text><text class="cell" x="34" y="373">school</text></g></g><g id="layer-labels"><g id="label-no"><text class="sh" x="494.5" y="204">no</text></g><g id="label-yes"><text class="sh" x="360.5" y="314">yes</text></g></g><text class="wm" x="768" y="408" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
