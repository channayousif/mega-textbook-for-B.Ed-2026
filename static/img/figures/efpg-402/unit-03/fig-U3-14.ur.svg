<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 603.4" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سستی سائنس سرگرمیوں کا جدول</title><desc id="d">جماعت 4 تا 8 کے عام موضوعات کے لیے سات سستی سائنس سرگرمیوں کا جدول، جیسے دن اور رات کے لیے گیند اور ٹارچ اور تیزاب اور اساس کے لیے ہلدی والا پانی، ہر ایک کے لیے درکار روزمرہ سامان کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="603.4"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="50.4" rx="6"/><rect id="region-row-1" class="panel" x="24" y="84" width="732" height="50.4"/><rect id="region-row-2" class="plain" x="24" y="134.4" width="732" height="74.2"/><rect id="region-row-3" class="panel" x="24" y="208.6" width="732" height="74.2"/><rect id="region-row-4" class="plain" x="24" y="282.8" width="732" height="74.2"/><rect id="region-row-5" class="panel" x="24" y="357" width="732" height="74.2"/><rect id="region-row-6" class="plain" x="24" y="431.2" width="732" height="74.2"/><rect id="region-row-7" class="panel" x="24" y="505.4" width="732" height="50.4"/></g><g id="layer-edges"><line class="grid" x1="566" y1="33.6" x2="566" y2="555.8"/><line class="grid" x1="246" y1="33.6" x2="246" y2="555.8"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="748" y="64.4">جماعت 4 تا 8 کا موضوع</text></g><g id="node-head-2"><text class="sh" x="558" y="64.4">سستی سرگرمی</text></g><g id="node-head-3"><text class="sh" x="238" y="64.4">سامان</text></g><g id="node-row-1"><text class="sh" x="748" y="114.8">دن اور رات</text><text class="cell" x="558" y="114.8">ٹارچ کے سامنے گیند گھمائیں</text><text class="cell" x="238" y="114.8">گیند، ٹارچ، اسٹیکر</text></g><g id="node-row-2"><text class="sh" x="748" y="165.2">ہوا جگہ گھیرتی ہے</text><text class="cell" x="558" y="165.2">الٹا گلاس پانی کی بالٹی میں</text><text class="cell" x="558" y="189">دبائیں؛ اندر کاغذ خشک رہتا ہے</text><text class="cell" x="238" y="165.2">گلاس، بالٹی، کاغذ</text></g><g id="node-row-3"><text class="sh" x="748" y="239.4">تیزاب اور اساس</text><text class="cell" x="558" y="239.4">ہلدی والے پانی سے گھریلو</text><text class="cell" x="558" y="263.2">مائعات جانچیں</text><text class="cell" x="238" y="239.4">ہلدی، کپ، لیموں،</text><text class="cell" x="238" y="263.2">صابن، کھانے کا سوڈا</text></g><g id="node-row-4"><text class="sh" x="748" y="313.6">بخارات اور</text><text class="sh" x="748" y="337.4">ٹھنڈک</text><text class="cell" x="558" y="313.6">گیلے کپڑے والی اور خشک بوتل</text><text class="cell" x="558" y="337.4">کے پانی کا درجۂ حرارت ملائیں</text><text class="cell" x="238" y="313.6">دو بوتلیں، کپڑا،</text><text class="cell" x="238" y="337.4">تھرمامیٹر</text></g><g id="node-row-5"><text class="sh" x="748" y="387.8">بیج کا پھوٹنا</text><text class="cell" x="558" y="387.8">گیلے کپڑے پر چنے کے بیج</text><text class="cell" x="558" y="411.6">روشنی اور اندھیرے میں</text><text class="cell" x="238" y="387.8">چنے کے بیج، پلیٹیں، کپڑا</text></g><g id="node-row-6"><text class="sh" x="748" y="462">آواز ٹھوس سے</text><text class="sh" x="748" y="485.8">گزرتی ہے</text><text class="cell" x="558" y="462">دھاگے والا ٹیلی فون</text><text class="cell" x="238" y="462">دو کاغذی کپ، دھاگا</text></g><g id="node-row-7"><text class="sh" x="748" y="536.2">تیرنا اور ڈوبنا</text><text class="cell" x="558" y="536.2">نل اور نمکین پانی میں انڈا</text><text class="cell" x="238" y="536.2">انڈا، نمک، گلاس</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="593.4" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
