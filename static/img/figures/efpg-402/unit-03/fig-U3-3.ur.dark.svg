<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 604.8" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">محفوظ جماعتی مظاہرے کی منصوبہ بندی کا فلو چارٹ</title><desc id="d">جماعت میں محفوظ مظاہرے کی منصوبہ بندی کا فلو چارٹ: مقصد طے کریں، آلات جمع کر کے جانچیں، آزمائشی مشق کریں اور ناکام ہو یا نظر نہ آئے تو درست کریں، شاگردوں سے پیش گوئی کرائیں، آہستہ دکھائیں، جو دیکھا اس پر سوال کریں، اور مل کر نتیجہ نکالیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="604.8"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-aim-collect" class="stroke" d="M612,246.4 L576,246.4" marker-end="url(#arrow)"/><path id="edge-collect-trial" class="stroke" d="M432,246.4 L396,246.4" marker-end="url(#arrow)"/><path id="edge-trial-check" class="stroke" d="M252,246.4 L216,246.4" marker-end="url(#arrow)"/><path id="edge-check-fix" class="stroke" d="M126,162.4 L126,131.6" marker-end="url(#arrow)"/><path id="edge-fix-trial" class="dash" d="M226,82.6 L324,82.6 L324,182" marker-end="url(#arrow)"/><path id="edge-check-predict" class="stroke" d="M126,330.4 L126,420" marker-end="url(#arrow)"/><path id="edge-predict-show" class="stroke" d="M198,484.4 L252,484.4" marker-end="url(#arrow)"/><path id="edge-show-question" class="stroke" d="M396,484.4 L432,484.4" marker-end="url(#arrow)"/><path id="edge-question-conclude" class="stroke" d="M576,484.4 L612,484.4" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-aim"><rect class="panel" x="612" y="182" width="144" height="128.8" rx="30"/><text class="sh" x="746" y="212.8">1. مقصد</text><text class="cell" x="746" y="236.6">شاگردوں کو کیا</text><text class="cell" x="746" y="260.4">دیکھنا اور</text><text class="cell" x="746" y="284.2">سمجھنا چاہیے؟</text></g><g id="node-collect"><rect class="panel" x="432" y="182" width="144" height="128.8" rx="8"/><text class="sh" x="566" y="212.8">2. آلات</text><text class="sh" x="566" y="236.6">جمع کریں</text><text class="cell" x="566" y="260.4">اور حفاظت</text><text class="cell" x="566" y="284.2">جانچیں</text></g><g id="node-trial"><rect class="panel" x="252" y="182" width="144" height="128.8" rx="8"/><text class="sh" x="386" y="212.8">3. آزمائشی مشق</text><text class="cell" x="386" y="236.6">سبق سے</text><text class="cell" x="386" y="260.4">پہلے</text></g><g id="node-check"><polygon class="panel-b" points="126,162.4 36,246.4 126,330.4 216,246.4"/><text class="cell" x="126" y="229.6" text-anchor="middle">کیا مشق کامیاب رہی،</text><text class="cell" x="126" y="253.4" text-anchor="middle">اور پچھلی قطار</text><text class="cell" x="126" y="277.2" text-anchor="middle">دیکھ سکتی ہے؟</text></g><g id="node-fix"><rect class="plain" x="26" y="33.6" width="200" height="98" rx="8"/><text class="cell" x="216" y="64.4">آلات بدلیں، بڑا کریں،</text><text class="cell" x="216" y="88.2">یا شاگردوں کو</text><text class="cell" x="216" y="112">قریب لائیں</text></g><g id="node-predict"><rect class="panel" x="54" y="420" width="144" height="128.8" rx="8"/><text class="sh" x="188" y="450.8">4. پیش گوئی</text><text class="cell" x="188" y="474.6">شاگرد بتائیں</text><text class="cell" x="188" y="498.4">کہ کیا ہوگا</text></g><g id="node-show"><rect class="panel" x="252" y="420" width="144" height="128.8" rx="8"/><text class="sh" x="386" y="450.8">5. دکھائیں</text><text class="cell" x="386" y="474.6">آہستہ، ہر مرحلے</text><text class="cell" x="386" y="498.4">کا نام لیتے ہوئے</text></g><g id="node-question"><rect class="panel" x="432" y="420" width="144" height="128.8" rx="8"/><text class="sh" x="566" y="450.8">6. سوال</text><text class="cell" x="566" y="474.6">آپ نے کیا</text><text class="cell" x="566" y="498.4">دیکھا؟ ایسا</text><text class="cell" x="566" y="522.2">کیوں ہوا؟</text></g><g id="node-conclude"><rect class="panel-a" x="612" y="420" width="144" height="128.8" rx="30"/><text class="sh" x="746" y="450.8">7. نتیجہ</text><text class="cell" x="746" y="474.6">مل کر؛ شاگرد</text><text class="cell" x="746" y="498.4">کاپیوں میں</text><text class="cell" x="746" y="522.2">لکھیں</text></g><g id="node-safety"><rect class="panel-c" x="456" y="33.6" width="300" height="112" rx="8"/><text class="sh" x="746" y="64.4">حفاظت</text><text class="cell" x="746" y="88.2">استاد کے لیے حفاظتی عینک،</text><text class="cell" x="746" y="112">شاگرد محفوظ فاصلے پر</text></g></g><g id="layer-labels"><g id="label-no"><text class="sh" x="118" y="156.8">نہیں</text></g><g id="label-yes"><text class="sh" x="118" y="358.4">ہاں</text></g></g><text class="wm" x="12" y="594.8" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
