.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="431"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="36" rx="6"/><rect id="region-row-1" class="panel" x="24" y="60" width="732" height="36"/><rect id="region-row-2" class="plain" x="24" y="96" width="732" height="53"/><rect id="region-row-3" class="panel" x="24" y="149" width="732" height="53"/><rect id="region-row-4" class="plain" x="24" y="202" width="732" height="53"/><rect id="region-row-5" class="panel" x="24" y="255" width="732" height="53"/><rect id="region-row-6" class="plain" x="24" y="308" width="732" height="53"/><rect id="region-row-7" class="panel" x="24" y="361" width="732" height="36"/></g><g id="layer-edges"><line class="grid" x1="214" y1="24" x2="214" y2="397"/><line class="grid" x1="534" y1="24" x2="534" y2="397"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="32" y="46">Grade 4-8 topic</text></g><g id="node-head-2"><text class="sh" x="222" y="46">Low-cost activity</text></g><g id="node-head-3"><text class="sh" x="542" y="46">Materials</text></g><g id="node-row-1"><text class="sh" x="32" y="82">Day and night</text><text class="cell" x="222" y="82">turn a ball in front of a torch</text><text class="cell" x="542" y="82">ball, torch, sticker</text></g><g id="node-row-2"><text class="sh" x="32" y="118">Air takes up space</text><text class="cell" x="222" y="118">push an upside-down glass into a bucket</text><text class="cell" x="222" y="135">of water; paper inside stays dry</text><text class="cell" x="542" y="118">glass, bucket, paper</text></g><g id="node-row-3"><text class="sh" x="32" y="171">Acids and bases</text><text class="cell" x="222" y="171">test household liquids with turmeric</text><text class="cell" x="222" y="188">water</text><text class="cell" x="542" y="171">turmeric, cups, lemon,</text><text class="cell" x="542" y="188">soap, baking soda</text></g><g id="node-row-4"><text class="sh" x="32" y="224">Evaporation and</text><text class="sh" x="32" y="241">cooling</text><text class="cell" x="222" y="224">compare water temperature in a wrapped</text><text class="cell" x="222" y="241">wet-cloth bottle and a dry bottle</text><text class="cell" x="542" y="224">two bottles, cloth,</text><text class="cell" x="542" y="241">thermometer</text></g><g id="node-row-5"><text class="sh" x="32" y="277">Seed germination</text><text class="cell" x="222" y="277">sprout gram seeds on wet cloth, light</text><text class="cell" x="222" y="294">and dark</text><text class="cell" x="542" y="277">gram seeds, plates, cloth</text></g><g id="node-row-6"><text class="sh" x="32" y="330">Sound travels</text><text class="sh" x="32" y="347">through solids</text><text class="cell" x="222" y="330">string telephone</text><text class="cell" x="542" y="330">two paper cups, string</text></g><g id="node-row-7"><text class="sh" x="32" y="383">Floating and sinking</text><text class="cell" x="222" y="383">egg in tap water and salty water</text><text class="cell" x="542" y="383">egg, salt, glass</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="421" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
