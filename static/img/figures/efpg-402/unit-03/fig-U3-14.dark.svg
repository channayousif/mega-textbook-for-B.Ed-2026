<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 431" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of seven low-cost science activities for common Grade 4 to 8 topics, such as a ball and torch for day and night and turmeric water for acids and bases</title><desc id="d">Table of seven low-cost science activities for common Grade 4 to 8 topics, such as a ball and torch for day and night and turmeric water for acids and bases, with the everyday materials each needs.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
