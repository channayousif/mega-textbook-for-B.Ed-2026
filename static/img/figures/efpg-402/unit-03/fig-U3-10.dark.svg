<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 429" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table showing the same Grade 6 concept, that metals conduct heat better than wood and plastic, taught inductively from a spoon experiment to the rule and deductively from the rule to examples, stage by stage</title><desc id="d">Table showing the same Grade 6 concept, that metals conduct heat better than wood and plastic, taught inductively from a spoon experiment to the rule and deductively from the rule to examples, stage by stage.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="429"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="36" rx="6"/><rect id="region-row-1" class="panel" x="24" y="60" width="732" height="70"/><rect id="region-row-2" class="plain" x="24" y="130" width="732" height="70"/><rect id="region-row-3" class="panel" x="24" y="200" width="732" height="53"/><rect id="region-row-4" class="plain" x="24" y="253" width="732" height="53"/><rect id="region-row-5" class="panel" x="24" y="306" width="732" height="53"/><rect id="region-footer" class="panel-a" x="24" y="359" width="732" height="36"/></g><g id="layer-edges"><line class="grid" x1="164" y1="24" x2="164" y2="359"/><line class="grid" x1="460" y1="24" x2="460" y2="359"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="32" y="46">Lesson stage</text></g><g id="node-head-2"><text class="sh" x="172" y="46">Inductive lesson</text></g><g id="node-head-3"><text class="sh" x="468" y="46">Deductive lesson</text></g><g id="node-row-1"><text class="sh" x="32" y="82">Opening</text><text class="cell" x="172" y="82">pupils hold a steel spoon, a wooden</text><text class="cell" x="172" y="99">spoon and a plastic spoon in a cup of</text><text class="cell" x="172" y="116">hot water</text><text class="cell" x="468" y="82">teacher writes the rule on the board</text></g><g id="node-row-2"><text class="sh" x="32" y="152">Middle</text><text class="cell" x="172" y="152">after one minute, pupils feel the top</text><text class="cell" x="172" y="169">of each spoon and record which is</text><text class="cell" x="172" y="186">hottest</text><text class="cell" x="468" y="152">teacher explains conduction and names</text><text class="cell" x="468" y="169">metals as good conductors</text></g><g id="node-row-3"><text class="sh" x="32" y="222">Pattern or</text><text class="sh" x="32" y="239">rule</text><text class="cell" x="172" y="222">pupils state: the metal spoon got hot</text><text class="cell" x="172" y="239">fastest, so metals carry heat best</text><text class="cell" x="468" y="222">teacher shows a cooking pot with a</text><text class="cell" x="468" y="239">plastic handle as an example</text></g><g id="node-row-4"><text class="sh" x="32" y="275">Application</text><text class="cell" x="172" y="275">pupils predict which pot handle</text><text class="cell" x="172" y="292">should be used on a stove</text><text class="cell" x="468" y="275">pupils sort ten objects into good and</text><text class="cell" x="468" y="292">poor conductors</text></g><g id="node-row-5"><text class="sh" x="32" y="328">Check</text><text class="cell" x="172" y="328">pupils test one prediction</text><text class="cell" x="468" y="328">teacher marks answers and corrects</text><text class="cell" x="468" y="345">errors</text></g><g id="node-footer"><text class="sh" x="32" y="381">Inductive: slower, deeper understanding. Deductive: quicker, risk of memorising</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="419" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
