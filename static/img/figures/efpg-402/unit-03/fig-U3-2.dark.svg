<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 382" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of one 40-minute lesson on evaporation divided into a 10-minute lecture, a 10-minute demonstration, a 15-minute small-group discussion and a 5-minute written summary, showing talk moving from the teacher to the pupils</title><desc id="d">Diagram of one 40-minute lesson on evaporation divided into a 10-minute lecture, a 10-minute demonstration, a 15-minute small-group discussion and a 5-minute written summary, showing talk moving from the teacher to the pupils.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
