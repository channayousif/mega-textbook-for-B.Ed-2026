</style><rect class="bg" x="0" y="0" width="780" height="382"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-lecture-card" class="stroke" d="M115.5,148 L111,210"/><path id="edge-demonstration-card" class="stroke" d="M298.5,148 L297,210"/><path id="edge-discussion-card" class="stroke" d="M527.25,148 L483,210"/><path id="edge-summary-card" class="stroke" d="M710.25,148 L669,210"/></g><g id="layer-nodes"><g id="node-lecture"><rect class="panel-b" x="24" y="92" width="183" height="56"/><text class="sh" x="115.5" y="114" text-anchor="middle">Lecture</text><text class="cell" x="115.5" y="131" text-anchor="middle">10 min</text></g><g id="node-card-lecture"><rect class="plain" x="24" y="210" width="174" height="70" rx="8"/><text class="sh" x="34" y="232">Lecture, 10 min</text><text class="cell" x="34" y="249">what evaporation is,</text><text class="cell" x="34" y="266">with a board sketch</text></g><g id="node-demonstration"><rect class="panel-a" x="207" y="92" width="183" height="56"/><text class="sh" x="298.5" y="114" text-anchor="middle">Demonstration</text><text class="cell" x="298.5" y="131" text-anchor="middle">10 min</text></g><g id="node-card-demonstration"><rect class="plain" x="210" y="210" width="174" height="121" rx="8"/><text class="sh" x="220" y="232">Demonstration, 10</text><text class="sh" x="220" y="249">min</text><text class="cell" x="220" y="266">a wet cloth on a</text><text class="cell" x="220" y="283">clay pot and a dry</text><text class="cell" x="220" y="300">pot, thermometer</text><text class="cell" x="220" y="317">readings compared</text></g><g id="node-discussion"><rect class="panel-c" x="390" y="92" width="274.5" height="56"/><text class="sh" x="527.25" y="114" text-anchor="middle">Small-group discussion</text><text class="cell" x="527.25" y="131" text-anchor="middle">15 min</text></g><g id="node-card-discussion"><rect class="plain" x="396" y="210" width="174" height="138" rx="8"/><text class="sh" x="406" y="232">Small-group</text><t