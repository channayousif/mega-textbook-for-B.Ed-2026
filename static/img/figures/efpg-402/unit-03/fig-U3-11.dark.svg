<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 519" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Staircase diagram of four levels of inquiry, confirmation, structured, guided and open, showing that the teacher gives less of the question, procedure and answer at each level and pupils take more responsibility</title><desc id="d">Staircase diagram of four levels of inquiry, confirmation, structured, guided and open, showing that the teacher gives less of the question, procedure and answer at each level and pupils take more responsibility, with a Grade 6 floating example at each level.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="519"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-responsibility" class="stroke" d="M30,188 L750,32" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-confirmation"><rect class="panel-b" x="24" y="210" width="177" height="200"/><text class="sh" x="34" y="232">1. Confirmation</text><path class="stroke" d="M36,250 L40,255 L48,245"/><text class="cell" x="54" y="255">question: given</text><path class="stroke" d="M36,270 L40,275 L48,265"/><text class="cell" x="54" y="275">procedure: given</text><path class="stroke" d="M36,290 L40,295 L48,285"/><text class="cell" x="54" y="295">answer: given</text><text class="cell" x="34" y="323">pupils confirm a</text><text class="cell" x="34" y="340">known result</text></g><g id="node-structured"><rect class="panel-b" x="209" y="170" width="177" height="240"/><text class="sh" x="219" y="192">2. Structured</text><path class="stroke" d="M221,210 L225,215 L233,205"/><text class="cell" x="239" y="215">question: given</text><path class="stroke" d="M221,230 L225,235 L233,225"/><text class="cell" x="239" y="235">procedure: given</text><path class="stroke" d="M221,250 L233,250"/><text class="cell" x="239" y="255">answer: pupils</text><text class="cell" x="219" y="283">pupils find the</text><text class="cell" x="219" y="300">answer</text></g><g id="node-guided"><rect class="panel-b" x="394" y="130" width="177" height="280"/><text class="sh" x="404" y="152">3. Guided</text><path class="stroke" d="M406,170 L410,175 L418,165"/><text class="cell" x="424" y="175">question: given</text><path class="stroke" d="M406,190 L418,190"/><text class="cell" x="424" y="195">procedure: pupils</text><path class="stroke" d="M406,210 L418,210"/><text class="cell" x="424" y="215">answer: pupils</text><text class="cell" x="404" y="243">pupils plan the</text><text class="cell" x="404" y="260">procedure and find</text><text class="cell" x="404" y="277">the answer</text></g><g id="node-open"><rect class="panel-a" x="579" y="90" width="177" height="320"/><text class="sh" x="589" y="112">4. Open</text><path class="stroke" d="M591,130 L603,130"/><text class="cell" x="609" y="135">question: pupils</text><path class="stroke" d="M591,150 L603,150"/><text class="cell" x="609" y="155">procedure: pupils</text><path class="stroke" d="M591,170 L603,170"/><text class="cell" x="609" y="175">answer: pupils</text><text class="cell" x="589" y="203">pupils ask the</text><text class="cell" x="589" y="220">question, plan the</text><text class="cell" x="589" y="237">procedure and find</text><text class="cell" x="589" y="254">the answer</text></g></g><g id="layer-labels"><g id="label-ex-confirmation"><text class="small" x="30" y="434">follow steps to show</text><text class="small" x="30" y="451">an egg floats in</text><text class="small" x="30" y="468">salty water</text></g><g id="label-ex-structured"><text class="small" x="215" y="434">follow steps to test</text><text class="small" x="215" y="451">how much salt makes</text><text class="small" x="215" y="468">the egg float, and</text><text class="small" x="215" y="485">explain</text></g><g id="label-ex-guided"><text class="small" x="400" y="434">find out how salt</text><text class="small" x="400" y="451">affects floating:</text><text class="small" x="400" y="468">plan your own test</text></g><g id="label-ex-open"><text class="small" x="585" y="434">ask and test your own</text><text class="small" x="585" y="451">question about</text><text class="small" x="585" y="468">floating</text></g><g id="label-arrow"><text class="sh" x="24" y="70">more pupil responsibility,</text><text class="sh" x="24" y="87">more inquiry skill needed</text></g></g><text class="wm" x="768" y="509" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
