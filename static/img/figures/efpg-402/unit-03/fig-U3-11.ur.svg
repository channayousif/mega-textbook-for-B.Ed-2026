<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 726.6" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تحقیق کی چار سطحوں کا زینہ</title><desc id="d">تحقیق کی چار سطحوں، تصدیقی، ساختہ، رہنمائی والی اور کھلی، کا زینہ نما خاکہ جو دکھاتا ہے کہ ہر سطح پر استاد سوال، طریقۂ کار اور جواب میں سے کم دیتا ہے اور شاگرد زیادہ ذمہ داری لیتے ہیں، ہر سطح پر چھٹی جماعت کی تیرنے والی مثال کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="726.6"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-responsibility" class="stroke" d="M750,263.2 L30,44.8" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-confirmation"><rect class="panel-b" x="579" y="294" width="177" height="280"/><text class="sh" x="746" y="324.8">1. تصدیقی</text><path class="stroke" d="M732,350 L736,355 L744,345"/><text class="cell" x="726" y="357">سوال: دیا گیا</text><path class="stroke" d="M732,378 L736,383 L744,373"/><text class="cell" x="726" y="385">طریقہ: دیا گیا</text><path class="stroke" d="M732,406 L736,411 L744,401"/><text class="cell" x="726" y="413">جواب: دیا گیا</text><text class="cell" x="746" y="452.2">شاگرد معلوم نتیجے</text><text class="cell" x="746" y="476">کی تصدیق کریں</text></g><g id="node-structured"><rect class="panel-b" x="394" y="238" width="177" height="336"/><text class="sh" x="561" y="268.8">2. ساختہ</text><path class="stroke" d="M547,294 L551,299 L559,289"/><text class="cell" x="541" y="301">سوال: دیا گیا</text><path class="stroke" d="M547,322 L551,327 L559,317"/><text class="cell" x="541" y="329">طریقہ: دیا گیا</text><path class="stroke" d="M547,350 L559,350"/><text class="cell" x="541" y="357">جواب: شاگرد</text><text class="cell" x="561" y="396.2">شاگرد جواب</text><text class="cell" x="561" y="420">ڈھونڈیں</text></g><g id="node-guided"><rect class="panel-b" x="209" y="182" width="177" height="392"/><text class="sh" x="376" y="212.8">3. رہنمائی والی</text><path class="stroke" d="M362,238 L366,243 L374,233"/><text class="cell" x="356" y="245">سوال: دیا گیا</text><path class="stroke" d="M362,266 L374,266"/><text class="cell" x="356" y="273">طریقہ: شاگرد</text><path class="stroke" d="M362,294 L374,294"/><text class="cell" x="356" y="301">جواب: شاگرد</text><text class="cell" x="376" y="340.2">شاگرد طریقہ بنا</text><text class="cell" x="376" y="364">کر جواب</text><text class="cell" x="376" y="387.8">ڈھونڈیں</text></g><g id="node-open"><rect class="panel-a" x="24" y="126" width="177" height="448"/><text class="sh" x="191" y="156.8">4. کھلی</text><path class="stroke" d="M177,182 L189,182"/><text class="cell" x="171" y="189">سوال: شاگرد</text><path class="stroke" d="M177,210 L189,210"/><text class="cell" x="171" y="217">طریقہ: شاگرد</text><path class="stroke" d="M177,238 L189,238"/><text class="cell" x="171" y="245">جواب: شاگرد</text><text class="cell" x="191" y="284.2">شاگرد سوال پوچھیں،</text><text class="cell" x="191" y="308">طریقہ بنائیں اور</text><text class="cell" x="191" y="331.8">جواب ڈھونڈیں</text></g></g><g id="layer-labels"><g id="label-ex-confirmation"><text class="small" x="750" y="607.6">مراحل پر چل کر</text><text class="small" x="750" y="631.4">دکھائیں کہ انڈا</text><text class="small" x="750" y="655.2">نمکین پانی میں تیرتا ہے</text></g><g id="label-ex-structured"><text class="small" x="565" y="607.6">مراحل پر چل کر</text><text class="small" x="565" y="631.4">جانچیں کہ کتنے</text><text class="small" x="565" y="655.2">نمک سے انڈا</text><text class="small" x="565" y="679">تیرتا ہے، اور سمجھائیں</text></g><g id="label-ex-guided"><text class="small" x="380" y="607.6">معلوم کریں کہ نمک</text><text class="small" x="380" y="631.4">تیرنے پر کیا اثر</text><text class="small" x="380" y="655.2">ڈالتا ہے: خود جانچ بنائیں</text></g><g id="label-ex-open"><text class="small" x="195" y="607.6">تیرنے پر اپنا سوال</text><text class="small" x="195" y="631.4">پوچھیں اور</text><text class="small" x="195" y="655.2">خود آزمائیں</text></g><g id="label-arrow"><text class="sh" x="756" y="98">شاگردوں کی ذمہ داری زیادہ،</text><text class="sh" x="756" y="121.8">تحقیقی مہارت زیادہ درکار</text></g></g><text class="wm" x="12" y="716.6" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
