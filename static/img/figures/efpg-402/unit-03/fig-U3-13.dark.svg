<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 459" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Cycle flowchart of Kolb's four stages of experiential learning applied to a Grade 5 lesson on day and night</title><desc id="d">Cycle flowchart of Kolb's four stages of experiential learning applied to a Grade 5 lesson on day and night: turning a ball in torchlight, describing what was seen, forming the idea that the earth spins, and testing predictions on the ball, with the teacher questioning at every stage.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="459"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-concrete-reflective" class="stroke" d="M550.0,59.0 C641.0,59.0 641.0,59.0 641.0,134" marker-end="url(#arrow)"/><path id="edge-reflective-abstract" class="stroke" d="M641.0,272 C641.0,355.5 641.0,355.5 550.0,355.5" marker-end="url(#arrow)"/><path id="edge-abstract-active" class="stroke" d="M230.0,355.5 C139.0,355.5 139.0,355.5 139.0,255" marker-end="url(#arrow)"/><path id="edge-active-concrete" class="dash" d="M139.0,134 C139.0,59.0 139.0,59.0 230.0,59.0" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-concrete"><rect class="panel-a" x="230" y="24" width="320" height="70" rx="8"/><text class="sh" x="240" y="46">1. Concrete experience</text><text class="cell" x="240" y="63">in a darkened room, a pupil turns a</text><text class="cell" x="240" y="80">ball slowly in front of a torch</text></g><g id="node-reflective"><rect class="panel" x="526" y="134" width="230" height="138" rx="8"/><text class="sh" x="536" y="156">2. Reflective</text><text class="sh" x="536" y="173">observation</text><text class="cell" x="536" y="190">pupils describe what they</text><text class="cell" x="536" y="207">saw: one half of the ball</text><text class="cell" x="536" y="224">is always lit; a sticker on</text><text class="cell" x="536" y="241">the ball moves from light</text><text class="cell" x="536" y="258">to dark</text></g><g id="node-active"><rect class="panel" x="24" y="134" width="230" height="121" rx="8"/><text class="sh" x="34" y="156">4. Active</text><text class="sh" x="34" y="173">experimentation</text><text class="cell" x="34" y="190">pupils predict and test: if</text><text class="cell" x="34" y="207">Pakistan is in daylight,</text><text class="cell" x="34" y="224">where is it night? they</text><text class="cell" x="34" y="241">mark it on the ball</text></g><g id="node-abstract"><rect class="panel" x="230" y="312" width="320" height="87" rx="8"/><text class="sh" x="240" y="334">3. Abstract conceptualisation</text><text class="cell" x="240" y="351">the class forms the idea that the earth</text><text class="cell" x="240" y="368">spins, so each place turns into and out</text><text class="cell" x="240" y="385">of the sun's light</text></g></g><g id="layer-labels"><g id="label-new"><text class="small" x="24" y="51">new experience</text></g><g id="label-centre"><text class="sh" x="390" y="199" text-anchor="middle">teacher questions</text><text class="sh" x="390" y="216" text-anchor="middle">at every stage</text></g><g id="label-caption"><text class="small" x="24" y="425">Based on the four stages of Kolb's experiential learning cycle, as described by Morris (2020)</text></g></g><text class="wm" x="768" y="449" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
