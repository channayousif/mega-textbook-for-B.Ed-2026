<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 432" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart for planning a safe classroom demonstration</title><desc id="d">Flowchart for planning a safe classroom demonstration: set the aim, collect and check apparatus, do a trial run and fix it if it fails or cannot be seen, ask pupils to predict, show slowly, question pupils about what they saw, and conclude together.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="432"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-aim-collect" class="stroke" d="M168,176 L204,176" marker-end="url(#arrow)"/><path id="edge-collect-trial" class="stroke" d="M348,176 L384,176" marker-end="url(#arrow)"/><path id="edge-trial-check" class="stroke" d="M528,176 L564,176" marker-end="url(#arrow)"/><path id="edge-check-fix" class="stroke" d="M654,116 L654,94" marker-end="url(#arrow)"/><path id="edge-fix-trial" class="dash" d="M554,59 L456,59 L456,130" marker-end="url(#arrow)"/><path id="edge-check-predict" class="stroke" d="M654,236 L654,300" marker-end="url(#arrow)"/><path id="edge-predict-show" class="stroke" d="M582,346 L528,346" marker-end="url(#arrow)"/><path id="edge-show-question" class="stroke" d="M384,346 L348,346" marker-end="url(#arrow)"/><path id="edge-question-conclude" class="stroke" d="M204,346 L168,346" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-aim"><rect class="panel" x="24" y="130" width="144" height="92" rx="30"/><text class="sh" x="34" y="152">1. Aim</text><text class="cell" x="34" y="169">what should</text><text class="cell" x="34" y="186">pupils see and</text><text class="cell" x="34" y="203">understand?</text></g><g id="node-collect"><rect class="panel" x="204" y="130" width="144" height="92" rx="8"/><text class="sh" x="214" y="152">2. Collect</text><text class="sh" x="214" y="169">apparatus</text><text class="cell" x="214" y="186">and check it is</text><text class="cell" x="214" y="203">safe</text></g><g id="node-trial"><rect class="panel" x="384" y="130" width="144" height="92" rx="8"/><text class="sh" x="394" y="152">3. Trial run</text><text class="cell" x="394" y="169">before the</text><text class="cell" x="394" y="186">lesson</text></g><g id="node-check"><polygon class="panel-b" points="654,116 744,176 654,236 564,176"/><text class="cell" x="654" y="164" text-anchor="middle">Did the trial work,</text><text class="cell" x="654" y="181" text-anchor="middle">and can the back</text><text class="cell" x="654" y="198" text-anchor="middle">row see it?</text></g><g id="node-fix"><rect class="plain" x="554" y="24" width="200" height="70" rx="8"/><text class="cell" x="564" y="46">change the apparatus,</text><text class="cell" x="564" y="63">enlarge it, or move</text><text class="cell" x="564" y="80">pupils closer</text></g><g id="node-predict"><rect class="panel" x="582" y="300" width="144" height="92" rx="8"/><text class="sh" x="592" y="322">4. Predict</text><text class="cell" x="592" y="339">pupils say what</text><text class="cell" x="592" y="356">will happen</text></g><g id="node-show"><rect class="panel" x="384" y="300" width="144" height="92" rx="8"/><text class="sh" x="394" y="322">5. Show</text><text class="cell" x="394" y="339">slowly, naming</text><text class="cell" x="394" y="356">each step</text></g><g id="node-question"><rect class="panel" x="204" y="300" width="144" height="92" rx="8"/><text class="sh" x="214" y="322">6. Question</text><text class="cell" x="214" y="339">what did you</text><text class="cell" x="214" y="356">observe? why did</text><text class="cell" x="214" y="373">it happen?</text></g><g id="node-conclude"><rect class="panel-a" x="24" y="300" width="144" height="92" rx="30"/><text class="sh" x="34" y="322">7. Conclude</text><text class="cell" x="34" y="339">together; pupils</text><text class="cell" x="34" y="356">record in</text><text class="cell" x="34" y="373">notebooks</text></g><g id="node-safety"><rect class="panel-c" x="24" y="24" width="300" height="80" rx="8"/><text class="sh" x="34" y="46">Safety</text><text class="cell" x="34" y="63">safety goggles for the teacher,</text><text class="cell" x="34" y="80">pupils at a safe distance</text></g></g><g id="layer-labels"><g id="label-no"><text class="sh" x="662" y="112">no</text></g><g id="label-yes"><text class="sh" x="662" y="256">yes</text></g></g><text class="wm" x="768" y="422" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
