<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 624.4" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تحقیقی اور دریافتی تعلم کا موازنہ</title><desc id="d">جدول جو تحقیق پر مبنی تعلم اور دریافتی تعلم کا موازنہ نقطۂ آغاز، ہدف، شاگردوں کے کام، استاد کے کردار اور چھٹی جماعت کی تیرنے والی مثال پر کرتا ہے، اور بتاتا ہے کہ دونوں کو استاد کی رہنمائی چاہیے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="624.4"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="50.4" rx="6"/><rect id="region-row-1" class="panel" x="24" y="84" width="732" height="74.2"/><rect id="region-row-2" class="plain" x="24" y="158.2" width="732" height="98"/><rect id="region-row-3" class="panel" x="24" y="256.2" width="732" height="74.2"/><rect id="region-row-4" class="plain" x="24" y="330.4" width="732" height="98"/><rect id="region-row-5" class="panel" x="24" y="428.4" width="732" height="98"/><rect id="region-footer" class="panel-a" x="24" y="526.4" width="732" height="50.4"/></g><g id="layer-edges"><line class="grid" x1="606" y1="33.6" x2="606" y2="526.4"/><line class="grid" x1="315" y1="33.6" x2="315" y2="526.4"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="748" y="64.4">خصوصیت</text></g><g id="node-head-2"><text class="sh" x="598" y="64.4">تحقیق پر مبنی تعلم</text></g><g id="node-head-3"><text class="sh" x="307" y="64.4">دریافتی تعلم</text></g><g id="node-row-1"><text class="sh" x="748" y="114.8">نقطۂ آغاز</text><text class="cell" x="598" y="114.8">سوال، مسئلہ یا الجھانے</text><text class="cell" x="598" y="138.6">والا مشاہدہ</text><text class="cell" x="307" y="114.8">استاد کا ترتیب دیا ہوا سامان</text><text class="cell" x="307" y="138.6">یا مثالیں</text></g><g id="node-row-2"><text class="sh" x="748" y="189">ہدف</text><text class="cell" x="598" y="189">شواہد پر مبنی جواب؛</text><text class="cell" x="598" y="212.8">کھلی سطح پر جواب</text><text class="cell" x="598" y="236.6">نامعلوم ہو سکتا ہے</text><text class="cell" x="307" y="189">استاد کے ذہن میں موجود</text><text class="cell" x="307" y="212.8">تصور یا اصول</text></g><g id="node-row-3"><text class="sh" x="748" y="287">شاگردوں کا کام</text><text class="cell" x="598" y="287">تحقیق کی منصوبہ بندی اور انجام،</text><text class="cell" x="598" y="310.8">شواہد سے وضاحت</text><text class="cell" x="307" y="287">کھوج، نمونہ تلاش،</text><text class="cell" x="307" y="310.8">اصول بیان کرنا</text></g><g id="node-row-4"><text class="sh" x="748" y="361.2">استاد کا کردار</text><text class="cell" x="598" y="361.2">سطح طے، کوچنگ، وضاحت کے</text><text class="cell" x="598" y="385">مرحلے میں براہِ راست سمجھانا</text><text class="cell" x="307" y="361.2">سامان ترتیب، رہنما سوالات،</text><text class="cell" x="307" y="385">رائے دینا، تصور کا</text><text class="cell" x="307" y="408.8">نام بتانا</text></g><g id="node-row-5"><text class="sh" x="748" y="459.2">جماعت 6 کی مثال</text><text class="cell" x="598" y="459.2">تحقیق کریں کہ نمک انڈے کے</text><text class="cell" x="598" y="483">تیرنے پر کیا اثر ڈالتا ہے</text><text class="cell" x="307" y="459.2">نل اور نمکین پانی میں چیزیں</text><text class="cell" x="307" y="483">آزمائیں، یہاں تک کہ کثافت</text><text class="cell" x="307" y="506.8">کا خیال ابھرے</text></g><g id="node-footer"><text class="sh" x="748" y="557.2">دونوں کو رہنمائی چاہیے؛ اس کے بغیر شاگرد اکثر غلط خیالات بنا لیتے ہیں</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="614.4" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
