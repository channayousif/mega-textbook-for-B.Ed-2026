<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 429" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table setting out a field-trip plan for a Grade 6 visit to a solar-powered tube well</title><desc id="d">Table setting out a field-trip plan for a Grade 6 visit to a solar-powered tube well: purpose, permissions, safety, preparation before the visit, group tasks during it and follow-up in class.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="429"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="24" width="732" height="53" rx="6"/><rect id="region-row-1" class="panel" x="24" y="77" width="732" height="53"/><rect id="region-row-2" class="plain" x="24" y="130" width="732" height="53"/><rect id="region-row-3" class="panel" x="24" y="183" width="732" height="53"/><rect id="region-row-4" class="plain" x="24" y="236" width="732" height="53"/><rect id="region-row-5" class="panel" x="24" y="289" width="732" height="53"/><rect id="region-row-6" class="plain" x="24" y="342" width="732" height="53"/></g><g id="layer-edges"><line class="grid" x1="204" y1="24" x2="204" y2="395"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="32" y="46">Part of the plan</text></g><g id="node-head-2"><text class="sh" x="212" y="46">Example: Grade 6 visit to a solar-powered tube well near the</text><text class="sh" x="212" y="63">school</text></g><g id="node-row-1"><text class="sh" x="32" y="99">Purpose</text><text class="cell" x="212" y="99">see how solar energy is turned into electricity to pump water; link to</text><text class="cell" x="212" y="116">the chapter on energy</text></g><g id="node-row-2"><text class="sh" x="32" y="152">Permissions</text><text class="cell" x="212" y="152">head teacher's approval; written consent from parents; farmer's</text><text class="cell" x="212" y="169">agreement</text></g><g id="node-row-3"><text class="sh" x="32" y="205">Safety</text><text class="cell" x="212" y="205">one adult for every ten pupils; stay away from the open well and wires;</text><text class="cell" x="212" y="222">drinking water and caps</text></g><g id="node-row-4"><text class="sh" x="32" y="258">Before the visit</text><text class="cell" x="212" y="258">teacher visits first; pupils learn the purpose, rules and three</text><text class="cell" x="212" y="275">questions; groups formed</text></g><g id="node-row-5"><text class="sh" x="32" y="311">Tasks during the</text><text class="sh" x="32" y="328">visit</text><text class="cell" x="212" y="311">one shared sheet per group: sketch panels and pump, record answers to</text><text class="cell" x="212" y="328">three questions, ask the farmer one question</text></g><g id="node-row-6"><text class="sh" x="32" y="364">Follow-up in class</text><text class="cell" x="212" y="364">groups present findings; link to solar ovens; write two lines on what</text><text class="cell" x="212" y="381">happens on a cloudy day</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="419" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
