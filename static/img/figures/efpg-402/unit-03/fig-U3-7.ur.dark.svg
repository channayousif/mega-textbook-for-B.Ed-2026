<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 655.2" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول کے سائنس منصوبے کے پانچ مراحل</title><desc id="d">اسکول کے سائنس منصوبے کے پانچ مراحل کا فلو چارٹ: مقصد طے کرنا، منصوبہ بندی، انجام دہی، پیشکش اور پرکھ، ہر ایک کے ساتھ چھٹی جماعت کے شمسی تندور کی مثال، پرکھ سے منصوبہ بندی کی طرف بہتری کا تیر، اور یہ نوٹ کہ استاد پورے عمل میں رہنمائی کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="655.2"/><g id="layer-regions"><rect id="region-teacher" class="panel-b" x="24" y="557.2" width="732" height="50.4" rx="6"/></g><g id="layer-edges"><path id="edge-purposing-ex" class="dash" d="M694,299.6 L694,319.2"/><path id="edge-purposing-planning" class="stroke" d="M632,194.6 L604,194.6" marker-end="url(#arrow)"/><path id="edge-planning-ex" class="dash" d="M542,299.6 L542,319.2"/><path id="edge-planning-executing" class="stroke" d="M480,194.6 L452,194.6" marker-end="url(#arrow)"/><path id="edge-executing-ex" class="dash" d="M390,299.6 L390,319.2"/><path id="edge-executing-presenting" class="stroke" d="M328,194.6 L300,194.6" marker-end="url(#arrow)"/><path id="edge-presenting-ex" class="dash" d="M238,299.6 L238,319.2"/><path id="edge-presenting-judging" class="stroke" d="M176,194.6 L148,194.6" marker-end="url(#arrow)"/><path id="edge-judging-ex" class="dash" d="M86,299.6 L86,319.2"/><path id="edge-judging-planning" class="dash" d="M86,89.6 L86,56 L542,56 L542,89.6" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-purposing"><rect class="panel-a" x="632" y="89.6" width="124" height="210" rx="8"/><text class="sh" x="746" y="120.4">1. مقصد</text><text class="sh" x="746" y="144.2">طے کرنا</text><text class="cell" x="746" y="168">جماعت</text><text class="cell" x="746" y="191.8">ایک ہدف</text><text class="cell" x="746" y="215.6">چنتی ہے</text></g><g id="node-ex-purposing"><rect class="plain" x="632" y="355.6" width="124" height="173.6" rx="8"/><text class="cell" x="746" y="386.4">ایسا شمسی</text><text class="cell" x="746" y="410.2">تندور بنائیں</text><text class="cell" x="746" y="434">جو چاکلیٹ</text><text class="cell" x="746" y="457.8">پگھلا دے</text></g><g id="node-planning"><rect class="panel" x="480" y="89.6" width="124" height="210" rx="8"/><text class="sh" x="594" y="120.4">2. منصوبہ</text><text class="cell" x="594" y="144.2">گروہ سامان،</text><text class="cell" x="594" y="168">کردار اور</text><text class="cell" x="594" y="191.8">نظام الاوقات</text><text class="cell" x="594" y="215.6">طے کرتے ہیں</text></g><g id="node-ex-planning"><rect class="plain" x="480" y="355.6" width="124" height="173.6" rx="8"/><text class="cell" x="594" y="386.4">گتے کا ڈبہ،</text><text class="cell" x="594" y="410.2">فوائل،</text><text class="cell" x="594" y="434">کالا کاغذ،</text><text class="cell" x="594" y="457.8">پلاسٹک شیٹ</text></g><g id="node-executing"><rect class="panel" x="328" y="89.6" width="124" height="210" rx="8"/><text class="sh" x="442" y="120.4">3. انجام</text><text class="sh" x="442" y="144.2">دہی</text><text class="cell" x="442" y="168">گروہ بناتے</text><text class="cell" x="442" y="191.8">اور آزماتے،</text><text class="cell" x="442" y="215.6">ریکارڈ رکھتے</text><text class="cell" x="442" y="239.4">ہیں</text></g><g id="node-ex-executing"><rect class="plain" x="328" y="355.6" width="124" height="173.6" rx="8"/><text class="cell" x="442" y="386.4">ہر 10 منٹ</text><text class="cell" x="442" y="410.2">بعد اندر کا</text><text class="cell" x="442" y="434">درجۂ حرارت</text><text class="cell" x="442" y="457.8">ناپیں</text></g><g id="node-presenting"><rect class="panel" x="176" y="89.6" width="124" height="210" rx="8"/><text class="sh" x="290" y="120.4">4.</text><text class="sh" x="290" y="144.2">پیشکش</text><text class="cell" x="290" y="168">گروہ اپنی</text><text class="cell" x="290" y="191.8">چیز دکھاتے</text><text class="cell" x="290" y="215.6">اور سائنس</text><text class="cell" x="290" y="239.4">سمجھاتے ہیں</text></g><g id="node-ex-presenting"><rect class="plain" x="176" y="355.6" width="124" height="173.6" rx="8"/><text class="cell" x="290" y="386.4">کالا کاغذ</text><text class="cell" x="290" y="410.2">اور فوائل</text><text class="cell" x="290" y="434">کیوں مفید ہیں</text></g><g id="node-judging"><rect class="panel-a" x="24" y="89.6" width="124" height="210" rx="8"/><text class="sh" x="138" y="120.4">5. پرکھ</text><text class="cell" x="138" y="144.2">شاگرد اور</text><text class="cell" x="138" y="168">استاد نتیجے</text><text class="cell" x="138" y="191.8">کو ہدف کے</text><text class="cell" x="138" y="215.6">مقابل پرکھتے</text><text class="cell" x="138" y="239.4">اور سبق</text><text class="cell" x="138" y="263.2">لیتے ہیں</text></g><g id="node-ex-judging"><rect class="plain" x="24" y="355.6" width="124" height="173.6" rx="8"/><text class="cell" x="138" y="386.4">اگلی بار</text><text class="cell" x="138" y="410.2">ہم کیا</text><text class="cell" x="138" y="434">بدلیں گے؟</text></g></g><g id="layer-labels"><g id="label-example"><text class="small" x="756" y="344.4">چھٹی جماعت کی مثال:</text></g><g id="label-improve"><text class="small" x="314" y="42" text-anchor="middle">بہتر کریں اور دوبارہ آزمائیں</text></g><g id="label-teacher"><text class="sh" x="390" y="589.4" text-anchor="middle">استاد ہر مرحلے پر رہنمائی کرتا ہے</text></g></g><text class="wm" x="12" y="645.2" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
