<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 467.6" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استقرا اور استخراج کا خاکہ</title><desc id="d">مقناطیس کے بارے میں مثالوں اور ایک عمومی اصول کے درمیان دو مخالف تیروں کا خاکہ: استقرائی تیر مثالوں کے مشاہدے سے اصول بیان کرنے تک جاتا ہے، اور استخراجی تیر اصول بیان کرنے سے نئی صورتوں پر اس کے اطلاق تک۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="467.6"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-examples-rule" class="stroke" d="M596,140 L184,140" marker-end="url(#arrow)"/><path id="edge-rule-examples" class="stroke" d="M184,294 L596,294" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-examples"><rect class="panel" x="606" y="56" width="150" height="322" rx="8"/><text class="sh" x="746" y="86.8">مثالیں اور</text><text class="sh" x="746" y="110.6">مشاہدات</text><text class="cell" x="746" y="134.4">پنیں، کیلیں،</text><text class="cell" x="746" y="158.2">سکہ، فوائل،</text><text class="cell" x="746" y="182">ربڑ</text></g><g id="node-rule"><rect class="panel-b" x="24" y="56" width="150" height="322" rx="8"/><text class="sh" x="164" y="86.8">عمومی اصول</text><text class="cell" x="164" y="110.6">”مقناطیس لوہے</text><text class="cell" x="164" y="134.4">سے بنی چیزوں کو</text><text class="cell" x="164" y="158.2">کھینچتا ہے“</text></g></g><g id="layer-labels"><g id="label-inductive"><text class="sh" x="390" y="120.4" text-anchor="middle">استقرائی: مثالوں سے اصول تک</text></g><g id="label-deductive"><text class="sh" x="390" y="274.4" text-anchor="middle">استخراجی: اصول سے مثالوں تک</text></g><g id="label-ind-1"><text class="small" x="527.33" y="170.8" text-anchor="middle">مثالیں دیکھیں</text></g><g id="label-ind-2"><text class="small" x="390" y="170.8" text-anchor="middle">نمونہ ڈھونڈیں</text></g><g id="label-ind-3"><text class="small" x="252.67" y="170.8" text-anchor="middle">اصول بیان کریں</text></g><g id="label-ded-1"><text class="small" x="252.67" y="324.8" text-anchor="middle">اصول بیان کریں</text></g><g id="label-ded-2"><text class="small" x="390" y="324.8" text-anchor="middle">اسے سمجھائیں</text></g><g id="label-ded-3"><text class="small" x="527.33" y="324.8" text-anchor="middle">نئی صورتوں پر</text><text class="small" x="527.33" y="348.6" text-anchor="middle">لاگو کریں</text></g><g id="label-caption"><text class="small" x="390" y="420" text-anchor="middle">سائنس دونوں سمتیں استعمال کرتی ہے: اصول مثالوں سے آتے ہیں، اور نئی مثالوں پر آزمائے جاتے ہیں</text></g></g><text class="wm" x="12" y="457.6" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
