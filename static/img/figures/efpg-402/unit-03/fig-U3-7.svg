<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 468" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of five stages of a school science project, purposing, planning, executing, presenting and judging, each with a Grade 6 solar-oven example, an arrow from judging back to planning for improvement, and a note that the teacher guides throughout</title><desc id="d">Flowchart of five stages of a school science project, purposing, planning, executing, presenting and judging, each with a Grade 6 solar-oven example, an arrow from judging back to planning for improvement, and a note that the teacher guides throughout.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="468"/><g id="layer-regions"><rect id="region-teacher" class="panel-b" x="24" y="398" width="732" height="36" rx="6"/></g><g id="layer-edges"><path id="edge-purposing-ex" class="dash" d="M86,214 L86,228"/><path id="edge-purposing-planning" class="stroke" d="M148,139 L176,139" marker-end="url(#arrow)"/><path id="edge-planning-ex" class="dash" d="M238,214 L238,228"/><path id="edge-planning-executing" class="stroke" d="M300,139 L328,139" marker-end="url(#arrow)"/><path id="edge-executing-ex" class="dash" d="M390,214 L390,228"/><path id="edge-executing-presenting" class="stroke" d="M452,139 L480,139" marker-end="url(#arrow)"/><path id="edge-presenting-ex" class="dash" d="M542,214 L542,228"/><path id="edge-presenting-judging" class="stroke" d="M604,139 L632,139" marker-end="url(#arrow)"/><path id="edge-judging-ex" class="dash" d="M694,214 L694,228"/><path id="edge-judging-planning" class="dash" d="M694,64 L694,40 L238,40 L238,64" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-purposing"><rect class="panel-a" x="24" y="64" width="124" height="150" rx="8"/><text class="sh" x="34" y="86">1.</text><text class="sh" x="34" y="103">Purposing</text><text class="cell" x="34" y="120">the class</text><text class="cell" x="34" y="137">chooses a</text><text class="cell" x="34" y="154">goal</text></g><g id="node-ex-purposing"><rect class="plain" x="24" y="254" width="124" height="124" rx="8"/><text class="cell" x="34" y="276">build a solar</text><text class="cell" x="34" y="293">oven that can</text><text class="cell" x="34" y="310">melt</text><text class="cell" x="34" y="327">chocolate</text></g><g id="node-planning"><rect class="panel" x="176" y="64" width="124" height="150" rx="8"/><text class="sh" x="186" y="86">2. Planning</text><text class="cell" x="186" y="103">groups decide</text><text class="cell" x="186" y="120">materials,</text><text class="cell" x="186" y="137">roles and a</text><text class="cell" x="186" y="154">timetable</text></g><g id="node-ex-planning"><rect class="plain" x="176" y="254" width="124" height="124" rx="8"/><text class="cell" x="186" y="276">cardboard</text><text class="cell" x="186" y="293">box, foil,</text><text class="cell" x="186" y="310">black paper,</text><text class="cell" x="186" y="327">plastic sheet</text></g><g id="node-executing"><rect class="panel" x="328" y="64" width="124" height="150" rx="8"/><text class="sh" x="338" y="86">3.</text><text class="sh" x="338" y="103">Executing</text><text class="cell" x="338" y="120">groups build</text><text class="cell" x="338" y="137">and test,</text><text class="cell" x="338" y="154">keeping a</text><text class="cell" x="338" y="171">record</text></g><g id="node-ex-executing"><rect class="plain" x="328" y="254" width="124" height="124" rx="8"/><text class="cell" x="338" y="276">measure the</text><text class="cell" x="338" y="293">temperature</text><text class="cell" x="338" y="310">inside every</text><text class="cell" x="338" y="327">10 minutes</text></g><g id="node-presenting"><rect class="panel" x="480" y="64" width="124" height="150" rx="8"/><text class="sh" x="490" y="86">4.</text><text class="sh" x="490" y="103">Presenting</text><text class="cell" x="490" y="120">groups show</text><text class="cell" x="490" y="137">the product</text><text class="cell" x="490" y="154">and explain</text><text class="cell" x="490" y="171">the science</text></g><g id="node-ex-presenting"><rect class="plain" x="480" y="254" width="124" height="124" rx="8"/><text class="cell" x="490" y="276">why black</text><text class="cell" x="490" y="293">paper and</text><text class="cell" x="490" y="310">foil help</text></g><g id="node-judging"><rect class="panel-a" x="632" y="64" width="124" height="150" rx="8"/><text class="sh" x="642" y="86">5. Judging</text><text class="cell" x="642" y="103">pupils and</text><text class="cell" x="642" y="120">teacher judge</text><text class="cell" x="642" y="137">the result</text><text class="cell" x="642" y="154">against the</text><text class="cell" x="642" y="171">goal and draw</text><text class="cell" x="642" y="188">lessons</text></g><g id="node-ex-judging"><rect class="plain" x="632" y="254" width="124" height="124" rx="8"/><text class="cell" x="642" y="276">what would we</text><text class="cell" x="642" y="293">change next</text><text class="cell" x="642" y="310">time?</text></g></g><g id="layer-labels"><g id="label-example"><text class="small" x="24" y="246">Grade 6 example:</text></g><g id="label-improve"><text class="small" x="466" y="30" text-anchor="middle">improve and try again</text></g><g id="label-teacher"><text class="sh" x="390" y="421" text-anchor="middle">teacher guides at every stage</text></g></g><text class="wm" x="768" y="458" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
