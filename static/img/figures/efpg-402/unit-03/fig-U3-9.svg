<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 334" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of two opposite arrows between examples and a general rule about magnets</title><desc id="d">Diagram of two opposite arrows between examples and a general rule about magnets: the inductive arrow goes from observing examples to stating the rule, and the deductive arrow goes from stating the rule to applying it to new cases.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="334"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-examples-rule" class="stroke" d="M184,100 L596,100" marker-end="url(#arrow)"/><path id="edge-rule-examples" class="stroke" d="M596,210 L184,210" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-examples"><rect class="panel" x="24" y="40" width="150" height="230" rx="8"/><text class="sh" x="34" y="62">Examples and</text><text class="sh" x="34" y="79">observations</text><text class="cell" x="34" y="96">pins, nails,</text><text class="cell" x="34" y="113">coin, foil,</text><text class="cell" x="34" y="130">eraser</text></g><g id="node-rule"><rect class="panel-b" x="606" y="40" width="150" height="230" rx="8"/><text class="sh" x="616" y="62">General rule</text><text class="cell" x="616" y="79">"magnets attract</text><text class="cell" x="616" y="96">objects made of</text><text class="cell" x="616" y="113">iron"</text></g></g><g id="layer-labels"><g id="label-inductive"><text class="sh" x="390" y="86" text-anchor="middle">INDUCTIVE: from examples to the rule</text></g><g id="label-deductive"><text class="sh" x="390" y="196" text-anchor="middle">DEDUCTIVE: from the rule to examples</text></g><g id="label-ind-1"><text class="small" x="252.667" y="122" text-anchor="middle">observe examples</text></g><g id="label-ind-2"><text class="small" x="390" y="122" text-anchor="middle">find the pattern</text></g><g id="label-ind-3"><text class="small" x="527.333" y="122" text-anchor="middle">state the rule</text></g><g id="label-ded-1"><text class="small" x="527.333" y="232" text-anchor="middle">state the rule</text></g><g id="label-ded-2"><text class="small" x="390" y="232" text-anchor="middle">explain it</text></g><g id="label-ded-3"><text class="small" x="252.667" y="232" text-anchor="middle">apply it to new</text><text class="small" x="252.667" y="249" text-anchor="middle">cases</text></g><g id="label-caption"><text class="small" x="390" y="300" text-anchor="middle">Science uses both directions: rules come from examples, and rules are tested on new examples</text></g></g><text class="wm" x="768" y="324" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
