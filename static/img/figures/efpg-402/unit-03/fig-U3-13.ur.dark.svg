<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 642.6" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">Kolb کے تجرباتی تعلم کا چکر</title><desc id="d">پانچویں جماعت کے دن اور رات والے سبق پر Kolb کے تجرباتی تعلم کے چار مرحلوں کا چکر نما فلو چارٹ: ٹارچ کی روشنی میں گیند گھمانا، جو دیکھا اسے بیان کرنا، یہ خیال بنانا کہ زمین گھومتی ہے، اور گیند پر پیش گوئیاں آزمانا، جبکہ استاد ہر مرحلے پر سوال کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="642.6"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-concrete-reflective" class="stroke" d="M230,82.6 C139,82.6 139,82.6 139,187.6" marker-end="url(#arrow)"/><path id="edge-reflective-abstract" class="stroke" d="M139,380.8 C139,497.7 139,497.7 230,497.7" marker-end="url(#arrow)"/><path id="edge-abstract-active" class="stroke" d="M550,497.7 C641,497.7 641,497.7 641,357" marker-end="url(#arrow)"/><path id="edge-active-concrete" class="dash" d="M641,187.6 C641,82.6 641,82.6 550,82.6" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-concrete"><rect class="panel-a" x="230" y="33.6" width="320" height="98" rx="8"/><text class="sh" x="540" y="64.4">1. ٹھوس تجربہ</text><text class="cell" x="540" y="88.2">اندھیرے کمرے میں ایک شاگرد ٹارچ</text><text class="cell" x="540" y="112">کے سامنے گیند آہستہ گھماتا ہے</text></g><g id="node-reflective"><rect class="panel" x="24" y="187.6" width="230" height="193.2" rx="8"/><text class="sh" x="244" y="218.4">2. تاملی</text><text class="sh" x="244" y="242.2">مشاہدہ</text><text class="cell" x="244" y="266">شاگرد بتاتے ہیں کہ</text><text class="cell" x="244" y="289.8">کیا دیکھا: آدھی گیند</text><text class="cell" x="244" y="313.6">ہمیشہ روشن ہے؛</text><text class="cell" x="244" y="337.4">اسٹیکر روشنی سے</text><text class="cell" x="244" y="361.2">اندھیرے میں جاتا ہے</text></g><g id="node-active"><rect class="panel" x="526" y="187.6" width="230" height="169.4" rx="8"/><text class="sh" x="746" y="218.4">4. فعال</text><text class="sh" x="746" y="242.2">تجربہ آزمائی</text><text class="cell" x="746" y="266">شاگرد پیش گوئی کر</text><text class="cell" x="746" y="289.8">کے آزمائیں: پاکستان</text><text class="cell" x="746" y="313.6">میں دن ہے تو رات</text><text class="cell" x="746" y="337.4">کہاں؟ گیند پر نشان</text></g><g id="node-abstract"><rect class="panel" x="230" y="436.8" width="320" height="121.8" rx="8"/><text class="sh" x="540" y="467.6">3. مجرد تصور سازی</text><text class="cell" x="540" y="491.4">جماعت خیال بناتی ہے کہ زمین گھومتی</text><text class="cell" x="540" y="515.2">ہے، پس ہر جگہ سورج کی روشنی میں</text><text class="cell" x="540" y="539">آتی اور نکلتی ہے</text></g></g><g id="layer-labels"><g id="label-new"><text class="small" x="756" y="71.4">نیا تجربہ</text></g><g id="label-centre"><text class="sh" x="390" y="278.6" text-anchor="middle">استاد ہر مرحلے</text><text class="sh" x="390" y="302.4" text-anchor="middle">پر سوال کرتا ہے</text></g><g id="label-caption"><text class="small" x="756" y="595">Kolb کے تجرباتی تعلم کے چکر کے چار مرحلوں پر مبنی، جیسا Morris (2020) نے بیان کیا</text></g></g><text class="wm" x="12" y="632.6" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
