<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600.6" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">شمسی ٹیوب ویل کے مطالعاتی دورے کا منصوبہ</title><desc id="d">جدول جو شمسی توانائی سے چلنے والے ٹیوب ویل پر چھٹی جماعت کے دورے کا منصوبہ بیان کرتا ہے: مقصد، اجازتیں، حفاظت، دورے سے پہلے کی تیاری، دورے کے دوران گروہی کام اور جماعت میں بعد کی سرگرمی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="600.6"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="74.2" rx="6"/><rect id="region-row-1" class="panel" x="24" y="107.8" width="732" height="74.2"/><rect id="region-row-2" class="plain" x="24" y="182" width="732" height="74.2"/><rect id="region-row-3" class="panel" x="24" y="256.2" width="732" height="74.2"/><rect id="region-row-4" class="plain" x="24" y="330.4" width="732" height="74.2"/><rect id="region-row-5" class="panel" x="24" y="404.6" width="732" height="74.2"/><rect id="region-row-6" class="plain" x="24" y="478.8" width="732" height="74.2"/></g><g id="layer-edges"><line class="grid" x1="576" y1="33.6" x2="576" y2="553"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="748" y="64.4">منصوبے کا حصہ</text></g><g id="node-head-2"><text class="sh" x="568" y="64.4">مثال: اسکول کے قریب شمسی توانائی والے ٹیوب ویل پر</text><text class="sh" x="568" y="88.2">چھٹی جماعت کا دورہ</text></g><g id="node-row-1"><text class="sh" x="748" y="138.6">مقصد</text><text class="cell" x="568" y="138.6">دیکھنا کہ شمسی توانائی پانی پمپ کرنے کے لیے بجلی میں کیسے بدلتی ہے؛</text><text class="cell" x="568" y="162.4">توانائی کے باب سے ربط</text></g><g id="node-row-2"><text class="sh" x="748" y="212.8">اجازتیں</text><text class="cell" x="568" y="212.8">ہیڈ ٹیچر کی منظوری؛ والدین کی تحریری رضامندی؛</text><text class="cell" x="568" y="236.6">کسان کی اجازت</text></g><g id="node-row-3"><text class="sh" x="748" y="287">حفاظت</text><text class="cell" x="568" y="287">ہر دس شاگردوں پر ایک بڑا؛ کھلے کنویں اور تاروں سے دور رہیں؛</text><text class="cell" x="568" y="310.8">پینے کا پانی اور ٹوپیاں</text></g><g id="node-row-4"><text class="sh" x="748" y="361.2">دورے سے پہلے</text><text class="cell" x="568" y="361.2">استاد پہلے دورہ کرے؛ شاگرد مقصد، اصول اور تین سوال جانیں؛</text><text class="cell" x="568" y="385">گروہ بنائے جائیں</text></g><g id="node-row-5"><text class="sh" x="748" y="435.4">دورے کے</text><text class="sh" x="748" y="459.2">دوران کام</text><text class="cell" x="568" y="435.4">ہر گروہ کی ایک مشترک شیٹ: پینل اور پمپ کا خاکہ، تین سوالوں کے</text><text class="cell" x="568" y="459.2">جوابات، کسان سے ایک سوال</text></g><g id="node-row-6"><text class="sh" x="748" y="509.6">جماعت میں آگے</text><text class="cell" x="568" y="509.6">گروہ نتائج پیش کریں؛ شمسی تندور سے ربط؛ دو سطریں لکھیں کہ</text><text class="cell" x="568" y="533.4">ابر آلود دن کیا ہوتا ہے</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="590.6" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
