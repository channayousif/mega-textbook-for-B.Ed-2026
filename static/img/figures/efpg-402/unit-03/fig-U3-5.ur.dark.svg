<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 585.2" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مسئلہ حل کرنے کے طریقے کا فلو چارٹ</title><desc id="d">ساتویں جماعت کے ایک مسئلے پر مسئلہ حل کرنے کے طریقے کا فلو چارٹ: گرم پینے کے پانی کی مشکل محسوس کرنا، مسئلے کی تعریف، تین حل تجویز کرنا، استدلال اور منصفانہ جانچ کی منصوبہ بندی، درجۂ حرارت ناپ کر آزمانا، کوئی حل کام نہ کرے تو نئے حلوں کی طرف لوٹنا، ورنہ نتیجہ نکال کر عمل کرنا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="585.2"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-difficulty-define" class="stroke" d="M591,142.8 L567,142.8" marker-end="url(#arrow)"/><path id="edge-define-suggest" class="stroke" d="M402,142.8 L378,142.8" marker-end="url(#arrow)"/><path id="edge-suggest-plan" class="stroke" d="M213,142.8 L189,142.8" marker-end="url(#arrow)"/><path id="edge-plan-test" class="stroke" d="M106.5,252 L106.5,372.4" marker-end="url(#arrow)"/><path id="edge-test-check" class="stroke" d="M160,450.8 L205.5,450.8" marker-end="url(#arrow)"/><path id="edge-check-suggest" class="dash" d="M295.5,345.8 L295.5,252" marker-end="url(#arrow)"/><path id="edge-check-act" class="stroke" d="M385.5,450.8 L591,450.8" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-difficulty"><rect class="panel" x="591" y="33.6" width="165" height="218.4" rx="30"/><text class="sh" x="746" y="64.4">1. محسوس</text><text class="sh" x="746" y="88.2">مشکل</text><text class="cell" x="746" y="112">بوتل کا پانی</text><text class="cell" x="746" y="135.8">دوسرے پیریڈ تک</text><text class="cell" x="746" y="159.6">گرم ہو جاتا ہے</text></g><g id="node-define"><rect class="panel" x="402" y="33.6" width="165" height="218.4" rx="8"/><text class="sh" x="557" y="64.4">2. مسئلے کی</text><text class="sh" x="557" y="88.2">تعریف</text><text class="cell" x="557" y="112">بوتل کس طرح</text><text class="cell" x="557" y="135.8">رکھیں کہ پانی</text><text class="cell" x="557" y="159.6">دوپہر 12 بجے</text><text class="cell" x="557" y="183.4">تک سب سے</text><text class="cell" x="557" y="207.2">ٹھنڈا رہے؟</text></g><g id="node-suggest"><rect class="panel" x="213" y="33.6" width="165" height="218.4" rx="8"/><text class="sh" x="368" y="64.4">3. ممکنہ</text><text class="sh" x="368" y="88.2">حل تجویز</text><text class="sh" x="368" y="112">کریں</text><text class="cell" x="368" y="135.8">بوتل پر گیلا</text><text class="cell" x="368" y="159.6">کپڑا لپیٹیں؛</text><text class="cell" x="368" y="183.4">مٹی کے گھڑے</text><text class="cell" x="368" y="207.2">میں رکھیں؛</text><text class="cell" x="368" y="231">سائے میں رکھیں</text></g><g id="node-plan"><rect class="panel" x="24" y="33.6" width="165" height="218.4" rx="8"/><text class="sh" x="179" y="64.4">4. استدلال اور</text><text class="sh" x="179" y="88.2">منصوبہ</text><text class="cell" x="179" y="112">کون سا کام</text><text class="cell" x="179" y="135.8">کرے گا، کیوں؟</text><text class="cell" x="179" y="159.6">ایک جیسی بوتلوں</text><text class="cell" x="179" y="183.4">اور ایک جیسے</text><text class="cell" x="179" y="207.2">پانی سے منصفانہ</text><text class="cell" x="179" y="231">جانچ ترتیب دیں</text></g><g id="node-test"><rect class="panel" x="24" y="372.4" width="136" height="169.4" rx="8"/><text class="sh" x="150" y="403.2">5. آزمائش</text><text class="cell" x="150" y="427">صبح 8 بجے اور</text><text class="cell" x="150" y="450.8">دوپہر 12 بجے</text><text class="cell" x="150" y="474.6">پانی کا</text><text class="cell" x="150" y="498.4">درجۂ حرارت</text><text class="cell" x="150" y="522.2">ناپیں</text></g><g id="node-check"><polygon class="panel-b" points="295.5,345.8 205.5,450.8 295.5,555.8 385.5,450.8"/><text class="cell" x="295.5" y="434" text-anchor="middle">کیا کسی حل نے</text><text class="cell" x="295.5" y="457.8" text-anchor="middle">پانی واضح طور پر</text><text class="cell" x="295.5" y="481.6" text-anchor="middle">ٹھنڈا رکھا؟</text></g><g id="node-act"><rect class="panel-a" x="591" y="372.4" width="165" height="169.4" rx="30"/><text class="sh" x="746" y="403.2">6. نتیجہ اور</text><text class="sh" x="746" y="427">عمل</text><text class="cell" x="746" y="450.8">بوتلوں پر گیلا</text><text class="cell" x="746" y="474.6">کپڑا لپیٹیں؛</text><text class="cell" x="746" y="498.4">نتیجہ اسکول</text><text class="cell" x="746" y="522.2">کو بتائیں</text></g></g><g id="layer-labels"><g id="label-no"><text class="sh" x="285.5" y="285.6">نہیں</text></g><g id="label-yes"><text class="sh" x="419.5" y="439.6">ہاں</text></g></g><text class="wm" x="12" y="575.2" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
