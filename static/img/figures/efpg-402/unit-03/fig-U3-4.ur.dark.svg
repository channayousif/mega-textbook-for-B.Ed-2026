<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 529.2" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تجربہ گاہی اور مظاہرے کے طریقوں کا موازنہ</title><desc id="d">جدول جو تجربہ گاہی طریقے اور مظاہرے کے طریقے کا موازنہ کرتا ہے کہ سامان کون ہاتھ میں لیتا ہے، کتنا سامان اور وقت چاہیے، بہترین استعمال، بنیادی خطرہ اور جماعت 6 تا 8 کی مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="529.2"/><g id="layer-regions"><rect id="region-header" class="panel-b" x="24" y="33.6" width="732" height="50.4" rx="6"/><rect id="region-row-1" class="panel" x="24" y="84" width="732" height="74.2"/><rect id="region-row-2" class="plain" x="24" y="158.2" width="732" height="50.4"/><rect id="region-row-3" class="panel" x="24" y="208.6" width="732" height="50.4"/><rect id="region-row-4" class="plain" x="24" y="259" width="732" height="98"/><rect id="region-row-5" class="panel" x="24" y="357" width="732" height="50.4"/><rect id="region-row-6" class="plain" x="24" y="407.4" width="732" height="74.2"/></g><g id="layer-edges"><line class="grid" x1="586" y1="33.6" x2="586" y2="481.6"/><line class="grid" x1="305" y1="33.6" x2="305" y2="481.6"/></g><g id="layer-nodes"><g id="node-head-1"><text class="sh" x="748" y="64.4">خصوصیت</text></g><g id="node-head-2"><text class="sh" x="578" y="64.4">تجربہ گاہی طریقہ</text></g><g id="node-head-3"><text class="sh" x="297" y="64.4">مظاہرے کا طریقہ</text></g><g id="node-row-1"><text class="sh" x="748" y="114.8">سامان کون</text><text class="sh" x="748" y="138.6">استعمال کرتا ہے</text><text class="cell" x="578" y="114.8">شاگرد، گروہوں میں</text><text class="cell" x="297" y="114.8">استاد یا ایک مددگار شاگرد</text></g><g id="node-row-2"><text class="sh" x="748" y="189">درکار سامان</text><text class="cell" x="578" y="189">ہر گروہ کے لیے ایک سیٹ</text><text class="cell" x="297" y="189">جماعت کے لیے ایک سیٹ</text></g><g id="node-row-3"><text class="sh" x="748" y="239.4">وقت</text><text class="cell" x="578" y="239.4">زیادہ</text><text class="cell" x="297" y="239.4">کم</text></g><g id="node-row-4"><text class="sh" x="748" y="289.8">کس کے لیے بہترین</text><text class="cell" x="578" y="289.8">عملی مہارتیں، شاگردوں کے</text><text class="cell" x="578" y="313.6">اپنے کام سے شواہد</text><text class="cell" x="297" y="289.8">خطرناک، نازک یا مہنگے</text><text class="cell" x="297" y="313.6">آلات، سبق شروع کرنے کو</text><text class="cell" x="297" y="337.4">ایک حیران کن واقعہ</text></g><g id="node-row-5"><text class="sh" x="748" y="387.8">بنیادی خطرہ</text><text class="cell" x="578" y="387.8">بغیر سوچے ترکیب پر عمل</text><text class="cell" x="297" y="387.8">شاگرد صرف دیکھتے ہیں</text></g><g id="node-row-6"><text class="sh" x="748" y="438.2">جماعت 6-8 کی مثال</text><text class="cell" x="578" y="438.2">ہلدی والے پانی سے</text><text class="cell" x="578" y="462">گھریلو مائعات کی جانچ</text><text class="cell" x="297" y="438.2">الٹے گلاس میں کارڈ</text><text class="cell" x="297" y="462">کے سہارے پانی</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="519.2" direction="ltr" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
