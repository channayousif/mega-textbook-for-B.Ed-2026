<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of community science resources</title><desc id="d">Concept map showing five community resources for science teaching: local farm, health clinic, repair workshop, canal, and pottery kiln, with science concepts learned at each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="390" y1="210" x2="390" y2="124" marker-end="url(#arrow)"/>
<line class="stroke" x1="310" y1="225" x2="230" y2="175" marker-end="url(#arrow)"/>
<line class="stroke" x1="470" y1="225" x2="550" y2="175" marker-end="url(#arrow)"/>
<line class="stroke" x1="330" y1="280" x2="230" y2="350" marker-end="url(#arrow)"/>
<line class="stroke" x1="450" y1="280" x2="550" y2="350" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-farm"><rect class="panel-a" x="270" y="30" width="240" height="90" rx="8"/><text class="h" x="285" y="58">Agricultural Farm</text><text class="cell" x="285" y="80">Soil texture, crop rotation,</text><text class="cell" x="285" y="98">seed germination, canal irrigation</text></g>
<g id="node-clinic"><rect class="panel-a" x="24" y="130" width="220" height="90" rx="8"/><text class="h" x="38" y="158">Basic Health Clinic</text><text class="cell" x="38" y="180">Immunisation cold chain,</text><text class="cell" x="38" y="198">pathogen hygiene, vital signs</text></g>
<g id="node-workshop"><rect class="panel-a" x="536" y="130" width="220" height="90" rx="8"/><text class="h" x="550" y="158">Auto Repair Shop</text><text class="cell" x="550" y="180">Levers, gears, pulleys,</text><text class="cell" x="550" y="198">hydraulic jacks and friction</text></g>
<g id="node-canal"><rect class="panel-a" x="24" y="320" width="220" height="90" rx="8"/><text class="h" x="38" y="348">Canal / Riverbank</text><text class="cell" x="38" y="370">Aquatic food chains,</text><text class="cell" x="38" y="388">water flow and sedimentation</text></g>
<g id="node-kiln"><rect class="panel-a" x="536" y="320" width="220" height="90" rx="8"/><text class="h" x="550" y="348">Pottery / Brick Kiln</text><text class="cell" x="550" y="370">Thermal changes and firing,</text><text class="cell" x="550" y="388">properties of heated clay</text></g>
<g id="node-center"><ellipse class="panel-b" cx="390" cy="250" rx="100" ry="40"/><text class="h" x="390" y="246" text-anchor="middle">Community Science</text><text class="sh" x="390" y="266" text-anchor="middle">Resources</text></g>
</g><g id="layer-labels">
<text class="small" x="30" y="450">Local community places that contextualise school science concepts for pupils in Sindh.</text>
</g><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
