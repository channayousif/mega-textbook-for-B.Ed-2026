</g><g id="layer-nodes">
<text class="sh" x="36" y="49">Apparatus</text>
<text class="sh" x="198" y="49">Scientific Use</text>
<text class="sh" x="442" y="49">Handling and Safety Rule</text>

<text class="sh" x="36" y="96">Test tube</text>
<text class="cell" x="198" y="88">Heating and mixing small</text>
<text class="cell" x="198" y="105">quantities of liquid or solid</text>
<text class="cell" x="442" y="88">Hold with clamp; point mouth away</text>
<text class="cell" x="442" y="105">from yourself and other pupils</text>

<text class="sh" x="36" y="150">Beaker</text>
<text class="cell" x="198" y="142">Holding, stirring, and heating</text>
<text class="cell" x="198" y="159">liquids in general experiments</text>
<text class="cell" x="442" y="142">Use wire gauze on tripod; do not</text>
<text class="cell" x="442" y="159">cool hot glass abruptly with cold water</text>

<text class="sh" x="36" y="204">Graduated cylinder</text>
<text class="cell" x="198" y="196">Measuring precise volumes of</text>
<text class="cell" x="198" y="213">liquids (cm³ or mL)</text>
<text class="cell" x="442" y="196">Place on bench; read water meniscus</text>
<text class="cell" x="442" y="213">at eye level; never heat liquids in it</text>

<text class="sh" x="36" y="258">Spirit burner</text>
<text class="cell" x="198" y="250">Providing moderate heat for</text>
<text class="cell" x="198" y="267">elementary science tests</text>
<text class="cell" x="442" y="250">Never blow out flame; cover with</text>
<text class="cell" x="442" y="267">cap; keep fuel level above half full</text>

<text class="sh" x="36" y="312">Spring balance</text>
<text class="cell" x="198" y="304">Measuring gravitational force</text>
<text class="cell" x="198" y="321">and weight in Newtons</text>
<text class="cell" x="442" y="304">Check zero mark before loading;</text>
<text class="cell" x="442" y="321">avoid exceeding maximum rated load</text>
</g><g id="layer-labels">
<text class="small" x="24" y="365">Essential apparatus for Grades 4-8 science, with standard laboratory handling protocols.</text>
</g><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
