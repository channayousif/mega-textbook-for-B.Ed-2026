<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">کم خرچ تدریسی معاونات کی تیاری کے پانچ مراحل کا فلو چارٹ</title><desc id="d">کم خرچ سائنسی تدریسی معاونات بنانے اور استعمال کرنے کے پانچ مراحل کا فلو چارٹ: ہدف کا تعین، مواد کی فراہمی، ماڈل کی تعمیر، آزمائش اور تدریس مع تامل۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-edges">
<line class="stroke" x1="530" y1="85" x2="500" y2="85" marker-end="url(#arrow)"/>
<line class="stroke" x1="280" y1="85" x2="250" y2="85" marker-end="url(#arrow)"/>
<path class="stroke" d="M140 130 L140 195 L140 260 L280 260" marker-end="url(#arrow)"/>
<line class="stroke" x1="500" y1="260" x2="530" y2="260" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="step1"><rect class="panel-a" x="530" y="40" width="220" height="90" rx="8"/><text class="h" x="735" y="68">1. ہدف کا تعین</text><text class="cell" x="735" y="92">تدریس کے لیے مخصوص نتیجہ ہائے</text><text class="cell" x="735" y="110">تعلم اور ٹھوس تصور کی شناخت</text></g>
<g id="step2"><rect class="panel-a" x="280" y="40" width="220" height="90" rx="8"/><text class="h" x="485" y="68">2. مواد کی فراہمی</text><text class="cell" x="485" y="92">محفوظ، ناکارہ یا مفت گھریلو</text><text class="cell" x="485" y="110">اور مقامی اشیاء جمع کرنا</text></g>
<g id="step3"><rect class="panel-a" x="30" y="40" width="220" height="90" rx="8"/><text class="h" x="235" y="68">3. ماڈل کی تعمیر</text><text class="cell" x="235" y="92">مکینیکل حفاظت اور پائیداری کو</text><text class="cell" x="235" y="110">یقینی بناتے ہوئے ماڈل بنانا</text></g>
<g id="step4"><rect class="panel-b" x="280" y="215" width="220" height="90" rx="8"/><text class="h" x="485" y="243">4. آزمائش اور جانچ</text><text class="cell" x="485" y="267">عملی مظاہرہ؛ آخری بینچ</text><text class="cell" x="485" y="285">سے نظر آنے کی جانچ کرنا</text></g>
<g id="step5"><rect class="panel-b" x="530" y="215" width="220" height="90" rx="8"/><text class="h" x="735" y="243">5. تدریس اور تامل</text><text class="cell" x="735" y="267">طلبہ کو ماڈل چلانے میں شامل کریں؛</text><text class="cell" x="735" y="285">سیکھنے کا جائزہ لیں اور بہتری لائیں</text></g>
</g><g id="layer-labels">
<text class="small" x="750" y="380">مؤثر اور کم خرچ تدریسی وسائل تیار کرنے کا منظم پانچ مرحلہ جاتی تدریسی دائرہ۔</text>
</g><text class="wm" x="12" y="420" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
