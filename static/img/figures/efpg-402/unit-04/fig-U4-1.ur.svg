<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">سائنس میں تدریسی معاونات کی اہمیت کا تصوراتی نقشہ</title><desc id="d">تصوراتی نقشہ جس میں تدریسی معاونات کی چار بنیادی وجوہات دکھائی گئی ہیں: توجہ کا حصول، فہم کی تعمیر، معلومات کی برقراری اور کثیر حسی شمولیتی تدریس۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="480" y1="210" x2="560" y2="124" marker-end="url(#arrow)"/>
<line class="stroke" x1="300" y1="210" x2="220" y2="124" marker-end="url(#arrow)"/>
<line class="stroke" x1="480" y1="270" x2="560" y2="356" marker-end="url(#arrow)"/>
<line class="stroke" x1="300" y1="270" x2="220" y2="356" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-attention"><rect class="panel-a" x="500" y="40" width="250" height="90" rx="8"/><text class="h" x="734" y="68">توجہ اور ارتکاز</text><text class="cell" x="734" y="92">تجسس بیدار کرنا، کلاس کی</text><text class="cell" x="734" y="110">بے توجہی اور شور کا خاتمہ</text></g>
<g id="node-understanding"><rect class="panel-a" x="30" y="40" width="250" height="90" rx="8"/><text class="h" x="264" y="68">تصوراتی وضاحت</text><text class="cell" x="264" y="92">تجریدی اصطلاحات اور حقیقی</text><text class="cell" x="264" y="110">مظاہر کے درمیان رابطہ بنانا</text></g>
<g id="node-retention"><rect class="panel-a" x="500" y="340" width="250" height="90" rx="8"/><text class="h" x="734" y="368">دیرپا برقراری</text><text class="cell" x="734" y="392">بصری اور لمسی یادداشت زبانی</text><text class="cell" x="734" y="410">وضاحت کو مضبوط کرتی ہے</text></g>
<g id="node-inclusion"><rect class="panel-a" x="30" y="340" width="250" height="90" rx="8"/><text class="h" x="264" y="368">شمولیت اور برابری</text><text class="cell" x="264" y="392">دوسری زبان کے طلبہ اور متنوع</text><text class="cell" x="264" y="410">حسی ترجیحات کی معاونت</text></g>
<g id="node-center"><ellipse class="panel-b" cx="390" cy="240" rx="110" ry="42"/><text class="h" x="390" y="236" text-anchor="middle">سائنس میں</text><text class="sh" x="390" y="258" text-anchor="middle">تدریسی معاونات</text></g>
</g><g id="layer-labels">
<text class="small" x="750" y="460">سائنس کے اسباق میں تدریسی معاونات کے استعمال کی چار بنیادی تدریسی وجوہات۔</text>
</g><text class="wm" x="12" y="470" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
