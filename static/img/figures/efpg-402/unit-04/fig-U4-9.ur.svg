<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">کمیونٹی کے سائنسی وسائل کا تصوراتی نقشہ</title><desc id="d">سائنسی تدریس کے لیے پانچ کمیونٹی وسائل کا تصوراتی نقشہ: مقامی فارم، ہیلتھ کلینک، ورکشاپ، نہر اور اینٹوں کا بھٹہ، اور ان سے سیکھے جانے والے تصورات۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="390" y1="210" x2="390" y2="124" marker-end="url(#arrow)"/>
<line class="stroke" x1="470" y1="225" x2="550" y2="175" marker-end="url(#arrow)"/>
<line class="stroke" x1="310" y1="225" x2="230" y2="175" marker-end="url(#arrow)"/>
<line class="stroke" x1="450" y1="280" x2="550" y2="350" marker-end="url(#arrow)"/>
<line class="stroke" x1="330" y1="280" x2="230" y2="350" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-farm"><rect class="panel-a" x="270" y="30" width="240" height="90" rx="8"/><text class="h" x="495" y="58">زرعی فارم</text><text class="cell" x="495" y="80">مٹی کی بناوٹ، فصلوں کا ہیر پھیر،</text><text class="cell" x="495" y="98">بیج کا اگنا، نہری آبپاشی</text></g>
<g id="node-clinic"><rect class="panel-a" x="536" y="130" width="220" height="90" rx="8"/><text class="h" x="742" y="158">بنیادی ہیلتھ یونٹ</text><text class="cell" x="742" y="180">حفاظتی ٹیکوں کی کولڈ چین،</text><text class="cell" x="742" y="198">جراثیم سے صفائی، نبض کی رفتار</text></g>
<g id="node-workshop"><rect class="panel-a" x="24" y="130" width="220" height="90" rx="8"/><text class="h" x="230" y="158">آٹو مرمت کی ورکشاپ</text><text class="cell" x="230" y="180">لیور، گیئرز، گھرنیاں،</text><text class="cell" x="230" y="198">ہائیڈرولک جیک اور رگڑ</text></g>
<g id="node-canal"><rect class="panel-a" x="536" y="320" width="220" height="90" rx="8"/><text class="h" x="742" y="348">نہر یا دریا کا کنارہ</text><text class="cell" x="742" y="370">آبی غذائی زنجیریں،</text><text class="cell" x="742" y="388">پانی کا بہاؤ اور گاد کا بیٹھنا</text></g>
<g id="node-kiln"><rect class="panel-a" x="24" y="320" width="220" height="90" rx="8"/><text class="h" x="230" y="348">مٹی کے برتن یا بھٹہ</text><text class="cell" x="230" y="370">حرارتی تبدیلیاں اور پکائی،</text><text class="cell" x="230" y="388">گرم چکنی مٹی کی خصوصیات</text></g>
<g id="node-center"><ellipse class="panel-b" cx="390" cy="250" rx="100" ry="40"/><text class="h" x="390" y="246" text-anchor="middle">کمیونٹی کے</text><text class="sh" x="390" y="266" text-anchor="middle">سائنسی وسائل</text></g>
</g><g id="layer-labels">
<text class="small" x="750" y="450">مقامی کمیونٹی کے وہ مقامات جو سندھ کے طلبہ کے لیے اسکول سائنس کے تصورات کو سیاق فراہم کرتے ہیں۔</text>
</g><text class="wm" x="12" y="465" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
