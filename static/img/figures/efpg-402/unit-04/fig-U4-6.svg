<text class="sh" x="36" y="49">Teaching Aid</text>
<text class="sh" x="182" y="49">Everyday Materials</text>
<text class="sh" x="442" y="49">Science Concept (Grades 4-8)</text>

<text class="sh" x="36" y="99">Lung model</text>
<text class="cell" x="182" y="91">Plastic bottle, balloons,</text>
<text class="cell" x="182" y="108">straw, rubber sheet, tape</text>
<text class="cell" x="442" y="91">Diaphragm movement and air pressure</text>
<text class="cell" x="442" y="108">changes during breathing</text>

<text class="sh" x="36" y="159">Circuit tester</text>
<text class="cell" x="182" y="151">Dry cell, torch bulb, wire,</text>
<text class="cell" x="182" y="168">paper clips, card strip</text>
<text class="cell" x="442" y="151">Closed electric circuits and</text>
<text class="cell" x="442" y="168">electrical conductivity of materials</text>

<text class="sh" x="36" y="219">Pinhole camera</text>
<text class="cell" x="182" y="211">Cardboard shoe box,</text>
<text class="cell" x="182" y="228">tracing paper, foil, pin</text>
<text class="cell" x="442" y="211">Rectilinear propagation of light and</text>
<text class="cell" x="442" y="228">formation of inverted real images</text>

<text class="sh" x="36" y="279">Water filter</text>
<text class="cell" x="182" y="271">Plastic bottle, cotton cloth,</text>
<text class="cell" x="182" y="288">fine sand, gravel, charcoal</text>
<text class="cell" x="442" y="271">Mechanical filtration and surface</text>
<text class="cell" x="442" y="288">adsorption in water purification</text>

<text class="sh" x="36" y="339">Density column</text>
<text class="cell" x="182" y="331">Glass jar, cooking oil,</text>
<text class="cell" x="182" y="348">coloured water, honey, stone</text>
<text class="cell" x="442" y="331">Density differences between liquids</text>
<text class="cell" x="442" y="348">and buoyancy of solid objects</text>
</g><g id="layer-labels">
