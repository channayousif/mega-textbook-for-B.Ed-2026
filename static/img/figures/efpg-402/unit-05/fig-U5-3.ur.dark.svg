<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 476" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">BSCS 5E تدریسی ماڈل کا فلو چارٹ</title><desc id="d">فلو چارٹ جو 5E تدریسی ماڈل کے پانچ چکری مراحل دکھاتا ہے: دلچسپی ابھارنا، کھوج، وضاحت، توسیع اور جانچ، اور ہر مرحلے پر شاگردوں کے اعمال اور استاد کی سہولت کاری کو نمایاں کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="476"/><g id="layer-edges">
<line class="stroke" x1="534" y1="98" x2="500" y2="98" marker-end="url(#arrow)"/>
<line class="stroke" x1="284" y1="98" x2="250" y2="98" marker-end="url(#arrow)"/>
<path class="stroke" d="M 140,154 L 140,203 L 534,203 L 534,238" marker-end="url(#arrow)"/>
<line class="stroke" x1="390" y1="294" x2="350" y2="294" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="step-engage"><rect class="panel-a" x="534" y="42" width="216" height="112" rx="8"/><text class="h" x="736" y="81.2">1. دلچسپی ابھارنا</text><text class="cell" x="736" y="112">تجسس جگائیں؛ سابقہ خیالات</text><text class="cell" x="736" y="135.8">اور تصورات تک پہنچیں</text></g>
<g id="step-explore"><rect class="panel-a" x="284" y="42" width="216" height="112" rx="8"/><text class="h" x="486" y="81.2">2. کھوج</text><text class="cell" x="486" y="112">عملی تحقیق؛</text><text class="cell" x="486" y="135.8">مشاہدہ اور شواہد جمع کرنا</text></g>
<g id="step-explain"><rect class="panel-b" x="34" y="42" width="216" height="112" rx="8"/><text class="h" x="236" y="81.2">3. وضاحت</text><text class="cell" x="236" y="112">شاگرد دعوے بیان کریں؛ استاد</text><text class="cell" x="236" y="135.8">اصطلاحات اور تصورات لائے</text></g>
<g id="step-elaborate"><rect class="panel-a" x="390" y="238" width="216" height="112" rx="8"/><text class="h" x="592" y="277.2">4. توسیع</text><text class="cell" x="592" y="308">تصور کو نئی، غیر مانوس</text><text class="cell" x="592" y="331.8">صورتحال پر لاگو کریں</text></g>
<g id="step-evaluate"><rect class="panel-a" x="134" y="238" width="216" height="112" rx="8"/><text class="h" x="336" y="277.2">5. جانچ</text><text class="cell" x="336" y="308">سمجھ اور تحقیقی</text><text class="cell" x="336" y="331.8">مہارتوں کی جانچ</text></g>
</g><g id="layer-labels">
<text class="small" x="756" y="420">5E ماڈل ٹھوس حسی کھوج سے رسمی سائنسی وضاحت تک تعلم کو ترتیب دیتا ہے۔</text>
</g><text class="wm" x="12" y="464" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
