<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the BSCS 5E instructional model</title><desc id="d">Flowchart showing the five cyclic phases of the 5E instructional model: Engage, Explore, Explain, Elaborate, and Evaluate, highlighting student actions and teacher facilitation at each step.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="340"/><g id="layer-edges">
<line class="stroke" x1="246" y1="70" x2="280" y2="70" marker-end="url(#arrow)"/>
<line class="stroke" x1="496" y1="70" x2="530" y2="70" marker-end="url(#arrow)"/>
<path class="stroke" d="M 640,110 L 640,145 L 246,145 L 246,170" marker-end="url(#arrow)"/>
<line class="stroke" x1="390" y1="210" x2="430" y2="210" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="step-engage"><rect class="panel-a" x="30" y="30" width="216" height="80" rx="8"/><text class="h" x="44" y="58">1. Engage</text><text class="cell" x="44" y="80">Spark curiosity; access</text><text class="cell" x="44" y="97">prior ideas and preconceptions</text></g>
<g id="step-explore"><rect class="panel-a" x="280" y="30" width="216" height="80" rx="8"/><text class="h" x="294" y="58">2. Explore</text><text class="cell" x="294" y="80">Hands-on investigation;</text><text class="cell" x="294" y="97">observe and gather evidence</text></g>
<g id="step-explain"><rect class="panel-b" x="530" y="30" width="216" height="80" rx="8"/><text class="h" x="544" y="58">3. Explain</text><text class="cell" x="544" y="80">Pupils state claims; teacher</text><text class="cell" x="544" y="97">introduces terms and concepts</text></g>
<g id="step-elaborate"><rect class="panel-a" x="174" y="170" width="216" height="80" rx="8"/><text class="h" x="188" y="198">4. Elaborate</text><text class="cell" x="188" y="220">Apply concept to new</text><text class="cell" x="188" y="237">unfamiliar situations</text></g>
<g id="step-evaluate"><rect class="panel-a" x="430" y="170" width="216" height="80" rx="8"/><text class="h" x="444" y="198">5. Evaluate</text><text class="cell" x="444" y="220">Assess understanding</text><text class="cell" x="444" y="237">and inquiry skills</text></g>
</g><g id="layer-labels">
<text class="small" x="24" y="300">The 5E model sequences learning from concrete sensory exploration to formal scientific explanation.</text>
</g><text class="wm" x="768" y="325" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
