<text class="sh" x="36" y="49">Feature</text>
<text class="sh" x="150" y="49">Herbartian 5-Step</text>
<text class="sh" x="350" y="49">Bloom's Objective-Based</text>
<text class="sh" x="560" y="49">BSCS 5E Inquiry Model</text>
<text class="sh" x="36" y="98">Theory</text>
<text class="cell" x="150" y="89">Apperception psychology;</text>
<text class="cell" x="150" y="106">associative learning</text>
<text class="cell" x="350" y="89">Behavioural psychology;</text>
<text class="cell" x="350" y="106">measurable objectives</text>
<text class="cell" x="560" y="89">Constructivist psychology;</text>
<text class="cell" x="560" y="106">conceptual restructuring</text>
<text class="sh" x="36" y="156">Teacher Role</text>
<text class="cell" x="150" y="147">Information transmitter;</text>
<text class="cell" x="150" y="164">lecturer &amp; demonstrator</text>
<text class="cell" x="350" y="147">Instructional designer;</text>
<text class="cell" x="350" y="164">arranges learning tasks</text>
<text class="cell" x="560" y="147">Facilitator, inquiry coach,</text>
<text class="cell" x="560" y="164">and concept synthesizer</text>
<text class="sh" x="36" y="214">Student Role</text>
<text class="cell" x="150" y="205">Receptive listener,</text>
<text class="cell" x="150" y="222">answerer, and copier</text>
<text class="cell" x="350" y="205">Performer of specified</text>
<text class="cell" x="350" y="222">behavioural outcomes</text>
<text class="cell" x="560" y="205">Active investigator,</text>
<text class="cell" x="560" y="222">collaborator, sense-maker</text>
<text class="sh" x="36" y="272">Sequence</text>
<text class="cell" x="150" y="263">Preparation, Presentation,</text>
<text class="cell" x="150" y="280">Association, Generalization</text>
<text class="cell" x="350" y="263">Input (SLOs) -> Process</text>
<text class="cell" x="350" y="280">(Tasks) -> Output (Test)</text>
<text class="cell" x="560" y="263">5E inquiry cycle:</text>
<text class="cell" x="560" y="280">Engage to Evaluate</text>
<text class="sh" x="36" y="330">Explanation</text>
<text class="cell" x="150" y="321">Delivered early during</text>
<text class="cell" x="150" y="338">the Presentation step</text>
<text class="cell" x="350" y="321">Integrated throughout the</text>
<text class="cell" x="350" y="338">Process phase</text>
<text class="cell" x="560" y="321">Offered only AFTER pupils</text>
<text class="cell" x="560" y="338">explore empirical evidence</text>
