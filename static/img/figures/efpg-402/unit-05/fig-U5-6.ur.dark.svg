<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 476" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی تدریسی مقصد کے اجزا کا خاکہ</title><desc id="d">اجزا کا خاکہ جو عملی تدریسی مقصد کے تین لازمی حصے دکھاتا ہے: شرط، قابلِ مشاہدہ طرزِ عمل اور مہارت کا معیار، سائنس کی ایک ٹھوس مثال کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="476"/><g id="layer-edges">
<line class="stroke" x1="530" y1="168" x2="500" y2="168" marker-end="url(#arrow)"/>
<line class="stroke" x1="280" y1="168" x2="250" y2="168" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="box-cond"><rect class="panel-a" x="530" y="70" width="220" height="196" rx="8"/><text class="h" x="736" y="112">1. شرط</text><text class="sh" x="736" y="147">دیا گیا ماحول اور اوزار</text><text class="cell" x="736" y="184.8">”حیوانی خلیے کا بغیر لیبل خاکہ</text><text class="cell" x="736" y="211.4">اور عضویوں کے ناموں کی</text><text class="cell" x="736" y="238">فہرست دیے جانے پر...</text></g>
<g id="box-beh"><rect class="panel-b" x="280" y="70" width="220" height="196" rx="8"/><text class="h" x="486" y="112">2. طرزِ عمل</text><text class="sh" x="486" y="147">قابلِ مشاہدہ عملی فعل</text><text class="cell" x="486" y="184.8">...شاگرد پانچ خلوی</text><text class="cell" x="486" y="211.4">ساختیں درست پہچانیں</text><text class="cell" x="486" y="238">اور لیبل کریں گے...</text></g>
<g id="box-crit"><rect class="panel-a" x="30" y="70" width="220" height="196" rx="8"/><text class="h" x="236" y="112">3. معیار</text><text class="sh" x="236" y="147">مہارت کا معیار</text><text class="cell" x="236" y="184.8">...کم از کم 80% درستی</text><text class="cell" x="236" y="211.4">کے ساتھ، چار منٹ</text><text class="cell" x="236" y="238">سے کم میں۔“</text></g>
</g><g id="layer-labels">
<rect class="panel" x="30" y="304" width="720" height="108" rx="6"/>
<text class="sh" x="736" y="334">عملی SLO کا فارمولا:</text>
<text class="cell" x="736" y="366">شرائط (C) کے تحت سیکھنے والا (A) ایک قابلِ مشاہدہ طرزِ عمل (B)</text>
<text class="cell" x="736" y="397">مقررہ معیار (D) تک انجام دے گا۔</text>
</g><text class="wm" x="12" y="464" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
