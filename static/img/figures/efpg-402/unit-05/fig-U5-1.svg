<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of benefits of science lesson planning</title><desc id="d">Concept map showing the benefits of a science lesson plan for teachers and pupils, including time management, clear objectives, pupil engagement, and structured reflection.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="390" y1="205" x2="390" y2="104" marker-end="url(#arrow)"/>
<line class="stroke" x1="310" y1="225" x2="250" y2="185" marker-end="url(#arrow)"/>
<line class="stroke" x1="470" y1="225" x2="530" y2="185" marker-end="url(#arrow)"/>
<line class="stroke" x1="330" y1="265" x2="250" y2="335" marker-end="url(#arrow)"/>
<line class="stroke" x1="450" y1="265" x2="530" y2="335" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-obj"><rect class="panel-a" x="270" y="25" width="240" height="80" rx="8"/><text class="h" x="284" y="52">Clear Objectives</text><text class="cell" x="284" y="73">aligns lesson to NCP SLOs</text><text class="cell" x="284" y="90">and measurable outcomes</text></g>
<g id="node-time"><rect class="panel-a" x="30" y="145" width="220" height="80" rx="8"/><text class="h" x="44" y="172">Time Management</text><text class="cell" x="44" y="193">balanced inquiry phases;</text><text class="cell" x="44" y="210">prevents rushed endings</text></g>
<g id="node-res"><rect class="panel-a" x="530" y="145" width="220" height="80" rx="8"/><text class="h" x="544" y="172">Resource Control</text><text class="cell" x="544" y="193">staged group apparatus</text><text class="cell" x="544" y="210">and laboratory safety</text></g>
<g id="node-engage"><rect class="panel-a" x="30" y="335" width="220" height="80" rx="8"/><text class="h" x="44" y="362">Active Engagement</text><text class="cell" x="44" y="383">hands-on investigations</text><text class="cell" x="44" y="400">and collaborative inquiry</text></g>
<g id="node-eval"><rect class="panel-a" x="530" y="335" width="220" height="80" rx="8"/><text class="h" x="544" y="362">Formative Checks</text><text class="cell" x="544" y="383">targeted retrieval prompts</text><text class="cell" x="544" y="400">and reflective adaptation</text></g>
<g id="node-center"><ellipse class="panel-b" cx="390" cy="245" rx="100" ry="40"/><text class="h" x="390" y="243" text-anchor="middle">Science Lesson Plan</text><text class="cell" x="390" y="261" text-anchor="middle">pedagogical roadmap</text></g>
</g><g id="layer-labels">
<text class="small" x="24" y="450">Systematic planning coordinates objectives, apparatus, pacing, and pupil assessment.</text>
</g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
