<rect class="plain" x="200" y="266" width="160" height="98" rx="6"/><text class="sh" x="280" y="308" text-anchor="middle">گروپ 4</text><text class="cell" x="280" y="336" text-anchor="middle">4 شاگرد (کردار 1-4)</text>
<rect class="plain" x="420" y="406" width="160" height="98" rx="6"/><text class="sh" x="500" y="448" text-anchor="middle">گروپ 5</text><text class="cell" x="500" y="476" text-anchor="middle">4 شاگرد (کردار 1-4)</text>
