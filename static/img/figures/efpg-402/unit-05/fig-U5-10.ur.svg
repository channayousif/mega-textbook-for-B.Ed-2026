<rect class="plain" x="420" y="126" width="160" height="98" rx="6"/><text class="sh" x="500" y="168" text-anchor="middle">گروپ 1</text><text class="cell" x="500" y="196" text-anchor="middle">4 شاگرد (کردار 1-4)</text>
