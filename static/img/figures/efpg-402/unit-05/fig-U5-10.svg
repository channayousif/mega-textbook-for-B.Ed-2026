<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of science classroom layout for practical work</title><desc id="d">Classroom layout diagram demonstrating how a standard rectangular schoolroom with fixed benches can be arranged for safe group practical work with clear traffic aisles and material distribution stations.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><g id="layer-regions">
<rect class="panel-b" x="180" y="20" width="420" height="45" rx="6"/><text class="h" x="390" y="47" text-anchor="middle">Teacher Demonstration Desk &amp; Chalkboard</text>
<rect class="panel-a" x="30" y="90" width="120" height="80" rx="6"/><text class="sh" x="90" y="125" text-anchor="middle">Station A</text><text class="cell" x="90" y="145" text-anchor="middle">Trays 1-3</text>
<rect class="panel-a" x="630" y="90" width="120" height="80" rx="6"/><text class="sh" x="690" y="125" text-anchor="middle">Station B</text><text class="cell" x="690" y="145" text-anchor="middle">Trays 4-6</text>
<rect class="plain" x="200" y="90" width="160" height="70" rx="6"/><text class="sh" x="280" y="120" text-anchor="middle">Group 1</text><text class="cell" x="280" y="140" text-anchor="middle">4 Pupils (Roles 1-4)</text>
<rect class="plain" x="420" y="90" width="160" height="70" rx="6"/><text class="sh" x="500" y="120" text-anchor="middle">Group 2</text><text class="cell" x="500" y="140" text-anchor="middle">4 Pupils (Roles 1-4)</text>
<rect class="plain" x="200" y="190" width="160" height="70" rx="6"/><text class="sh" x="280" y="220" text-anchor="middle">Group 3</text><text class="cell" x="280" y="240" text-anchor="middle">4 Pupils (Roles 1-4)</text>
<rect class="plain" x="420" y="190" width="160" height="70" rx="6"/><text class="sh" x="500" y="220" text-anchor="middle">Group 4</text><text class="cell" x="500" y="240" text-anchor="middle">4 Pupils (Roles 1-4)</text>
<rect class="plain" x="200" y="290" width="160" height="70" rx="6"/><text class="sh" x="280" y="320" text-anchor="middle">Group 5</text><text class="cell" x="280" y="340" text-anchor="middle">4 Pupils (Roles 1-4)</text>
<rect class="plain" x="420" y="290" width="160" height="70" rx="6"/><text class="sh" x="500" y="320" text-anchor="middle">Group 6</text><text class="cell" x="500" y="340" text-anchor="middle">4 Pupils (Roles 1-4)</text>
<rect class="panel" x="30" y="330" width="120" height="50" rx="6"/><text class="sh" x="90" y="355" text-anchor="middle">Sink &amp; Water</text><text class="cell" x="90" y="372" text-anchor="middle">Clean-up Area</text>
<rect class="panel" x="630" y="330" width="120" height="50" rx="6"/><text class="sh" x="690" y="355" text-anchor="middle">Waste Bin</text><text class="cell" x="690" y="372" text-anchor="middle">&amp; First Aid</text>
</g><g id="layer-edges">
<line class="dash" x1="390" y1="75" x2="390" y2="380"/>
<text class="small" x="395" y="375" transform="rotate(-90 395 375)">Clear Central Traffic Aisle</text>
<line class="stroke" x1="90" y1="175" x2="90" y2="230" marker-end="url(#arrow)"/>
<line class="stroke" x1="690" y1="175" x2="690" y2="230" marker-end="url(#arrow)"/>
</g><g id="layer-labels">
<text class="small" x="180" y="390">Materials Managers use side stations; central aisle remains</text>
<text class="small" x="180" y="405">completely clear of school bags and stools at all times.</text>
</g><text class="wm" x="768" y="415" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
