<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of worked action-research plan on heat and temperature</title><desc id="d">Table presenting a worked action-research plan for a Grade 6 science class addressing misconceptions about heat and temperature.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="430"/><g id="layer-regions">
<rect class="panel-b" x="24" y="24" width="732" height="40" rx="6"/>
<rect class="panel" x="24" y="64" width="732" height="68"/>
<rect class="plain" x="24" y="132" width="732" height="68"/>
<rect class="panel" x="24" y="200" width="732" height="68"/>
<rect class="plain" x="24" y="268" width="732" height="68"/>
</g><g id="layer-edges">
<line class="grid" x1="160" y1="24" x2="160" y2="336"/>
<line class="grid" x1="430" y1="24" x2="430" y2="336"/>
</g><g id="layer-nodes">
<text class="sh" x="36" y="49">Cycle Stage</text>
<text class="sh" x="172" y="49">Teacher Action and Intervention</text>
<text class="sh" x="442" y="49">Evidence and Learning Outcome</text>

<text class="sh" x="36" y="94">1. Plan</text>
<text class="cell" x="36" y="112">(Problem)</text>
<text class="cell" x="172" y="93">Design hands-on thermal mixing station;</text>
<text class="cell" x="172" y="110">replace abstract chalkboard definitions</text>
<text class="cell" x="442" y="93">Baseline test shows 68% of pupils confuse</text>
<text class="cell" x="442" y="110">heat (energy) with temperature (speed)</text>

<text class="sh" x="36" y="162">2. Act</text>
<text class="cell" x="36" y="180">(Intervention)</text>
<text class="cell" x="172" y="161">Pupils melt ice in a large 40 °C bucket</text>
<text class="cell" x="172" y="178">versus a small 90 °C cup of water</text>
<text class="cell" x="442" y="161">Pupils directly observe that the bucket melts</text>
<text class="cell" x="442" y="178">more ice due to greater total thermal energy</text>

<text class="sh" x="36" y="230">3. Observe</text>
<text class="cell" x="36" y="248">(Data collection)</text>
<text class="cell" x="172" y="229">Administer 5-item diagnostic post-quiz;</text>
<text class="cell" x="172" y="246">review pupil explanation exit tickets</text>
<text class="cell" x="442" y="229">85% of pupils correctly distinguish heat from</text>
<text class="cell" x="442" y="246">temperature on conceptual transfer tasks</text>

<text class="sh" x="36" y="298">4. Reflect</text>
<text class="cell" x="36" y="316">(Next cycle)</text>
<text class="cell" x="172" y="297">Evaluate persisting errors; plan particle</text>
<text class="cell" x="172" y="314">role-play for struggling learners</text>
<text class="cell" x="442" y="297">Identifies need for tactile particle simulation</text>
<text class="cell" x="442" y="314">to solidify molecular velocity concepts</text>
</g><g id="layer-labels">
<text class="small" x="24" y="375">A concrete worked example of the Plan-Act-Observe-Reflect cycle resolving a science misconception.</text>
</g><text class="wm" x="768" y="405" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>