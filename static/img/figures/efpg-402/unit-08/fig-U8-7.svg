<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map linking elementary science to Sustainable Development Goals</title><desc id="d">Concept map connecting elementary science education to six Sustainable Development Goals: good health, clean water, clean energy, responsible consumption, climate action, and life on land.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="280" y1="210" x2="220" y2="90" marker-end="url(#arrow)"/>
<line class="stroke" x1="390" y1="195" x2="390" y2="120" marker-end="url(#arrow)"/>
<line class="stroke" x1="500" y1="210" x2="560" y2="90" marker-end="url(#arrow)"/>
<line class="stroke" x1="280" y1="270" x2="220" y2="390" marker-end="url(#arrow)"/>
<line class="stroke" x1="390" y1="285" x2="390" y2="360" marker-end="url(#arrow)"/>
<line class="stroke" x1="500" y1="270" x2="560" y2="390" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-sdg3"><rect class="panel-a" x="24" y="30" width="220" height="75" rx="8"/><text class="sh" x="36" y="55">SDG 3: Good Health</text><text class="cell" x="36" y="75">Pathogens, hygiene, disease</text><text class="cell" x="36" y="92">prevention, clean air</text></g>
<g id="node-sdg6"><rect class="panel-a" x="280" y="30" width="220" height="75" rx="8"/><text class="sh" x="292" y="55">SDG 6: Clean Water</text><text class="cell" x="292" y="75">Water filtration, purification,</text><text class="cell" x="292" y="92">Indus basin conservation</text></g>
<g id="node-sdg7"><rect class="panel-a" x="536" y="30" width="220" height="75" rx="8"/><text class="sh" x="548" y="55">SDG 7: Clean Energy</text><text class="cell" x="548" y="75">Solar panels, wind power,</text><text class="cell" x="548" y="92">biogas, energy efficiency</text></g>
<g id="node-sdg12"><rect class="panel-b" x="24" y="350" width="220" height="75" rx="8"/><text class="sh" x="36" y="375">SDG 12: Consumption</text><text class="cell" x="36" y="395">3Rs: Reduce, reuse, recycle,</text><text class="cell" x="36" y="412">reducing single-use plastic</text></g>
<g id="node-sdg13"><rect class="panel-b" x="280" y="350" width="220" height="75" rx="8"/><text class="sh" x="292" y="375">SDG 13: Climate Action</text><text class="cell" x="292" y="395">Flood resilience, heatwaves,</text><text class="cell" x="292" y="412">greenhouse effect awareness</text></g>
<g id="node-sdg15"><rect class="panel-b" x="536" y="350" width="220" height="75" rx="8"/><text class="sh" x="548" y="375">SDG 15: Life on Land</text><text class="cell" x="548" y="395">Tree planting, biodiversity,</text><text class="cell" x="548" y="412">protecting native wildlife</text></g>
<g id="node-center"><ellipse class="panel" cx="390" cy="240" rx="125" ry="45"/><text class="h" x="390" y="236" text-anchor="middle">School Science</text><text class="sh" x="390" y="256" text-anchor="middle">&amp; The Global Goals</text></g>
</g><g id="layer-labels">
<text class="small" x="24" y="455">UNESCO ESD framework maps elementary science directly to the Global Goals.</text>
