<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the four-stage action-research cycle in science teaching</title><desc id="d">Flowchart of the four-stage action-research cycle: plan, act, observe, and reflect, highlighting continuous classroom enquiry.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="280" y1="85" x2="490" y2="85" marker-end="url(#arrow)"/>
<line class="stroke" x1="620" y1="140" x2="620" y2="270" marker-end="url(#arrow)"/>
<line class="stroke" x1="500" y1="325" x2="290" y2="325" marker-end="url(#arrow)"/>
<line class="stroke" x1="160" y1="270" x2="160" y2="140" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-plan"><rect class="panel-a" x="40" y="40" width="240" height="100" rx="8"/><text class="h" x="56" y="68">1. PLAN</text><text class="cell" x="56" y="92">Identify classroom learning gap;</text><text class="cell" x="56" y="110">gather baseline diagnostic data;</text><text class="cell" x="56" y="128">formulate targeted intervention</text></g>
<g id="node-act"><rect class="panel-b" x="500" y="40" width="240" height="100" rx="8"/><text class="h" x="516" y="68">2. ACT</text><text class="cell" x="516" y="92">Implement the new pedagogical</text><text class="cell" x="516" y="110">strategy in normal class lessons</text><text class="cell" x="516" y="128">over a defined timeline</text></g>
<g id="node-observe"><rect class="panel-b" x="500" y="280" width="240" height="100" rx="8"/><text class="h" x="516" y="308">3. OBSERVE</text><text class="cell" x="516" y="332">Systematically collect evidence;</text><text class="cell" x="516" y="350">administer post-quizzes, rubric</text><text class="cell" x="516" y="368">checks, and pupil exit tickets</text></g>
<g id="node-reflect"><rect class="panel-a" x="40" y="280" width="240" height="100" rx="8"/><text class="h" x="56" y="308">4. REFLECT</text><text class="cell" x="56" y="332">Analyze results against baseline;</text><text class="cell" x="56" y="350">evaluate intervention efficacy;</text><text class="cell" x="56" y="368">plan the next spiral cycle</text></g>
<g id="node-center"><ellipse class="plain" cx="390" cy="210" rx="100" ry="38"/><text class="sh" x="390" y="206" text-anchor="middle">Classroom Inquiry</text><text class="cell" x="390" y="226" text-anchor="middle">Continuous Spiral</text></g>
</g><g id="layer-labels">
<text class="small" x="40" y="440">The cyclical action-research model: practitioner inquiry solves classroom learning challenges.</text>
</g><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>