<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the science teacher's role in society</title><desc id="d">Concept map illustrating four key dimensions of the science teacher's role in society: promoting community health, environmental stewardship, cultivating scientific attitude, and guiding scientific careers.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-edges">
<line class="stroke" x1="290" y1="210" x2="220" y2="134" marker-end="url(#arrow)"/>
<line class="stroke" x1="490" y1="210" x2="560" y2="134" marker-end="url(#arrow)"/>
<line class="stroke" x1="290" y1="270" x2="220" y2="346" marker-end="url(#arrow)"/>
<line class="stroke" x1="490" y1="270" x2="560" y2="346" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-health"><rect class="panel-a" x="30" y="40" width="250" height="100" rx="8"/><text class="h" x="46" y="68">Community Health</text><text class="cell" x="46" y="92">Explains waterborne disease,</text><text class="cell" x="46" y="110">hygiene, vaccination, and</text><text class="cell" x="46" y="128">mosquito vector control</text></g>
<g id="node-env"><rect class="panel-a" x="500" y="40" width="250" height="100" rx="8"/><text class="h" x="516" y="68">Environmental Care</text><text class="cell" x="516" y="92">Promotes tree plantation,</text><text class="cell" x="516" y="110">water conservation, and</text><text class="cell" x="516" y="128">responsible waste disposal</text></g>
<g id="node-temper"><rect class="panel-a" x="30" y="330" width="250" height="100" rx="8"/><text class="h" x="46" y="358">Scientific Attitude</text><text class="cell" x="46" y="382">Dispels harmful superstitions</text><text class="cell" x="46" y="400">and fosters evidence-based</text><text class="cell" x="46" y="418">decision making in citizens</text></g>
<g id="node-career"><rect class="panel-a" x="500" y="330" width="250" height="100" rx="8"/><text class="h" x="516" y="358">Career Mentorship</text><text class="cell" x="516" y="382">Inspires rural youth and</text><text class="cell" x="516" y="400">girls toward medical,</text><text class="cell" x="516" y="418">agricultural, and tech roles</text></g>
<g id="node-center"><ellipse class="panel-b" cx="390" cy="240" rx="120" ry="46"/><text class="h" x="390" y="236" text-anchor="middle">Science Teacher</text><text class="sh" x="390" y="256" text-anchor="middle">in Society</text></g>
</g><g id="layer-labels">
<text class="small" x="30" y="460">Four foundational societal roles through which school science connects with community welfare.</text>
</g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>