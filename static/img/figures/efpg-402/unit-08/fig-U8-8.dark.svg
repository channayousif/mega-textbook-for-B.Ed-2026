</g><g id="layer-nodes">
<text class="sh" x="36" y="49">Ecological Crisis</text>
<text class="sh" x="212" y="49">Impact on Pakistan</text>
<text class="sh" x="442" y="49">Infused Science Learning Activity</text>

<text class="sh" x="36" y="94">Monsoon Floods</text>
<text class="cell" x="36" y="112">&amp; Heatwaves</text>
<text class="cell" x="212" y="93">Widespread infrastructure loss,</text>
<text class="cell" x="212" y="110">disrupted crops, heat illness</text>
<text class="cell" x="442" y="93">Pupils map local rainfall data; construct</text>
<text class="cell" x="442" y="110">model flood channels and school shade areas</text>

<text class="sh" x="36" y="162">Water Depletion</text>
<text class="cell" x="36" y="180">&amp; Aquifer Salinity</text>
<text class="cell" x="212" y="161">Falling water tables, saline soil</text>
<text class="cell" x="212" y="178">reducing agricultural yields</text>
<text class="cell" x="442" y="161">Construct model solar stills; test soil water</text>
<text class="cell" x="442" y="178">retention with organic mulch techniques</text>

<text class="sh" x="36" y="230">Winter Smog</text>
<text class="cell" x="36" y="248">&amp; Air Pollution</text>
<text class="cell" x="212" y="229">Hazardous AQI in cities, asthma,</text>
<text class="cell" x="212" y="246">eye irritation, school closures</text>
<text class="cell" x="442" y="229">Investigate leaf dust absorption; build</text>
<text class="cell" x="442" y="246">simple particulate air samplers using vaseline</text>

<text class="sh" x="36" y="298">Deforestation</text>
<text class="cell" x="36" y="316">&amp; Habitat Loss</text>
<text class="cell" x="212" y="297">Loss of Indus delta mangroves,</text>
<text class="cell" x="212" y="314">coastal erosion, flash runoff</text>
<text class="cell" x="442" y="297">Establish school seed nurseries; plant native</text>
<text class="cell" x="442" y="314">trees (neem, babul); adopt school trees</text>
</g><g id="layer-labels">
<text class="small" x="24" y="375">Infusing authentic local environmental challenges into elementary science inquiry builds ecological agency.</text>
</g><text class="wm" x="768" y="405" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>