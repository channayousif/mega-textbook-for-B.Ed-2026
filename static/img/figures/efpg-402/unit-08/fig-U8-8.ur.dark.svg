<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے ماحولیاتی چیلنجز اور مربوط سائنسی سرگرمیاں</title><desc id="d">جدول جس میں پاکستان کے چار بڑے ماحولیاتی مسائل، ان کے اثرات اور ان سے متعلق نصاب سے مربوط سائنسی سرگرمیاں دی گئی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions">
<rect class="panel-b" x="24" y="24" width="732" height="50" rx="6"/>
<rect class="panel" x="24" y="74" width="732" height="115"/>
<rect class="plain" x="24" y="189" width="732" height="115"/>
<rect class="panel" x="24" y="304" width="732" height="115"/>
<rect class="plain" x="24" y="419" width="732" height="115"/>
</g><g id="layer-edges">
<line class="grid" x1="560" y1="24" x2="560" y2="534"/>
<line class="grid" x1="310" y1="24" x2="310" y2="534"/>
</g><g id="layer-nodes">
<text class="sh" x="740" y="55">ماحولیاتی چیلنج</text>
<text class="sh" x="546" y="55">پاکستان پر اثرات</text>
<text class="sh" x="296" y="55">نصاب سے مربوط سائنسی سرگرمی</text>

<text class="sh" x="740" y="110">سیلاب اور ہیٹ ویوز</text>
<text class="cell" x="740" y="135">(مانسون اور گرمی کی لہر)</text>
<text class="cell" x="546" y="105">بڑے پیمانے پر انفراسٹرکچر کا نقصان،</text>
<text class="cell" x="546" y="132">فصلوں کی تباہی، بیماریوں کا پھیلاؤ</text>
<text class="cell" x="296" y="105">بارش کا ریکارڈ بنانا؛ سیلابی پانی کی</text>
<text class="cell" x="296" y="132">نکاسی اور سایہ دار جگہوں کے ماڈل</text>

<text class="sh" x="740" y="225">پانی کی کمی اور سیم</text>
<text class="cell" x="740" y="250">(زیرِ زمین نمکیات کا اخراج)</text>
<text class="cell" x="546" y="220">پانی کی سطح گرنا، نمکین مٹی،</text>
<text class="cell" x="546" y="247">زرعی پیداوار میں خطرناک کمی</text>
<text class="cell" x="296" y="220">شمسی توانائی سے پانی کشید کرنے والے</text>
<text class="cell" x="296" y="247">پلانٹ؛ نامیاتی کھاد سے نمی بچانا</text>

<text class="sh" x="740" y="340">اسموگ اور فضائی آلودگی</text>
<text class="cell" x="740" y="365">(موسم سرما کا کثیف دھواں)</text>
<text class="cell" x="546" y="335">شہروں میں خطرناک AQI، سانس کی</text>
<text class="cell" x="546" y="362">بیماریاں اور اسکولوں کی بندش</text>
<text class="cell" x="296" y="335">پودوں کے پتوں پر گرد کا جائزہ؛</text>
<text class="cell" x="296" y="362">ویسلین پیپر سے باریک ذرات کا مشاہدہ</text>

<text class="sh" x="740" y="455">جنگلات کی کٹائی</text>
<text class="cell" x="740" y="480">(حیاتیاتی مسکن کی تباہی)</text>
<text class="cell" x="546" y="450">مینگرووز کا کٹاؤ، سمندری کٹاؤ،</text>
<text class="cell" x="546" y="477">سیلابی ریلے اور حیاتیات کا خاتمہ</text>
<text class="cell" x="296" y="450">اسکول نرسری بنانا؛ مقامی درخت</text>
<text class="cell" x="296" y="477">(نیم، ببول) لگانا؛ پودے گود لینا</text>
</g><g id="layer-labels">
<text class="small" x="750" y="575">پاکستان کے چار ماحولیاتی بحران اور کلاس روم نصاب سے ان کا عملی ربط۔</text>
</g><text class="wm" x="12" y="585" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
