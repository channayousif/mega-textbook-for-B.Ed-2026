<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستانی معاشرتی مسائل اور استاد کی قیادت میں سائنسی اقدامات</title><desc id="d">جدول جس میں پاکستان کے چار اہم معاشرتی مسائل، ان کے پیچھے کارفرما سائنسی تصورات اور سائنس استاد کی زیر قیادت اسکول و کمیونٹی اقدامات دیے گئے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions">
<rect class="panel-b" x="24" y="24" width="732" height="50" rx="6"/>
<rect class="panel" x="24" y="74" width="732" height="115"/>
<rect class="plain" x="24" y="189" width="732" height="115"/>
<rect class="panel" x="24" y="304" width="732" height="115"/>
<rect class="plain" x="24" y="419" width="732" height="115"/>
</g><g id="layer-edges">
<line class="grid" x1="560" y1="24" x2="560" y2="534"/>
<line class="grid" x1="310" y1="24" x2="310" y2="534"/>
</g><g id="layer-nodes">
<text class="sh" x="740" y="55">معاشرتی مسئلہ</text>
<text class="sh" x="546" y="55">بنیادی سائنسی تصور</text>
<text class="sh" x="296" y="55">استاد کی زیر قیادت کمیونٹی اقدام</text>

<text class="sh" x="740" y="110">پانی سے بیماریاں</text>
<text class="cell" x="740" y="135">(اسہال اور ٹائیفائیڈ)</text>
<text class="cell" x="546" y="105">خردبینی جراثیم، طبعی فلٹریشن</text>
<text class="cell" x="546" y="132">اور ابال کر جراثیم کشی</text>
<text class="cell" x="296" y="105">پانی کی جانچ؛ کم لاگت ریت فلٹر؛</text>
<text class="cell" x="296" y="132">1 منٹ ابالنے کے اصول کے پمفلٹ</text>

<text class="sh" x="740" y="225">ڈینگی اور ملیریا</text>
<text class="cell" x="740" y="250">(مانسون کے بعد کا موسم)</text>
<text class="cell" x="546" y="220">ویکٹر ماحولیات، مچھر کا دورِ حیات</text>
<text class="cell" x="546" y="247">(انڈے، لاروا اور پیوپا)</text>
<text class="cell" x="296" y="220">کھڑے پانی کا معائنہ؛ پانی کے برتن</text>
<text class="cell" x="296" y="247">ڈھانپنا؛ محفوظ حیاتیاتی روک تھام</text>

<text class="sh" x="740" y="340">سیم و تھور</text>
<text class="cell" x="740" y="365">(زرعی زمین کے مسائل)</text>
<text class="cell" x="546" y="335">کیپلیری عمل، نمکیات کا جماؤ،</text>
<text class="cell" x="546" y="362">پودوں کی جڑوں میں اوسموسس</text>
<text class="cell" x="296" y="335">مٹی کی نمکیات کی جانچ؛ نمک برداشت</text>
<text class="cell" x="296" y="362">کرنے والی فصلیں اور سایہ دار درخت</text>

<text class="sh" x="740" y="455">کچرا کھلے عام جلانا</text>
<text class="cell" x="740" y="480">(دھواں اور اسموگ)</text>
<text class="cell" x="546" y="450">نامکمل احتراق، زہریلی گیسیں اور</text>
<text class="cell" x="546" y="477">باریک معلق ذرات (PM2.5)</text>
<text class="cell" x="296" y="450">اسکول میں کھاد کے گڑھے؛ پلاسٹک</text>
<text class="cell" x="296" y="477">جلانے کے خلاف شعوری مہم</text>
</g><g id="layer-labels">
<text class="small" x="750" y="575">پاکستان کے چار اہم مسائل جن پر اسکول سائنس عملی اقدامات کر سکتی ہے۔</text>
</g><text class="wm" x="12" y="585" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
