<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سائنس کے اچھے استاد کے اوصاف کا جدول</title><desc id="d">جدول جس میں اچھے سائنس استاد کے ضروری اوصاف کو تین جہتوں علم، تدریسی مہارتوں اور پیشہ ورانہ رجحانات میں تقسیم کر کے جماعتی رویوں کے ساتھ دکھایا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions">
<rect class="panel-b" x="24" y="24" width="732" height="50" rx="6"/>
<rect class="panel" x="24" y="74" width="732" height="115"/>
<rect class="plain" x="24" y="189" width="732" height="115"/>
<rect class="panel" x="24" y="304" width="732" height="115"/>
<rect class="plain" x="24" y="419" width="732" height="115"/>
</g><g id="layer-edges">
<line class="grid" x1="590" y1="24" x2="590" y2="534"/>
<line class="grid" x1="310" y1="24" x2="310" y2="534"/>
</g><g id="layer-nodes">
<text class="sh" x="740" y="55">جہت</text>
<text class="sh" x="576" y="55">بنیادی پیشہ ورانہ اوصاف</text>
<text class="sh" x="296" y="55">جماعت میں نمایاں تدریسی رویہ</text>

<text class="sh" x="740" y="110">1۔ علم</text>
<text class="cell" x="740" y="135">(مواد اور PCK)</text>
<text class="cell" x="576" y="105">سائنسی حقائق پر گہری گرفت؛</text>
<text class="cell" x="576" y="132">طلبہ کی غلط فہمیوں کا فہم</text>
<text class="cell" x="296" y="105">پیچیدہ تصورات کی سادہ وضاحت؛ مقامی</text>
<text class="cell" x="296" y="132">تمثیلیں؛ غلطیوں کی فوری تشخیص</text>

<text class="sh" x="740" y="225">2۔ مہارتیں</text>
<text class="cell" x="740" y="250">(تدریسی)</text>
<text class="cell" x="576" y="220">کم لاگت کٹس کی تیاری؛ تحقیقی</text>
<text class="cell" x="576" y="247">سوالات؛ لیب میں حفاظت کا انتظام</text>
<text class="cell" x="296" y="220">بوتلوں اور تاروں سے آلات بنانا؛ کھلے</text>
<text class="cell" x="296" y="247">سوالات پوچھنا؛ لیب کے محفوظ اصول</text>

<text class="sh" x="740" y="340">3۔ رجحانات</text>
<text class="cell" x="740" y="365">(سائنسی اوصاف)</text>
<text class="cell" x="576" y="335">تجسس، علمی دیانت داری،</text>
<text class="cell" x="576" y="362">کشادہ نظری اور صبر و تحمل</text>
<text class="cell" x="296" y="335">غیر متوقع نتائج کا خیرمقدم؛ کمزوریوں</text>
<text class="cell" x="296" y="362">کا اعتراف؛ طالبات کی حوصلہ افزائی</text>

<text class="sh" x="740" y="455">4۔ ترقی</text>
<text class="cell" x="740" y="480">(مسلسل CPD)</text>
<text class="cell" x="576" y="450">تاملی سوچ، عملی تحقیق اور</text>
<text class="cell" x="576" y="477">فعال پیشہ ورانہ نیٹ ورکنگ</text>
<text class="cell" x="296" y="450">تاملی ڈائری لکھنا؛ ساتھیوں سے سیکھنا؛</text>
<text class="cell" x="296" y="477">تشخیصی نتائج کی بنیاد پر بہتری</text>
</g><g id="layer-labels">
<text class="small" x="750" y="575">موثر سائنس تدریس کے لیے علم، مہارتوں اور رویوں کا باہمی توازن ضروری ہے۔</text>
</g><text class="wm" x="12" y="585" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
