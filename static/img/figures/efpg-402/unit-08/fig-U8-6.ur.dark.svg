<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عملی تحقیق کی حل شدہ مثال: حرارت اور درجہ حرارت</title><desc id="d">جدول جس میں چھٹی جماعت کے لیے حرارت اور درجہ حرارت کی غلط فہمیوں کے ازالے سے متعلق عملی تحقیق کا حل شدہ منصوبہ پیش کیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><rect class="bg" x="0" y="0" width="780" height="620"/><g id="layer-regions">
<rect class="panel-b" x="24" y="24" width="732" height="50" rx="6"/>
<rect class="panel" x="24" y="74" width="732" height="115"/>
<rect class="plain" x="24" y="189" width="732" height="115"/>
<rect class="panel" x="24" y="304" width="732" height="115"/>
<rect class="plain" x="24" y="419" width="732" height="115"/>
</g><g id="layer-edges">
<line class="grid" x1="610" y1="24" x2="610" y2="534"/>
<line class="grid" x1="310" y1="24" x2="310" y2="534"/>
</g><g id="layer-nodes">
<text class="sh" x="740" y="55">مرحلہ</text>
<text class="sh" x="596" y="55">جماعتی توجہ (غلط فہمی)</text>
<text class="sh" x="296" y="55">استاد کا اقدام اور جمع کردہ مواد</text>

<text class="sh" x="740" y="110">1۔ منصوبہ بندی</text>
<text class="cell" x="740" y="135">(Plan)</text>
<text class="cell" x="596" y="105">68 فیصد طلبہ نے حرارت اور درجہ</text>
<text class="cell" x="596" y="132">حرارت کو ایک ہی چیز سمجھا تھا</text>
<text class="cell" x="296" y="105">تشخیصی کوئز کا تجزیہ؛ برف پگھلانے</text>
<text class="cell" x="296" y="132">اور تھرمامیٹر سرگرمی کا تفصیلی خاکہ</text>

<text class="sh" x="740" y="225">2۔ عمل</text>
<text class="cell" x="740" y="250">(Act)</text>
<text class="cell" x="596" y="220">بڑی بالٹی (40 ڈگری) بمقابلہ</text>
<text class="cell" x="596" y="247">چھوٹا کپ (90 ڈگری) پانی</text>
<text class="cell" x="296" y="220">طلبہ نے پیشین گوئی کی، درجہ حرارت</text>
<text class="cell" x="296" y="247">ناپا اور برف پگھلنے کا مشاہدہ کیا</text>

<text class="sh" x="740" y="340">3۔ مشاہدہ</text>
<text class="cell" x="740" y="365">(Observe)</text>
<text class="cell" x="596" y="335">85 فیصد طلبہ نے درست بتایا کہ بالٹی</text>
<text class="cell" x="596" y="362">میں کل حرارتی توانائی زیادہ تھی</text>
<text class="cell" x="296" y="335">بعد کا تشخیصی ٹیسٹ؛ طلبہ کی</text>
<text class="cell" x="296" y="362">وضاحتی تحریریں اور ایگزٹ سلپس</text>

<text class="sh" x="740" y="455">4۔ غور و فکر</text>
<text class="cell" x="740" y="480">(Reflect)</text>
<text class="cell" x="596" y="450">باقی ماندہ غلطیوں کا جائزہ؛ ذرات</text>
<text class="cell" x="596" y="477">کی حرکت پر رول پلے کی ضرورت</text>
<text class="cell" x="296" y="450">سالماتی رفتار سمجھانے کے لیے عملی</text>
<text class="cell" x="296" y="477">رول پلے کی سرگرمی کا نیا منصوبہ</text>
</g><g id="layer-labels">
<text class="small" x="750" y="575">سر نوید کی جماعتی عملی تحقیق کا حل شدہ منصوبہ برائے جماعت ششم۔</text>
</g><text class="wm" x="12" y="585" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>
