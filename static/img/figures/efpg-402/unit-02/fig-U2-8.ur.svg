<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">درسی کتاب کے باب کی جانچ کے چھ قدموں کا فلو چارٹ</title><desc id="d">سائنس کی درسی کتاب کے ایک باب کی جانچ کے چھ قدموں کا فلو چارٹ: باب چنیں، SLOs درج کریں، چھ معیاروں کی بنیاد پر پڑھیں، ہر ایک کو درجہ دیں، شواہد نوٹ کریں اور تجاویز کے ساتھ خلاصہ لکھیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="459"/><g id="layer-edges">
<line class="stroke" x1="534" y1="94.5" x2="500" y2="94.5" marker-end="url(#arrow)"/>
<line class="stroke" x1="284" y1="94.5" x2="250" y2="94.5" marker-end="url(#arrow)"/>
<path class="stroke" d="M140 148.5 L140 195.8 L640 195.8 L640 229.5" marker-end="url(#arrow)"/>
<line class="stroke" x1="534" y1="283.5" x2="500" y2="283.5" marker-end="url(#arrow)"/>
<line class="stroke" x1="284" y1="283.5" x2="250" y2="283.5" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="step-1"><rect class="panel-a" x="534" y="40.5" width="216" height="108" rx="8"/><text class="h" x="736" y="78.3">قدم 1</text><text class="cell" x="736" y="108">جانچ کے لیے ایک</text><text class="cell" x="736" y="131">باب چنیں</text></g>
<g id="step-2"><rect class="panel-a" x="284" y="40.5" width="216" height="108" rx="8"/><text class="h" x="486" y="78.3">قدم 2</text><text class="cell" x="486" y="108">وہ قومی نصابی SLOs لکھیں</text><text class="cell" x="486" y="131">جن کا احاطہ ہونا چاہیے</text></g>
<g id="step-3"><rect class="panel-a" x="34" y="40.5" width="216" height="108" rx="8"/><text class="h" x="236" y="78.3">قدم 3</text><text class="cell" x="236" y="108">باب کو چھ معیاروں</text><text class="cell" x="236" y="131">کی بنیاد پر پڑھیں</text></g>

<g id="step-4"><rect class="panel-a" x="534" y="229.5" width="216" height="108" rx="8"/><text class="h" x="736" y="267.3">قدم 4</text><text class="cell" x="736" y="297">ہر معیار کو درجہ دیں</text><text class="cell" x="736" y="320">(مضبوط / مناسب / کمزور)</text></g>
<g id="step-5"><rect class="panel-a" x="284" y="229.5" width="216" height="108" rx="8"/><text class="h" x="486" y="267.3">قدم 5</text><text class="cell" x="486" y="297">ہر درجے کے لیے</text><text class="cell" x="486" y="320">مخصوص شواہد نوٹ کریں</text></g>
<g id="step-6"><rect class="panel-b" x="34" y="229.5" width="216" height="108" rx="8"/><text class="h" x="236" y="267.3">قدم 6</text><text class="cell" x="236" y="297">خلاصہ فیصلہ لکھیں</text><text class="cell" x="236" y="320">اور بہتریاں تجویز کریں</text></g>
</g><g id="layer-labels">
<text class="small" x="756" y="405">منظم جانچ اساتذہ کو خلا پہچاننے اور درسی کتاب کی کمی پوری کرنے دیتی ہے۔</text>
</g><text class="wm" x="12" y="438.8" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>