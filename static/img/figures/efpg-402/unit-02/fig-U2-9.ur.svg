<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 675" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ماحولیاتی نظام کے موضوع کے مضامین سے روابط کا تصوراتی نقشہ</title><desc id="d">تصوراتی نقشہ جو ماحولیاتی نظام پر ساتویں جماعت کے سائنس کے ایک موضوع کو ریاضی سے اعداد و شمار اور گراف کے ذریعے، زبانوں سے تحریر کے ذریعے، معاشرتی علوم سے جنگلات کی کٹائی کے سماجی اثر کے ذریعے، اور اسلامیات سے امانت داری کے تصور کے ذریعے جڑا ہوا دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, sans-serif; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="675"/><g id="layer-edges">
<line class="stroke" x1="390" y1="283.5" x2="390" y2="145.8" marker-end="url(#arrow)"/>
<line class="stroke" x1="270" y1="337.5" x2="260" y2="337.5" marker-end="url(#arrow)"/>
<line class="stroke" x1="390" y1="391.5" x2="390" y2="515.7" marker-end="url(#arrow)"/>
<line class="stroke" x1="510" y1="337.5" x2="520" y2="337.5" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-math"><rect class="panel-a" x="260" y="35.1" width="260" height="108" rx="8"/><text class="h" x="506" y="70.2">ریاضی</text><text class="cell" x="506" y="98.6">اعداد: شاگرد درخت کی اونچائی ناپ</text><text class="cell" x="506" y="121.5">کر بار چارٹ بناتے ہیں</text></g>
<g id="node-lang"><rect class="panel-a" x="20" y="283.5" width="240" height="108" rx="8"/><text class="sh" x="246" y="318.6">زبانیں (اردو/انگریزی)</text><text class="cell" x="246" y="347">تحریر: شاگرد باغ کے غذائی</text><text class="cell" x="246" y="369.9">جال پر پیراگراف لکھتے ہیں</text></g>
<g id="node-isl"><rect class="panel-a" x="260" y="518.4" width="260" height="108" rx="8"/><text class="h" x="506" y="553.5">اسلامیات</text><text class="cell" x="506" y="581.9">اخلاقیات: ماحول کی دیکھ بھال</text><text class="cell" x="506" y="604.8">میں امانت داری (خلیفہ)</text></g>
<g id="node-soc"><rect class="panel-a" x="520" y="283.5" width="240" height="108" rx="8"/><text class="h" x="746" y="318.6">معاشرتی علوم</text><text class="cell" x="746" y="347">معاشرہ: شاگرد بحث کرتے ہیں کہ</text><text class="cell" x="746" y="369.9">کٹائی سے سیلاب کیوں بڑھتا ہے</text></g>

<g id="node-center"><ellipse class="panel-b" cx="390" cy="337.5" rx="116" ry="51.3"/><text class="h" x="390" y="332.1" text-anchor="middle">ساتویں جماعت کا سائنسی</text><text class="h" x="390" y="356.4" text-anchor="middle">موضوع: ماحولیاتی نظام</text></g>
</g><text class="wm" x="12" y="661.5" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>