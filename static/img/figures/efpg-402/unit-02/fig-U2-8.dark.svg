<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of six steps for evaluating a textbook chapter</title><desc id="d">Flowchart of six steps for evaluating a science textbook chapter: choose a chapter, list the SLOs, read against six criteria, score each, note evidence and write a summary with suggestions.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="340"/><g id="layer-edges">
<line class="stroke" x1="246" y1="70" x2="280" y2="70" marker-end="url(#arrow)"/>
<line class="stroke" x1="496" y1="70" x2="530" y2="70" marker-end="url(#arrow)"/>
<path class="stroke" d="M 640,110 L 640,145 L 140,145 L 140,170" marker-end="url(#arrow)"/>
<line class="stroke" x1="246" y1="210" x2="280" y2="210" marker-end="url(#arrow)"/>
<line class="stroke" x1="496" y1="210" x2="530" y2="210" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="step-1"><rect class="panel-a" x="30" y="30" width="216" height="80" rx="8"/><text class="h" x="44" y="58">Step 1</text><text class="cell" x="44" y="80">Choose a chapter to</text><text class="cell" x="44" y="97">evaluate</text></g>
<g id="step-2"><rect class="panel-a" x="280" y="30" width="216" height="80" rx="8"/><text class="h" x="294" y="58">Step 2</text><text class="cell" x="294" y="80">List the NCP SLOs it</text><text class="cell" x="294" y="97">should cover</text></g>
<g id="step-3"><rect class="panel-a" x="530" y="30" width="216" height="80" rx="8"/><text class="h" x="544" y="58">Step 3</text><text class="cell" x="544" y="80">Read the chapter against</text><text class="cell" x="544" y="97">the six criteria</text></g>

<g id="step-4"><rect class="panel-a" x="30" y="170" width="216" height="80" rx="8"/><text class="h" x="44" y="198">Step 4</text><text class="cell" x="44" y="220">Score each criterion</text><text class="cell" x="44" y="237">(strong / adequate / weak)</text></g>
<g id="step-5"><rect class="panel-a" x="280" y="170" width="216" height="80" rx="8"/><text class="h" x="294" y="198">Step 5</text><text class="cell" x="294" y="220">Note specific evidence</text><text class="cell" x="294" y="237">for each score</text></g>
<g id="step-6"><rect class="panel-b" x="530" y="170" width="216" height="80" rx="8"/><text class="h" x="544" y="198">Step 6</text><text class="cell" x="544" y="220">Write a summary judgement</text><text class="cell" x="544" y="237">and suggest improvements</text></g>
</g><g id="layer-labels">
<text class="small" x="24" y="300">Systematic evaluation enables teachers to identify gaps and supplement textbook limitations.</text>
</g><text class="wm" x="768" y="325" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>