<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of cross-subject connections for an ecosystems topic</title><desc id="d">Concept map showing a Grade 7 science topic on ecosystems linked to mathematics through data and graphs, to languages through writing, to social studies through the social impact of deforestation, and to Islamiat through the concept of stewardship.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-edges">
<line class="stroke" x1="390" y1="210" x2="390" y2="108" marker-end="url(#arrow)"/>
<line class="stroke" x1="510" y1="250" x2="520" y2="250" marker-end="url(#arrow)"/>
<line class="stroke" x1="390" y1="290" x2="390" y2="382" marker-end="url(#arrow)"/>
<line class="stroke" x1="270" y1="250" x2="260" y2="250" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="node-math"><rect class="panel-a" x="260" y="26" width="260" height="80" rx="8"/><text class="h" x="274" y="52">Mathematics</text><text class="cell" x="274" y="73">Data: pupils measure tree height</text><text class="cell" x="274" y="90">and plot a bar chart</text></g>
<g id="node-lang"><rect class="panel-a" x="520" y="210" width="240" height="80" rx="8"/><text class="sh" x="534" y="236">Languages (Urdu/English)</text><text class="cell" x="534" y="257">Writing: pupils write a paragraph</text><text class="cell" x="534" y="274">describing garden food web</text></g>
<g id="node-isl"><rect class="panel-a" x="260" y="384" width="260" height="80" rx="8"/><text class="h" x="274" y="410">Islamiat</text><text class="cell" x="274" y="431">Ethics: stewardship (khalifah) in</text><text class="cell" x="274" y="448">caring for the environment</text></g>
<g id="node-soc"><rect class="panel-a" x="20" y="210" width="240" height="80" rx="8"/><text class="h" x="34" y="236">Social Studies</text><text class="cell" x="34" y="257">Society: pupils discuss why</text><text class="cell" x="34" y="274">deforestation increases flooding</text></g>

<g id="node-center"><ellipse class="panel-b" cx="390" cy="250" rx="116" ry="38"/><text class="h" x="390" y="246" text-anchor="middle">A Grade 7 science</text><text class="h" x="390" y="264" text-anchor="middle">topic: Ecosystems</text></g>
</g><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>