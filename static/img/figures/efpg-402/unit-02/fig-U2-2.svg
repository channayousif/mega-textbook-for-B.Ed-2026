<text class="sh" x="36" y="49">Principle</text>
<text class="sh" x="182" y="49">How the NCP 2022-23 Science curriculum shows it</text>
<text class="sh" x="36" y="96">Child-centred</text>
<text class="cell" x="182" y="96">Different SLOs for each grade; concepts grow deeper from Grade 4 to Grade 8</text>
<text class="sh" x="36" y="150">Activity-based</text>
<text class="cell" x="182" y="142">Scientific Enquiry strand runs through every grade; sample</text>
<text class="cell" x="182" y="159">activities are provided in every content domain</text>
<text class="sh" x="36" y="204">Relevant</text>
<text class="cell" x="182" y="196">Science in Context strand: recognise the importance of science and technology</text>
<text class="cell" x="182" y="213">to solve everyday problems in the local community</text>
<text class="sh" x="36" y="258">Flexible</text>
<text class="cell" x="182" y="258">National framework adopted and adapted by provinces such as Sindh (DCAR)</text>
<text class="sh" x="36" y="312">Integrated</text>
<text class="cell" x="182" y="304">Links to mathematics in data handling; links to social studies in environment</text>
<text class="cell" x="182" y="321">and health education across grade levels</text>
</g><text class="wm" x="768" y="360" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>