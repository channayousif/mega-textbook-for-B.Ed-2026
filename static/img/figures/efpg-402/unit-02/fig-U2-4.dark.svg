<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of curriculum levels from national policy to classroom</title><desc id="d">Diagram showing four levels from national curriculum to provincial adoption to textbook to classroom lesson, with a feedback arrow from the classroom back to the curriculum level.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.stroke { stroke: var(--ink); stroke-width: 2; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.plain { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.ah { fill: var(--ink); }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-edges">
<line class="stroke" x1="330" y1="92" x2="330" y2="128" marker-end="url(#arrow)"/>
<line class="stroke" x1="330" y1="192" x2="330" y2="228" marker-end="url(#arrow)"/>
<line class="stroke" x1="330" y1="292" x2="330" y2="328" marker-end="url(#arrow)"/>
<path class="dash" d="M 660,360 L 730,360 L 730,62 L 660,62" marker-end="url(#arrow)"/>
</g><g id="layer-nodes">
<g id="box-1"><rect class="panel-a" x="40" y="30" width="620" height="62" rx="8"/><text class="h" x="54" y="54">1. National Curriculum (NCP 2022-23)</text><text class="cell" x="54" y="75">sets broad aims, content domains, standards and student learning outcomes (SLOs)</text></g>
<g id="box-2"><rect class="panel-a" x="40" y="130" width="620" height="62" rx="8"/><text class="h" x="54" y="154">2. Provincial adoption (DCAR Sindh)</text><text class="cell" x="54" y="175">adapts national framework and adds provincial context and local learning needs</text></g>
<g id="box-3"><rect class="panel-a" x="40" y="230" width="620" height="62" rx="8"/><text class="h" x="54" y="254">3. Textbook (Sindh Textbook Board)</text><text class="cell" x="54" y="275">translates SLOs into chapters, narratives, activities and end-of-unit assessments</text></g>
<g id="box-4"><rect class="panel-b" x="40" y="330" width="620" height="62" rx="8"/><text class="h" x="54" y="354">4. Classroom lesson</text><text class="cell" x="54" y="375">teacher uses textbook and hands-on activities to help pupils achieve SLOs</text></g>
</g><g id="layer-labels">
<text class="small" x="730" y="200" text-anchor="middle">feedback</text>
<text class="small" x="730" y="217" text-anchor="middle">on pupil</text>
<text class="small" x="730" y="234" text-anchor="middle">learning</text>
<text class="small" x="24" y="435">The four levels connect national policy to daily instruction in the classroom.</text>
</g><text class="wm" x="768" y="455" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>