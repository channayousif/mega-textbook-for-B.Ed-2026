<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Co-operation structures against group size and noise cost</title><desc id="d">Table comparing co-operation structures against group size and noise cost: think-pair-share, round-robin, jigsaw, and numbered heads, each matched to a group size and a noise level.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="200" height="70"/><text class="h" x="100" y="30" text-anchor="middle">Structure</text><text class="small" x="100" y="52" text-anchor="middle">the arrangement</text><rect class="panel-b" x="200" y="0" width="280" height="70"/><text class="h" x="340" y="30" text-anchor="middle">Group size</text><text class="small" x="340" y="52" text-anchor="middle">how many in each group</text><rect class="panel-c" x="480" y="0" width="300" height="70"/><text class="h" x="630" y="30" text-anchor="middle">Noise cost</text><text class="small" x="630" y="52" text-anchor="middle">the management price</text><rect class="panel" x="0" y="70" width="200" height="90"/><text class="sh" x="100" y="115" text-anchor="middle">Think-pair-share</text><rect class="panel" x="0" y="160" width="200" height="90"/><text class="sh" x="100" y="205" text-anchor="middle">Round-robin</text><rect class="panel" x="0" y="250" width="200" height="90"/><text class="sh" x="100" y="295" text-anchor="middle">Jigsaw</text><rect class="panel" x="0" y="340" width="200" height="90"/><text class="sh" x="100" y="385" text-anchor="middle">Numbered heads</text><text class="body" x="340" y="115" text-anchor="middle">2 (pair)</text><text class="body" x="340" y="205" text-anchor="middle">3 to 5</text><text class="body" x="340" y="295" text-anchor="middle">4 to 6</text><text class="body" x="340" y="385" text-anchor="middle">3 to 5</text><text class="body" x="630" y="115" text-anchor="middle">low - quiet, works</text><text class="body" x="630" y="135" text-anchor="middle">in any size of class</text><text class="body" x="630" y="205" text-anchor="middle">low - structured</text><text class="body" x="630" y="225" text-anchor="middle">turn-taking</text><text class="body" x="630" y="295" text-anchor="middle">moderate - groups</text><text class="body" x="630" y="315" text-anchor="middle">work simultaneously</text><text class="body" x="630" y="385" text-anchor="middle">low - individual</text><text class="body" x="630" y="405" text-anchor="middle">accountability built in</text><line class="grid" x1="200" y1="0" x2="200" y2="470"/><line class="grid" x1="480" y1="0" x2="480" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="160" x2="780" y2="160"/><line class="grid" x1="0" y1="250" x2="780" y2="250"/><line class="grid" x1="0" y1="340" x2="780" y2="340"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
