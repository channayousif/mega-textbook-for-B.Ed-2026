<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A well-managed classroom and its features</title><desc id="d">A concept map with a well-managed classroom at the centre, linked by solid lines to its four observable features and by dashed lines to what it is commonly confused with: a silent classroom, a rule-heavy classroom, and a classroom where nothing goes wrong.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-d{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 4} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><ellipse cx="390" cy="235" rx="130" ry="60" class="panel-a"/><text class="h" x="390" y="228" text-anchor="middle">A well-managed</text><text class="h" x="390" y="250" text-anchor="middle">classroom</text><rect class="panel" x="40" y="40" width="200" height="70" rx="8"/><text class="body" x="140" y="75" text-anchor="middle">Routines are in place</text><text class="body" x="140" y="95" text-anchor="middle">and practised</text><rect class="panel" x="540" y="40" width="200" height="70" rx="8"/><text class="body" x="640" y="75" text-anchor="middle">High intellectual</text><text class="body" x="640" y="95" text-anchor="middle">demand, low disruption</text><rect class="panel" x="40" y="360" width="200" height="70" rx="8"/><text class="body" x="140" y="395" text-anchor="middle">Teacher withitness:</text><text class="body" x="140" y="415" text-anchor="middle">watches the whole room</text><rect class="panel" x="540" y="360" width="200" height="70" rx="8"/><text class="body" x="640" y="395" text-anchor="middle">Environment supports</text><text class="body" x="640" y="415" text-anchor="middle">the intended learning</text><rect class="panel-b" x="30" y="150" width="180" height="50" rx="8"/><text class="small" x="120" y="180" text-anchor="middle">commonly confused with:</text><text class="small" x="120" y="198" text-anchor="middle">a silent classroom</text><rect class="panel-c" x="30" y="240" width="180" height="50" rx="8"/><text class="small" x="120" y="260" text-anchor="middle">commonly confused with:</text><text class="small" x="120" y="278" text-anchor="middle">a rule-heavy classroom</text><rect class="panel-d" x="570" y="150" width="180" height="50" rx="8"/><text class="small" x="660" y="170" text-anchor="middle">commonly confused with:</text><text class="small" x="660" y="188" text-anchor="middle">nothing unexpected</text><text class="small" x="660" y="206" text-anchor="middle">ever happens</text><line class="stroke" x1="240" y1="75" x2="290" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="75" x2="490" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="240" y1="395" x2="290" y2="250" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="395" x2="490" y2="250" marker-end="url(#arrow)"/><line class="stroke-d" x1="210" y1="175" x2="300" y2="220"/><line class="stroke-d" x1="210" y1="265" x2="300" y2="240"/><line class="stroke-d" x1="570" y1="175" x2="480" y2="220"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
