<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Classroom management and classroom discipline compared</title><desc id="d">Table comparing classroom management and classroom discipline by purpose, timing, what each acts on, and what success looks like.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="400"/><rect class="panel-a" x="0" y="0" width="390" height="70"/><text class="h" x="195" y="30" text-anchor="middle">Classroom management</text><text class="small" x="195" y="52" text-anchor="middle">proactive - creates the conditions for learning</text><rect class="panel-b" x="390" y="0" width="390" height="70"/><text class="h" x="585" y="30" text-anchor="middle">Classroom discipline</text><text class="small" x="585" y="52" text-anchor="middle">reactive - responds to a breach of norms</text><rect class="panel" x="0" y="70" width="130" height="110"/><text class="sh" x="65" y="110" text-anchor="middle">Its purpose</text><rect class="panel" x="0" y="180" width="130" height="110"/><text class="sh" x="65" y="220" text-anchor="middle">When it acts</text><rect class="panel" x="0" y="290" width="130" height="110"/><text class="sh" x="65" y="325" text-anchor="middle">What it</text><text class="sh" x="65" y="345" text-anchor="middle">acts on</text><text class="body" x="260" y="115" text-anchor="middle">Maximise the time</text><text class="body" x="260" y="135" text-anchor="middle">spent learning</text><text class="body" x="260" y="225" text-anchor="middle">Before and during</text><text class="body" x="260" y="245" text-anchor="middle">the lesson</text><text class="body" x="260" y="335" text-anchor="middle">The environment,</text><text class="body" x="260" y="355" text-anchor="middle">the lesson structure</text><text class="body" x="520" y="115" text-anchor="middle">Restore a norm</text><text class="body" x="520" y="135" text-anchor="middle">that was broken</text><text class="body" x="520" y="225" text-anchor="middle">After a pupil</text><text class="body" x="520" y="245" text-anchor="middle">breaches a norm</text><text class="body" x="520" y="335" text-anchor="middle">The individual</text><text class="body" x="520" y="355" text-anchor="middle">pupil's behaviour</text><rect class="panel" x="0" y="180" width="130" height="110"/><rect class="panel" x="0" y="290" width="130" height="110"/><line class="grid" x1="130" y1="0" x2="130" y2="400"/><line class="grid" x1="390" y1="0" x2="390" y2="400"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="180" x2="780" y2="180"/><line class="grid" x1="0" y1="290" x2="780" y2="290"/><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
