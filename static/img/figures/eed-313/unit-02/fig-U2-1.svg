<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Curriculum decisions and their management pressure</title><desc id="d">A concept map with curriculum decisions at the centre and four branches showing the management pressure each decision relieves or creates: choosing content, sequencing, pacing, and grouping.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="panel-a" cx="390" cy="235" rx="120" ry="55"/><text class="h" x="390" y="230" text-anchor="middle">Curriculum</text><text class="h" x="390" y="252" text-anchor="middle">decisions</text><rect class="panel-b" x="290" y="30" width="200" height="70" rx="6"/><text class="sh" x="390" y="58" text-anchor="middle">Choosing content</text><text class="small" x="390" y="80" text-anchor="middle">prevents rushed coverage</text><rect class="panel-c" x="560" y="180" width="200" height="70" rx="6"/><text class="sh" x="660" y="208" text-anchor="middle">Sequencing</text><text class="small" x="660" y="230" text-anchor="middle">keeps the thread</text><rect class="panel-d" x="290" y="370" width="200" height="70" rx="6"/><text class="sh" x="390" y="398" text-anchor="middle">Pacing</text><text class="small" x="390" y="420" text-anchor="middle">avoids bored or lost pupils</text><rect class="panel-a" x="20" y="180" width="200" height="70" rx="6"/><text class="sh" x="120" y="208" text-anchor="middle">Grouping</text><text class="small" x="120" y="230" text-anchor="middle">matches arrangement to task</text><line class="stroke" x1="390" y1="100" x2="390" y2="175" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="215" x2="475" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="370" x2="390" y2="295" marker-end="url(#arrow)"/><line class="stroke" x1="220" y1="215" x2="300" y2="215" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
