<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the greenhouse effect</title><desc id="d">Diagram of the greenhouse effect, shortwave sunlight in, longwave heat out, greenhouse gases trapping part of it, with natural and enhanced panels</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The glass and the extra panes</text><circle class="panel-c" cx="690" cy="90" r="34"/><text class="sh" x="690" y="96" text-anchor="middle">sun</text><rect class="panel" x="40" y="380" width="700" height="40"/><text class="sh" x="390" y="406" text-anchor="middle">the Earth surface, warmed by the sunlight</text><rect class="panel-a" x="40" y="200" width="700" height="46"/><text class="sh" x="390" y="222" text-anchor="middle">greenhouse gases: water vapour, CO2, methane, N2O</text><text class="small" x="390" y="240" text-anchor="middle">let sunlight through, absorb part of the outgoing heat</text><text class="small" x="160" y="190" text-anchor="start">short-wave sunlight in</text><text class="small" x="580" y="300" text-anchor="start">long-wave heat out</text><text class="small" x="330" y="340" text-anchor="start">part returned down</text><rect class="panel" x="40" y="60" width="340" height="120"/><text class="sh" x="56" y="86" text-anchor="start">Natural balance (the glass)</text><text class="body" x="56" y="110" text-anchor="start">Without the natural effect,</text><text class="body" x="56" y="130" text-anchor="start">the Earth would average far</text><text class="body" x="56" y="150" text-anchor="start">below freezing. The glass</text><text class="body" x="56" y="170" text-anchor="start">keeps the room alive.</text><rect class="panel-d" x="420" y="60" width="335" height="120"/><text class="sh" x="436" y="86" text-anchor="start">Enhanced (the extra panes)</text><text class="body" x="436" y="110" text-anchor="start">Fossil fuels and deforestation</text><text class="body" x="436" y="130" text-anchor="start">thicken the band: more gas,</text><text class="body" x="436" y="150" text-anchor="start">more heat, a warmer world.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>