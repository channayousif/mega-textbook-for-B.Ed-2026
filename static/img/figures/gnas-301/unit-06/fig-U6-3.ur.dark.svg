<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زہریلے مادوں کے اثر کی اقسام</title><desc id="d">اثر کی اقسام کا جدول: تعریف، ایک مثال اور شناخت یا بچاؤ</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">اثر کی اقسام</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">اثر کی قسم</text><text class="h" x="590" y="75" text-anchor="end">تعریف ایک سطر میں</text><text class="h" x="380" y="75" text-anchor="end">ایک مثال</text><text class="h" x="220" y="75" text-anchor="end">شناخت / بچاؤ</text><rect class="panel-a" x="26" y="88" width="728" height="44"/><text class="sh" x="740" y="114" text-anchor="end">حاد</text><text class="body" x="590" y="114" text-anchor="end">جلد، ایک رابطے کے بعد</text><text class="body" x="380" y="114" text-anchor="end">چھڑکنے والے کا گرنا</text><text class="body" x="190" y="114" text-anchor="end">تریاق کی گھڑی، فرسٹ ایڈ</text><rect class="panel-b" x="26" y="132" width="728" height="44"/><text class="sh" x="740" y="158" text-anchor="end">دائمی</text><text class="body" x="590" y="158" text-anchor="end">آہستہ، برسوں پر</text><text class="body" x="380" y="158" text-anchor="end">تیس سالہ کنواں</text><text class="body" x="190" y="158" text-anchor="end">جانچ کی گھڑی، اسکریننگ</text><rect class="panel-c" x="26" y="176" width="728" height="44"/><text class="sh" x="740" y="202" text-anchor="end">جین پر اثر</text><text class="body" x="590" y="202" text-anchor="end">ڈی این اے خراب کرتا</text><text class="body" x="380" y="202" text-anchor="end">آرسینک، تابکاری</text><text class="body" x="190" y="202" text-anchor="end">واقفیت مکمل ٹالیں</text><rect class="panel-d" x="26" y="220" width="728" height="44"/><text class="sh" x="740" y="246" text-anchor="end">میوٹاجن</text><text class="body" x="590" y="246" text-anchor="end">ڈی این اے کی ترتیب بدلتا</text><text class="body" x="380" y="246" text-anchor="end">کچھ کیمیکل، الٹرا وائلٹ</text><text class="body" x="190" y="246" text-anchor="end">کوئی محفوظ سطح معلوم نہیں</text><rect class="panel" x="26" y="264" width="728" height="44"/><text class="sh" x="740" y="290" text-anchor="end">ٹیراٹوجن</text><text class="body" x="590" y="290" text-anchor="end">ناجائز بچے کو نقصان</text><text class="body" x="380" y="290" text-anchor="end">شراب، بعض دوائیں</text><text class="body" x="190" y="290" text-anchor="end">وقت کی منطق، وارننگ</text><rect class="panel" x="26" y="308" width="728" height="44"/><text class="sh" x="740" y="334" text-anchor="end">سرطان پیدا کرنے والا</text><text class="body" x="590" y="334" text-anchor="end">سرطان شروع کرتا</text><text class="body" x="380" y="334" text-anchor="end">ایسبیسٹوس، تمباکو</text><text class="body" x="190" y="334" text-anchor="end">پابندی، متبادل، اسکریننگ</text><rect class="panel" x="26" y="352" width="728" height="44"/><text class="sh" x="740" y="378" text-anchor="end">حساس بنانے والا</text><text class="body" x="590" y="378" text-anchor="end">مدافعت سکھاتا</text><text class="body" x="380" y="378" text-anchor="end">سالوینٹ، لیٹیکس</text><text class="body" x="190" y="378" text-anchor="end">پہلے سکھاتا، بعد میں حملہ</text><text class="small" x="390" y="418" text-anchor="middle">اقسام جواب طے کرتی ہیں: حاد کے لیے تریاق، دائمی کے لیے اسکریننگ۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
