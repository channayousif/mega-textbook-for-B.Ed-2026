<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Mitigation versus adaptation</title><desc id="d">Table comparing mitigation and adaptation with what each answers, Pakistani examples and the school-scale version of each</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Mitigation versus adaptation</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75"></text><text class="h" x="190" y="75">What it answers</text><text class="h" x="420" y="75">Pakistani examples</text><text class="h" x="590" y="75">School-scale version</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="40" y="114">Mitigation</text><text class="body" x="190" y="114">how we stop feeding the</text><text class="body" x="190" y="133">future crisis</text><text class="body" x="420" y="114">renewable energy, tree</text><text class="body" x="420" y="133">plantation, clean transport</text><text class="body" x="590" y="114">energy saving, solar</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="40" y="202">Adaptation</text><text class="body" x="190" y="202">how we soften the harms</text><text class="body" x="190" y="221">already arriving</text><text class="body" x="420" y="202">heat-action plans, flood-proof</text><text class="body" x="420" y="221">schools, early warning</text><text class="body" x="590" y="202">shade, water, drills</text><text class="small" x="390" y="286" text-anchor="middle">Pakistan photographs both: the 2015 heatwave answers to adaptation, the 2022 floods to both.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
