<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کمی بمقابلہ موافقت</title><desc id="d">کمی اور موافقت کا موازنہ: ہر ایک کا سوال، پاکستانی مثالیں اور اسکول پیمانے کا روپ</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">کمی بمقابلہ موافقت</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end"></text><text class="h" x="590" y="75" text-anchor="end">کس کا جواب</text><text class="h" x="360" y="75" text-anchor="end">پاکستانی مثالیں</text><text class="h" x="190" y="75" text-anchor="end">اسکول پیمانہ</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="740" y="114" text-anchor="end">کمی</text><text class="body" x="590" y="114" text-anchor="end">مستقبل کے بحران کو</text><text class="body" x="590" y="133" text-anchor="end">پالنے سے کیسے رکیں</text><text class="body" x="360" y="114" text-anchor="end">قابلِ تجدید توانائی، درخت</text><text class="body" x="360" y="133" text-anchor="end">لگاؤ، صاف ٹرانسپورٹ</text><text class="body" x="190" y="114" text-anchor="end">توانائی بچاؤ، سولر</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="740" y="202" text-anchor="end">موافقت</text><text class="body" x="590" y="202" text-anchor="end">پہنچتے نقصان کو</text><text class="body" x="590" y="221" text-anchor="end">پالنے سے نرم کریں</text><text class="body" x="360" y="202" text-anchor="end">گرمی منصوبے، سیل سے محفوظ</text><text class="body" x="360" y="221" text-anchor="end">اسکول، ابتدائی انتباہ</text><text class="body" x="190" y="202" text-anchor="end">سایہ، پانی، مشقیں</text><text class="small" x="390" y="286" text-anchor="middle">پاکستان دونوں تصویریں رکھتا ہے: 2015 کی گرمی موافقت کی، 2022 کا سیلاب دونوں کی۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
