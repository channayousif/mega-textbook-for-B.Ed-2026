<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سلفری بمقابلہ فوٹو کیمیکل سموگ</title><desc id="d">سلفری اور فوٹو کیمیکل سموگ کا موازنہ: اسباب، صحتی اثرات اور قابو</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">سلفری بمقابلہ فوٹو کیمیکل سموگ</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">قسم</text><text class="h" x="580" y="75" text-anchor="end">اسباب ایک سطر میں</text><text class="h" x="350" y="75" text-anchor="end">صحتی اثرات</text><text class="h" x="180" y="75" text-anchor="end">قابو کے اقدامات</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="740" y="114" text-anchor="end">سلفری</text><text class="body" x="580" y="114" text-anchor="end">کوئلہ اور کچرا جلانا</text><text class="body" x="580" y="133" text-anchor="end">سردیوں کے الٹے دباؤ میں</text><text class="body" x="350" y="114" text-anchor="end">سانس نالی سوزش،</text><text class="body" x="350" y="133" text-anchor="end">دل کی بیماری، دمہ عروج</text><text class="body" x="180" y="114" text-anchor="end">صاف ایندھن، بھٹے بہتری</text><text class="body" x="180" y="133" text-anchor="end">جلانے پر پابندی</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="740" y="202" text-anchor="end">فوٹو کیمیکل</text><text class="body" x="580" y="202" text-anchor="end">ٹریفک اور صنعت</text><text class="body" x="580" y="221" text-anchor="end">دھوپ میں پکا اخراج</text><text class="body" x="350" y="202" text-anchor="end">اوزون پھیپھڑوں میں جلن،</text><text class="body" x="350" y="221" text-anchor="end">گرم دوپہروں بدتر</text><text class="body" x="180" y="202" text-anchor="end">انجن معیار؛</text><text class="body" x="180" y="221" text-anchor="end">اے کیو آئی نگرانی</text><text class="small" x="390" y="286" text-anchor="middle">راستہ صاف نہیں ہو سکتا: دیانتدارانہ جواب ذریعہ اور وصول کنندہ ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
