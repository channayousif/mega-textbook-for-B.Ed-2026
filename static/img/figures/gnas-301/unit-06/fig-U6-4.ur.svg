<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دو خوراک-جواب منحنیوں کا خاکہ</title><desc id="d">دو خوراک-جواب منحنیوں کا خاکہ: ایک آستانے کے ساتھ اور محفوظ علاقہ، ایک بغیر کسی معلوم محفوظ سطح کے، جین زہریلی قسم کے لیے</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">خوراک-جواب: دو تصویریں</text><rect class="panel-a" x="410" y="60" width="330" height="300" rx="10"/><text class="sh" x="575" y="88" text-anchor="middle">آستانے والی منحنی (زیادہ تر اثرات)</text><line class="stroke" x1="700" y1="320" x2="450" y2="320"/><line class="stroke" x1="700" y1="320" x2="700" y2="100"/><path class="stroke-a" d="M700 320 L600 320 Q540 320 500 220 L460 110"/><line class="stroke" x1="600" y1="320" x2="600" y2="100" stroke-dasharray="5 4"/><text class="small" x="650" y="344" text-anchor="end">خوراک</text><text class="small" x="720" y="210" transform="rotate(-90 60 210)" text-anchor="end">نقصان</text><text class="small" x="650" y="308" text-anchor="middle">محفوظ علاقہ</text><text class="small" x="575" y="380" text-anchor="middle">حد سے نیچے جسم خود مرمت کرتا ہے</text><rect class="panel-d" x="40" y="60" width="330" height="300" rx="10"/><text class="sh" x="205" y="88" text-anchor="middle">بغیر حد منحنی (جین زہریلی قسم)</text><line class="stroke" x1="330" y1="320" x2="80" y2="320"/><line class="stroke" x1="330" y1="320" x2="330" y2="100"/><line class="stroke-a" x1="330" y1="320" x2="80" y2="110"/><text class="small" x="205" y="344" text-anchor="middle">خوراک</text><text class="small" x="350" y="210" transform="rotate(-90 430 210)" text-anchor="end">نقصان</text><text class="small" x="205" y="290" text-anchor="middle">کوئی محفوظ سطح معلوم نہیں</text><text class="small" x="205" y="380" text-anchor="middle">قانون اسے بغیر سطح سختی سے دیکھتا ہے</text><text class="small" x="390" y="420" text-anchor="middle">منحنی آبادی کا خلاصہ ہے؛ نا پیدا ہونے والا بچہ اور حساس کارکن اوسط سے دور بیٹھا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
