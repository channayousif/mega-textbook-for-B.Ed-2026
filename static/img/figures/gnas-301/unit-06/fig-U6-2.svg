<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six classes of toxic substances</title><desc id="d">Table of six classes of toxic substances with examples, origin and one property that matters for each</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Six classes of toxic substances</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Class</text><text class="h" x="200" y="75">Examples</text><text class="h" x="430" y="75">Origin</text><text class="h" x="560" y="75">Property that matters</text><rect class="panel-a" x="26" y="88" width="728" height="52"/><text class="sh" x="40" y="114">Pesticides</text><text class="body" x="200" y="114">cotton sprays, store rat poison</text><text class="body" x="430" y="114">anthropogenic</text><text class="body" x="560" y="114">designed to kill</text><rect class="panel-b" x="26" y="140" width="728" height="52"/><text class="sh" x="40" y="166">Heavy metals</text><text class="body" x="200" y="166">lead, arsenic, mercury</text><text class="body" x="430" y="166">both</text><text class="body" x="560" y="166">never break down</text><rect class="panel-c" x="26" y="192" width="728" height="52"/><text class="sh" x="40" y="218">Solvents</text><text class="body" x="200" y="218">paint thinner, dry-cleaning</text><text class="body" x="430" y="218">anthropogenic</text><text class="body" x="560" y="218">dissolve fat</text><rect class="panel-d" x="26" y="244" width="728" height="52"/><text class="sh" x="40" y="270">Natural toxins</text><text class="body" x="200" y="270">snake venom, plant alkaloids</text><text class="body" x="430" y="270">natural</text><text class="body" x="560" y="270">fast-acting</text><rect class="panel" x="26" y="296" width="728" height="52"/><text class="sh" x="40" y="322">Drugs</text><text class="body" x="200" y="322">medicine at the wrong dose</text><text class="body" x="430" y="322">anthropogenic</text><text class="body" x="560" y="322">dose decides poison</text><rect class="panel" x="26" y="348" width="728" height="52"/><text class="sh" x="40" y="374">Household chemicals</text><text class="body" x="200" y="374">cleaners, bleach, acids</text><text class="body" x="430" y="374">anthropogenic</text><text class="body" x="560" y="374">stored in reach</text><text class="small" x="390" y="422" text-anchor="middle">The origin axis decides the control: made poisons can be banned, natural ones only managed.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
