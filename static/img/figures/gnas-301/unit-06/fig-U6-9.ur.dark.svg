<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سموگ کی تشکیل کا خاکہ</title><desc id="d">سموگ کی تشکیل کا خاکہ: دو پینل، سردیوں کا سلفری سموگ الٹے دباؤ میں کوئلے اور کچرے کے دھوئیں سے، اور گرمیوں کا فوٹو کیمیکل سموگ ٹریفک کے اخراج سے دھوپ میں اوزون بن کر</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">سموگ کی دو قسمیں، دو موسم</text><rect class="panel-b" x="395" y="60" width="355" height="330" rx="10"/><text class="sh" x="573" y="88" text-anchor="middle">سردی: سلفری سموگ</text><line class="stroke" x1="720" y1="130" x2="425" y2="130"/><text class="small" x="573" y="122" text-anchor="middle">گرم ڈھکن (الٹا دباؤ)</text><rect class="panel-c" x="650" y="240" width="80" height="26" rx="4"/><text class="small" x="690" y="258" text-anchor="middle">کوئلے کا دھواں</text><rect class="panel-c" x="530" y="270" width="80" height="26" rx="4"/><text class="small" x="570" y="288" text-anchor="middle">کچرا جلانا</text><rect class="panel-c" x="440" y="300" width="80" height="26" rx="4"/><text class="small" x="480" y="318" text-anchor="middle">بھٹا</text><rect class="panel" x="425" y="330" width="295" height="40"/><text class="small" x="573" y="355" text-anchor="middle">دھند + SO2 + ذرات، ڈھکن کے نیچے قید</text><rect class="panel-c" x="30" y="60" width="335" height="330" rx="10"/><text class="sh" x="198" y="88" text-anchor="middle">گرمی: فوٹو کیمیکل سموگ</text><circle class="panel-d" cx="198" cy="140" r="26"/><text class="sh" x="198" y="146" text-anchor="middle">سورج</text><line class="stroke" x1="198" y1="170" x2="198" y2="230" marker-end="url(#arrow)"/><text class="small" x="198" y="205" text-anchor="middle">دھوپ اخراج کو پکاتی ہے</text><rect class="panel-b" x="70" y="240" width="255" height="30" rx="4"/><text class="small" x="198" y="260" text-anchor="middle">ٹریفک + صنعتی اخراج</text><line class="stroke" x1="198" y1="274" x2="198" y2="300" marker-end="url(#arrow)"/><rect class="panel-d" x="70" y="304" width="255" height="30" rx="4"/><text class="small" x="198" y="324" text-anchor="middle">اوزون + دھند (ثانوی آلودگی)</text><text class="small" x="390" y="424" text-anchor="middle">لاہور کی سردی: زیادہ تر سلفری، الٹے دباؤ میں، فوٹو کیمیکل باقیوں کے ساتھ۔</text><text class="small" x="390" y="444" text-anchor="middle">ساکن دنوں پر بدتر: ڈھکن بیٹھا، سورج پکاتا، شہر اپنا اخراج سانس لیتا۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
