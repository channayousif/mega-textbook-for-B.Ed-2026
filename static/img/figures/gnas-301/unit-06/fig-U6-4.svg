<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of two dose-response curves</title><desc id="d">Diagram of two dose-response curves, one with a threshold and safe zone, one without a known safe level, as drawn for the genotoxic class</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Dose-response: two pictures</text><rect class="panel-a" x="40" y="60" width="330" height="300" rx="10"/><text class="sh" x="205" y="88" text-anchor="middle">threshold curve (most effects)</text><line class="stroke" x1="80" y1="320" x2="330" y2="320"/><line class="stroke" x1="80" y1="320" x2="80" y2="100"/><path class="stroke-a" d="M 80 320 L 180 320 Q 240 320 280 220 L 320 110"/><line class="stroke" x1="180" y1="320" x2="180" y2="100" stroke-dasharray="5 4"/><text class="small" x="130" y="344">dose</text><text class="small" x="60" y="210" transform="rotate(-90 60 210)">harm</text><text class="small" x="130" y="308" text-anchor="middle">safe zone</text><text class="small" x="205" y="380" text-anchor="middle">below the threshold, the body repairs</text><rect class="panel-d" x="410" y="60" width="330" height="300" rx="10"/><text class="sh" x="575" y="88" text-anchor="middle">no-threshold curve (genotoxic class)</text><line class="stroke" x1="450" y1="320" x2="700" y2="320"/><line class="stroke" x1="450" y1="320" x2="450" y2="100"/><line class="stroke-a" x1="450" y1="320" x2="700" y2="110"/><text class="small" x="575" y="344" text-anchor="middle">dose</text><text class="small" x="430" y="210" transform="rotate(-90 430 210)">harm</text><text class="small" x="575" y="290" text-anchor="middle">no known safe level</text><text class="small" x="575" y="380" text-anchor="middle">regulation treats it with no-level strictness</text><text class="small" x="390" y="420" text-anchor="middle">The curves summarise populations; the unborn child and the sensitized worker sit far from the average.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
