<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of bioaccumulation and bio-magnification up a lake food chain</title><desc id="d">Diagram of bioaccumulation and bio-magnification up a four-step lake food chain, plankton, small fish, large fish and the fishing family, with the concentration rising at each step</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The chain is a multiplier, not a mirror</text><rect class="panel-a" x="40" y="300" width="160" height="96" rx="8"/><text class="sh" x="120" y="328" text-anchor="middle">plankton</text><text class="small" x="120" y="350" text-anchor="middle">trace in water</text><text class="h" x="120" y="378" text-anchor="middle">x 1</text><rect class="panel-b" x="225" y="250" width="160" height="96" rx="8"/><text class="sh" x="305" y="278" text-anchor="middle">small fish</text><text class="small" x="305" y="300" text-anchor="middle">eats many plankton</text><text class="h" x="305" y="328" text-anchor="middle">x 10</text><rect class="panel-c" x="410" y="200" width="160" height="96" rx="8"/><text class="sh" x="490" y="228" text-anchor="middle">large fish</text><text class="small" x="490" y="250" text-anchor="middle">eats many small fish</text><text class="h" x="490" y="278" text-anchor="middle">x 100</text><rect class="panel-d" x="595" y="150" width="160" height="96" rx="8"/><text class="sh" x="675" y="178" text-anchor="middle">fishing family</text><text class="small" x="675" y="200" text-anchor="middle">eats the big fish</text><text class="h" x="675" y="228" text-anchor="middle">the dose</text><line class="stroke" x1="200" y1="330" x2="243" y2="310" marker-end="url(#arrow)"/><line class="stroke" x1="385" y1="280" x2="428" y2="260" marker-end="url(#arrow)"/><line class="stroke" x1="570" y1="230" x2="613" y2="210" marker-end="url(#arrow)"/><rect class="panel" x="40" y="60" width="715" height="90" rx="8"/><text class="sh" x="56" y="86">Two words, two scales</text><text class="body" x="56" y="110">Bioaccumulation: what enters faster than it leaves builds up within one organism.</text><text class="body" x="56" y="132">Bio-magnification: up the chain, a trace in the water becomes a dose in the family.</text><text class="small" x="390" y="430" text-anchor="middle">Why the top predators, birds of prey, big fish, and people, are the monitoring stations of environmental poisoning.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
