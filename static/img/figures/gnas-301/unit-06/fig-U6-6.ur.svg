<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جھیل کی غذائی زنجیر میں حیاتیاتی جمع اور افزائش کا خاکہ</title><desc id="d">جھیل کی چار مرحلوں والی غذائی زنجیر کا خاکہ: پلانکٹن، چھوٹی مچھلی، بڑی مچھلی اور ماہی گیر خاندان، ہر مرحلے پر ارتکاز بڑھتی ہے</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">زنجیر ایک ضرب دینے والا ہے، آئینہ نہیں</text><rect class="panel-a" x="580" y="300" width="160" height="96" rx="8"/><text class="sh" x="660" y="328" text-anchor="middle">پلانکٹن</text><text class="small" x="660" y="350" text-anchor="middle">پانی میں سراغ</text><text class="h" x="660" y="378" text-anchor="middle">x 1</text><rect class="panel-b" x="395" y="250" width="160" height="96" rx="8"/><text class="sh" x="475" y="278" text-anchor="middle">چھوٹی مچھلی</text><text class="small" x="475" y="300" text-anchor="middle">بہت پلانکٹن کھاتا</text><text class="h" x="475" y="328" text-anchor="middle">x 10</text><rect class="panel-c" x="210" y="200" width="160" height="96" rx="8"/><text class="sh" x="290" y="228" text-anchor="middle">بڑی مچھلی</text><text class="small" x="290" y="250" text-anchor="middle">بہت چھوٹی مچھلیاں کھاتا</text><text class="h" x="290" y="278" text-anchor="middle">x 100</text><rect class="panel-d" x="25" y="150" width="160" height="96" rx="8"/><text class="sh" x="105" y="178" text-anchor="middle">ماہی گیر خاندان</text><text class="small" x="105" y="200" text-anchor="middle">بڑی مچھلی کھاتا</text><text class="h" x="105" y="228" text-anchor="middle">خوراک</text><line class="stroke" x1="580" y1="330" x2="537" y2="310" marker-end="url(#arrow)"/><line class="stroke" x1="395" y1="280" x2="352" y2="260" marker-end="url(#arrow)"/><line class="stroke" x1="210" y1="230" x2="167" y2="210" marker-end="url(#arrow)"/><rect class="panel" x="25" y="60" width="715" height="90" rx="8"/><text class="sh" x="724" y="86" text-anchor="end">دو لفظ، دو پیمانے</text><text class="body" x="724" y="110" text-anchor="end">حیاتیاتی جمع: جو تیزی سے آئے دھیرے جائے، ایک جاندار میں جمع ہوتا ہے۔</text><text class="body" x="724" y="132" text-anchor="end">حیاتیاتی بڑھوتری: زنجیر پر چڑھ کر پانی کا سراغ خاندان کی خوراک بن جاتا ہے۔</text><text class="small" x="390" y="430" text-anchor="middle">اوپر کے شکاری، پرندے، بڑی مچھلیاں اور انسان، ماحولیاتی زہر کی نگرانی کے مراکز ہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
