<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of smog formation</title><desc id="d">Diagram of smog formation, two panels, winter sulfurous smog under an inversion with coal and waste smoke, and summer photochemical smog with traffic emissions cooked by sunlight into ozone</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Two kinds of smog, two seasons</text><rect class="panel-b" x="30" y="60" width="355" height="330" rx="10"/><text class="sh" x="207" y="88" text-anchor="middle">winter: sulfurous smog</text><line class="stroke" x1="60" y1="130" x2="355" y2="130"/><text class="small" x="207" y="122" text-anchor="middle">warm lid (temperature inversion)</text><rect class="panel-c" x="50" y="240" width="80" height="26" rx="4"/><text class="small" x="90" y="258" text-anchor="middle">coal smoke</text><rect class="panel-c" x="170" y="270" width="80" height="26" rx="4"/><text class="small" x="210" y="288" text-anchor="middle">waste burning</text><rect class="panel-c" x="260" y="300" width="80" height="26" rx="4"/><text class="small" x="300" y="318" text-anchor="middle">kiln</text><rect class="panel" x="60" y="330" width="295" height="40"/><text class="small" x="207" y="355" text-anchor="middle">fog + SO2 + particles, trapped under the lid</text><rect class="panel-c" x="415" y="60" width="335" height="330" rx="10"/><text class="sh" x="582" y="88" text-anchor="middle">summer: photochemical smog</text><circle class="panel-d" cx="582" cy="140" r="26"/><text class="sh" x="582" y="146" text-anchor="middle">sun</text><line class="stroke" x1="582" y1="170" x2="582" y2="230" marker-end="url(#arrow)"/><text class="small" x="582" y="205" text-anchor="middle">sunlight cooks the emissions</text><rect class="panel-b" x="455" y="240" width="255" height="30" rx="4"/><text class="small" x="582" y="260" text-anchor="middle">traffic + industry emissions</text><line class="stroke" x1="582" y1="274" x2="582" y2="300" marker-end="url(#arrow)"/><rect class="panel-d" x="455" y="304" width="255" height="30" rx="4"/><text class="small" x="582" y="324" text-anchor="middle">ozone + haze (secondary pollutants)</text><text class="small" x="390" y="424" text-anchor="middle">Lahore winter grey: mostly sulfurous under the inversion, with photochemical leftovers.</text><text class="small" x="390" y="444" text-anchor="middle">Worst on still days: the lid sits, the sun cooks, the city breathes its own output.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
