<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">موسمیاتی تبدیلی کا تصوراتی نقشہ</title><desc id="d">موسمیاتی تبدیلی کا تصوراتی نقشہ: بائیں اسباب مرکز کو کھلاتے ہیں، دائیں اثرات، اور کمی اور موافقت کی ذمہ داریاں</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">موسمیاتی تبدیلی: اسباب، اثرات، جواب</text><rect class="panel-c" x="590" y="80" width="150" height="46" rx="8"/><text class="sh" x="665" y="109" text-anchor="middle">جیواشم توانائی</text><line class="stroke" x1="590" y1="103" x2="502" y2="240"/><rect class="panel-c" x="590" y="150" width="150" height="46" rx="8"/><text class="sh" x="665" y="179" text-anchor="middle">جنگلات کی صفائی</text><line class="stroke" x1="590" y1="173" x2="502" y2="240"/><rect class="panel-c" x="590" y="220" width="150" height="46" rx="8"/><text class="sh" x="665" y="249" text-anchor="middle">صنعت</text><line class="stroke" x1="590" y1="243" x2="502" y2="240"/><rect class="panel-c" x="590" y="290" width="150" height="46" rx="8"/><text class="sh" x="665" y="319" text-anchor="middle">زراعت</text><line class="stroke" x1="590" y1="313" x2="502" y2="240"/><ellipse class="panel" cx="440" cy="240" rx="62" ry="52"/><text class="h" x="440" y="236" text-anchor="middle">موسم</text><text class="h" x="440" y="258" text-anchor="middle">تبدیلی</text><rect class="panel-b" x="150" y="80" width="150" height="46" rx="8"/><text class="sh" x="225" y="109" text-anchor="middle">گرمی کی لہریں</text><line class="stroke" x1="378" y1="240" x2="302" y2="103"/><rect class="panel-b" x="150" y="150" width="150" height="46" rx="8"/><text class="sh" x="225" y="179" text-anchor="middle">سیلاب</text><line class="stroke" x1="378" y1="240" x2="302" y2="173"/><rect class="panel-b" x="150" y="220" width="150" height="46" rx="8"/><text class="sh" x="225" y="249" text-anchor="middle">سمندر کا بڑھنا</text><line class="stroke" x1="378" y1="240" x2="302" y2="243"/><rect class="panel-b" x="150" y="290" width="150" height="46" rx="8"/><text class="sh" x="225" y="319" text-anchor="middle">صحتی نقصان</text><line class="stroke" x1="378" y1="240" x2="302" y2="313"/><rect class="panel-a" x="410" y="380" width="170" height="60" rx="8"/><text class="sh" x="495" y="404" text-anchor="middle">کمی</text><text class="small" x="495" y="426" text-anchor="middle">اسباب کاٹیں، مستقبل کے لیے</text><rect class="panel-d" x="200" y="380" width="170" height="60" rx="8"/><text class="sh" x="285" y="404" text-anchor="middle">موافقت</text><text class="small" x="285" y="426" text-anchor="middle">نقصان نرم کریں، ابھی</text><path class="stroke" d="M480 380 L470 296" marker-end="url(#arrow)"/><path class="stroke" d="M300 380 L310 296" marker-end="url(#arrow)"/><text class="small" x="390" y="448" text-anchor="middle">ساتھی، متبادل نہیں: ایک مستقبل کا، دوسرا حال کا جواب۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
