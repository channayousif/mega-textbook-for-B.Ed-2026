<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The effect classes of toxic substances</title><desc id="d">Table of the effect classes of toxic substances with definition, one example and detection or prevention for each</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The effect classes of toxic substances</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Effect class</text><text class="h" x="190" y="75">Definition in one line</text><text class="h" x="400" y="75">One example</text><text class="h" x="560" y="75">Detection / prevention</text><rect class="panel-a" x="26" y="88" width="728" height="44"/><text class="sh" x="40" y="114">Acute</text><text class="body" x="190" y="114">quick, after one exposure</text><text class="body" x="400" y="114">the sprayer collapse</text><text class="body" x="590" y="114">antidote clock, first aid</text><rect class="panel-b" x="26" y="132" width="728" height="44"/><text class="sh" x="40" y="158">Chronic</text><text class="body" x="190" y="158">slow, over years</text><text class="body" x="400" y="158">the thirty-year well</text><text class="body" x="590" y="158">testing clock, screening</text><rect class="panel-c" x="26" y="176" width="728" height="44"/><text class="sh" x="40" y="202">Genotoxic</text><text class="body" x="190" y="202">damages DNA</text><text class="body" x="400" y="202">arsenic, radiation</text><text class="body" x="590" y="202">avoid exposure entirely</text><rect class="panel-d" x="26" y="220" width="728" height="44"/><text class="sh" x="40" y="246">Mutagenic</text><text class="body" x="190" y="246">changes the DNA sequence</text><text class="body" x="400" y="246">some chemicals, UV</text><text class="body" x="590" y="246">no known safe level</text><rect class="panel" x="26" y="264" width="728" height="44"/><text class="sh" x="40" y="290">Teratogenic</text><text class="body" x="190" y="290">harms the unborn child</text><text class="body" x="400" y="290">alcohol, some drugs</text><text class="body" x="590" y="290">timing logic, warnings</text><rect class="panel" x="26" y="308" width="728" height="44"/><text class="sh" x="40" y="334">Carcinogenic</text><text class="body" x="190" y="334">starts cancers</text><text class="body" x="400" y="334">asbestos, tobacco smoke</text><text class="body" x="590" y="334">ban, substitute, screen</text><rect class="panel" x="26" y="352" width="728" height="44"/><text class="sh" x="40" y="378">Sensitizing</text><text class="body" x="190" y="378">trains the immune system</text><text class="body" x="400" y="378">solvents, latex</text><text class="body" x="590" y="378">first teaches, later attack</text><text class="small" x="390" y="418" text-anchor="middle">The classes decide the response: an antidote for the acute clock, a screening programme for the chronic one.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
