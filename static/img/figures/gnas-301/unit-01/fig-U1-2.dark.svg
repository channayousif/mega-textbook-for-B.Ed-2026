<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table listing the five scope areas of environmental science</title><desc id="d">Table listing the five scope areas of environmental science, air, water, land, living things and human systems, each with a guiding question and a Sindh classroom example</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">What environmental science studies: five scope areas</text><rect class="panel" x="30" y="56" width="720" height="44"/><text class="h" x="46" y="78">Scope area</text><text class="h" x="200" y="78">The question it asks</text><text class="h" x="500" y="72">One Sindh classroom</text><text class="h" x="500" y="92">example</text><rect class="panel-a" x="30" y="100" width="720" height="62"/><text class="sh" x="46" y="126">Air</text><text class="body" x="200" y="126">what is in the air we breathe,</text><text class="body" x="200" y="146">and what did we add to it?</text><text class="body" x="500" y="126">reading the AQI before a</text><text class="body" x="500" y="146">Karachi school sports day</text><rect class="panel-b" x="30" y="162" width="720" height="62"/><text class="sh" x="46" y="188">Water</text><text class="body" x="200" y="188">where does the water come from,</text><text class="body" x="200" y="208">and what is in it when it returns?</text><text class="body" x="500" y="188">tracing the school tap back to</text><text class="body" x="500" y="208">the Indus or the ground</text><rect class="panel-c" x="30" y="224" width="720" height="62"/><text class="sh" x="46" y="250">Land</text><text class="body" x="200" y="250">how is the soil and rock used,</text><text class="body" x="200" y="270">and what covers them now?</text><text class="body" x="500" y="250">the white salt crust on a</text><text class="body" x="500" y="270">waterlogged Sindh field</text><rect class="panel-d" x="30" y="286" width="720" height="62"/><text class="sh" x="46" y="312">Living things</text><text class="body" x="200" y="312">which species live here, and what</text><text class="body" x="200" y="332">happens when their habitat changes?</text><text class="body" x="500" y="312">fish and birds of Keenjhar Lake</text><rect class="panel" x="30" y="348" width="720" height="62"/><text class="sh" x="46" y="374">Human systems</text><text class="body" x="200" y="374">how do laws, prices, cities and</text><text class="body" x="200" y="394">habits drive all of the above?</text><text class="body" x="500" y="374">the price of a water bottle</text><text class="body" x="500" y="394">versus a filled bottle</text><text class="small" x="390" y="440" text-anchor="middle">One object, four spheres, one human system: the analytical habit of Topic 1.1.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>