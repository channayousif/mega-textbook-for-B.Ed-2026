<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان کے چھ قدرتی وسائل کا جدول</title><desc id="d">پاکستان کے چھ قدرتی وسائل کا جدول: سندھ کا پانی، جھیل کی مچھلی، سولر توانائی، مٹی، کوئلہ اور قدرتی گیس، ہر ایک کی قابلِ تجدید یا ناقابلِ تجدید حیثیت کے ساتھ اس کا مسئلہ اور ایک انتظامی جواب</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">پاکستان کے قدرتی وسائل: قابلِ تجدید یا نہیں؟</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">وسیلہ</text><text class="h" x="584" y="75" text-anchor="end">قابلِ تجدید؟</text><text class="h" x="464" y="75" text-anchor="end">مسئلہ ایک سطر میں</text><text class="h" x="224" y="75" text-anchor="end">انتظامی جواب</text><rect class="panel-a" x="26" y="88" width="728" height="52"/><text class="sh" x="740" y="112" text-anchor="end">سندھ کا پانی</text><text class="body" x="584" y="112" text-anchor="end">ہاں، شرح پر منحصر</text><text class="body" x="464" y="112" text-anchor="end">نکاسی پہلے ہی حد سے زیادہ</text><text class="body" x="224" y="112" text-anchor="end">تجدید سے نیچے رہیں: کوٹہ</text><rect class="panel-a" x="26" y="140" width="728" height="52"/><text class="sh" x="740" y="164" text-anchor="end">جھیل کی مچھلی</text><text class="body" x="584" y="164" text-anchor="end">ہاں، شرح پر منحصر</text><text class="body" x="464" y="164" text-anchor="end">شکار افزائش سے آگے نکل سکتا ہے</text><text class="body" x="224" y="164" text-anchor="end">موسم اور جال کی حد</text><rect class="panel-a" x="26" y="192" width="728" height="52"/><text class="sh" x="740" y="216" text-anchor="end">تھر کی دھوپ</text><text class="body" x="584" y="216" text-anchor="end">ہاں</text><text class="body" x="464" y="216" text-anchor="end">مسئلہ لاگت کا ہے، فراہمی کا نہیں</text><text class="body" x="224" y="216" text-anchor="end">دور دراز کے لیے سولر پینل</text><rect class="panel-a" x="26" y="244" width="728" height="52"/><text class="sh" x="740" y="268" text-anchor="end">مٹی</text><text class="body" x="584" y="268" text-anchor="end">ہاں، آہستہ آہستہ</text><text class="body" x="464" y="268" text-anchor="end">شورہ زدگی اور کٹاؤ اسے تیزی سے کھا جاتا ہے</text><text class="body" x="224" y="268" text-anchor="end">نکاسی، ڈھانپنے والی فصلیں</text><rect class="panel-c" x="26" y="296" width="728" height="52"/><text class="sh" x="740" y="320" text-anchor="end">تھر کا کوئلہ</text><text class="body" x="584" y="320" text-anchor="end">نہیں</text><text class="body" x="464" y="320" text-anchor="end">مقررہ ذخیرہ؛ جلنے سے کاربن بڑھتا ہے</text><text class="body" x="224" y="320" text-anchor="end">متبادل کی منصوبہ بندی</text><rect class="panel-c" x="26" y="348" width="728" height="52"/><text class="sh" x="740" y="372" text-anchor="end">قدرتی گیس</text><text class="body" x="584" y="372" text-anchor="end">نہیں</text><text class="body" x="464" y="372" text-anchor="end">کنویں خالی ہوتے ہیں؛ درآمدات فرق پُر کرتی ہیں</text><text class="body" x="224" y="372" text-anchor="end">ترتیب: پہلے صنعت</text><text class="small" x="390" y="432" text-anchor="middle">انتظام کا سوال: قابلِ تجدید کے لیے استعمال کی شرح (ہلکی قطاریں)،</text><text class="small" x="390" y="448" text-anchor="middle">ناقابلِ تجدید کے لیے ترتیب اور متبادل (گہری قطاریں)۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
