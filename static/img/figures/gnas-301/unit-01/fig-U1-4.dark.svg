<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing global, regional and local environmental issues</title><desc id="d">Table comparing global, regional and local environmental issues with an example, its current status and who feels it</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Environmental issues at three scales</text><rect class="panel" x="30" y="56" width="720" height="40"/><text class="h" x="46" y="82">Scale</text><text class="h" x="150" y="82">Example issue</text><text class="h" x="330" y="82">Current status (one line)</text><text class="h" x="580" y="82">Who feels it</text><rect class="panel-a" x="30" y="96" width="720" height="86"/><text class="sh" x="46" y="128">Global</text><text class="body" x="150" y="122">climate change</text><text class="body" x="330" y="122">3.6 billion people already live</text><text class="body" x="330" y="142">in highly susceptible areas</text><text class="body" x="330" y="162">(WHO, 2023)</text><text class="body" x="580" y="122">everyone; the poorest</text><text class="body" x="580" y="142">first and worst</text><rect class="panel-b" x="30" y="182" width="720" height="86"/><text class="sh" x="46" y="214">Regional</text><text class="body" x="150" y="208">Indus water stress</text><text class="body" x="330" y="208">withdrawals already exceed a</text><text class="body" x="330" y="228">highly stressed threshold;</text><text class="body" x="330" y="248">population adds pressure</text><text class="body" x="580" y="208">all basin countries;</text><text class="body" x="580" y="228">farmers and delta</text><text class="body" x="580" y="248">communities hardest</text><rect class="panel-c" x="30" y="268" width="720" height="86"/><text class="sh" x="46" y="300">Local</text><text class="body" x="150" y="294">neighbourhood waste</text><text class="body" x="150" y="314">burning</text><text class="body" x="330" y="294">repeated across cities;</text><text class="body" x="330" y="314">smoke enters homes and</text><text class="body" x="330" y="334">schools nearby</text><text class="body" x="580" y="294">the street's own</text><text class="body" x="580" y="314">residents, especially</text><text class="body" x="580" y="334">children and elders</text><text class="small" x="390" y="392" text-anchor="middle">The scales connect: a local heap adds carbon to the global atmosphere;</text><text class="small" x="390" y="410" text-anchor="middle">a global rise in temperature shows up locally as a Karachi heatwave.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
