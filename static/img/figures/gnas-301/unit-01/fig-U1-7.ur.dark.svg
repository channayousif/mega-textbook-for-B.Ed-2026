<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فرد کے عمل کے راستے کا فلو چارٹ</title><desc id="d">فرد کے عمل کے راستے کا فلو چارٹ: غور کریں، جانیں، کم کریں، دوبارہ استعمال اور ری سائیکل، دوسروں کو راستہ دکھائیں، ہر مرحلے کے ساتھ اسکول کی سطح کی مثال، اور واپس غور پر آنے والا چکر</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">فرد کے عمل کا راستہ</text><rect class="panel-a" x="624" y="80" width="132" height="96" rx="10"/><text class="sh" x="690" y="112" text-anchor="middle">1. غور کریں</text><text class="small" x="690" y="136" text-anchor="middle">لکھیں کیا استعمال</text><text class="small" x="690" y="154" text-anchor="middle">کیا اور پھینکتے ہیں</text><rect class="panel-a" x="464" y="80" width="132" height="96" rx="10"/><text class="sh" x="530" y="112" text-anchor="middle">2. جانیں</text><text class="small" x="530" y="136" text-anchor="middle">یہ کہاں سے آتا ہے</text><text class="small" x="530" y="154" text-anchor="middle">اور کہاں جاتا ہے</text><rect class="panel-b" x="304" y="80" width="132" height="96" rx="10"/><text class="sh" x="370" y="112" text-anchor="middle">3. کم کریں</text><text class="small" x="370" y="136" text-anchor="middle">کپڑے کا تھیلا، بھری بوتل،</text><text class="small" x="370" y="154" text-anchor="middle">نل بند، پنکھا بند</text><rect class="panel-b" x="144" y="80" width="132" height="96" rx="10"/><text class="sh" x="210" y="112" text-anchor="middle">4. دوبارہ استعمال</text><text class="sh" x="210" y="130" text-anchor="middle">اور ری سائیکل</text><text class="small" x="210" y="152" text-anchor="middle">نئی زندگی؛ صاف</text><text class="small" x="210" y="170" text-anchor="middle">مواد الگ رکھیں</text><rect class="panel-d" x="20" y="80" width="96" height="96" rx="10"/><text class="sh" x="68" y="112" text-anchor="middle">5. دوسروں کو</text><text class="sh" x="68" y="130" text-anchor="middle">راستہ دکھائیں</text><text class="small" x="68" y="152" text-anchor="middle">گھر، جماعت،</text><text class="small" x="68" y="170" text-anchor="middle">اسکول</text><line class="stroke" x1="624" y1="128" x2="598" y2="128" marker-end="url(#arrow)"/><line class="stroke" x1="464" y1="128" x2="438" y2="128" marker-end="url(#arrow)"/><line class="stroke" x1="304" y1="128" x2="278" y2="128" marker-end="url(#arrow)"/><line class="stroke" x1="144" y1="128" x2="118" y2="128" marker-end="url(#arrow)"/><path class="stroke" d="M68 176 L68 250 Q68 274 92 274 L668 274 Q692 274 692 250 L692 178" marker-end="url(#arrow)"/><text class="small" x="390" y="268" text-anchor="middle">جاری رکھیں: تبدیلی کے بعد دوبارہ غور کریں</text><rect class="panel" x="20" y="316" width="736" height="118" rx="10"/><text class="sh" x="740" y="342" text-anchor="end">حلیہ مثال: بسکٹ کا ریپر</text><text class="body" x="740" y="366" text-anchor="end">غور: یہ فہرست میں ہے، گیارہ دیگر کے ساتھ۔ جاننا: ایک تہی پلاسٹک، کوئی کباڑی نہیں لیتا۔</text><text class="body" x="740" y="388" text-anchor="end">کم کریں: بارہ پیکٹوں کی جگہ ایک بڑا ڈبہ۔ دوبارہ: ڈبہ پنسل باکس بن جاتا ہے۔</text><text class="body" x="740" y="410" text-anchor="end">راستہ: جماعت ایک ہفتے کے لیے ریپر سے پاک کونے پر راضی ہو کر فرق گنتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
