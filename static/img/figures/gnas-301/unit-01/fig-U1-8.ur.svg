<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">روزمرہ ماحولیاتی ذمہ داریوں کا جدول</title><desc id="d">گھر، اسکول اور محلے کی روزمرہ ماحولیاتی ذمہ داریوں کا جدول، ہر ایک کے ساتھ اس ماہ شروع کرنے کا ایک کام</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">روزمرہ ذمہ داریاں: اس ماہ شروع کرنے کا ایک کام</text><rect class="panel" x="30" y="56" width="720" height="40"/><text class="h" x="734" y="82" text-anchor="end">کہاں</text><text class="h" x="600" y="82" text-anchor="end">ایک ذمہ داری</text><text class="h" x="310" y="82" text-anchor="end">اس ماہ شروع کرنے کا کام</text><rect class="panel-a" x="30" y="96" width="720" height="92"/><text class="sh" x="734" y="130" text-anchor="end">گھر میں</text><text class="body" x="600" y="124" text-anchor="end">کم استعمال: جو ضروری نہیں</text><text class="body" x="600" y="144" text-anchor="end">اسے ٹھکرائیں، نل بند کریں، بند کریں</text><text class="body" x="600" y="164" text-anchor="end">بجلی کے بیکار اخراجات</text><text class="body" x="310" y="124" text-anchor="end">ہر بازار کے لیے کپڑے کا تھیلا،</text><text class="body" x="310" y="144" text-anchor="end">اور ایک بوتل جو دوبارہ بھریں</text><rect class="panel-b" x="30" y="188" width="720" height="92"/><text class="sh" x="734" y="222" text-anchor="end">اسکول میں</text><text class="body" x="600" y="216" text-anchor="end">ایک چھوٹا نظام چلائیں، صرف</text><text class="body" x="600" y="236" text-anchor="end">ایک کام نہیں: الگ کریں، گنیں،</text><text class="body" x="600" y="256" text-anchor="end">رپورٹ کریں</text><text class="body" x="310" y="216" text-anchor="end">ایک جماعت کے لیے دو ڈبے کی</text><text class="body" x="310" y="236" text-anchor="end">علیحدگی، ہفتہ وار گنتی</text><rect class="panel-c" x="30" y="280" width="720" height="92"/><text class="sh" x="734" y="314" text-anchor="end">محلے میں</text><text class="body" x="600" y="308" text-anchor="end">مقامی مسئلے اور اس کے پیمانے</text><text class="body" x="600" y="328" text-anchor="end">کو نام دیں؛ کباڑی کو مدد،</text><text class="body" x="600" y="348" text-anchor="end">ڈھیر کو نہیں</text><text class="body" x="310" y="308" text-anchor="end">صاف کاغذ، گتے اور دھات</text><text class="body" x="310" y="328" text-anchor="end">بحالی کے زنجیر کے لیے الگ رکھیں</text><text class="small" x="390" y="412" text-anchor="middle">استاد کا قدم سب سے وسیع ہے: عادتیں ایک ساتھ چالیس طلبہ کے ذریعے گھر پہنچتی ہیں۔</text><text class="small" x="390" y="432" text-anchor="middle">امتحان پائیداری کا ہے: کیا یہ عمل اسی طرح جاری رہ سکتا ہے، بغیر اس چیز کو ختم کیے جس پر منحصر ہے؟</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
