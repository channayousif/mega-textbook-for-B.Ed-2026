<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of everyday environmental responsibilities</title><desc id="d">Table of everyday environmental responsibilities at home, in school and in the community, each with one action to start this month</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Everyday responsibilities: one action to start this month</text><rect class="panel" x="30" y="56" width="720" height="40"/><text class="h" x="46" y="82">Where</text><text class="h" x="180" y="82">One responsibility</text><text class="h" x="470" y="82">One action to start this month</text><rect class="panel-a" x="30" y="96" width="720" height="92"/><text class="sh" x="46" y="130">At home</text><text class="body" x="180" y="124">use less: refuse what you do not</text><text class="body" x="180" y="144">need, close the tap, switch off</text><text class="body" x="180" y="164">the standby loads</text><text class="body" x="470" y="124">a cloth bag for every market trip,</text><text class="body" x="470" y="144">and one bottle you refill</text><rect class="panel-b" x="30" y="188" width="720" height="92"/><text class="sh" x="46" y="222">In school</text><text class="body" x="180" y="216">run one small system, not one</text><text class="body" x="180" y="236">small act: separate, count,</text><text class="body" x="180" y="256">report</text><text class="body" x="470" y="216">a two-bin separation for one</text><text class="body" x="470" y="236">classroom, counted weekly</text><rect class="panel-c" x="30" y="280" width="720" height="92"/><text class="sh" x="46" y="314">In the community</text><text class="body" x="180" y="308">name the local issue and its</text><text class="body" x="180" y="328">scale; support the collector, not</text><text class="body" x="180" y="348">the heap</text><text class="body" x="470" y="308">keep clean paper, cardboard and</text><text class="body" x="470" y="328">metal apart for the recovery chain</text><text class="small" x="390" y="412" text-anchor="middle">A teacher's step is the widest: habits that travel home through forty pupils at a time.</text><text class="small" x="390" y="432" text-anchor="middle">The test is sustainability: can this action continue, as it is, without exhausting what it depends on?</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
