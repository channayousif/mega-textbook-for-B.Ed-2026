<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عالمی، علاقائی اور مقامی ماحولیاتی مسائل کا موازنہ</title><desc id="d">عالمی، علاقائی اور مقامی ماحولیاتی مسائل کا جدول، ہر ایک کے ساتھ ایک مثال، اس کی موجودہ صورتحال اور یہ کہ کس کو محسوس ہوتا ہے</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">ماحولیاتی مسائل کے تین پیمانے</text><rect class="panel" x="30" y="56" width="720" height="40"/><text class="h" x="734" y="82" text-anchor="end">پیمانہ</text><text class="h" x="630" y="82" text-anchor="end">مثال کا مسئلہ</text><text class="h" x="450" y="82" text-anchor="end">موجودہ صورتحال (ایک سطر)</text><text class="h" x="200" y="82" text-anchor="end">کس کو محسوس ہوتا ہے</text><rect class="panel-a" x="30" y="96" width="720" height="86"/><text class="sh" x="734" y="128" text-anchor="end">عالمی</text><text class="body" x="630" y="122" text-anchor="end">موسمیاتی تبدیلی</text><text class="body" x="450" y="122" text-anchor="end">3.6 ارب انسان پہلے ہی انتہائی</text><text class="body" x="450" y="142" text-anchor="end">متاثر ہونے والے علاقوں میں رہتے ہیں</text><text class="body" x="450" y="162" text-anchor="end">(ڈبلیو ایچ او، 2023)</text><text class="body" x="200" y="122" text-anchor="end">سب پر؛ غریب سب سے</text><text class="body" x="200" y="142" text-anchor="end">پہلے اور سب سے زیادہ</text><rect class="panel-b" x="30" y="182" width="720" height="86"/><text class="sh" x="734" y="214" text-anchor="end">علاقائی</text><text class="body" x="630" y="208" text-anchor="end">سندھ کے پانی کا دباؤ</text><text class="body" x="450" y="208" text-anchor="end">نکاسی پہلے ہی حد سے زیادہ ہے؛</text><text class="body" x="450" y="228" text-anchor="end">پانی کی شدید قلت کی حد؛</text><text class="body" x="450" y="248" text-anchor="end">آبادی دباؤ بڑھاتی ہے</text><text class="body" x="200" y="208" text-anchor="end">طاس کے تمام ممالک؛</text><text class="body" x="200" y="228" text-anchor="end">کسان اور ڈیلٹا کی</text><text class="body" x="200" y="248" text-anchor="end">آبادیاں سب سے زیادہ متاثر</text><rect class="panel-c" x="30" y="268" width="720" height="86"/><text class="sh" x="734" y="300" text-anchor="end">مقامی</text><text class="body" x="630" y="294" text-anchor="end">محلے کا جلایا</text><text class="body" x="630" y="314" text-anchor="end">جا رہا کچرا</text><text class="body" x="450" y="294" text-anchor="end">شہروں میں بار بار؛</text><text class="body" x="450" y="314" text-anchor="end">دھواں گھروں اور قریبی</text><text class="body" x="450" y="334" text-anchor="end">اسکولوں میں جاتا ہے</text><text class="body" x="200" y="294" text-anchor="end">اسی گلی کے باسی،</text><text class="body" x="200" y="314" text-anchor="end">خاص طور پر بچے</text><text class="body" x="200" y="334" text-anchor="end">اور بوڑھے</text><text class="small" x="390" y="392" text-anchor="middle">پیمانے جڑے ہوئے ہیں: مقامی ڈھیر عالمی فضا میں کاربن بڑھاتا ہے؛</text><text class="small" x="390" y="410" text-anchor="middle">اور عالمی درجہ حرارت کا اضافہ مقامی طور پر کراچی کی لُو بن کر آتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
