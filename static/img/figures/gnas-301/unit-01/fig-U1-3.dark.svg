<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map linking five human activities through the anthropogenic nexus</title><desc id="d">Concept map linking five human activities on the left, farming, industry, transport, energy use and waste disposal, through a central anthropogenic nexus hub, to five environmental problems on the right, waterlogging and salinity, air pollution, deforestation, water pollution and climate change</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The anthropogenic nexus: activities in, problems out</text><rect class="panel-a" x="24" y="60" width="170" height="52" rx="8"/><text class="sh" x="109" y="90" text-anchor="middle">farming</text><rect class="panel-a" x="24" y="132" width="170" height="52" rx="8"/><text class="sh" x="109" y="162" text-anchor="middle">industry</text><rect class="panel-a" x="24" y="204" width="170" height="52" rx="8"/><text class="sh" x="109" y="234" text-anchor="middle">transport</text><rect class="panel-a" x="24" y="276" width="170" height="52" rx="8"/><text class="sh" x="109" y="306" text-anchor="middle">energy use</text><rect class="panel-a" x="24" y="348" width="170" height="52" rx="8"/><text class="sh" x="109" y="378" text-anchor="middle">waste disposal</text><ellipse class="panel" cx="390" cy="230" rx="108" ry="66"/><text class="h" x="390" y="222" text-anchor="middle">anthropogenic</text><text class="h" x="390" y="244" text-anchor="middle">nexus</text><line class="stroke" x1="194" y1="86" x2="288" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="194" y1="158" x2="286" y2="204" marker-end="url(#arrow)"/><line class="stroke" x1="194" y1="230" x2="280" y2="230" marker-end="url(#arrow)"/><line class="stroke" x1="194" y1="302" x2="286" y2="256" marker-end="url(#arrow)"/><line class="stroke" x1="194" y1="374" x2="288" y2="264" marker-end="url(#arrow)"/><rect class="panel-c" x="586" y="60" width="170" height="52" rx="8"/><text class="sh" x="671" y="82" text-anchor="middle">waterlogging</text><text class="sh" x="671" y="100" text-anchor="middle">and salinity</text><rect class="panel-c" x="586" y="132" width="170" height="52" rx="8"/><text class="sh" x="671" y="162" text-anchor="middle">air pollution</text><rect class="panel-c" x="586" y="204" width="170" height="52" rx="8"/><text class="sh" x="671" y="234" text-anchor="middle">deforestation</text><rect class="panel-c" x="586" y="276" width="170" height="52" rx="8"/><text class="sh" x="671" y="306" text-anchor="middle">water pollution</text><rect class="panel-c" x="586" y="348" width="170" height="52" rx="8"/><text class="sh" x="671" y="378" text-anchor="middle">climate change</text><line class="stroke-a" x1="492" y1="196" x2="584" y2="92" marker-end="url(#arrow)"/><line class="stroke-a" x1="498" y1="210" x2="584" y2="158" marker-end="url(#arrow)"/><line class="stroke-a" x1="498" y1="230" x2="584" y2="230" marker-end="url(#arrow)"/><line class="stroke-a" x1="498" y1="250" x2="584" y2="302" marker-end="url(#arrow)"/><line class="stroke-a" x1="492" y1="264" x2="584" y2="368" marker-end="url(#arrow)"/><path class="stroke" d="M 390 296 Q 390 400 390 418" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text class="small" x="404" y="398">the changed environment returns</text><text class="small" x="404" y="414">the harm to people</text><text class="small" x="150" y="442">activities (solid arrows in)</text><text class="small" x="600" y="442">problems (accent arrows)</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
