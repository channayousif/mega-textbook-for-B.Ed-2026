<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of planet Earth showing the four spheres</title><desc id="d">Diagram of planet Earth showing the four spheres, atmosphere, hydrosphere, lithosphere and biosphere, each labelled with a Pakistani example, with a school building placed inside the biosphere to show that people are part of it</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Planet Earth's four spheres</text><circle class="panel" cx="205" cy="250" r="118"/><circle class="stroke-a" cx="205" cy="250" r="132" stroke-dasharray="6 5"/><text class="small" x="205" y="100" text-anchor="middle">atmosphere (air)</text><path class="stroke" d="M 165 165 q 10 -14 24 -6 q 6 -12 20 -6 q 14 -4 16 8 q 12 2 8 12 z"/><text class="small" x="205" y="404" text-anchor="middle">hydrosphere (water)</text><path class="stroke" d="M 115 330 q 15 -10 30 0 t 30 0 t 30 0 t 30 0 t 30 0"/><path class="stroke" d="M 130 348 q 15 -10 30 0 t 30 0 t 30 0 t 30 0"/><text class="small" x="205" y="212" text-anchor="middle">lithosphere (land)</text><path class="stroke" d="M 120 300 L 165 240 L 195 285 L 225 250 L 265 300 Z"/><text class="small" x="205" y="262" text-anchor="middle">biosphere (life)</text><path class="stroke" d="M 150 330 L 150 306 M 150 306 L 138 296 M 150 306 L 162 296 M 144 300 L 144 292"/><rect class="panel-d" x="222" y="296" width="34" height="26"/><path class="stroke" d="M 218 296 L 239 282 L 260 296"/><text class="small" x="239" y="336" text-anchor="middle">school: people</text><rect class="panel-a" x="400" y="52" width="356" height="76" rx="8"/><text class="sh" x="416" y="78">1. Atmosphere</text><text class="body" x="416" y="100">the envelope of gases; the monsoon</text><text class="body" x="416" y="118">winds that water Sindh's crops</text><line class="stroke" x1="337" y1="140" x2="400" y2="96"/><rect class="panel-b" x="400" y="146" width="356" height="76" rx="8"/><text class="sh" x="416" y="172">2. Hydrosphere</text><text class="body" x="416" y="194">all water: the Indus river system,</text><text class="body" x="416" y="212">the Arabian Sea, water under Thar</text><line class="stroke" x1="322" y1="330" x2="400" y2="196"/><rect class="panel-c" x="400" y="240" width="356" height="76" rx="8"/><text class="sh" x="416" y="266">3. Lithosphere</text><text class="body" x="416" y="288">solid Earth: the soil that grows</text><text class="body" x="416" y="306">wheat, the coal seams under Thar</text><line class="stroke" x1="300" y1="272" x2="400" y2="280"/><rect class="panel-d" x="400" y="334" width="356" height="76" rx="8"/><text class="sh" x="416" y="360">4. Biosphere</text><text class="body" x="416" y="382">the thin zone of life: mangroves,</text><text class="body" x="416" y="400">crops, fish, and people</text><line class="stroke" x1="256" y1="330" x2="400" y2="378"/><text class="small" x="390" y="440" text-anchor="middle">People live inside the biosphere, not beside it: there is no "away".</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
