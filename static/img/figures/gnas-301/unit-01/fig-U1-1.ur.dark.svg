<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زمین کے چار کروں کا خاکہ</title><desc id="d">زمین کے چار کرے دکھانے والا خاکہ: کرہ ہوا، کرہ آب، کرہ خاک اور کرہ حیات، ہر ایک پر پاکستانی مثال، اور کرہ حیات کے اندر ایک اسکول کی عمارت جو بتاتی ہے کہ انسان اس کا حصہ ہیں</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">زمین کے چار کرے</text><circle class="panel" cx="575" cy="250" r="118"/><circle class="stroke-a" cx="575" cy="250" r="132" stroke-dasharray="6 5"/><text class="small" x="575" y="100" text-anchor="middle">کرہ ہوا (ہوا)</text><path class="stroke" d="M615 165 q-10 -14 -24 -6 q-6 -12 -20 -6 q-14 -4 -16 8 q-12 2 -8 12 z"/><text class="small" x="575" y="404" text-anchor="middle">کرہ آب (پانی)</text><path class="stroke" d="M665 330 q-15 -10 -30 0 t-30 0 t-30 0 t-30 0 t-30 0"/><path class="stroke" d="M650 348 q-15 -10 -30 0 t-30 0 t-30 0 t-30 0"/><text class="small" x="575" y="212" text-anchor="middle">کرہ خاک (زمین)</text><path class="stroke" d="M660 300 L615 240 L585 285 L555 250 L515 300 Z"/><text class="small" x="575" y="262" text-anchor="middle">کرہ حیات (زندگی)</text><path class="stroke" d="M630 330 L630 306 M630 306 L642 296 M630 306 L618 296 M636 300 L636 292"/><rect class="panel-d" x="524" y="296" width="34" height="26"/><path class="stroke" d="M562 296 L541 282 L520 296"/><text class="small" x="541" y="336" text-anchor="middle">اسکول: انسان</text><rect class="panel-a" x="24" y="52" width="356" height="76" rx="8"/><text class="sh" x="364" y="78" text-anchor="end">1. کرہ ہوا</text><text class="body" x="364" y="100" text-anchor="end">گیسوں کا غلاف؛ مون سون کی</text><text class="body" x="364" y="118" text-anchor="end">ہوائیں جو سندھ کی فصلیں سینچتی ہیں</text><line class="stroke" x1="443" y1="140" x2="380" y2="96"/><rect class="panel-b" x="24" y="146" width="356" height="76" rx="8"/><text class="sh" x="364" y="172" text-anchor="end">2. کرہ آب</text><text class="body" x="364" y="194" text-anchor="end">تمام پانی: دریائے سندھ کا نظام،</text><text class="body" x="364" y="212" text-anchor="end">بحیرہ عرب، تھر کا زیرِ زمین پانی</text><line class="stroke" x1="458" y1="330" x2="380" y2="196"/><rect class="panel-c" x="24" y="240" width="356" height="76" rx="8"/><text class="sh" x="364" y="266" text-anchor="end">3. کرہ خاک</text><text class="body" x="364" y="288" text-anchor="end">ٹھوس زمین: وہ مٹی جس میں گندم</text><text class="body" x="364" y="306" text-anchor="end">اُگتی ہے، تھر کی کوئلے کی تہیں</text><line class="stroke" x1="480" y1="272" x2="380" y2="280"/><rect class="panel-d" x="24" y="334" width="356" height="76" rx="8"/><text class="sh" x="364" y="360" text-anchor="end">4. کرہ حیات</text><text class="body" x="364" y="382" text-anchor="end">زندگی کی پتلی پٹی: مینگرووز،</text><text class="body" x="364" y="400" text-anchor="end">فصلیں، مچھلیاں اور انسان</text><line class="stroke" x1="524" y1="330" x2="380" y2="378"/><text class="small" x="390" y="440" text-anchor="middle">انسان کرہ حیات کے اندر رہتے ہیں، پاس نہیں: کوئی "دور" نہیں ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
