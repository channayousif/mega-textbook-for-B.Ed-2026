<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the individual action path</title><desc id="d">Flowchart of the individual action path, notice, learn, reduce, reuse and recycle, influence others, each with a school-scale example, and a loop back to notice</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The individual action path</text><rect class="panel-a" x="24" y="80" width="132" height="96" rx="10"/><text class="sh" x="90" y="112" text-anchor="middle">1. notice</text><text class="small" x="90" y="136" text-anchor="middle">list what you use</text><text class="small" x="90" y="154" text-anchor="middle">and throw away</text><rect class="panel-a" x="184" y="80" width="132" height="96" rx="10"/><text class="sh" x="250" y="112" text-anchor="middle">2. learn</text><text class="small" x="250" y="136" text-anchor="middle">where does it come</text><text class="small" x="250" y="154" text-anchor="middle">from, where does it go</text><rect class="panel-b" x="344" y="80" width="132" height="96" rx="10"/><text class="sh" x="410" y="112" text-anchor="middle">3. reduce</text><text class="small" x="410" y="136" text-anchor="middle">cloth bag, filled bottle,</text><text class="small" x="410" y="154" text-anchor="middle">tap closed, fan off</text><rect class="panel-b" x="504" y="80" width="132" height="96" rx="10"/><text class="sh" x="570" y="112" text-anchor="middle">4. reuse and</text><text class="sh" x="570" y="130" text-anchor="middle">recycle</text><text class="small" x="570" y="152" text-anchor="middle">second life; keep</text><text class="small" x="570" y="170" text-anchor="middle">clean material apart</text><rect class="panel-d" x="664" y="80" width="96" height="96" rx="10"/><text class="sh" x="712" y="112" text-anchor="middle">5. influence</text><text class="sh" x="712" y="130" text-anchor="middle">others</text><text class="small" x="712" y="152" text-anchor="middle">family, class,</text><text class="small" x="712" y="170" text-anchor="middle">school</text><line class="stroke" x1="156" y1="128" x2="182" y2="128" marker-end="url(#arrow)"/><line class="stroke" x1="316" y1="128" x2="342" y2="128" marker-end="url(#arrow)"/><line class="stroke" x1="476" y1="128" x2="502" y2="128" marker-end="url(#arrow)"/><line class="stroke" x1="636" y1="128" x2="662" y2="128" marker-end="url(#arrow)"/><path class="stroke" d="M 712 176 L 712 250 Q 712 274 688 274 L 112 274 Q 88 274 88 250 L 88 178" marker-end="url(#arrow)"/><text class="small" x="390" y="268" text-anchor="middle">keep going: notice again after changing</text><rect class="panel" x="24" y="316" width="736" height="118" rx="10"/><text class="sh" x="40" y="342">Worked example: the biscuit wrapper</text><text class="body" x="40" y="366">notice: it is on the list, with eleven others. learn: single-layer plastic, no collector buys it.</text><text class="body" x="40" y="388">reduce: one large tin instead of twelve packets. reuse: the tin becomes a pencil box.</text><text class="body" x="40" y="410">influence: the class agrees on a no-wrapper-pile corner for one week and counts the difference.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
