<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six Pakistani natural resources</title><desc id="d">Table of six Pakistani natural resources, Indus water, lake fish, solar energy, soil, coal and natural gas, each classified as renewable or non-renewable with its main issue and one management response</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="490"/><text class="h" x="390" y="30" text-anchor="middle">Pakistani natural resources: renewable or not?</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Resource</text><text class="h" x="160" y="75">Renewable?</text><text class="h" x="280" y="75">The issue in one line</text><text class="h" x="520" y="75">Management response</text><rect class="panel-a" x="26" y="88" width="728" height="60"/><text class="sh" x="40" y="112">Indus water</text><text class="body" x="160" y="112">yes, at a rate</text><text class="body" x="280" y="102">withdrawals already highly</text><text class="body" x="280" y="122">stressed</text><text class="body" x="520" y="112">stay below renewal: quotas</text><rect class="panel-a" x="26" y="148" width="728" height="52"/><text class="sh" x="40" y="172">lake fish</text><text class="body" x="160" y="172">yes, at a rate</text><text class="body" x="280" y="172">catch can exceed breeding</text><text class="body" x="520" y="172">season and mesh limits</text><rect class="panel-a" x="26" y="200" width="728" height="52"/><text class="sh" x="40" y="224">Thar sunlight</text><text class="body" x="160" y="224">yes</text><text class="body" x="280" y="224">collection cost, not supply</text><text class="body" x="520" y="224">solar panels off-grid</text><rect class="panel-a" x="26" y="252" width="728" height="60"/><text class="sh" x="40" y="276">soil</text><text class="body" x="160" y="276">yes, slowly</text><text class="body" x="280" y="266">salinity and erosion strip</text><text class="body" x="280" y="286">it faster</text><text class="body" x="520" y="276">drainage, cover crops</text><rect class="panel-c" x="26" y="312" width="728" height="60"/><text class="sh" x="40" y="336">Thar coal</text><text class="body" x="160" y="336">no</text><text class="body" x="280" y="326">fixed stock; burning adds</text><text class="body" x="280" y="346">carbon</text><text class="body" x="520" y="336">plan what replaces it</text><rect class="panel-c" x="26" y="372" width="728" height="60"/><text class="sh" x="40" y="396">natural gas</text><text class="body" x="160" y="396">no</text><text class="body" x="280" y="386">wells deplete; imports fill</text><text class="body" x="280" y="406">the gap</text><text class="body" x="520" y="396">order use: industry first</text><text class="small" x="390" y="450" text-anchor="middle">The management question: rate of use for renewables (tinted rows),</text><text class="small" x="390" y="466" text-anchor="middle">order and replacement for non-renewables (accent rows).</text><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>