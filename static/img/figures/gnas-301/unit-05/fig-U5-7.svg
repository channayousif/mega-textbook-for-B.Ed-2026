<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of multilateral environmental agreements 1972 to 2015</title><desc id="d">Timeline of multilateral environmental agreements from Stockholm 1972 to Paris 2015, six marked points each with what it controls</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Six agreements, one arc: 1972 to 2015</text><line class="stroke" x1="50" y1="250" x2="730" y2="250"/><circle class="yes" cx="70" cy="250" r="7"/><rect class="panel-a" x="8" y="134" width="124" height="76" rx="8"/><text class="sh" x="70" y="156" text-anchor="middle">Stockholm 1972</text><text class="small" x="70" y="176" text-anchor="middle">the first</text><text class="small" x="70" y="192" text-anchor="middle">world environment conference</text><line class="stroke" x1="70" y1="210" x2="70" y2="242"/><circle class="yes" cx="190" cy="250" r="7"/><rect class="panel-b" x="128" y="234" width="124" height="76" rx="8"/><text class="sh" x="190" y="256" text-anchor="middle">Basel 1989</text><text class="small" x="190" y="276" text-anchor="middle">hazardous</text><text class="small" x="190" y="292" text-anchor="middle">waste trade</text><line class="stroke" x1="190" y1="258" x2="190" y2="232"/><circle class="yes" cx="310" cy="250" r="7"/><rect class="panel-a" x="248" y="134" width="124" height="76" rx="8"/><text class="sh" x="310" y="156" text-anchor="middle">Rio 1992</text><text class="small" x="310" y="176" text-anchor="middle">climate +</text><text class="small" x="310" y="192" text-anchor="middle">biodiversity conventions</text><line class="stroke" x1="310" y1="210" x2="310" y2="242"/><circle class="yes" cx="430" cy="250" r="7"/><rect class="panel-c" x="368" y="234" width="124" height="76" rx="8"/><text class="sh" x="430" y="256" text-anchor="middle">Stockholm POPs 2001</text><text class="small" x="430" y="276" text-anchor="middle">persistent</text><text class="small" x="430" y="292" text-anchor="middle">organic pollutants</text><line class="stroke" x1="430" y1="258" x2="430" y2="232"/><circle class="yes" cx="550" cy="250" r="7"/><rect class="panel-b" x="488" y="134" width="124" height="76" rx="8"/><text class="sh" x="550" y="156" text-anchor="middle">Minamata 2013</text><text class="small" x="550" y="176" text-anchor="middle">mercury</text><text class="small" x="550" y="192" text-anchor="middle"></text><line class="stroke" x1="550" y1="210" x2="550" y2="242"/><circle class="yes" cx="670" cy="250" r="7"/><rect class="panel-d" x="608" y="234" width="124" height="76" rx="8"/><text class="sh" x="670" y="256" text-anchor="middle">Paris 2015</text><text class="small" x="670" y="276" text-anchor="middle">the climate agreement:</text><text class="small" x="670" y="292" text-anchor="middle">below 2C, pursue 1.5C</text><line class="stroke" x1="670" y1="258" x2="670" y2="232"/><text class="small" x="390" y="440" text-anchor="middle">States negotiate, ratify, and report against commitments: that is what makes an MEA more than a press release.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
