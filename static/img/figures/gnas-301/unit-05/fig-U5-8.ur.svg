<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ماحول اور صحت کے سات پائیدار ترقیاتی اہداف</title><desc id="d">ماحول اور صحت کے سات ایس ڈی جی کا جدول: ہر ہدف اور ایک پاکستانی نقطہ</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">ماحول اور صحت کے سات ایس ڈی جی</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75" text-anchor="start">ہدف</text><text class="h" x="250" y="75" text-anchor="start">ہدف ایک سطر میں</text><text class="h" x="540" y="75" text-anchor="start">ایک پاکستانی نقطہ</text><rect class="panel-a" x="26" y="88" width="728" height="44"/><text class="sh" x="40" y="114" text-anchor="start">ایس ڈی جی 3 صحت</text><text class="body" x="250" y="114" text-anchor="start">ہوا اور پانی کی آلودگی سے</text><text class="body" x="250" y="133" text-anchor="start">موتوں میں کمی</text><text class="body" x="540" y="114" text-anchor="start">شہروں کے صاف ہوا منصوبے</text><rect class="panel-b" x="26" y="132" width="728" height="44"/><text class="sh" x="40" y="158" text-anchor="start">ایس ڈی جی 6 پانی</text><text class="body" x="250" y="158" text-anchor="start">سب کے لیے محفوظ پانی اور صفائی</text><text class="body" x="250" y="177" text-anchor="start">سب کے لیے</text><text class="body" x="540" y="158" text-anchor="start">پینے کے پانی کے معیار</text><rect class="panel-c" x="26" y="176" width="728" height="44"/><text class="sh" x="40" y="202" text-anchor="start">ایس ڈی جی 7 توانائی</text><text class="body" x="250" y="202" text-anchor="start">صاف، سستی توانائی</text><text class="body" x="540" y="202" text-anchor="start">گرڈ کی ناکامی پر سولر</text><rect class="panel-d" x="26" y="220" width="728" height="44"/><text class="sh" x="40" y="246" text-anchor="start">ایس ڈی جی 11 شہر</text><text class="body" x="250" y="246" text-anchor="start">محفوظ، پائیدار شہر</text><text class="body" x="540" y="246" text-anchor="start">ہر گلی میں کچرا اٹھانا</text><rect class="panel" x="26" y="264" width="728" height="44"/><text class="sh" x="40" y="290" text-anchor="start">ایس ڈی جی 12 استعمال</text><text class="body" x="250" y="290" text-anchor="start">ذمہ دار استعمال</text><text class="body" x="250" y="309" text-anchor="start">اور پیداوار</text><text class="body" x="540" y="290" text-anchor="start">یونٹ 2 کی کچرے کی ترتیب</text><rect class="panel" x="26" y="308" width="728" height="44"/><text class="sh" x="40" y="334" text-anchor="start">ایس ڈی جی 13 موسمیات</text><text class="body" x="250" y="334" text-anchor="start">فوری موسمیاتی کارروائی</text><text class="body" x="540" y="334" text-anchor="start">قومی موسمیاتی تبدیلی پالیسی</text><rect class="panel" x="26" y="352" width="728" height="44"/><text class="sh" x="40" y="378" text-anchor="start">ایس ڈی جی 15 زمین</text><text class="body" x="250" y="378" text-anchor="start">زمین پر زندگی کا تحفظ</text><text class="body" x="540" y="378" text-anchor="start">مینگرووز اور جنگلات کی بحالی</text><text class="small" x="390" y="418" text-anchor="middle">ہر ہدف کے ساتھ اشاریے ہیں: یہی خواہش کو ایسا بناتا ہے جس کے بارے میں وزارت سے پوچھا جا سکے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
