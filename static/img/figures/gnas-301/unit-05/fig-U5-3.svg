<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the fate of a xenobiotic</title><desc id="d">Flowchart of the fate of a xenobiotic, absorption, distribution, biotransformation with its two outcomes detoxification and bioactivation, then excretion or storage</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The fate of a xenobiotic</text><rect class="panel-a" x="26" y="80" width="178" height="90" rx="8"/><text class="sh" x="115" y="106" text-anchor="middle">1. absorption</text><text class="small" x="115" y="130" text-anchor="middle">entry by lung,</text><text class="small" x="115" y="150" text-anchor="middle">gut or skin</text><line class="stroke" x1="204" y1="125" x2="218" y2="125" marker-end="url(#arrow)"/><rect class="panel-a" x="216" y="80" width="178" height="90" rx="8"/><text class="sh" x="305" y="106" text-anchor="middle">2. distribution</text><text class="small" x="305" y="130" text-anchor="middle">the blood carries it</text><text class="small" x="305" y="150" text-anchor="middle">to its parking place</text><line class="stroke" x1="394" y1="125" x2="408" y2="125" marker-end="url(#arrow)"/><rect class="panel-c" x="406" y="80" width="178" height="90" rx="8"/><text class="sh" x="495" y="106" text-anchor="middle">3. biotrans-</text><text class="small" x="495" y="130" text-anchor="middle">formation: the liver</text><text class="small" x="495" y="150" text-anchor="middle">reworks it chemically</text><line class="stroke" x1="584" y1="125" x2="598" y2="125" marker-end="url(#arrow)"/><rect class="panel-b" x="596" y="80" width="178" height="90" rx="8"/><text class="sh" x="685" y="106" text-anchor="middle">4. excretion or</text><text class="small" x="685" y="130" text-anchor="middle">storage: kidneys,</text><text class="small" x="685" y="150" text-anchor="middle">breath, bile; fat, bone</text><rect class="panel-a" x="300" y="240" width="230" height="70" rx="8"/><text class="sh" x="415" y="266" text-anchor="middle">detoxification (usual)</text><text class="small" x="415" y="288" text-anchor="middle">a less harmful, exportable product</text><rect class="panel-d" x="300" y="330" width="230" height="70" rx="8"/><text class="sh" x="415" y="356" text-anchor="middle">bioactivation (sometimes)</text><text class="small" x="415" y="378" text-anchor="middle">a more poisonous product</text><path class="stroke" d="M 415 170 L 415 238" marker-end="url(#arrow)"/><path class="stroke" d="M 415 310 L 415 328" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="small" x="60" y="280">The liver is a treatment plant with a queue,</text><text class="small" x="60" y="300">not a shield: the sprayer's pesticide became</text><text class="small" x="60" y="320">its active, nerve-attacking form inside it.</text><text class="small" x="390" y="440" text-anchor="middle">The container's label is not the body's biography.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
