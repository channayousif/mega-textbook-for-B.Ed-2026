<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of an atmospheric agent route to harm</title><desc id="d">Diagram of an atmospheric agent route to harm, from emission through air, blood and target organ to effect, with carbon monoxide as the worked example</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The route to harm: an atmospheric agent</text><rect class="panel-c" x="26" y="80" width="128" height="96" rx="8"/><text class="sh" x="90" y="106" text-anchor="middle">1. emission</text><text class="small" x="90" y="130" text-anchor="middle">a generator, a kiln,</text><text class="small" x="90" y="150" text-anchor="middle">traffic, waste burning</text><line class="stroke" x1="154" y1="128" x2="170" y2="128" marker-end="url(#arrow)"/><rect class="panel-b" x="176" y="80" width="128" height="96" rx="8"/><text class="sh" x="240" y="106" text-anchor="middle">2. the air</text><text class="small" x="240" y="130" text-anchor="middle">breath carries it in;</text><text class="small" x="240" y="150" text-anchor="middle">concentration x time</text><line class="stroke" x1="304" y1="128" x2="320" y2="128" marker-end="url(#arrow)"/><rect class="panel-a" x="326" y="80" width="128" height="96" rx="8"/><text class="sh" x="390" y="106" text-anchor="middle">3. the blood</text><text class="small" x="390" y="130" text-anchor="middle">it rides the bloodstream</text><text class="small" x="390" y="150" text-anchor="middle">to its parking place</text><line class="stroke" x1="454" y1="128" x2="470" y2="128" marker-end="url(#arrow)"/><rect class="panel-d" x="476" y="80" width="128" height="96" rx="8"/><text class="sh" x="540" y="106" text-anchor="middle">4. the target</text><text class="small" x="540" y="130" text-anchor="middle">lungs, blood, brain:</text><text class="small" x="540" y="150" text-anchor="middle">the organ it harms</text><line class="stroke" x1="604" y1="128" x2="620" y2="128" marker-end="url(#arrow)"/><rect class="panel-c" x="626" y="80" width="128" height="96" rx="8"/><text class="sh" x="690" y="106" text-anchor="middle">5. the effect</text><text class="small" x="690" y="130" text-anchor="middle">headache to disease:</text><text class="small" x="690" y="150" text-anchor="middle">the harm arrives</text><rect class="panel" x="26" y="216" width="728" height="196" rx="10"/><text class="sh" x="44" y="244">Worked example: the generator on the landing</text><text class="body" x="44" y="272">Emission: incomplete combustion in a closed stairwell, door shut against thieves.</text><text class="body" x="44" y="294">The air: high CO concentration, hours of it, midnight to morning.</text><text class="body" x="44" y="316">The blood: CO takes the oxygen seats, hundreds of times tighter than oxygen.</text><text class="body" x="44" y="338">The target: the oxygen-hungry brain. The effect: headache, nausea, collapse.</text><text class="body" x="44" y="368">Protection at the receptor: never indoors. At the source: a vented generator.</text><text class="small" x="390" y="440" text-anchor="middle">The Unit 2 pollution chain, walked inside the body.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
