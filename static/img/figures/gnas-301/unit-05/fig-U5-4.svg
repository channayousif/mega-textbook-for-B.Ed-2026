<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Detoxification versus bioactivation</title><desc id="d">Table comparing detoxification and bioactivation with what the liver produces, a worked example and the risk each carries</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Detoxification versus bioactivation</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Outcome</text><text class="h" x="220" y="75">What the liver produces</text><text class="h" x="450" y="75">One worked example</text><text class="h" x="600" y="75">The risk</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="40" y="114">Detoxification</text><text class="body" x="220" y="114">a less harmful, water-</text><text class="body" x="220" y="133">soluble, exportable product</text><text class="body" x="450" y="114">CO breathed back out</text><text class="body" x="450" y="133">in clean air</text><text class="body" x="600" y="114">takes time</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="40" y="202">Bioactivation</text><text class="body" x="220" y="202">a more poisonous product</text><text class="body" x="220" y="221">than the original</text><text class="body" x="450" y="202">an organophosphate turned</text><text class="body" x="450" y="221">into its nerve-attacking form</text><text class="body" x="600" y="202">harm outruns the label</text><text class="small" x="390" y="286" text-anchor="middle">Biotransformation is not always detoxification: the same machinery can go either way.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
