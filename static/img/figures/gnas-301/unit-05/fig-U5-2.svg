<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six atmospheric agents and their impacts</title><desc id="d">Table of six atmospheric agents with main source, target organ and impact, and one protection for each</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Six atmospheric agents and their impacts</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Agent</text><text class="h" x="200" y="75">Main source</text><text class="h" x="420" y="75">Target and impact</text><text class="h" x="620" y="75">One protection</text><rect class="panel-a" x="26" y="88" width="728" height="52"/><text class="sh" x="40" y="114">Carbon monoxide</text><text class="body" x="200" y="114">generators, incomplete</text><text class="body" x="200" y="133">burning</text><text class="body" x="420" y="114">blood: takes the</text><text class="body" x="420" y="133">oxygen seats</text><text class="body" x="620" y="114">never run indoors</text><rect class="panel-b" x="26" y="140" width="728" height="52"/><text class="sh" x="40" y="166">Sulfur dioxide</text><text class="body" x="200" y="166">coal, oil, kilns</text><text class="body" x="420" y="166">airways: inflammation,</text><text class="body" x="420" y="185">asthma worsens</text><text class="body" x="620" y="166">cleaner fuel</text><rect class="panel-c" x="26" y="192" width="728" height="52"/><text class="sh" x="40" y="218">Nitrogen dioxide</text><text class="body" x="200" y="218">engines, furnaces</text><text class="body" x="420" y="218">airways: inflammation</text><text class="body" x="420" y="237">on high days</text><text class="body" x="620" y="218">engine standards</text><rect class="panel-d" x="26" y="244" width="728" height="52"/><text class="sh" x="40" y="270">Ozone (ground)</text><text class="body" x="200" y="270">sunlight cooking other</text><text class="body" x="200" y="289">pollutants</text><text class="body" x="420" y="270">lungs: irritation on</text><text class="body" x="420" y="289">hot afternoons</text><text class="body" x="620" y="270">cut its source gases</text><rect class="panel" x="26" y="296" width="728" height="52"/><text class="sh" x="40" y="322">PM2.5</text><text class="body" x="200" y="322">combustion, dust</text><text class="body" x="420" y="322">heart and lungs:</text><text class="body" x="420" y="341">disease and cancers</text><text class="body" x="620" y="322">end open burning</text><rect class="panel" x="26" y="348" width="728" height="52"/><text class="sh" x="40" y="374">Lead</text><text class="body" x="200" y="374">some fuels, old paint</text><text class="body" x="420" y="374">brain: no safe level</text><text class="body" x="420" y="393">for children</text><text class="body" x="620" y="374">unleaded fuel</text><text class="small" x="390" y="422" text-anchor="middle">What cannot be smelled can still poison: the nose did not evolve for industrial chemistry.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
