<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Seven SDGs for environment and health</title><desc id="d">Table of seven SDGs for environment and health with each goal target and one Pakistan anchor</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Seven SDGs for environment and health</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Goal</text><text class="h" x="250" y="75">Its target in one line</text><text class="h" x="540" y="75">One Pakistan anchor</text><rect class="panel-a" x="26" y="88" width="728" height="44"/><text class="sh" x="40" y="114">SDG 3 health</text><text class="body" x="250" y="114">reduce deaths from air and</text><text class="body" x="250" y="133">water pollution</text><text class="body" x="540" y="114">clean air plans for cities</text><rect class="panel-b" x="26" y="132" width="728" height="44"/><text class="sh" x="40" y="158">SDG 6 water</text><text class="body" x="250" y="158">safe water and sanitation</text><text class="body" x="250" y="177">for all</text><text class="body" x="540" y="158">drinking-water quality standards</text><rect class="panel-c" x="26" y="176" width="728" height="44"/><text class="sh" x="40" y="202">SDG 7 energy</text><text class="body" x="250" y="202">clean, affordable energy</text><text class="body" x="540" y="202">solar where the grid fails</text><rect class="panel-d" x="26" y="220" width="728" height="44"/><text class="sh" x="40" y="246">SDG 11 cities</text><text class="body" x="250" y="246">safe, sustainable cities</text><text class="body" x="540" y="246">waste collection in every lane</text><rect class="panel" x="26" y="264" width="728" height="44"/><text class="sh" x="40" y="290">SDG 12 consumption</text><text class="body" x="250" y="290">responsible consumption</text><text class="body" x="250" y="309">and production</text><text class="body" x="540" y="290">the waste hierarchy of Unit 2</text><rect class="panel" x="26" y="308" width="728" height="44"/><text class="sh" x="40" y="334">SDG 13 climate</text><text class="body" x="250" y="334">urgent climate action</text><text class="body" x="540" y="334">National Climate Change Policy</text><rect class="panel" x="26" y="352" width="728" height="44"/><text class="sh" x="40" y="378">SDG 15 land</text><text class="body" x="250" y="378">protect life on land</text><text class="body" x="540" y="378">mangrove and forest restoration</text><text class="small" x="390" y="418" text-anchor="middle">Each goal carries targets and indicators: that is what turns a wish into something a ministry can be asked about.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
