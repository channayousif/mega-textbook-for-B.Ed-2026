<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ فضائی عناصر اور ان کے اثرات</title><desc id="d">چھ فضائی عناصر کا جدول: ذریعہ، ہدف عضو، اثر اور ہر ایک کا تحفظ</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">چھ فضائی عناصر اور ان کے اثرات</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75" text-anchor="start">عنصر</text><text class="h" x="200" y="75" text-anchor="start">بنیادی ذریعہ</text><text class="h" x="420" y="75" text-anchor="start">ہدف اور اثر</text><text class="h" x="620" y="75" text-anchor="start">ایک تحفظ</text><rect class="panel-a" x="26" y="88" width="728" height="52"/><text class="sh" x="40" y="114" text-anchor="start">کاربن مونو آکسائیڈ</text><text class="body" x="200" y="114" text-anchor="start">جنریٹر، نامکمل</text><text class="body" x="200" y="133" text-anchor="start">جلنا</text><text class="body" x="420" y="114" text-anchor="start">خون: آکسیجن کی</text><text class="body" x="420" y="133" text-anchor="start">سیٹیں لیتا ہے</text><text class="body" x="620" y="114" text-anchor="start">کبھی اندر نہ چلائیں</text><rect class="panel-b" x="26" y="140" width="728" height="52"/><text class="sh" x="40" y="166" text-anchor="start">سلفر ڈائی آکسائیڈ</text><text class="body" x="200" y="166" text-anchor="start">کوئلہ، تیل، بھٹے</text><text class="body" x="420" y="166" text-anchor="start">سانس کی نالی: سوزش،</text><text class="body" x="420" y="185" text-anchor="start">دمہ بڑھتا ہے</text><text class="body" x="620" y="166" text-anchor="start">صاف ایندھن</text><rect class="panel-c" x="26" y="192" width="728" height="52"/><text class="sh" x="40" y="218" text-anchor="start">نائٹروجن ڈائی آکسائیڈ</text><text class="body" x="200" y="218" text-anchor="start">انجن، بھٹیاں</text><text class="body" x="420" y="218" text-anchor="start">سانس کی نالی: سوزش</text><text class="body" x="420" y="237" text-anchor="start">زیادہ دنوں پر</text><text class="body" x="620" y="218" text-anchor="start">انجن کے معیار</text><rect class="panel-d" x="26" y="244" width="728" height="52"/><text class="sh" x="40" y="270" text-anchor="start">اوزون (زمینی)</text><text class="body" x="200" y="270" text-anchor="start">دھوپ دیگر آلودگیوں</text><text class="body" x="200" y="289" text-anchor="start">سے بناتا ہے</text><text class="body" x="420" y="270" text-anchor="start">پھیپھڑوں میں جلن</text><text class="body" x="420" y="289" text-anchor="start">گرم دوپہروں میں</text><text class="body" x="620" y="270" text-anchor="start">ذریعہ گیسوں میں کمی</text><rect class="panel" x="26" y="296" width="728" height="52"/><text class="sh" x="40" y="322" text-anchor="start">پی ایم 2.5</text><text class="body" x="200" y="322" text-anchor="start">احتراق، دھول</text><text class="body" x="420" y="322" text-anchor="start">خون اور دل:</text><text class="body" x="420" y="341" text-anchor="start">دونوں میں داخل ہوتا ہے</text><text class="body" x="620" y="322" text-anchor="start">کھلا جلانا بند</text><rect class="panel" x="26" y="348" width="728" height="52"/><text class="sh" x="40" y="374" text-anchor="start">سیسہ</text><text class="body" x="200" y="374" text-anchor="start">کچھ ایندھن، پرانی پینٹ</text><text class="body" x="420" y="374" text-anchor="start">دماغ: کوئی محفوظ سطح نہیں</text><text class="body" x="420" y="393" text-anchor="start">بچوں کے لیے</text><text class="body" x="620" y="374" text-anchor="start">بغیر سیسہ ایندھن</text><text class="small" x="390" y="422" text-anchor="middle">جس کی بو نہ آئے وہ بھی زہر دے سکتا ہے: ناک صنعتی کیمسٹری کے لیے نہیں بنی۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
