<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">قدری ڈی ٹاکسیفیکیشن کا فلو چارٹ</title><desc id="d">قدری ڈی ٹاکسیفیکیشن کا فلو چارٹ: جگر کے دو مرحلے، پھر گردوں، پھیپھڑوں اور آنتوں کے راستے، چربی اور ہڈی میں ذخیرے کی شاخ کے ساتھ</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">جسم کا فضلہ نظام: کسی ڈبے کی ضرورت نہیں</text><rect class="panel-a" x="40" y="80" width="300" height="80" rx="10"/><text class="sh" x="190" y="108" text-anchor="middle">جگر مرحلہ 1: کیمیائی تبدیلی</text><text class="small" x="190" y="132" text-anchor="middle">حیاتیاتی تبدیلی، موضوع 5.2 کی ورکشاپ</text><rect class="panel-a" x="440" y="80" width="300" height="80" rx="10"/><text class="sh" x="590" y="108" text-anchor="middle">جگر مرحلہ 2: اخراج کے لیے جوڑ</text><text class="small" x="590" y="132" text-anchor="middle">ایک دستہ جو اسے پانی میں گھلنشیل بناتا ہے</text><line class="stroke" x1="340" y1="120" x2="438" y2="120" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="250" width="200" height="70" rx="8"/><text class="sh" x="140" y="276" text-anchor="middle">گردے</text><text class="small" x="140" y="298" text-anchor="middle">پیشاب: سب سے مصروف راستہ</text><path class="stroke" d="M590 160 L590 200 L140 200 L140 248" marker-end="url(#arrow)"/><rect class="panel-b" x="280" y="250" width="200" height="70" rx="8"/><text class="sh" x="380" y="276" text-anchor="middle">پھیپھڑے</text><text class="small" x="380" y="298" text-anchor="middle">سانس: CO یہاں سے نکلتا ہے</text><path class="stroke" d="M590 160 L590 200 L380 200 L380 248" marker-end="url(#arrow)"/><rect class="panel-b" x="520" y="250" width="200" height="70" rx="8"/><text class="sh" x="620" y="276" text-anchor="middle">آنتیں</text><text class="small" x="620" y="298" text-anchor="middle">صفرا اور فضلہ</text><path class="stroke" d="M590 160 L590 200 L620 200 L620 248" marker-end="url(#arrow)"/><rect class="panel-d" x="280" y="370" width="220" height="56" rx="8"/><text class="sh" x="390" y="392" text-anchor="middle">ذخیرہ: چربی اور ہڈی</text><text class="small" x="390" y="412" text-anchor="middle">ضدی چیزیں، کبھی برسوں تک</text><path class="stroke" d="M390 320 L390 368" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text class="small" x="390" y="452" text-anchor="middle">مدد: پانی، غذا، بچاؤ، وقت۔ رکاوٹ: رابطہ، غذائی کمی، بیماری۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
