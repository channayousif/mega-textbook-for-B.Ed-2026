<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ڈی ٹاکسیفیکیشن میں مددگار اور رکاوٹ چیزیں</title><desc id="d">جسم کی قدرتی صاف کرنے میں مددگار اور رکاوٹ چیزوں کا جدول، مثالوں اور دیانتدارانہ نوٹ کے ساتھ</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">ڈی ٹاکسیفیکیشن میں مدد اور رکاوٹ</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75" text-anchor="start"></text><text class="h" x="200" y="75" text-anchor="start">کیا کرتا ہے</text><text class="h" x="420" y="75" text-anchor="start">مثالیں</text><text class="h" x="590" y="75" text-anchor="start">دیانتدارانہ نوٹ</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="40" y="114" text-anchor="start">مددگار</text><text class="body" x="200" y="114" text-anchor="start">نظام چلتا رکھتا ہے</text><text class="body" x="200" y="133" text-anchor="start">اور مہیا رکھتا ہے</text><text class="body" x="420" y="114" text-anchor="start">پانی، غذا،</text><text class="body" x="420" y="133" text-anchor="start">بچاؤ، وقت</text><text class="body" x="590" y="114" text-anchor="start">سادہ، اور پوری طبیعیات</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="40" y="202" text-anchor="start">رکاوٹ</text><text class="body" x="200" y="202" text-anchor="start">سست یا زیادہ بوجھ</text><text class="body" x="200" y="221" text-anchor="start">صفائی گھر کو</text><text class="body" x="420" y="202" text-anchor="start">بار بار رابطہ،</text><text class="body" x="420" y="221" text-anchor="start">غذائی کمی، جگر کی بیماری</text><text class="body" x="590" y="202" text-anchor="start">صف بھری رہتی ہے</text><text class="small" x="390" y="286" text-anchor="middle">تجارتی ڈی ٹاکس نظام کا نام لیتا ہے، اس کی نالیوں کو ہاتھ نہیں لگاتا۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
