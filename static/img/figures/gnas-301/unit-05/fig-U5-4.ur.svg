<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ڈی ٹاکسیفیکیشن بمقابلہ بایو ایکٹیویشن</title><desc id="d">ڈی ٹاکسیفیکیشن اور بایو ایکٹیویشن کا موازنہ: جگر کیا بناتا ہے، ایک مثال اور ہر ایک کا خطرہ</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">ڈی ٹاکسیفیکیشن بمقابلہ بایو ایکٹیویشن</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75" text-anchor="start">نتیجہ</text><text class="h" x="220" y="75" text-anchor="start">جگر کیا بناتا ہے</text><text class="h" x="450" y="75" text-anchor="start">ایک مثال</text><text class="h" x="600" y="75" text-anchor="start">خطرہ</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="40" y="114" text-anchor="start">ڈی ٹاکسیفیکیشن</text><text class="body" x="220" y="114" text-anchor="start">کم نقصان دہ، پانی میں</text><text class="body" x="220" y="133" text-anchor="start">گھلنشیل، نکلنے کے قابل مصنوع</text><text class="body" x="450" y="114" text-anchor="start">CO سانس کے ذریعے باہر</text><text class="body" x="450" y="133" text-anchor="start">صاف ہوا میں</text><text class="body" x="600" y="114" text-anchor="start">وقت لیتا ہے</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="40" y="202" text-anchor="start">بایو ایکٹیویشن</text><text class="body" x="220" y="202" text-anchor="start">زیادہ زہریلا مصنوع</text><text class="body" x="220" y="221" text-anchor="start">اصل سے زیادہ</text><text class="body" x="450" y="202" text-anchor="start">ایک آرگنو فاسفیٹ بدل کر</text><text class="body" x="450" y="221" text-anchor="start">اپنی اعصاب پر حملہ شکل میں</text><text class="body" x="600" y="202" text-anchor="start">نقصان لیبل سے آگے</text><text class="small" x="390" y="286" text-anchor="middle">حیاتیاتی تبدیلی ہمیشہ ڈی ٹاکسیفیکیشن نہیں: وہی مشینری دونوں طرف جا سکتی ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
