<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کچرے کی ترتیب کی سیڑھی کا فلو چارٹ</title><desc id="d">کچرے کی ترتیب کی اترتی سیڑھی کا فلو چارٹ: کم کریں، دوبارہ استعمال، ری سائیکل، بحالی، اخراج، ہر مرحلے کے ساتھ اسکول کی سطح کا ایک کام</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="32" text-anchor="middle">کچرے کی ترتیب: بہترین سے بدترین تک</text><rect class="panel-a" x="420" y="56" width="330" height="64" rx="8"/><text class="sh" x="734" y="82" text-anchor="end">1. کم کریں</text><text class="body" x="734" y="104" text-anchor="end">کچرا پیدا ہی نہ کریں</text><text class="small" x="390" y="82" text-anchor="start">بارہ پیکٹوں کی جگہ ایک ڈبہ</text><rect class="panel-a" x="330" y="132" width="330" height="64" rx="8"/><text class="sh" x="644" y="158" text-anchor="end">2. دوبارہ استعمال</text><text class="body" x="644" y="180" text-anchor="end">اسے دوسری زندگی دیں</text><text class="small" x="140" y="158" text-anchor="start">ڈبہ پنسل باکس بن جاتا ہے</text><rect class="panel-b" x="240" y="208" width="330" height="64" rx="8"/><text class="sh" x="554" y="234" text-anchor="end">3. ری سائیکل</text><text class="body" x="554" y="256" text-anchor="end">اسے صاف مواد میں بدلیں</text><text class="small" x="140" y="234" text-anchor="start">صاف کاغذ اور دھات الگ رکھیں</text><rect class="panel-b" x="150" y="284" width="330" height="64" rx="8"/><text class="sh" x="464" y="310" text-anchor="end">4. بحالی</text><text class="body" x="464" y="332" text-anchor="end">کمپوسٹ، یا مناسب پلانٹ میں توانائی</text><text class="small" x="140" y="310" text-anchor="start">کھانے کا کچرا کمپوسٹ ڈھیر پر</text><rect class="panel-d" x="60" y="360" width="330" height="64" rx="8"/><text class="sh" x="374" y="386" text-anchor="end">5. اخراج</text><text class="body" x="374" y="408" text-anchor="end">بھرائی، پکی اور منظم جگہ: آخری سہارا</text><text class="small" x="750" y="44" text-anchor="end">بہترین</text><text class="small" x="64" y="436" text-anchor="end">بدترین</text><line class="stroke-a" x1="720" y1="44" x2="680" y2="44" marker-end="url(#arrow)"/><line class="stroke-a" x1="80" y1="436" x2="120" y2="436"/><text class="small" x="390" y="444" text-anchor="middle">شہر ملے جلے گندے کچرے کو ری سائیکل یا کمپوسٹ نہیں کر سکتا: ڈبے پر چھانٹی بعد کی سب کچھ طے کرتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
