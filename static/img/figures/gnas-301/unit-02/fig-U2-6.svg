<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing hospital clinical waste and industrial hazardous waste</title><desc id="d">Table comparing hospital clinical waste and industrial hazardous waste with typical items, the hazard and the handling rule</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Two hazardous streams, two rule sets</text><rect class="panel" x="26" y="52" width="728" height="38"/><text class="h" x="40" y="77">Stream</text><text class="h" x="190" y="77">Typical items</text><text class="h" x="420" y="77">Why hazardous</text><text class="h" x="590" y="77">Handling rule</text><rect class="panel-c" x="26" y="90" width="728" height="130"/><text class="sh" x="40" y="118">Hospital</text><text class="sh" x="40" y="136">clinical</text><text class="sh" x="40" y="154">waste</text><text class="body" x="190" y="118">sharps (needles, blades);</text><text class="body" x="190" y="138">infectious dressings;</text><text class="body" x="190" y="158">laboratory cultures;</text><text class="body" x="190" y="178">expired medicines</text><text class="body" x="420" y="118">infection and injury:</text><text class="body" x="420" y="138">a needle can pass disease</text><text class="body" x="420" y="158">straight through the</text><text class="body" x="420" y="178">skin</text><text class="body" x="590" y="118">segregate at the point</text><text class="body" x="590" y="138">of use into colour-coded</text><text class="body" x="590" y="158">bins; sealed sharps box;</text><text class="body" x="590" y="178">licensed treatment</text><rect class="panel-b" x="26" y="220" width="728" height="130"/><text class="sh" x="40" y="248">Industrial</text><text class="sh" x="40" y="266">hazardous</text><text class="sh" x="40" y="284">waste</text><text class="body" x="190" y="248">solvent sludges;</text><text class="body" x="190" y="268">electroplating liquids;</text><text class="body" x="190" y="288">chemical drums;</text><text class="body" x="190" y="308">paint and acid residues</text><text class="body" x="420" y="248">toxic, flammable or</text><text class="body" x="420" y="268">corrosive; can poison</text><text class="body" x="420" y="288">groundwater for</text><text class="body" x="420" y="308">decades</text><text class="body" x="590" y="248">characterise; minimise;</text><text class="body" x="590" y="268">store contained and</text><text class="body" x="590" y="288">labelled; transfer with</text><text class="body" x="590" y="308">a manifest, licensed</text><rect class="panel" x="26" y="348" width="728" height="74"/><text class="sh" x="40" y="374">The cardinal rule</text><text class="body" x="190" y="370">hazardous waste never mixes with the ordinary stream:</text><text class="body" x="190" y="390">one clinical bag makes a whole municipal heap hazardous.</text>
<text class="body" x="190" y="410">Most at risk when rules fail: the sweeper, the picker, the nurse.</text><text class="small" x="390" y="442" text-anchor="middle">Segregate at generation, label and date, store briefly and securely, hand to licensed treatment.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
