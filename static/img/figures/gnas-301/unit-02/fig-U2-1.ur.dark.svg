<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زمین کے تمام پانی کا 100 قطروں میں خاکہ</title><desc id="d">زمین کے پانی کی تقسیم کا 100 قطروں کا خاکہ: 97 قطرے سمندر کا نمکین پانی، 2 برف اور گلیشیئر، ایک سے کم زیرِ زمین پانی، اور دریا و جھیلیں ایک ہی قطرے کا ایک حصہ</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">زمین کا سارا پانی، 100 قطرے</text><rect class="panel-b" x="280" y="60" width="470" height="150" rx="8"/><text class="sh" x="515" y="86" text-anchor="middle">97 قطرے: سمندروں کا نمکین پانی</text><g class="stroke-a" fill="none"><circle cx="710" cy="115" r="9"/><circle cx="680" cy="115" r="9"/><circle cx="650" cy="115" r="9"/><circle cx="620" cy="115" r="9"/><circle cx="590" cy="115" r="9"/><circle cx="560" cy="115" r="9"/><circle cx="530" cy="115" r="9"/><circle cx="500" cy="115" r="9"/><circle cx="470" cy="115" r="9"/><circle cx="440" cy="115" r="9"/><circle cx="410" cy="115" r="9"/><circle cx="380" cy="115" r="9"/><circle cx="350" cy="115" r="9"/><circle cx="320" cy="115" r="9"/><circle cx="710" cy="145" r="9"/><circle cx="680" cy="145" r="9"/><circle cx="650" cy="145" r="9"/><circle cx="620" cy="145" r="9"/><circle cx="590" cy="145" r="9"/><circle cx="560" cy="145" r="9"/><circle cx="530" cy="145" r="9"/><circle cx="500" cy="145" r="9"/><circle cx="470" cy="145" r="9"/><circle cx="440" cy="145" r="9"/><circle cx="410" cy="145" r="9"/><circle cx="380" cy="145" r="9"/><circle cx="350" cy="145" r="9"/><circle cx="320" cy="145" r="9"/><circle cx="710" cy="175" r="9"/><circle cx="680" cy="175" r="9"/><circle cx="650" cy="175" r="9"/><circle cx="620" cy="175" r="9"/><circle cx="590" cy="175" r="9"/><circle cx="560" cy="175" r="9"/><circle cx="530" cy="175" r="9"/><circle cx="500" cy="175" r="9"/><circle cx="470" cy="175" r="9"/><circle cx="440" cy="175" r="9"/><circle cx="410" cy="175" r="9"/><circle cx="380" cy="175" r="9"/><circle cx="350" cy="175" r="9"/><circle cx="320" cy="175" r="9"/></g><text class="small" x="515" y="200" text-anchor="middle">پینے یا سینچنے کے قابل نہیں</text><rect class="panel-a" x="24" y="60" width="226" height="150" rx="8"/><text class="sh" x="137" y="86" text-anchor="middle">3 قطرے: سارا میٹھا پانی</text><circle class="stroke" cx="195" cy="125" r="14"/><circle class="stroke" cx="160" cy="125" r="14"/><text class="body" x="178" y="160" text-anchor="middle">2 برف اور گلیشیئر میں</text><circle class="stroke-a" cx="90" cy="125" r="14"/><text class="body" x="90" y="160" text-anchor="middle">ایک سے کم زیرِ زمین</text><rect class="panel-c" x="30" y="240" width="720" height="150" rx="8"/><text class="sh" x="390" y="266" text-anchor="middle">آخری قطرے کے آخری حصے کو بڑا کر کے دیکھیں</text><circle class="stroke" cx="390" cy="320" r="46"/><path class="stroke" d="M405 320 a15 15 0 0 0 -30 0 z"/><text class="body" x="390" y="382" text-anchor="middle">دریا، جھیلیں، جو پانی دکھائی دیتا ہے:</text><text class="small" x="390" y="400" text-anchor="middle">100 میں سے ایک قطرے کا ایک چھوٹا سا حصہ</text><line class="stroke" x1="137" y1="215" x2="344" y2="294"/><text class="small" x="390" y="432" text-anchor="middle">پانی بہت ہے؛ مگر گھر کی ضرورت کی شکل، جگہ اور موسم میں بہت تھوڑا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
