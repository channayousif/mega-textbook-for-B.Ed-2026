<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the water pollution pathway</title><desc id="d">Flowchart of the water pollution pathway from source through pathway to receptor to health effect, with remedy points marked at each arrow</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The pollution chain, and where to cut it</text><rect class="panel-c" x="30" y="80" width="160" height="90" rx="10"/><text class="sh" x="110" y="112" text-anchor="middle">1. source</text><text class="small" x="110" y="134" text-anchor="middle">a drain, a factory,</text><text class="small" x="110" y="152" text-anchor="middle">a field, a latrine</text><rect class="panel-b" x="216" y="80" width="160" height="90" rx="10"/><text class="sh" x="296" y="112" text-anchor="middle">2. pathway</text><text class="small" x="296" y="134" text-anchor="middle">canal, river, drain,</text><text class="small" x="296" y="152" text-anchor="middle">soil, aquifer</text><rect class="panel-a" x="402" y="80" width="160" height="90" rx="10"/><text class="sh" x="482" y="112" text-anchor="middle">3. receptor</text><text class="small" x="482" y="134" text-anchor="middle">a well, a fish,</text><text class="small" x="482" y="152" text-anchor="middle">a crop, a swimmer</text><rect class="panel-d" x="588" y="80" width="160" height="90" rx="10"/><text class="sh" x="668" y="112" text-anchor="middle">4. effect</text><text class="small" x="668" y="134" text-anchor="middle">illness, lost fish,</text><text class="small" x="668" y="152" text-anchor="middle">burned crops</text><line class="stroke" x1="190" y1="125" x2="214" y2="125" marker-end="url(#arrow)"/><line class="stroke" x1="376" y1="125" x2="400" y2="125" marker-end="url(#arrow)"/><line class="stroke" x1="562" y1="125" x2="586" y2="125" marker-end="url(#arrow)"/><g class="stroke" fill="none"><circle cx="202" cy="125" r="11"/><circle cx="388" cy="125" r="11"/><circle cx="574" cy="125" r="11"/></g><text class="small" x="202" y="60" text-anchor="middle">remedy point</text><text class="small" x="202" y="76" text-anchor="middle">cut here</text><rect class="panel" x="30" y="216" width="720" height="170" rx="10"/><text class="sh" x="48" y="244">At the source</text><text class="body" x="48" y="268">latrines and sewerage; keep waste out of the drain;</text><text class="body" x="48" y="290">effluent treatment before discharge; safer chemicals</text><text class="sh" x="48" y="322">On the pathway</text><text class="body" x="48" y="346">protect the wellhead; lined drains; treatment of the</text><text class="body" x="48" y="368">water body itself where standards demand it</text><text class="sh" x="420" y="244">At the receptor</text><text class="body" x="420" y="268">boil or chlorinate drinking water; a sealed, tested</text><text class="body" x="420" y="290">well; avoid irrigating crops with unsafe water</text><text class="body" x="420" y="322">The rule: every remedy in this unit cuts one link.</text><text class="body" x="420" y="346">Name the link before you choose the remedy.</text><text class="small" x="390" y="430" text-anchor="middle">Worked example: the Hyderabad drain is the source, the canal the pathway, the hand pump the receptor.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
