<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of Pakistan's four water resources</title><desc id="d">Table of Pakistan's four water resources, the Indus system, glaciers and snowmelt, groundwater and rainfall, each with what it supplies, its condition and one challenge</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Pakistan's water resources</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Resource</text><text class="h" x="210" y="75">What it supplies</text><text class="h" x="420" y="75">Condition in one line</text><text class="h" x="600" y="75">One challenge</text><rect class="panel-b" x="26" y="88" width="728" height="72"/><text class="sh" x="40" y="114">Indus river system</text><text class="body" x="210" y="114">most surface water;</text><text class="body" x="210" y="134">the world's largest</text><text class="body" x="210" y="154">irrigation network</text><text class="body" x="420" y="114">already highly stressed</text><text class="body" x="420" y="134">(withdrawals vs runoff,</text><text class="body" x="420" y="154">per-capita availability)</text><text class="body" x="600" y="114">seasonal shifts;</text><text class="body" x="600" y="134">upstream changes;</text><text class="body" x="600" y="154">growing population</text><rect class="panel-a" x="26" y="160" width="728" height="72"/><text class="sh" x="40" y="186">Glaciers and</text><text class="sh" x="40" y="204">snowmelt</text><text class="body" x="210" y="186">the summer flows that</text><text class="body" x="210" y="206">fill the rivers when rain</text><text class="body" x="210" y="226">has not fallen</text><text class="body" x="420" y="186">melting and shifting</text><text class="body" x="420" y="206">with a warming</text><text class="body" x="420" y="226">climate</text><text class="body" x="600" y="186">changed timing of</text><text class="body" x="600" y="206">flow; more flood</text><text class="body" x="600" y="226">and drought extremes</text><rect class="panel-c" x="26" y="232" width="728" height="72"/><text class="sh" x="40" y="258">Groundwater</text><text class="body" x="210" y="258">tube wells and hand</text><text class="body" x="210" y="278">pumps where canals</text><text class="body" x="210" y="298">do not reach</text><text class="body" x="420" y="258">recharged slowly;</text><text class="body" x="420" y="278">can be unsafe, as the</text><text class="body" x="420" y="298">Chachro study showed</text><text class="body" x="600" y="258">over-pumping;</text><text class="body" x="600" y="278">falling, saltier water</text><text class="body" x="600" y="298">tables</text><rect class="panel-d" x="26" y="304" width="728" height="72"/><text class="sh" x="40" y="330">Rainfall</text><text class="body" x="210" y="330">monsoon water for dry</text><text class="body" x="210" y="350">farming and tank</text><text class="body" x="210" y="370">recharge</text><text class="body" x="420" y="330">uneven: high in the</text><text class="body" x="420" y="350">north, thin in Sindh</text><text class="body" x="420" y="370">and Balochistan</text><text class="body" x="600" y="330">runs off in floods</text><text class="body" x="600" y="350">rather than soaking</text><text class="body" x="600" y="370">in where needed</text><text class="small" x="390" y="414" text-anchor="middle">Water security = reliable access to acceptable quality and quantity.</text><text class="small" x="390" y="432" text-anchor="middle">Quantity and quality fail separately: the Indus is stressed, Thar's aquifer is unsafe.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
