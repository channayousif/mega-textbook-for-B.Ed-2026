<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آلودگی کے زنجیر اور اسے کاٹنے کی جگہ کا فلو چارٹ</title><desc id="d">آلودگی کی زنجیر کا فلو چارٹ: ذریعہ سے راستے سے وصول کنندہ سے اثر تک، ہر تیر پر علاج کی جگہ نشان زد</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">آلودگی کی زنجیر اور کہاں کاٹنا ہے</text><rect class="panel-c" x="590" y="80" width="160" height="90" rx="10"/><text class="sh" x="670" y="112" text-anchor="middle">1. ذریعہ</text><text class="small" x="670" y="134" text-anchor="middle">ایک نالہ، ایک فیکٹری،</text><text class="small" x="670" y="152" text-anchor="middle">ایک کھیت، ایک بیت الخلا</text><rect class="panel-b" x="404" y="80" width="160" height="90" rx="10"/><text class="sh" x="484" y="112" text-anchor="middle">2. راستہ</text><text class="small" x="484" y="134" text-anchor="middle">نہر، دریا، نالہ،</text><text class="small" x="484" y="152" text-anchor="middle">مٹی، زیرِ زمین پانی</text><rect class="panel-a" x="218" y="80" width="160" height="90" rx="10"/><text class="sh" x="298" y="112" text-anchor="middle">3. وصول کنندہ</text><text class="small" x="298" y="134" text-anchor="middle">ایک کنواں، ایک مچھلی،</text><text class="small" x="298" y="152" text-anchor="middle">ایک فصل، تیراکنے والا</text><rect class="panel-d" x="32" y="80" width="160" height="90" rx="10"/><text class="sh" x="112" y="112" text-anchor="middle">4. اثر</text><text class="small" x="112" y="134" text-anchor="middle">بیماری، مرا ہوا مویشی،</text><text class="small" x="112" y="152" text-anchor="middle">جلی ہوئی فصلیں</text><line class="stroke" x1="590" y1="125" x2="566" y2="125" marker-end="url(#arrow)"/><line class="stroke" x1="404" y1="125" x2="380" y2="125" marker-end="url(#arrow)"/><line class="stroke" x1="218" y1="125" x2="194" y2="125" marker-end="url(#arrow)"/><g class="stroke" fill="none"><circle cx="578" cy="125" r="11"/><circle cx="392" cy="125" r="11"/><circle cx="206" cy="125" r="11"/></g><text class="small" x="578" y="60" text-anchor="middle">علاج کی جگہ</text><text class="small" x="578" y="76" text-anchor="middle">یہاں کاٹیں</text><rect class="panel" x="30" y="216" width="720" height="170" rx="10"/><text class="sh" x="732" y="244" text-anchor="end">ذریعے پر</text><text class="body" x="732" y="268" text-anchor="end">بیت الخلا اور گندے پانی کا نظام؛ کچرا نالے سے باہر؛</text><text class="body" x="732" y="290" text-anchor="end">اخراج سے پہلے علاج؛ محفوظ کیمیکل</text><text class="sh" x="732" y="322" text-anchor="end">راستے پر</text><text class="body" x="732" y="346" text-anchor="end">کنویں کی منہ کی حفاظت؛ پکی نالیاں؛</text><text class="body" x="732" y="368" text-anchor="end">معیار کے مطابق پانی کا علاج</text><text class="sh" x="360" y="244" text-anchor="end">وصول کنندہ پر</text><text class="body" x="360" y="268" text-anchor="end">پینے کا پانی ابالیں یا کلورین کریں؛ بند، جانچا</text><text class="body" x="360" y="290" text-anchor="end">ہوا کنواں؛ غیر محفوظ پانی سے سینچائی نہ کریں</text><text class="body" x="360" y="322" text-anchor="end">اصول: ہر علاج زنجیر کے ایک ہی کڑے کو کاٹتا ہے۔</text><text class="body" x="360" y="346" text-anchor="end">علاج چننے سے پہلے کڑے کا نام لیں۔</text><text class="small" x="390" y="430" text-anchor="middle">حلیہ مثال: حیدرآباد کا نالہ ذریعہ ہے، نہر راستہ، ہینڈ پمپ وصول کنندہ۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
