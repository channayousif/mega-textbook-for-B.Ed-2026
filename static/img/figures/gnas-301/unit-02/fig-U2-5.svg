<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the waste hierarchy as a descending staircase</title><desc id="d">Flowchart of the waste hierarchy as a descending staircase, reduce, reuse, recycle, recover, dispose, each with a school-scale action</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="32" text-anchor="middle">The waste hierarchy: best to worst</text><rect class="panel-a" x="30" y="56" width="330" height="64" rx="8"/><text class="sh" x="46" y="82">1. reduce</text><text class="body" x="46" y="104">do not create the waste</text><text class="small" x="390" y="82" text-anchor="end">a tin instead of twelve packets</text><rect class="panel-a" x="120" y="132" width="330" height="64" rx="8"/><text class="sh" x="136" y="158">2. reuse</text><text class="body" x="136" y="180">give it a second life</text><text class="small" x="640" y="158" text-anchor="end">the tin becomes a pencil box</text><rect class="panel-b" x="210" y="208" width="330" height="64" rx="8"/><text class="sh" x="226" y="234">3. recycle</text><text class="body" x="226" y="256">turn it into clean material</text><text class="small" x="640" y="234" text-anchor="end">clean paper and metal kept apart</text><rect class="panel-b" x="300" y="284" width="330" height="64" rx="8"/><text class="sh" x="316" y="310">4. recover</text><text class="body" x="316" y="332">compost, or energy in a proper plant</text><text class="small" x="640" y="310" text-anchor="end">food waste to the compost heap</text><rect class="panel-d" x="390" y="360" width="330" height="64" rx="8"/><text class="sh" x="406" y="386">5. dispose</text><text class="body" x="406" y="408">landfill, a lined and managed site: last resort</text><text class="small" x="30" y="44">best</text><text class="small" x="716" y="436">worst</text><line class="stroke-a" x1="60" y1="44" x2="100" y2="44" marker-end="url(#arrow)"/><line class="stroke-a" x1="700" y1="436" x2="660" y2="436"/><text class="small" x="390" y="444" text-anchor="middle">A city cannot recycle or compost what arrives mixed and dirty: sorting at the bin decides everything after it.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
