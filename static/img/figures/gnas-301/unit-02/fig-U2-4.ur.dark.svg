<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ اقسام کے آلودگیوں کا جدول</title><desc id="d">پانی کی آلودگی کی پانچ اقسام کا جدول: ہر ایک کا عام ذریعہ، اثر اور ایک علاج</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">پانی کی آلودگی کی اقسام: ذریعہ، اثر، علاج</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">آلودگی کی قسم</text><text class="h" x="600" y="75" text-anchor="end">عام ذریعہ</text><text class="h" x="380" y="75" text-anchor="end">اثر ایک سطر میں</text><text class="h" x="200" y="75" text-anchor="end">ایک علاج</text><rect class="panel-c" x="26" y="88" width="728" height="62"/><text class="sh" x="740" y="114" text-anchor="end">جراثیم</text><text class="body" x="600" y="114" text-anchor="end">انسانی اور جانوروں کا فضلہ</text><text class="body" x="380" y="114" text-anchor="end">اسہال کی بیماری،</text><text class="body" x="380" y="134" text-anchor="end">پانی کا سب سے بڑا بوجھ</text><text class="body" x="200" y="114" text-anchor="end">بیت الخلا، سیوریج،</text><text class="body" x="200" y="134" text-anchor="end">محفوظ پانی کا علاج</text><rect class="panel-a" x="26" y="150" width="728" height="62"/><text class="sh" x="740" y="176" text-anchor="end">نامی مواد</text><text class="body" x="600" y="176" text-anchor="end">کھانا، ڈیری، ذبیح گاہ</text><text class="body" x="380" y="176" text-anchor="end">سڑ کر پانی کا</text><text class="body" x="380" y="196" text-anchor="end">آکسیجن کھا جاتا ہے؛ مچھلی مر جاتی ہے</text><text class="body" x="200" y="176" text-anchor="end">ثانوی (حیاتیاتی)</text><text class="body" x="200" y="196" text-anchor="end">علاج</text><rect class="panel-a" x="26" y="212" width="728" height="62"/><text class="sh" x="740" y="238" text-anchor="end">غذائی مادے</text><text class="body" x="600" y="238" text-anchor="end">کھاد کا بہاؤ، صابن</text><text class="body" x="380" y="238" text-anchor="end">الگی کا پھیلاؤ، پھر</text><text class="body" x="380" y="258" text-anchor="end">آکسیجن کی کمی: یوٹروفیکیشن</text><text class="body" x="200" y="238" text-anchor="end">میدان کی گھاس کی پٹیاں، فاسفیٹ</text><text class="body" x="200" y="258" text-anchor="end">کی حدیں، ثالثی علاج</text><rect class="panel-b" x="26" y="274" width="728" height="62"/><text class="sh" x="740" y="300" text-anchor="end">بھاری دھاتیں</text><text class="body" x="600" y="300" text-anchor="end">صنعت: چمڑہ گھر، پلیٹنگ</text><text class="body" x="380" y="300" text-anchor="end">پانی، مچھلی اور انسان</text><text class="body" x="380" y="320" text-anchor="end">میں جمع ہوتی ہیں</text><text class="body" x="200" y="300" text-anchor="end">دھاتوں کے لیے ثالثی</text><text class="body" x="200" y="320" text-anchor="end">علاج؛ NECQS کی حدیں</text><rect class="panel-d" x="26" y="336" width="728" height="62"/><text class="sh" x="740" y="362" text-anchor="end">حرارت اور گاد</text><text class="body" x="600" y="362" text-anchor="end">گرم اخراج، مٹی کا کٹاؤ</text><text class="body" x="380" y="362" text-anchor="end">بدل دیتے ہیں کہ پانی</text><text class="body" x="380" y="382" text-anchor="end">کیا سنبھال سکتا ہے</text><text class="body" x="200" y="362" text-anchor="end">ٹھنڈک تالاب؛ کناروں پر</text><text class="body" x="200" y="382" text-anchor="end">کٹاؤ کی روک تھام</text><text class="small" x="390" y="432" text-anchor="middle">صاف ایک رنگ ہے، جانچ نہیں: اس جدول کی سب سے خطرناک آلودگیاں سب نظر نہیں آتیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
