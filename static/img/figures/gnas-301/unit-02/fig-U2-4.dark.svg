<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five water pollutant types</title><desc id="d">Table of five water pollutant types with usual source, impact and one remedy for each</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Water pollutant types: source, impact, remedy</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Pollutant type</text><text class="h" x="180" y="75">Usual source</text><text class="h" x="400" y="75">Impact in one line</text><text class="h" x="580" y="75">One remedy</text><rect class="panel-c" x="26" y="88" width="728" height="62"/><text class="sh" x="40" y="114">Pathogens</text><text class="body" x="180" y="114">human and animal waste</text><text class="body" x="400" y="114">diarrhoeal disease, the</text><text class="body" x="400" y="134">heaviest water burden</text><text class="body" x="580" y="114">latrines, sewerage,</text><text class="body" x="580" y="134">safe water treatment</text><rect class="panel-a" x="26" y="150" width="728" height="62"/><text class="sh" x="40" y="176">Organic matter</text><text class="body" x="180" y="176">food, dairy, slaughterhouse</text><text class="body" x="400" y="176">decays and uses up the</text><text class="body" x="400" y="196">water's oxygen; fish die</text><text class="body" x="580" y="176">secondary (biological)</text><text class="body" x="580" y="196">treatment</text><rect class="panel-a" x="26" y="212" width="728" height="62"/><text class="sh" x="40" y="238">Nutrients</text><text class="body" x="180" y="238">fertiliser run-off, detergent</text><text class="body" x="400" y="238">algal bloom, then oxygen</text><text class="body" x="400" y="258">collapse: eutrophication</text><text class="body" x="580" y="238">buffer strips, phosphate</text><text class="body" x="580" y="258">limits, tertiary treatment</text><rect class="panel-b" x="26" y="274" width="728" height="62"/><text class="sh" x="40" y="300">Heavy metals</text><text class="body" x="180" y="300">industry: tanneries, plating</text><text class="body" x="400" y="300">persist and accumulate in</text><text class="body" x="400" y="320">water, fish and people</text><text class="body" x="580" y="300">tertiary treatment built</text><text class="body" x="580" y="320">for metals; NEQS limits</text><rect class="panel-d" x="26" y="336" width="728" height="62"/><text class="sh" x="40" y="362">Heat and silt</text><text class="body" x="180" y="362">hot discharge, erosion</text><text class="body" x="400" y="362">change what the water</text><text class="body" x="400" y="382">body can support</text><text class="body" x="580" y="362">cooling ponds; erosion</text><text class="body" x="580" y="382">control on banks</text><text class="small" x="390" y="432" text-anchor="middle">Clear is a colour, not a test: the deadliest pollutants in this table are all invisible.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
