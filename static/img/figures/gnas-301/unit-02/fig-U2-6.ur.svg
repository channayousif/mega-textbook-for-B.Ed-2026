<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ہسپتال کے کلینیکل اور صنعتی خطرناک کچرے کا موازنہ</title><desc id="d">ہسپتال کے کلینیکل کچرے اور صنعتی خطرناک کچرے کا موازنہ: عام اشیاء، خطرے کی وجہ اور سنبھالنے کا قاعدہ۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">دو خطرناک دھاریاں، دو اصول</text><rect class="panel" x="26" y="52" width="728" height="38"/><text class="h" x="740" y="77" text-anchor="end">دھاری</text><text class="h" x="590" y="77" text-anchor="end">عام اشیاء</text><text class="h" x="360" y="77" text-anchor="end">خطرناک کیوں</text><text class="h" x="190" y="77" text-anchor="end">انتظام کا اصول</text><rect class="panel-c" x="26" y="90" width="728" height="130"/><text class="sh" x="740" y="118" text-anchor="end">ہسپتال کا</text><text class="sh" x="740" y="136" text-anchor="end">کلینیکل</text><text class="sh" x="740" y="154" text-anchor="end">کچرا</text><text class="body" x="590" y="118" text-anchor="end">تیز چیزیں (سوئیاں، بلیڈ)؛</text><text class="body" x="590" y="138" text-anchor="end">عدوی بانڈ؛</text><text class="body" x="590" y="158" text-anchor="end">لیبارٹری کلچر؛</text><text class="body" x="590" y="178" text-anchor="end">مدت پار ادویات</text><text class="body" x="360" y="118" text-anchor="end">عدوى اور زخم:</text><text class="body" x="360" y="138" text-anchor="end">سوئی بیماری</text><text class="body" x="360" y="158" text-anchor="end">سیدھا جلد کے</text><text class="body" x="360" y="178" text-anchor="end">راست سے پہنچا سکتی ہے</text><text class="body" x="190" y="118" text-anchor="end">کم کریں؛ استعمال کی</text><text class="body" x="190" y="138" text-anchor="end">جگہ پر الگ کریں؛</text><text class="body" x="190" y="158" text-anchor="end">مقامی ڈبوں کے قواعد</text><text class="body" x="190" y="178" text-anchor="end">مانیں؛ ضائع کرنے سے</text><text class="body" x="190" y="198" text-anchor="end">پہلے علاج</text><rect class="panel-b" x="26" y="220" width="728" height="130"/><text class="sh" x="740" y="248" text-anchor="end">صنعتی</text><text class="sh" x="740" y="266" text-anchor="end">خطرناک</text><text class="sh" x="740" y="284" text-anchor="end">کچرا</text><text class="body" x="590" y="248" text-anchor="end">سالوینٹ کی کیچڑ؛</text><text class="body" x="590" y="268" text-anchor="end">پلیٹنگ کے مائع؛</text><text class="body" x="590" y="288" text-anchor="end">کیمیکل ڈرم؛</text><text class="body" x="590" y="308" text-anchor="end">پینٹ اور تیزاب کی باقیات</text><text class="body" x="360" y="248" text-anchor="end">زہریلا، آتش گیر یا</text><text class="body" x="360" y="268" text-anchor="end">کارآمد؛ دہائیوں تک</text><text class="body" x="360" y="288" text-anchor="end">زیرِ زمین پانی</text><text class="body" x="360" y="308" text-anchor="end">زہرلا سکتا ہے</text><text class="body" x="190" y="248" text-anchor="end">پہچانیں؛ کم کریں؛</text><text class="body" x="190" y="268" text-anchor="end">بند اور لیبل والی</text><text class="body" x="190" y="288" text-anchor="end">جگہ رکھیں؛ علاج یا</text><text class="body" x="190" y="308" text-anchor="end">ضائع ہونے تک راستے</text><text class="body" x="190" y="328" text-anchor="end">کا ریکارڈ رکھیں</text><rect class="panel" x="26" y="348" width="728" height="74"/><text class="sh" x="740" y="374" text-anchor="end">بنیادی اصول</text><text class="body" x="590" y="370" text-anchor="end">خطرناک کچرا عام کچرے میں کبھی نہ ملے:</text><text class="body" x="590" y="390" text-anchor="end">ایک کلینیکل تھیلا پورا ڈھیر خطرناک بنا دیتا ہے۔</text><text class="body" x="590" y="410" text-anchor="end">اصول ٹوٹنے پر فوری خطرے میں: کچرا سنبھالنے اور ہاتھ سے چھانٹنے والے۔</text><text class="small" x="390" y="442" text-anchor="middle">کم کریں، بننے پر الگ کریں، محفوظ رکھیں اور منتقل کریں، مقامی قواعد کے مطابق ضائع کرنے سے پہلے علاج کریں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
