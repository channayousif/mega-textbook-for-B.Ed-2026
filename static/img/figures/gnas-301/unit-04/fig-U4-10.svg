<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three HSE measures and models</title><desc id="d">Table of three HSE measures and models, the incident pyramid, the Swiss cheese model and the safety climate survey, with what each shows and what each is silent about</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Three HSE measures and models</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Model or measure</text><text class="h" x="240" y="75">What it shows</text><text class="h" x="520" y="75">What it is silent about</text><rect class="panel-a" x="26" y="88" width="728" height="76"/><text class="sh" x="40" y="114">Incident pyramid</text><text class="body" x="240" y="114">serious harm sits on a wide</text><text class="body" x="240" y="133">base of near-misses</text><text class="body" x="520" y="114">the exact ratios (debated)</text><rect class="panel-b" x="26" y="164" width="728" height="76"/><text class="sh" x="40" y="190">Swiss cheese model</text><text class="body" x="240" y="190">defences fail when their</text><text class="body" x="240" y="209">holes line up</text><text class="body" x="520" y="190">which hole moves next</text><rect class="panel-c" x="26" y="240" width="728" height="76"/><text class="sh" x="40" y="266">Safety climate survey</text><text class="body" x="240" y="266">what workers believe</text><text class="body" x="240" y="285">management rewards</text><text class="body" x="520" y="266">what management says it rewards</text><text class="small" x="390" y="338" text-anchor="middle">Near-miss reporting is the cheapest measure: the pyramid's base is where the next apex is visible.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
