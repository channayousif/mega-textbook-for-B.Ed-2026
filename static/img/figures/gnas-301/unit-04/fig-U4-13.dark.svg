<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 504" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five worker health challenges</title><desc id="d">Table of five worker health challenges, heat, dust, noise, stress and ergonomics, each with a workplace example, an external-environment interaction and one control</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Five worker health challenges</text><rect class="panel" x="26" y="50" width="728" height="55"/><text class="h" x="40" y="75">Challenge</text><text class="h" x="200" y="75">Workplace example</text><text class="h" x="420" y="75">External</text><text class="h" x="420" y="92">interaction</text><text class="h" x="600" y="75">One control</text><rect class="panel-a" x="26" y="88" width="728" height="73"/><text class="sh" x="40" y="131">Heat</text><text class="body" x="200" y="131">uncooled June classroom</text><text class="body" x="420" y="131">the season crosses</text><text class="body" x="420" y="148">the gate</text><text class="body" x="600" y="131">water, shade</text><text class="body" x="600" y="148">schedule</text><rect class="panel-b" x="26" y="178" width="728" height="56"/><text class="sh" x="40" y="204">Dust</text><text class="body" x="200" y="204">the cotton mill for years</text><text class="body" x="420" y="204">open yards, dry winds</text><text class="body" x="600" y="204">extraction, masks</text><rect class="panel-c" x="26" y="234" width="728" height="56"/><text class="sh" x="40" y="260">Noise</text><text class="body" x="200" y="260">the machine line all day</text><text class="body" x="420" y="260">the road beside the wall</text><text class="body" x="600" y="260">maintenance, barriers</text><rect class="panel-d" x="26" y="290" width="728" height="56"/><text class="sh" x="40" y="316">Stress</text><text class="body" x="200" y="316">exam-week invigilation</text><text class="body" x="420" y="316">insecurity, thin staffing</text><text class="body" x="600" y="316">rotation, rest, voice</text><rect class="panel" x="26" y="346" width="728" height="56"/><text class="sh" x="40" y="372">Ergonomics</text><text class="body" x="200" y="372">the water drum lifted daily</text><text class="body" x="420" y="372">no lift, no trolley</text><text class="body" x="600" y="372">trolleys, technique</text><text class="small" x="390" y="424" text-anchor="middle">The quiet exposures never make a report; that is why they need a register.</text><text class="wm" x="768" y="494" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
