<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">او ایچ ایس پیشہ ور کے کردار کا جال</title><desc id="d">او ایچ ایس پیشہ ور کے کردار کا جال: چھ شاخیں، مشیر، تربیت کار، معائنہ کار، تفتیش کار، ریکارڈ رکھنے والا، ابلاغ کار، مرکزی پیشہ ور کے گرد</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">او ایچ ایس پیشہ ور: چھ کردار، ایک جال</text><circle class="panel" cx="390" cy="250" r="58"/><text class="h" x="390" y="244" text-anchor="middle">او ایچ ایس</text><text class="h" x="390" y="266" text-anchor="middle">پیشہ ور</text><rect class="panel-a" x="560" y="64" width="190" height="56" rx="8"/><text class="sh" x="655" y="98" text-anchor="middle">مشیر</text><rect class="panel-a" x="294" y="64" width="190" height="56" rx="8"/><text class="sh" x="389" y="98" text-anchor="middle">تربیت کار</text><rect class="panel-b" x="30" y="64" width="190" height="56" rx="8"/><text class="sh" x="125" y="98" text-anchor="middle">معائنہ کار</text><rect class="panel-b" x="560" y="372" width="190" height="56" rx="8"/><text class="sh" x="655" y="406" text-anchor="middle">تفتیش کار</text><rect class="panel-c" x="294" y="372" width="190" height="56" rx="8"/><text class="sh" x="389" y="406" text-anchor="middle">ریکارڈ رکھنے والا</text><rect class="panel-c" x="30" y="372" width="190" height="56" rx="8"/><text class="sh" x="125" y="406" text-anchor="middle">ابلاغ کار</text><line class="stroke" x1="655" y1="120" x2="432" y2="200"/><line class="stroke" x1="390" y1="120" x2="390" y2="190"/><line class="stroke" x1="125" y1="120" x2="348" y2="200"/><line class="stroke" x1="655" y1="372" x2="432" y2="300"/><line class="stroke" x1="390" y1="372" x2="390" y2="308"/><line class="stroke" x1="125" y1="372" x2="348" y2="300"/><text class="small" x="390" y="452" text-anchor="middle">پیشہ ور مشورہ دیتا، جانچتا اور ریکارڈ رکھتا ہے؛ قانونی فرض مالک کے پاس ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
