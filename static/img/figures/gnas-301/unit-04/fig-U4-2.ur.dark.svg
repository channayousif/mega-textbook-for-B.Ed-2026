<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">شعبوں کے لحاظ سے حادثات اور زخموں کی اقسام</title><desc id="d">شعبوں کے لحاظ سے حادثات کی اقسام کا جدول: ہر ایک کا ایک سبب اور ایک روکنے کا نکتہ</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">شعبوں کے لحاظ سے حادثات کی اقسام</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">شعبہ</text><text class="h" x="580" y="75" text-anchor="end">خصوصی حادثہ</text><text class="h" x="350" y="75" text-anchor="end">ایک دستاویزی سبب</text><text class="h" x="190" y="75" text-anchor="end">ایک روک تھام</text><rect class="panel-a" x="26" y="88" width="728" height="62"/><text class="sh" x="740" y="114" text-anchor="end">صنعت</text><text class="body" x="580" y="114" text-anchor="end">پھنسنا اور دھول کی بیماری</text><text class="body" x="350" y="114" text-anchor="end">پیداواری دباؤ، غائب</text><text class="body" x="350" y="133" text-anchor="end">جالیاں اور نکاسی</text><text class="body" x="160" y="114" text-anchor="end">جالیاں، نکاسی</text><rect class="panel-b" x="26" y="150" width="728" height="62"/><text class="sh" x="740" y="176" text-anchor="end">تعمیرات</text><text class="body" x="580" y="176" text-anchor="end">گرنا اور کھدائی کا دھنسنا</text><text class="body" x="350" y="176" text-anchor="end">غیر محفوظ طریقے، غائب</text><text class="body" x="350" y="195" text-anchor="end">تحفظ (عباسی وغیرہ)</text><text class="body" x="160" y="176" text-anchor="end">رکاوٹیں، سہارا</text><rect class="panel-c" x="26" y="212" width="728" height="62"/><text class="sh" x="740" y="238" text-anchor="end">زراعت</text><text class="body" x="580" y="238" text-anchor="end">چھڑکاؤ اور مشین زخم</text><text class="body" x="350" y="238" text-anchor="end">بغیر لیبل کیمیکل،</text><text class="body" x="350" y="257" text-anchor="end">کوئی حفاظتی سامان نہیں</text><text class="body" x="160" y="238" text-anchor="end">تربیت، لیبل</text><rect class="panel-d" x="26" y="274" width="728" height="62"/><text class="sh" x="740" y="300" text-anchor="end">خدمات</text><text class="body" x="580" y="300" text-anchor="end">تھکاوٹ، دباؤ، حملہ</text><text class="body" x="350" y="300" text-anchor="end">لمبے اوقات، کم عملہ،</text><text class="body" x="350" y="319" text-anchor="end">رپورٹ کا کوئی راستہ نہیں</text><text class="body" x="160" y="300" text-anchor="end">عملہ، رپورٹنگ</text><text class="small" x="390" y="358" text-anchor="middle">خاموش درجے، دھول کی بیماری اور دباؤ، اموات کے اعداد و شمار تک کبھی نہیں پہنچتے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
