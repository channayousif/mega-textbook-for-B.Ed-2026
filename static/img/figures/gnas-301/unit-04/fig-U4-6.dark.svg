<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four instruments of HSE regulation</title><desc id="d">Table of the four instruments of HSE regulation, act, rules and regulations, codes of practice and guidance, with what each does and a question it answers</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The four instruments of HSE regulation</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Instrument</text><text class="h" x="250" y="75">What it does</text><text class="h" x="520" y="75">One question it answers</text><rect class="panel-a" x="26" y="88" width="728" height="62"/><text class="sh" x="40" y="114">Act</text><text class="body" x="250" y="114">parliament's law: the goal</text><text class="body" x="520" y="114">"What must be achieved?"</text><rect class="panel-b" x="26" y="150" width="728" height="62"/><text class="sh" x="40" y="176">Rules and regulations</text><text class="body" x="250" y="176">the enforceable detail</text><text class="body" x="520" y="176">"How, exactly?"</text><rect class="panel-c" x="26" y="212" width="728" height="62"/><text class="sh" x="40" y="238">Codes of practice</text><text class="body" x="250" y="238">accepted good methods</text><text class="body" x="520" y="238">"What counts as doing it well?"</text><rect class="panel-d" x="26" y="274" width="728" height="62"/><text class="sh" x="40" y="300">Guidance</text><text class="body" x="250" y="300">advisory, not binding</text><text class="body" x="520" y="300">"What about our unusual case?"</text><text class="small" x="390" y="358" text-anchor="middle">Enforcement, inspection, notices and penalties, is the state's half of the bargain.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
