<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کارکن کی صحت کی پانچ چیلنجز</title><desc id="d">کارکن کی صحت کی پانچ چیلنجز کا جدول: حرارت، دھول، شور، ذہنی دباؤ، ارگونومکس، ہر ایک کی مثال، بیرونی ماحول کا اثر اور ایک قابو</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">کارکن کی صحت کی پانچ چیلنجز</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">چیلنج</text><text class="h" x="580" y="75" text-anchor="end">کام کی جگہ کی مثال</text><text class="h" x="360" y="75" text-anchor="end">بیرونی اثر</text><text class="h" x="180" y="75" text-anchor="end">ایک قابو</text><rect class="panel-a" x="26" y="88" width="728" height="56"/><text class="sh" x="740" y="114" text-anchor="end">حرارت</text><text class="body" x="580" y="114" text-anchor="end">جون کی بغیر ٹھنڈ جماعت</text><text class="body" x="360" y="114" text-anchor="end">موسم دروازے سے اندر آتا ہے</text><text class="body" x="180" y="114" text-anchor="end">پانی، سایہ، وقت</text><rect class="panel-b" x="26" y="144" width="728" height="56"/><text class="sh" x="740" y="170" text-anchor="end">دھول</text><text class="body" x="580" y="170" text-anchor="end">برسوں کا کاٹن مل</text><text class="body" x="360" y="170" text-anchor="end">کھلے صحن، خشک ہوائیں</text><text class="body" x="180" y="170" text-anchor="end">نکاسی، ماسک</text><rect class="panel-c" x="26" y="200" width="728" height="56"/><text class="sh" x="740" y="226" text-anchor="end">شور</text><text class="body" x="580" y="226" text-anchor="end">دن بھر مشین کی قطار</text><text class="body" x="360" y="226" text-anchor="end">دیوار کے پاس سڑک</text><text class="body" x="180" y="226" text-anchor="end">دیکھ بھال، رکاوٹیں</text><rect class="panel-d" x="26" y="256" width="728" height="56"/><text class="sh" x="740" y="282" text-anchor="end">ذہنی دباؤ</text><text class="body" x="580" y="282" text-anchor="end">امتحان ہفتے کی نگرانی</text><text class="body" x="360" y="282" text-anchor="end">بے روزگری کا خوف، کم عملہ</text><text class="body" x="180" y="282" text-anchor="end">تبادلہ، آرام، آواز</text><rect class="panel" x="26" y="312" width="728" height="56"/><text class="sh" x="740" y="338" text-anchor="end">ارگونومکس</text><text class="body" x="580" y="338" text-anchor="end">روز اٹھایا جانے والا پانی کا ڈرم</text><text class="body" x="360" y="338" text-anchor="end">نہ لفٹ، نہ ٹرالی</text><text class="body" x="180" y="338" text-anchor="end">ٹرالی، طریقہ</text><text class="small" x="390" y="390" text-anchor="middle">خاموش رابطے کبھی رپورٹ نہیں بناتے؛ اسی لیے انہیں ریکارڈ کی ضرورت ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
