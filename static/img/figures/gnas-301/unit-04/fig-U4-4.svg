<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The two international reference points</title><desc id="d">Table comparing the ILO Convention No. 155 and ISO 45001:2018 reference points with what each is, who it binds and one contribution</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The two international reference points</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Reference point</text><text class="h" x="210" y="75">What it is</text><text class="h" x="420" y="75">Who it binds</text><text class="h" x="580" y="75">One contribution</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="40" y="114">ILO Convention</text><text class="body" x="210" y="114">No. 155 (1981)</text><text class="body" x="420" y="114">member states:</text><text class="body" x="420" y="133">national policy</text><text class="body" x="420" y="152">and enforcement</text><text class="body" x="580" y="114">the state duty to build</text><text class="body" x="580" y="133">the enforcement system</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="40" y="202">ISO 45001:2018</text><text class="body" x="210" y="202">the management-system</text><text class="body" x="210" y="221">standard</text><text class="body" x="420" y="202">workplaces seeking</text><text class="body" x="420" y="221">certification</text><text class="body" x="580" y="202">the PDCA system any</text><text class="body" x="580" y="221">workplace can run</text><text class="small" x="390" y="286" text-anchor="middle">Pakistan's national framework rests on factory and labour legislation with provincial enforcement.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
