<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایچ ایس ای اوزاروں کا انتظامی نظام کے عناصر سے جوڑنے والا خاکہ</title><desc id="d">ایچ ایس ای اوزاروں کا خاکہ جو انتظامی نظام کے چار عناصر، منصوبہ، عمل، جانچ، اصلاح سے جوڑتا ہے</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">اوزار کا صندوق، نظام سے جڑا ہوا</text><rect class="panel-a" x="590" y="70" width="164" height="180" rx="10"/><text class="sh" x="672" y="98" text-anchor="middle">منصوبہ</text><text class="small" x="672" y="130" text-anchor="middle">خطرے کا ریکارڈ</text><text class="small" x="672" y="160" text-anchor="middle">قانونی ریکارڈ</text><text class="small" x="672" y="190" text-anchor="middle">پلان کا خاکہ</text><line class="stroke" x1="590" y1="160" x2="580" y2="160" marker-end="url(#arrow)"/><rect class="panel-b" x="402" y="70" width="164" height="180" rx="10"/><text class="sh" x="484" y="98" text-anchor="middle">عمل</text><text class="small" x="484" y="130" text-anchor="middle">تربیتی کٹ</text><text class="small" x="484" y="160" text-anchor="middle">بورڈ، چیک لسٹیں</text><text class="small" x="484" y="190" text-anchor="middle">حفاظتی سامان</text><line class="stroke" x1="402" y1="160" x2="392" y2="160" marker-end="url(#arrow)"/><rect class="panel-c" x="214" y="70" width="164" height="180" rx="10"/><text class="sh" x="296" y="98" text-anchor="middle">جانچ</text><text class="small" x="296" y="130" text-anchor="middle">معائنہ فارم</text><text class="small" x="296" y="160" text-anchor="middle">بچتی نظر کی کتاب</text><text class="small" x="296" y="190" text-anchor="middle">میٹر: آواز، گرد</text><line class="stroke" x1="214" y1="160" x2="204" y2="160" marker-end="url(#arrow)"/><rect class="panel-d" x="26" y="70" width="164" height="180" rx="10"/><text class="sh" x="108" y="98" text-anchor="middle">اصلاح</text><text class="small" x="108" y="130" text-anchor="middle">جائزہ کی ایجنڈا</text><text class="small" x="108" y="160" text-anchor="middle">واقعہ رپورٹیں</text><text class="small" x="108" y="190" text-anchor="middle">اصلاح کا ٹریکر</text><rect class="panel" x="26" y="290" width="728" height="120" rx="10"/><text class="sh" x="736" y="318" text-anchor="end">حل شدہ مثال: گرم امتحانی ہال</text><text class="body" x="736" y="344" text-anchor="end">تھرمومیٹر (جانچ) دوپہر 38 دکھاتا ہے؛ پانی کا نقطہ (عمل) اندر آتا ہے؛ شیڈول (منصوبہ)</text><text class="body" x="736" y="366" text-anchor="end">مشکل پرچہ صبح کرتا ہے؛ چوکیدار کی ڈائری (جانچ) پنکھے لکھتی ہے؛ پیر کا جائزہ</text><text class="body" x="736" y="388" text-anchor="end">(اصلاح) اگلے سال سلسلہ پہلے کرتا ہے۔ چھ اوزار، چار عناصر، ایک خاموش خطرہ قابو۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
