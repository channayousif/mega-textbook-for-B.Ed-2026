<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map linking the management functions to a safe workplace</title><desc id="d">Concept map linking the four management functions, plan, organise, lead and control, to a central safe workplace node and the outcomes safe people, safe plant, safe procedures and safe place</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Management functions, HSE outcomes</text><ellipse class="panel" cx="390" cy="250" rx="102" ry="54"/><text class="h" x="390" y="244" text-anchor="middle">safe</text><text class="h" x="390" y="266" text-anchor="middle">workplace</text><rect class="panel-a" x="24" y="70" width="190" height="62" rx="8"/><text class="sh" x="119" y="96" text-anchor="middle">plan</text><text class="small" x="119" y="116" text-anchor="middle">objectives and controls</text><rect class="panel-a" x="566" y="70" width="190" height="62" rx="8"/><text class="sh" x="661" y="96" text-anchor="middle">organise</text><text class="small" x="661" y="116" text-anchor="middle">people, equipment, authority</text><rect class="panel-b" x="24" y="350" width="190" height="62" rx="8"/><text class="sh" x="119" y="376" text-anchor="middle">lead</text><text class="small" x="119" y="396" text-anchor="middle">what is rewarded</text><rect class="panel-b" x="566" y="350" width="190" height="62" rx="8"/><text class="sh" x="661" y="376" text-anchor="middle">control</text><text class="small" x="661" y="396" text-anchor="middle">measure and correct</text><text class="body" x="300" y="130" text-anchor="middle">safe people</text><text class="body" x="480" y="130" text-anchor="middle">safe plant</text><text class="body" x="300" y="370" text-anchor="middle">safe procedures</text><text class="body" x="480" y="370" text-anchor="middle">safe place</text><line class="stroke" x1="214" y1="120" x2="308" y2="212"/><line class="stroke" x1="566" y1="120" x2="472" y2="212"/><line class="stroke" x1="214" y1="380" x2="308" y2="288"/><line class="stroke" x1="566" y1="380" x2="472" y2="288"/><text class="small" x="390" y="452" text-anchor="middle">Safety is a line responsibility; every hazard has an owner.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
