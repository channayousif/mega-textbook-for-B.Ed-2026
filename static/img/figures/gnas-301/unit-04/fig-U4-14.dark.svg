<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of HSE tools mapped to the management-system elements</title><desc id="d">Diagram of HSE tools and instruments mapped to the four management-system elements, plan, do, check and act, that each supports</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The toolbox, mapped to the system</text><rect class="panel-a" x="26" y="70" width="164" height="180" rx="10"/><text class="sh" x="108" y="98" text-anchor="middle">plan</text><text class="small" x="108" y="130" text-anchor="middle">hazard register</text><text class="small" x="108" y="160" text-anchor="middle">legal register</text><text class="small" x="108" y="190" text-anchor="middle">plan template</text><line class="stroke" x1="190" y1="160" x2="200" y2="160" marker-end="url(#arrow)"/><rect class="panel-b" x="214" y="70" width="164" height="180" rx="10"/><text class="sh" x="296" y="98" text-anchor="middle">do</text><text class="small" x="296" y="130" text-anchor="middle">training kits</text><text class="small" x="296" y="160" text-anchor="middle">signs, checklists</text><text class="small" x="296" y="190" text-anchor="middle">protective equipment</text><line class="stroke" x1="378" y1="160" x2="388" y2="160" marker-end="url(#arrow)"/><rect class="panel-c" x="402" y="70" width="164" height="180" rx="10"/><text class="sh" x="484" y="98" text-anchor="middle">check</text><text class="small" x="484" y="130" text-anchor="middle">inspection forms</text><text class="small" x="484" y="160" text-anchor="middle">near-miss book</text><text class="small" x="484" y="190" text-anchor="middle">meters: sound, dust</text><line class="stroke" x1="566" y1="160" x2="576" y2="160" marker-end="url(#arrow)"/><rect class="panel-d" x="590" y="70" width="164" height="180" rx="10"/><text class="sh" x="672" y="98" text-anchor="middle">act</text><text class="small" x="672" y="130" text-anchor="middle">review agenda</text><text class="small" x="672" y="160" text-anchor="middle">incident reports</text><text class="small" x="672" y="190" text-anchor="middle">action tracker</text><rect class="panel" x="26" y="290" width="728" height="120" rx="10"/><text class="sh" x="44" y="318">The worked example: the hot examination hall</text><text class="body" x="44" y="344">The thermometer (check) reads 38 at noon; the water point (do) moves inside; the schedule (plan)</text><text class="body" x="44" y="366">moves the hard paper to morning; the caretaker's log (check) records the fans; the Monday review</text><text class="body" x="44" y="388">(act) moves next year's series earlier. Six tools, four elements, one quiet exposure managed.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
