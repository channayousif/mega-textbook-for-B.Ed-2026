<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار کام کے شعبوں اور ان کے خصوصی خطرات کا خاکہ</title><desc id="d">چار کام کے شعبوں کا خاکہ: صنعت، تعمیرات، زراعت اور خدمات، ہر پینل پر خصوصی خطرے درج</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">چار شعبے، چار خطرے کے نقشے</text><rect class="panel-a" x="582" y="60" width="172" height="180" rx="10"/><text class="sh" x="668" y="88" text-anchor="middle">صنعت</text><text class="small" x="668" y="120" text-anchor="middle">برسوں کی گرد اور</text><text class="small" x="668" y="134" text-anchor="middle">دھوئیں اور کیمیکل</text><text class="small" x="668" y="164" text-anchor="middle">بغیر جالی مشینیں، شور</text><text class="small" x="668" y="208" text-anchor="middle">بھٹیوں کی گرمی</text><rect class="panel-b" x="396" y="60" width="172" height="180" rx="10"/><text class="sh" x="482" y="88" text-anchor="middle">تعمیرات</text><text class="small" x="482" y="120" text-anchor="middle">اونچائی سے گرنا</text><text class="small" x="482" y="164" text-anchor="middle">گرتا سامان، کھدائی</text><text class="small" x="482" y="208" text-anchor="middle">سب سے غیر رسمی روزگار</text><rect class="panel-c" x="210" y="60" width="172" height="180" rx="10"/><text class="sh" x="296" y="88" text-anchor="middle">زراعت</text><text class="small" x="296" y="120" text-anchor="middle">بغیر تحفظ کیڑے مار ادویات</text><text class="small" x="296" y="164" text-anchor="middle">مشینوں سے زخم</text><text class="small" x="296" y="208" text-anchor="middle">کھیتوں میں گرمی</text><text class="small" x="296" y="222" text-anchor="middle">گرتا سامان، کھدائی</text><rect class="panel-d" x="24" y="60" width="172" height="180" rx="10"/><text class="sh" x="110" y="88" text-anchor="middle">خدمات</text><text class="small" x="110" y="120" text-anchor="middle">اٹھانا، لمبا کھڑا رہنا</text><text class="small" x="110" y="164" text-anchor="middle">ذہنی دباؤ اور ہراسانی</text><text class="small" x="110" y="208" text-anchor="middle">صحت کے کام میں</text><text class="small" x="110" y="222" text-anchor="middle">انفیکشن</text><rect class="panel" x="26" y="268" width="728" height="150" rx="10"/><text class="sh" x="736" y="296" text-anchor="end">نقشے کا اصول</text><text class="body" x="736" y="322" text-anchor="end">قابو خاکے سے میل کھائے: گرد کا جواب نکاسی اور ماسک سے؛</text><text class="body" x="736" y="344" text-anchor="end">رکاوٹیں اور کھدائی کا سہارا تعمیرات کا؛ تربیت اور تحفظ</text><text class="body" x="736" y="366" text-anchor="end">زراعت کے کیمیکل کا؛ عملہ اور وقار خدمات کا جواب ہیں۔</text><text class="body" x="736" y="398" text-anchor="end">ہر خاکہ یونٹ 3 کی پانچ خطرے کی اقسام کا مرکب ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
