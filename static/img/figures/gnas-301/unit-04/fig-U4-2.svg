<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 504" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Accident and injury types by sector</title><desc id="d">Table of accident and injury types by sector with a driver and one prevention point each</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Accident and injury types by sector</text><rect class="panel" x="26" y="50" width="728" height="55"/><text class="h" x="40" y="75">Sector</text><text class="h" x="200" y="75">Characteristic accident</text><text class="h" x="430" y="75">One documented</text><text class="h" x="430" y="92">driver</text><text class="h" x="590" y="75">One</text><text class="h" x="590" y="92">prevention</text><rect class="panel-a" x="26" y="88" width="728" height="79"/><text class="sh" x="40" y="131">Industry</text><text class="body" x="200" y="131">caught-in and dust disease</text><text class="body" x="430" y="131">output pressure, missing</text><text class="body" x="430" y="150">guards and extraction</text><text class="body" x="620" y="131">guarding,</text><text class="body" x="620" y="148">extraction</text><rect class="panel-b" x="26" y="184" width="728" height="62"/><text class="sh" x="40" y="210">Construction</text><text class="body" x="200" y="210">falls and trench collapse</text><text class="body" x="430" y="210">unsafe practices, missing</text><text class="body" x="430" y="229">protection (Abbasi et al.)</text><text class="body" x="620" y="210">guardrails, support</text><rect class="panel-c" x="26" y="246" width="728" height="62"/><text class="sh" x="40" y="272">Agriculture</text><text class="body" x="200" y="272">spraying and machinery injury</text><text class="body" x="430" y="272">unlabelled chemicals,</text><text class="body" x="430" y="291">no protective equipment</text><text class="body" x="620" y="272">training, labels</text><rect class="panel-d" x="26" y="308" width="728" height="62"/><text class="sh" x="40" y="334">Services</text><text class="body" x="200" y="334">strain, stress, assault</text><text class="body" x="430" y="334">long hours, thin staffing,</text><text class="body" x="430" y="353">no reporting channel</text><text class="body" x="620" y="334">staffing, reporting</text><text class="small" x="390" y="392" text-anchor="middle">The quiet grades, dust disease and stress, never reach the fatality statistics that count them.</text><text class="wm" x="768" y="494" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
