<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایچ ایس ای منصوبہ کے چھ مرحلوں کا فلو چارٹ</title><desc id="d">ایچ ایس ای منصوبہ کے چھ مرحلوں کا فلو چارٹ: حدود، خطرے، مقاصد، قابو اور وسائل، تربیت اور رابطہ، نگرانی اور جائزہ، ایک لوپ میں</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">ایچ ایس ای منصوبہ بنانا: چھ مقررہ مرحلے</text><rect class="panel-a" x="642" y="100" width="112" height="90" rx="8"/><text class="sh" x="698" y="130" text-anchor="middle">1. حدود</text><text class="small" x="698" y="152" text-anchor="middle">ایک سرگرمی،</text><text class="small" x="698" y="168" text-anchor="middle">جگہ، مدت</text><line class="stroke" x1="642" y1="145" x2="628" y2="145" marker-end="url(#arrow)"/><rect class="panel-a" x="516" y="100" width="112" height="90" rx="8"/><text class="sh" x="572" y="130" text-anchor="middle">2. خطرے</text><text class="small" x="572" y="152" text-anchor="middle">چہل قدمی</text><text class="small" x="572" y="168" text-anchor="middle">اور ریکارڈ</text><line class="stroke" x1="516" y1="145" x2="502" y2="145" marker-end="url(#arrow)"/><rect class="panel-b" x="390" y="100" width="112" height="90" rx="8"/><text class="sh" x="446" y="130" text-anchor="middle">3. مقاصد</text><text class="small" x="446" y="152" text-anchor="middle">ناپنے کے قابل،</text><text class="small" x="446" y="168" text-anchor="middle">تاریخوں کے ساتھ</text><line class="stroke" x1="390" y1="145" x2="376" y2="145" marker-end="url(#arrow)"/><rect class="panel-b" x="264" y="100" width="112" height="90" rx="8"/><text class="sh" x="320" y="130" text-anchor="middle">4. قابو</text><text class="small" x="320" y="152" text-anchor="middle">نامزد</text><text class="small" x="320" y="168" text-anchor="middle">لوگ، بجٹ</text><line class="stroke" x1="264" y1="145" x2="250" y2="145" marker-end="url(#arrow)"/><rect class="panel-c" x="138" y="100" width="112" height="90" rx="8"/><text class="sh" x="194" y="130" text-anchor="middle">5. تربیت</text><text class="small" x="194" y="152" text-anchor="middle">کون</text><text class="small" x="194" y="168" text-anchor="middle">کیا بتایا، کب</text><line class="stroke" x1="138" y1="145" x2="124" y2="145" marker-end="url(#arrow)"/><rect class="panel-c" x="12" y="100" width="112" height="90" rx="8"/><text class="sh" x="68" y="130" text-anchor="middle">6. نگرانی</text><text class="small" x="68" y="152" text-anchor="middle">کون جانچے،</text><text class="small" x="68" y="168" text-anchor="middle">اور جائزہ</text><path class="stroke" d="M66 190 L66 260 L698 260 L698 192" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text class="small" x="390" y="252" text-anchor="middle">منصوبہ جائزہ کی تاریخ پر دوبارہ پڑھا جاتا ہے</text><rect class="panel" x="26" y="300" width="728" height="120" rx="10"/><text class="sh" x="736" y="328" text-anchor="end">منصوبے کا امتحان</text><text class="body" x="736" y="354" text-anchor="end">"حفاظت اول" ایک پوسٹر ہے۔ "اوقات میں بند دروازے صفر، ہر گھنٹے</text><text class="body" x="736" y="376" text-anchor="end">جانچا جانا" ایک مقصد ہے۔ ناموں اور تاریخوں والا صفحہ منصوبہ ہے؛ جس فولڈر پر</text><text class="body" x="736" y="398" text-anchor="end">کوئی دستخط نہیں وہ ایک خواہش ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
