<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">او ایس ایچ نظام کے پی ڈی سی اے چکر کا فلو چارٹ</title><desc id="d">او ایس ایچ نظام کے پی ڈی سی اے چکر کا فلو چارٹ: منصوبہ، عمل، جانچ، اقدام، ایک لوپ کی شکل میں</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">ہر او ایس ایچ نظام کا پی ڈی سی اسی انجن</text><rect class="panel-a" x="530" y="90" width="190" height="110" rx="10"/><text class="sh" x="625" y="118" text-anchor="middle">1. منصوبہ</text><text class="small" x="625" y="142" text-anchor="middle">پالیسی، خطرے کا ریکارڈ،</text><text class="small" x="625" y="160" text-anchor="middle">قانونی تقاضے،</text><text class="small" x="625" y="178" text-anchor="middle">ناپنے کے قابل مقاصد</text><rect class="panel-b" x="294" y="90" width="190" height="110" rx="10"/><text class="sh" x="389" y="118" text-anchor="middle">2. عمل</text><text class="small" x="389" y="142" text-anchor="middle">قابو موجود، تربیت،</text><text class="small" x="389" y="160" text-anchor="middle">رابطہ اسی زبان میں</text><text class="small" x="389" y="178" text-anchor="middle">جسے ورکشاپ بولتی ہے</text><rect class="panel-c" x="58" y="90" width="190" height="110" rx="10"/><text class="sh" x="153" y="118" text-anchor="middle">3. جانچ</text><text class="small" x="153" y="142" text-anchor="middle">معائنہ، ناپ، آڈٹ؛</text><text class="small" x="153" y="160" text-anchor="middle">آگے بڑھتے اشاریوں کو ترجیح دیں</text><text class="small" x="153" y="178" text-anchor="middle">بڑھنے والے اشارے گنیں</text><rect class="panel-d" x="294" y="300" width="190" height="110" rx="10"/><text class="sh" x="389" y="328" text-anchor="middle">4. اقدام</text><text class="small" x="389" y="352" text-anchor="middle">نتائج کا جائزہ، اصلاح،</text><text class="small" x="389" y="370" text-anchor="middle">اگلے چکر کے لیے</text><text class="small" x="389" y="388" text-anchor="middle">معیار بڑھائیں</text><line class="stroke" x1="530" y1="145" x2="486" y2="145" marker-end="url(#arrow)"/><line class="stroke" x1="294" y1="145" x2="250" y2="145" marker-end="url(#arrow)"/><path class="stroke" d="M153 200 L153 355 L294 355" marker-end="url(#arrow)"/><path class="stroke" d="M484 355 L625 355 L625 200" marker-end="url(#arrow)"/><text class="small" x="625" y="270" text-anchor="middle">چکر دہرایا جاتا ہے</text><text class="small" x="390" y="440" text-anchor="middle">جہاں یہ لوپ چلتا ہے، دیوار کا آگ بجھانے والا آلہ نظام کے سہارے ہے؛ جہاں نہیں، وہ صرف رنگ ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
