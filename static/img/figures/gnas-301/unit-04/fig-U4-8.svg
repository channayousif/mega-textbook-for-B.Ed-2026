<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the OHS professional role web</title><desc id="d">Diagram of the OHS professional role web with six spokes, adviser, trainer, inspector, investigator, record keeper and communicator, around a central professional node</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The OHS professional: six roles, one web</text><circle class="panel" cx="390" cy="250" r="58"/><text class="h" x="390" y="244" text-anchor="middle">the OHS</text><text class="h" x="390" y="266" text-anchor="middle">professional</text><rect class="panel-a" x="30" y="64" width="190" height="56" rx="8"/><text class="sh" x="125" y="98" text-anchor="middle">adviser</text><rect class="panel-a" x="296" y="64" width="190" height="56" rx="8"/><text class="sh" x="391" y="98" text-anchor="middle">trainer</text><rect class="panel-b" x="560" y="64" width="190" height="56" rx="8"/><text class="sh" x="655" y="98" text-anchor="middle">inspector</text><rect class="panel-b" x="30" y="372" width="190" height="56" rx="8"/><text class="sh" x="125" y="406" text-anchor="middle">investigator</text><rect class="panel-c" x="296" y="372" width="190" height="56" rx="8"/><text class="sh" x="391" y="406" text-anchor="middle">record keeper</text><rect class="panel-c" x="560" y="372" width="190" height="56" rx="8"/><text class="sh" x="655" y="406" text-anchor="middle">communicator</text><line class="stroke" x1="125" y1="120" x2="348" y2="200"/><line class="stroke" x1="390" y1="120" x2="390" y2="190"/><line class="stroke" x1="655" y1="120" x2="432" y2="200"/><line class="stroke" x1="125" y1="372" x2="348" y2="300"/><line class="stroke" x1="390" y1="372" x2="390" y2="308"/><line class="stroke" x1="655" y1="372" x2="432" y2="300"/><text class="small" x="390" y="452" text-anchor="middle">The professional advises, checks and records; the employer holds the legal duty.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
