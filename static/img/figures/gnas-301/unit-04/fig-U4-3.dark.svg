<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the PDCA cycle of an OSH management system</title><desc id="d">Flowchart of the PDCA cycle of an OSH management system, plan, do, check, act, drawn as a loop</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The PDCA engine of every OSH system</text><rect class="panel-a" x="60" y="90" width="190" height="110" rx="10"/><text class="sh" x="155" y="118" text-anchor="middle">1. plan</text><text class="small" x="155" y="142" text-anchor="middle">policy, hazard register,</text><text class="small" x="155" y="160" text-anchor="middle">legal requirements,</text><text class="small" x="155" y="178" text-anchor="middle">measurable objectives</text><rect class="panel-b" x="296" y="90" width="190" height="110" rx="10"/><text class="sh" x="391" y="118" text-anchor="middle">2. do</text><text class="small" x="391" y="142" text-anchor="middle">controls in place, training,</text><text class="small" x="391" y="160" text-anchor="middle">communication in the</text><text class="small" x="391" y="178" text-anchor="middle">language the floor speaks</text><rect class="panel-c" x="532" y="90" width="190" height="110" rx="10"/><text class="sh" x="627" y="118" text-anchor="middle">3. check</text><text class="small" x="627" y="142" text-anchor="middle">inspect, measure, audit;</text><text class="small" x="627" y="160" text-anchor="middle">prefer leading indicators</text><text class="small" x="627" y="178" text-anchor="middle">over injury counts</text><rect class="panel-d" x="296" y="300" width="190" height="110" rx="10"/><text class="sh" x="391" y="328" text-anchor="middle">4. act</text><text class="small" x="391" y="352" text-anchor="middle">review results, correct,</text><text class="small" x="391" y="370" text-anchor="middle">raise the bar for</text><text class="small" x="391" y="388" text-anchor="middle">the next cycle</text><line class="stroke" x1="250" y1="145" x2="294" y2="145" marker-end="url(#arrow)"/><line class="stroke" x1="486" y1="145" x2="530" y2="145" marker-end="url(#arrow)"/><path class="stroke" d="M 627 200 L 627 355 L 486 355" marker-end="url(#arrow)"/><path class="stroke" d="M 296 355 L 155 355 L 155 200" marker-end="url(#arrow)"/><text class="small" x="155" y="270" text-anchor="middle">the cycle repeats</text><text class="small" x="390" y="440" text-anchor="middle">Where the loop runs, the extinguisher on the wall is backed by a system; where it does not, it is paint.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
