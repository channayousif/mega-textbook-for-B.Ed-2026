<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Accident and injury types by sector</title><desc id="d">Table of accident and injury types by sector with a driver and one prevention point each</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Accident and injury types by sector</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Sector</text><text class="h" x="200" y="75">Characteristic accident</text><text class="h" x="430" y="75">One documented driver</text><text class="h" x="590" y="75">One prevention</text><rect class="panel-a" x="26" y="88" width="728" height="62"/><text class="sh" x="40" y="114">Industry</text><text class="body" x="200" y="114">caught-in and dust disease</text><text class="body" x="430" y="114">output pressure, missing</text><text class="body" x="430" y="133">guards and extraction</text><text class="body" x="620" y="114">guarding, extraction</text><rect class="panel-b" x="26" y="150" width="728" height="62"/><text class="sh" x="40" y="176">Construction</text><text class="body" x="200" y="176">falls and trench collapse</text><text class="body" x="430" y="176">unsafe practices, missing</text><text class="body" x="430" y="195">protection (Abbasi et al.)</text><text class="body" x="620" y="176">guardrails, support</text><rect class="panel-c" x="26" y="212" width="728" height="62"/><text class="sh" x="40" y="238">Agriculture</text><text class="body" x="200" y="238">spraying and machinery injury</text><text class="body" x="430" y="238">unlabelled chemicals,</text><text class="body" x="430" y="257">no protective equipment</text><text class="body" x="620" y="238">training, labels</text><rect class="panel-d" x="26" y="274" width="728" height="62"/><text class="sh" x="40" y="300">Services</text><text class="body" x="200" y="300">strain, stress, assault</text><text class="body" x="430" y="300">long hours, thin staffing,</text><text class="body" x="430" y="319">no reporting channel</text><text class="body" x="620" y="300">staffing, reporting</text><text class="small" x="390" y="358" text-anchor="middle">The quiet grades, dust disease and stress, never reach the fatality statistics that count them.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
