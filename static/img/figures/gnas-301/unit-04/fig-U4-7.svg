<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The duties and rights triangle</title><desc id="d">Table of the duties and rights triangle, employer, worker and government, each with duties and rights or powers</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The duties and rights triangle</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Who</text><text class="h" x="210" y="75">Duties in one line</text><text class="h" x="520" y="75">Rights or powers in one line</text><rect class="panel-a" x="26" y="88" width="728" height="88"/><text class="sh" x="40" y="114">Employer</text><text class="body" x="210" y="114">a workplace without avoidable</text><text class="body" x="210" y="133">harm; information, training,</text><text class="body" x="210" y="152">equipment</text><text class="body" x="520" y="114">holds the duty of care</text><rect class="panel-b" x="26" y="176" width="728" height="88"/><text class="sh" x="40" y="202">Worker</text><text class="body" x="210" y="202">follow safe procedures, use</text><text class="body" x="210" y="221">protection, report dangers</text><text class="body" x="520" y="202">know, protect, refuse,</text><text class="body" x="520" y="221">raise, without punishment</text><rect class="panel-c" x="26" y="264" width="728" height="88"/><text class="sh" x="40" y="290">Government</text><text class="body" x="210" y="290">set the law, inspect,</text><text class="body" x="210" y="309">enforce it</text><text class="body" x="520" y="290">improvement notices,</text><text class="body" x="520" y="309">penalties, prosecution</text><text class="small" x="390" y="374" text-anchor="middle">The rights exist because the weakest party cannot bargain for safety: fifty men wait outside the gate.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
