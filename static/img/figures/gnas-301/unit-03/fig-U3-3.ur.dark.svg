<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ڈیسیبل کی سیڑھی: آواز کتنی بلند ہے</title><desc id="d">ڈیسیبل کی سیڑھی کا خاکہ: خاموش لائبریری 30 ڈی بی سے دباؤ بگل 110 ڈی بی سے اوپر تک، 85 ڈی بی کے اوپر سماعت کو نقصان کی حد کے ساتھ</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">ڈیسیبل کی سیڑھی: آواز کتنی تیز ہے؟</text><rect class="panel-a" x="600" y="62" width="120" height="40" rx="6"/><text class="sh" x="580" y="88" text-anchor="end">خاموش لائبریری: 30 ڈی بی</text><rect class="panel-a" x="500" y="114" width="220" height="40" rx="6"/><text class="sh" x="480" y="140" text-anchor="end">عام بات چیت: 60 ڈی بی</text><line class="stroke-a" x1="740" y1="170" x2="40" y2="170" stroke-dasharray="7 5"/><text class="small" x="40" y="164" text-anchor="start">سماعت کے نقصان کی حد 85 ڈی بی کے قریب شروع (مسلسل رابطہ)</text><rect class="panel-c" x="380" y="182" width="340" height="40" rx="6"/><text class="sh" x="420" y="208" text-anchor="end">مصروف سڑک: 85 تا 95 ڈی بی</text><rect class="panel-c" x="260" y="234" width="460" height="40" rx="6"/><text class="sh" x="300" y="260" text-anchor="end">جنریٹر: تقریباً 95 ڈی بی</text><rect class="panel-d" x="140" y="286" width="580" height="40" rx="6"/><text class="sh" x="190" y="312" text-anchor="end">دباؤ بگل: 110+ ڈی بی</text><rect class="panel" x="40" y="356" width="680" height="72" rx="8"/><text class="sh" x="700" y="382" text-anchor="end">ہر 10 ڈی بی آواز کی توانائی میں دس گنا اضافہ ہے۔</text><text class="body" x="700" y="408" text-anchor="end">راہداری میں 70 ڈی بی اور دروازے پر 90 ڈی بی "تھوڑا زیادہ" نہیں ہے: یہ تقریباً</text><text class="body" x="700" y="426" text-anchor="end">سو گنا توانائی ہے۔ آنکھ عادی ہو جاتی ہے؛ کان زخمی ہوتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
