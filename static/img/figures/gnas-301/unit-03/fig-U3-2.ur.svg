<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ اہم آلودگیوں کا جدول</title><desc id="d">فضا کی چھ بڑی آلودگیوں کا جدول: ہر ایک کا ذریعہ، صحت پر اثر اور ایک قابو کی حکمت عملی</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">چھ اہم آلودگیاں</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">آلودگی</text><text class="h" x="600" y="75" text-anchor="end">بنیادی ذریعہ</text><text class="h" x="370" y="75" text-anchor="end">صحت پر اثر</text><text class="h" x="190" y="75" text-anchor="end">ایک قابو</text><rect class="panel-c" x="26" y="88" width="728" height="52"/><text class="sh" x="740" y="112" text-anchor="end">پی ایم 2.5 اور پی ایم 10</text><text class="body" x="600" y="112" text-anchor="end">جلانا، دھول، احتراق</text><text class="body" x="370" y="112" text-anchor="end">پھیپھڑوں اور دل کی بیماری</text><text class="body" x="190" y="112" text-anchor="end">کھلا جلانا بند</text><rect class="panel-a" x="26" y="140" width="728" height="52"/><text class="sh" x="740" y="164" text-anchor="end">نائٹروجن ڈائی آکسائیڈ</text><text class="body" x="600" y="164" text-anchor="end">انجن، بھٹی</text><text class="body" x="370" y="164" text-anchor="end">سانس کی نالی کی سوزش، دمہ</text><text class="body" x="190" y="164" text-anchor="end">انجن کے معیار</text><rect class="panel-a" x="26" y="192" width="728" height="52"/><text class="sh" x="740" y="216" text-anchor="end">سلفر ڈائی آکسائیڈ</text><text class="body" x="600" y="216" text-anchor="end">کوئلہ، تیل، بھٹے</text><text class="body" x="370" y="216" text-anchor="end">سانس میں جلن، تیزابی بارش</text><text class="body" x="190" y="216" text-anchor="end">صاف ایندھن، بھٹے کی ترقی</text><rect class="panel-b" x="26" y="244" width="728" height="52"/><text class="sh" x="740" y="268" text-anchor="end">کاربن مونو آکسائیڈ</text><text class="body" x="600" y="268" text-anchor="end">نامکمل جلنا، جنریٹر</text><text class="body" x="370" y="268" text-anchor="end">خون میں آکسیجن کی جگہ لیتا ہے</text><text class="body" x="190" y="268" text-anchor="end">ہوا کا بہاؤ، کبھی اندر نہیں</text><rect class="panel-b" x="26" y="296" width="728" height="52"/><text class="sh" x="740" y="320" text-anchor="end">زمینی اوزون</text><text class="body" x="600" y="320" text-anchor="end">دھوپ دیگر گیسوں پر عمل کر کے</text><text class="body" x="370" y="320" text-anchor="end">پھیپھڑوں میں جلن، فصلوں کو نقصان</text><text class="body" x="190" y="320" text-anchor="end">ان گیسوں میں کمی جس سے یہ بنتا ہے</text><rect class="panel-d" x="26" y="348" width="728" height="52"/><text class="sh" x="740" y="372" text-anchor="end">سیسہ</text><text class="body" x="600" y="372" text-anchor="end">کچھ ایندھن، پرانی پینٹ</text><text class="body" x="370" y="372" text-anchor="end">بڑھتے دماغ کو نقصان</text><text class="body" x="190" y="372" text-anchor="end">بغیر سیسے کا ایندھن</text><text class="small" x="390" y="432" text-anchor="middle">پی ایم 2.5 ذرہ ذرہ نظر نہیں آتا: صاف آسمان بھی غیر محفوظ اے کیو آئی لے سکتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
