<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six major air pollutants</title><desc id="d">Table of six major air pollutants with main source, health effect and one control strategy for each</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The six pollutants that matter</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Pollutant</text><text class="h" x="180" y="75">Main source</text><text class="h" x="410" y="75">Health effect</text><text class="h" x="590" y="75">One control</text><rect class="panel-c" x="26" y="88" width="728" height="52"/><text class="sh" x="40" y="112"><tspan x="40" y="112">PM2.5 and PM10</tspan></text><text class="body" x="180" y="112"><tspan x="180" y="112">combustion, dust, burning</tspan></text><text class="body" x="410" y="112"><tspan x="410" y="112">deep-lung and heart</tspan> <tspan x="410" y="130">disease</tspan></text><text class="body" x="590" y="112"><tspan x="590" y="112">end open burning</tspan></text><rect class="panel-a" x="26" y="140" width="728" height="52"/><text class="sh" x="40" y="164"><tspan x="40" y="164">Nitrogen dioxide</tspan></text><text class="body" x="180" y="164"><tspan x="180" y="164">engines, furnaces</tspan></text><text class="body" x="410" y="164"><tspan x="410" y="164">airway inflammation,</tspan> <tspan x="410" y="182">asthma</tspan></text><text class="body" x="590" y="164"><tspan x="590" y="164">engine standards</tspan></text><rect class="panel-a" x="26" y="192" width="728" height="52"/><text class="sh" x="40" y="216"><tspan x="40" y="216">Sulfur dioxide</tspan></text><text class="body" x="180" y="216"><tspan x="180" y="216">coal, oil, kilns</tspan></text><text class="body" x="410" y="216"><tspan x="410" y="216">airway irritation,</tspan> <tspan x="410" y="234">acid rain</tspan></text><text class="body" x="590" y="216"><tspan x="590" y="216">cleaner fuel, kiln</tspan> <tspan x="590" y="234">upgrade</tspan></text><rect class="panel-b" x="26" y="244" width="728" height="52"/><text class="sh" x="40" y="268"><tspan x="40" y="268">Carbon </tspan> <tspan x="40" y="286">monoxide</tspan></text><text class="body" x="180" y="268"><tspan x="180" y="268">incomplete burning,</tspan> <tspan x="180" y="286">generators</tspan></text><text class="body" x="410" y="268"><tspan x="410" y="268">takes oxygen's seat</tspan> <tspan x="410" y="286">in blood</tspan></text><text class="body" x="590" y="268"><tspan x="590" y="268">ventilation, never</tspan> <tspan x="590" y="286">indoors</tspan></text><rect class="panel-b" x="26" y="296" width="728" height="52"/><text class="sh" x="40" y="320"><tspan x="40" y="320">Ground-level</tspan> <tspan x="40" y="338">ozone</tspan></text><text class="body" x="180" y="320"><tspan x="180" y="320">sunlight acting on other</tspan> <tspan x="180" y="338">gases</tspan></text><text class="body" x="410" y="320"><tspan x="410" y="320">lung irritation, crop</tspan> <tspan x="410" y="338">damage</tspan></text><text class="body" x="590" y="320"><tspan x="590" y="320">cut the gases it</tspan> <tspan x="590" y="338">cooks from</tspan></text><rect class="panel-d" x="26" y="348" width="728" height="52"/><text class="sh" x="40" y="372"><tspan x="40" y="372">Lead</tspan></text><text class="body" x="180" y="372"><tspan x="180" y="372">some fuels, old paint</tspan></text><text class="body" x="410" y="372"><tspan x="410" y="372">damages the</tspan> <tspan x="410" y="390">developing brain</tspan></text><text class="body" x="590" y="372"><tspan x="590" y="372">unleaded fuel</tspan></text><text class="small" x="390" y="432" text-anchor="middle">PM2.5 is invisible particle by particle: a clear sky can still carry an unhealthy index.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
