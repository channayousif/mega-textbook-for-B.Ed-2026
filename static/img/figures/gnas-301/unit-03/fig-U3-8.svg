<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four hazard identification tools</title><desc id="d">Table of four hazard identification tools with what each finds and its blind spot</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">Hazard identification tools</text><rect class="panel" x="26" y="52" width="728" height="38"/><text class="h" x="40" y="77">Tool</text><text class="h" x="240" y="77">What it finds</text><text class="h" x="510" y="77">Its blind spot</text><rect class="panel-a" x="26" y="90" width="728" height="70"/><text class="sh" x="40" y="118">Walk-around inspection</text><text class="body" x="240" y="118">what is visible now: the broken</text><text class="body" x="240" y="138">window, the open tank, the wire</text><text class="body" x="510" y="118">what only appears at night,</text><text class="body" x="510" y="138">in rush hour, or in the rain</text><rect class="panel-b" x="26" y="160" width="728" height="70"/><text class="sh" x="40" y="188">Checklists</text><text class="body" x="240" y="188">the known hazards, reliably:</text><text class="body" x="240" y="208">nothing on the list is missed</text><text class="body" x="510" y="188">anything not on the list,</text><text class="body" x="510" y="208">including the new and unusual</text><rect class="panel-c" x="26" y="230" width="728" height="70"/><text class="sh" x="40" y="258">Incident records</text><text class="body" x="240" y="258">what has already hurt someone:</text><text class="body" x="240" y="278">patterns, repeat spots</text><text class="body" x="510" y="258">near-misses nobody reported;</text><text class="body" x="510" y="278">the first occurrence</text><rect class="panel-d" x="26" y="300" width="728" height="70"/><text class="sh" x="40" y="328">Asking the workers</text><text class="body" x="240" y="328">what actually happens: the shortcut,</text><text class="body" x="240" y="348">the smell, the near-miss</text><text class="body" x="510" y="328">only as good as the trust</text><text class="body" x="510" y="348">behind the asking</text><text class="small" x="390" y="412" text-anchor="middle">The most under-used tool is the last one: the people who work there usually know.</text><text class="small" x="390" y="432" text-anchor="middle">A Karachi site study found its hazards through exactly such community and site methods.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
