<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خطرے کی شناخت کے چار اوزاروں کا جدول</title><desc id="d">خطرے کی شناخت کے چار اوزاروں کا جدول: ہر ایک کیا تلاشتا ہے اور اس کا اندھا نقطہ کیا ہے</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">خطرے کی شناخت کے اوزار</text><rect class="panel" x="26" y="52" width="728" height="38"/><text class="h" x="740" y="77" text-anchor="end">اوزار</text><text class="h" x="540" y="77" text-anchor="end">کیا تلاشتا ہے</text><text class="h" x="270" y="77" text-anchor="end">اس کا اندھا نقطہ</text><rect class="panel-a" x="26" y="90" width="728" height="70"/><text class="sh" x="740" y="118" text-anchor="end">چہل قدمی معائنہ</text><text class="body" x="540" y="118" text-anchor="end">جو اب دکھائی دیتا ہے: ٹوٹی</text><text class="body" x="540" y="138" text-anchor="end">کھڑکی، کھلا ٹینک، تار</text><text class="body" x="270" y="118" text-anchor="end">جو صرف رات، اوقاتِ</text><text class="body" x="270" y="138" text-anchor="end">رش یا بارش میں نظر آئے</text><rect class="panel-b" x="26" y="160" width="728" height="70"/><text class="sh" x="740" y="188" text-anchor="end">چیک لسٹیں</text><text class="body" x="540" y="188" text-anchor="end">معروف خطرے، بھروسے سے:</text><text class="body" x="540" y="208" text-anchor="end">فہرست کی کوئی چیز نہیں چھوٹتی</text><text class="body" x="270" y="188" text-anchor="end">جو فہرست میں نہیں،</text><text class="body" x="270" y="208" text-anchor="end">بشمول نیا اور غیر معمولی</text><rect class="panel-c" x="26" y="230" width="728" height="70"/><text class="sh" x="740" y="258" text-anchor="end">واقعات کے ریکارڈ</text><text class="body" x="540" y="258" text-anchor="end">جس نے پہلے نقصان کیا ہو:</text><text class="body" x="540" y="278" text-anchor="end">نمونے، دہرائی جگہیں</text><text class="body" x="270" y="258" text-anchor="end">بچے ہوئے حادثے جو رپورٹ نہ ہوئے؛</text><text class="body" x="270" y="278" text-anchor="end">پہلا واقعہ</text><rect class="panel-d" x="26" y="300" width="728" height="70"/><text class="sh" x="740" y="328" text-anchor="end">کارکنوں سے پوچھنا</text><text class="body" x="540" y="328" text-anchor="end">جو اصل میں ہوتا ہے: شارٹ کٹ،</text><text class="body" x="540" y="348" text-anchor="end">بو، بچا ہوا حادثہ</text><text class="body" x="270" y="328" text-anchor="end">اتنا ہی بہتر جتنا</text><text class="body" x="270" y="348" text-anchor="end">پوچھنے کے پیچھے اعتماد</text><text class="small" x="390" y="412" text-anchor="middle">سب سے کم استعمال ہونے والا اوزار آخری ہے: وہاں کام کرنے والے عام طور پر جانتے ہیں۔</text><text class="small" x="390" y="432" text-anchor="middle">کراچی کی سائٹ کی تحقیق نے خطرے اسی طرح کے معاشرتی اور سائٹ طریقوں سے پائے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
