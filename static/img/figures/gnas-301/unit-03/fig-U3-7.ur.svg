<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خطرے کے انتظام کے چکر کا فلو چارٹ</title><desc id="d">خطرے کے انتظام کے چکر کا فلو چارٹ: خطرے پہچانیں، خطرہ اندازی لگائیں، قابو کریں، نگرانی اور جائزہ، ایک لوپ کی شکل میں</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">خطرے کے انتظام کا چکر</text><rect class="panel-a" x="530" y="90" width="190" height="110" rx="10"/><text class="sh" x="625" y="120" text-anchor="middle">1. پہچان</text><text class="small" x="625" y="142" text-anchor="middle">چہل قدمی، فہرست، ریکارڈ</text><text class="small" x="625" y="160" text-anchor="middle">دیکھیں، وہاں کام</text><text class="small" x="625" y="178" text-anchor="middle">کرنے والوں سے پوچھیں</text><rect class="panel-b" x="294" y="90" width="190" height="110" rx="10"/><text class="sh" x="389" y="120" text-anchor="middle">2. اندازہ</text><text class="small" x="389" y="142" text-anchor="middle">امکان ضرب شدت،</text><text class="small" x="389" y="160" text-anchor="middle">گرڈ پر: ترتیب دیں،</text><text class="small" x="389" y="178" text-anchor="middle">پھر ٹھیک کریں</text><rect class="panel-c" x="58" y="90" width="190" height="110" rx="10"/><text class="sh" x="153" y="120" text-anchor="middle">3. قابو</text><text class="small" x="153" y="142" text-anchor="middle">ترتیب: ہٹائیں،</text><text class="small" x="153" y="160" text-anchor="middle">بدلیں، رکاوٹ لگائیں،</text><text class="small" x="153" y="178" text-anchor="middle">طریقہ کار، تحفظ</text><rect class="panel-d" x="294" y="290" width="190" height="110" rx="10"/><text class="sh" x="389" y="320" text-anchor="middle">4. نگرانی اور جائزہ</text><text class="small" x="389" y="342" text-anchor="middle">دیکھیں، ریکارڈ کریں،</text><text class="small" x="389" y="360" text-anchor="middle">دوبارہ جانچیں: جو قابو</text><text class="small" x="389" y="378" text-anchor="middle">جانچا نہ جائے وہ ختم ہو جاتا ہے</text><line class="stroke" x1="530" y1="145" x2="486" y2="145" marker-end="url(#arrow)"/><line class="stroke" x1="294" y1="145" x2="250" y2="145" marker-end="url(#arrow)"/><path class="stroke" d="M153 200 L153 345 L294 345" marker-end="url(#arrow)"/><path class="stroke" d="M484 345 L625 345 L625 200" marker-end="url(#arrow)"/><text class="small" x="625" y="270" text-anchor="middle">چکر دہرایا جاتا ہے</text><text class="small" x="390" y="440" text-anchor="middle">کسی زخمی ہونے سے پہلے کیا جائے تو یہی پورا طریقہ ہے؛ جس فارم کے لیے عمارت میں چہل قدمی نہ ہو وہ سجاوٹ ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
