<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five noise sources</title><desc id="d">Table of five noise sources with health impact, who is exposed and one control measure for each</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Noise sources: impact, exposure, control</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="40" y="75">Source</text><text class="h" x="180" y="75">Health impact in one line</text><text class="h" x="440" y="75">Who is exposed</text><text class="h" x="600" y="75">One control</text><rect class="panel-c" x="26" y="88" width="728" height="62"/><text class="sh" x="40" y="114">Road traffic</text><text class="body" x="180" y="114">stress, blood pressure,</text><text class="body" x="180" y="134">disturbed sleep</text><text class="body" x="440" y="114">everyone on the</text><text class="body" x="440" y="134">street and beside it</text><text class="body" x="600" y="114">enforced horn bans;</text><text class="body" x="600" y="134">smooth traffic flow</text><rect class="panel-a" x="26" y="150" width="728" height="62"/><text class="sh" x="40" y="176">Construction</text><text class="body" x="180" y="176">hearing loss for workers;</text><text class="body" x="180" y="196">disturbed lessons nearby</text><text class="body" x="440" y="176">workers, pupils of</text><text class="body" x="440" y="196">the neighbouring</text><text class="body" x="600" y="176">time limits near</text><text class="body" x="600" y="196">schools; barriers</text><rect class="panel-a" x="26" y="212" width="728" height="62"/><text class="sh" x="40" y="238">Generators</text><text class="body" x="180" y="238">sleep loss, stress in</text><text class="body" x="180" y="258">load-shedding hours</text><text class="body" x="440" y="238">households and</text><text class="body" x="440" y="258">neighbours</text><text class="body" x="600" y="238">sound boxes; siting;</text><text class="body" x="600" y="258">maintenance</text><rect class="panel-b" x="26" y="274" width="728" height="62"/><text class="sh" x="40" y="300">Loudspeakers</text><text class="body" x="180" y="300">sleep disturbance;</text><text class="body" x="180" y="320">conflict, stress</text><text class="body" x="440" y="300">whole</text><text class="body" x="440" y="320">neighbourhoods</text><text class="body" x="600" y="300">volume limits and</text><text class="body" x="600" y="320">agreed hours</text><rect class="panel-b" x="26" y="336" width="728" height="62"/><text class="sh" x="40" y="362">Workshops</text><text class="body" x="180" y="362">gradual permanent</text><text class="body" x="180" y="382">hearing loss</text><text class="body" x="440" y="362">workers, apprentices,</text><text class="body" x="440" y="382">the lane</text><text class="body" x="600" y="362">ear protection; machine</text><text class="body" x="600" y="382">maintenance</text><text class="small" x="390" y="432" text-anchor="middle">Controls act at the source, in the pathway (distance, barriers, siting), and at the receptor.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
