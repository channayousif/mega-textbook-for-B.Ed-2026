<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ شور کے ذرائع کا جدول</title><desc id="d">شور کے پانچ ذرائع کا جدول: ہر ایک کا صحت پر اثر، کون متاثر ہوتا ہے اور ایک قابو</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">شور کے ذرائع: اثر، رابطہ، قابو</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">ذریعہ</text><text class="h" x="600" y="75" text-anchor="end">صحت پر اثر ایک سطر میں</text><text class="h" x="340" y="75" text-anchor="end">کون متاثر ہوتا ہے</text><text class="h" x="180" y="75" text-anchor="end">ایک قابو</text><rect class="panel-c" x="26" y="88" width="728" height="62"/><text class="sh" x="740" y="114" text-anchor="end">سڑک کی ٹریفک</text><text class="body" x="600" y="114" text-anchor="end">ذہنی دباؤ، بلڈ پریشر،</text><text class="body" x="600" y="134" text-anchor="end">خراب نیند</text><text class="body" x="340" y="114" text-anchor="end">سڑک اور اس کے</text><text class="body" x="340" y="134" text-anchor="end">آس پاس کے سب</text><text class="body" x="180" y="114" text-anchor="end">بگل پر پابندی کا نفاذ؛</text><text class="body" x="180" y="134" text-anchor="end">روانی سے ٹریفک</text><rect class="panel-a" x="26" y="150" width="728" height="62"/><text class="sh" x="740" y="176" text-anchor="end">تعمیراتی کام</text><text class="body" x="600" y="176" text-anchor="end">کارکنوں کا سماعت نقصان؛</text><text class="body" x="600" y="196" text-anchor="end">قریبی جماعتوں میں خلل</text><text class="body" x="340" y="176" text-anchor="end">کارکن، قریبی اسکول کے</text><text class="body" x="340" y="196" text-anchor="end">طالب علم</text><text class="body" x="180" y="176" text-anchor="end">اسکولوں کے قریب وقت کی</text><text class="body" x="180" y="196" text-anchor="end">حد؛ رکاوٹیں</text><rect class="panel-a" x="26" y="212" width="728" height="62"/><text class="sh" x="740" y="238" text-anchor="end">جنریٹر</text><text class="body" x="600" y="238" text-anchor="end">لوڈشیڈنگ کے وقت نیند</text><text class="body" x="600" y="258" text-anchor="end">کا نقصان، ذہنی دباؤ</text><text class="body" x="340" y="238" text-anchor="end">گھرانے اور</text><text class="body" x="340" y="258" text-anchor="end">پڑوسی</text><text class="body" x="180" y="238" text-anchor="end">آواز کے ڈبے؛ جگہ کا انتخاب؛</text><text class="body" x="180" y="258" text-anchor="end">دیکھ بھال</text><rect class="panel-b" x="26" y="274" width="728" height="62"/><text class="sh" x="740" y="300" text-anchor="end">لاوڈ اسپیکر</text><text class="body" x="600" y="300" text-anchor="end">نیند میں خلل؛</text><text class="body" x="600" y="320" text-anchor="end">جھگڑا، ذہنی دباؤ</text><text class="body" x="340" y="300" text-anchor="end">پورے</text><text class="body" x="340" y="320" text-anchor="end">محلے</text><text class="body" x="180" y="300" text-anchor="end">آواز کی حد اور طے</text><text class="body" x="180" y="320" text-anchor="end">شدہ اوقات</text><rect class="panel-b" x="26" y="336" width="728" height="62"/><text class="sh" x="740" y="362" text-anchor="end">ورکشاپیں</text><text class="body" x="600" y="362" text-anchor="end">آہستہ آہستہ ہمیشہ کا</text><text class="body" x="600" y="382" text-anchor="end">سماعت نقصان</text><text class="body" x="340" y="362" text-anchor="end">کارکن، شاگرد،</text><text class="body" x="340" y="382" text-anchor="end">گلی</text><text class="body" x="180" y="362" text-anchor="end">کان کا تحفظ؛ مشین کی</text><text class="body" x="180" y="382" text-anchor="end">دیکھ بھال</text><text class="small" x="390" y="432" text-anchor="middle">قابو ذریعے پر، راستے میں (فاصلہ، رکاوٹ، جگہ) اور وصول کنندہ پر لگتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
