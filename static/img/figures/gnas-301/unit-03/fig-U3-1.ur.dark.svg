<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فضا کی آلودگی کی زنجیر اور قابو کی جگہیں</title><desc id="d">فضا کی آلودگی کی زنجیر کا خاکہ: ذرائع سے ہوا کے راستے سے وصول کنندگان تک، ذریعہ، راستہ اور وصول کنندہ پر قابو کی حکمت عملیوں کے ساتھ</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">فضا کی آلودگی کی زنجیر اور قابو کہاں لگتا ہے</text><rect class="panel-c" x="556" y="70" width="200" height="120" rx="10"/><text class="sh" x="656" y="96" text-anchor="middle">ذرائع</text><text class="small" x="656" y="118" text-anchor="middle">گاڑیاں، اینٹوں کے بھٹے،</text><text class="small" x="656" y="136" text-anchor="middle">صنعت، کچرا جلانا،</text><text class="small" x="656" y="154" text-anchor="middle">فصل کی باقیات جلانا</text><rect class="panel-b" x="290" y="70" width="200" height="120" rx="10"/><text class="sh" x="390" y="96" text-anchor="middle">ہوا (راستہ)</text><text class="small" x="390" y="118" text-anchor="middle">پھیلاؤ، یا سردیوں کا وہ</text><text class="small" x="390" y="136" text-anchor="middle">الٹا دباؤ جو اسے</text><text class="small" x="390" y="154" text-anchor="middle">شہر کے اوپر قید رکھتا ہے</text><rect class="panel-d" x="24" y="70" width="200" height="120" rx="10"/><text class="sh" x="124" y="96" text-anchor="middle">وصول کنندگان</text><text class="small" x="124" y="118" text-anchor="middle">سانس لیتا بچہ،</text><text class="small" x="124" y="136" text-anchor="middle">اسکول، فصلیں،</text><text class="small" x="124" y="154" text-anchor="middle">کھڑکی کا انسان</text><line class="stroke" x1="556" y1="130" x2="492" y2="130" marker-end="url(#arrow)"/><line class="stroke" x1="290" y1="130" x2="226" y2="130" marker-end="url(#arrow)"/><rect class="panel" x="24" y="240" width="732" height="176" rx="10"/><text class="sh" x="736" y="268" text-anchor="end">ذریعے پر قابو (سب سے مؤثر)</text><text class="body" x="736" y="292" text-anchor="end">صاف ایندھن؛ بہتر بھٹے؛ انجن کے معیار؛ کھلے میں جلانے کا خاتمہ</text><text class="sh" x="736" y="324" text-anchor="end">راستے میں قابو (کمزور)</text><text class="body" x="736" y="348" text-anchor="end">پھیلاؤ آلودگی صرف ہٹاتا ہے؛ الٹے دباؤ میں مدد بہت کم ہے</text><text class="sh" x="736" y="380" text-anchor="end">وصول کنندہ پر قابو (استاد کے اوزار)</text><text class="body" x="736" y="404" text-anchor="end">اے کیو آئی جانچ؛ کھیل صبح کرنا؛ خطرناک دنوں میں کھڑکیاں بند؛ دمے کا منصوبہ</text><text class="small" x="390" y="442" text-anchor="middle">سچا جواب: راستہ صاف نہیں کیا جا سکتا، صرف اخراج گھٹا کر مختصر کیا جا سکتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
