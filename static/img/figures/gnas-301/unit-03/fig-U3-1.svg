<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the air pollution chain</title><desc id="d">Diagram of the air pollution chain from sources through the air to receptors, with control strategies marked at source, pathway and receptor</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="32" text-anchor="middle">The air pollution chain, and where controls act</text><rect class="panel-c" x="24" y="70" width="200" height="120" rx="10"/><text class="sh" x="124" y="96" text-anchor="middle">sources</text><text class="small" x="124" y="118" text-anchor="middle">vehicles, brick kilns,</text><text class="small" x="124" y="136" text-anchor="middle">industry, waste burning,</text><text class="small" x="124" y="154" text-anchor="middle">crop-residue burning</text><rect class="panel-b" x="290" y="70" width="200" height="120" rx="10"/><text class="sh" x="390" y="96" text-anchor="middle">the air (pathway)</text><text class="small" x="390" y="118" text-anchor="middle">dispersion, or a winter</text><text class="small" x="390" y="136" text-anchor="middle">inversion that traps</text><text class="small" x="390" y="154" text-anchor="middle">it over the city</text><rect class="panel-d" x="556" y="70" width="200" height="120" rx="10"/><text class="sh" x="656" y="96" text-anchor="middle">receptors</text><text class="small" x="656" y="118" text-anchor="middle">a child breathing, a</text><text class="small" x="656" y="136" text-anchor="middle">school, crops, the</text><text class="small" x="656" y="154" text-anchor="middle">person at the window</text><line class="stroke" x1="224" y1="130" x2="288" y2="130" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="130" x2="554" y2="130" marker-end="url(#arrow)"/><rect class="panel" x="24" y="240" width="732" height="176" rx="10"/><text class="sh" x="44" y="268">Control at the source (strongest)</text><text class="body" x="44" y="292">cleaner fuel; upgraded kilns; engine standards; an end to open burning</text><text class="sh" x="44" y="324">Control in the pathway (weak)</text><text class="body" x="44" y="348">dispersion only moves the pollutant; in an inversion there is little to help</text><text class="sh" x="44" y="380">Control at the receptor (a teacher's tools)</text><text class="body" x="44" y="404">AQI check; morning timing of sports; windows shut on hazardous days; asthma plans</text><text class="small" x="390" y="442" text-anchor="middle">The honest answer: the pathway cannot be cleaned, only shortened by cutting emissions.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
