<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خطرے کی پانچ اقسام کا تصوراتی نقشہ</title><desc id="d">خطرے کی پانچ اقسام کا تصوراتی نقشہ: جسمانی، میکانکی، حیاتیاتی، کیمیائی اور نفسیاتی، مرکزی خطرے کے گرہ سے نکلتی شاخیں، ہر ایک کے ساتھ پاکستانی مثال</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">خطرے کی پانچ اقسام</text><circle class="panel" cx="390" cy="250" r="56"/><text class="h" x="390" y="244" text-anchor="middle">خطرہ</text><text class="small" x="390" y="266" text-anchor="middle">نقصان کی صلاحیت</text><rect class="panel-a" x="538" y="60" width="212" height="72" rx="8"/><text class="sh" x="644" y="84" text-anchor="middle">جسمانی</text><text class="small" x="644" y="104" text-anchor="middle">حرارت، شور، کمپن،</text><text class="small" x="644" y="120" text-anchor="middle">بجلی: 45 ڈگری کی جماعت</text><rect class="panel-b" x="284" y="60" width="212" height="72" rx="8"/><text class="sh" x="390" y="84" text-anchor="middle">میکانکی</text><text class="small" x="390" y="104" text-anchor="middle">حرکت کرتے حصے، گرنا،</text><text class="small" x="390" y="120" text-anchor="middle">گاڑیاں: پڑوس کی سائٹ</text><rect class="panel-c" x="30" y="60" width="212" height="72" rx="8"/><text class="sh" x="136" y="84" text-anchor="middle">حیاتیاتی</text><text class="small" x="136" y="104" text-anchor="middle">جراثیم، فنگس، جانور:</text><text class="small" x="136" y="120" text-anchor="middle">سیلابی پانی میں بیماری</text><rect class="panel-c" x="538" y="356" width="212" height="72" rx="8"/><text class="sh" x="644" y="380" text-anchor="middle">کیمیائی</text><text class="small" x="644" y="400" text-anchor="middle">دھوئیں، کیڑے مار ادویات، صاف کرنے والے:</text><text class="small" x="644" y="416" text-anchor="middle">آگ کے پاس سلنڈر</text><rect class="panel-d" x="30" y="356" width="212" height="72" rx="8"/><text class="sh" x="136" y="380" text-anchor="middle">نفسیاتی</text><text class="small" x="136" y="400" text-anchor="middle">بوجھ، خوف، ہراسانی:</text><text class="small" x="136" y="416" text-anchor="middle">بے خواب رضاکار</text><line class="stroke" x1="580" y1="132" x2="432" y2="206"/><line class="stroke" x1="390" y1="132" x2="390" y2="192"/><line class="stroke" x1="200" y1="132" x2="348" y2="206"/><line class="stroke" x1="580" y1="356" x2="432" y2="294"/><line class="stroke" x1="200" y1="356" x2="348" y2="294"/><text class="small" x="390" y="452" text-anchor="middle">خطرہ وہ ہر چیز ہے جس میں نقصان کی صلاحیت ہو۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
