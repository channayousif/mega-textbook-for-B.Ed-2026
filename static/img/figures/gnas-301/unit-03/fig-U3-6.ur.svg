<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خطرے کی پانچ اقسام کا جدول</title><desc id="d">خطرے کی پانچ اقسام کا جدول: ہر ایک کے ساتھ ایک مثال، صحت پر اثر اور ایک حفاظتی اقدام</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">خطرے کی پانچ اقسام، قابو کے ساتھ</text><rect class="panel" x="26" y="50" width="728" height="38"/><text class="h" x="740" y="75" text-anchor="end">قسم</text><text class="h" x="630" y="75" text-anchor="end">ایک مثال</text><text class="h" x="380" y="75" text-anchor="end">صحت پر اثر</text><text class="h" x="190" y="75" text-anchor="end">ایک حفاظتی اقدام</text><rect class="panel-a" x="26" y="88" width="728" height="62"/><text class="sh" x="740" y="114" text-anchor="end">جسمانی</text><text class="body" x="630" y="114" text-anchor="end">45 ڈگری کی جماعت؛</text><text class="body" x="630" y="134" text-anchor="end">اس کے پاس جنریٹر کا دھواں</text><text class="body" x="380" y="114" text-anchor="end">گرمی سور؛</text><text class="body" x="380" y="134" text-anchor="end">کاربن مونو آکسائیڈ</text><text class="body" x="190" y="114" text-anchor="end">سایہ، پانی، وقفہ؛</text><text class="body" x="190" y="134" text-anchor="end">دھواں باہر</text><rect class="panel-b" x="26" y="150" width="728" height="62"/><text class="sh" x="740" y="176" text-anchor="end">میکانکی</text><text class="body" x="630" y="176" text-anchor="end">گرتی دیوار؛</text><text class="body" x="630" y="196" text-anchor="end">بغیر رکاوٹ مشین</text><text class="body" x="380" y="176" text-anchor="end">کٹ، کچلے زخم،</text><text class="body" x="380" y="196" text-anchor="end">گرنا</text><text class="body" x="190" y="176" text-anchor="end">رکاوٹیں؛ حفاظتی جالی؛</text><text class="body" x="190" y="196" text-anchor="end">خطرے پر نشان لگا کر بند کرنا</text><rect class="panel-c" x="26" y="212" width="728" height="62"/><text class="sh" x="740" y="238" text-anchor="end">حیاتیاتی</text><text class="body" x="630" y="238" text-anchor="end">سیلابی پانی؛ فنگس؛</text><text class="body" x="630" y="258" text-anchor="end">کیڑے اور بچھو</text><text class="body" x="380" y="238" text-anchor="end">پانی سے پھیلنے والی بیماری؛</text><text class="body" x="380" y="258" text-anchor="end">ڈنک؛ انفیکشن</text><text class="body" x="190" y="238" text-anchor="end">محفوظ پانی؛ خشک کرنا؛</text><text class="body" x="190" y="258" text-anchor="end">ملبہ ہٹانا</text><rect class="panel-c" x="26" y="274" width="728" height="62"/><text class="sh" x="740" y="300" text-anchor="end">کیمیائی</text><text class="body" x="630" y="300" text-anchor="end">صفائی کے تیزاب؛ کیڑے مار</text><text class="body" x="630" y="320" text-anchor="end">ادویات کا چھڑکاؤ؛ آگ کے پاس سلنڈر</text><text class="body" x="380" y="300" text-anchor="end">جلن، زہر؛</text><text class="body" x="380" y="320" text-anchor="end">آگ اور دھماکہ</text><text class="body" x="190" y="300" text-anchor="end">لیبل؛ الگ ذخیرہ؛</text><text class="body" x="190" y="320" text-anchor="end">ہدایات پر عمل</text><rect class="panel-d" x="26" y="336" width="728" height="62"/><text class="sh" x="740" y="362" text-anchor="end">نفسیاتی</text><text class="body" x="630" y="362" text-anchor="end">بے گھری کا دباؤ؛</text><text class="body" x="630" y="382" text-anchor="end">ناقابلِ برداشت کام کا بوجھ</text><text class="body" x="380" y="362" text-anchor="end">بے خوابی، بے چینی،</text><text class="body" x="380" y="382" text-anchor="end">اعصابی خرابی</text><text class="body" x="190" y="362" text-anchor="end">تبادلہ، آرام، بات</text><text class="body" x="190" y="382" text-anchor="end">کرنے کے لیے کوئی</text><text class="small" x="390" y="432" text-anchor="middle">پر سکون خطرے، حرارت، دھول، شور، ذہنی دباؤ، ڈرامائی حادثوں جتنا ہی بوجھ ڈالتے ہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
