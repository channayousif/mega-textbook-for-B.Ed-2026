<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the five hazard classes</title><desc id="d">Concept map of the five hazard classes, physical, mechanical, biological, chemical and psychological, branching from a central hazard node, each with a Pakistani example</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} .yes{fill:var(--ink);} .no{fill:var(--muted);} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The five hazard classes</text><circle class="panel" cx="390" cy="250" r="56"/><text class="h" x="390" y="244" text-anchor="middle">hazard</text><text class="small" x="390" y="266" text-anchor="middle">the potential to harm</text><rect class="panel-a" x="30" y="60" width="212" height="72" rx="8"/><text class="sh" x="136" y="84" text-anchor="middle">physical</text><text class="small" x="136" y="104" text-anchor="middle">heat, noise, vibration,</text><text class="small" x="136" y="120" text-anchor="middle">electricity: a 45-degree class</text><rect class="panel-b" x="284" y="60" width="212" height="72" rx="8"/><text class="sh" x="390" y="84" text-anchor="middle">mechanical</text><text class="small" x="390" y="104" text-anchor="middle">moving parts, falls,</text><text class="small" x="390" y="120" text-anchor="middle">vehicles: the site next door</text><rect class="panel-c" x="538" y="60" width="212" height="72" rx="8"/><text class="sh" x="644" y="84" text-anchor="middle">biological</text><text class="small" x="644" y="104" text-anchor="middle">germs, mould, animals:</text><text class="small" x="644" y="120" text-anchor="middle">disease in flood water</text><rect class="panel-c" x="30" y="356" width="212" height="72" rx="8"/><text class="sh" x="136" y="380" text-anchor="middle">chemical</text><text class="small" x="136" y="400" text-anchor="middle">fumes, pesticides, cleaners:</text><text class="small" x="136" y="416" text-anchor="middle">the cylinder by the fire</text><rect class="panel-d" x="538" y="356" width="212" height="72" rx="8"/><text class="sh" x="644" y="380" text-anchor="middle">psychological</text><text class="small" x="644" y="400" text-anchor="middle">overload, fear, harassment:</text><text class="small" x="644" y="416" text-anchor="middle">the sleepless volunteers</text><line class="stroke" x1="200" y1="132" x2="348" y2="206"/><line class="stroke" x1="390" y1="132" x2="390" y2="192"/><line class="stroke" x1="580" y1="132" x2="432" y2="206"/><line class="stroke" x1="200" y1="356" x2="348" y2="294"/><line class="stroke" x1="580" y1="356" x2="432" y2="294"/><text class="small" x="390" y="452" text-anchor="middle">A hazard is anything with the potential to cause harm.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
