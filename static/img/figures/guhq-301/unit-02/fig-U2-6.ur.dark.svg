<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">فعل کا زمانہ پہچاننے کا بہاؤ چارٹ</title><desc id="d">قرآنی فعل کا زمانہ پہچاننے کا بہاؤ چارٹ: پہلے علامتِ مضارع دیکھیں (مضارع)، پھر براہِ راست حکم دیکھیں (امر)، ورنہ وہ ماضی ہے</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, -apple-system, sans-serif; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="756" y="34" text-anchor="end">‏فعل کا زمانہ پہچاننے کا طریقہ‏</text><rect class="panel" x="480" y="56" width="260" height="60" rx="8"/><text class="cell" x="610" y="80" text-anchor="middle">‏کیا لفظ کے شروع میں علامتِ مضارع‏</text><text class="cell" x="610" y="102" text-anchor="middle">‏(یـ، تـ، أ، نـ) ہے؟‏</text><rect class="panel-a" x="60" y="56" width="240" height="120" rx="8"/><text class="sh" x="284" y="82" text-anchor="end">‏مضارع (حال / مستقبل)‏</text><text class="cell" x="284" y="104" text-anchor="end">‏فاعل معلوم کرنے کے لیے‏</text><text class="cell" x="284" y="124" text-anchor="end">‏شروع کی علامت دیکھیں‏</text><text class="cell" x="284" y="148" text-anchor="end">‏مثال: يَكْتُبُ (وہ لکھتا ہے)‏</text><rect class="panel" x="480" y="190" width="260" height="60" rx="8"/><text class="cell" x="610" y="214" text-anchor="middle">‏کیا یہ سامنے والے کو براہِ راست‏</text><text class="cell" x="610" y="234" text-anchor="middle">‏دیا گیا حکم ہے؟‏</text><rect class="panel-b" x="60" y="190" width="240" height="100" rx="8"/><text class="sh" x="284" y="216" text-anchor="end">‏امر (حکم)‏</text><text class="cell" x="284" y="238" text-anchor="end">‏سامنے والے کو براہِ راست حکم‏</text><text class="cell" x="284" y="260" text-anchor="end">‏مثال: ٱقْرَأْ (پڑھ!، 96:1)‏</text><rect class="panel" x="480" y="310" width="260" height="114" rx="8"/><text class="sh" x="724" y="336" text-anchor="end">‏ماضی (گزشتہ زمانہ)‏</text><text class="cell" x="724" y="358" text-anchor="end">‏فاعل معلوم کرنے کے لیے‏</text><text class="cell" x="724" y="378" text-anchor="end">‏لفظ کے آخری حروف دیکھیں‏</text><text class="cell" x="724" y="400" text-anchor="end">‏مثال: كَتَبَ (اس نے لکھا)‏</text><line class="thin" x1="480" y1="86" x2="308" y2="86" marker-end="url(#arrow)"/><text class="small" x="390" y="80" text-anchor="middle">‏ہاں‏</text><line class="thin" x1="610" y1="116" x2="610" y2="188" marker-end="url(#arrow)"/><text class="small" x="625" y="156">‏نہیں‏</text><line class="thin" x1="480" y1="220" x2="308" y2="220" marker-end="url(#arrow)"/><text class="small" x="390" y="214" text-anchor="middle">‏ہاں‏</text><line class="thin" x1="610" y1="250" x2="610" y2="308" marker-end="url(#arrow)"/><text class="small" x="625" y="284">‏نہیں‏</text><text class="small" x="756" y="436" text-anchor="end">‏شروع کی علامت مضارع کا فاعل اور آخری لاحقہ ماضی کا فاعل بتاتا ہے۔‏</text><text class="wm" x="24" y="448" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>