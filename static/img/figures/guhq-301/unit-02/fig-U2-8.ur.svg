<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">نفی کے چار حروف کے ذریعے فعل کے معنی میں تبدیلی کا خاکہ</title><desc id="d">خاکہ جو ظاہر کرتا ہے کہ لا، لم، لن اور ما فعل یکتب (وہ لکھتا ہے) کو کس طرح مختلف منفی معانی میں تبدیل کرتے ہیں</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, -apple-system, sans-serif; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="410"/><text class="h" x="756" y="34" text-anchor="end">‏نفی کے چار طریقے‏</text><rect class="panel-a" x="526" y="56" width="230" height="100" rx="8"/><text class="sh" x="744" y="80" text-anchor="end">‏لَا (lā)‏</text><text class="cell" x="744" y="102" text-anchor="end">‏لَا يَكْتُبُ (وہ نہیں لکھتا)‏</text><text class="cell" x="744" y="122" text-anchor="end">‏حال کی نفی‏</text><text class="cell" x="744" y="142" text-anchor="end">‏(فعل مضارع)‏</text><rect class="panel-b" x="24" y="56" width="230" height="100" rx="8"/><text class="sh" x="242" y="80" text-anchor="end">‏لَمْ (lam)‏</text><text class="cell" x="242" y="102" text-anchor="end">‏لَمْ يَكْتُبْ (اس نے نہیں لکھا)‏</text><text class="cell" x="242" y="122" text-anchor="end">‏ماضی کے معنی میں نفی‏</text><text class="cell" x="242" y="142" text-anchor="end">‏(مضارع کو ماضی بناتا ہے)‏</text><rect class="panel" x="300" y="170" width="180" height="70" rx="8"/><text class="ar" x="390" y="200" text-anchor="middle">يَكْتُبُ</text><text class="cell" x="390" y="224" text-anchor="middle">‏yaktubu - وہ لکھتا ہے‏</text><rect class="panel-a" x="526" y="260" width="230" height="100" rx="8"/><text class="sh" x="744" y="284" text-anchor="end">‏لَنْ (lan)‏</text><text class="cell" x="744" y="306" text-anchor="end">‏لَنْ يَكْتُبَ (وہ ہرگز نہیں لکھے گا)‏</text><text class="cell" x="744" y="326" text-anchor="end">‏مستقبل کی تاکیدی نفی‏</text><text class="cell" x="744" y="346" text-anchor="end">‏(مستقبل)‏</text><rect class="panel-b" x="24" y="260" width="230" height="100" rx="8"/><text class="sh" x="242" y="284" text-anchor="end">‏مَا (mā)‏</text><text class="cell" x="242" y="306" text-anchor="end">‏مَا كَتَبَ (اس نے نہیں لکھا)‏</text><text class="cell" x="242" y="326" text-anchor="end">‏ماضی کی سادہ نفی‏</text><text class="cell" x="242" y="346" text-anchor="end">‏(فعل ماضی کے ساتھ)‏</text><line class="thin" x1="526" y1="130" x2="450" y2="170" marker-end="url(#arrow)"/><text class="small" x="488" y="146">‏حال‏</text><line class="thin" x1="254" y1="130" x2="330" y2="170" marker-end="url(#arrow)"/><text class="small" x="262" y="146">‏ماضی‏</text><line class="thin" x1="526" y1="330" x2="450" y2="240" marker-end="url(#arrow)"/><text class="small" x="488" y="316">‏مستقبل‏</text><line class="thin" x1="254" y1="330" x2="330" y2="240" marker-end="url(#arrow)"/><text class="small" x="262" y="316">‏ماضی‏</text><text class="small" x="756" y="390" text-anchor="end">‏نفی کا ہر حرف فعل کے مفہوم کو ایک مختلف زمانے یا شدت میں بدل دیتا ہے۔‏</text><text class="wm" x="24" y="400" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>