<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of how four negation particles change a verb's meaning</title><desc id="d">Diagram showing how la, lam, lan and ma each change the verb yaktubu (he writes) to a different negated meaning</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="410"/><text class="h" x="24" y="34">Four ways to say "not"</text><rect class="panel-a" x="24" y="56" width="230" height="100" rx="8"/><text class="sh" x="36" y="80">لَا lā</text><text class="cell" x="36" y="102">la yaktubu</text><text class="cell" x="36" y="122">he does not write</text><text class="cell" x="36" y="142">(present)</text><rect class="panel-b" x="526" y="56" width="230" height="100" rx="8"/><text class="sh" x="538" y="80">لَمْ lam</text><text class="cell" x="538" y="102">lam yaktub</text><text class="cell" x="538" y="122">he did not write</text><text class="cell" x="538" y="142">(past meaning)</text><rect class="panel" x="300" y="170" width="180" height="70" rx="8"/><text class="ar" x="390" y="200" text-anchor="middle">يَكْتُبُ</text><text class="cell" x="390" y="224" text-anchor="middle">yaktubu - he writes</text><rect class="panel-a" x="24" y="260" width="230" height="100" rx="8"/><text class="sh" x="36" y="284">لَنْ lan</text><text class="cell" x="36" y="306">lan yaktuba</text><text class="cell" x="36" y="326">he will never write</text><text class="cell" x="36" y="346">(future)</text><rect class="panel-b" x="526" y="260" width="230" height="100" rx="8"/><text class="sh" x="538" y="284">مَا mā</text><text class="cell" x="538" y="306">mā kataba</text><text class="cell" x="538" y="326">he did not write</text><text class="cell" x="538" y="346">(past)</text><line class="thin" x1="254" y1="130" x2="330" y2="170" marker-end="url(#arrow)"/><text class="small" x="272" y="146">present</text><line class="thin" x1="526" y1="130" x2="450" y2="170" marker-end="url(#arrow)"/><text class="small" x="478" y="146">past</text><line class="thin" x1="254" y1="330" x2="330" y2="240" marker-end="url(#arrow)"/><text class="small" x="272" y="316">future</text><line class="thin" x1="526" y1="330" x2="450" y2="240" marker-end="url(#arrow)"/><text class="small" x="478" y="316">past</text><text class="small" x="24" y="390">Each negation particle gives the verb a different time or strength of negation.</text><text class="wm" x="768" y="400" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
