<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the three parts of speech</title><desc id="d">Diagram showing the three parts of speech (ism, fi'l, harf) with two identifying signs and two example words under each</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 14px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="24" y="34">The three parts of speech</text><rect class="panel-a" x="230" y="56" width="320" height="170" rx="8"/><text class="ar" x="242" y="86">اسم</text><text class="sh" x="242" y="108">ism - noun</text><text class="small" x="242" y="132">Signs</text><text class="cell" x="242" y="152">takes al- (the)</text><text class="cell" x="242" y="172">takes tanwīn (a final -n sound)</text><text class="small" x="242" y="196">Examples</text><text class="cell" x="242" y="216">kitāb, yawm</text><rect class="panel" x="24" y="250" width="320" height="170" rx="8"/><text class="ar" x="36" y="284">فعل</text><text class="sh" x="36" y="306">fi'l - verb</text><text class="small" x="36" y="330">Signs</text><text class="cell" x="36" y="350">shows tense (past, present, command)</text><text class="cell" x="36" y="370">takes a subject pronoun ending</text><text class="small" x="36" y="394">Examples</text><text class="cell" x="36" y="414">kataba, yaktubu</text><rect class="panel" x="436" y="250" width="320" height="170" rx="8"/><text class="ar" x="448" y="284">حرف</text><text class="sh" x="448" y="306">harf - particle</text><text class="small" x="448" y="330">Signs</text><text class="cell" x="448" y="350">cannot take al- or tanwīn</text><text class="cell" x="448" y="370">needs another word for meaning</text><text class="small" x="448" y="394">Examples</text><text class="cell" x="448" y="414">min, fī, wa</text><line class="thin" x1="300" y1="226" x2="184" y2="250" marker-end="url(#arrow)"/><line class="thin" x1="480" y1="226" x2="596" y2="250" marker-end="url(#arrow)"/><text class="small" x="24" y="446">Each kind of word has signs that identify it. A word that fails the noun and verb signs is a particle.</text><text class="wm" x="768" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
