<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of detached and attached pronouns</title><desc id="d">Table of detached and attached pronouns with a Qur'anic example for each</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 14px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="300"/><text class="h" x="24" y="34">Detached and attached pronouns</text><text class="sh" x="24" y="60">Detached</text><text class="sh" x="170" y="60">Transliteration</text><text class="sh" x="320" y="60">Attached</text><text class="sh" x="430" y="60">Meaning</text><text class="sh" x="580" y="60">Example</text><line class="thin" x1="24" y1="70" x2="756" y2="70"/><text class="ar" x="24" y="92">هُوَ</text><text class="cell" x="170" y="92">huwa</text><text class="cell" x="320" y="92">-hu</text><text class="cell" x="430" y="92">he, it</text><text class="cell" x="580" y="92">2:29</text><text class="ar" x="24" y="116">هُمْ</text><text class="cell" x="170" y="116">hum</text><text class="cell" x="320" y="116">-hum</text><text class="cell" x="430" y="116">they</text><text class="cell" x="580" y="116">2:4</text><text class="ar" x="24" y="140">أَنْتَ</text><text class="cell" x="170" y="140">anta</text><text class="cell" x="320" y="140">-ka</text><text class="cell" x="430" y="140">you (masc. sing.)</text><text class="cell" x="580" y="140">2:32</text><text class="ar" x="24" y="164">أَنْتُمْ</text><text class="cell" x="170" y="164">antum</text><text class="cell" x="320" y="164">-kum</text><text class="cell" x="430" y="164">you (masc. pl.)</text><text class="cell" x="580" y="164">2:22</text><text class="ar" x="24" y="188">أَنَا</text><text class="cell" x="170" y="188">anā</text><text class="cell" x="320" y="188">-ī / -ya</text><text class="cell" x="430" y="188">I</text><text class="cell" x="580" y="188">2:160</text><text class="ar" x="24" y="212">نَحْنُ</text><text class="cell" x="170" y="212">naḥnu</text><text class="cell" x="320" y="212">-nā</text><text class="cell" x="430" y="212">we</text><text class="cell" x="580" y="212">2:11</text><text class="ar" x="24" y="236">هِيَ</text><text class="cell" x="170" y="236">hiya</text><text class="cell" x="320" y="236">-hā</text><text class="cell" x="430" y="236">she</text><text class="cell" x="580" y="236">79:13</text><text class="ar" x="24" y="260">هُنَّ</text><text class="cell" x="170" y="260">hunna</text><text class="cell" x="320" y="260">-hunna</text><text class="cell" x="430" y="260">they (fem.)</text><text class="cell" x="580" y="260">2:187</text><text class="small" x="24" y="286">A detached pronoun stands alone. An attached pronoun joins a noun, verb or particle.</text><text class="wm" x="768" y="296" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
