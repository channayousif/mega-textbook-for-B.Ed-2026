<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of common Qur'anic prepositions and particles</title><desc id="d">Table of common Qur'anic prepositions and particles with meaning and a verse example for each</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 14px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="530"/><text class="h" x="24" y="34">Common prepositions and particles</text><text class="sh" x="24" y="60">Arabic</text><text class="sh" x="170" y="60">Transliteration</text><text class="sh" x="320" y="60">Meaning</text><text class="sh" x="500" y="60">Example</text><line class="thin" x1="24" y1="70" x2="756" y2="70"/><rect class="panel-a" x="24" y="80" width="732" height="22" rx="6"/><text class="sh" x="36" y="96">Prepositions</text><text class="ar" x="36" y="122">بِ</text><text class="cell" x="170" y="122">bi</text><text class="cell" x="320" y="122">with, by</text><text class="cell" x="500" y="122">1:1</text><text class="ar" x="36" y="146">مِنْ</text><text class="cell" x="170" y="146">min</text><text class="cell" x="320" y="146">from</text><text class="cell" x="500" y="146">2:255</text><text class="ar" x="36" y="170">فِي</text><text class="cell" x="170" y="170">fī</text><text class="cell" x="320" y="170">in</text><text class="cell" x="500" y="170">2:30</text><text class="ar" x="36" y="194">إِلَىٰ</text><text class="cell" x="170" y="194">ilā</text><text class="cell" x="320" y="194">to, towards</text><text class="cell" x="500" y="194">2:156</text><text class="ar" x="36" y="218">عَلَىٰ</text><text class="cell" x="170" y="218">ʿalā</text><text class="cell" x="320" y="218">on, upon</text><text class="cell" x="500" y="218">2:255</text><text class="ar" x="36" y="242">لِ</text><text class="cell" x="170" y="242">li</text><text class="cell" x="320" y="242">for, to</text><text class="cell" x="500" y="242">1:2</text><text class="ar" x="36" y="266">عَنْ</text><text class="cell" x="170" y="266">ʿan</text><text class="cell" x="320" y="266">from, about</text><text class="cell" x="500" y="266">79:42</text><rect class="panel-a" x="24" y="276" width="732" height="22" rx="6"/><text class="sh" x="36" y="292">Particles</text><text class="ar" x="36" y="318">وَ</text><text class="cell" x="170" y="318">wa</text><text class="cell" x="320" y="318">and</text><text class="cell" x="500" y="318">2:25</text><text class="ar" x="36" y="342">فَ</text><text class="cell" x="170" y="342">fa</text><text class="cell" x="320" y="342">then, so</text><text class="cell" x="500" y="342">94:5</text><text class="ar" x="36" y="366">إِنَّ</text><text class="cell" x="170" y="366">inna</text><text class="cell" x="320" y="366">indeed, surely</text><text class="cell" x="500" y="366">2:20</text><text class="ar" x="36" y="390">قَدْ</text><text class="cell" x="170" y="390">qad</text><text class="cell" x="320" y="390">certainly, already</text><text class="cell" x="500" y="390">23:1</text><text class="ar" x="36" y="414">لَا</text><text class="cell" x="170" y="414">lā</text><text class="cell" x="320" y="414">not (present)</text><text class="cell" x="500" y="414">109:2</text><text class="ar" x="36" y="438">لَمْ</text><text class="cell" x="170" y="438">lam</text><text class="cell" x="320" y="438">not (past meaning)</text><text class="cell" x="500" y="438">112:3</text><text class="ar" x="36" y="462">لَنْ</text><text class="cell" x="170" y="462">lan</text><text class="cell" x="320" y="462">never (future)</text><text class="cell" x="500" y="462">7:143</text><text class="ar" x="36" y="486">مَا</text><text class="cell" x="170" y="486">mā</text><text class="cell" x="320" y="486">not, what</text><text class="cell" x="500" y="486">2:255</text><text class="small" x="24" y="514">A preposition comes before a noun. A particle connects or modifies another word.</text><text class="wm" x="768" y="524" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
