.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="310"/><text class="h" x="24" y="34">One noun in singular, dual and plural</text><text class="sh" x="24" y="64">Number</text><text class="sh" x="120" y="64">Masculine</text><text class="sh" x="436" y="64">Feminine</text><line class="thin" x1="24" y1="74" x2="756" y2="74"/><text class="sh" x="24" y="112">singular</text><text class="ar" x="120" y="112">عَبْد</text><text class="cell" x="120" y="136">ʿabd</text><text class="cell" x="120" y="156">one servant</text><text class="ar" x="436" y="112">أَمَة</text><text class="cell" x="436" y="136">amah</text><text class="cell" x="436" y="156">one female servant</text><text class="sh" x="24" y="182">dual</text><text class="ar" x="120" y="182">عَبْدَانِ</text><text class="cell" x="120" y="206">ʿabdāni</text><text class="cell" x="120" y="226">two servants</text><text class="ar" x="436" y="182">أَمَتَانِ</text><text class="cell" x="436" y="206">amatāni</text><text class="cell" x="436" y="226">two female servants</text><text class="sh" x="24" y="252">plural</text><text class="ar" x="120" y="252">عِبَاد</text><text class="cell" x="120" y="276">ʿibād</text><text class="cell" x="120" y="296">servants</text><text class="ar" x="436" y="252">إِمَاء</text><text class="cell" x="436" y="276">imāʾ</text><text class="cell" x="436" y="296">female servants</text><text class="wm" x="768" y="306" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
