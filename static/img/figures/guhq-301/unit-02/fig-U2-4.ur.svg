.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, -apple-system, sans-serif; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><rect class="bg" x="0" y="0" width="780" height="300"/><text class="h" x="756" y="34" text-anchor="end">‏ضمائر منفصلہ اور متصلہ‏</text><text class="sh" x="756" y="60" text-anchor="end">‏ضمیر منفصل‏</text><text class="sh" x="620" y="60" text-anchor="end">‏نقل حرفی‏</text><text class="sh" x="490" y="60" text-anchor="end">‏ضمیر متصل‏</text><text class="sh" x="380" y="60" text-anchor="end">‏معنی‏</text><text class="sh" x="140" y="60" text-anchor="end">‏قرآنی مثال‏</text><line class="thin" x1="24" y1="70" x2="756" y2="70"/><text class="ar" x="756" y="92" text-anchor="end">هُوَ</text><text class="cell" x="620" y="92" text-anchor="end">huwa</text><text class="cell" x="490" y="92" text-anchor="end">-hu / ـهُ</text><text class="cell" x="380" y="92" text-anchor="end">‏وہ، اس کا (مذکر)‏</text><text class="cell" x="140" y="92" text-anchor="end">2:29</text><text class="ar" x="756" y="116" text-anchor="end">هُمْ</text><text class="cell" x="620" y="116" text-anchor="end">hum</text><text class="cell" x="490" y="116" text-anchor="end">-hum / ـهُمْ</text><text class="cell" x="380" y="116" text-anchor="end">‏وہ سب، ان کا (مذکر)‏</text><text class="cell" x="140" y="116" text-anchor="end">2:4</text><text class="ar" x="756" y="140" text-anchor="end">أَنْتَ</text><text class="cell" x="620" y="140" text-anchor="end">anta</text><text class="cell" x="490" y="140" text-anchor="end">-ka / ـكَ</text><text class="cell" x="380" y="140" text-anchor="end">‏تو، تیرا (مذکر واحد)‏</text><text class="cell" x="140" y="140" text-anchor="end">2:32</text><text class="ar" x="756" y="164" text-anchor="end">أَنْتُمْ</text><text class="cell" x="620" y="164" text-anchor="end">antum</text><text class="cell" x="490" y="164" text-anchor="end">-kum / ـكُمْ</text><text class="cell" x="380" y="164" text-anchor="end">‏تم سب، تمہارا (مذکر جمع)‏</text><text class="cell" x="140" y="164" text-anchor="end">2:22</text><text class="ar" x="756" y="188" text-anchor="end">أَنَا</text><text class="cell" x="620" y="188" text-anchor="end">anā</text><text class="cell" x="490" y="188" text-anchor="end">-ī / -ya / ـِي</text><text class="cell" x="380" y="188" text-anchor="end">‏میں، میرا‏</text><text class="cell" x="140" y="188" text-anchor="end">2:160</text><text class="ar" x="756" y="212" text-anchor="end">نَحْنُ</text><text class="cell" x="620" y="212" text-anchor="end">naḥnu</text><text class="cell" x="490" y="212" text-anchor="end">-nā / ـنَا</text><text class="cell" x="380" y="212" text-anchor="end">‏ہم، ہمارا‏</text><text class="cell" x="140" y="212" text-anchor="end">2:11</text><text class="ar" x="756" y="236" text-anchor="end">هِيَ</text><text class="cell" x="620" y="236" text-anchor="end">hiya</text><text class="cell" x="490" y="236" text-anchor="end">-hā / ـهَا</text><text class="cell" x="380" y="236" text-anchor="end">‏وہ، اس کی (مؤنث)‏</text><text class="cell" x="140" y="236" text-anchor="end">79:13</text><text class="ar" x="756" y="260" text-anchor="end">هُنَّ</text><text class="cell" x="620" y="260" text-anchor="end">hunna</text><text class="cell" x="490" y="260" text-anchor="end">-hunna / ـهُنَّ</text><text class="cell" x="380" y="260" text-anchor="end">‏وہ سب، ان کا (مؤنث)‏</text><text class="cell" x="140" y="260" text-anchor="end">2:187</text><text class="small" x="756" y="278" text-anchor="end">‏ضمیر منفصل الگ لفظ ہوتا ہے۔ ضمیر متصل اسم، فعل یا حرف کے آخر میں جڑتی ہے۔‏</text><text class="wm" x="24" y="288" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>