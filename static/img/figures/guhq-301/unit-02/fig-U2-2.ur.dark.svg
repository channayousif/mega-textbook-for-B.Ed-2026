<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">اقسامِ کلمہ کا خاکہ</title><desc id="d">خاکہ جو کلمہ کی تین اقسام (اسم، فعل، حرف) کو ان کی دو شناختی علامات اور دو مثالوں کے ساتھ ظاہر کرتا ہے</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, -apple-system, sans-serif; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="756" y="34" text-anchor="end">‏اقسامِ کلمہ (اسم، فعل، حرف)‏</text><rect class="panel-a" x="230" y="56" width="320" height="170" rx="8"/><text class="ar" x="538" y="86" text-anchor="end">اسم</text><text class="sh" x="538" y="108" text-anchor="end">‏اسم - نام یا صفت‏</text><text class="small" x="538" y="132" text-anchor="end">‏علامات‏</text><text class="cell" x="538" y="152" text-anchor="end">‏الـ (الف لام) قبول کرتا ہے‏</text><text class="cell" x="538" y="172" text-anchor="end">‏تنوین (آخری نون کی آواز) قبول کرتا ہے‏</text><text class="small" x="538" y="196" text-anchor="end">‏مثالیں‏</text><text class="cell" x="538" y="216" text-anchor="end">‏كِتَاب، يَوْم‏</text><rect class="panel" x="436" y="250" width="320" height="170" rx="8"/><text class="ar" x="744" y="284" text-anchor="end">فعل</text><text class="sh" x="744" y="306" text-anchor="end">‏فعل - کام یا عمل‏</text><text class="small" x="744" y="330" text-anchor="end">‏علامات‏</text><text class="cell" x="744" y="350" text-anchor="end">‏زمانہ ظاہر کرتا ہے (ماضی، مضارع، امر)‏</text><text class="cell" x="744" y="370" text-anchor="end">‏فاعلی ضمیر کا لاحقہ قبول کرتا ہے‏</text><text class="small" x="744" y="394" text-anchor="end">‏مثالیں‏</text><text class="cell" x="744" y="414" text-anchor="end">‏كَتَبَ، يَكْتُبُ‏</text><rect class="panel" x="24" y="250" width="320" height="170" rx="8"/><text class="ar" x="332" y="284" text-anchor="end">حرف</text><text class="sh" x="332" y="306" text-anchor="end">‏حرف - رابطہ یا ربط‏</text><text class="small" x="332" y="330" text-anchor="end">‏علامات‏</text><text class="cell" x="332" y="350" text-anchor="end">‏الـ یا تنوین قبول نہیں کرتا‏</text><text class="cell" x="332" y="370" text-anchor="end">‏معنی کے لیے دوسرے لفظ کا محتاج ہوتا ہے‏</text><text class="small" x="332" y="394" text-anchor="end">‏مثالیں‏</text><text class="cell" x="332" y="414" text-anchor="end">‏مِنْ، فِي، وَ‏</text><line class="thin" x1="480" y1="226" x2="596" y2="250" marker-end="url(#arrow)"/><line class="thin" x1="300" y1="226" x2="184" y2="250" marker-end="url(#arrow)"/><text class="small" x="756" y="438" text-anchor="end">‏ہر قسم کے کلمے کی اپنی علامات ہیں۔ جو لفظ اسم اور فعل کی علامات پر پورا نہ اترے وہ حرف ہے۔‏</text><text class="wm" x="24" y="448" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>