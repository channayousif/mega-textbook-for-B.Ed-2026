</style><rect class="bg" x="0" y="0" width="780" height="710"/><text class="h" x="24" y="34">Twenty high-frequency Qur'anic words</text><text class="sh" x="36" y="60">Arabic</text><text class="sh" x="190" y="60">Transliteration</text><text class="sh" x="346" y="60">Meaning</text><text class="sh" x="592" y="60">Verse</text><line class="thin" x1="24" y1="70" x2="756" y2="70"/><rect class="panel-a" x="24" y="80" width="732" height="22" rx="6"/><text class="sh" x="36" y="96">Nouns</text><text class="ar" x="36" y="122">اللَّه</text><text class="cell" x="190" y="122">Allāh</text><text class="cell" x="346" y="122">Allah</text><text class="cell" x="592" y="122">1:2</text><text class="ar" x="36" y="146">رَبَّ</text><text class="cell" x="190" y="146">rabb</text><text class="cell" x="346" y="146">Lord</text><text class="cell" x="592" y="146">1:2</text><text class="ar" x="36" y="170">كِتَاب</text><text class="cell" x="190" y="170">kitāb</text><text class="cell" x="346" y="170">book, scripture</text><text class="cell" x="592" y="170">2:2</text><text class="ar" x="36" y="194">يَوْم</text><text class="cell" x="190" y="194">yawm</text><text class="cell" x="346" y="194">day</text><text class="cell" x="592" y="194">1:4</text><text class="ar" x="36" y="218">أَرْض</text><text class="cell" x="190" y="218">arḍ</text><text class="cell" x="346" y="218">earth, land</text><text class="cell" x="592" y="218">2:30</text><rect class="panel-a" x="24" y="228" width="732" height="22" rx="6"/><text class="sh" x="36" y="244">Verbs</text><text class="ar" x="36" y="270">كَانَ</text><text class="cell" x="190" y="270">kāna</text><text class="cell" x="346" y="270">he was, to be</text><text class="cell" x="592" y="270">3:67</text><text class="ar" x="36" y="294">قَالَ</text><text class="cell" x="190" y="294">qāla</text><text class="cell" x="346" y="294">he said</text><text class="cell" x="592" y="294">2:30</text><text class="ar" x="36" y="318">آمَنَ</text><text class="cell" x="190" y="318">āmana</text><text class="cell" x="346" y="318">he believed</text><text class="cell" x="592" y="318">2:285</text><text class="ar" x="36" y="342">عَلِمَ</text><text class="cell" x="190" y="342">ʿalima</text><text class="cell" x="346" y="342">he knew</text><text class="cell" x="592" y="342">2:65</text><text class="ar" x="36" y="366">جَاءَ</text><text class="cell" x="190" y="366">jāʾa</text><text class="cell" x="346" y="366">he came</text><text class="cell" x="592" y="366">2:87</text><rect class="panel-a" x="24" y="376" width="732" height="22" rx="6"/><text class="sh" x="36" y="392">Pronouns and relatives</text><text class="ar" x="36" y="418">هُوَ</text><text class="cell" x="190" y="418">huwa</text><text class="cell" x="346" y="418">he, it</text><text class="cell" x="592" y="418">2:29</text><text class="ar" x="36" y="442">هُمْ</text><text class="cell" x="190" y="442">hum</text><text class="cell" x="346" y="442">they</text><text class="cell" x="592" y="442">3:195</text><text class="ar" x="36" y="466">الَّذِينَ</text><text class="cell" x="190" y="466">alladhīna</text><text class="cell" x="346" y="466">those who</text><text class="cell" x="592" y="466">2:25</text><text class="ar" x="36" y="490">مَا</text><text class="cell" x="190" y="490">mā</text><text class="cell" x="346" y="490">what</text><text class="cell" x="592" y="490">2:255</text><text class="ar" x="36" y="514">مَنْ</text><text class="cell" x="190" y="514">man</text><text class="cell" x="346" y="514">who</text><text class="cell" x="592" y="514">2:255</text><rect class="panel-a" x="24" y="524" width="732" height="22" rx="6"/><text class="sh" x="36" y="540">Particles</text><text class="ar" x="36" y="566">وَ</text><text class="cell" x="190" y="566">wa</text><text class="cell" x="346" y="566">and</text><text class="cell" x="592" y="566">2:25</text><text class="ar" x="36" y="590">مِنْ</text><text class="cell" x="190" y="590">min</text><text class="cell" x="346" y="590">from</text><text class="cell" x="592" y="590">2:255</text><text class="ar" x="36" y="614">فِي</text><text class="cell" x="190" y="614">fī</text><text class="cell" x="346" y="614">in</text><text class="cell" x="592" y="614">2:30</text><text class="ar" x="36" y="638">لَا</text><text class="cell" x="190" y="638">lā</text><text class="cell" x="346" y="638">not</text><text class="cell" x="592" y="638">109:2</text><text class="ar" x="36" y="662">إِنَّ</text><text class="cell" x="190" y="662">inna</text><text class="cell" x="346" y="662">indeed, surely</text><text class="cell" x="592" y="662">2:20</text><text class="small" x="24" y="688">Each word is shown with its meaning and one verse where it appears.</text><text class="wm" x="768" y="702" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
