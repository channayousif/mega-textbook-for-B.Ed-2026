<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of the verb kataba conjugated in past, present and imperative</title><desc id="d">Table showing the verb kataba (he wrote) conjugated in past, present and imperative for six different subjects</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 14px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="260"/><text class="h" x="24" y="34">One root, three tenses</text><text class="sh" x="24" y="60">Subject</text><text class="sh" x="170" y="60">Past (māḍī)</text><text class="sh" x="360" y="60">Present (muḍāriʿ)</text><text class="sh" x="560" y="60">Imperative (amr)</text><line class="thin" x1="24" y1="70" x2="756" y2="70"/><text class="cell" x="24" y="92">he</text><text class="ar" x="170" y="92">كَتَبَ</text><text class="cell" x="360" y="92">yaktubu</text><text class="cell" x="560" y="92">-</text><text class="cell" x="24" y="116">she</text><text class="ar" x="170" y="116">كَتَبَتْ</text><text class="cell" x="360" y="116">taktubu</text><text class="cell" x="560" y="116">-</text><text class="cell" x="24" y="140">they (masc.)</text><text class="ar" x="170" y="140">كَتَبُوا۟</text><text class="cell" x="360" y="140">yaktubūna</text><text class="cell" x="560" y="140">-</text><text class="cell" x="24" y="164">they (fem.)</text><text class="ar" x="170" y="164">كَتَبْنَ</text><text class="cell" x="360" y="164">yaktubna</text><text class="cell" x="560" y="164">-</text><text class="cell" x="24" y="188">you (masc. sing.)</text><text class="ar" x="170" y="188">كَتَبْتَ</text><text class="cell" x="360" y="188">taktubu</text><text class="ar" x="560" y="188">اُكْتُبْ</text><text class="cell" x="24" y="212">you (masc. pl.)</text><text class="ar" x="170" y="212">كَتَبْتُمْ</text><text class="cell" x="360" y="212">taktubūna</text><text class="ar" x="560" y="212">اُكْتُبُوا۟</text><text class="small" x="24" y="240">The root is k-t-b (writing). The past uses endings, the present uses prefixes.</text><text class="wm" x="768" y="252" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
