.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, -apple-system, sans-serif; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><rect class="bg" x="0" y="0" width="780" height="530"/><text class="h" x="756" y="34" text-anchor="end">‏عام حروفِ جر اور دیگر حروف‏</text><text class="sh" x="744" y="60" text-anchor="end">‏عربی لفظ‏</text><text class="sh" x="600" y="60" text-anchor="end">‏نقل حرفی‏</text><text class="sh" x="440" y="60" text-anchor="end">‏معنی‏</text><text class="sh" x="140" y="60" text-anchor="end">‏قرآنی مثال‏</text><line class="thin" x1="24" y1="70" x2="756" y2="70"/><rect class="panel-a" x="24" y="80" width="732" height="22" rx="6"/><text class="sh" x="744" y="96" text-anchor="end">‏حروفِ جر‏</text><text class="ar" x="744" y="122" text-anchor="end">بِ</text><text class="cell" x="600" y="122" text-anchor="end">bi</text><text class="cell" x="440" y="122" text-anchor="end">‏سے، ساتھ‏</text><text class="cell" x="140" y="122" text-anchor="end">1:1</text><text class="ar" x="744" y="146" text-anchor="end">مِنْ</text><text class="cell" x="600" y="146" text-anchor="end">min</text><text class="cell" x="440" y="146" text-anchor="end">‏سے‏</text><text class="cell" x="140" y="146" text-anchor="end">2:255</text><text class="ar" x="744" y="170" text-anchor="end">فِي</text><text class="cell" x="600" y="170" text-anchor="end">fī</text><text class="cell" x="440" y="170" text-anchor="end">‏میں‏</text><text class="cell" x="140" y="170" text-anchor="end">2:30</text><text class="ar" x="744" y="194" text-anchor="end">إِلَىٰ</text><text class="cell" x="600" y="194" text-anchor="end">ilā</text><text class="cell" x="440" y="194" text-anchor="end">‏طرف، تک‏</text><text class="cell" x="140" y="194" text-anchor="end">2:156</text><text class="ar" x="744" y="218" text-anchor="end">عَلَىٰ</text><text class="cell" x="600" y="218" text-anchor="end">ʿalā</text><text class="cell" x="440" y="218" text-anchor="end">‏پر، اوپر‏</text><text class="cell" x="140" y="218" text-anchor="end">2:255</text><text class="ar" x="744" y="242" text-anchor="end">لِ</text><text class="cell" x="600" y="242" text-anchor="end">l