<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ماضی، مضارع اور امر میں فعل کَتَبَ کی گردان کا جدول</title><desc id="d">چھ مختلف فاعلوں کے لیے ماضی، مضارع اور امر میں فعل کَتَبَ (اس نے لکھا) کی گردان ظاہر کرنے والا جدول</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.ar { font-size: 18px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; font-family: system-ui, -apple-system, sans-serif; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><rect class="bg" x="0" y="0" width="780" height="260"/><text class="h" x="756" y="34" text-anchor="end">‏ایک مادّہ، تین زمانے‏</text><text class="sh" x="756" y="60" text-anchor="end">‏فاعل (ضمیر)‏</text><text class="sh" x="590" y="60" text-anchor="end">‏ماضی (māḍī)‏</text><text class="sh" x="390" y="60" text-anchor="end">‏مضارع (muḍāriʿ)‏</text><text class="sh" x="190" y="60" text-anchor="end">‏امر (amr)‏</text><line class="thin" x1="24" y1="70" x2="756" y2="70"/><text class="cell" x="756" y="92" text-anchor="end">‏وہ (مذکر واحد)‏</text><text class="ar" x="590" y="92" text-anchor="end">كَتَبَ</text><text class="ar" x="390" y="92" text-anchor="end">يَكْتُبُ</text><text class="cell" x="190" y="92" text-anchor="end">-</text><text class="cell" x="756" y="116" text-anchor="end">‏وہ (مؤنث واحد)‏</text><text class="ar" x="590" y="116" text-anchor="end">كَتَبَتْ</text><text class="ar" x="390" y="116" text-anchor="end">تَكْتُبُ</text><text class="cell" x="190" y="116" text-anchor="end">-</text><text class="cell" x="756" y="140" text-anchor="end">‏وہ سب (مذکر جمع)‏</text><text class="ar" x="590" y="140" text-anchor="end">كَتَبُوا۟</text><text class="ar" x="390" y="140" text-anchor="end">يَكْتُبُونَ</text><text class="cell" x="190" y="140" text-anchor="end">-</text><text class="cell" x="756" y="164" text-anchor="end">‏وہ سب (مؤنث جمع)‏</text><text class="ar" x="590" y="164" text-anchor="end">كَتَبْنَ</text><text class="ar" x="390" y="164" text-anchor="end">يَكْتُبْنَ</text><text class="cell" x="190" y="164" text-anchor="end">-</text><text class="cell" x="756" y="188" text-anchor="end">‏تو (مذکر واحد)‏</text><text class="ar" x="590" y="188" text-anchor="end">كَتَبْتَ</text><text class="ar" x="390" y="188" text-anchor="end">تَكْتُبُ</text><text class="ar" x="190" y="188" text-anchor="end">اُكْتُبْ</text><text class="cell" x="756" y="212" text-anchor="end">‏تم سب (مذکر جمع)‏</text><text class="ar" x="590" y="212" text-anchor="end">كَتَبْتُمْ</text><text class="ar" x="390" y="212" text-anchor="end">تَكْتُبُونَ</text><text class="ar" x="190" y="212" text-anchor="end">اُكْتُبُوا۟</text><text class="small" x="756" y="240" text-anchor="end">‏مادّہ ک ت ب (لکھنا) ہے۔ ماضی کے آخر میں لاحقے اور مضارع کے شروع میں علاماتِ مضارع آتی ہیں۔‏</text><text class="wm" x="24" y="252" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>