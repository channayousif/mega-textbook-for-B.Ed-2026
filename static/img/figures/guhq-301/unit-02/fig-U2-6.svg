<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart for identifying a Qur'anic verb's tense</title><desc id="d">Flowchart for identifying a Qur'anic verb's tense: check for a prefix letter (present), then for a command form (imperative), otherwise it is past tense</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="24" y="34">How to tell a verb's tense</text><rect class="panel" x="270" y="56" width="240" height="60" rx="8"/><text class="cell" x="390" y="78" text-anchor="middle">Does the word have a</text><text class="cell" x="390" y="96" text-anchor="middle">prefix letter</text><text class="cell" x="390" y="114" text-anchor="middle">(ya-, ta-, a-, na-)?</text><rect class="panel-a" x="540" y="56" width="220" height="120" rx="8"/><text class="sh" x="552" y="82">Present (muḍāriʿ)</text><text class="cell" x="552" y="104">check the prefix</text><text class="cell" x="552" y="124">for the subject</text><text class="cell" x="552" y="148">Example: yaktubu</text><text class="cell" x="552" y="168">(he writes)</text><rect class="panel" x="270" y="190" width="240" height="60" rx="8"/><text class="cell" x="390" y="212" text-anchor="middle">Is it a direct command</text><text class="cell" x="390" y="230" text-anchor="middle">to you?</text><rect class="panel-b" x="540" y="190" width="220" height="100" rx="8"/><text class="sh" x="552" y="216">Imperative (amr)</text><text class="cell" x="552" y="238">a command to you</text><text class="cell" x="552" y="260">Example: iqraʾ</text><text class="cell" x="552" y="280">(read!, 96:1)</text><rect class="panel" x="270" y="310" width="240" height="114" rx="8"/><text class="sh" x="282" y="336">Past (māḍī)</text><text class="cell" x="282" y="358">check the ending</text><text class="cell" x="282" y="378">for the subject</text><text class="cell" x="282" y="400">Example: kataba</text><text class="cell" x="282" y="420">(he wrote)</text><line class="thin" x1="510" y1="86" x2="538" y2="86" marker-end="url(#arrow)"/><text class="small" x="520" y="80">yes</text><line class="thin" x1="390" y1="116" x2="390" y2="188" marker-end="url(#arrow)"/><text class="small" x="398" y="156">no</text><line class="thin" x1="510" y1="220" x2="538" y2="220" marker-end="url(#arrow)"/><text class="small" x="520" y="214">yes</text><line class="thin" x1="390" y1="250" x2="390" y2="308" marker-end="url(#arrow)"/><text class="small" x="398" y="284">no</text><text class="small" x="24" y="444">The prefix tells you the subject of a present verb; the ending tells you the subject of a past verb.</text><text class="wm" x="768" y="454" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
