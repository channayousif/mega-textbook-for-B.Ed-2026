<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Sources of tafsir in order</title><desc id="d">Diagram showing the sources of tafsir in order: the Qur'an itself, then the Sunnah, then the Companions, then language and context, joined by downward arrows.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="400"/><text class="h" x="24" y="34">Sources of tafsir in order</text><rect class="panel-a" x="40" y="52" width="700" height="64" rx="8"/><text class="h" x="56" y="80">1. The Qur'an itself</text><text class="body" x="56" y="102">the text explains the text</text><line class="thin" x1="390" y1="116" x2="390" y2="130" marker-end="url(#arrow)"/><rect class="panel" x="40" y="130" width="700" height="64" rx="8"/><text class="h" x="56" y="158">2. The Sunnah</text><text class="body" x="56" y="180">the Prophet's practice explains the text</text><line class="thin" x1="390" y1="194" x2="390" y2="208" marker-end="url(#arrow)"/><rect class="panel" x="40" y="208" width="700" height="64" rx="8"/><text class="h" x="56" y="236">3. The Companions</text><text class="body" x="56" y="258">their usage and reports</text><line class="thin" x1="390" y1="272" x2="390" y2="286" marker-end="url(#arrow)"/><rect class="panel" x="40" y="286" width="700" height="64" rx="8"/><text class="h" x="56" y="314">4. Language and context</text><text class="body" x="56" y="336">grammar, siyaq and occasions of revelation</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
