<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 388" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">تفسیر کے تین اصول، ہر ایک کی ایک مثال کے ساتھ</title><desc id="d">تفسیر کے تین اصولوں کا جدول، ہر ایک کی ایک مثال کے ساتھ: قرآن کی تفسیر قرآن سے، فیصلہ کن بات موقع کے بجائے عام الفاظ ہیں، اور سنت اور عربی زبان حدیں مقرر کرتی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="388"/><text class="h" x="756" y="38" text-anchor="end">‏تفسیر کے تین اصول‏</text><rect class="panel" x="556" y="56" width="200" height="40"/><rect class="bg" x="336" y="56" width="220" height="40"/><rect class="panel-a" x="24" y="56" width="312" height="40"/><text class="sh" x="744" y="83" text-anchor="end">‏اصول‏</text><text class="sh" x="544" y="83" text-anchor="end">‏مطلب‏</text><text class="sh" x="324" y="83" text-anchor="end">‏مثال‏</text><rect class="panel" x="556" y="96" width="200" height="84"/><rect class="bg" x="336" y="96" width="220" height="84"/><rect class="thin" x="336" y="96" width="220" height="84"/><rect class="panel-a" x="24" y="96" width="312" height="84"/><text class="body" x="744" y="132" text-anchor="end">‏قرآن کی تفسیر‏</text><text class="body" x="744" y="160" text-anchor="end">‏قرآن سے‏</text><text class="cell" x="544" y="132" text-anchor="end">‏ایک آیت کا مطلب‏</text><text class="cell" x="544" y="160" text-anchor="end">‏دوسری آیت سے واضح ہوتا ہے‏</text><text class="cell" x="324" y="132" text-anchor="end">‏103:1-3 کو ایک ساتھ پڑھیں تو‏</text><text class="cell" x="324" y="160" text-anchor="end">‏"خسارے" کا مطلب واضح ہوتا ہے‏</text><rect class="panel" x="556" y="180" width="200" height="84"/><rect class="bg" x="336" y="180" width="220" height="84"/><rect class="thin" x="336" y="180" width="220" height="84"/><rect class="panel-a" x="24" y="180" width="312" height="84"/><text class="body" x="744" y="216" text-anchor="end">‏فیصلہ عام الفاظ کرتے ہیں،‏</text><text class="body" x="744" y="244" text-anchor="end">‏موقع نہیں‏</text><text class="cell" x="544" y="216" text-anchor="end">‏عام الفاظ اپنے پہلے موقع‏</text><text class="cell" x="544" y="244" text-anchor="end">‏سے آگے پہنچتے ہیں‏</text><text class="cell" x="324" y="216" text-anchor="end">‏22:4 نضر کے بارے میں نازل ہوئی‏</text><text class="cell" x="324" y="244" text-anchor="end">‏مگر سب کو تنبیہ کرتی ہے‏</text><rect class="panel" x="556" y="264" width="200" height="84"/><rect class="bg" x="336" y="264" width="220" height="84"/><rect class="thin" x="336" y="264" width="220" height="84"/><rect class="panel-a" x="24" y="264" width="312" height="84"/><text class="body" x="744" y="300" text-anchor="end">‏سنت اور زبان‏</text><text class="body" x="744" y="328" text-anchor="end">‏حدیں مقرر کرتی ہیں‏</text><text class="cell" x="544" y="300" text-anchor="end">‏عمل اور قواعد طے کرتے ہیں‏</text><text class="cell" x="544" y="328" text-anchor="end">‏کہ جملہ کس کی گنجائش رکھتا ہے‏</text><text class="cell" x="324" y="300" text-anchor="end">‏92:17-18 اپنے قواعد کی بنا پر‏</text><text class="cell" x="324" y="328" text-anchor="end">‏خاص سمجھی جاتی ہے‏</text><text class="wm" x="12" y="376" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>