<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six short surahs: message and a practical lesson</title><desc id="d">Table of six short surahs with each surah's main message and a practical lesson for students: al-Duha (93), al-Kawthar (108), al-Kafirun (109), al-Nasr (110), al-Ikhlas (112) and al-Falaq (113).</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="24" y="34">Six short surahs: message and lesson</text><rect class="panel" x="24" y="52" width="150" height="36"/><rect class="bg" x="174" y="52" width="270" height="36"/><rect class="panel-a" x="444" y="52" width="312" height="36"/><text class="sh" x="36" y="76">Surah</text><text class="sh" x="186" y="76">Main message</text><text class="sh" x="456" y="76">A practical lesson for students</text><rect class="panel" x="24" y="88" width="150" height="56"/><rect class="bg" x="174" y="88" width="270" height="56"/><rect class="thin" x="174" y="88" width="270" height="56"/><rect class="panel-a" x="444" y="88" width="312" height="56"/><text class="body" x="36" y="121">al-Duha (93)</text><text class="cell" x="186" y="121">God's care and a better Hereafter</text><text class="cell" x="456" y="112">Be grateful; care for</text><text class="cell" x="456" y="134">orphans and the poor</text><rect class="panel" x="24" y="144" width="150" height="56"/><rect class="bg" x="174" y="144" width="270" height="56"/><rect class="thin" x="174" y="144" width="270" height="56"/><rect class="panel-a" x="444" y="144" width="312" height="56"/><text class="body" x="36" y="177">al-Kawthar (108)</text><text class="cell" x="186" y="177">Thankfulness for God's gift</text><text class="cell" x="456" y="168">Pray and give</text><text class="cell" x="456" y="190">in gratitude</text><rect class="panel" x="24" y="200" width="150" height="56"/><rect class="bg" x="174" y="200" width="270" height="56"/><rect class="thin" x="174" y="200" width="270" height="56"/><rect class="panel-a" x="444" y="200" width="312" height="56"/><text class="body" x="36" y="233">al-Kafirun (109)</text><text class="cell" x="186" y="233">A clear boundary of faith</text><text class="cell" x="456" y="224">Respect others;</text><text class="cell" x="456" y="246">hold to your faith</text><rect class="panel" x="24" y="256" width="150" height="56"/><rect class="bg" x="174" y="256" width="270" height="56"/><rect class="thin" x="174" y="256" width="270" height="56"/><rect class="panel-a" x="444" y="256" width="312" height="56"/><text class="body" x="36" y="289">al-Nasr (110)</text><text class="cell" x="186" y="289">Victory comes from God</text><text class="cell" x="456" y="280">Thank God and seek forgiveness,</text><text class="cell" x="456" y="302">not pride</text><rect class="panel" x="24" y="312" width="150" height="56"/><rect class="bg" x="174" y="312" width="270" height="56"/><rect class="thin" x="174" y="312" width="270" height="56"/><rect class="panel-a" x="444" y="312" width="312" height="56"/><text class="body" x="36" y="345">al-Ikhlas (112)</text><text class="cell" x="186" y="345">God is One</text><text class="cell" x="456" y="336">Keep worship</text><text class="cell" x="456" y="358">sincere and equal</text><rect class="panel" x="24" y="368" width="150" height="56"/><rect class="bg" x="174" y="368" width="270" height="56"/><rect class="thin" x="174" y="368" width="270" height="56"/><rect class="panel-a" x="444" y="368" width="312" height="56"/><text class="body" x="36" y="401">al-Falaq (113)</text><text class="cell" x="186" y="401">Refuge in God from evil</text><text class="cell" x="456" y="392">Turn to God</text><text class="cell" x="456" y="414">for protection</text><text class="wm" x="768" y="450" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
