<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three principles of interpretation with an example each</title><desc id="d">Table of three principles of interpretation with an example of each: interpreting the Qur'an by the Qur'an, the decisive point is the general wording rather than the occasion, and the Sunnah and the Arabic language set the bounds.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="320"/><text class="h" x="24" y="34">Three principles of interpretation</text><rect class="panel" x="24" y="52" width="200" height="36"/><rect class="bg" x="224" y="52" width="220" height="36"/><rect class="panel-a" x="444" y="52" width="312" height="36"/><text class="sh" x="36" y="76">Principle</text><text class="sh" x="236" y="76">What it means</text><text class="sh" x="456" y="76">Example</text><rect class="panel" x="24" y="88" width="200" height="64"/><rect class="bg" x="224" y="88" width="220" height="64"/><rect class="thin" x="224" y="88" width="220" height="64"/><rect class="panel-a" x="444" y="88" width="312" height="64"/><text class="body" x="36" y="112">Interpret the Qur'an</text><text class="body" x="36" y="134">by the Qur'an</text><text class="cell" x="236" y="112">A verse's meaning is</text><text class="cell" x="236" y="134">clarified by another verse</text><text class="cell" x="456" y="112">103:1-3 read together</text><text class="cell" x="456" y="134">explain 'loss'</text><rect class="panel" x="24" y="152" width="200" height="64"/><rect class="bg" x="224" y="152" width="220" height="64"/><rect class="thin" x="224" y="152" width="220" height="64"/><rect class="panel-a" x="444" y="152" width="312" height="64"/><text class="body" x="36" y="176">The general wording</text><text class="body" x="36" y="198">decides, not the occasion</text><text class="cell" x="236" y="176">A general wording reaches</text><text class="cell" x="236" y="198">beyond its first occasion</text><text class="cell" x="456" y="176">22:4 was revealed about</text><text class="cell" x="456" y="198">al-Nadar but warns all</text><rect class="panel" x="24" y="216" width="200" height="64"/><rect class="bg" x="224" y="216" width="220" height="64"/><rect class="thin" x="224" y="216" width="220" height="64"/><rect class="panel-a" x="444" y="216" width="312" height="64"/><text class="body" x="36" y="240">The Sunnah and the</text><text class="body" x="36" y="262">language set the bounds</text><text class="cell" x="236" y="240">Practice and grammar decide</text><text class="cell" x="236" y="262">what a sentence allows</text><text class="cell" x="456" y="240">92:17-18 is read as specific</text><text class="cell" x="456" y="262">on its grammar</text><text class="wm" x="768" y="310" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
