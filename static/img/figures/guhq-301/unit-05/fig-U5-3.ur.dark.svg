<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 526" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">آیت سے درس تک کے پانچ مراحل</title><desc id="d">بہاؤ چارٹ جس میں آیت سے درس تک پانچ مراحل ہیں: پڑھیں، ترجمہ کریں، سیاق دیکھیں، تفسیر سے رجوع کریں، پھر درس اخذ کریں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="526"/><text class="h" x="756" y="38" text-anchor="end">‏آیت سے درس تک‏</text><rect class="panel" x="40" y="60" width="700" height="74" rx="8"/><text class="h" x="724" y="90" text-anchor="end">‏1۔ پڑھیں‏</text><text class="body" x="724" y="118" text-anchor="end">‏آیت یا سورت بلند آواز سے پڑھیں‏</text><line class="thin" x1="390" y1="134" x2="390" y2="148" marker-end="url(#arrow)"/><rect class="panel" x="40" y="148" width="700" height="74" rx="8"/><text class="h" x="724" y="178" text-anchor="end">‏2۔ ترجمہ کریں‏</text><text class="body" x="724" y="206" text-anchor="end">‏ہر لفظ کا معنی بتائیں‏</text><line class="thin" x1="390" y1="222" x2="390" y2="236" marker-end="url(#arrow)"/><rect class="panel" x="40" y="236" width="700" height="74" rx="8"/><text class="h" x="724" y="266" text-anchor="end">‏3۔ سیاق دیکھیں‏</text><text class="body" x="724" y="294" text-anchor="end">‏آس پاس کی آیات اور شانِ نزول پڑھیں‏</text><line class="thin" x1="390" y1="310" x2="390" y2="324" marker-end="url(#arrow)"/><rect class="panel" x="40" y="324" width="700" height="74" rx="8"/><text class="h" x="724" y="354" text-anchor="end">‏4۔ تفسیر سے رجوع کریں‏</text><text class="body" x="724" y="382" text-anchor="end">‏دیکھیں کہ معتبر تفاسیر اسے کیسے پڑھتی ہیں‏</text><line class="thin" x1="390" y1="398" x2="390" y2="412" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="412" width="700" height="74" rx="8"/><text class="h" x="724" y="442" text-anchor="end">‏5۔ درس اخذ کریں‏</text><text class="body" x="724" y="470" text-anchor="end">‏مرکزی موضوع اور عملی درس بیان کریں‏</text><text class="wm" x="12" y="514" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>