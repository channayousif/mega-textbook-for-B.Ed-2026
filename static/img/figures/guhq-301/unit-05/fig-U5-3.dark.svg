<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five steps from a verse to a lesson</title><desc id="d">Flowchart of five steps from a verse to a lesson: read, translate, check the context, consult tafsir, then draw the lesson.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="24" y="34">From a verse to a lesson</text><rect class="panel" x="40" y="52" width="700" height="56" rx="8"/><text class="h" x="56" y="80">1. Read</text><text class="body" x="56" y="100">read the verse or surah aloud</text><line class="thin" x1="390" y1="108" x2="390" y2="122" marker-end="url(#arrow)"/><rect class="panel" x="40" y="122" width="700" height="56" rx="8"/><text class="h" x="56" y="150">2. Translate</text><text class="body" x="56" y="170">give each word its meaning</text><line class="thin" x1="390" y1="178" x2="390" y2="192" marker-end="url(#arrow)"/><rect class="panel" x="40" y="192" width="700" height="56" rx="8"/><text class="h" x="56" y="220">3. Check the context</text><text class="body" x="56" y="240">read the verses around it and its occasion</text><line class="thin" x1="390" y1="248" x2="390" y2="262" marker-end="url(#arrow)"/><rect class="panel" x="40" y="262" width="700" height="56" rx="8"/><text class="h" x="56" y="290">4. Consult tafsir</text><text class="body" x="56" y="310">see how the trusted commentaries read it</text><line class="thin" x1="390" y1="318" x2="390" y2="332" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="332" width="700" height="56" rx="8"/><text class="h" x="56" y="360">5. Draw the lesson</text><text class="body" x="56" y="380">state the theme and the practical lesson</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
