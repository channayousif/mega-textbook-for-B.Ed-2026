<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 592" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">چھ چھوٹی سورتیں: پیغام اور ایک عملی درس</title><desc id="d">چھ چھوٹی سورتوں کا جدول، ہر سورت کے مرکزی پیغام اور طلبہ کے لیے ایک عملی درس کے ساتھ: الضحیٰ (93)، الکوثر (108)، الکافرون (109)، النصر (110)، الاخلاص (112) اور الفلق (113)۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="592"/><text class="h" x="756" y="38" text-anchor="end">‏چھ چھوٹی سورتیں: پیغام اور درس‏</text><rect class="panel" x="606" y="56" width="150" height="40"/><rect class="bg" x="336" y="56" width="270" height="40"/><rect class="panel-a" x="24" y="56" width="312" height="40"/><text class="sh" x="744" y="83" text-anchor="end">‏سورت‏</text><text class="sh" x="594" y="83" text-anchor="end">‏مرکزی پیغام‏</text><text class="sh" x="324" y="83" text-anchor="end">‏طلبہ کے لیے ایک عملی درس‏</text><rect class="panel" x="606" y="96" width="150" height="76"/><rect class="bg" x="336" y="96" width="270" height="76"/><rect class="thin" x="336" y="96" width="270" height="76"/><rect class="panel-a" x="24" y="96" width="312" height="76"/><text class="body" x="744" y="142" text-anchor="end">‏الضحیٰ (93)‏</text><text class="cell" x="594" y="142" text-anchor="end">‏اللہ کی دیکھ بھال اور بہتر آخرت‏</text><text class="cell" x="324" y="128" text-anchor="end">‏شکر گزار رہیں؛ یتیموں اور‏</text><text class="cell" x="324" y="156" text-anchor="end">‏غریبوں کا خیال رکھیں‏</text><rect class="panel" x="606" y="172" width="150" height="76"/><rect class="bg" x="336" y="172" width="270" height="76"/><rect class="thin" x="336" y="172" width="270" height="76"/><rect class="panel-a" x="24" y="172" width="312" height="76"/><text class="body" x="744" y="218" text-anchor="end">‏الکوثر (108)‏</text><text class="cell" x="594" y="218" text-anchor="end">‏اللہ کے عطیے پر شکر گزاری‏</text><text class="cell" x="324" y="204" text-anchor="end">‏نماز پڑھیں اور‏</text><text class="cell" x="324" y="232" text-anchor="end">‏شکر گزاری میں دیں‏</text><rect class="panel" x="606" y="248" width="150" height="76"/><rect class="bg" x="336" y="248" width="270" height="76"/><rect class="thin" x="336" y="248" width="270" height="76"/><rect class="panel-a" x="24" y="248" width="312" height="76"/><text class="body" x="744" y="294" text-anchor="end">‏الکافرون (109)‏</text><text class="cell" x="594" y="294" text-anchor="end">‏ایمان کی ایک واضح حد‏</text><text class="cell" x="324" y="280" text-anchor="end">‏دوسروں کا احترام کریں؛‏</text><text class="cell" x="324" y="308" text-anchor="end">‏اپنے ایمان پر قائم رہیں‏</text><rect class="panel" x="606" y="324" width="150" height="76"/><rect class="bg" x="336" y="324" width="270" height="76"/><rect class="thin" x="336" y="324" width="270" height="76"/><rect class="panel-a" x="24" y="324" width="312" height="76"/><text class="body" x="744" y="370" text-anchor="end">‏النصر (110)‏</text><text class="cell" x="594" y="370" text-anchor="end">‏فتح اللہ کی طرف سے آتی ہے‏</text><text class="cell" x="324" y="356" text-anchor="end">‏اللہ کا شکر کریں اور مغفرت مانگیں،‏</text><text class="cell" x="324" y="384" text-anchor="end">‏غرور نہ کریں‏</text><rect class="panel" x="606" y="400" width="150" height="76"/><rect class="bg" x="336" y="400" width="270" height="76"/><rect class="thin" x="336" y="400" width="270" height="76"/><rect class="panel-a" x="24" y="400" width="312" height="76"/><text class="body" x="744" y="446" text-anchor="end">‏الاخلاص (112)‏</text><text class="cell" x="594" y="446" text-anchor="end">‏اللہ ایک ہے‏</text><text class="cell" x="324" y="432" text-anchor="end">‏عبادت خالص رکھیں‏</text><text class="cell" x="324" y="460" text-anchor="end">‏اور سب کو برابر سمجھیں‏</text><rect class="panel" x="606" y="476" width="150" height="76"/><rect class="bg" x="336" y="476" width="270" height="76"/><rect class="thin" x="336" y="476" width="270" height="76"/><rect class="panel-a" x="24" y="476" width="312" height="76"/><text class="body" x="744" y="522" text-anchor="end">‏الفلق (113)‏</text><text class="cell" x="594" y="522" text-anchor="end">‏برائی سے اللہ کی پناہ‏</text><text class="cell" x="324" y="508" text-anchor="end">‏حفاظت کے لیے‏</text><text class="cell" x="324" y="536" text-anchor="end">‏اللہ کی طرف رجوع کریں‏</text><text class="wm" x="12" y="580" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>