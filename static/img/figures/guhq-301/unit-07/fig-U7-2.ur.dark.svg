<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">قرآنی حصے کے جائزے کا جدول</title><desc id="d">جدول جو مطالعہ کے لیے منتخب قرآنی حصوں کا خود جائزہ پیش کرتا ہے: بنیادی ذخیرۂ الفاظ، نحوی ساخت، مرکزی پیغام اور طلبہ کے لیے عملی سبق۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 13px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 12px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="390"/><text class="h" x="756" y="34" text-anchor="end">‏قرآنی حصے کے جائزے کا جدول‏</text><rect class="panel" x="614" y="52" width="142" height="36"/><rect class="bg" x="469" y="52" width="145" height="36"/><rect class="thin" x="469" y="52" width="145" height="36"/><rect class="panel" x="314" y="52" width="155" height="36"/><rect class="bg" x="169" y="52" width="145" height="36"/><rect class="thin" x="169" y="52" width="145" height="36"/><rect class="panel-a" x="24" y="52" width="145" height="36"/><text class="sh" x="744" y="75" text-anchor="end">‏قرآنی حصہ‏</text><text class="sh" x="602" y="75" text-anchor="end">‏اہم ذخیرۂ الفاظ‏</text><text class="sh" x="457" y="75" text-anchor="end">‏نحوی خصائص‏</text><text class="sh" x="302" y="75" text-anchor="end">‏مرکزی پیغام‏</text><text class="sh" x="157" y="75" text-anchor="end">‏عملی سبق‏</text><rect class="panel" x="614" y="88" width="142" height="80"/><rect class="bg" x="469" y="88" width="145" height="80"/><rect class="thin" x="469" y="88" width="145" height="80"/><rect class="panel" x="314" y="88" width="155" height="80"/><rect class="bg" x="169" y="88" width="145" height="80"/><rect class="thin" x="169" y="88" width="145" height="80"/><rect class="panel-a" x="24" y="88" width="145" height="80"/><text class="cell" x="744" y="116" text-anchor="end">‏سورۃ الاخلاص‏</text><text class="small" x="744" y="140" text-anchor="end">‏(112:1-4)‏</text><text class="cell" x="602" y="116" text-anchor="end">‏احد (یکتا، بے مثل)‏</text><text class="cell" x="602" y="140" text-anchor="end">‏الصمد (بے نیاز سہارا)‏</text><text class="cell" x="457" y="116" text-anchor="end">‏جملہ اسمیہ؛ لم یلد‏</text><text class="cell" x="457" y="140" text-anchor="end">‏(فعل مجزوم بلَم)‏</text><text class="cell" x="302" y="116" text-anchor="end">‏خالص توحید باری تعالیٰ‏</text><text class="cell" x="302" y="140" text-anchor="end">‏اور شرک کی مکمل نفی‏</text><text class="cell" x="157" y="116" text-anchor="end">‏صرف اللہ پر بھروسا؛‏</text><text class="cell" x="157" y="140" text-anchor="end">‏غرور و تکبر کا خاتمہ‏</text><rect class="panel" x="614" y="168" width="142" height="80"/><rect class="bg" x="469" y="168" width="145" height="80"/><rect class="thin" x="469" y="168" width="145" height="80"/><rect class="panel" x="314" y="168" width="155" height="80"/><rect class="bg" x="169" y="168" width="145" height="80"/><rect class="thin" x="169" y="168" width="145" height="80"/><rect class="panel-a" x="24" y="168" width="145" height="80"/><text class="cell" x="744" y="196" text-anchor="end">‏سورۃ العصر‏</text><text class="small" x="744" y="220" text-anchor="end">‏(103:1-3)‏</text><text class="cell" x="602" y="196" text-anchor="end">‏خُسر (نقصان)، آمنوا،‏</text><text class="cell" x="602" y="220" text-anchor="end">‏تواصَوا (باہمی تلقین)‏</text><text class="cell" x="457" y="196" text-anchor="end">‏اِنّ مع اسمِ منصوب؛‏</text><text class="cell" x="457" y="220" text-anchor="end">‏اِلّا جملہ استثنائیہ‏</text><text class="cell" x="302" y="196" text-anchor="end">‏نیک اعمال کے بغیر‏</text><text class="cell" x="302" y="220" text-anchor="end">‏انسانی وقت گھاٹے میں‏</text><text class="cell" x="157" y="196" text-anchor="end">‏کلاس کے وقت کی قدر؛‏</text><text class="cell" x="157" y="220" text-anchor="end">‏حق و صبر کی باہمی تلقین‏</text><rect class="panel" x="614" y="248" width="142" height="80"/><rect class="bg" x="469" y="248" width="145" height="80"/><rect class="thin" x="469" y="248" width="145" height="80"/><rect class="panel" x="314" y="248" width="155" height="80"/><rect class="bg" x="169" y="248" width="145" height="80"/><rect class="thin" x="169" y="248" width="145" height="80"/><rect class="panel-a" x="24" y="248" width="145" height="80"/><text class="cell" x="744" y="276" text-anchor="end">‏آیۃ الکرسی‏</text><text class="small" x="744" y="300" text-anchor="end">‏(2:255 کا حصہ)‏</text><text class="cell" x="602" y="276" text-anchor="end">‏الحی، القیوم،‏</text><text class="cell" x="602" y="300" text-anchor="end">‏سِنۃ (اونگھ)، نوم‏</text><text class="cell" x="457" y="276" text-anchor="end">‏ضمائرِ متصلہ؛‏</text><text class="cell" x="457" y="300" text-anchor="end">‏لا نافیہ مع فعل مضارع‏</text><text class="cell" x="302" y="276" text-anchor="end">‏اللہ کی دائمی حیات‏</text><text class="cell" x="302" y="300" text-anchor="end">‏اور ہمہ گیر نگہبانی‏</text><text class="cell" x="157" y="276" text-anchor="end">‏اللہ پر پرسکون توکل؛‏</text><text class="cell" x="157" y="300" text-anchor="end">‏اخلاص کے ساتھ تدریس‏</text><text class="wm" x="12" y="370" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>