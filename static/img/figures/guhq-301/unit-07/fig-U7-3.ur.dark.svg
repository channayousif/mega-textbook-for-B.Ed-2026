<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">معلم کی زندگی میں قرآنی تعلیمات کا اطلاق</title><desc id="d">تصوراتی خاکہ جو ایک معلم کی زندگی کے تین دائروں میں قرآنی تعلیمات کے عملی اطلاق کو ظاہر کرتا ہے: تدریسی عمل، خاندانی تعلقات اور اسکول و سماجی برادری۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="756" y="34" text-anchor="end">‏معلم کی زندگی میں قرآنی تعلیمات کا اطلاق‏</text><ellipse class="panel-a" cx="390" cy="210" rx="140" ry="50"/><text class="sh" x="390" y="204" text-anchor="middle">‏روزمرہ زندگی میں قرآنی تعلیمات‏</text><text class="sh" x="390" y="228" text-anchor="middle">‏(تدبر اور عملی اطلاق)‏</text><rect class="panel" x="520" y="50" width="236" height="108" rx="8"/><text class="h" x="742" y="74" text-anchor="end">‏تدریسی اور جماعتی عمل‏</text><text class="cell" x="742" y="98" text-anchor="end">‏امتحانات میں عدل و انصاف‏</text><text class="cell" x="742" y="120" text-anchor="end">‏کمزور طلبہ کے ساتھ صبر و تحمل‏</text><text class="cell" x="742" y="142" text-anchor="end">‏ذاتی کردار کے ذریعے تدریس‏</text><rect class="panel" x="24" y="50" width="236" height="108" rx="8"/><text class="h" x="246" y="74" text-anchor="end">‏خاندانی اور گھریلو تعلقات‏</text><text class="cell" x="246" y="98" text-anchor="end">‏چھوٹوں پر شفقت، بڑوں کا احترام‏</text><text class="cell" x="246" y="120" text-anchor="end">‏باہمی حقوق کی حسنِ ادا‏</text><text class="cell" x="246" y="142" text-anchor="end">‏نرم، شائستہ اور سچی گفتگو‏</text><rect class="panel" x="270" y="320" width="240" height="108" rx="8"/><text class="h" x="496" y="344" text-anchor="end">‏اسکول اور سماجی برادری‏</text><text class="cell" x="496" y="368" text-anchor="end">‏باہمی مشاورت (شوریٰ)‏</text><text class="cell" x="496" y="390" text-anchor="end">‏نیکی کے کاموں میں تعاون‏</text><text class="cell" x="496" y="412" text-anchor="end">‏امانت داری اور دیانت داری‏</text><line class="thin" x1="520" y1="104" x2="495" y2="175" marker-end="url(#arrow)"/><line class="thin" x1="260" y1="104" x2="285" y2="175" marker-end="url(#arrow)"/><line class="thin" x1="390" y1="260" x2="390" y2="320" marker-end="url(#arrow)"/><text class="wm" x="12" y="456" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>