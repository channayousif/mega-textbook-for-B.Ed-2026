<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Self-check grid for a Quranic passage</title><desc id="d">Table of a self-check grid for study passages, showing for each passage key vocabulary known from earlier units, grammatical structure, central message, and a practical lesson for pupils.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 13px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 12px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="340"/><text class="h" x="24" y="34">Self-check grid for a Quranic passage</text><rect class="panel" x="24" y="52" width="145" height="36"/><rect class="bg" x="169" y="52" width="145" height="36"/><rect class="thin" x="169" y="52" width="145" height="36"/><rect class="panel" x="314" y="52" width="155" height="36"/><rect class="bg" x="469" y="52" width="145" height="36"/><rect class="thin" x="469" y="52" width="145" height="36"/><rect class="panel-a" x="614" y="52" width="142" height="36"/><text class="sh" x="34" y="75">Passage</text><text class="sh" x="179" y="75">Key vocabulary</text><text class="sh" x="324" y="75">Grammar features</text><text class="sh" x="479" y="75">Central message</text><text class="sh" x="624" y="75">Practical lesson</text><rect class="panel" x="24" y="88" width="145" height="64"/><rect class="bg" x="169" y="88" width="145" height="64"/><rect class="thin" x="169" y="88" width="145" height="64"/><rect class="panel" x="314" y="88" width="155" height="64"/><rect class="bg" x="469" y="88" width="145" height="64"/><rect class="thin" x="469" y="88" width="145" height="64"/><rect class="panel-a" x="614" y="88" width="142" height="64"/><text class="cell" x="34" y="112">Surah al-Ikhlas</text><text class="small" x="34" y="132">(112:1-4)</text><text class="cell" x="179" y="112">Ahad (one, unique)</text><text class="cell" x="179" y="132">As-Samad (refuge)</text><text class="cell" x="324" y="112">Nominal sentence,</text><text class="cell" x="324" y="132">lam yalid (jussive)</text><text class="cell" x="479" y="112">Pure monotheism</text><text class="cell" x="479" y="132">(Tawhid) of Allah</text><text class="cell" x="624" y="112">Rely on Allah alone;</text><text class="cell" x="624" y="132">reject arrogance</text><rect class="panel" x="24" y="152" width="145" height="64"/><rect class="bg" x="169" y="152" width="145" height="64"/><rect class="thin" x="169" y="152" width="145" height="64"/><rect class="panel" x="314" y="152" width="155" height="64"/><rect class="bg" x="469" y="152" width="145" height="64"/><rect class="thin" x="469" y="152" width="145" height="64"/><rect class="panel-a" x="614" y="152" width="142" height="64"/><text class="cell" x="34" y="176">Surah al-Asr</text><text class="small" x="34" y="196">(103:1-3)</text><text class="cell" x="179" y="176">Khusr (loss), amanu,</text><text class="cell" x="179" y="196">tawasaw (advice)</text><text class="cell" x="324" y="176">Inna with accusative,</text><text class="cell" x="324" y="196">illa exception clause</text><text class="cell" x="479" y="176">Human time lost</text><text class="cell" x="479" y="196">without good deeds</text><text class="cell" x="624" y="176">Treasure class time;</text><text class="cell" x="624" y="196">advise in truth</text><rect class="panel" x="24" y="216" width="145" height="64"/><rect class="bg" x="169" y="216" width="145" height="64"/><rect class="thin" x="169" y="216" width="145" height="64"/><rect class="panel" x="314" y="216" width="155" height="64"/><rect class="bg" x="469" y="216" width="145" height="64"/><rect class="thin" x="469" y="216" width="145" height="64"/><rect class="panel-a" x="614" y="216" width="142" height="64"/><text class="cell" x="34" y="240">Ayat al-Kursi</text><text class="small" x="34" y="260">(2:255 extract)</text><text class="cell" x="179" y="240">Al-Hayy, Al-Qayyum,</text><text class="cell" x="179" y="260">sinah (drowsiness)</text><text class="cell" x="324" y="240">Attached pronouns,</text><text class="cell" x="324" y="260">la negation of verbs</text><text class="cell" x="479" y="240">Allah eternal life</text><text class="cell" x="479" y="260">and sovereign care</text><text class="cell" x="624" y="240">Calm trust in Allah;</text><text class="cell" x="624" y="260">teach with devotion</text><text class="wm" x="768" y="320" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>