<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">جامع مطالعہ کے پانچ مراحل</title><desc id="d">فلو چارٹ جو ایک قرآنی حصے کے جامع مطالعے کے پانچ مراحل ظاہر کرتا ہے: تجوید کے ساتھ بآوازِ بلند تلاوت، لفظ بہ لفظ ترجمہ، قواعد اور نحوی تجزیہ، تفسیر و سیاق کا مطالعہ، اور تدریس کے لیے عملی اخلاقی سبق اخذ کرنا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="756" y="36" text-anchor="end">‏جامع مطالعہ کے پانچ مراحل‏</text><rect class="panel" x="40" y="52" width="700" height="70" rx="8"/><text class="h" x="724" y="80" text-anchor="end">‏1۔ تجوید کے ساتھ بآوازِ بلند تلاوت‏</text><text class="body" x="724" y="104" text-anchor="end">‏مخارج، حرکات اور علاماتِ وقف کی پابندی تاکہ درست تلفظ فہم میں مددگار بنے‏</text><line class="thin" x1="390" y1="122" x2="390" y2="140" marker-end="url(#arrow)"/><rect class="panel" x="40" y="140" width="700" height="70" rx="8"/><text class="h" x="724" y="168" text-anchor="end">‏2۔ لفظ بہ لفظ ترجمہ‏</text><text class="body" x="724" y="192" text-anchor="end">‏سہ حرفی مادوں، نحوی حروف اور مانوس ذخیرۂ الفاظ کی شناخت‏</text><line class="thin" x1="390" y1="210" x2="390" y2="228" marker-end="url(#arrow)"/><rect class="panel" x="40" y="228" width="700" height="70" rx="8"/><text class="h" x="724" y="256" text-anchor="end">‏3۔ قواعد اور نحو کا تجزیہ‏</text><text class="body" x="724" y="280" text-anchor="end">‏اسمیہ اور فعلیہ جملوں، اوزان اور اعرابی حالتوں کی تفریق‏</text><line class="thin" x1="390" y1="298" x2="390" y2="316" marker-end="url(#arrow)"/><rect class="panel" x="40" y="316" width="700" height="70" rx="8"/><text class="h" x="724" y="344" text-anchor="end">‏4۔ تفسیر اور سیاق کا مطالعہ‏</text><text class="body" x="724" y="368" text-anchor="end">‏آیت کا سیاق (سباق و لحاق)، اسبابِ نزول اور معتبر تفاسیر سے رہنمائی‏</text><line class="thin" x1="390" y1="386" x2="390" y2="404" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="404" width="700" height="70" rx="8"/><text class="h" x="724" y="432" text-anchor="end">‏5۔ عملی اسباق کا اخراج (تدبر و عمل)‏</text><text class="body" x="724" y="456" text-anchor="end">‏بنیادی پیغامات کو تدریس، ذاتی اخلاق اور روزمرہ زندگی کے لیے عملی رہنمائی میں بدلنا‏</text><text class="wm" x="12" y="506" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>