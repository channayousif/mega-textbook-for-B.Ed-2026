<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Applying Quranic teachings in a teacher's life</title><desc id="d">Concept map showing the practical application of Quranic teachings across three areas of a teacher's life: classroom teaching, family relations, and the wider school community.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="24" y="34">Applying Quranic teachings in a teacher's life</text><ellipse class="panel-a" cx="390" cy="200" rx="130" ry="46"/><text class="sh" x="390" y="195" text-anchor="middle">Quranic teachings</text><text class="sh" x="390" y="215" text-anchor="middle">in daily life (tadabbur)</text><rect class="panel" x="24" y="50" width="220" height="96" rx="8"/><text class="h" x="36" y="74">Classroom practice</text><text class="cell" x="36" y="96">Fairness in student grading</text><text class="cell" x="36" y="116">Patience with slow learners</text><text class="cell" x="36" y="136">Teaching by personal example</text><rect class="panel" x="536" y="50" width="220" height="96" rx="8"/><text class="h" x="548" y="74">Family relations</text><text class="cell" x="548" y="96">Mercy to young and elders</text><text class="cell" x="548" y="116">Fulfilling mutual rights</text><text class="cell" x="548" y="136">Gentle and truthful speech</text><rect class="panel" x="280" y="300" width="220" height="96" rx="8"/><text class="h" x="292" y="324">School community</text><text class="cell" x="292" y="346">Mutual counsel (shura)</text><text class="cell" x="292" y="366">Cooperation in good deeds</text><text class="cell" x="292" y="386">Integrity and trustworthiness</text><line class="thin" x1="244" y1="98" x2="290" y2="165" marker-end="url(#arrow)"/><line class="thin" x1="536" y1="98" x2="490" y2="165" marker-end="url(#arrow)"/><line class="thin" x1="390" y1="246" x2="390" y2="300" marker-end="url(#arrow)"/><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>