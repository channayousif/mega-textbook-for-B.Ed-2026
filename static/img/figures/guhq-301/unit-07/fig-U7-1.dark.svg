<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five steps of an integrated study routine</title><desc id="d">Flowchart showing a five-step study routine for one passage: recite aloud with tajwid, translate word by word, parse grammar and syntax, consult tafsir and context, and draw a practical classroom lesson.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="24" y="34">Five steps of an integrated study routine</text><rect class="panel" x="40" y="52" width="700" height="56" rx="8"/><text class="h" x="56" y="78">1. Recite aloud with tajwid</text><text class="body" x="56" y="98">Observe makharij, vowels and pauses so pronunciation aids meaning</text><line class="thin" x1="390" y1="108" x2="390" y2="122" marker-end="url(#arrow)"/><rect class="panel" x="40" y="122" width="700" height="56" rx="8"/><text class="h" x="56" y="148">2. Translate word by word</text><text class="body" x="56" y="168">Identify three-letter roots, grammatical particles and familiar vocabulary</text><line class="thin" x1="390" y1="178" x2="390" y2="192" marker-end="url(#arrow)"/><rect class="panel" x="40" y="192" width="700" height="56" rx="8"/><text class="h" x="56" y="218">3. Parse grammar and syntax</text><text class="body" x="56" y="238">Distinguish nominal and verbal structures, verb forms and noun markers</text><line class="thin" x1="390" y1="248" x2="390" y2="262" marker-end="url(#arrow)"/><rect class="panel" x="40" y="262" width="700" height="56" rx="8"/><text class="h" x="56" y="288">4. Consult tafsir and context</text><text class="body" x="56" y="308">Examine verse context (siyaq), occasions of revelation and trustworthy commentary</text><line class="thin" x1="390" y1="318" x2="390" y2="332" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="332" width="700" height="56" rx="8"/><text class="h" x="56" y="358">5. Draw practical lessons (tadabbur)</text><text class="body" x="56" y="378">Translate core themes into concrete guidance for teaching, character and life</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>