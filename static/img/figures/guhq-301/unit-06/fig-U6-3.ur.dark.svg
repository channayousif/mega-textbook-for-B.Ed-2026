<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 550" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">سیاق اور شانِ نزول سے آفاقی درس تک</title><desc id="d">خاکہ جو ظاہر کرتا ہے کہ کس طرح ایک آیت، اس کا سببِ نزول، اور عمومی اصول مل کر ایک دائمی اخلاقی درس اخذ کرتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="550"/><text class="h" x="756" y="38" text-anchor="end">‏سیاق اور شانِ نزول سے آفاقی درس تک‏</text><rect class="panel" x="40" y="56" width="700" height="74" rx="8"/><text class="h" x="724" y="82" text-anchor="end">‏1۔ خاص موقع (سببِ نزول)‏</text><text class="cell" x="724" y="104" text-anchor="end">‏ساتویں صدی کے عرب کا ایک تاریخی واقعہ یا سوال:‏</text><text class="cell" x="724" y="122" text-anchor="end">‏نبی کریم ﷺ کے معصوم فرزند کے انتقال پر مخالفین کا طعنہ دینا‏</text><line class="thin" x1="390" y1="130" x2="390" y2="148" marker-end="url(#arrow)"/><rect class="panel" x="40" y="148" width="700" height="74" rx="8"/><text class="h" x="724" y="174" text-anchor="end">‏2۔ نازل شدہ آیت‏</text><text class="cell" x="724" y="196" text-anchor="end">‏سورۃ الکوثر (108:1-3): 'بے شک ہم نے آپ کو کوثر عطا کی،‏</text><text class="cell" x="724" y="214" text-anchor="end">‏پس اپنے رب کے لیے نماز پڑھیں اور قربانی دیں؛ یقیناً آپ کا دشمن ہی بے نام و نشان رہے گا'‏</text><line class="thin" x1="390" y1="222" x2="390" y2="240" marker-end="url(#arrow)"/><rect class="panel" x="40" y="240" width="700" height="74" rx="8"/><text class="h" x="724" y="266" text-anchor="end">‏3۔ تفسیری قاعدہ‏</text><text class="cell" x="724" y="288" text-anchor="end">‏اَلْعِبْرَةُ بِعُمُومِ اللَّفْظِ لَا بِخُصُوصِ السَّبَبِ‏</text><text class="cell" x="724" y="306" text-anchor="end">‏(فیصلہ کن بات الفاظ کا عموم ہے، سبب کا خاص واقعہ نہیں)‏</text><line class="thin" x1="390" y1="314" x2="390" y2="332" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="332" width="700" height="74" rx="8"/><text class="h" x="724" y="358" text-anchor="end">‏4۔ دائمی اخلاقی درس‏</text><text class="cell" x="724" y="380" text-anchor="end">‏غم اور صدمے میں الٰہی تسلی؛ بدخواہی اور تضحیک کا جواب مخلصانہ بندگی،‏</text><text class="cell" x="724" y="398" text-anchor="end">‏غیر متزلزل ایمان اور خلقِ خدا کی خدمت سے دینا‏</text><line class="thin" x1="390" y1="406" x2="390" y2="424" marker-end="url(#arrow)"/><rect class="panel" x="40" y="424" width="700" height="74" rx="8"/><text class="h" x="724" y="450" text-anchor="end">‏5۔ جدید جماعت میں عملی اطلاق‏</text><text class="cell" x="724" y="472" text-anchor="end">‏طلبہ میں صدمے پر صبر، غمزدہ ساتھیوں سے ہمدردی،‏</text><text class="cell" x="724" y="490" text-anchor="end">‏اور طعن و تشنیع کا سامنا کرتے وقت اخلاقی وقار اور حوصلہ برقرار رکھنا‏</text><text class="wm" x="12" y="534" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>