<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From context and occasion to universal lesson</title><desc id="d">Diagram showing how a verse, its occasion of revelation, and the general principle connect to draw a timeless lesson.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><text class="h" x="24" y="34">From context and occasion to universal lesson</text><rect class="panel" x="40" y="52" width="700" height="64" rx="8"/><text class="h" x="56" y="74">1. Specific Occasion (Sabab al-Nuzul)</text><text class="cell" x="56" y="92">Historical event or question in seventh-century Arabia:</text><text class="cell" x="56" y="108">Opponents mock the Prophet after the death of his infant son</text><line class="thin" x1="390" y1="116" x2="390" y2="128" marker-end="url(#arrow)"/><rect class="panel" x="40" y="128" width="700" height="64" rx="8"/><text class="h" x="56" y="150">2. Revealed Verse (Ayah)</text><text class="cell" x="56" y="168">Surah al-Kawthar (108:1-3): 'Indeed, We have granted you al-Kawthar,</text><text class="cell" x="56" y="184">so pray to your Lord and sacrifice; indeed your enemy is cut off'</text><line class="thin" x1="390" y1="192" x2="390" y2="204" marker-end="url(#arrow)"/><rect class="panel" x="40" y="204" width="700" height="64" rx="8"/><text class="h" x="56" y="226">3. Hermeneutical Principle</text><text class="cell" x="56" y="244">The ruling is drawn from the generality of the wording,</text><text class="cell" x="56" y="260">not the particularity of the occasion (al-ibrah bi umum al-lafz)</text><line class="thin" x1="390" y1="268" x2="390" y2="280" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="280" width="700" height="64" rx="8"/><text class="h" x="56" y="302">4. Universal Living Lesson</text><text class="cell" x="56" y="320">Divine solace in grief; respond to animosity with sincere devotion,</text><text class="cell" x="56" y="336">unshakable faith, and persistent community service</text><line class="thin" x1="390" y1="344" x2="390" y2="356" marker-end="url(#arrow)"/><rect class="panel" x="40" y="356" width="700" height="64" rx="8"/><text class="h" x="56" y="378">5. Modern Classroom Application</text><text class="cell" x="56" y="396">Teaching pupils resilience, compassion for grieving peers,</text><text class="cell" x="56" y="412">and relying on moral integrity when facing peer mockery</text><text class="wm" x="768" y="468" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>