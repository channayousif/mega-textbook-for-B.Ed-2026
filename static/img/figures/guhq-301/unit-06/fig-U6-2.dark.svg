<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of Makki and Madani surahs</title><desc id="d">Table comparing Makki and Madani surahs across four dimensions: historical period, primary themes, linguistic style and verse length, and audience addressed.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="340"/><text class="h" x="24" y="34">Comparison of Makki and Madani surahs</text><rect class="panel" x="24" y="52" width="160" height="36"/><rect class="panel-a" x="184" y="52" width="280" height="36"/><rect class="panel-b" x="464" y="52" width="292" height="36"/><text class="sh" x="36" y="76">Dimension</text><text class="sh" x="196" y="76">Makki Surahs</text><text class="sh" x="476" y="76">Madani Surahs</text><rect class="panel" x="24" y="88" width="160" height="56"/><rect class="bg" x="184" y="88" width="280" height="56"/><rect class="thin" x="184" y="88" width="280" height="56"/><rect class="bg" x="464" y="88" width="292" height="56"/><rect class="thin" x="464" y="88" width="292" height="56"/><text class="body" x="36" y="112">Historical period</text><text class="small" x="36" y="130">Timeline anchor</text><text class="cell" x="196" y="112">Revealed before the Hijrah</text><text class="cell" x="196" y="130">(610-622 CE, 13 years)</text><text class="cell" x="476" y="112">Revealed after the Hijrah</text><text class="cell" x="476" y="130">(622-632 CE, 10 years)</text><rect class="panel" x="24" y="144" width="160" height="56"/><rect class="bg" x="184" y="144" width="280" height="56"/><rect class="thin" x="184" y="144" width="280" height="56"/><rect class="bg" x="464" y="144" width="292" height="56"/><rect class="thin" x="464" y="144" width="292" height="56"/><text class="body" x="36" y="168">Primary themes</text><text class="small" x="36" y="186">Core subject matter</text><text class="cell" x="196" y="168">Tawhid, Day of Judgement,</text><text class="cell" x="196" y="186">prophethood and moral character</text><text class="cell" x="476" y="168">Civil laws, family legislation,</text><text class="cell" x="476" y="186">worship rituals and social justice</text><rect class="panel" x="24" y="200" width="160" height="56"/><rect class="bg" x="184" y="200" width="280" height="56"/><rect class="thin" x="184" y="200" width="280" height="56"/><rect class="bg" x="464" y="200" width="292" height="56"/><rect class="thin" x="464" y="200" width="292" height="56"/><text class="body" x="36" y="224">Style and length</text><text class="small" x="36" y="242">Rhetorical form</text><text class="cell" x="196" y="224">Short, rhythmic, intense verses</text><text class="cell" x="196" y="242">with vivid oaths and cosmic imagery</text><text class="cell" x="476" y="224">Longer, structured passages</text><text class="cell" x="476" y="242">with detailed legal exposition</text><rect class="panel" x="24" y="256" width="160" height="56"/><rect class="bg" x="184" y="256" width="280" height="56"/><rect class="thin" x="184" y="256" width="280" height="56"/><rect class="bg" x="464" y="256" width="292" height="56"/><rect class="thin" x="464" y="256" width="292" height="56"/><text class="body" x="36" y="280">Audience address</text><text class="small" x="36" y="298">Usual phrasing</text><text class="cell" x="196" y="280">Addresses humanity broadly:</text><text class="cell" x="196" y="298">'Ya ayyuha al-nas' (O mankind)</text><text class="cell" x="476" y="280">Addresses the faithful community:</text><text class="cell" x="476" y="298">'Ya ayyuha alladhina amanu'</text><text class="wm" x="768" y="330" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>