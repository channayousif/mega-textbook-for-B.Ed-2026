<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Makki and Madani revelation periods and landmark events</title><desc id="d">Timeline showing the Makki (610-622 CE) and Madani (622-632 CE) revelation periods with landmark events of the Prophet's life.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="24" y="34">Timeline of revelation: Makki and Madani periods</text><rect class="panel-a" x="24" y="52" width="350" height="52" rx="8"/><text class="h" x="38" y="76">Makki Period (610-622 CE)</text><text class="small" x="38" y="94">13 years in Makkah: faith, patience, character</text><rect class="panel-b" x="406" y="52" width="350" height="52" rx="8"/><text class="h" x="420" y="76">Madani Period (622-632 CE)</text><text class="small" x="420" y="94">10 years in Madinah: community, laws, ethics</text><line class="thin" x1="199" y1="104" x2="199" y2="120"/><line class="thin" x1="581" y1="104" x2="581" y2="120"/><line class="thin" x1="40" y1="120" x2="740" y2="120" stroke-width="2"/><circle cx="199" cy="120" r="4" fill="var(--a1)"/><circle cx="390" cy="120" r="6" fill="var(--a3)"/><circle cx="581" cy="120" r="4" fill="var(--a2)"/><text class="sh" x="390" y="140" text-anchor="middle">Hijrah (622 CE)</text><rect class="panel" x="24" y="152" width="350" height="48" rx="6"/><text class="sh" x="36" y="172">610 CE: First Revelation</text><text class="cell" x="36" y="190">Cave Hira; Surah al-Alaq (96:1-5)</text><rect class="panel" x="24" y="208" width="350" height="48" rx="6"/><text class="sh" x="36" y="228">613 CE: Public Call</text><text class="cell" x="36" y="246">Dawah at Mount Safa; call to Tawhid</text><rect class="panel" x="24" y="264" width="350" height="48" rx="6"/><text class="sh" x="36" y="284">617-619 CE: Boycott of Banu Hashim</text><text class="cell" x="36" y="302">Patience in hardship; moral fortitude</text><rect class="panel" x="24" y="320" width="350" height="48" rx="6"/><text class="sh" x="36" y="340">620-621 CE: Year of Sorrow and Miraj</text><text class="cell" x="36" y="358">Consolation through revelation and prayer</text><rect class="panel" x="406" y="152" width="350" height="48" rx="6"/><text class="sh" x="418" y="172">622 CE: Arrival in Madinah</text><text class="cell" x="418" y="190">Building the Prophet's Mosque; brotherhood</text><rect class="panel" x="406" y="208" width="350" height="48" rx="6"/><text class="sh" x="418" y="228">624 CE (2 AH): Battle of Badr</text><text class="cell" x="418" y="246">Defense of faith; Ramadan fasting prescribed</text><rect class="panel" x="406" y="264" width="350" height="48" rx="6"/><text class="sh" x="418" y="284">628 CE (6 AH): Treaty of Hudaybiyyah</text><text class="cell" x="418" y="302">Surah al-Fath (48); diplomacy and peace</text><rect class="panel" x="406" y="320" width="350" height="48" rx="6"/><text class="sh" x="418" y="340">632 CE (10 AH): Farewell Pilgrimage</text><text class="cell" x="418" y="358">Surah al-Ma'idah (5:3); completion of faith</text><text class="small" x="390" y="394" text-anchor="middle">Revelation was gradual over 23 years, addressing changing historical contexts.</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>