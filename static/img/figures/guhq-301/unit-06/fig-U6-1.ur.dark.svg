<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">نزول کا خطِ زمانی: مکی اور مدنی ادوار</title><desc id="d">خطِ زمانی جو مکی (610 تا 622 عیسوی) اور مدنی (622 تا 632 عیسوی) ادوارِ نزول کو نبی کریم ﷺ کی حیاتِ مبارکہ کے اہم واقعات کے ساتھ دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><text class="h" x="756" y="38" text-anchor="end">‏نزول کا خطِ زمانی: مکی اور مدنی ادوار‏</text><rect class="panel-a" x="406" y="56" width="350" height="56" rx="8"/><text class="h" x="742" y="80" text-anchor="end">‏مکی دور (610 تا 622 عیسوی)‏</text><text class="small" x="742" y="100" text-anchor="end">‏مکہ میں 13 سال: ایمان، صبر اور اخلاق‏</text><rect class="panel-b" x="24" y="56" width="350" height="56" rx="8"/><text class="h" x="360" y="80" text-anchor="end">‏مدنی دور (622 تا 632 عیسوی)‏</text><text class="small" x="360" y="100" text-anchor="end">‏مدینہ میں 10 سال: معاشرت، قوانین اور احکام‏</text><line class="thin" x1="581" y1="112" x2="581" y2="130"/><line class="thin" x1="199" y1="112" x2="199" y2="130"/><line class="thin" x1="40" y1="130" x2="740" y2="130" stroke-width="2"/><circle cx="581" cy="130" r="4" fill="var(--a1)"/><circle cx="390" cy="130" r="6" fill="var(--a3)"/><circle cx="199" cy="130" r="4" fill="var(--a2)"/><text class="sh" x="390" y="152" text-anchor="middle">‏ہجرتِ مدینہ (622 عیسوی)‏</text><rect class="panel" x="406" y="166" width="350" height="50" rx="6"/><text class="sh" x="742" y="186" text-anchor="end">‏610 عیسوی: آغازِ وحی‏</text><text class="cell" x="742" y="204" text-anchor="end">‏غارِ حرا؛ سورۃ العلق (96:1-5)‏</text><rect class="panel" x="406" y="224" width="350" height="50" rx="6"/><text class="sh" x="742" y="244" text-anchor="end">‏613 عیسوی: اعلانیہ دعوت‏</text><text class="cell" x="742" y="262" text-anchor="end">‏کوہِ صفا پر دعوت؛ توحید کی پکار‏</text><rect class="panel" x="406" y="282" width="350" height="50" rx="6"/><text class="sh" x="742" y="302" text-anchor="end">‏617 تا 619 عیسوی: شعبِ ابی طالب کا بائیکاٹ‏</text><text class="cell" x="742" y="320" text-anchor="end">‏سختیوں میں صبر؛ اخلاقی استقامت‏</text><rect class="panel" x="406" y="340" width="350" height="50" rx="6"/><text class="sh" x="742" y="360" text-anchor="end">‏620 تا 621 عیسوی: عام الحزن اور معراج‏</text><text class="cell" x="742" y="378" text-anchor="end">‏وحی اور نماز کے ذریعے تسلی‏</text><rect class="panel" x="24" y="166" width="350" height="50" rx="6"/><text class="sh" x="360" y="186" text-anchor="end">‏622 عیسوی: مدینہ منورہ آمد‏</text><text class="cell" x="360" y="204" text-anchor="end">‏مسجدِ نبوی کی تعمیر؛ مواخات‏</text><rect class="panel" x="24" y="224" width="350" height="50" rx="6"/><text class="sh" x="360" y="244" text-anchor="end">‏624 عیسوی (2 ہجری): غزوۂ بدر‏</text><text class="cell" x="360" y="262" text-anchor="end">‏دفاعِ حق؛ رمضان کے روزوں کی فرضیت‏</text><rect class="panel" x="24" y="282" width="350" height="50" rx="6"/><text class="sh" x="360" y="302" text-anchor="end">‏628 عیسوی (6 ہجری): صلحِ حدیبیہ‏</text><text class="cell" x="360" y="320" text-anchor="end">‏سورۃ الفتح (48)؛ حکمتِ عملی اور امن‏</text><rect class="panel" x="24" y="340" width="350" height="50" rx="6"/><text class="sh" x="360" y="360" text-anchor="end">‏632 عیسوی (10 ہجری): خطبۂ حجتہ الوداع‏</text><text class="cell" x="360" y="378" text-anchor="end">‏سورۃ المائدہ (5:3)؛ تکمیلِ دین‏</text><text class="small" x="390" y="420" text-anchor="middle">‏وحی 23 سال کے عرصے میں تدریجاً نازل ہوئی، جس نے بدلتے ہوئے تاریخی حالات کی رہنمائی کی۔‏</text><text class="wm" x="12" y="446" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>