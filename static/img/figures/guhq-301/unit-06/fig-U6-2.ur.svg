<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">مکی اور مدنی سورتوں کا موازنہ</title><desc id="d">جدول جو مکی اور مدنی سورتوں کا چار پہلوؤں سے موازنہ کرتا ہے: تاریخی دور، بنیادی موضوعات، اسلوب و طوالت، اور مخاطبین کا انداز۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 12px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="430"/><text class="h" x="756" y="38" text-anchor="end">‏مکی اور مدنی سورتوں کا موازنہ‏</text><rect class="panel" x="596" y="54" width="160" height="38"/><rect class="panel-a" x="310" y="54" width="286" height="38"/><rect class="panel-b" x="24" y="54" width="286" height="38"/><text class="sh" x="744" y="78" text-anchor="end">‏پہلو‏</text><text class="sh" x="584" y="78" text-anchor="end">‏مکی سورتیں‏</text><text class="sh" x="298" y="78" text-anchor="end">‏مدنی سورتیں‏</text><rect class="panel" x="596" y="92" width="160" height="74"/><rect class="bg" x="310" y="92" width="286" height="74"/><rect class="thin" x="310" y="92" width="286" height="74"/><rect class="bg" x="24" y="92" width="286" height="74"/><rect class="thin" x="24" y="92" width="286" height="74"/><text class="body" x="744" y="122" text-anchor="end">‏تاریخی دور‏</text><text class="small" x="744" y="146" text-anchor="end">‏زمانی بنیاد‏</text><text class="cell" x="584" y="122" text-anchor="end">‏ہجرت سے پہلے نازل ہوئیں‏</text><text class="cell" x="584" y="146" text-anchor="end">‏(610 تا 622 عیسوی، 13 سال)‏</text><text class="cell" x="298" y="122" text-anchor="end">‏ہجرت کے بعد نازل ہوئیں‏</text><text class="cell" x="298" y="146" text-anchor="end">‏(622 تا 632 عیسوی، 10 سال)‏</text><rect class="panel" x="596" y="166" width="160" height="74"/><rect class="bg" x="310" y="166" width="286" height="74"/><rect class="thin" x="310" y="166" width="286" height="74"/><rect class="bg" x="24" y="166" width="286" height="74"/><rect class="thin" x="24" y="166" width="286" height="74"/><text class="body" x="744" y="196" text-anchor="end">‏بنیادی موضوعات‏</text><text class="small" x="744" y="220" text-anchor="end">‏اصل پیغام‏</text><text class="cell" x="584" y="196" text-anchor="end">‏توحید، آخرت، رسالت اور‏</text><text class="cell" x="584" y="220" text-anchor="end">‏مظالم پر اخلاقی استقامت‏</text><text class="cell" x="298" y="196" text-anchor="end">‏معاشرتی احکام، عائلی قوانین،‏</text><text class="cell" x="298" y="220" text-anchor="end">‏عبادات اور اجتماعی نظام‏</text><rect class="panel" x="596" y="240" width="160" height="74"/><rect class="bg" x="310" y="240" width="286" height="74"/><rect class="thin" x="310" y="240" width="286" height="74"/><rect class="bg" x="24" y="240" width="286" height="74"/><rect class="thin" x="24" y="240" width="286" height="74"/><text class="body" x="744" y="270" text-anchor="end">‏اسلوب اور طوالت‏</text><text class="small" x="744" y="294" text-anchor="end">‏بیانی ساخت‏</text><text class="cell" x="584" y="270" text-anchor="end">‏مختصر، پرتاثیر اور آہنگ دار آیات،‏</text><text class="cell" x="584" y="294" text-anchor="end">‏کائناتی مظاہر کی قسمیں‏</text><text class="cell" x="298" y="270" text-anchor="end">‏طویل، تفصیلی اور سنجیدہ بیانات،‏</text><text class="cell" x="298" y="294" text-anchor="end">‏قوانین کی جامع وضاحت‏</text><rect class="panel" x="596" y="314" width="160" height="74"/><rect class="bg" x="310" y="314" width="286" height="74"/><rect class="thin" x="310" y="314" width="286" height="74"/><rect class="bg" x="24" y="314" width="286" height="74"/><rect class="thin" x="24" y="314" width="286" height="74"/><text class="body" x="744" y="344" text-anchor="end">‏مخاطبین کا انداز‏</text><text class="small" x="744" y="368" text-anchor="end">‏عمومی خطاب‏</text><text class="cell" x="584" y="344" text-anchor="end">‏پوری انسانیت سے خطاب:‏</text><text class="cell" x="584" y="368" text-anchor="end">‏'يَا أَيُّهَا النَّاسُ' (اے لوگو!)‏</text><text class="cell" x="298" y="344" text-anchor="end">‏اہلِ ایمان سے خطاب:‏</text><text class="cell" x="298" y="368" text-anchor="end">‏'يَا أَيُّهَا الَّذِينَ آمَنُوا'‏</text><text class="wm" x="12" y="416" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>