<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 442" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing Classical Arabic and Quranic Arabic</title><desc id="d">Table comparing Classical Arabic and Quranic Arabic on five points: scope (a whole literature of poetry, Hadith, history and grammar, against one text, the Qur'an); vocabulary (the shared Arabic word stock, against the same words often given new religious meanings); style (poetry with fixed metres and ordinary prose, against rhythm and rhyme without fixed metre); purpose (praise, pride, memory and record, against guidance and reflection); and spelling (the normal spelling of its time, against the Qur'an's own preserved spelling).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="442"/><text class="h" x="24" y="34">Classical Arabic and Quranic Arabic compared</text><rect class="panel" x="24" y="52" width="140" height="40" rx="0"/><rect class="panel" x="164" y="52" width="300" height="40" rx="0"/><rect class="panel-a" x="464" y="52" width="292" height="40" rx="0"/><text class="sh" x="36" y="77">Point</text><text class="sh" x="176" y="77">Classical Arabic</text><text class="sh" x="476" y="77">Quranic Arabic</text><rect class="panel" x="24" y="92" width="140" height="58" rx="0"/><rect class="bg" x="164" y="92" width="300" height="58" rx="0"/><rect class="panel-a" x="464" y="92" width="292" height="58" rx="0"/><rect class="thin" x="164" y="92" width="300" height="58"/><text class="sh" x="36" y="125">Scope</text><text class="body" x="176" y="117">A whole literature: poetry,</text><text class="body" x="176" y="134">Hadith, history, grammar</text><text class="body" x="476" y="117">One text: the Qur'an, at</text><text class="body" x="476" y="134">the centre of that literature</text><rect class="panel" x="24" y="150" width="140" height="58" rx="0"/><rect class="bg" x="164" y="150" width="300" height="58" rx="0"/><rect class="panel-a" x="464" y="150" width="292" height="58" rx="0"/><rect class="thin" x="164" y="150" width="300" height="58"/><text class="sh" x="36" y="183">Vocabulary</text><text class="body" x="176" y="175">The shared Arabic</text><text class="body" x="176" y="192">word stock</text><text class="body" x="476" y="175">The same words, often given</text><text class="body" x="476" y="192">new, exact religious meanings</text><rect class="panel" x="24" y="208" width="140" height="58" rx="0"/><rect class="bg" x="164" y="208" width="300" height="58" rx="0"/><rect class="panel-a" x="464" y="208" width="292" height="58" rx="0"/><rect class="thin" x="164" y="208" width="300" height="58"/><text class="sh" x="36" y="241">Style</text><text class="body" x="176" y="233">Poetry with fixed metres,</text><text class="body" x="176" y="250">and ordinary prose</text><text class="body" x="476" y="233">Rhythm and rhyme,</text><text class="body" x="476" y="250">but no fixed metre</text><rect class="panel" x="24" y="266" width="140" height="58" rx="0"/><rect class="bg" x="164" y="266" width="300" height="58" rx="0"/><rect class="panel-a" x="464" y="266" width="292" height="58" rx="0"/><rect class="thin" x="164" y="266" width="300" height="58"/><text class="sh" x="36" y="299">Purpose</text><text class="body" x="176" y="291">Praise, pride, memory</text><text class="body" x="176" y="308">and record</text><text class="body" x="476" y="291">Guidance and reflection</text><rect class="panel" x="24" y="324" width="140" height="58" rx="0"/><rect class="bg" x="164" y="324" width="300" height="58" rx="0"/><rect class="panel-a" x="464" y="324" width="292" height="58" rx="0"/><rect class="thin" x="164" y="324" width="300" height="58"/><text class="sh" x="36" y="357">Spelling</text><text class="body" x="176" y="349">The normal spelling</text><text class="body" x="176" y="366">of its time</text><text class="body" x="476" y="349">The Qur'an's own</text><text class="body" x="476" y="366">preserved spelling</text><text class="small" x="24" y="412">Quranic Arabic is part of Classical Arabic, yet distinct from it.</text><text class="wm" x="768" y="432" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
