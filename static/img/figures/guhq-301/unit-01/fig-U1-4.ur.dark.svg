<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 362" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">قرآنی لفظ سے اس کے معنی تک چار مراحل کا بہاؤ چارٹ</title><desc id="d">بہاؤ چارٹ جس میں لفظ سے اس کے معنی تک چار مراحل ہیں، ہر مرحلے کے نیچے ایک حل شدہ مثال کے ساتھ: 1، اضافی حروف ہٹا کر مادّہ تلاش کریں (کَاتِب سے مادّہ ک ت ب)؛ 2، وزن کا نام بتائیں (فَاعِل)؛ 3، مادّے کے معنی کو وزن کے معنی سے جوڑیں (لکھنا اور کام کرنے والا)؛ 4، آیت میں معنی جانچیں (لکھنے والا، جیسا کہ 2:282 میں)۔ مرحلہ 4 سے مرحلہ 1 تک واپسی کا تیر دکھاتا ہے کہ اگر معنی آیت میں نہ بیٹھے تو قاری دوبارہ دیکھتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="362"/><text class="h" x="756" y="34" text-anchor="end">‏مادّے سے لفظ اور لفظ سے معنی تک‏</text><rect class="panel" x="591" y="56" width="165" height="210" rx="8"/><text class="small" x="744" y="80" text-anchor="end">‏مرحلہ 1‏</text><text class="sh" x="744" y="106" text-anchor="end">‏مادّہ تلاش کریں‏</text><text class="cell" x="744" y="134" text-anchor="end">‏وزن کے اضافی حروف‏</text><text class="cell" x="744" y="156" text-anchor="end">‏ہٹا دیں‏</text><rect class="panel-a" x="599" y="176" width="149" height="76" rx="6"/><text class="small" x="738" y="196" text-anchor="end">‏مثال‏</text><text class="cell" x="738" y="219" text-anchor="end">‏کَاتِب ← ک ت ب‏</text><text class="cell" x="738" y="242" text-anchor="end">‏(لکھنا)‏</text><rect class="panel" x="402" y="56" width="165" height="210" rx="8"/><text class="small" x="555" y="80" text-anchor="end">‏مرحلہ 2‏</text><text class="sh" x="555" y="106" text-anchor="end">‏وزن کا نام بتائیں‏</text><text class="cell" x="555" y="134" text-anchor="end">‏حرکات اور حروف کا‏</text><text class="cell" x="555" y="156" text-anchor="end">‏کون سا سانچا؟‏</text><rect class="panel-a" x="410" y="176" width="149" height="76" rx="6"/><text class="small" x="549" y="196" text-anchor="end">‏مثال‏</text><text class="cell" x="549" y="219" text-anchor="end">‏فَاعِل‏</text><text class="cell" x="549" y="242" text-anchor="end">‏(کام کرنے والا)‏</text><rect class="panel" x="213" y="56" width="165" height="210" rx="8"/><text class="small" x="366" y="80" text-anchor="end">‏مرحلہ 3‏</text><text class="sh" x="366" y="106" text-anchor="end">‏معنی جوڑیں‏</text><text class="cell" x="366" y="134" text-anchor="end">‏مادّے کا معنی اور‏</text><text class="cell" x="366" y="156" text-anchor="end">‏وزن کا معنی‏</text><rect class="panel-a" x="221" y="176" width="149" height="76" rx="6"/><text class="small" x="360" y="196" text-anchor="end">‏مثال‏</text><text class="cell" x="360" y="219" text-anchor="end">‏لکھنا + کرنے والا‏</text><text class="cell" x="360" y="242" text-anchor="end">‏مل کر: لکھنے والا‏</text><rect class="panel" x="24" y="56" width="165" height="210" rx="8"/><text class="small" x="177" y="80" text-anchor="end">‏مرحلہ 4‏</text><text class="sh" x="177" y="106" text-anchor="end">‏آیت میں جانچیں‏</text><text class="cell" x="177" y="134" text-anchor="end">‏کیا یہ آیت کے مفہوم‏</text><text class="cell" x="177" y="156" text-anchor="end">‏میں ٹھیک بیٹھتا ہے؟‏</text><rect class="panel-a" x="32" y="176" width="149" height="76" rx="6"/><text class="small" x="171" y="196" text-anchor="end">‏مثال‏</text><text class="cell" x="171" y="219" text-anchor="end">‏آیت 2:282 میں قرض‏</text><text class="cell" x="171" y="242" text-anchor="end">‏لکھنے والا کاتب‏</text><line class="stroke" x1="589" y1="161.0" x2="569" y2="161.0" marker-end="url(#arrow)"/><line class="stroke" x1="400" y1="161.0" x2="380" y2="161.0" marker-end="url(#arrow)"/><line class="stroke" x1="211" y1="161.0" x2="191" y2="161.0" marker-end="url(#arrow)"/><path class="dash" d="M106.5,268 L106.5,306 L673.5,306 L673.5,272" marker-end="url(#arrowm)"/><text class="small" x="390" y="330" text-anchor="middle">‏معنی آیت میں نہیں بیٹھتا؟ مرحلہ 1 پر واپس جائیں۔‏</text><text class="wm" x="12" y="352" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>