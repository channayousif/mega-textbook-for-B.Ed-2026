<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 362" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of four steps from a Qur'anic word to its meaning</title><desc id="d">Flowchart of four steps from a word to its meaning, with a worked example under each step: 1, find the root by removing the extra letters (from kātib, the root k-t-b); 2, name the pattern (fāʿil); 3, join the root meaning to the pattern meaning (writing plus the one who does it); 4, check the meaning in the verse (a writer, as in 2:282). A return arrow from step 4 to step 1 shows that if the meaning does not fit the verse, the reader looks again.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="362"/><text class="h" x="24" y="34">From root to word to meaning</text><rect class="panel" x="24" y="56" width="165" height="210" rx="8"/><text class="small" x="36" y="80">Step 1</text><text class="sh" x="36" y="102">Find the root</text><text class="cell" x="36" y="128">Remove the extra</text><text class="cell" x="36" y="145">pattern letters</text><rect class="panel-a" x="32" y="176" width="149" height="76" rx="6"/><text class="small" x="42" y="196">Example</text><text class="cell" x="42" y="218">kātib → k-t-b</text><text class="cell" x="42" y="235">(writing)</text><line class="stroke" x1="191" y1="161.0" x2="211" y2="161.0" marker-end="url(#arrow)"/><rect class="panel" x="213" y="56" width="165" height="210" rx="8"/><text class="small" x="225" y="80">Step 2</text><text class="sh" x="225" y="102">Name the pattern</text><text class="cell" x="225" y="128">Which frame of</text><text class="cell" x="225" y="145">vowels and letters?</text><rect class="panel-a" x="221" y="176" width="149" height="76" rx="6"/><text class="small" x="231" y="196">Example</text><text class="cell" x="231" y="218">fāʿil</text><text class="cell" x="231" y="235">(the one who does)</text><line class="stroke" x1="380" y1="161.0" x2="400" y2="161.0" marker-end="url(#arrow)"/><rect class="panel" x="402" y="56" width="165" height="210" rx="8"/><text class="small" x="414" y="80">Step 3</text><text class="sh" x="414" y="102">Join the meanings</text><text class="cell" x="414" y="128">Root meaning plus</text><text class="cell" x="414" y="145">pattern meaning</text><rect class="panel-a" x="410" y="176" width="149" height="76" rx="6"/><text class="small" x="420" y="196">Example</text><text class="cell" x="420" y="218">writing + doer</text><text class="cell" x="420" y="235">= a writer</text><line class="stroke" x1="569" y1="161.0" x2="589" y2="161.0" marker-end="url(#arrow)"/><rect class="panel" x="591" y="56" width="165" height="210" rx="8"/><text class="small" x="603" y="80">Step 4</text><text class="sh" x="603" y="102">Check the verse</text><text class="cell" x="603" y="128">Does it fit the</text><text class="cell" x="603" y="145">sense of the verse?</text><rect class="panel-a" x="599" y="176" width="149" height="76" rx="6"/><text class="small" x="609" y="196">Example</text><text class="cell" x="609" y="218">2:282: a scribe</text><text class="cell" x="609" y="235">who records a debt</text><path class="dash" d="M673.5,268 L673.5,306 L106.5,306 L106.5,272" marker-end="url(#arrowm)"/><text class="small" x="390" y="328" text-anchor="middle">Meaning does not fit the verse? Go back to Step 1.</text><text class="wm" x="768" y="352" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
