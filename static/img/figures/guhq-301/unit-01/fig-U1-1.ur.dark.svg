<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 442" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">کلاسیکی عربی اور قرآنی عربی کا موازنہ کرنے والا جدول</title><desc id="d">جدول جو کلاسیکی عربی اور قرآنی عربی کا پانچ نکات پر موازنہ کرتا ہے: دائرہ (شاعری، حدیث، تاریخ اور قواعد کا پورا ادب، بمقابلہ ایک متن، یعنی قرآن)؛ ذخیرۂ الفاظ (مشترک عربی ذخیرۂ الفاظ، بمقابلہ وہی الفاظ جنہیں اکثر نئے دینی معنی دیے گئے)؛ اسلوب (مقررہ اوزان والی شاعری اور عام نثر، بمقابلہ آہنگ اور قافیہ مگر کوئی مقررہ وزن نہیں)؛ مقصد (مدح، فخر، یاد اور ریکارڈ، بمقابلہ ہدایت اور غور و فکر)؛ اور املا (اپنے زمانے کا عام املا، بمقابلہ قرآن کا اپنا محفوظ املا)۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="442"/><text class="h" x="756" y="34" text-anchor="end">‏کلاسیکی عربی اور قرآنی عربی کا موازنہ‏</text><rect class="panel" x="616" y="52" width="140" height="40" rx="0"/><rect class="panel" x="316" y="52" width="300" height="40" rx="0"/><rect class="panel-a" x="24" y="52" width="292" height="40" rx="0"/><text class="sh" x="744" y="78" text-anchor="end">‏نکتہ‏</text><text class="sh" x="604" y="78" text-anchor="end">‏کلاسیکی عربی‏</text><text class="sh" x="304" y="78" text-anchor="end">‏قرآنی عربی‏</text><rect class="panel" x="616" y="92" width="140" height="58" rx="0"/><rect class="bg" x="316" y="92" width="300" height="58" rx="0"/><rect class="panel-a" x="24" y="92" width="292" height="58" rx="0"/><rect class="thin" x="316" y="92" width="300" height="58"/><text class="sh" x="744" y="127" text-anchor="end">‏دائرہ‏</text><text class="body" x="604" y="116" text-anchor="end">‏ایک پورا ادب: شاعری،‏</text><text class="body" x="604" y="138" text-anchor="end">‏حدیث، تاریخ، قواعد‏</text><text class="body" x="304" y="116" text-anchor="end">‏ایک متن: قرآن، جو‏</text><text class="body" x="304" y="138" text-anchor="end">‏اس ادب کے مرکز میں ہے‏</text><rect class="panel" x="616" y="150" width="140" height="58" rx="0"/><rect class="bg" x="316" y="150" width="300" height="58" rx="0"/><rect class="panel-a" x="24" y="150" width="292" height="58" rx="0"/><rect class="thin" x="316" y="150" width="300" height="58"/><text class="sh" x="744" y="185" text-anchor="end">‏ذخیرۂ الفاظ‏</text><text class="body" x="604" y="185" text-anchor="end">‏مشترک عربی ذخیرۂ الفاظ‏</text><text class="body" x="304" y="174" text-anchor="end">‏وہی الفاظ، اکثر نئے اور‏</text><text class="body" x="304" y="196" text-anchor="end">‏واضح دینی معنی کے ساتھ‏</text><rect class="panel" x="616" y="208" width="140" height="58" rx="0"/><rect class="bg" x="316" y="208" width="300" height="58" rx="0"/><rect class="panel-a" x="24" y="208" width="292" height="58" rx="0"/><rect class="thin" x="316" y="208" width="300" height="58"/><text class="sh" x="744" y="243" text-anchor="end">‏اسلوب‏</text><text class="body" x="604" y="232" text-anchor="end">‏مقررہ اوزان والی شاعری،‏</text><text class="body" x="604" y="254" text-anchor="end">‏اور عام نثر‏</text><text class="body" x="304" y="232" text-anchor="end">‏آہنگ اور قافیہ،‏</text><text class="body" x="304" y="254" text-anchor="end">‏مگر کوئی مقررہ وزن نہیں‏</text><rect class="panel" x="616" y="266" width="140" height="58" rx="0"/><rect class="bg" x="316" y="266" width="300" height="58" rx="0"/><rect class="panel-a" x="24" y="266" width="292" height="58" rx="0"/><rect class="thin" x="316" y="266" width="300" height="58"/><text class="sh" x="744" y="301" text-anchor="end">‏مقصد‏</text><text class="body" x="604" y="301" text-anchor="end">‏مدح، فخر، یاد اور ریکارڈ‏</text><text class="body" x="304" y="301" text-anchor="end">‏ہدایت اور غور و فکر‏</text><rect class="panel" x="616" y="324" width="140" height="58" rx="0"/><rect class="bg" x="316" y="324" width="300" height="58" rx="0"/><rect class="panel-a" x="24" y="324" width="292" height="58" rx="0"/><rect class="thin" x="316" y="324" width="300" height="58"/><text class="sh" x="744" y="359" text-anchor="end">‏املا‏</text><text class="body" x="604" y="359" text-anchor="end">‏اپنے زمانے کا عام املا‏</text><text class="body" x="304" y="359" text-anchor="end">‏قرآن کا اپنا محفوظ املا‏</text><text class="small" x="756" y="412" text-anchor="end">‏قرآنی عربی کلاسیکی عربی کا حصہ ہے، پھر بھی اس سے ممتاز ہے۔‏</text><text class="wm" x="12" y="432" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>