<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the root ʿ-l-m and six Qur'anic words built on it</title><desc id="d">Diagram of one root growing into a family of words: the root letters ع ل م (ʿ-l-m, knowing) sit at the centre, and branches lead to six Qur'anic words built on it, each with its pattern and meaning: ʿalima (he knew), ʿallama (he taught), ʿilm (knowledge), ʿālim (one who knows), ʿalīm (all-knowing) and maʿlūm (known).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="492"/><text class="h" x="24" y="34">One root, a family of words</text><circle class="panel-a" cx="390" cy="236" r="74"/><text class="ar" x="390" y="228" text-anchor="middle">ع ل م</text><text class="sh" x="390" y="252" text-anchor="middle">root ʿ-l-m</text><text class="cell" x="390" y="270" text-anchor="middle">knowing</text><rect class="panel" x="24" y="56" width="200" height="90" rx="8"/><text class="ar" x="124" y="86" text-anchor="middle">عَلِمَ</text><text class="cell" x="124" y="110" text-anchor="middle">ʿalima · faʿala</text><text class="sh" x="124" y="130" text-anchor="middle">he knew</text><line class="thin" x1="320" y1="188.75" x2="224" y2="101.0" marker-end="url(#arrow)"/><rect class="panel" x="24" y="196" width="200" height="90" rx="8"/><text class="ar" x="124" y="226" text-anchor="middle">عَلَّمَ</text><text class="cell" x="124" y="250" text-anchor="middle">ʿallama · faʿʿala</text><text class="sh" x="124" y="270" text-anchor="middle">he taught</text><line class="thin" x1="320" y1="237.75" x2="224" y2="241.0" marker-end="url(#arrow)"/><rect class="panel" x="24" y="336" width="200" height="90" rx="8"/><text class="ar" x="124" y="366" text-anchor="middle">عِلْم</text><text class="cell" x="124" y="390" text-anchor="middle">ʿilm · fiʿl</text><text class="sh" x="124" y="410" text-anchor="middle">knowledge</text><line class="thin" x1="320" y1="286.75" x2="224" y2="381.0" marker-end="url(#arrow)"/><rect class="panel" x="556" y="56" width="200" height="90" rx="8"/><text class="ar" x="656" y="86" text-anchor="middle">عَالِم</text><text class="cell" x="656" y="110" text-anchor="middle">ʿālim · fāʿil</text><text class="sh" x="656" y="130" text-anchor="middle">one who knows</text><line class="thin" x1="460" y1="188.75" x2="556" y2="101.0" marker-end="url(#arrow)"/><rect class="panel" x="556" y="196" width="200" height="90" rx="8"/><text class="ar" x="656" y="226" text-anchor="middle">عَلِيم</text><text class="cell" x="656" y="250" text-anchor="middle">ʿalīm · faʿīl</text><text class="sh" x="656" y="270" text-anchor="middle">all-knowing</text><line class="thin" x1="460" y1="237.75" x2="556" y2="241.0" marker-end="url(#arrow)"/><rect class="panel" x="556" y="336" width="200" height="90" rx="8"/><text class="ar" x="656" y="366" text-anchor="middle">مَعْلُوم</text><text class="cell" x="656" y="390" text-anchor="middle">maʿlūm · mafʿūl</text><text class="sh" x="656" y="410" text-anchor="middle">known</text><line class="thin" x1="460" y1="286.75" x2="556" y2="381.0" marker-end="url(#arrow)"/><text class="small" x="24" y="466">Each word: the Arabic, its pattern, and its meaning. The pattern adds to the core idea.</text><text class="wm" x="768" y="482" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
