<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 492" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">مادّہ ع ل م اور اس پر بنے چھ قرآنی الفاظ کا خاکہ</title><desc id="d">خاکہ جس میں ایک مادّہ الفاظ کے ایک خاندان میں پھیلتا ہے: مرکز میں مادّے کے حروف ع ل م (جاننا) ہیں، اور ان سے شاخیں اس پر بنے چھ قرآنی الفاظ تک جاتی ہیں، ہر ایک اپنے وزن اور معنی کے ساتھ: عَلِمَ (اس نے جانا)، عَلَّمَ (اس نے سکھایا)، عِلْم (علم)، عَالِم (جاننے والا)، عَلِیم (سب کچھ جاننے والا) اور مَعْلُوم (جانا ہوا)۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="492"/><text class="h" x="756" y="34" text-anchor="end">‏ایک مادّہ، الفاظ کا ایک خاندان‏</text><circle class="panel-a" cx="390" cy="236" r="74"/><text class="ar" x="390" y="226" text-anchor="middle">‏ع ل م‏</text><text class="sh" x="390" y="254" text-anchor="middle">‏مادّہ‏</text><text class="cell" x="390" y="276" text-anchor="middle">‏جاننا‏</text><rect class="panel" x="556" y="56" width="200" height="90" rx="8"/><text class="ar" x="656" y="84" text-anchor="middle">‏عَلِمَ‏</text><text class="cell" x="656" y="108" text-anchor="middle">‏وزن: فَعَلَ‏</text><text class="sh" x="656" y="132" text-anchor="middle">‏اس نے جانا‏</text><line class="thin" x1="460" y1="188.75" x2="556" y2="101.0" marker-end="url(#arrow)"/><rect class="panel" x="24" y="56" width="200" height="90" rx="8"/><text class="ar" x="124" y="84" text-anchor="middle">‏عَالِم‏</text><text class="cell" x="124" y="108" text-anchor="middle">‏وزن: فَاعِل‏</text><text class="sh" x="124" y="132" text-anchor="middle">‏جاننے والا‏</text><line class="thin" x1="320" y1="188.75" x2="224" y2="101.0" marker-end="url(#arrow)"/><rect class="panel" x="556" y="196" width="200" height="90" rx="8"/><text class="ar" x="656" y="224" text-anchor="middle">‏عَلَّمَ‏</text><text class="cell" x="656" y="248" text-anchor="middle">‏وزن: فَعَّلَ‏</text><text class="sh" x="656" y="272" text-anchor="middle">‏اس نے سکھایا‏</text><line class="thin" x1="460" y1="237.75" x2="556" y2="241.0" marker-end="url(#arrow)"/><rect class="panel" x="24" y="196" width="200" height="90" rx="8"/><text class="ar" x="124" y="224" text-anchor="middle">‏عَلِيم‏</text><text class="cell" x="124" y="248" text-anchor="middle">‏وزن: فَعِیل‏</text><text class="sh" x="124" y="272" text-anchor="middle">‏سب کچھ جاننے والا‏</text><line class="thin" x1="320" y1="237.75" x2="224" y2="241.0" marker-end="url(#arrow)"/><rect class="panel" x="556" y="336" width="200" height="90" rx="8"/><text class="ar" x="656" y="364" text-anchor="middle">‏عِلْم‏</text><text class="cell" x="656" y="388" text-anchor="middle">‏وزن: فِعْل‏</text><text class="sh" x="656" y="412" text-anchor="middle">‏علم‏</text><line class="thin" x1="460" y1="286.75" x2="556" y2="381.0" marker-end="url(#arrow)"/><rect class="panel" x="24" y="336" width="200" height="90" rx="8"/><text class="ar" x="124" y="364" text-anchor="middle">‏مَعْلُوم‏</text><text class="cell" x="124" y="388" text-anchor="middle">‏وزن: مَفْعُول‏</text><text class="sh" x="124" y="412" text-anchor="middle">‏جانا ہوا‏</text><line class="thin" x1="320" y1="286.75" x2="224" y2="381.0" marker-end="url(#arrow)"/><text class="small" x="756" y="466" text-anchor="end">‏ہر لفظ: عربی، اس کا وزن اور اس کا معنی۔ وزن بنیادی تصور میں اضافہ کرتا ہے۔‏</text><text class="wm" x="12" y="482" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>