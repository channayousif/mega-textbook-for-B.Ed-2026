<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 446" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">قرآن کو اس کی اپنی زبان میں سمجھنے کی چار وجوہات کا تصوری نقشہ</title><desc id="d">تصوری نقشہ جس کے مرکز میں سوال ہے: 'قرآن کو اس کی اپنی زبان میں کیوں سمجھیں؟' اور اس سے چار وجوہات جڑی ہیں: ہدایت، کیونکہ قرآن خود کو ہدایت کہتا ہے (2:2)؛ نماز، کیونکہ ہم اسے ہر رکعت میں پڑھتے ہیں (1:5)؛ غور و فکر، کیونکہ یہ قاریوں سے اپنی آیات پر غور کرنے کو کہتا ہے (38:29، 47:24)؛ اور تدریس، کیونکہ شاگرد اپنے اساتذہ سے اس کا مطلب پوچھتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="446"/><text class="h" x="756" y="34" text-anchor="end">‏قرآن کو اس کی اپنی زبان میں کیوں سمجھیں؟‏</text><ellipse class="panel-a" cx="390" cy="225" rx="120" ry="46"/><text class="sh" x="390" y="217" text-anchor="middle">‏قرآن کو کیوں‏</text><text class="sh" x="390" y="243" text-anchor="middle">‏سمجھیں؟‏</text><rect class="panel" x="536" y="60" width="220" height="86" rx="8"/><text class="h" x="744" y="86" text-anchor="end">‏ہدایت‏</text><text class="cell" x="744" y="112" text-anchor="end">‏اللہ کا شعور رکھنے والوں‏</text><text class="cell" x="744" y="134" text-anchor="end">‏کے لیے ہدایت (2:2)‏</text><rect class="panel" x="24" y="60" width="220" height="86" rx="8"/><text class="h" x="232" y="86" text-anchor="end">‏نماز‏</text><text class="cell" x="232" y="112" text-anchor="end">‏ہر رکعت میں پڑھی جاتی ہے:‏</text><text class="cell" x="232" y="134" text-anchor="end">‏ہم تیری ہی عبادت کرتے ہیں (1:5)‏</text><rect class="panel" x="536" y="300" width="220" height="86" rx="8"/><text class="h" x="744" y="326" text-anchor="end">‏غور و فکر‏</text><text class="cell" x="744" y="352" text-anchor="end">‏تاکہ وہ اس کی آیات پر غور‏</text><text class="cell" x="744" y="374" text-anchor="end">‏کریں (38:29، 47:24)‏</text><rect class="panel" x="24" y="300" width="220" height="86" rx="8"/><text class="h" x="232" y="326" text-anchor="end">‏تدریس‏</text><text class="cell" x="232" y="352" text-anchor="end">‏شاگرد اپنے اساتذہ سے‏</text><text class="cell" x="232" y="374" text-anchor="end">‏الفاظ کا مطلب پوچھتے ہیں‏</text><line class="thin" x1="244" y1="120" x2="300" y2="192" marker-end="url(#arrow)"/><line class="thin" x1="536" y1="120" x2="480" y2="192" marker-end="url(#arrow)"/><line class="thin" x1="244" y1="330" x2="300" y2="258" marker-end="url(#arrow)"/><line class="thin" x1="536" y1="330" x2="480" y2="258" marker-end="url(#arrow)"/><text class="small" x="756" y="420" text-anchor="end">‏ہر وجہ کے لیے قاری کا یہ جاننا ضروری ہے کہ الفاظ کیا کہتے ہیں۔‏</text><text class="wm" x="12" y="436" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>