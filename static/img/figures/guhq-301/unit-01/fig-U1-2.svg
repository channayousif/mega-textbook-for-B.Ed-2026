<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of four reasons for understanding the Qur'an in its own language</title><desc id="d">Concept map with the question 'Why understand the Qur'an in its own language?' at the centre and four linked reasons: guidance, because the Qur'an calls itself a guidance (2:2); prayer, because we recite it in every rak'ah (1:5); reflection, because it asks readers to reflect on its verses (38:29, 47:24); and teaching, because pupils ask their teachers what it means.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.dash { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
.ahm { fill: var(--muted); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrowm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahm"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="446"/><text class="h" x="24" y="34">Why understand the Qur'an in its own language?</text><ellipse class="panel-a" cx="390" cy="225" rx="120" ry="46"/><text class="sh" x="390" y="221" text-anchor="middle">Why understand</text><text class="sh" x="390" y="240" text-anchor="middle">the Qur'an?</text><rect class="panel" x="24" y="60" width="220" height="86" rx="8"/><text class="h" x="36" y="84">Guidance</text><text class="cell" x="36" y="108">"a guidance for those</text><text class="cell" x="36" y="125">conscious of Allah" (2:2)</text><rect class="panel" x="536" y="60" width="220" height="86" rx="8"/><text class="h" x="548" y="84">Prayer</text><text class="cell" x="548" y="108">recited in every rak'ah:</text><text class="cell" x="548" y="125">"It is You we worship" (1:5)</text><rect class="panel" x="24" y="300" width="220" height="86" rx="8"/><text class="h" x="36" y="324">Reflection</text><text class="cell" x="36" y="348">"that they might reflect</text><text class="cell" x="36" y="365">upon its verses" (38:29, 47:24)</text><rect class="panel" x="536" y="300" width="220" height="86" rx="8"/><text class="h" x="548" y="324">Teaching</text><text class="cell" x="548" y="348">pupils ask their teachers</text><text class="cell" x="548" y="365">what the words mean</text><line class="thin" x1="244" y1="120" x2="300" y2="192" marker-end="url(#arrow)"/><line class="thin" x1="536" y1="120" x2="480" y2="192" marker-end="url(#arrow)"/><line class="thin" x1="244" y1="330" x2="300" y2="258" marker-end="url(#arrow)"/><line class="thin" x1="536" y1="330" x2="480" y2="258" marker-end="url(#arrow)"/><text class="small" x="24" y="420">Each reason needs the reader to know what the words say.</text><text class="wm" x="768" y="436" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
