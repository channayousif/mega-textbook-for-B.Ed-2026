<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">آیت 103:1 لفظ بہ لفظ</title><desc id="d">جدول جو 103:1 کو لفظ بہ لفظ پیش کرتا ہے: وَٱلْعَصْرِ (وقت کی قسم، حرف اور مجرور اسم)، إِنَّ (بے شک، تاکید کا حرف)، ٱلْإِنسَـٰنَ (انسان، إِنَّ کا معمول اسم، منصوب)، لَفِى (میں، تاکید کا لام اور حرفِ جار)، خُسْرٍ (خسارہ، حرفِ جار کے بعد مجرور اسم)۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="756" y="34" text-anchor="end">‏آیت 103:1 لفظ بہ لفظ‏</text><rect class="panel-a" x="24" y="52" width="382" height="36"/><rect class="bg" x="406" y="52" width="180" height="36"/><rect class="thin" x="406" y="52" width="180" height="36"/><rect class="panel" x="586" y="52" width="170" height="36"/><text class="sh" x="394" y="76" text-anchor="end">‏نحوی حیثیت‏</text><text class="sh" x="574" y="76" text-anchor="end">‏معنی‏</text><text class="sh" x="744" y="76" text-anchor="end">‏لفظ‏</text><rect class="panel-a" x="24" y="88" width="382" height="56"/><rect class="bg" x="406" y="88" width="180" height="56"/><rect class="thin" x="406" y="88" width="180" height="56"/><rect class="panel" x="586" y="88" width="170" height="56"/><text class="body" x="744" y="121" text-anchor="end">‏وَٱلْعَصْرِ‏</text><text class="cell" x="574" y="121" text-anchor="end">‏وقت کی قسم‏</text><text class="cell" x="394" y="121" text-anchor="end">‏و (اور) + اَلْعَصْر (وقت)، مجرور‏</text><rect class="panel-a" x="24" y="144" width="382" height="56"/><rect class="bg" x="406" y="144" width="180" height="56"/><rect class="thin" x="406" y="144" width="180" height="56"/><rect class="panel" x="586" y="144" width="170" height="56"/><text class="body" x="744" y="177" text-anchor="end">‏إِنَّ‏</text><text class="cell" x="574" y="177" text-anchor="end">‏بے شک‏</text><text class="cell" x="394" y="177" text-anchor="end">‏تاکید کا حرف، اپنے بعد کے اسم پر عمل کرتا ہے‏</text><rect class="panel-a" x="24" y="200" width="382" height="56"/><rect class="bg" x="406" y="200" width="180" height="56"/><rect class="thin" x="406" y="200" width="180" height="56"/><rect class="panel" x="586" y="200" width="170" height="56"/><text class="body" x="744" y="233" text-anchor="end">‏ٱلْإِنسَـٰنَ‏</text><text class="cell" x="574" y="233" text-anchor="end">‏انسان‏</text><text class="cell" x="394" y="233" text-anchor="end">‏إِنَّ کا معمول اسم، منصوب‏</text><rect class="panel-a" x="24" y="256" width="382" height="56"/><rect class="bg" x="406" y="256" width="180" height="56"/><rect class="thin" x="406" y="256" width="180" height="56"/><rect class="panel" x="586" y="256" width="170" height="56"/><text class="body" x="744" y="289" text-anchor="end">‏لَفِى‏</text><text class="cell" x="574" y="289" text-anchor="end">‏میں‏</text><text class="cell" x="394" y="289" text-anchor="end">‏لام (تأکید) + فی (حرفِ جار)‏</text><rect class="panel-a" x="24" y="312" width="382" height="56"/><rect class="bg" x="406" y="312" width="180" height="56"/><rect class="thin" x="406" y="312" width="180" height="56"/><rect class="panel" x="586" y="312" width="170" height="56"/><text class="body" x="744" y="345" text-anchor="end">‏خُسْرٍ‏</text><text class="cell" x="574" y="345" text-anchor="end">‏خسارہ‏</text><text class="cell" x="394" y="345" text-anchor="end">‏حرفِ جار کے بعد مجرور اسم‏</text><text class="small" x="756" y="392" text-anchor="end">‏لفظ بہ لفظ مسودہ: اور وقت، بے شک انسان خسارے میں ہے۔‏</text><text class="wm" x="12" y="410" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
