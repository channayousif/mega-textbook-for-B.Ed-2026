<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Word-by-word and meaning-based translation of 103:1-3</title><desc id="d">Table comparing a word-by-word and a meaning-based translation of verses 103:1-3 in two columns. The word-by-word column keeps the Arabic order and reads awkwardly; the meaning-based column renders the same verses as natural English.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="350"/><text class="h" x="24" y="34">Word-by-word and meaning-based translation of 103:1-3</text><rect class="panel" x="24" y="52" width="70" height="36"/><rect class="bg" x="94" y="52" width="330" height="36"/><rect class="thin" x="94" y="52" width="330" height="36"/><rect class="panel-a" x="424" y="52" width="332" height="36"/><text class="sh" x="36" y="76">Verse</text><text class="sh" x="106" y="76">Word-by-word</text><text class="sh" x="436" y="76">Meaning-based</text><rect class="panel" x="24" y="88" width="70" height="56"/><rect class="bg" x="94" y="88" width="330" height="56"/><rect class="thin" x="94" y="88" width="330" height="56"/><rect class="panel-a" x="424" y="88" width="332" height="56"/><text class="sh" x="36" y="121">103:1</text><text class="cell" x="106" y="114">And the time, indeed</text><text class="cell" x="436" y="114">By time, indeed</text><rect class="panel" x="24" y="144" width="70" height="56"/><rect class="bg" x="94" y="144" width="330" height="56"/><rect class="thin" x="94" y="144" width="330" height="56"/><rect class="panel-a" x="424" y="144" width="332" height="56"/><text class="sh" x="36" y="177">103:2</text><text class="cell" x="106" y="169">the mankind is in loss</text><text class="cell" x="436" y="169">mankind is in loss</text><rect class="panel" x="24" y="200" width="70" height="96"/><rect class="bg" x="94" y="200" width="330" height="96"/><rect class="thin" x="94" y="200" width="330" height="96"/><rect class="panel-a" x="424" y="200" width="332" height="96"/><text class="sh" x="36" y="233">103:3</text><text class="cell" x="106" y="224">except those who believed and did</text><text class="cell" x="106" y="241">the righteous deeds and advised each</text><text class="cell" x="106" y="258">other with the truth and with patience</text><text class="cell" x="436" y="224">except for those who have believed</text><text class="cell" x="436" y="241">and done righteous deeds and advised</text><text class="cell" x="436" y="258">each other to truth and to patience</text><text class="small" x="24" y="322">The meaning-based column keeps the message; the word-by-word column keeps the order.</text><text class="wm" x="768" y="340" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
