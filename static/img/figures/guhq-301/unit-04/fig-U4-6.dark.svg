<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Selected short surahs: theme and key words</title><desc id="d">Table of ten selected short surahs (105 to 114) with each surah's main theme and its key words.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="24" y="34">Selected short surahs: theme and key words</text><rect class="panel" x="24" y="52" width="150" height="34"/><rect class="bg" x="174" y="52" width="290" height="34"/><rect class="thin" x="174" y="52" width="290" height="34"/><rect class="panel-a" x="464" y="52" width="292" height="34"/><text class="sh" x="36" y="74">Surah</text><text class="sh" x="186" y="74">Main theme</text><text class="sh" x="476" y="74">Key words</text><rect class="panel" x="24" y="86" width="150" height="36"/><rect class="bg" x="174" y="86" width="290" height="36"/><rect class="thin" x="174" y="86" width="290" height="36"/><rect class="panel-a" x="464" y="86" width="292" height="36"/><text class="sh" x="36" y="109">105 al-Fil</text><text class="cell" x="186" y="109">God's protection of the Ka'bah</text><text class="cell" x="476" y="109">ashāb al-fīl, ṭayr abābīl, ḥijāra</text><rect class="panel" x="24" y="122" width="150" height="36"/><rect class="bg" x="174" y="122" width="290" height="36"/><rect class="thin" x="174" y="122" width="290" height="36"/><rect class="panel-a" x="464" y="122" width="292" height="36"/><text class="sh" x="36" y="145">106 al-Quraysh</text><text class="cell" x="186" y="145">The security of the Quraysh</text><text class="cell" x="476" y="145">īlāf, riblat al-shitā, al-bayt</text><rect class="panel" x="24" y="158" width="150" height="36"/><rect class="bg" x="174" y="158" width="290" height="36"/><rect class="thin" x="174" y="158" width="290" height="36"/><rect class="panel-a" x="464" y="158" width="292" height="36"/><text class="sh" x="36" y="181">107 al-Maʿūn</text><text class="cell" x="186" y="181">Warning about the Day of Recompense</text><text class="cell" x="476" y="181">al-dīn, al-yatīm, al-miskīn</text><rect class="panel" x="24" y="194" width="150" height="36"/><rect class="bg" x="174" y="194" width="290" height="36"/><rect class="thin" x="174" y="194" width="290" height="36"/><rect class="panel-a" x="464" y="194" width="292" height="36"/><text class="sh" x="36" y="217">108 al-Kawthar</text><text class="cell" x="186" y="217">Gratitude and hope</text><text class="cell" x="476" y="217">al-Kawthar, ṣallī, nḥar, abtar</text><rect class="panel" x="24" y="230" width="150" height="36"/><rect class="bg" x="174" y="230" width="290" height="36"/><rect class="thin" x="174" y="230" width="290" height="36"/><rect class="panel-a" x="464" y="230" width="292" height="36"/><text class="sh" x="36" y="253">109 al-Kāfirūn</text><text class="cell" x="186" y="253">The clarity of faith and tolerance</text><text class="cell" x="476" y="253">lā aʿbudu, dīn, lakum dīn</text><rect class="panel" x="24" y="266" width="150" height="36"/><rect class="bg" x="174" y="266" width="290" height="36"/><rect class="thin" x="174" y="266" width="290" height="36"/><rect class="panel-a" x="464" y="266" width="292" height="36"/><text class="sh" x="36" y="289">110 an-Naṣr</text><text class="cell" x="186" y="289">Victory and the call to praise</text><text class="cell" x="476" y="289">naṣr, fatḥ, sabḥ, istighfār</text><rect class="panel" x="24" y="302" width="150" height="36"/><rect class="bg" x="174" y="302" width="290" height="36"/><rect class="thin" x="174" y="302" width="290" height="36"/><rect class="panel-a" x="464" y="302" width="292" height="36"/><text class="sh" x="36" y="325">111 al-Masad</text><text class="cell" x="186" y="325">The ruin of the Prophet's enemy</text><text class="cell" x="476" y="325">abū lahab, masad, ḥaṭab</text><rect class="panel" x="24" y="338" width="150" height="36"/><rect class="bg" x="174" y="338" width="290" height="36"/><rect class="thin" x="174" y="338" width="290" height="36"/><rect class="panel-a" x="464" y="338" width="292" height="36"/><text class="sh" x="36" y="361">112 al-Ikhlāṣ</text><text class="cell" x="186" y="361">The oneness of God</text><text class="cell" x="476" y="361">aḥad, aṣ-ṣamad, yalid, kufūw</text><rect class="panel" x="24" y="374" width="150" height="36"/><rect class="bg" x="174" y="374" width="290" height="36"/><rect class="thin" x="174" y="374" width="290" height="36"/><rect class="panel-a" x="464" y="374" width="292" height="36"/><text class="sh" x="36" y="397">113 al-Falaq</text><text class="cell" x="186" y="397">Seeking refuge in God</text><text class="cell" x="476" y="397">aʿūdhu, al-falaq, wa-min sharri</text><rect class="panel" x="24" y="410" width="150" height="36"/><rect class="bg" x="174" y="410" width="290" height="36"/><rect class="thin" x="174" y="410" width="290" height="36"/><rect class="panel-a" x="464" y="410" width="292" height="36"/><text class="sh" x="36" y="433">114 an-Nās</text><text class="cell" x="186" y="433">Seeking refuge from the whisperer</text><text class="cell" x="476" y="433">rabbin-nās, malik, waswās, khannās</text><text class="small" x="24" y="472">Each surah is one or two ruku'; read it as one unit and state its theme in one sentence.</text><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
