<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of five steps for word-by-word translation</title><desc id="d">Flowchart of five steps for translating a verse word by word: read the verse aloud with correct pronunciation; split it into its words; look up each word's meaning and grammar; keep the Arabic order and give a first rendering; then check the rendering against the verse and adjust the order where English or Urdu needs it. A worked example under each step uses verse 103:1.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="24" y="34">Five steps for translating a verse word by word</text><rect class="panel" x="40" y="52" width="700" height="80" rx="8"/><text class="h" x="56" y="80">1. Read</text><text class="body" x="56" y="104">Read 103:1 aloud, placing each letter.</text><line class="thin" x1="390" y1="132" x2="390" y2="142" marker-end="url(#arrow)"/><rect class="panel" x="40" y="142" width="700" height="80" rx="8"/><text class="h" x="56" y="170">2. Split</text><text class="body" x="56" y="194">Five words: wa-l-'asri, inna, al-insana, la-fi, khusrin.</text><line class="thin" x1="390" y1="222" x2="390" y2="232" marker-end="url(#arrow)"/><rect class="panel" x="40" y="232" width="700" height="80" rx="8"/><text class="h" x="56" y="260">3. Look up</text><text class="body" x="56" y="284">wa-l-'asri: by the time; inna: indeed; khusrin: loss.</text><line class="thin" x1="390" y1="312" x2="390" y2="322" marker-end="url(#arrow)"/><rect class="panel" x="40" y="322" width="700" height="80" rx="8"/><text class="h" x="56" y="350">4. Order</text><text class="body" x="56" y="374">First draft: And the time, indeed mankind is in loss.</text><line class="thin" x1="390" y1="402" x2="390" y2="412" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="412" width="700" height="80" rx="8"/><text class="h" x="56" y="440">5. Check</text><text class="body" x="56" y="464">Adjust: By time, indeed mankind is in loss.</text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
