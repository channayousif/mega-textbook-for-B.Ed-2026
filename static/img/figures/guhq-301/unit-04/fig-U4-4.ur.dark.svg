<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">سورۃ الفلق کی آیات کس طرح جڑتی ہیں</title><desc id="d">خاکہ جو دکھاتا ہے کہ سورۃ الفلق (113:1-5) کی آیات کس طرح جڑتی ہیں: آیت 1 صبح کے رب کی پناہ مانگتی ہے، اور آیات 2 سے 5 میں سے ہر ایک مشترک عبارت وَمِن شَرِّ (اور ... کی برائی سے) سے شروع ہوتی ہے، جو فہرست کی ہر برائی کو آیت 1 میں مانگی گئی پناہ سے جوڑ دیتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="756" y="30" text-anchor="end">‏سورۃ الفلق کی آیات کس طرح جڑتی ہیں‏</text><rect class="panel-a" x="70" y="52" width="640" height="60" rx="8"/><text class="body" x="694" y="88" text-anchor="end">‏113:1 - کہو، میں صبح کے رب کی پناہ مانگتا ہوں‏</text><line class="thin" x1="390" y1="112" x2="390" y2="140" marker-end="url(#arrow)"/><rect class="panel" x="70" y="140" width="640" height="60" rx="8"/><text class="body" x="694" y="176" text-anchor="end">‏113:2 - وَمِن شَرِّ: اور اس چیز کی برائی سے جو اس نے پیدا کی‏</text><line class="thin" x1="390" y1="200" x2="390" y2="228" marker-end="url(#arrow)"/><rect class="panel" x="70" y="228" width="640" height="60" rx="8"/><text class="body" x="694" y="264" text-anchor="end">‏113:3 - وَمِن شَرِّ: اور اندھیرے کی برائی سے جب وہ چھا جائے‏</text><line class="thin" x1="390" y1="288" x2="390" y2="316" marker-end="url(#arrow)"/><rect class="panel" x="70" y="316" width="640" height="60" rx="8"/><text class="body" x="694" y="352" text-anchor="end">‏113:4 - وَمِن شَرِّ: اور گرہوں میں پھونکنے والوں کی برائی سے‏</text><line class="thin" x1="390" y1="376" x2="390" y2="404" marker-end="url(#arrow)"/><rect class="panel" x="70" y="404" width="640" height="60" rx="8"/><text class="body" x="694" y="440" text-anchor="end">‏113:5 - وَمِن شَرِّ: اور حسد کرنے والے کی برائی سے جب وہ حسد کرے‏</text><text class="small" x="756" y="490" text-anchor="end">‏مشترک عبارت وَمِن شَرِّ آیات 2-5 کو آیت 1 میں مانگی گئی پناہ سے جوڑتی ہے۔‏</text><text class="wm" x="12" y="530" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
