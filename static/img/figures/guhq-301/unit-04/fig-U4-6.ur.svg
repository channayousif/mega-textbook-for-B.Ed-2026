<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">منتخب مختصر سورتیں: مرکزی موضوع اور اہم الفاظ</title><desc id="d">دس منتخب مختصر سورتوں (105 سے 114) کا جدول، ہر سورت کا مرکزی موضوع اور اس کے اہم الفاظ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="500"/><text class="h" x="756" y="34" text-anchor="end">‏منتخب مختصر سورتیں: مرکزی موضوع اور اہم الفاظ‏</text><rect class="panel-a" x="24" y="52" width="292" height="34"/><rect class="bg" x="316" y="52" width="290" height="34"/><rect class="thin" x="316" y="52" width="290" height="34"/><rect class="panel" x="606" y="52" width="150" height="34"/><text class="sh" x="304" y="74" text-anchor="end">‏اہم الفاظ‏</text><text class="sh" x="594" y="74" text-anchor="end">‏مرکزی موضوع‏</text><text class="sh" x="744" y="74" text-anchor="end">‏سورت‏</text><rect class="panel-a" x="24" y="86" width="292" height="36"/><rect class="bg" x="316" y="86" width="290" height="36"/><rect class="thin" x="316" y="86" width="290" height="36"/><rect class="panel" x="606" y="86" width="150" height="36"/><text class="sh" x="744" y="109" text-anchor="end">‏105 الفیل‏</text><text class="cell" x="594" y="109" text-anchor="end">‏اللہ کا کعبہ کی حفاظت کرنا‏</text><text class="cell" x="304" y="109" text-anchor="end">‏اصحاب الفیل، طیر ابابیل، حجارہ‏</text><rect class="panel-a" x="24" y="122" width="292" height="36"/><rect class="bg" x="316" y="122" width="290" height="36"/><rect class="thin" x="316" y="122" width="290" height="36"/><rect class="panel" x="606" y="122" width="150" height="36"/><text class="sh" x="744" y="145" text-anchor="end">‏106 قریش‏</text><text class="cell" x="594" y="145" text-anchor="end">‏قریش کا امن و تحفظ‏</text><text class="cell" x="304" y="145" text-anchor="end">‏ایلاف، رحلۃ الشتاء، البیت‏</text><rect class="panel-a" x="24" y="158" width="292" height="36"/><rect class="bg" x="316" y="158" width="290" height="36"/><rect class="thin" x="316" y="158" width="290" height="36"/><rect class="panel" x="606" y="158" width="150" height="36"/><text class="sh" x="744" y="181" text-anchor="end">‏107 الماعون‏</text><text class="cell" x="594" y="181" text-anchor="end">‏روزِ جزا کے بارے میں تنبیہ‏</text><text class="cell" x="304" y="181" text-anchor="end">‏الدین، الیتیم، المسکین‏</text><rect class="panel-a" x="24" y="194" width="292" height="36"/><rect class="bg" x="316" y="194" width="290" height="36"/><rect class="thin" x="316" y="194" width="290" height="36"/><rect class="panel" x="606" y="194" width="150" height="36"/><text class="sh" x="744" y="217" text-anchor="end">‏108 الکوثر‏</text><text class="cell" x="594" y="217" text-anchor="end">‏شکر و امید‏</text><text class="cell" x="304" y="217" text-anchor="end">‏الکوثر، صَلِّ، اِنْحَرْ، الابتر‏</text><rect class="panel-a" x="24" y="230" width="292" height="36"/><rect class="bg" x="316" y="230" width="290" height="36"/><rect class="thin" x="316" y="230" width="290" height="36"/><rect class="panel" x="606" y="230" width="150" height="36"/><text class="sh" x="744" y="253" text-anchor="end">‏109 الکافرون‏</text><text class="cell" x="594" y="253" text-anchor="end">‏ایمان کی صاف حد بندی اور رواداری‏</text><text class="cell" x="304" y="253" text-anchor="end">‏لا اعبد، دین، لکم دین‏</text><rect class="panel-a" x="24" y="266" width="292" height="36"/><rect class="bg" x="316" y="266" width="290" height="36"/><rect class="thin" x="316" y="266" width="290" height="36"/><rect class="panel" x="606" y="266" width="150" height="36"/><text class="sh" x="744" y="289" text-anchor="end">‏110 النصر‏</text><text class="cell" x="594" y="289" text-anchor="end">‏فتح اور تسبیح کی دعوت‏</text><text class="cell" x="304" y="289" text-anchor="end">‏نصر، فتح، سبح، استغفار‏</text><rect class="panel-a" x="24" y="302" width="292" height="36"/><rect class="bg" x="316" y="302" width="290" height="36"/><rect class="thin" x="316" y="302" width="290" height="36"/><rect class="panel" x="606" y="302" width="150" height="36"/><text class="sh" x="744" y="325" text-anchor="end">‏111 المسد‏</text><text class="cell" x="594" y="325" text-anchor="end">‏نبی کے دشمن کی تباہی‏</text><text class="cell" x="304" y="325" text-anchor="end">‏ابو لہب، مسد، حطب‏</text><rect class="panel-a" x="24" y="338" width="292" height="36"/><rect class="bg" x="316" y="338" width="290" height="36"/><rect class="thin" x="316" y="338" width="290" height="36"/><rect class="panel" x="606" y="338" width="150" height="36"/><text class="sh" x="744" y="361" text-anchor="end">‏112 الاخلاص‏</text><text class="cell" x="594" y="361" text-anchor="end">‏اللہ کی یکتائی‏</text><text class="cell" x="304" y="361" text-anchor="end">‏احد، الصمد، یلد، کفو‏</text><rect class="panel-a" x="24" y="374" width="292" height="36"/><rect class="bg" x="316" y="374" width="290" height="36"/><rect class="thin" x="316" y="374" width="290" height="36"/><rect class="panel" x="606" y="374" width="150" height="36"/><text class="sh" x="744" y="397" text-anchor="end">‏113 الفلق‏</text><text class="cell" x="594" y="397" text-anchor="end">‏اللہ میں پناہ مانگنا‏</text><text class="cell" x="304" y="397" text-anchor="end">‏اعوذ، الفلق، ومن شر‏</text><rect class="panel-a" x="24" y="410" width="292" height="36"/><rect class="bg" x="316" y="410" width="290" height="36"/><rect class="thin" x="316" y="410" width="290" height="36"/><rect class="panel" x="606" y="410" width="150" height="36"/><text class="sh" x="744" y="433" text-anchor="end">‏114 الناس‏</text><text class="cell" x="594" y="433" text-anchor="end">‏وسوسہ ڈالنے والے سے پناہ مانگنا‏</text><text class="cell" x="304" y="433" text-anchor="end">‏رب الناس، ملک، وسواس، خناس‏</text><text class="small" x="756" y="472" text-anchor="end">‏ہر سورت ایک یا دو رکوع کی ہے؛ اسے ایک اکائی کے طور پر پڑھیں اور اس کا مرکزی موضوع ایک جملے میں کہیں۔‏</text><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
