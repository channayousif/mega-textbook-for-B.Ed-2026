<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">کسی آیت کا لفظ بہ لفظ ترجمہ کرنے کے پانچ مراحل</title><desc id="d">بہاؤ چارٹ جس میں کسی آیت کا لفظ بہ لفظ ترجمہ کرنے کے پانچ مراحل ہیں: آیت کو درست تلفظ کے ساتھ بلند آواز سے پڑھیں؛ اسے اس کے الفاظ میں تقسیم کریں؛ ہر لفظ کا معنی اور اس کی نحوی حیثیت دیکھیں؛ عربی ترتیب برقرار رکھتے ہوئے پہلا ترجمہ دیں؛ پھر اس مسودے کو آیت کے مقابلے میں جانچیں اور جہاں انگریزی یا اردو کو ضرورت ہو وہاں ترتیب بدلیں۔ ہر مرحلے کے نیچے ایک حل شدہ مثال آیت 103:1 کے ساتھ ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="520"/><text class="h" x="756" y="34" text-anchor="end">‏کسی آیت کا لفظ بہ لفظ ترجمہ: پانچ مراحل‏</text><rect class="panel" x="40" y="52" width="700" height="80" rx="8"/><text class="h" x="724" y="80" text-anchor="end">‏1. پڑھیں‏</text><text class="body" x="724" y="104" text-anchor="end">‏103:1 کو بلند آواز سے پڑھیں، ہر حرف کو اپنی جگہ دیتے ہوئے۔‏</text><line class="thin" x1="390" y1="132" x2="390" y2="142" marker-end="url(#arrow)"/><rect class="panel" x="40" y="142" width="700" height="80" rx="8"/><text class="h" x="724" y="170" text-anchor="end">‏2. تقسیم کریں‏</text><text class="body" x="724" y="194" text-anchor="end">‏پانچ الفاظ: وَٱلْعَصْرِ، إِنَّ، اَلْإِنسَانَ، لَفِى، خُسْرٍ۔‏</text><line class="thin" x1="390" y1="222" x2="390" y2="232" marker-end="url(#arrow)"/><rect class="panel" x="40" y="232" width="700" height="80" rx="8"/><text class="h" x="724" y="260" text-anchor="end">‏3. تلاش کریں‏</text><text class="body" x="724" y="284" text-anchor="end">‏وَٱلْعَصْرِ: وقت کی قسم؛ إِنَّ: بے شک؛ خُسْرٍ: خسارہ۔‏</text><line class="thin" x1="390" y1="312" x2="390" y2="322" marker-end="url(#arrow)"/><rect class="panel" x="40" y="322" width="700" height="80" rx="8"/><text class="h" x="724" y="350" text-anchor="end">‏4. ترتیب دیں‏</text><text class="body" x="724" y="374" text-anchor="end">‏پہلا مسودہ: اور وقت، بے شک انسان خسارے میں ہے۔‏</text><line class="thin" x1="390" y1="402" x2="390" y2="412" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="412" width="700" height="80" rx="8"/><text class="h" x="724" y="440" text-anchor="end">‏5. جانچیں‏</text><text class="body" x="724" y="464" text-anchor="end">‏درستی: وقت کی قسم، بے شک انسان خسارے میں ہے۔‏</text><text class="wm" x="12" y="510" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
