<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Surah al-Kawthar: one theme, three verses</title><desc id="d">Concept map of Surah al-Kawthar (108) with the theme 'gratitude and hope' at the centre and its three verses around it: verse 1, God has given al-Kawthar; verse 2, so pray and sacrifice; verse 3, the enemy is the one cut off.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="390"/><text class="h" x="24" y="26">Surah al-Kawthar: one theme, three verses</text><ellipse class="panel-a" cx="390" cy="200" rx="120" ry="46"/><text class="sh" x="390" y="196" text-anchor="middle">Gratitude</text><text class="sh" x="390" y="214" text-anchor="middle">and hope</text><rect class="panel" x="280" y="48" width="220" height="64" rx="8"/><text class="body" x="296" y="76">108:1 - God has given</text><text class="body" x="296" y="94">al-Kawthar</text><rect class="panel" x="24" y="286" width="220" height="64" rx="8"/><text class="body" x="40" y="314">108:2 - so pray</text><text class="body" x="40" y="332">and sacrifice</text><rect class="panel" x="536" y="286" width="220" height="64" rx="8"/><text class="body" x="552" y="314">108:3 - the enemy is</text><text class="body" x="552" y="332">the one cut off</text><line class="thin" x1="390" y1="112" x2="390" y2="154" marker-end="url(#arrow)"/><line class="thin" x1="244" y1="318" x2="270" y2="222" marker-end="url(#arrow)"/><line class="thin" x1="536" y1="318" x2="510" y2="222" marker-end="url(#arrow)"/><text class="wm" x="768" y="380" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
