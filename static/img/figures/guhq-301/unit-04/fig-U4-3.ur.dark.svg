<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">103:1-3 کا لفظ بہ لفظ اور معنی محور ترجمہ</title><desc id="d">جدول جو 103:1-3 کے لفظ بہ لفظ اور معنی محور ترجمے کا موازنہ دو کالموں میں کرتا ہے۔ لفظ بہ لفظ کالم عربی ترتیب برقرار رکھتا ہے اور بھدا لگتا ہے؛ معنی محور کالم انہی آیات کو رواں زبان میں پیش کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="350"/><text class="h" x="756" y="34" text-anchor="end">‏103:1-3 کا لفظ بہ لفظ اور معنی محور ترجمہ‏</text><rect class="panel-a" x="24" y="52" width="332" height="36"/><rect class="bg" x="356" y="52" width="330" height="36"/><rect class="thin" x="356" y="52" width="330" height="36"/><rect class="panel" x="686" y="52" width="70" height="36"/><text class="sh" x="344" y="76" text-anchor="end">‏معنی محور‏</text><text class="sh" x="674" y="76" text-anchor="end">‏لفظ بہ لفظ‏</text><text class="sh" x="744" y="76" text-anchor="end">‏آیت‏</text><rect class="panel-a" x="24" y="88" width="332" height="56"/><rect class="bg" x="356" y="88" width="330" height="56"/><rect class="thin" x="356" y="88" width="330" height="56"/><rect class="panel" x="686" y="88" width="70" height="56"/><text class="sh" x="744" y="121" text-anchor="end">‏103:1‏</text><text class="cell" x="674" y="114" text-anchor="end">‏اور وقت، بے شک‏</text><text class="cell" x="344" y="114" text-anchor="end">‏وقت کی قسم، بے شک‏</text><rect class="panel-a" x="24" y="144" width="332" height="56"/><rect class="bg" x="356" y="144" width="330" height="56"/><rect class="thin" x="356" y="144" width="330" height="56"/><rect class="panel" x="686" y="144" width="70" height="56"/><text class="sh" x="744" y="177" text-anchor="end">‏103:2‏</text><text class="cell" x="674" y="169" text-anchor="end">‏انسان خسارے میں ہے‏</text><text class="cell" x="344" y="169" text-anchor="end">‏انسان خسارے میں ہے‏</text><rect class="panel-a" x="24" y="200" width="332" height="96"/><rect class="bg" x="356" y="200" width="330" height="96"/><rect class="thin" x="356" y="200" width="330" height="96"/><rect class="panel" x="686" y="200" width="70" height="96"/><text class="sh" x="744" y="233" text-anchor="end">‏103:3‏</text><text class="cell" x="674" y="226" text-anchor="end">‏سوائے ان لوگوں کے جو ایمان لائے‏</text><text class="cell" x="674" y="252" text-anchor="end">‏اور نیک عمل کیے اور ایک دوسرے کو‏</text><text class="cell" x="674" y="278" text-anchor="end">‏حق کے ساتھ تلقین کی اور صبر کے ساتھ تلقین کی‏</text><text class="cell" x="344" y="226" text-anchor="end">‏سوائے ان لوگوں کے جو ایمان لائے‏</text><text class="cell" x="344" y="252" text-anchor="end">‏اور نیک عمل کیے اور ایک دوسرے کو‏</text><text class="cell" x="344" y="278" text-anchor="end">‏حق کی تلقین کی اور صبر کی تلقین کی‏</text><text class="small" x="756" y="322" text-anchor="end">‏معنی محور کالم پیغام برقرار رکھتا ہے؛ لفظ بہ لفظ کالم ترتیب برقرار رکھتا ہے۔‏</text><text class="wm" x="12" y="340" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
