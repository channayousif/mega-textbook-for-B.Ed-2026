<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Verse 103:1 laid out word by word</title><desc id="d">Table laying out verse 103:1 word by word: wa-l-'asri (by the time, particle plus noun in the genitive), inna (indeed, an emphasis particle), al-insana (mankind, the noun governed by inna), la-fi (in, preposition plus noun), khusrin (loss, noun in the genitive).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="24" y="34">Verse 103:1 word by word</text><rect class="panel" x="24" y="52" width="170" height="36"/><rect class="bg" x="194" y="52" width="180" height="36"/><rect class="panel-a" x="374" y="52" width="382" height="36"/><text class="sh" x="36" y="76">Word</text><text class="sh" x="206" y="76">Meaning</text><text class="sh" x="386" y="76">Grammar</text><rect class="panel" x="24" y="88" width="170" height="56"/><rect class="bg" x="194" y="88" width="180" height="56"/><rect class="thin" x="194" y="88" width="180" height="56"/><rect class="panel-a" x="374" y="88" width="382" height="56"/><text class="body" x="36" y="121">وَٱلْعَصْرِ</text><text class="cell" x="206" y="121">by the time</text><text class="cell" x="386" y="121">wa (and) + al-'aṣr (the time), genitive</text><rect class="panel" x="24" y="144" width="170" height="56"/><rect class="bg" x="194" y="144" width="180" height="56"/><rect class="thin" x="194" y="144" width="180" height="56"/><rect class="panel-a" x="374" y="144" width="382" height="56"/><text class="body" x="36" y="177">إِنَّ</text><text class="cell" x="206" y="177">indeed</text><text class="cell" x="386" y="177">emphasis particle, governs the noun after it</text><rect class="panel" x="24" y="200" width="170" height="56"/><rect class="bg" x="194" y="200" width="180" height="56"/><rect class="thin" x="194" y="200" width="180" height="56"/><rect class="panel-a" x="374" y="200" width="382" height="56"/><text class="body" x="36" y="233">ٱلْإِنسَـٰنَ</text><text class="cell" x="206" y="233">mankind</text><text class="cell" x="386" y="233">noun governed by inna, accusative</text><rect class="panel" x="24" y="256" width="170" height="56"/><rect class="bg" x="194" y="256" width="180" height="56"/><rect class="thin" x="194" y="256" width="180" height="56"/><rect class="panel-a" x="374" y="256" width="382" height="56"/><text class="body" x="36" y="289">لَفِى</text><text class="cell" x="206" y="289">in</text><text class="cell" x="386" y="289">la (emphasis) + fi (preposition)</text><rect class="panel" x="24" y="312" width="170" height="56"/><rect class="bg" x="194" y="312" width="180" height="56"/><rect class="thin" x="194" y="312" width="180" height="56"/><rect class="panel-a" x="374" y="312" width="382" height="56"/><text class="body" x="36" y="345">خُسْرٍ</text><text class="cell" x="206" y="345">loss</text><text class="cell" x="386" y="345">noun in the genitive after the preposition</text><text class="small" x="24" y="392">Word-by-word draft: And the time, indeed mankind is in loss.</text><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
