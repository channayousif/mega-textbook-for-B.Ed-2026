<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How the verses of Surah al-Falaq connect</title><desc id="d">Diagram showing how the verses of Surah al-Falaq (113:1-5) connect: verse 1 asks for refuge in the Lord of daybreak, and verses 2 to 5 each begin with the shared phrase 'wa-min sharri' (and from the evil of), linking every listed evil back to the refuge asked for in verse 1.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><text class="h" x="24" y="30">How the verses of Surah al-Falaq connect</text><rect class="panel-a" x="70" y="52" width="640" height="60" rx="8"/><text class="body" x="86" y="88">113:1 - Say, I seek refuge in the Lord of daybreak</text><line class="thin" x1="390" y1="112" x2="390" y2="140" marker-end="url(#arrow)"/><rect class="panel" x="70" y="140" width="640" height="60" rx="8"/><text class="body" x="86" y="176">113:2 - wa-min sharri: and from the evil of that which He created</text><line class="thin" x1="390" y1="200" x2="390" y2="228" marker-end="url(#arrow)"/><rect class="panel" x="70" y="228" width="640" height="60" rx="8"/><text class="body" x="86" y="264">113:3 - wa-min sharri: and from the evil of darkness when it settles</text><line class="thin" x1="390" y1="288" x2="390" y2="316" marker-end="url(#arrow)"/><rect class="panel" x="70" y="316" width="640" height="60" rx="8"/><text class="body" x="86" y="352">113:4 - wa-min sharri: and from the evil of the blowers in knots</text><line class="thin" x1="390" y1="376" x2="390" y2="404" marker-end="url(#arrow)"/><rect class="panel" x="70" y="404" width="640" height="60" rx="8"/><text class="body" x="86" y="440">113:5 - wa-min sharri: and from the evil of an envier when he envies</text><text class="small" x="24" y="490">The shared phrase wa-min sharri links verses 2-5 to the refuge in verse 1.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
