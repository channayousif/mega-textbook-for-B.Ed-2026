<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">سورۃ الکوثر: ایک مرکزی موضوع، تین آیات</title><desc id="d">سورۃ الکوثر (108) کا تصوری نقشہ جس کے مرکز میں مرکزی موضوع 'شکر و امید' ہے اور اس کے ارد گرد اس کی تین آیات ہیں: آیت 1، اللہ نے الکوثر دیا؛ آیت 2، پس نماز اور قربانی؛ آیت 3، دشمن وہی ہے جس کی جڑ کٹی ہوئی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="390"/><text class="h" x="756" y="26" text-anchor="end">‏سورۃ الکوثر: ایک مرکزی موضوع، تین آیات‏</text><ellipse class="panel-a" cx="390" cy="200" rx="120" ry="46"/><text class="sh" x="390" y="192" text-anchor="middle">‏شکر‏</text><text class="sh" x="390" y="220" text-anchor="middle">‏اور امید‏</text><rect class="panel" x="280" y="48" width="220" height="64" rx="8"/><text class="body" x="484" y="72" text-anchor="end">‏108:1 - اللہ نے‏</text><text class="body" x="484" y="100" text-anchor="end">‏الکوثر دیا‏</text><rect class="panel" x="536" y="286" width="220" height="64" rx="8"/><text class="body" x="740" y="310" text-anchor="end">‏108:2 - پس نماز‏</text><text class="body" x="740" y="338" text-anchor="end">‏اور قربانی‏</text><rect class="panel" x="24" y="286" width="220" height="64" rx="8"/><text class="body" x="228" y="310" text-anchor="end">‏108:3 - دشمن وہی ہے‏</text><text class="body" x="228" y="338" text-anchor="end">‏جس کی جڑ کٹی ہوئی ہے‏</text><line class="thin" x1="390" y1="112" x2="390" y2="154" marker-end="url(#arrow)"/><line class="thin" x1="244" y1="318" x2="270" y2="222" marker-end="url(#arrow)"/><line class="thin" x1="536" y1="318" x2="510" y2="222" marker-end="url(#arrow)"/><text class="wm" x="12" y="380" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
