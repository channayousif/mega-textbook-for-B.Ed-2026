<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of three verbs in active and passive forms</title><desc id="d">Table of three verbs in active and passive forms with a verse for each. Say: qālū (they said, 2:91) and qīla (it was said, 2:91). Send down: anzala (he revealed, 2:91) and unzila (it was revealed, 2:91). Provide: razaq-nā (we provided, 2:3) and ruziqū (they were provided, 2:25).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="24" y="34">Active and passive forms of three verbs</text><rect class="panel" x="24" y="52" width="120" height="40"/><rect class="panel" x="144" y="52" width="200" height="40"/><rect class="panel" x="344" y="52" width="200" height="40"/><rect class="panel" x="544" y="52" width="212" height="40"/><text class="sh" x="36" y="77">Verb</text><text class="sh" x="156" y="77">Active form</text><text class="sh" x="356" y="77">Passive form</text><text class="sh" x="556" y="77">Verse</text><rect class="bg" x="24" y="92" width="120" height="80"/><rect class="thin" x="24" y="92" width="120" height="80"/><rect class="bg" x="144" y="92" width="200" height="80"/><rect class="thin" x="144" y="92" width="200" height="80"/><rect class="bg" x="344" y="92" width="200" height="80"/><rect class="thin" x="344" y="92" width="200" height="80"/><rect class="bg" x="544" y="92" width="212" height="80"/><rect class="thin" x="544" y="92" width="212" height="80"/><text class="body" x="36" y="132">say</text><text class="body" x="156" y="124">qālū</text><text class="small" x="156" y="142">they said</text><text class="body" x="356" y="124">qīla</text><text class="small" x="356" y="142">it was said</text><text class="body" x="556" y="132">2:91</text><rect class="bg" x="24" y="172" width="120" height="80"/><rect class="thin" x="24" y="172" width="120" height="80"/><rect class="bg" x="144" y="172" width="200" height="80"/><rect class="thin" x="144" y="172" width="200" height="80"/><rect class="bg" x="344" y="172" width="200" height="80"/><rect class="thin" x="344" y="172" width="200" height="80"/><rect class="bg" x="544" y="172" width="212" height="80"/><rect class="thin" x="544" y="172" width="212" height="80"/><text class="body" x="36" y="212">send down</text><text class="body" x="156" y="204">anzala</text><text class="small" x="156" y="222">he revealed</text><text class="body" x="356" y="204">unzila</text><text class="small" x="356" y="222">it was revealed</text><text class="body" x="556" y="212">2:91</text><rect class="bg" x="24" y="252" width="120" height="80"/><rect class="thin" x="24" y="252" width="120" height="80"/><rect class="bg" x="144" y="252" width="200" height="80"/><rect class="thin" x="144" y="252" width="200" height="80"/><rect class="bg" x="344" y="252" width="200" height="80"/><rect class="thin" x="344" y="252" width="200" height="80"/><rect class="bg" x="544" y="252" width="212" height="80"/><rect class="thin" x="544" y="252" width="212" height="80"/><text class="body" x="36" y="292">provide</text><text class="body" x="156" y="284">razaqnā</text><text class="small" x="156" y="302">we provided</text><text class="body" x="356" y="284">ruziqū</text><text class="small" x="356" y="302">they were provided</text><text class="body" x="556" y="292">2:3; 2:25</text><text class="small" x="24" y="352">The passive (majhūl) keeps the meaning but turns the doer out of the sentence;</text><text class="small" x="24" y="369">the nā'ib fā'il takes the doer's place.</text><text class="wm" x="768" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
