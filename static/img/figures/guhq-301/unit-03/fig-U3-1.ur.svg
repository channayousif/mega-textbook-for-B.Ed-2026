<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">ایک اسمی اور ایک فعلی جملے کا تجزیہ کرنے والا خاکہ</title><desc id="d">ایک اسمی اور ایک فعلی جملے کا تجزیہ کرنے والا خاکہ۔ دائیں طرف اسمی جملہ 'ذَٰلِكَ ٱلْكِتَـٰبُ' (2:2) مبتدأ (ذَٰلِكَ) اور خبر (ٱلْكِتَـٰبُ) میں تقسیم کیا گیا ہے۔ بائیں طرف فعلی جملہ 'فَٱذْكُرُونِىٓ أَذْكُرْكُمْ' (2:152) فعل (اُذْكُرُوا)، فاعل (واؤ) اور مفعول (نِی) میں تقسیم کیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="756" y="34" text-anchor="end">‏قرآن میں جملے کی دو قسمیں‏</text><rect class="panel" x="396" y="56" width="360" height="320" rx="8"/><text class="h" x="744" y="84" text-anchor="end">‏اسمی جملہ‏</text><text class="small" x="744" y="110" text-anchor="end">‏جملہ اسمیہ - اسم سے شروع ہوتا ہے‏</text><text class="ar" x="576" y="156" text-anchor="middle">ذَٰلِكَ ٱلْكِتَـٰبُ</text><text class="sh" x="744" y="196" text-anchor="end">‏مبتدأ‏</text><text class="body" x="744" y="222" text-anchor="end">‏شروع کرنے والا لفظ: 'وہ'‏</text><text class="sh" x="744" y="256" text-anchor="end">‏خبر‏</text><text class="body" x="744" y="282" text-anchor="end">‏مکمل کرنے والا لفظ: 'کتاب'‏</text><text class="small" x="744" y="350" text-anchor="end">‏قرآن 2:2‏</text><rect class="panel" x="24" y="56" width="360" height="320" rx="8"/><text class="h" x="372" y="84" text-anchor="end">‏فعلی جملہ‏</text><text class="small" x="372" y="110" text-anchor="end">‏جملہ فعلیہ - فعل سے شروع ہوتا ہے‏</text><text class="ar" x="204" y="156" text-anchor="middle">فَٱذْكُرُونِىٓ أَذْكُرْكُمْ</text><text class="sh" x="372" y="196" text-anchor="end">‏فعلِ امر‏</text><text class="body" x="372" y="222" text-anchor="end">‏'یاد کرو'‏</text><text class="sh" x="372" y="256" text-anchor="end">‏فاعل‏</text><text class="body" x="372" y="282" text-anchor="end">‏فعل کے اندر کا واؤ‏</text><text class="sh" x="372" y="312" text-anchor="end">‏مفعول بہ‏</text><text class="body" x="372" y="338" text-anchor="end">‏ضمیر 'مجھے'‏</text><text class="small" x="372" y="366" text-anchor="end">‏قرآن 2:152‏</text><text class="wm" x="12" y="410" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
