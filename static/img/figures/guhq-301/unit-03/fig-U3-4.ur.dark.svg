<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">تین افعال کی معروف اور مجہول شکلوں کا جدول</title><desc id="d">تین افعال کی معروف اور مجہول شکلوں کا جدول، ہر ایک کے لیے ایک آیت کے ساتھ۔ کہنا: قَالُوا (انہوں نے کہا، 2:91) اور قِيلَ (کہا گیا، 2:91)۔ نازل کرنا: أَنزَلَ (اس نے نازل کیا، 2:91) اور أُنزِلَ (نازل کیا گیا، 2:91)۔ رزق دینا: رَزَقْنَا (ہم نے رزق دیا، 2:3) اور رُزِقُوا (انہیں رزق دیا گیا، 2:25)۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ar { font-size: 20px; fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="380"/><text class="h" x="756" y="34" text-anchor="end">‏تین افعال کی معروف اور مجہول شکلیں‏</text><rect class="panel" x="636" y="52" width="120" height="40"/><rect class="panel" x="436" y="52" width="200" height="40"/><rect class="panel" x="236" y="52" width="200" height="40"/><rect class="panel" x="24" y="52" width="212" height="40"/><text class="sh" x="744" y="78" text-anchor="end">‏فعل‏</text><text class="sh" x="624" y="78" text-anchor="end">‏معروف شکل‏</text><text class="sh" x="424" y="78" text-anchor="end">‏مجہول شکل‏</text><text class="sh" x="224" y="78" text-anchor="end">‏آیت‏</text><rect class="bg" x="636" y="92" width="120" height="80"/><rect class="thin" x="636" y="92" width="120" height="80"/><rect class="bg" x="436" y="92" width="200" height="80"/><rect class="thin" x="436" y="92" width="200" height="80"/><rect class="bg" x="236" y="92" width="200" height="80"/><rect class="thin" x="236" y="92" width="200" height="80"/><rect class="bg" x="24" y="92" width="212" height="80"/><rect class="thin" x="24" y="92" width="212" height="80"/><text class="body" x="744" y="136" text-anchor="end">‏کہنا‏</text><text class="ar" x="624" y="124" text-anchor="end">قَالُوا</text><text class="small" x="624" y="154" text-anchor="end">‏انہوں نے کہا‏</text><text class="ar" x="424" y="124" text-anchor="end">قِيلَ</text><text class="small" x="424" y="154" text-anchor="end">‏کہا گیا‏</text><text class="body" x="224" y="136" text-anchor="end">‏2:91‏</text><rect class="bg" x="636" y="172" width="120" height="80"/><rect class="thin" x="636" y="172" width="120" height="80"/><rect class="bg" x="436" y="172" width="200" height="80"/><rect class="thin" x="436" y="172" width="200" height="80"/><rect class="bg" x="236" y="172" width="200" height="80"/><rect class="thin" x="236" y="172" width="200" height="80"/><rect class="bg" x="24" y="172" width="212" height="80"/><rect class="thin" x="24" y="172" width="212" height="80"/><text class="body" x="744" y="216" text-anchor="end">‏نازل کرنا‏</text><text class="ar" x="624" y="204" text-anchor="end">أَنزَلَ</text><text class="small" x="624" y="234" text-anchor="end">‏اس نے نازل کیا‏</text><text class="ar" x="424" y="204" text-anchor="end">أُنزِلَ</text><text class="small" x="424" y="234" text-anchor="end">‏نازل کیا گیا‏</text><text class="body" x="224" y="216" text-anchor="end">‏2:91‏</text><rect class="bg" x="636" y="252" width="120" height="80"/><rect class="thin" x="636" y="252" width="120" height="80"/><rect class="bg" x="436" y="252" width="200" height="80"/><rect class="thin" x="436" y="252" width="200" height="80"/><rect class="bg" x="236" y="252" width="200" height="80"/><rect class="thin" x="236" y="252" width="200" height="80"/><rect class="bg" x="24" y="252" width="212" height="80"/><rect class="thin" x="24" y="252" width="212" height="80"/><text class="body" x="744" y="296" text-anchor="end">‏رزق دینا‏</text><text class="ar" x="624" y="284" text-anchor="end">رَزَقْنَا</text><text class="small" x="624" y="314" text-anchor="end">‏ہم نے رزق دیا‏</text><text class="ar" x="424" y="284" text-anchor="end">رُزِقُوا</text><text class="small" x="424" y="314" text-anchor="end">‏انہیں رزق دیا گیا‏</text><text class="body" x="224" y="296" text-anchor="end">‏2:3؛ 2:25‏</text><text class="small" x="756" y="350" text-anchor="end">‏مجہول صیغہ معنی برقرار رکھتا ہے لیکن فاعل کو جملے سے باہر کر دیتا ہے؛‏</text><text class="small" x="756" y="371" text-anchor="end">‏نائب فاعل فاعل کی جگہ لے لیتا ہے۔‏</text><text class="wm" x="12" y="370" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
