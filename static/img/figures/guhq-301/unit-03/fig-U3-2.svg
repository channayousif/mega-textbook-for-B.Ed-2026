<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing nominal and verbal sentences</title><desc id="d">Table comparing nominal and verbal sentences. A nominal sentence begins with a noun (mubtada'), as in 'dhālika l-kitābu' (2:2), and a khabar completes it. A verbal sentence begins with a verb (fi'l), as in 'fa-dhkurūnī adhkur-kum' (2:152), and a fā'il and an object follow.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 18px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="360"/><text class="h" x="24" y="34">Nominal and verbal sentences compared</text><rect class="panel" x="24" y="52" width="150" height="40"/><rect class="panel" x="174" y="52" width="140" height="40"/><rect class="panel" x="314" y="52" width="250" height="40"/><rect class="panel" x="564" y="52" width="192" height="40"/><text class="sh" x="36" y="77">Sentence type</text><text class="sh" x="186" y="77">First word</text><text class="sh" x="326" y="77">Qur'anic example</text><text class="sh" x="576" y="77">What follows</text><rect class="bg" x="24" y="92" width="150" height="90"/><rect class="thin" x="24" y="92" width="150" height="90"/><rect class="bg" x="174" y="92" width="140" height="90"/><rect class="thin" x="174" y="92" width="140" height="90"/><rect class="bg" x="314" y="92" width="250" height="90"/><rect class="thin" x="314" y="92" width="250" height="90"/><rect class="bg" x="564" y="92" width="192" height="90"/><rect class="thin" x="564" y="92" width="192" height="90"/><text class="body" x="36" y="120">Nominal</text><text class="body" x="36" y="137">(jumlah ismiyyah)</text><text class="body" x="186" y="120">a noun</text><text class="body" x="186" y="137">(mubtada')</text><text class="ar" x="326" y="126">ذَٰلِكَ ٱلْكِتَـٰبُ</text><text class="small" x="326" y="150">(2:2)</text><text class="body" x="576" y="120">a khabar</text><text class="body" x="576" y="137">completes it</text><rect class="bg" x="24" y="182" width="150" height="90"/><rect class="thin" x="24" y="182" width="150" height="90"/><rect class="bg" x="174" y="182" width="140" height="90"/><rect class="thin" x="174" y="182" width="140" height="90"/><rect class="bg" x="314" y="182" width="250" height="90"/><rect class="thin" x="314" y="182" width="250" height="90"/><rect class="bg" x="564" y="182" width="192" height="90"/><rect class="thin" x="564" y="182" width="192" height="90"/><text class="body" x="36" y="210">Verbal</text><text class="body" x="36" y="227">(jumlah fi'liyyah)</text><text class="body" x="186" y="210">a verb</text><text class="body" x="186" y="227">(fi'l)</text><text class="ar" x="326" y="216">فَٱذْكُرُونِىٓ أَذْكُرْكُمْ</text><text class="small" x="326" y="240">(2:152)</text><text class="body" x="576" y="210">a fā'il and an</text><text class="body" x="576" y="227">object follow</text><text class="small" x="24" y="298">A sentence is named by its first word: a noun gives a nominal sentence,</text><text class="small" x="24" y="315">a verb gives a verbal sentence.</text><text class="wm" x="768" y="350" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
