<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart for reading a conditional sentence</title><desc id="d">Flowchart for reading a conditional sentence in four steps: find the condition word, read the condition clause, read the result clause, and note the linking fa. A worked example from 2:282 shows idhā (when), the condition 'when you borrow a debt for a fixed term', and the result 'so write it down'.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="24" y="34">Reading a conditional sentence</text><rect class="panel" x="24" y="56" width="165" height="170" rx="8"/><text class="small" x="36" y="80">Step 1</text><text class="sh" x="36" y="102">Find the</text><text class="sh" x="36" y="119">condition word</text><text class="ar" x="36" y="154">إِذَا</text><text class="small" x="36" y="176">'when', 'if'</text><line class="stroke" x1="191" y1="141" x2="207" y2="141" marker-end="url(#arrow)"/><rect class="panel" x="209" y="56" width="165" height="170" rx="8"/><text class="small" x="221" y="80">Step 2</text><text class="sh" x="221" y="102">Read the</text><text class="sh" x="221" y="119">condition clause</text><text class="body" x="221" y="146">the situation</text><text class="small" x="221" y="176">2:282</text><line class="stroke" x1="376" y1="141" x2="392" y2="141" marker-end="url(#arrow)"/><rect class="panel" x="394" y="56" width="165" height="170" rx="8"/><text class="small" x="406" y="80">Step 3</text><text class="sh" x="406" y="102">Read the</text><text class="sh" x="406" y="119">result clause</text><text class="body" x="406" y="146">what follows</text><text class="small" x="406" y="176">2:282</text><line class="stroke" x1="561" y1="141" x2="577" y2="141" marker-end="url(#arrow)"/><rect class="panel" x="579" y="56" width="177" height="170" rx="8"/><text class="small" x="591" y="80">Step 4</text><text class="sh" x="591" y="102">Note the link</text><text class="body" x="591" y="128">the fa joins</text><text class="body" x="591" y="145">condition to result</text><text class="small" x="591" y="176">'so'</text><rect class="panel-a" x="24" y="246" width="732" height="100" rx="8"/><text class="sh" x="36" y="272">Worked example: 2:282</text><text class="body" x="36" y="298">Condition word: إِذَا (when)</text><text class="body" x="36" y="320">Condition: 'when you borrow a debt for a fixed term'</text><text class="body" x="430" y="298">Result: فَٱكْتُبُوهُ ('so write it down')</text><text class="body" x="430" y="320">Link: the fa (فَ) joins them</text><text class="small" x="24" y="380">Conditional sentence (jumlah sharṭiyyah): condition (sharṭ) + result (jawāb sharṭ).</text><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
