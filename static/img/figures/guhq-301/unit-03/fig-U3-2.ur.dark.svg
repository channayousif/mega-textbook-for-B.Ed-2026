<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">اسمی اور فعلی جملوں کا موازنہ کرنے والا جدول</title><desc id="d">اسمی اور فعلی جملوں کا موازنہ کرنے والا جدول۔ اسمی جملہ اسم (مبتدأ) سے شروع ہوتا ہے، جیسے 'ذَٰلِكَ ٱلْكِتَـٰبُ' (2:2)، اور خبر اسے مکمل کرتی ہے۔ فعلی جملہ فعل سے شروع ہوتا ہے، جیسے 'فَٱذْكُرُونِىٓ أَذْكُرْكُمْ' (2:152)، اور اس کے بعد فاعل اور مفعول آتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.thin { stroke: var(--ink); stroke-width: 1.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 18px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="360"/><text class="h" x="756" y="34" text-anchor="end">‏اسمی اور فعلی جملوں کا موازنہ‏</text><rect class="panel" x="606" y="52" width="150" height="40"/><rect class="panel" x="466" y="52" width="140" height="40"/><rect class="panel" x="216" y="52" width="250" height="40"/><rect class="panel" x="24" y="52" width="192" height="40"/><text class="sh" x="744" y="78" text-anchor="end">‏جملے کی قسم‏</text><text class="sh" x="594" y="78" text-anchor="end">‏پہلا لفظ‏</text><text class="sh" x="454" y="78" text-anchor="end">‏قرآنی مثال‏</text><text class="sh" x="204" y="78" text-anchor="end">‏بعد میں کیا آتا ہے‏</text><rect class="bg" x="606" y="92" width="150" height="90"/><rect class="thin" x="606" y="92" width="150" height="90"/><rect class="bg" x="466" y="92" width="140" height="90"/><rect class="thin" x="466" y="92" width="140" height="90"/><rect class="bg" x="216" y="92" width="250" height="90"/><rect class="thin" x="216" y="92" width="250" height="90"/><rect class="bg" x="24" y="92" width="192" height="90"/><rect class="thin" x="24" y="92" width="192" height="90"/><text class="body" x="744" y="122" text-anchor="end">‏اسمی‏</text><text class="body" x="744" y="148" text-anchor="end">‏(جملہ اسمیہ)‏</text><text class="body" x="594" y="122" text-anchor="end">‏اسم‏</text><text class="body" x="594" y="148" text-anchor="end">‏(مبتدأ)‏</text><text class="body" x="204" y="122" text-anchor="end">‏خبر اسے‏</text><text class="body" x="204" y="148" text-anchor="end">‏مکمل کرتی ہے‏</text><text class="ar" x="454" y="128" text-anchor="end">ذَٰلِكَ ٱلْكِتَـٰبُ</text><text class="small" x="454" y="156" text-anchor="end">‏(2:2)‏</text><rect class="bg" x="606" y="182" width="150" height="90"/><rect class="thin" x="606" y="182" width="150" height="90"/><rect class="bg" x="466" y="182" width="140" height="90"/><rect class="thin" x="466" y="182" width="140" height="90"/><rect class="bg" x="216" y="182" width="250" height="90"/><rect class="thin" x="216" y="182" width="250" height="90"/><rect class="bg" x="24" y="182" width="192" height="90"/><rect class="thin" x="24" y="182" width="192" height="90"/><text class="body" x="744" y="212" text-anchor="end">‏فعلی‏</text><text class="body" x="744" y="238" text-anchor="end">‏(جملہ فعلیہ)‏</text><text class="body" x="594" y="212" text-anchor="end">‏فعل‏</text><text class="body" x="204" y="212" text-anchor="end">‏فاعل اور مفعول‏</text><text class="body" x="204" y="238" text-anchor="end">‏بعد میں آتے ہیں‏</text><text class="ar" x="454" y="218" text-anchor="end">فَٱذْكُرُونِىٓ أَذْكُرْكُمْ</text><text class="small" x="454" y="246" text-anchor="end">‏(2:152)‏</text><text class="small" x="756" y="300" text-anchor="end">‏جملے کا نام اس کے پہلے لفظ سے رکھا جاتا ہے: اسم ہو تو اسمی جملہ،‏</text><text class="small" x="756" y="324" text-anchor="end">‏فعل ہو تو فعلی جملہ۔‏</text><text class="wm" x="12" y="350" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
