<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram parsing a nominal and a verbal sentence</title><desc id="d">Diagram parsing a nominal and a verbal sentence. On the left, the nominal sentence 'dhālika l-kitābu' (2:2) is split into a mubtada' (dhālika) and a khabar (al-kitābu). On the right, the verbal sentence 'fa-dhkurūnī adhkur-kum' (2:152) is split into a verb (udhkurū), a fā'il (the waāw) and an object (nī).</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
</style><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="24" y="34">Two sentence types in the Qur'an</text><rect class="panel" x="24" y="56" width="360" height="320" rx="8"/><text class="h" x="36" y="82">Nominal sentence</text><text class="small" x="36" y="102">jumlah ismiyyah - begins with a noun</text><text class="ar" x="204" y="150" text-anchor="middle">ذَٰلِكَ ٱلْكِتَـٰبُ</text><text class="sh" x="36" y="190">مبتدأ (mubtada')</text><text class="body" x="36" y="208">the opening word: 'that'</text><text class="sh" x="36" y="238">خبر (khabar)</text><text class="body" x="36" y="256">the completing word: 'the Book'</text><text class="small" x="36" y="300">Qur'an 2:2</text><rect class="panel" x="396" y="56" width="360" height="320" rx="8"/><text class="h" x="408" y="82">Verbal sentence</text><text class="small" x="408" y="102">jumlah fi'liyyah - begins with a verb</text><text class="ar" x="576" y="150" text-anchor="middle">فَٱذْكُرُونِىٓ أَذْكُرْكُمْ</text><text class="sh" x="408" y="190">فعل أمر (verb)</text><text class="body" x="408" y="208">'remember'</text><text class="sh" x="408" y="238">فاعل (subject)</text><text class="body" x="408" y="256">the waāw in the verb</text><text class="sh" x="408" y="288">مفعول به (object)</text><text class="body" x="408" y="306">the pronoun 'Me'</text><text class="small" x="408" y="340">Qur'an 2:152</text><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
