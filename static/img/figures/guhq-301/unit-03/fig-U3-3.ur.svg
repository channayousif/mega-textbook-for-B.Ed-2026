<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" lang="ur"><title id="t">شرطیہ جملہ پڑھنے کا بہاؤ چارٹ</title><desc id="d">شرطیہ جملہ پڑھنے کا چار مرحلوں والا بہاؤ چارٹ: حرفِ شرط تلاش کریں، شرط والا حصہ پڑھیں، جواب والا حصہ پڑھیں، اور جوڑنے والے فَ کو نوٹ کریں۔ 2:282 سے ایک حل شدہ مثال إِذَا (جب)، شرط 'جب تم ایک مقررہ مدت کے لیے قرض کا لین دین کرو' اور جواب 'تو اسے لکھ لو' دکھاتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
text { font-size: 15px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.ar { font-size: 20px; fill: var(--ink); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="420"/><text class="h" x="756" y="34" text-anchor="end">‏شرطیہ جملہ پڑھنا‏</text><rect class="panel" x="579" y="56" width="177" height="170" rx="8"/><rect class="panel" x="394" y="56" width="165" height="170" rx="8"/><rect class="panel" x="209" y="56" width="165" height="170" rx="8"/><rect class="panel" x="24" y="56" width="165" height="170" rx="8"/><text class="small" x="744" y="80" text-anchor="end">‏مرحلہ 1‏</text><text class="sh" x="744" y="106" text-anchor="end">‏حرفِ شرط‏</text><text class="sh" x="744" y="130" text-anchor="end">‏تلاش کریں‏</text><text class="ar" x="744" y="166" text-anchor="end">إِذَا</text><text class="small" x="744" y="200" text-anchor="end">‏'جب'، 'اگر'‏</text><text class="small" x="547" y="80" text-anchor="end">‏مرحلہ 2‏</text><text class="sh" x="547" y="106" text-anchor="end">‏شرط والا حصہ‏</text><text class="sh" x="547" y="130" text-anchor="end">‏پڑھیں‏</text><text class="body" x="547" y="162" text-anchor="end">‏صورتحال‏</text><text class="small" x="547" y="200" text-anchor="end">‏2:282‏</text><text class="small" x="362" y="80" text-anchor="end">‏مرحلہ 3‏</text><text class="sh" x="362" y="106" text-anchor="end">‏جواب والا حصہ‏</text><text class="sh" x="362" y="130" text-anchor="end">‏پڑھیں‏</text><text class="body" x="362" y="162" text-anchor="end">‏جو اس کے بعد آتا ہے‏</text><text class="small" x="362" y="200" text-anchor="end">‏2:282‏</text><text class="small" x="177" y="80" text-anchor="end">‏مرحلہ 4‏</text><text class="sh" x="177" y="106" text-anchor="end">‏جوڑ کو نوٹ کریں‏</text><text class="body" x="177" y="138" text-anchor="end">‏فَ شرط کو‏</text><text class="body" x="177" y="162" text-anchor="end">‏جواب سے جوڑتا ہے‏</text><text class="small" x="177" y="200" text-anchor="end">‏'تو'‏</text><line class="stroke" x1="577" y1="141" x2="561" y2="141" marker-end="url(#arrow)"/><line class="stroke" x1="392" y1="141" x2="376" y2="141" marker-end="url(#arrow)"/><line class="stroke" x1="207" y1="141" x2="191" y2="141" marker-end="url(#arrow)"/><rect class="panel-a" x="24" y="246" width="732" height="100" rx="8"/><text class="sh" x="744" y="272" text-anchor="end">‏حل شدہ مثال: 2:282‏</text><text class="body" x="744" y="298" text-anchor="end">‏حرفِ شرط: إِذَا (جب)‏</text><text class="body" x="744" y="324" text-anchor="end">‏شرط: 'جب تم مقررہ مدت کے لیے قرض کا لین دین کرو'‏</text><text class="body" x="350" y="298" text-anchor="end">‏جواب: فَٱكْتُبُوهُ ('تو اسے لکھ لو')‏</text><text class="body" x="350" y="324" text-anchor="end">‏جوڑ: فَ دونوں کو جوڑتا ہے‏</text><text class="small" x="756" y="382" text-anchor="end">‏شرطیہ جملہ (جملہ شرطیہ): شرط + جواب (جوابِ شرط)‏</text><text class="wm" x="12" y="410" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
