<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک استاد کا کام کا ہفتہ</title><desc id="d">استاد کے کام کے ہفتے کی سرگرمی وار فہرست والا جدول، تقریباً گھنٹے، ہر سرگرمی اسکول سے باہر سے نظر آنے والی ہے یا نہیں، اور سرکاری ورک لوڈ میں شمار ہوتی ہے یا نہیں، یہ بتاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} .tot{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .c{font-size:11px;fill:var(--ink)} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="880" height="460"/><rect class="rl" x="540" y="28" width="320" height="52"/><rect class="hd" x="420" y="28" width="120" height="52"/><rect class="hx" x="220" y="28" width="200" height="52"/><rect class="hx" x="20" y="28" width="200" height="52"/><text class="h" x="480" y="59" text-anchor="middle">تقریباً گھنٹے</text><text class="h" x="320" y="50" text-anchor="middle">اسکول سے باہر</text><text class="h" x="320" y="68" text-anchor="middle">سے نظر آتی ہے؟</text><text class="h" x="120" y="50" text-anchor="middle">سرکاری ورک لوڈ</text><text class="h" x="120" y="68" text-anchor="middle">میں شمار؟</text><rect class="rl" x="540" y="80" width="320" height="34"/><rect class="cl" x="420" y="80" width="120" height="34"/><rect class="cx" x="220" y="80" width="200" height="34"/><rect class="cx" x="20" y="80" width="200" height="34"/><text class="rh" x="850" y="102" text-anchor="end">ٹائم ٹیبل والی تدریس</text><text class="c" x="480" y="102" text-anchor="middle">22 تا 28</text><text class="c" x="320" y="102" text-anchor="middle">ہاں</text><text class="c" x="120" y="102" text-anchor="middle">ہاں</text><rect class="rl" x="540" y="114" width="320" height="34"/><rect class="cl" x="420" y="114" width="120" height="34"/><rect class="cx" x="220" y="114" width="200" height="34"/><rect class="cx" x="20" y="114" width="200" height="34"/><text class="rh" x="850" y="136" text-anchor="end">سبق کی تیاری</text><text class="c" x="480" y="136" text-anchor="middle">5 تا 10</text><text class="c" x="320" y="136" text-anchor="middle">نہیں</text><text class="c" x="120" y="136" text-anchor="middle">نہیں</text><rect class="rl" x="540" y="148" width="320" height="34"/><rect class="cl" x="420" y="148" width="120" height="34"/><rect class="cx" x="220" y="148" width="200" height="34"/><rect class="cx" x="20" y="148" width="200" height="34"/><text class="rh" x="850" y="170" text-anchor="end">جانچنا</text><text class="c" x="480" y="170" text-anchor="middle">4 تا 8</text><text class="c" x="320" y="170" text-anchor="middle">نہیں</text><text class="c" x="120" y="170" text-anchor="middle">نہیں</text><rect class="rl" x="540" y="182" width="320" height="34"/><rect class="cl" x="420" y="182" width="120" height="34"/><rect class="cx" x="220" y="182" width="200" height="34"/><rect class="cx" x="20" y="182" width="200" height="34"/><text class="rh" x="850" y="204" text-anchor="end">رجسٹر اور انتظامی رپورٹیں</text><text class="c" x="480" y="204" text-anchor="middle">2 تا 4</text><text class="c" x="320" y="204" text-anchor="middle">جزوی طور پر</text><text class="c" x="120" y="204" text-anchor="middle">شاذ و نادر</text><rect class="rl" x="540" y="216" width="320" height="34"/><rect class="cl" x="420" y="216" width="120" height="34"/><rect class="cx" x="220" y="216" width="200" height="34"/><rect class="cx" x="20" y="216" width="200" height="34"/><text class="rh" x="850" y="238" text-anchor="end">غائب ساتھیوں کا بدل</text><text class="c" x="480" y="238" text-anchor="middle">1 تا 5</text><text class="c" x="320" y="238" text-anchor="middle">نہیں</text><text class="c" x="120" y="238" text-anchor="middle">نہیں</text><rect class="rl" x="540" y="250" width="320" height="34"/><rect class="cl" x="420" y="250" width="120" height="34"/><rect class="cx" x="220" y="250" width="200" height="34"/><rect class="cx" x="20" y="250" width="200" height="34"/><text class="rh" x="850" y="272" text-anchor="end">امتحان اور نتائج کی ذمہ داریاں</text><text class="c" x="480" y="272" text-anchor="middle">موسمی</text><text class="c" x="320" y="272" text-anchor="middle">جزوی طور پر</text><text class="c" x="120" y="272" text-anchor="middle">کبھی کبھار</text><rect class="rl" x="540" y="284" width="320" height="34"/><rect class="cl" x="420" y="284" width="120" height="34"/><rect class="cx" x="220" y="284" width="200" height="34"/><rect class="cx" x="20" y="284" width="200" height="34"/><text class="rh" x="850" y="306" text-anchor="end">برادری اور والدین سے رابطہ</text><text class="c" x="480" y="306" text-anchor="middle">1 تا 3</text><text class="c" x="320" y="306" text-anchor="middle">نہیں</text><text class="c" x="120" y="306" text-anchor="middle">نہیں</text><rect class="rl" x="540" y="318" width="320" height="34"/><rect class="cl" x="420" y="318" width="120" height="34"/><rect class="cx" x="220" y="318" width="200" height="34"/><rect class="cx" x="20" y="318" width="200" height="34"/><text class="rh" x="850" y="340" text-anchor="end">دی گئی غیر تدریسی ذمہ داریاں</text><text class="c" x="480" y="340" text-anchor="middle">بدلتی ہوئی</text><text class="c" x="320" y="340" text-anchor="middle">نہیں</text><text class="c" x="120" y="340" text-anchor="middle">نہیں</text><text class="h" x="858" y="377" text-anchor="end">صرف پہلی قطار دونوں نظر آنے والی اور شمار ہونے والی ہے۔ اور وہی بیشتر ہفتوں میں کام کا سب سے چھوٹا حصہ بھی ہے۔</text><text class="m" x="758" y="418" text-anchor="end">گھنٹے اشارے ہیں، کسی سروے کی دریافت نہیں۔ نمونہ نمبروں سے زیادہ اہم ہے: جو نظر نہیں آتا اس کو وسائل نہیں ملتے،</text><text class="m" x="758" y="436" text-anchor="end">اور جو گنا نہیں جاتا اس کا بڑھنا دکھایا نہیں جا سکتا۔</text><text class="wm" x="868" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
