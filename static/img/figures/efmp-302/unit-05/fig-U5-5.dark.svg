<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Judging a proposed classroom use of technology</title><desc id="d">Table judging four proposed classroom technology uses by what each adds, what it costs, what it replaces that was working, and a verdict.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hv{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .y{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .n{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:11px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:11.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .v{font-size:11.5px;font-weight:700;text-anchor:middle} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><rect class="rl" x="20" y="28" width="170" height="52"/><rect class="hd" x="190" y="28" width="200" height="52"/><rect class="hd" x="390" y="28" width="200" height="52"/><rect class="hd" x="590" y="28" width="180" height="52"/><rect class="hv" x="770" y="28" width="110" height="52"/><text class="h" x="290" y="52" text-anchor="middle">What it adds that was</text><text class="h" x="290" y="70" text-anchor="middle">not possible before</text><text class="h" x="490" y="52" text-anchor="middle">What it costs: money,</text><text class="h" x="490" y="70" text-anchor="middle">time, training, reliability</text><text class="h" x="680" y="52" text-anchor="middle">What it replaces that</text><text class="h" x="680" y="70" text-anchor="middle">was already working</text><text class="h" x="825" y="59" text-anchor="middle">Verdict</text><g><rect class="rl" x="20" y="80" width="170" height="64"/><rect class="cl" x="190" y="80" width="200" height="64"/><rect class="cl" x="390" y="80" width="200" height="64"/><rect class="cl" x="590" y="80" width="180" height="64"/><rect class="y" x="770" y="80" width="110" height="64"/><text class="rh" x="30" y="108">Projector for</text><text class="rh" x="30" y="124">diagrams</text><text x="200" y="108">A diagram too complex</text><text x="200" y="124">to draw on a board</text><text x="400" y="108">Bulb, power supply,</text><text x="400" y="124">ten minutes of set-up</text><text x="600" y="116">Nothing</text><text class="v" x="825" y="116">Worth it</text></g><g><rect class="rl" x="20" y="144" width="170" height="64"/><rect class="cl" x="190" y="144" width="200" height="64"/><rect class="cl" x="390" y="144" width="200" height="64"/><rect class="cl" x="590" y="144" width="180" height="64"/><rect class="n" x="770" y="144" width="110" height="64"/><text class="rh" x="30" y="172">A WhatsApp</text><text class="rh" x="30" y="188">class group</text><text x="200" y="172">Reaching parents who</text><text x="200" y="188">never attend meetings</text><text x="400" y="172">Free, but no hours off;</text><text x="400" y="188">a boundary problem</text><text x="600" y="172">The boundary between</text><text x="600" y="188">work and home</text><text class="v" x="825" y="166">Only with</text><text class="v" x="825" y="184">stated hours</text></g><g><rect class="rl" x="20" y="208" width="170" height="64"/><rect class="cl" x="190" y="208" width="200" height="64"/><rect class="cl" x="390" y="208" width="200" height="64"/><rect class="cl" x="590" y="208" width="180" height="64"/><rect class="n" x="770" y="208" width="110" height="64"/><text class="rh" x="30" y="236">Tablet set for</text><text class="rh" x="30" y="252">practice drills</text><text x="200" y="236">Instant marking of</text><text x="200" y="252">routine practice</text><text x="400" y="228">High cost, charging,</text><text x="400" y="244">theft risk, training,</text><text x="400" y="260">and they break</text><text x="600" y="236">Paper practice, which</text><text x="600" y="252">was working</text><text class="v" x="825" y="244">Rarely</text></g><g><rect class="rl" x="20" y="272" width="170" height="64"/><rect class="cl" x="190" y="272" width="200" height="64"/><rect class="cl" x="390" y="272" width="200" height="64"/><rect class="cl" x="590" y="272" width="180" height="64"/><rect class="n" x="770" y="272" width="110" height="64"/><text class="rh" x="30" y="300">Video lesson replacing</text><text class="rh" x="30" y="316">an explanation</text><text x="200" y="300">A voice that is not</text><text x="200" y="316">yours, on a hard topic</text><text x="400" y="300">Bandwidth, and forty</text><text x="400" y="316">minutes you cannot adapt</text><text x="600" y="300">Your own explanation,</text><text x="600" y="316">which could respond</text><text class="v" x="825" y="308">No</text></g><text class="m" x="20" y="366">The third column is the one usually skipped. Technology that adds nothing and replaces something that worked is a net loss, however modern it looks.</text><text class="wm" x="888" y="388" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
