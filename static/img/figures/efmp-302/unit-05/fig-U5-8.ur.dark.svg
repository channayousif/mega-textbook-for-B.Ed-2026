<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چیلنج سے تبدیلی تک کا چکر</title><desc id="d">کسی نامی چیلنج کو ایک تبدیلی میں بدلنے کا فلوچارٹ - نام لیجیے، اختیار یا اثر میں رکھیے، سب سے چھوٹی تبدیلی چنیے، شہادت پہلے طے کیجیے، عمل کیجیے اور جانچیے - ایک کامیابی پیچھے رکھ کر واپس لوٹتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .alt{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .b{stroke:var(--a3);stroke-width:2;stroke-dasharray:5 4;fill:none} .r{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="470"/><rect class="st" x="690" y="40" width="180" height="62" rx="6"/><text class="h" x="780" y="66" text-anchor="middle">1 چیلنج کا نام لیجیے</text><text class="m" x="780" y="86" text-anchor="middle">ٹھیک طرح، "ششہ" نہیں</text><rect class="dc" x="440" y="40" width="200" height="62" rx="6"/><text class="h" x="540" y="64" text-anchor="middle">2 رکھیے: اختیار،</text><text class="h" x="540" y="82" text-anchor="middle">اثر، یا دونوں سے باہر</text><path class="f" d="M690 71 L645 71" marker-end="url(#a)"/><rect class="alt" x="30" y="30" width="340" height="82" rx="6"/><text class="h" x="358" y="52" text-anchor="end">اگر دونوں سے باہر ہے</text><text class="m" x="358" y="72" text-anchor="end">نام لیجیے کون عمل کر سکتا ہے، اور آپ اس سے بالکل کیا مانگیں گے۔</text><text class="m" x="358" y="90" text-anchor="end">پھر رکیے۔ یہاں لگی محنت سے مایوسی آتی ہے، اور مانگ کا</text><text class="m" x="358" y="106" text-anchor="end">نام لینا ہی واحد دستیاب قدم ہے۔</text><path class="b" d="M440 62 L375 62" marker-end="url(#b)"/><rect class="st" x="440" y="150" width="200" height="62" rx="6"/><text class="h" x="540" y="174" text-anchor="middle">3 سب سے چھوٹی تبدیلی چنیے</text><text class="h" x="540" y="192" text-anchor="middle">جو اسے چھوئے</text><path class="f" d="M540 102 L540 146" marker-end="url(#a)"/><text class="m" x="552" y="130">اختیار میں، یا اثر میں</text><rect class="st" x="440" y="250" width="200" height="62" rx="6"/><text class="h" x="540" y="274" text-anchor="middle">4 پہلے طے کیجیے</text><text class="h" x="540" y="292" text-anchor="middle">کیا دکھائے گا کہ کام ہوا</text><path class="f" d="M540 212 L540 246" marker-end="url(#a)"/><rect class="st" x="200" y="250" width="140" height="62" rx="6"/><text class="h" x="270" y="286" text-anchor="middle">5 تبدیلی کیجیے</text><path class="f" d="M440 281 L345 281" marker-end="url(#a)"/><rect class="st" x="30" y="250" width="130" height="62" rx="6"/><text class="h" x="95" y="286" text-anchor="middle">6 جانچیے</text><path class="f" d="M200 281 L165 281" marker-end="url(#a)"/><path class="r" d="M95 312 L95 370 L780 370 L780 108" marker-end="url(#c)"/><text class="m" x="450" y="392" text-anchor="middle">اگلا چیلنج، پیچھے ایک اور کام کر گئی چیز کے ساتھ</text><text class="m" x="758" y="432" text-anchor="end">چوتھا قدم سب سے زیادہ چھوٹا جاتا ہے، اور چھوڑنا ہی چکر کو ناقابلِ تردید بناتا ہے: پہلے سے چنی گئی شہادت کے بغیر،</text><text class="m" x="758" y="450" text-anchor="end">ہر تبدیلی ایسی لگتی ہے کہ کام کر گئی۔ تیسرا دوسرا ایسا ہے: اتنی بڑی تبدیلی جو مکمل نہ ہو سکے کچھ بھی نہیں سکھاتی۔</text><text class="wm" x="888" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
