<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From sustainable demand to burnout, and where it can be interrupted</title><desc id="d">Flowchart from sustainable demand through episodic stress and chronic unresolved demand to the three burnout dimensions, with side branches showing where added resources interrupt the path.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ok{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .warn{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .bad{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5} .out{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .f{stroke:var(--a3);stroke-width:2.5;fill:none} .r{stroke:var(--a1);stroke-width:2;stroke-dasharray:6 4;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="1030" height="100%"/><rect class="ok" x="30" y="150" width="170" height="70" rx="6"/><text class="h" x="115" y="178" text-anchor="middle">Demand within</text><text class="h" x="115" y="196" text-anchor="middle">resources</text><text class="m" x="115" y="212" text-anchor="middle">sustainable</text><rect class="warn" x="250" y="150" width="170" height="70" rx="6"/><text class="h" x="335" y="172" text-anchor="middle">Demand exceeds</text><text class="h" x="335" y="180" text-anchor="middle"><tspan x="335" dy="0">resources,</tspan><tspan x="335" dy="20">episodically</tspan></text><text class="m" x="335" y="198" text-anchor="middle"><tspan x="335" dy="0">stress: normal, and</tspan><tspan x="335" dy="20">recoverable</tspan></text><rect class="bad" x="470" y="150" width="170" height="70" rx="6"/><text class="h" x="555" y="178" text-anchor="middle">Chronic unresolved</text><text class="h" x="555" y="196" text-anchor="middle">demand</text><text class="m" x="555" y="202" text-anchor="middle"><tspan x="555" dy="0">no recovery between</tspan><tspan x="555" dy="20">episodes</tspan></text><path class="f" d="M200 185 L245 185" marker-end="url(#a)"/><path class="f" d="M420 185 L465 185" marker-end="url(#a)"/><rect class="out" x="700" y="56" width="180" height="62" rx="6"/><text class="h" x="790" y="82" text-anchor="middle">Exhaustion</text><text class="m" x="790" y="102" text-anchor="middle">nothing left to give</text><rect class="out" x="700" y="154" width="180" height="62" rx="6"/><text class="h" x="790" y="180" text-anchor="middle">Cynicism, distancing</text><text class="m" x="790" y="190" text-anchor="middle"><tspan x="790" dy="0">the pupils become a</tspan><tspan x="790" dy="20">category</tspan></text><rect class="out" x="700" y="252" width="180" height="62" rx="6"/><text class="h" x="790" y="272" text-anchor="middle">Reduced sense of</text><text class="h" x="790" y="290" text-anchor="middle">accomplishment</text><text class="m" x="790" y="298" text-anchor="middle"><tspan x="790" dy="0">none of it seems to</tspan><tspan x="790" dy="20">matter</tspan></text><path class="f" d="M640 172 L670 120 L696 100" marker-end="url(#a)"/><path class="f" d="M640 185 L696 185" marker-end="url(#a)"/><path class="f" d="M640 198 L670 250 L696 270" marker-end="url(#a)"/><text class="m" x="700" y="30"><tspan x="700" dy="0">Maslach's three dimensions. They</tspan><tspan x="700" dy="20">can appear separately.</tspan></text><path class="r" d="M335 150 L335 96" marker-end="url(#b)"/><rect class="ok" x="240" y="42" width="190" height="52" rx="5"/><text class="m" x="250" y="62">Resource added here:</text><text class="m" x="250" y="70"><tspan x="250" dy="0">autonomy, or a</tspan><tspan x="250" dy="20">demand removed</tspan></text><path class="r" d="M555 150 L555 96" marker-end="url(#b)"/><rect class="ok" x="460" y="42" width="190" height="52" rx="5"/><text class="m" x="470" y="62">Resource added here:</text><text class="m" x="470" y="70"><tspan x="470" dy="0">supervisory support,</tspan><tspan x="470" dy="20">shared load</tspan></text><path class="r" d="M335 220 L335 280" marker-end="url(#b)"/><rect class="ok" x="240" y="284" width="190" height="52" rx="5"/><text class="m" x="250" y="294"><tspan x="250" dy="0">Recovery time</tspan><tspan x="250" dy="20">between</tspan></text><text class="m" x="250" y="312"><tspan x="250" dy="0">episodes keeps this</tspan><tspan x="250" dy="20">reversible</tspan></text><text class="m" x="30" y="334"><tspan x="30" dy="0">Burnout is not a quantity of work.</tspan><tspan x="30" dy="20">It is the balance between demand</tspan><tspan x="30" dy="20">and resource, held wrong for long</tspan><tspan x="30" dy="20">enough that recovery stops</tspan><tspan x="30" dy="20">happening.</tspan></text><text class="m" x="30" y="364"><tspan x="30" dy="0">Which is why adding a resource</tspan><tspan x="30" dy="20">interrupts the path at any</tspan><tspan x="30" dy="20">station, and why telling a teacher</tspan><tspan x="30" dy="20">to cope adds neither.</tspan></text><text class="m" x="30" y="392"><tspan x="30" dy="0">Skaalvik and Skaalvik (2020) on</tspan><tspan x="30" dy="20">demands and resources; Maslach and</tspan><tspan x="30" dy="20">Leiter (2016) on the three</tspan><tspan x="30" dy="20">dimensions.</tspan></text><text class="wm" x="1018" y="514" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
