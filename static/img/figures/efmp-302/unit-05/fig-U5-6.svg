<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Where the professional and personal digital lives overlap</title><desc id="d">Diagram of overlapping professional and personal digital regions, with the crossing cases labelled - private messages from pupils, parents on personal accounts, personal posts visible to the school, and after-hours class groups.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .pro{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5;fill-opacity:0.75} .per{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5;fill-opacity:0.75} .cs{fill:var(--panel);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .s{font-size:11px} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="880" height="470"/><ellipse class="pro" cx="290" cy="150" rx="210" ry="110"/><ellipse class="per" cx="470" cy="150" rx="210" ry="110"/><text class="h" x="160" y="90" text-anchor="middle">Professional</text><text class="m" x="160" y="112" text-anchor="middle">class groups</text><text class="m" x="160" y="130" text-anchor="middle">school accounts</text><text class="m" x="160" y="148" text-anchor="middle">shared resources</text><text class="h" x="600" y="90" text-anchor="middle">Personal</text><text class="m" x="600" y="112" text-anchor="middle">private accounts</text><text class="m" x="600" y="130" text-anchor="middle">personal messaging</text><text class="m" x="600" y="148" text-anchor="middle">family and friends</text><text class="h" x="380" y="126" text-anchor="middle">The overlap</text><text class="m" x="380" y="146" text-anchor="middle">where the</text><text class="m" x="380" y="164" text-anchor="middle">rules are needed</text><rect class="cs" x="20" y="290" width="410" height="54" rx="5"/><text class="s" x="32" y="312">A pupil sends a private message</text><text class="m" x="32" y="332">Rule: reply on the class channel, never privately. Tell a colleague.</text><rect class="cs" x="450" y="290" width="410" height="54" rx="5"/><text class="s" x="462" y="312">A parent asks to join a personal account</text><text class="m" x="462" y="332">Rule: decline, and name the official channel instead.</text><rect class="cs" x="20" y="354" width="410" height="54" rx="5"/><text class="s" x="32" y="376">A personal post is visible to the school community</text><text class="m" x="32" y="396">Rule: assume every pupil and parent will see it, because they can.</text><rect class="cs" x="450" y="354" width="410" height="54" rx="5"/><text class="s" x="462" y="376">The class group runs after hours</text><text class="m" x="462" y="396">Rule: state the hours you answer, in writing, at the start.</text><text class="m" x="20" y="440">The overlap is not avoidable and does not need to be. What it needs is a rule decided in advance, because deciding case by case,</text><text class="m" x="20" y="458">at speed, in a message thread, is how boundaries are lost.</text><text class="wm" x="868" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
