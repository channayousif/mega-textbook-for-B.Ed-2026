<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Turning a named challenge into one change</title><desc id="d">Flowchart turning a named challenge into one change - name it, place it in control or influence, choose the smallest change, decide the evidence in advance, act and check - looping back with one more success behind you.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .alt{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .b{stroke:var(--a3);stroke-width:2;stroke-dasharray:5 4;fill:none} .r{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="st" x="30" y="40" width="180" height="62" rx="6"/><text class="h" x="120" y="66" text-anchor="middle">1 Name the challenge</text><text class="m" x="120" y="76" text-anchor="middle"><tspan x="120" dy="0">precisely, not</tspan><tspan x="120" dy="20">"discipline"</tspan></text><rect class="dc" x="260" y="40" width="200" height="62" rx="6"/><text class="h" x="360" y="64" text-anchor="middle">2 Place it: control,</text><text class="h" x="360" y="72" text-anchor="middle"><tspan x="360" dy="0">influence, or</tspan><tspan x="360" dy="20">neither</tspan></text><path class="f" d="M210 71 L255 71" marker-end="url(#a)"/><rect class="alt" x="530" y="30" width="340" height="82" rx="6"/><text class="h" x="542" y="52">If it is in neither</text><text class="m" x="542" y="62"><tspan x="542" dy="0">Name who could act, and exactly</tspan><tspan x="542" dy="20">what you would ask them.</tspan></text><text class="m" x="542" y="80"><tspan x="542" dy="0">Then stop. Effort spent here is</tspan><tspan x="542" dy="20">where frustration comes from,</tspan></text><text class="m" x="542" y="96"><tspan x="542" dy="0">and naming the ask is the only</tspan><tspan x="542" dy="20">move available.</tspan></text><path class="b" d="M460 62 L525 62" marker-end="url(#b)"/><rect class="st" x="260" y="150" width="200" height="62" rx="6"/><text class="h" x="360" y="164" text-anchor="middle"><tspan x="360" dy="0">3 Choose the</tspan><tspan x="360" dy="20">SMALLEST</tspan></text><text class="h" x="360" y="182" text-anchor="middle"><tspan x="360" dy="0">change that touches</tspan><tspan x="360" dy="20">it</tspan></text><path class="f" d="M360 102 L360 146" marker-end="url(#a)"/><text class="m" x="372" y="120"><tspan x="372" dy="0">in control, or</tspan><tspan x="372" dy="20">influence</tspan></text><rect class="st" x="260" y="250" width="200" height="62" rx="6"/><text class="h" x="360" y="274" text-anchor="middle">4 Decide IN ADVANCE</text><text class="h" x="360" y="282" text-anchor="middle"><tspan x="360" dy="0">what would show it</tspan><tspan x="360" dy="20">worked</tspan></text><path class="f" d="M360 212 L360 246" marker-end="url(#a)"/><rect class="st" x="560" y="250" width="140" height="62" rx="6"/><text class="h" x="630" y="286" text-anchor="middle">5 Make the change</text><path class="f" d="M460 281 L555 281" marker-end="url(#a)"/><rect class="st" x="740" y="250" width="130" height="62" rx="6"/><text class="h" x="805" y="286" text-anchor="middle">6 Check</text><path class="f" d="M700 281 L735 281" marker-end="url(#a)"/><path class="r" d="M805 312 L805 370 L120 370 L120 108" marker-end="url(#c)"/><text class="m" x="460" y="382" text-anchor="middle"><tspan x="460" dy="0">the next challenge, with one more</tspan><tspan x="460" dy="20">thing that worked behind you</tspan></text><text class="m" x="30" y="392"><tspan x="30" dy="0">Step 4 is the one that gets</tspan><tspan x="30" dy="20">skipped, and skipping it is what</tspan><tspan x="30" dy="20">makes the loop unfalsifiable:</tspan><tspan x="30" dy="20">without evidence chosen</tspan><tspan x="30" dy="20">beforehand,</tspan></text><text class="m" x="30" y="420"><tspan x="30" dy="0">every change feels like it worked.</tspan><tspan x="30" dy="20">Step 3 is the other: a change too</tspan><tspan x="30" dy="20">large to finish teaches nothing at</tspan><tspan x="30" dy="20">all.</tspan></text><text class="wm" x="888" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
