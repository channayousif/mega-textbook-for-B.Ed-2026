<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six parties, and the gap between what they want and what they measure</title><desc id="d">Concept map of a teacher surrounded by six parties making demands - pupils, parents, head, district, examination system and the public - each link labelled with what that party wants and what it actually measures.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--panel);stroke:var(--a2);stroke-width:2} .ng{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="920" height="470"/><rect class="ctr" x="370" y="200" width="160" height="60" rx="8"/><text class="h" x="450" y="226" text-anchor="middle">The teacher</text><text class="m" x="450" y="246" text-anchor="middle">one person, six demands</text><rect class="n" x="20" y="30" width="250" height="60" rx="6"/><text class="h" x="32" y="50">Pupils</text><text class="m" x="32" y="68">want: to understand, and to be treated fairly</text><text class="m" x="32" y="84">measure: whether the lesson was bearable</text><path class="e" d="M370 214 L278 90" marker-end="url(#a)"/><rect class="n" x="630" y="30" width="250" height="60" rx="6"/><text class="h" x="642" y="50">Parents</text><text class="m" x="642" y="68">want: their child to progress</text><text class="m" x="642" y="84">measure: the marks, and the report</text><path class="e" d="M530 214 L622 90" marker-end="url(#a)"/><rect class="n" x="20" y="120" width="250" height="60" rx="6"/><text class="h" x="32" y="140">The head teacher</text><text class="m" x="32" y="158">wants: a school that runs, and no complaints</text><text class="m" x="32" y="174">measure: whether you cause problems</text><path class="e" d="M370 222 L278 172" marker-end="url(#a)"/><rect class="ng" x="630" y="120" width="250" height="60" rx="6"/><text class="h" x="642" y="140">The district office</text><text class="m" x="642" y="158">wants: compliance and returns on time</text><text class="m" x="642" y="174">measure: the paperwork, never the teaching</text><path class="e" d="M530 222 L622 172" marker-end="url(#a)"/><rect class="ng" x="20" y="290" width="250" height="60" rx="6"/><text class="h" x="32" y="310">The examination system</text><text class="m" x="32" y="328">wants: candidates who can pass</text><text class="m" x="32" y="344">measure: one paper, on one day</text><path class="e" d="M370 248 L278 300" marker-end="url(#a)"/><rect class="ng" x="630" y="290" width="250" height="60" rx="6"/><text class="h" x="642" y="310">The wider public</text><text class="m" x="642" y="328">wants: teachers to be respected and effective</text><text class="m" x="642" y="344">measure: the aggregate result, in the newspaper</text><path class="e" d="M530 248 L622 300" marker-end="url(#a)"/><rect class="ng" x="300" y="390" width="300" height="34" rx="5"/><text class="m" x="450" y="411" text-anchor="middle">Shaded: what is measured differs most from what is wanted</text><text class="m" x="30" y="452">No party is unreasonable on its own. The load is that six of them arrive at one person, and four measure something other than what they say they want.</text><text class="wm" x="908" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
