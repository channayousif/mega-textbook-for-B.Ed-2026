<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار استعمال، تین سوالوں سے جانچے گئے</title><desc id="d">چار تجویز کردہ جماعتی ٹیکنالوجی استعمالات کا جائزہ لینے والا جدول، ہر ایک کے اضافے، لاگت، جو چیز پہلے سے کام کر رہی تھی اس کی جگہ، اور فیصلے کے حساب سے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hv{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .y{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .n{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:11px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:11.5px;font-weight:700} .v{font-size:11.5px;font-weight:700;text-anchor:middle} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><rect class="rl" x="710" y="28" width="170" height="52"/><rect class="hd" x="510" y="28" width="200" height="52"/><rect class="hd" x="310" y="28" width="200" height="52"/><rect class="hd" x="130" y="28" width="180" height="52"/><rect class="hv" x="20" y="28" width="110" height="52"/><text class="h" x="610" y="52" text-anchor="middle">وہ کیا شامل کرتا ہے</text><text class="h" x="610" y="70" text-anchor="middle">جو پہلے سے ممکن نہ تھا</text><text class="h" x="410" y="52" text-anchor="middle">لاگت: پیسہ،</text><text class="h" x="410" y="70" text-anchor="middle">وقت، تربیت، اعتماد</text><text class="h" x="220" y="52" text-anchor="middle">کس چیز کی جگہ جو</text><text class="h" x="220" y="70" text-anchor="middle">پہلے سے کام کر رہی تھی</text><text class="h" x="75" y="59" text-anchor="middle">فیصلہ</text><rect class="rl" x="710" y="80" width="170" height="64"/><rect class="cl" x="510" y="80" width="200" height="64"/><rect class="cl" x="310" y="80" width="200" height="64"/><rect class="cl" x="130" y="80" width="180" height="64"/><rect class="y" x="20" y="80" width="110" height="64"/><text class="rh" x="870" y="108" text-anchor="end">خاکوں کے لیے</text><text class="rh" x="870" y="124" text-anchor="end">پروجیکٹر</text><text x="690" y="108" text-anchor="end">بورڈ پر بننے سے بھی</text><text x="690" y="124" text-anchor="end">پیچیدہ خاکہ</text><text x="490" y="108" text-anchor="end">بلب، بجلی، لگانے میں</text><text x="490" y="124" text-anchor="end">دس منٹ</text><text x="290" y="116" text-anchor="end">کچھ نہیں</text><text class="v" x="75" y="116">قابل ہے</text><rect class="rl" x="710" y="144" width="170" height="64"/><rect class="cl" x="510" y="144" width="200" height="64"/><rect class="cl" x="310" y="144" width="200" height="64"/><rect class="cl" x="130" y="144" width="180" height="64"/><rect class="y" x="20" y="144" width="110" height="64"/><text class="rh" x="870" y="172" text-anchor="end">WhatsApp</text><text class="rh" x="870" y="188" text-anchor="end">جماعتی گروپ</text><text x="690" y="172" text-anchor="end">ان والدین تک پہنچنا</text><text x="690" y="188" text-anchor="end">جو میٹنگ میں کبھی نہیں آتے</text><text x="490" y="172" text-anchor="end">مفت، مگر چھٹی والے گھنٹے نہیں؛</text><text x="490" y="188" text-anchor="end">ایک سرحد کا مسئلہ</text><text x="290" y="172" text-anchor="end">کام اور گھر</text><text x="290" y="188" text-anchor="end">کے بیچ کی سرحد</text><text class="v" x="75" y="166">صرف بتائے گئے</text><text class="v" x="75" y="184">گھنٹوں کے ساتھ</text><rect class="rl" x="710" y="208" width="170" height="64"/><rect class="cl" x="510" y="208" width="200" height="64"/><rect class="cl" x="310" y="208" width="200" height="64"/><rect class="cl" x="130" y="208" width="180" height="64"/><rect class="n" x="20" y="208" width="110" height="64"/><text class="rh" x="870" y="236" text-anchor="end">مشق کے لیے</text><text class="rh" x="870" y="252" text-anchor="end">ٹیبلٹ سیٹ</text><text x="690" y="236" text-anchor="end">معمول کی مشق کی</text><text x="690" y="252" text-anchor="end">فوری جانچ</text><text x="490" y="228" text-anchor="end">زیادہ قیمت، چارجنگ، چوری کا خطرہ،</text><text x="490" y="244" text-anchor="end">تربیت، اور ٹوٹ جاتے</text><text x="490" y="260" text-anchor="end">ہیں</text><text x="290" y="236" text-anchor="end">کاغذ والی مشق، جو</text><text x="290" y="252" text-anchor="end">کام کر رہی تھی</text><text class="v" x="75" y="244">شاذ و نادر</text><rect class="rl" x="710" y="272" width="170" height="64"/><rect class="cl" x="510" y="272" width="200" height="64"/><rect class="cl" x="310" y="272" width="200" height="64"/><rect class="cl" x="130" y="272" width="180" height="64"/><rect class="n" x="20" y="272" width="110" height="64"/><text class="rh" x="870" y="300" text-anchor="end">وضاحت کی جگہ</text><text class="rh" x="870" y="316" text-anchor="end">ویڈیو سبق</text><text x="690" y="300" text-anchor="end">مشکل موضوع پر آپ کی</text><text x="690" y="316" text-anchor="end">نہیں والی آواز</text><text x="490" y="300" text-anchor="end">بینڈوتھ، اور چالیس منٹ</text><text x="490" y="316" text-anchor="end">جو آپ بدل نہیں سکتے</text><text x="290" y="300" text-anchor="end">آپ کی اپنی وضاحت،</text><text x="290" y="316" text-anchor="end">جو جواب دے سکتی تھی</text><text class="v" x="75" y="308">نہیں</text><text class="m" x="758" y="366" text-anchor="end">تیسرا کالم وہ ہے جو عموماً چھوٹ دیا جاتا ہے۔ جو ٹیکنالوجی کچھ شامل نہیں کرتی اور کام کرنے والی چیز کی جگہ لیتی ہے وہ خالص نقصان ہے، جتنی بھی جدید دکھے۔</text><text class="wm" x="888" y="388" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
