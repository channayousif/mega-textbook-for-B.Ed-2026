<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ فریق، چھ مانگیں</title><desc id="d">استاد کے گرد چھ مانگنے والے فریقوں کا تصوراتی نقشہ، ہر کڑی پر یہ لکھا ہے کہ وہ فریق کیا چاہتا ہے اور اصل میں کیا ناپتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--panel);stroke:var(--a2);stroke-width:2} .ng{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="920" height="470"/><rect class="ctr" x="370" y="200" width="160" height="60" rx="8"/><text class="h" x="450" y="226" text-anchor="middle">استاد</text><text class="m" x="450" y="246" text-anchor="middle">ایک شخص، چھ مانگیں</text><rect class="n" x="650" y="30" width="250" height="60" rx="6"/><text class="h" x="888" y="50" text-anchor="end">شاگرد</text><text class="m" x="888" y="68" text-anchor="end">چاہتے ہیں: سمجھنا، اور انصاف سے سلوک</text><text class="m" x="888" y="84" text-anchor="end">ناپتے ہیں: سبق برداشت کا تھا یا نہیں</text><path class="e" d="M530 214 L622 90" marker-end="url(#a)"/><rect class="ng" x="40" y="30" width="250" height="60" rx="6"/><text class="h" x="278" y="50" text-anchor="end">والدین</text><text class="m" x="278" y="68" text-anchor="end">چاہتے ہیں: ان کا بچہ آگے بڑھے</text><text class="m" x="278" y="84" text-anchor="end">ناپتے ہیں: نمبر، اور رپورٹ</text><path class="e" d="M370 214 L278 90" marker-end="url(#a)"/><rect class="n" x="650" y="120" width="250" height="60" rx="6"/><text class="h" x="888" y="140" text-anchor="end">صدرِ اسکول</text><text class="m" x="888" y="158" text-anchor="end">چاہتے ہیں: اسکول چلے، اور کوئی شکایت نہ ہو</text><text class="m" x="888" y="174" text-anchor="end">ناپتے ہیں: آپ مسئلہ بناتے ہیں یا نہیں</text><path class="e" d="M530 222 L622 172" marker-end="url(#a)"/><rect class="ng" x="40" y="120" width="250" height="60" rx="6"/><text class="h" x="278" y="140" text-anchor="end">ضلعی دفتر</text><text class="m" x="278" y="158" text-anchor="end">چاہتا ہے: کارروائی اور وقت پر رپورٹیں</text><text class="m" x="278" y="174" text-anchor="end">ناپتا ہے: کاغذی کارروائی، تدریس کبھی نہیں</text><path class="e" d="M370 222 L278 172" marker-end="url(#a)"/><rect class="ng" x="650" y="290" width="250" height="60" rx="6"/><text class="h" x="888" y="310" text-anchor="end">امتحانی نظام</text><text class="m" x="888" y="328" text-anchor="end">چاہتا ہے: ایسے امیدوار جو پاس کر سکیں</text><text class="m" x="888" y="344" text-anchor="end">ناپتا ہے: ایک پرچہ، ایک دن</text><path class="e" d="M530 248 L622 300" marker-end="url(#a)"/><rect class="ng" x="40" y="290" width="250" height="60" rx="6"/><text class="h" x="278" y="310" text-anchor="end">وسیع عوام</text><text class="m" x="278" y="328" text-anchor="end">چاہتے ہیں: استاد عزت والے اور مؤثر ہوں</text><text class="m" x="278" y="344" text-anchor="end">ناپتے ہیں: مجموعی نتیجہ، اخبار میں</text><path class="e" d="M370 248 L278 300" marker-end="url(#a)"/><rect class="ng" x="300" y="390" width="300" height="34" rx="5"/><text class="m" x="450" y="411" text-anchor="middle">سایہ والے: ناپی گئی چیز چاہی گئی چیز سے سب سے زیادہ مختلف ہے</text><text class="m" x="758" y="434" text-anchor="end">کوئی فریق اکیلے غیر معقول نہیں ہے۔ بوجھ یہ ہے کہ چھ ایک ہی شخص پر آتے ہیں، اور چار ایسی چیز ناپتے ہیں</text><text class="m" x="758" y="452" text-anchor="end">جو وہ کہتے ہیں کہ چاہتے ہیں اس سے الگ ہے۔</text><text class="wm" x="908" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
