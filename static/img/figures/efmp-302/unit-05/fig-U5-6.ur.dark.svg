<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پیشہ ورانہ اور ذاتی ڈیجیٹل حلقے</title><desc id="d">پیشہ ورانہ اور ذاتی ڈیجیٹل حلقوں کے آپس میں چھوئتے ہوئے خاکے کے ساتھ، پار ہونے والی صورتیں نشان زد - شاگردوں کے نجی پیغام، ذاتی اکاؤنٹس پر والدین، اسکول کو نظر آنے والی ذاتی پوسٹس، اور آف آورز والی جماعتی گروپس۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .pro{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5;fill-opacity:0.75} .per{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5;fill-opacity:0.75} .cs{fill:var(--panel);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .s{font-size:11px} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="880" height="470"/><ellipse class="pro" cx="590" cy="150" rx="210" ry="110"/><ellipse class="per" cx="410" cy="150" rx="210" ry="110"/><text class="h" x="720" y="90" text-anchor="middle">پیشہ ورانہ</text><text class="m" x="720" y="112" text-anchor="middle">جماعتی گروپس</text><text class="m" x="720" y="130" text-anchor="middle">اسکول اکاؤنٹس</text><text class="m" x="720" y="148" text-anchor="middle">مشترکہ مواد</text><text class="h" x="280" y="90" text-anchor="middle">ذاتی</text><text class="m" x="280" y="112" text-anchor="middle">نجی اکاؤنٹس</text><text class="m" x="280" y="130" text-anchor="middle">ذاتی پیغام رسانی</text><text class="m" x="280" y="148" text-anchor="middle">خاندان اور دوست</text><text class="h" x="500" y="126" text-anchor="middle">اوورلیپ</text><text class="m" x="500" y="146" text-anchor="middle">جہاں</text><text class="m" x="500" y="164" text-anchor="middle">قواعد درکار ہیں</text><rect class="cs" x="450" y="290" width="410" height="54" rx="5"/><text class="s" x="848" y="312" text-anchor="end">کوئی شاگرد نجی پیغام بھیجتا ہے</text><text class="m" x="848" y="332" text-anchor="end">قاعدہ: جماعتی چینل پر جواب دیجیے، کبھی نجی طور پر نہیں۔ کسی ساتھی کو بتائیے۔</text><rect class="cs" x="20" y="290" width="410" height="54" rx="5"/><text class="s" x="408" y="312" text-anchor="end">کوئی والد ذاتی اکاؤنٹ میں شامل ہونے کو کہتا ہے</text><text class="m" x="408" y="332" text-anchor="end">قاعدہ: انکار کیجیے، اور سرکاری چینل کا نام بتائیے۔</text><rect class="cs" x="450" y="354" width="410" height="54" rx="5"/><text class="s" x="848" y="376" text-anchor="end">کوئی ذاتی پوسٹ اسکول برادری کو نظر آتی ہے</text><text class="m" x="848" y="396" text-anchor="end">قاعدہ: یہ مان کے چلیے کہ ہر شاگرد اور والد اسے دیکھ سکتا ہے، کیونکہ دیکھ سکتا ہے۔</text><rect class="cs" x="20" y="354" width="410" height="54" rx="5"/><text class="s" x="408" y="376" text-anchor="end">جماعتی گروپ اوقاتِ کار کے بعد چلتا ہے</text><text class="m" x="408" y="396" text-anchor="end">قاعدہ: وہ گھنٹے تحریری طور پر شروع میں بتا دیجیے جن میں آپ جواب دیتے ہیں۔</text><text class="m" x="758" y="440" text-anchor="end">اوورلیپ سے بچا نہیں سکتا اور بچنے کی ضرورت بھی نہیں۔ اسے در ہے پہلے سے طے شدہ قاعدہ، کیونکہ مقدمہ بہ مقدمہ،</text><text class="m" x="758" y="458" text-anchor="end">تیزی سے، پیغام کے دھاگے میں فیصلہ کرنا ہی وہ طریقہ ہے جس سے سرحدیں کھو جاتی ہیں۔</text><text class="wm" x="868" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
