<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دباؤ سے پیشہ ورانہ تھکن تک کا راستہ</title><desc id="d">قابلِ برداشت تقاضے سے وقتی دباؤ اور مسلسل غیر حل شدہ تقاضے سے پیشہ ورانہ تھکن کے تین پہلو تک فلوچارٹ، سائیڈ شاخوں کے ساتھ جہاں شامل کیے گئے وسائل راستہ روکتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ok{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .warn{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .bad{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5} .out{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .f{stroke:var(--a3);stroke-width:2.5;fill:none} .r{stroke:var(--a1);stroke-width:2;stroke-dasharray:6 4;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="1030" height="480"/><rect class="ok" x="830" y="150" width="170" height="70" rx="6"/><text class="h" x="915" y="178" text-anchor="middle">وسائل کے اندر</text><text class="h" x="915" y="196" text-anchor="middle">تقاضا</text><text class="m" x="915" y="212" text-anchor="middle">قابلِ برداشت</text><rect class="warn" x="610" y="150" width="170" height="70" rx="6"/><text class="h" x="695" y="172" text-anchor="middle">تقاضا وقتی طور پر</text><text class="h" x="695" y="190" text-anchor="middle">وسائل سے بڑھ جاتا ہے</text><text class="m" x="695" y="208" text-anchor="middle">دباؤ: عام، اور بحال ہونے والا</text><rect class="bad" x="390" y="150" width="170" height="70" rx="6"/><text class="h" x="475" y="178" text-anchor="middle">مسلسل غیر حل</text><text class="h" x="475" y="196" text-anchor="middle">شدہ تقاضا</text><text class="m" x="475" y="212" text-anchor="middle">اقساط کے بیچ بحالی نہیں ہوتی</text><path class="f" d="M830 185 L785 185" marker-end="url(#a)"/><path class="f" d="M610 185 L565 185" marker-end="url(#a)"/><rect class="out" x="150" y="56" width="180" height="62" rx="6"/><text class="h" x="240" y="82" text-anchor="middle">تھکن</text><text class="m" x="240" y="102" text-anchor="middle">دینے کو کچھ نہیں بچا</text><rect class="out" x="150" y="154" width="180" height="62" rx="6"/><text class="h" x="240" y="180" text-anchor="middle">بے دلی، دوری</text><text class="m" x="240" y="200" text-anchor="middle">شاگرد ایک زمرہ بن جاتے ہیں</text><rect class="out" x="150" y="252" width="180" height="62" rx="6"/><text class="h" x="240" y="272" text-anchor="middle">کارنامے کا</text><text class="h" x="240" y="290" text-anchor="middle">کم احساس</text><text class="m" x="240" y="308" text-anchor="middle">کچھ بھی معنی نہیں رکھتا</text><path class="f" d="M390 172 L360 120 L334 100" marker-end="url(#a)"/><path class="f" d="M390 185 L334 185" marker-end="url(#a)"/><path class="f" d="M390 198 L360 250 L334 270" marker-end="url(#a)"/><text class="m" x="330" y="40" text-anchor="end">Maslach کے تین پہلو۔ یہ الگ الگ بھی ظاہر ہو سکتے ہیں۔</text><path class="r" d="M695 150 L695 96" marker-end="url(#b)"/><rect class="ok" x="600" y="42" width="190" height="52" rx="5"/><text class="m" x="780" y="62" text-anchor="end">یہاں وسائل شامل:</text><text class="m" x="780" y="80" text-anchor="end">خود مختاری، یا تقاضا ہٹا دیا گیا</text><path class="r" d="M475 150 L475 96" marker-end="url(#b)"/><rect class="ok" x="380" y="42" width="190" height="52" rx="5"/><text class="m" x="560" y="62" text-anchor="end">یہاں وسائل شامل:</text><text class="m" x="560" y="80" text-anchor="end">سرپرست کی معاونت، بانٹا ہوا بوجھ</text><path class="r" d="M695 220 L695 280" marker-end="url(#b)"/><text class="m" x="780" y="304" text-anchor="end">اقساط کے بیچ بحالی کا وقت</text><text class="m" x="780" y="322" text-anchor="end">اسے واپس آنے والا رکھتا ہے</text><text class="m" x="1000" y="374" text-anchor="end">پیشہ ورانہ تھکن کام کی مقدار نہیں ہے۔ یہ تقاضے اور وسائل کا توازن ہے جو اتنی دیر غلط پکڑا رہا کہ بحالی ہونا بند ہو گئی۔</text><text class="m" x="1000" y="394" text-anchor="end">اسی لیے وسائل شامل کرنا کسی بھی منزل پر راستہ روکتا ہے، اور اسی لیے استاد سے صرف جھیلنے کو کہنا دونوں میں سے کچھ نہیں جوڑتا۔</text><text class="m" x="1000" y="422" text-anchor="end">Skaalvik اور Skaalvik (2020) تقاضوں اور وسائل پر؛ Maslach اور Leiter (2016) تین پہلوؤں پر۔</text><text class="wm" x="1018" y="464" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
