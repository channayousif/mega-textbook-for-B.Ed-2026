<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A teacher's working week, itemised</title><desc id="d">Table itemising a teacher's working week by activity, showing rough hours, whether each activity is visible from outside the school, and whether it counts in the official workload.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} .tot{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .c{font-size:12px;text-anchor:middle} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="880" height="460"/><rect class="rl" x="20" y="28" width="320" height="52"/><rect class="hd" x="340" y="28" width="120" height="52"/><rect class="hx" x="460" y="28" width="200" height="52"/><rect class="hx" x="660" y="28" width="200" height="52"/><text class="h" x="400" y="59" text-anchor="middle">Rough hours</text><text class="h" x="560" y="50" text-anchor="middle">Visible from outside</text><text class="h" x="560" y="68" text-anchor="middle">the school?</text><text class="h" x="760" y="50" text-anchor="middle">Counted in official</text><text class="h" x="760" y="68" text-anchor="middle">workload?</text><g><rect class="rl" x="20" y="80" width="320" height="34"/><rect class="cl" x="340" y="80" width="120" height="34"/><rect class="cx" x="460" y="80" width="200" height="34"/><rect class="cx" x="660" y="80" width="200" height="34"/><text class="rh" x="30" y="102">Timetabled teaching</text><text class="c" x="400" y="102">22 to 28</text><text class="c" x="560" y="102">Yes</text><text class="c" x="760" y="102">Yes</text></g><g><rect class="rl" x="20" y="114" width="320" height="34"/><rect class="cl" x="340" y="114" width="120" height="34"/><rect class="cx" x="460" y="114" width="200" height="34"/><rect class="cx" x="660" y="114" width="200" height="34"/><text class="rh" x="30" y="136">Lesson preparation</text><text class="c" x="400" y="136">5 to 10</text><text class="c" x="560" y="136">No</text><text class="c" x="760" y="136">No</text></g><g><rect class="rl" x="20" y="148" width="320" height="34"/><rect class="cl" x="340" y="148" width="120" height="34"/><rect class="cx" x="460" y="148" width="200" height="34"/><rect class="cx" x="660" y="148" width="200" height="34"/><text class="rh" x="30" y="170">Marking</text><text class="c" x="400" y="170">4 to 8</text><text class="c" x="560" y="170">No</text><text class="c" x="760" y="170">No</text></g><g><rect class="rl" x="20" y="182" width="320" height="34"/><rect class="cl" x="340" y="182" width="120" height="34"/><rect class="cx" x="460" y="182" width="200" height="34"/><rect class="cx" x="660" y="182" width="200" height="34"/><text class="rh" x="30" y="204">Registers and administrative returns</text><text class="c" x="400" y="204">2 to 4</text><text class="c" x="560" y="204">Partly</text><text class="c" x="760" y="204">Rarely</text></g><g><rect class="rl" x="20" y="216" width="320" height="34"/><rect class="cl" x="340" y="216" width="120" height="34"/><rect class="cx" x="460" y="216" width="200" height="34"/><rect class="cx" x="660" y="216" width="200" height="34"/><text class="rh" x="30" y="238">Covering absent colleagues</text><text class="c" x="400" y="238">1 to 5</text><text class="c" x="560" y="238">No</text><text class="c" x="760" y="238">No</text></g><g><rect class="rl" x="20" y="250" width="320" height="34"/><rect class="cl" x="340" y="250" width="120" height="34"/><rect class="cx" x="460" y="250" width="200" height="34"/><rect class="cx" x="660" y="250" width="200" height="34"/><text class="rh" x="30" y="272">Examination and result duties</text><text class="c" x="400" y="272">seasonal</text><text class="c" x="560" y="272">Partly</text><text class="c" x="760" y="272">Sometimes</text></g><g><rect class="rl" x="20" y="284" width="320" height="34"/><rect class="cl" x="340" y="284" width="120" height="34"/><rect class="cx" x="460" y="284" width="200" height="34"/><rect class="cx" x="660" y="284" width="200" height="34"/><text class="rh" x="30" y="306">Community and parent contact</text><text class="c" x="400" y="306">1 to 3</text><text class="c" x="560" y="306">No</text><text class="c" x="760" y="306">No</text></g><g><rect class="rl" x="20" y="318" width="320" height="34"/><rect class="cl" x="340" y="318" width="120" height="34"/><rect class="cx" x="460" y="318" width="200" height="34"/><rect class="cx" x="660" y="318" width="200" height="34"/><text class="rh" x="30" y="340">Non-teaching duties assigned</text><text class="c" x="400" y="340">variable</text><text class="c" x="560" y="340">No</text><text class="c" x="760" y="340">No</text></g><rect class="tot" x="20" y="352" width="840" height="40"/><text class="h" x="30" y="377">Only the first row is both visible and counted. It is also the smallest part of the job most weeks.</text><text class="m" x="20" y="418">Hours are indicative, not a survey finding. The pattern matters more than the numbers: what is invisible does not get</text><text class="m" x="20" y="436">resourced, and what is uncounted cannot be shown to have grown.</text><text class="wm" x="868" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
