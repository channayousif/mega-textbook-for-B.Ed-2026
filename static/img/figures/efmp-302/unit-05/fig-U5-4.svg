<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Markers of professional status, across five occupations</title><desc id="d">Table comparing teaching with medicine, law, engineering and nursing on pay, entry selectivity, autonomy and public recognition, noting that the markers do not move together.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .rt{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .ct{fill:none;stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:12px;font-weight:700} .c{font-size:11.5px;text-anchor:middle} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="410"/><rect class="rl" x="20" y="28" width="150" height="56"/><rect class="hd" x="170" y="28" width="175" height="56"/><rect class="hd" x="345" y="28" width="185" height="56"/><rect class="hd" x="530" y="28" width="165" height="56"/><rect class="hd" x="695" y="28" width="185" height="56"/><text class="h" x="257" y="52" text-anchor="middle">Pay, against the</text><text class="h" x="257" y="70" text-anchor="middle">national average</text><text class="h" x="437" y="52" text-anchor="middle">Entry training:</text><text class="h" x="437" y="70" text-anchor="middle">length and selectivity</text><text class="h" x="612" y="52" text-anchor="middle">Day-to-day</text><text class="h" x="612" y="70" text-anchor="middle">autonomy</text><text class="h" x="787" y="52" text-anchor="middle">Public recognition</text><g><rect class="rl" x="20" y="84" width="150" height="46"/><rect class="cl" x="170" y="84" width="175" height="46"/><rect class="cl" x="345" y="84" width="185" height="46"/><rect class="cl" x="530" y="84" width="165" height="46"/><rect class="cl" x="695" y="84" width="185" height="46"/><text class="rh" x="30" y="112">Medicine</text><text class="c" x="257" y="112">Well above</text><text class="c" x="437" y="112">Long, highly selective</text><text class="c" x="612" y="112">High</text><text class="c" x="787" y="112">High</text></g><g><rect class="rl" x="20" y="130" width="150" height="46"/><rect class="cl" x="170" y="130" width="175" height="46"/><rect class="cl" x="345" y="130" width="185" height="46"/><rect class="cl" x="530" y="130" width="165" height="46"/><rect class="cl" x="695" y="130" width="185" height="46"/><text class="rh" x="30" y="158">Law</text><text class="c" x="257" y="158">Above, but uneven</text><text class="c" x="437" y="158">Long, selective</text><text class="c" x="612" y="158">High</text><text class="c" x="787" y="158">Mixed</text></g><g><rect class="rl" x="20" y="176" width="150" height="46"/><rect class="cl" x="170" y="176" width="175" height="46"/><rect class="cl" x="345" y="176" width="185" height="46"/><rect class="cl" x="530" y="176" width="165" height="46"/><rect class="cl" x="695" y="176" width="185" height="46"/><text class="rh" x="30" y="204">Engineering</text><text class="c" x="257" y="204">Above</text><text class="c" x="437" y="204">Long, moderately selective</text><text class="c" x="612" y="204">Moderate</text><text class="c" x="787" y="204">Moderate</text></g><g><rect class="rl" x="20" y="222" width="150" height="46"/><rect class="cl" x="170" y="222" width="175" height="46"/><rect class="cl" x="345" y="222" width="185" height="46"/><rect class="cl" x="530" y="222" width="165" height="46"/><rect class="cl" x="695" y="222" width="185" height="46"/><text class="rh" x="30" y="250">Nursing</text><text class="c" x="257" y="250">At or below</text><text class="c" x="437" y="250">Moderate, selective</text><text class="c" x="612" y="250">Low to moderate</text><text class="c" x="787" y="250">High</text></g><g><rect class="rt" x="20" y="268" width="150" height="46"/><rect class="ct" x="170" y="268" width="175" height="46"/><rect class="ct" x="345" y="268" width="185" height="46"/><rect class="ct" x="530" y="268" width="165" height="46"/><rect class="ct" x="695" y="268" width="185" height="46"/><text class="rh" x="30" y="296">Teaching</text><text class="c" x="257" y="296">At or below</text><text class="c" x="437" y="296">Moderate, weakly selective</text><text class="c" x="612" y="296">Low, and falling</text><text class="c" x="787" y="296">High in principle</text></g><text class="m" x="20" y="344">The markers do not move together, which is the point. Nursing has high recognition and low autonomy; teaching is recognised in principle</text><text class="m" x="20" y="362">and constrained in practice. An occupation can be called a profession on one marker while failing on three.</text><text class="m" x="20" y="390">Indicative patterns for discussion, not measured national figures. Compare them against your own system before using them.</text><text class="wm" x="888" y="398" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
