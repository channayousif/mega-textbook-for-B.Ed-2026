<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From sustainable demand to burnout, and where it can be interrupted</title><desc id="d">Flowchart from sustainable demand through episodic stress and chronic unresolved demand to the three burnout dimensions, with side branches showing where added resources interrupt the path.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ok{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .warn{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .bad{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5} .out{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .f{stroke:var(--a3);stroke-width:2.5;fill:none} .r{stroke:var(--a1);stroke-width:2;stroke-dasharray:6 4;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="480"/><rect class="ok" x="30" y="150" width="170" height="70" rx="6"/><text class="h" x="115" y="178" text-anchor="middle">Demand within</text><text class="h" x="115" y="196" text-anchor="middle">resources</text><text class="m" x="115" y="212" text-anchor="middle">sustainable</text><rect class="warn" x="250" y="150" width="170" height="70" rx="6"/><text class="h" x="335" y="172" text-anchor="middle">Demand exceeds</text><text class="h" x="335" y="190" text-anchor="middle">resources, episodically</text><text class="m" x="335" y="208" text-anchor="middle">stress: normal, and recoverable</text><rect class="bad" x="470" y="150" width="170" height="70" rx="6"/><text class="h" x="555" y="178" text-anchor="middle">Chronic unresolved</text><text class="h" x="555" y="196" text-anchor="middle">demand</text><text class="m" x="555" y="212" text-anchor="middle">no recovery between episodes</text><path class="f" d="M200 185 L245 185" marker-end="url(#a)"/><path class="f" d="M420 185 L465 185" marker-end="url(#a)"/><rect class="out" x="700" y="56" width="180" height="62" rx="6"/><text class="h" x="790" y="82" text-anchor="middle">Exhaustion</text><text class="m" x="790" y="102" text-anchor="middle">nothing left to give</text><rect class="out" x="700" y="154" width="180" height="62" rx="6"/><text class="h" x="790" y="180" text-anchor="middle">Cynicism, distancing</text><text class="m" x="790" y="200" text-anchor="middle">the pupils become a category</text><rect class="out" x="700" y="252" width="180" height="62" rx="6"/><text class="h" x="790" y="272" text-anchor="middle">Reduced sense of</text><text class="h" x="790" y="290" text-anchor="middle">accomplishment</text><text class="m" x="790" y="308" text-anchor="middle">none of it seems to matter</text><path class="f" d="M640 172 L670 120 L696 100" marker-end="url(#a)"/><path class="f" d="M640 185 L696 185" marker-end="url(#a)"/><path class="f" d="M640 198 L670 250 L696 270" marker-end="url(#a)"/><text class="m" x="700" y="40">Maslach's three dimensions. They can appear separately.</text><path class="r" d="M335 150 L335 96" marker-end="url(#b)"/><rect class="ok" x="240" y="42" width="190" height="52" rx="5"/><text class="m" x="250" y="62">Resource added here:</text><text class="m" x="250" y="80">autonomy, or a demand removed</text><path class="r" d="M555 150 L555 96" marker-end="url(#b)"/><rect class="ok" x="460" y="42" width="190" height="52" rx="5"/><text class="m" x="470" y="62">Resource added here:</text><text class="m" x="470" y="80">supervisory support, shared load</text><path class="r" d="M335 220 L335 280" marker-end="url(#b)"/><rect class="ok" x="240" y="284" width="190" height="52" rx="5"/><text class="m" x="250" y="304">Recovery time between</text><text class="m" x="250" y="322">episodes keeps this reversible</text><text class="m" x="30" y="374">Burnout is not a quantity of work. It is the balance between demand and resource, held wrong for long enough that recovery stops happening.</text><text class="m" x="30" y="394">Which is why adding a resource interrupts the path at any station, and why telling a teacher to cope adds neither.</text><text class="m" x="30" y="422">Skaalvik and Skaalvik (2020) on demands and resources; Maslach and Leiter (2016) on the three dimensions.</text><text class="wm" x="888" y="464" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
