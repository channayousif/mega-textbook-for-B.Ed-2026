<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تدریس کا دوسرے پیشوں سے موازنہ</title><desc id="d">تدریس کا طب، قانون، انجینئرنگ اور نرسنگ سے تنخواہ، داخلے کی تربیت، خود مختاری اور عوامی پذیرائی پر موازنہ، یہ نوٹ کے ساتھ کہ نشان اکٹھے نہیں چلتے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .rt{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .ct{fill:none;stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:12px;font-weight:700} .c{font-size:11.5px;text-anchor:middle} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="410"/><rect class="rl" x="730" y="28" width="150" height="56"/><rect class="hd" x="555" y="28" width="175" height="56"/><rect class="hd" x="370" y="28" width="185" height="56"/><rect class="hd" x="205" y="28" width="165" height="56"/><rect class="hd" x="20" y="28" width="185" height="56"/><text class="h" x="642" y="52" text-anchor="middle">تنخواہ، قومی اوسط</text><text class="h" x="642" y="70" text-anchor="middle">کے مقابلے</text><text class="h" x="462" y="52" text-anchor="middle">داخلے کی تربیت:</text><text class="h" x="462" y="70" text-anchor="middle">لمبائی اور چھانٹ</text><text class="h" x="287" y="52" text-anchor="middle">روزمرہ</text><text class="h" x="287" y="70" text-anchor="middle">خود مختاری</text><text class="h" x="112" y="52" text-anchor="middle">عوامی پذیرائی</text><rect class="rl" x="730" y="84" width="150" height="46"/><rect class="cl" x="555" y="84" width="175" height="46"/><rect class="cl" x="370" y="84" width="185" height="46"/><rect class="cl" x="205" y="84" width="165" height="46"/><rect class="cl" x="20" y="84" width="185" height="46"/><text class="rh" x="870" y="112" text-anchor="end">طب</text><text class="c" x="642" y="112">کافی اوپر</text><text class="c" x="462" y="112">طویل، انتہائی چھانٹ والی</text><text class="c" x="287" y="112">بلند</text><text class="c" x="112" y="112">بلند</text><rect class="rl" x="730" y="130" width="150" height="46"/><rect class="cl" x="555" y="130" width="175" height="46"/><rect class="cl" x="370" y="130" width="185" height="46"/><rect class="cl" x="205" y="130" width="165" height="46"/><rect class="cl" x="20" y="130" width="185" height="46"/><text class="rh" x="870" y="158" text-anchor="end">قانون</text><text class="c" x="642" y="158">اوپر، مگر غیر ہموار</text><text class="c" x="462" y="158">طویل، چھانٹ والی</text><text class="c" x="287" y="158">بلند</text><text class="c" x="112" y="158">ملے جلے</text><rect class="rl" x="730" y="176" width="150" height="46"/><rect class="cl" x="555" y="176" width="175" height="46"/><rect class="cl" x="370" y="176" width="185" height="46"/><rect class="cl" x="205" y="176" width="165" height="46"/><rect class="cl" x="20" y="176" width="185" height="46"/><text class="rh" x="870" y="204" text-anchor="end">انجینئرنگ</text><text class="c" x="642" y="204">اوپر</text><text class="c" x="462" y="204">طویل، درمیان چھانٹ والی</text><text class="c" x="287" y="204">درمیانہ</text><text class="c" x="112" y="204">درمیانہ</text><rect class="rl" x="730" y="222" width="150" height="46"/><rect class="cl" x="555" y="222" width="175" height="46"/><rect class="cl" x="370" y="222" width="185" height="46"/><rect class="cl" x="205" y="222" width="165" height="46"/><rect class="cl" x="20" y="222" width="185" height="46"/><text class="rh" x="870" y="250" text-anchor="end">نرسنگ</text><text class="c" x="642" y="250">برابر یا نیچے</text><text class="c" x="462" y="250">درمیانہ، چھانٹ والی</text><text class="c" x="287" y="250">کم تا درمیانہ</text><text class="c" x="112" y="250">بلند</text><rect class="rt" x="730" y="268" width="150" height="46"/><rect class="ct" x="555" y="268" width="175" height="46"/><rect class="ct" x="370" y="268" width="185" height="46"/><rect class="ct" x="205" y="268" width="165" height="46"/><rect class="ct" x="20" y="268" width="185" height="46"/><text class="rh" x="870" y="296" text-anchor="end">تدریس</text><text class="c" x="642" y="296">برابر یا نیچے</text><text class="c" x="462" y="296">درمیانہ، کمزور چھانٹ والی</text><text class="c" x="287" y="296">کم، اور گرتی ہوئی</text><text class="c" x="112" y="296">اصول میں بلند</text><text class="m" x="758" y="344" text-anchor="end">نشان اکٹھے نہیں چلتے، اور یہی نکتہ ہے۔ نرسنگ میں پذیرائی بلند اور خود مختاری کم ہے؛ تدریس اصول میں پہچانی جاتی ہے</text><text class="m" x="758" y="362" text-anchor="end">اور عمل میں بندھی ہوئی ہے۔ کوئی پیشہ ایک نشان پر پیشہ کہلا سکتا ہے جبکہ تین پر ناکام ہو۔</text><text class="m" x="758" y="390" text-anchor="end">بحث کے لیے اشارے نمونے، ناپے گئے قومی اعداد نہیں۔ استعمال سے پہلے اپنے نظام سے موازنہ کیجیے۔</text><text class="wm" x="888" y="398" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
