<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">زبانی اور غیر زبانی ذرائع کا موازنہ</title><desc id="d">زبانی اور غیر زبانی ذرائع ابلاغ کا موازنہ کرنے والا جدول: ہر ایک کیا بہتر پہنچاتا ہے، کیسے ناکام ہوتا ہے، کتنی جلدی پڑھا جاتا ہے، اور جب دونوں متضاد ہوں تو کیا ہوتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .h1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .h2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .nb{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} text{font-size:12.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="860" height="400"/><rect class="rl" x="620" y="30" width="220" height="46"/><rect class="h1" x="320" y="30" width="300" height="46"/><rect class="h2" x="20" y="30" width="300" height="46"/><text class="h" x="470" y="58" text-anchor="middle">زبانی</text><text class="h" x="170" y="58" text-anchor="middle">غیر زبانی</text><rect class="rl" x="620" y="76" width="220" height="60"/><rect class="cl" x="320" y="76" width="300" height="60"/><rect class="cl" x="20" y="76" width="300" height="60"/><text class="rh" x="830" y="104" text-anchor="end">سب سے اچھا پہنچاتا ہے</text><text x="610" y="104" text-anchor="end">صاف مواد: تعریفیں، ہدایتیں،</text><text x="610" y="124" text-anchor="end">استدلال</text><text x="310" y="104" text-anchor="end">موڈ: دلچسپی، بے صبری،</text><text x="310" y="124" text-anchor="end">آپ کی نیت کیا ہے</text><rect class="rl" x="620" y="136" width="220" height="60"/><rect class="cl" x="320" y="136" width="300" height="60"/><rect class="cl" x="20" y="136" width="300" height="60"/><text class="rh" x="830" y="164" text-anchor="end">کیسے ناکام ہوتا ہے</text><text x="610" y="164" text-anchor="end">ایک ساتھ بہت کچھ؛ وہ الفاظ</text><text x="610" y="184" text-anchor="end">جو شاگرد کے پاس نہیں</text><text x="310" y="164" text-anchor="end">غلط پڑھا جاتا ہے، اور آپ کے</text><text x="310" y="184" text-anchor="end">بھیجنے کے فیصلے کے بغیر</text><rect class="rl" x="620" y="196" width="220" height="50"/><rect class="cl" x="320" y="196" width="300" height="50"/><rect class="cl" x="20" y="196" width="300" height="50"/><text class="rh" x="830" y="226" text-anchor="end">کتنی جلدی پڑھا جاتا ہے</text><text x="610" y="226" text-anchor="end">لفظ بہ لفظ، ترتیب سے</text><text x="310" y="226" text-anchor="end">فوراً، اور سب اک ساتھ</text><rect class="rl" x="620" y="246" width="220" height="84"/><rect class="nb" x="20" y="246" width="600" height="84"/><text class="rh" x="830" y="274" text-anchor="end">جب متضاد</text><text class="rh" x="830" y="294" text-anchor="end">ہوں</text><text class="h" x="320" y="272" text-anchor="middle">جماعت غیر زبانی ذریعے پر یقین کرنے کی طرف جھکتی ہے۔</text><text class="m" x="320" y="292" text-anchor="middle">ایک پیشہ ور کا قیاس: بڑے پیمانے پر مانا ہوا، اور یہاں درج مطالعوں سے ثابت شدہ نہیں۔</text><text class="m" x="320" y="312" text-anchor="middle">"دھیرے کیجیے" کہتے ہوئے گھڑی دیکھنا صرف گھڑی دیکھنا سکھاتا ہے۔</text><text class="m" x="840" y="344" text-anchor="end">Furlich (2016): زبانی پیمانہ اہم تھا، غیر زبانی نہیں تھا۔ نمونے کی تعداد اور جگہ خلاصے میں بیان نہیں ہوئیں -</text><text class="m" x="840" y="362" text-anchor="end">اور اس کا مطلب یہ نہیں کہ ابلاغ 93 فیصد غیر زبانی ہے، یہ دعویٰ جو بار بار دہرایا جاتا ہے اور جس کے اپنے لکھنے والے نے کبھی تائید نہیں کی۔</text><text class="wm" x="848" y="386" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
