<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five relationships, and what each is for</title><desc id="d">Concept map with a teacher at the centre linked to pupils, parents, colleagues, the head and the community, each link labelled with what that relationship is for.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--panel);stroke:var(--a2);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="470"/><rect class="ctr" x="370" y="205" width="140" height="56" rx="8"/><text class="h" x="440" y="238" text-anchor="middle">The teacher</text><rect class="n" x="330" y="30" width="220" height="48" rx="6"/><text class="h" x="440" y="50" text-anchor="middle">Pupils</text><text class="m" x="440" y="68" text-anchor="middle">so a pupil will admit confusion</text><path class="e" d="M440 205 L440 82" marker-end="url(#a)"/><rect class="n" x="30" y="110" width="230" height="48" rx="6"/><text class="h" x="145" y="130" text-anchor="middle">Parents</text><text class="m" x="145" y="148" text-anchor="middle">so a parent will act at home</text><path class="e" d="M370 218 L268 150" marker-end="url(#a)"/><rect class="n" x="620" y="110" width="240" height="48" rx="6"/><text class="h" x="740" y="130" text-anchor="middle">Colleagues</text><text class="m" x="740" y="148" text-anchor="middle">so a hard class can be handed over</text><path class="e" d="M510 218 L612 150" marker-end="url(#a)"/><rect class="n" x="30" y="310" width="230" height="48" rx="6"/><text class="h" x="145" y="330" text-anchor="middle">The head teacher</text><text class="m" x="145" y="348" text-anchor="middle">so a problem is heard early</text><path class="e" d="M370 250 L268 318" marker-end="url(#a)"/><rect class="n" x="620" y="310" width="240" height="48" rx="6"/><text class="h" x="740" y="330" text-anchor="middle">The wider community</text><text class="m" x="740" y="348" text-anchor="middle">so a girl is allowed to keep attending</text><path class="e" d="M510 250 L612 318" marker-end="url(#a)"/><text class="m" x="440" y="400" text-anchor="middle">Each link is labelled with what the relationship is FOR, not with who the person is.</text><text class="m" x="440" y="420" text-anchor="middle">A relationship that achieves none of these is cordial, not professional.</text><text class="wm" x="868" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
