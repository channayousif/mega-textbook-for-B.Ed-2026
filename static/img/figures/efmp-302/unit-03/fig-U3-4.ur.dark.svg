<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پیشہ ورانہ تاثر کی تہیں</title><desc id="d">پیشہ ورانہ تاثر کا تہہ دار خاکہ: ظاہری صورت باریک بیرونی پٹی، پھر طرزِ عمل، پھر بھروسا مندی، اور مرکز میں بڑی مہارت، ہر تہہ یہ بتاتی ہے کہ وہ کیا پیغام دیتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .b1{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .b3{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b4{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .ld{stroke:var(--muted);stroke-width:1.5;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="800" height="470"/><circle class="b1" cx="520" cy="230" r="180"/><circle class="b2" cx="520" cy="230" r="152"/><circle class="b3" cx="520" cy="230" r="116"/><circle class="b4" cx="520" cy="230" r="76"/><text class="h" x="520" y="226" text-anchor="middle">مہارت</text><text class="m" x="520" y="246" text-anchor="middle">بنیاد</text><text class="h" x="520" y="180" text-anchor="middle">بھروسا مندی</text><text class="h" x="520" y="128" text-anchor="middle">طرزِ عمل</text><text class="h" x="520" y="72" text-anchor="middle">ظاہری صورت</text><line class="ld" x1="340" y1="62" x2="260" y2="62"/><line class="ld" x1="520" y1="58" x2="520" y2="40"/><line class="ld" x1="520" y1="40" x2="260" y2="40"/><rect class="b1" x="20" y="24" width="235" height="62" rx="5"/><text class="h" x="245" y="44" text-anchor="end">ظاہری صورت</text><text class="m" x="245" y="60" text-anchor="end">پیغام: میں اسے سنجیدگی سے لیتا ہوں</text><text class="m" x="245" y="76" text-anchor="end">بدلنے میں: ایک دن</text><line class="ld" x1="402" y1="128" x2="260" y2="118"/><rect class="b2" x="20" y="96" width="235" height="62" rx="5"/><text class="h" x="245" y="116" text-anchor="end">طرزِ عمل</text><text class="m" x="245" y="132" text-anchor="end">پیغام: میرے پاس آنا محفوظ ہے</text><text class="m" x="245" y="148" text-anchor="end">بدلنے میں: ہفتے</text><line class="ld" x1="420" y1="182" x2="260" y2="190"/><rect class="b3" x="20" y="168" width="235" height="62" rx="5"/><text class="h" x="245" y="188" text-anchor="end">بھروسا مندی</text><text class="m" x="245" y="204" text-anchor="end">پیغام: میرا وعدہ پکا ہے</text><text class="m" x="245" y="220" text-anchor="end">بدلنے میں: ایک میعاد</text><line class="ld" x1="444" y1="230" x2="260" y2="262"/><rect class="b4" x="20" y="240" width="235" height="62" rx="5"/><text class="h" x="245" y="260" text-anchor="end">مہارت</text><text class="m" x="245" y="276" text-anchor="end">پیغام: آپ واقعی سیکھیں گے</text><text class="m" x="245" y="292" text-anchor="end">بدلنے میں: برس</text><text class="m" x="245" y="340" text-anchor="end">پٹی کی موٹی بتاتی ہے کہ ہر ایک کیریئر</text><text class="m" x="245" y="356" text-anchor="end">پر کتنا بوجھ اٹھاتی ہے۔ سب سے تیز بدلنے</text><text class="m" x="245" y="372" text-anchor="end">والی سب سے باریک ہے، اور سب سے دیر</text><text class="m" x="245" y="388" text-anchor="end">لگانے والی مرکز ہے۔</text><text class="m" x="756" y="440" text-anchor="end">ظاہری صورت پہلا سبق کھولتی ہے۔ مہارت وہ ہے جو ایک سال بعد بچتی ہے، اور وہی واحد پٹی ہے جس پر شاگرد بھروسہ کر سکے۔</text><text class="wm" x="788" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
