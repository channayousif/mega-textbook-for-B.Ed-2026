<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معلم کی افادیت کس چیز سے بنتی ہے</title><desc id="d">معلم کی افادیت کا تصوراتی نقشہ جو جماعت کے اندر کے عوامل اور جماعت سے باہر کے عوامل میں شاخیں نکالتا ہے، ہر پتہ یہ بتاتا ہے کہ وہ کس شہادت سے ثابت ہوتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .g1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .g2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .lf{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .e1{stroke:var(--a2);stroke-width:2;fill:none} .e2{stroke:var(--a3);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="460"/><rect class="ctr" x="350" y="205" width="200" height="56" rx="8"/><text class="h" x="450" y="230" text-anchor="middle">معلم کی</text><text class="h" x="450" y="248" text-anchor="middle">افادیت</text><rect class="g1" x="610" y="30" width="230" height="44" rx="6"/><text class="h" x="725" y="58" text-anchor="middle">جماعت کے اندر کے عوامل</text><rect class="g2" x="60" y="30" width="230" height="44" rx="6"/><text class="h" x="175" y="58" text-anchor="middle">جماعت سے باہر کے عوامل</text><path class="e1" d="M550 225 L600 120 L610 74"/><path class="e2" d="M350 225 L300 120 L290 74"/><rect class="lf" x="610" y="92" width="270" height="38" rx="5"/><text x="870" y="108" text-anchor="end">مضمون اور تدریسی علم</text><text class="m" x="870" y="125" text-anchor="end">شہادت: کیا درست وضاحت ہو کر سامنے آتی ہے</text><rect class="lf" x="610" y="136" width="270" height="38" rx="5"/><text x="870" y="152" text-anchor="end">منصوبہ بندی</text><text class="m" x="870" y="169" text-anchor="end">شہادت: ترتیب، منصوبے کے کاغذ سے نہیں</text><rect class="lf" x="610" y="180" width="270" height="38" rx="5"/><text x="870" y="196" text-anchor="end">وضاحت اور سوال کرنا</text><text class="m" x="870" y="213" text-anchor="end">شہادت: کون جواب دیتا ہے، اور کتنی بار</text><rect class="lf" x="610" y="224" width="270" height="38" rx="5"/><text x="870" y="240" text-anchor="end">تشخیص کا استعمال</text><text class="m" x="870" y="257" text-anchor="end">شہادت: جانچ کے بعد کیا بدلا</text><rect class="lf" x="610" y="268" width="270" height="38" rx="5"/><text x="870" y="284" text-anchor="end">ماحول اور انتظام</text><text class="m" x="870" y="301" text-anchor="end">شہادت: کتنا وقت گیا، اور کون جواب کا خطرہ لیتا ہے</text><rect class="lf" x="20" y="92" width="270" height="38" rx="5"/><text x="280" y="108" text-anchor="end">ساتھی اساتذہ کے لیے حصہ داری</text><text class="m" x="280" y="125" text-anchor="end">شہادت: دوسرے کیا اپناتے ہیں</text><rect class="lf" x="20" y="136" width="270" height="38" rx="5"/><text x="280" y="152" text-anchor="end">والدین سے تعلقات</text><text class="m" x="280" y="169" text-anchor="end">شہادت: رابطے کے بعد گھر پر کیا ہوتا ہے</text><rect class="lf" x="20" y="180" width="270" height="38" rx="5"/><text x="280" y="196" text-anchor="end">برادری کے رابطے</text><text class="m" x="280" y="213" text-anchor="end">شہادت: حاضری، اور کون لوٹتا ہے</text><rect class="lf" x="20" y="224" width="270" height="38" rx="5"/><text x="280" y="240" text-anchor="end">پیشہ ورانہ تعلم</text><text class="m" x="280" y="257" text-anchor="end">شہادت: بدلی ہوئی مشق، بیٹھے گھنٹے نہیں</text><path class="e1" d="M610 111 L560 111 L560 205"/><path class="e1" d="M610 155 L570 155 L570 210"/><path class="e1" d="M610 199 L555 199 L555 215"/><path class="e1" d="M610 243 L555 243"/><path class="e1" d="M610 287 L560 287 L560 255"/><path class="e2" d="M290 111 L340 111 L340 205"/><path class="e2" d="M290 155 L330 155 L330 210"/><path class="e2" d="M290 199 L345 199 L345 215"/><path class="e2" d="M290 243 L345 243"/><text class="m" x="450" y="330" text-anchor="middle">افادیت عملوں کا گچھا ہے، کوئی ایک خصوصیت نہیں۔</text><text class="m" x="450" y="350" text-anchor="middle">ہر پتہ یہ بتاتا ہے کہ وہ کس شہادت سے ثابت ہوتا ہے، کیونکہ بغیر شہادت والا دعویٰ ساتھی پر رائے ہے۔</text><text class="m" x="450" y="378" text-anchor="middle">Taylor اور Thion (2023): بہت سے مقالات غلط یا صرف اشارہ شدہ تعریفیں استعمال کرتے ہیں۔</text><text class="wm" x="888" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
