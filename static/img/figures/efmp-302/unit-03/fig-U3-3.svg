<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Seven traits, and how each fails when overdone</title><desc id="d">Table of seven teacher personality traits - empathy, patience, self-control, optimism, humour, resilience and adaptability - showing how each appears in a classroom, what it makes possible, and how each fails when overdone.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="rl" x="20" y="30" width="130" height="40"/><rect class="hd" x="150" y="30" width="250" height="40"/><rect class="hd" x="400" y="30" width="230" height="40"/><rect class="hx" x="630" y="30" width="250" height="40"/><text class="h" x="275" y="45" text-anchor="middle"><tspan x="275" dy="0">How it shows in</tspan><tspan x="275" dy="20">class</tspan></text><text class="h" x="515" y="45" text-anchor="middle"><tspan x="515" dy="0">What it makes</tspan><tspan x="515" dy="20">possible</tspan></text><text class="h" x="755" y="45" text-anchor="middle"><tspan x="755" dy="0">How it fails when</tspan><tspan x="755" dy="20">overdone</tspan></text><g><rect class="rl" x="20" y="70" width="130" height="52"/><rect class="cl" x="150" y="70" width="250" height="52"/><rect class="cl" x="400" y="70" width="230" height="52"/><rect class="cx" x="630" y="70" width="250" height="52"/><text class="rh" x="30" y="100">Empathy</text><text x="160" y="90"><tspan x="160" dy="0">Reads confusion</tspan><tspan x="160" dy="20">before it is said</tspan></text><text x="410" y="90"><tspan x="410" dy="0">Pupils admit not</tspan><tspan x="410" dy="20">knowing</tspan></text><text x="640" y="90"><tspan x="640" dy="0">Standards quietly</tspan><tspan x="640" dy="20">lowered</tspan></text></g><g><rect class="rl" x="20" y="122" width="130" height="52"/><rect class="cl" x="150" y="122" width="250" height="52"/><rect class="cl" x="400" y="122" width="230" height="52"/><rect class="cx" x="630" y="122" width="250" height="52"/><text class="rh" x="30" y="152">Patience</text><text x="160" y="152">Waits after asking</text><text x="410" y="142"><tspan x="410" dy="0">Slower thinkers</tspan><tspan x="410" dy="20">answer</tspan></text><text x="640" y="142"><tspan x="640" dy="0">Drift; the lesson</tspan><tspan x="640" dy="20">never lands</tspan></text></g><g><rect class="rl" x="20" y="174" width="130" height="52"/><rect class="cl" x="150" y="174" width="250" height="52"/><rect class="cl" x="400" y="174" width="230" height="52"/><rect class="cx" x="630" y="174" width="250" height="52"/><text class="rh" x="30" y="204">Self-control</text><text x="160" y="194"><tspan x="160" dy="0">Answers provocation</tspan><tspan x="160" dy="20">evenly</tspan></text><text x="410" y="204">The room stays safe</text><text x="640" y="194"><tspan x="640" dy="0">Reads as cold;</tspan><tspan x="640" dy="20">nothing is modelled</tspan></text></g><g><rect class="rl" x="20" y="226" width="130" height="52"/><rect class="cl" x="150" y="226" width="250" height="52"/><rect class="cl" x="400" y="226" width="230" height="52"/><rect class="cx" x="630" y="226" width="250" height="52"/><text class="rh" x="30" y="256">Optimism</text><text x="160" y="246"><tspan x="160" dy="0">Treats failure as</tspan><tspan x="160" dy="20">this-time</tspan></text><text x="410" y="256">Pupils try again</text><text x="640" y="246"><tspan x="640" dy="0">Real difficulty goes</tspan><tspan x="640" dy="20">unnamed</tspan></text></g><g><rect class="rl" x="20" y="278" width="130" height="52"/><rect class="cl" x="150" y="278" width="250" height="52"/><rect class="cl" x="400" y="278" width="230" height="52"/><rect class="cx" x="630" y="278" width="250" height="52"/><text class="rh" x="30" y="308">Humour</text><text x="160" y="298"><tspan x="160" dy="0">Releases tension,</tspan><tspan x="160" dy="20">never at a pupil</tspan></text><text x="410" y="298"><tspan x="410" dy="0">Mistakes stop</tspan><tspan x="410" dy="20">costing face</tspan></text><text x="640" y="298"><tspan x="640" dy="0">Authority spent;</tspan><tspan x="640" dy="20">lessons derail</tspan></text></g><g><rect class="rl" x="20" y="330" width="130" height="52"/><rect class="cl" x="150" y="330" width="250" height="52"/><rect class="cl" x="400" y="330" width="230" height="52"/><rect class="cx" x="630" y="330" width="250" height="52"/><text class="rh" x="30" y="360">Resilience</text><text x="160" y="350"><tspan x="160" dy="0">Returns after a bad</tspan><tspan x="160" dy="20">lesson</tspan></text><text x="410" y="350"><tspan x="410" dy="0">A career survives</tspan><tspan x="410" dy="20">hard terms</tspan></text><text x="640" y="350"><tspan x="640" dy="0">Endures what should</tspan><tspan x="640" dy="20">be reported</tspan></text></g><g><rect class="rl" x="20" y="382" width="130" height="52"/><rect class="cl" x="150" y="382" width="250" height="52"/><rect class="cl" x="400" y="382" width="230" height="52"/><rect class="cx" x="630" y="382" width="250" height="52"/><text class="rh" x="30" y="412">Adaptability</text><text x="160" y="402"><tspan x="160" dy="0">Changes plan</tspan><tspan x="160" dy="20">mid-lesson</tspan></text><text x="410" y="402"><tspan x="410" dy="0">The unexpected is</tspan><tspan x="410" dy="20">usable</tspan></text><text x="640" y="402"><tspan x="640" dy="0">No routine; pupils</tspan><tspan x="640" dy="20">cannot predict</tspan></text></g><text class="m" x="20" y="416"><tspan x="20" dy="0">The dashed column is the part</tspan><tspan x="20" dy="20">usually left out: every trait has</tspan><tspan x="20" dy="20">an excess, and the excess is a</tspan><tspan x="20" dy="20">professional problem, not a</tspan><tspan x="20" dy="20">personality quirk.</tspan></text><text class="wm" x="888" y="506" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
