<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Seven traits, and how each fails when overdone</title><desc id="d">Table of seven teacher personality traits - empathy, patience, self-control, optimism, humour, resilience and adaptability - showing how each appears in a classroom, what it makes possible, and how each fails when overdone.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="470"/><rect class="rl" x="20" y="30" width="130" height="40"/><rect class="hd" x="150" y="30" width="250" height="40"/><rect class="hd" x="400" y="30" width="230" height="40"/><rect class="hx" x="630" y="30" width="250" height="40"/><text class="h" x="275" y="55" text-anchor="middle">How it shows in class</text><text class="h" x="515" y="55" text-anchor="middle">What it makes possible</text><text class="h" x="755" y="55" text-anchor="middle">How it fails when overdone</text><g><rect class="rl" x="20" y="70" width="130" height="52"/><rect class="cl" x="150" y="70" width="250" height="52"/><rect class="cl" x="400" y="70" width="230" height="52"/><rect class="cx" x="630" y="70" width="250" height="52"/><text class="rh" x="30" y="100">Empathy</text><text x="160" y="100">Reads confusion before it is said</text><text x="410" y="100">Pupils admit not knowing</text><text x="640" y="100">Standards quietly lowered</text></g><g><rect class="rl" x="20" y="122" width="130" height="52"/><rect class="cl" x="150" y="122" width="250" height="52"/><rect class="cl" x="400" y="122" width="230" height="52"/><rect class="cx" x="630" y="122" width="250" height="52"/><text class="rh" x="30" y="152">Patience</text><text x="160" y="152">Waits after asking</text><text x="410" y="152">Slower thinkers answer</text><text x="640" y="152">Drift; the lesson never lands</text></g><g><rect class="rl" x="20" y="174" width="130" height="52"/><rect class="cl" x="150" y="174" width="250" height="52"/><rect class="cl" x="400" y="174" width="230" height="52"/><rect class="cx" x="630" y="174" width="250" height="52"/><text class="rh" x="30" y="204">Self-control</text><text x="160" y="204">Answers provocation evenly</text><text x="410" y="204">The room stays safe</text><text x="640" y="204">Reads as cold; nothing is modelled</text></g><g><rect class="rl" x="20" y="226" width="130" height="52"/><rect class="cl" x="150" y="226" width="250" height="52"/><rect class="cl" x="400" y="226" width="230" height="52"/><rect class="cx" x="630" y="226" width="250" height="52"/><text class="rh" x="30" y="256">Optimism</text><text x="160" y="256">Treats failure as this-time</text><text x="410" y="256">Pupils try again</text><text x="640" y="256">Real difficulty goes unnamed</text></g><g><rect class="rl" x="20" y="278" width="130" height="52"/><rect class="cl" x="150" y="278" width="250" height="52"/><rect class="cl" x="400" y="278" width="230" height="52"/><rect class="cx" x="630" y="278" width="250" height="52"/><text class="rh" x="30" y="308">Humour</text><text x="160" y="308">Releases tension, never at a pupil</text><text x="410" y="308">Mistakes stop costing face</text><text x="640" y="308">Authority spent; lessons derail</text></g><g><rect class="rl" x="20" y="330" width="130" height="52"/><rect class="cl" x="150" y="330" width="250" height="52"/><rect class="cl" x="400" y="330" width="230" height="52"/><rect class="cx" x="630" y="330" width="250" height="52"/><text class="rh" x="30" y="360">Resilience</text><text x="160" y="360">Returns after a bad lesson</text><text x="410" y="360">A career survives hard terms</text><text x="640" y="360">Endures what should be reported</text></g><g><rect class="rl" x="20" y="382" width="130" height="52"/><rect class="cl" x="150" y="382" width="250" height="52"/><rect class="cl" x="400" y="382" width="230" height="52"/><rect class="cx" x="630" y="382" width="250" height="52"/><text class="rh" x="30" y="412">Adaptability</text><text x="160" y="412">Changes plan mid-lesson</text><text x="410" y="412">The unexpected is usable</text><text x="640" y="412">No routine; pupils cannot predict</text></g><text class="m" x="20" y="456">The dashed column is the part usually left out: every trait has an excess, and the excess is a professional problem, not a personality quirk.</text><text class="wm" x="888" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
