<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three competing definitions of teacher effectiveness</title><desc id="d">Table comparing three definitions of teacher effectiveness - achievement gain, observed practice and breadth of learner outcomes - by what each counts, captures, misses, and who uses it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} text{font-size:12.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="rl" x="20" y="30" width="180" height="54"/><rect class="hd" x="200" y="30" width="230" height="54"/><rect class="hd" x="430" y="30" width="230" height="54"/><rect class="hd" x="660" y="30" width="220" height="54"/><text class="h" x="315" y="52" text-anchor="middle">Achievement gain</text><text class="m" x="315" y="70" text-anchor="middle">test-score growth</text><text class="h" x="545" y="52" text-anchor="middle">Observed practice</text><text class="m" x="545" y="60" text-anchor="middle"><tspan x="545" dy="0">what the teacher</tspan><tspan x="545" dy="20">does</tspan></text><text class="h" x="770" y="52" text-anchor="middle">Breadth of outcomes</text><text class="m" x="770" y="70" text-anchor="middle">all that pupils gain</text><rect class="rl" x="20" y="84" width="180" height="74"/><rect class="cl" x="200" y="84" width="230" height="74"/><rect class="cl" x="430" y="84" width="230" height="74"/><rect class="cl" x="660" y="84" width="220" height="74"/><text class="rh" x="32" y="112">What it counts</text><text x="212" y="112">Score change over</text><text x="212" y="130">one year</text><text x="442" y="112">Rated behaviours in</text><text x="442" y="130">lessons</text><text x="672" y="112">Attainment plus</text><text x="672" y="130">conduct and attitude</text><rect class="rl" x="20" y="158" width="180" height="74"/><rect class="cl" x="200" y="158" width="230" height="74"/><rect class="cl" x="430" y="158" width="230" height="74"/><rect class="cl" x="660" y="158" width="220" height="74"/><text class="rh" x="32" y="186">Captures well</text><text x="212" y="186">Learning that tests</text><text x="212" y="204">are built to measure</text><text x="442" y="186">Teachable, nameable</text><text x="442" y="204">craft</text><text x="672" y="186">What schools are</text><text x="672" y="204">actually asked to do</text><rect class="rl" x="20" y="232" width="180" height="74"/><rect class="cl" x="200" y="232" width="230" height="74"/><rect class="cl" x="430" y="232" width="230" height="74"/><rect class="cl" x="660" y="232" width="220" height="74"/><text class="rh" x="32" y="260">What it misses</text><text x="212" y="260">Untested subjects;</text><text x="212" y="278">intake differences</text><text x="442" y="260">Whether pupils</text><text x="442" y="278">actually learned</text><text x="672" y="260">Agreement on what</text><text x="672" y="278">counts, and how</text><rect class="rl" x="20" y="306" width="180" height="60"/><rect class="cl" x="200" y="306" width="230" height="60"/><rect class="cl" x="430" y="306" width="230" height="60"/><rect class="cl" x="660" y="306" width="220" height="60"/><text class="rh" x="32" y="334">Typically used by</text><text x="212" y="334">Systems, at scale</text><text x="442" y="334">Heads and mentors</text><text x="672" y="334">Policy and research</text><text class="m" x="20" y="358"><tspan x="20" dy="0">No single measure carries all</tspan><tspan x="20" dy="20">three. Goe, Bell and Little</tspan><tspan x="20" dy="20">(2008): multiple measures, each</tspan><tspan x="20" dy="20">for a different aspect.</tspan></text><text class="wm" x="888" y="438" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
