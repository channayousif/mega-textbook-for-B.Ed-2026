<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five roles, each as one Monday-morning act</title><desc id="d">Concept map of a teacher at the centre with five branches - facilitator, researcher, change agent, moral agent and life-long learner - each ending in one concrete classroom act that expresses that role.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .r{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .act{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .e{stroke:var(--a2);stroke-width:2;fill:none} .e2{stroke:var(--muted);stroke-width:1.5;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="470"/><rect class="ctr" x="30" y="200" width="150" height="60" rx="8"/><text class="h" x="105" y="226" text-anchor="middle">The teacher</text><text class="m" x="105" y="246" text-anchor="middle">on Monday</text><rect class="r" x="250" y="26" width="190" height="42" rx="6"/><text class="h" x="345" y="52" text-anchor="middle">Facilitator</text><rect class="act" x="470" y="26" width="410" height="42" rx="5"/><text x="482" y="52">Sets a task pupils can get wrong safely</text><path class="e" d="M180 212 L230 60 L246 47" marker-end="url(#a)"/><path class="e2" d="M440 47 L466 47" marker-end="url(#b)"/><rect class="r" x="250" y="108" width="190" height="42" rx="6"/><text class="h" x="345" y="134" text-anchor="middle">Researcher</text><rect class="act" x="470" y="108" width="410" height="42" rx="5"/><text x="482" y="134">Keeps last year's marks, to compare with this year's</text><path class="e" d="M180 218 L230 132 L246 129" marker-end="url(#a)"/><path class="e2" d="M440 129 L466 129" marker-end="url(#b)"/><rect class="r" x="250" y="190" width="190" height="42" rx="6"/><text class="h" x="345" y="216" text-anchor="middle">Change agent</text><rect class="act" x="470" y="190" width="410" height="42" rx="5"/><text x="482" y="216">Raises one workable change at the staff meeting</text><path class="e" d="M180 226 L246 214" marker-end="url(#a)"/><path class="e2" d="M440 211 L466 211" marker-end="url(#b)"/><rect class="r" x="250" y="272" width="190" height="42" rx="6"/><text class="h" x="345" y="298" text-anchor="middle">Moral agent</text><rect class="act" x="470" y="272" width="410" height="42" rx="5"/><text x="482" y="298">Admits an error in front of the class, and corrects it</text><path class="e" d="M180 242 L230 288 L246 293" marker-end="url(#a)"/><path class="e2" d="M440 293 L466 293" marker-end="url(#b)"/><rect class="r" x="250" y="354" width="190" height="42" rx="6"/><text class="h" x="345" y="380" text-anchor="middle">Life-long learner</text><rect class="act" x="470" y="354" width="410" height="42" rx="5"/><text x="482" y="380">Reads one thing about a topic they teach badly</text><path class="e" d="M180 250 L230 370 L246 375" marker-end="url(#a)"/><path class="e2" d="M440 375 L466 375" marker-end="url(#b)"/><text class="m" x="30" y="436">Each role is named by an act, not an attitude. An act can be planned, observed, and done again next Monday.</text><text class="wm" x="888" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
