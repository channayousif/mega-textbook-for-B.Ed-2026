<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ کردار، ہر ایک پیر صبح کے ایک فعل کے طور پر</title><desc id="d">استاد کا تصوراتی نقشہ جس کے مرکز سے پانچ شاخیں نکلی ہیں - سہولت کار، محقق، تبدیلی کا داعی، اخلاقی نمونہ اور تاحیات سیکھنے والا - ہر ایک ایک ٹھوس جماعتی فعل پر ختم ہوتی ہے جو اس کردار کا اظہار ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .r{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .act{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .e{stroke:var(--a2);stroke-width:2;fill:none} .e2{stroke:var(--muted);stroke-width:1.5;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="470"/><rect class="ctr" x="720" y="200" width="150" height="60" rx="8"/><text class="h" x="795" y="226" text-anchor="middle">استاد</text><text class="m" x="795" y="246" text-anchor="middle">پیر کو</text><rect class="r" x="460" y="26" width="190" height="42" rx="6"/><text class="h" x="555" y="52" text-anchor="middle">سہولت کار</text><rect class="act" x="20" y="26" width="410" height="42" rx="5"/><text x="418" y="52" text-anchor="end">ایسا کام دیجیے جس میں شاگرد محفوظ طریقے سے غلط ہو سکے</text><path class="e" d="M720 212 L670 60 L654 47" marker-end="url(#a)"/><path class="e2" d="M460 47 L434 47" marker-end="url(#b)"/><rect class="r" x="460" y="108" width="190" height="42" rx="6"/><text class="h" x="555" y="134" text-anchor="middle">محقق</text><rect class="act" x="20" y="108" width="410" height="42" rx="5"/><text x="418" y="134" text-anchor="end">پچھلے سال کے نمبر رکھیے، اس سال والوں سے موازنے کے لیے</text><path class="e" d="M720 218 L670 132 L654 129" marker-end="url(#a)"/><path class="e2" d="M460 129 L434 129" marker-end="url(#b)"/><rect class="r" x="460" y="190" width="190" height="42" rx="6"/><text class="h" x="555" y="216" text-anchor="middle">تبدیلی کا داعی</text><rect class="act" x="20" y="190" width="410" height="42" rx="5"/><text x="418" y="216" text-anchor="end">اسٹاف میٹنگ میں ایک قابلِ عمل تبدیلی اٹھائیے</text><path class="e" d="M720 226 L654 214" marker-end="url(#a)"/><path class="e2" d="M460 211 L434 211" marker-end="url(#b)"/><rect class="r" x="460" y="272" width="190" height="42" rx="6"/><text class="h" x="555" y="298" text-anchor="middle">اخلاقی نمونہ</text><rect class="act" x="20" y="272" width="410" height="42" rx="5"/><text x="418" y="298" text-anchor="end">جماعت کے سامنے اپنی غلطی مانے اور درست کرے</text><path class="e" d="M720 242 L670 288 L654 293" marker-end="url(#a)"/><path class="e2" d="M460 293 L434 293" marker-end="url(#b)"/><rect class="r" x="460" y="354" width="190" height="42" rx="6"/><text class="h" x="555" y="380" text-anchor="middle">تاحیات سیکھنے والا</text><rect class="act" x="20" y="354" width="410" height="42" rx="5"/><text x="418" y="380" text-anchor="end">اس موضوع پر ایک چیز پڑھے جو وہ برا پڑھاتا ہے</text><path class="e" d="M720 250 L670 370 L654 375" marker-end="url(#a)"/><path class="e2" d="M460 375 L434 375" marker-end="url(#b)"/><text class="m" x="870" y="436" text-anchor="end">ہر کردار کا نام فعل سے ہے، رویے سے نہیں۔ فعل کی منصوبہ بندی ہو سکتی ہے، مشاہدہ ہو سکتا ہے، اور اگلے پیر دوبارہ کیا جا سکتا ہے۔</text><text class="wm" x="888" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
