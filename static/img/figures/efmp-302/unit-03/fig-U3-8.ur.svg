<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">غیر زبانی ذرائع، کلاس روم کے اوپر سے</title><desc id="d">کلاس روم کا اوپر سے خاکہ جو استاد کے غیر زبانی ذرائع اپنی جگہ پر نشان زد کرتا ہے - قربت، جسم کا رخ، نگاہ، اشارہ اور آواز کی رنگینی - ہر ایک اپنے جماعتی استعمال کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .room{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .desk{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .board{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .tch{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .gz{stroke:var(--a4);stroke-width:1.8;stroke-dasharray:6 4;fill:none} .pr{stroke:var(--a3);stroke-width:2;fill:none} .or{stroke:var(--a1);stroke-width:2.5;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a4)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="490"/><rect class="room" x="350" y="60" width="480" height="340" rx="4"/><rect class="board" x="460" y="46" width="260" height="20" rx="3"/><text class="h" x="590" y="38" text-anchor="middle">تختہ</text><g class="desk"><rect x="710" y="140" width="80" height="40" rx="3"/><rect x="610" y="140" width="80" height="40" rx="3"/><rect x="490" y="140" width="80" height="40" rx="3"/><rect x="390" y="140" width="80" height="40" rx="3"/><rect x="710" y="230" width="80" height="40" rx="3"/><rect x="610" y="230" width="80" height="40" rx="3"/><rect x="490" y="230" width="80" height="40" rx="3"/><rect x="390" y="230" width="80" height="40" rx="3"/><rect x="710" y="320" width="80" height="40" rx="3"/><rect x="610" y="320" width="80" height="40" rx="3"/><rect x="490" y="320" width="80" height="40" rx="3"/><rect x="390" y="320" width="80" height="40" rx="3"/></g><circle class="tch" cx="645" cy="100" r="18"/><text class="m" x="645" y="104" text-anchor="middle">ا</text><path class="or" d="M645 118 L645 150" marker-end="url(#o)"/><path class="pr" d="M645 100 m-46 0 a46 46 0 1 0 92 0 a46 46 0 1 0 -92 0"/><path class="gz" d="M627 100 L460 245" marker-end="url(#g)"/><path class="gz" d="M645 118 L750 330" marker-end="url(#g)"/><path class="gz" d="M630 112 L560 330" marker-end="url(#g)"/><line class="or" x1="663" y1="92" x2="710" y2="62" marker-end="url(#o)"/><rect class="tch" x="20" y="60" width="300" height="56" rx="5"/><text class="h" x="310" y="82" text-anchor="end">قربت</text><text class="m" x="310" y="100" text-anchor="end">وہ دائرہ جس تک بغیر کمرہ پار کیے پہنچا جا سکے</text><rect class="board" x="20" y="128" width="300" height="56" rx="5"/><text class="h" x="310" y="150" text-anchor="end">جسم کا رخ</text><text class="m" x="310" y="168" text-anchor="end">جس کی طرف منہ وہی آپ کے پڑھانے کا مخاطب ہے</text><rect class="desk" x="20" y="196" width="300" height="56" rx="5"/><text class="h" x="310" y="218" text-anchor="end">نگاہ</text><text class="m" x="310" y="236" text-anchor="end">پچھلی قطار اور کونوں تک پہنچتی ہے، یا نہیں</text><rect class="desk" x="20" y="264" width="300" height="56" rx="5"/><text class="h" x="310" y="286" text-anchor="end">اشارہ</text><text class="m" x="310" y="304" text-anchor="end">تختے پر: جس چیز کا نام لیا جا رہا ہے اس کی طرف</text><rect class="desk" x="20" y="332" width="300" height="56" rx="5"/><text class="h" x="310" y="354" text-anchor="end">آواز کی رنگینی</text><text class="m" x="310" y="372" text-anchor="end">جہاں کھڑے ہیں وہاں سے سنائی دیتی ہے، یا دوسری قطار پر رکتی ہے</text><text class="m" x="830" y="432" text-anchor="end">پورا سبق تختے کے سامنے کھڑے ہو کر گزارنا ان پانچ میں سے چار بند کر دیتا ہے۔ جگہ ایک تدریسی فیصلہ ہے، عادت نہیں۔</text><text class="wm" x="848" y="472" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
