<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معلم کی افادیت کی تین مقابلہ بازی تعریفیں</title><desc id="d">معلم کی افادیت کی تین تعریفوں کا موازنہ کرنے والا جدول - حاصلات میں اضافہ، مشاہدہ شدہ عمل اور سیکھنے والوں کے وسیع نتائج - ہر ایک کے حساب، پہنچ، کمی، اور استعمال کرنے والے کے حساب سے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} text{font-size:12.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><rect class="rl" x="700" y="30" width="180" height="54"/><rect class="hd" x="470" y="30" width="230" height="54"/><rect class="hd" x="240" y="30" width="230" height="54"/><rect class="hd" x="20" y="30" width="220" height="54"/><text class="h" x="585" y="52" text-anchor="middle">حاصلات میں اضافہ</text><text class="m" x="585" y="70" text-anchor="middle">ٹیسٹ نمبر میں بڑوتری</text><text class="h" x="355" y="52" text-anchor="middle">مشاہدہ شدہ عمل</text><text class="m" x="355" y="70" text-anchor="middle">استاد کیا کرتا ہے</text><text class="h" x="130" y="52" text-anchor="middle">نتائج کی وسعت</text><text class="m" x="130" y="70" text-anchor="middle">جو کچھ شاگرد پاتے ہیں</text><rect class="rl" x="700" y="84" width="180" height="74"/><rect class="cl" x="470" y="84" width="230" height="74"/><rect class="cl" x="240" y="84" width="230" height="74"/><rect class="cl" x="20" y="84" width="220" height="74"/><text class="rh" x="868" y="112" text-anchor="end">کیا شمار</text><text class="rh" x="868" y="132" text-anchor="end">کرتا ہے</text><text x="688" y="112" text-anchor="end">ایک سال میں</text><text x="688" y="132" text-anchor="end">نمبر کی تبدیلی</text><text x="458" y="112" text-anchor="end">سبقوں میں نوٹ کیے</text><text x="458" y="132" text-anchor="end">گئے رویے</text><text x="228" y="112" text-anchor="end">کارکردگی کے ساتھ</text><text x="228" y="132" text-anchor="end">رویہ اور آداب</text><rect class="rl" x="700" y="158" width="180" height="74"/><rect class="cl" x="470" y="158" width="230" height="74"/><rect class="cl" x="240" y="158" width="230" height="74"/><rect class="cl" x="20" y="158" width="220" height="74"/><text class="rh" x="868" y="186" text-anchor="end">اچھی طرح</text><text class="rh" x="868" y="206" text-anchor="end">پکڑتا ہے</text><text x="688" y="186" text-anchor="end">وہ سیکھنا جو ٹیسٹ</text><text x="688" y="206" text-anchor="end">ناپنے کے لیے بنے ہیں</text><text x="458" y="186" text-anchor="end">قابلِ تدریس، نام</text><text x="458" y="206" text-anchor="end">لینے لائق مہارت</text><text x="228" y="186" text-anchor="end">جو اسکولوں سے</text><text x="228" y="206" text-anchor="end">واقعی کہا جاتا ہے</text><rect class="rl" x="700" y="232" width="180" height="74"/><rect class="cl" x="470" y="232" width="230" height="74"/><rect class="cl" x="240" y="232" width="230" height="74"/><rect class="cl" x="20" y="232" width="220" height="74"/><text class="rh" x="868" y="260" text-anchor="end">کیا چھوڑ</text><text class="rh" x="868" y="280" text-anchor="end">دیتا ہے</text><text x="688" y="260" text-anchor="end">غیر جانچے مضامین؛</text><text x="688" y="280" text-anchor="end">داخلے کے فرق</text><text x="458" y="260" text-anchor="end">کیا شاگرد</text><text x="458" y="280" text-anchor="end">واقعی سیکھے</text><text x="228" y="260" text-anchor="end">اس بات پر اتفاق کہ</text><text x="228" y="280" text-anchor="end">کیا شمار ہو، اور کیسے</text><rect class="rl" x="700" y="306" width="180" height="60"/><rect class="cl" x="470" y="306" width="230" height="60"/><rect class="cl" x="240" y="306" width="230" height="60"/><rect class="cl" x="20" y="306" width="220" height="60"/><text class="rh" x="868" y="334" text-anchor="end">عموماً استعمال کرنے والے</text><text x="688" y="334" text-anchor="end">نظام، بڑے پیمانے پر</text><text x="458" y="334" text-anchor="end">صدرِ اسکول اور سرپرست</text><text x="228" y="334" text-anchor="end">پالیسی اور تحقیق</text><text class="m" x="756" y="388" text-anchor="end">کوئی ایک پیمانہ تینوں کو نہیں سنبھالتا (Goe وغیرہ 2008): مختلف پیمانے، ہر ایک الگ پہلو کے لیے۔</text><text class="wm" x="888" y="388" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
