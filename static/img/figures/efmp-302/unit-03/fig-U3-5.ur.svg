<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ تعلقات، اور ہر ایک کس کام کے لیے ہے</title><desc id="d">تصوراتی نقشہ جس کے مرکز میں استاد ہے، جو شاگردوں، والدین، ساتھی اساتذہ، صدرِ اسکول اور برادری سے جڑا ہے، ہر کڑی یہ بتاتی ہے کہ وہ تعلق کس کام کے لیے ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--panel);stroke:var(--a2);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="470"/><rect class="ctr" x="370" y="205" width="140" height="56" rx="8"/><text class="h" x="440" y="238" text-anchor="middle">استاد</text><rect class="n" x="330" y="30" width="220" height="48" rx="6"/><text class="h" x="440" y="50" text-anchor="middle">شاگرد</text><text class="m" x="440" y="68" text-anchor="middle">تاکہ شاگرد اپنی گڈمڈی مان لے</text><path class="e" d="M440 205 L440 82" marker-end="url(#a)"/><rect class="n" x="620" y="110" width="230" height="48" rx="6"/><text class="h" x="735" y="130" text-anchor="middle">والدین</text><text class="m" x="735" y="148" text-anchor="middle">تاکہ والدین گھر پر عمل کریں</text><path class="e" d="M510 218 L612 150" marker-end="url(#a)"/><rect class="n" x="20" y="110" width="240" height="48" rx="6"/><text class="h" x="140" y="130" text-anchor="middle">ساتھی اساتذہ</text><text class="m" x="140" y="148" text-anchor="middle">تاکہ مشکل جماعت سنبھالی جا سکے</text><path class="e" d="M370 218 L268 150" marker-end="url(#a)"/><rect class="n" x="620" y="310" width="230" height="48" rx="6"/><text class="h" x="735" y="330" text-anchor="middle">صدرِ اسکول</text><text class="m" x="735" y="348" text-anchor="middle">تاکہ مسئلہ جلد سنا جائے</text><path class="e" d="M510 250 L612 318" marker-end="url(#a)"/><rect class="n" x="20" y="310" width="240" height="48" rx="6"/><text class="h" x="140" y="330" text-anchor="middle">وسیع برادری</text><text class="m" x="140" y="348" text-anchor="middle">تاکہ لڑکی کے پڑھتے رہنے کی اجازت ملے</text><path class="e" d="M370 250 L268 318" marker-end="url(#a)"/><text class="m" x="440" y="400" text-anchor="middle">ہر کڑی پر یہ لکھا ہے کہ تعلق کس کام کے لیے ہے، نہ یہ کہ شخص کون ہے۔</text><text class="m" x="440" y="420" text-anchor="middle">جو تعلق ان میں سے کوئی مقصد پورا نہ کرے وہ خوش اخلاق ہے، پیشہ ورانہ نہیں۔</text><text class="wm" x="868" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
