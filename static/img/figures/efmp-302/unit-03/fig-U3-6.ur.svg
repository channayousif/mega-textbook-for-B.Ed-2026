<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">غصے والے پہلے رابطے کو کم کرنا</title><desc id="d">تنازع کو کم کرنے کی ترتیب کا فلوچارٹ: غصے والے پہلے رابطے سے، جگہ، تیاری، حقائق اور اختیار کے فیصلہ کے مقامات سے ہوتا ہوا، ابھی حل، جانچ کے بعد حل، یا اگلے سطح پر بھیجنے کے نتائج تک۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .o1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .o2{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .f{stroke:var(--a2);stroke-width:2;fill:none} .nf{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="520"/><rect class="st" x="650" y="30" width="200" height="56" rx="6"/><text class="h" x="750" y="54" text-anchor="middle">غصے والا پہلا رابطہ</text><text class="m" x="750" y="72" text-anchor="middle">دروازے پر ایک والد</text><rect class="dc" x="360" y="26" width="230" height="64" rx="6"/><text class="h" x="475" y="50" text-anchor="middle">کیا بات کرنے کی</text><text class="h" x="475" y="68" text-anchor="middle">یہ ٹھیک جگہ ہے؟</text><path class="f" d="M650 58 L595 58" marker-end="url(#a)"/><rect class="dc" x="360" y="130" width="230" height="64" rx="6"/><text class="h" x="475" y="154" text-anchor="middle">کیا وہ ابھی جواب</text><text class="h" x="475" y="172" text-anchor="middle">سن سکتے ہیں؟</text><path class="f" d="M475 90 L475 126" marker-end="url(#a)"/><text class="m" x="485" y="112">ہاں</text><rect class="dc" x="360" y="234" width="230" height="64" rx="6"/><text class="h" x="475" y="258" text-anchor="middle">کیا میرے پاس</text><text class="h" x="475" y="276" text-anchor="middle">حقائق ہیں؟</text><path class="f" d="M475 194 L475 230" marker-end="url(#a)"/><text class="m" x="485" y="216">ہاں</text><rect class="dc" x="360" y="338" width="230" height="64" rx="6"/><text class="h" x="475" y="362" text-anchor="middle">کیا یہ میرے</text><text class="h" x="475" y="380" text-anchor="middle">اختیار میں ہے؟</text><path class="f" d="M475 298 L475 334" marker-end="url(#a)"/><text class="m" x="485" y="320">ہاں</text><rect class="o1" x="30" y="338" width="210" height="64" rx="6"/><text class="h" x="135" y="366" text-anchor="middle">ابھی حل</text><text class="m" x="135" y="386" text-anchor="middle">اگلا قدم بلند آواز میں طے کیجیے</text><path class="f" d="M360 370 L244 370" marker-end="url(#a)"/><text class="m" x="335" y="360">ہاں</text><rect class="o1" x="30" y="234" width="210" height="64" rx="6"/><text class="h" x="135" y="262" text-anchor="middle">جانچ کے بعد حل</text><text class="m" x="135" y="282" text-anchor="middle">جواب کا وقت نام لیجیے</text><path class="nf" d="M360 266 L244 266" marker-end="url(#b)"/><text class="m" x="335" y="256">نہیں</text><rect class="o2" x="30" y="440" width="210" height="56" rx="6"/><text class="h" x="135" y="468" text-anchor="middle">صدرِ اسکول کے حوالے</text><text class="m" x="135" y="488" text-anchor="middle">وجہ ریکارڈ کے ساتھ</text><path class="nf" d="M475 402 L475 472 L244 472" marker-end="url(#b)"/><text class="m" x="485" y="428">نہیں</text><path class="nf" d="M590 58 L620 58 L620 108 L740 108" marker-end="url(#b)"/><text class="m" x="730" y="128" text-anchor="end">نہیں: پہلے ہٹیں، بات بعد میں</text><path class="nf" d="M590 162 L635 162 L635 200 L740 200" marker-end="url(#b)"/><text class="m" x="820" y="220" text-anchor="end">نہیں: انہیں کہنے دیجیے؛ ایسا کچھ</text><text class="m" x="820" y="238" text-anchor="end">نہ کہیے جس کا دفاع درکار ہو</text><text class="m" x="850" y="300" text-anchor="end">ہر راستہ کسی نام لینے کے قابل</text><text class="m" x="850" y="318" text-anchor="end">جگہ پر ختم ہوتا ہے۔ اگلے سطح پر</text><text class="m" x="850" y="336" text-anchor="end">بھیجنا نتیجہ ہے، ناکامی نہیں، بشرطیکہ وجہ لکھی گئی ہو۔</text><text class="wm" x="868" y="512" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
