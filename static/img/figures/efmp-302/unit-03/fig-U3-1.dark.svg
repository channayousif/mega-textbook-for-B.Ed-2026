<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three competing definitions of teacher effectiveness</title><desc id="d">Table comparing three definitions of teacher effectiveness - achievement gain, observed practice and breadth of learner outcomes - by what each counts, captures, misses, and who uses it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} text{font-size:12.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><rect class="rl" x="20" y="30" width="180" height="54"/><rect class="hd" x="200" y="30" width="230" height="54"/><rect class="hd" x="430" y="30" width="230" height="54"/><rect class="hd" x="660" y="30" width="220" height="54"/><text class="h" x="315" y="52" text-anchor="middle">Achievement gain</text><text class="m" x="315" y="70" text-anchor="middle">test-score growth</text><text class="h" x="545" y="52" text-anchor="middle">Observed practice</text><text class="m" x="545" y="70" text-anchor="middle">what the teacher does</text><text class="h" x="770" y="52" text-anchor="middle">Breadth of outcomes</text><text class="m" x="770" y="70" text-anchor="middle">all that pupils gain</text><rect class="rl" x="20" y="84" width="180" height="74"/><rect class="cl" x="200" y="84" width="230" height="74"/><rect class="cl" x="430" y="84" width="230" height="74"/><rect class="cl" x="660" y="84" width="220" height="74"/><text class="rh" x="32" y="112">What it counts</text><text x="212" y="112">Score change over</text><text x="212" y="130">one year</text><text x="442" y="112">Rated behaviours in</text><text x="442" y="130">lessons</text><text x="672" y="112">Attainment plus</text><text x="672" y="130">conduct and attitude</text><rect class="rl" x="20" y="158" width="180" height="74"/><rect class="cl" x="200" y="158" width="230" height="74"/><rect class="cl" x="430" y="158" width="230" height="74"/><rect class="cl" x="660" y="158" width="220" height="74"/><text class="rh" x="32" y="186">Captures well</text><text x="212" y="186">Learning that tests</text><text x="212" y="204">are built to measure</text><text x="442" y="186">Teachable, nameable</text><text x="442" y="204">craft</text><text x="672" y="186">What schools are</text><text x="672" y="204">actually asked to do</text><rect class="rl" x="20" y="232" width="180" height="74"/><rect class="cl" x="200" y="232" width="230" height="74"/><rect class="cl" x="430" y="232" width="230" height="74"/><rect class="cl" x="660" y="232" width="220" height="74"/><text class="rh" x="32" y="260">What it misses</text><text x="212" y="260">Untested subjects;</text><text x="212" y="278">intake differences</text><text x="442" y="260">Whether pupils</text><text x="442" y="278">actually learned</text><text x="672" y="260">Agreement on what</text><text x="672" y="278">counts, and how</text><rect class="rl" x="20" y="306" width="180" height="60"/><rect class="cl" x="200" y="306" width="230" height="60"/><rect class="cl" x="430" y="306" width="230" height="60"/><rect class="cl" x="660" y="306" width="220" height="60"/><text class="rh" x="32" y="334">Typically used by</text><text x="212" y="334">Systems, at scale</text><text x="442" y="334">Heads and mentors</text><text x="672" y="334">Policy and research</text><text class="m" x="20" y="388">No single measure carries all three. Goe, Bell and Little (2008): multiple measures, each for a different aspect.</text><text class="wm" x="888" y="388" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
