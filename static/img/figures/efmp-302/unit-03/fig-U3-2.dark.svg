<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What teacher effectiveness is made of</title><desc id="d">Concept map of teacher effectiveness branching into within-classroom processes and factors beyond the classroom, each leaf noting how it is evidenced.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .g1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .g2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .lf{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .e1{stroke:var(--a2);stroke-width:2;fill:none} .e2{stroke:var(--a3);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="460"/><rect class="ctr" x="350" y="205" width="200" height="56" rx="8"/><text class="h" x="450" y="230" text-anchor="middle">Teacher</text><text class="h" x="450" y="248" text-anchor="middle">effectiveness</text><rect class="g1" x="60" y="30" width="230" height="44" rx="6"/><text class="h" x="175" y="58" text-anchor="middle">Within-classroom processes</text><rect class="g2" x="610" y="30" width="230" height="44" rx="6"/><text class="h" x="725" y="58" text-anchor="middle">Beyond the classroom</text><path class="e1" d="M350 225 L300 120 L290 74"/><path class="e2" d="M550 225 L600 120 L610 74"/><rect class="lf" x="20" y="92" width="270" height="38" rx="5"/><text x="30" y="110">Subject and pedagogical knowledge</text><text class="m" x="30" y="124">evidenced by: what gets explained correctly</text><rect class="lf" x="20" y="136" width="270" height="38" rx="5"/><text x="30" y="154">Planning</text><text class="m" x="30" y="168">evidenced by: sequence, not the plan document</text><rect class="lf" x="20" y="180" width="270" height="38" rx="5"/><text x="30" y="198">Explanation and questioning</text><text class="m" x="30" y="212">evidenced by: who answers, and how often</text><rect class="lf" x="20" y="224" width="270" height="38" rx="5"/><text x="30" y="242">Assessment use</text><text class="m" x="30" y="256">evidenced by: what changed after marking</text><rect class="lf" x="20" y="268" width="270" height="38" rx="5"/><text x="30" y="286">Climate and management</text><text class="m" x="30" y="300">evidenced by: time lost, and who risks answering</text><rect class="lf" x="610" y="92" width="270" height="38" rx="5"/><text x="620" y="110">Contribution to colleagues</text><text class="m" x="620" y="124">evidenced by: what others adopt</text><rect class="lf" x="610" y="136" width="270" height="38" rx="5"/><text x="620" y="154">Relationships with parents</text><text class="m" x="620" y="168">evidenced by: what happens at home after contact</text><rect class="lf" x="610" y="180" width="270" height="38" rx="5"/><text x="620" y="198">Community links</text><text class="m" x="620" y="212">evidenced by: attendance, and who returns</text><rect class="lf" x="610" y="224" width="270" height="38" rx="5"/><text x="620" y="242">Professional learning</text><text class="m" x="620" y="256">evidenced by: practice that changed, not hours sat</text><path class="e1" d="M290 111 L340 111 L340 205"/><path class="e1" d="M290 155 L330 155 L330 210"/><path class="e1" d="M290 199 L345 199 L345 215"/><path class="e1" d="M290 243 L345 243"/><path class="e1" d="M290 287 L340 287 L340 255"/><path class="e2" d="M610 111 L560 111 L560 205"/><path class="e2" d="M610 155 L570 155 L570 210"/><path class="e2" d="M610 199 L555 199 L555 215"/><path class="e2" d="M610 243 L555 243"/><text class="m" x="450" y="330" text-anchor="middle">Effectiveness is a bundle of processes, not a single trait.</text><text class="m" x="450" y="350" text-anchor="middle">Each leaf names how it is evidenced, because a claim without evidence is an opinion about a colleague.</text><text class="m" x="450" y="378" text-anchor="middle">Taylor and Thion (2023): many papers use inaccurate or merely implied definitions.</text><text class="wm" x="888" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
