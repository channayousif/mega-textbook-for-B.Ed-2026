<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What teacher effectiveness is made of</title><desc id="d">Concept map of teacher effectiveness branching into within-classroom processes and factors beyond the classroom, each leaf noting how it is evidenced.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .g1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .g2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .lf{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .e1{stroke:var(--a2);stroke-width:2;fill:none} .e2{stroke:var(--a3);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="ctr" x="350" y="205" width="200" height="56" rx="8"/><text class="h" x="450" y="230" text-anchor="middle">Teacher</text><text class="h" x="450" y="248" text-anchor="middle">effectiveness</text><rect class="g1" x="60" y="30" width="230" height="44" rx="6"/><text class="h" x="175" y="48" text-anchor="middle"><tspan x="175" dy="0">Within-classroom</tspan><tspan x="175" dy="20">processes</tspan></text><rect class="g2" x="610" y="30" width="230" height="44" rx="6"/><text class="h" x="725" y="58" text-anchor="middle">Beyond the classroom</text><path class="e1" d="M350 225 L300 120 L290 74"/><path class="e2" d="M550 225 L600 120 L610 74"/><rect class="lf" x="20" y="92" width="270" height="38" rx="5"/><text x="30" y="90"><tspan x="30" dy="0">Subject and</tspan><tspan x="30" dy="20">pedagogical</tspan><tspan x="30" dy="20">knowledge</tspan></text><text class="m" x="30" y="114"><tspan x="30" dy="0">evidenced by: what gets explained</tspan><tspan x="30" dy="20">correctly</tspan></text><rect class="lf" x="20" y="136" width="270" height="38" rx="5"/><text x="30" y="154">Planning</text><text class="m" x="30" y="158"><tspan x="30" dy="0">evidenced by: sequence, not the</tspan><tspan x="30" dy="20">plan document</tspan></text><rect class="lf" x="20" y="180" width="270" height="38" rx="5"/><text x="30" y="188"><tspan x="30" dy="0">Explanation and</tspan><tspan x="30" dy="20">questioning</tspan></text><text class="m" x="30" y="202"><tspan x="30" dy="0">evidenced by: who answers, and how</tspan><tspan x="30" dy="20">often</tspan></text><rect class="lf" x="20" y="224" width="270" height="38" rx="5"/><text x="30" y="242">Assessment use</text><text class="m" x="30" y="246"><tspan x="30" dy="0">evidenced by: what changed after</tspan><tspan x="30" dy="20">marking</tspan></text><rect class="lf" x="20" y="268" width="270" height="38" rx="5"/><text x="30" y="276"><tspan x="30" dy="0">Climate and</tspan><tspan x="30" dy="20">management</tspan></text><text class="m" x="30" y="290"><tspan x="30" dy="0">evidenced by: time lost, and who</tspan><tspan x="30" dy="20">risks answering</tspan></text><rect class="lf" x="610" y="92" width="270" height="38" rx="5"/><text x="620" y="100"><tspan x="620" dy="0">Contribution to</tspan><tspan x="620" dy="20">colleagues</tspan></text><text class="m" x="620" y="114"><tspan x="620" dy="0">evidenced by: what</tspan><tspan x="620" dy="20">others adopt</tspan></text><rect class="lf" x="610" y="136" width="270" height="38" rx="5"/><text x="620" y="144"><tspan x="620" dy="0">Relationships with</tspan><tspan x="620" dy="20">parents</tspan></text><text class="m" x="620" y="158"><tspan x="620" dy="0">evidenced by: what happens at home</tspan><tspan x="620" dy="20">after contact</tspan></text><rect class="lf" x="610" y="180" width="270" height="38" rx="5"/><text x="620" y="198">Community links</text><text class="m" x="620" y="202"><tspan x="620" dy="0">evidenced by: attendance, and who</tspan><tspan x="620" dy="20">returns</tspan></text><rect class="lf" x="610" y="224" width="270" height="38" rx="5"/><text x="620" y="232"><tspan x="620" dy="0">Professional</tspan><tspan x="620" dy="20">learning</tspan></text><text class="m" x="620" y="246"><tspan x="620" dy="0">evidenced by: practice that</tspan><tspan x="620" dy="20">changed, not hours sat</tspan></text><path class="e1" d="M290 111 L340 111 L340 205"/><path class="e1" d="M290 155 L330 155 L330 210"/><path class="e1" d="M290 199 L345 199 L345 215"/><path class="e1" d="M290 243 L345 243"/><path class="e1" d="M290 287 L340 287 L340 255"/><path class="e2" d="M610 111 L560 111 L560 205"/><path class="e2" d="M610 155 L570 155 L570 210"/><path class="e2" d="M610 199 L555 199 L555 215"/><path class="e2" d="M610 243 L555 243"/><text class="m" x="450" y="320" text-anchor="middle"><tspan x="450" dy="0">Effectiveness is a bundle of</tspan><tspan x="450" dy="20">processes, not a single trait.</tspan></text><text class="m" x="450" y="320" text-anchor="middle"><tspan x="450" dy="0">Each leaf names how it is</tspan><tspan x="450" dy="20">evidenced, because a claim without</tspan><tspan x="450" dy="20">evidence is an opinion about a</tspan><tspan x="450" dy="20">colleague.</tspan></text><text class="m" x="450" y="358" text-anchor="middle"><tspan x="450" dy="0">Taylor and Thion (2023): many</tspan><tspan x="450" dy="20">papers use inaccurate or merely</tspan><tspan x="450" dy="20">implied definitions.</tspan></text><text class="wm" x="888" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
