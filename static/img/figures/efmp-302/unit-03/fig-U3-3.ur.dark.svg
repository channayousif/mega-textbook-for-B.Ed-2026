<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سات خصوصیات، اور ہر ایک حد سے زیادہ ہو کر کیسے ناکام ہوتی ہے</title><desc id="d">استاد کی سات شخصی خصوصیات کا جدول - ہمدردی، صبر، ضبطِ نفس، خوش بینی، مزاح، لچک اور موزونیت - دکھاتا ہے کہ ہر ایک جماعت میں کیسے نظر آتی ہے، وہ کیا ممکن بناتی ہے، اور حد سے زیادہ ہونے پر کیسے ناکام ہوتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="470"/><rect class="rl" x="750" y="30" width="130" height="40"/><rect class="hd" x="500" y="30" width="250" height="40"/><rect class="hd" x="270" y="30" width="230" height="40"/><rect class="hx" x="20" y="30" width="250" height="40"/><text class="h" x="625" y="55" text-anchor="middle">کلاس میں کیسے دکھتی ہے</text><text class="h" x="385" y="55" text-anchor="middle">کیا ممکن بناتی ہے</text><text class="h" x="145" y="55" text-anchor="middle">حد سے زیادہ پر ناکامی</text><g><rect class="rl" x="750" y="70" width="130" height="52"/><rect class="cl" x="500" y="70" width="250" height="52"/><rect class="cl" x="270" y="70" width="230" height="52"/><rect class="cx" x="20" y="70" width="250" height="52"/><text class="rh" x="870" y="100" text-anchor="end">ہمدردی</text><text x="740" y="100" text-anchor="end">گڈمڈی کہنے سے پہلے پڑھ لیتا ہے</text><text x="490" y="100" text-anchor="end">شاگرد نہ جاننا مان لیتے ہیں</text><text x="260" y="100" text-anchor="end">معیار خاموشی سے گر جاتا ہے</text></g><g><rect class="rl" x="750" y="122" width="130" height="52"/><rect class="cl" x="500" y="122" width="250" height="52"/><rect class="cl" x="270" y="122" width="230" height="52"/><rect class="cx" x="20" y="122" width="250" height="52"/><text class="rh" x="870" y="152" text-anchor="end">صبر</text><text x="740" y="152" text-anchor="end">پوچھنے کے بعد انتظار کرتا ہے</text><text x="490" y="152" text-anchor="end">دیر سوچنے والے جواب دیتے ہیں</text><text x="260" y="152" text-anchor="end">ڈھلائی؛ سبق کبھی اترتا نہیں</text></g><g><rect class="rl" x="750" y="174" width="130" height="52"/><rect class="cl" x="500" y="174" width="250" height="52"/><rect class="cl" x="270" y="174" width="230" height="52"/><rect class="cx" x="20" y="174" width="250" height="52"/><text class="rh" x="870" y="204" text-anchor="end">ضبطِ نفس</text><text x="740" y="204" text-anchor="end">اشتعال پر بھی سیدھا جواب دیتا ہے</text><text x="490" y="204" text-anchor="end">کمرہ محفوظ رہتا ہے</text><text x="260" y="204" text-anchor="end">سرد لگتا ہے؛ نمونہ نہیں ملتا</text></g><g><rect class="rl" x="750" y="226" width="130" height="52"/><rect class="cl" x="500" y="226" width="250" height="52"/><rect class="cl" x="270" y="226" width="230" height="52"/><rect class="cx" x="20" y="226" width="250" height="52"/><text class="rh" x="870" y="256" text-anchor="end">خوش بینی</text><text x="740" y="256" text-anchor="end">ناکامی کو اس بار والی سمجھتا ہے</text><text x="490" y="256" text-anchor="end">شاگرد دوبارہ کوشش کرتے ہیں</text><text x="260" y="256" text-anchor="end">حقیقی مشکل بے نام رہ جاتی ہے</text></g><g><rect class="rl" x="750" y="278" width="130" height="52"/><rect class="cl" x="500" y="278" width="250" height="52"/><rect class="cl" x="270" y="278" width="230" height="52"/><rect class="cx" x="20" y="278" width="250" height="52"/><text class="rh" x="870" y="308" text-anchor="end">مزاح</text><text x="740" y="308" text-anchor="end">کشادگی کم کرتا ہے، شاگرد پر نہیں</text><text x="490" y="308" text-anchor="end">غلطی کی قیمت عزت کی نہیں رہتی</text><text x="260" y="308" text-anchor="end">وقار خرچ ہوتا ہے؛ سبق پٹری سے اترتا ہے</text></g><g><rect class="rl" x="750" y="330" width="130" height="52"/><rect class="cl" x="500" y="330" width="250" height="52"/><rect class="cl" x="270" y="330" width="230" height="52"/><rect class="cx" x="20" y="330" width="250" height="52"/><text class="rh" x="870" y="360" text-anchor="end">لچک</text><text x="740" y="360" text-anchor="end">برے سبق کے بعد لوٹتا ہے</text><text x="490" y="360" text-anchor="end">کیریئر مشکل میعادوں سے گزرتا ہے</text><text x="260" y="360" text-anchor="end">جو بتانا چاہیے تھا اسے سہتا ہے</text></g><g><rect class="rl" x="750" y="382" width="130" height="52"/><rect class="cl" x="500" y="382" width="250" height="52"/><rect class="cl" x="270" y="382" width="230" height="52"/><rect class="cx" x="20" y="382" width="250" height="52"/><text class="rh" x="870" y="412" text-anchor="end">موزونیت</text><text x="740" y="412" text-anchor="end">سبق کے بیچ میں منصوبہ بدلتا ہے</text><text x="490" y="412" text-anchor="end">غیر متوقع کام آ جاتا ہے</text><text x="260" y="412" text-anchor="end">روٹین نہیں؛ شاگرد اندازہ نہیں کر سکتے</text></g><text class="m" x="756" y="456" text-anchor="end">یہ خط والا کالم وہ حصہ ہے جو عموماً چھوڑا جاتا ہے: ہر خصوصیت کی زیادتی پیشہ ورانہ مسئلہ ہے، شخصی خصلت نہیں۔</text><text class="wm" x="888" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
