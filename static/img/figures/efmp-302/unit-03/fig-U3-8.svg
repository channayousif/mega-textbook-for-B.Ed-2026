<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Non-verbal channels, seen from above the classroom</title><desc id="d">Overhead schematic of a classroom marking the teacher's non-verbal channels in place - proximity, body orientation, gaze, gesture and vocal variety - each labelled with its classroom use.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .room{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .desk{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5} .board{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .tch{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .gz{stroke:var(--a4);stroke-width:1.8;stroke-dasharray:6 4;fill:none} .pr{stroke:var(--a3);stroke-width:2;fill:none} .or{stroke:var(--a1);stroke-width:2.5;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a4)"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="490"/><rect class="room" x="30" y="60" width="480" height="340" rx="4"/><rect class="board" x="140" y="46" width="260" height="20" rx="3"/><text class="h" x="270" y="38" text-anchor="middle">Board</text><g class="desk"><rect x="70" y="140" width="80" height="40" rx="3"/><rect x="170" y="140" width="80" height="40" rx="3"/><rect x="290" y="140" width="80" height="40" rx="3"/><rect x="390" y="140" width="80" height="40" rx="3"/><rect x="70" y="230" width="80" height="40" rx="3"/><rect x="170" y="230" width="80" height="40" rx="3"/><rect x="290" y="230" width="80" height="40" rx="3"/><rect x="390" y="230" width="80" height="40" rx="3"/><rect x="70" y="320" width="80" height="40" rx="3"/><rect x="170" y="320" width="80" height="40" rx="3"/><rect x="290" y="320" width="80" height="40" rx="3"/><rect x="390" y="320" width="80" height="40" rx="3"/></g><circle class="tch" cx="215" cy="100" r="18"/><text class="m" x="215" y="104" text-anchor="middle">T</text><path class="or" d="M215 118 L215 150" marker-end="url(#o)"/><path class="pr" d="M215 100 m-46 0 a46 46 0 1 0 92 0 a46 46 0 1 0 -92 0"/><path class="gz" d="M233 100 L400 245" marker-end="url(#g)"/><path class="gz" d="M215 118 L110 330" marker-end="url(#g)"/><path class="gz" d="M230 112 L300 330" marker-end="url(#g)"/><line class="or" x1="197" y1="92" x2="150" y2="62" marker-end="url(#o)"/><rect class="tch" x="540" y="60" width="300" height="56" rx="5"/><text class="h" x="550" y="82">Proximity</text><text class="m" x="550" y="100">the ring you can reach without crossing the room</text><rect class="board" x="540" y="128" width="300" height="56" rx="5"/><text class="h" x="550" y="150">Body orientation</text><text class="m" x="550" y="168">who you are facing is who you are teaching</text><rect class="desk" x="540" y="196" width="300" height="56" rx="5"/><text class="h" x="550" y="218">Gaze</text><text class="m" x="550" y="236">reaches the back and the corners, or it does not</text><rect class="desk" x="540" y="264" width="300" height="56" rx="5"/><text class="h" x="550" y="286">Gesture</text><text class="m" x="550" y="304">at the board: points at the thing being named</text><rect class="desk" x="540" y="332" width="300" height="56" rx="5"/><text class="h" x="550" y="354">Vocal variety</text><text class="m" x="550" y="372">carries from where you stand, or it stops at row two</text><text class="m" x="30" y="432">Standing at the board for a whole lesson switches four of these five off. Position is a teaching decision, not a habit.</text><text class="wm" x="848" y="472" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
