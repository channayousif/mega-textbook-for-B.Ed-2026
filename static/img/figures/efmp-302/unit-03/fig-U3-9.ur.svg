<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد کے متوقع کردار کی تبدیلی</title><desc id="d">استاد کے متوقع کردار کی تبدیلی کا وقت خط: مواد منتقل کرنے والے سے، پڑھانے والے اور سہولت کار سے ہوتا ہوا، محقق، تبدیلی کا داعی، اخلاقی نمونہ اور تاحیات سیکھنے والے کے موجودہ مجموعے تک، یہ نوٹ کے ساتھ کہ بعد کے کردار پہلے والوں کی جگہ لینے کے بجائے شامل ہوئے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .st{fill:var(--a1);stroke:none} .c1{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .c2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .c3{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .c4{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .acc{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .er{font-size:11.5px;font-weight:700;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="420"/><line class="ax" x1="40" y1="230" x2="860" y2="230"/><circle class="st" cx="780" cy="230" r="7"/><circle class="st" cx="570" cy="230" r="7"/><circle class="st" cx="360" cy="230" r="7"/><circle class="st" cx="140" cy="230" r="7"/><rect class="c1" x="690" y="120" width="180" height="76" rx="6"/><text class="h" x="780" y="146" text-anchor="middle">منتقل کرنے والا</text><text class="m" x="780" y="164" text-anchor="middle">مقررہ مواد کا</text><text class="m" x="780" y="182" text-anchor="middle">کتاب ہی نصاب تھی</text><text class="er" x="780" y="256" text-anchor="middle">پہلا دور</text><rect class="c2" x="480" y="120" width="180" height="76" rx="6"/><text class="h" x="570" y="146" text-anchor="middle">پڑھانے والا</text><text class="m" x="570" y="164" text-anchor="middle">مقررہ طریقے پر</text><text class="m" x="570" y="182" text-anchor="middle">خاکے کی وفاداری</text><text class="er" x="570" y="256" text-anchor="middle">درمیانی صدی</text><rect class="c3" x="270" y="120" width="180" height="76" rx="6"/><text class="h" x="360" y="146" text-anchor="middle">سہولت کار</text><text class="m" x="360" y="164" text-anchor="middle">تعلیم کا</text><text class="m" x="360" y="182" text-anchor="middle">شاگرد معنی بناتے ہیں</text><text class="er" x="360" y="256" text-anchor="middle">بیسویں صدی کا بعد</text><rect class="c4" x="30" y="96" width="210" height="124" rx="6"/><text class="h" x="135" y="120" text-anchor="middle">اور اب، ساتھ ساتھ</text><text class="m" x="135" y="140" text-anchor="middle">اپنی مشق کا محقق</text><text class="m" x="135" y="158" text-anchor="middle">تبدیلی کا داعی</text><text class="m" x="135" y="176" text-anchor="middle">اخلاقی نمونہ</text><text class="m" x="135" y="194" text-anchor="middle">تاحیات سیکھنے والا</text><text class="m" x="135" y="212" text-anchor="middle">اور اوپر والے سب اب بھی</text><text class="er" x="135" y="256" text-anchor="middle">حال</text><path class="acc" d="M780 300 L40 300"/><text class="m" x="860" y="330" text-anchor="end">ہر منزل اپنے سے پہلے والوں پر اضافہ تھی۔ کوئی ریٹائر نہیں ہوا۔</text><text class="m" x="860" y="350" text-anchor="end">آج کے استاد سے اب بھی درست مواد منتقل کرنے اور اب بھی پڑھانے کی توقع ہے - ساتھ ہی بعد والے تینوں بھی۔</text><text class="m" x="860" y="370" text-anchor="end">یہی جمع، کوئی ایک کردار نہیں، موجودہ توقع کو بھاری بناتا ہے۔</text><text class="wm" x="888" y="404" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
