<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">De-escalating an angry first contact</title><desc id="d">Flowchart of a conflict de-escalation sequence from an angry first contact through decision points about place, readiness, facts and authority, to outcomes of resolved now, resolved after checking, or escalated.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .o1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .o2{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .f{stroke:var(--a2);stroke-width:2;fill:none} .nf{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="520"/><rect class="st" x="30" y="30" width="200" height="56" rx="6"/><text class="h" x="130" y="54" text-anchor="middle">Angry first contact</text><text class="m" x="130" y="72" text-anchor="middle">a parent at the door</text><rect class="dc" x="290" y="26" width="230" height="64" rx="6"/><text class="h" x="405" y="50" text-anchor="middle">Is this the right</text><text class="h" x="405" y="68" text-anchor="middle">place to talk?</text><path class="f" d="M230 58 L285 58" marker-end="url(#a)"/><rect class="dc" x="290" y="130" width="230" height="64" rx="6"/><text class="h" x="405" y="154" text-anchor="middle">Can they hear a</text><text class="h" x="405" y="172" text-anchor="middle">reply yet?</text><path class="f" d="M405 90 L405 126" marker-end="url(#a)"/><text class="m" x="415" y="112">yes</text><rect class="dc" x="290" y="234" width="230" height="64" rx="6"/><text class="h" x="405" y="258" text-anchor="middle">Do I have</text><text class="h" x="405" y="276" text-anchor="middle">the facts?</text><path class="f" d="M405 194 L405 230" marker-end="url(#a)"/><text class="m" x="415" y="216">yes</text><rect class="dc" x="290" y="338" width="230" height="64" rx="6"/><text class="h" x="405" y="362" text-anchor="middle">Is it within my</text><text class="h" x="405" y="380" text-anchor="middle">authority?</text><path class="f" d="M405 298 L405 334" marker-end="url(#a)"/><text class="m" x="415" y="320">yes</text><rect class="o1" x="640" y="338" width="210" height="64" rx="6"/><text class="h" x="745" y="366" text-anchor="middle">Resolved now</text><text class="m" x="745" y="386" text-anchor="middle">agree the next step aloud</text><path class="f" d="M520 370 L636 370" marker-end="url(#a)"/><text class="m" x="545" y="360">yes</text><rect class="o1" x="640" y="234" width="210" height="64" rx="6"/><text class="h" x="745" y="262" text-anchor="middle">Resolved after checking</text><text class="m" x="745" y="282" text-anchor="middle">name a time you will reply</text><path class="nf" d="M520 266 L636 266" marker-end="url(#b)"/><text class="m" x="545" y="256">no</text><rect class="o2" x="640" y="440" width="210" height="64" rx="6"/><text class="h" x="745" y="468" text-anchor="middle">Escalated to the head</text><text class="m" x="745" y="488" text-anchor="middle">with the reason recorded</text><path class="nf" d="M405 402 L405 472 L636 472" marker-end="url(#b)"/><text class="m" x="415" y="428">no</text><path class="nf" d="M290 58 L260 58 L260 108 L140 108" marker-end="url(#b)"/><text class="m" x="150" y="128">no: move first, talk second</text><path class="nf" d="M290 162 L245 162 L245 200 L140 200" marker-end="url(#b)"/><text class="m" x="60" y="220">no: let them finish; say nothing</text><text class="m" x="60" y="238">that needs defending</text><text class="m" x="30" y="300">Every path ends somewhere nameable.</text><text class="m" x="30" y="318">Escalation is an outcome, not a failure,</text><text class="m" x="30" y="336">provided the reason is written down.</text><text class="wm" x="868" y="504" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
