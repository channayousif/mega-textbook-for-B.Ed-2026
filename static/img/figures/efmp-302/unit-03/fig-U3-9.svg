<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The shifting expected role of a teacher</title><desc id="d">Timeline of the shifting expected role of a teacher from transmitter of content through instructor and facilitator to the present combination of researcher, change agent, moral agent and life-long learner, noting that later roles were added rather than replacing earlier ones.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .st{fill:var(--a1);stroke:none} .c1{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .c2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .c3{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .c4{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .acc{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .er{font-size:11.5px;font-weight:700;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="420"/><line class="ax" x1="40" y1="230" x2="860" y2="230"/><circle class="st" cx="120" cy="230" r="7"/><circle class="st" cx="330" cy="230" r="7"/><circle class="st" cx="540" cy="230" r="7"/><circle class="st" cx="760" cy="230" r="7"/><rect class="c1" x="30" y="120" width="180" height="76" rx="6"/><text class="h" x="120" y="146" text-anchor="middle">Transmitter</text><text class="m" x="120" y="164" text-anchor="middle">of fixed content</text><text class="m" x="120" y="182" text-anchor="middle">the text was the syllabus</text><text class="er" x="120" y="256" text-anchor="middle">earlier era</text><rect class="c2" x="240" y="120" width="180" height="76" rx="6"/><text class="h" x="330" y="146" text-anchor="middle">Instructor</text><text class="m" x="330" y="164" text-anchor="middle">to a prescribed method</text><text class="m" x="330" y="182" text-anchor="middle">fidelity to the scheme</text><text class="er" x="330" y="256" text-anchor="middle">mid-century</text><rect class="c3" x="450" y="120" width="180" height="76" rx="6"/><text class="h" x="540" y="146" text-anchor="middle">Facilitator</text><text class="m" x="540" y="164" text-anchor="middle">of learning</text><text class="m" x="540" y="182" text-anchor="middle">pupils construct meaning</text><text class="er" x="540" y="256" text-anchor="middle">later 20th century</text><rect class="c4" x="660" y="96" width="210" height="124" rx="6"/><text class="h" x="765" y="120" text-anchor="middle">And also, now</text><text class="m" x="765" y="140" text-anchor="middle">researcher of own practice</text><text class="m" x="765" y="158" text-anchor="middle">change agent</text><text class="m" x="765" y="176" text-anchor="middle">moral agent</text><text class="m" x="765" y="194" text-anchor="middle">life-long learner</text><text class="m" x="765" y="212" text-anchor="middle">and still all of the above</text><text class="er" x="765" y="256" text-anchor="middle">present</text><path class="acc" d="M120 300 L860 300"/><text class="m" x="40" y="330">Each station was ADDED to the ones before it. None was retired.</text><text class="m" x="40" y="350">A teacher today is still expected to transmit content accurately and still expected to instruct - while also doing the three that came after.</text><text class="m" x="40" y="370">That accumulation, not any single role, is what makes the present expectation heavy.</text><text class="wm" x="888" y="404" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
