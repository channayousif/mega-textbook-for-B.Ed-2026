<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Verbal and non-verbal channels compared</title><desc id="d">Table comparing verbal and non-verbal communication channels by what each carries best, how each fails, how fast each is read, and what happens when the two contradict each other.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .h1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .h2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .nb{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} text{font-size:12.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="860" height="400"/><rect class="rl" x="20" y="30" width="220" height="46"/><rect class="h1" x="240" y="30" width="300" height="46"/><rect class="h2" x="540" y="30" width="300" height="46"/><text class="h" x="390" y="58" text-anchor="middle">Verbal</text><text class="h" x="690" y="58" text-anchor="middle">Non-verbal</text><rect class="rl" x="20" y="76" width="220" height="60"/><rect class="cl" x="240" y="76" width="300" height="60"/><rect class="cl" x="540" y="76" width="300" height="60"/><text class="rh" x="30" y="104">Carries best</text><text x="250" y="104">Precise content: definitions,</text><text x="250" y="124">instructions, reasoning</text><text x="550" y="104">Stance: interest, impatience,</text><text x="550" y="124">whether you mean it</text><rect class="rl" x="20" y="136" width="220" height="60"/><rect class="cl" x="240" y="136" width="300" height="60"/><rect class="cl" x="540" y="136" width="300" height="60"/><text class="rh" x="30" y="164">How it fails</text><text x="250" y="164">Too much at once; words</text><text x="250" y="184">the pupil does not hold</text><text x="550" y="164">Read wrongly, and read</text><text x="550" y="184">without you deciding to send it</text><rect class="rl" x="20" y="196" width="220" height="50"/><rect class="cl" x="240" y="196" width="300" height="50"/><rect class="cl" x="540" y="196" width="300" height="50"/><text class="rh" x="30" y="226">How fast it is read</text><text x="250" y="226">Word by word, in sequence</text><text x="550" y="226">Immediately, and all at once</text><rect class="rl" x="20" y="246" width="220" height="84"/><rect class="nb" x="240" y="246" width="600" height="84"/><text class="rh" x="30" y="274">When they contradict</text><text class="rh" x="30" y="294">each other</text><text class="h" x="540" y="272" text-anchor="middle">The class tends to believe the non-verbal channel.</text><text class="m" x="540" y="292" text-anchor="middle">A practitioner's heuristic: widely held, and not established as a finding by the studies cited here.</text><text class="m" x="540" y="312" text-anchor="middle">Saying "take your time" while glancing at the clock teaches only the glance.</text><text class="m" x="20" y="344">Furlich (2016): the verbal measure was significant, the non-verbal one was not. Sample size and setting are unstated in the abstract -</text><text class="m" x="20" y="362">and not a licence for the widely repeated claim that communication is 93 per cent non-verbal, which its own author never supported.</text><text class="wm" x="848" y="386" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
