<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ریسٹ کے چار اجزاء، اور ہر ایک پر ناکامی</title><desc id="d">ریسٹ کے چار اجزاء کا بہاؤ نقشہ: حساسیت، فیصلہ، محرک اور کردار، ترتیب کے ساتھ، اور ہر مرحلے سے ناکامی کی ایک شاخ نیچے گرتی ہوئی ایک ہی نتیجے کے خانے تک جاتی ہے جس پر لکھا ہے کوئی اخلاقی عمل نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:2}.flow-a{stroke:var(--a1);stroke-width:2.5;fill:none}.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:6 5}.ah-a{fill:var(--a1)}.ah-m{fill:var(--muted)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker><marker id="fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-m"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-sensitivity-judgement" class="flow-a" x1="600" y1="100" x2="564" y2="100" marker-end="url(#arrow)"/><path id="edge-sensitivity-outcome" class="dash" d="M675 160 V250 H450 V316" marker-end="url(#fail)"/><line id="edge-judgement-motivation" class="flow-a" x1="410" y1="100" x2="374" y2="100" marker-end="url(#arrow)"/><path id="edge-judgement-outcome" class="dash" d="M485 160 V220 H410 V316" marker-end="url(#fail)"/><line id="edge-motivation-character" class="flow-a" x1="220" y1="100" x2="184" y2="100" marker-end="url(#arrow)"/><path id="edge-motivation-outcome" class="dash" d="M295 160 V220 H370 V316" marker-end="url(#fail)"/><path id="edge-character-outcome" class="dash" d="M105 160 V250 H330 V316" marker-end="url(#fail)"/></g><g id="layer-nodes"><g id="node-sensitivity"><rect class="panel-a" x="600" y="40" width="150" height="120" rx="8"/><text class="sh" x="675" y="70" text-anchor="middle">‏1 اخلاقی‏</text><text class="sh" x="675" y="90" text-anchor="middle">‏حساسیت‏</text><text class="small" x="675" y="122" text-anchor="middle">‏محسوس کرنا کہ یہ اخلاقی ہے‏</text></g><g id="node-judgement"><rect class="panel-a" x="410" y="40" width="150" height="120" rx="8"/><text class="sh" x="485" y="70" text-anchor="middle">‏2 اخلاقی‏</text><text class="sh" x="485" y="90" text-anchor="middle">‏فیصلہ‏</text><text class="small" x="485" y="122" text-anchor="middle">‏طے کرنا کہ‏</text><text class="small" x="485" y="140" text-anchor="middle">‏درست کیا ہے‏</text></g><g id="node-motivation"><rect class="panel-a" x="220" y="40" width="150" height="120" rx="8"/><text class="sh" x="295" y="70" text-anchor="middle">‏3 اخلاقی‏</text><text class="sh" x="295" y="90" text-anchor="middle">‏محرک‏</text><text class="small" x="295" y="122" text-anchor="middle">‏باقی سب پر‏</text><text class="small" x="295" y="140" text-anchor="middle">‏اسے چننا‏</text></g><g id="node-character"><rect class="panel-a" x="30" y="40" width="150" height="120" rx="8"/><text class="sh" x="105" y="70" text-anchor="middle">‏4 اخلاقی‏</text><text class="sh" x="105" y="90" text-anchor="middle">‏کردار‏</text><text class="small" x="105" y="122" text-anchor="middle">‏اسے کر گزرنا‏</text></g><g id="node-outcome"><rect class="plain" x="240" y="320" width="300" height="70" rx="35"/><text class="sh" x="390" y="350" text-anchor="middle">‏کوئی اخلاقی عمل نہیں‏</text><text class="small" x="390" y="372" text-anchor="middle">‏وہی نتیجہ، چار مختلف راستوں سے‏</text></g></g><g id="layer-labels"><text class="small" x="667" y="186" text-anchor="end">‏محسوس ہی نہ کیا‏</text><text class="small" x="477" y="186" text-anchor="end">‏غلط فیصلہ کیا‏</text><text class="small" x="287" y="186" text-anchor="end">‏کوئی اور چیز‏</text><text class="small" x="287" y="204" text-anchor="end">‏بھاری پڑی‏</text><text class="small" x="97" y="186" text-anchor="end">‏تکمیل نہ‏</text><text class="small" x="97" y="204" text-anchor="end">‏کر سکا‏</text><text id="label-caption" class="small" x="390" y="424" text-anchor="middle">‏چاروں کا کامیاب ہونا ضروری ہے۔ علاج ہر مرحلے پر مختلف ہے۔‏</text></g><text class="wm" x="12" y="450" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
