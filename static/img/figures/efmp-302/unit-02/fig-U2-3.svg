<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four domains of a teacher's code of conduct</title><desc id="d">Table of the four domains of a teacher's code of conduct - students, practice and performance, parents and community, and colleagues - each with what is owed, a recognisable breach, and who notices the breach first.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="430"/><rect class="cellhdr" x="16" y="16" width="748" height="54"/><rect class="grid" x="16" y="16" width="748" height="386"/><line class="grid" x1="212" y1="16" x2="212" y2="402"/><line class="grid" x1="450" y1="16" x2="450" y2="402"/><line class="grid" x1="624" y1="16" x2="624" y2="402"/><line class="grid" x1="16" y1="70" x2="764" y2="70"/><line class="grid" x1="16" y1="153" x2="764" y2="153"/><line class="grid" x1="16" y1="236" x2="764" y2="236"/><line class="grid" x1="16" y1="319" x2="764" y2="319"/><text class="h" x="28" y="48">Domain</text><text class="h" x="222" y="48">What is owed</text><text class="h" x="460" y="48">A recognisable breach</text><text class="h" x="634" y="48">Who notices first</text><text class="h" x="28" y="106">Students</text><text x="222" y="100">protection, fair treatment,</text><text x="222" y="120">dignity, no exploitation</text><text x="460" y="100">a verdict handed to a pupil</text><text x="460" y="120">about their own capacity</text><text class="m" x="634" y="110">the pupil, silently</text><text class="h" x="28" y="183">Practice and</text><text class="h" x="28" y="201">performance</text><text x="222" y="183">preparation, current</text><text x="222" y="203">knowledge, honest marking</text><text x="460" y="183">marks copied forward</text><text x="460" y="203">from unread scripts</text><text class="m" x="634" y="193">nobody, usually</text><text class="h" x="28" y="266">Parents and</text><text class="h" x="28" y="284">community</text><text x="222" y="266">accurate reporting a</text><text x="222" y="286">parent can act on</text><text x="460" y="266">"he does not work",</text><text x="460" y="286">true enough and useless</text><text class="m" x="634" y="276">the parent, later</text><text class="h" x="28" y="349">Colleagues and</text><text class="h" x="28" y="367">the profession</text><text x="222" y="349">fair dealing, shared work,</text><text x="222" y="369">no public undermining</text><text x="460" y="349">a staff-room remark that</text><text x="460" y="369">travels and is never checked</text><text class="m" x="634" y="359">every later teacher</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
