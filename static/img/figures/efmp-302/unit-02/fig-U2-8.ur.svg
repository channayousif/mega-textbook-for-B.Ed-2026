<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سرقے کا ایک مخمصہ، چار مرحلوں سے گزارا گیا</title><desc id="d">سرقے کے ایک مخمصے کا نقشہ جو چار مرحلوں سے گزارا گیا ہے: ہمدردی، سیاق، غور اور عمل، اور غور والے خانے میں دونوں مسابقتی بھلائیوں کا نام درج ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .p{fill:var(--panel);stroke:var(--ink);stroke-width:2} .pr{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .num{fill:var(--a2)} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="780" height="100%"/><text class="m" x="390" y="-6" text-anchor="middle"><tspan x="390" dy="0">عائشہ بورڈ کے امتحان</tspan><tspan x="390" dy="20">سے تین ہفتے پہلے ایک</tspan><tspan x="390" dy="20">ایسا مضمون جمع کراتی</tspan><tspan x="390" dy="20">ہے جو اس کا اپنا کام</tspan><tspan x="390" dy="20">نہیں۔</tspan></text><rect class="p" x="394" y="50" width="366" height="150" rx="6"/><text class="h" x="744" y="78" text-anchor="end">1 ہمدردی</text><text x="744" y="94" text-anchor="end"><tspan x="744" dy="0">جنوری میں والد کا</tspan><tspan x="744" dy="20">انتقال۔</tspan></text><text x="744" y="114" text-anchor="end"><tspan x="744" dy="0">اس کے بعد سے نتائج</tspan><tspan x="744" dy="20">بیٹھ گئے۔</tspan></text><text x="744" y="134" text-anchor="end"><tspan x="744" dy="0">دروازے پر بکتی ہوئی</tspan><tspan x="744" dy="20">گائیڈ کتاب۔</tspan></text><text class="m" x="744" y="162" text-anchor="end"><tspan x="744" dy="0">جہاں وہ کھڑی ہے وہاں</tspan><tspan x="744" dy="20">سے یہ ہفتہ</tspan></text><text class="m" x="744" y="190" text-anchor="end">کیسا دکھائی دیتا ہے؟</text><rect class="p" x="20" y="50" width="366" height="150" rx="6"/><text class="h" x="370" y="78" text-anchor="end">2 سیاق</text><text x="370" y="94" text-anchor="end"><tspan x="370" dy="0">پہلی خطا۔ قاعدہ صفر</tspan><tspan x="370" dy="20">اور اطلاع۔</tspan></text><text x="370" y="114" text-anchor="end"><tspan x="370" dy="0">سربراہ نتائج کے دباؤ</tspan><tspan x="370" dy="20">میں۔</tspan></text><text x="370" y="134" text-anchor="end"><tspan x="370" dy="0">ابھی معلوم نہیں: گھر</tspan><tspan x="370" dy="20">میں کیا بدلا۔</tspan></text><text class="m" x="370" y="162" text-anchor="end"><tspan x="370" dy="0">فیصلے سے پہلے حقائق</tspan><tspan x="370" dy="20">متعین کیجیے،</tspan></text><text class="m" x="370" y="190" text-anchor="end">بعد میں نہیں۔</text><rect class="pr" x="394" y="212" width="366" height="150" rx="6"/><text class="h" x="744" y="240" text-anchor="end">3 غور</text><text x="744" y="256" text-anchor="end"><tspan x="744" dy="0">تشخیص میں دیانت، جو</tspan><tspan x="744" dy="20">ہر دوسرے</tspan></text><text x="744" y="276" text-anchor="end"><tspan x="744" dy="0">شاگرد اور بورڈ کے</tspan><tspan x="744" dy="20">حوالے سے واجب ہے۔</tspan></text><text x="744" y="286" text-anchor="end"><tspan x="744" dy="0">نگہداشت، جو ایک</tspan><tspan x="744" dy="20">سوگوار بچی پر واجب</tspan><tspan x="744" dy="20">ہے۔</tspan></text><text class="m" x="744" y="324" text-anchor="end"><tspan x="744" dy="0">اسکول کے نتائج کا</tspan><tspan x="744" dy="20">دباؤ ایک دباؤ ہے،</tspan></text><text class="m" x="744" y="342" text-anchor="end"><tspan x="744" dy="0">ان کی ذمہ داریوں میں</tspan><tspan x="744" dy="20">سے نہیں۔</tspan></text><rect class="p" x="20" y="212" width="366" height="150" rx="6"/><text class="h" x="370" y="240" text-anchor="end">4 عمل</text><text x="370" y="256" text-anchor="end"><tspan x="370" dy="0">نمبر صفر ہی رہتا ہے:</tspan><tspan x="370" dy="20">کام</tspan></text><text x="370" y="286" text-anchor="end">عائشہ کا نہیں۔</text><text x="370" y="286" text-anchor="end"><tspan x="370" dy="0">اطلاع دی گئی: قاعدہ</tspan><tspan x="370" dy="20">ان کا معاف کرنے کو</tspan><tspan x="370" dy="20">نہیں۔</tspan></text><text class="m" x="370" y="324" text-anchor="end"><tspan x="370" dy="0">پہلے عائشہ سے بات،</tspan><tspan x="370" dy="20">تاکہ اس پر</tspan></text><text class="m" x="370" y="342" text-anchor="end"><tspan x="370" dy="0">اچانک وار نہ ہو۔</tspan><tspan x="370" dy="20">نگہداشت الگ سے۔</tspan></text><text class="m" x="390" y="352" text-anchor="middle"><tspan x="390" dy="0">فیصلے کی ایک قیمت</tspan><tspan x="390" dy="20">ہے۔ یہ قابلِ دفاع اس</tspan><tspan x="390" dy="20">لیے ہے کہ قیمت وہیں</tspan><tspan x="390" dy="20">پڑتی ہے جہاں اس کا</tspan><tspan x="390" dy="20">محل ہے۔</tspan></text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
