<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سرقے کا ایک مخمصہ، چار مرحلوں سے گزارا گیا</title><desc id="d">سرقے کے ایک مخمصے کا نقشہ جو چار مرحلوں سے گزارا گیا ہے: ہمدردی، سیاق، غور اور عمل، اور غور والے خانے میں دونوں مسابقتی بھلائیوں کا نام درج ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5}.badge{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-empathy"><rect class="panel" x="400" y="60" width="360" height="170" rx="10"/><circle class="badge" cx="730" cy="88" r="14"/><text class="sh" x="730" y="93" text-anchor="middle">‏1‏</text><text class="h" x="706" y="94" text-anchor="end">‏ہمدردی‏</text><text class="body" x="744" y="128" text-anchor="end">‏جنوری میں والد کا انتقال۔‏</text><text class="body" x="744" y="148" text-anchor="end">‏اس کے بعد سے نتائج بیٹھ گئے۔‏</text><text class="body" x="744" y="168" text-anchor="end">‏دروازے پر بکتی ہوئی گائیڈ کتاب۔‏</text><text class="small" x="744" y="194" text-anchor="end">‏جہاں وہ کھڑی ہے وہاں سے یہ ہفتہ‏</text><text class="small" x="744" y="214" text-anchor="end">‏کیسا دکھائی دیتا ہے؟‏</text></g><g id="node-context"><rect class="panel" x="20" y="60" width="360" height="170" rx="10"/><circle class="badge" cx="350" cy="88" r="14"/><text class="sh" x="350" y="93" text-anchor="middle">‏2‏</text><text class="h" x="326" y="94" text-anchor="end">‏سیاق‏</text><text class="body" x="364" y="128" text-anchor="end">‏پہلی خطا۔ قاعدہ صفر اور اطلاع۔‏</text><text class="body" x="364" y="148" text-anchor="end">‏سربراہ نتائج کے دباؤ میں۔‏</text><text class="body" x="364" y="168" text-anchor="end">‏ابھی معلوم نہیں: گھر میں کیا بدلا۔‏</text><text class="small" x="364" y="194" text-anchor="end">‏فیصلے سے پہلے حقائق متعین کیجیے،‏</text><text class="small" x="364" y="214" text-anchor="end">‏بعد میں نہیں۔‏</text></g><g id="node-reflect"><rect class="panel-c" x="400" y="250" width="360" height="170" rx="10"/><circle class="badge" cx="730" cy="278" r="14"/><text class="sh" x="730" y="283" text-anchor="middle">‏3‏</text><text class="h" x="706" y="284" text-anchor="end">‏غور‏</text><text class="body" x="744" y="318" text-anchor="end">‏تشخیص میں دیانت، جو ہر دوسرے‏</text><text class="body" x="744" y="338" text-anchor="end">‏شاگرد اور بورڈ کے حوالے سے واجب ہے۔‏</text><text class="body" x="744" y="358" text-anchor="end">‏نگہداشت، جو ایک سوگوار بچی پر واجب ہے۔‏</text><text class="small" x="744" y="384" text-anchor="end">‏اسکول کے نتائج کا دباؤ ایک دباؤ ہے،‏</text><text class="small" x="744" y="404" text-anchor="end">‏ان کی ذمہ داریوں میں سے نہیں۔‏</text></g><g id="node-action"><rect class="panel" x="20" y="250" width="360" height="170" rx="10"/><circle class="badge" cx="350" cy="278" r="14"/><text class="sh" x="350" y="283" text-anchor="middle">‏4‏</text><text class="h" x="326" y="284" text-anchor="end">‏عمل‏</text><text class="body" x="364" y="318" text-anchor="end">‏نمبر صفر ہی رہتا ہے: کام‏</text><text class="body" x="364" y="338" text-anchor="end">‏عائشہ کا نہیں۔‏</text><text class="body" x="364" y="358" text-anchor="end">‏اطلاع دی گئی: قاعدہ ان کا معاف کرنے کو نہیں۔‏</text><text class="small" x="364" y="384" text-anchor="end">‏پہلے عائشہ سے بات، تاکہ اس پر‏</text><text class="small" x="364" y="404" text-anchor="end">‏اچانک وار نہ ہو۔ نگہداشت الگ سے۔‏</text></g></g><g id="layer-labels"><text id="label-case" class="small" x="390" y="36" text-anchor="middle">‏عائشہ بورڈ کے امتحان سے تین ہفتے پہلے ایک ایسا مضمون جمع کراتی ہے جو اس کا اپنا کام نہیں۔‏</text><text id="label-caption" class="small" x="390" y="450" text-anchor="middle">‏فیصلے کی ایک قیمت ہے۔ یہ قابلِ دفاع اس لیے ہے کہ قیمت وہیں پڑتی ہے جہاں اس کا محل ہے۔‏</text></g><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
