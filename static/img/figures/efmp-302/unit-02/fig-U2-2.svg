<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What each party entrusts to a teacher</title><desc id="d">Concept map with trust at the centre and four branches showing what pupils, parents, the state and colleagues each entrust to a teacher, with an example breach on each branch.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.flow-a{stroke:var(--a1);stroke-width:2.5;fill:none}.ah-a{fill:var(--a1)}.big{font-size:20px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-trust-pupils" class="flow-a" d="M280 240 H170 V174" marker-end="url(#arrow)"/><path id="edge-trust-parents" class="flow-a" d="M500 240 H610 V174" marker-end="url(#arrow)"/><path id="edge-trust-state" class="flow-a" d="M280 240 H170 V306" marker-end="url(#arrow)"/><path id="edge-trust-colleagues" class="flow-a" d="M500 240 H610 V306" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-pupils"><rect class="panel" x="40" y="40" width="260" height="130" rx="10"/><text class="sh" x="56" y="72">Pupils entrust</text><text class="body" x="56" y="102">their learning and safety</text><text class="small" x="56" y="138">breach: a confidence repeated</text></g><g id="node-parents"><rect class="panel" x="480" y="40" width="260" height="130" rx="10"/><text class="sh" x="496" y="72">Parents entrust</text><text class="body" x="496" y="102">their children</text><text class="small" x="496" y="138">breach: a report that misleads</text></g><g id="node-state"><rect class="panel" x="40" y="310" width="260" height="130" rx="10"/><text class="sh" x="56" y="342">The state entrusts</text><text class="body" x="56" y="372">its curriculum and marks</text><text class="small" x="56" y="408">breach: a mark nobody earned</text></g><g id="node-colleagues"><rect class="panel" x="480" y="310" width="260" height="130" rx="10"/><text class="sh" x="496" y="342">Colleagues entrust</text><text class="body" x="496" y="372">the profession's standing</text><text class="small" x="496" y="408">breach: one teacher's misconduct</text></g><g id="node-trust"><ellipse class="panel-a" cx="390" cy="240" rx="110" ry="50"/><text class="big" x="390" y="238" text-anchor="middle">TRUST</text><text class="small" x="390" y="262" text-anchor="middle">extended, not given</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="390" y="470" text-anchor="middle">Built slowly by ordinary reliable acts. Spent invisibly. Destroyed in one.</text></g><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
