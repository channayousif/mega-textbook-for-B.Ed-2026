<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What each party entrusts to a teacher</title><desc id="d">Concept map with trust at the centre and four branches showing what pupils, parents, the state and colleagues each entrust to a teacher, with an example breach on each branch.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><line class="link" x1="330" y1="145" x2="230" y2="100" marker-end="url(#ar)"/><line class="link" x1="450" y1="145" x2="550" y2="100" marker-end="url(#ar)"/><line class="link" x1="330" y1="285" x2="230" y2="330" marker-end="url(#ar)"/><line class="link" x1="450" y1="285" x2="550" y2="330" marker-end="url(#ar)"/><ellipse class="core" cx="390" cy="215" rx="86" ry="52"/><text class="h" x="390" y="212" text-anchor="middle">TRUST</text><text class="m" x="390" y="236" text-anchor="middle">extended, not given</text><rect class="panel" x="24" y="40" width="250" height="86" rx="6"/><text class="h" x="36" y="64">Pupils entrust</text><text x="36" y="86">their learning and safety</text><text class="m" x="36" y="110">breach: a confidence repeated</text><rect class="panel" x="506" y="40" width="250" height="86" rx="6"/><text class="h" x="518" y="64">Parents entrust</text><text x="518" y="86">their children</text><text class="m" x="518" y="110">breach: a report that misleads</text><rect class="panel" x="24" y="316" width="250" height="86" rx="6"/><text class="h" x="36" y="340">The state entrusts</text><text x="36" y="362">its curriculum and marks</text><text class="m" x="36" y="386">breach: a mark nobody earned</text><rect class="panel" x="506" y="316" width="250" height="86" rx="6"/><text class="h" x="518" y="340">Colleagues entrust</text><text x="518" y="362">the profession's standing</text><text class="m" x="518" y="386">breach: one teacher's misconduct</text><text class="m" x="390" y="440" text-anchor="middle">Built slowly by ordinary reliable acts. Spent invisibly. Destroyed in one.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
