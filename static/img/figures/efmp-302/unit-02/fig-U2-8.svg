<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One plagiarism dilemma worked through the four steps</title><desc id="d">Diagram of one plagiarism dilemma worked through the four steps - Empathy, Context, Reflect and Action - with the two competing goods named in the Reflect panel.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5}.badge{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-empathy"><rect class="panel" x="20" y="60" width="360" height="170" rx="10"/><circle class="badge" cx="50" cy="88" r="14"/><text class="sh" x="50" y="93" text-anchor="middle">1</text><text class="h" x="74" y="94">Empathy</text><text class="body" x="36" y="128">A father dead in January.</text><text class="body" x="36" y="148">Results collapsed since.</text><text class="body" x="36" y="168">A guide book on sale at the gate.</text><text class="small" x="36" y="194">What does this week look like</text><text class="small" x="36" y="214">from where she is standing?</text></g><g id="node-context"><rect class="panel" x="400" y="60" width="360" height="170" rx="10"/><circle class="badge" cx="430" cy="88" r="14"/><text class="sh" x="430" y="93" text-anchor="middle">2</text><text class="h" x="454" y="94">Context</text><text class="body" x="416" y="128">First offence. Rule is zero and report.</text><text class="body" x="416" y="148">Head under results pressure.</text><text class="body" x="416" y="168">Not yet known: what changed at home.</text><text class="small" x="416" y="194">Establish the facts before</text><text class="small" x="416" y="214">deciding, not after.</text></g><g id="node-reflect"><rect class="panel-c" x="20" y="250" width="360" height="170" rx="10"/><circle class="badge" cx="50" cy="278" r="14"/><text class="sh" x="50" y="283" text-anchor="middle">3</text><text class="h" x="74" y="284">Reflect</text><text class="body" x="36" y="318">Honesty in assessment, owed to</text><text class="body" x="36" y="338">every other pupil and the board.</text><text class="body" x="36" y="358">Duty of care, owed to a grieving child.</text><text class="small" x="36" y="384">The school's results pressure is a</text><text class="small" x="36" y="404">pressure, not one of her obligations.</text></g><g id="node-action"><rect class="panel" x="400" y="250" width="360" height="170" rx="10"/><circle class="badge" cx="430" cy="278" r="14"/><text class="sh" x="430" y="283" text-anchor="middle">4</text><text class="h" x="454" y="284">Action</text><text class="body" x="416" y="318">Mark stands at zero: the work</text><text class="body" x="416" y="338">is not Ayesha's.</text><text class="body" x="416" y="358">Report made: the rule is not hers to waive.</text><text class="small" x="416" y="384">Speak to Ayesha first, so she is</text><text class="small" x="416" y="404">not ambushed. Pastoral care, separately.</text></g></g><g id="layer-labels"><text id="label-case" class="small" x="390" y="36" text-anchor="middle">Ayesha submits an essay that is not her own work, three weeks before the board examination.</text><text id="label-caption" class="small" x="390" y="450" text-anchor="middle">The decision costs something. It is defensible because the cost falls where it belongs.</text></g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
