<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The levels of a code, and the gaps between them</title><desc id="d">Four nested circles showing personal values inside school policy inside the national code inside the international framework, with the gaps between rings labelled as where a teacher's own judgement is required.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.lead{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3}.ring4{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.ring3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.ring2{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring1{fill:var(--bg);stroke:var(--ink);stroke-width:2}.dot{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><circle id="region-international" class="ring4" cx="240" cy="240" r="210"/><circle id="region-gap-1" class="bg" cx="240" cy="240" r="160"/><circle id="region-national" class="ring3" cx="240" cy="240" r="150"/><circle id="region-gap-2" class="bg" cx="240" cy="240" r="110"/><circle id="region-school" class="ring2" cx="240" cy="240" r="100"/><circle id="region-gap-3" class="bg" cx="240" cy="240" r="56"/><circle id="region-personal" class="ring1" cx="240" cy="240" r="46"/></g><g id="layer-edges"><line id="edge-gap1-judgement" class="lead" x1="374.2" y1="162.5" x2="488" y2="148"/><circle class="dot" cx="374.2" cy="162.5" r="4"/><line id="edge-gap2-judgement" class="lead" x1="330.9" y1="187.5" x2="488" y2="148"/><circle class="dot" cx="330.9" cy="187.5" r="4"/><line id="edge-gap3-judgement" class="lead" x1="284.2" y1="214.5" x2="488" y2="148"/><circle class="dot" cx="284.2" cy="214.5" r="4"/></g><g id="layer-nodes"><g id="node-international"><text class="sh" x="240" y="56" text-anchor="middle">International</text><text class="sh" x="240" y="74" text-anchor="middle">framework</text></g><g id="node-national"><text class="sh" x="240" y="117" text-anchor="middle">National code</text></g><g id="node-school"><text class="sh" x="240" y="167" text-anchor="middle">School policy</text></g><g id="node-personal"><text class="sh" x="240" y="236" text-anchor="middle">Personal</text><text class="sh" x="240" y="255" text-anchor="middle">values</text></g><g id="node-judgement"><text class="h" x="500" y="142">Where judgement</text><text class="h" x="500" y="162">is required</text><text class="body" x="500" y="210">The rings do not meet.</text><text class="body" x="500" y="230">Each gap is a case no</text><text class="body" x="500" y="250">document above it settles.</text><text class="small" x="500" y="300">A code is a summary of</text><text class="small" x="500" y="320">settled judgement, not a</text><text class="small" x="500" y="340">list of forbidden acts.</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="390" y="474" text-anchor="middle">Read them together: the conflict itself is information.</text></g><text class="wm" x="768" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>