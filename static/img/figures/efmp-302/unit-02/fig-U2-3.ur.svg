<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد کے ضابطہ اخلاق کے چار دائرے</title><desc id="d">استاد کے ضابطہ اخلاق کے چار دائروں کا نقشہ: طلبہ، مشق اور کارکردگی، والدین اور برادری، اور ساتھی اساتذہ۔ ہر ایک کے ساتھ یہ کہ کیا واجب ہے، ایک قابلِ شناخت خلاف ورزی، اور یہ کہ خلاف ورزی سب سے پہلے کون محسوس کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.hdr{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="60"/><line class="grid" x1="620" y1="20" x2="620" y2="440"/><line class="grid" x1="380" y1="20" x2="380" y2="440"/><line class="grid" x1="160" y1="20" x2="160" y2="440"/><line class="grid" x1="760" y1="170" x2="20" y2="170"/><line class="grid" x1="760" y1="260" x2="20" y2="260"/><line class="grid" x1="760" y1="350" x2="20" y2="350"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><line class="frame" x1="760" y1="80" x2="20" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="748" y="54.5" text-anchor="end">‏دائرہ‏</text><text class="sh" x="608" y="54.5" text-anchor="end">‏کیا واجب ہے‏</text><text class="sh" x="368" y="54.5" text-anchor="end">‏ایک قابلِ شناخت خلاف ورزی‏</text><text class="sh" x="148" y="49" text-anchor="end">‏پہلے کون محسوس‏</text><text class="sh" x="148" y="71" text-anchor="end">‏کرتا ہے‏</text></g><g id="node-students"><text class="bt" x="748" y="129.5" text-anchor="end">‏طلبہ‏</text><text class="body" x="608" y="119.5" text-anchor="end">‏حفاظت، منصفانہ سلوک،‏</text><text class="body" x="608" y="139.5" text-anchor="end">‏عزتِ نفس، ناجائز فائدہ نہیں‏</text><text class="body" x="368" y="119.5" text-anchor="end">‏شاگرد کو اس کی اپنی صلاحیت‏</text><text class="body" x="368" y="139.5" text-anchor="end">‏کے بارے میں سنایا گیا فیصلہ‏</text><text class="small" x="148" y="129.5" text-anchor="end">‏شاگرد، خاموشی سے‏</text></g><g id="node-practice"><text class="bt" x="748" y="209.5" text-anchor="end">‏مشق اور‏</text><text class="bt" x="748" y="229.5" text-anchor="end">‏کارکردگی‏</text><text class="body" x="608" y="209.5" text-anchor="end">‏تیاری، تازہ علم،‏</text><text class="body" x="608" y="229.5" text-anchor="end">‏دیانتدار نمبر دہی‏</text><text class="body" x="368" y="209.5" text-anchor="end">‏بغیر پڑھے پرچوں کے‏</text><text class="body" x="368" y="229.5" text-anchor="end">‏آگے نقل کیے گئے نمبر‏</text><text class="small" x="148" y="219.5" text-anchor="end">‏عموماً کوئی نہیں‏</text></g><g id="node-parents"><text class="bt" x="748" y="299.5" text-anchor="end">‏والدین اور‏</text><text class="bt" x="748" y="319.5" text-anchor="end">‏برادری‏</text><text class="body" x="608" y="299.5" text-anchor="end">‏درست اطلاع جس پر والدین‏</text><text class="body" x="608" y="319.5" text-anchor="end">‏عمل کر سکیں‏</text><text class="body" x="368" y="299.5" text-anchor="end">‏&quot;وہ محنت نہیں کرتا&quot;،‏</text><text class="body" x="368" y="319.5" text-anchor="end">‏کافی سچ اور بے کار‏</text><text class="small" x="148" y="309.5" text-anchor="end">‏والدین، بعد میں‏</text></g><g id="node-colleagues"><text class="bt" x="748" y="389.5" text-anchor="end">‏ساتھی اساتذہ‏</text><text class="bt" x="748" y="409.5" text-anchor="end">‏اور پیشہ‏</text><text class="body" x="608" y="389.5" text-anchor="end">‏منصفانہ برتاؤ، مشترکہ کام،‏</text><text class="body" x="608" y="409.5" text-anchor="end">‏سرِ عام کمزور کرنا نہیں‏</text><text class="body" x="368" y="389.5" text-anchor="end">‏عملے کے کمرے کا تبصرہ جو‏</text><text class="body" x="368" y="409.5" text-anchor="end">‏پھیلتا ہے اور پرکھا نہیں جاتا‏</text><text class="small" x="148" y="399.5" text-anchor="end">‏ہر بعد والا استاد‏</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
