<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد کے ضابطہ اخلاق کے چار دائرے</title><desc id="d">استاد کے ضابطہ اخلاق کے چار دائروں کا نقشہ: طلبہ، مشق اور کارکردگی، والدین اور برادری، اور ساتھی اساتذہ۔ ہر ایک کے ساتھ یہ کہ کیا واجب ہے، ایک قابلِ شناخت خلاف ورزی، اور یہ کہ خلاف ورزی سب سے پہلے کون محسوس کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="780" height="100%"/><rect class="cellhdr" x="16" y="16" width="748" height="54"/><rect class="grid" x="16" y="16" width="748" height="386"/><line class="grid" x1="568" y1="16" x2="568" y2="402"/><line class="grid" x1="330" y1="16" x2="330" y2="402"/><line class="grid" x1="156" y1="16" x2="156" y2="402"/><line class="grid" x1="16" y1="70" x2="764" y2="70"/><line class="grid" x1="16" y1="153" x2="764" y2="153"/><line class="grid" x1="16" y1="236" x2="764" y2="236"/><line class="grid" x1="16" y1="319" x2="764" y2="319"/><text class="h" x="752" y="48" text-anchor="end">دائرہ</text><text class="h" x="556" y="48" text-anchor="end">کیا واجب ہے</text><text class="h" x="318" y="38" text-anchor="end"><tspan x="318" dy="0">ایک قابلِ شناخت خلاف</tspan><tspan x="318" dy="20">ورزی</tspan></text><text class="h" x="144" y="38" text-anchor="end"><tspan x="144" dy="0">پہلے کون محسوس کرتا</tspan><tspan x="144" dy="20">ہے</tspan></text><text class="h" x="752" y="106" text-anchor="end">طلبہ</text><text x="556" y="100" text-anchor="end">حفاظت، منصفانہ سلوک،</text><text x="556" y="110" text-anchor="end"><tspan x="556" dy="0">عزتِ نفس، ناجائز</tspan><tspan x="556" dy="20">فائدہ نہیں</tspan></text><text x="318" y="90" text-anchor="end"><tspan x="318" dy="0">شاگرد کو اس کی اپنی</tspan><tspan x="318" dy="20">صلاحیت</tspan></text><text x="318" y="110" text-anchor="end"><tspan x="318" dy="0">کے بارے میں سنایا</tspan><tspan x="318" dy="20">گیا فیصلہ</tspan></text><text class="m" x="144" y="110" text-anchor="end">شاگرد، خاموشی سے</text><text class="h" x="752" y="183" text-anchor="end">مشق اور</text><text class="h" x="752" y="201" text-anchor="end">کارکردگی</text><text x="556" y="183" text-anchor="end">تیاری، تازہ علم،</text><text x="556" y="203" text-anchor="end">دیانتدار نمبر دہی</text><text x="318" y="183" text-anchor="end">بغیر پڑھے پرچوں کے</text><text x="318" y="203" text-anchor="end">آگے نقل کیے گئے نمبر</text><text class="m" x="144" y="193" text-anchor="end">عموماً کوئی نہیں</text><text class="h" x="752" y="266" text-anchor="end">والدین اور</text><text class="h" x="752" y="284" text-anchor="end">برادری</text><text x="556" y="256" text-anchor="end"><tspan x="556" dy="0">درست اطلاع جس پر</tspan><tspan x="556" dy="20">والدین</tspan></text><text x="556" y="286" text-anchor="end">عمل کر سکیں</text><text x="318" y="266" text-anchor="end">"وہ محنت نہیں کرتا"،</text><text x="318" y="286" text-anchor="end">کافی سچ اور بے کار</text><text class="m" x="144" y="276" text-anchor="end">والدین، بعد میں</text><text class="h" x="752" y="349" text-anchor="end">ساتھی اساتذہ</text><text class="h" x="752" y="367" text-anchor="end">اور پیشہ</text><text x="556" y="339" text-anchor="end"><tspan x="556" dy="0">منصفانہ برتاؤ،</tspan><tspan x="556" dy="20">مشترکہ کام،</tspan></text><text x="556" y="359" text-anchor="end"><tspan x="556" dy="0">سرِ عام کمزور کرنا</tspan><tspan x="556" dy="20">نہیں</tspan></text><text x="318" y="339" text-anchor="end"><tspan x="318" dy="0">عملے کے کمرے کا</tspan><tspan x="318" dy="20">تبصرہ جو</tspan></text><text x="318" y="359" text-anchor="end"><tspan x="318" dy="0">پھیلتا ہے اور پرکھا</tspan><tspan x="318" dy="20">نہیں جاتا</tspan></text><text class="m" x="144" y="359" text-anchor="end">ہر بعد والا استاد</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
