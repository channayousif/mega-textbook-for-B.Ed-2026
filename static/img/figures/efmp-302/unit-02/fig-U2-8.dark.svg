<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One plagiarism dilemma worked through the four steps</title><desc id="d">Diagram of one plagiarism dilemma worked through the four steps - Empathy, Context, Reflect and Action - with the two competing goods named in the Reflect panel.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .p{fill:var(--panel);stroke:var(--ink);stroke-width:2} .pr{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .num{fill:var(--a2)} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="430"/><text class="m" x="390" y="34" text-anchor="middle">Ayesha submits an essay that is not her own work, three weeks before the board examination.</text><rect class="p" x="20" y="50" width="366" height="150" rx="6"/><text class="h" x="36" y="78">1 Empathy</text><text x="36" y="104">A father dead in January.</text><text x="36" y="124">Results collapsed since.</text><text x="36" y="144">A guide book on sale at the gate.</text><text class="m" x="36" y="172">What does this week look like</text><text class="m" x="36" y="190">from where she is standing?</text><rect class="p" x="394" y="50" width="366" height="150" rx="6"/><text class="h" x="410" y="78">2 Context</text><text x="410" y="104">First offence. Rule is zero and report.</text><text x="410" y="124">Head under results pressure.</text><text x="410" y="144">Not yet known: what changed at home.</text><text class="m" x="410" y="172">Establish the facts before</text><text class="m" x="410" y="190">deciding, not after.</text><rect class="pr" x="20" y="212" width="366" height="150" rx="6"/><text class="h" x="36" y="240">3 Reflect</text><text x="36" y="266">Honesty in assessment, owed to</text><text x="36" y="286">every other pupil and the board.</text><text x="36" y="306">Duty of care, owed to a grieving child.</text><text class="m" x="36" y="334">The school's results pressure is a</text><text class="m" x="36" y="352">pressure, not one of her obligations.</text><rect class="p" x="394" y="212" width="366" height="150" rx="6"/><text class="h" x="410" y="240">4 Action</text><text x="410" y="266">Mark stands at zero: the work</text><text x="410" y="286">is not Ayesha's.</text><text x="410" y="306">Report made: the rule is not hers to waive.</text><text class="m" x="410" y="334">Speak to Ayesha first, so she is</text><text class="m" x="410" y="352">not ambushed. Pastoral care, separately.</text><text class="m" x="390" y="392" text-anchor="middle">The decision costs something. It is defensible because the cost falls where it belongs.</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
