<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Personal morality, the law and professional ethics compared</title><desc id="d">Table comparing personal morality, the law and professional ethics by what each governs, who enforces it, what it cannot reach, and a teaching example.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .focus{fill:var(--a1-fill)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="focus" x="574" y="16" width="190" height="438"/><rect class="cellhdr" x="16" y="16" width="748" height="60"/><rect class="grid" x="16" y="16" width="748" height="438"/><line class="grid" x1="196" y1="16" x2="196" y2="454"/><line class="grid" x1="385" y1="16" x2="385" y2="454"/><line class="grid" x1="574" y1="16" x2="574" y2="454"/><line class="grid" x1="16" y1="76" x2="764" y2="76"/><line class="grid" x1="16" y1="170" x2="764" y2="170"/><line class="grid" x1="16" y1="264" x2="764" y2="264"/><line class="grid" x1="16" y1="358" x2="764" y2="358"/><text class="h" x="290" y="52" text-anchor="middle">Personal morality</text><text class="h" x="479" y="52" text-anchor="middle">The law</text><text class="h" x="669" y="43" text-anchor="middle">Professional</text><text class="h" x="669" y="61" text-anchor="middle">ethics</text><text class="h" x="28" y="112">What it governs</text><text x="206" y="112">what you believe</text><text x="206" y="132">is right</text><text x="395" y="112">what the state</text><text x="395" y="132">requires</text><text x="584" y="112">what the role</text><text x="584" y="132">owes</text><text class="h" x="28" y="206">Who enforces it</text><text x="206" y="206">your own</text><text x="206" y="226">conscience</text><text x="395" y="206">courts and</text><text x="395" y="226">the state</text><text x="584" y="206">the profession</text><text x="584" y="226">and its code</text><text class="h" x="28" y="292">What it cannot</text><text class="h" x="28" y="310">reach</text><text x="206" y="300">another person's</text><text x="206" y="320">conscience</text><text x="395" y="300">what is wrong</text><text x="395" y="320">but lawful</text><text x="584" y="300">cases the code</text><text x="584" y="320">does not name</text><text class="h" x="28" y="394">A teaching</text><text class="h" x="28" y="412">example</text><text class="m" x="206" y="394">a teacher's</text><text class="m" x="206" y="414">private faith</text><text class="m" x="395" y="394">striking</text><text class="m" x="395" y="414">a pupil</text><text class="m" x="584" y="394">reading marks aloud</text><text class="m" x="584" y="414">in rank order</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
