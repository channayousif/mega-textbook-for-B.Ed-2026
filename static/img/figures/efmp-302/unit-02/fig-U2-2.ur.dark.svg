<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ہر فریق استاد کے سپرد کیا کرتا ہے</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں اعتماد ہے اور چار شاخیں دکھاتی ہیں کہ شاگرد، والدین، ریاست اور ساتھی اساتذہ استاد کے سپرد کیا کرتے ہیں، ہر شاخ پر خلاف ورزی کی ایک مثال کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><line class="link" x1="330" y1="145" x2="230" y2="100" marker-end="url(#ar)"/><line class="link" x1="450" y1="145" x2="550" y2="100" marker-end="url(#ar)"/><line class="link" x1="330" y1="285" x2="230" y2="330" marker-end="url(#ar)"/><line class="link" x1="450" y1="285" x2="550" y2="330" marker-end="url(#ar)"/><ellipse class="core" cx="390" cy="215" rx="86" ry="52"/><text class="h" x="390" y="212" text-anchor="middle">اعتماد</text><text class="m" x="390" y="236" text-anchor="middle">دیا جاتا ہے، بخشا نہیں جاتا</text><rect class="panel" x="506" y="40" width="250" height="86" rx="6"/><text class="h" x="744" y="64" text-anchor="end">شاگرد سپرد کرتے ہیں</text><text x="744" y="86" text-anchor="end">اپنا سیکھنا اور اپنی حفاظت</text><text class="m" x="744" y="110" text-anchor="end">خلاف ورزی: دہرایا گیا راز</text><rect class="panel" x="24" y="40" width="250" height="86" rx="6"/><text class="h" x="262" y="64" text-anchor="end">والدین سپرد کرتے ہیں</text><text x="262" y="86" text-anchor="end">اپنے بچے</text><text class="m" x="262" y="110" text-anchor="end">خلاف ورزی: گمراہ کرنے والی اطلاع</text><rect class="panel" x="506" y="316" width="250" height="86" rx="6"/><text class="h" x="744" y="340" text-anchor="end">ریاست سپرد کرتی ہے</text><text x="744" y="362" text-anchor="end">اپنا نصاب اور نمبر</text><text class="m" x="744" y="386" text-anchor="end">خلاف ورزی: بغیر کمائے دیا گیا نمبر</text><rect class="panel" x="24" y="316" width="250" height="86" rx="6"/><text class="h" x="262" y="340" text-anchor="end">ساتھی سپرد کرتے ہیں</text><text x="262" y="362" text-anchor="end">پیشے کا اپنا مقام</text><text class="m" x="262" y="386" text-anchor="end">خلاف ورزی: ایک استاد کی بدعنوانی</text><text class="m" x="390" y="440" text-anchor="middle">عام قابلِ بھروسہ اعمال سے آہستہ بنتا ہے۔ غیر محسوس طور پر خرچ ہوتا ہے۔ ایک ہی عمل میں تباہ۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
