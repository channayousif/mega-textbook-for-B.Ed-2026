<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ہر فریق استاد کے سپرد کیا کرتا ہے</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں اعتماد ہے اور چار شاخیں دکھاتی ہیں کہ شاگرد، والدین، ریاست اور ساتھی اساتذہ استاد کے سپرد کیا کرتے ہیں، ہر شاخ پر خلاف ورزی کی ایک مثال کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.flow-a{stroke:var(--a1);stroke-width:2.5;fill:none}.ah-a{fill:var(--a1)}.big{font-size:20px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-trust-pupils" class="flow-a" d="M500 240 H610 V174" marker-end="url(#arrow)"/><path id="edge-trust-parents" class="flow-a" d="M280 240 H170 V174" marker-end="url(#arrow)"/><path id="edge-trust-state" class="flow-a" d="M500 240 H610 V306" marker-end="url(#arrow)"/><path id="edge-trust-colleagues" class="flow-a" d="M280 240 H170 V306" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-pupils"><rect class="panel" x="480" y="40" width="260" height="130" rx="10"/><text class="sh" x="724" y="72" text-anchor="end">‏شاگرد سپرد کرتے ہیں‏</text><text class="body" x="724" y="102" text-anchor="end">‏اپنا سیکھنا اور اپنی حفاظت‏</text><text class="small" x="724" y="138" text-anchor="end">‏خلاف ورزی: دہرایا گیا راز‏</text></g><g id="node-parents"><rect class="panel" x="40" y="40" width="260" height="130" rx="10"/><text class="sh" x="284" y="72" text-anchor="end">‏والدین سپرد کرتے ہیں‏</text><text class="body" x="284" y="102" text-anchor="end">‏اپنے بچے‏</text><text class="small" x="284" y="138" text-anchor="end">‏خلاف ورزی: گمراہ کرنے والی اطلاع‏</text></g><g id="node-state"><rect class="panel" x="480" y="310" width="260" height="130" rx="10"/><text class="sh" x="724" y="342" text-anchor="end">‏ریاست سپرد کرتی ہے‏</text><text class="body" x="724" y="372" text-anchor="end">‏اپنا نصاب اور نمبر‏</text><text class="small" x="724" y="408" text-anchor="end">‏خلاف ورزی: بغیر کمائے دیا گیا نمبر‏</text></g><g id="node-colleagues"><rect class="panel" x="40" y="310" width="260" height="130" rx="10"/><text class="sh" x="284" y="342" text-anchor="end">‏ساتھی سپرد کرتے ہیں‏</text><text class="body" x="284" y="372" text-anchor="end">‏پیشے کا اپنا مقام‏</text><text class="small" x="284" y="408" text-anchor="end">‏خلاف ورزی: ایک استاد کی بدعنوانی‏</text></g><g id="node-trust"><ellipse class="panel-a" cx="390" cy="240" rx="110" ry="50"/><text class="big" x="390" y="238" text-anchor="middle">‏اعتماد‏</text><text class="small" x="390" y="262" text-anchor="middle">‏دیا جاتا ہے، بخشا نہیں جاتا‏</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="390" y="470" text-anchor="middle">‏عام قابلِ بھروسہ اعمال سے آہستہ بنتا ہے۔ غیر محسوس طور پر خرچ ہوتا ہے۔ ایک ہی عمل میں تباہ۔‏</text></g><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
