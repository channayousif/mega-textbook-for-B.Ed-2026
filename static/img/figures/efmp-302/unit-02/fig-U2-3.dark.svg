<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four domains of a teacher's code of conduct</title><desc id="d">Table of the four domains of a teacher's code of conduct - students, practice and performance, parents and community, and colleagues - each with what is owed, a recognisable breach, and who notices the breach first.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="780" height="100%"/><rect class="cellhdr" x="16" y="16" width="748" height="54"/><rect class="grid" x="16" y="16" width="748" height="386"/><line class="grid" x1="212" y1="16" x2="212" y2="402"/><line class="grid" x1="450" y1="16" x2="450" y2="402"/><line class="grid" x1="624" y1="16" x2="624" y2="402"/><line class="grid" x1="16" y1="70" x2="764" y2="70"/><line class="grid" x1="16" y1="153" x2="764" y2="153"/><line class="grid" x1="16" y1="236" x2="764" y2="236"/><line class="grid" x1="16" y1="319" x2="764" y2="319"/><text class="h" x="28" y="48">Domain</text><text class="h" x="222" y="48">What is owed</text><text class="h" x="460" y="38"><tspan x="460" dy="0">A recognisable</tspan><tspan x="460" dy="20">breach</tspan></text><text class="h" x="634" y="38"><tspan x="634" dy="0">Who notices</tspan><tspan x="634" dy="20">first</tspan></text><text class="h" x="28" y="106">Students</text><text x="222" y="90"><tspan x="222" dy="0">protection, fair</tspan><tspan x="222" dy="20">treatment,</tspan></text><text x="222" y="110"><tspan x="222" dy="0">dignity, no</tspan><tspan x="222" dy="20">exploitation</tspan></text><text x="460" y="90"><tspan x="460" dy="0">a verdict handed to</tspan><tspan x="460" dy="20">a pupil</tspan></text><text x="460" y="110"><tspan x="460" dy="0">about their own</tspan><tspan x="460" dy="20">capacity</tspan></text><text class="m" x="634" y="110">the pupil, silently</text><text class="h" x="28" y="183">Practice and</text><text class="h" x="28" y="201">performance</text><text x="222" y="183">preparation, current</text><text x="222" y="193"><tspan x="222" dy="0">knowledge, honest</tspan><tspan x="222" dy="20">marking</tspan></text><text x="460" y="183">marks copied forward</text><text x="460" y="203">from unread scripts</text><text class="m" x="634" y="193">nobody, usually</text><text class="h" x="28" y="266">Parents and</text><text class="h" x="28" y="284">community</text><text x="222" y="266">accurate reporting a</text><text x="222" y="286">parent can act on</text><text x="460" y="266">"he does not work",</text><text x="460" y="276"><tspan x="460" dy="0">true enough and</tspan><tspan x="460" dy="20">useless</tspan></text><text class="m" x="634" y="276">the parent, later</text><text class="h" x="28" y="349">Colleagues and</text><text class="h" x="28" y="367">the profession</text><text x="222" y="339"><tspan x="222" dy="0">fair dealing, shared</tspan><tspan x="222" dy="20">work,</tspan></text><text x="222" y="359"><tspan x="222" dy="0">no public</tspan><tspan x="222" dy="20">undermining</tspan></text><text x="460" y="339"><tspan x="460" dy="0">a staff-room remark</tspan><tspan x="460" dy="20">that</tspan></text><text x="460" y="359"><tspan x="460" dy="0">travels and is never</tspan><tspan x="460" dy="20">checked</tspan></text><text class="m" x="634" y="359">every later teacher</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
