<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four domains of a teacher's code of conduct</title><desc id="d">Table of the four domains of a teacher's code of conduct - students, practice and performance, parents and community, and colleagues - each with what is owed, a recognisable breach, and who notices the breach first.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.hdr{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="60"/><line class="grid" x1="160" y1="20" x2="160" y2="440"/><line class="grid" x1="400" y1="20" x2="400" y2="440"/><line class="grid" x1="620" y1="20" x2="620" y2="440"/><line class="grid" x1="20" y1="170" x2="760" y2="170"/><line class="grid" x1="20" y1="260" x2="760" y2="260"/><line class="grid" x1="20" y1="350" x2="760" y2="350"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><line class="frame" x1="20" y1="80" x2="760" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="32" y="54.5">Domain</text><text class="sh" x="172" y="54.5">What is owed</text><text class="sh" x="412" y="54.5">A recognisable breach</text><text class="sh" x="632" y="44.5">Who notices</text><text class="sh" x="632" y="64.5">first</text></g><g id="node-students"><text class="bt" x="32" y="129.5">Students</text><text class="body" x="172" y="119.5">protection, fair treatment,</text><text class="body" x="172" y="139.5">dignity, no exploitation</text><text class="body" x="412" y="119.5">a verdict handed to a pupil</text><text class="body" x="412" y="139.5">about their own capacity</text><text class="small" x="632" y="129.5">the pupil, silently</text></g><g id="node-practice"><text class="bt" x="32" y="209.5">Practice and</text><text class="bt" x="32" y="229.5">performance</text><text class="body" x="172" y="209.5">preparation, current</text><text class="body" x="172" y="229.5">knowledge, honest marking</text><text class="body" x="412" y="209.5">marks copied forward</text><text class="body" x="412" y="229.5">from unread scripts</text><text class="small" x="632" y="219.5">nobody, usually</text></g><g id="node-parents"><text class="bt" x="32" y="299.5">Parents and</text><text class="bt" x="32" y="319.5">community</text><text class="body" x="172" y="299.5">accurate reporting a</text><text class="body" x="172" y="319.5">parent can act on</text><text class="body" x="412" y="299.5">&quot;he does not work&quot;,</text><text class="body" x="412" y="319.5">true enough and useless</text><text class="small" x="632" y="309.5">the parent, later</text></g><g id="node-colleagues"><text class="bt" x="32" y="389.5">Colleagues and</text><text class="bt" x="32" y="409.5">the profession</text><text class="body" x="172" y="389.5">fair dealing, shared work,</text><text class="body" x="172" y="409.5">no public undermining</text><text class="body" x="412" y="389.5">a staff-room remark that</text><text class="body" x="412" y="409.5">travels and is never checked</text><text class="small" x="632" y="389.5">every later</text><text class="small" x="632" y="409.5">teacher</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
