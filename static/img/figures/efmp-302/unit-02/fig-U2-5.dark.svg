<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Rest's four components, and the failure at each</title><desc id="d">Flowchart of Rest's four components - sensitivity, judgement, motivation and character - in sequence, with a failure branch dropping away from each stage to a single outcome box reading no ethical action.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.plain{fill:var(--bg);stroke:var(--ink);stroke-width:2}.flow-a{stroke:var(--a1);stroke-width:2.5;fill:none}.dash{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:6 5}.ah-a{fill:var(--a1)}.ah-m{fill:var(--muted)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker><marker id="fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-m"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="460"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-sensitivity-judgement" class="flow-a" x1="180" y1="100" x2="216" y2="100" marker-end="url(#arrow)"/><path id="edge-sensitivity-outcome" class="dash" d="M105 160 V250 H330 V316" marker-end="url(#fail)"/><line id="edge-judgement-motivation" class="flow-a" x1="370" y1="100" x2="406" y2="100" marker-end="url(#arrow)"/><path id="edge-judgement-outcome" class="dash" d="M295 160 V220 H370 V316" marker-end="url(#fail)"/><line id="edge-motivation-character" class="flow-a" x1="560" y1="100" x2="596" y2="100" marker-end="url(#arrow)"/><path id="edge-motivation-outcome" class="dash" d="M485 160 V220 H410 V316" marker-end="url(#fail)"/><path id="edge-character-outcome" class="dash" d="M675 160 V250 H450 V316" marker-end="url(#fail)"/></g><g id="layer-nodes"><g id="node-sensitivity"><rect class="panel-a" x="30" y="40" width="150" height="120" rx="8"/><text class="sh" x="105" y="70" text-anchor="middle">1 Moral</text><text class="sh" x="105" y="90" text-anchor="middle">sensitivity</text><text class="small" x="105" y="122" text-anchor="middle">noticing it is ethical</text></g><g id="node-judgement"><rect class="panel-a" x="220" y="40" width="150" height="120" rx="8"/><text class="sh" x="295" y="70" text-anchor="middle">2 Moral</text><text class="sh" x="295" y="90" text-anchor="middle">judgement</text><text class="small" x="295" y="122" text-anchor="middle">working out</text><text class="small" x="295" y="140" text-anchor="middle">what is right</text></g><g id="node-motivation"><rect class="panel-a" x="410" y="40" width="150" height="120" rx="8"/><text class="sh" x="485" y="70" text-anchor="middle">3 Moral</text><text class="sh" x="485" y="90" text-anchor="middle">motivation</text><text class="small" x="485" y="122" text-anchor="middle">choosing it</text><text class="small" x="485" y="140" text-anchor="middle">over the rest</text></g><g id="node-character"><rect class="panel-a" x="600" y="40" width="150" height="120" rx="8"/><text class="sh" x="675" y="70" text-anchor="middle">4 Moral</text><text class="sh" x="675" y="90" text-anchor="middle">character</text><text class="small" x="675" y="122" text-anchor="middle">carrying it through</text></g><g id="node-outcome"><rect class="plain" x="240" y="320" width="300" height="70" rx="35"/><text class="sh" x="390" y="350" text-anchor="middle">No ethical action</text><text class="small" x="390" y="372" text-anchor="middle">the same result, by four different routes</text></g></g><g id="layer-labels"><text class="small" x="113" y="186">did not notice</text><text class="small" x="303" y="186">judged wrongly</text><text class="small" x="493" y="186">was outweighed</text><text class="small" x="683" y="186">did not</text><text class="small" x="683" y="204">follow</text><text class="small" x="683" y="222">through</text><text id="label-caption" class="small" x="390" y="424" text-anchor="middle">All four must succeed. The remedy differs at every stage.</text></g><text class="wm" x="768" y="450" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
