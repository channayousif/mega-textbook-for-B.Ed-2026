<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Personal morality, the law and professional ethics compared</title><desc id="d">Table comparing personal morality, the law and professional ethics by what each governs, who enforces it, what it cannot reach, and a teaching example.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="60"/><rect id="region-focus" class="focus" x="580" y="80" width="180" height="360"/><line class="grid" x1="200" y1="20" x2="200" y2="440"/><line class="grid" x1="390" y1="20" x2="390" y2="440"/><line class="grid" x1="580" y1="20" x2="580" y2="440"/><line class="grid" x1="20" y1="170" x2="760" y2="170"/><line class="grid" x1="20" y1="260" x2="760" y2="260"/><line class="grid" x1="20" y1="350" x2="760" y2="350"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><rect id="region-focus-outline" class="focus-line" x="580" y="20" width="180" height="420"/><line class="frame" x1="20" y1="80" x2="760" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="212" y="54.5">Personal morality</text><text class="sh" x="402" y="54.5">The law</text><text class="sh" x="592" y="54.5">Professional ethics</text></g><g id="node-governs"><text class="bt" x="32" y="129.5">What it governs</text><text class="body" x="212" y="119.5">what you believe</text><text class="body" x="212" y="139.5">is right</text><text class="body" x="402" y="119.5">what the state</text><text class="body" x="402" y="139.5">requires</text><text class="body" x="592" y="119.5">what the role</text><text class="body" x="592" y="139.5">owes</text></g><g id="node-enforces"><text class="bt" x="32" y="219.5">Who enforces it</text><text class="body" x="212" y="209.5">your own</text><text class="body" x="212" y="229.5">conscience</text><text class="body" x="402" y="209.5">courts and</text><text class="body" x="402" y="229.5">the state</text><text class="body" x="592" y="209.5">the profession</text><text class="body" x="592" y="229.5">and its code</text></g><g id="node-cannot-reach"><text class="bt" x="32" y="299.5">What it cannot</text><text class="bt" x="32" y="319.5">reach</text><text class="body" x="212" y="299.5">another person's</text><text class="body" x="212" y="319.5">conscience</text><text class="body" x="402" y="299.5">what is wrong</text><text class="body" x="402" y="319.5">but lawful</text><text class="body" x="592" y="299.5">cases the code</text><text class="body" x="592" y="319.5">does not name</text></g><g id="node-example"><text class="bt" x="32" y="389.5">A teaching</text><text class="bt" x="32" y="409.5">example</text><text class="small" x="212" y="389.5">a teacher's</text><text class="small" x="212" y="409.5">private faith</text><text class="small" x="402" y="389.5">striking</text><text class="small" x="402" y="409.5">a pupil</text><text class="small" x="592" y="389.5">reading marks aloud</text><text class="small" x="592" y="409.5">in rank order</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
