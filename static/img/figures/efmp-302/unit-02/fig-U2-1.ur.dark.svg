<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ذاتی اخلاق، قانون اور پیشہ ورانہ اخلاقیات کا موازنہ</title><desc id="d">ذاتی اخلاق، قانون اور پیشہ ورانہ اخلاقیات کا موازنہ کرنے والا نقشہ: ہر ایک کس چیز پر حکم چلاتا ہے، اسے کون نافذ کرتا ہے، وہ کہاں تک نہیں پہنچ سکتا، اور تدریس سے ایک مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="60"/><rect id="region-focus" class="focus" x="20" y="80" width="180" height="360"/><line class="grid" x1="580" y1="20" x2="580" y2="440"/><line class="grid" x1="390" y1="20" x2="390" y2="440"/><line class="grid" x1="200" y1="20" x2="200" y2="440"/><line class="grid" x1="760" y1="170" x2="20" y2="170"/><line class="grid" x1="760" y1="260" x2="20" y2="260"/><line class="grid" x1="760" y1="350" x2="20" y2="350"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><rect id="region-focus-outline" class="focus-line" x="20" y="20" width="180" height="420"/><line class="frame" x1="760" y1="80" x2="20" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="568" y="54.5" text-anchor="end">‏ذاتی اخلاق‏</text><text class="sh" x="378" y="54.5" text-anchor="end">‏قانون‏</text><text class="sh" x="188" y="54.5" text-anchor="end">‏پیشہ ورانہ اخلاقیات‏</text></g><g id="node-governs"><text class="bt" x="748" y="119.5" text-anchor="end">‏کس چیز پر حکم‏</text><text class="bt" x="748" y="139.5" text-anchor="end">‏چلاتا ہے‏</text><text class="body" x="568" y="119.5" text-anchor="end">‏جسے آپ درست‏</text><text class="body" x="568" y="139.5" text-anchor="end">‏سمجھتے ہیں‏</text><text class="body" x="378" y="119.5" text-anchor="end">‏جس کا ریاست‏</text><text class="body" x="378" y="139.5" text-anchor="end">‏تقاضا کرتی ہے‏</text><text class="body" x="188" y="119.5" text-anchor="end">‏جو کردار پر‏</text><text class="body" x="188" y="139.5" text-anchor="end">‏واجب ہے‏</text></g><g id="node-enforces"><text class="bt" x="748" y="209.5" text-anchor="end">‏اسے کون نافذ‏</text><text class="bt" x="748" y="229.5" text-anchor="end">‏کرتا ہے‏</text><text class="body" x="568" y="209.5" text-anchor="end">‏آپ کا اپنا‏</text><text class="body" x="568" y="229.5" text-anchor="end">‏ضمیر‏</text><text class="body" x="378" y="209.5" text-anchor="end">‏عدالتیں اور‏</text><text class="body" x="378" y="229.5" text-anchor="end">‏ریاست‏</text><text class="body" x="188" y="209.5" text-anchor="end">‏پیشہ اور اس‏</text><text class="body" x="188" y="229.5" text-anchor="end">‏کا ضابطہ‏</text></g><g id="node-cannot-reach"><text class="bt" x="748" y="299.5" text-anchor="end">‏کہاں تک نہیں‏</text><text class="bt" x="748" y="319.5" text-anchor="end">‏پہنچ سکتا‏</text><text class="body" x="568" y="299.5" text-anchor="end">‏کسی دوسرے کا‏</text><text class="body" x="568" y="319.5" text-anchor="end">‏ضمیر‏</text><text class="body" x="378" y="299.5" text-anchor="end">‏جو غلط ہے مگر‏</text><text class="body" x="378" y="319.5" text-anchor="end">‏قانونی ہے‏</text><text class="body" x="188" y="299.5" text-anchor="end">‏وہ معاملات جن کا‏</text><tex