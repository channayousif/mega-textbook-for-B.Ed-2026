<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ذاتی اخلاق، قانون اور پیشہ ورانہ اخلاقیات کا موازنہ</title><desc id="d">ذاتی اخلاق، قانون اور پیشہ ورانہ اخلاقیات کا موازنہ کرنے والا نقشہ: ہر ایک کس چیز پر حکم چلاتا ہے، اسے کون نافذ کرتا ہے، وہ کہاں تک نہیں پہنچ سکتا، اور تدریس سے ایک مثال۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .focus{fill:var(--a1-fill)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="focus" x="16" y="16" width="190" height="438"/><rect class="cellhdr" x="16" y="16" width="748" height="60"/><rect class="grid" x="16" y="16" width="748" height="438"/><line class="grid" x1="206" y1="16" x2="206" y2="454"/><line class="grid" x1="395" y1="16" x2="395" y2="454"/><line class="grid" x1="584" y1="16" x2="584" y2="454"/><line class="grid" x1="16" y1="76" x2="764" y2="76"/><line class="grid" x1="16" y1="170" x2="764" y2="170"/><line class="grid" x1="16" y1="264" x2="764" y2="264"/><line class="grid" x1="16" y1="358" x2="764" y2="358"/><text class="h" x="489" y="52" text-anchor="middle">ذاتی اخلاق</text><text class="h" x="300" y="52" text-anchor="middle">قانون</text><text class="h" x="111" y="43" text-anchor="middle">پیشہ ورانہ</text><text class="h" x="111" y="61" text-anchor="middle">اخلاقیات</text><text class="h" x="752" y="112" text-anchor="end">کس چیز پر حکم</text><text class="h" x="752" y="130" text-anchor="end">چلاتا ہے</text><text x="574" y="112" text-anchor="end">جسے آپ درست</text><text x="574" y="132" text-anchor="end">سمجھتے ہیں</text><text x="385" y="112" text-anchor="end">جس کا ریاست</text><text x="385" y="132" text-anchor="end">تقاضا کرتی ہے</text><text x="196" y="112" text-anchor="end">جو کردار پر</text><text x="196" y="132" text-anchor="end">واجب ہے</text><text class="h" x="752" y="206" text-anchor="end">اسے کون نافذ</text><text class="h" x="752" y="224" text-anchor="end">کرتا ہے</text><text x="574" y="206" text-anchor="end">آپ کا اپنا</text><text x="574" y="226" text-anchor="end">ضمیر</text><text x="385" y="206" text-anchor="end">عدالتیں اور</text><text x="385" y="226" text-anchor="end">ریاست</text><text x="196" y="206" text-anchor="end">پیشہ اور اس</text><text x="196" y="226" text-anchor="end">کا ضابطہ</text><text class="h" x="752" y="292" text-anchor="end">کہاں تک نہیں</text><text class="h" x="752" y="310" text-anchor="end">پہنچ سکتا</text><text x="574" y="300" text-anchor="end">کسی دوسرے کا</text><text x="574" y="320" text-anchor="end">ضمیر</text><text x="385" y="300" text-anchor="end">جو غلط ہے مگر</text><text x="385" y="320" text-anchor="end">قانونی ہے</text><text x="196" y="300" text-anchor="end">وہ معاملات جن کا</text><text x="196" y="320" text-anchor="end">ضابطہ نام نہیں لیتا</text><text class="h" x="752" y="394" text-anchor="end">تدریس سے</text><text class="h" x="752" y="412" text-anchor="end">ایک مثال</text><text class="m" x="574" y="394" text-anchor="end">استاد کا نجی</text><text class="m" x="574" y="414" text-anchor="end">عقیدہ</text><text class="m" x="385" y="394" text-anchor="end">شاگرد کو</text><text class="m" x="385" y="414" text-anchor="end">مارنا</text><text class="m" x="196" y="394" text-anchor="end">نمبر درجہ بندی سے</text><text class="m" x="196" y="414" text-anchor="end">بلند آواز میں پڑھنا</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
