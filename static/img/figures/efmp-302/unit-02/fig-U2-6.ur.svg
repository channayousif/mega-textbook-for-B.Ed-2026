<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اخلاقی فیصلے کا چار مرحلہ فریم ورک، چکر کی شکل میں</title><desc id="d">اخلاقی فیصلے کے چار مرحلہ فریم ورک کا بہاؤ نقشہ جو ایک چکر کی شکل میں بنا ہے: ہمدردی، سیاق، غور، عمل۔ ہر پڑاؤ پر اس کا رہنما سوال درج ہے اور واپسی کے تیر پر لکھا ہے کہ اس نے مجھے اگلی بار کے لیے کیا سکھایا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .flow{stroke:var(--a2);stroke-width:2.5;fill:none} .back{stroke:var(--a1);stroke-width:2.5;stroke-dasharray:6 4;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><rect class="st" x="540" y="56" width="200" height="86" rx="8"/><text class="h" x="640" y="84" text-anchor="middle">1 ہمدردی</text><text class="m" x="640" y="106" text-anchor="middle">کون متاثر ہو رہا ہے، اور انہیں</text><text class="m" x="640" y="124" text-anchor="middle">یہ کیسا دکھائی دیتا ہے؟</text><rect class="st" x="40" y="56" width="200" height="86" rx="8"/><text class="h" x="140" y="84" text-anchor="middle">2 سیاق</text><text class="m" x="140" y="106" text-anchor="middle">حقائق، قواعد اور پابندیاں</text><text class="m" x="140" y="124" text-anchor="middle">کیا ہیں؟</text><rect class="st" x="40" y="250" width="200" height="86" rx="8"/><text class="h" x="140" y="278" text-anchor="middle">3 غور</text><text class="m" x="140" y="300" text-anchor="middle">آرام نہیں، ذمہ داریاں تولیے۔</text><text class="m" x="140" y="318" text-anchor="middle">مسابقت کرنے والی چیز کا نام لیجیے۔</text><rect class="st" x="540" y="250" width="200" height="86" rx="8"/><text class="h" x="640" y="278" text-anchor="middle">4 عمل</text><text class="m" x="640" y="300" text-anchor="middle">فیصلہ کیجیے، کر گزریے،</text><text class="m" x="640" y="318" text-anchor="middle">اور چکر مکمل کیجیے۔</text><line class="flow" x1="540" y1="99" x2="245" y2="99" marker-end="url(#a)"/><line class="flow" x1="140" y1="142" x2="140" y2="245" marker-end="url(#a)"/><line class="flow" x1="240" y1="293" x2="535" y2="293" marker-end="url(#a)"/><path class="back" d="M640 250 L640 196 L640 147" marker-end="url(#c)"/><text class="m" x="622" y="188" text-anchor="end">اس نے مجھے اگلی بار کے</text><text class="m" x="622" y="206" text-anchor="end">لیے کیا سکھایا؟</text><text class="m" x="390" y="380" text-anchor="middle">چکر، لکیر نہیں۔ جس فیصلے کا جائزہ نہ لیا جائے وہ آپ کو کچھ نہیں سکھا سکتا۔</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
