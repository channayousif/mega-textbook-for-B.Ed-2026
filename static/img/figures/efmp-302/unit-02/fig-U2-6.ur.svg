<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اخلاقی فیصلے کا چار مرحلہ فریم ورک، چکر کی شکل میں</title><desc id="d">اخلاقی فیصلے کے چار مرحلہ فریم ورک کا بہاؤ نقشہ جو ایک چکر کی شکل میں بنا ہے: ہمدردی، سیاق، غور، عمل۔ ہر پڑاؤ پر اس کا رہنما سوال درج ہے اور واپسی کے تیر پر لکھا ہے کہ اس نے مجھے اگلی بار کے لیے کیا سکھایا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.flow-b{stroke:var(--a2);stroke-width:2.5;fill:none}.dash-a{stroke:var(--a1);stroke-width:2.5;fill:none;stroke-dasharray:7 5}.ah-a{fill:var(--a1)}.ah-b{fill:var(--a2)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-empathy-context" class="flow-b" x1="500" y1="90" x2="284" y2="90" marker-end="url(#arrow)"/><line id="edge-context-reflect" class="flow-b" x1="160" y1="140" x2="160" y2="236" marker-end="url(#arrow)"/><line id="edge-reflect-action" class="flow-b" x1="280" y1="290" x2="496" y2="290" marker-end="url(#arrow)"/><line id="edge-action-empathy" class="dash-a" x1="620" y1="240" x2="620" y2="144" marker-end="url(#back)"/></g><g id="layer-nodes"><g id="node-empathy"><rect class="panel-b" x="500" y="40" width="240" height="100" rx="8"/><text class="h" x="620" y="68" text-anchor="middle">‏1 ہمدردی‏</text><text class="small" x="620" y="100" text-anchor="middle">‏کون متاثر ہو رہا ہے، اور انہیں‏</text><text class="small" x="620" y="122" text-anchor="middle">‏یہ کیسا دکھائی دیتا ہے؟‏</text></g><g id="node-context"><rect class="panel-b" x="40" y="40" width="240" height="100" rx="8"/><text class="h" x="160" y="68" text-anchor="middle">‏2 سیاق‏</text><text class="small" x="160" y="100" text-anchor="middle">‏حقائق، قواعد اور پابندیاں‏</text><text class="small" x="160" y="122" text-anchor="middle">‏کیا ہیں؟‏</text></g><g id="node-reflect"><rect class="panel-b" x="40" y="240" width="240" height="100" rx="8"/><text class="h" x="160" y="268" text-anchor="middle">‏3 غور‏</text><text class="small" x="160" y="300" text-anchor="middle">‏آرام نہیں، ذمہ داریاں تولیے۔‏</text><text class="small" x="160" y="322" text-anchor="middle">‏مسابقت کرنے والی چیز کا نام لیجیے۔‏</text></g><g id="node-action"><rect class="panel-b" x="500" y="240" width="240" height="100" rx="8"/><text class="h" x="620" y="268" text-anchor="middle">‏4 عمل‏</text><text class="small" x="620" y="300" text-anchor="middle">‏فیصلہ کیجیے، کر گزریے،‏</text><text class="small" x="620" y="322" text-anchor="middle">‏اور چکر مکمل کیجیے۔‏</text></g></g><g id="layer-labels"><text class="small" x="604" y="186" text-anchor="end">‏اس نے مجھے اگلی بار کے‏</text><text class="small" x="604" y="206" text-anchor="end">‏لیے کیا سکھایا؟‏</text><text id="label-caption" class="small" x="390" y="392" text-anchor="middle">‏چکر، لکیر نہیں۔ جس فیصلے کا جائزہ نہ لیا جائے وہ آپ کو کچھ نہیں سکھا سکتا۔‏</text></g><text class="wm" x="12" y="430" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
