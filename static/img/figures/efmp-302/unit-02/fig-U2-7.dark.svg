<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four classroom dilemma types</title><desc id="d">Table of four classroom dilemma types - grading fairness, confidentiality, social media and equity - each showing the two goods that conflict, what makes it hard, and a defensible first move.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.hdr{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="60"/><line class="grid" x1="160" y1="20" x2="160" y2="440"/><line class="grid" x1="400" y1="20" x2="400" y2="440"/><line class="grid" x1="600" y1="20" x2="600" y2="440"/><line class="grid" x1="20" y1="170" x2="760" y2="170"/><line class="grid" x1="20" y1="260" x2="760" y2="260"/><line class="grid" x1="20" y1="350" x2="760" y2="350"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><line class="frame" x1="20" y1="80" x2="760" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="32" y="54.5">Dilemma</text><text class="sh" x="172" y="54.5">The two goods in conflict</text><text class="sh" x="412" y="54.5">What makes it hard</text><text class="sh" x="612" y="44.5">A defensible</text><text class="sh" x="612" y="64.5">first move</text></g><g id="node-grading"><text class="bt" x="32" y="119.5">Grading</text><text class="bt" x="32" y="139.5">fairness</text><text class="body" x="172" y="119.5">honesty in assessment</text><text class="body" x="172" y="139.5">against duty of care</text><text class="small" x="412" y="119.5">both are owed, and to</text><text class="small" x="412" y="139.5">different people</text><text class="body" x="612" y="119.5">separate the mark</text><text class="body" x="612" y="139.5">from the response</text></g><g id="node-confidentiality"><text class="bt" x="32" y="219.5">Confidentiality</text><text class="body" x="172" y="209.5">keeping a confidence</text><text class="body" x="172" y="229.5">against protecting a pupil</text><text class="small" x="412" y="209.5">the limit is discovered</text><text class="small" x="412" y="229.5">at the worst moment</text><text class="body" x="612" y="209.5">state the limit in</text><text class="body" x="612" y="229.5">advance, not after</text></g><g id="node-social-media"><text class="bt" x="32" y="309.5">Social media</text><text class="body" x="172" y="299.5">a teacher's privacy</text><text class="body" x="172" y="319.5">against public standing</text><text class="small" x="412" y="299.5">the medium changed,</text><text class="small" x="412" y="319.5">the power gap did not</text><text class="body" x="612" y="299.5">no private threads</text><text class="body" x="612" y="319.5">with pupils</text></g><g id="node-equity"><text class="bt" x="32" y="399.5">Equity</text><text class="body" x="172" y="389.5">identical treatment</text><text class="body" x="172" y="409.5">against fair outcomes</text><text class="small" x="412" y="389.5">sameness is easy to</text><text class="small" x="412" y="409.5">defend and often unfair</text><text class="body" x="612" y="389.5">adjust conditions,</text><text class="body" x="612" y="409.5">not the standard</text></g></g><g id="layer-labels"></g><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
