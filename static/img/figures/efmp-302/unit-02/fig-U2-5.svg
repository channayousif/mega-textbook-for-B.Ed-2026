<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Rest's four components, and the failure at each</title><desc id="d">Flowchart of Rest's four components - sensitivity, judgement, motivation and character - in sequence, with a failure branch dropping away from each stage to a single outcome box reading no ethical action.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .step{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .out{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .flow{stroke:var(--a1);stroke-width:2.5;fill:none} .fail{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><rect class="step" x="20" y="40" width="160" height="72" rx="6"/><text class="h" x="100" y="70" text-anchor="middle">1 Moral</text><text class="h" x="100" y="88" text-anchor="middle">sensitivity</text><text class="m" x="100" y="106" text-anchor="middle">noticing it is ethical</text><rect class="step" x="210" y="40" width="160" height="72" rx="6"/><text class="h" x="290" y="70" text-anchor="middle">2 Moral</text><text class="h" x="290" y="88" text-anchor="middle">judgement</text><text class="m" x="290" y="106" text-anchor="middle">working out what is right</text><rect class="step" x="400" y="40" width="160" height="72" rx="6"/><text class="h" x="480" y="70" text-anchor="middle">3 Moral</text><text class="h" x="480" y="88" text-anchor="middle">motivation</text><text class="m" x="480" y="106" text-anchor="middle">choosing it over the rest</text><rect class="step" x="590" y="40" width="160" height="72" rx="6"/><text class="h" x="670" y="70" text-anchor="middle">4 Moral</text><text class="h" x="670" y="88" text-anchor="middle">character</text><text class="m" x="670" y="106" text-anchor="middle">carrying it through</text><line class="flow" x1="180" y1="76" x2="205" y2="76" marker-end="url(#a)"/><line class="flow" x1="370" y1="76" x2="395" y2="76" marker-end="url(#a)"/><line class="flow" x1="560" y1="76" x2="585" y2="76" marker-end="url(#a)"/><path class="fail" d="M100 112 L100 190 L340 190 L340 296" marker-end="url(#b)"/><path class="fail" d="M290 112 L290 214 L370 214 L370 296" marker-end="url(#b)"/><path class="fail" d="M480 112 L480 214 L410 214 L410 296" marker-end="url(#b)"/><path class="fail" d="M670 112 L670 190 L440 190 L440 296" marker-end="url(#b)"/><text class="m" x="108" y="150">did not notice</text><text class="m" x="298" y="150">judged wrongly</text><text class="m" x="488" y="150">was outweighed</text><text class="m" x="678" y="142">did not</text><text class="m" x="678" y="158">follow through</text><rect class="out" x="240" y="300" width="300" height="66" rx="6"/><text class="h" x="390" y="332" text-anchor="middle">No ethical action</text><text class="m" x="390" y="354" text-anchor="middle">the same result, by four different routes</text><text class="m" x="390" y="400" text-anchor="middle">All four must succeed. The remedy differs at every stage.</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
