<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four-step ethical decision framework, drawn as a loop</title><desc id="d">Flowchart of the four-step ethical decision framework drawn as a loop - Empathy, Context, Reflect, Action - with each station carrying its guiding question and the return arrow labelled what did this teach me for next time.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .st{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .flow{stroke:var(--a2);stroke-width:2.5;fill:none} .back{stroke:var(--a1);stroke-width:2.5;stroke-dasharray:6 4;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="430"/><rect class="st" x="40" y="56" width="200" height="86" rx="8"/><text class="h" x="140" y="84" text-anchor="middle">1 Empathy</text><text class="m" x="140" y="106" text-anchor="middle">Who is affected, and what</text><text class="m" x="140" y="124" text-anchor="middle">does this look like to them?</text><rect class="st" x="540" y="56" width="200" height="86" rx="8"/><text class="h" x="640" y="84" text-anchor="middle">2 Context</text><text class="m" x="640" y="106" text-anchor="middle">What are the facts, rules</text><text class="m" x="640" y="124" text-anchor="middle">and constraints?</text><rect class="st" x="540" y="250" width="200" height="86" rx="8"/><text class="h" x="640" y="278" text-anchor="middle">3 Reflect</text><text class="m" x="640" y="300" text-anchor="middle">Weigh obligations, not</text><text class="m" x="640" y="318" text-anchor="middle">comfort. Name what competes.</text><rect class="st" x="40" y="250" width="200" height="86" rx="8"/><text class="h" x="140" y="278" text-anchor="middle">4 Action</text><text class="m" x="140" y="300" text-anchor="middle">Decide, do it,</text><text class="m" x="140" y="318" text-anchor="middle">and close the loop.</text><line class="flow" x1="240" y1="99" x2="535" y2="99" marker-end="url(#a)"/><line class="flow" x1="640" y1="142" x2="640" y2="245" marker-end="url(#a)"/><line class="flow" x1="540" y1="293" x2="245" y2="293" marker-end="url(#a)"/><path class="back" d="M140 250 L140 196 L140 147" marker-end="url(#c)"/><text class="m" x="158" y="188">what did this teach me</text><text class="m" x="158" y="206">for next time?</text><text class="m" x="390" y="380" text-anchor="middle">A loop, not a line. A decision never reviewed cannot teach you anything.</text><text class="wm" x="768" y="420" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
