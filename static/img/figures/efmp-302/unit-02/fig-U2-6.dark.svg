<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four-step ethical decision framework, drawn as a loop</title><desc id="d">Flowchart of the four-step ethical decision framework drawn as a loop - Empathy, Context, Reflect, Action - with each station carrying its guiding question and the return arrow labelled what did this teach me for next time.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.flow-b{stroke:var(--a2);stroke-width:2.5;fill:none}.dash-a{stroke:var(--a1);stroke-width:2.5;fill:none;stroke-dasharray:7 5}.ah-a{fill:var(--a1)}.ah-b{fill:var(--a2)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-b"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="440"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-empathy-context" class="flow-b" x1="280" y1="90" x2="496" y2="90" marker-end="url(#arrow)"/><line id="edge-context-reflect" class="flow-b" x1="620" y1="140" x2="620" y2="236" marker-end="url(#arrow)"/><line id="edge-reflect-action" class="flow-b" x1="500" y1="290" x2="284" y2="290" marker-end="url(#arrow)"/><line id="edge-action-empathy" class="dash-a" x1="160" y1="240" x2="160" y2="144" marker-end="url(#back)"/></g><g id="layer-nodes"><g id="node-empathy"><rect class="panel-b" x="40" y="40" width="240" height="100" rx="8"/><text class="h" x="160" y="70" text-anchor="middle">1 Empathy</text><text class="small" x="160" y="98" text-anchor="middle">Who is affected, and what</text><text class="small" x="160" y="118" text-anchor="middle">does this look like to them?</text></g><g id="node-context"><rect class="panel-b" x="500" y="40" width="240" height="100" rx="8"/><text class="h" x="620" y="70" text-anchor="middle">2 Context</text><text class="small" x="620" y="98" text-anchor="middle">What are the facts, rules</text><text class="small" x="620" y="118" text-anchor="middle">and constraints?</text></g><g id="node-reflect"><rect class="panel-b" x="500" y="240" width="240" height="100" rx="8"/><text class="h" x="620" y="270" text-anchor="middle">3 Reflect</text><text class="small" x="620" y="298" text-anchor="middle">Weigh obligations, not</text><text class="small" x="620" y="318" text-anchor="middle">comfort. Name what competes.</text></g><g id="node-action"><rect class="panel-b" x="40" y="240" width="240" height="100" rx="8"/><text class="h" x="160" y="270" text-anchor="middle">4 Action</text><text class="small" x="160" y="298" text-anchor="middle">Decide, do it,</text><text class="small" x="160" y="318" text-anchor="middle">and close the loop.</text></g></g><g id="layer-labels"><text class="small" x="176" y="186">what did this teach me</text><text class="small" x="176" y="206">for next time?</text><text id="label-caption" class="small" x="390" y="392" text-anchor="middle">A loop, not a line. A decision never reviewed cannot teach you anything.</text></g><text class="wm" x="768" y="430" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
