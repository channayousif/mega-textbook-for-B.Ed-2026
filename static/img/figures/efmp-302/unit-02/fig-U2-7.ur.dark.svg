<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعتی مخمصوں کی چار اقسام</title><desc id="d">جماعتی مخمصوں کی چار اقسام کا نقشہ: نمبر دہی میں انصاف، رازداری، سماجی رابطے کے ذرائع اور مساوات۔ ہر ایک کے ساتھ وہ دو بھلائیاں جو ٹکراتی ہیں، اسے مشکل کیا بناتا ہے، اور ایک قابلِ دفاع پہلا قدم۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="780" height="100%"/><rect class="cellhdr" x="16" y="16" width="748" height="54"/><rect class="grid" x="16" y="16" width="748" height="376"/><line class="grid" x1="610" y1="16" x2="610" y2="392"/><line class="grid" x1="376" y1="16" x2="376" y2="392"/><line class="grid" x1="190" y1="16" x2="190" y2="392"/><line class="grid" x1="16" y1="70" x2="764" y2="70"/><line class="grid" x1="16" y1="150" x2="764" y2="150"/><line class="grid" x1="16" y1="230" x2="764" y2="230"/><line class="grid" x1="16" y1="310" x2="764" y2="310"/><text class="h" x="752" y="48" text-anchor="end">مخمصہ</text><text class="h" x="598" y="38" text-anchor="end"><tspan x="598" dy="0">ٹکرانے والی دو</tspan><tspan x="598" dy="20">بھلائیاں</tspan></text><text class="h" x="364" y="38" text-anchor="end"><tspan x="364" dy="0">اسے مشکل کیا بناتا</tspan><tspan x="364" dy="20">ہے</tspan></text><text class="h" x="178" y="38" text-anchor="end"><tspan x="178" dy="0">ایک قابلِ دفاع پہلا</tspan><tspan x="178" dy="20">قدم</tspan></text><text class="h" x="752" y="115" text-anchor="end">نمبر دہی</text><text class="h" x="752" y="133" text-anchor="end">میں انصاف</text><text x="598" y="105" text-anchor="end">تشخیص میں دیانت</text><text x="598" y="115" text-anchor="end"><tspan x="598" dy="0">بمقابلہ نگہداشت کی</tspan><tspan x="598" dy="20">ذمہ داری</tspan></text><text class="m" x="364" y="115" text-anchor="end">دونوں واجب ہیں، اور</text><text class="m" x="364" y="125" text-anchor="end"><tspan x="364" dy="0">مختلف لوگوں کے حوالے</tspan><tspan x="364" dy="20">سے</tspan></text><text x="178" y="105" text-anchor="end">نمبر کو ردِعمل</text><text x="178" y="125" text-anchor="end">سے الگ کیجیے</text><text class="h" x="752" y="195" text-anchor="end">رازداری</text><text x="598" y="185" text-anchor="end">راز رکھنا</text><text x="598" y="195" text-anchor="end"><tspan x="598" dy="0">بمقابلہ شاگرد کی</tspan><tspan x="598" dy="20">حفاظت</tspan></text><text class="m" x="364" y="195" text-anchor="end">حد بدترین لمحے میں</text><text class="m" x="364" y="215" text-anchor="end">دریافت ہوتی ہے</text><text x="178" y="185" text-anchor="end">حد پہلے بتائیے،</text><text x="178" y="205" text-anchor="end">بعد میں نہیں</text><text class="h" x="752" y="275" text-anchor="end">سماجی رابطے</text><text x="598" y="265" text-anchor="end">استاد کی نجی زندگی</text><text x="598" y="285" text-anchor="end">بمقابلہ عوامی مقام</text><text class="m" x="364" y="265" text-anchor="end">ذریعہ بدلا،</text><text class="m" x="364" y="285" text-anchor="end">اختیار کا فرق نہیں</text><text x="178" y="265" text-anchor="end">شاگردوں کے ساتھ</text><text x="178" y="285" text-anchor="end">نجی پیغام نہیں</text><text class="h" x="752" y="355" text-anchor="end">مساوات</text><text x="598" y="345" text-anchor="end">یکساں سلوک</text><text x="598" y="355" text-anchor="end"><tspan x="598" dy="0">بمقابلہ منصفانہ</tspan><tspan x="598" dy="20">نتائج</tspan></text><text class="m" x="364" y="335" text-anchor="end"><tspan x="364" dy="0">یکسانیت کا دفاع آسان</tspan><tspan x="364" dy="20">ہے</tspan></text><text class="m" x="364" y="365" text-anchor="end">اور اکثر ناانصافی ہے</text><text x="178" y="345" text-anchor="end">حالات بدلیے،</text><text x="178" y="365" text-anchor="end">معیار نہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
