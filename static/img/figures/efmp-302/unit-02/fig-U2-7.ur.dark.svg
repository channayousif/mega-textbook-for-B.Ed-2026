<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">جماعتی مخمصوں کی چار اقسام</title><desc id="d">جماعتی مخمصوں کی چار اقسام کا نقشہ: نمبر دہی میں انصاف، رازداری، سماجی رابطے کے ذرائع اور مساوات۔ ہر ایک کے ساتھ وہ دو بھلائیاں جو ٹکراتی ہیں، اسے مشکل کیا بناتا ہے، اور ایک قابلِ دفاع پہلا قدم۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}.hdr{fill:var(--panel)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="60"/><line class="grid" x1="620" y1="20" x2="620" y2="440"/><line class="grid" x1="380" y1="20" x2="380" y2="440"/><line class="grid" x1="180" y1="20" x2="180" y2="440"/><line class="grid" x1="760" y1="170" x2="20" y2="170"/><line class="grid" x1="760" y1="260" x2="20" y2="260"/><line class="grid" x1="760" y1="350" x2="20" y2="350"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="420"/><line class="frame" x1="760" y1="80" x2="20" y2="80"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="748" y="54.5" text-anchor="end">‏مخمصہ‏</text><text class="sh" x="608" y="54.5" text-anchor="end">‏ٹکرانے والی دو بھلائیاں‏</text><text class="sh" x="368" y="54.5" text-anchor="end">‏اسے مشکل کیا بناتا ہے‏</text><text class="sh" x="168" y="49" text-anchor="end">‏ایک قابلِ دفاع‏</text><text class="sh" x="168" y="71" text-anchor="end">‏پہلا قدم‏</text></g><g id="node-grading"><text class="bt" x="748" y="119.5" text-anchor="end">‏نمبر دہی‏</text><text class="bt" x="748" y="139.5" text-anchor="end">‏میں انصاف‏</text><text class="body" x="608" y="119.5" text-anchor="end">‏تشخیص میں دیانت‏</text><text class="body" x="608" y="139.5" text-anchor="end">‏بمقابلہ نگہداشت کی ذمہ داری‏</text><text class="small" x="368" y="119.5" text-anchor="end">‏دونوں واجب ہیں، اور‏</text><text class="small" x="368" y="139.5" text-anchor="end">‏مختلف لوگوں کے حوالے سے‏</text><text class="body" x="168" y="119.5" text-anchor="end">‏نمبر کو ردِعمل‏</text><text class="body" x="168" y="139.5" text-anchor="end">‏سے الگ کیجیے‏</text></g><g id="node-confidentiality"><text class="bt" x="748" y="219.5" text-anchor="end">‏رازداری‏</text><text class="body" x="608" y="209.5" text-anchor="end">‏راز رکھنا‏</text><text class="body" x="608" y="229.5" text-anchor="end">‏بمقابلہ شاگرد کی حفاظت‏</text><text class="small" x="368" y="209.5" text-anchor="end">‏حد بدترین لمحے میں‏</text><text class="small" x="368" y="229.5" text-anchor="end">‏دریافت ہوتی ہے‏</text><text class="body" x="168" y="209.5" text-anchor="end">‏حد پہلے بتائیے،‏</text><text class="body" x="168" y="229.5" text-anchor="end">‏بعد میں نہیں‏</text></g><g id="node-social-media"><text class="bt" x="748" y="309.5" text-anchor="end">‏سماجی رابطے‏</text><text class="body" x="608" y="299.5" text-anchor="end">‏استاد کی نجی زندگی‏</text><text class="body" x="608" y="319.5" text-anchor="end">‏بمقابلہ عوامی مقام‏</text><text class="small" x="368" y="299.5" text-anchor="end">‏ذریعہ بدلا،‏</text><text class="small" x="368" y="319.5" text-anchor="end">‏اختیار کا فرق نہیں‏</text><text class="body" x="168" y="299.5" text-anchor="end">‏شاگردوں کے ساتھ‏</text><text class="body" x="168" y="319.5" text-anchor="end">‏نجی پیغام نہیں‏</text></g><g id="node-equity"><text class="bt" x="748" y="399.5" text-anchor="end">‏مساوات‏</text><text class="body" x="608" y="389.5" text-anchor="end">‏یکساں سلوک‏</text><text class="body" x="608" y="409.5" text-anchor="end">‏بمقابلہ منصفانہ نتائج‏</text><text class="small" x="368" y="389.5" text-anchor="end">‏یکسانیت کا دفاع آسان ہے‏</text><text class="small" x="368" y="409.5" text-anchor="end">‏اور اکثر ناانصافی ہے‏</text><text class="body" x="168" y="389.5" text-anchor="end">‏حالات بدلیے،‏</text><text class="body" x="168" y="409.5" text-anchor="end">‏معیار نہیں‏</text></g></g><g id="layer-labels"></g><text class="wm" x="12" y="470" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
