<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ضابطے کی سطحیں، اور ان کے درمیان کے خلا</title><desc id="d">چار ایک دوسرے کے اندر بنے دائرے جو ذاتی اقدار کو اسکول کی پالیسی کے اندر، اسے قومی ضابطے کے اندر، اور اسے بین الاقوامی فریم ورک کے اندر دکھاتے ہیں، اور حلقوں کے درمیان کے خلا پر نشان ہے کہ یہاں استاد کے اپنے فیصلے کی ضرورت ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}.lead{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3}.ring4{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.ring3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.ring2{fill:var(--panel);stroke:var(--ink);stroke-width:2}.ring1{fill:var(--bg);stroke:var(--ink);stroke-width:2}.dot{fill:var(--muted)}.h{font-size:16px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}text{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><circle id="region-international" class="ring4" cx="540" cy="240" r="210"/><circle id="region-gap-1" class="bg" cx="540" cy="240" r="160"/><circle id="region-national" class="ring3" cx="540" cy="240" r="150"/><circle id="region-gap-2" class="bg" cx="540" cy="240" r="110"/><circle id="region-school" class="ring2" cx="540" cy="240" r="100"/><circle id="region-gap-3" class="bg" cx="540" cy="240" r="56"/><circle id="region-personal" class="ring1" cx="540" cy="240" r="46"/></g><g id="layer-edges"><line id="edge-gap1-judgement" class="lead" x1="405.8" y1="162.5" x2="292" y2="148"/><circle class="dot" cx="405.8" cy="162.5" r="4"/><line id="edge-gap2-judgement" class="lead" x1="449.1" y1="187.5" x2="292" y2="148"/><circle class="dot" cx="449.1" cy="187.5" r="4"/><line id="edge-gap3-judgement" class="lead" x1="495.8" y1="214.5" x2="292" y2="148"/><circle class="dot" cx="495.8" cy="214.5" r="4"/></g><g id="layer-nodes"><g id="node-international"><text class="sh" x="540" y="68" text-anchor="middle">‏بین الاقوامی فریم ورک‏</text></g><g id="node-national"><text class="sh" x="540" y="117" text-anchor="middle">‏قومی ضابطہ‏</text></g><g id="node-school"><text class="sh" x="540" y="167" text-anchor="middle">‏اسکول کی پالیسی‏</text></g><g id="node-personal"><text class="sh" x="540" y="236" text-anchor="middle">‏ذاتی‏</text><text class="sh" x="540" y="255" text-anchor="middle">‏اقدار‏</text></g><g id="node-judgement"><text class="h" x="280" y="142" text-anchor="end">‏جہاں فیصلے کی‏</text><text class="h" x="280" y="162" text-anchor="end">‏ضرورت ہے‏</text><text class="body" x="280" y="210" text-anchor="end">‏حلقے آپس میں نہیں ملتے۔‏</text><text class="body" x="280" y="230" text-anchor="end">‏ہر خلا ایک ایسا معاملہ ہے جسے‏</text><text class="body" x="280" y="250" text-anchor="end">‏اوپر کی کوئی دستاویز طے نہیں کرتی۔‏</text><text class="small" x="280" y="300" text-anchor="end">‏ضابطہ طے شدہ فیصلوں کا‏</text><text class="small" x="280" y="320" text-anchor="end">‏خلاصہ ہے، ممنوع اعمال کی‏</text><text class="small" x="280" y="340" text-anchor="end">‏فہرست نہیں۔‏</text></g></g><g id="layer-labels"><text id="label-caption" class="small" x="390" y="474" text-anchor="middle">‏انہیں ایک ساتھ پڑھیے: ٹکراؤ خود ایک اطلاع ہے۔‏</text></g><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>