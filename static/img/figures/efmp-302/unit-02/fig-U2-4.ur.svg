<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ضابطے کی سطحیں، اور ان کے درمیان کے خلا</title><desc id="d">چار ایک دوسرے کے اندر بنے دائرے جو ذاتی اقدار کو اسکول کی پالیسی کے اندر، اسے قومی ضابطے کے اندر، اور اسے بین الاقوامی فریم ورک کے اندر دکھاتے ہیں، اور حلقوں کے درمیان کے خلا پر نشان ہے کہ یہاں استاد کے اپنے فیصلے کی ضرورت ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .r4{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .r3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .r2{fill:var(--panel);stroke:var(--ink);stroke-width:2} .r1{fill:var(--bg);stroke:var(--ink);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .lead{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3;fill:none} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><circle class="r4" cx="530" cy="235" r="200"/><circle class="r3" cx="530" cy="235" r="152"/><circle class="r2" cx="530" cy="235" r="102"/><circle class="r1" cx="530" cy="235" r="54"/><text class="h" x="530" y="62" text-anchor="middle">بین الاقوامی فریم ورک</text><text class="h" x="530" y="112" text-anchor="middle">قومی ضابطہ</text><text class="h" x="530" y="160" text-anchor="middle">اسکول کی پالیسی</text><text class="h" x="530" y="232" text-anchor="middle">ذاتی</text><text class="h" x="530" y="250" text-anchor="middle">اقدار</text><line class="lead" x1="380" y1="196" x2="268" y2="150"/><line class="lead" x1="430" y1="212" x2="268" y2="210"/><line class="lead" x1="480" y1="262" x2="268" y2="270"/><text class="h" x="256" y="140" text-anchor="end">جہاں فیصلے کی</text><text class="h" x="256" y="158" text-anchor="end">ضرورت ہے</text><text x="256" y="200" text-anchor="end">حلقے آپس میں نہیں ملتے۔</text><text x="256" y="220" text-anchor="end">ہر خلا ایک ایسا معاملہ ہے جسے</text><text x="256" y="240" text-anchor="end">اوپر کی کوئی دستاویز طے نہیں کرتی۔</text><text class="m" x="256" y="278" text-anchor="end">ضابطہ طے شدہ فیصلوں کا</text><text class="m" x="256" y="296" text-anchor="end">خلاصہ ہے، ممنوع اعمال کی</text><text class="m" x="256" y="314" text-anchor="end">فہرست نہیں۔</text><text class="m" x="530" y="452" text-anchor="middle">انہیں ایک ساتھ پڑھیے: ٹکراؤ خود ایک اطلاع ہے۔</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
