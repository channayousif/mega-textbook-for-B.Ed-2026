<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The levels of a code, and the gaps between them</title><desc id="d">Four nested circles showing personal values inside school policy inside the national code inside the international framework, with the gaps between rings labelled as where a teacher's own judgement is required.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .r4{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .r3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .r2{fill:var(--panel);stroke:var(--ink);stroke-width:2} .r1{fill:var(--bg);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .lead{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3;fill:none} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="780" height="100%"/><circle class="r4" cx="250" cy="235" r="200"/><circle class="r3" cx="250" cy="235" r="152"/><circle class="r2" cx="250" cy="235" r="102"/><circle class="r1" cx="250" cy="235" r="54"/><text class="h" x="250" y="52" text-anchor="middle"><tspan x="250" dy="0">International</tspan><tspan x="250" dy="20">framework</tspan></text><text class="h" x="250" y="112" text-anchor="middle">National code</text><text class="h" x="250" y="160" text-anchor="middle">School policy</text><text class="h" x="250" y="232" text-anchor="middle">Personal</text><text class="h" x="250" y="250" text-anchor="middle">values</text><line class="lead" x1="400" y1="196" x2="512" y2="150"/><line class="lead" x1="350" y1="212" x2="512" y2="210"/><line class="lead" x1="300" y1="262" x2="512" y2="270"/><text class="h" x="524" y="140">Where judgement</text><text class="h" x="524" y="158">is required</text><text x="524" y="190"><tspan x="524" dy="0">The rings do not</tspan><tspan x="524" dy="20">meet.</tspan></text><text x="524" y="210"><tspan x="524" dy="0">Each gap is a case</tspan><tspan x="524" dy="20">no</tspan></text><text x="524" y="230"><tspan x="524" dy="0">document above it</tspan><tspan x="524" dy="20">settles.</tspan></text><text class="m" x="524" y="268"><tspan x="524" dy="0">A code is a summary</tspan><tspan x="524" dy="20">of</tspan></text><text class="m" x="524" y="286"><tspan x="524" dy="0">settled judgement,</tspan><tspan x="524" dy="20">not a</tspan></text><text class="m" x="524" y="304"><tspan x="524" dy="0">list of forbidden</tspan><tspan x="524" dy="20">acts.</tspan></text><text class="m" x="250" y="442" text-anchor="middle"><tspan x="250" dy="0">Read them together: the conflict</tspan><tspan x="250" dy="20">itself is information.</tspan></text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
