<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One appraisal instrument, split by purpose</title><desc id="d">Diagram splitting an appraisal instrument into formative and summative halves, each with its purpose, requirements and effect on the teacher, with a bar marking that the two sets of requirements pull against each other and must be reconciled deliberately.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .frm{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .sum{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .cell{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .bar{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .sp{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:8 5} text{font-size:11.5px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="880" height="100%"/><rect class="frm" x="30" y="28" width="390" height="46" rx="5"/><text class="h" x="225" y="58" text-anchor="middle">Formative</text><rect class="sum" x="460" y="28" width="390" height="46" rx="5"/><text class="h" x="655" y="58" text-anchor="middle">Summative</text><line class="sp" x1="440" y1="28" x2="440" y2="330"/><rect class="cell" x="30" y="82" width="390" height="70" rx="5"/><text class="rh" x="42" y="104">Purpose</text><text x="42" y="114"><tspan x="42" dy="0">Find the gap; choose what to</tspan><tspan x="42" dy="20">develop next.</tspan></text><text class="m" x="42" y="132"><tspan x="42" dy="0">The question is: what do I work</tspan><tspan x="42" dy="20">on?</tspan></text><rect class="cell" x="460" y="82" width="390" height="70" rx="5"/><text class="rh" x="472" y="104">Purpose</text><text x="472" y="114"><tspan x="472" dy="0">Reach a decision: confirm,</tspan><tspan x="472" dy="20">promote, pay.</tspan></text><text class="m" x="472" y="132"><tspan x="472" dy="0">The question is: has a threshold</tspan><tspan x="472" dy="20">been met?</tspan></text><rect class="cell" x="30" y="158" width="390" height="70" rx="5"/><text class="rh" x="42" y="180">Requires</text><text x="42" y="190"><tspan x="42" dy="0">Safety to admit weakness; no</tspan><tspan x="42" dy="20">consequence</tspan></text><text x="42" y="208"><tspan x="42" dy="0">attached; someone</tspan><tspan x="42" dy="20">trusted.</tspan></text><rect class="cell" x="460" y="158" width="390" height="70" rx="5"/><text class="rh" x="472" y="180">Requires</text><text x="472" y="190"><tspan x="472" dy="0">Comparability across teachers;</tspan><tspan x="472" dy="20">evidence;</tspan></text><text x="472" y="208"><tspan x="472" dy="0">appeal rights; authority and</tspan><tspan x="472" dy="20">distance.</tspan></text><rect class="cell" x="30" y="234" width="390" height="70" rx="5"/><text class="rh" x="42" y="246"><tspan x="42" dy="0">Produces in the</tspan><tspan x="42" dy="20">teacher</tspan></text><text x="42" y="266"><tspan x="42" dy="0">Honest disclosure, including of</tspan><tspan x="42" dy="20">the</tspan></text><text x="42" y="294">weakest area.</text><rect class="cell" x="460" y="234" width="390" height="70" rx="5"/><text class="rh" x="472" y="246"><tspan x="472" dy="0">Produces in the</tspan><tspan x="472" dy="20">teacher</tspan></text><text x="472" y="266"><tspan x="472" dy="0">Careful self-presentation,</tspan><tspan x="472" dy="20">starting from</tspan></text><text x="472" y="294">the strongest area.</text><rect class="bar" x="30" y="322" width="820" height="88" rx="6"/><text class="rh" x="42" y="334"><tspan x="42" dy="0">The two sets of requirements pull</tspan><tspan x="42" dy="20">against each other</tspan></text><text class="m" x="42" y="324"><tspan x="42" dy="0">Isore (2009) calls the purposes</tspan><tspan x="42" dy="20">"often conflicting - but not</tspan><tspan x="42" dy="20">necessarily incompatible":</tspan><tspan x="42" dy="20">countries rarely use a pure form,</tspan><tspan x="42" dy="20">one framework</tspan></text><text class="m" x="42" y="352"><tspan x="42" dy="0">"can serve both", and an annex is</tspan><tspan x="42" dy="20">devoted to conciliating them. A</tspan><tspan x="42" dy="20">system serving both must decide in</tspan><tspan x="42" dy="20">advance which purpose each</tspan></text><text class="m" x="42" y="380"><tspan x="42" dy="0">conversation serves, who sees</tspan><tspan x="42" dy="20">what, and what carries</tspan><tspan x="42" dy="20">consequence.</tspan></text><text class="m" x="30" y="410"><tspan x="30" dy="0">Left unstated, the summative</tspan><tspan x="30" dy="20">purpose wins by default, because</tspan><tspan x="30" dy="20">it is the one with a decision</tspan><tspan x="30" dy="20">attached.</tspan></text><text class="wm" x="868" y="506" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
