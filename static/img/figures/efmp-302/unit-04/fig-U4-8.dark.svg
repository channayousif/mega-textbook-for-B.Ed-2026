<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One appraisal instrument, split by purpose</title><desc id="d">Diagram splitting an appraisal instrument into formative and summative halves, each with its purpose, requirements and effect on the teacher, with a bar marking that the two sets of requirements pull against each other and must be reconciled deliberately.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .frm{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .sum{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .cell{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .bar{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .sp{stroke:var(--ink);stroke-width:2.5;stroke-dasharray:8 5} text{font-size:11.5px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="880" height="470"/><rect class="frm" x="30" y="28" width="390" height="46" rx="5"/><text class="h" x="225" y="58" text-anchor="middle">Formative</text><rect class="sum" x="460" y="28" width="390" height="46" rx="5"/><text class="h" x="655" y="58" text-anchor="middle">Summative</text><line class="sp" x1="440" y1="28" x2="440" y2="330"/><rect class="cell" x="30" y="82" width="390" height="70" rx="5"/><text class="rh" x="42" y="104">Purpose</text><text x="42" y="124">Find the gap; choose what to develop next.</text><text class="m" x="42" y="142">The question is: what do I work on?</text><rect class="cell" x="460" y="82" width="390" height="70" rx="5"/><text class="rh" x="472" y="104">Purpose</text><text x="472" y="124">Reach a decision: confirm, promote, pay.</text><text class="m" x="472" y="142">The question is: has a threshold been met?</text><rect class="cell" x="30" y="158" width="390" height="70" rx="5"/><text class="rh" x="42" y="180">Requires</text><text x="42" y="200">Safety to admit weakness; no consequence</text><text x="42" y="218">attached; someone trusted.</text><rect class="cell" x="460" y="158" width="390" height="70" rx="5"/><text class="rh" x="472" y="180">Requires</text><text x="472" y="200">Comparability across teachers; evidence;</text><text x="472" y="218">appeal rights; authority and distance.</text><rect class="cell" x="30" y="234" width="390" height="70" rx="5"/><text class="rh" x="42" y="256">Produces in the teacher</text><text x="42" y="276">Honest disclosure, including of the</text><text x="42" y="294">weakest area.</text><rect class="cell" x="460" y="234" width="390" height="70" rx="5"/><text class="rh" x="472" y="256">Produces in the teacher</text><text x="472" y="276">Careful self-presentation, starting from</text><text x="472" y="294">the strongest area.</text><rect class="bar" x="30" y="322" width="820" height="88" rx="6"/><text class="rh" x="42" y="344">The two sets of requirements pull against each other</text><text class="m" x="42" y="364">Isore (2009) calls the purposes "often conflicting - but not necessarily incompatible": countries rarely use a pure form, one framework</text><text class="m" x="42" y="382">"can serve both", and an annex is devoted to conciliating them. A system serving both must decide in advance which purpose each</text><text class="m" x="42" y="400">conversation serves, who sees what, and what carries consequence.</text><text class="m" x="30" y="440">Left unstated, the summative purpose wins by default, because it is the one with a decision attached.</text><text class="wm" x="868" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
