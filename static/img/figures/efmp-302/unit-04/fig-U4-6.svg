<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Kinds of evidence against one indicator</title><desc id="d">Table of evidence types against an indicator - pupil work, observation, planning documents, pupil voice and the teacher's own record - showing what each reveals, what it cannot show, and how easily each can be faked.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="rl" x="20" y="28" width="190" height="46"/><rect class="hd" x="210" y="28" width="230" height="46"/><rect class="hd" x="440" y="28" width="230" height="46"/><rect class="hx" x="670" y="28" width="210" height="46"/><text class="h" x="325" y="49" text-anchor="middle">What it shows well</text><text class="h" x="555" y="49" text-anchor="middle">What it cannot show</text><text class="h" x="775" y="42" text-anchor="middle">How easily produced</text><text class="h" x="775" y="50" text-anchor="middle"><tspan x="775" dy="0">without the</tspan><tspan x="775" dy="20">competence</tspan></text><g><rect class="rl" x="20" y="74" width="190" height="58"/><rect class="cl" x="210" y="74" width="230" height="58"/><rect class="cl" x="440" y="74" width="230" height="58"/><rect class="cx" x="670" y="74" width="210" height="58"/><text class="rh" x="30" y="108">Pupil work</text><text x="220" y="90"><tspan x="220" dy="0">Whether anyone</tspan><tspan x="220" dy="20">learned</tspan></text><text x="220" y="118">the thing</text><text x="450" y="100">Whether the teacher</text><text x="450" y="118">caused it</text><text x="680" y="108">Hard</text></g><g><rect class="rl" x="20" y="132" width="190" height="58"/><rect class="cl" x="210" y="132" width="230" height="58"/><rect class="cl" x="440" y="132" width="230" height="58"/><rect class="cx" x="670" y="132" width="210" height="58"/><text class="rh" x="30" y="156"><tspan x="30" dy="0">Colleague</tspan><tspan x="30" dy="20">observation</tspan></text><text x="220" y="158">What the teacher</text><text x="220" y="176">actually does</text><text x="450" y="158">The ordinary lesson,</text><text x="450" y="176">unobserved</text><text x="680" y="156"><tspan x="680" dy="0">Moderate: one lesson</tspan><tspan x="680" dy="20">can be staged</tspan></text></g><g><rect class="rl" x="20" y="190" width="190" height="58"/><rect class="cl" x="210" y="190" width="230" height="58"/><rect class="cl" x="440" y="190" width="230" height="58"/><rect class="cx" x="670" y="190" width="210" height="58"/><text class="rh" x="30" y="224">Planning documents</text><text x="220" y="216">Intention and</text><text x="220" y="234">foresight</text><text x="450" y="216">Anything that</text><text x="450" y="234">happened</text><text x="680" y="224">Easy</text></g><g><rect class="rl" x="20" y="248" width="190" height="58"/><rect class="cl" x="210" y="248" width="230" height="58"/><rect class="cl" x="440" y="248" width="230" height="58"/><rect class="cx" x="670" y="248" width="210" height="58"/><text class="rh" x="30" y="282">Pupil voice</text><text x="220" y="264"><tspan x="220" dy="0">How it is</tspan><tspan x="220" dy="20">experienced</tspan></text><text x="220" y="292">from the desk</text><text x="450" y="264"><tspan x="450" dy="0">Whether the</tspan><tspan x="450" dy="20">experience</tspan></text><text x="450" y="292">produced learning</text><text x="680" y="272"><tspan x="680" dy="0">Moderate: popularity</tspan><tspan x="680" dy="20">confounds it</tspan></text></g><g><rect class="rl" x="20" y="306" width="190" height="58"/><rect class="cl" x="210" y="306" width="230" height="58"/><rect class="cl" x="440" y="306" width="230" height="58"/><rect class="cx" x="670" y="306" width="210" height="58"/><text class="rh" x="30" y="330"><tspan x="30" dy="0">The teacher's own</tspan><tspan x="30" dy="20">record</tspan></text><text x="220" y="332">Reasoning behind the</text><text x="220" y="350">choices made</text><text x="450" y="322"><tspan x="450" dy="0">Whether the</tspan><tspan x="450" dy="20">reasoning</tspan></text><text x="450" y="350">is accurate</text><text x="680" y="340">Very easy</text></g><text class="m" x="20" y="352"><tspan x="20" dy="0">The dashed column is why no single</tspan><tspan x="20" dy="20">source settles an indicator. Goe,</tspan><tspan x="20" dy="20">Bell and Little (2008): multiple</tspan><tspan x="20" dy="20">measures, each for a different</tspan><tspan x="20" dy="20">aspect.</tspan></text><text class="m" x="20" y="380"><tspan x="20" dy="0">The easiest evidence to produce is</tspan><tspan x="20" dy="20">the least worth having, which is</tspan><tspan x="20" dy="20">exactly why appraisal systems</tspan><tspan x="20" dy="20">accumulate it.</tspan></text><text class="wm" x="888" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
