<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تدریسی کیریئر پر معیارات کہاں لاگو ہوتے ہیں</title><desc id="d">تدریسی کیریئر کا وقت خط جس پر معیارات کے لاگو ہونے کے مقامات نشان زد ہیں - داخلہ، سند بندی، لائسنس، آزمائش، وقفے وقفے سے جائزہ، ترقی اور دوبارہ لائسنس - ہر ایک پر یہ لکھا ہے کہ کون لاگو کرتا ہے اور کیا داؤ پر ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .st{fill:var(--a1);stroke:none} .c{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .cg{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .cr{fill:var(--panel);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="920" height="430"/><line class="ax" x1="30" y1="215" x2="890" y2="215"/><rect class="c" x="762" y="96" width="136" height="80" rx="5"/><text class="h" x="830" y="118" text-anchor="middle">داخلہ</text><text class="m" x="830" y="136" text-anchor="middle">استاد کی تربیت میں</text><text class="m" x="830" y="154" text-anchor="middle">لاگو کرنے والا: ادارہ</text><text class="m" x="830" y="170" text-anchor="middle">داؤ پر: داخلہ</text><rect class="c" x="637" y="254" width="136" height="80" rx="5"/><text class="h" x="705" y="276" text-anchor="middle">سند بندی</text><text class="m" x="705" y="294" text-anchor="middle">مکمل ہونے پر</text><text class="m" x="705" y="312" text-anchor="middle">لاگو کرنے والا: سند دینے والا ادارہ</text><text class="m" x="705" y="328" text-anchor="middle">داؤ پر: سند</text><rect class="cr" x="512" y="96" width="136" height="80" rx="5"/><text class="h" x="580" y="118" text-anchor="middle">لائسنس</text><text class="m" x="580" y="136" text-anchor="middle">جہاں لازم ہو</text><text class="m" x="580" y="154" text-anchor="middle">لاگو کرنے والا: ریاست</text><text class="m" x="580" y="170" text-anchor="middle">داؤ پر: پڑھانے کا حق</text><rect class="c" x="387" y="254" width="136" height="80" rx="5"/><text class="h" x="455" y="276" text-anchor="middle">آزمائش</text><text class="m" x="455" y="294" text-anchor="middle">اور تصدیق</text><text class="m" x="455" y="312" text-anchor="middle">لاگو کرنے والا: ملازم رکھنے والا</text><text class="m" x="455" y="328" text-anchor="middle">داؤ پر: عہدہ</text><rect class="cg" x="262" y="96" width="136" height="80" rx="5"/><text class="h" x="330" y="118" text-anchor="middle">وقفے وقفے سے جائزہ</text><text class="m" x="330" y="136" text-anchor="middle">دہرایا جانے والا</text><text class="m" x="330" y="154" text-anchor="middle">لاگو کرنے والا: صدرِ اسکول</text><text class="m" x="330" y="170" text-anchor="middle">داؤ پر: مقام، اور تنخواہ</text><rect class="c" x="137" y="254" width="136" height="80" rx="5"/><text class="h" x="205" y="276" text-anchor="middle">ترقی</text><text class="m" x="205" y="294" text-anchor="middle">یا منتقلی</text><text class="m" x="205" y="312" text-anchor="middle">لاگو کرنے والا: نظام</text><text class="m" x="205" y="328" text-anchor="middle">داؤ پر: اگلا کردار</text><rect class="cr" x="12" y="96" width="136" height="80" rx="5"/><text class="h" x="80" y="118" text-anchor="middle">دوبارہ لائسنس</text><text class="m" x="80" y="136" text-anchor="middle">جہاں موجود ہو</text><text class="m" x="80" y="154" text-anchor="middle">لاگو کرنے والا: ریاست</text><text class="m" x="80" y="170" text-anchor="middle">داؤ پر: پڑھاتے رہنا</text><line class="ax" x1="830" y1="176" x2="830" y2="209" stroke-width="1.5"/><line class="ax" x1="705" y1="221" x2="705" y2="250" stroke-width="1.5"/><line class="ax" x1="580" y1="176" x2="580" y2="209" stroke-width="1.5"/><line class="ax" x1="455" y1="221" x2="455" y2="250" stroke-width="1.5"/><line class="ax" x1="330" y1="176" x2="330" y2="209" stroke-width="1.5"/><line class="ax" x1="205" y1="221" x2="205" y2="250" stroke-width="1.5"/><line class="ax" x1="80" y1="176" x2="80" y2="209" stroke-width="1.5"/><text class="m" x="890" y="46" text-anchor="end">خط والے خانے صرف وہاں لاگو ہوتے ہیں جہاں کوئی قانونی دائرہ اختیار انہیں مانگتا ہے؛ باقی تقریباً ہر جگہ لاگو ہوتے ہیں۔</text><text class="m" x="890" y="64" text-anchor="end">ایک دستاویز سات بار چھ الگ فریقوں کے ہاتھوں استعمال ہوتی ہے، ہر ایک اس سے کچھ الگ چاہتا ہے۔</text><text class="m" x="890" y="392" text-anchor="end">اسی لیے وہی معیار داخلے پر رہنمائی اور جائزے پر دھمکی لگتا ہے۔ الفاظ کے بارے میں کچھ نہیں بدلا؛ داؤ بدلا۔</text><text class="wm" x="908" y="414" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
