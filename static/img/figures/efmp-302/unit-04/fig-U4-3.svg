<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How one standard is built</title><desc id="d">Nesting diagram of a professional standard containing knowledge, dispositions and performance bands, with indicators beneath the parts, shown here for the performance band, each pointing to an example of classroom evidence.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .out{fill:none;stroke:var(--ink);stroke-width:3} .b1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .b3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .ind{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .ev{fill:var(--a3-fill);stroke:var(--a3);stroke-width:1.5} .ar{stroke:var(--a3);stroke-width:1.8;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .s{font-size:10.5px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="470"/><rect class="out" x="30" y="30" width="820" height="230" rx="6"/><text class="h" x="46" y="54">Standard</text><rect class="b1" x="50" y="66" width="780" height="54" rx="5"/><text class="h" x="64" y="88">Knowledge and understanding</text><text class="m" x="64" y="108">what the teacher knows: subject content, how pupils learn it, where it is usually misunderstood</text><rect class="b2" x="50" y="126" width="780" height="54" rx="5"/><text class="h" x="64" y="148">Dispositions</text><text class="m" x="64" y="168">attitudes and values the teacher holds: that every pupil can learn, that errors are information</text><rect class="b3" x="50" y="186" width="780" height="60" rx="5"/><text class="h" x="64" y="208">Performance and skills</text><text class="m" x="64" y="228">what the teacher can do: the part that can be seen, and therefore the part that is assessed</text><rect class="ind" x="50" y="290" width="240" height="40" rx="5"/><text class="s" x="62" y="315">Indicator: plans for misconceptions</text><rect class="ind" x="320" y="290" width="240" height="40" rx="5"/><text class="s" x="332" y="315">Indicator: checks understanding mid-lesson</text><rect class="ind" x="590" y="290" width="240" height="40" rx="5"/><text class="s" x="602" y="315">Indicator: adapts when a check fails</text><path class="ar" d="M170 330 L170 360" marker-end="url(#a)"/><path class="ar" d="M440 330 L440 360" marker-end="url(#a)"/><path class="ar" d="M710 330 L710 360" marker-end="url(#a)"/><rect class="ev" x="50" y="364" width="240" height="46" rx="5"/><text class="s" x="62" y="384">Evidence: a plan naming the</text><text class="s" x="62" y="400">wrong answer pupils give</text><rect class="ev" x="320" y="364" width="240" height="46" rx="5"/><text class="s" x="332" y="384">Evidence: observed question that</text><text class="s" x="332" y="400">was not answered by one pupil</text><rect class="ev" x="590" y="364" width="240" height="46" rx="5"/><text class="s" x="602" y="384">Evidence: the second explanation,</text><text class="s" x="602" y="400">different from the first</text><line class="ar" x1="440" y1="246" x2="440" y2="286" marker-end="url(#a)"/><text class="m" x="30" y="444">Indicators sit beneath the parts, and only indicators produce evidence. Most come from the performance band, because knowledge and</text><text class="m" x="30" y="462">dispositions are inferred from what performance shows, which is why a standard can be met in appearance while understanding is absent.</text><text class="wm" x="868" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
