<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دس قومی پیشہ ورانہ معیارات، خلاصے کے طور پر</title><desc id="d">پاکستان کے دس قومی پیشہ ورانہ معیارات کا جدول، ہر ایک کے مرکز اور جماعتی شہادت کی مثال کے ساتھ، ایسے خلاصے کے طور پر جو قاری کو بنیادی دستاویز کی طرف بھیجتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .n{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="940" height="560"/><rect class="hd" x="620" y="28" width="300" height="38"/><rect class="hd" x="340" y="28" width="280" height="38"/><rect class="hd" x="60" y="28" width="280" height="38"/><text class="h" x="770" y="52" text-anchor="middle">معیار</text><text class="h" x="480" y="52" text-anchor="middle">مرکز</text><text class="h" x="200" y="52" text-anchor="middle">جماعتی شہادت کی مثال</text><g><rect class="rl" x="620" y="66" width="300" height="40"/><rect class="cl" x="340" y="66" width="280" height="40"/><rect class="cl" x="60" y="66" width="280" height="40"/><text class="n" x="910" y="91" text-anchor="end">1 مضمونی علم</text><text x="610" y="91" text-anchor="end">جو پڑھایا جاتا ہے اسے جاننا</text><text x="330" y="91" text-anchor="end">غیر متوقع سوال کا درست جواب</text></g><g><rect class="rl" x="620" y="106" width="300" height="40"/><rect class="cl" x="340" y="106" width="280" height="40"/><rect class="cl" x="60" y="106" width="280" height="40"/><text class="n" x="910" y="131" text-anchor="end">2 انسانی نشوونما اور ارتقا</text><text x="610" y="131" text-anchor="end">شاگرد کیسے بدلتے ہیں</text><text x="330" y="131" text-anchor="end">عمر کے مطابق کام، نصاب کے نہیں</text></g><g><rect class="rl" x="620" y="146" width="300" height="40"/><rect class="cl" x="340" y="146" width="280" height="40"/><rect class="cl" x="60" y="146" width="280" height="40"/><text class="n" x="910" y="165" text-anchor="end">3 اسلامی اخلاقی اقدار اور</text><text class="n" x="910" y="180" text-anchor="end">سماجی زندگی کی مہارتیں</text><text x="610" y="171" text-anchor="end">عمل میں اقدار</text><text x="330" y="171" text-anchor="end">شاگردوں کے جھگڑے کا تصفیہ کیسے ہوتا ہے</text></g><g><rect class="rl" x="620" y="186" width="300" height="40"/><rect class="cl" x="340" y="186" width="280" height="40"/><rect class="cl" x="60" y="186" width="280" height="40"/><text class="n" x="910" y="211" text-anchor="end">4 تدریسی منصوبہ بندی اور حکمتِ تدریس</text><text x="610" y="211" text-anchor="end">سبق کی ڈیزائننگ</text><text x="330" y="211" text-anchor="end">غالب غلط فہمی کا نام لینے والا منصوبہ</text></g><g><rect class="rl" x="620" y="226" width="300" height="40"/><rect class="cl" x="340" y="226" width="280" height="40"/><rect class="cl" x="60" y="226" width="280" height="40"/><text class="n" x="910" y="251" text-anchor="end">5 تشخیص</text><text x="610" y="251" text-anchor="end">معلوم کرنا کیا سیکھا گیا</text><text x="330" y="251" text-anchor="end">نمبر دینے کے بعد کیا بدلا</text></g><g><rect class="rl" x="620" y="266" width="300" height="40"/><rect class="cl" x="340" y="266" width="280" height="40"/><rect class="cl" x="60" y="266" width="280" height="40"/><text class="n" x="910" y="291" text-anchor="end">6 تعلمی ماحول</text><text x="610" y="291" text-anchor="end">سیکھنے کی جگہ بطور کمرہ</text><text x="330" y="291" text-anchor="end">کون غلط جواب دینے کا خطرہ لینے کو تیار ہے</text></g><g><rect class="rl" x="620" y="306" width="300" height="46"/><rect class="cl" x="340" y="306" width="280" height="46"/><rect class="cl" x="60" y="306" width="280" height="46"/><text class="n" x="910" y="326" text-anchor="end">7 مؤثر ابلاغ اور ICT کی</text><text class="n" x="910" y="341" text-anchor="end">مہارت استعمال</text><text x="610" y="334" text-anchor="end">سمجھانا پڑنا</text><text x="330" y="334" text-anchor="end">دوسری وضاحت، پہلی جیسی نہیں</text></g><g><rect class="rl" x="620" y="352" width="300" height="40"/><rect class="cl" x="340" y="352" width="280" height="40"/><rect class="cl" x="60" y="352" width="280" height="40"/><text class="n" x="910" y="377" text-anchor="end">8 تعاون اور شراکت داری</text><text x="610" y="377" text-anchor="end">دوسروں کے ساتھ کام</text><text x="330" y="377" text-anchor="end">کوئی ایسی چیز جو ساتھی نے اپنائی</text></g><g><rect class="rl" x="620" y="392" width="300" height="46"/><rect class="cl" x="340" y="392" width="280" height="46"/><rect class="cl" x="60" y="392" width="280" height="46"/><text class="n" x="910" y="412" text-anchor="end">9 مسلسل پیشہ ورانہ ترقی</text><text class="n" x="910" y="427" text-anchor="end">اور ضابطہ اخلاق</text><text x="610" y="420" text-anchor="end">پڑھانے کے اہل رہنا</text><text x="330" y="420" text-anchor="end">بدلی مشق، حاضر گھنٹے نہیں</text></g><g><rect class="rl" x="620" y="438" width="300" height="46"/><rect class="cl" x="340" y="438" width="280" height="46"/><rect class="cl" x="60" y="438" width="280" height="46"/><text class="n" x="910" y="458" text-anchor="end">10 انگریزی بطور دوسری یا</text><text class="n" x="910" y="473" text-anchor="end">غیر ملکی زبان کی تدریس</text><text x="610" y="466" text-anchor="end">زبان بطور رکاوٹ</text><text x="330" y="466" text-anchor="end">وہ شاگرد جس نے ریاضی سمجھی، صرف الفاظ نہیں</text></g><rect class="note" x="60" y="498" width="860" height="42" rx="5"/><text class="m" x="908" y="516" text-anchor="end">یہ راستے کا خلاصہ ہے، معیارات خود نہیں۔ ہر معیار کا اپنے اشاریوں کے ساتھ مکمل متن ہے۔</text><text class="m" x="908" y="532" text-anchor="end">کسی کا جائزہ لینے سے پہلے، خود اپنے بھی، اسے بنیادی دستاویز میں پڑھیے۔</text><text class="wm" x="928" y="554" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
