<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four uses of one standard, and where they pull apart</title><desc id="d">Concept map of a professional standard at the centre with four branches - initial training, continuing development, appraisal, and public accountability - each noting what that use requires and marking that the uses can conflict.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .n2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} .cf{stroke:var(--a3);stroke-width:2;stroke-dasharray:5 4;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="ctr" x="350" y="196" width="200" height="60" rx="8"/><text class="h" x="450" y="220" text-anchor="middle">A professional</text><text class="h" x="450" y="240" text-anchor="middle">standard</text><rect class="n1" x="30" y="40" width="300" height="70" rx="6"/><text class="h" x="40" y="54"><tspan x="40" dy="0">Guiding initial</tspan><tspan x="40" dy="20">teacher training</tspan></text><text class="m" x="40" y="74"><tspan x="40" dy="0">requires: enough detail to build a</tspan><tspan x="40" dy="20">course on</tspan></text><text class="m" x="40" y="92"><tspan x="40" dy="0">and a level a beginner can</tspan><tspan x="40" dy="20">actually reach</tspan></text><path class="e" d="M350 210 L336 96" marker-end="url(#a)"/><rect class="n1" x="570" y="40" width="300" height="70" rx="6"/><text class="h" x="580" y="54"><tspan x="580" dy="0">Guiding continuing</tspan><tspan x="580" dy="20">development</tspan></text><text class="m" x="580" y="74"><tspan x="580" dy="0">requires: room above the entry</tspan><tspan x="580" dy="20">level, so an</tspan></text><text class="m" x="580" y="92"><tspan x="580" dy="0">experienced teacher still has</tspan><tspan x="580" dy="20">somewhere to go</tspan></text><path class="e" d="M550 210 L564 96" marker-end="url(#a)"/><rect class="n1" x="30" y="330" width="300" height="70" rx="6"/><text class="h" x="40" y="354">Informing appraisal</text><text class="m" x="40" y="364"><tspan x="40" dy="0">requires: observable indicators,</tspan><tspan x="40" dy="20">comparable</tspan></text><text class="m" x="40" y="382"><tspan x="40" dy="0">between teachers, and a right of</tspan><tspan x="40" dy="20">appeal</tspan></text><path class="e" d="M350 244 L336 344" marker-end="url(#a)"/><rect class="n2" x="570" y="330" width="300" height="70" rx="6"/><text class="h" x="580" y="344"><tspan x="580" dy="0">A public</tspan><tspan x="580" dy="20">accountability claim</tspan></text><text class="m" x="580" y="364"><tspan x="580" dy="0">requires: language a parent or</tspan><tspan x="580" dy="20">minister can</tspan></text><text class="m" x="580" y="382"><tspan x="580" dy="0">read, and a promise the system can</tspan><tspan x="580" dy="20">keep</tspan></text><path class="e" d="M550 244 L564 344" marker-end="url(#a)"/><path class="cf" d="M330 75 L570 365"/><path class="cf" d="M330 365 L570 75"/><rect class="n2" x="352" y="292" width="196" height="40" rx="5"/><text class="m" x="450" y="298" text-anchor="middle"><tspan x="450" dy="0">The four uses can</tspan><tspan x="450" dy="20">conflict.</tspan></text><text class="m" x="450" y="314" text-anchor="middle"><tspan x="450" dy="0">Detail for training</tspan><tspan x="450" dy="20">reads as</tspan></text><text class="m" x="450" y="404" text-anchor="middle"><tspan x="450" dy="0">bureaucracy in appraisal; language</tspan><tspan x="450" dy="20">simple enough for the public is</tspan><tspan x="450" dy="20">too coarse to develop anyone.</tspan></text><text class="m" x="450" y="424" text-anchor="middle"><tspan x="450" dy="0">A standard written for all four at</tspan><tspan x="450" dy="20">once serves each of them a little</tspan><tspan x="450" dy="20">worse.</tspan></text><text class="wm" x="888" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
