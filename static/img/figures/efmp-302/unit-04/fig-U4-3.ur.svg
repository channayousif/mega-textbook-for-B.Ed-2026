<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک معیار کیسے بنتا ہے</title><desc id="d">پیشہ ورانہ معیار کی جڑواں ترتیب کا خاکہ جس میں علم، رجحانات اور کارکردگی کے بینڈ شامل ہیں، حصوں کے نیچے اشاریے، یہاں کارکردگی والے بینڈ کے لیے دکھائے گئے، ہر ایک جماعتی شہادت کی مثال کی طرف اشارہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .out{fill:none;stroke:var(--ink);stroke-width:3} .b1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b2{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .b3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .ind{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .ev{fill:var(--a3-fill);stroke:var(--a3);stroke-width:1.5} .ar{stroke:var(--a3);stroke-width:1.8;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .s{font-size:10.5px;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="470"/><rect class="out" x="30" y="30" width="820" height="230" rx="6"/><text class="h" x="834" y="54" text-anchor="end">معیار</text><rect class="b1" x="50" y="66" width="780" height="54" rx="5"/><text class="h" x="816" y="88" text-anchor="end">علم اور سمجھ</text><text class="m" x="816" y="108" text-anchor="end">استاد کیا جانتا ہے: مضمونی مواد، شاگرد اسے کیسے سیکھتے ہیں، کہاں غلط سمجھا جاتا ہے</text><rect class="b2" x="50" y="126" width="780" height="54" rx="5"/><text class="h" x="816" y="148" text-anchor="end">رجحانات</text><text class="m" x="816" y="168" text-anchor="end">استاد جو رویے اور اقدار رکھتا ہے: ہر شاگرد سیکھ سکتا ہے، غلطیاں معلومات ہیں</text><rect class="b3" x="50" y="186" width="780" height="60" rx="5"/><text class="h" x="816" y="208" text-anchor="end">کارکردگی اور مہارتیں</text><text class="m" x="816" y="228" text-anchor="end">استاد کیا کر سکتا ہے: وہ حصہ جو دیکھا جا سکتا ہے، اور اسی لیے جس کی تشخیص ہوتی ہے</text><rect class="ind" x="590" y="290" width="240" height="40" rx="5"/><text class="s" x="818" y="315" text-anchor="end">اشاریہ: غلط فہمیوں کے لیے منصوبہ بناتا ہے</text><rect class="ind" x="320" y="290" width="240" height="40" rx="5"/><text class="s" x="548" y="315" text-anchor="end">اشاریہ: سبق کے بیچ میں سمجھ جانچتا ہے</text><rect class="ind" x="50" y="290" width="240" height="40" rx="5"/><text class="s" x="278" y="315" text-anchor="end">اشاریہ: جانچ ناکام ہونے پر بدلتا ہے</text><path class="ar" d="M710 330 L710 360" marker-end="url(#a)"/><path class="ar" d="M440 330 L440 360" marker-end="url(#a)"/><path class="ar" d="M170 330 L170 360" marker-end="url(#a)"/><rect class="ev" x="590" y="364" width="240" height="46" rx="5"/><text class="s" x="818" y="384" text-anchor="end">شہادت: ایسا منصوبہ جو وہ غلط</text><text class="s" x="818" y="400" text-anchor="end">جواب نام لے جو شاگرد دیتے ہیں</text><rect class="ev" x="320" y="364" width="240" height="46" rx="5"/><text class="s" x="548" y="384" text-anchor="end">شہادت: مشاہدہ شدہ سوال جس کا</text><text class="s" x="548" y="400" text-anchor="end">ایک شاگرد نے جواب نہ دیا</text><rect class="ev" x="50" y="364" width="240" height="46" rx="5"/><text class="s" x="278" y="384" text-anchor="end">شہادت: دوسری وضاحت،</text><text class="s" x="278" y="400" text-anchor="end">پہلی سے مختلف</text><line class="ar" x1="440" y1="246" x2="440" y2="286" marker-end="url(#a)"/><text class="m" x="758" y="444" text-anchor="end">اشاریے حصوں کے نیچے بیٹھتے ہیں، اور شہادت صرف اشاریے پیدا کرتے ہیں۔ نیچے دکھائے گئے تین کارکردگی اور مہارتوں سے لیے گئے ہیں، وہ حصہ جو دیکھا جا سکتا ہے؛</text><text class="m" x="758" y="462" text-anchor="end">استاد کا علم اور اقدار کارکردگی سے جو دکھتی ہے اس سے نکالے جاتے ہیں۔</text><text class="wm" x="868" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
