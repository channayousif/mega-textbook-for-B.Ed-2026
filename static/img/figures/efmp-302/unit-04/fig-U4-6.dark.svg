<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Kinds of evidence against one indicator</title><desc id="d">Table of evidence types against an indicator - pupil work, observation, planning documents, pupil voice and the teacher's own record - showing what each reveals, what it cannot show, and how easily each can be faked.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="420"/><rect class="rl" x="20" y="28" width="190" height="46"/><rect class="hd" x="210" y="28" width="230" height="46"/><rect class="hd" x="440" y="28" width="230" height="46"/><rect class="hx" x="670" y="28" width="210" height="46"/><text class="h" x="325" y="49" text-anchor="middle">What it shows well</text><text class="h" x="555" y="49" text-anchor="middle">What it cannot show</text><text class="h" x="775" y="42" text-anchor="middle">How easily produced</text><text class="h" x="775" y="60" text-anchor="middle">without the competence</text><g><rect class="rl" x="20" y="74" width="190" height="58"/><rect class="cl" x="210" y="74" width="230" height="58"/><rect class="cl" x="440" y="74" width="230" height="58"/><rect class="cx" x="670" y="74" width="210" height="58"/><text class="rh" x="30" y="108">Pupil work</text><text x="220" y="100">Whether anyone learned</text><text x="220" y="118">the thing</text><text x="450" y="100">Whether the teacher</text><text x="450" y="118">caused it</text><text x="680" y="108">Hard</text></g><g><rect class="rl" x="20" y="132" width="190" height="58"/><rect class="cl" x="210" y="132" width="230" height="58"/><rect class="cl" x="440" y="132" width="230" height="58"/><rect class="cx" x="670" y="132" width="210" height="58"/><text class="rh" x="30" y="166">Colleague observation</text><text x="220" y="158">What the teacher</text><text x="220" y="176">actually does</text><text x="450" y="158">The ordinary lesson,</text><text x="450" y="176">unobserved</text><text x="680" y="166">Moderate: one lesson can be staged</text></g><g><rect class="rl" x="20" y="190" width="190" height="58"/><rect class="cl" x="210" y="190" width="230" height="58"/><rect class="cl" x="440" y="190" width="230" height="58"/><rect class="cx" x="670" y="190" width="210" height="58"/><text class="rh" x="30" y="224">Planning documents</text><text x="220" y="216">Intention and</text><text x="220" y="234">foresight</text><text x="450" y="216">Anything that</text><text x="450" y="234">happened</text><text x="680" y="224">Easy</text></g><g><rect class="rl" x="20" y="248" width="190" height="58"/><rect class="cl" x="210" y="248" width="230" height="58"/><rect class="cl" x="440" y="248" width="230" height="58"/><rect class="cx" x="670" y="248" width="210" height="58"/><text class="rh" x="30" y="282">Pupil voice</text><text x="220" y="274">How it is experienced</text><text x="220" y="292">from the desk</text><text x="450" y="274">Whether the experience</text><text x="450" y="292">produced learning</text><text x="680" y="282">Moderate: popularity confounds it</text></g><g><rect class="rl" x="20" y="306" width="190" height="58"/><rect class="cl" x="210" y="306" width="230" height="58"/><rect class="cl" x="440" y="306" width="230" height="58"/><rect class="cx" x="670" y="306" width="210" height="58"/><text class="rh" x="30" y="340">The teacher's own record</text><text x="220" y="332">Reasoning behind the</text><text x="220" y="350">choices made</text><text x="450" y="332">Whether the reasoning</text><text x="450" y="350">is accurate</text><text x="680" y="340">Very easy</text></g><text class="m" x="20" y="392">The dashed column is why no single source settles an indicator. Goe, Bell and Little (2008): multiple measures, each for a different aspect.</text><text class="m" x="20" y="410">The easiest evidence to produce is the least worth having, which is exactly why appraisal systems accumulate it.</text><text class="wm" x="888" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
