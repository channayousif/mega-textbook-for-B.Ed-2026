<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک معیار کے چار استعمال، اور جہاں وہ الگ کھینچتے ہیں</title><desc id="d">پیشہ ورانہ معیار کا تصوراتی نقشہ جس کے مرکز سے چار شاخیں نکلی ہیں - ابتدائی تربیت، مسلسل ترقی، جائزہ، اور عوامی جوابدہی - ہر ایک یہ بتاتی ہے کہ وہ استعمال کیا تقاضا کرتا ہے اور یہ کہ استعمال آپس میں ٹکرا سکتے ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .n2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} .cf{stroke:var(--a3);stroke-width:2;stroke-dasharray:5 4;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="460"/><rect class="ctr" x="350" y="196" width="200" height="60" rx="8"/><text class="h" x="450" y="220" text-anchor="middle">پیشہ ورانہ</text><text class="h" x="450" y="240" text-anchor="middle">معیار</text><rect class="n1" x="570" y="40" width="300" height="70" rx="6"/><text class="h" x="860" y="64" text-anchor="end">ابتدائی تربیت کی رہنمائی</text><text class="m" x="860" y="84" text-anchor="end">تقاضا: کورس بنانے کے قابل تفصیل</text><text class="m" x="860" y="102" text-anchor="end">اور ایسا درجہ جو نوآموز واقعی پہنچ سکے</text><path class="e" d="M550 210 L564 96" marker-end="url(#a)"/><rect class="n1" x="30" y="40" width="300" height="70" rx="6"/><text class="h" x="290" y="64" text-anchor="end">مسلسل ترقی کی رہنمائی</text><text class="m" x="290" y="84" text-anchor="end">تقاضا: داخلے کے درجے سے اوپر جگہ، تاکہ</text><text class="m" x="290" y="102" text-anchor="end">تجربہ کار استاد کے پاس جانے کی جگہ ہو</text><path class="e" d="M350 210 L336 96" marker-end="url(#a)"/><rect class="n1" x="570" y="330" width="300" height="70" rx="6"/><text class="h" x="860" y="354" text-anchor="end">جائزے کو معلومات دینا</text><text class="m" x="860" y="374" text-anchor="end">تقاضا: مشاہدے کے قابل اشاریے، استادوں</text><text class="m" x="860" y="392" text-anchor="end">کے درمیان قابلِ موازنہ، اور اپیل کا حق</text><path class="e" d="M550 244 L564 344" marker-end="url(#a)"/><rect class="n2" x="30" y="330" width="300" height="70" rx="6"/><text class="h" x="290" y="354" text-anchor="end">عوامی جوابدہی کا دعویٰ</text><text class="m" x="290" y="374" text-anchor="end">تقاضا: ایسا زبان جو والد یا وزیر پڑھ سکے،</text><text class="m" x="290" y="392" text-anchor="end">اور ایسا وعدہ جو نظام پورا کر سکے</text><path class="e" d="M350 244 L336 344" marker-end="url(#a)"/><path class="cf" d="M570 75 L330 365"/><path class="cf" d="M570 365 L330 75"/><rect class="n2" x="352" y="292" width="196" height="40" rx="5"/><text class="m" x="450" y="308" text-anchor="middle">چار استعمال ٹکرا سکتے ہیں۔</text><text class="m" x="450" y="324" text-anchor="middle">تربیت کے لیے تفصیل جائزے میں</text><text class="m" x="450" y="424" text-anchor="middle">بیوروکریسی لگتی ہے؛ عوام کے لیے اتنا سادہ زبان کسی کو ترقی دینے کے لیے بہت موٹا ہے۔</text><text class="m" x="450" y="444" text-anchor="middle">چاروں کے لیے ایک ساتھ لکھا معیار ہر ایک کو تھوڑا کم خدمت دیتا ہے۔</text><text class="wm" x="888" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
