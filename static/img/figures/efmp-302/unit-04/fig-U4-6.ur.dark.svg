<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کسی اشاریے کے خلاف شہادت کی اقسام</title><desc id="d">کسی اشاریے کے خلاف شہادت کی اقسام کا جدول - شاگردوں کا کام، مشاہدہ، منصوبہ بندی کے دستاویز، شاگردوں کی آواز اور استاد کا اپنا ریکارڈ - دکھاتا ہے کہ ہر ایک کیا کھولتا ہے، کیا نہیں دکھا سکتی، اور جعلی بنانا کتنا آسان ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="420"/><rect class="rl" x="690" y="28" width="190" height="46"/><rect class="hd" x="460" y="28" width="230" height="46"/><rect class="hd" x="230" y="28" width="230" height="46"/><rect class="hx" x="20" y="28" width="210" height="46"/><text class="h" x="575" y="49" text-anchor="middle">کیا اچھی دکھاتی ہے</text><text class="h" x="345" y="49" text-anchor="middle">کیا نہیں دکھا سکتی</text><text class="h" x="125" y="42" text-anchor="middle">اہلیت کے بغیر</text><text class="h" x="125" y="60" text-anchor="middle">بنانا کتنا آسان</text><g><rect class="rl" x="690" y="74" width="190" height="58"/><rect class="cl" x="460" y="74" width="230" height="58"/><rect class="cl" x="230" y="74" width="230" height="58"/><rect class="cx" x="20" y="74" width="210" height="58"/><text class="rh" x="870" y="108" text-anchor="end">شاگردوں کا کام</text><text x="680" y="100" text-anchor="end">کسی نے وہ چیز سیکھی</text><text x="680" y="118" text-anchor="end">یا نہیں</text><text x="450" y="100" text-anchor="end">استاد نے یہ پیدا</text><text x="450" y="118" text-anchor="end">کیا یا نہیں</text><text x="220" y="108" text-anchor="end">مشکل</text></g><g><rect class="rl" x="690" y="132" width="190" height="58"/><rect class="cl" x="460" y="132" width="230" height="58"/><rect class="cl" x="230" y="132" width="230" height="58"/><rect class="cx" x="20" y="132" width="210" height="58"/><text class="rh" x="870" y="166" text-anchor="end">ساتھی کا مشاہدہ</text><text x="680" y="158" text-anchor="end">استاد واقعی</text><text x="680" y="176" text-anchor="end">کیا کرتا ہے</text><text x="450" y="158" text-anchor="end">عام سبق،</text><text x="450" y="176" text-anchor="end">جسے دیکھا نہ گیا</text><text x="220" y="166" text-anchor="end">درمیانہ: ایک سبق سجایا جا سکتا ہے</text></g><g><rect class="rl" x="690" y="190" width="190" height="58"/><rect class="cl" x="460" y="190" width="230" height="58"/><rect class="cl" x="230" y="190" width="230" height="58"/><rect class="cx" x="20" y="190" width="210" height="58"/><text class="rh" x="870" y="224" text-anchor="end">منصوبہ بندی کے دستاویز</text><text x="680" y="216" text-anchor="end">ارادہ اور</text><text x="680" y="234" text-anchor="end">دور اندیشی</text><text x="450" y="216" text-anchor="end">جو کچھ</text><text x="450" y="234" text-anchor="end">ہوا</text><text x="220" y="224" text-anchor="end">آسان</text></g><g><rect class="rl" x="690" y="248" width="190" height="58"/><rect class="cl" x="460" y="248" width="230" height="58"/><rect class="cl" x="230" y="248" width="230" height="58"/><rect class="cx" x="20" y="248" width="210" height="58"/><text class="rh" x="870" y="282" text-anchor="end">شاگردوں کی آواز</text><text x="680" y="274" text-anchor="end">میز سے تجربہ</text><text x="680" y="292" text-anchor="end">کیسا لگا</text><text x="450" y="274" text-anchor="end">کیا تجربے نے</text><text x="450" y="292" text-anchor="end">سیکھنا پیدا کیا</text><text x="220" y="282" text-anchor="end">درمیانہ: مقبولیت الجھا دیتی ہے</text></g><g><rect class="rl" x="690" y="306" width="190" height="58"/><rect class="cl" x="460" y="306" width="230" height="58"/><rect class="cl" x="230" y="306" width="230" height="58"/><rect class="cx" x="20" y="306" width="210" height="58"/><text class="rh" x="870" y="340" text-anchor="end">استاد کا اپنا ریکارڈ</text><text x="680" y="332" text-anchor="end">کی گئی چیزوں کے پیچھے</text><text x="680" y="350" text-anchor="end">استدلال</text><text x="450" y="332" text-anchor="end">استدلال درست</text><text x="450" y="350" text-anchor="end">ہے یا نہیں</text><text x="220" y="340" text-anchor="end">بہت آسان</text></g><text class="m" x="758" y="392" text-anchor="end">یہ خط والا کالم ہی وجہ ہے کہ کوئی ایک ذریعہ اشاریے کا فیصلہ نہیں کرتا۔ Goe، Bell اور Little (2008): ایک سے زیادہ پیمانے، ہر ایک الگ پہلو کے لیے۔</text><text class="m" x="758" y="410" text-anchor="end">پیدا کرنے میں سب سے آسان شہادت رکھنے کے سب سے کم قابل ہے، اور یہی وجہ ہے کہ جائزے کے نظام اسی کو جمع کرتے ہیں۔</text><text class="wm" x="888" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
