<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The self-evaluation loop, and where it breaks</title><desc id="d">Flowchart of a five-station self-evaluation loop - choose an indicator, collect evidence, judge the gap, plan one change, re-collect - with a note marking where the cycle most often breaks.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .rt{stroke:var(--a2);stroke-width:2.5;fill:none;stroke-dasharray:7 5} .br{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="100%"/><rect class="st" x="30" y="60" width="150" height="70" rx="6"/><text class="h" x="105" y="88" text-anchor="middle">1 Choose ONE</text><text class="h" x="105" y="106" text-anchor="middle">indicator</text><text class="m" x="105" y="112" text-anchor="middle"><tspan x="105" dy="0">not a standard, one</tspan><tspan x="105" dy="20">indicator</tspan></text><rect class="st" x="215" y="60" width="150" height="70" rx="6"/><text class="h" x="290" y="88" text-anchor="middle">2 Collect</text><text class="h" x="290" y="106" text-anchor="middle">evidence</text><text class="m" x="290" y="112" text-anchor="middle"><tspan x="290" dy="0">of practice as it is</tspan><tspan x="290" dy="20">now</tspan></text><rect class="st" x="400" y="60" width="150" height="70" rx="6"/><text class="h" x="475" y="88" text-anchor="middle">3 Judge the</text><text class="h" x="475" y="106" text-anchor="middle">gap honestly</text><text class="m" x="475" y="102" text-anchor="middle"><tspan x="475" dy="0">against the</tspan><tspan x="475" dy="20">indicator, not a</tspan><tspan x="475" dy="20">peer</tspan></text><rect class="st" x="585" y="60" width="150" height="70" rx="6"/><text class="h" x="660" y="88" text-anchor="middle">4 Plan ONE</text><text class="h" x="660" y="106" text-anchor="middle">change</text><text class="m" x="660" y="112" text-anchor="middle"><tspan x="660" dy="0">small enough to do</tspan><tspan x="660" dy="20">next week</tspan></text><rect class="st" x="400" y="230" width="150" height="70" rx="6"/><text class="h" x="475" y="258" text-anchor="middle">5 Re-collect the</text><text class="h" x="475" y="276" text-anchor="middle">SAME evidence</text><text class="m" x="475" y="282" text-anchor="middle"><tspan x="475" dy="0">or the comparison</tspan><tspan x="475" dy="20">means nothing</tspan></text><path class="f" d="M180 95 L210 95" marker-end="url(#a)"/><path class="f" d="M365 95 L395 95" marker-end="url(#a)"/><path class="f" d="M550 95 L580 95" marker-end="url(#a)"/><path class="f" d="M660 130 L660 265 L556 265" marker-end="url(#a)"/><path class="rt" d="M400 265 L105 265 L105 134" marker-end="url(#b)"/><text class="m" x="250" y="245" text-anchor="middle"><tspan x="250" dy="0">same indicator again, or the next</tspan><tspan x="250" dy="20">one</tspan></text><rect class="br" x="30" y="330" width="390" height="92" rx="6"/><text class="h" x="42" y="344"><tspan x="42" dy="0">Where it breaks,</tspan><tspan x="42" dy="20">first</tspan></text><text class="m" x="42" y="366"><tspan x="42" dy="0">Choosing too many indicators at</tspan><tspan x="42" dy="20">once. Five indicators</tspan></text><text class="m" x="42" y="384"><tspan x="42" dy="0">produce five half-measurements and</tspan><tspan x="42" dy="20">no change you</tspan></text><text class="m" x="42" y="402"><tspan x="42" dy="0">could attribute to</tspan><tspan x="42" dy="20">anything.</tspan></text><rect class="br" x="450" y="330" width="400" height="92" rx="6"/><text class="h" x="462" y="344"><tspan x="462" dy="0">Where it breaks,</tspan><tspan x="462" dy="20">second</tspan></text><text class="m" x="462" y="366"><tspan x="462" dy="0">Changing the evidence rather than</tspan><tspan x="462" dy="20">the practice. If</tspan></text><text class="m" x="462" y="384"><tspan x="462" dy="0">station 5 measures something</tspan><tspan x="462" dy="20">easier than station 2,</tspan></text><text class="m" x="462" y="402"><tspan x="462" dy="0">the loop will always show</tspan><tspan x="462" dy="20">improvement.</tspan></text><text class="m" x="30" y="408"><tspan x="30" dy="0">The loop is cheap. What makes it</tspan><tspan x="30" dy="20">work is that station 5 repeats</tspan><tspan x="30" dy="20">station 2 exactly, and that</tspan><tspan x="30" dy="20">station 1 was</tspan></text><text class="m" x="30" y="446"><tspan x="30" dy="0">honest about which indicator to</tspan><tspan x="30" dy="20">pick.</tspan></text><text class="wm" x="868" y="506" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
