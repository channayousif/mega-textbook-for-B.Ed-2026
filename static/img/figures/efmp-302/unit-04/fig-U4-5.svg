<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The self-evaluation loop, and where it breaks</title><desc id="d">Flowchart of a five-station self-evaluation loop - choose an indicator, collect evidence, judge the gap, plan one change, re-collect - with a note marking where the cycle most often breaks.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .rt{stroke:var(--a2);stroke-width:2.5;fill:none;stroke-dasharray:7 5} .br{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="480"/><rect class="st" x="30" y="60" width="150" height="70" rx="6"/><text class="h" x="105" y="88" text-anchor="middle">1 Choose ONE</text><text class="h" x="105" y="106" text-anchor="middle">indicator</text><text class="m" x="105" y="122" text-anchor="middle">not a standard, one indicator</text><rect class="st" x="215" y="60" width="150" height="70" rx="6"/><text class="h" x="290" y="88" text-anchor="middle">2 Collect</text><text class="h" x="290" y="106" text-anchor="middle">evidence</text><text class="m" x="290" y="122" text-anchor="middle">of practice as it is now</text><rect class="st" x="400" y="60" width="150" height="70" rx="6"/><text class="h" x="475" y="88" text-anchor="middle">3 Judge the</text><text class="h" x="475" y="106" text-anchor="middle">gap honestly</text><text class="m" x="475" y="122" text-anchor="middle">against the indicator, not a peer</text><rect class="st" x="585" y="60" width="150" height="70" rx="6"/><text class="h" x="660" y="88" text-anchor="middle">4 Plan ONE</text><text class="h" x="660" y="106" text-anchor="middle">change</text><text class="m" x="660" y="122" text-anchor="middle">small enough to do next week</text><rect class="st" x="400" y="230" width="150" height="70" rx="6"/><text class="h" x="475" y="258" text-anchor="middle">5 Re-collect the</text><text class="h" x="475" y="276" text-anchor="middle">SAME evidence</text><text class="m" x="475" y="292" text-anchor="middle">or the comparison means nothing</text><path class="f" d="M180 95 L210 95" marker-end="url(#a)"/><path class="f" d="M365 95 L395 95" marker-end="url(#a)"/><path class="f" d="M550 95 L580 95" marker-end="url(#a)"/><path class="f" d="M660 130 L660 265 L556 265" marker-end="url(#a)"/><path class="rt" d="M400 265 L105 265 L105 134" marker-end="url(#b)"/><text class="m" x="250" y="255" text-anchor="middle">same indicator again, or the next one</text><rect class="br" x="30" y="330" width="390" height="92" rx="6"/><text class="h" x="42" y="354">Where it breaks, first</text><text class="m" x="42" y="376">Choosing too many indicators at once. Five indicators</text><text class="m" x="42" y="394">produce five half-measurements and no change you</text><text class="m" x="42" y="412">could attribute to anything.</text><rect class="br" x="450" y="330" width="400" height="92" rx="6"/><text class="h" x="462" y="354">Where it breaks, second</text><text class="m" x="462" y="376">Changing the evidence rather than the practice. If</text><text class="m" x="462" y="394">station 5 measures something easier than station 2,</text><text class="m" x="462" y="412">the loop will always show improvement.</text><text class="m" x="30" y="456">The loop is cheap. What makes it work is that station 5 repeats station 2 exactly, and that station 1 was honest about which indicator to pick.</text><text class="wm" x="868" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
