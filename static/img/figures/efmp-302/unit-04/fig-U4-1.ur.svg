<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معیار، ضابطہ اخلاق اور نصاب کا موازنہ</title><desc id="d">پیشہ ورانہ معیار، ضابطہ اخلاق اور نصاب کا موازنہ کرنے والا جدول: ہر ایک کس سوال کا جواب دیتا ہے، کس چیز پر حکم چلاتا ہے، اسے کون نافذ کرتا ہے، اور ہر ایک کیا نہیں کر سکتا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .h1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .h2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .h3{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><rect class="rl" x="700" y="30" width="180" height="46"/><rect class="h1" x="470" y="30" width="230" height="46"/><rect class="h2" x="240" y="30" width="230" height="46"/><rect class="h3" x="20" y="30" width="220" height="46"/><text class="h" x="585" y="58" text-anchor="middle">پیشہ ورانہ معیار</text><text class="h" x="355" y="58" text-anchor="middle">ضابطہ اخلاق</text><text class="h" x="130" y="58" text-anchor="middle">نصاب</text><rect class="rl" x="700" y="76" width="180" height="66"/><rect class="cl" x="470" y="76" width="230" height="66"/><rect class="cl" x="240" y="76" width="230" height="66"/><rect class="cl" x="20" y="76" width="220" height="66"/><text class="rh" x="868" y="106" text-anchor="end">جس سوال کا</text><text class="rh" x="868" y="126" text-anchor="end">جواب دیتا ہے</text><text x="688" y="106" text-anchor="end">استاد کیا جانتا اور</text><text x="688" y="126" text-anchor="end">کر سکتا ہے؟</text><text x="458" y="106" text-anchor="end">استاد کا رویہ کیسا</text><text x="458" y="126" text-anchor="end">ہونا چاہیے؟</text><text x="228" y="106" text-anchor="end">شاگردوں کو کیا</text><text x="228" y="126" text-anchor="end">سکھایا جائے؟</text><rect class="rl" x="700" y="142" width="180" height="60"/><rect class="cl" x="470" y="142" width="230" height="60"/><rect class="cl" x="240" y="142" width="230" height="60"/><rect class="cl" x="20" y="142" width="220" height="60"/><text class="rh" x="868" y="178" text-anchor="end">کس چیز پر حکم چلاتا ہے</text><text x="688" y="178" text-anchor="end">اہلیت</text><text x="458" y="178" text-anchor="end">طرزِ عمل اور اخلاق</text><text x="228" y="178" text-anchor="end">مواد اور ترتیب</text><rect class="rl" x="700" y="202" width="180" height="60"/><rect class="cl" x="470" y="202" width="230" height="60"/><rect class="cl" x="240" y="202" width="230" height="60"/><rect class="cl" x="20" y="202" width="220" height="60"/><text class="rh" x="868" y="238" text-anchor="end">اسے کون نافذ کرتا ہے</text><text x="688" y="232" text-anchor="end">تربیت دینے والے، جائزہ لینے والے،</text><text x="688" y="252" text-anchor="end">لائسنس دینے والے ادارے</text><text x="458" y="232" text-anchor="end">ملازم رکھنے والے اور</text><text x="458" y="252" text-anchor="end">رجسٹریشن ادارے</text><text x="228" y="232" text-anchor="end">بورڈ اور</text><text x="228" y="252" text-anchor="end">امتحانی نظام</text><rect class="rl" x="700" y="262" width="180" height="66"/><rect class="cl" x="470" y="262" width="230" height="66"/><rect class="cl" x="240" y="262" width="230" height="66"/><rect class="cl" x="20" y="262" width="220" height="66"/><text class="rh" x="868" y="292" text-anchor="end">جو وہ نہیں</text><text class="rh" x="868" y="312" text-anchor="end">کر سکتا</text><text x="688" y="292" text-anchor="end">استاد کے اندر یہ چاہنے</text><text x="688" y="312" text-anchor="end">والا بنانا</text><text x="458" y="292" text-anchor="end">اچھی تدریس کی</text><text x="458" y="312" text-anchor="end">تفصیل دینا</text><text x="228" y="292" text-anchor="end">یہ بتانا کہ پڑھانے</text><text x="228" y="312" text-anchor="end">کا اہل کون ہے</text><text class="m" x="780" y="358" text-anchor="end">تینوں کو عام طور پر خلط ملط کیا جاتا ہے۔ ضابطہ آپ کو کسر کی وضاحت کرنا نہیں سکھائے گا، اور نصاب یہ نہیں بتائے گا کہ کلاس کے سامنے کون ہونا چاہیے۔</text><text class="m" x="780" y="378" text-anchor="end">ہر ایک الگ سوال کا جواب دیتا ہے، اور کوئی دوسرے کا بدل نہیں۔</text><text class="wm" x="888" y="386" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
