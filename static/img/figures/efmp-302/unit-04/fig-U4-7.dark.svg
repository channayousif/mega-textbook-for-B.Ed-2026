<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Where standards bite across a teaching career</title><desc id="d">Timeline of a teaching career marking where standards are applied - admission, certification, licensing, probation, periodic appraisal, promotion and renewal - each labelled with who applies it and what is at stake.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .st{fill:var(--a1);stroke:none} .c{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .cg{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .cr{fill:var(--panel);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="920" height="430"/><line class="ax" x1="30" y1="215" x2="890" y2="215"/><g class="st"><circle cx="90" cy="215" r="6"/><circle cx="215" cy="215" r="6"/><circle cx="340" cy="215" r="6"/><circle cx="465" cy="215" r="6"/><circle cx="590" cy="215" r="6"/><circle cx="715" cy="215" r="6"/><circle cx="840" cy="215" r="6"/></g><rect class="c" x="22" y="96" width="136" height="80" rx="5"/><text class="h" x="90" y="118" text-anchor="middle">Admission</text><text class="m" x="90" y="136" text-anchor="middle">to teacher education</text><text class="m" x="90" y="154" text-anchor="middle">applied by: the institution</text><text class="m" x="90" y="170" text-anchor="middle">at stake: entry</text><rect class="c" x="147" y="254" width="136" height="80" rx="5"/><text class="h" x="215" y="276" text-anchor="middle">Certification</text><text class="m" x="215" y="294" text-anchor="middle">on completion</text><text class="m" x="215" y="312" text-anchor="middle">applied by: the awarding body</text><text class="m" x="215" y="328" text-anchor="middle">at stake: the qualification</text><rect class="cr" x="272" y="96" width="136" height="80" rx="5"/><text class="h" x="340" y="118" text-anchor="middle">Licensing</text><text class="m" x="340" y="136" text-anchor="middle">where required</text><text class="m" x="340" y="154" text-anchor="middle">applied by: the state</text><text class="m" x="340" y="170" text-anchor="middle">at stake: the right to teach</text><rect class="c" x="397" y="254" width="136" height="80" rx="5"/><text class="h" x="465" y="276" text-anchor="middle">Probation</text><text class="m" x="465" y="294" text-anchor="middle">and confirmation</text><text class="m" x="465" y="312" text-anchor="middle">applied by: the employer</text><text class="m" x="465" y="328" text-anchor="middle">at stake: the post</text><rect class="cg" x="522" y="96" width="136" height="80" rx="5"/><text class="h" x="590" y="118" text-anchor="middle">Periodic appraisal</text><text class="m" x="590" y="136" text-anchor="middle">recurring</text><text class="m" x="590" y="154" text-anchor="middle">applied by: the head</text><text class="m" x="590" y="170" text-anchor="middle">at stake: standing, and pay</text><rect class="c" x="647" y="254" width="136" height="80" rx="5"/><text class="h" x="715" y="276" text-anchor="middle">Promotion</text><text class="m" x="715" y="294" text-anchor="middle">or transfer</text><text class="m" x="715" y="312" text-anchor="middle">applied by: the system</text><text class="m" x="715" y="328" text-anchor="middle">at stake: the next role</text><rect class="cr" x="772" y="96" width="136" height="80" rx="5"/><text class="h" x="840" y="118" text-anchor="middle">Re-licensing</text><text class="m" x="840" y="136" text-anchor="middle">where it exists</text><text class="m" x="840" y="154" text-anchor="middle">applied by: the state</text><text class="m" x="840" y="170" text-anchor="middle">at stake: continuing to teach</text><line class="ax" x1="90" y1="176" x2="90" y2="209" stroke-width="1.5"/><line class="ax" x1="215" y1="221" x2="215" y2="250" stroke-width="1.5"/><line class="ax" x1="340" y1="176" x2="340" y2="209" stroke-width="1.5"/><line class="ax" x1="465" y1="221" x2="465" y2="250" stroke-width="1.5"/><line class="ax" x1="590" y1="176" x2="590" y2="209" stroke-width="1.5"/><line class="ax" x1="715" y1="221" x2="715" y2="250" stroke-width="1.5"/><line class="ax" x1="840" y1="176" x2="840" y2="209" stroke-width="1.5"/><text class="m" x="30" y="46">Dashed boxes are applied only where a jurisdiction requires them; the rest apply almost everywhere.</text><text class="m" x="30" y="64">One document is used seven times by six different parties, each wanting something different from it.</text><text class="m" x="30" y="392">That is why the same standard reads as guidance at admission and as a threat at appraisal. Nothing about the words changed; the stake did.</text><text class="wm" x="908" y="414" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
