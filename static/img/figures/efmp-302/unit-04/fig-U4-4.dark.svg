<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The ten National Professional Standards, in summary</title><desc id="d">Table listing the ten National Professional Standards for Teachers in Pakistan, each with its focus and an example of classroom evidence, marked as a summary that directs the reader to the primary document.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .n{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="560"/><rect class="hd" x="20" y="28" width="300" height="38"/><rect class="hd" x="320" y="28" width="280" height="38"/><rect class="hd" x="600" y="28" width="280" height="38"/><text class="h" x="170" y="52" text-anchor="middle">Standard</text><text class="h" x="460" y="52" text-anchor="middle">Focus</text><text class="h" x="740" y="52" text-anchor="middle">Example of classroom evidence</text><g><rect class="rl" x="20" y="66" width="300" height="40"/><rect class="cl" x="320" y="66" width="280" height="40"/><rect class="cl" x="600" y="66" width="280" height="40"/><text class="n" x="30" y="91">1 Subject matter knowledge</text><text x="330" y="91">Knowing what is taught</text><text x="610" y="91">A correct answer to an unplanned question</text></g><g><rect class="rl" x="20" y="106" width="300" height="40"/><rect class="cl" x="320" y="106" width="280" height="40"/><rect class="cl" x="600" y="106" width="280" height="40"/><text class="n" x="30" y="131">2 Human growth and development</text><text x="330" y="131">How pupils change</text><text x="610" y="131">Task pitched to the age, not the syllabus</text></g><g><rect class="rl" x="20" y="146" width="300" height="40"/><rect class="cl" x="320" y="146" width="280" height="40"/><rect class="cl" x="600" y="146" width="280" height="40"/><text class="n" x="30" y="165">3 Islamic ethical values and</text><text class="n" x="30" y="180">social life skills</text><text x="330" y="171">Values in practice</text><text x="610" y="171">How a dispute between pupils is settled</text></g><g><rect class="rl" x="20" y="186" width="300" height="40"/><rect class="cl" x="320" y="186" width="280" height="40"/><rect class="cl" x="600" y="186" width="280" height="40"/><text class="n" x="30" y="211">4 Instructional planning and strategies</text><text x="330" y="211">Designing the lesson</text><text x="610" y="211">A plan naming the likely misconception</text></g><g><rect class="rl" x="20" y="226" width="300" height="40"/><rect class="cl" x="320" y="226" width="280" height="40"/><rect class="cl" x="600" y="226" width="280" height="40"/><text class="n" x="30" y="251">5 Assessment</text><text x="330" y="251">Finding out what was learned</text><text x="610" y="251">What changed after the marking</text></g><g><rect class="rl" x="20" y="266" width="300" height="40"/><rect class="cl" x="320" y="266" width="280" height="40"/><rect class="cl" x="600" y="266" width="280" height="40"/><text class="n" x="30" y="291">6 Learning environment</text><text x="330" y="291">The room as a place to learn</text><text x="610" y="291">Who is willing to risk a wrong answer</text></g><g><rect class="rl" x="20" y="306" width="300" height="46"/><rect class="cl" x="320" y="306" width="280" height="46"/><rect class="cl" x="600" y="306" width="280" height="46"/><text class="n" x="30" y="326">7 Effective communication and</text><text class="n" x="30" y="341">proficient use of ICT</text><text x="330" y="334">Being understood</text><text x="610" y="334">A second explanation, unlike the first</text></g><g><rect class="rl" x="20" y="352" width="300" height="40"/><rect class="cl" x="320" y="352" width="280" height="40"/><rect class="cl" x="600" y="352" width="280" height="40"/><text class="n" x="30" y="377">8 Collaboration and partnership</text><text x="330" y="377">Working with others</text><text x="610" y="377">Something a colleague adopted</text></g><g><rect class="rl" x="20" y="392" width="300" height="46"/><rect class="cl" x="320" y="392" width="280" height="46"/><rect class="cl" x="600" y="392" width="280" height="46"/><text class="n" x="30" y="412">9 Continuous professional development</text><text class="n" x="30" y="427">and code of conduct</text><text x="330" y="420">Staying fit to teach</text><text x="610" y="420">Practice that changed, not hours attended</text></g><g><rect class="rl" x="20" y="438" width="300" height="46"/><rect class="cl" x="320" y="438" width="280" height="46"/><rect class="cl" x="600" y="438" width="280" height="46"/><text class="n" x="30" y="458">10 Teaching of English as a second</text><text class="n" x="30" y="473">or foreign language</text><text x="330" y="466">Language as a barrier</text><text x="610" y="466">A pupil who understood the maths, not just the words</text></g><rect class="note" x="20" y="498" width="860" height="42" rx="5"/><text class="m" x="32" y="516">This is a navigational summary, not the standards themselves. Each standard has a full text with its own indicators.</text><text class="m" x="32" y="532">Read it in the primary document before using it to judge anyone, including yourself.</text><text class="wm" x="888" y="554" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
