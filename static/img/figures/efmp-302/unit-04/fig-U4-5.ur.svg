<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خود جائزہ کا چکر، اور جہاں یہ ٹوٹتا ہے</title><desc id="d">پانچ منزلہ خود جائزہ چکر کا فلوچارٹ - اشاریہ چنیے، شہادت جمع کیجیے، فرق جانچیے، ایک تبدیلی کی منصوبہ بندی کیجیے، دوبارہ جمع کیجیے - ایک نوٹ کے ساتھ جو نشان زد کرے کہ چکر سب سے زیادہ کہاں ٹوٹتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .rt{stroke:var(--a2);stroke-width:2.5;fill:none;stroke-dasharray:7 5} .br{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="480"/><rect class="st" x="700" y="60" width="150" height="70" rx="6"/><text class="h" x="775" y="88" text-anchor="middle">1 ایک اشاریہ</text><text class="h" x="775" y="106" text-anchor="middle">چنیے</text><text class="m" x="775" y="122" text-anchor="middle">نہ معیار، ایک اشاریہ</text><rect class="st" x="515" y="60" width="150" height="70" rx="6"/><text class="h" x="590" y="88" text-anchor="middle">2 شہادت</text><text class="h" x="590" y="106" text-anchor="middle">جمع کیجیے</text><text class="m" x="590" y="122" text-anchor="middle">مشق کی جیسی ابھی ہے</text><rect class="st" x="330" y="60" width="150" height="70" rx="6"/><text class="h" x="405" y="88" text-anchor="middle">3 فرق دیانتداری</text><text class="h" x="405" y="106" text-anchor="middle">سے جانچیے</text><text class="m" x="405" y="122" text-anchor="middle">اشاریے کے خلاف، ہم پیشہ کے نہیں</text><rect class="st" x="145" y="60" width="150" height="70" rx="6"/><text class="h" x="220" y="88" text-anchor="middle">4 ایک تبدیلی کی</text><text class="h" x="220" y="106" text-anchor="middle">منصوبہ بندی</text><text class="m" x="220" y="122" text-anchor="middle">اگلے ہفتے ہونے جتنی چھوٹی</text><rect class="st" x="330" y="230" width="150" height="70" rx="6"/><text class="h" x="405" y="258" text-anchor="middle">5 وہی شہادت</text><text class="h" x="405" y="276" text-anchor="middle">دوبارہ جمع کیجیے</text><text class="m" x="405" y="292" text-anchor="middle">ورنہ موازنہ بے معنی ہے</text><path class="f" d="M700 95 L665 95" marker-end="url(#a)"/><path class="f" d="M515 95 L480 95" marker-end="url(#a)"/><path class="f" d="M330 95 L295 95" marker-end="url(#a)"/><path class="f" d="M220 130 L220 265 L324 265" marker-end="url(#a)"/><path class="rt" d="M330 265 L775 265 L775 134" marker-end="url(#b)"/><text class="m" x="550" y="255" text-anchor="middle">وہی اشاریہ دوبارہ، یا اگلا</text><rect class="br" x="460" y="330" width="390" height="92" rx="6"/><text class="h" x="838" y="354" text-anchor="end">کہاں ٹوٹتا ہے، پہلی جگہ</text><text class="m" x="838" y="376" text-anchor="end">ایک ساتھ بہت سارے اشاریے لینا۔ پانچ اشاریے پانچ آدھی</text><text class="m" x="838" y="394" text-anchor="end">ناپی چیزیں دیں گے اور کوئی ایسی تبدیلی نہیں جس کی</text><text class="m" x="838" y="412" text-anchor="end">نسبت کسی چیز سے ہو سکے۔</text><rect class="br" x="30" y="330" width="400" height="92" rx="6"/><text class="h" x="408" y="354" text-anchor="end">کہاں ٹوٹتا ہے، دوسری جگہ</text><text class="m" x="408" y="376" text-anchor="end">مشق کے بجائے شہادت بدلنا۔ اگر منزل 5 منزل 2</text><text class="m" x="408" y="394" text-anchor="end">سے آسان چیز ناپے، تو چکر ہمیشہ</text><text class="m" x="408" y="412" text-anchor="end">بہتری دکھائے گا۔</text><text class="m" x="758" y="438" text-anchor="end">چکر سستا ہے۔ اسے کام کرنے والی چیز یہ ہے کہ منزل 5 منزل 2 کو بالکل دہراتی ہے، اور یہ کہ منزل 1</text><text class="m" x="758" y="456" text-anchor="end">اشاریہ چننے میں دیانتدار تھی۔</text><text class="wm" x="868" y="456" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
