<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four uses of one standard, and where they pull apart</title><desc id="d">Concept map of a professional standard at the centre with four branches - initial training, continuing development, appraisal, and public accountability - each noting what that use requires and marking that the uses can conflict.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .n2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} .cf{stroke:var(--a3);stroke-width:2;stroke-dasharray:5 4;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="460"/><rect class="ctr" x="350" y="196" width="200" height="60" rx="8"/><text class="h" x="450" y="220" text-anchor="middle">A professional</text><text class="h" x="450" y="240" text-anchor="middle">standard</text><rect class="n1" x="30" y="40" width="300" height="70" rx="6"/><text class="h" x="40" y="64">Guiding initial teacher training</text><text class="m" x="40" y="84">requires: enough detail to build a course on</text><text class="m" x="40" y="102">and a level a beginner can actually reach</text><path class="e" d="M350 210 L336 96" marker-end="url(#a)"/><rect class="n1" x="570" y="40" width="300" height="70" rx="6"/><text class="h" x="580" y="64">Guiding continuing development</text><text class="m" x="580" y="84">requires: room above the entry level, so an</text><text class="m" x="580" y="102">experienced teacher still has somewhere to go</text><path class="e" d="M550 210 L564 96" marker-end="url(#a)"/><rect class="n1" x="30" y="330" width="300" height="70" rx="6"/><text class="h" x="40" y="354">Informing appraisal</text><text class="m" x="40" y="374">requires: observable indicators, comparable</text><text class="m" x="40" y="392">between teachers, and a right of appeal</text><path class="e" d="M350 244 L336 344" marker-end="url(#a)"/><rect class="n2" x="570" y="330" width="300" height="70" rx="6"/><text class="h" x="580" y="354">A public accountability claim</text><text class="m" x="580" y="374">requires: language a parent or minister can</text><text class="m" x="580" y="392">read, and a promise the system can keep</text><path class="e" d="M550 244 L564 344" marker-end="url(#a)"/><path class="cf" d="M330 75 L570 365"/><path class="cf" d="M330 365 L570 75"/><rect class="n2" x="352" y="292" width="196" height="40" rx="5"/><text class="m" x="450" y="308" text-anchor="middle">The four uses can conflict.</text><text class="m" x="450" y="324" text-anchor="middle">Detail for training reads as</text><text class="m" x="450" y="424" text-anchor="middle">bureaucracy in appraisal; language simple enough for the public is too coarse to develop anyone.</text><text class="m" x="450" y="444" text-anchor="middle">A standard written for all four at once serves each of them a little worse.</text><text class="wm" x="888" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
