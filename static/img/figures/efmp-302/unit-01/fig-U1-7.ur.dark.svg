<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں تدریس کیسے ایک پیشے کی طرف بڑھی</title><desc id="d">بائیں سے دائیں ایک ٹائم لائن جس میں پانچ مرحلے ہیں: کام پر سیکھا جانے والا ایک پیشہ (نوکری)؛ اساتذہ کی تربیت کے ادارے کھلتے ہیں؛ پڑھانے کے لیے سند لازمی ہو جاتی ہے؛ تحریری ضابطہ اخلاق اپنایا جاتا ہے؛ اساتذہ کے قومی پیشہ ورانہ معیارات مقرر ہوتے ہیں۔ تیر سفر کی سمت دکھاتا ہے، ٹھیک تاریخیں نہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .axis { stroke: var(--ink); stroke-width: 2.5; fill: none; } .tick { stroke: var(--ink); stroke-width: 2.5; } .dot { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; } .ah { fill: var(--ink); } text { font-size: 14px; fill: var(--ink); } .h { font-weight: 700; font-size: 15px; } .cap { font-size: 13px; fill: var(--muted); } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a7u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="380"/><path class="axis" d="M48 196 L852 196" marker-end="url(#a7u)"/><g class="tick"><path d="M120 186 L120 206"/><path d="M290 186 L290 206"/><path d="M456 186 L456 206"/><path d="M622 186 L622 206"/><path d="M788 186 L788 206"/></g><circle class="dot" cx="120" cy="196" r="6"/><circle class="dot" cx="290" cy="196" r="6"/><circle class="dot" cx="456" cy="196" r="6"/><circle class="dot" cx="622" cy="196" r="6"/><circle class="dot" cx="788" cy="196" r="6"/><text class="h" x="120" y="96" text-anchor="middle">پیشہ (نوکری)</text><text x="120" y="116" text-anchor="middle">کام پر سیکھا گیا</text><text class="h" x="290" y="272" text-anchor="middle">تربیتی ادارے</text><text x="290" y="292" text-anchor="middle">کالج اساتذہ کو تیار کرتے ہیں</text><text class="h" x="456" y="96" text-anchor="middle">ایک سند</text><text x="456" y="116" text-anchor="middle">اب پڑھانے کے لیے لازمی</text><text class="h" x="622" y="272" text-anchor="middle">ضابطہ اخلاق</text><text x="622" y="292" text-anchor="middle">مشترکہ اخلاقی اصول</text><text class="h" x="788" y="96" text-anchor="middle">قومی معیارات</text><text x="788" y="116" text-anchor="middle">ہر استاد کو کیا آنا</text><text x="788" y="134" text-anchor="middle">اور کرنا چاہیے</text><text class="cap" x="450" y="352" text-anchor="middle">سفر کی سمت، ٹھیک تاریخیں نہیں</text><text class="wm" x="12" y="370" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>