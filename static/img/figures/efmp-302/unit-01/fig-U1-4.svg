<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six influences that shape a teacher's professional identity</title><desc id="d">A central question, "who am I becoming as a teacher?", with arrows into it from six influences: my own schooling, family and community, national policy and standards, beliefs about learning, the pupils in front of me, and mentors and colleagues.</desc><style> .bg { fill: #ffffff; } .node { fill: #f4f5f7; stroke: #1c1e21; stroke-width: 2.5; } .box { fill: #ffffff; stroke: #1c1e21; stroke-width: 2; } .arw { stroke: #1c1e21; stroke-width: 2.5; fill: none; } .ah { fill: #1c1e21; } text { font-size: 15px; fill: #1c1e21; } .q { font-size: 17px; font-weight: 700; fill: #1c1e21; } @media (prefers-color-scheme: dark) { .bg { fill: #1b1b1d; } .node { fill: #2a2a2c; stroke: #e3e3e3; } .box { fill: #1b1b1d; stroke: #e3e3e3; } .arw { stroke: #e3e3e3; } .ah { fill: #e3e3e3; } text { fill: #e3e3e3; } .q { fill: #e3e3e3; } } </style><defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="520"/><g class="arw"><path d="M248 96 L336 214" marker-end="url(#a4)"/><path d="M248 260 L306 260" marker-end="url(#a4)"/><path d="M248 424 L336 306" marker-end="url(#a4)"/><path d="M612 96 L524 214" marker-end="url(#a4)"/><path d="M612 260 L554 260" marker-end="url(#a4)"/><path d="M612 424 L524 306" marker-end="url(#a4)"/></g><ellipse class="node" cx="430" cy="260" rx="118" ry="66"/><text class="q" x="430" y="248" text-anchor="middle">who am I</text><text class="q" x="430" y="270" text-anchor="middle">becoming as</text><text class="q" x="430" y="292" text-anchor="middle">a teacher?</text><rect class="box" x="24" y="62" width="224" height="60" rx="6"/><text x="136" y="98" text-anchor="middle">my own schooling</text><rect class="box" x="24" y="222" width="224" height="76" rx="6"/><text x="136" y="252" text-anchor="middle">beliefs about how</text><text x="136" y="274" text-anchor="middle">learning happens</text><rect class="box" x="24" y="398" width="224" height="60" rx="6"/><text x="136" y="434" text-anchor="middle">the pupils in front of me</text><rect class="box" x="612" y="62" width="224" height="60" rx="6"/><text x="724" y="98" text-anchor="middle">family and community</text><rect class="box" x="612" y="222" width="224" height="76" rx="6"/><text x="724" y="252" text-anchor="middle">national policy</text><text x="724" y="274" text-anchor="middle">and standards</text><rect class="box" x="612" y="398" width="224" height="60" rx="6"/><text x="724" y="434" text-anchor="middle">mentors and colleagues</text></svg>
