<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six influences that shape a teacher's professional identity</title><desc id="d">A central question, "who am I becoming as a teacher?", with arrows into it from six influences: my own schooling, family and community, national policy and standards, beliefs about learning, the pupils in front of me, and mentors and colleagues.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .node { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; } .box { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .arw { stroke: var(--a1); stroke-width: 2.5; fill: none; } .ah { fill: var(--a1); } text { font-size: 15px; fill: var(--ink); } .q { font-size: 17px; font-weight: 700; fill: var(--ink); } .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="100%"/><g class="arw"><path d="M248 96 L336 214" marker-end="url(#a4)"/><path d="M248 260 L306 260" marker-end="url(#a4)"/><path d="M248 424 L336 306" marker-end="url(#a4)"/><path d="M612 96 L524 214" marker-end="url(#a4)"/><path d="M612 260 L554 260" marker-end="url(#a4)"/><path d="M612 424 L524 306" marker-end="url(#a4)"/></g><ellipse class="node" cx="430" cy="260" rx="118" ry="66"/><text class="q" x="430" y="248" text-anchor="middle">who am I</text><text class="q" x="430" y="270" text-anchor="middle">becoming as</text><text class="q" x="430" y="292" text-anchor="middle">a teacher?</text><rect class="box" x="24" y="62" width="224" height="60" rx="6"/><text x="136" y="98" text-anchor="middle">my own schooling</text><rect class="box" x="24" y="222" width="224" height="76" rx="6"/><text x="136" y="252" text-anchor="middle">beliefs about how</text><text x="136" y="274" text-anchor="middle">learning happens</text><rect class="box" x="24" y="398" width="224" height="60" rx="6"/><text x="136" y="424" text-anchor="middle"><tspan x="136" dy="0">the pupils in front</tspan><tspan x="136" dy="20">of me</tspan></text><rect class="box" x="612" y="62" width="224" height="60" rx="6"/><text x="724" y="98" text-anchor="middle">family and community</text><rect class="box" x="612" y="222" width="224" height="76" rx="6"/><text x="724" y="252" text-anchor="middle">national policy</text><text x="724" y="274" text-anchor="middle">and standards</text><rect class="box" x="612" y="398" width="224" height="60" rx="6"/><text x="724" y="424" text-anchor="middle"><tspan x="724" dy="0">mentors and</tspan><tspan x="724" dy="20">colleagues</tspan></text><text class="wm" x="848" y="560" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
