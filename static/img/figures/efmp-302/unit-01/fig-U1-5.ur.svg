<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک پیشہ، اس کی چار خصوصیات، اور یہ کیا نہیں</title><desc id="d">ایک تصوراتی نقشہ جس کے مرکز میں "ایک پیشہ" ہے۔ ٹھوس لکیریں اسے چار خصوصیات سے جوڑتی ہیں: خصوصی علم، طویل رسمی تربیت اور سند، مشترکہ ضابطہ اخلاق، اور پیشہ ورانہ ادارے کے سامنے جوابدہی۔ نقطہ دار لکیریں اسے اُن تصورات سے الگ کرتی ہیں جو یہ محض نہیں: نوکری، ذوق، اور نیم پیشہ۔</desc><style> .bg { fill: #ffffff; } .core { fill: #f4f5f7; stroke: #1c1e21; stroke-width: 2.5; } .mark { fill: #ffffff; stroke: #1c1e21; stroke-width: 2; } .not { fill: #ffffff; stroke: #1c1e21; stroke-width: 2; stroke-dasharray: 6 5; } .link { stroke: #1c1e21; stroke-width: 2.5; fill: none; } .dlink { stroke: #1c1e21; stroke-width: 2; fill: none; stroke-dasharray: 6 5; } .ah { fill: #1c1e21; } text { font-size: 15px; fill: #1c1e21; } .c { font-size: 17px; font-weight: 700; } .rel { font-size: 13px; fill: #6b7280; } @media (prefers-color-scheme: dark) { .bg { fill: #1b1b1d; } .core { fill: #2a2a2c; stroke: #e3e3e3; } .mark { fill: #1b1b1d; stroke: #e3e3e3; } .not { fill: #1b1b1d; stroke: #e3e3e3; } .link { stroke: #e3e3e3; } .dlink { stroke: #e3e3e3; } .ah { fill: #e3e3e3; } text { fill: #e3e3e3; } .rel { fill: #9aa0a6; } } </style><defs><marker id="a5u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="480"/><g class="link"><path d="M556 128 L612 60" marker-end="url(#a5u)"/><path d="M560 200 L612 180" marker-end="url(#a5u)"/><path d="M560 280 L612 300" marker-end="url(#a5u)"/><path d="M556 352 L612 420" marker-end="url(#a5u)"/></g><g class="dlink"><path d="M324 128 L268 60"/><path d="M320 240 L268 240"/><path d="M324 352 L268 420"/></g><text class="rel" x="470" y="120" text-anchor="middle">خصوصیات</text><text class="rel" x="410" y="120" text-anchor="middle">محض نہیں</text><ellipse class="core" cx="440" cy="240" rx="104" ry="60"/><text class="c" x="440" y="235" text-anchor="middle">ایک پیشہ</text><text x="440" y="258" text-anchor="middle" class="rel">(تدریس اُن میں سے)</text><rect class="mark" x="612" y="30" width="244" height="56" rx="6"/><text x="734" y="64" text-anchor="middle">خصوصی علم</text><rect class="mark" x="612" y="150" width="244" height="72" rx="6"/><text x="734" y="180" text-anchor="middle">طویل رسمی تربیت</text><text x="734" y="202" text-anchor="middle">اور سند</text><rect class="mark" x="612" y="270" width="244" height="56" rx="6"/><text x="734" y="304" text-anchor="middle">مشترکہ ضابطہ اخلاق</text><rect class="mark" x="612" y="392" width="244" height="72" rx="6"/><text x="734" y="422" text-anchor="middle">پیشہ ورانہ ادارے کے</text><text x="734" y="444" text-anchor="middle">سامنے جوابدہی</text><rect class="not" x="24" y="32" width="244" height="56" rx="6"/><text x="146" y="66" text-anchor="middle">نوکری (ایک کام)</text><rect class="not" x="24" y="212" width="244" height="56" rx="6"/><text x="146" y="246" text-anchor="middle">ذوق (ایک بلاوا)</text><rect class="not" x="24" y="392" width="244" height="72" rx="6"/><text x="146" y="422" text-anchor="middle">نیم پیشہ (کچھ خصوصیات،</text><text x="146" y="444" text-anchor="middle">سب نہیں)</text></svg>
