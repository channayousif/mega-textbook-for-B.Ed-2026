<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 484" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تدریس کے تین تقاضے مشترکہ بنیاد پر توازن میں</title><desc id="d">ایک مثلث جس کے تین کونے جوابدہی، خود مختاری اور ہم پیشہ تعاون ہیں، اور بنیاد پر خصوصی علم اور تربیت — عنوان "توازن میں"۔</desc><style> .bg { fill: #ffffff; } .tri { fill: none; stroke: #1c1e21; stroke-width: 2.5; stroke-linejoin: round; } .dot { fill: #1c1e21; } .base { fill: #f4f5f7; stroke: #1c1e21; stroke-width: 2.5; } text { font-size: 15px; fill: #1c1e21; } .h { font-weight: 700; } .cap { font-size: 14px; fill: #6b7280; } @media (prefers-color-scheme: dark) { .bg { fill: #1b1b1d; } .tri { stroke: #e3e3e3; } .dot { fill: #e3e3e3; } .base { fill: #2a2a2c; stroke: #e3e3e3; } text { fill: #e3e3e3; } .cap { fill: #9aa0a6; } } </style><rect class="bg" x="0" y="0" width="420" height="484"/><polygon class="tri" points="210,78 66,326 354,326"/><circle class="dot" cx="210" cy="78" r="5"/><circle class="dot" cx="66" cy="326" r="5"/><circle class="dot" cx="354" cy="326" r="5"/><text class="h" x="210" y="52" text-anchor="middle">جوابدہی</text><text class="h" x="66" y="352" text-anchor="middle">خود مختاری</text><text class="h" x="354" y="352" text-anchor="middle">ہم پیشہ تعاون</text><rect class="base" x="44" y="382" width="332" height="48"/><text x="210" y="412" text-anchor="middle">خصوصی علم اور تربیت</text><text class="cap" x="210" y="462" text-anchor="middle">توازن میں</text></svg>
