<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The reflective practice cycle</title><desc id="d">A repeating cycle of five steps: teach the lesson; notice what actually happened; ask why it happened; read or talk it over with a colleague; adjust the plan. A return arrow leads from the last step back to teaching the lesson again.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .box { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .arw { stroke: var(--a1); stroke-width: 2.5; fill: none; } .ret { stroke: var(--a3); stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; } .ah { fill: var(--a1); } text { font-size: 15px; fill: var(--ink); } .n { font-weight: 700; fill: var(--muted); font-size: 13px; } .cap { font-size: 13px; fill: var(--muted); font-style: italic; } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="560"/><g class="arw"><path d="M230 74 L230 104" marker-end="url(#a8)"/><path d="M230 168 L230 198" marker-end="url(#a8)"/><path d="M230 262 L230 292" marker-end="url(#a8)"/><path d="M230 356 L230 386" marker-end="url(#a8)"/></g><path class="ret" d="M410 460 C 560 460 560 40 410 40" marker-end="url(#a8)"/><text class="cap" x="516" y="256" text-anchor="middle" transform="rotate(90 516 256)">then teach again</text><rect class="box" x="60" y="20" width="340" height="50" rx="8"/><text class="n" x="80" y="42">1</text><text x="230" y="50" text-anchor="middle">teach the lesson</text><rect class="box" x="60" y="114" width="340" height="50" rx="8"/><text class="n" x="80" y="136">2</text><text x="230" y="144" text-anchor="middle">notice what actually happened</text><rect class="box" x="60" y="208" width="340" height="50" rx="8"/><text class="n" x="80" y="230">3</text><text x="230" y="238" text-anchor="middle">ask why it happened</text><rect class="box" x="60" y="302" width="340" height="50" rx="8"/><text class="n" x="80" y="324">4</text><text x="230" y="332" text-anchor="middle">read or talk it over with a colleague</text><rect class="box" x="60" y="396" width="340" height="50" rx="8"/><text class="n" x="80" y="418">5</text><text x="230" y="426" text-anchor="middle">adjust the plan</text><text class="wm" x="628" y="550" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>