<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دو طرح کے اسباق میں طالب علم کے غیر متوقع سوال کا انجام</title><desc id="d">ایک بہاؤ چارٹ۔ ایک طالب علم غیر متوقع سوال پوچھتا ہے۔ صنعتی سبق میں مرحلے یہ ہیں: کیا یہ آج کے خاکے میں فٹ ہے، نہیں تو بعد کے لیے روک لیں، جماعت منصوبے کی طرف لوٹتی ہے، سوال ایک طرف رکھ دیا جاتا ہے۔ استفساری سبق میں مرحلے یہ ہیں: یہ کون سی سوچ کھولتا ہے، جماعت مل کر اس کی چھان بین کرتی ہے، نئے خیالات اور سوال اُبھرتے ہیں، سبق اُسی کے پیچھے مڑ جاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .box { fill: var(--bg); stroke: var(--ink); stroke-width: 2; } .head { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; } .start { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; } .arw { stroke: var(--ink); stroke-width: 2.5; fill: none; } .ah { fill: var(--ink); } text { font-size: 15px; fill: var(--ink); } .h { font-weight: 700; font-size: 16px; } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a6u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="600"/><rect class="start" x="270" y="20" width="280" height="54" rx="6"/><text class="h" x="410" y="52" text-anchor="middle">طالب علم غیر متوقع سوال پوچھتا ہے</text><g class="arw"><path d="M360 74 L215 112" marker-end="url(#a6u)"/><path d="M460 74 L605 112" marker-end="url(#a6u)"/></g><rect class="head" x="55" y="116" width="320" height="44" rx="6"/><text class="h" x="215" y="144" text-anchor="middle">صنعتی سبق</text><rect class="head" x="445" y="116" width="320" height="44" rx="6"/><text class="h" x="605" y="144" text-anchor="middle">استفساری سبق</text><g class="arw"><path d="M215 214 L215 250" marker-end="url(#a6u)"/><path d="M215 320 L215 356" marker-end="url(#a6u)"/><path d="M215 426 L215 462" marker-end="url(#a6u)"/><path d="M605 214 L605 250" marker-end="url(#a6u)"/><path d="M605 320 L605 356" marker-end="url(#a6u)"/><path d="M605 426 L605 462" marker-end="url(#a6u)"/></g><rect class="box" x="55" y="176" width="320" height="40" rx="6"/><text x="215" y="201" text-anchor="middle">کیا یہ آج کے خاکے میں فٹ ہے؟</text><rect class="box" x="55" y="282" width="320" height="40" rx="6"/><text x="215" y="307" text-anchor="middle">نہیں، تو بعد کے لیے روک لیں</text><rect class="box" x="55" y="388" width="320" height="40" rx="6"/><text x="215" y="413" text-anchor="middle">جماعت منصوبے کی طرف لوٹتی ہے</text><rect class="box" x="55" y="464" width="320" height="52" rx="6"/><text x="215" y="496" text-anchor="middle">سوال ایک طرف رکھ دیا جاتا ہے</text><rect class="box" x="445" y="176" width="320" height="40" rx="6"/><text x="605" y="201" text-anchor="middle">یہ کون سی سوچ کھولتا ہے؟</text><rect class="box" x="445" y="282" width="320" height="40" rx="6"/><text x="605" y="307" text-anchor="middle">جماعت مل کر چھان بین کرتی ہے</text><rect class="box" x="445" y="388" width="320" height="40" rx="6"/><text x="605" y="413" text-anchor="middle">نئے خیالات اور سوال اُبھرتے ہیں</text><rect class="box" x="445" y="464" width="320" height="52" rx="6"/><text x="605" y="496" text-anchor="middle">سبق اُسی کے پیچھے مڑ جاتا ہے</text><text class="wm" x="12" y="590" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>