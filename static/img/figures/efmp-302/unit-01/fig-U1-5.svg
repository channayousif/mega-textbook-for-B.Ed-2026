<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A profession, its four marks, and what it is not</title><desc id="d">A concept map with "a profession" at the centre. Solid links join it to four marks: specialised knowledge, long formal training and a qualification, a shared code of conduct, and accountability to a professional body. Dashed links set it apart from an occupation, a vocation, and a semi-profession.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .core { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .mark { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .not { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; stroke-dasharray: 6 5; } .link { stroke: var(--a1); stroke-width: 2.5; fill: none; } .dlink { stroke: var(--a3); stroke-width: 2; fill: none; stroke-dasharray: 6 5; } .ah { fill: var(--a1); } text { font-size: 15px; fill: var(--ink); } .c { font-size: 17px; font-weight: 700; } .rel { font-size: 13px; fill: var(--muted); font-style: italic; } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="480"/><g class="link"><path d="M556 128 L612 60" marker-end="url(#a5)"/><path d="M560 200 L612 180" marker-end="url(#a5)"/><path d="M560 280 L612 300" marker-end="url(#a5)"/><path d="M556 352 L612 420" marker-end="url(#a5)"/></g><g class="dlink"><path d="M324 128 L268 60"/><path d="M320 240 L268 240"/><path d="M324 352 L268 420"/></g><text class="rel" x="470" y="120" text-anchor="middle">is marked by</text><text class="rel" x="410" y="120" text-anchor="middle">is not just</text><ellipse class="core" cx="440" cy="240" rx="104" ry="60"/><text class="c" x="440" y="235" text-anchor="middle">a profession</text><text x="440" y="258" text-anchor="middle" class="rel">(teaching among them)</text><rect class="mark" x="612" y="30" width="244" height="56" rx="6"/><text x="734" y="64" text-anchor="middle">specialised knowledge</text><rect class="mark" x="612" y="150" width="244" height="72" rx="6"/><text x="734" y="180" text-anchor="middle">long formal training</text><text x="734" y="202" text-anchor="middle">and a qualification</text><rect class="mark" x="612" y="270" width="244" height="56" rx="6"/><text x="734" y="304" text-anchor="middle">a shared code of conduct</text><rect class="mark" x="612" y="392" width="244" height="72" rx="6"/><text x="734" y="422" text-anchor="middle">accountability to a</text><text x="734" y="444" text-anchor="middle">professional body</text><rect class="not" x="24" y="32" width="244" height="56" rx="6"/><text x="146" y="66" text-anchor="middle">an occupation (a job)</text><rect class="not" x="24" y="212" width="244" height="56" rx="6"/><text x="146" y="246" text-anchor="middle">a vocation (a calling)</text><rect class="not" x="24" y="392" width="244" height="72" rx="6"/><text x="146" y="422" text-anchor="middle">a semi-profession (some</text><text x="146" y="444" text-anchor="middle">marks, not all)</text><text class="wm" x="868" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>