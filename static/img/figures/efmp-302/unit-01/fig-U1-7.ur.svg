<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں تدریس کیسے ایک پیشے کی طرف بڑھی</title><desc id="d">دائیں سے بائیں ایک ٹائم لائن جس میں پانچ مرحلے ہیں: کام پر سیکھا جانے والا ایک پیشہ (نوکری)؛ اساتذہ کی تربیت کے ادارے کھلتے ہیں؛ پڑھانے کے لیے سند لازمی ہو جاتی ہے؛ تحریری ضابطہ اخلاق اپنایا جاتا ہے؛ اساتذہ کے قومی پیشہ ورانہ معیارات مقرر ہوتے ہیں۔ تیر سفر کی سمت دکھاتا ہے، ٹھیک تاریخیں نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .axis { stroke: var(--ink); stroke-width: 2.5; fill: none; } .tick { stroke: var(--ink); stroke-width: 2.5; } .dot { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .ah { fill: var(--ink); } text { font-size: 14px; fill: var(--ink); } .h { font-weight: 700; font-size: 15px; } .cap { font-size: 13px; fill: var(--muted); } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a7u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="380"/><path class="axis" d="M852 196 L48 196" marker-end="url(#a7u)"/><g class="tick"><path d="M780 186 L780 206"/><path d="M610 186 L610 206"/><path d="M444 186 L444 206"/><path d="M278 186 L278 206"/><path d="M112 186 L112 206"/></g><circle class="dot" cx="780" cy="196" r="6"/><circle class="dot" cx="610" cy="196" r="6"/><circle class="dot" cx="444" cy="196" r="6"/><circle class="dot" cx="278" cy="196" r="6"/><circle class="dot" cx="112" cy="196" r="6"/><text class="h" x="780" y="96" text-anchor="middle">پیشہ (نوکری)</text><text x="780" y="116" text-anchor="middle">کام پر سیکھا گیا</text><text class="h" x="610" y="272" text-anchor="middle">تربیتی ادارے</text><text x="610" y="292" text-anchor="middle">کالج اساتذہ کو تیار کرتے ہیں</text><text class="h" x="444" y="96" text-anchor="middle">ایک سند</text><text x="444" y="116" text-anchor="middle">اب پڑھانے کے لیے لازمی</text><text class="h" x="278" y="272" text-anchor="middle">ضابطہ اخلاق</text><text x="278" y="292" text-anchor="middle">مشترکہ اخلاقی اصول</text><text class="h" x="112" y="96" text-anchor="middle">قومی معیارات</text><text x="112" y="116" text-anchor="middle">ہر استاد کو کیا آنا</text><text x="112" y="134" text-anchor="middle">اور کرنا چاہیے</text><text class="cap" x="450" y="352" text-anchor="middle">سفر کی سمت، ٹھیک تاریخیں نہیں</text><text class="wm" x="888" y="370" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>