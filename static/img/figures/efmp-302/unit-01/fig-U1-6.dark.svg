<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What happens to a pupil's unplanned question in two kinds of lesson</title><desc id="d">A flowchart. A pupil asks an unplanned question. In an industrial lesson the steps are: does it fit today's script, no so hold it for later, the class returns to the plan, the question is set aside. In an inquiry lesson the steps are: what thinking does it open up, the class investigates it together, new ideas and questions appear, the lesson bends to follow it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .box { fill: var(--bg); stroke: var(--ink); stroke-width: 2; } .head { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; } .start { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; } .arw { stroke: var(--ink); stroke-width: 2.5; fill: none; } .ah { fill: var(--ink); } text { font-size: 15px; fill: var(--ink); } .h { font-weight: 700; font-size: 16px; } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="600"/><rect class="start" x="270" y="20" width="280" height="54" rx="6"/><text class="h" x="410" y="52" text-anchor="middle">a pupil asks an unplanned question</text><g class="arw"><path d="M360 74 L215 112" marker-end="url(#a6)"/><path d="M460 74 L605 112" marker-end="url(#a6)"/></g><rect class="head" x="55" y="116" width="320" height="44" rx="6"/><text class="h" x="215" y="144" text-anchor="middle">industrial lesson</text><rect class="head" x="445" y="116" width="320" height="44" rx="6"/><text class="h" x="605" y="144" text-anchor="middle">inquiry lesson</text><g class="arw"><path d="M215 214 L215 250" marker-end="url(#a6)"/><path d="M215 320 L215 356" marker-end="url(#a6)"/><path d="M215 426 L215 462" marker-end="url(#a6)"/><path d="M605 214 L605 250" marker-end="url(#a6)"/><path d="M605 320 L605 356" marker-end="url(#a6)"/><path d="M605 426 L605 462" marker-end="url(#a6)"/></g><rect class="box" x="55" y="176" width="320" height="40" rx="6"/><text x="215" y="201" text-anchor="middle">does it fit today's script?</text><rect class="box" x="55" y="282" width="320" height="40" rx="6"/><text x="215" y="307" text-anchor="middle">no, so hold it for later</text><rect class="box" x="55" y="388" width="320" height="40" rx="6"/><text x="215" y="413" text-anchor="middle">the class returns to the plan</text><rect class="box" x="55" y="464" width="320" height="52" rx="6"/><text x="215" y="496" text-anchor="middle">the question is set aside</text><rect class="box" x="445" y="176" width="320" height="40" rx="6"/><text x="605" y="201" text-anchor="middle">what thinking does it open up?</text><rect class="box" x="445" y="282" width="320" height="40" rx="6"/><text x="605" y="307" text-anchor="middle">the class investigates it together</text><rect class="box" x="445" y="388" width="320" height="40" rx="6"/><text x="605" y="413" text-anchor="middle">new ideas and questions appear</text><rect class="box" x="445" y="464" width="320" height="52" rx="6"/><text x="605" y="496" text-anchor="middle">the lesson bends to follow it</text><text class="wm" x="808" y="590" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>