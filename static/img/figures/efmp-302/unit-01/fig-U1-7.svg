<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How teaching in Pakistan moved toward being a profession</title><desc id="d">A left-to-right timeline with five stages: teaching held as an occupation and learnt on the job; teacher training institutions open; a teaching qualification becomes required; a written code of conduct is adopted; national professional standards for teachers are set. The arrow shows direction of travel, not exact dates.</desc><style> .bg { fill: #ffffff; } .axis { stroke: #1c1e21; stroke-width: 2.5; fill: none; } .tick { stroke: #1c1e21; stroke-width: 2.5; } .dot { fill: #f4f5f7; stroke: #1c1e21; stroke-width: 2.5; } .ah { fill: #1c1e21; } text { font-size: 14px; fill: #1c1e21; } .h { font-weight: 700; font-size: 15px; } .cap { font-size: 13px; fill: #6b7280; font-style: italic; } @media (prefers-color-scheme: dark) { .bg { fill: #1b1b1d; } .axis { stroke: #e3e3e3; } .tick { stroke: #e3e3e3; } .dot { fill: #2a2a2c; stroke: #e3e3e3; } .ah { fill: #e3e3e3; } text { fill: #e3e3e3; } .cap { fill: #9aa0a6; } } </style><defs><marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="380"/><path class="axis" d="M48 196 L852 196" marker-end="url(#a7)"/><g class="tick"><path d="M120 186 L120 206"/><path d="M290 186 L290 206"/><path d="M456 186 L456 206"/><path d="M622 186 L622 206"/><path d="M788 186 L788 206"/></g><circle class="dot" cx="120" cy="196" r="6"/><circle class="dot" cx="290" cy="196" r="6"/><circle class="dot" cx="456" cy="196" r="6"/><circle class="dot" cx="622" cy="196" r="6"/><circle class="dot" cx="788" cy="196" r="6"/><text class="h" x="120" y="96" text-anchor="middle">an occupation</text><text x="120" y="116" text-anchor="middle">learnt on the job</text><text class="h" x="290" y="272" text-anchor="middle">training institutions</text><text x="290" y="292" text-anchor="middle">colleges prepare teachers</text><text class="h" x="456" y="96" text-anchor="middle">a qualification</text><text x="456" y="116" text-anchor="middle">now required to teach</text><text class="h" x="622" y="272" text-anchor="middle">a code of conduct</text><text x="622" y="292" text-anchor="middle">shared ethical rules</text><text class="h" x="788" y="96" text-anchor="middle">national standards</text><text x="788" y="116" text-anchor="middle">what every teacher</text><text x="788" y="134" text-anchor="middle">must know and do</text><text class="cap" x="450" y="352" text-anchor="middle">direction of travel, not exact dates</text></svg>
