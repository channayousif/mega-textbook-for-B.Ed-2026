<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 452" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پیشے کی چار خصوصیات، تین کاموں کے موازنے میں</title><desc id="d">استاد، دکاندار اور ڈاکٹر کا پیشے کی چار خصوصیات کے خلاف موازنہ کرنے والا نقشہ - استاد اور ڈاکٹر چاروں پر پورا اترتے ہیں، دکاندار کسی پر نہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .grid { stroke: var(--ink); stroke-width: 2; fill: none; } .cellhdr { fill: var(--panel); } text { font-size: 14px; fill: var(--ink); } .h { font-size: 13px; font-weight: 700; } .g { stroke: var(--ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; } .w { font-size: 13px; fill: var(--muted); } .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="772" height="452"/><rect class="cellhdr" x="16" y="16" width="740" height="60"/><rect class="grid" x="16" y="16" width="740" height="420"/><line class="grid" x1="300" y1="16" x2="300" y2="436"/><line class="grid" x1="452" y1="16" x2="452" y2="436"/><line class="grid" x1="604" y1="16" x2="604" y2="436"/><line class="grid" x1="16" y1="76" x2="756" y2="76"/><line class="grid" x1="16" y1="166" x2="756" y2="166"/><line class="grid" x1="16" y1="256" x2="756" y2="256"/><line class="grid" x1="16" y1="346" x2="756" y2="346"/><text class="h" x="158" y="50" text-anchor="middle">پیشے کی خصوصیت</text><text class="h" x="376" y="42" text-anchor="middle">سرکاری اسکول</text><text class="h" x="376" y="62" text-anchor="middle">کا استاد</text><text class="h" x="528" y="50" text-anchor="middle">دکاندار</text><text class="h" x="680" y="50" text-anchor="middle">ڈاکٹر</text><text x="28" y="126">خصوصی علم</text><text x="28" y="205">طویل تربیت</text><text x="28" y="227">اور سند</text><text x="28" y="306">ضابطہ اخلاق</text><text x="28" y="389">پیشہ ورانہ برادری کے</text><text x="28" y="411">سامنے جوابدہی</text><g class="g"><path d="M368 118 l6 8 l14 -18"/></g><text class="w" x="376" y="146" text-anchor="middle">ہاں</text><g class="g"><path d="M368 208 l6 8 l14 -18"/></g><text class="w" x="376" y="236" text-anchor="middle">ہاں</text><g class="g"><path d="M368 298 l6 8 l14 -18"/></g><text class="w" x="376" y="326" text-anchor="middle">ہاں</text><g class="g"><path d="M368 388 l6 8 l14 -18"/></g><text class="w" x="376" y="416" text-anchor="middle">ہاں</text><g class="g"><path d="M520 114 l16 16 M536 114 l-16 16"/></g><text class="w" x="528" y="146" text-anchor="middle">نہیں</text><g class="g"><path d="M520 204 l16 16 M536 204 l-16 16"/></g><text class="w" x="528" y="236" text-anchor="middle">نہیں</text><g class="g"><path d="M520 294 l16 16 M536 294 l-16 16"/></g><text class="w" x="528" y="326" text-anchor="middle">نہیں</text><g class="g"><path d="M520 384 l16 16 M536 384 l-16 16"/></g><text class="w" x="528" y="416" text-anchor="middle">نہیں</text><g class="g"><path d="M672 118 l6 8 l14 -18"/></g><text class="w" x="680" y="146" text-anchor="middle">ہاں</text><g class="g"><path d="M672 208 l6 8 l14 -18"/></g><text class="w" x="680" y="236" text-anchor="middle">ہاں</text><g class="g"><path d="M672 298 l6 8 l14 -18"/></g><text class="w" x="680" y="326" text-anchor="middle">ہاں</text><g class="g"><path d="M672 388 l6 8 l14 -18"/></g><text class="w" x="680" y="416" text-anchor="middle">ہاں</text><text class="wm" x="12" y="442" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>