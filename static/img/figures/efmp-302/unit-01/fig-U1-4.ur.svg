<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ اثرات جو استاد کی پیشہ ورانہ شناخت بناتے ہیں</title><desc id="d">ایک مرکزی سوال، "میں بحیثیت استاد کیا بن رہا ہوں؟"، جس میں چھ اثرات سے تیر آتے ہیں: میری اپنی تعلیم، خاندان اور برادری، قومی پالیسی اور معیارات، سیکھنے کے بارے میں عقائد، سامنے موجود طلبہ، اور رہنما اور ساتھی۔</desc><style> .bg { fill: #ffffff; } .node { fill: #f4f5f7; stroke: #1c1e21; stroke-width: 2.5; } .box { fill: #ffffff; stroke: #1c1e21; stroke-width: 2; } .arw { stroke: #1c1e21; stroke-width: 2.5; fill: none; } .ah { fill: #1c1e21; } text { font-size: 14px; fill: #1c1e21; } .q { font-size: 16px; font-weight: 700; fill: #1c1e21; } @media (prefers-color-scheme: dark) { .bg { fill: #1b1b1d; } .node { fill: #2a2a2c; stroke: #e3e3e3; } .box { fill: #1b1b1d; stroke: #e3e3e3; } .arw { stroke: #e3e3e3; } .ah { fill: #e3e3e3; } text { fill: #e3e3e3; } .q { fill: #e3e3e3; } } </style><defs><marker id="a4u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="520"/><g class="arw"><path d="M248 96 L336 214" marker-end="url(#a4u)"/><path d="M248 260 L306 260" marker-end="url(#a4u)"/><path d="M248 424 L336 306" marker-end="url(#a4u)"/><path d="M612 96 L524 214" marker-end="url(#a4u)"/><path d="M612 260 L554 260" marker-end="url(#a4u)"/><path d="M612 424 L524 306" marker-end="url(#a4u)"/></g><ellipse class="node" cx="430" cy="260" rx="118" ry="66"/><text class="q" x="430" y="248" text-anchor="middle">میں بحیثیت</text><text class="q" x="430" y="272" text-anchor="middle">استاد کیا</text><text class="q" x="430" y="296" text-anchor="middle">بن رہا ہوں؟</text><rect class="box" x="24" y="62" width="224" height="60" rx="6"/><text x="136" y="98" text-anchor="middle">میری اپنی تعلیم</text><rect class="box" x="24" y="222" width="224" height="76" rx="6"/><text x="136" y="254" text-anchor="middle">سیکھنے کے بارے میں</text><text x="136" y="278" text-anchor="middle">عقائد</text><rect class="box" x="24" y="398" width="224" height="60" rx="6"/><text x="136" y="434" text-anchor="middle">سامنے موجود طلبہ</text><rect class="box" x="612" y="62" width="224" height="60" rx="6"/><text x="724" y="98" text-anchor="middle">خاندان اور برادری</text><rect class="box" x="612" y="222" width="224" height="76" rx="6"/><text x="724" y="254" text-anchor="middle">قومی پالیسی</text><text x="724" y="278" text-anchor="middle">اور معیارات</text><rect class="box" x="612" y="398" width="224" height="60" rx="6"/><text x="724" y="434" text-anchor="middle">رہنما اور ساتھی</text></svg>
