<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The reflective practice cycle</title><desc id="d">A repeating cycle of five steps: teach the lesson; notice what actually happened; ask why it happened; read or talk it over with a colleague; adjust the plan. A return arrow leads from the last step back to teaching the lesson again.</desc><style> .bg { fill: #ffffff; } .box { fill: #f4f5f7; stroke: #1c1e21; stroke-width: 2.5; } .arw { stroke: #1c1e21; stroke-width: 2.5; fill: none; } .ret { stroke: #1c1e21; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; } .ah { fill: #1c1e21; } text { font-size: 15px; fill: #1c1e21; } .n { font-weight: 700; fill: #6b7280; font-size: 13px; } .cap { font-size: 13px; fill: #6b7280; font-style: italic; } @media (prefers-color-scheme: dark) { .bg { fill: #1b1b1d; } .box { fill: #2a2a2c; stroke: #e3e3e3; } .arw { stroke: #e3e3e3; } .ret { stroke: #e3e3e3; } .ah { fill: #e3e3e3; } text { fill: #e3e3e3; } .n { fill: #9aa0a6; } .cap { fill: #9aa0a6; } } </style><defs><marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="560"/><g class="arw"><path d="M230 74 L230 104" marker-end="url(#a8)"/><path d="M230 168 L230 198" marker-end="url(#a8)"/><path d="M230 262 L230 292" marker-end="url(#a8)"/><path d="M230 356 L230 386" marker-end="url(#a8)"/></g><path class="ret" d="M410 460 C 560 460 560 40 410 40" marker-end="url(#a8)"/><text class="cap" x="516" y="256" text-anchor="middle" transform="rotate(90 516 256)">then teach again</text><rect class="box" x="60" y="20" width="340" height="50" rx="8"/><text class="n" x="80" y="42">1</text><text x="230" y="50" text-anchor="middle">teach the lesson</text><rect class="box" x="60" y="114" width="340" height="50" rx="8"/><text class="n" x="80" y="136">2</text><text x="230" y="144" text-anchor="middle">notice what actually happened</text><rect class="box" x="60" y="208" width="340" height="50" rx="8"/><text class="n" x="80" y="230">3</text><text x="230" y="238" text-anchor="middle">ask why it happened</text><rect class="box" x="60" y="302" width="340" height="50" rx="8"/><text class="n" x="80" y="324">4</text><text x="230" y="332" text-anchor="middle">read or talk it over with a colleague</text><rect class="box" x="60" y="396" width="340" height="50" rx="8"/><text class="n" x="80" y="418">5</text><text x="230" y="426" text-anchor="middle">adjust the plan</text></svg>
