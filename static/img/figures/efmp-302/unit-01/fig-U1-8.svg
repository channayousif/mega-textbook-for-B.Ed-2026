<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The reflective practice cycle</title><desc id="d">A repeating cycle of five steps: teach the lesson; notice what actually happened; ask why it happened; read or talk it over with a colleague; adjust the plan. A return arrow leads from the last step back to teaching the lesson again.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .box { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .arw { stroke: var(--a1); stroke-width: 2.5; fill: none; } .ret { stroke: var(--a3); stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; } .ah { fill: var(--a1); } text { font-size: 15px; fill: var(--ink); } .n { font-weight: 700; fill: var(--muted); font-size: 13px; } .cap { font-size: 13px; fill: var(--muted); font-style: italic; } .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="100%"/><g class="arw"><path d="M230 74 L230 104" marker-end="url(#a8)"/><path d="M230 168 L230 198" marker-end="url(#a8)"/><path d="M230 262 L230 292" marker-end="url(#a8)"/><path d="M230 356 L230 386" marker-end="url(#a8)"/></g><path class="ret" d="M410 460 C 560 460 560 40 410 40" marker-end="url(#a8)"/><text class="cap" x="516" y="256" text-anchor="middle" transform="rotate(90 516 256)">then teach again</text><rect class="box" x="60" y="20" width="340" height="50" rx="8"/><text class="n" x="80" y="42">1</text><text x="230" y="50" text-anchor="middle">teach the lesson</text><rect class="box" x="60" y="114" width="340" height="50" rx="8"/><text class="n" x="80" y="136">2</text><text x="230" y="134" text-anchor="middle"><tspan x="230" dy="0">notice what actually</tspan><tspan x="230" dy="20">happened</tspan></text><rect class="box" x="60" y="208" width="340" height="50" rx="8"/><text class="n" x="80" y="230">3</text><text x="230" y="238" text-anchor="middle">ask why it happened</text><rect class="box" x="60" y="302" width="340" height="50" rx="8"/><text class="n" x="80" y="324">4</text><text x="230" y="322" text-anchor="middle"><tspan x="230" dy="0">read or talk it over with a</tspan><tspan x="230" dy="20">colleague</tspan></text><rect class="box" x="60" y="396" width="340" height="50" rx="8"/><text class="n" x="80" y="418">5</text><text x="230" y="426" text-anchor="middle">adjust the plan</text><text class="wm" x="628" y="600" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
