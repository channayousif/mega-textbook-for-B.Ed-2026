<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">غور و فکر کی مشق کا چکر</title><desc id="d">پانچ مرحلوں کا ایک دہرایا جانے والا چکر: سبق پڑھائیں؛ دیکھیں کہ اصل میں کیا ہوا؛ پوچھیں کیوں ہوا؛ کسی ساتھی کے ساتھ پڑھیں یا بات کریں؛ منصوبہ ایڈجسٹ کریں۔ ایک واپسی کا تیر آخری مرحلے سے دوبارہ سبق پڑھانے کی طرف لے جاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .box { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .arw { stroke: var(--a1); stroke-width: 2.5; fill: none; } .ret { stroke: var(--a3); stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; } .ah { fill: var(--a1); } text { font-size: 15px; fill: var(--ink); } .n { font-weight: 700; fill: var(--muted); font-size: 13px; } .cap { font-size: 13px; fill: var(--muted); } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a8u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="560"/><g class="arw"><path d="M410 74 L410 104" marker-end="url(#a8u)"/><path d="M410 168 L410 198" marker-end="url(#a8u)"/><path d="M410 262 L410 292" marker-end="url(#a8u)"/><path d="M410 356 L410 386" marker-end="url(#a8u)"/></g><path class="ret" d="M230 460 C80 460 80 40 230 40" marker-end="url(#a8u)"/><text class="cap" x="124" y="256" text-anchor="middle" transform="rotate(90 516 256)">پھر دوبارہ پڑھائیں</text><rect class="box" x="240" y="20" width="340" height="50" rx="8"/><text class="n" x="560" y="42" text-anchor="end">1</text><text x="410" y="50" text-anchor="middle">سبق پڑھائیں</text><rect class="box" x="240" y="114" width="340" height="50" rx="8"/><text class="n" x="560" y="136" text-anchor="end">2</text><text x="410" y="144" text-anchor="middle">دیکھیں کہ اصل میں کیا ہوا</text><rect class="box" x="240" y="208" width="340" height="50" rx="8"/><text class="n" x="560" y="230" text-anchor="end">3</text><text x="410" y="238" text-anchor="middle">پوچھیں کیوں ہوا</text><rect class="box" x="240" y="302" width="340" height="50" rx="8"/><text class="n" x="560" y="324" text-anchor="end">4</text><text x="410" y="332" text-anchor="middle">کسی ساتھی کے ساتھ پڑھیں یا بات کریں</text><rect class="box" x="240" y="396" width="340" height="50" rx="8"/><text class="n" x="560" y="418" text-anchor="end">5</text><text x="410" y="426" text-anchor="middle">منصوبہ ایڈجسٹ کریں</text><text class="wm" x="628" y="550" text-anchor="end" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>