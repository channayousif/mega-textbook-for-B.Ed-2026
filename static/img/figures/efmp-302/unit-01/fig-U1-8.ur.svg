<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">غور و فکر کی مشق کا چکر</title><desc id="d">پانچ مرحلوں کا ایک دہرایا جانے والا چکر: سبق پڑھائیں؛ دیکھیں کہ اصل میں کیا ہوا؛ پوچھیں کیوں ہوا؛ کسی ساتھی کے ساتھ پڑھیں یا بات کریں؛ منصوبہ ایڈجسٹ کریں۔ ایک واپسی کا تیر آخری مرحلے سے دوبارہ سبق پڑھانے کی طرف لے جاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .box { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .arw { stroke: var(--a1); stroke-width: 2.5; fill: none; } .ret { stroke: var(--a3); stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; } .ah { fill: var(--a1); } text { font-size: 15px; fill: var(--ink); } .n { font-weight: 700; fill: var(--muted); font-size: 13px; } .cap { font-size: 13px; fill: var(--muted); } .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a8u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="640" height="560"/><g class="arw"><path d="M230 74 L230 104" marker-end="url(#a8u)"/><path d="M230 168 L230 198" marker-end="url(#a8u)"/><path d="M230 262 L230 292" marker-end="url(#a8u)"/><path d="M230 356 L230 386" marker-end="url(#a8u)"/></g><path class="ret" d="M410 460 C 560 460 560 40 410 40" marker-end="url(#a8u)"/><text class="cap" x="516" y="256" text-anchor="middle" transform="rotate(90 516 256)">پھر دوبارہ پڑھائیں</text><rect class="box" x="60" y="20" width="340" height="50" rx="8"/><text class="n" x="80" y="42">1</text><text x="230" y="50" text-anchor="middle">سبق پڑھائیں</text><rect class="box" x="60" y="114" width="340" height="50" rx="8"/><text class="n" x="80" y="136">2</text><text x="230" y="144" text-anchor="middle">دیکھیں کہ اصل میں کیا ہوا</text><rect class="box" x="60" y="208" width="340" height="50" rx="8"/><text class="n" x="80" y="230">3</text><text x="230" y="238" text-anchor="middle">پوچھیں کیوں ہوا</text><rect class="box" x="60" y="302" width="340" height="50" rx="8"/><text class="n" x="80" y="324">4</text><text x="230" y="332" text-anchor="middle">کسی ساتھی کے ساتھ پڑھیں یا بات کریں</text><rect class="box" x="60" y="396" width="340" height="50" rx="8"/><text class="n" x="80" y="418">5</text><text x="230" y="426" text-anchor="middle">منصوبہ ایڈجسٹ کریں</text><text class="wm" x="12" y="550" text-anchor="start" direction="ltr" aria-hidden="true">textbook.com.pk</text></svg>