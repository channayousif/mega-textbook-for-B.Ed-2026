<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 484" role="img" aria-labelledby="t d" direction="rtl" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تدریس کے تین تقاضے مشترکہ بنیاد پر توازن میں</title><desc id="d">ایک مثلث جس کے تین کونے جوابدہی، خود مختاری اور ہم پیشہ تعاون ہیں، اور بنیاد پر خصوصی علم اور تربیت - عنوان "توازن میں"۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .tri { fill: none; stroke: var(--a1); stroke-width: 2.5; stroke-linejoin: round; } .dot { fill: var(--a1); } .base { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } text { font-size: 15px; fill: var(--ink); } .h { font-weight: 700; } .cap { font-size: 14px; fill: var(--muted); } .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="420" height="484"/><polygon class="tri" points="210,78 66,326 354,326"/><circle class="dot" cx="210" cy="78" r="5"/><circle class="dot" cx="66" cy="326" r="5"/><circle class="dot" cx="354" cy="326" r="5"/><text class="h" x="210" y="52" text-anchor="middle">جوابدہی</text><text class="h" x="66" y="352" text-anchor="middle">خود مختاری</text><text class="h" x="354" y="352" text-anchor="middle">ہم پیشہ تعاون</text><rect class="base" x="44" y="382" width="332" height="48"/><text x="210" y="412" text-anchor="middle">خصوصی علم اور تربیت</text><text class="cap" x="210" y="462" text-anchor="middle">توازن میں</text><text class="wm" x="12" y="474" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>