<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ترقی کا منصوبہ: ایک صفحہ، چھ خانے</title><desc id="d">ایک صفحے کے ترقی کے منصوبے کا خاکہ جس کے چھ خانے ہیں: خلا، اس کی شہادت، ایک ہدف، سرگرمی، تبدیلی کی شہادت، اور جائزے کی تاریخ۔ ساتھ نوٹ ہیں کہ ایک ہدف رکھیے، پانچ نہیں، اور شہادت ابھی طے کیجیے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.pg{fill:none;stroke:var(--ink);stroke-width:2.5}.b{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.ld{stroke:var(--a3);stroke-width:2;fill:none}.ah{fill:var(--a3)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="640"/><g id="layer-regions"><rect id="region-page" class="pg" x="300" y="20" width="460" height="580" rx="4"/></g><g id="layer-edges"><line id="edge-goal-one-goal" class="ld" x1="262" y1="300" x2="318" y2="300" marker-end="url(#arrow)"/><line id="edge-change-decided-now" class="ld" x1="262" y1="488" x2="318" y2="488" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-gap"><rect class="b2" x="320" y="70" width="420" height="84" rx="6"/><text class="sh" x="726" y="96.9" text-anchor="end">‏1 خلا، مخصوص طور پر بیان کیا گیا‏</text><text class="small" x="726" y="122.5" text-anchor="end">‏نہ "تشخیص" بلکہ "سبق کے بیچ میں‏</text><text class="small" x="726" y="142.6" text-anchor="end">‏مجھے نہیں معلوم کون الجھا ہوا ہے"‏</text></g><g id="node-baseline"><rect class="b2" x="320" y="164" width="420" height="84" rx="6"/><text class="sh" x="726" y="190.9" text-anchor="end">‏2 خلا کے حقیقی ہونے کی شہادت‏</text><text class="small" x="726" y="216.6" text-anchor="end">‏پچھلی میعاد کے نتائج، یا کسی ساتھی کا‏</text><text class="small" x="726" y="236.6" text-anchor="end">‏مشاہدہ، احساس نہیں‏</text></g><g id="node-goal"><rect class="b" x="320" y="258" width="420" height="84" rx="6"/><text class="sh" x="726" y="284.9" text-anchor="end">‏3 سال کے لیے ایک ہدف‏</text><text class="small" x="726" y="320.6" text-anchor="end">‏ایسا لکھا کہ آپ بتا سکیں پورا ہوا یا نہیں‏</text></g><g id="node-activity"><rect class="b" x="320" y="352" width="420" height="84" rx="6"/><text class="sh" x="726" y="378.9" text-anchor="end">‏4 وہ سرگرمی جو اس کا علاج کرے‏</text><text class="small" x="726" y="404.6" text-anchor="end">‏چھ اصولوں سے چنی گئی، پیش کی گئی‏</text><text class="small" x="726" y="424.6" text-anchor="end">‏چیز سے نہیں‏</text></g><g id="node-change"><rect class="b" x="320" y="446" width="420" height="84" rx="6"/><text class="sh" x="726" y="472.9" text-anchor="end">‏5 وہ شہادت جو تبدیلی دکھائے‏</text><text class="small" x="726" y="498.6" text-anchor="end">‏وہی پیمانہ جو خانہ 2 والا ہے، تاکہ‏</text><text class="small" x="726" y="518.5" text-anchor="end">‏دونوں کا موازنہ ہو‏</text></g><g id="node-review"><rect class="b2" x="320" y="540" width="420" height="44" rx="6"/><text class="sh" x="726" y="566.9" text-anchor="end">‏6 جائزے کی تاریخ‏</text></g><g id="node-one-goal"><rect class="note" x="20" y="256.0" width="240" height="88" rx="6"/><text class="sh" x="246" y="279.9" text-anchor="end">‏ایک، پانچ نہیں۔‏</text><text class="small" x="246" y="303.1" text-anchor="end">‏پانچ ہدف مارچ تک افسوسوں‏</text><text class="small" x="246" y="323.1" text-anchor="end">‏کی فہرست ہوتے ہیں۔‏</text></g><g id="node-decided-now"><rect class="note" x="20" y="434.0" width="240" height="108" rx="6"/><text class="sh" x="246" y="457.9" text-anchor="end">‏ابھی طے کیجیے، مارچ میں نہیں۔‏</text><text class="small" x="246" y="501.1" text-anchor="end">‏بعد میں چنی گئی شہادت‏</text><text class="small" x="246" y="521.0" text-anchor="end">‏ہمیشہ داد دیتی ہے۔‏</text></g></g><g id="layer-labels"><g id="label-page"><text class="small" x="746" y="50.5" text-anchor="end">‏ایک صفحہ۔ اگر دو چاہیے تو منصوبہ بہت بڑا ہے۔‏</text></g><g id="label-blocks"><text class="small" x="260" y="35.0" text-anchor="end">‏خانے 1، 2 اور 6 وہ ہیں جو اسے‏</text><text class="small" x="260" y="55.0" text-anchor="end">‏جانچنے کے قابل بناتے ہیں۔ خانے 3، 4 اور 5‏</text><text class="small" x="260" y="75.0" text-anchor="end">‏وہ ہیں جو اسے خواہش کے بجائے‏</text><text class="small" x="260" y="95.0" text-anchor="end">‏منصوبہ بناتے ہیں۔‏</text></g><g id="label-fail"><text class="small" x="260" y="129.1" text-anchor="end">‏بیشتر منصوبے 2 اور 5 پر گر جاتے ہیں:‏</text><text class="small" x="260" y="149.1" text-anchor="end">‏کوئی بنیادی ناپ نہیں، اور بتانے‏</text><text class="small" x="260" y="169.1" text-anchor="end">‏کا طے شدہ طریقہ نہیں۔‏</text></g></g><text class="wm" x="12" y="630" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
