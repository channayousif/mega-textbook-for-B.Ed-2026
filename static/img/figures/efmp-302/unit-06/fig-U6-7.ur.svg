<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ترقی کا منصوبہ: ایک صفحہ، چھ خانے</title><desc id="d">ایک صفحے کے ترقی کے منصوبے کا خاکہ جس کے چھ خانے ہیں - خلا، اس کی شہادت، ایک ہدف، سرگرمی، تبدیلی کی شہادت، اور جائزے کی تاریخ - یہ نوٹ کے ساتھ کہ ایک ہدف، پانچ نہیں، اور شہادت ابھی طے کیجیے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .pg{fill:none;stroke:var(--ink);stroke-width:2.5} .b{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .bg2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ld{stroke:var(--a3);stroke-width:1.8;fill:none} text{font-size:11.5px;fill:var(--ink)} .n{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="470"/><rect class="pg" x="330" y="30" width="520" height="400" rx="4"/><text class="m" x="838" y="52" text-anchor="end">ایک صفحہ۔ اگر دو چاہیے تو منصوبہ بہت بڑا ہے۔</text><rect class="bg2" x="350" y="64" width="480" height="56" rx="5"/><text class="n" x="818" y="86" text-anchor="end">1 خلا، مخصوص طور پر بیان کیا گیا</text><text class="m" x="818" y="106" text-anchor="end">نہ "تشخیص" بلکہ "سبق کے بیچ میں مجھے نہیں معلوم کون الجھا ہوا ہے"</text><rect class="bg2" x="350" y="128" width="480" height="56" rx="5"/><text class="n" x="818" y="150" text-anchor="end">2 خلا کے حقیقی ہونے کی شہادت</text><text class="m" x="818" y="170" text-anchor="end">پچھلی میعاد کے نتائج، یا کسی ساتھی کا مشاہدہ، احساس نہیں</text><rect class="b" x="350" y="192" width="480" height="56" rx="5"/><text class="n" x="818" y="214" text-anchor="end">3 سال کے لیے ایک ہدف</text><text class="m" x="818" y="234" text-anchor="end">ایسا لکھا کہ آپ بتا سکیں پورا ہوا یا نہیں</text><rect class="b" x="350" y="256" width="480" height="56" rx="5"/><text class="n" x="818" y="278" text-anchor="end">4 وہ سرگرمی جو اس کا علاج کرے</text><text class="m" x="818" y="298" text-anchor="end">چھ اصولوں سے چنی گئی، پیش کی گئی چیز سے نہیں</text><rect class="b" x="350" y="320" width="480" height="56" rx="5"/><text class="n" x="818" y="342" text-anchor="end">5 وہ شہادت جو تبدیلی دکھائے</text><text class="m" x="818" y="362" text-anchor="end">وہی پیمانہ جو خانہ 2 والا ہے، تاکہ دونوں کا موازنہ ہو</text><rect class="bg2" x="350" y="384" width="480" height="34" rx="5"/><text class="n" x="818" y="406" text-anchor="end">6 جائزے کی تاریخ</text><rect class="note" x="24" y="196" width="250" height="48" rx="5"/><text class="n" x="262" y="218" text-anchor="end">ایک، پانچ نہیں۔</text><text class="m" x="274" y="86" text-anchor="end">خانے 1، 2 اور 6 وہ ہیں جو اسے جانچنے</text><text class="m" x="274" y="104" text-anchor="end">کے قابل بناتے ہیں۔ خانے 3، 4 اور 5 وہ</text><text class="m" x="274" y="122" text-anchor="end">ہیں جو اسے خواہش کے بجائے منصوبہ بناتے ہیں۔</text><text class="m" x="274" y="150" text-anchor="end">بیشتر منصوبے 2 اور 5 پر گر جاتے ہیں: کوئی</text><text class="m" x="274" y="168" text-anchor="end">بنیادی ناپ نہیں، اور بتانے کا طے شدہ طریقہ نہیں۔</text><path class="ld" d="M346 220 L286 220" marker-end="url(#a)"/><path class="ld" d="M346 348 L286 348" marker-end="url(#a)"/><text class="wm" x="868" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
