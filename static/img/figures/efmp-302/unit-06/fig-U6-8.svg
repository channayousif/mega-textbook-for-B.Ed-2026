<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 644" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Building a plan, and revising it at the review date</title><desc id="d">Flowchart of building and revising a development plan, ending at a mid-year decision point asking whether the goal survived the year, branching to continue, narrow, or replace the goal.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5}.o{fill:var(--panel);stroke:var(--a1);stroke-width:2}.bad{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;stroke-dasharray:5 3}.f{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.br{stroke:var(--a2);stroke-width:2;fill:none}.ah2{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah2"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="644"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-gap-goal" class="f" x1="136" y1="70.0" x2="174" y2="70.0" marker-end="url(#arrow)"/><line id="edge-goal-activity" class="f" x1="292" y1="70.0" x2="330" y2="70.0" marker-end="url(#arrow)"/><line id="edge-activity-evidence" class="f" x1="448" y1="70.0" x2="486" y2="70.0" marker-end="url(#arrow)"/><line id="edge-evidence-date" class="f" x1="604" y1="70.0" x2="642" y2="70.0" marker-end="url(#arrow)"/><line id="edge-date-act" class="f" x1="702" y1="120" x2="702" y2="158" marker-end="url(#arrow)"/><path id="edge-act-decision" class="f" d="M702 204 L702 230 L390 230 L390 258" marker-end="url(#arrow)"/><path id="edge-decision-continue" class="br" d="M220 320 L135 320 L135 428" marker-end="url(#arrow2)"/><line id="edge-decision-narrow" class="br" x1="390" y1="380" x2="390" y2="428" marker-end="url(#arrow2)"/><path id="edge-decision-replace" class="br" d="M560 320 L645 320 L645 428" marker-end="url(#arrow2)"/></g><g id="layer-nodes"><g id="node-gap"><rect class="st" x="20" y="20" width="116" height="100" rx="8"/><text class="sh" x="78" y="41.9" text-anchor="middle">1 Identify</text><text class="sh" x="78" y="61.9" text-anchor="middle">the gap</text><text class="small" x="78" y="87.0" text-anchor="middle">from real</text><text class="small" x="78" y="107.0" text-anchor="middle">evidence</text></g><g id="node-goal"><rect class="st" x="176" y="20" width="116" height="100" rx="8"/><text class="sh" x="234" y="64.9" text-anchor="middle">2 Write</text><text class="sh" x="234" y="84.9" text-anchor="middle">ONE goal</text></g><g id="node-activity"><rect class="st" x="332" y="20" width="116" height="100" rx="8"/><text class="sh" x="390" y="64.9" text-anchor="middle">3 Choose</text><text class="sh" x="390" y="84.9" text-anchor="middle">the activity</text></g><g id="node-evidence"><rect class="st" x="488" y="20" width="116" height="100" rx="8"/><text class="sh" x="546" y="54.9" text-anchor="middle">4 Decide the</text><text class="sh" x="546" y="74.9" text-anchor="middle">evidence of</text><text class="sh" x="546" y="94.9" text-anchor="middle">change</text></g><g id="node-date"><rect class="st" x="644" y="20" width="116" height="100" rx="8"/><text class="sh" x="702" y="64.9" text-anchor="middle">5 Set the</text><text class="sh" x="702" y="84.9" text-anchor="middle">review date</text></g><g id="node-act"><rect class="st" x="644" y="160" width="116" height="44" rx="8"/><text class="sh" x="702" y="186.9" text-anchor="middle">6 Act</text></g><g id="node-decision"><polygon class="dc" points="390,260 560,320 390,380 220,320"/><text class="sh" x="390" y="304.9" text-anchor="middle">At the review date:</text><text class="sh" x="390" y="324.9" text-anchor="middle">did the goal survive</text><text class="sh" x="390" y="344.9" text-anchor="middle">contact with the year?</text></g><g id="node-continue"><rect class="o" x="20" y="430" width="230" height="84" rx="8"/><text class="sh" x="34" y="451.9">Continue unchanged</text><text class="small" x="34" y="477.1">it is working; keep going</text></g><g id="node-narrow"><rect class="o" x="275" y="430" width="230" height="84" rx="8"/><text class="sh" x="289" y="451.9">Narrow the goal</text><text class="small" x="289" y="477.1">it was too big; make</text><text class="small" x="289" y="497.1">it smaller</text></g><g id="node-replace"><rect class="o" x="530" y="430" width="230" height="84" rx="8"/><text class="sh" x="544" y="451.9">Replace it</text><text class="small" x="544" y="477.1">the real gap turned out</text><text class="small" x="544" y="497.1">to be elsewhere</text></g><g id="node-abandon"><rect class="bad" x="400" y="540" width="360" height="64" rx="8"/><text class="small" x="580" y="566.5" text-anchor="middle">Not a fourth branch: quietly abandoning it</text><text class="small" x="580" y="586.5" text-anchor="middle">without deciding which of the three applies</text></g></g><g id="layer-labels"><g id="label-legitimate"><text class="small" x="20" y="551.0">All three outcomes are legitimate. A plan</text><text class="small" x="20" y="571.0">that was replaced in March taught you</text><text class="small" x="20" y="591.0">something the original goal could not.</text></g></g><text class="wm" x="768" y="634" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
