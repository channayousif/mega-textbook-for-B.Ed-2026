<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Development, a course, a qualification and an appraisal requirement</title><desc id="d">Table comparing continuing professional development with a training course, a qualification and an appraisal requirement by purpose, who drives it, duration, what counts as success, and what each cannot do.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .h1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .h2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .c1{fill:none;stroke:var(--a1);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="rl" x="20" y="28" width="150" height="50"/><rect class="h1" x="170" y="28" width="190" height="50"/><rect class="h2" x="360" y="28" width="175" height="50"/><rect class="h2" x="535" y="28" width="165" height="50"/><rect class="h2" x="700" y="28" width="180" height="50"/><text class="h" x="265" y="38" text-anchor="middle"><tspan x="265" dy="0">Continuing</tspan><tspan x="265" dy="20">professional</tspan></text><text class="h" x="265" y="66" text-anchor="middle">development</text><text class="h" x="447" y="58" text-anchor="middle">A training course</text><text class="h" x="617" y="58" text-anchor="middle">A qualification</text><text class="h" x="790" y="48" text-anchor="middle">An appraisal</text><text class="h" x="790" y="66" text-anchor="middle">requirement</text><g><rect class="rl" x="20" y="78" width="150" height="56"/><rect class="c1" x="170" y="78" width="190" height="56"/><rect class="cl" x="360" y="78" width="175" height="56"/><rect class="cl" x="535" y="78" width="165" height="56"/><rect class="cl" x="700" y="78" width="180" height="56"/><text class="rh" x="30" y="110">What it is for</text><text x="180" y="92"><tspan x="180" dy="0">Changing what</tspan><tspan x="180" dy="20">happens</tspan></text><text x="180" y="120">in your classroom</text><text x="370" y="110">Transferring content</text><text x="545" y="110">Certifying a level</text><text x="710" y="102">Satisfying a system</text><text x="710" y="120">that is watching</text></g><g><rect class="rl" x="20" y="134" width="150" height="46"/><rect class="c1" x="170" y="134" width="190" height="46"/><rect class="cl" x="360" y="134" width="175" height="46"/><rect class="cl" x="535" y="134" width="165" height="46"/><rect class="cl" x="700" y="134" width="180" height="46"/><text class="rh" x="30" y="162">Who drives it</text><text x="180" y="162">The teacher</text><text x="370" y="162">The provider</text><text x="545" y="162">The awarding body</text><text x="710" y="162">The employer</text></g><g><rect class="rl" x="20" y="180" width="150" height="46"/><rect class="c1" x="170" y="180" width="190" height="46"/><rect class="cl" x="360" y="180" width="175" height="46"/><rect class="cl" x="535" y="180" width="165" height="46"/><rect class="cl" x="700" y="180" width="180" height="46"/><text class="rh" x="30" y="208">How long it lasts</text><text x="180" y="208">A career</text><text x="370" y="208">Days</text><text x="545" y="208">Years, then done</text><text x="710" y="208">A cycle</text></g><g><rect class="rl" x="20" y="226" width="150" height="56"/><rect class="c1" x="170" y="226" width="190" height="56"/><rect class="cl" x="360" y="226" width="175" height="56"/><rect class="cl" x="535" y="226" width="165" height="56"/><rect class="cl" x="700" y="226" width="180" height="56"/><text class="rh" x="30" y="258">What counts as</text><text class="rh" x="30" y="274">success</text><text x="180" y="240"><tspan x="180" dy="0">Practice that</tspan><tspan x="180" dy="20">changed,</tspan></text><text x="180" y="258"><tspan x="180" dy="0">and pupils who</tspan><tspan x="180" dy="20">noticed</tspan></text><text x="370" y="258">Attendance</text><text x="545" y="258">The award</text><text x="710" y="258">The box ticked</text></g><g><rect class="rl" x="20" y="282" width="150" height="56"/><rect class="c1" x="170" y="282" width="190" height="56"/><rect class="cl" x="360" y="282" width="175" height="56"/><rect class="cl" x="535" y="282" width="165" height="56"/><rect class="cl" x="700" y="282" width="180" height="56"/><text class="rh" x="30" y="314">What it cannot do</text><text x="180" y="296"><tspan x="180" dy="0">Happen to you</tspan><tspan x="180" dy="20">without</tspan></text><text x="180" y="324">your participation</text><text x="370" y="306">Make you use it</text><text x="370" y="324">on Monday</text><text x="545" y="314">Keep you current</text><text x="710" y="306">Tell you what</text><text x="710" y="324">to improve</text></g><text class="m" x="20" y="336"><tspan x="20" dy="0">The other three can all be</tspan><tspan x="20" dy="20">completed without a single lesson</tspan><tspan x="20" dy="20">changing. Only the first column is</tspan><tspan x="20" dy="20">defined by the change itself,</tspan></text><text class="m" x="20" y="374"><tspan x="20" dy="0">which is why hours attended is a</tspan><tspan x="20" dy="20">measure of the wrong thing.</tspan></text><text class="wm" x="888" y="440" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
