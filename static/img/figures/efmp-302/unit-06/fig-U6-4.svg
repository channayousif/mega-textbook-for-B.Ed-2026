<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What each stage needs, and what it is usually offered</title><desc id="d">Table of the preservice, new teacher and experienced teacher stages showing the characteristic difficulty of each, the support that helps, and the support usually offered instead.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:2;stroke-dasharray:5 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="350"/><rect class="rl" x="20" y="28" width="170" height="52"/><rect class="hd" x="190" y="28" width="230" height="52"/><rect class="hd" x="420" y="28" width="230" height="52"/><rect class="hx" x="650" y="28" width="230" height="52"/><text class="h" x="305" y="59" text-anchor="middle">The characteristic difficulty</text><text class="h" x="535" y="59" text-anchor="middle">What actually helps</text><text class="h" x="765" y="50" text-anchor="middle">What is usually</text><text class="h" x="765" y="68" text-anchor="middle">offered instead</text><g><rect class="rl" x="20" y="80" width="170" height="66"/><rect class="cl" x="190" y="80" width="230" height="66"/><rect class="cl" x="420" y="80" width="230" height="66"/><rect class="cx" x="650" y="80" width="230" height="66"/><text class="rh" x="30" y="118">Preservice</text><text x="200" y="110">Theory without a class</text><text x="200" y="128">to attach it to</text><text x="430" y="110">Extended practice with</text><text x="430" y="128">real pupils, observed</text><text x="660" y="110">More lectures, and a</text><text x="660" y="128">short final teaching block</text></g><g><rect class="rl" x="20" y="146" width="170" height="66"/><rect class="cl" x="190" y="146" width="230" height="66"/><rect class="cl" x="420" y="146" width="230" height="66"/><rect class="cx" x="650" y="146" width="230" height="66"/><text class="rh" x="30" y="184">New teacher</text><text x="200" y="176">Full responsibility from</text><text x="200" y="194">day one, and isolation</text><text x="430" y="176">A named mentor, time</text><text x="430" y="194">protected to meet them</text><text x="660" y="176">An induction day, then</text><text x="660" y="194">the same load as everyone</text></g><g><rect class="rl" x="20" y="212" width="170" height="66"/><rect class="cl" x="190" y="212" width="230" height="66"/><rect class="cl" x="420" y="212" width="230" height="66"/><rect class="cx" x="650" y="212" width="230" height="66"/><text class="rh" x="30" y="250">Experienced teacher</text><text x="200" y="242">Competence removes the</text><text x="200" y="260">pressure to improve</text><text x="430" y="242">A problem worth solving,</text><text x="430" y="260">and colleagues solving it</text><text x="660" y="242">Whatever course the</text><text x="660" y="260">district funded this year</text></g><text class="m" x="20" y="308">The dashed column repeats a single mismatch: what is offered is what can be arranged centrally and counted, and what helps is</text><text class="m" x="20" y="326">specific to one teacher's classroom. The gap is structural, not a failure of goodwill.</text><text class="wm" x="888" y="336" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
