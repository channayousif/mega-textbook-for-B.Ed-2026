<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three stages, and what changes between them</title><desc id="d">Timeline of a teaching career across the preservice, new teacher and experienced teacher stages, with each transition labelled by what changes and each stage labelled with what it most needs.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ax{stroke:var(--ink);stroke-width:3;fill:none}.tick{stroke:var(--ink);stroke-width:1.5;fill:none}.s1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5}.s2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5}.s3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.nd{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}.tr{fill:none;stroke:var(--a4);stroke-width:2.5}.ah{fill:var(--a4)}.t{font-size:14px;font-weight:700;fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><line id="region-axis" class="ax" x1="20" y1="240" x2="760" y2="240"/></g><g id="layer-edges"><line class="tick" x1="130" y1="200" x2="130" y2="240"/><line class="tick" x1="130" y1="240" x2="130" y2="270"/><line class="tick" x1="390" y1="200" x2="390" y2="240"/><line class="tick" x1="390" y1="240" x2="390" y2="270"/><line class="tick" x1="650" y1="200" x2="650" y2="240"/><line class="tick" x1="650" y1="240" x2="650" y2="270"/><line id="edge-preservice-new" class="tr" x1="242" y1="150.0" x2="278" y2="150.0" marker-end="url(#arrow)"/><line id="edge-new-experienced" class="tr" x1="502" y1="150.0" x2="538" y2="150.0" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-preservice"><rect class="s1" x="20" y="100" width="220" height="100" rx="8"/><text class="sh" x="130" y="132.9" text-anchor="middle">Preservice</text><text class="small" x="130" y="160.6" text-anchor="middle">learning to teach, while</text><text class="small" x="130" y="180.6" text-anchor="middle">nobody depends on you yet</text></g><g id="node-preservice-needs"><rect class="nd" x="20" y="270" width="220" height="90" rx="6"/><text class="bt" x="130" y="298.6" text-anchor="middle">Most needs</text><text class="body" x="130" y="324.6" text-anchor="middle">practice with real pupils,</text><text class="body" x="130" y="344.6" text-anchor="middle">early</text></g><g id="node-new"><rect class="s2" x="280" y="100" width="220" height="100" rx="8"/><text class="sh" x="390" y="132.9" text-anchor="middle">New teacher</text><text class="small" x="390" y="160.6" text-anchor="middle">responsible for a class</text><text class="small" x="390" y="180.6" text-anchor="middle">from the first day</text></g><g id="node-new-needs"><rect class="nd" x="280" y="270" width="220" height="90" rx="6"/><text class="bt" x="390" y="298.6" text-anchor="middle">Most needs</text><text class="body" x="390" y="334.6" text-anchor="middle">a named colleague to ask</text></g><g id="node-experienced"><rect class="s3" x="540" y="100" width="220" height="100" rx="8"/><text class="sh" x="650" y="132.9" text-anchor="middle">Experienced teacher</text><text class="small" x="650" y="160.6" text-anchor="middle">competent, and able to</text><text class="small" x="650" y="180.6" text-anchor="middle">choose what to get better at</text></g><g id="node-experienced-needs"><rect class="nd" x="540" y="270" width="220" height="90" rx="6"/><text class="bt" x="650" y="298.6" text-anchor="middle">Most needs</text><text class="body" x="650" y="334.6" text-anchor="middle">a reason not to coast</text></g></g><g id="layer-labels"><g id="label-preservice-new"><text class="t" x="260" y="49.9" text-anchor="middle">from observing</text><text class="t" x="260" y="69.9" text-anchor="middle">to being responsible</text></g><g id="label-new-experienced"><text class="t" x="520" y="49.9" text-anchor="middle">from surviving</text><text class="t" x="520" y="69.9" text-anchor="middle">to choosing</text></g><g id="label-caption"><text class="small" x="20" y="401.1">The two transitions are where teachers are lost: the first because responsibility arrives all at once,</text><text class="small" x="20" y="421.1">the second because competence removes the pressure that drove improvement, and nothing replaces</text><text class="small" x="20" y="441.1">it unless the teacher chooses it.</text></g></g><text class="wm" x="768" y="480" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
