<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three stages, and what changes between them</title><desc id="d">Timeline of a teaching career across the preservice, new teacher and experienced teacher stages, with each transition labelled by what changes and each stage labelled with what it most needs.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .s1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .s2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .s3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .nd{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .tr{fill:none;stroke:var(--a4);stroke-width:2.5} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .t{font-size:11.5px;font-weight:700;fill:var(--a4)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a4)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="400"/><line class="ax" x1="30" y1="230" x2="870" y2="230"/><rect class="s1" x="40" y="100" width="220" height="80" rx="6"/><text class="h" x="150" y="130" text-anchor="middle">Preservice</text><text class="m" x="150" y="152" text-anchor="middle">learning to teach, while</text><text class="m" x="150" y="168" text-anchor="middle">nobody depends on you yet</text><rect class="s2" x="340" y="100" width="220" height="80" rx="6"/><text class="h" x="450" y="130" text-anchor="middle">New teacher</text><text class="m" x="450" y="152" text-anchor="middle">responsible for a class</text><text class="m" x="450" y="168" text-anchor="middle">from the first day</text><rect class="s3" x="640" y="100" width="220" height="80" rx="6"/><text class="h" x="750" y="130" text-anchor="middle">Experienced teacher</text><text class="m" x="750" y="152" text-anchor="middle">competent, and able to</text><text class="m" x="750" y="168" text-anchor="middle">choose what to get better at</text><path class="tr" d="M266 140 L334 140" marker-end="url(#a)"/><text class="t" x="300" y="122" text-anchor="middle">from observing</text><text class="t" x="300" y="106" text-anchor="middle">to being responsible</text><path class="tr" d="M566 140 L634 140" marker-end="url(#a)"/><text class="t" x="600" y="122" text-anchor="middle">from surviving</text><text class="t" x="600" y="106" text-anchor="middle">to choosing</text><line class="ax" x1="150" y1="180" x2="150" y2="224" stroke-width="1.5"/><line class="ax" x1="450" y1="180" x2="450" y2="224" stroke-width="1.5"/><line class="ax" x1="750" y1="180" x2="750" y2="224" stroke-width="1.5"/><rect class="nd" x="40" y="252" width="220" height="56" rx="5"/><text class="h" x="150" y="274" text-anchor="middle">Most needs</text><text class="m" x="150" y="296" text-anchor="middle">practice with real pupils, early</text><rect class="nd" x="340" y="252" width="220" height="56" rx="5"/><text class="h" x="450" y="274" text-anchor="middle">Most needs</text><text class="m" x="450" y="296" text-anchor="middle">a named colleague to ask</text><rect class="nd" x="640" y="252" width="220" height="56" rx="5"/><text class="h" x="750" y="274" text-anchor="middle">Most needs</text><text class="m" x="750" y="296" text-anchor="middle">a reason not to coast</text><text class="m" x="30" y="352">The two transitions are where teachers are lost: the first because responsibility arrives all at once, the second because</text><text class="m" x="30" y="370">competence removes the pressure that drove improvement, and nothing replaces it unless the teacher chooses it.</text><text class="wm" x="888" y="382" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
