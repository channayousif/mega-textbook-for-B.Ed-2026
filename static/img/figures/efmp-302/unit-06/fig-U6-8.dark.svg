<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Building a plan, and revising it at the review date</title><desc id="d">Flowchart of building and revising a development plan, ending at a mid-year decision point asking whether the goal survived the year, branching to continue, narrow, or replace the goal.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .o{fill:var(--panel);stroke:var(--a1);stroke-width:2} .bad{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;stroke-dasharray:5 3} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .b{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="460"/><rect class="st" x="20" y="40" width="130" height="58" rx="5"/><text class="h" x="85" y="64" text-anchor="middle">1 Identify the gap</text><text class="m" x="85" y="84" text-anchor="middle">from real evidence</text><rect class="st" x="180" y="40" width="120" height="58" rx="5"/><text class="h" x="240" y="72" text-anchor="middle">2 Write ONE goal</text><rect class="st" x="330" y="40" width="130" height="58" rx="5"/><text class="h" x="395" y="72" text-anchor="middle">3 Choose the activity</text><rect class="st" x="490" y="40" width="150" height="58" rx="5"/><text class="h" x="565" y="64" text-anchor="middle">4 Decide the</text><text class="h" x="565" y="82" text-anchor="middle">evidence of change</text><rect class="st" x="670" y="40" width="120" height="58" rx="5"/><text class="h" x="730" y="64" text-anchor="middle">5 Set the</text><text class="h" x="730" y="82" text-anchor="middle">review date</text><path class="f" d="M150 69 L175 69" marker-end="url(#a)"/><path class="f" d="M300 69 L325 69" marker-end="url(#a)"/><path class="f" d="M460 69 L485 69" marker-end="url(#a)"/><path class="f" d="M640 69 L665 69" marker-end="url(#a)"/><rect class="st" x="670" y="130" width="120" height="44" rx="5"/><text class="h" x="730" y="158" text-anchor="middle">6 Act</text><path class="f" d="M730 98 L730 126" marker-end="url(#a)"/><rect class="dc" x="330" y="196" width="240" height="64" rx="6"/><text class="h" x="450" y="222" text-anchor="middle">At the review date: did the</text><text class="h" x="450" y="240" text-anchor="middle">goal survive contact with the year?</text><path class="f" d="M730 174 L730 228 L575 228" marker-end="url(#a)"/><rect class="o" x="30" y="300" width="250" height="60" rx="5"/><text class="h" x="42" y="322">Continue unchanged</text><text class="m" x="42" y="342">it is working; keep going</text><rect class="o" x="320" y="300" width="250" height="60" rx="5"/><text class="h" x="332" y="322">Narrow the goal</text><text class="m" x="332" y="342">it was too big; make it smaller</text><rect class="o" x="610" y="300" width="260" height="60" rx="5"/><text class="h" x="622" y="322">Replace it</text><text class="m" x="622" y="342">the real gap turned out to be elsewhere</text><path class="b" d="M380 260 L180 260 L180 296" marker-end="url(#c)"/><path class="b" d="M450 260 L450 296" marker-end="url(#c)"/><path class="b" d="M520 260 L740 260 L740 296" marker-end="url(#c)"/><rect class="bad" x="320" y="384" width="260" height="42" rx="5"/><text class="m" x="450" y="404" text-anchor="middle">Not a fourth branch: quietly abandoning it</text><text class="m" x="450" y="420" text-anchor="middle">without deciding which of the three applies</text><text class="m" x="30" y="404">All three outcomes are legitimate. A plan that</text><text class="m" x="30" y="422">was replaced in March taught you something</text><text class="m" x="30" y="440">the original goal could not.</text><text class="wm" x="888" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
