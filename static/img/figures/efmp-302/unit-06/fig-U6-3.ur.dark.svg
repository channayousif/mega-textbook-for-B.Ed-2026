<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تدریسی کیریئر کے تین مراحل</title><desc id="d">تدریسی کیریئر کی زمانی ترتیب جو تربیت سے پہلے، نئے استاد اور تجربہ کار استاد کے مراحل سے گزرتی ہے، ہر تبدیلی پر یہ لکھا ہے کہ کیا بدلتا ہے اور ہر مرحلے پر کیا سب سے زیادہ درکار ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ax{stroke:var(--ink);stroke-width:3;fill:none}.tick{stroke:var(--ink);stroke-width:1.5;fill:none}.s1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5}.s2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5}.s3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.nd{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}.tr{fill:none;stroke:var(--a4);stroke-width:2.5}.ah{fill:var(--a4)}.t{font-size:14px;font-weight:700;fill:var(--ink)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="490"/><g id="layer-regions"><line id="region-axis" class="ax" x1="760" y1="240" x2="20" y2="240"/></g><g id="layer-edges"><line class="tick" x1="650" y1="200" x2="650" y2="240"/><line class="tick" x1="650" y1="240" x2="650" y2="270"/><line class="tick" x1="390" y1="200" x2="390" y2="240"/><line class="tick" x1="390" y1="240" x2="390" y2="270"/><line class="tick" x1="130" y1="200" x2="130" y2="240"/><line class="tick" x1="130" y1="240" x2="130" y2="270"/><line id="edge-preservice-new" class="tr" x1="538" y1="150.0" x2="502" y2="150.0" marker-end="url(#arrow)"/><line id="edge-new-experienced" class="tr" x1="278" y1="150.0" x2="242" y2="150.0" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-preservice"><rect class="s1" x="540" y="100" width="220" height="100" rx="8"/><text class="sh" x="650" y="132.9" text-anchor="middle">‏تربیت سے پہلے‏</text><text class="small" x="650" y="160.6" text-anchor="middle">‏تدریس سیکھنا، جبکہ‏</text><text class="small" x="650" y="180.6" text-anchor="middle">‏ابھی کوئی آپ پر منحصر نہیں‏</text></g><g id="node-preservice-needs"><rect class="nd" x="540" y="270" width="220" height="90" rx="6"/><text class="bt" x="650" y="298.6" text-anchor="middle">‏سب سے زیادہ درکار‏</text><text class="body" x="650" y="324.6" text-anchor="middle">‏جلد، حقیقی شاگردوں کے ساتھ‏</text><text class="body" x="650" y="344.6" text-anchor="middle">‏مشق‏</text></g><g id="node-new"><rect class="s2" x="280" y="100" width="220" height="100" rx="8"/><text class="sh" x="390" y="132.9" text-anchor="middle">‏نیا استاد‏</text><text class="small" x="390" y="160.6" text-anchor="middle">‏پہلے دن سے ایک جماعت‏</text><text class="small" x="390" y="180.6" text-anchor="middle">‏کی ذمہ داری‏</text></g><g id="node-new-needs"><rect class="nd" x="280" y="270" width="220" height="90" rx="6"/><text class="bt" x="390" y="298.6" text-anchor="middle">‏سب سے زیادہ درکار‏</text><text class="body" x="390" y="334.6" text-anchor="middle">‏پوچھنے کو کوئی نامزد ساتھی‏</text></g><g id="node-experienced"><rect class="s3" x="20" y="100" width="220" height="100" rx="8"/><text class="sh" x="130" y="132.9" text-anchor="middle">‏تجربہ کار استاد‏</text><text class="small" x="130" y="160.6" text-anchor="middle">‏اہل، اور کس میں بہتر‏</text><text class="small" x="130" y="180.6" text-anchor="middle">‏ہونا ہے خود چن سکتا‏</text></g><g id="node-experienced-needs"><rect class="nd" x="20" y="270" width="220" height="90" rx="6"/><text class="bt" x="130" y="298.6" text-anchor="middle">‏سب سے زیادہ درکار‏</text><text class="body" x="130" y="334.6" text-anchor="middle">‏بہاؤ سے بچنے کی کوئی وجہ‏</text></g></g><g id="layer-labels"><g id="label-preservice-new"><text class="t" x="520" y="49.9" text-anchor="middle">‏مشاہدے سے‏</text><text class="t" x="520" y="69.9" text-anchor="middle">‏ذمہ داری کی طرف‏</text></g><g id="label-new-experienced"><text class="t" x="260" y="49.9" text-anchor="middle">‏بچنے سے‏</text><text class="t" x="260" y="69.9" text-anchor="middle">‏چننے کی طرف‏</text></g><g id="label-caption"><text class="small" x="760" y="401.1" text-anchor="end">‏دونوں تبدیلیاں وہیں جہاں استاد کھو جاتے ہیں: پہلی اس لیے کہ ذمہ داری ایک ساتھ آ جاتی ہے،‏</text><text class="small" x="760" y="421.1" text-anchor="end">‏دوسری اس لیے کہ مہارت وہ دباؤ ہٹا دیتی ہے جو بہتری چلاتا تھا، اور اس کی جگہ کچھ نہیں لیتا‏</text><text class="small" x="760" y="441.1" text-anchor="end">‏جب تک استاد خود نہ چنے۔‏</text></g></g><text class="wm" x="12" y="480" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
