<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six principles, and what each rules out</title><desc id="d">Concept map of development that changes practice with six branches - sustained, embedded, content-focused, collaborative, feedback-supported and teacher-chosen - each noting what it rules out.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.n{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.ro{fill:var(--panel);stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3}.e{stroke:var(--a2);stroke-width:2;fill:none}.ah{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="570"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-centre-sustained" class="e" d="M300 226 C280.0 226 280.0 40 262 40" marker-end="url(#arrow)"/><path id="edge-centre-embedded" class="e" d="M480 226 C500.0 226 500.0 40 518 40" marker-end="url(#arrow)"/><path id="edge-centre-focused" class="e" d="M300 250.0 C280.0 250.0 280.0 200 262 200" marker-end="url(#arrow)"/><path id="edge-centre-collaborative" class="e" d="M480 250.0 C500.0 250.0 500.0 200 518 200" marker-end="url(#arrow)"/><path id="edge-centre-feedback" class="e" d="M300 274 C280.0 274 280.0 360 262 360" marker-end="url(#arrow)"/><path id="edge-centre-chosen" class="e" d="M480 274 C500.0 274 500.0 360 518 360" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-centre"><rect class="ctr" x="300" y="210" width="180" height="80" rx="10"/><text class="h" x="390" y="245.2" text-anchor="middle">Development that</text><text class="h" x="390" y="265.2" text-anchor="middle">changes practice</text></g><g id="node-sustained"><rect class="n" x="20" y="20" width="240" height="40" rx="6"/><text class="sh" x="32" y="44.9">Sustained over time</text><rect class="ro" x="20" y="66" width="240" height="60" rx="4"/><text class="small" x="32" y="90.5">rules out: the one-day event,</text><text class="small" x="32" y="110.5">alone</text></g><g id="node-embedded"><rect class="n" x="520" y="20" width="240" height="60" rx="6"/><text class="sh" x="532" y="44.9">Embedded in your</text><text class="sh" x="532" y="64.9">classroom</text><rect class="ro" x="520" y="86" width="240" height="60" rx="4"/><text class="small" x="532" y="110.5">rules out: training away from</text><text class="small" x="532" y="130.6">the pupils you teach</text></g><g id="node-focused"><rect class="n" x="20" y="180" width="240" height="60" rx="6"/><text class="sh" x="32" y="204.9">Focused on content</text><text class="sh" x="32" y="224.9">and pupils</text><rect class="ro" x="20" y="246" width="240" height="60" rx="4"/><text class="small" x="32" y="270.6">rules out: generic sessions</text><text class="small" x="32" y="290.6">on teaching in general</text></g><g id="node-collaborative"><rect class="n" x="520" y="180" width="240" height="40" rx="6"/><text class="sh" x="532" y="204.9">Collaborative</text><rect class="ro" x="520" y="226" width="240" height="60" rx="4"/><text class="small" x="532" y="250.6">rules out: improving alone,</text><text class="small" x="532" y="270.6">unobserved</text></g><g id="node-feedback"><rect class="n" x="20" y="340" width="240" height="40" rx="6"/><text class="sh" x="32" y="364.9">Supported by feedback</text><rect class="ro" x="20" y="386" width="240" height="60" rx="4"/><text class="small" x="32" y="410.6">rules out: advice about a</text><text class="small" x="32" y="430.6">lesson nobody watched</text></g><g id="node-chosen"><rect class="n" x="520" y="340" width="240" height="40" rx="6"/><text class="sh" x="532" y="364.9">Chosen by the teacher</text><rect class="ro" x="520" y="386" width="240" height="60" rx="4"/><text class="small" x="532" y="410.6">rules out: the assigned</text><text class="small" x="532" y="430.6">course nobody asked for</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="20" y="501.1">The dashed line under each principle is the practical test. A provision that fails several of these</text><text class="small" x="20" y="521.0">can still be attended, certified and reported. It simply will not change what happens in the room.</text></g></g><text class="wm" x="768" y="560" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
