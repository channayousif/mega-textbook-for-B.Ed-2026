<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six principles, and what each rules out</title><desc id="d">Concept map of development that changes practice with six branches - sustained, embedded, content-focused, collaborative, feedback-supported and teacher-chosen - each noting what it rules out.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .ro{fill:var(--panel);stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="924" height="100%"/><rect class="ctr" x="350" y="200" width="200" height="66" rx="8"/><text class="h" x="450" y="226" text-anchor="middle">Development that</text><text class="h" x="450" y="246" text-anchor="middle">changes practice</text><rect class="n" x="20" y="30" width="250" height="40" rx="5"/><text class="h" x="32" y="55">Sustained over time</text><rect class="ro" x="20" y="72" width="250" height="26" rx="4"/><text class="m" x="32" y="80"><tspan x="32" dy="0">rules out: the one-day event,</tspan><tspan x="32" dy="20">alone</tspan></text><path class="e" d="M350 214 L272 50" marker-end="url(#a)"/><rect class="n" x="630" y="30" width="250" height="40" rx="5"/><text class="h" x="642" y="45"><tspan x="642" dy="0">Embedded in your</tspan><tspan x="642" dy="20">classroom</tspan></text><rect class="ro" x="630" y="72" width="250" height="26" rx="4"/><text class="m" x="642" y="80"><tspan x="642" dy="0">rules out: training away from the</tspan><tspan x="642" dy="20">pupils you teach</tspan></text><path class="e" d="M550 214 L628 50" marker-end="url(#a)"/><rect class="n" x="20" y="120" width="250" height="40" rx="5"/><text class="h" x="32" y="135"><tspan x="32" dy="0">Focused on content</tspan><tspan x="32" dy="20">and pupils</tspan></text><rect class="ro" x="20" y="162" width="250" height="26" rx="4"/><text class="m" x="32" y="170"><tspan x="32" dy="0">rules out: generic sessions on</tspan><tspan x="32" dy="20">teaching in general</tspan></text><path class="e" d="M350 224 L272 140" marker-end="url(#a)"/><rect class="n" x="630" y="120" width="250" height="40" rx="5"/><text class="h" x="642" y="145">Collaborative</text><rect class="ro" x="630" y="162" width="250" height="26" rx="4"/><text class="m" x="642" y="170"><tspan x="642" dy="0">rules out: improving alone,</tspan><tspan x="642" dy="20">unobserved</tspan></text><path class="e" d="M550 224 L628 140" marker-end="url(#a)"/><rect class="n" x="20" y="300" width="250" height="40" rx="5"/><text class="h" x="32" y="315"><tspan x="32" dy="0">Supported by</tspan><tspan x="32" dy="20">feedback</tspan></text><rect class="ro" x="20" y="342" width="250" height="26" rx="4"/><text class="m" x="32" y="350"><tspan x="32" dy="0">rules out: advice about a lesson</tspan><tspan x="32" dy="20">nobody watched</tspan></text><path class="e" d="M350 250 L272 320" marker-end="url(#a)"/><rect class="n" x="630" y="300" width="250" height="40" rx="5"/><text class="h" x="642" y="315"><tspan x="642" dy="0">Chosen by the</tspan><tspan x="642" dy="20">teacher</tspan></text><rect class="ro" x="630" y="342" width="250" height="26" rx="4"/><text class="m" x="642" y="350"><tspan x="642" dy="0">rules out: the assigned course</tspan><tspan x="642" dy="20">nobody asked for</tspan></text><path class="e" d="M550 250 L628 320" marker-end="url(#a)"/><text class="m" x="450" y="380" text-anchor="middle"><tspan x="450" dy="0">The dashed line under each</tspan><tspan x="450" dy="20">principle is the practical test. A</tspan><tspan x="450" dy="20">provision that fails several of</tspan><tspan x="450" dy="20">these can still be attended,</tspan></text><text class="m" x="450" y="410" text-anchor="middle"><tspan x="450" dy="0">certified and reported. It simply</tspan><tspan x="450" dy="20">will not change what happens in</tspan><tspan x="450" dy="20">the room.</tspan></text><text class="wm" x="912" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
