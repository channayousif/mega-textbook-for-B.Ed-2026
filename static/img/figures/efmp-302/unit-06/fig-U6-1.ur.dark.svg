<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مسلسل پیشہ ورانہ ترقی، اور جس سے اس کا خلط ملط کیا جاتا ہے</title><desc id="d">مسلسل پیشہ ورانہ ترقی کا تربیتی کورس، سند اور جائزے کی ضرورت سے موازنہ کرنے والا جدول: مقصد، کون چلاتا ہے، دورانیہ، کامیابی کیا شمار ہوتی ہے، اور ہر ایک کیا نہیں کر سکتا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .h1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .h2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .c1{fill:none;stroke:var(--a1);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><rect class="rl" x="730" y="28" width="150" height="50"/><rect class="h1" x="540" y="28" width="190" height="50"/><rect class="h2" x="365" y="28" width="175" height="50"/><rect class="h2" x="200" y="28" width="165" height="50"/><rect class="h2" x="20" y="28" width="180" height="50"/><text class="h" x="635" y="48" text-anchor="middle">مسلسل پیشہ ورانہ</text><text class="h" x="635" y="66" text-anchor="middle">ترقی</text><text class="h" x="452" y="58" text-anchor="middle">تربیتی کورس</text><text class="h" x="282" y="58" text-anchor="middle">سند</text><text class="h" x="110" y="48" text-anchor="middle">جائزے کی</text><text class="h" x="110" y="66" text-anchor="middle">ضرورت</text><rect class="rl" x="730" y="78" width="150" height="56"/><rect class="c1" x="540" y="78" width="190" height="56"/><rect class="cl" x="365" y="78" width="175" height="56"/><rect class="cl" x="200" y="78" width="165" height="56"/><rect class="cl" x="20" y="78" width="180" height="56"/><text class="rh" x="870" y="110" text-anchor="end">کس کام کے لیے</text><text x="715" y="102" text-anchor="end">آپ کے کمرے میں جو ہوتا ہے</text><text x="715" y="120" text-anchor="end">بدلنا</text><text x="520" y="110" text-anchor="end">مواد منتقل کرنا</text><text x="345" y="110" text-anchor="end">ایک درجے کی تصدیق</text><text x="185" y="102" text-anchor="end">دیکھتے نظام کو</text><text x="185" y="120" text-anchor="end">مطمئن کرنا</text><rect class="rl" x="730" y="134" width="150" height="46"/><rect class="c1" x="540" y="134" width="190" height="46"/><rect class="cl" x="365" y="134" width="175" height="46"/><rect class="cl" x="200" y="134" width="165" height="46"/><rect class="cl" x="20" y="134" width="180" height="46"/><text class="rh" x="870" y="162" text-anchor="end">کون چلاتا ہے</text><text x="715" y="162" text-anchor="end">استاد</text><text x="520" y="162" text-anchor="end">فراہم کرنے والا</text><text x="345" y="162" text-anchor="end">سند دینے والا ادارہ</text><text x="185" y="162" text-anchor="end">ملازم رکھنے والا</text><rect class="rl" x="730" y="180" width="150" height="46"/><rect class="c1" x="540" y="180" width="190" height="46"/><rect class="cl" x="365" y="180" width="175" height="46"/><rect class="cl" x="200" y="180" width="165" height="46"/><rect class="cl" x="20" y="180" width="180" height="46"/><text class="rh" x="870" y="208" text-anchor="end">کتنی دیر چلتا ہے</text><text x="715" y="208" text-anchor="end">پورا کیریئر</text><text x="520" y="208" text-anchor="end">کچھ دن</text><text x="345" y="208" text-anchor="end">برس، پھر مکمل</text><text x="185" y="208" text-anchor="end">ایک چکر</text><rect class="rl" x="730" y="226" width="150" height="56"/><rect class="c1" x="540" y="226" width="190" height="56"/><rect class="cl" x="365" y="226" width="175" height="56"/><rect class="cl" x="200" y="226" width="165" height="56"/><rect class="cl" x="20" y="226" width="180" height="56"/><text class="rh" x="870" y="250" text-anchor="end">کامیابی کیا</text><text class="rh" x="870" y="268" text-anchor="end">شمار ہے</text><text x="715" y="250" text-anchor="end">بدلی مشق، اور شاگرد</text><text x="715" y="268" text-anchor="end">جنہوں نے محسوس کیا</text><text x="520" y="258" text-anchor="end">حاضری</text><text x="345" y="258" text-anchor="end">سند</text><text x="185" y="258" text-anchor="end">ٹک لگا خانہ</text><rect class="rl" x="730" y="282" width="150" height="56"/><rect class="c1" x="540" y="282" width="190" height="56"/><rect class="cl" x="365" y="282" width="175" height="56"/><rect class="cl" x="200" y="282" width="165" height="56"/><rect class="cl" x="20" y="282" width="180" height="56"/><text class="rh" x="870" y="314" text-anchor="end">کیا نہیں کر سکتا</text><text x="715" y="306" text-anchor="end">آپ کی شرکت کے بغیر</text><text x="715" y="324" text-anchor="end">آپ کے ساتھ ہونا</text><text x="520" y="306" text-anchor="end">آپ سے پیر کو</text><text x="520" y="324" text-anchor="end">استعمال کروانا</text><text x="345" y="314" text-anchor="end">آپ کو موجودہ رکھنا</text><text x="185" y="306" text-anchor="end">بتانا کیا</text><text x="185" y="324" text-anchor="end">بہتر کیا جائے</text><text class="m" x="758" y="366" text-anchor="end">باقی تینوں ایک سبق بھی بدلے بغیر مکمل کیے جا سکتے ہیں۔ صرف پہلا کالم بدلی خود سے تعریف پایا ہے،</text><text class="m" x="758" y="384" text-anchor="end">اسی لیے حاضر گھنٹے غلط چیز کا پیمانہ ہیں۔</text><text class="wm" x="888" y="392" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
