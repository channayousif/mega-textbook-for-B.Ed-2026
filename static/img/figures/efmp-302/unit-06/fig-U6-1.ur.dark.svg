<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 574" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مسلسل پیشہ ورانہ ترقی، اور جس سے اس کا خلط ملط کیا جاتا ہے</title><desc id="d">مسلسل پیشہ ورانہ ترقی کا تربیتی کورس، سند اور ملازمتی جائزے کی ضرورت سے موازنہ کرنے والا جدول: مقصد، کون چلاتا ہے، دورانیہ، کامیابی کیا شمار ہوتی ہے، اور ہر ایک کیا نہیں کر سکتا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.alt{fill:var(--a3-fill)}.alt-line{stroke:var(--a3);stroke-width:2.5;fill:none;stroke-dasharray:8 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="574"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="84"/><rect id="region-focus" class="focus" x="440" y="104" width="180" height="370"/><line class="grid" x1="620" y1="20" x2="620" y2="474"/><line class="grid" x1="440" y1="20" x2="440" y2="474"/><line class="grid" x1="300" y1="20" x2="300" y2="474"/><line class="grid" x1="160" y1="20" x2="160" y2="474"/><line class="grid" x1="760" y1="194" x2="20" y2="194"/><line class="grid" x1="760" y1="264" x2="20" y2="264"/><line class="grid" x1="760" y1="334" x2="20" y2="334"/><line class="grid" x1="760" y1="404" x2="20" y2="404"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="454"/><rect id="region-focus-outline" class="focus-line" x="440" y="20" width="180" height="454"/><line class="frame" x1="760" y1="104" x2="20" y2="104"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="608" y="56.9" text-anchor="end">‏مسلسل پیشہ ورانہ‏</text><text class="sh" x="608" y="76.9" text-anchor="end">‏ترقی‏</text><text class="sh" x="428" y="66.9" text-anchor="end">‏تربیتی کورس‏</text><text class="sh" x="288" y="66.9" text-anchor="end">‏سند‏</text><text class="sh" x="148" y="56.9" text-anchor="end">‏جائزے کی‏</text><text class="sh" x="148" y="76.9" text-anchor="end">‏ضرورت‏</text></g><g id="node-purpose"><text class="bt" x="748" y="153.6" text-anchor="end">‏کس کام کے لیے‏</text><text class="body" x="608" y="143.6" text-anchor="end">‏آپ کے کمرے میں جو ہوتا ہے‏</text><text class="body" x="608" y="163.6" text-anchor="end">‏بدلنا‏</text><text class="body" x="428" y="153.6" text-anchor="end">‏مواد منتقل کرنا‏</text><text class="body" x="288" y="153.6" text-anchor="end">‏ایک درجے کی تصدیق‏</text><text class="body" x="148" y="143.6" text-anchor="end">‏دیکھتے نظام کو‏</text><text class="body" x="148" y="163.6" text-anchor="end">‏مطمئن کرنا‏</text></g><g id="node-driver"><text class="bt" x="748" y="233.6" text-anchor="end">‏کون چلاتا ہے‏</text><text class="body" x="608" y="233.6" text-anchor="end">‏استاد‏</text><text class="body" x="428" y="233.6" text-anchor="end">‏فراہم کرنے والا‏</text><text class="body" x="288" y="223.6" text-anchor="end">‏سند دینے والا‏</text><text class="body" x="288" y="243.6" text-anchor="end">‏ادارہ‏</text><text class="body" x="148" y="233.6" text-anchor="end">‏ملازم رکھنے والا‏</text></g><g id="node-duration"><text class="bt" x="748" y="303.6" text-anchor="end">‏کتنی دیر چلتا ہے‏</text><text class="body" x="608" y="303.6" text-anchor="end">‏پورا کیریئر‏</text><text class="body" x="428" y="303.6" text-anchor="end">‏کچھ دن‏</text><text class="body" x="288" y="303.6" text-anchor="end">‏برس، پھر مکمل‏</text><text class="body" x="148" y="303.6" text-anchor="end">‏ایک چکر‏</text></g><g id="node-success"><text class="bt" x="748" y="363.6" text-anchor="end">‏کامیابی کیا‏</text><text class="bt" x="748" y="383.6" text-anchor="end">‏شمار ہے‏</text><text class="body" x="608" y="363.6" text-anchor="end">‏بدلی مشق، اور شاگرد‏</text><text class="body" x="608" y="383.6" text-anchor="end">‏جنہوں نے محسوس کیا‏</text><text class="body" x="428" y="373.6" text-anchor="end">‏حاضری‏</text><text class="body" x="288" y="373.6" text-anchor="end">‏سند‏</text><text class="body" x="148" y="373.6" text-anchor="end">‏ٹک لگا خانہ‏</text></g><g id="node-limit"><text class="bt" x="748" y="433.6" text-anchor="end">‏کیا نہیں کر‏</text><text class="bt" x="748" y="453.6" text-anchor="end">‏سکتا‏</text><text class="body" x="608" y="433.6" text-anchor="end">‏آپ کی شرکت کے بغیر‏</text><text class="body" x="608" y="453.6" text-anchor="end">‏آپ کے ساتھ ہونا‏</text><text class="body" x="428" y="433.6" text-anchor="end">‏آپ سے پیر کو‏</text><text class="body" x="428" y="453.6" text-anchor="end">‏استعمال کروانا‏</text><text class="body" x="288" y="443.6" text-anchor="end">‏آپ کو موجودہ رکھنا‏</text><text class="body" x="148" y="433.6" text-anchor="end">‏بتانا کیا‏</text><text class="body" x="148" y="453.6" text-anchor="end">‏بہتر کیا جائے‏</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="760" y="505.1" text-anchor="end">‏باقی تینوں ایک سبق بھی بدلے بغیر مکمل کیے جا سکتے ہیں۔ صرف پہلا کالم بدلی خود سے تعریف پایا ہے،‏</text><text class="small" x="760" y="525.0" text-anchor="end">‏اسی لیے حاضر گھنٹے غلط چیز کا پیمانہ ہیں۔‏</text></g></g><text class="wm" x="12" y="564" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
