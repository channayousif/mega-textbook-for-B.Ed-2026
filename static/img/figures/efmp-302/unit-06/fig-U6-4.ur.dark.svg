<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 414" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین مراحل،اور ہر ایک کی ضرورت</title><desc id="d">تربیت سے پہلے، نئے استاد اور تجربہ کار استاد کے مراحل کا جدول جو ہر ایک کی خاص دشواری، مدد دینے والی معاونت، اور عام طور پر اس کے بجائے پیش کی جانے والی معاونت دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.alt{fill:var(--a3-fill)}.alt-line{stroke:var(--a3);stroke-width:2.5;fill:none;stroke-dasharray:8 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="414"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="64"/><rect id="region-offered" class="alt" x="20" y="84" width="200" height="210"/><line class="grid" x1="620" y1="20" x2="620" y2="294"/><line class="grid" x1="420" y1="20" x2="420" y2="294"/><line class="grid" x1="220" y1="20" x2="220" y2="294"/><line class="grid" x1="760" y1="154" x2="20" y2="154"/><line class="grid" x1="760" y1="224" x2="20" y2="224"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="274"/><rect id="region-offered-outline" class="alt-line" x="20" y="20" width="200" height="274"/><line class="frame" x1="760" y1="84" x2="20" y2="84"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="608" y="56.9" text-anchor="end">‏خاص دشواری‏</text><text class="sh" x="408" y="56.9" text-anchor="end">‏جو اصل میں مدد دیتی ہے‏</text><text class="sh" x="208" y="46.9" text-anchor="end">‏جو عام طور پر اس کے‏</text><text class="sh" x="208" y="66.9" text-anchor="end">‏بجائے پیش کی جاتی ہے‏</text></g><g id="node-preservice"><text class="bt" x="748" y="123.5" text-anchor="end">‏تربیت سے پہلے‏</text><text class="body" x="608" y="113.5" text-anchor="end">‏ایسی نظریہ جس سے جوڑنے‏</text><text class="body" x="608" y="133.6" text-anchor="end">‏کے لیے کوئی جماعت نہیں‏</text><text class="body" x="408" y="113.5" text-anchor="end">‏حقیقی شاگردوں کے ساتھ طویل،‏</text><text class="body" x="408" y="133.6" text-anchor="end">‏مشاہدہ شدہ مشق‏</text><text class="body" x="208" y="113.5" text-anchor="end">‏مزید لیکچر، اور مختصر‏</text><text class="body" x="208" y="133.6" text-anchor="end">‏آخری تدریسی بلاک‏</text></g><g id="node-new"><text class="bt" x="748" y="193.6" text-anchor="end">‏نیا استاد‏</text><text class="body" x="608" y="183.6" text-anchor="end">‏پہلے دن سے مکمل ذمہ داری،‏</text><text class="body" x="608" y="203.6" text-anchor="end">‏اور تنہائی‏</text><text class="body" x="408" y="183.6" text-anchor="end">‏کوئی نامزد سرپرست، ملنے‏</text><text class="body" x="408" y="203.6" text-anchor="end">‏کا محفوظ وقت‏</text><text class="body" x="208" y="183.6" text-anchor="end">‏ایک دن کا داخلہ، پھر سب‏</text><text class="body" x="208" y="203.6" text-anchor="end">‏جتنا ہی بوجھ‏</text></g><g id="node-experienced"><text class="bt" x="748" y="263.6" text-anchor="end">‏تجربہ کار استاد‏</text><text class="body" x="608" y="253.6" text-anchor="end">‏مہارت بہتری کا دباؤ‏</text><text class="body" x="608" y="273.6" text-anchor="end">‏ہٹا دیتی ہے‏</text><text class="body" x="408" y="253.6" text-anchor="end">‏حل کرنے کے قابل مسئلہ،‏</text><text class="body" x="408" y="273.6" text-anchor="end">‏اور اسے حل کرتے ساتھی‏</text><text class="body" x="208" y="253.6" text-anchor="end">‏جس کورس کے لیے ضلع نے‏</text><text class="body" x="208" y="273.6" text-anchor="end">‏اس سال پیسہ دیا‏</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="760" y="325.1" text-anchor="end">‏خط والا کالم ایک ہی ناہمواری دہراتا ہے: جو پیش کیا جاتا ہے وہ ہے جو مرکزی طور پر بندوبست اور‏</text><text class="small" x="760" y="345.1" text-anchor="end">‏گنا جا سکتا ہے، اور جو مدد دیتا ہے وہ ایک استاد کے کمرے کے لیے مخصوص ہے۔‏</text><text class="small" x="760" y="365.1" text-anchor="end">‏یہ خلا ساختی ہے، نیک نیت کی ناکامی نہیں۔‏</text></g></g><text class="wm" x="12" y="404" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
