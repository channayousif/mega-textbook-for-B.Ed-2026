<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منصوبہ بنائیے، اور سالِ وسط میں جائزہ لیجیے</title><desc id="d">ترقی کے منصوبے کو بنانے اور درست کرنے کا فلوچارٹ، سالِ وسط کے فیصلے کے مقام پر ختم ہوتا ہے جو پوچھتا ہے کہ ہدف سال بچا یا نہیں، اور جاری رکھنے، تنگ کرنے یا بدلنے کی شاخوں تک جاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .o{fill:var(--panel);stroke:var(--a1);stroke-width:2} .bad{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;stroke-dasharray:5 3} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .b{stroke:var(--a2);stroke-width:2;stroke-dasharray:6 4;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="460"/><rect class="st" x="750" y="40" width="130" height="58" rx="5"/><text class="h" x="815" y="64" text-anchor="middle">1 خلا پہچانیے</text><text class="m" x="815" y="84" text-anchor="middle">حقیقی شہادت سے</text><rect class="st" x="600" y="40" width="120" height="58" rx="5"/><text class="h" x="660" y="72" text-anchor="middle">2 ایک ہدف لکھیے</text><rect class="st" x="440" y="40" width="130" height="58" rx="5"/><text class="h" x="505" y="72" text-anchor="middle">3 سرگرمی چنیے</text><rect class="st" x="260" y="40" width="150" height="58" rx="5"/><text class="h" x="335" y="64" text-anchor="middle">4 تبدیلی کی</text><text class="h" x="335" y="82" text-anchor="middle">شہادت طے کیجیے</text><rect class="st" x="110" y="40" width="120" height="58" rx="5"/><text class="h" x="170" y="64" text-anchor="middle">5 جائزے کی</text><text class="h" x="170" y="82" text-anchor="middle">تاریخ رکھیے</text><path class="f" d="M750 69 L725 69" marker-end="url(#a)"/><path class="f" d="M600 69 L575 69" marker-end="url(#a)"/><path class="f" d="M440 69 L415 69" marker-end="url(#a)"/><path class="f" d="M260 69 L235 69" marker-end="url(#a)"/><rect class="st" x="110" y="130" width="120" height="44" rx="5"/><text class="h" x="170" y="158" text-anchor="middle">6 عمل کیجیے</text><path class="f" d="M170 98 L170 126" marker-end="url(#a)"/><rect class="dc" x="330" y="196" width="240" height="64" rx="6"/><text class="h" x="450" y="222" text-anchor="middle">جائزے کے دن: کیا ہدف</text><text class="h" x="450" y="240" text-anchor="middle">سال کے ٹکراؤ سے بچا؟</text><path class="f" d="M170 174 L170 228 L325 228" marker-end="url(#a)"/><rect class="o" x="620" y="300" width="250" height="60" rx="5"/><text class="h" x="858" y="322" text-anchor="end">ویسے ہی جاری رکھیے</text><text class="m" x="858" y="342" text-anchor="end">وہ کام کر رہا ہے؛ چلتا رہے</text><rect class="o" x="330" y="300" width="250" height="60" rx="5"/><text class="h" x="568" y="322" text-anchor="end">ہدف تنگ کیجیے</text><text class="m" x="568" y="342" text-anchor="end">وہ بہت بڑا تھا؛ چھوٹا کیجیے</text><rect class="o" x="30" y="300" width="260" height="60" rx="5"/><text class="h" x="278" y="322" text-anchor="end">بدل دیجیے</text><text class="m" x="278" y="342" text-anchor="end">اصل خلا کہیں اور نکلا</text><path class="b" d="M520 260 L720 260 L720 296" marker-end="url(#c)"/><path class="b" d="M450 260 L450 296" marker-end="url(#c)"/><path class="b" d="M380 260 L180 260 L180 296" marker-end="url(#c)"/><rect class="bad" x="320" y="384" width="260" height="42" rx="5"/><text class="m" x="450" y="404" text-anchor="middle">چوتھی شاخ نہیں: یہ طے کیے بغیر خاموشی سے چھوڑ دینا</text><text class="m" x="450" y="420" text-anchor="middle">کہ تینوں میں سے کون لاگو ہوتا ہے</text><text class="m" x="296" y="404" text-anchor="end">تینوں نتائج جائز ہیں۔ جو منصوبہ مارچ میں بدلا</text><text class="m" x="296" y="422" text-anchor="end">گیا اس نے آپ کو وہ سکھایا جو اصل ہدف</text><text class="m" x="296" y="440" text-anchor="end">نہیں سکھا سکتا تھا۔</text><text class="wm" x="888" y="444" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
