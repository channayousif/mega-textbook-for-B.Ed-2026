<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مشق بدلنے والی ترقی کے اصول</title><desc id="d">مشق بدلنے والی ترقی کا تصوراتی نقشہ جس کی چھ شاخیں ہیں - مسلسل، جڑی ہوئی، مواد پر مرکوز، باہمی، تاثرات سے سہارا والی، اور استاد کی چنی ہوئی - ہر ایک یہ بتاتی ہے کہ وہ کیا رد کرتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .ro{fill:var(--panel);stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="924" height="470"/><rect class="ctr" x="350" y="200" width="200" height="66" rx="8"/><text class="h" x="450" y="226" text-anchor="middle">مشق بدلنے والی</text><text class="h" x="450" y="246" text-anchor="middle">ترقی</text><rect class="n" x="654" y="30" width="250" height="40" rx="5"/><text class="h" x="886" y="55" text-anchor="end">وقت کے ساتھ مسلسل</text><rect class="ro" x="654" y="72" width="250" height="26" rx="4"/><text class="m" x="886" y="90" text-anchor="end">رد کرتی ہے: اکیلی، ایک دن کی تقریب</text><path class="e" d="M550 214 L628 50" marker-end="url(#a)"/><rect class="n" x="44" y="30" width="250" height="40" rx="5"/><text class="h" x="276" y="55" text-anchor="end">اپنے کلاس روم میں جڑی ہوئی</text><rect class="ro" x="44" y="72" width="250" height="26" rx="4"/><text class="m" x="276" y="90" text-anchor="end">رد کرتی ہے: ان شاگردوں سے دور تربیت جنہیں آپ پڑھاتے ہیں</text><path class="e" d="M350 214 L272 50" marker-end="url(#a)"/><rect class="n" x="654" y="120" width="250" height="40" rx="5"/><text class="h" x="886" y="145" text-anchor="end">مواد اور شاگردوں پر مرکوز</text><rect class="ro" x="654" y="162" width="250" height="26" rx="4"/><text class="m" x="886" y="180" text-anchor="end">رد کرتی ہے: عمومی تدریس پر عام نشستیں</text><path class="e" d="M550 224 L628 140" marker-end="url(#a)"/><rect class="n" x="44" y="120" width="250" height="40" rx="5"/><text class="h" x="276" y="145" text-anchor="end">باہمی</text><rect class="ro" x="44" y="162" width="250" height="26" rx="4"/><text class="m" x="276" y="180" text-anchor="end">رد کرتی ہے: اکیلے، بغیر مشاہدے بہتر ہونا</text><path class="e" d="M350 224 L272 140" marker-end="url(#a)"/><rect class="n" x="654" y="300" width="250" height="40" rx="5"/><text class="h" x="886" y="325" text-anchor="end">تاثرات سے سہارا والی</text><rect class="ro" x="654" y="342" width="250" height="26" rx="4"/><text class="m" x="886" y="360" text-anchor="end">رد کرتی ہے: اُس سبق پر مشورہ جسے کوئی نہیں دیکھا</text><path class="e" d="M550 250 L628 320" marker-end="url(#a)"/><rect class="n" x="44" y="300" width="250" height="40" rx="5"/><text class="h" x="276" y="325" text-anchor="end">استاد کی چنی ہوئی</text><rect class="ro" x="44" y="342" width="250" height="26" rx="4"/><text class="m" x="276" y="360" text-anchor="end">رد کرتی ہے: وہ سونپا گیا کورس جسے کسی نے نہیں مانگا</text><path class="e" d="M350 250 L272 320" marker-end="url(#a)"/><text class="m" x="450" y="410" text-anchor="middle">ہر اصول کے نیچے خط والی لکیر عملی آزمائش ہے۔ جو فراہگی ان میں سے کئی توڑ دے وہ پھر بھی اس میں شرکت کروائی جا سکتی ہے،</text><text class="m" x="450" y="430" text-anchor="middle">سند اور رپورٹ کی جا سکتی ہے۔ وہ بس کمرے میں جو ہوتا ہے وہ نہیں بدلے گی۔</text><text class="wm" x="912" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
