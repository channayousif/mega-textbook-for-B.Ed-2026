<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مشق بدلنے والی ترقی کے اصول</title><desc id="d">تدریسی عمل بدلنے والی ترقی کا تصوراتی نقشہ: چھ شاخیں مسلسل، کلاس روم سے جڑی ہوئی، مواد پر مرکوز، باہمی، تاثرات سے تقویت پانے والی اور استاد کی چنی ہوئی ترقی کو ظاہر کرتی ہیں، اور ہر شاخ بتاتی ہے کہ وہ کیا رد کرتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.n{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.ro{fill:var(--panel);stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3}.e{stroke:var(--a2);stroke-width:2;fill:none}.ah{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="570"/><g id="layer-regions"></g><g id="layer-edges"><path id="edge-centre-sustained" class="e" d="M480 226 C500 226 500 40 518 40" marker-end="url(#arrow)"/><path id="edge-centre-embedded" class="e" d="M300 226 C280 226 280 40 262 40" marker-end="url(#arrow)"/><path id="edge-centre-focused" class="e" d="M480 250 C500 250 500 200 518 200" marker-end="url(#arrow)"/><path id="edge-centre-collaborative" class="e" d="M300 250 C280 250 280 200 262 200" marker-end="url(#arrow)"/><path id="edge-centre-feedback" class="e" d="M480 274 C500 274 500 360 518 360" marker-end="url(#arrow)"/><path id="edge-centre-chosen" class="e" d="M300 274 C280 274 280 360 262 360" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-centre"><rect class="ctr" x="300" y="210" width="180" height="80" rx="10"/><text class="h" x="390" y="245.2" text-anchor="middle">‏مشق بدلنے والی‏</text><text class="h" x="390" y="265.2" text-anchor="middle">‏ترقی‏</text></g><g id="node-sustained"><rect class="n" x="520" y="20" width="240" height="40" rx="6"/><text class="sh" x="748" y="44.9" text-anchor="end">‏وقت کے ساتھ مسلسل‏</text><rect class="ro" x="520" y="66" width="240" height="60" rx="4"/><text class="small" x="748" y="90.5" text-anchor="end">‏رد کرتی ہے: اکیلی، ایک دن کی‏</text><text class="small" x="748" y="110.5" text-anchor="end">‏تقریب‏</text></g><g id="node-embedded"><rect class="n" x="20" y="20" width="240" height="60" rx="6"/><text class="sh" x="248" y="54.9" text-anchor="end">‏اپنے کلاس روم میں جڑی ہوئی‏</text><rect class="ro" x="20" y="86" width="240" height="60" rx="4"/><text class="small" x="248" y="110.5" text-anchor="end">‏رد کرتی ہے: ان شاگردوں سے دور‏</text><text class="small" x="248" y="130.6" text-anchor="end">‏تربیت جنہیں آپ پڑھاتے ہیں‏</text></g><g id="node-focused"><rect class="n" x="520" y="180" width="240" height="60" rx="6"/><text class="sh" x="748" y="214.9" text-anchor="end">‏مواد اور شاگردوں پر مرکوز‏</text><rect class="ro" x="520" y="246" width="240" height="60" rx="4"/><text class="small" x="748" y="270.6" text-anchor="end">‏رد کرتی ہے: عمومی تدریس پر عام‏</text><text class="small" x="748" y="290.6" text-anchor="end">‏نشستیں‏</text></g><g id="node-collaborative"><rect class="n" x="20" y="180" width="240" height="40" rx="6"/><text class="sh" x="248" y="204.9" text-anchor="end">‏باہمی‏</text><rect class="ro" x="20" y="226" width="240" height="60" rx="4"/><text class="small" x="248" y="250.6" text-anchor="end">‏رد کرتی ہے: اکیلے، بغیر مشاہدے‏</text><text class="small" x="248" y="270.6" text-anchor="end">‏بہتر ہونا‏</text></g><g id="node-feedback"><rect class="n" x="520" y="340" width="240" height="40" rx="6"/><text class="sh" x="748" y="364.9" text-anchor="end">‏تاثرات سے سہارا والی‏</text><rect class="ro" x="520" y="386" width="240" height="60" rx="4"/><text class="small" x="748" y="410.6" text-anchor="end">‏رد کرتی ہے: اُس سبق پر مشورہ‏</text><text class="small" x="748" y="430.6" text-anchor="end">‏جسے کوئی نہیں دیکھا‏</text></g><g id="node-chosen"><rect class="n" x="20" y="340" width="240" height="40" rx="6"/><text class="sh" x="248" y="364.9" text-anchor="end">‏استاد کی چنی ہوئی‏</text><rect class="ro" x="20" y="386" width="240" height="60" rx="4"/><text class="small" x="248" y="410.6" text-anchor="end">‏رد کرتی ہے: وہ سونپا گیا کورس‏</text><text class="small" x="248" y="430.6" text-anchor="end">‏جسے کسی نے نہیں مانگا‏</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="760" y="501.1" text-anchor="end">‏ہر اصول کے نیچے خط والی لکیر عملی آزمائش ہے۔ جو فراہمی ان میں سے کئی توڑ دے وہ پھر بھی‏</text><text class="small" x="760" y="521.0" text-anchor="end">‏اس میں شرکت کروائی جا سکتی ہے، سند اور رپورٹ کی جا سکتی ہے۔ وہ بس کمرے میں جو ہوتا ہے وہ نہیں بدلے گی۔‏</text></g></g><text class="wm" x="12" y="560" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
