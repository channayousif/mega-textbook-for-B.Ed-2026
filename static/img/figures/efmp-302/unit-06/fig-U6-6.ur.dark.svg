<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سبق کے مشترکہ مطالعے کا چکر</title><desc id="d">سبق کے مشترکہ مطالعے کے چکر کا فلوچارٹ: مل کر منصوبہ بنائیے، ایک پڑھائے جبکہ باقی شاگردوں کو دیکھیں، شہادت کا جائزہ لیجیے، سبق میں ترمیم کیجیے اور دوبارہ پڑھائیے۔ مشاہدے کے مرحلے پر نوٹ ہے کہ استاد کو نہیں، شاگردوں کو دیکھیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.ob{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3}.cal{fill:var(--panel);stroke:var(--a3);stroke-width:2;stroke-dasharray:6 4}.f{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.lead{stroke:var(--a3);stroke-width:2;fill:none}.ah3{fill:var(--a3)}.r{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none}.ah2{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah3"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah2"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-plan-observe" class="f" x1="600" y1="110.0" x2="569" y2="110.0" marker-end="url(#arrow)"/><line id="edge-observe-examine" class="f" x1="407" y1="110.0" x2="375" y2="110.0" marker-end="url(#arrow)"/><line id="edge-examine-revise" class="f" x1="213" y1="110.0" x2="182" y2="110.0" marker-end="url(#arrow)"/><line id="edge-observe-watch" class="lead" x1="487" y1="180" x2="487" y2="218" marker-end="url(#arrow3)"/><path id="edge-revise-plan" class="r" d="M100 180 L100 320 L680 320 L680 182" marker-end="url(#arrow2)"/></g><g id="layer-nodes"><g id="node-plan"><rect class="st" x="600" y="40" width="160" height="140" rx="8"/><text class="sh" x="680" y="63.9" text-anchor="middle">‏1 مل کر ایک سبق‏</text><text class="sh" x="680" y="83.9" text-anchor="middle">‏منصوبہ بنائیے‏</text><text class="small" x="680" y="135.1" text-anchor="middle">‏گروپ، کوئی فرد نہیں‏</text></g><g id="node-observe"><rect class="ob" x="407" y="40" width="160" height="140" rx="8"/><text class="sh" x="487" y="63.9" text-anchor="middle">‏2 ایک پڑھائے؛ باقی‏</text><text class="sh" x="487" y="83.9" text-anchor="middle">‏مشاہدہ کریں‏</text><text class="small" x="487" y="135.1" text-anchor="middle">‏سبق گروپ کا ہے‏</text></g><g id="node-examine"><rect class="st" x="213" y="40" width="160" height="140" rx="8"/><text class="sh" x="293" y="63.9" text-anchor="middle">‏3 شہادت کا‏</text><text class="sh" x="293" y="83.9" text-anchor="middle">‏جائزہ لیجیے‏</text><text class="small" x="293" y="135.1" text-anchor="middle">‏شاگردوں نے کیا کیا‏</text><text class="small" x="293" y="155.1" text-anchor="middle">‏اور کیا سمجھا‏</text></g><g id="node-revise"><rect class="st" x="20" y="40" width="160" height="140" rx="8"/><text class="sh" x="100" y="63.9" text-anchor="middle">‏4 سبق درست کیجیے‏</text><text class="small" x="100" y="135.1" text-anchor="middle">‏پھر 5، دوبارہ پڑھائیے‏</text></g><g id="node-watch"><rect class="cal" x="377" y="220" width="220" height="60" rx="6"/><text class="sh" x="487" y="244.9" text-anchor="middle">‏شاگردوں کو دیکھیے،‏</text><text class="sh" x="487" y="264.9" text-anchor="middle">‏استاد کو نہیں‏</text></g></g><g id="layer-labels"><g id="label-return"><text class="small" x="390" y="341.1" text-anchor="middle">‏درست شدہ سبق، اور گروپ نے یہ کیا سیکھا‏</text><text class="small" x="390" y="361.1" text-anchor="middle">‏کہ شاگرد یہ کیسے سیکھتے ہیں‏</text></g><g id="label-caption"><text class="small" x="760" y="411.1" text-anchor="end">‏منزل 2 وہی ہے جو اسے چلاتی ہے اور مشکل بناتی ہے: کسی کا جائزہ نہیں لیا جا رہا، چنانچہ دیکھنے والے‏</text><text class="small" x="760" y="431.1" text-anchor="end">‏سیکھنے کو دیکھنے کے آزاد ہیں، کارکردگی کو نہیں۔ جس لمحے یہ استاد کا مشاہدہ بن جائے،‏</text><text class="small" x="760" y="451.1" text-anchor="end">‏چکر کچھ بھی پیدا کرنا بند کر دیتا ہے۔‏</text></g></g><text class="wm" x="12" y="490" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
