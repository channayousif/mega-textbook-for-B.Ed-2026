<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تدریسی کیریئر کے تین مراحل</title><desc id="d">تدریسی کیریئر کا وقت خط جو تربیت سے پہلے، نئے استاد اور تجربہ کار استاد کے مراحل سے گزرتا ہے، ہر تبدیلی پر یہ لکھا ہے کہ کیا بدلتا ہے اور ہر مرحلے پر کیا سب سے زیادہ درکار ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .s1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .s2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .s3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .nd{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .tr{fill:none;stroke:var(--a4);stroke-width:2;stroke-dasharray:6 4} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .t{font-size:10.5px;fill:var(--a4);font-weight:700} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><line class="ax" x1="30" y1="230" x2="870" y2="230"/><rect class="s1" x="640" y="100" width="220" height="80" rx="6"/><text class="h" x="750" y="130" text-anchor="middle">تربیت سے پہلے</text><text class="m" x="750" y="152" text-anchor="middle">تدریس سیکھنا، جبکہ</text><text class="m" x="750" y="168" text-anchor="middle">ابھی کوئی آپ پر منحصر نہیں</text><rect class="s2" x="340" y="100" width="220" height="80" rx="6"/><text class="h" x="450" y="130" text-anchor="middle">نیا استاد</text><text class="m" x="450" y="152" text-anchor="middle">پہلے دن سے ایک جماعت</text><text class="m" x="450" y="168" text-anchor="middle">کی ذمہ داری</text><rect class="s3" x="40" y="100" width="220" height="80" rx="6"/><text class="h" x="150" y="130" text-anchor="middle">تجربہ کار استاد</text><text class="m" x="150" y="152" text-anchor="middle">اہل، اور کس میں بہتر</text><text class="m" x="150" y="168" text-anchor="middle">ہونا ہے خود چن سکتا</text><text class="t" x="600" y="122" text-anchor="middle">مشاہدے سے</text><text class="t" x="600" y="106" text-anchor="middle">ذمہ داری کی طرف</text><text class="t" x="300" y="122" text-anchor="middle">بچنے سے</text><text class="t" x="300" y="106" text-anchor="middle">چننے کی طرف</text><line class="ax" x1="750" y1="180" x2="750" y2="224" stroke-width="1.5"/><line class="ax" x1="450" y1="180" x2="450" y2="224" stroke-width="1.5"/><line class="ax" x1="150" y1="180" x2="150" y2="224" stroke-width="1.5"/><rect class="nd" x="640" y="252" width="220" height="56" rx="5"/><text class="h" x="750" y="274" text-anchor="middle">سب سے زیادہ درکار</text><text class="m" x="750" y="296" text-anchor="middle">جلد، حقیقی شاگردوں کے ساتھ مشق</text><rect class="nd" x="340" y="252" width="220" height="56" rx="5"/><text class="h" x="450" y="274" text-anchor="middle">سب سے زیادہ درکار</text><text class="m" x="450" y="296" text-anchor="middle">پوچھنے کو کوئی نامزد ساتھی</text><rect class="nd" x="40" y="252" width="220" height="56" rx="5"/><text class="h" x="150" y="274" text-anchor="middle">سب سے زیادہ درکار</text><text class="m" x="150" y="296" text-anchor="middle">بہاؤ سے بچنے کی کوئی وجہ</text><text class="m" x="758" y="352" text-anchor="end">دونوں تبدیلیاں وہیں جہاں استاد کھو جاتے ہیں: پہلی اس لیے کہ ذمہ داری ایک ساتھ آ جاتی ہے، دوسری اس لیے کہ مہارت</text><text class="m" x="758" y="370" text-anchor="end">وہ دباؤ ہٹا دیتی ہے جو بہتری چلاتا تھا، اور اس کی جگہ کچھ نہیں لیتا جب تک استاد خود نہ چنے۔</text><text class="wm" x="888" y="382" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
