<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The lesson study cycle</title><desc id="d">Flowchart of the lesson study cycle - plan together, one teaches while others observe the pupils, examine the evidence, revise, re-teach - with the observation station annotated to watch the pupils rather than the teacher.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .ob{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .r{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none} .cal{fill:var(--panel);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="430"/><rect class="st" x="30" y="120" width="150" height="70" rx="6"/><text class="h" x="105" y="148" text-anchor="middle">1 Plan ONE lesson</text><text class="h" x="105" y="166" text-anchor="middle">together</text><text class="m" x="105" y="182" text-anchor="middle">a group, not an individual</text><rect class="ob" x="220" y="120" width="180" height="70" rx="6"/><text class="h" x="310" y="148" text-anchor="middle">2 One teaches;</text><text class="h" x="310" y="166" text-anchor="middle">the others observe</text><text class="m" x="310" y="182" text-anchor="middle">the lesson belongs to the group</text><rect class="st" x="440" y="120" width="180" height="70" rx="6"/><text class="h" x="530" y="148" text-anchor="middle">3 Examine the</text><text class="h" x="530" y="166" text-anchor="middle">evidence</text><text class="m" x="530" y="182" text-anchor="middle">what pupils did and understood</text><rect class="st" x="660" y="120" width="180" height="70" rx="6"/><text class="h" x="750" y="148" text-anchor="middle">4 Revise the lesson</text><text class="m" x="750" y="170" text-anchor="middle">then 5, teach it again</text><path class="f" d="M180 155 L215 155" marker-end="url(#a)"/><path class="f" d="M400 155 L435 155" marker-end="url(#a)"/><path class="f" d="M620 155 L655 155" marker-end="url(#a)"/><rect class="cal" x="200" y="230" width="220" height="50" rx="5"/><text class="h" x="310" y="252" text-anchor="middle">Watch the PUPILS,</text><text class="h" x="310" y="270" text-anchor="middle">not the teacher</text><path class="f" d="M310 190 L310 226" stroke="var(--a3)" marker-end="url(#a)"/><path class="r" d="M750 190 L750 330 L105 330 L105 194" marker-end="url(#c)"/><text class="m" x="430" y="322" text-anchor="middle">the revised lesson, and what the group learned about how pupils learn this</text><text class="m" x="30" y="376">Station 2 is what makes it work and what makes it hard: nobody is being appraised, so the observers are free to look at learning</text><text class="m" x="30" y="394">rather than performance. The moment it becomes an observation of the teacher, the cycle stops producing anything.</text><text class="wm" x="868" y="404" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
