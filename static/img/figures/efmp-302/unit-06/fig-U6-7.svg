<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A one-page professional development plan</title><desc id="d">Diagram of a one-page development plan with six blocks - the gap, the evidence for it, one goal, the activity, the evidence of change, and the review date - annotated one goal not five, and evidence decided now.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.pg{fill:none;stroke:var(--ink);stroke-width:2.5}.b{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2}.note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2}.ld{stroke:var(--a3);stroke-width:2;fill:none}.ah{fill:var(--a3)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="640"/><g id="layer-regions"><rect id="region-page" class="pg" x="20" y="20" width="460" height="580" rx="4"/></g><g id="layer-edges"><line id="edge-goal-one-goal" class="ld" x1="518" y1="300" x2="462" y2="300" marker-end="url(#arrow)"/><line id="edge-change-decided-now" class="ld" x1="518" y1="488" x2="462" y2="488" marker-end="url(#arrow)"/></g><g id="layer-nodes"><g id="node-gap"><rect class="b2" x="40" y="70" width="420" height="84" rx="6"/><text class="sh" x="54" y="96.9">1 The gap, stated specifically</text><text class="small" x="54" y="122.5">not "assessment" but "I cannot tell</text><text class="small" x="54" y="142.6">mid-lesson who is lost"</text></g><g id="node-baseline"><rect class="b2" x="40" y="164" width="420" height="84" rx="6"/><text class="sh" x="54" y="190.9">2 The evidence that the gap is real</text><text class="small" x="54" y="216.6">last term's results, or a colleague's</text><text class="small" x="54" y="236.6">observation, not a feeling</text></g><g id="node-goal"><rect class="b" x="40" y="258" width="420" height="84" rx="6"/><text class="sh" x="54" y="284.9">3 One goal for the year</text><text class="small" x="54" y="320.6">written so you could tell whether you met it</text></g><g id="node-activity"><rect class="b" x="40" y="352" width="420" height="84" rx="6"/><text class="sh" x="54" y="378.9">4 The activity that addresses it</text><text class="small" x="54" y="404.6">chosen against the six principles, not</text><text class="small" x="54" y="424.6">against what is on offer</text></g><g id="node-change"><rect class="b" x="40" y="446" width="420" height="84" rx="6"/><text class="sh" x="54" y="472.9">5 The evidence that would show change</text><text class="small" x="54" y="498.6">the same measure as block 2, so the two</text><text class="small" x="54" y="518.5">can be compared</text></g><g id="node-review"><rect class="b2" x="40" y="540" width="420" height="44" rx="6"/><text class="sh" x="54" y="566.9">6 The review date</text></g><g id="node-one-goal"><rect class="note" x="520" y="256.0" width="240" height="88" rx="6"/><text class="sh" x="534" y="279.9">One, not five.</text><text class="small" x="534" y="303.1">Five goals is a list of</text><text class="small" x="534" y="323.1">regrets by March.</text></g><g id="node-decided-now"><rect class="note" x="520" y="434.0" width="240" height="108" rx="6"/><text class="sh" x="534" y="457.9">Decided now, not</text><text class="sh" x="534" y="477.9">in March.</text><text class="small" x="534" y="501.1">Evidence chosen later</text><text class="small" x="534" y="521.0">always flatters.</text></g></g><g id="layer-labels"><g id="label-page"><text class="small" x="34" y="50.5">One page. If it needs two, the plan is too big.</text></g><g id="label-blocks"><text class="small" x="520" y="35.0">Blocks 1, 2 and 6 are what make</text><text class="small" x="520" y="55.0">it checkable. Blocks 3, 4 and 5</text><text class="small" x="520" y="75.0">are what make it a plan rather</text><text class="small" x="520" y="95.0">than a wish.</text></g><g id="label-fail"><text class="small" x="520" y="129.1">Most plans fail at 2 and 5: no</text><text class="small" x="520" y="149.1">baseline, and no agreed way</text><text class="small" x="520" y="169.1">to tell.</text></g></g><text class="wm" x="768" y="630" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
