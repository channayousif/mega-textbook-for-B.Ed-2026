<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A one-page professional development plan</title><desc id="d">Diagram of a one-page development plan with six blocks - the gap, the evidence for it, one goal, the activity, the evidence of change, and the review date - annotated one goal not five, and evidence decided now.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .pg{fill:none;stroke:var(--ink);stroke-width:2.5} .b{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .bg2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ld{stroke:var(--a3);stroke-width:1.8;fill:none} text{font-size:11.5px;fill:var(--ink)} .n{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="470"/><rect class="pg" x="30" y="30" width="520" height="400" rx="4"/><text class="m" x="42" y="52">One page. If it needs two, the plan is too big.</text><rect class="bg2" x="50" y="64" width="480" height="56" rx="5"/><text class="n" x="62" y="86">1 The gap, stated specifically</text><text class="m" x="62" y="106">not "assessment" but "I cannot tell mid-lesson who is lost"</text><rect class="bg2" x="50" y="128" width="480" height="56" rx="5"/><text class="n" x="62" y="150">2 The evidence that the gap is real</text><text class="m" x="62" y="170">last term's results, or a colleague's observation, not a feeling</text><rect class="b" x="50" y="192" width="480" height="56" rx="5"/><text class="n" x="62" y="214">3 One goal for the year</text><text class="m" x="62" y="234">written so you could tell whether you met it</text><rect class="b" x="50" y="256" width="480" height="56" rx="5"/><text class="n" x="62" y="278">4 The activity that addresses it</text><text class="m" x="62" y="298">chosen against the six principles, not against what is on offer</text><rect class="b" x="50" y="320" width="480" height="56" rx="5"/><text class="n" x="62" y="342">5 The evidence that would show change</text><text class="m" x="62" y="362">the same measure as block 2, so the two can be compared</text><rect class="bg2" x="50" y="384" width="480" height="34" rx="5"/><text class="n" x="62" y="406">6 The review date</text><path class="ld" x1="0" d="M534 220 L600 220" marker-end="url(#a)"/><rect class="note" x="606" y="196" width="250" height="48" rx="5"/><text class="n" x="618" y="218">One, not five.</text><text class="m" x="618" y="236">Five goals is a list of regrets by March.</text><path class="ld" d="M534 348 L600 348" marker-end="url(#a)"/><rect class="note" x="606" y="324" width="250" height="48" rx="5"/><text class="n" x="618" y="346">Decided now, not in March.</text><text class="m" x="618" y="364">Evidence chosen later always flatters.</text><text class="m" x="606" y="86">Blocks 1, 2 and 6 are what make it</text><text class="m" x="606" y="104">checkable. Blocks 3, 4 and 5 are what</text><text class="m" x="606" y="122">make it a plan rather than a wish.</text><text class="m" x="606" y="150">Most plans fail at 2 and 5: no baseline,</text><text class="m" x="606" y="168">and no agreed way to tell.</text><text class="wm" x="868" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
