<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six principles, and what each rules out</title><desc id="d">Concept map of development that changes practice with six branches - sustained, embedded, content-focused, collaborative, feedback-supported and teacher-chosen - each noting what it rules out.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .ro{fill:var(--panel);stroke:var(--a3);stroke-width:1.5;stroke-dasharray:4 3} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="924" height="470"/><rect class="ctr" x="350" y="200" width="200" height="66" rx="8"/><text class="h" x="450" y="226" text-anchor="middle">Development that</text><text class="h" x="450" y="246" text-anchor="middle">changes practice</text><rect class="n" x="20" y="30" width="250" height="40" rx="5"/><text class="h" x="32" y="55">Sustained over time</text><rect class="ro" x="20" y="72" width="250" height="26" rx="4"/><text class="m" x="32" y="90">rules out: the one-day event, alone</text><path class="e" d="M350 214 L272 50" marker-end="url(#a)"/><rect class="n" x="630" y="30" width="250" height="40" rx="5"/><text class="h" x="642" y="55">Embedded in your classroom</text><rect class="ro" x="630" y="72" width="250" height="26" rx="4"/><text class="m" x="642" y="90">rules out: training away from the pupils you teach</text><path class="e" d="M550 214 L628 50" marker-end="url(#a)"/><rect class="n" x="20" y="120" width="250" height="40" rx="5"/><text class="h" x="32" y="145">Focused on content and pupils</text><rect class="ro" x="20" y="162" width="250" height="26" rx="4"/><text class="m" x="32" y="180">rules out: generic sessions on teaching in general</text><path class="e" d="M350 224 L272 140" marker-end="url(#a)"/><rect class="n" x="630" y="120" width="250" height="40" rx="5"/><text class="h" x="642" y="145">Collaborative</text><rect class="ro" x="630" y="162" width="250" height="26" rx="4"/><text class="m" x="642" y="180">rules out: improving alone, unobserved</text><path class="e" d="M550 224 L628 140" marker-end="url(#a)"/><rect class="n" x="20" y="300" width="250" height="40" rx="5"/><text class="h" x="32" y="325">Supported by feedback</text><rect class="ro" x="20" y="342" width="250" height="26" rx="4"/><text class="m" x="32" y="360">rules out: advice about a lesson nobody watched</text><path class="e" d="M350 250 L272 320" marker-end="url(#a)"/><rect class="n" x="630" y="300" width="250" height="40" rx="5"/><text class="h" x="642" y="325">Chosen by the teacher</text><rect class="ro" x="630" y="342" width="250" height="26" rx="4"/><text class="m" x="642" y="360">rules out: the assigned course nobody asked for</text><path class="e" d="M550 250 L628 320" marker-end="url(#a)"/><text class="m" x="450" y="410" text-anchor="middle">The dashed line under each principle is the practical test. A provision that fails several of these can still be attended,</text><text class="m" x="450" y="430" text-anchor="middle">certified and reported. It simply will not change what happens in the room.</text><text class="wm" x="912" y="452" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
