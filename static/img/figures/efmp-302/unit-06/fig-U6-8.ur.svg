<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 644" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منصوبہ بنائیے، اور سالِ وسط میں جائزہ لیجیے</title><desc id="d">ترقی کا منصوبہ بنانے اور اس میں ترمیم کرنے کا فلوچارٹ، جو سال کے وسط میں ایک فیصلے تک پہنچتا ہے: کیا ہدف سال کے عملی حالات میں قائم رہ سکا؟ وہاں سے ہدف جاری رکھنے، اس کا دائرہ محدود کرنے یا اسے بدلنے کی شاخیں نکلتی ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.dc{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5}.o{fill:var(--panel);stroke:var(--a1);stroke-width:2}.bad{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;stroke-dasharray:5 3}.f{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.br{stroke:var(--a2);stroke-width:2;fill:none}.ah2{fill:var(--a2)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah2"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="644"/><g id="layer-regions"></g><g id="layer-edges"><line id="edge-gap-goal" class="f" x1="644" y1="70.0" x2="606" y2="70.0" marker-end="url(#arrow)"/><line id="edge-goal-activity" class="f" x1="488" y1="70.0" x2="450" y2="70.0" marker-end="url(#arrow)"/><line id="edge-activity-evidence" class="f" x1="332" y1="70.0" x2="294" y2="70.0" marker-end="url(#arrow)"/><line id="edge-evidence-date" class="f" x1="176" y1="70.0" x2="138" y2="70.0" marker-end="url(#arrow)"/><line id="edge-date-act" class="f" x1="78" y1="120" x2="78" y2="158" marker-end="url(#arrow)"/><path id="edge-act-decision" class="f" d="M78 204 L78 230 L390 230 L390 258" marker-end="url(#arrow)"/><path id="edge-decision-continue" class="br" d="M560 320 L645 320 L645 428" marker-end="url(#arrow2)"/><line id="edge-decision-narrow" class="br" x1="390" y1="380" x2="390" y2="428" marker-end="url(#arrow2)"/><path id="edge-decision-replace" class="br" d="M220 320 L135 320 L135 428" marker-end="url(#arrow2)"/></g><g id="layer-nodes"><g id="node-gap"><rect class="st" x="644" y="20" width="116" height="100" rx="8"/><text class="sh" x="702" y="41.9" text-anchor="middle">‏1 خلا پہچانیے‏</text><text class="small" x="702" y="87.0" text-anchor="middle">‏حقیقی شہادت سے‏</text></g><g id="node-goal"><rect class="st" x="488" y="20" width="116" height="100" rx="8"/><text class="sh" x="546" y="64.9" text-anchor="middle">‏2 ایک ہدف‏</text><text class="sh" x="546" y="84.9" text-anchor="middle">‏لکھیے‏</text></g><g id="node-activity"><rect class="st" x="332" y="20" width="116" height="100" rx="8"/><text class="sh" x="390" y="64.9" text-anchor="middle">‏3 سرگرمی‏</text><text class="sh" x="390" y="84.9" text-anchor="middle">‏چنیے‏</text></g><g id="node-evidence"><rect class="st" x="176" y="20" width="116" height="100" rx="8"/><text class="sh" x="234" y="64.9" text-anchor="middle">‏4 تبدیلی کی‏</text><text class="sh" x="234" y="84.9" text-anchor="middle">‏شہادت طے کیجیے‏</text></g><g id="node-date"><rect class="st" x="20" y="20" width="116" height="100" rx="8"/><text class="sh" x="78" y="64.9" text-anchor="middle">‏5 جائزے کی‏</text><text class="sh" x="78" y="84.9" text-anchor="middle">‏تاریخ رکھیے‏</text></g><g id="node-act"><rect class="st" x="20" y="160" width="116" height="44" rx="8"/><text class="sh" x="78" y="186.9" text-anchor="middle">‏6 عمل کیجیے‏</text></g><g id="node-decision"><polygon class="dc" points="390,260 220,320 390,380 560,320"/><text class="sh" x="390" y="314.9" text-anchor="middle">‏جائزے کے دن: کیا ہدف‏</text><text class="sh" x="390" y="334.9" text-anchor="middle">‏سال کے ٹکراؤ سے بچا؟‏</text></g><g id="node-continue"><rect class="o" x="530" y="430" width="230" height="84" rx="8"/><text class="sh" x="746" y="451.9" text-anchor="end">‏ویسے ہی جاری رکھیے‏</text><text class="small" x="746" y="477.1" text-anchor="end">‏وہ کام کر رہا ہے؛ چلتا رہے‏</text></g><g id="node-narrow"><rect class="o" x="275" y="430" width="230" height="84" rx="8"/><text class="sh" x="491" y="451.9" text-anchor="end">‏ہدف تنگ کیجیے‏</text><text class="small" x="491" y="477.1" text-anchor="end">‏وہ بہت بڑا تھا؛ چھوٹا کیجیے‏</text></g><g id="node-replace"><rect class="o" x="20" y="430" width="230" height="84" rx="8"/><text class="sh" x="236" y="451.9" text-anchor="end">‏بدل دیجیے‏</text><text class="small" x="236" y="477.1" text-anchor="end">‏اصل خلا کہیں اور نکلا‏</text></g><g id="node-abandon"><rect class="bad" x="20" y="540" width="360" height="64" rx="8"/><text class="small" x="200" y="566.5" text-anchor="middle">‏چوتھی شاخ نہیں: یہ طے کیے بغیر خاموشی سے چھوڑ دینا‏</text><text class="small" x="200" y="586.5" text-anchor="middle">‏کہ تینوں میں سے کون لاگو ہوتا ہے‏</text></g></g><g id="layer-labels"><g id="label-legitimate"><text class="small" x="760" y="551.0" text-anchor="end">‏تینوں نتائج جائز ہیں۔ جو منصوبہ مارچ میں بدلا‏</text><text class="small" x="760" y="571.0" text-anchor="end">‏گیا اس نے آپ کو وہ سکھایا جو اصل ہدف‏</text><text class="small" x="760" y="591.0" text-anchor="end">‏نہیں سکھا سکتا تھا۔‏</text></g></g><text class="wm" x="12" y="634" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
