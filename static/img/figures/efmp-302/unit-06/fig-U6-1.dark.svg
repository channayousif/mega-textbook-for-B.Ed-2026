<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Development, a course, a qualification and an appraisal requirement</title><desc id="d">Table comparing continuing professional development with a training course, a qualification and an appraisal requirement by purpose, who drives it, duration, what counts as success, and what each cannot do.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .h1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .h2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .c1{fill:none;stroke:var(--a1);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="400"/><rect class="rl" x="20" y="28" width="150" height="50"/><rect class="h1" x="170" y="28" width="190" height="50"/><rect class="h2" x="360" y="28" width="175" height="50"/><rect class="h2" x="535" y="28" width="165" height="50"/><rect class="h2" x="700" y="28" width="180" height="50"/><text class="h" x="265" y="48" text-anchor="middle">Continuing professional</text><text class="h" x="265" y="66" text-anchor="middle">development</text><text class="h" x="447" y="58" text-anchor="middle">A training course</text><text class="h" x="617" y="58" text-anchor="middle">A qualification</text><text class="h" x="790" y="48" text-anchor="middle">An appraisal</text><text class="h" x="790" y="66" text-anchor="middle">requirement</text><g><rect class="rl" x="20" y="78" width="150" height="56"/><rect class="c1" x="170" y="78" width="190" height="56"/><rect class="cl" x="360" y="78" width="175" height="56"/><rect class="cl" x="535" y="78" width="165" height="56"/><rect class="cl" x="700" y="78" width="180" height="56"/><text class="rh" x="30" y="110">What it is for</text><text x="180" y="102">Changing what happens</text><text x="180" y="120">in your classroom</text><text x="370" y="110">Transferring content</text><text x="545" y="110">Certifying a level</text><text x="710" y="102">Satisfying a system</text><text x="710" y="120">that is watching</text></g><g><rect class="rl" x="20" y="134" width="150" height="46"/><rect class="c1" x="170" y="134" width="190" height="46"/><rect class="cl" x="360" y="134" width="175" height="46"/><rect class="cl" x="535" y="134" width="165" height="46"/><rect class="cl" x="700" y="134" width="180" height="46"/><text class="rh" x="30" y="162">Who drives it</text><text x="180" y="162">The teacher</text><text x="370" y="162">The provider</text><text x="545" y="162">The awarding body</text><text x="710" y="162">The employer</text></g><g><rect class="rl" x="20" y="180" width="150" height="46"/><rect class="c1" x="170" y="180" width="190" height="46"/><rect class="cl" x="360" y="180" width="175" height="46"/><rect class="cl" x="535" y="180" width="165" height="46"/><rect class="cl" x="700" y="180" width="180" height="46"/><text class="rh" x="30" y="208">How long it lasts</text><text x="180" y="208">A career</text><text x="370" y="208">Days</text><text x="545" y="208">Years, then done</text><text x="710" y="208">A cycle</text></g><g><rect class="rl" x="20" y="226" width="150" height="56"/><rect class="c1" x="170" y="226" width="190" height="56"/><rect class="cl" x="360" y="226" width="175" height="56"/><rect class="cl" x="535" y="226" width="165" height="56"/><rect class="cl" x="700" y="226" width="180" height="56"/><text class="rh" x="30" y="258">What counts as</text><text class="rh" x="30" y="274">success</text><text x="180" y="250">Practice that changed,</text><text x="180" y="268">and pupils who noticed</text><text x="370" y="258">Attendance</text><text x="545" y="258">The award</text><text x="710" y="258">The box ticked</text></g><g><rect class="rl" x="20" y="282" width="150" height="56"/><rect class="c1" x="170" y="282" width="190" height="56"/><rect class="cl" x="360" y="282" width="175" height="56"/><rect class="cl" x="535" y="282" width="165" height="56"/><rect class="cl" x="700" y="282" width="180" height="56"/><text class="rh" x="30" y="314">What it cannot do</text><text x="180" y="306">Happen to you without</text><text x="180" y="324">your participation</text><text x="370" y="306">Make you use it</text><text x="370" y="324">on Monday</text><text x="545" y="314">Keep you current</text><text x="710" y="306">Tell you what</text><text x="710" y="324">to improve</text></g><text class="m" x="20" y="366">The other three can all be completed without a single lesson changing. Only the first column is defined by the change itself,</text><text class="m" x="20" y="384">which is why hours attended is a measure of the wrong thing.</text><text class="wm" x="888" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
