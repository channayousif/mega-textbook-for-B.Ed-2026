<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 574" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Development, a course, a qualification and an appraisal requirement</title><desc id="d">Table comparing continuing professional development with a training course, a qualification and an appraisal requirement by purpose, who drives it, duration, what counts as success, and what each cannot do.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.alt{fill:var(--a3-fill)}.alt-line{stroke:var(--a3);stroke-width:2.5;fill:none;stroke-dasharray:8 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="574"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="84"/><rect id="region-focus" class="focus" x="160" y="104" width="180" height="370"/><line class="grid" x1="160" y1="20" x2="160" y2="474"/><line class="grid" x1="340" y1="20" x2="340" y2="474"/><line class="grid" x1="480" y1="20" x2="480" y2="474"/><line class="grid" x1="620" y1="20" x2="620" y2="474"/><line class="grid" x1="20" y1="194" x2="760" y2="194"/><line class="grid" x1="20" y1="264" x2="760" y2="264"/><line class="grid" x1="20" y1="334" x2="760" y2="334"/><line class="grid" x1="20" y1="404" x2="760" y2="404"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="454"/><rect id="region-focus-outline" class="focus-line" x="160" y="20" width="180" height="454"/><line class="frame" x1="20" y1="104" x2="760" y2="104"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="172" y="46.9">Continuing</text><text class="sh" x="172" y="66.9">professional</text><text class="sh" x="172" y="86.9">development</text><text class="sh" x="352" y="56.9">A training</text><text class="sh" x="352" y="76.9">course</text><text class="sh" x="492" y="56.9">A</text><text class="sh" x="492" y="76.9">qualification</text><text class="sh" x="632" y="56.9">An appraisal</text><text class="sh" x="632" y="76.9">requirement</text></g><g id="node-purpose"><text class="bt" x="32" y="153.6">What it is for</text><text class="body" x="172" y="143.6">Changing what happens</text><text class="body" x="172" y="163.6">in your classroom</text><text class="body" x="352" y="143.6">Transferring</text><text class="body" x="352" y="163.6">content</text><text class="body" x="492" y="143.6">Certifying a</text><text class="body" x="492" y="163.6">level</text><text class="body" x="632" y="133.6">Satisfying a</text><text class="body" x="632" y="153.6">system that is</text><text class="body" x="632" y="173.6">watching</text></g><g id="node-driver"><text class="bt" x="32" y="233.6">Who drives it</text><text class="body" x="172" y="233.6">The teacher</text><text class="body" x="352" y="233.6">The provider</text><text class="body" x="492" y="223.6">The awarding</text><text class="body" x="492" y="243.6">body</text><text class="body" x="632" y="233.6">The employer</text></g><g id="node-duration"><text class="bt" x="32" y="293.6">How long it</text><text class="bt" x="32" y="313.6">lasts</text><text class="body" x="172" y="303.6">A career</text><text class="body" x="352" y="303.6">Days</text><text class="body" x="492" y="293.6">Years, then</text><text class="body" x="492" y="313.6">done</text><text class="body" x="632" y="303.6">A cycle</text></g><g id="node-success"><text class="bt" x="32" y="363.6">What counts as</text><text class="bt" x="32" y="383.6">success</text><text class="body" x="172" y="363.6">Practice that changed,</text><text class="body" x="172" y="383.6">and pupils who noticed</text><text class="body" x="352" y="373.6">Attendance</text><text class="body" x="492" y="373.6">The award</text><text class="body" x="632" y="373.6">The box ticked</text></g><g id="node-limit"><text class="bt" x="32" y="433.6">What it cannot</text><text class="bt" x="32" y="453.6">do</text><text class="body" x="172" y="433.6">Happen to you without</text><text class="body" x="172" y="453.6">your participation</text><text class="body" x="352" y="433.6">Make you use it</text><text class="body" x="352" y="453.6">on Monday</text><text class="body" x="492" y="443.6">Keep you current</text><text class="body" x="632" y="433.6">Tell you what</text><text class="body" x="632" y="453.6">to improve</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="20" y="505.1">The other three can all be completed without a single lesson changing. Only the first column is</text><text class="small" x="20" y="525.0">defined by the change itself, which is why hours attended is a measure of the wrong thing.</text></g></g><text class="wm" x="768" y="564" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
