d="node-reflective"><text class="bt" x="748" y="523.5" text-anchor="end">‏غور و فکر کے‏</text><text class="bt" x="748" y="543.5" text-anchor="end">‏اوزار‏</text><text class="body" x="628" y="523.5" text-anchor="end">‏تقریباً‏</text><text class="body" x="628" y="543.5" text-anchor="end">‏کوئی نہیں‏</text><text class="body" x="528" y="523.5" text-anchor="end">‏ایک‏</text><text class="body" x="528" y="543.5" text-anchor="end">‏استاد‏</text><text class="body" x="448" y="523.5" text-anchor="end">‏جڑی ہوئی،‏</text><text class="body" x="448" y="543.5" text-anchor="end">‏استاد کی چنی ہوئی‏</text><text class="body" x="278" y="523.5" text-anchor="end">‏کوئی نمونہ‏</text><text class="body" x="278" y="543.5" text-anchor="end">‏نوٹس کرنا‏</text><text class="body" x="138" y="523.5" text-anchor="end">‏آپ غلط ہوں تو‏</text><text class="body" x="138" y="543.5" text-anchor="end">‏آپ کو درست کرنا‏</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="760" y="605.0" text-anchor="end">‏نمایاں کی ہوئی قطار صرف اپنی ساخت سے چھ میں سے پانچ اصول پورا کرتی ہے؛ صرف استاد کا چننا‏</text><text class="small" x="760" y="625.0" text-anchor="end">‏اس بات پر منحصر ہے کہ اسکول اسے کیسے بناتا ہے۔ اس کی لاگت پیسہ نہیں وقت ہے،‏</text><text class="small" x="760" y="645.0" text-anchor="end">‏اسی لیے وقت کی حفاظت نہ ہونے پر یہ سب سے پہلے گرتی ہے۔‏</text></g></g><text class="wm" x="12" y="684" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
