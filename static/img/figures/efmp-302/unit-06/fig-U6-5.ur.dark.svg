<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ترقی کے پانچ راستوں کا موازنہ</title><desc id="d">کانفرنسیں، ورکشاپس، آن لائن پلیٹ فارم، پیشہ ورانہ تعلمی برادریاں اور غور و فکر کے اوزار کا موازنہ کرنے والا جدول: لاگت، رسائی، کون سے اصول ہر ایک پورا کرتی ہے، کس کام کے موزوں، اور کیا نہیں کر سکتی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .best{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{font-size:11px;fill:var(--ink)} .h{font-size:11.5px;font-weight:700} .rh{font-size:11px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="936" height="400"/><rect class="rl" x="766" y="28" width="150" height="50"/><rect class="hd" x="636" y="28" width="130" height="50"/><rect class="hd" x="526" y="28" width="110" height="50"/><rect class="hd" x="336" y="28" width="190" height="50"/><rect class="hd" x="196" y="28" width="140" height="50"/><rect class="hd" x="56" y="28" width="140" height="50"/><text class="h" x="701" y="48" text-anchor="middle">لاگت: پیسہ</text><text class="h" x="701" y="66" text-anchor="middle">اور وقت</text><text class="h" x="581" y="58" text-anchor="middle">رسائی</text><text class="h" x="431" y="48" text-anchor="middle">موضوع 6.1 کے اصول جو</text><text class="h" x="431" y="66" text-anchor="middle">فطری طور پر پورا کرتی ہے</text><text class="h" x="266" y="58" text-anchor="middle">کن کام کے موزوں</text><text class="h" x="126" y="58" text-anchor="middle">نہیں کر سکتی</text><rect class="rl" x="766" y="78" width="150" height="54"/><rect class="cl" x="636" y="78" width="130" height="54"/><rect class="cl" x="526" y="78" width="110" height="54"/><rect class="cl" x="336" y="78" width="190" height="54"/><rect class="cl" x="196" y="78" width="140" height="54"/><rect class="cl" x="56" y="78" width="140" height="54"/><text class="rh" x="906" y="110" text-anchor="end">کانفرنس</text><text x="701" y="110" text-anchor="middle">زیادہ پیسہ، کم وقت</text><text x="581" y="110" text-anchor="middle">چند</text><text x="516" y="110" text-anchor="end">ضرور نہیں کوئی</text><text x="326" y="102" text-anchor="end">لوگوں سے ملنا؛</text><text x="326" y="120" text-anchor="end">دیکھنا کیا موجود ہے</text><text x="186" y="110" text-anchor="end">سبق بدلنا</text><rect class="rl" x="766" y="132" width="150" height="54"/><rect class="cl" x="636" y="132" width="130" height="54"/><rect class="cl" x="526" y="132" width="110" height="54"/><rect class="cl" x="336" y="132" width="190" height="54"/><rect class="cl" x="196" y="132" width="140" height="54"/><rect class="cl" x="56" y="132" width="140" height="54"/><text class="rh" x="906" y="164" text-anchor="end">ورکشاپ</text><text x="701" y="164" text-anchor="middle">درمیانہ</text><text x="581" y="164" text-anchor="middle">بہت سے</text><text x="516" y="156" text-anchor="end">مواد پر مرکوز، اگر</text><text x="516" y="174" text-anchor="end">مضمون سے مخصوص ہو</text><text x="326" y="156" text-anchor="end">ایک نام لینے قابل</text><text x="326" y="174" text-anchor="end">تکنیک</text><text x="186" y="164" text-anchor="end">خود قائم رہنا</text><rect class="rl" x="766" y="186" width="150" height="54"/><rect class="cl" x="636" y="186" width="130" height="54"/><rect class="cl" x="526" y="186" width="110" height="54"/><rect class="cl" x="336" y="186" width="190" height="54"/><rect class="cl" x="196" y="186" width="140" height="54"/><rect class="cl" x="56" y="186" width="140" height="54"/><text class="rh" x="906" y="218" text-anchor="end">آن لائن پلیٹ فارم</text><text x="701" y="218" text-anchor="middle">کم پیسہ</text><text x="581" y="218" text-anchor="middle">بہت زیادہ</text><text x="516" y="210" text-anchor="end">استاد کی چنی ہوئی، پیچھا</text><text x="516" y="228" text-anchor="end">کرنے پر مسلسل</text><text x="326" y="210" text-anchor="end">مخصوص علمی</text><text x="326" y="228" text-anchor="end">خلا بھرنا</text><text x="186" y="210" text-anchor="end">آپ کی تدریس پر</text><text x="186" y="228" text-anchor="end">تاثرات دینا</text><rect class="best" x="766" y="240" width="150" height="54"/><rect class="best" x="636" y="240" width="130" height="54"/><rect class="best" x="526" y="240" width="110" height="54"/><rect class="best" x="336" y="240" width="190" height="54"/><rect class="best" x="196" y="240" width="140" height="54"/><rect class="best" x="56" y="240" width="140" height="54"/><text class="rh" x="906" y="266" text-anchor="end">پیشہ ورانہ تعلمی</text><text class="rh" x="906" y="284" text-anchor="end">برادری</text><text x="701" y="272" text-anchor="middle">کم پیسہ،</text><text x="701" y="288" text-anchor="middle">زیادہ وقت</text><text x="581" y="272" text-anchor="middle">ایک اسکول</text><text x="516" y="258" text-anchor="end">مسلسل، جڑی ہوئی، مرکوز،</text><text x="516" y="276" text-anchor="end">باہمی، تاثرات والی</text><text x="326" y="272" text-anchor="end">بدلنا مشق جو</text><text x="326" y="288" text-anchor="end">جم گئی ہو</text><text x="186" y="272" text-anchor="end">بغیر محفوظ وقت</text><text x="186" y="288" text-anchor="end">کام کرنا</text><rect class="rl" x="766" y="294" width="150" height="54"/><rect class="cl" x="636" y="294" width="130" height="54"/><rect class="cl" x="526" y="294" width="110" height="54"/><rect class="cl" x="336" y="294" width="190" height="54"/><rect class="cl" x="196" y="294" width="140" height="54"/><rect class="cl" x="56" y="294" width="140" height="54"/><text class="rh" x="906" y="326" text-anchor="end">غور و فکر کے اوزار</text><text x="701" y="326" text-anchor="middle">تقریباً کوئی نہیں</text><text x="581" y="326" text-anchor="middle">ایک استاد</text><text x="516" y="318" text-anchor="end">جڑی ہوئی،</text><text x="516" y="336" text-anchor="end">استاد کی چنی ہوئی</text><text x="326" y="326" text-anchor="end">کوئی نمونہ نوٹس کرنا</text><text x="186" y="318" text-anchor="end">آپ غلط ہوں تو</text><text x="186" y="336" text-anchor="end">آپ کو درست کرنا</text><text class="m" x="758" y="370" text-anchor="end">نمایاں کی ہوئی قطر صرف اپنی ساخت سے چھ میں سے پانچ اصول پورا کرتی ہے؛ صرف استاد کا چننا اس بات پر منحصر ہے کہ اسکول</text><text class="m" x="758" y="385" text-anchor="end">اسے کیسے بناتا ہے۔ اس کی لاگت پیسہ نہیں وقت ہے، اسی لیے وقت کی حفاظت نہ ہونے پر یہ سب سے پہلے گرتی ہے۔</text><text class="wm" x="924" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
