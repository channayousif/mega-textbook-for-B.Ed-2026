<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 694" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ترقی کے پانچ راستوں کا موازنہ</title><desc id="d">کانفرنسوں، ورکشاپس، آن لائن پلیٹ فارموں، پیشہ ورانہ تعلمی برادریوں اور غور و فکر کے اوزار کا موازنہ کرنے والا جدول: لاگت، رسائی، ہر ایک کون سے اصول پورے کرتا ہے، کس کام کے لیے موزوں ہے، اور کیا نہیں کر سکتا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.alt{fill:var(--a3-fill)}.alt-line{stroke:var(--a3);stroke-width:2.5;fill:none;stroke-dasharray:8 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="694"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="84"/><rect id="region-focus" class="focus" x="20" y="374" width="740" height="110"/><line class="grid" x1="640" y1="20" x2="640" y2="574"/><line class="grid" x1="540" y1="20" x2="540" y2="574"/><line class="grid" x1="460" y1="20" x2="460" y2="574"/><line class="grid" x1="290" y1="20" x2="290" y2="574"/><line class="grid" x1="150" y1="20" x2="150" y2="574"/><line class="grid" x1="760" y1="194" x2="20" y2="194"/><line class="grid" x1="760" y1="284" x2="20" y2="284"/><line class="grid" x1="760" y1="374" x2="20" y2="374"/><lin