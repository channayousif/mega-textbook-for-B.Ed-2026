<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 694" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five development routes compared</title><desc id="d">Table comparing conferences, workshops, online platforms, professional learning communities and reflective tools by cost, reach, which principles each satisfies, what each suits, and what each cannot do.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.alt{fill:var(--a3-fill)}.alt-line{stroke:var(--a3);stroke-width:2.5;fill:none;stroke-dasharray:8 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="694"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="84"/><rect id="region-focus" class="focus" x="20" y="374" width="740" height="110"/><line class="grid" x1="140" y1="20" x2="140" y2="574"/><line class="grid" x1="240" y1="20" x2="240" y2="574"/><line class="grid" x1="320" y1="20" x2="320" y2="574"/><line class="grid" x1="490" y1="20" x2="490" y2="574"/><line class="grid" x1="630" y1="20" x2="630" y2="574"/><line class="grid" x1="20" y1="194" x2="760" y2="194"/><line class="grid" x1="20" y1="284" x2="760" y2="284"/><line class="grid" x1="20" y1="374" x2="760" y2="374"/><line class="grid" x1="20" y1="484" x2="760" y2="484"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="554"/><rect id="region-focus-outline" class="focus-line" x="20" y="374" width="740" height="110"/><line class="frame" x1="20" y1="104" x2="760" y2="104"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="152" y="46.9">Cost:</text><text class="sh" x="152" y="66.9">money</text><text class="sh" x="152" y="86.9">and time</text><text class="sh" x="252" y="66.9">Reach</text><text class="sh" x="332" y="46.9">Principles from</text><text class="sh" x="332" y="66.9">6.1 it naturally</text><text class="sh" x="332" y="86.9">satisfies</text><text class="sh" x="502" y="56.9">Best suited</text><text class="sh" x="502" y="76.9">to</text><text class="sh" x="642" y="66.9">Cannot do</text></g><g id="node-conference"><text class="bt" x="32" y="153.6">Conference</text><text class="body" x="152" y="143.6">High, low</text><text class="body" x="152" y="163.6">time</text><text class="body" x="252" y="153.6">A few</text><text class="body" x="332" y="153.6">None reliably</text><text class="body" x="502" y="133.6">Meeting people;</text><text class="body" x="502" y="153.6">seeing what</text><text class="body" x="502" y="173.6">exists</text><text class="body" x="642" y="143.6">Change a</text><text class="body" x="642" y="163.6">lesson</text></g><g id="node-workshop"><text class="bt" x="32" y="243.6">Workshop</text><text class="body" x="152" y="243.6">Moderate</text><text class="body" x="252" y="243.6">Many</text><text class="body" x="332" y="223.6">Content focus,</text><text class="body" x="332" y="243.6">if it is</text><text class="body" x="332" y="263.6">subject-specific</text><text class="body" x="502" y="233.6">One nameable</text><text class="body" x="502" y="253.6">technique</text><text class="body" x="642" y="243.6">Sustain itself</text></g><g id="node-online"><text class="bt" x="32" y="323.6">Online</text><text class="bt" x="32" y="343.6">platform</text><text class="body" x="152" y="333.6">Low money</text><text class="body" x="252" y="323.6">Very</text><text class="body" x="252" y="343.6">many</text><text class="body" x="332" y="313.6">Teacher-chosen,</text><text class="body" x="332" y="333.6">sustained if</text><text class="body" x="332" y="353.6">pursued</text><text class="body" x="502" y="313.6">Filling a</text><text class="body" x="502" y="333.6">specific</text><text class="body" x="502" y="353.6">knowledge gap</text><text class="body" x="642" y="313.6">Give feedback</text><text class="body" x="642" y="333.6">on your</text><text class="body" x="642" y="353.6">teaching</text></g><g id="node-community"><text class="bt" x="32" y="413.6">Professional</text><text class="bt" x="32" y="433.6">learning</text><text class="bt" x="32" y="453.6">community</text><text class="body" x="152" y="423.6">Low money,</text><text class="body" x="152" y="443.6">high time</text><text class="body" x="252" y="423.6">One</text><text class="body" x="252" y="443.6">school</text><text class="body" x="332" y="403.6">Sustained,</text><text class="body" x="332" y="423.6">embedded, focused,</text><text class="body" x="332" y="443.6">collaborative,</text><text class="body" x="332" y="463.6">feedback</text><text class="body" x="502" y="413.6">Changing</text><text class="body" x="502" y="433.6">practice that</text><text class="body" x="502" y="453.6">is stuck</text><text class="body" x="642" y="423.6">Work without</text><text class="body" x="642" y="443.6">protected time</text></g><g id="node-reflective"><text class="bt" x="32" y="523.5">Reflective</text><text class="bt" x="32" y="543.5">tools</text><text class="body" x="152" y="523.5">Almost</text><text class="body" x="152" y="543.5">none</text><text class="body" x="252" y="523.5">One</text><text class="body" x="252" y="543.5">teacher</text><text class="body" x="332" y="523.5">Embedded,</text><text class="body" x="332" y="543.5">teacher-chosen</text><text class="body" x="502" y="523.5">Noticing a</text><text class="body" x="502" y="543.5">pattern</text><text class="body" x="642" y="513.5">Correct you</text><text class="body" x="642" y="533.5">when you are</text><text class="body" x="642" y="553.5">wrong</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="20" y="605.0">The highlighted row satisfies five of the six principles by its structure alone; only teacher choice</text><text class="small" x="20" y="625.0">depends on how the school sets it up. Its cost is time rather than money, which is why it fails first</text><text class="small" x="20" y="645.0">when time is not protected.</text></g></g><text class="wm" x="768" y="684" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
