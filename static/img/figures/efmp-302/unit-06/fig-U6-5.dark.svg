<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Five development routes compared</title><desc id="d">Table comparing conferences, workshops, online platforms, professional learning communities and reflective tools by cost, reach, which principles each satisfies, what each suits, and what each cannot do.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .best{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{font-size:11px;fill:var(--ink)} .h{font-size:11.5px;font-weight:700} .rh{font-size:11.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="936" height="400"/><rect class="rl" x="20" y="28" width="150" height="50"/><rect class="hd" x="170" y="28" width="130" height="50"/><rect class="hd" x="300" y="28" width="110" height="50"/><rect class="hd" x="410" y="28" width="190" height="50"/><rect class="hd" x="600" y="28" width="140" height="50"/><rect class="hd" x="740" y="28" width="140" height="50"/><text class="h" x="235" y="48" text-anchor="middle">Cost: money</text><text class="h" x="235" y="66" text-anchor="middle">and time</text><text class="h" x="355" y="58" text-anchor="middle">Reach</text><text class="h" x="505" y="48" text-anchor="middle">Principles from 6.1 it</text><text class="h" x="505" y="66" text-anchor="middle">naturally satisfies</text><text class="h" x="670" y="58" text-anchor="middle">Best suited to</text><text class="h" x="810" y="58" text-anchor="middle">Cannot do</text><g><rect class="rl" x="20" y="78" width="150" height="54"/><rect class="cl" x="170" y="78" width="130" height="54"/><rect class="cl" x="300" y="78" width="110" height="54"/><rect class="cl" x="410" y="78" width="190" height="54"/><rect class="cl" x="600" y="78" width="140" height="54"/><rect class="cl" x="740" y="78" width="140" height="54"/><text class="rh" x="30" y="110">Conference</text><text x="180" y="110">High, low time</text><text x="310" y="110">A few</text><text x="420" y="110">None reliably</text><text x="610" y="102">Meeting people;</text><text x="610" y="120">seeing what exists</text><text x="750" y="110">Change a lesson</text></g><g><rect class="rl" x="20" y="132" width="150" height="54"/><rect class="cl" x="170" y="132" width="130" height="54"/><rect class="cl" x="300" y="132" width="110" height="54"/><rect class="cl" x="410" y="132" width="190" height="54"/><rect class="cl" x="600" y="132" width="140" height="54"/><rect class="cl" x="740" y="132" width="140" height="54"/><text class="rh" x="30" y="164">Workshop</text><text x="180" y="164">Moderate</text><text x="310" y="164">Many</text><text x="420" y="156">Content focus, if it</text><text x="420" y="174">is subject-specific</text><text x="610" y="156">One nameable</text><text x="610" y="174">technique</text><text x="750" y="164">Sustain itself</text></g><g><rect class="rl" x="20" y="186" width="150" height="54"/><rect class="cl" x="170" y="186" width="130" height="54"/><rect class="cl" x="300" y="186" width="110" height="54"/><rect class="cl" x="410" y="186" width="190" height="54"/><rect class="cl" x="600" y="186" width="140" height="54"/><rect class="cl" x="740" y="186" width="140" height="54"/><text class="rh" x="30" y="218">Online platform</text><text x="180" y="218">Low money</text><text x="310" y="218">Very many</text><text x="420" y="210">Teacher-chosen,</text><text x="420" y="228">sustained if pursued</text><text x="610" y="210">Filling a specific</text><text x="610" y="228">knowledge gap</text><text x="750" y="210">Give feedback on</text><text x="750" y="228">your teaching</text></g><g><rect class="best" x="20" y="240" width="150" height="54"/><rect class="best" x="170" y="240" width="130" height="54"/><rect class="best" x="300" y="240" width="110" height="54"/><rect class="best" x="410" y="240" width="190" height="54"/><rect class="best" x="600" y="240" width="140" height="54"/><rect class="best" x="740" y="240" width="140" height="54"/><text class="rh" x="30" y="266">Professional learning</text><text class="rh" x="30" y="284">community</text><text x="180" y="272">Low money,</text><text x="180" y="288">high time</text><text x="310" y="272">One school</text><text x="420" y="264">Sustained, embedded,</text><text x="420" y="282">collaborative, feedback</text><text x="610" y="272">Changing practice</text><text x="610" y="288">that is stuck</text><text x="750" y="272">Work without</text><text x="750" y="288">protected time</text></g><g><rect class="rl" x="20" y="294" width="150" height="54"/><rect class="cl" x="170" y="294" width="130" height="54"/><rect class="cl" x="300" y="294" width="110" height="54"/><rect class="cl" x="410" y="294" width="190" height="54"/><rect class="cl" x="600" y="294" width="140" height="54"/><rect class="cl" x="740" y="294" width="140" height="54"/><text class="rh" x="30" y="326">Reflective tools</text><text x="180" y="326">Almost none</text><text x="310" y="326">One teacher</text><text x="420" y="318">Embedded,</text><text x="420" y="336">teacher-chosen</text><text x="610" y="326">Noticing a pattern</text><text x="750" y="318">Correct you when</text><text x="750" y="336">you are wrong</text></g><text class="m" x="20" y="378">The highlighted row satisfies four of the six principles by its structure alone, and costs the least money. It is also the one that fails first when time is not protected.</text><text class="wm" x="924" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
