<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What each stage needs, and what it is usually offered</title><desc id="d">Table of the preservice, new teacher and experienced teacher stages showing the characteristic difficulty of each, the support that helps, and the support usually offered instead.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:2;stroke-dasharray:5 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .rh{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="900" height="100%"/><rect class="rl" x="20" y="28" width="170" height="52"/><rect class="hd" x="190" y="28" width="230" height="52"/><rect class="hd" x="420" y="28" width="230" height="52"/><rect class="hx" x="650" y="28" width="230" height="52"/><text class="h" x="305" y="49" text-anchor="middle"><tspan x="305" dy="0">The characteristic</tspan><tspan x="305" dy="20">difficulty</tspan></text><text class="h" x="535" y="59" text-anchor="middle">What actually helps</text><text class="h" x="765" y="50" text-anchor="middle">What is usually</text><text class="h" x="765" y="68" text-anchor="middle">offered instead</text><g><rect class="rl" x="20" y="80" width="170" height="66"/><rect class="cl" x="190" y="80" width="230" height="66"/><rect class="cl" x="420" y="80" width="230" height="66"/><rect class="cx" x="650" y="80" width="230" height="66"/><text class="rh" x="30" y="118">Preservice</text><text x="200" y="100"><tspan x="200" dy="0">Theory without a</tspan><tspan x="200" dy="20">class</tspan></text><text x="200" y="128">to attach it to</text><text x="430" y="100"><tspan x="430" dy="0">Extended practice</tspan><tspan x="430" dy="20">with</tspan></text><text x="430" y="118"><tspan x="430" dy="0">real pupils,</tspan><tspan x="430" dy="20">observed</tspan></text><text x="660" y="110">More lectures, and a</text><text x="660" y="118"><tspan x="660" dy="0">short final teaching</tspan><tspan x="660" dy="20">block</tspan></text></g><g><rect class="rl" x="20" y="146" width="170" height="66"/><rect class="cl" x="190" y="146" width="230" height="66"/><rect class="cl" x="420" y="146" width="230" height="66"/><rect class="cx" x="650" y="146" width="230" height="66"/><text class="rh" x="30" y="184">New teacher</text><text x="200" y="166"><tspan x="200" dy="0">Full responsibility</tspan><tspan x="200" dy="20">from</tspan></text><text x="200" y="184"><tspan x="200" dy="0">day one, and</tspan><tspan x="200" dy="20">isolation</tspan></text><text x="430" y="176">A named mentor, time</text><text x="430" y="184"><tspan x="430" dy="0">protected to meet</tspan><tspan x="430" dy="20">them</tspan></text><text x="660" y="166"><tspan x="660" dy="0">An induction day,</tspan><tspan x="660" dy="20">then</tspan></text><text x="660" y="184"><tspan x="660" dy="0">the same load as</tspan><tspan x="660" dy="20">everyone</tspan></text></g><g><rect class="rl" x="20" y="212" width="170" height="66"/><rect class="cl" x="190" y="212" width="230" height="66"/><rect class="cl" x="420" y="212" width="230" height="66"/><rect class="cx" x="650" y="212" width="230" height="66"/><text class="rh" x="30" y="250">Experienced teacher</text><text x="200" y="232"><tspan x="200" dy="0">Competence removes</tspan><tspan x="200" dy="20">the</tspan></text><text x="200" y="260">pressure to improve</text><text x="430" y="232"><tspan x="430" dy="0">A problem worth</tspan><tspan x="430" dy="20">solving,</tspan></text><text x="430" y="250"><tspan x="430" dy="0">and colleagues</tspan><tspan x="430" dy="20">solving it</tspan></text><text x="660" y="242">Whatever course the</text><text x="660" y="250"><tspan x="660" dy="0">district funded this</tspan><tspan x="660" dy="20">year</tspan></text></g><text class="m" x="20" y="278"><tspan x="20" dy="0">The dashed column repeats a single</tspan><tspan x="20" dy="20">mismatch: what is offered is what</tspan><tspan x="20" dy="20">can be arranged centrally and</tspan><tspan x="20" dy="20">counted, and what helps is</tspan></text><text class="m" x="20" y="306"><tspan x="20" dy="0">specific to one teacher's</tspan><tspan x="20" dy="20">classroom. The gap is structural,</tspan><tspan x="20" dy="20">not a failure of goodwill.</tspan></text><text class="wm" x="888" y="386" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
