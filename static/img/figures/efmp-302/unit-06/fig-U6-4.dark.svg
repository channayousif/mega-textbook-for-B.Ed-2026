<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 414" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What each stage needs, and what it is usually offered</title><desc id="d">Table of the preservice, new teacher and experienced teacher stages showing the characteristic difficulty of each, the support that helps, and the support usually offered instead.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}.bg{fill:var(--bg)}text{font-size:14px;fill:var(--ink)}.h{font-size:15px;font-weight:700;fill:var(--ink)}.sh{font-size:14px;font-weight:700;fill:var(--ink)}.bt{font-size:13px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.hdr{fill:var(--panel)}.focus{fill:var(--a1-fill)}.focus-line{stroke:var(--a1);stroke-width:3;fill:none}.alt{fill:var(--a3-fill)}.alt-line{stroke:var(--a3);stroke-width:2.5;fill:none;stroke-dasharray:8 5}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25}.frame{stroke:var(--ink);stroke-width:2;fill:none}</style><rect class="bg" x="0" y="0" width="780" height="414"/><g id="layer-regions"><rect id="region-header" class="hdr" x="20" y="20" width="740" height="64"/><rect id="region-offered" class="alt" x="560" y="84" width="200" height="210"/><line class="grid" x1="160" y1="20" x2="160" y2="294"/><line class="grid" x1="360" y1="20" x2="360" y2="294"/><line class="grid" x1="560" y1="20" x2="560" y2="294"/><line class="grid" x1="20" y1="154" x2="760" y2="154"/><line class="grid" x1="20" y1="224" x2="760" y2="224"/><rect id="region-table" class="frame" x="20" y="20" width="740" height="274"/><rect id="region-offered-outline" class="alt-line" x="560" y="20" width="200" height="274"/><line class="frame" x1="20" y1="84" x2="760" y2="84"/></g><g id="layer-edges"></g><g id="layer-nodes"><g id="node-header"><text class="sh" x="172" y="46.9">The characteristic</text><text class="sh" x="172" y="66.9">difficulty</text><text class="sh" x="372" y="56.9">What actually helps</text><text class="sh" x="572" y="46.9">What is usually</text><text class="sh" x="572" y="66.9">offered instead</text></g><g id="node-preservice"><text class="bt" x="32" y="123.5">Preservice</text><text class="body" x="172" y="113.5">Theory without a class</text><text class="body" x="172" y="133.6">to attach it to</text><text class="body" x="372" y="113.5">Extended practice with</text><text class="body" x="372" y="133.6">real pupils, observed</text><text class="body" x="572" y="113.5">More lectures, and a</text><text class="body" x="572" y="133.6">short final teaching block</text></g><g id="node-new"><text class="bt" x="32" y="193.6">New teacher</text><text class="body" x="172" y="183.6">Full responsibility from</text><text class="body" x="172" y="203.6">day one, and isolation</text><text class="body" x="372" y="183.6">A named mentor, time</text><text class="body" x="372" y="203.6">protected to meet them</text><text class="body" x="572" y="183.6">An induction day, then</text><text class="body" x="572" y="203.6">the same load as everyone</text></g><g id="node-experienced"><text class="bt" x="32" y="253.6">Experienced</text><text class="bt" x="32" y="273.6">teacher</text><text class="body" x="172" y="253.6">Competence removes the</text><text class="body" x="172" y="273.6">pressure to improve</text><text class="body" x="372" y="253.6">A problem worth solving,</text><text class="body" x="372" y="273.6">and colleagues solving it</text><text class="body" x="572" y="253.6">Whatever course the</text><text class="body" x="572" y="273.6">district funded this year</text></g></g><g id="layer-labels"><g id="label-caption"><text class="small" x="20" y="325.1">The dashed column repeats a single mismatch: what is offered is what can be arranged centrally and</text><text class="small" x="20" y="345.1">counted, and what helps is specific to one teacher's classroom. The gap is structural, not a failure</text><text class="small" x="20" y="365.1">of goodwill.</text></g></g><text class="wm" x="768" y="404" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
