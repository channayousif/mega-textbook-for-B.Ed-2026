<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سبق کے مشترکہ مطالعے کا چکر</title><desc id="d">سبق کے مشترکہ مطالعے کے چکر کا فلوچارٹ - مل کر منصوبہ بنائیے، ایک پڑھائے جبکہ باقی شاگردوں کو دیکھیں، شہادت کا جائزہ لیجیے، درست کیجیے، دوبارہ پڑھائیے - مشاہدے والی منزل پر یہ نوٹ کہ استاد کو نہیں، شاگردوں کو دیکھیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .ob{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3} .f{stroke:var(--a1);stroke-width:2.5;fill:none} .r{stroke:var(--a2);stroke-width:2.5;stroke-dasharray:7 5;fill:none} .cal{fill:var(--panel);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="430"/><rect class="st" x="700" y="120" width="150" height="70" rx="6"/><text class="h" x="775" y="148" text-anchor="middle">1 مل کر ایک سبق</text><text class="h" x="775" y="166" text-anchor="middle">منصوبہ بنائیے</text><text class="m" x="775" y="182" text-anchor="middle">گروپ، کوئی فرد نہیں</text><rect class="ob" x="480" y="120" width="180" height="70" rx="6"/><text class="h" x="570" y="148" text-anchor="middle">2 ایک پڑھائے؛ باقی</text><text class="h" x="570" y="166" text-anchor="middle">مشاہدہ کریں</text><text class="m" x="570" y="182" text-anchor="middle">سبق گروپ کا ہے</text><rect class="st" x="260" y="120" width="180" height="70" rx="6"/><text class="h" x="350" y="148" text-anchor="middle">3 شہادت کا</text><text class="h" x="350" y="166" text-anchor="middle">جائزہ لیجیے</text><text class="m" x="350" y="182" text-anchor="middle">شاگردوں نے کیا کیا اور کیا سمجھا</text><rect class="st" x="40" y="120" width="180" height="70" rx="6"/><text class="h" x="130" y="148" text-anchor="middle">4 سبق درست کیجیے</text><text class="m" x="130" y="170" text-anchor="middle">پھر 5، دوبارہ پڑھائیے</text><path class="f" d="M700 155 L665 155" marker-end="url(#a)"/><path class="f" d="M480 155 L445 155" marker-end="url(#a)"/><path class="f" d="M260 155 L225 155" marker-end="url(#a)"/><rect class="cal" x="460" y="230" width="220" height="50" rx="5"/><text class="h" x="570" y="252" text-anchor="middle">شاگردوں کو دیکھیے،</text><text class="h" x="570" y="270" text-anchor="middle">استاد کو نہیں</text><path class="f" d="M570 190 L570 226" stroke="var(--a3)" marker-end="url(#a)"/><path class="r" d="M130 190 L130 330 L775 330 L775 194" marker-end="url(#c)"/><text class="m" x="450" y="322" text-anchor="middle">درست شدہ سبق، اور گروپ نے یہ کیا سیکھا کہ شاگرد یہ کیسے سیکھتے ہیں</text><text class="m" x="758" y="376" text-anchor="end">منزل 2 وہی ہے جو اسے چلاتی ہے اور مشکل بناتی ہے: کسی کا جائزہ نہیں لیا جا رہا، چنانچہ دیکھنے والے سیکھنے کو دیکھنے</text><text class="m" x="758" y="394" text-anchor="end">کے آزاد ہیں، کارکردگی کو نہیں۔ جس لمحے یہ استاد کا مشاہدہ بن جائے، چکر کچھ بھی پیدا کرنا بند کر دیتا ہے۔</text><text class="wm" x="868" y="404" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
