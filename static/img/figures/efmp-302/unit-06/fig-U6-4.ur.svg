<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین مراحل،اور ہر ایک کی ضرورت</title><desc id="d">تربیت سے پہلے، نئے استاد اور تجربہ کار استاد کے مراحل کا جدول جو ہر ایک کی خاص دشواری، مدد دینے والی معاونت، اور عام طور پر پیش کی جانے والی معاونت دکھاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .hd{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .hx{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .rl{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .cl{fill:none;stroke:var(--muted);stroke-width:1.5} .cx{fill:none;stroke:var(--a3);stroke-width:2;stroke-dasharray:5 3} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .rh{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="900" height="350"/><rect class="rl" x="710" y="28" width="170" height="52"/><rect class="hd" x="480" y="28" width="230" height="52"/><rect class="hd" x="250" y="28" width="230" height="52"/><rect class="hx" x="20" y="28" width="230" height="52"/><text class="h" x="595" y="59" text-anchor="middle">خاص دشواری</text><text class="h" x="365" y="59" text-anchor="middle">جو اصل میں مدد دیتی ہے</text><text class="h" x="135" y="50" text-anchor="middle">جو عام طور پر اس کے</text><text class="h" x="135" y="68" text-anchor="middle">بجائے پیش کی جاتی ہے</text><rect class="rl" x="710" y="80" width="170" height="66"/><rect class="cl" x="480" y="80" width="230" height="66"/><rect class="cl" x="250" y="80" width="230" height="66"/><rect class="cx" x="20" y="80" width="230" height="66"/><text class="rh" x="850" y="118" text-anchor="end">تربیت سے پہلے</text><text x="690" y="110" text-anchor="end">ایسی نظریہ جس سے جوڑنے</text><text x="690" y="128" text-anchor="end">کے لیے کوئی جماعت نہیں</text><text x="460" y="110" text-anchor="end">حقیقی شاگردوں کے ساتھ طویل،</text><text x="460" y="128" text-anchor="end">مشاہدہ شدہ مشق</text><text x="230" y="110" text-anchor="end">مزید لیکچر، اور مختصر</text><text x="230" y="128" text-anchor="end">آخری تدریسی بلاک</text><rect class="rl" x="710" y="146" width="170" height="66"/><rect class="cl" x="480" y="146" width="230" height="66"/><rect class="cl" x="250" y="146" width="230" height="66"/><rect class="cx" x="20" y="146" width="230" height="66"/><text class="rh" x="850" y="184" text-anchor="end">نیا استاد</text><text x="690" y="176" text-anchor="end">پہلے دن سے مکمل ذمہ داری،</text><text x="690" y="194" text-anchor="end">اور تنہائی</text><text x="460" y="176" text-anchor="end">کوئی نامزد سرپرست، ملنے</text><text x="460" y="194" text-anchor="end">کا محفوظ وقت</text><text x="230" y="176" text-anchor="end">ایک دن کا داخلہ، پھر سب</text><text x="230" y="194" text-anchor="end">جتنا ہی بوجھ</text><rect class="rl" x="710" y="212" width="170" height="66"/><rect class="cl" x="480" y="212" width="230" height="66"/><rect class="cl" x="250" y="212" width="230" height="66"/><rect class="cx" x="20" y="212" width="230" height="66"/><text class="rh" x="850" y="250" text-anchor="end">تجربہ کار استاد</text><text x="690" y="242" text-anchor="end">مہارت بہتری کا دباؤ</text><text x="690" y="260" text-anchor="end">ہٹا دیتی ہے</text><text x="460" y="242" text-anchor="end">حل کرنے کے قابل مسئلہ،</text><text x="460" y="260" text-anchor="end">اور اسے حل کرتے ساتھی</text><text x="230" y="242" text-anchor="end">جس کورس کے لیے ضلع نے</text><text x="230" y="260" text-anchor="end">اس سال پیسہ دیا</text><text class="m" x="758" y="308" text-anchor="end">خط والا کالم ایک ہی ناہموازی دہراتا ہے: جو پیش کیا جاتا ہے وہ ہے جو مرکزی طور پر بندوبست اور گنا جا سکتا ہے، اور جو مدد</text><text class="m" x="758" y="326" text-anchor="end">دیتا ہے وہ ایک استاد کے کمرے کے لیے مخصوص ہے۔ یہ خلا ساختی ہے، نیک نیت کی ناکامی نہیں۔</text><text class="wm" x="888" y="336" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
