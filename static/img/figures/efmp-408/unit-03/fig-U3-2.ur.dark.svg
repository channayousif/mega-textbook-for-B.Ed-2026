<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">انشائی اور مختصر جواباتی سوالات کی ہیئتوں کا موازنہ</title><desc id="d">جدول جو انشائی سوالات اور مختصر جواباتی سوالات کا ادراکی تقاضے، نصاب کے احاطے کی وسعت، سوال لکھنے کی محنت، جانچ کے وقت اور ممتحن کے تعصب کے خطرے کے لحاظ سے موازنہ کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="38" rx="4"/><text class="sh" x="738" y="80" text-anchor="end">‏پہلو‏</text><text class="sh" x="575" y="80" text-anchor="end">‏انشائی سوالات‏</text><text class="sh" x="305" y="80" text-anchor="end">‏مختصر جواباتی سوالات‏</text><rect class="panel" x="30" y="98" width="720" height="62" rx="4"/><text class="sh" x="738" y="122" text-anchor="end">‏1. ہدف درجہ‏</text><text class="small" x="738" y="142" text-anchor="end">‏ادراکی توجہ‏</text><text class="cell" x="575" y="122" text-anchor="end">‏پیچیدہ ترکیب، تجزیہ اور‏</text><text class="cell" x="575" y="142" text-anchor="end">‏اصل دلیل کی ترتیب۔‏</text><text class="cell" x="305" y="122" text-anchor="end">‏مخصوص اصطلاحات، حقائق کی یاد داشت،‏</text><text class="cell" x="305" y="142" text-anchor="end">‏اور ایک قدمی مسئلہ حل کرنا۔‏</text><rect class="panel" x="30" y="165" width="720" height="62" rx="4"/><text class="sh" x="738" y="189" text-anchor="end">‏2. نمونہ‏</text><text class="small" x="738" y="209" text-anchor="end">‏سلیبس کا احاطہ‏</text><text class="cell" x="575" y="189" text-anchor="end">‏محدود نمونہ (2 سے 4 موضوعات)؛‏</text><text class="cell" x="575" y="209" text-anchor="end">‏امتحانی قسمت اور غلطی زیادہ۔‏</text><text class="cell" x="305" y="189" text-anchor="end">‏وسیع نمونہ (15 سے 25 سوالات)؛‏</text><text class="cell" x="305" y="209" text-anchor="end">‏سلیبس کا نمائندہ احاطہ۔‏</text><rect class="panel" x="30" y="232" width="720" height="62" rx="4"/><text class="sh" x="738" y="256" text-anchor="end">‏3. تیاری کی محنت‏</text><text class="small" x="738" y="276" text-anchor="end">‏لکھنے کے تقاضے‏</text><text class="cell" x="575" y="256" text-anchor="end">‏سوال جلد لکھا جاتا ہے؛ معیارِ جانچ اور‏</text><text class="cell" x="575" y="276" text-anchor="end">‏نمونے کے جواب بنانے میں بڑی محنت۔‏</text><text class="cell" x="305" y="256" text-anchor="end">‏درمیانی محنت؛ سخت حدبندی چاہیے‏</text><text class="cell" x="305" y="276" text-anchor="end">‏تاکہ صرف قطعی اصطلاحات درست ہوں۔‏</text><rect class="panel" x="30" y="299" width="720" height="62" rx="4"/><text class="sh" x="738" y="323" text-anchor="end">‏4. جانچ کا وقت‏</text><text class="small" x="738" y="343" text-anchor="end">‏جانچ کے تقاضے‏</text><text class="cell" x="575" y="323" text-anchor="end">‏بہت وقت (فی پرچہ 10 سے 15 منٹ)؛‏</text><text class="cell" x="575" y="343" text-anchor="end">‏ممتحن کی تھکن سے نمبر بھٹکتے ہیں۔‏</text><text class="cell" x="305" y="323" text-anchor="end">‏تیز اور مؤثر (1 سے 2 منٹ)؛‏</text><text class="cell" x="305" y="343" text-anchor="end">‏درست جوابات سے معروضی جانچ۔‏</text><rect class="panel" x="30" y="366" width="720" height="62" rx="4"/><text class="sh" x="738" y="390" text-anchor="end">‏5. ممتحن کا تعصب‏</text><text class="small" x="738" y="410" text-anchor="end">‏جانچ کی غلطی‏</text><text class="cell" x="575" y="390" text-anchor="end">‏ہالہ اثر، صفائی اور تقابل کے‏</text><text class="cell" x="575" y="410" text-anchor="end">‏اثرات کا شدید خطرہ۔‏</text><text class="cell" x="305" y="390" text-anchor="end">‏کم سے کم خطرہ؛ محدود جوابات‏</text><text class="cell" x="305" y="410" text-anchor="end">‏میں ممتحنین کا زیادہ اتفاق۔‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏موضوعی سوالات کی ہیئتیں: انشائی بمقابلہ مختصر جواباتی خصوصیات‏</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">‏دونوں ہیئتوں میں توازن گہرے استدلال اور وسیع احاطے دونوں کی تشخیص کرتا ہے۔‏</text><text class="wm" x="12" y="468" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>