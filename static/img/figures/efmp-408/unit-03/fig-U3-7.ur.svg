<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معروضی تشخیصی ہیئتوں کا موازنہ</title><desc id="d">جدول جو کثیر الانتخابی، درست و غلط اور جوڑ ملائیں کی ہیئتوں کا ہدف ادراکی سطح، اندازے کے خطرے، تیاری کی مشکل اور تیاری کی عام غلطیوں کے لحاظ سے موازنہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="38" rx="4"/><text class="sh" x="738" y="80" text-anchor="end">‏پہلو‏</text><text class="sh" x="580" y="80" text-anchor="end">‏⁧کثیر الانتخابی (MCQ)⁩‏</text><text class="sh" x="395" y="80" text-anchor="end">‏درست / غلط (دو انتخابی)‏</text><text class="sh" x="205" y="80" text-anchor="end">‏جوڑ ملائیں کی مشق‏</text><rect class="panel" x="30" y="98" width="720" height="62" rx="4"/><text class="sh" x="738" y="122" text-anchor="end">‏1. ادراکی درجہ‏</text><text class="small" x="738" y="142" text-anchor="end">‏ہدف سطح‏</text><text class="cell" x="580" y="122" text-anchor="end">‏وسیع: علم سے لے کر‏</text><text class="cell" x="580" y="142" text-anchor="end">‏اطلاق اور تجزیہ تک۔‏</text><text class="cell" x="395" y="122" text-anchor="end">‏محدود: حقائق کی یاد داشت‏</text><text class="cell" x="395" y="142" text-anchor="end">‏اور بنیادی اصولوں کی جانچ۔‏</text><text class="cell" x="205" y="122" text-anchor="end">‏درمیانی: اصطلاحات،‏</text><text class="cell" x="205" y="142" text-anchor="end">‏تاریخیں اور زمرے۔‏</text><rect class="panel" x="30" y="165" width="720" height="62" rx="4"/><text class="sh" x="738" y="189" text-anchor="end">‏2. اندازے کا خطرہ‏</text><text class="small" x="738" y="209" text-anchor="end">‏اتفاقی نمبر‏</text><text class="cell" x="580" y="189" text-anchor="end">‏کم (4 متبادلات پر 25%)؛‏</text><text class="cell" x="580" y="209" text-anchor="end">‏معقول متبادل قسمت گھٹاتے ہیں۔‏</text><text class="cell" x="395" y="189" text-anchor="end">‏زیادہ (فی سوال 50%)؛‏</text><text class="cell" x="395" y="209" text-anchor="end">‏ترمیم شدہ صورتیں ضروری۔‏</text><text class="cell" x="205" y="189" text-anchor="end">‏بہت کم اگر جوابات کی فہرست‏</text><text class="cell" x="205" y="209" text-anchor="end">‏مقدمات سے زیادہ ہو۔‏</text><rect class="panel" x="30" y="232" width="720" height="62" rx="4"/><text class="sh" x="738" y="256" text-anchor="end">‏3. نمونے کی رفتار‏</text><text class="small" x="738" y="276" text-anchor="end">‏فی 15 منٹ سوالات‏</text><text class="cell" x="580" y="256" text-anchor="end">‏درمیانی: 10 سے 12 سوالات؛‏</text><text class="cell" x="580" y="276" text-anchor="end">‏متبادلات پڑھنا ضروری۔‏</text><text class="cell" x="395" y="256" text-anchor="end">‏تیز: 20 سے 30 سوالات؛‏</text><text class="cell" x="395" y="276" text-anchor="end">‏فوری دو انتخابی فیصلے۔‏</text><text class="cell" x="205" y="256" text-anchor="end">‏زیادہ: 10 سے 15 جوڑے‏</text><text class="cell" x="205" y="276" text-anchor="end">‏کم سے کم جگہ میں۔‏</text><rect class="panel" x="30" y="299" width="720" height="62" rx="4"/><text class="sh" x="738" y="323" text-anchor="end">‏4. تیاری کی محنت‏</text><text class="small" x="738" y="343" text-anchor="end">‏لکھنے کے تقاضے‏</text><text class="cell" x="580" y="323" text-anchor="end">‏زیادہ: تین قابلِ یقین‏</text><text class="cell" x="580" y="343" text-anchor="end">‏متبادلات بنانا مشکل۔‏</text><text class="cell" x="395" y="323" text-anchor="end">‏درمیانی: قطعی سچائیاں‏</text><text class="cell" x="395" y="343" text-anchor="end">‏صاف بیان کرنا مشکل۔‏</text><text class="cell" x="205" y="323" text-anchor="end">‏درمیانی: یکساں‏</text><text class="cell" x="205" y="343" text-anchor="end">‏گروہ بندی ضروری۔‏</text><rect class="panel" x="30" y="366" width="720" height="62" rx="4"/><text class="sh" x="738" y="390" text-anchor="end">‏5. عام غلطی‏</text><text class="small" x="738" y="410" text-anchor="end">‏تیاری کی غلطی‏</text><text class="cell" x="580" y="390" text-anchor="end">‏لمبائی کا تعصب؛ قواعدی‏</text><text class="cell" x="580" y="410" text-anchor="end">‏اشارے؛ ”مندرجہ بالا تمام“۔‏</text><text class="cell" x="395" y="390" text-anchor="end">‏قطعی الفاظ (ہمیشہ)؛‏</text><text class="cell" x="395" y="410" text-anchor="end">‏جزوی طور پر درست بیانات۔‏</text><text class="cell" x="205" y="390" text-anchor="end">‏غیر یکساں ملاوٹ؛‏</text><text class="cell" x="205" y="410" text-anchor="end">‏ایک کے مقابل ایک برابر جوڑ۔‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏بنیادی نفسیاتی پیمائشی پہلوؤں میں معروضی امتحانی ہیئتوں کا موازنہ‏</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">‏وہ ہیئت منتخب کریں جو ہدف ادراکی سطح کے لیے سب سے موزوں ہو۔‏</text><text class="wm" x="12" y="468" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>