<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Examiner score divergence without an analytic rubric</title><desc id="d">Diagram illustrating marker score divergence between two examiners evaluating the same student essay response without an analytic rubric, showing where scores drift due to handwriting, halo effect, and length bias.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-boxes"><rect class="panel" x="30" y="55" width="720" height="42" rx="4"/><text class="sh" x="45" y="81">Unstandardised Holistic Marking (20-Mark Environmental Science Essay)</text><rect class="panel-a" x="30" y="110" width="345" height="235" rx="6"/><text class="h" x="45" y="136">Student Script A (Bilal)</text><text class="cell" x="45" y="158">Neat calligraphic script and fluent prose,</text><text class="cell" x="45" y="174">but thin scientific evidence and no data.</text><line class="stroke" x1="45" y1="188" x2="360" y2="188"/><text class="sh" x="45" y="210">Examiner 1 (Impressionist):</text><text class="h" x="45" y="232">17 / 20 (85%)</text><text class="small" x="45" y="248">"Beautiful presentation, neat script."</text><text class="sh" x="45" y="276">Examiner 2 (Content-focused):</text><text class="h" x="45" y="298">9 / 20 (45%)</text><text class="small" x="45" y="314">"Superficial; missing civic policy."</text><text class="sh" x="45" y="334">Divergence: 8 marks (40% variance)</text><rect class="panel-b" x="405" y="110" width="345" height="235" rx="6"/><text class="h" x="420" y="136">Student Script B (Danish)</text><text class="cell" x="420" y="158">Cramped messy script and spelling slips,</text><text class="cell" x="420" y="174">but brilliant ecological analysis and data.</text><line class="stroke" x1="420" y1="188" x2="735" y2="188"/><text class="sh" x="420" y="210">Examiner 1 (Impressionist):</text><text class="h" x="420" y="232">10 / 20 (50%)</text><text class="small" x="420" y="248">"Untidy script, poor margins."</text><text class="sh" x="420" y="276">Examiner 2 (Content-focused):</text><text class="h" x="420" y="298">18 / 20 (90%)</text><text class="small" x="420" y="314">"Masterly scientific synthesis."</text><text class="sh" x="420" y="334">Divergence: 8 marks (40% variance)</text><rect class="panel-c" x="30" y="360" width="720" height="85" rx="6"/><text class="h" x="45" y="386">Psychometric Solution: Professional Scoring Controls</text><text class="cell" x="45" y="408">1. Analytic Rubrics: Separate content marks from mechanics so handwriting cannot distort science grades.</text><text class="cell" x="45" y="428">2. Anonymous Marking: Conceal student names; 3. Question-by-Question Marking: Keep criteria uniform.</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Sources of marker divergence in unguided essay evaluation</text><text id="label-caption" class="small" x="24" y="475">Without an analytic rubric, scores reflect examiner bias rather than mastery.</text><text class="wm" x="768" y="488" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>