<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تجزیاتی معیارِ جانچ کے بغیر ممتحنین کے نمبروں میں فرق</title><desc id="d">خاکہ جو ایک ہی طالب علم کے انشائی جواب کو تجزیاتی معیارِ جانچ کے بغیر جانچنے والے دو ممتحنین کے نمبروں میں فرق دکھاتا ہے، اور واضح کرتا ہے کہ خوش خطی، ہالہ اثر اور لمبائی کے تعصب کی وجہ سے نمبر کہاں بھٹک جاتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-boxes"><rect class="panel" x="30" y="55" width="720" height="42" rx="4"/><text class="sh" x="735" y="81" text-anchor="end">‏غیر معیاری مجموعی جانچ (ماحولیاتی سائنس کا 20 نمبر کا مضمون)‏</text><rect class="panel-a" x="405" y="110" width="345" height="235" rx="6"/><text class="h" x="735" y="136" text-anchor="end">‏طالب علم کا پرچہ الف (بلال)‏</text><text class="cell" x="735" y="158" text-anchor="end">‏صاف خوش خط تحریر اور رواں نثر،‏</text><text class="cell" x="735" y="174" text-anchor="end">‏مگر کمزور سائنسی شواہد اور کوئی اعداد و شمار نہیں۔‏</text><line class="stroke" x1="735" y1="188" x2="420" y2="188"/><text class="sh" x="735" y="210" text-anchor="end">‏ممتحن 1 (تاثراتی):‏</text><text class="h" x="735" y="232" text-anchor="end">17 / 20 (85%)</text><text class="small" x="735" y="248" text-anchor="end">‏”خوبصورت پیشکش، صاف خط۔“‏</text><text class="sh" x="735" y="276" text-anchor="end">‏ممتحن 2 (مواد پر مرکوز):‏</text><text class="h" x="735" y="298" text-anchor="end">9 / 20 (45%)</text><text class="small" x="735" y="314" text-anchor="end">‏”سطحی؛ شہری پالیسی غائب۔“‏</text><text class="sh" x="735" y="334" text-anchor="end">‏فرق: 8 نمبر (40% تفاوت)‏</text><rect class="panel-b" x="30" y="110" width="345" height="235" rx="6"/><text class="h" x="360" y="136" text-anchor="end">‏طالب علم کا پرچہ ب (دانش)‏</text><text class="cell" x="360" y="158" text-anchor="end">‏تنگ اور بے ترتیب خط اور املا کی غلطیاں،‏</text><text class="cell" x="360" y="174" text-anchor="end">‏مگر شاندار ماحولیاتی تجزیہ اور اعداد و شمار۔‏</text><line class="stroke" x1="360" y1="188" x2="45" y2="188"/><text class="sh" x="360" y="210" text-anchor="end">‏ممتحن 1 (تاثراتی):‏</text><text class="h" x="360" y="232" text-anchor="end">10 / 20 (50%)</text><text class="small" x="360" y="248" text-anchor="end">‏”بے ترتیب خط، حاشیے خراب۔“‏</text><text class="sh" x="360" y="276" text-anchor="end">‏ممتحن 2 (مواد پر مرکوز):‏</text><text class="h" x="360" y="298" text-anchor="end">18 / 20 (90%)</text><text class="small" x="360" y="314" text-anchor="end">‏”ماہرانہ سائنسی ترکیب۔“‏</text><text class="sh" x="360" y="334" text-anchor="end">‏فرق: 8 نمبر (40% تفاوت)‏</text><rect class="panel-c" x="30" y="360" width="720" height="85" rx="6"/><text class="h" x="735" y="386" text-anchor="end">‏نفسیاتی پیمائشی حل: جانچ کے پیشہ ورانہ ضوابط‏</text><text class="cell" x="735" y="408" text-anchor="end">‏1. تجزیاتی معیارِ جانچ: مواد کے نمبر تحریری بناوٹ سے الگ رکھیں تاکہ خط سائنس کے گریڈ نہ بگاڑے۔‏</text><text class="cell" x="735" y="428" text-anchor="end">‏2. گمنام جانچ: طلبہ کے نام چھپائیں؛ 3. سوال وار جانچ: معیارات یکساں رکھیں۔‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏رہنمائی کے بغیر انشائی جانچ میں ممتحنین کے فرق کے ذرائع‏</text><text id="label-caption" class="small" x="756" y="475" text-anchor="end">‏تجزیاتی معیارِ جانچ کے بغیر نمبر مہارت کے بجائے ممتحن کے تعصب کی عکاسی کرتے ہیں۔‏</text><text class="wm" x="12" y="488" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>