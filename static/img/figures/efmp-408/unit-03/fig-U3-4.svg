<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Item-writing rules with flawed and corrected examples</title><desc id="d">Table presenting core item-writing guidelines with contrasting examples of flawed items containing common errors and their corrected versions.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="38" rx="4"/><text class="sh" x="42" y="80">Item-Writing Rule</text><text class="sh" x="205" y="80">Common Flaw (Draft)</text><text class="sh" x="475" y="80">Corrected Version</text><rect class="panel" x="30" y="98" width="720" height="74" rx="4"/><text class="sh" x="42" y="122">1. Focused Stem</text><text class="small" x="42" y="142">Problem clear before</text><text class="small" x="42" y="158">reading options</text><text class="cell" x="205" y="120">"Sindh is:"</text><text class="small" x="205" y="138">A) in Asia, B) warm, C) agrarian</text><text class="small" x="205" y="154">economy, D) very large.</text><text class="cell" x="475" y="120">"What is the primary economic base</text><text class="cell" x="475" y="138">of rural Upper Sindh?"</text><text class="small" x="475" y="154">A) Mining, B) Farming, C) Tourism</text><rect class="panel" x="30" y="177" width="720" height="74" rx="4"/><text class="sh" x="42" y="201">2. No Clues</text><text class="small" x="42" y="221">Grammatical parallel</text><text class="small" x="42" y="237">with all options</text><text class="cell" x="205" y="199">"A vertebrate with gills is an:"</text><text class="small" x="205" y="217">A) frog, B) fish, C) tadpole, D) adult eel.</text><text class="small" x="205" y="235">(Article 'an' cues vowel option D).</text><text class="cell" x="475" y="199">"Which vertebrate breathes with gills</text><text class="cell" x="475" y="217">during its larval stage?"</text><text class="small" x="475" y="235">A) Frog, B) Snake, C) Lizard</text><rect class="panel" x="30" y="256" width="720" height="74" rx="4"/><text class="sh" x="42" y="280">3. Equal Length</text><text class="small" x="42" y="300">Preventing test-wise</text><text class="small" x="42" y="316">length guessing bias</text><text class="cell" x="205" y="278">A) Sugar, B) Salt, C) A chemical solution</text><text class="small" x="205" y="296">where solute particles dissolve</text><text class="small" x="205" y="314">completely in water, D) Sand.</text><text class="cell" x="475" y="278">A) Insoluble solid mixture</text><text class="cell" x="475" y="296">B) Homogeneous liquid solution</text><text class="cell" x="475" y="314">C) Coarse heterogeneous suspension</text><rect class="panel" x="30" y="335" width="720" height="74" rx="4"/><text class="sh" x="42" y="359">4. Functional Foils</text><text class="small" x="42" y="379">No "All of the above"</text><text class="small" x="42" y="395">or humorous jokes</text><text class="cell" x="205" y="357">"Plants need water: A) it is wet,</text><text class="small" x="205" y="375">B) transport, C) they like it, D) All</text><text class="small" x="205" y="393">of the above." (Joke foils; flawed D).</text><text class="cell" x="475" y="357">A) Transport of dissolved nutrients</text><text class="cell" x="475" y="375">B) Direct nitrogen gas absorption</text><text class="cell" x="475" y="393">C) Elimination of soil mineral ions</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Core objective item-writing guidelines: comparing flawed vs corrected items</text><text id="label-caption" class="small" x="24" y="455">Item hygiene eliminates unintended cues to measure true competence.</text><text class="wm" x="768" y="468" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>