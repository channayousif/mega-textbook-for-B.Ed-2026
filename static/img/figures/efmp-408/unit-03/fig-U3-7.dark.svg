<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of objective assessment formats</title><desc id="d">Table comparing multiple-choice, true-false, and matching item formats by target cognitive level, vulnerability to guessing, construction difficulty, and common design pitfalls.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="38" rx="4"/><text class="sh" x="42" y="80">Dimension</text><text class="sh" x="200" y="80">Multiple-Choice (MCQ)</text><text class="sh" x="385" y="80">True / False (Binary)</text><text class="sh" x="575" y="80">Matching Exercise</text><rect class="panel" x="30" y="98" width="720" height="62" rx="4"/><text class="sh" x="42" y="122">1. Cognitive Tier</text><text class="small" x="42" y="142">Target level</text><text class="cell" x="200" y="122">Broad: Knowledge to</text><text class="cell" x="200" y="142">Application and Analysis.</text><text class="cell" x="385" y="122">Narrow: Factual recall and</text><text class="cell" x="385" y="142">basic rule checking.</text><text class="cell" x="575" y="122">Moderate: Terminology,</text><text class="cell" x="575" y="142">dates, and categories.</text><rect class="panel" x="30" y="165" width="720" height="62" rx="4"/><text class="sh" x="42" y="189">2. Guessing Risk</text><text class="small" x="42" y="209">Chance score</text><text class="cell" x="200" y="189">Low (25% for 4 options);</text><text class="cell" x="200" y="209">plausible foils reduce luck.</text><text class="cell" x="385" y="189">High (50% per item);</text><text class="cell" x="385" y="209">requires modified forms.</text><text class="cell" x="575" y="189">Very low if response list</text><text class="cell" x="575" y="209">exceeds premises.</text><rect class="panel" x="30" y="232" width="720" height="62" rx="4"/><text class="sh" x="42" y="256">3. Sampling Speed</text><text class="small" x="42" y="276">Items per 15 min</text><text class="cell" x="200" y="256">Moderate: 10 to 12 items;</text><text class="cell" x="200" y="276">requires reading options.</text><text class="cell" x="385" y="256">Fast: 20 to 30 items;</text><text class="cell" x="385" y="276">rapid binary judgments.</text><text class="cell" x="575" y="256">High: 10 to 15 pairs</text><text class="cell" x="575" y="276">in minimal space.</text><rect class="panel" x="30" y="299" width="720" height="62" rx="4"/><text class="sh" x="42" y="323">4. Setting Effort</text><text class="small" x="42" y="343">Writing demands</text><text class="cell" x="200" y="323">High: difficult to create</text><text class="cell" x="200" y="343">three plausible foils.</text><text class="cell" x="385" y="323">Moderate: hard to state</text><text class="cell" x="385" y="343">absolute truths cleanly.</text><text class="cell" x="575" y="323">Moderate: requires</text><text class="cell" x="575" y="343">homogeneous clusters.</text><rect class="panel" x="30" y="366" width="720" height="62" rx="4"/><text class="sh" x="42" y="390">5. Common Pitfall</text><text class="small" x="42" y="410">Design error</text><text class="cell" x="200" y="390">Length bias; grammatical</text><text class="cell" x="200" y="410">cues; "All of the above".</text><text class="cell" x="385" y="390">Absolute qualifiers (always);</text><text class="cell" x="385" y="410">partially true statements.</text><text class="cell" x="575" y="390">Heterogeneous mixing;</text><text class="cell" x="575" y="410">equal 1-to-1 matching.</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Comparison of objective test formats across core psychometric dimensions</text><text id="label-caption" class="small" x="24" y="455">Select the format that best fits the target cognitive level.</text><text class="wm" x="768" y="468" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>