<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سوال نگاری کے اصول: ناقص اور درست شدہ مثالوں کے ساتھ</title><desc id="d">جدول جو سوال نگاری کے بنیادی رہنما اصول پیش کرتا ہے، اور عام غلطیوں والے ناقص سوالات کی مثالوں کا ان کی درست شدہ صورتوں سے تقابل کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="38" rx="4"/><text class="sh" x="738" y="80" text-anchor="end">‏سوال نگاری کا اصول‏</text><text class="sh" x="575" y="80" text-anchor="end">‏عام نقص (ابتدائی مسودہ)‏</text><text class="sh" x="305" y="80" text-anchor="end">‏درست شدہ صورت‏</text><rect class="panel" x="30" y="98" width="720" height="74" rx="4"/><text class="sh" x="738" y="122" text-anchor="end">‏1. مرکوز متن سوال‏</text><text class="small" x="738" y="142" text-anchor="end">‏متبادلات پڑھنے سے پہلے‏</text><text class="small" x="738" y="158" text-anchor="end">‏مسئلہ واضح ہو‏</text><text class="cell" x="575" y="120" text-anchor="end">‏”سندھ ہے:“‏</text><text class="small" x="575" y="138" text-anchor="end">‏الف) ایشیا میں، ب) گرم، ج) زرعی‏</text><text class="small" x="575" y="154" text-anchor="end">‏معیشت، د) بہت بڑا۔‏</text><text class="cell" x="305" y="120" text-anchor="end">‏”بالائی سندھ کے دیہی علاقوں کی‏</text><text class="cell" x="305" y="138" text-anchor="end">‏بنیادی معاشی بنیاد کیا ہے؟“‏</text><text class="small" x="305" y="154" text-anchor="end">‏الف) کان کنی، ب) کاشت کاری، ج) سیاحت‏</text><rect class="panel" x="30" y="177" width="720" height="74" rx="4"/><text class="sh" x="738" y="201" text-anchor="end">‏2. کوئی سراغ نہیں‏</text><text class="small" x="738" y="221" text-anchor="end">‏تمام متبادلات کے ساتھ‏</text><text class="small" x="738" y="237" text-anchor="end">‏قواعدی مطابقت‏</text><text class="cell" x="575" y="199" text-anchor="end">"A vertebrate with gills is an:"</text><text class="small" x="575" y="217" text-anchor="end">A) frog, B) fish, C) tadpole, D) adult eel.</text><text class="small" x="575" y="235" text-anchor="end">‏⁧(انگریزی ⁦'an'⁩ حرفِ علت والے ⁦D⁩ کا اشارہ)۔⁩‏</text><text class="cell" x="305" y="199" text-anchor="end">‏”کون سا فقاریہ اپنے لاروا مرحلے میں‏</text><text class="cell" x="305" y="217" text-anchor="end">‏گلپھڑوں سے سانس لیتا ہے؟“‏</text><text class="small" x="305" y="235" text-anchor="end">‏الف) مینڈک، ب) سانپ، ج) چھپکلی‏</text><rect class="panel" x="30" y="256" width="720" height="74" rx="4"/><text class="sh" x="738" y="280" text-anchor="end">‏3. برابر لمبائی‏</text><text class="small" x="738" y="300" text-anchor="end">‏چالاک امیدوار کے لمبائی‏</text><text class="small" x="738" y="316" text-anchor="end">‏سے اندازے کا تدارک‏</text><text class="cell" x="575" y="278" text-anchor="end">‏الف) چینی، ب) نمک، ج) ایک کیمیائی محلول‏</text><text class="small" x="575" y="296" text-anchor="end">‏جس میں منحل ذرات پانی میں‏</text><text class="small" x="575" y="314" text-anchor="end">‏مکمل حل ہو جاتے ہیں، د) ریت۔‏</text><text class="cell" x="305" y="278" text-anchor="end">‏الف) ناحل پذیر ٹھوس آمیزہ‏</text><text class="cell" x="305" y="296" text-anchor="end">‏ب) یکساں مائع محلول‏</text><text class="cell" x="305" y="314" text-anchor="end">‏ج) موٹا غیر یکساں معلق آمیزہ‏</text><rect class="panel" x="30" y="335" width="720" height="74" rx="4"/><text class="sh" x="738" y="359" text-anchor="end">‏4. کارآمد متبادلات‏</text><text class="small" x="738" y="379" text-anchor="end">‏نہ ”مندرجہ بالا تمام“‏</text><text class="small" x="738" y="395" text-anchor="end">‏نہ مذاقیہ لطیفے‏</text><text class="cell" x="575" y="357" text-anchor="end">‏”پودوں کو پانی چاہیے: الف) یہ گیلا ہے،‏</text><text class="small" x="575" y="375" text-anchor="end">‏ب) ترسیل، ج) انہیں پسند ہے، د) مندرجہ‏</text><text class="small" x="575" y="393" text-anchor="end">‏بالا تمام۔“ (مذاقیہ متبادل؛ ناقص د)۔‏</text><text class="cell" x="305" y="357" text-anchor="end">‏الف) حل شدہ غذائی اجزا کی ترسیل‏</text><text class="cell" x="305" y="375" text-anchor="end">‏ب) نائٹروجن گیس کا براہِ راست جذب‏</text><text class="cell" x="305" y="393" text-anchor="end">‏ج) مٹی کے معدنی آئنوں کا اخراج‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏بنیادی معروضی سوال نگاری کے رہنما اصول: ناقص بمقابلہ درست شدہ سوالات‏</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">‏سوالات کی صفائی غیر ارادی اشارے ختم کر کے حقیقی اہلیت کی پیمائش کرتی ہے۔‏</text><text class="wm" x="12" y="468" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>