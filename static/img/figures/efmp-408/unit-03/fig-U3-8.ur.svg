<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ناقص امتحانی سوال کی تین مرحلوں میں بتدریج اصلاح</title><desc id="d">خاکہ جو جماعت کے ایک ناقص امتحانی سوال کی تین مرحلوں پر مشتمل نظرثانی دکھاتا ہے: منفی عبارت ہٹانا، قواعدی سراغ ختم کرنا، اور ناقابلِ یقین گمراہ کن متبادلات کی جگہ تشخیصی متبادلات رکھنا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-boxes"><rect class="panel" x="30" y="55" width="720" height="98" rx="6"/><text class="h" x="735" y="80" text-anchor="end">‏مرحلہ 1: خام مسودہ (کئی سنگین خلاف ورزیاں)‏</text><text class="cell" x="735" y="102" text-anchor="end">‏متن سوال: ”درج ذیل میں سے کون سا جسم کا غیر اہم عضو نہیں ہے جو خون پمپ نہیں کرتا؟“‏</text><text class="small" x="735" y="122" text-anchor="end">‏⁧متبادلات: الف) دل، ب) دماغ، ج) ⁦an kidney⁩ (گردہ)، د) مندرجہ بالا میں سے کوئی نہیں۔⁩‏</text><text class="small" x="735" y="140" text-anchor="end">‏⁧خلاف ورزیاں: الجھی ہوئی تہری نفی؛ قواعدی سراغ ⁦'an'⁩؛ ممنوعہ بے کار متبادل۔⁩‏</text><line class="stroke" x1="390" y1="153" x2="390" y2="173" marker-end="url(#arrow)"/><rect class="panel-a" x="30" y="173" width="720" height="98" rx="6"/><text class="h" x="735" y="198" text-anchor="end">‏مرحلہ 2: ساختی اور قواعدی صفائی‏</text><text class="cell" x="735" y="220" text-anchor="end">‏متن سوال: ”کون سا عضو آکسیجن والا خون جسم کے بافتوں تک پمپ کرنے کا ذمہ دار ہے؟“‏</text><text class="small" x="735" y="240" text-anchor="end">‏متبادلات: الف) دل، ب) دماغ، ج) گردہ، د) پھیپھڑے۔‏</text><text class="small" x="735" y="258" text-anchor="end">‏بہتری: مثبت مسئلے کا بیان؛ قواعدی مطابقت؛ سراغ اور چال والے متبادلات ختم۔‏</text><line class="stroke" x1="390" y1="271" x2="390" y2="291" marker-end="url(#arrow)"/><rect class="panel-b" x="30" y="291" width="720" height="118" rx="6"/><text class="h" x="735" y="316" text-anchor="end">‏مرحلہ 3: تدریسی اور تشخیصی بلندی (اطلاق / تشخیص)‏</text><text class="cell" x="735" y="340" text-anchor="end">‏متن سوال: ”ایک معالج دیکھتا ہے کہ پھیپھڑوں سے آنے والا آکسیجن والا خون‏</text><text class="cell" x="735" y="362" text-anchor="end">‏جسم کے بافتوں تک مؤثر طور پر نہیں پہنچ رہا۔ کس عضو کا عضلاتی پمپ کرنے کا فعل براہِ راست متاثر ہے؟“‏</text><text class="small" x="735" y="382" text-anchor="end">‏الف) دل (درست جواب)؛ ب) پھیپھڑے (گیسوں کے تبادلے کی الجھن کی تشخیص)؛ ج) گردہ (تقطیر کی الجھن)۔‏</text><text class="small" x="735" y="401" text-anchor="end">‏بلندی: رٹی ہوئی یاد داشت کو تشخیصی متبادلات کے ساتھ عملی طبی مسئلہ حل کرنے میں بدلتا ہے۔‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏سوال کی تین مرحلوں میں بہتری: خام مسودے سے تشخیصی جانچ تک‏</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">‏منظم صفائی ادراکی رکاوٹیں دور کر کے سوالات کو حقیقی اطلاق کی سطح تک بلند کرتی ہے۔‏</text><text class="wm" x="12" y="468" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>