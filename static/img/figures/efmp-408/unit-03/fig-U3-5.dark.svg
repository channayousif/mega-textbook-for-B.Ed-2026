<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of systematic test construction</title><desc id="d">Flowchart showing the systematic test construction process from curriculum syllabus analysis through blueprint development and item drafting to test assembly and review.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-boxes"><rect class="panel" x="40" y="55" width="700" height="66" rx="6"/><text class="h" x="56" y="80">Phase 1: Curriculum &amp; Syllabus Analysis</text><text class="cell" x="56" y="102">Identify curriculum standards, SLOs, and count instructional periods taught.</text><line class="stroke" x1="390" y1="121" x2="390" y2="139" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="139" width="700" height="66" rx="6"/><text class="h" x="56" y="164">Phase 2: Blueprint Development (Table of Specifications)</text><text class="cell" x="56" y="186">Calculate topic weightage, distribute marks across Bloom's tiers, and assign formats.</text><line class="stroke" x1="390" y1="205" x2="390" y2="223" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="223" width="700" height="66" rx="6"/><text class="h" x="56" y="248">Phase 3: Item Drafting &amp; Question Writing</text><text class="cell" x="56" y="270">Draft clear stems, keys, plausible distractors, and analytic model answers.</text><line class="stroke" x1="390" y1="289" x2="390" y2="307" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="307" width="700" height="66" rx="6"/><text class="h" x="56" y="332">Phase 4: Paper Assembly &amp; Peer Review</text><text class="cell" x="56" y="354">Audit against review checklist: verify timing, instructions, and eliminate clues.</text><line class="stroke" x1="390" y1="373" x2="390" y2="391" marker-end="url(#arrow)"/><rect class="panel" x="40" y="391" width="700" height="66" rx="6"/><text class="h" x="56" y="416">Phase 5: Administration &amp; Objective Scoring</text><text class="cell" x="56" y="438">Conduct test under uniform conditions; score objectively using keys and rubrics.</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Systematic test construction cycle: from syllabus to examination paper</text><text id="label-caption" class="small" x="24" y="482">Each phase builds on the preceding stage to ensure content validity and score reliability.</text><text class="wm" x="768" y="482" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>