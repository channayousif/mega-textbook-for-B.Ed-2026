<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھٹی جماعت جنرل سائنس کا جدولِ تخصیص</title><desc id="d">جدول جو چھٹی جماعت کی جنرل سائنس کے مادہ اور توانائی کے یونٹ کے لیے ایک حل شدہ جدولِ تخصیص دکھاتا ہے، جس میں نصابی موضوعات، ادراکی سطحیں، سوالات کی ہیئتیں اور فیصد وزن درج ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="40" rx="4"/><text class="sh" x="738" y="80" text-anchor="end">‏نصابی موضوع‏</text><text class="sh" x="510" y="80" text-anchor="end">‏یاد رکھنا‏</text><text class="sh" x="390" y="80" text-anchor="end">‏سمجھنا‏</text><text class="sh" x="270" y="80" text-anchor="end">‏اطلاق / تجزیہ‏</text><text class="sh" x="135" y="80" text-anchor="end">‏کل نمبر‏</text><rect class="panel" x="30" y="100" width="720" height="58" rx="4"/><text class="sh" x="738" y="124" text-anchor="end">‏1. مادے کی حالتیں‏</text><text class="small" x="738" y="142" text-anchor="end">‏8 پیریڈز پڑھائے گئے (20%)‏</text><text class="cell" x="510" y="124" text-anchor="end">‏4 کثیر الانتخابی‏</text><text class="small" x="510" y="142" text-anchor="end">‏(4 نمبر)‏</text><text class="cell" x="390" y="124" text-anchor="end">‏2 مختصر سوال‏</text><text class="small" x="390" y="142" text-anchor="end">‏(4 نمبر)‏</text><text class="cell" x="270" y="124" text-anchor="end">‏1 مختصر سوال‏</text><text class="small" x="270" y="142" text-anchor="end">‏(3 نمبر)‏</text><text class="sh" x="135" y="124" text-anchor="end">‏11 نمبر‏</text><text class="small" x="135" y="142" text-anchor="end">‏22% وزن‏</text><rect class="panel" x="30" y="163" width="720" height="58" rx="4"/><text class="sh" x="738" y="187" text-anchor="end">‏2. توانائی کی اقسام‏</text><text class="small" x="738" y="205" text-anchor="end">‏12 پیریڈز پڑھائے گئے (30%)‏</text><text class="cell" x="510" y="187" text-anchor="end">‏4 کثیر الانتخابی‏</text><text class="small" x="510" y="205" text-anchor="end">‏(4 نمبر)‏</text><text class="cell" x="390" y="187" text-anchor="end">‏3 مختصر سوال‏</text><text class="small" x="390" y="205" text-anchor="end">‏(6 نمبر)‏</text><text class="cell" x="270" y="187" text-anchor="end">‏1 انشائی‏</text><text class="small" x="270" y="205" text-anchor="end">‏(5 نمبر)‏</text><text class="sh" x="135" y="187" text-anchor="end">‏15 نمبر‏</text><text class="small" x="135" y="205" text-anchor="end">‏30% وزن‏</text><rect class="panel" x="30" y="226" width="720" height="58" rx="4"/><text class="sh" x="738" y="250" text-anchor="end">‏3. برقی سرکٹ‏</text><text class="small" x="738" y="268" text-anchor="end">‏14 پیریڈز پڑھائے گئے (35%)‏</text><text class="cell" x="510" y="250" text-anchor="end">‏5 کثیر الانتخابی‏</text><text class="small" x="510" y="268" text-anchor="end">‏(5 نمبر)‏</text><text class="cell" x="390" y="250" text-anchor="end">‏3 مختصر سوال‏</text><text class="small" x="390" y="268" text-anchor="end">‏(6 نمبر)‏</text><text class="cell" x="270" y="250" text-anchor="end">‏1 انشائی‏</text><text class="small" x="270" y="268" text-anchor="end">‏(6 نمبر)‏</text><text class="sh" x="135" y="250" text-anchor="end">‏17 نمبر‏</text><text class="small" x="135" y="268" text-anchor="end">‏34% وزن‏</text><rect class="panel" x="30" y="289" width="720" height="58" rx="4"/><text class="sh" x="738" y="313" text-anchor="end">‏4. ماحولیاتی حرارت‏</text><text class="small" x="738" y="331" text-anchor="end">‏6 پیریڈز پڑھائے گئے (15%)‏</text><text class="cell" x="510" y="313" text-anchor="end">‏2 کثیر الانتخابی‏</text><text class="small" x="510" y="331" text-anchor="end">‏(2 نمبر)‏</text><text class="cell" x="390" y="313" text-anchor="end">‏1 مختصر سوال‏</text><text class="small" x="390" y="331" text-anchor="end">‏(3 نمبر)‏</text><text class="cell" x="270" y="313" text-anchor="end">-</text><text class="small" x="270" y="331" text-anchor="end">‏(0 نمبر)‏</text><text class="sh" x="135" y="313" text-anchor="end">‏7 نمبر‏</text><text class="small" x="135" y="331" text-anchor="end">‏14% وزن‏</text><rect class="panel-b" x="30" y="352" width="720" height="58" rx="4"/><text class="sh" x="738" y="376" text-anchor="end">‏آزمائش کی کل تقسیم‏</text><text class="small" x="738" y="394" text-anchor="end">‏40 پیریڈز (100%)‏</text><text class="sh" x="510" y="376" text-anchor="end">‏15 نمبر‏</text><text class="small" x="510" y="394" text-anchor="end">‏30% ادراکی‏</text><text class="sh" x="390" y="376" text-anchor="end">‏19 نمبر‏</text><text class="small" x="390" y="394" text-anchor="end">‏38% ادراکی‏</text><text class="sh" x="270" y="376" text-anchor="end">‏16 نمبر‏</text><text class="small" x="270" y="394" text-anchor="end">‏32% ادراکی‏</text><text class="h" x="135" y="376" text-anchor="end">‏50 نمبر‏</text><text class="small" x="135" y="394" text-anchor="end">‏100% کل‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏حل شدہ جدولِ تخصیص (چھٹی جماعت جنرل سائنس، 50 نمبر)‏</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">‏دو جہتی امتحانی خاکہ بلوم کے درجات میں نصاب کے متوازن نمونے کو یقینی بناتا ہے۔‏</text><text class="wm" x="12" y="468" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>