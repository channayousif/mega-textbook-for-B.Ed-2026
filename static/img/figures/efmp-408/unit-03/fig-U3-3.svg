<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Anatomy of a multiple-choice item</title><desc id="d">Diagram dissecting a classroom multiple-choice question into its component parts: the problem-defining stem, the single keyed response, and plausible diagnostic distractors.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-boxes"><rect class="panel-a" x="30" y="55" width="720" height="85" rx="6"/><text class="h" x="45" y="80">1. The Stem (Problem Statement)</text><text class="cell" x="45" y="103">"A student connects three identical 6-ohm light bulbs in series with a 12-volt battery.</text><text class="cell" x="45" y="122">What is the total electrical resistance of the circuit?"</text><line class="stroke" x1="390" y1="140" x2="390" y2="160" marker-end="url(#arrow)"/><rect class="panel" x="30" y="160" width="720" height="60" rx="4"/><text class="sh" x="45" y="184">Option A: 2 ohms</text><text class="small" x="225" y="184">Distractor 1 (Diagnostic of parallel formula error: applied 1/R calculation)</text><text class="cell" x="225" y="204">Reveals student confused series addition with reciprocal parallel formula.</text><rect class="panel" x="30" y="226" width="720" height="60" rx="4"/><text class="sh" x="45" y="250">Option B: 6 ohms</text><text class="small" x="225" y="250">Distractor 2 (Diagnostic of component neglect: assumes single bulb value)</text><text class="cell" x="225" y="270">Reveals student believes resistance does not accumulate along a single path.</text><rect class="panel-b" x="30" y="292" width="720" height="60" rx="4"/><text class="h" x="45" y="316">Option C: 18 ohms</text><text class="sh" x="225" y="316">THE KEY (Keyed Option: R_total = 6 + 6 + 6 = 18 ohms)</text><text class="cell" x="225" y="336">Demonstrates accurate conceptual understanding and additive calculation.</text><rect class="panel" x="30" y="358" width="720" height="60" rx="4"/><text class="sh" x="45" y="382">Option D: 72 ohms</text><text class="small" x="225" y="382">Distractor 3 (Diagnostic of formula distortion: multiplied ohms by volts)</text><text class="cell" x="225" y="402">Reveals student multiplied numbers mechanically without applying circuit laws.</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Anatomy of a diagnostic multiple-choice item</text><text id="label-caption" class="small" x="24" y="448">Plausible distractors transform an MCQ into a diagnostic tool by isolating specific misconceptions.</text><text class="wm" x="768" y="468" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>