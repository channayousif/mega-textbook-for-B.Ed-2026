<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کثیر الانتخابی سوال کی ساخت</title><desc id="d">خاکہ جو جماعت کے ایک کثیر الانتخابی سوال کو اس کے اجزا میں تقسیم کرتا ہے: مسئلہ متعین کرنے والا متن سوال، واحد درست جواب، اور قابلِ یقین تشخیصی گمراہ کن متبادلات۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-boxes"><rect class="panel-a" x="30" y="55" width="720" height="85" rx="6"/><text class="h" x="735" y="80" text-anchor="end">‏1. متن سوال (مسئلے کا بیان)‏</text><text class="cell" x="735" y="103" text-anchor="end">‏”ایک طالب علم 6 اوہم کے تین یکساں بلب 12 وولٹ کی بیٹری کے ساتھ سلسلہ وار جوڑتا ہے۔‏</text><text class="cell" x="735" y="122" text-anchor="end">‏سرکٹ کی کل برقی مزاحمت کتنی ہے؟“‏</text><line class="stroke" x1="390" y1="140" x2="390" y2="160" marker-end="url(#arrow)"/><rect class="panel" x="30" y="160" width="720" height="60" rx="4"/><text class="sh" x="735" y="184" text-anchor="end">‏متبادل الف: 2 اوہم‏</text><text class="small" x="555" y="184" text-anchor="end">‏⁧گمراہ کن متبادل 1 (متوازی کلیے کی غلطی کی تشخیص: ⁦1/R⁩ کا حساب لگایا)⁩‏</text><text class="cell" x="555" y="204" text-anchor="end">‏ظاہر کرتا ہے کہ طالب علم نے سلسلہ وار جمع کو متوازی کے معکوس کلیے سے ملا دیا۔‏</text><rect class="panel" x="30" y="226" width="720" height="60" rx="4"/><text class="sh" x="735" y="250" text-anchor="end">‏متبادل ب: 6 اوہم‏</text><text class="small" x="555" y="250" text-anchor="end">‏گمراہ کن متبادل 2 (اجزا کو نظر انداز کرنے کی تشخیص: ایک بلب کی قدر مان لی)‏</text><text class="cell" x="555" y="270" text-anchor="end">‏ظاہر کرتا ہے کہ طالب علم کے خیال میں ایک ہی راستے پر مزاحمت جمع نہیں ہوتی۔‏</text><rect class="panel-b" x="30" y="292" width="720" height="60" rx="4"/><text class="h" x="735" y="316" text-anchor="end">‏متبادل ج: 18 اوہم‏</text><text class="sh" x="555" y="316" text-anchor="end">‏⁧درست جواب (⁦R_total = 6 + 6 + 6 = 18⁩ اوہم)⁩‏</text><text class="cell" x="555" y="336" text-anchor="end">‏درست تصوراتی سمجھ اور جمع کے حساب کا مظاہرہ کرتا ہے۔‏</text><rect class="panel" x="30" y="358" width="720" height="60" rx="4"/><text class="sh" x="735" y="382" text-anchor="end">‏متبادل د: 72 اوہم‏</text><text class="small" x="555" y="382" text-anchor="end">‏گمراہ کن متبادل 3 (کلیے کے بگاڑ کی تشخیص: اوہم کو وولٹ سے ضرب دی)‏</text><text class="cell" x="555" y="402" text-anchor="end">‏ظاہر کرتا ہے کہ طالب علم نے سرکٹ کے قوانین لاگو کیے بغیر اعداد کو مشینی انداز میں ضرب دی۔‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏تشخیصی کثیر الانتخابی سوال کی ساخت‏</text><text id="label-caption" class="small" x="756" y="448" text-anchor="end">‏قابلِ یقین گمراہ کن متبادلات مخصوص غلط فہمیوں کو الگ کر کے کثیر الانتخابی سوال کو تشخیصی آلہ بنا دیتے ہیں۔‏</text><text class="wm" x="12" y="468" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>