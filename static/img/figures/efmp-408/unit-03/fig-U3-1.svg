<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of specifications for Grade 6 General Science</title><desc id="d">Table showing a worked table of specifications for a Grade 6 general science unit on matter and energy, specifying content topics, cognitive levels, item formats, and percentage weightage.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="40" rx="4"/><text class="sh" x="42" y="80">Curriculum Topic</text><text class="sh" x="270" y="80">Remember</text><text class="sh" x="390" y="80">Understand</text><text class="sh" x="510" y="80">Apply / Analyze</text><text class="sh" x="645" y="80">Total Marks</text><rect class="panel" x="30" y="100" width="720" height="58" rx="4"/><text class="sh" x="42" y="124">1. States of Matter</text><text class="small" x="42" y="142">8 periods taught (20%)</text><text class="cell" x="270" y="124">4 MCQs</text><text class="small" x="270" y="142">(4 marks)</text><text class="cell" x="390" y="124">2 SAQs</text><text class="small" x="390" y="142">(4 marks)</text><text class="cell" x="510" y="124">1 SAQ</text><text class="small" x="510" y="142">(3 marks)</text><text class="sh" x="645" y="124">11 marks</text><text class="small" x="645" y="142">22% weight</text><rect class="panel" x="30" y="163" width="720" height="58" rx="4"/><text class="sh" x="42" y="187">2. Energy Forms</text><text class="small" x="42" y="205">12 periods taught (30%)</text><text class="cell" x="270" y="187">4 MCQs</text><text class="small" x="270" y="205">(4 marks)</text><text class="cell" x="390" y="187">3 SAQs</text><text class="small" x="390" y="205">(6 marks)</text><text class="cell" x="510" y="187">1 Essay</text><text class="small" x="510" y="205">(5 marks)</text><text class="sh" x="645" y="187">15 marks</text><text class="small" x="645" y="205">30% weight</text><rect class="panel" x="30" y="226" width="720" height="58" rx="4"/><text class="sh" x="42" y="250">3. Electric Circuits</text><text class="small" x="42" y="268">14 periods taught (35%)</text><text class="cell" x="270" y="250">5 MCQs</text><text class="small" x="270" y="268">(5 marks)</text><text class="cell" x="390" y="250">3 SAQs</text><text class="small" x="390" y="268">(6 marks)</text><text class="cell" x="510" y="250">1 Essay</text><text class="small" x="510" y="268">(6 marks)</text><text class="sh" x="645" y="250">17 marks</text><text class="small" x="645" y="268">34% weight</text><rect class="panel" x="30" y="289" width="720" height="58" rx="4"/><text class="sh" x="42" y="313">4. Environmental Heat</text><text class="small" x="42" y="331">6 periods taught (15%)</text><text class="cell" x="270" y="313">2 MCQs</text><text class="small" x="270" y="331">(2 marks)</text><text class="cell" x="390" y="313">1 SAQ</text><text class="small" x="390" y="331">(3 marks)</text><text class="cell" x="510" y="313">-</text><text class="small" x="510" y="331">(0 marks)</text><text class="sh" x="645" y="313">7 marks</text><text class="small" x="645" y="331">14% weight</text><rect class="panel-b" x="30" y="352" width="720" height="58" rx="4"/><text class="sh" x="42" y="376">Total Test Allocation</text><text class="small" x="42" y="394">40 periods (100%)</text><text class="sh" x="270" y="376">15 marks</text><text class="small" x="270" y="394">30% cognitive</text><text class="sh" x="390" y="376">19 marks</text><text class="small" x="390" y="394">38% cognitive</text><text class="sh" x="510" y="376">16 marks</text><text class="small" x="510" y="394">32% cognitive</text><text class="h" x="645" y="376">50 marks</text><text class="small" x="645" y="394">100% total</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Worked Table of Specifications (Grade 6 General Science, 50 Marks)</text><text id="label-caption" class="small" x="24" y="445">A two-dimensional blueprint ensures balanced curriculum sampling across Bloom's tiers.</text><text class="wm" x="768" y="468" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>