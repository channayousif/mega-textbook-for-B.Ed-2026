<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منظم آزمائش سازی کا فلو چارٹ</title><desc id="d">فلو چارٹ جو منظم آزمائش سازی کے عمل کو نصاب اور سلیبس کے تجزیے سے لے کر امتحانی خاکے کی تیاری اور سوالات لکھنے سے ہوتے ہوئے پرچے کی ترتیب اور جائزے تک دکھاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-boxes"><rect class="panel" x="40" y="55" width="700" height="66" rx="6"/><text class="h" x="724" y="80" text-anchor="end">‏مرحلہ 1: نصاب اور سلیبس کا تجزیہ‏</text><text class="cell" x="724" y="102" text-anchor="end">‏⁧نصابی معیارات اور SLOs کی نشاندہی کریں، اور پڑھائے گئے تدریسی پیریڈز گنیں۔⁩‏</text><line class="stroke" x1="390" y1="121" x2="390" y2="139" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="139" width="700" height="66" rx="6"/><text class="h" x="724" y="164" text-anchor="end">‏مرحلہ 2: امتحانی خاکے کی تیاری (جدولِ تخصیص)‏</text><text class="cell" x="724" y="186" text-anchor="end">‏موضوع کے وزن کا حساب لگائیں، نمبر بلوم کے درجات میں تقسیم کریں، اور ہیئتیں مقرر کریں۔‏</text><line class="stroke" x1="390" y1="205" x2="390" y2="223" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="223" width="700" height="66" rx="6"/><text class="h" x="724" y="248" text-anchor="end">‏مرحلہ 3: سوالات کی تیاری اور سوال نگاری‏</text><text class="cell" x="724" y="270" text-anchor="end">‏واضح متن سوال، درست جواب، قابلِ یقین گمراہ کن متبادلات اور تجزیاتی نمونے کے جوابات لکھیں۔‏</text><line class="stroke" x1="390" y1="289" x2="390" y2="307" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="307" width="700" height="66" rx="6"/><text class="h" x="724" y="332" text-anchor="end">‏مرحلہ 4: پرچے کی ترتیب اور ساتھیوں سے جائزہ‏</text><text class="cell" x="724" y="354" text-anchor="end">‏جائزہ فہرست سے جانچیں: وقت اور ہدایات کی تصدیق کریں، اور سراغ ختم کریں۔‏</text><line class="stroke" x1="390" y1="373" x2="390" y2="391" marker-end="url(#arrow)"/><rect class="panel" x="40" y="391" width="700" height="66" rx="6"/><text class="h" x="724" y="416" text-anchor="end">‏مرحلہ 5: انعقاد اور معروضی جانچ‏</text><text class="cell" x="724" y="438" text-anchor="end">‏یکساں حالات میں آزمائش لیں؛ درست جوابات اور معیارِ جانچ سے معروضی جانچ کریں۔‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">‏منظم آزمائش سازی کا دور: سلیبس سے امتحانی پرچے تک‏</text><text id="label-caption" class="small" x="756" y="482" text-anchor="end">‏ہر مرحلہ پچھلے مرحلے پر استوار ہوتا ہے تاکہ مواد کی صداقت اور نمبروں کی اعتماديت یقینی ہو۔‏</text><text class="wm" x="12" y="482" text-anchor="start" aria-hidden="true">textbook.com.pk</text></g></svg>