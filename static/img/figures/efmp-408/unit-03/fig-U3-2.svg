<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of essay and short-answer item formats</title><desc id="d">Table comparing essay questions and short-answer items across cognitive demand, breadth of curriculum coverage, question writing effort, scoring time, and vulnerability to marker bias.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel-a" x="30" y="55" width="720" height="38" rx="4"/><text class="sh" x="42" y="80">Dimension</text><text class="sh" x="205" y="80">Essay Questions</text><text class="sh" x="475" y="80">Short-Answer Items</text><rect class="panel" x="30" y="98" width="720" height="62" rx="4"/><text class="sh" x="42" y="122">1. Target Tier</text><text class="small" x="42" y="142">Cognitive focus</text><text class="cell" x="205" y="122">Complex synthesis, analysis, and</text><text class="cell" x="205" y="142">original argument organisation.</text><text class="cell" x="475" y="122">Specific terminology, factual recall,</text><text class="cell" x="475" y="142">and single-step problem solving.</text><rect class="panel" x="30" y="165" width="720" height="62" rx="4"/><text class="sh" x="42" y="189">2. Sampling</text><text class="small" x="42" y="209">Syllabus coverage</text><text class="cell" x="205" y="189">Narrow sampling (2 to 4 topics);</text><text class="cell" x="205" y="209">higher testing luck and error.</text><text class="cell" x="475" y="189">Broad sampling (15 to 25 items);</text><text class="cell" x="475" y="209">representative syllabus coverage.</text><rect class="panel" x="30" y="232" width="720" height="62" rx="4"/><text class="sh" x="42" y="256">3. Setting Effort</text><text class="small" x="42" y="276">Writing demands</text><text class="cell" x="205" y="256">Quick prompt writing; high effort</text><text class="cell" x="205" y="276">to draft rubrics and model answers.</text><text class="cell" x="475" y="256">Moderate effort; requires tight framing</text><text class="cell" x="475" y="276">so only definite terms are correct.</text><rect class="panel" x="30" y="299" width="720" height="62" rx="4"/><text class="sh" x="42" y="323">4. Marking Time</text><text class="small" x="42" y="343">Scoring demands</text><text class="cell" x="205" y="323">Heavy time (10 to 15 min per script);</text><text class="cell" x="205" y="343">marker fatigue causes score drift.</text><text class="cell" x="475" y="323">Fast and efficient (1 to 2 min);</text><text class="cell" x="475" y="343">scored objectively against a key.</text><rect class="panel" x="30" y="366" width="720" height="62" rx="4"/><text class="sh" x="42" y="390">5. Marker Bias</text><text class="small" x="42" y="410">Scoring error</text><text class="cell" x="205" y="390">High vulnerability to halo effects,</text><text class="cell" x="205" y="410">neatness, and contrast effects.</text><text class="cell" x="475" y="390">Minimal risk; high agreement</text><text class="cell" x="475" y="410">when answers are bounded.</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Subjective item formats: essay vs short-answer characteristics</text><text id="label-caption" class="small" x="24" y="455">Balancing both formats assesses deep reasoning and broad coverage.</text><text class="wm" x="768" y="468" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>