<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One pupil's portfolio across a term</title><desc id="d">Diagram of one pupil's portfolio across a term, showing the entries, the reflection page and the teacher's conference notes.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-regions"><rect class="panel" x="40" y="90" width="170" height="270" rx="8"/><rect class="panel" x="240" y="90" width="170" height="270" rx="8"/><rect class="panel" x="440" y="90" width="170" height="270" rx="8"/><rect class="panel-b" x="630" y="90" width="130" height="270" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="210" y1="225" x2="238" y2="225" marker-end="url(#arrow)"/><line class="stroke" x1="410" y1="225" x2="438" y2="225" marker-end="url(#arrow)"/><line class="stroke" x1="610" y1="225" x2="628" y2="225" marker-end="url(#arrow)"/></g><g id="layer-nodes"><rect class="panel-a" x="65" y="160" width="120" height="70" rx="6"/><line class="grid" x1="75" y1="180" x2="175" y2="180"/><line class="grid" x1="75" y1="198" x2="175" y2="198"/><line class="grid" x1="75" y1="216" x2="175" y2="216"/><rect class="panel-a" x="65" y="272" width="120" height="70" rx="6"/><line class="grid" x1="75" y1="292" x2="175" y2="292"/><line class="grid" x1="75" y1="310" x2="175" y2="310"/><line class="grid" x1="75" y1="328" x2="175" y2="328"/><rect class="panel-a" x="265" y="160" width="120" height="70" rx="6"/><line class="grid" x1="275" y1="180" x2="375" y2="180"/><line class="grid" x1="275" y1="198" x2="375" y2="198"/><line class="grid" x1="275" y1="216" x2="375" y2="216"/><rect class="panel-a" x="265" y="272" width="120" height="70" rx="6"/><line class="grid" x1="275" y1="292" x2="375" y2="292"/><line class="grid" x1="275" y1="310" x2="375" y2="310"/><line class="grid" x1="275" y1="328" x2="375" y2="328"/><rect class="panel-a" x="465" y="160" width="120" height="70" rx="6"/><line class="grid" x1="475" y1="180" x2="575" y2="180"/><line class="grid" x1="475" y1="198" x2="575" y2="198"/><line class="grid" x1="475" y1="216" x2="575" y2="216"/><rect class="panel-a" x="465" y="272" width="120" height="70" rx="6"/><line class="grid" x1="475" y1="292" x2="575" y2="292"/><line class="grid" x1="475" y1="310" x2="575" y2="310"/><line class="grid" x1="475" y1="328" x2="575" y2="328"/><line class="grid" x1="645" y1="180" x2="745" y2="180"/><line class="grid" x1="645" y1="200" x2="745" y2="200"/><line class="grid" x1="645" y1="220" x2="745" y2="220"/><line class="grid" x1="645" y1="240" x2="745" y2="240"/><line class="grid" x1="645" y1="260" x2="745" y2="260"/></g><g id="layer-labels"><text class="sh" x="60" y="120">Week 2</text><text class="small" x="60" y="150">Entry</text><text class="small" x="60" y="262">Reflection</text><text class="sh" x="260" y="120">Week 6</text><text class="small" x="260" y="150">Entry</text><text class="small" x="260" y="262">Reflection</text><text class="sh" x="460" y="120">Week 10</text><text class="small" x="460" y="150">Entry</text><text class="small" x="460" y="262">Reflection</text><text class="sh" x="645" y="120">Teacher</text><text class="sh" x="645" y="140">conference</text><text class="small" x="645" y="300">agreed next step</text><text id="label-title" class="h" x="24" y="34">One pupil's portfolio across a term</text><text id="label-caption" class="small" x="24" y="445">Entries and reflections are selected over time, then discussed at a conference.</text><text class="wm" x="768" y="488" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
