<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Anatomy of one rubric row</title><desc id="d">Diagram of one rubric row dissected into its criterion, its three performance levels and the descriptor under each level.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect class="panel" x="40" y="90" width="700" height="220" rx="8"/><rect class="panel-a" x="40" y="90" width="180" height="220" rx="8"/><rect class="panel-b" x="220" y="90" width="160" height="40" rx="8"/><rect class="panel-b" x="380" y="90" width="160" height="40" rx="8"/><rect class="panel-b" x="540" y="90" width="200" height="40" rx="8"/></g><g id="layer-edges"><line class="frame" x1="220" y1="90" x2="220" y2="310"/><line class="frame" x1="380" y1="90" x2="380" y2="310"/><line class="frame" x1="540" y1="90" x2="540" y2="310"/><line class="frame" x1="40" y1="130" x2="740" y2="130"/><line class="stroke" x1="130" y1="340" x2="130" y2="312"/><line class="stroke" x1="380" y1="340" x2="380" y2="312"/><line class="stroke" x1="620" y1="340" x2="620" y2="312"/></g><g id="layer-nodes"><text class="h" x="55" y="118">Criterion</text><text class="h" x="235" y="118">Level 1</text><text class="h" x="395" y="118">Level 2</text><text class="h" x="555" y="118">Level 3</text><text class="sh" x="55" y="180">Organisation</text><text class="small" x="55" y="200">ideas in order</text><text class="cell" x="235" y="180">Ideas in no</text><text class="cell" x="235" y="197">clear order</text><text class="cell" x="395" y="180">Some order,</text><text class="cell" x="395" y="197">weak ending</text><text class="cell" x="555" y="180">Clear beginning,</text><text class="cell" x="555" y="197">middle and end</text></g><g id="layer-labels"><text class="small" x="130" y="360" text-anchor="middle">criterion</text><text class="small" x="380" y="360" text-anchor="middle">levels</text><text class="small" x="620" y="360" text-anchor="middle">descriptors</text><text id="label-title" class="h" x="24" y="34">Anatomy of one rubric row</text><text id="label-caption" class="small" x="24" y="410">A rubric row reads across: the criterion names the aspect, the levels</text><text id="label-caption-2" class="small" x="24" y="428">describe quality, and the descriptor says what the pupil does.</text><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
