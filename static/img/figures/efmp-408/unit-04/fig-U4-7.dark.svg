<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Feedback that moves learning versus feedback that only judges</title><desc id="d">Table comparing feedback that moves learning forward with feedback that only judges, on specificity, focus, timing and whether the pupil can act on it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="375" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="60" rx="8"/><line class="frame" x1="24" y1="115" x2="756" y2="115"/><line class="frame" x1="24" y1="180" x2="756" y2="180"/><line class="frame" x1="24" y1="245" x2="756" y2="245"/><line class="frame" x1="24" y1="310" x2="756" y2="310"/><line class="frame" x1="24" y1="375" x2="756" y2="375"/><line class="frame" x1="24" y1="430" x2="756" y2="430"/><line class="frame" x1="180" y1="55" x2="180" y2="430"/><line class="frame" x1="470" y1="55" x2="470" y2="430"/><text class="h" x="36" y="90">Feature</text><text class="h" x="192" y="80">Feedback that moves</text><text class="h" x="192" y="98">learning forward</text><text class="h" x="482" y="80">Feedback that only</text><text class="h" x="482" y="98">judges</text><text class="sh" x="36" y="152">Specificity</text><text class="cell" x="192" y="152">Names the exact gap</text><text class="cell" x="482" y="152">Uses a general label</text><text class="sh" x="36" y="217">Focus</text><text class="cell" x="192" y="217">One or two main points</text><text class="cell" x="482" y="217">Comments on everything</text><text class="sh" x="36" y="282">Timing</text><text class="cell" x="192" y="282">Given while the pupil can act</text><text class="cell" x="482" y="282">Given after the unit ends</text><text class="sh" x="36" y="347">Pupil can act?</text><text class="cell" x="192" y="347">Yes: a clear next step</text><text class="cell" x="482" y="347">No: only a verdict</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Two kinds of feedback</text><text id="label-caption" class="small" x="24" y="450">Usable feedback tells the pupil what to do next; a verdict only judges the work.</text><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
