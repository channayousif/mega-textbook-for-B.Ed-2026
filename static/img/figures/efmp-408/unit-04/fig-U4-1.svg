</style><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="365" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="180" x2="756" y2="180"/><line class="frame" x1="24" y1="260" x2="756" y2="260"/><line class="frame" x1="24" y1="340" x2="756" y2="340"/><line class="frame" x1="24" y1="420" x2="756" y2="420"/><line class="frame" x1="170" y1="55" x2="170" y2="420"/><line class="frame" x1="360" y1="55" x2="360" y2="420"/><line class="frame" x1="570" y1="55" x2="570" y2="420"/><text class="h" x="36" y="83">Task type</text><text class="h" x="182" y="83">Pupil's action</text><text class="h" x="372" y="74">What a written</text><text class="h" x="372" y="92">test cannot show</text><text class="h" x="582" y="83">Example</text><text class="sh" x="36" y="132">Practical test</text><text class="cell" x="182" y="132">Performs a procedure</text><text class="cell" x="372" y="132">Process, order of steps,</text><text class="cell" x="372" y="149">practical handling</text><text class="cell" x="582" y="132">Leaf starch test</text><text class="sh" x="36" y="212">Presentation</text><text class="cell" x="182" y="212">Organises ideas and</text><text class="cell" x="182" y="229">speaks to an audience</text><text class="cell" x="372" y="212">Communication,</text><text class="cell" x="372" y="229">confidence, reasoning</text><text class="cell" x="582" y="212">Class 4 speech on a</text><text class="cell" x="582" y="229">national day</text><text class="sh" x="36" y="292">Portfolio</text><text class="cell" x="182" y="292">Selects and reflects</text><text class="cell" x="182" y="309">on work over time</text><text class="cell" x="372" y="292">Progress, reflection,</text><text class="cell" x="372" y="309">self-evaluation</text><text class="cell" x="582" y="292">Three Urdu pieces</text><text class="cell" x="582" y="309">across a term</text><text class="sh" x="36" y="372">Project</text><text class="cell" x="182" y="372">Plans and produces</text><text class="cell" x="182" y="389">an extended product</text><text class="cell" x="372" y="372">Integration of skills,</text><text class="cell" x="372" y="389">planning, persistence</text><text class="cell" x="582" y="372">Water scarcity</text><text class="cell" x="582" y="389">project in Sindh</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Four ways to assess what pupils can do</text><text id="label-caption" class="small" x="24" y="445">Each task shows evidence that a written test alone cannot capture.</text><text class="wm" x="768" y="488" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
