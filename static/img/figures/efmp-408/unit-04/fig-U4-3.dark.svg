<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The feedback loop from task to revised attempt</title><desc id="d">Flowchart of the feedback loop: a task produces evidence, the teacher gives feedback, the pupil makes a revised attempt, and the loop repeats until the target is met.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-flow"><rect class="panel-a" x="290" y="55" width="200" height="44" rx="22"/><text class="sh" x="390" y="82" text-anchor="middle">Pupil attempts a task</text><line class="stroke" x1="390" y1="99" x2="390" y2="105" marker-end="url(#arrow)"/><rect class="panel" x="250" y="105" width="280" height="45" rx="8"/><text class="sh" x="390" y="133" text-anchor="middle">Teacher gathers evidence</text><line class="stroke" x1="390" y1="150" x2="390" y2="155" marker-end="url(#arrow)"/><rect class="panel" x="230" y="155" width="320" height="60" rx="8"/><text class="sh" x="390" y="180" text-anchor="middle">Teacher gives feedback:</text><text class="cell" x="390" y="198" text-anchor="middle">target, gap, next step</text><line class="stroke" x1="390" y1="215" x2="390" y2="220" marker-end="url(#arrow)"/><rect class="panel" x="250" y="220" width="280" height="50" rx="8"/><text class="sh" x="390" y="250" text-anchor="middle">Pupil makes a revised attempt</text><line class="stroke" x1="390" y1="270" x2="390" y2="275" marker-end="url(#arrow)"/><polygon class="panel-c" points="390,275 480,310 390,345 300,310"/><text class="sh" x="390" y="305" text-anchor="middle">Is the target</text><text class="sh" x="390" y="322" text-anchor="middle">met?</text><line class="stroke" x1="390" y1="345" x2="390" y2="375" marker-end="url(#arrow)"/><text class="sh" x="405" y="365">Yes</text><rect class="panel-a" x="300" y="375" width="180" height="44" rx="22"/><text class="sh" x="390" y="402" text-anchor="middle">Target met</text><path class="dash" d="M 300 310 L 160 310 L 160 127 L 248 127" marker-end="url(#arrow)"/><text class="sh" x="210" y="300">No</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">The feedback loop</text><text id="label-caption" class="small" x="24" y="500">Feedback sends the pupil back to the work until the target is met.</text><text class="wm" x="768" y="525" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
