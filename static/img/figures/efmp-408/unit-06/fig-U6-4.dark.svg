<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline: evolution of standardized assessment in Pakistan</title><desc id="d">Timeline diagram tracing the historical evolution of standardized assessment in Pakistan from provincial board examinations through NAT, GAT, NEAS, and international survey participation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-timeline"><line class="stroke" x1="40" y1="230" x2="740" y2="230" marker-end="url(#arrow)"/><circle cx="100" cy="230" r="8" class="ah"/><line class="stroke" x1="100" y1="230" x2="100" y2="155"/><rect class="panel" x="30" y="70" width="160" height="85" rx="8"/><text class="sh" x="110" y="94" text-anchor="middle">1950s - 1980s</text><text class="cell" x="110" y="116" text-anchor="middle">Provincial BISE Boards</text><text class="small" x="110" y="136" text-anchor="middle">Matric / Inter high stakes</text><circle cx="270" cy="230" r="8" class="ah"/><line class="stroke" x1="270" y1="230" x2="270" y2="305"/><rect class="panel-a" x="195" y="305" width="165" height="85" rx="8"/><text class="sh" x="277" y="329" text-anchor="middle">2002 - 2003</text><text class="cell" x="277" y="351" text-anchor="middle">NTS Aptitude Testing</text><text class="small" x="277" y="371" text-anchor="middle">NAT &amp; GAT item banking</text><circle cx="450" cy="230" r="8" class="ah"/><line class="stroke" x1="450" y1="230" x2="450" y2="155"/><rect class="panel-b" x="370" y="70" width="170" height="85" rx="8"/><text class="sh" x="455" y="94" text-anchor="middle">2005 - 2010</text><text class="cell" x="455" y="116" text-anchor="middle">NEAS Diagnostic Cycles</text><text class="small" x="455" y="136" text-anchor="middle">Grades 4 &amp; 8 national sample</text><circle cx="630" cy="230" r="8" class="ah"/><line class="stroke" x1="630" y1="230" x2="630" y2="305"/><rect class="panel-c" x="545" y="305" width="180" height="90" rx="8"/><text class="sh" x="635" y="329" text-anchor="middle">2019 - Present</text><text class="cell" x="635" y="351" text-anchor="middle">Global &amp; Licencing</text><text class="small" x="635" y="371" text-anchor="middle">International surveys &amp;</text><text class="small" x="635" y="387" text-anchor="middle">Sindh Teaching Licence</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Evolution of standardized testing and assessment systems in Pakistan</text><text id="label-caption" class="small" x="24" y="445">Assessment progression from terminal board examinations to aptitude, diagnostic, and licensing models.</text><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>