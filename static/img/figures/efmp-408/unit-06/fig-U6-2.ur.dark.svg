<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پیشہ ورانہ تعلیمی تشخیص کے بنیادی اخلاقی ستون</title><desc id="d">تصوراتی خاکہ جو تشخیصی کوائف سے وابستہ اخلاقی ذمہ داریوں کو ڈیزائن میں انصاف، انعقاد میں دیانت، نتائج میں معقولیت، اور ریکارڈ میں رازداری کے تناظر میں ظاہر کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-map"><rect class="panel" x="270" y="200" width="240" height="75" rx="10"/><text class="h" x="390" y="232" text-anchor="middle">تشخیصی کوائف میں</text><text class="h" x="390" y="254" text-anchor="middle">اخلاقی ذمہ داریاں</text><rect class="panel-a" x="520" y="70" width="220" height="85" rx="8"/><text class="sh" x="630" y="96" text-anchor="middle">1. نظامی انصاف</text><text class="cell" x="630" y="118" text-anchor="middle">سیکھنے میں غیر متعلقہ رکاوٹوں کا خاتمہ</text><text class="small" x="630" y="136" text-anchor="middle">لسانی و ثقافتی مساوات کی فراہمی</text><line class="stroke" x1="495" y1="200" x2="565" y2="155" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="70" width="220" height="85" rx="8"/><text class="sh" x="150" y="96" text-anchor="middle">2. تعلیمی دیانت</text><text class="cell" x="150" y="118" text-anchor="middle">امتحانی بدعنوانی کی مکمل روک تھام</text><text class="small" x="150" y="136" text-anchor="middle">حقیقی و مستند تشخیصی سرگرمیاں</text><line class="stroke" x1="285" y1="200" x2="215" y2="155" marker-end="url(#arrow)"/><rect class="panel-c" x="520" y="325" width="220" height="85" rx="8"/><text class="sh" x="630" y="351" text-anchor="middle">3. معقولیت و تناسب</text><text class="cell" x="630" y="373" text-anchor="middle">اصلاحی تدریسی اقدامات</text><text class="small" x="630" y="391" text-anchor="middle">تعلیم سے محرومی کے بجائے منصفانہ نظم</text><line class="stroke" x1="495" y1="275" x2="565" y2="325" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="325" width="220" height="85" rx="8"/><text class="sh" x="150" y="351" text-anchor="middle">4. کوائف کی رازداری</text><text class="cell" x="150" y="373" text-anchor="middle">عوامی سطح پر نمبروں کی تشہیر کی ممانعت</text><text class="small" x="150" y="391" text-anchor="middle">محفوظ اور رازدارانہ تشخیصی ریکارڈ</text><line class="stroke" x1="285" y1="275" x2="215" y2="325" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">پیشہ ورانہ تعلیمی تشخیص کے بنیادی اخلاقی ستون</text><text id="label-caption" class="small" x="756" y="465" text-anchor="end">تشخیصی فیصلے زندگی بدلنے والے اثرات رکھتے ہیں، جن کے لیے سخت اخلاقی اصول لازمی ہیں۔</text><text class="wm" x="24" y="485" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
