<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">امتحانی بدعنوانی پر متناسب تدریسی و انتظامی ردعمل</title><desc id="d">جدول جس میں تعلیمی دیانت کی خلاف ورزیوں کو معمولی تربیتی غلطیوں، سنگین دانستہ دھوکہ دہی، اور منظم ادارہ جاتی بدعنوانی میں تقسیم کر کے متناسب ردعمل کا موازنہ کیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="375" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="205" x2="756" y2="205"/><line class="frame" x1="24" y1="315" x2="756" y2="315"/><line class="frame" x1="610" y1="55" x2="610" y2="430"/><line class="frame" x1="330" y1="55" x2="330" y2="430"/><text class="h" x="744" y="75" text-anchor="end">خلاف ورزی</text><text class="h" x="744" y="93" text-anchor="end">کی نوعیت</text><text class="h" x="598" y="83" text-anchor="end">کلاس روم میں ظہور کی صورتیں</text><text class="h" x="318" y="83" text-anchor="end">متناسب اصلاحی و انتظامی ردعمل</text><text class="sh" x="744" y="130" text-anchor="end">1. معمولی تدریسی</text><text class="sh" x="744" y="150" text-anchor="end">خامی</text><text class="small" x="744" y="170" text-anchor="end">(تربیتی سطح)</text><text class="cell" x="598" y="125" text-anchor="end">حوالہ دینے میں غیر ارادی غلطی؛</text><text class="cell" x="598" y="145" text-anchor="end">ہوم ورک کا ایک سوال نقل کرنا؛</text><text class="cell" x="598" y="165" text-anchor="end">غیر رسمی جماعتی کوئز کے دوران</text><text class="cell" x="598" y="185" text-anchor="end">سرگوشی میں ساتھی سے پوچھنا</text><text class="cell" x="318" y="125" text-anchor="end">حوالہ جات کے درست اصول دوبارہ سکھانا؛</text><text class="cell" x="318" y="145" text-anchor="end">کام کی درستی اور دوبارہ جمع کروانا؛</text><text class="cell" x="318" y="165" text-anchor="end">مستقل نمبر کٹوتی کے بغیر نجی سطح پر</text><text class="cell" x="318" y="185" text-anchor="end">اصلاحی رہنمائی فراہم کرنا</text><text class="sh" x="744" y="240" text-anchor="end">2. سنگین دانستہ</text><text class="sh" x="744" y="260" text-anchor="end">بدعنوانی</text><text class="cell" x="598" y="235" text-anchor="end">امتحان میں نقل کی پرچیاں لانا؛</text><text class="cell" x="598" y="255" text-anchor="end">دوسرے طالب علم کے پرچے سے نقل کرنا؛</text><text class="cell" x="598" y="275" text-anchor="end">اکیڈمی یا انٹرنیٹ سے خریدا گیا مضمون</text><text class="cell" x="598" y="295" text-anchor="end">اپنے نام سے جمع کروانا</text><text class="cell" x="318" y="235" text-anchor="end">امتحان میں صفر نمبر تفویض کرنا؛</text><text class="cell" x="318" y="255" text-anchor="end">والدین کے ساتھ نجی مشاورتی اجلاس؛</text><text class="cell" x="318" y="275" text-anchor="end">تعلیمی دیانت پر لازمی اصلاحی ماڈیول اور</text><text class="cell" x="318" y="295" text-anchor="end">نگرانی میں دوبارہ متبادل ٹیسٹ کا انعقاد</text><text class="sh" x="744" y="350" text-anchor="end">3. منظم ادارہ جاتی</text><text class="sh" x="744" y="370" text-anchor="end">بدعنوانی</text><text class="cell" x="598" y="345" text-anchor="end">اسکول عملے کی جانب سے پرچہ آؤٹ کرنا؛</text><text class="cell" x="598" y="365" text-anchor="end">اصل امیدوار کی جگہ جعلی شخص کا بیٹھنا؛</text><text class="cell" x="598" y="385" text-anchor="end">رشوت یا اثر و رسوخ کی بنیاد پر</text><text class="cell" x="598" y="405" text-anchor="end">رزلٹ رجسٹرز میں رد و بدل کرنا</text><text class="cell" x="318" y="345" text-anchor="end">امتحانی نتائج کی فوری منسوخی؛</text><text class="cell" x="318" y="365" text-anchor="end">ملوث عملے کے خلاف سخت تادیبی و قانونی کارروائی؛</text><text class="cell" x="318" y="385" text-anchor="end">امتحانی مرکز کا باضابطہ آڈٹ اور</text><text class="cell" x="318" y="405" text-anchor="end">مستقبل کے امتحانات کے لیے غیر جانبدار نگرانی</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">امتحانی بدعنوانی پر متناسب تدریسی و انتظامی ردعمل</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">اخلاقی اقدامات ادارہ جاتی دیانت اور تدریسی انصاف کے درمیان متوازن توازن قائم رکھتے ہیں۔</text><text class="wm" x="24" y="475" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
