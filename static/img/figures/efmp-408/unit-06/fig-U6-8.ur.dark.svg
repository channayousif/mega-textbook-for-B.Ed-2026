<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">این پی ایس ٹی پی معیار 5 اور پیشہ ورانہ جماعتی نفاذ</title><desc id="d">تصوراتی خاکہ جو این پی ایس ٹی پی معیار 5 کے تین اہم پہلوؤں (علم، رجحانات، کارکردگی) کو مخصوص جماعتی تدریسی و تشخیصی طریقہ کار سے منسلک کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-map"><rect class="panel" x="250" y="65" width="280" height="70" rx="10"/><text class="h" x="390" y="93" text-anchor="middle">این پی ایس ٹی پی (NPSTP) معیار 5</text><text class="sh" x="390" y="115" text-anchor="middle">جماعتی تشخیص کا پیشہ ورانہ معیار</text><rect class="panel-a" x="535" y="185" width="215" height="105" rx="8"/><text class="sh" x="642" y="210" text-anchor="middle">1. علمی بنیادیں و نظریہ</text><text class="cell" x="642" y="232" text-anchor="middle">صداقت، اعتمادیت اور ایس ایل اوز</text><text class="cell" x="642" y="250" text-anchor="middle">تشکیلی و مجموعی آلات کا فہم</text><text class="small" x="642" y="270" text-anchor="middle">غلطیوں کا تشخیصی تجزیہ</text><line class="stroke" x1="470" y1="135" x2="590" y2="185" marker-end="url(#arrow)"/><rect class="panel-b" x="280" y="185" width="220" height="105" rx="8"/><text class="sh" x="390" y="210" text-anchor="middle">2. رجحانات و اقدار</text><text class="cell" x="390" y="232" text-anchor="middle">یقین کہ تمام بچے سیکھ سکتے ہیں</text><text class="cell" x="390" y="250" text-anchor="middle">متنوع طلبہ کے لیے مساوات و انصاف</text><text class="small" x="390" y="270" text-anchor="middle">تشخیص بطور تدریسی معاونت</text><line class="stroke" x1="390" y1="135" x2="390" y2="185" marker-end="url(#arrow)"/><rect class="panel-c" x="30" y="185" width="215" height="105" rx="8"/><text class="sh" x="137" y="210" text-anchor="middle">3. عملی مہارتیں و کارکردگی</text><text class="cell" x="137" y="232" text-anchor="middle">روبراکس اور ٹیسٹ کی تیاری</text><text class="cell" x="137" y="250" text-anchor="middle">وضاحتی فیڈ بیک کی فراہمی</text><text class="small" x="137" y="270" text-anchor="middle">تدریسی طریقوں میں بر وقت ترمیم</text><line class="stroke" x1="310" y1="135" x2="190" y2="185" marker-end="url(#arrow)"/><rect class="panel" x="70" y="340" width="640" height="80" rx="8"/><text class="sh" x="390" y="365" text-anchor="middle">کلاس روم میں عملی تدریسی اقدامات</text><text class="cell" x="390" y="385" text-anchor="middle">طلبہ کے ساتھ شفاف معیارات کی شیئرنگ؛ اسباق کے دوران خروجی پرچیاں اور تختیوں کا استعمال؛</text><text class="cell" x="390" y="403" text-anchor="middle">نجی سطح پر تعمیری فیڈ بیک؛ رازدارانہ ریکارڈ کا تحفظ؛ طلبہ کے خود تشخیصی پورٹ فولیوز</text><line class="stroke" x1="642" y1="290" x2="580" y2="340" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="290" x2="390" y2="340" marker-end="url(#arrow)"/><line class="stroke" x1="137" y1="290" x2="200" y2="340" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">این پی ایس ٹی پی معیار 5 اور پیشہ ورانہ جماعتی نفاذ</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">معیار 5 تشخیصی علم، پیشہ ورانہ اقدار اور روزمرہ جماعتی تدریسی اقدامات کو یکجا کرتا ہے۔</text><text class="wm" x="24" y="475" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
