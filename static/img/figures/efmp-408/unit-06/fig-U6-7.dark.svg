<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of test-based and assessment-based evaluation cultures</title><desc id="d">Table contrasting a test-based culture against an assessment-based evaluation culture across primary educational purpose, student role, teacher role, rewarded behaviours, and obscured systemic realities.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="425" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="250" x2="756" y2="250"/><line class="frame" x1="24" y1="325" x2="756" y2="325"/><line class="frame" x1="24" y1="400" x2="756" y2="400"/><line class="frame" x1="155" y1="55" x2="155" y2="480"/><line class="frame" x1="445" y1="55" x2="445" y2="480"/><text class="h" x="35" y="83">Dimension</text><text class="h" x="170" y="83">Test-Based Culture</text><text class="h" x="460" y="83">Assessment-Based Culture</text><text class="sh" x="35" y="125">Primary</text><text class="sh" x="35" y="145">Purpose</text><text class="cell" x="170" y="125">Sorting, ranking, and</text><text class="cell" x="170" y="145">grading; separating pass</text><text class="cell" x="170" y="165">from fail at terminal point</text><text class="cell" x="460" y="125">Diagnosing learning gaps,</text><text class="cell" x="460" y="145">guiding instruction, and</text><text class="cell" x="460" y="165">supporting mastery for all</text><text class="sh" x="35" y="200">Teacher</text><text class="sh" x="35" y="220">Role</text><text class="cell" x="170" y="200">Passive exam proctor and</text><text class="cell" x="170" y="220">mechanical grader of</text><text class="cell" x="170" y="240">right and wrong answers</text><text class="cell" x="460" y="200">Diagnostic investigator who</text><text class="cell" x="460" y="220">modifies teaching based</text><text class="cell" x="460" y="240">on ongoing student data</text><text class="sh" x="35" y="275">Student</text><text class="sh" x="35" y="295">Role</text><text class="cell" x="170" y="275">Passive receiver of marks;</text><text class="cell" x="170" y="295">motivated by exam anxiety</text><text class="cell" x="170" y="315">and fear of poor ranking</text><text class="cell" x="460" y="275">Active partner in self-check,</text><text class="cell" x="460" y="295">peer feedback, and</text><text class="cell" x="460" y="315">goal-directed learning</text><text class="sh" x="35" y="350">Error</text><text class="sh" x="35" y="370">Handling</text><text class="cell" x="170" y="350">Penalized, criticized, and</text><text class="cell" x="170" y="370">viewed as evidence of</text><text class="cell" x="170" y="390">student laziness or deficit</text><text class="cell" x="460" y="350">Welcomed as valuable windows</text><text class="cell" x="460" y="370">into student reasoning that</text><text class="cell" x="460" y="390">guide targeted feedback</text><text class="sh" x="35" y="425">Obscured</text><text class="sh" x="35" y="445">Realities</text><text class="cell" x="170" y="425">Conceals whether learners</text><text class="cell" x="170" y="445">master core competencies;</text><text class="cell" x="170" y="465">hides dropout triggers</text><text class="cell" x="460" y="425">Rejects simple rank tables;</text><text class="cell" x="460" y="445">demands multi-dimensional</text><text class="cell" x="460" y="465">portfolio assessment reporting</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Contrasting institutional evaluation cultures in education</text><text id="label-caption" class="small" x="24" y="505">A test-based culture ranks pupils by marks; an assessment-based culture empowers learners through evidence.</text><text class="wm" x="768" y="525" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>