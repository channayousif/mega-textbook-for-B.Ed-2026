<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map: NPSTP Standard 5 and classroom assessment practices</title><desc id="d">Concept map illustrating the three core dimensions of NPSTP Standard 5 (Knowledge, Dispositions, Performance) linked to specific classroom teaching and assessment practices.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-map"><rect class="panel" x="250" y="65" width="280" height="70" rx="10"/><text class="h" x="390" y="93" text-anchor="middle">NPSTP Standard 5</text><text class="sh" x="390" y="115" text-anchor="middle">Classroom Assessment Standard</text><rect class="panel-a" x="30" y="185" width="215" height="105" rx="8"/><text class="sh" x="137" y="210" text-anchor="middle">1. Knowledge &amp; Theory</text><text class="cell" x="137" y="232" text-anchor="middle">Validity, reliability &amp; SLOs</text><text class="cell" x="137" y="250" text-anchor="middle">Formative &amp; summative tools</text><text class="small" x="137" y="270" text-anchor="middle">Diagnostic error analysis</text><line class="stroke" x1="310" y1="135" x2="190" y2="185" marker-end="url(#arrow)"/><rect class="panel-b" x="280" y="185" width="220" height="105" rx="8"/><text class="sh" x="390" y="210" text-anchor="middle">2. Dispositions &amp; Values</text><text class="cell" x="390" y="232" text-anchor="middle">Belief all students can learn</text><text class="cell" x="390" y="250" text-anchor="middle">Equity across diverse learners</text><text class="small" x="390" y="270" text-anchor="middle">Assessment as learning support</text><line class="stroke" x1="390" y1="135" x2="390" y2="185" marker-end="url(#arrow)"/><rect class="panel-c" x="535" y="185" width="215" height="105" rx="8"/><text class="sh" x="642" y="210" text-anchor="middle">3. Performance &amp; Skills</text><text class="cell" x="642" y="232" text-anchor="middle">Constructing rubrics &amp; tests</text><text class="cell" x="642" y="250" text-anchor="middle">Descriptive feedforward</text><text class="small" x="642" y="270" text-anchor="middle">Instructional modification</text><line class="stroke" x1="470" y1="135" x2="590" y2="185" marker-end="url(#arrow)"/><rect class="panel" x="70" y="340" width="640" height="80" rx="8"/><text class="sh" x="390" y="365" text-anchor="middle">Enacted Classroom Teaching Practices</text><text class="cell" x="390" y="385" text-anchor="middle">Transparent criteria shared with pupils; exit tickets and slate checks during lessons;</text><text class="cell" x="390" y="403" text-anchor="middle">private constructive feedback; confidential record keeping; student self-assessment portfolios</text><line class="stroke" x1="137" y1="290" x2="200" y2="340" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="290" x2="390" y2="340" marker-end="url(#arrow)"/><line class="stroke" x1="642" y1="290" x2="580" y2="340" marker-end="url(#arrow)"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">NPSTP Standard 5 framework and professional classroom enactment</text><text id="label-caption" class="small" x="24" y="455">Standard 5 integrates assessment knowledge, professional values, and daily classroom actions.</text><text class="wm" x="768" y="475" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>