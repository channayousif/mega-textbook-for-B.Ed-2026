<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram: continuous competency assessment vs terminal testing</title><desc id="d">Diagram comparing one competency assessed continuously through formative cycles versus assessed by a single terminal written examination.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-diagram"><rect class="panel" x="30" y="65" width="345" height="355" rx="10"/><text class="h" x="202" y="95" text-anchor="middle">Model A: Terminal Examination</text><text class="small" x="202" y="115" text-anchor="middle">Single-point high stakes judgment</text><line class="stroke" x1="50" y1="210" x2="350" y2="210" marker-end="url(#arrow)"/><text class="cell" x="50" y="195">Weeks 1 to 14: Unguided teaching</text><rect class="panel-c" x="250" y="235" width="105" height="80" rx="6"/><text class="sh" x="302" y="260" text-anchor="middle">Final Exam</text><text class="cell" x="302" y="280" text-anchor="middle">One attempt</text><text class="small" x="302" y="298" text-anchor="middle">Pass or Fail</text><rect class="panel-a" x="50" y="335" width="305" height="65" rx="6"/><text class="cell" x="60" y="357">Outcome: If ill or anxious on test day,</text><text class="cell" x="60" y="375">student fails. Feedback arrives after term</text><text class="cell" x="60" y="393">ends; zero opportunity for remediation.</text><rect class="panel" x="405" y="65" width="345" height="355" rx="10"/><text class="h" x="577" y="95" text-anchor="middle">Model B: Continuous Competency</text><text class="small" x="577" y="115" text-anchor="middle">Formative diagnostic cycles toward mastery</text><rect class="panel-b" x="425" y="135" width="90" height="60" rx="6"/><text class="sh" x="470" y="157" text-anchor="middle">Check 1</text><text class="small" x="470" y="175" text-anchor="middle">Draft &amp; slate</text><line class="stroke" x1="515" y1="165" x2="540" y2="165" marker-end="url(#arrow)"/><rect class="panel-a" x="540" y="135" width="90" height="60" rx="6"/><text class="sh" x="585" y="157" text-anchor="middle">Feedback</text><text class="small" x="585" y="175" text-anchor="middle">Feedforward</text><line class="stroke" x1="630" y1="165" x2="655" y2="165" marker-end="url(#arrow)"/><rect class="panel-b" x="655" y="135" width="85" height="60" rx="6"/><text class="sh" x="697" y="157" text-anchor="middle">Check 2</text><text class="small" x="697" y="175" text-anchor="middle">Revision</text><line class="stroke" x1="697" y1="195" x2="697" y2="235" marker-end="url(#arrow)"/><rect class="panel-a" x="530" y="235" width="200" height="75" rx="6"/><text class="sh" x="630" y="260" text-anchor="middle">Authentic Performance Task</text><text class="cell" x="630" y="280" text-anchor="middle">Demonstration against rubric</text><text class="small" x="630" y="298" text-anchor="middle">Criterion mastery verified</text><rect class="panel-b" x="425" y="335" width="305" height="65" rx="6"/><text class="cell" x="435" y="357">Outcome: Misconceptions caught early;</text><text class="cell" x="435" y="375">student guided to demonstrated mastery;</text><text class="cell" x="435" y="393">assessment supports rather than terminates.</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Assessing competence: terminal one-shot test versus continuous mastery cycles</text><text id="label-caption" class="small" x="24" y="445">Continuous competency models embed feedback loops that guide learners to verified mastery.</text><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>