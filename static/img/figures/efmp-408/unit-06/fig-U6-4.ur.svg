<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پاکستان میں معیاری امتحانی اور تشخیصی نظام کا ارتقا</title><desc id="d">ٹائم لائن خاکہ جو پاکستان میں صوبائی بورڈ امتحانات سے نیٹ، گیٹ، نیاس اور بین الاقوامی تشخیصی جائزوں تک کے تاریخی ارتقا کو ظاہر کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-timeline"><line class="stroke" x1="740" y1="230" x2="40" y2="230" marker-end="url(#arrow)"/><circle cx="670" cy="230" r="8" class="ah"/><line class="stroke" x1="670" y1="230" x2="670" y2="155"/><rect class="panel" x="590" y="70" width="160" height="85" rx="8"/><text class="sh" x="670" y="94" text-anchor="middle">1950 تا 1980 کی دہائی</text><text class="cell" x="670" y="116" text-anchor="middle">صوبائی امتحانی بورڈز (BISE)</text><text class="small" x="670" y="136" text-anchor="middle">میٹرک اور انٹر کا روایتی نظام</text><circle cx="500" cy="230" r="8" class="ah"/><line class="stroke" x1="500" y1="230" x2="500" y2="305"/><rect class="panel-a" x="415" y="305" width="170" height="85" rx="8"/><text class="sh" x="500" y="329" text-anchor="middle">2002 - 2003</text><text class="cell" x="500" y="351" text-anchor="middle">این ٹی ایس (NTS) اہلیتی آزمائش</text><text class="small" x="500" y="371" text-anchor="middle">نیٹ اور گیٹ کے آئٹم بینکس</text><circle cx="325" cy="230" r="8" class="ah"/><line class="stroke" x1="325" y1="230" x2="325" y2="155"/><rect class="panel-b" x="240" y="70" width="170" height="85" rx="8"/><text class="sh" x="325" y="94" text-anchor="middle">2005 - 2010</text><text class="cell" x="325" y="116" text-anchor="middle">نیاس (NEAS) تشخیصی دورانیے</text><text class="small" x="325" y="136" text-anchor="middle">کلاس 4 اور 8 کے قومی نمونے</text><circle cx="145" cy="230" r="8" class="ah"/><line class="stroke" x1="145" y1="230" x2="145" y2="305"/><rect class="panel-c" x="55" y="305" width="180" height="90" rx="8"/><text class="sh" x="145" y="329" text-anchor="middle">2019 - تا حال</text><text class="cell" x="145" y="351" text-anchor="middle">عالمی اور تدریسی لائسنسنگ</text><text class="small" x="145" y="371" text-anchor="middle">ٹمز (TIMSS) میں شمولیت اور</text><text class="small" x="145" y="387" text-anchor="middle">سندھ ٹیچنگ لائسنس کا نفاذ</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">پاکستان میں معیاری امتحانی اور تشخیصی نظام کا ارتقا</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">بورڈ امتحانات سے اہلیتی ٹیسٹنگ، قومی تشخیص اور تدریسی لائسنسنگ تک ارتقائی سفر۔</text><text class="wm" x="24" y="465" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
