<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم میں ادارہ جاتی تشخیصی ثقافتوں کا تقابل</title><desc id="d">جدول جس میں امتحان پر مبنی ثقافت اور تشخیص پر مبنی ثقافت کا بنیادی مقصد، استاد و طالب علم کے کردار، غلطیوں سے نمٹنے کے انداز اور پوشیدہ حقائق کے لحاظ سے موازنہ کیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="425" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="250" x2="756" y2="250"/><line class="frame" x1="24" y1="325" x2="756" y2="325"/><line class="frame" x1="24" y1="400" x2="756" y2="400"/><line class="frame" x1="625" y1="55" x2="625" y2="480"/><line class="frame" x1="335" y1="55" x2="335" y2="480"/><text class="h" x="744" y="83" text-anchor="end">پہلو / خصوصیت</text><text class="h" x="613" y="83" text-anchor="end">امتحان پر مبنی ثقافت</text><text class="h" x="323" y="83" text-anchor="end">تشخیص پر مبنی ثقافت</text><text class="sh" x="744" y="130" text-anchor="end">بنیادی مقصد</text><text class="cell" x="613" y="125" text-anchor="end">درجہ بندی اور چھانٹی کرنا؛</text><text class="cell" x="613" y="145" text-anchor="end">سیشن کے اختتام پر پاس اور فیل کو</text><text class="cell" x="613" y="165" text-anchor="end">ایک دوسرے سے الگ کرنا</text><text class="cell" x="323" y="125" text-anchor="end">تعلیمی خامیوں کی بروقت تشخیص؛</text><text class="cell" x="323" y="145" text-anchor="end">تدریس میں مسلسل رہنمائی، اور</text><text class="cell" x="323" y="165" text-anchor="end">تمام طلبہ کو اہلیت کے حصول میں مدد دینا</text><text class="sh" x="744" y="205" text-anchor="end">استاد کا کردار</text><text class="cell" x="613" y="200" text-anchor="end">امتحان کا غیر فعال نگران (متحن)؛</text><text class="cell" x="613" y="220" text-anchor="end">صحیح اور غلط جوابات پر</text><text class="cell" x="613" y="240" text-anchor="end">میکانیکی انداز میں نمبر لگانا</text><text class="cell" x="323" y="200" text-anchor="end">تشخیصی محقق اور سہولت کار؛</text><text class="cell" x="323" y="220" text-anchor="end">طلبہ کے مسلسل شواہد کی بنیاد پر</text><text class="cell" x="323" y="240" text-anchor="end">اپنی تدریسی حکمت عملی کو تبدیل کرنا</text><text class="sh" x="744" y="280" text-anchor="end">طالب علم کا کردار</text><text class="cell" x="613" y="275" text-anchor="end">نمبروں کا غیر فعال وصول کنندہ؛</text><text class="cell" x="613" y="295" text-anchor="end">امتحانی خوف اور کم پوزیشن کے</text><text class="cell" x="613" y="315" text-anchor="end">ڈر سے پڑھنے پر مجبور</text><text class="cell" x="323" y="275" text-anchor="end">سیکھنے کے عمل میں بااختیار شریک؛</text><text class="cell" x="323" y="295" text-anchor="end">خود تشخیصی، ہم عمر کی جانچ اور</text><text class="cell" x="323" y="315" text-anchor="end">اہداف کے تعین میں فعال کردار</text><text class="sh" x="744" y="355" text-anchor="end">غلطیوں کا برتاؤ</text><text class="cell" x="613" y="350" text-anchor="end">غلطی پر سزا اور تضحیک؛</text><text class="cell" x="613" y="370" text-anchor="end">اسے طالب علم کی سستی یا</text><text class="cell" x="613" y="390" text-anchor="end">ذہنی کمی کا ثبوت سمجھنا</text><text class="cell" x="323" y="350" text-anchor="end">طالب علم کی سوچ سمجھنے کا ذریعہ؛</text><text class="cell" x="323" y="370" text-anchor="end">غلطیوں کا خیر مقدم اور ان کی مدد سے</text><text class="cell" x="323" y="390" text-anchor="end">تدریسی رہنمائی اور فیڈ بیک فراہم کرنا</text><text class="sh" x="744" y="430" text-anchor="end">پوشیدہ حقائق</text><text class="cell" x="613" y="425" text-anchor="end">یہ حقیقت چھپاتا ہے کہ آیا طلبہ نے بنیادی</text><text class="cell" x="613" y="445" text-anchor="end">اہلیت حاصل کی؛ اسکول چھوڑنے کی</text><text class="cell" x="613" y="465" text-anchor="end">اصل وجوہات پر پردہ ڈالتا ہے</text><text class="cell" x="323" y="425" text-anchor="end">محض نمبروں کی سادہ درجہ بندی کو مسترد کرتا ہے؛</text><text class="cell" x="323" y="445" text-anchor="end">کثیر جہتی پورٹ فولیو تشخیص کے ذریعے</text><text class="cell" x="323" y="465" text-anchor="end">حقیقی تعلیمی ترقی کو نمایاں کرتا ہے</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">تعلیم میں ادارہ جاتی تشخیصی ثقافتوں کا تقابل</text><text id="label-caption" class="small" x="756" y="505" text-anchor="end">امتحانی ثقافت نمبروں سے طلبہ کی چھانٹی کرتی ہے؛ تشخیصی ثقافت شواہد سے طلبہ کو بااختیار بناتی ہے۔</text><text class="wm" x="24" y="525" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
