<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اساتذہ کے تیار کردہ اور معیاری ٹیسٹوں کا موازنہ</title><desc id="d">جدول جس میں اساتذہ کے تیار کردہ اور معیاری ٹیسٹوں کا بنیادی مقصد، سوالات کی تیاری، امتحانی شرائط، جانچ کے معیار، گروہی اصول اور نتائج کے دائرہ کار کے لحاظ سے موازنہ کیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="425" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="250" x2="756" y2="250"/><line class="frame" x1="24" y1="325" x2="756" y2="325"/><line class="frame" x1="24" y1="400" x2="756" y2="400"/><line class="frame" x1="620" y1="55" x2="620" y2="480"/><line class="frame" x1="330" y1="55" x2="330" y2="480"/><text class="h" x="744" y="83" text-anchor="end">پیمائشی پہلو</text><text class="h" x="608" y="83" text-anchor="end">اساتذہ کے تیار کردہ ٹیسٹ</text><text class="h" x="318" y="83" text-anchor="end">معیاری آزمائشیں (Standardized)</text><text class="sh" x="744" y="130" text-anchor="end">بنیادی مقصد</text><text class="cell" x="608" y="125" text-anchor="end">جماعتی تدریس کی تشخیص کرنا،</text><text class="cell" x="608" y="145" text-anchor="end">روزمرہ اسباق کی رہنمائی کرنا اور</text><text class="cell" x="608" y="165" text-anchor="end">یونٹ کے اختتامی نمبر لگانا</text><text class="cell" x="318" y="125" text-anchor="end">تعلیمی نظام کی مجموعی نگرانی،</text><text class="cell" x="318" y="145" text-anchor="end">اداروں کا باہمی تقابلی جائزہ، اور</text><text class="cell" x="318" y="165" text-anchor="end">اعلیٰ سطحی میرٹ پر مبنی انتخاب</text><text class="sh" x="744" y="205" text-anchor="end">سوالات کی تیاری</text><text class="cell" x="608" y="200" text-anchor="end">استاد خود تیار کرتا ہے؛</text><text class="cell" x="608" y="220" text-anchor="end">صرف متعلقہ کلاس روم تک محدود؛</text><text class="cell" x="608" y="240" text-anchor="end">شاذ و نادر ہی پائلٹ آزمائش ہوتی ہے</text><text class="cell" x="318" y="200" text-anchor="end">ماہرین کی ٹیمیں تیار کرتی ہیں؛</text><text class="cell" x="318" y="220" text-anchor="end">بڑے نمائندہ نمونوں پر پائلٹ آزمائش؛</text><text class="cell" x="318" y="240" text-anchor="end">سوالات کی دشواری کی شماریاتی پیمائش</text><text class="sh" x="744" y="280" text-anchor="end">امتحانی انعقاد</text><text class="cell" x="608" y="275" text-anchor="end">جماعتی وقت میں مناسب لچک؛</text><text class="cell" x="608" y="295" text-anchor="end">استاد زبانی طور پر سوالات</text><text class="cell" x="608" y="315" text-anchor="end">اور ہدایات کی وضاحت کر سکتا ہے</text><text class="cell" x="318" y="275" text-anchor="end">یکساں اور سخت امتحانی ضوابط،</text><text class="cell" x="318" y="295" text-anchor="end">مقررہ وقت کی سخت پابندی، اور</text><text class="cell" x="318" y="315" text-anchor="end">معیاری بیرونی نگرانی کا طریقہ کار</text><text class="sh" x="744" y="355" text-anchor="end">معیار اور اسکورنگ</text><text class="cell" x="608" y="350" text-anchor="end">استاد کے معیارِ جانچ کے مطابق؛</text><text class="cell" x="608" y="370" text-anchor="end">کوئی بیرونی گروہی حوالہ یا</text><text class="cell" x="608" y="390" text-anchor="end">پیمائشی اسکیلنگ نہیں ہوتی</text><text class="cell" x="318" y="350" text-anchor="end">معروضی جوابی کلید پر جانچ؛</text><text class="cell" x="318" y="370" text-anchor="end">نمائندہ گروہی معیارات سے حاصل کردہ</text><text class="cell" x="318" y="390" text-anchor="end">اسٹینڈرڈائزڈ پیمائشی اسکور</text><text class="sh" x="744" y="430" text-anchor="end">نتائج کا دائرہ</text><text class="cell" x="608" y="425" text-anchor="end">مقامی نصاب کے لیے معتبر؛</text><text class="cell" x="608" y="445" text-anchor="end">مختلف اسکولوں کے درمیان طلبہ کی</text><text class="cell" x="608" y="465" text-anchor="end">صلاحیت کے موازنے کے لیے غیر موزوں</text><text class="cell" x="318" y="425" text-anchor="end">وسیع طبقات کے تقابل کے لیے معتبر؛</text><text class="cell" x="318" y="445" text-anchor="end">طالب علم کی روزمرہ انفرادی</text><text class="cell" x="318" y="465" text-anchor="end">تدریسی خامیوں کی تشخیص سے قاصر</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">اساتذہ کے تیار کردہ اور معیاری ٹیسٹوں کا موازنہ</text><text id="label-caption" class="small" x="756" y="505" text-anchor="end">اساتذہ کے ٹیسٹ تدریس کی رہنمائی کرتے ہیں؛ معیاری آزمائشیں نظام کے معیارات جانچتی ہیں۔</text><text class="wm" x="24" y="525" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
