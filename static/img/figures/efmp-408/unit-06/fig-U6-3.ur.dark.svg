<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کم وسائل والے اسکولوں میں ڈیجیٹل تشخیصی آلات کا استعمال</title><desc id="d">جدول جس میں سافٹ ویئر کے زمرے، تعلیمی فوائد، تکنیکی حدود اور کمزور انٹرنیٹ والے پاکستانی کلاس رومز کے لیے عملی متبادل حل کا تقابل کیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="375" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="205" x2="756" y2="205"/><line class="frame" x1="24" y1="315" x2="756" y2="315"/><line class="frame" x1="610" y1="55" x2="610" y2="430"/><line class="frame" x1="335" y1="55" x2="335" y2="430"/><text class="h" x="744" y="83" text-anchor="end">آلات کی قسم</text><text class="h" x="598" y="83" text-anchor="end">تعلیمی فوائد و خصوصیات</text><text class="h" x="323" y="83" text-anchor="end">کم وسائل والے اسکولوں کے متبادل حل</text><text class="sh" x="744" y="130" text-anchor="end">1. تشکیلی پولنگ</text><text class="sh" x="744" y="150" text-anchor="end">ایپس</text><text class="small" x="744" y="170" text-anchor="end">(Kahoot، پولز)</text><text class="cell" x="598" y="125" text-anchor="end">فوری تشخیصی تاثرات (فیڈ بیک)؛</text><text class="cell" x="598" y="145" text-anchor="end">تمام طلبہ کی بیک وقت فعال شرکت؛</text><text class="cell" x="598" y="165" text-anchor="end">تدریس کے دوران طلبہ کی سوچ</text><text class="cell" x="598" y="185" text-anchor="end">اور فہم کو واضح بنانا</text><text class="cell" x="323" y="125" text-anchor="end">کاغذی پلکرز (Plickers) کارڈز جہاں استاد</text><text class="cell" x="323" y="145" text-anchor="end">ایک ہی فون سے تمام کارڈ اسکین کر لے؛</text><text class="cell" x="323" y="165" text-anchor="end">یا بجلی اور انٹرنیٹ کے بغیر چھوٹی تختیاں</text><text class="cell" x="323" y="185" text-anchor="end">جنہیں تمام طلبہ ایک ساتھ اٹھا کر جواب دیں</text><text class="sh" x="744" y="240" text-anchor="end">2. تعلیمی لاگز و</text><text class="sh" x="744" y="260" text-anchor="end">ای پورٹ فولیو</text><text class="small" x="744" y="280" text-anchor="end">(Padlet، ڈرائیو)</text><text class="cell" x="598" y="235" text-anchor="end">طالب علم کی تدریسی ترقی کی دستاویز؛</text><text class="cell" x="598" y="255" text-anchor="end">بہترین کام کے نمونے محفوظ کرنا؛</text><text class="cell" x="598" y="275" text-anchor="end">خود تشخیصی اور تاملی اہداف کے</text><text class="cell" x="598" y="295" text-anchor="end">تعین میں طلبہ کی مدد کرنا</text><text class="cell" x="323" y="235" text-anchor="end">گھر کے فونز پر واٹس ایپ کے ذریعے غیر ہم وقت کام؛</text><text class="cell" x="323" y="255" text-anchor="end">یا کلاس روم میں طلبہ کے سادہ فزیکل فولڈرز</text><text class="cell" x="323" y="275" text-anchor="end">جن کی استاد وقتاً فوقتاً اپنے موبائل سے</text><text class="cell" x="323" y="295" text-anchor="end">تصاویر لے کر ریکارڈ میں محفوظ رکھے</text><text class="sh" x="744" y="344" text-anchor="end">3. آن لائن</text><text class="sh" x="744" y="362" text-anchor="end">سی بی ٹی</text><text class="sh" x="744" y="380" text-anchor="end">پلیٹ فارمز</text><text class="small" x="744" y="398" text-anchor="end">(LMS، پورٹلز)</text><text class="cell" x="598" y="345" text-anchor="end">خودکار معروضی اسکورنگ اور فوری نتائج؛</text><text class="cell" x="598" y="365" text-anchor="end">بے ترتیب سوالات کی خودکار تیاری؛</text><text class="cell" x="598" y="385" text-anchor="end">کمپیوٹر اڈاپٹیو ٹیسٹنگ (CAT) سے</text><text class="cell" x="598" y="405" text-anchor="end">ہر طالب علم کی سطح کی درست پیمائش</text><text class="cell" x="323" y="345" text-anchor="end">مقامی آف لائن انٹرانیٹ سرورز (Kolibri وغیرہ)</text><text class="cell" x="323" y="365" text-anchor="end">جو انٹرنیٹ کے بغیر لوکل وائی فائی پر چلتے ہیں؛</text><text class="cell" x="323" y="385" text-anchor="end">انٹرنیٹ کنکشن دستیاب ہونے پر تمام ریکارڈ</text><text class="cell" x="323" y="405" text-anchor="end">خودکار طریقے سے مرکزی ڈیٹا بیس سے سنک ہو جائے</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">محدود وسائل والے اسکولوں میں ڈیجیٹل تشخیصی آلات کا استعمال</text><text id="label-caption" class="small" x="756" y="455" text-anchor="end">مناسب تدریسی منصوبہ بندی سے کمزور انٹرنیٹ والے اسکولوں میں بھی تشکیلی فوائد حاصل ہوتے ہیں۔</text><text class="wm" x="24" y="475" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
