<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Digital assessment tools in low-bandwidth classrooms</title><desc id="d">Table comparing digital assessment tools across software category, educational strengths, technical limitations, and practical workarounds for low-bandwidth Pakistani classrooms.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="375" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="205" x2="756" y2="205"/><line class="frame" x1="24" y1="315" x2="756" y2="315"/><line class="frame" x1="170" y1="55" x2="170" y2="430"/><line class="frame" x1="445" y1="55" x2="445" y2="430"/><text class="h" x="35" y="83">Tool Category</text><text class="h" x="185" y="83">Educational Strengths</text><text class="h" x="460" y="83">Low-Bandwidth Workarounds</text><text class="sh" x="35" y="125">1. Formative</text><text class="sh" x="35" y="145">Polling Apps</text><text class="small" x="35" y="165">(Kahoot, Polls)</text><text class="cell" x="185" y="125">Instant diagnostic feedback;</text><text class="cell" x="185" y="145">engages all pupils at once;</text><text class="cell" x="185" y="165">makes thinking visible</text><text class="cell" x="185" y="185">during active teaching</text><text class="cell" x="460" y="125">Use paper Plickers cards where</text><text class="cell" x="460" y="145">teacher scans with one phone;</text><text class="cell" x="460" y="165">or mini-slates held up by</text><text class="cell" x="460" y="185">all pupils with no electricity</text><text class="sh" x="35" y="235">2. Learning Logs</text><text class="sh" x="35" y="255">&amp; E-Portfolios</text><text class="small" x="35" y="275">(Padlet, Drive)</text><text class="cell" x="185" y="235">Documents student growth;</text><text class="cell" x="185" y="255">curates work artifacts;</text><text class="cell" x="185" y="275">supports self-assessment</text><text class="cell" x="185" y="295">and reflective goals</text><text class="cell" x="460" y="235">Asynchronous work via family</text><text class="cell" x="460" y="255">phones on WhatsApp; or simple</text><text class="cell" x="460" y="275">classroom physical folders with</text><text class="cell" x="460" y="295">periodic teacher photo logs</text><text class="sh" x="35" y="345">3. Online CBT</text><text class="sh" x="35" y="365">Platforms</text><text class="small" x="35" y="385">(LMS, Portals)</text><text class="cell" x="185" y="345">Automated objective scoring;</text><text class="cell" x="185" y="365">randomized test generation;</text><text class="cell" x="185" y="385">dynamic computer-adaptive</text><text class="cell" x="185" y="405">precision testing (CAT)</text><text class="cell" x="460" y="345">Install local offline intranet</text><text class="cell" x="460" y="365">servers (Kolibri, offline LMS)</text><text class="cell" x="460" y="385">that run without internet; sync</text><text class="cell" x="460" y="405">records when connection returns</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Navigating digital assessment tools in resource-constrained schools</text><text id="label-caption" class="small" x="24" y="455">Appropriate pedagogical design allows formative digital benefits even in low-connectivity schools.</text><text class="wm" x="768" y="475" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>