<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of teacher-made and standardized tests</title><desc id="d">Table comparing teacher-made tests and standardized tests across primary purpose, item development, administration conditions, scoring criteria, norming, and allowable claims.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="425" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="250" x2="756" y2="250"/><line class="frame" x1="24" y1="325" x2="756" y2="325"/><line class="frame" x1="24" y1="400" x2="756" y2="400"/><line class="frame" x1="160" y1="55" x2="160" y2="480"/><line class="frame" x1="450" y1="55" x2="450" y2="480"/><text class="h" x="35" y="83">Dimension</text><text class="h" x="175" y="83">Teacher-Made Tests</text><text class="h" x="465" y="83">Standardized Tests</text><text class="sh" x="35" y="125">Primary</text><text class="sh" x="35" y="145">Purpose</text><text class="cell" x="175" y="125">Diagnose classroom learning,</text><text class="cell" x="175" y="145">guide daily lessons, and</text><text class="cell" x="175" y="165">assign course unit marks</text><text class="cell" x="465" y="125">Systemic monitoring,</text><text class="cell" x="465" y="145">institutional comparison,</text><text class="cell" x="465" y="165">and high-stakes selection</text><text class="sh" x="35" y="200">Item</text><text class="sh" x="35" y="220">Development</text><text class="cell" x="175" y="200">Authored by classroom</text><text class="cell" x="175" y="220">teacher for one class;</text><text class="cell" x="175" y="240">rarely piloted or normed</text><text class="cell" x="465" y="200">Developed by expert teams;</text><text class="cell" x="465" y="220">piloted on large samples;</text><text class="cell" x="465" y="240">item difficulty calibrated</text><text class="sh" x="35" y="275">Test</text><text class="sh" x="35" y="295">Administration</text><text class="cell" x="175" y="275">Flexible classroom timing;</text><text class="cell" x="175" y="295">teacher can explain</text><text class="cell" x="175" y="315">instructions orally</text><text class="cell" x="465" y="275">Strict uniform protocols,</text><text class="cell" x="465" y="295">fixed time limits, and</text><text class="cell" x="465" y="315">standard invigilation</text><text class="sh" x="35" y="350">Norming &amp;</text><text class="sh" x="35" y="370">Scoring</text><text class="cell" x="175" y="350">Scored by teacher rubric;</text><text class="cell" x="175" y="370">no external normative</text><text class="cell" x="175" y="390">reference sample</text><text class="cell" x="465" y="350">Objective scoring keys;</text><text class="cell" x="465" y="370">scaled scores derived from</text><text class="cell" x="465" y="390">representative norms</text><text class="sh" x="35" y="425">Allowable</text><text class="sh" x="35" y="445">Claims</text><text class="cell" x="175" y="425">Valid for local syllabus;</text><text class="cell" x="175" y="445">cannot be equated</text><text class="cell" x="175" y="465">across diverse schools</text><text class="cell" x="465" y="425">Valid across broad cohorts;</text><text class="cell" x="465" y="445">cannot diagnose daily</text><text class="cell" x="465" y="465">individual lesson gaps</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Comparison of teacher-made and standardized assessments</text><text id="label-caption" class="small" x="24" y="505">Teacher-made tests guide classroom instruction; standardized tests evaluate systemic standards.</text><text class="wm" x="768" y="525" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>