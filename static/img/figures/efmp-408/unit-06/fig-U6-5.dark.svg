<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Academic integrity breaches and proportionate responses</title><desc id="d">Table classifying academic integrity breaches into minor developmental infractions, serious deliberate dishonesty, and systemic institutional malpractice alongside proportionate pedagogical and administrative responses.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="375" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="205" x2="756" y2="205"/><line class="frame" x1="24" y1="315" x2="756" y2="315"/><line class="frame" x1="150" y1="55" x2="150" y2="430"/><line class="frame" x1="435" y1="55" x2="435" y2="430"/><text class="h" x="35" y="83">Breach Level</text><text class="h" x="165" y="83">Classroom Manifestations</text><text class="h" x="450" y="83">Proportionate Response</text><text class="sh" x="35" y="125">1. Minor</text><text class="sh" x="35" y="145">Developmental</text><text class="sh" x="35" y="165">Infraction</text><text class="cell" x="165" y="125">Unintentional citation slip;</text><text class="cell" x="165" y="145">copying one homework task;</text><text class="cell" x="165" y="165">whispered question during</text><text class="cell" x="165" y="185">an informal classroom quiz</text><text class="cell" x="450" y="125">Re-teach citation conventions;</text><text class="cell" x="450" y="145">require revised work for credit;</text><text class="cell" x="450" y="165">private developmental feedback</text><text class="cell" x="450" y="185">without permanent penalty mark</text><text class="sh" x="35" y="235">2. Serious</text><text class="sh" x="35" y="255">Deliberate</text><text class="sh" x="35" y="275">Dishonesty</text><text class="cell" x="165" y="235">Bringing prepared cheat slips;</text><text class="cell" x="165" y="255">copying another pupil's paper;</text><text class="cell" x="165" y="275">submitting purchased essays</text><text class="cell" x="165" y="295">from a tuition academy</text><text class="cell" x="450" y="235">Zero marks on the examination;</text><text class="cell" x="450" y="255">private parent conference;</text><text class="cell" x="450" y="275">mandatory academic honesty</text><text class="cell" x="450" y="295">module and proctored re-test</text><text class="sh" x="35" y="345">3. Systemic</text><text class="sh" x="35" y="365">Institutional</text><text class="sh" x="35" y="385">Malpractice</text><text class="cell" x="165" y="345">Exam leaks by school staff;</text><text class="cell" x="165" y="365">impersonation of candidates;</text><text class="cell" x="165" y="385">altering marks registers for</text><text class="cell" x="165" y="405">social or financial bribery</text><text class="cell" x="450" y="345">Cancellation of exam results;</text><text class="cell" x="450" y="365">disciplinary and legal action</text><text class="cell" x="450" y="385">against corrupt personnel;</text><text class="cell" x="450" y="405">formal audit of test centre</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Proportionate pedagogical and administrative responses to assessment dishonesty</text><text id="label-caption" class="small" x="24" y="455">Ethical responses balance firm institutional integrity with developmental learning justice.</text><text class="wm" x="768" y="475" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>