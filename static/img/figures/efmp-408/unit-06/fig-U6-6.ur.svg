<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اہلیت کی جانچ: اختتامی امتحان بمقابلہ مسلسل تدریسی چکر</title><desc id="d">خاکہ جو کسی قابلیت کو ایک ہی اختتامی تحریری امتحان کے ذریعے جانچنے کے مقابلے میں تشکیلی چکروں کے ذریعے مسلسل جانچنے کا موازنہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-diagram"><rect class="panel" x="405" y="65" width="345" height="355" rx="10"/><text class="h" x="577" y="95" text-anchor="middle">ماڈل الف: اختتامی (ٹرمینل) امتحان</text><text class="small" x="577" y="115" text-anchor="middle">صرف ایک موقع پر اعلیٰ اثرات کا قدری فیصلہ</text><line class="stroke" x1="730" y1="210" x2="425" y2="210" marker-end="url(#arrow)"/><text class="cell" x="730" y="195" text-anchor="end">ہفتہ 1 تا 14: بغیر رہنمائی یک طرفہ تدریس</text><rect class="panel-c" x="425" y="235" width="115" height="80" rx="6"/><text class="sh" x="482" y="260" text-anchor="middle">سالانہ امتحان</text><text class="cell" x="482" y="280" text-anchor="middle">صرف ایک کوشش</text><text class="small" x="482" y="298" text-anchor="middle">پاس یا فیل</text><rect class="panel-a" x="425" y="335" width="305" height="65" rx="6"/><text class="cell" x="720" y="357" text-anchor="end">نتیجہ: امتحان کے دن بیماری یا گھبراہٹ پر طالب علم فیل۔</text><text class="cell" x="720" y="375" text-anchor="end">فیڈ بیک سیشن ختم ہونے کے بعد آتا ہے؛</text><text class="cell" x="720" y="393" text-anchor="end">تدریسی خامیوں کی اصلاح کا کوئی موقع نہیں۔</text><rect class="panel" x="30" y="65" width="345" height="355" rx="10"/><text class="h" x="202" y="95" text-anchor="middle">ماڈل ب: مسلسل اہلیت پر مبنی تشخیص</text><text class="small" x="202" y="115" text-anchor="middle">مہارت کے حصول کے لیے تشخیصی و تدریسی چکر</text><rect class="panel-b" x="275" y="135" width="90" height="60" rx="6"/><text class="sh" x="320" y="157" text-anchor="middle">جانچ 1</text><text class="small" x="320" y="175" text-anchor="middle">ڈرافٹ و تختی</text><line class="stroke" x1="275" y1="165" x2="245" y2="165" marker-end="url(#arrow)"/><rect class="panel-a" x="155" y="135" width="90" height="60" rx="6"/><text class="sh" x="200" y="157" text-anchor="middle">فیڈ بیک</text><text class="small" x="200" y="175" text-anchor="middle">اصلاحی رہنمائی</text><line class="stroke" x1="155" y1="165" x2="125" y2="165" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="135" width="85" height="60" rx="6"/><text class="sh" x="82" y="157" text-anchor="middle">جانچ 2</text><text class="small" x="82" y="175" text-anchor="middle">نظر ثانی</text><line class="stroke" x1="82" y1="195" x2="82" y2="235" marker-end="url(#arrow)"/><rect class="panel-a" x="50" y="235" width="200" height="75" rx="6"/><text class="sh" x="150" y="260" text-anchor="middle">مستند عملی کارکردگی کی جانچ</text><text class="cell" x="150" y="280" text-anchor="middle">معیارِ جانچ پر عملی مظاہرہ</text><text class="small" x="150" y="298" text-anchor="middle">طے شدہ اہلیت کی توثیق</text><rect class="panel-b" x="50" y="335" width="305" height="65" rx="6"/><text class="cell" x="345" y="357" text-anchor="end">نتیجہ: فہم کی غلطیاں بروقت دور ہو جاتی ہیں؛</text><text class="cell" x="345" y="375" text-anchor="end">طالب علم کو مہارت کی تصدیق تک رہنمائی ملتی ہے؛</text><text class="cell" x="345" y="393" text-anchor="end">تشخیص ناکام کرنے کے بجائے سیکھنے میں مدد دیتی ہے۔</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">اہلیت کی جانچ: یک وقتی اختتامی امتحان بمقابلہ مسلسل تدریسی چکر</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">مسلسل اہلیت کے ماڈلز فیڈ بیک لوپس فراہم کرتے ہیں جو طلبہ کو حقیقی مہارت تک پہنچاتے ہیں۔</text><text class="wm" x="24" y="465" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
