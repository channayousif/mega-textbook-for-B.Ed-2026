<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">60 طلبہ کی جماعت کے لیے پانچ تشخیصی اختیارات کا تقابلی جدول</title><desc id="d">جدول جس میں 60 طلبہ کی جماعت کے لیے پانچ تشخیصی اختیارات کا وقت، چیکنگ کے بوجھ، لاگت اور سامان کے لحاظ سے موازنہ کیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect class="panel" x="20" y="40" width="740" height="56" rx="6"/><rect class="panel-a" x="20" y="96" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="160" width="740" height="64" rx="6"/><rect class="panel-c" x="20" y="224" width="740" height="64" rx="6"/><rect class="panel-a" x="20" y="288" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="352" width="740" height="64" rx="6"/></g><g id="layer-grid"><line class="grid" x1="20" y1="96" x2="760" y2="96"/><line class="grid" x1="20" y1="160" x2="760" y2="160"/><line class="grid" x1="20" y1="224" x2="760" y2="224"/><line class="grid" x1="20" y1="288" x2="760" y2="288"/><line class="grid" x1="20" y1="352" x2="760" y2="352"/><line class="grid" x1="20" y1="416" x2="760" y2="416"/><line class="grid" x1="550" y1="40" x2="550" y2="416"/><line class="grid" x1="410" y1="40" x2="410" y2="416"/><line class="grid" x1="250" y1="40" x2="250" y2="416"/></g><g id="layer-nodes"><text class="h" x="748" y="74" text-anchor="end">‏تشخیصی انتخاب‏</text><text class="h" x="538" y="74" text-anchor="end">‏درکار وقت‏</text><text class="h" x="398" y="74" text-anchor="end">‏جانچ کا بوجھ‏</text><text class="h" x="238" y="74" text-anchor="end">‏لاگت اور سامان‏</text><text class="sh" x="748" y="134" text-anchor="end">‏40 انشائی سوالات‏</text><text class="cell" x="538" y="134" text-anchor="end">‏3 گھنٹے‏</text><text class="cell" x="398" y="126" text-anchor="end">‏بہت زیادہ: چیکنگ‏</text><text class="cell" x="398" y="146" text-anchor="end">‏میں کئی دن‏</text><text class="cell" x="238" y="134" text-anchor="end">‏کم: کاغذ اور چھپائی‏</text><text class="sh" x="748" y="198" text-anchor="end">‏40 کثیر الانتخابی سوالات‏</text><text class="cell" x="538" y="198" text-anchor="end">‏2 گھنٹے‏</text><text class="cell" x="398" y="198" text-anchor="end">‏کم: جوابی کلید سے‏</text><text class="cell" x="238" y="198" text-anchor="end">‏کم: کاغذ اور چھپائی‏</text><text class="sh" x="748" y="262" text-anchor="end">‏انفرادی زبانی ٹیسٹ‏</text><text class="cell" x="538" y="262" text-anchor="end">‏4 تدریسی دن‏</text><text class="cell" x="398" y="254" text-anchor="end">‏زیادہ: بیک وقت ایک‏</text><text class="cell" x="398" y="274" text-anchor="end">‏طالب علم‏</text><text class="cell" x="238" y="262" text-anchor="end">‏بہت کم: کاغذ نہیں‏</text><text class="sh" x="748" y="326" text-anchor="end">‏گروہی پروجیکٹ‏</text><text class="cell" x="538" y="326" text-anchor="end">‏2 ہفتے اسباق‏</text><text class="cell" x="398" y="318" text-anchor="end">‏معتدل: فی گروپ‏</text><text class="cell" x="398" y="338" text-anchor="end">‏چیک لسٹ‏</text><text class="cell" x="238" y="326" text-anchor="end">‏کم: مقامی سامان‏</text><text class="sh" x="748" y="390" text-anchor="end">‏مختصر ہفتہ وار کوئز‏</text><text class="cell" x="538" y="390" text-anchor="end">‏15 منٹ‏</text><text class="cell" x="398" y="390" text-anchor="end">‏کم: ایک پیریڈ‏</text><text class="cell" x="238" y="390" text-anchor="end">‏بہت کم‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="26" text-anchor="end">‏ایک استاد اور 60 طلبہ کے لیے عملی ترجیحات کا توازن‏</text><text id="label-caption" class="small" x="760" y="446" text-anchor="end">‏تفصیلی پرچہ اس وقت عملی نہیں رہتا جب اسکول اسے منعقد اور چیک نہ کر سکے۔‏</text><text class="wm" x="20" y="462" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
