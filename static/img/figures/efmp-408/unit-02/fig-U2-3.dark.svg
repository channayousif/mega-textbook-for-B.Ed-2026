<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing five assessment choices for a 60-pupil classroom</title><desc id="d">Table comparing five assessment choices for a 60-pupil classroom by time, marking load, cost and materials.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-regions"><rect class="panel" x="20" y="40" width="740" height="56" rx="6"/><rect class="panel-a" x="20" y="96" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="160" width="740" height="64" rx="6"/><rect class="panel-c" x="20" y="224" width="740" height="64" rx="6"/><rect class="panel-a" x="20" y="288" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="352" width="740" height="64" rx="6"/></g><g id="layer-grid"><line class="grid" x1="20" y1="96" x2="760" y2="96"/><line class="grid" x1="20" y1="160" x2="760" y2="160"/><line class="grid" x1="20" y1="224" x2="760" y2="224"/><line class="grid" x1="20" y1="288" x2="760" y2="288"/><line class="grid" x1="20" y1="352" x2="760" y2="352"/><line class="grid" x1="20" y1="416" x2="760" y2="416"/><line class="grid" x1="230" y1="40" x2="230" y2="416"/><line class="grid" x1="370" y1="40" x2="370" y2="416"/><line class="grid" x1="530" y1="40" x2="530" y2="416"/></g><g id="layer-nodes"><text class="h" x="36" y="74">Assessment choice</text><text class="h" x="246" y="74">Time needed</text><text class="h" x="386" y="74">Marking load</text><text class="h" x="546" y="74">Cost and materials</text><text class="sh" x="36" y="134">40 essay items</text><text class="cell" x="246" y="134">3 hours</text><text class="cell" x="386" y="126">very high: days</text><text class="cell" x="386" y="146">to mark</text><text class="cell" x="546" y="134">low: paper and printing</text><text class="sh" x="36" y="198">40 multiple-choice items</text><text class="cell" x="246" y="198">2 hours</text><text class="cell" x="386" y="198">low: mark with a key</text><text class="cell" x="546" y="198">low: paper and printing</text><text class="sh" x="36" y="262">individual oral test</text><text class="cell" x="246" y="262">4 school days</text><text class="cell" x="386" y="254">high: one pupil</text><text class="cell" x="386" y="274">at a time</text><text class="cell" x="546" y="262">very low: no paper</text><text class="sh" x="36" y="326">group project</text><text class="cell" x="246" y="326">2 weeks of lessons</text><text class="cell" x="386" y="318">moderate: checklist</text><text class="cell" x="386" y="338">per group</text><text class="cell" x="546" y="326">low: local materials</text><text class="sh" x="36" y="390">short weekly quiz</text><text class="cell" x="246" y="390">15 minutes</text><text class="cell" x="386" y="390">low: one period</text><text class="cell" x="546" y="390">very low</text></g><g id="layer-labels"><text id="label-title" class="h" x="20" y="26">Practicality trade-offs for one teacher and 60 pupils</text><text id="label-caption" class="small" x="20" y="446">A thorough paper is not a practical one if the school cannot administer and mark it.</text><text class="wm" x="768" y="462" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
