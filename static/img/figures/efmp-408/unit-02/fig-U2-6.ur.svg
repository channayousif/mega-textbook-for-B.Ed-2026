<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ریاضی کا ایک ہی سوال جو متعصبانہ اور منصفانہ سیاق میں دکھایا گیا ہے</title><desc id="d">ریاضی کا ایک ہی سوال دو بار دکھایا گیا ہے: ایک غیر مانوس غیر ملکی سیاق میں اور دوسرا مانوس مقامی مارکیٹ کے سیاق میں، جو یہ ظاہر کرتا ہے کہ سیاق و سباق کس طرح تعصب پیدا کر سکتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="420"/><g id="layer-regions"><rect class="panel" x="400" y="60" width="360" height="280" rx="8"/><rect class="panel" x="20" y="60" width="360" height="280" rx="8"/><rect class="panel-c" x="420" y="80" width="320" height="180" rx="6"/><rect class="panel-a" x="40" y="80" width="320" height="180" rx="6"/></g><g id="layer-nodes"><text class="sh" x="580" y="46" text-anchor="middle">‏متعصبانہ سوال‏</text><text class="sh" x="200" y="46" text-anchor="middle">‏منصفانہ سوال‏</text><text class="small" x="720" y="108" text-anchor="end">‏عبارت والا سوال:‏</text><text class="cell" x="720" y="136" text-anchor="end">‏ایک اسکی ریزورٹ دسمبر میں 40‏</text><text class="cell" x="720" y="158" text-anchor="end">‏اور جنوری میں 60 ٹکٹیں فروخت کرتا ہے۔‏</text><text class="cell" x="720" y="180" text-anchor="end">‏فروخت میں کتنے فیصد‏</text><text class="cell" x="720" y="202" text-anchor="end">‏اضافہ ہوا؟‏</text><text class="cell" x="580" y="244" text-anchor="middle" direction="ltr">(60 - 40) / 40 × 100 = 50%</text><text class="small" x="340" y="108" text-anchor="end">‏عبارت والا سوال:‏</text><text class="cell" x="340" y="136" text-anchor="end">‏سانگھڑ میں پھل فروش پیر کو 40 کلو‏</text><text class="cell" x="340" y="158" text-anchor="end">‏اور منگل کو 60 کلو سیب فروخت کرتا ہے۔‏</text><text class="cell" x="340" y="180" text-anchor="end">‏فروخت میں کتنے فیصد‏</text><text class="cell" x="340" y="202" text-anchor="end">‏اضافہ ہوا؟‏</text><text class="cell" x="200" y="244" text-anchor="middle" direction="ltr">(60 - 40) / 40 × 100 = 50%</text><text class="cell" x="580" y="372" text-anchor="middle">‏برف باری اور اسکی ریزورٹس سے واقفیت فرض کرتا ہے‏</text><text class="cell" x="200" y="372" text-anchor="middle">‏ایک مانوس مقامی مارکیٹ کا استعمال کرتا ہے‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="26" text-anchor="end">‏ایک ہی ریاضی، مختلف سیاق و سباق‏</text><text id="label-caption" class="small" x="760" y="402" text-anchor="end">‏ایسا سیاق جس سے جماعت ناواقف ہو، ریاضی کے سوال کو تفہیم کا امتحان بنا سکتا ہے۔‏</text><text class="wm" x="20" y="412" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
