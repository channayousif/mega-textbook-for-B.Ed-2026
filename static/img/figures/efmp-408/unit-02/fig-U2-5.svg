<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of the three validity types and the evidence each needs</title><desc id="d">Concept map linking validity of score inferences to content, construct and criterion validity, with the evidence each type needs.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect class="panel-a" x="240" y="50" width="300" height="90" rx="8"/><rect class="panel-c" x="40" y="330" width="300" height="90" rx="8"/><rect class="panel-d" x="440" y="330" width="300" height="90" rx="8"/><ellipse class="panel-b" cx="390" cy="250" rx="190" ry="74"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="140" x2="390" y2="176" marker-end="url(#arrow)"/><line class="stroke" x1="340" y1="375" x2="214" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="440" y1="375" x2="566" y2="288" marker-end="url(#arrow)"/></g><g id="layer-nodes"><text class="sh" x="390" y="82" text-anchor="middle">Content validity</text><text class="cell" x="390" y="104" text-anchor="middle">table of specifications and</text><text class="cell" x="390" y="124" text-anchor="middle">teacher judgement of coverage</text><text class="sh" x="190" y="362" text-anchor="middle">Construct validity</text><text class="cell" x="190" y="384" text-anchor="middle">items measure the intended</text><text class="cell" x="190" y="404" text-anchor="middle">skill or trait</text><text class="sh" x="590" y="362" text-anchor="middle">Criterion validity</text><text class="cell" x="590" y="384" text-anchor="middle">comparison with an external</text><text class="cell" x="590" y="404" text-anchor="middle">criterion or later performance</text><text class="body" x="390" y="244" text-anchor="middle">Validity of the inference</text><text class="body" x="390" y="266" text-anchor="middle">from test scores</text></g><g id="layer-labels"><text id="label-title" class="h" x="20" y="26">What makes a score inference valid?</text><text id="label-caption" class="small" x="20" y="444">Each type of validity rests on different evidence, so a teacher</text><text class="small" x="20" y="462">must ask what evidence supports the intended use.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
