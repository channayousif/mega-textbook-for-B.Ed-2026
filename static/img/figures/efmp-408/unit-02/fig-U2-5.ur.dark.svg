<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">صداقت کی تینوں اقسام اور درکار شواہد کا تصوراتی خاکہ</title><desc id="d">تصوراتی خاکہ جو ٹیسٹ کے اسکورز سے اخذ کردہ نتائج کی صداقت کو مواد، مفہوم اور کسوٹی کی صداقت سے جوڑتا ہے، اور ہر قسم کے لیے درکار شواہد کو واضح کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-regions"><rect class="panel-a" x="240" y="50" width="300" height="90" rx="8"/><rect class="panel-c" x="440" y="330" width="300" height="90" rx="8"/><rect class="panel-d" x="40" y="330" width="300" height="90" rx="8"/><ellipse class="panel-b" cx="390" cy="250" rx="190" ry="74"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="140" x2="390" y2="176" marker-end="url(#arrow)"/><line class="stroke" x1="566" y1="330" x2="440" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="214" y1="330" x2="340" y2="288" marker-end="url(#arrow)"/></g><g id="layer-nodes"><text class="sh" x="390" y="82" text-anchor="middle">‏مواد کی صداقت (Content validity)‏</text><text class="cell" x="390" y="104" text-anchor="middle">‏جدولِ تخصیص اور پڑھائے گئے مواد کے‏</text><text class="cell" x="390" y="124" text-anchor="middle">‏احاطے کے بارے میں استاد کی رائے‏</text><text class="sh" x="590" y="362" text-anchor="middle">‏مفہومی صداقت (Construct validity)‏</text><text class="cell" x="590" y="384" text-anchor="middle">‏سوالات مطلوبہ ذہنی مہارت یا‏</text><text class="cell" x="590" y="404" text-anchor="middle">‏تصوراتی صفت کی پیمائش کرتے ہیں‏</text><text class="sh" x="190" y="362" text-anchor="middle">‏کسوٹی صداقت (Criterion validity)‏</text><text class="cell" x="190" y="384" text-anchor="middle">‏کسی بیرونی کسوٹی یا بعد کی‏</text><text class="cell" x="190" y="404" text-anchor="middle">‏کارکردگی کے ساتھ باہمی موازنہ‏</text><text class="body" x="390" y="244" text-anchor="middle">‏ٹیسٹ اسکورز سے اخذ کردہ‏</text><text class="body" x="390" y="266" text-anchor="middle">‏نتائج اور استدلال کی صداقت‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="26" text-anchor="end">‏اسکورز سے اخذ کردہ استدلال کو کیا چیز صادق بناتی ہے؟‏</text><text id="label-caption" class="small" x="760" y="444" text-anchor="end">‏صداقت کی ہر قسم مختلف شواہد پر انحصار کرتی ہے، اس لیے استاد کو‏</text><text class="small" x="760" y="462" text-anchor="end">‏لازماً دیکھنا چاہیے کہ مطلوبہ استعمال کی تائید کون سے شواہد کرتے ہیں۔‏</text><text class="wm" x="20" y="470" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
