<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart from an objective through an activity to an alignment decision</title><desc id="d">Flowchart from writing an objective, through a matching teaching activity, to a decision on whether the assessment item demands the same level, with aligned and misaligned exits that both lead to revision.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect class="panel" x="160" y="30" width="460" height="48" rx="24"/><rect class="panel-a" x="160" y="104" width="460" height="52" rx="8"/><polygon class="panel-b" points="390,200 540,262 390,324 240,262"/><rect class="panel-c" x="560" y="238" width="200" height="48" rx="8"/><rect class="panel-c" x="20" y="238" width="200" height="48" rx="8"/><rect class="panel" x="190" y="330" width="400" height="48" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="78" x2="390" y2="104" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="156" x2="390" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="262" x2="560" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="240" y1="262" x2="200" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="660" y1="286" x2="660" y2="354"/><line class="stroke" x1="660" y1="354" x2="590" y2="354" marker-end="url(#arrow)"/><line class="stroke" x1="100" y1="286" x2="100" y2="354"/><line class="stroke" x1="100" y1="354" x2="190" y2="354" marker-end="url(#arrow)"/></g><g id="layer-nodes"><text class="body" x="390" y="58" text-anchor="middle">write an observable instructional objective</text><text class="body" x="390" y="134" text-anchor="middle">choose an activity that practises the objective</text><text class="cell" x="390" y="254" text-anchor="middle">does the assessment item</text><text class="cell" x="390" y="274" text-anchor="middle">demand the same level?</text><text class="small" x="548" y="252">yes</text><text class="small" x="222" y="252">no</text><text class="cell" x="660" y="258" text-anchor="middle">aligned: teach,</text><text class="cell" x="660" y="276" text-anchor="middle">assess and review</text><text class="cell" x="120" y="258" text-anchor="middle">misaligned: item tests</text><text class="cell" x="120" y="276" text-anchor="middle">a different level</text><text class="body" x="390" y="358" text-anchor="middle">revise the objective, activity or item</text></g><g id="layer-labels"><text id="label-title" class="h" x="20" y="24">Checking alignment before the test is set</text><text id="label-caption" class="small" x="20" y="430">An aligned set and a misaligned set both end in a revision:</text><text class="small" x="20" y="448">change the objective, the activity or the item until they match.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
