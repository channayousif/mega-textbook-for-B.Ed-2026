<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بلوم کی چھ ادراکی سطحوں، فعال افعال اور امتحانی سوالات کا جدول</title><desc id="d">جدول جو بلوم کی چھ ادراکی سطحوں میں سے ہر ایک کو ایک فعال فعل، طالب علم کے عمل کی وضاحت، اور کلاس روم میں ملتے جلتے امتحانی سوال کی قسم سے ملاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect class="panel" x="20" y="40" width="740" height="56" rx="6"/><rect class="panel-a" x="20" y="96" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="160" width="740" height="64" rx="6"/><rect class="panel-c" x="20" y="224" width="740" height="64" rx="6"/><rect class="panel-a" x="20" y="288" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="352" width="740" height="64" rx="6"/><rect class="panel-c" x="20" y="416" width="740" height="64" rx="6"/></g><g id="layer-grid"><line class="grid" x1="20" y1="96" x2="760" y2="96"/><line class="grid" x1="20" y1="160" x2="760" y2="160"/><line class="grid" x1="20" y1="224" x2="760" y2="224"/><line class="grid" x1="20" y1="288" x2="760" y2="288"/><line class="grid" x1="20" y1="352" x2="760" y2="352"/><line class="grid" x1="20" y1="416" x2="760" y2="416"/><line class="grid" x1="20" y1="480" x2="760" y2="480"/><line class="grid" x1="640" y1="40" x2="640" y2="480"/><line class="grid" x1="480" y1="40" x2="480" y2="480"/><line class="grid" x1="230" y1="40" x2="230" y2="480"/></g><g id="layer-nodes"><text class="h" x="748" y="74" text-anchor="end">‏بلوم کی سطح‏</text><text class="h" x="628" y="74" text-anchor="end">‏فعال فعل‏</text><text class="h" x="468" y="74" text-anchor="end">‏طالب علم کا عمل‏</text><text class="h" x="218" y="74" text-anchor="end">‏متعلقہ سوال کی قسم‏</text><text class="sh" x="748" y="134" text-anchor="end">‏یاد رکھنا‏</text><text class="cell" x="628" y="134" text-anchor="end">‏فہرست، تعریف، نام‏</text><text class="cell" x="468" y="134" text-anchor="end">‏حقائق یا اصطلاحات یاد کرنا‏</text><text class="cell" x="218" y="134" text-anchor="end">‏خلیے کے خاکے کو لیبل کرنا‏</text><text class="sh" x="748" y="198" text-anchor="end">‏سمجھنا‏</text><text class="cell" x="628" y="198" text-anchor="end">‏وضاحت، خلاصہ، بیان‏</text><text class="cell" x="468" y="198" text-anchor="end">‏اپنے الفاظ میں بیان کرنا‏</text><text class="cell" x="218" y="198" text-anchor="end">‏بیج اگنے کی وضاحت کرنا‏</text><text class="sh" x="748" y="262" text-anchor="end">‏اطلاق‏</text><text class="cell" x="628" y="262" text-anchor="end">‏حل کرنا، حساب لگانا‏</text><text class="cell" x="468" y="262" text-anchor="end">‏نئے سیاق میں استعمال‏</text><text class="cell" x="218" y="262" text-anchor="end">‏کسر کا سوال حل کرنا‏</text><text class="sh" x="748" y="326" text-anchor="end">‏تجزیہ‏</text><text class="cell" x="628" y="326" text-anchor="end">‏جانچنا، موازنہ کرنا‏</text><text class="cell" x="468" y="326" text-anchor="end">‏اجزا میں ربط تلاش کرنا‏</text><text class="cell" x="218" y="326" text-anchor="end">‏دو وضاحتوں کا موازنہ‏</text><text class="sh" x="748" y="390" text-anchor="end">‏قدر پیمائی‏</text><text class="cell" x="628" y="390" text-anchor="end">‏فیصلہ کرنا، جواز دینا‏</text><text class="cell" x="468" y="390" text-anchor="end">‏معیارات پر پرکھنا‏</text><text class="cell" x="218" y="390" text-anchor="end">‏منصفانہ ٹیسٹ کا فیصلہ‏</text><text class="sh" x="748" y="454" text-anchor="end">‏تخلیق‏</text><text class="cell" x="628" y="454" text-anchor="end">‏ڈیزائن، تعمیر کرنا‏</text><text class="cell" x="468" y="454" text-anchor="end">‏اجزا سے نئی چیز بنانا‏</text><text class="cell" x="218" y="454" text-anchor="end">‏پانی پر پوسٹر تیار کرنا‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="26" text-anchor="end">‏بلوم کی سطحیں، فعال افعال اور متعلقہ سوالات‏</text><text id="label-caption" class="small" x="760" y="510" text-anchor="end">‏فعال فعل سطح کا تعین کرتا ہے تاکہ مقصد اور سوال کی باہمی مطابقت جانچی جا سکے۔‏</text><text class="wm" x="20" y="530" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
