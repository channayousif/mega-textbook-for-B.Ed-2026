<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تدریسی مقصد سے لے کر ہم آہنگی کے فیصلے تک کا فلو چارٹ</title><desc id="d">تدریسی مقصد لکھنے سے لے کر اس سے مطابقت رکھنے والی تدریسی سرگرمی اور پھر اس فیصلے تک کا فلو چارٹ کہ آیا تشخیصی سوال اسی سطح کا تقاضا کرتا ہے، جس میں ہم آہنگ اور غیر ہم آہنگ دونوں راستے آخرکار نظرثانی کی طرف لے جاتے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect class="panel" x="160" y="30" width="460" height="48" rx="24"/><rect class="panel-a" x="160" y="104" width="460" height="52" rx="8"/><polygon class="panel-b" points="390,200 540,262 390,324 240,262"/><rect class="panel-c" x="560" y="238" width="200" height="48" rx="8"/><rect class="panel-c" x="20" y="238" width="200" height="48" rx="8"/><rect class="panel" x="190" y="330" width="400" height="48" rx="8"/></g><g id="layer-edges"><line class="stroke" x1="390" y1="78" x2="390" y2="104" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="156" x2="390" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="262" x2="560" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="240" y1="262" x2="200" y2="262" marker-end="url(#arrow)"/><line class="stroke" x1="660" y1="286" x2="660" y2="354"/><line class="stroke" x1="660" y1="354" x2="590" y2="354" marker-end="url(#arrow)"/><line class="stroke" x1="100" y1="286" x2="100" y2="354"/><line class="stroke" x1="100" y1="354" x2="190" y2="354" marker-end="url(#arrow)"/></g><g id="layer-nodes"><text class="body" x="390" y="58" text-anchor="middle">‏مشاہدے کے قابل تدریسی مقصد تحریر کریں‏</text><text class="body" x="390" y="134" text-anchor="middle">‏مقصد کی مشق کروانے والی سرگرمی منتخب کریں‏</text><text class="cell" x="390" y="254" text-anchor="middle">‏کیا تشخیصی سوال‏</text><text class="cell" x="390" y="274" text-anchor="middle">‏اسی سطح کا تقاضا کرتا ہے؟‏</text><text class="small" x="548" y="252">‏ہاں‏</text><text class="small" x="222" y="252">‏نہیں‏</text><text class="cell" x="660" y="258" text-anchor="middle">‏ہم آہنگ: تدریس،‏</text><text class="cell" x="660" y="276" text-anchor="middle">‏تشخیص اور جائزہ‏</text><text class="cell" x="120" y="258" text-anchor="middle">‏غیر ہم آہنگ: سوال‏</text><text class="cell" x="120" y="276" text-anchor="middle">‏مختلف سطح ناپتا ہے‏</text><text class="body" x="390" y="358" text-anchor="middle">‏مقصد، سرگرمی یا سوال پر نظرثانی کریں‏</text></g><g id="layer-labels"><text id="label-title" class="h" x="760" y="24" text-anchor="end">‏ٹیسٹ لینے سے پہلے ہم آہنگی کی جانچ‏</text><text id="label-caption" class="small" x="760" y="430" text-anchor="end">‏ہم آہنگ اور غیر ہم آہنگ دونوں صورتیں نظرثانی پر ختم ہوتی ہیں:‏</text><text class="small" x="760" y="448" text-anchor="end">‏مقصد، سرگرمی یا سوال کو تبدیل کریں جب تک وہ باہم مطابقت نہ رکھیں۔‏</text><text class="wm" x="20" y="530" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
