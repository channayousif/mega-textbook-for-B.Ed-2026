<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of Bloom's six cognitive levels with command verbs and matching item types</title><desc id="d">Table matching each of the six Bloom cognitive levels to a command verb, a description of what the pupil does, and a matching classroom item type.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-regions"><rect class="panel" x="20" y="40" width="740" height="56" rx="6"/><rect class="panel-a" x="20" y="96" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="160" width="740" height="64" rx="6"/><rect class="panel-c" x="20" y="224" width="740" height="64" rx="6"/><rect class="panel-a" x="20" y="288" width="740" height="64" rx="6"/><rect class="panel-b" x="20" y="352" width="740" height="64" rx="6"/><rect class="panel-c" x="20" y="416" width="740" height="64" rx="6"/></g><g id="layer-grid"><line class="grid" x1="20" y1="96" x2="760" y2="96"/><line class="grid" x1="20" y1="160" x2="760" y2="160"/><line class="grid" x1="20" y1="224" x2="760" y2="224"/><line class="grid" x1="20" y1="288" x2="760" y2="288"/><line class="grid" x1="20" y1="352" x2="760" y2="352"/><line class="grid" x1="20" y1="416" x2="760" y2="416"/><line class="grid" x1="20" y1="480" x2="760" y2="480"/><line class="grid" x1="140" y1="40" x2="140" y2="480"/><line class="grid" x1="300" y1="40" x2="300" y2="480"/><line class="grid" x1="550" y1="40" x2="550" y2="480"/></g><g id="layer-nodes"><text class="h" x="36" y="74">Bloom level</text><text class="h" x="156" y="74">Command verb</text><text class="h" x="316" y="74">What the pupil does</text><text class="h" x="566" y="74">Matching item type</text><text class="sh" x="36" y="134">Remember</text><text class="cell" x="156" y="134">list, define, name</text><text class="cell" x="316" y="134">recalls facts or terms</text><text class="cell" x="566" y="134">label a plant cell diagram</text><text class="sh" x="36" y="198">Understand</text><text class="cell" x="156" y="198">explain, describe</text><text class="cell" x="316" y="198">explains ideas in their own words</text><text class="cell" x="566" y="198">explain seed germination</text><text class="sh" x="36" y="262">Apply</text><text class="cell" x="156" y="262">solve, calculate</text><text class="cell" x="316" y="262">uses a procedure in a new context</text><text class="cell" x="566" y="262">solve a fraction problem</text><text class="sh" x="36" y="326">Analyze</text><text class="cell" x="156" y="326">examine, infer</text><text class="cell" x="316" y="326">sorts and relates the parts</text><text class="cell" x="566" y="326">compare two explanations</text><text class="sh" x="36" y="390">Evaluate</text><text class="cell" x="156" y="390">judge, justify</text><text class="cell" x="316" y="390">judges against set criteria</text><text class="cell" x="566" y="390">judge the fairer test</text><text class="sh" x="36" y="454">Create</text><text class="cell" x="156" y="454">design, construct</text><text class="cell" x="316" y="454">makes something new from parts</text><text class="cell" x="566" y="454">design a poster on water</text></g><g id="layer-labels"><text id="label-title" class="h" x="20" y="26">Bloom's levels, command verbs and matching items</text><text id="label-caption" class="small" x="20" y="510">A command word names the level, so the objective and the item can be checked against each other.</text><text class="wm" x="768" y="530" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
