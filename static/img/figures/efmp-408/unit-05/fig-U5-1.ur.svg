<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نمبر دینے اور درجہ بندی کا موازنہ</title><desc id="d">جدول جس میں نمبر دینے اور درجہ بندی کا موازنہ کیا گیا ہے کہ ہر ایک کیا کرتا ہے، کیا محفوظ رکھتا ہے، کیا کھو دیتا ہے اور کس مقصد کے لیے بہترین ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="285" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="160" x2="756" y2="160"/><line class="frame" x1="24" y1="220" x2="756" y2="220"/><line class="frame" x1="24" y1="280" x2="756" y2="280"/><line class="frame" x1="590" y1="55" x2="590" y2="340"/><line class="frame" x1="310" y1="55" x2="310" y2="340"/><text class="h" x="745" y="83" text-anchor="end">پہلو</text><text class="h" x="575" y="83" text-anchor="end">نمبر دینا</text><text class="h" x="295" y="83" text-anchor="end">درجہ بندی</text><text class="sh" x="745" y="128" text-anchor="end">یہ کیا کرتا ہے</text><text class="cell" x="575" y="122" text-anchor="end">شمار کرتا ہے کہ طالب علم نے</text><text class="cell" x="575" y="141" text-anchor="end">کتنا کام درست کیا ہے</text><text class="cell" x="295" y="122" text-anchor="end">نمبروں کو ایک مشترکہ زمرے یا</text><text class="cell" x="295" y="141" text-anchor="end">لیٹر گریڈ میں تبدیل کرتا ہے</text><text class="sh" x="745" y="188" text-anchor="end">کیا محفوظ رکھتا ہے</text><text class="cell" x="575" y="182" text-anchor="end">درست تفصیلی ریکارڈ: کون سے سوالات غلط تھے</text><text class="cell" x="575" y="201" text-anchor="end">اور ہر سوال کے کتنے نمبر حاصل ہوئے</text><text class="cell" x="295" y="182" text-anchor="end">مشترکہ مفہوم جو استاد، ہیڈ ٹیچر،</text><text class="cell" x="295" y="201" text-anchor="end">بورڈ اور والدین تک پہنچتا ہے</text><text class="sh" x="745" y="248" text-anchor="end">کیا کھو دیتا ہے</text><text class="cell" x="575" y="242" text-anchor="end">مختلف پرچوں اور مختلف اساتذہ کے مابین</text><text class="cell" x="575" y="261" text-anchor="end">موازنے کی یکساں صلاحیت</text><text class="cell" x="295" y="242" text-anchor="end">باریک تفصیلات: ایک ہی گریڈ پانے والے دو</text><text class="cell" x="295" y="261" text-anchor="end">طلبہ کی صلاحیت میں بڑا فرق ہو سکتا ہے</text><text class="sh" x="745" y="308" text-anchor="end">بہترین استعمال</text><text class="cell" x="575" y="302" text-anchor="end">غلطیوں کی تشخیص، فیڈ فارورڈ اور</text><text class="cell" x="575" y="321" text-anchor="end">اگلے سبق کی تدریسی منصوبہ بندی</text><text class="cell" x="295" y="302" text-anchor="end">تعلیمی پیش رفت کی رپورٹ، سند بندی</text><text class="cell" x="295" y="321" text-anchor="end">اور اگلی جماعت میں ترقی کا فیصلہ</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">نمبر دینا تفصیل اور درجہ بندی مفہوم محفوظ رکھتی ہے</text><text id="label-caption" class="small" x="756" y="372" text-anchor="end">استاد کو دونوں کی ضرورت ہے: تشخیص کے لیے نمبر اور رپورٹ کے لیے گریڈ۔</text><text class="wm" x="24" y="390" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>