<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">امتحانی سوال کے مستقبل کا فیصلہ کرنے کا فلو چارٹ</title><desc id="d">امتحانی سوال کے مستقبل کا فیصلہ کرنے کا فلو چارٹ: مشکل اور امتیاز شاخص معلوم کرنے کے بعد منفی امتیاز پر جوابی کلید کی جانچ، صفر کے قریب امتیاز پر سوال کی ترمیم یا تبدیلی، اور نامناسب مشکل پر سوال کی اصلاح، ورنہ سوال برقرار رکھا جاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="510"/><g id="layer-regions"><rect class="panel" x="370" y="36" width="260" height="40" rx="20"/><polygon class="panel-b" points="500,94 600,130 500,166 400,130"/><rect class="panel-c" x="20" y="98" width="350" height="64" rx="8"/><polygon class="panel-b" points="500,190 600,226 500,262 400,226"/><rect class="panel-c" x="20" y="194" width="350" height="64" rx="8"/><polygon class="panel-b" points="500,286 600,322 500,358 400,322"/><rect class="panel-c" x="20" y="290" width="350" height="64" rx="8"/><rect class="panel-a" x="330" y="382" width="340" height="64" rx="8"/></g><g id="layer-edges"><line id="edge-start" class="stroke" x1="500" y1="76" x2="500" y2="94" marker-end="url(#arrow)"/><line id="edge-dneg-yes" class="stroke" x1="400" y1="130" x2="374" y2="130" marker-end="url(#arrow)"/><line id="edge-dneg-no" class="stroke" x1="500" y1="166" x2="500" y2="190" marker-end="url(#arrow)"/><line id="edge-dzero-yes" class="stroke" x1="400" y1="226" x2="374" y2="226" marker-end="url(#arrow)"/><line id="edge-dzero-no" class="stroke" x1="500" y1="262" x2="500" y2="286" marker-end="url(#arrow)"/><line id="edge-band-yes" class="stroke" x1="400" y1="322" x2="374" y2="322" marker-end="url(#arrow)"/><line id="edge-band-no" class="stroke" x1="500" y1="358" x2="500" y2="382" marker-end="url(#arrow)"/></g><g id="layer-nodes"><text class="sh" x="500" y="61" text-anchor="middle">ایک سوال کے لیے p اور D کا حساب</text><text class="sh" x="500" y="124" text-anchor="middle">کیا D منفی</text><text class="sh" x="500" y="142" text-anchor="middle">ہے؟</text><text class="sh" x="500" y="220" text-anchor="middle">کیا D صفر</text><text class="sh" x="500" y="238" text-anchor="middle">کے قریب ہے؟</text><text class="sh" x="500" y="316" text-anchor="middle">کیا مشکل غیر</text><text class="sh" x="500" y="334" text-anchor="middle">موزوں ہے؟</text><text class="small" x="387" y="120" text-anchor="middle">ہاں</text><text class="small" x="387" y="216" text-anchor="middle">ہاں</text><text class="small" x="387" y="312" text-anchor="middle">ہاں</text><text class="small" x="515" y="182">نہیں</text><text class="small" x="515" y="278">نہیں</text><text class="small" x="515" y="374">نہیں</text><text class="sh" x="195" y="122" text-anchor="middle">جوابی کلید اور عبارت کی جانچ</text><text class="cell" x="195" y="142" text-anchor="middle">پھر سوال کو پرچے سے خارج کریں یا نئے سرے سے لکھیں</text><text class="sh" x="195" y="218" text-anchor="middle">سوال میں ترمیم یا تبدیلی</text><text class="cell" x="195" y="238" text-anchor="middle">تاکہ یہ بالائی اور زیریں گروپس میں واضح تمیز پیدا کر سکے</text><text class="sh" x="195" y="314" text-anchor="middle">مشکل کی سطح درست کریں</text><text class="cell" x="195" y="334" text-anchor="middle">تاکہ یہ ٹیسٹ کے مطلوبہ مقصد اور معیار سے میل کھائے</text><text class="sh" x="500" y="406" text-anchor="middle">سوال کو جوں کا توں رکھیں</text><text class="cell" x="500" y="426" text-anchor="middle">یہ گروپس میں اچھی تمیز کرتا ہے اور اس کی مشکل مناسب ہے</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="28" text-anchor="end">امتحانی سوال کے مستقبل کا فیصلہ</text><text id="label-caption" class="small" x="756" y="478" text-anchor="end">ہر راستے کے اختتام پر آئٹم بینک میں تفصیلی نوٹ لکھا جائے تاکہ اگلے استاد کو فیصلے کا علم ہو۔</text><text class="wm" x="24" y="498" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>