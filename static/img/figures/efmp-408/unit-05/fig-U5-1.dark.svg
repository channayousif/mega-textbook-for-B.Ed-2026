<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Marking and grading compared</title><desc id="d">Table comparing marking and grading on what each does, what each preserves, what each loses, and what each is best used for.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="400"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="285" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="160" x2="756" y2="160"/><line class="frame" x1="24" y1="220" x2="756" y2="220"/><line class="frame" x1="24" y1="280" x2="756" y2="280"/><line class="frame" x1="190" y1="55" x2="190" y2="340"/><line class="frame" x1="470" y1="55" x2="470" y2="340"/><text class="h" x="35" y="83">Aspect</text><text class="h" x="200" y="83">Marking</text><text class="h" x="480" y="83">Grading</text><text class="sh" x="35" y="124">What it does</text><text class="cell" x="200" y="124">Counts how much of a task</text><text class="cell" x="200" y="141">the pupil got right</text><text class="cell" x="480" y="124">Converts marks into a category</text><text class="cell" x="480" y="141">such as a letter or a band</text><text class="sh" x="35" y="184">What it preserves</text><text class="cell" x="200" y="184">Exact detail: which items were</text><text class="cell" x="200" y="201">wrong, and how much each earned</text><text class="cell" x="480" y="184">A shared meaning that travels</text><text class="cell" x="480" y="201">between teacher, board and parent</text><text class="sh" x="35" y="244">What it loses</text><text class="cell" x="200" y="244">Comparability between papers</text><text class="cell" x="200" y="261">and between teachers</text><text class="cell" x="480" y="244">Detail: two pupils with one grade</text><text class="cell" x="480" y="261">may differ widely</text><text class="sh" x="35" y="304">Best used for</text><text class="cell" x="200" y="304">Diagnosing errors and planning</text><text class="cell" x="200" y="321">the next lesson</text><text class="cell" x="480" y="304">Reporting progress, certification</text><text class="cell" x="480" y="321">and promotion</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Marking keeps detail, grading keeps meaning</text><text id="label-caption" class="small" x="24" y="372">A teacher needs both: marks to diagnose, grades to report.</text><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
