<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 385" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">An annotated report card entry</title><desc id="d">An annotated school report card entry showing the mark, grade, class mean, class range and a teacher remark, with a note on what each part tells a parent.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="385"/><g id="layer-regions"><rect class="panel" x="24" y="60" width="400" height="270" rx="8"/><rect class="panel-a" x="460" y="104" width="296" height="64" rx="8"/><rect class="panel-b" x="460" y="159" width="296" height="64" rx="8"/><rect class="panel-c" x="460" y="258" width="296" height="64" rx="8"/></g><g id="layer-edges"><line id="edge-marks" class="stroke" x1="424" y1="136" x2="458" y2="136" marker-end="url(#arrow)"/><line id="edge-context" class="stroke" x1="424" y1="191" x2="458" y2="191" marker-end="url(#arrow)"/><line id="edge-next" class="stroke" x1="424" y1="290" x2="458" y2="290" marker-end="url(#arrow)"/></g><g id="layer-nodes"><text class="h" x="40" y="88">General Mathematics</text><text class="small" x="40" y="108">Paper of 100 marks</text><text class="cell" x="40" y="136">Marks obtained: 58</text><text class="cell" x="40" y="158">Grade: C</text><text class="cell" x="40" y="180">Class mean: 61</text><text class="cell" x="40" y="202">Class range: 34 to 92</text><text class="cell" x="40" y="224">Attendance: 42 of 45 days</text><text class="sh" x="40" y="252">Teacher's remark</text><text class="cell" x="40" y="272">Solves two-digit multiplication</text><text class="cell" x="40" y="290">accurately. Needs practice with word</text><text class="cell" x="40" y="308">problems about time and money.</text><text class="sh" x="476" y="126">The mark alone</text><text class="cell" x="476" y="144">58 out of 100 says how much of</text><text class="cell" x="476" y="161">this paper the pupil got right.</text><text class="sh" x="476" y="181">The comparator</text><text class="cell" x="476" y="199">The class mean and range place 58</text><text class="cell" x="476" y="216">inside this class, not above it.</text><text class="sh" x="476" y="280">The next step</text><text class="cell" x="476" y="298">The remark names the skill to</text><text class="cell" x="476" y="315">practise next, so parents can help.</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">One report entry, read three ways</text><text id="label-caption" class="small" x="24" y="362">A mark, a comparator and a next step each tell a parent something different.</text><text class="wm" x="768" y="375" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
