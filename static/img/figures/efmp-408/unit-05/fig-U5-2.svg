<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Two classes with the same mean and different spreads</title><desc id="d">Two number lines showing the marks of two Class 7 sections, both with a mean of 13; Section A is tightly clustered around 13 while Section B spreads from 6 to 20.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.stroke-a { stroke: var(--a3); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.dot { fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="330"/><g id="layer-axes"><line class="grid" x1="80" y1="116" x2="700" y2="116"/><line class="grid" x1="80" y1="238" x2="700" y2="238"/><line class="stroke-a" x1="483" y1="66" x2="483" y2="120"/><line class="stroke-a" x1="483" y1="190" x2="483" y2="242"/><g id="layer-ticks"><line class="grid" x1="80" y1="112" x2="80" y2="120"/><line class="grid" x1="235" y1="112" x2="235" y2="120"/><line class="grid" x1="390" y1="112" x2="390" y2="120"/><line class="grid" x1="545" y1="112" x2="545" y2="120"/><line class="grid" x1="700" y1="112" x2="700" y2="120"/><line class="grid" x1="80" y1="234" x2="80" y2="242"/><line class="grid" x1="235" y1="234" x2="235" y2="242"/><line class="grid" x1="390" y1="234" x2="390" y2="242"/><line class="grid" x1="545" y1="234" x2="545" y2="242"/><line class="grid" x1="700" y1="234" x2="700" y2="242"/></g></g><g id="layer-nodes"><circle class="dot" cx="390" cy="104" r="7"/><circle class="dot" cx="421" cy="104" r="7"/><circle class="dot" cx="452" cy="104" r="7"/><circle class="dot" cx="452" cy="90" r="7"/><circle class="dot" cx="483" cy="104" r="7"/><circle class="dot" cx="483" cy="90" r="7"/><circle class="dot" cx="514" cy="104" r="7"/><circle class="dot" cx="514" cy="90" r="7"/><circle class="dot" cx="545" cy="104" r="7"/><circle class="dot" cx="576" cy="104" r="7"/><circle class="dot" cx="266" cy="226" r="7"/><circle class="dot" cx="328" cy="226" r="7"/><circle class="dot" cx="390" cy="226" r="7"/><circle class="dot" cx="421" cy="226" r="7"/><circle class="dot" cx="452" cy="226" r="7"/><circle class="dot" cx="514" cy="226" r="7"/><circle class="dot" cx="545" cy="226" r="7"/><circle class="dot" cx="576" cy="226" r="7"/><circle class="dot" cx="638" cy="226" r="7"/><circle class="dot" cx="700" cy="226" r="7"/></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="28">Same mean, different spread</text><text class="sh" x="24" y="58">Section A - mean 13, standard deviation 1.83</text><text class="sh" x="24" y="182">Section B - mean 13, standard deviation 4.42</text><text class="small" x="80" y="134" text-anchor="middle">0</text><text class="small" x="235" y="134" text-anchor="middle">5</text><text class="small" x="390" y="134" text-anchor="middle">10</text><text class="small" x="545" y="134" text-anchor="middle">15</text><text class="small" x="700" y="134" text-anchor="middle">20</text><text class="small" x="80" y="256" text-anchor="middle">0</text><text class="small" x="235" y="256" text-anchor="middle">5</text><text class="small" x="390" y="256" text-anchor="middle">10</text><text class="small" x="545" y="256" text-anchor="middle">15</text><text class="small" x="700" y="256" text-anchor="middle">20</text><text class="small" x="483" y="150" text-anchor="middle">mean 13</text><text class="small" x="483" y="272" text-anchor="middle">mean 13</text><text id="label-caption" class="small" x="24" y="302">Each dot is one pupil's mark on a 20-mark test; the coloured line marks the mean.</text><text class="wm" x="768" y="320" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
