<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Deciding the fate of a test item</title><desc id="d">Flowchart for deciding the fate of a test item: after computing difficulty and discrimination, a negative discrimination sends the teacher to check the key, a near-zero discrimination leads to revising or replacing the item, and a difficulty outside the band the test needs leads to revising the item, otherwise the item is kept.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="510"/><g id="layer-regions"><rect class="panel" x="370" y="36" width="260" height="40" rx="20"/><polygon class="panel-b" points="500,94 600,130 500,166 400,130"/><rect class="panel-c" x="20" y="98" width="350" height="64" rx="8"/><polygon class="panel-b" points="500,190 600,226 500,262 400,226"/><rect class="panel-c" x="20" y="194" width="350" height="64" rx="8"/><polygon class="panel-b" points="500,286 600,322 500,358 400,322"/><rect class="panel-c" x="20" y="290" width="350" height="64" rx="8"/><rect class="panel-a" x="330" y="382" width="340" height="64" rx="8"/></g><g id="layer-edges"><line id="edge-start" class="stroke" x1="500" y1="76" x2="500" y2="94" marker-end="url(#arrow)"/><line id="edge-dneg-yes" class="stroke" x1="400" y1="130" x2="374" y2="130" marker-end="url(#arrow)"/><line id="edge-dneg-no" class="stroke" x1="500" y1="166" x2="500" y2="190" marker-end="url(#arrow)"/><line id="edge-dzero-yes" class="stroke" x1="400" y1="226" x2="374" y2="226" marker-end="url(#arrow)"/><line id="edge-dzero-no" class="stroke" x1="500" y1="262" x2="500" y2="286" marker-end="url(#arrow)"/><line id="edge-band-yes" class="stroke" x1="400" y1="322" x2="374" y2="322" marker-end="url(#arrow)"/><line id="edge-band-no" class="stroke" x1="500" y1="358" x2="500" y2="382" marker-end="url(#arrow)"/></g><g id="layer-nodes"><text class="sh" x="500" y="61" text-anchor="middle">p and D computed for one item</text><text class="sh" x="500" y="124" text-anchor="middle">Is D</text><text class="sh" x="500" y="140" text-anchor="middle">negative?</text><text class="sh" x="500" y="220" text-anchor="middle">Is D close</text><text class="sh" x="500" y="236" text-anchor="middle">to zero?</text><text class="sh" x="500" y="316" text-anchor="middle">Difficulty</text><text class="sh" x="500" y="332" text-anchor="middle">suitable?</text><text class="small" x="370" y="120" text-anchor="end">yes</text><text class="small" x="370" y="216" text-anchor="end">yes</text><text class="small" x="370" y="312" text-anchor="end">yes</text><text class="small" x="512" y="182">no</text><text class="small" x="512" y="278">no</text><text class="small" x="512" y="374">no</text><text class="sh" x="36" y="122">Check the scoring guide</text><text class="cell" x="36" y="140">then the wording, then drop</text><text class="cell" x="36" y="157">or rewrite the item</text><text class="sh" x="36" y="218">Revise or replace it</text><text class="cell" x="36" y="236">so that it separates the</text><text class="cell" x="36" y="253">upper and lower groups</text><text class="sh" x="36" y="314">Revise its difficulty</text><text class="cell" x="36" y="332">so that it matches the band</text><text class="cell" x="36" y="349">this test needs</text><text class="sh" x="346" y="406">Keep the item as it is</text><text class="cell" x="346" y="424">it separates the groups well and</text><text class="cell" x="346" y="441">its difficulty fits the test</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="28">Deciding what to do with one item</text><text id="label-caption" class="small" x="24" y="478">Every path ends with a note in the item bank, so the next teacher knows the decision.</text><text class="wm" x="768" y="498" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
