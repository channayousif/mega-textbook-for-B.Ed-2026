 حسابی اوسط 13، معیاری انحراف 1.83</text><text class="sh" x="756" y="182" text-anchor="end">سیکشن ب - حسابی اوسط 13، معیاری انحراف 4.42</text><text class="small" x="80" y="134" text-anchor="middle" font-family="system-ui, sans-serif">0</text><text class="small" x="235" y="134" text-anchor="middle" font-family="system-ui, sans-serif">5</text><text class="small" x="390" y="134" text-anchor="middle" font-family="system-ui, sans-serif">10</text><text class="small" x="545" y="134" text-anchor="middle" font-family="system-ui, sans-serif">15</text><text class="small" x="700" y="134" text-anchor="middle" font-family="system-ui, sans-serif">20</text><text class="small" x="80" y="256" text-anchor="middle" font-family="system-ui, sans-serif">0</text><text class="small" x="235" y="256" text-anchor="middle" font-family="system-ui, sans-serif">5</text><text class="small" x="390" y="256" text-anchor="middle" font-family="system-ui, sans-serif">10</text><text class="small" x="545" y="256" text-anchor="middle" font-family="system-ui, sans-serif">15</text><text class="small" x="700" y="256" text-anchor="middle" font-family="system-ui, sans-serif">20</text><text class="small" x="483" y="150" text-anchor="middle">اوسط 13</text><text class="small" x="483" y="272" text-anchor="middle">اوسط 13</text><text id="label-caption" class="small" x="756" y="302" text-anchor="end">ہر نقطہ 20 نمبروں کے ٹیسٹ میں ایک طالب علم کے حاصل کردہ نمبر کو ظاہر کرتا ہے؛ رنگین لکیر اوسط کو ظاہر کرتی ہے۔</text><text class="wm" x="24" y="320" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>