<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 385" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مرکزی رجحان کا ہر پیمانہ کب گمراہ کن ثابت ہوتا ہے</title><desc id="d">جدول جس میں ایسی تین صورتیں بیان کی گئی ہیں جہاں حسابی اوسط، وسطانیہ اور اعادہ استاد کو غلط فہمی میں ڈال سکتے ہیں، اور ہر صورت میں ان کے بجائے کون سی پیمائش رپورٹ کرنی چاہیے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="385"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="270" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="250" x2="756" y2="250"/><line class="frame" x1="646" y1="55" x2="646" y2="325"/><line class="frame" x1="316" y1="55" x2="316" y2="325"/><text class="h" x="745" y="83" text-anchor="end">پیمانہ</text><text class="h" x="635" y="83" text-anchor="end">کب گمراہ کن ہوتا ہے</text><text class="h" x="305" y="83" text-anchor="end">اس کے بجائے کیا رپورٹ کریں</text><text class="sh" x="745" y="124" text-anchor="end">حسابی اوسط</text><text class="cell" x="635" y="120" text-anchor="end">ایک انتہائی زیادہ یا انتہائی کم نمبر اسے</text><text class="cell" x="635" y="137" text-anchor="end">اس مقام سے دور لے جاتا ہے جہاں زیادہ</text><text class="cell" x="635" y="154" text-anchor="end">تر طلبہ حقیقتاً موجود ہوتے ہیں</text><text class="cell" x="305" y="120" text-anchor="end">وسطانیہ رپورٹ کریں، جو اس بات سے متاثر</text><text class="cell" x="305" y="137" text-anchor="end">نہیں ہوتا کہ انتہا پر موجود نمبر باقی</text><text class="cell" x="305" y="154" text-anchor="end">نمبروں سے کتنا دور ہے</text><text class="sh" x="745" y="199" text-anchor="end">وسطانیہ</text><text class="cell" x="635" y="195" text-anchor="end">جب مجموعی حاصل کردہ نمبر اہم ہوں (جیسے</text><text class="cell" x="635" y="212" text-anchor="end">نصاب کا کتنا حصہ مکمل ہوا) یا دو درمیانی</text><text class="cell" x="635" y="229" text-anchor="end">قیمتوں میں بہت زیادہ فرق ہو</text><text class="cell" x="305" y="195" text-anchor="end">حسابی اوسط، جب مجموعہ اہمیت رکھتا ہو؛</text><text class="cell" x="305" y="212" text-anchor="end">اور ساتھ ہی جماعتی وسعت (رینج) بھی</text><text class="cell" x="305" y="229" text-anchor="end">لازمی رپورٹ کریں</text><text class="sh" x="745" y="274" text-anchor="end">اعادہ</text><text class="cell" x="635" y="270" text-anchor="end">نمبر شاذ و نادر ہی دہرائے جاتے ہیں، اس لیے</text><text class="cell" x="635" y="287" text-anchor="end">ممکن ہے کوئی اعادہ نہ ہو یا کئی اعداد برابر</text><text class="cell" x="635" y="304" text-anchor="end">ہوں؛ مائل ڈیٹا میں یہ انتہا پر ہو سکتا ہے</text><text class="cell" x="305" y="270" text-anchor="end">وسطانیہ، اور واضح کریں کہ یہاں</text><text class="cell" x="305" y="287" text-anchor="end">اعادہ کوئی معنی خیز پیمانہ نہیں ہے</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">مرکزی رجحان کا ہر پیمانہ مخصوص حالت میں ناکام ہوتا ہے</text><text id="label-caption" class="small" x="756" y="355" text-anchor="end">ایسا پیمانہ منتخب کریں جو سوال کے مطابق ہو، نہ کہ وہ جو معلوم کرنا سب سے آسان ہو۔</text><text class="wm" x="24" y="375" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>