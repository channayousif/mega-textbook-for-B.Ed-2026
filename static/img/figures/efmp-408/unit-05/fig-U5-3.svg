<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A worked item analysis for a five-item quiz</title><desc id="d">A worked item analysis table for a five-item quiz taken by 30 pupils, showing the upper, middle and lower group correct counts, the difficulty index and the discrimination index for each item.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="360"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="245" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="140" x2="756" y2="140"/><line class="frame" x1="24" y1="180" x2="756" y2="180"/><line class="frame" x1="24" y1="220" x2="756" y2="220"/><line class="frame" x1="24" y1="260" x2="756" y2="260"/><line class="frame" x1="92" y1="55" x2="92" y2="300"/><line class="frame" x1="222" y1="55" x2="222" y2="300"/><line class="frame" x1="352" y1="55" x2="352" y2="300"/><line class="frame" x1="482" y1="55" x2="482" y2="300"/><line class="frame" x1="592" y1="55" x2="592" y2="300"/><text class="h" x="35" y="83">Item</text><text class="h" x="102" y="83">Upper</text><text class="h" x="232" y="83">Middle</text><text class="h" x="362" y="83">Lower</text><text class="h" x="492" y="83">Difficulty</text><text class="h" x="602" y="83">Discrimination</text><text class="cell" x="35" y="124">1</text><text class="cell" x="102" y="124">10</text><text class="cell" x="232" y="124">8</text><text class="cell" x="362" y="124">2</text><text class="cell" x="492" y="124">0.67</text><text class="cell" x="602" y="124">0.80</text><text class="cell" x="35" y="164">2</text><text class="cell" x="102" y="164">9</text><text class="cell" x="232" y="164">6</text><text class="cell" x="362" y="164">5</text><text class="cell" x="492" y="164">0.67</text><text class="cell" x="602" y="164">0.40</text><text class="cell" x="35" y="204">3</text><text class="cell" x="102" y="204">5</text><text class="cell" x="232" y="204">5</text><text class="cell" x="362" y="204">5</text><text class="cell" x="492" y="204">0.50</text><text class="cell" x="602" y="204">0.00</text><text class="cell" x="35" y="244">4</text><text class="cell" x="102" y="244">10</text><text class="cell" x="232" y="244">10</text><text class="cell" x="362" y="244">10</text><text class="cell" x="492" y="244">1.00</text><text class="cell" x="602" y="244">0.00</text><text class="cell" x="35" y="284">5</text><text class="cell" x="102" y="284">2</text><text class="cell" x="232" y="284">1</text><text class="cell" x="362" y="284">3</text><text class="cell" x="492" y="284">0.20</text><text class="cell" x="602" y="284">-0.10</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Five items, thirty pupils, three groups of ten</text><text id="label-caption" class="small" x="24" y="330">Correct counts out of ten pupils in each group. p = total correct / 30. D = (upper - lower) / 10.</text><text class="wm" x="768" y="348" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
