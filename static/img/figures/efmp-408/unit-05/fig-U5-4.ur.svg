<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 385" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول رپورٹ کارڈ کے اندراج کا وضاحتی خاکہ</title><desc id="d">اسکول رپورٹ کارڈ کے اندراج کا وضاحتی خاکہ جو حاصل کردہ نمبر، گریڈ، جماعتی اوسط، جماعتی پھیلاؤ اور استاد کی رائے ظاہر کرتا ہے، اور بتاتا ہے کہ ہر حصہ والدین کو کیا معلومات دیتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="385"/><g id="layer-regions"><rect class="panel" x="356" y="60" width="400" height="270" rx="8"/><rect class="panel-a" x="24" y="104" width="296" height="64" rx="8"/><rect class="panel-b" x="24" y="159" width="296" height="64" rx="8"/><rect class="panel-c" x="24" y="258" width="296" height="64" rx="8"/></g><g id="layer-edges"><line id="edge-marks" class="stroke" x1="356" y1="136" x2="322" y2="136" marker-end="url(#arrow-left)"/><line id="edge-context" class="stroke" x1="356" y1="191" x2="322" y2="191" marker-end="url(#arrow-left)"/><line id="edge-next" class="stroke" x1="356" y1="290" x2="322" y2="290" marker-end="url(#arrow-left)"/></g><g id="layer-nodes"><text class="h" x="732" y="88" text-anchor="end">جنرل ریاضی</text><text class="small" x="732" y="108" text-anchor="end">100 نمبروں کا پرچہ</text><text class="cell" x="732" y="136" text-anchor="end">حاصل کردہ نمبر: 58</text><text class="cell" x="732" y="158" text-anchor="end">گریڈ: C</text><text class="cell" x="732" y="180" text-anchor="end">جماعتی اوسط: 61</text><text class="cell" x="732" y="202" text-anchor="end">جماعتی وسعت: 34 تا 92</text><text class="cell" x="732" y="224" text-anchor="end">حاضری: 45 میں سے 42 دن</text><text class="sh" x="732" y="252" text-anchor="end">استاد کی رائے</text><text class="cell" x="732" y="272" text-anchor="end">دو ہندسوں کی ضرب درست حل کرتی ہے۔</text><text class="cell" x="732" y="290" text-anchor="end">وقت اور رقم سے متعلق عبارتی سوالات</text><text class="cell" x="732" y="308" text-anchor="end">میں مزید مشق کی ضرورت ہے۔</text><text class="sh" x="304" y="126" text-anchor="end">صرف حاصل کردہ نمبر</text><text class="cell" x="304" y="144" text-anchor="end">100 میں سے 58 نمبر بتاتے ہیں کہ طالب علم</text><text class="cell" x="304" y="161" text-anchor="end">نے اس پرچے کا کتنا حصہ درست حل کیا۔</text><text class="sh" x="304" y="181" text-anchor="end">تقابلی معیار</text><text class="cell" x="304" y="199" text-anchor="end">جماعتی اوسط اور وسعت 58 نمبروں کو کلاس</text><text class="cell" x="304" y="216" text-anchor="end">کے مجموعی تناظر میں واضح کرتے ہیں۔</text><text class="sh" x="304" y="280" text-anchor="end">اگلا تدریسی قدم</text><text class="cell" x="304" y="298" text-anchor="end">استاد کی رائے بتاتی ہے کہ کس مہارت کی</text><text class="cell" x="304" y="315" text-anchor="end">مشق کرنی ہے تاکہ والدین مدد کر سکیں۔</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">رپورٹ کارڈ کا ایک اندراج، تین طرح کی معلومات</text><text id="label-caption" class="small" x="756" y="362" text-anchor="end">حاصل کردہ نمبر، تقابلی جائزہ اور اگلا قدم والدین کو مختلف اور بامقصد رہنمائی فراہم کرتے ہیں۔</text><text class="wm" x="24" y="375" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>