<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">امتحانی اسکور کی تشریح: معیارِ گروہ بمقابلہ معیارِ کسوٹی</title><desc id="d">خاکہ جو ہم جماعتوں کے معیارِ گروہ کے مقابلے میں 72 فیصد کے اسکور کا معیارِ کسوٹی کے 70 فیصد قابلیت کے بینچ مارک سے موازنہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-score"><rect class="panel-c" x="270" y="55" width="240" height="65" rx="8"/><text class="h" x="390" y="85" text-anchor="middle">طالب علم کا اسکور: 72 فیصد</text><text class="cell" x="390" y="105" text-anchor="middle">(50 میں سے 36 سوالات درست)</text><line class="stroke" x1="330" y1="120" x2="200" y2="170" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="120" x2="580" y2="170" marker-end="url(#arrow)"/></g><g id="layer-interpretations"><rect class="panel-b" x="24" y="175" width="350" height="240" rx="8"/><text class="h" x="358" y="205" text-anchor="end">معیارِ گروہی تشریح</text><text class="sh" x="358" y="230" text-anchor="end">ہم جماعتوں کے گروہ سے موازنہ:</text><text class="cell" x="358" y="255" text-anchor="end">• کلاس پوزیشن: 40 طلبہ میں 28 واں نمبر</text><text class="cell" x="358" y="278" text-anchor="end">• پرسنٹائل رینک: 30 واں پرسنٹائل</text><text class="cell" x="358" y="301" text-anchor="end">• حیثیت: اعلیٰ کارکردگی والے اسکول میں</text><text class="cell" x="348" y="319" text-anchor="end">کلاس کی اوسط سے نیچے</text><text class="cell" x="358" y="345" text-anchor="end">• سوال: ”دیگر ہم جماعتوں کے مقابلے میں</text><text class="cell" x="348" y="363" text-anchor="end">زینب کی کارکردگی کیسی ہے؟“</text><text class="small" x="358" y="398" text-anchor="end">فوکس: چھانٹی، پوزیشن اور مسابقتی داخلے</text><rect class="panel-a" x="406" y="175" width="350" height="240" rx="8"/><text class="h" x="740" y="205" text-anchor="end">معیارِ کسوٹی تشریح</text><text class="sh" x="740" y="230" text-anchor="end">نصابی معیارات سے موازنہ:</text><text class="cell" x="740" y="255" text-anchor="end">• مہارت کی حیثیت: 70 فیصد کا کٹ آف پورا کیا</text><text class="cell" x="740" y="278" text-anchor="end">• قابلیت: کسر اور تناسب پر مکمل عبور</text><text class="cell" x="740" y="301" text-anchor="end">• خامی کی نشاندہی: الجبرا کے عبارت والے</text><text class="cell" x="730" y="319" text-anchor="end">سوالات میں مدد درکار ہے</text><text class="cell" x="740" y="345" text-anchor="end">• سوال: ”زینب اس وقت کن مخصوص نصابی</text><text class="cell" x="730" y="363" text-anchor="end">مہارتوں پر عبور رکھتی ہے؟“</text><text class="small" x="740" y="398" text-anchor="end">فوکس: قابلیت اور تعلیمی خامیوں کی تشخیص</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">ایک ہی اسکور کی دو تشریحی فریم ورکس کے تحت تفہیم</text><text id="label-caption" class="small" x="756" y="445" text-anchor="end">ایک تشریح نسبتی رینک بتاتی ہے؛ دوسری مخصوص نصابی مہارتوں کی تشخیص کرتی ہے۔</text><text class="wm" x="24" y="445" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
