<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تشکیلی تشخیص اور مجموعی جائزے کا تقابل</title><desc id="d">جدول جو تشکیلی اور مجموعی تشخیص کا مقصد، وقت، اہمیت، تاثرات کی قسم اور بنیادی صارفین کے لحاظ سے موازنہ کرتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="50" rx="8"/><line class="frame" x1="24" y1="105" x2="756" y2="105"/><line class="frame" x1="24" y1="170" x2="756" y2="170"/><line class="frame" x1="24" y1="230" x2="756" y2="230"/><line class="frame" x1="24" y1="290" x2="756" y2="290"/><line class="frame" x1="24" y1="355" x2="756" y2="355"/><line class="frame" x1="620" y1="55" x2="620" y2="415"/><line class="frame" x1="322" y1="55" x2="322" y2="415"/><text class="h" x="744" y="85" text-anchor="end">پہلو</text><text class="h" x="608" y="78" text-anchor="end">تشکیلی تشخیص</text><text class="small" x="608" y="96" text-anchor="end">سیکھنے کے لیے تشخیص</text><text class="h" x="310" y="78" text-anchor="end">مجموعی جائزہ</text><text class="small" x="310" y="96" text-anchor="end">سیکھنے کی تشخیص</text><text class="sh" x="744" y="130" text-anchor="end">مقصد</text><text class="cell" x="608" y="128" text-anchor="end">جاری سیکھنے کو بہتر بنانا؛ غلطیوں کی</text><text class="cell" x="608" y="146" text-anchor="end">نشاندہی کر کے تدریس میں ردوبدل لانا</text><text class="cell" x="310" y="128" text-anchor="end">مجموعی مہارت پرکھنا؛ سیکھنے کی</text><text class="cell" x="310" y="146" text-anchor="end">توثیق کرنا اور باقاعدہ گریڈ دینا</text><text class="sh" x="744" y="190" text-anchor="end">وقت</text><text class="cell" x="608" y="188" text-anchor="end">سیکھنے کے عمل کے دوران؛ مسلسل</text><text class="cell" x="608" y="206" text-anchor="end">اور روزمرہ اسباق میں شامل</text><text class="cell" x="310" y="188" text-anchor="end">کسی موضوع، یونٹ، میقات، سمسٹر</text><text class="cell" x="310" y="206" text-anchor="end">یا پورے تعلیمی سال کے اختتام پر</text><text class="sh" x="744" y="250" text-anchor="end">اہمیت / نتائج</text><text class="cell" x="608" y="248" text-anchor="end">کم خطرہ؛ غلطیوں پر کوئی تادیبی سزا نہیں؛</text><text class="cell" x="608" y="266" text-anchor="end">طلبہ کو سیکھنے کے رسک کی ترغیب</text><text class="cell" x="310" y="248" text-anchor="end">زیادہ اہمیت؛ رپورٹ کارڈ کے نمبروں، اگلی</text><text class="cell" x="310" y="266" text-anchor="end">جماعت میں ترقی اور اسناد کا فیصلہ</text><text class="sh" x="744" y="310" text-anchor="end">تاثرات</text><text class="cell" x="608" y="310" text-anchor="end">وضاحتی، معیاری اور مخصوص فیڈ فارورڈ</text><text class="cell" x="608" y="328" text-anchor="end">جو اگلے ٹھوس اقدامات کی نشاندہی کرے</text><text class="cell" x="310" y="310" text-anchor="end">قدری اور حتمی؛ نمبرز، لیٹر گریڈز</text><text class="cell" x="310" y="328" text-anchor="end">جو طلبہ کی کارکردگی ظاہر کریں</text><text class="sh" x="744" y="375" text-anchor="end">بنیادی صارفین</text><text class="cell" x="608" y="375" text-anchor="end">طلبہ (خود نگرانی کے لیے) اور</text><text class="cell" x="608" y="393" text-anchor="end">اساتذہ (تدریس کو ڈھالنے کے لیے)</text><text class="cell" x="310" y="375" text-anchor="end">والدین، اسکول انتظامیہ، تعلیمی</text><text class="cell" x="310" y="393" text-anchor="end">بورڈز اور پالیسی ساز ادارے</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">تشکیلی تشخیص اور مجموعی جائزے کے بنیادی امتیازات</text><text id="label-caption" class="small" x="756" y="440" text-anchor="end">تشکیلی تشخیص سیکھنے کو سنوارتی ہے؛ مجموعی جائزہ حاصل شدہ کامیابی ناپتا ہے۔</text><text class="wm" x="24" y="440" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
