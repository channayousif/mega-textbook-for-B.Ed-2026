<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معیارِ گروہ بمقابلہ معیارِ کسوٹی تشریحی فریم ورک کا انتخاب</title><desc id="d">جدول جو معیارِ گروہی اور معیارِ کسوٹی تشخیصی تشریحات کے مناسب تعلیمی سیاق و سباق، فوائد اور حدود کا خاکہ پیش کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="50" rx="8"/><line class="frame" x1="24" y1="105" x2="756" y2="105"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="250" x2="756" y2="250"/><line class="frame" x1="24" y1="330" x2="756" y2="330"/><line class="frame" x1="620" y1="55" x2="620" y2="415"/><line class="frame" x1="322" y1="55" x2="322" y2="415"/><text class="h" x="744" y="85" text-anchor="end">خصوصیت</text><text class="h" x="608" y="78" text-anchor="end">معیارِ گروہی تشریح</text><text class="small" x="608" y="96" text-anchor="end">ہم جماعتوں سے موازنہ</text><text class="h" x="310" y="78" text-anchor="end">معیارِ کسوٹی تشریح</text><text class="small" x="310" y="96" text-anchor="end">نصابی معیارات پر مہارت</text><text class="sh" x="744" y="130" text-anchor="end">بہترین استعمال</text><text class="cell" x="608" y="128" text-anchor="end">مسابقتی انتخاب، محدود نشستوں کا کوٹہ،</text><text class="cell" x="608" y="146" text-anchor="end">میرٹ وظائف اور امیدواروں کی رینکنگ</text><text class="cell" x="310" y="128" text-anchor="end">جماعتی تدریس، تعلیمی خامیوں کی تشخیص،</text><text class="cell" x="310" y="146" text-anchor="end">مہارت کی جانچ اور لائسنسنگ امتحانات</text><text class="sh" x="744" y="200" text-anchor="end">بنیادی فائدہ</text><text class="cell" x="608" y="198" text-anchor="end">نمبروں کو ایک تقسیم پر پھیلا دیتا ہے، جس سے</text><text class="cell" x="608" y="216" text-anchor="end">اعلیٰ اور کمزور کارکردگی میں واضح تفریق ہوتی ہے</text><text class="cell" x="310" y="198" text-anchor="end">یہ بتاتا ہے کہ طلبہ نے کن اہداف کو پا لیا ہے</text><text class="cell" x="310" y="216" text-anchor="end">اور کہاں مزید محنت کی ضرورت باقی ہے</text><text class="sh" x="744" y="275" text-anchor="end">اہم حد / کمزوری</text><text class="cell" x="608" y="273" text-anchor="end">یہ نہیں بتاتی کہ لازمی مہارت حاصل ہوئی یا نہیں؛</text><text class="cell" x="608" y="291" text-anchor="end">طلبہ میں غیر صحت مندانہ باہمی رقابت پیدا کرتی ہے</text><text class="cell" x="310" y="273" text-anchor="end">کارکردگی کے درست اور معتبر معیارات</text><text class="cell" x="310" y="291" text-anchor="end">(کٹ آف اسکور) طے کرنا سنجیدہ محنت مانگتا ہے</text><text class="sh" x="744" y="355" text-anchor="end">مثال</text><text class="cell" x="608" y="353" text-anchor="end">ایم ڈی کیٹ (MDCAT) داخلہ ٹیسٹ یا محدود</text><text class="cell" x="608" y="371" text-anchor="end">نشستوں کے لیے صوبائی مسابقتی امتحانات</text><text class="cell" x="310" y="353" text-anchor="end">سندھ ٹیچنگ لائسنس کا امتحان، ڈرائیونگ</text><text class="cell" x="310" y="371" text-anchor="end">ٹیسٹ، یا مہارتوں کی درسی چیک لسٹ</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">معیارِ گروہ اور معیارِ کسوٹی فریم ورکس کا انتخاب</text><text id="label-caption" class="small" x="756" y="440" text-anchor="end">اساتذہ کو روزمرہ جماعتی تدریس کے لیے معیارِ کسوٹی کو ترجیح دینی چاہیے۔</text><text class="wm" x="24" y="440" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
