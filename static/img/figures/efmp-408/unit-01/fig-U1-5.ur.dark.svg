<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیمی تشخیص کی کلیدی اصطلاحات کا تقابل</title><desc id="d">جدول جس میں آزمائش، پیمائش، قدر پیمائی، تشخیص اور جائزے کا ان کی تعریف، بنیادی سوال اور جماعتی مثال کے لحاظ سے موازنہ کیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="375" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="170" x2="756" y2="170"/><line class="frame" x1="24" y1="240" x2="756" y2="240"/><line class="frame" x1="24" y1="310" x2="756" y2="310"/><line class="frame" x1="24" y1="375" x2="756" y2="375"/><line class="frame" x1="610" y1="55" x2="610" y2="430"/><line class="frame" x1="360" y1="55" x2="360" y2="430"/><text class="h" x="744" y="83" text-anchor="end">اصطلاح</text><text class="h" x="596" y="83" text-anchor="end">بنیادی سوال جس کا یہ جواب دیتی ہے</text><text class="h" x="346" y="83" text-anchor="end">جماعتی مثال</text><text class="sh" x="744" y="125" text-anchor="end">آزمائش</text><text class="cell" x="596" y="125" text-anchor="end">طالب علم نے کارکردگی کا کون سا</text><text class="cell" x="596" y="145" text-anchor="end">مخصوص نمونہ پیش کیا؟</text><text class="cell" x="346" y="125" text-anchor="end">پانچویں جماعت کے ریاضی پیریڈ میں کسر کو</text><text class="cell" x="346" y="145" text-anchor="end">جمع کرنے پر 20 سوالات کا تحریری کوئز</text><text class="sh" x="744" y="195" text-anchor="end">پیمائش</text><text class="cell" x="596" y="195" text-anchor="end">طالب علم نے کتنا یا کس عددی حد تک</text><text class="cell" x="596" y="215" text-anchor="end">اسکور حاصل کیا؟</text><text class="cell" x="346" y="195" text-anchor="end">معروضی جوابی کلید کی بنیاد پر طالب علم</text><text class="cell" x="346" y="215" text-anchor="end">کا 20 میں سے 16 نمبر (80 فیصد) حاصل کرنا</text><text class="sh" x="744" y="265" text-anchor="end">قدر پیمائی</text><text class="cell" x="596" y="265" text-anchor="end">مشاہدہ کردہ صفات سے طالب علم کی</text><text class="cell" x="596" y="285" text-anchor="end">مجموعی قابلیت کا عمومی اندازہ کیا ہے؟</text><text class="cell" x="346" y="265" text-anchor="end">پروجیکٹ کے دوران زبانی جوابات، کاپی کی صفائی</text><text class="cell" x="346" y="285" text-anchor="end">اور گروہی باہمی تعاون کا جائزہ لینا</text><text class="sh" x="744" y="335" text-anchor="end">تشخیص</text><text class="cell" x="596" y="335" text-anchor="end">تمام ذرائع سے سیکھنے کے کون سے</text><text class="cell" x="596" y="355" text-anchor="end">شواہد اکٹھے کیے گئے ہیں؟</text><text class="cell" x="346" y="335" text-anchor="end">کل کے سبق میں بہتری کے لیے کوئز کے نتائج،</text><text class="cell" x="346" y="355" text-anchor="end">تشخیصی نوٹس اور طلبہ کی گفتگو کو یکجا کرنا</text><text class="sh" x="744" y="400" text-anchor="end">جائزہ</text><text class="cell" x="596" y="400" text-anchor="end">طے شدہ معیارات کے مقابلے میں یہ</text><text class="cell" x="596" y="418" text-anchor="end">کارکردگی کیسی ہے؟</text><text class="cell" x="346" y="400" text-anchor="end">یہ فیصلہ کرنا کہ کیا طالب علم اگلے یونٹ میں</text><text class="cell" x="346" y="418" text-anchor="end">جانے کے لیے درکار گریڈ معیارات پر پورا اترتا ہے</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">تعلیمی تشخیص کی پانچ بنیادی اصطلاحات کا تقابل</text><text id="label-caption" class="small" x="756" y="450" text-anchor="end">ٹیسٹ اعداد دیتا ہے؛ تشخیص شواہد اکٹھی کرتی ہے؛ جائزہ قدری فیصلے صادر کرتا ہے۔</text><text class="wm" x="24" y="450" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
