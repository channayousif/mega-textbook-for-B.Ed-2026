<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart: formative and summative assessment in an instructional cycle</title><desc id="d">Flowchart showing the instructional cycle from learning objectives through formative checks and instructional adjustments to end-of-unit summative assessment.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="540"/><g id="layer-flow"><rect class="panel" x="250" y="55" width="280" height="50" rx="8"/><text class="sh" x="390" y="85" text-anchor="middle">1. Define Learning Objectives</text><line class="stroke" x1="390" y1="105" x2="390" y2="135" marker-end="url(#arrow)"/><rect class="panel-a" x="230" y="135" width="320" height="55" rx="8"/><text class="sh" x="390" y="160" text-anchor="middle">2. Classroom Instruction &amp; Activities</text><text class="cell" x="390" y="178" text-anchor="middle">Teaching concepts and guided practice</text><line class="stroke" x1="390" y1="190" x2="390" y2="220" marker-end="url(#arrow)"/><rect class="panel-b" x="210" y="220" width="360" height="55" rx="8"/><text class="sh" x="390" y="245" text-anchor="middle">3. Formative Assessment Check</text><text class="cell" x="390" y="263" text-anchor="middle">Low-stakes questioning, slates, exit tickets</text><line class="stroke" x1="390" y1="275" x2="390" y2="305" marker-end="url(#arrow)"/><polygon class="panel-c" points="390,305 490,345 390,385 290,345"/><text class="sh" x="390" y="342" text-anchor="middle">Mastery</text><text class="sh" x="390" y="358" text-anchor="middle">Demonstrated?</text><line class="stroke" x1="290" y1="345" x2="160" y2="345" marker-end="url(#arrow)"/><text class="sh" x="210" y="335">No</text><rect class="panel-c" x="30" y="315" width="130" height="60" rx="8"/><text class="sh" x="95" y="340" text-anchor="middle">Adapt Teaching</text><text class="cell" x="95" y="358" text-anchor="middle">&amp; Feedforward</text><path class="dash" d="M 95 315 L 95 162 L 225 162" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="385" x2="390" y2="415" marker-end="url(#arrow)"/><text class="sh" x="405" y="405">Yes</text><rect class="panel-a" x="230" y="415" width="320" height="60" rx="8"/><text class="sh" x="390" y="440" text-anchor="middle">4. Summative Assessment</text><text class="cell" x="390" y="458" text-anchor="middle">End-of-unit test, cumulative project, grade report</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Placement of formative and summative assessment in a teaching cycle</text><text id="label-caption" class="small" x="24" y="505">Formative loops shape instruction during learning; summative evaluates cumulative achievement.</text><text class="wm" x="768" y="525" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
