<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Comparison of key terms in educational assessment</title><desc id="d">Table comparing test, measurement, appraisal, assessment and evaluation by definition, the core question each answers, and a classroom example.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="375" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="45" rx="8"/><line class="frame" x1="24" y1="100" x2="756" y2="100"/><line class="frame" x1="24" y1="170" x2="756" y2="170"/><line class="frame" x1="24" y1="240" x2="756" y2="240"/><line class="frame" x1="24" y1="310" x2="756" y2="310"/><line class="frame" x1="24" y1="375" x2="756" y2="375"/><line class="frame" x1="150" y1="55" x2="150" y2="430"/><line class="frame" x1="390" y1="55" x2="390" y2="430"/><text class="h" x="35" y="83">Term</text><text class="h" x="165" y="83">Core Question it Answers</text><text class="h" x="405" y="83">Typical Classroom Example</text><text class="sh" x="35" y="125">Test</text><text class="cell" x="165" y="125">What specific performance sample</text><text class="cell" x="165" y="145">did the student produce?</text><text class="cell" x="405" y="125">A 20-item written quiz on fraction addition</text><text class="cell" x="405" y="145">administered in a Class 5 mathematics period</text><text class="sh" x="35" y="195">Measurement</text><text class="cell" x="165" y="195">How much or to what numerical</text><text class="cell" x="165" y="215">degree did the student score?</text><text class="cell" x="405" y="195">A student scores 16 out of 20 marks (80%)</text><text class="cell" x="405" y="215">based on objective scoring keys</text><text class="sh" x="35" y="265">Appraisal</text><text class="cell" x="165" y="265">What is the overall impression of</text><text class="cell" x="165" y="285">competence across observed traits?</text><text class="cell" x="405" y="265">Reviewing oral responses, notebook neatness</text><text class="cell" x="405" y="285">and group collaboration during project work</text><text class="sh" x="35" y="335">Assessment</text><text class="cell" x="165" y="335">What learning evidence has been</text><text class="cell" x="165" y="355">gathered across all sources?</text><text class="cell" x="405" y="335">Synthesising quiz results, diagnostic notes</text><text class="cell" x="405" y="355">and peer discussions to adapt tomorrow's lesson</text><text class="sh" x="35" y="400">Evaluation</text><text class="cell" x="165" y="400">How good, adequate or successful</text><text class="cell" x="165" y="418">is this learning against standards?</text><text class="cell" x="405" y="400">Deciding whether the student meets grade-level</text><text class="cell" x="405" y="418">competencies to advance to the next unit</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Core questions and examples across five assessment terms</text><text id="label-caption" class="small" x="24" y="450">A test produces numbers; assessment gathers evidence; evaluation delivers value judgments.</text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
