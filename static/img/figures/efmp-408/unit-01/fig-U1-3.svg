<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Interpreting a test score: norm-referenced versus criterion-referenced</title><desc id="d">Diagram comparing a score of 72 percent interpreted against a norm group ranking versus against a criterion benchmark of 70 percent mastery.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="480"/><g id="layer-score"><rect class="panel-c" x="270" y="55" width="240" height="65" rx="8"/><text class="h" x="390" y="85" text-anchor="middle">Student Score: 72%</text><text class="cell" x="390" y="105" text-anchor="middle">(36 out of 50 items correct)</text><line class="stroke" x1="330" y1="120" x2="200" y2="170" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="120" x2="580" y2="170" marker-end="url(#arrow)"/></g><g id="layer-interpretations"><rect class="panel-b" x="24" y="175" width="350" height="240" rx="8"/><text class="h" x="40" y="205">Norm-Referenced Frame</text><text class="sh" x="40" y="230">Comparison against peer group:</text><text class="cell" x="40" y="255">• Class rank: 28th out of 40 students</text><text class="cell" x="40" y="278">• Percentile rank: 30th percentile</text><text class="cell" x="40" y="301">• Standing: Below class average in a</text><text class="cell" x="50" y="319">high-performing urban school cohort</text><text class="cell" x="40" y="345">• Question: "How does Zainab perform</text><text class="cell" x="50" y="363">relative to other classmates?"</text><text class="small" x="40" y="398">Focus: Sorting, ranking, and admission</text><rect class="panel-a" x="406" y="175" width="350" height="240" rx="8"/><text class="h" x="422" y="205">Criterion-Referenced Frame</text><text class="sh" x="422" y="230">Comparison against standards:</text><text class="cell" x="422" y="255">• Mastery status: Met 70% passing cutoff</text><text class="cell" x="422" y="278">• Competence: Mastered fractions and ratios</text><text class="cell" x="422" y="301">• Deficit identified: Needs help on</text><text class="cell" x="432" y="319">algebraic word problems</text><text class="cell" x="422" y="345">• Question: "What curricular skills can</text><text class="cell" x="432" y="363">Zainab demonstrate right now?"</text><text class="small" x="422" y="398">Focus: Competence and learning diagnosis</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Interpreting the same score across two reference frames</text><text id="label-caption" class="small" x="24" y="445">One interpretation measures relative rank; the other diagnoses specific competencies.</text><text class="wm" x="768" y="465" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
