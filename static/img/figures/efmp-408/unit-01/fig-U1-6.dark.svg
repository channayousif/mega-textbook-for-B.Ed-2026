<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Formative versus summative assessment comparison</title><desc id="d">Table comparing formative and summative assessment across purpose, timing, stakes, feedback type, and primary users.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="50" rx="8"/><line class="frame" x1="24" y1="105" x2="756" y2="105"/><line class="frame" x1="24" y1="170" x2="756" y2="170"/><line class="frame" x1="24" y1="230" x2="756" y2="230"/><line class="frame" x1="24" y1="290" x2="756" y2="290"/><line class="frame" x1="24" y1="355" x2="756" y2="355"/><line class="frame" x1="160" y1="55" x2="160" y2="415"/><line class="frame" x1="458" y1="55" x2="458" y2="415"/><text class="h" x="35" y="85">Dimension</text><text class="h" x="175" y="78">Formative Assessment</text><text class="small" x="175" y="96">Assessment for Learning</text><text class="h" x="473" y="78">Summative Assessment</text><text class="small" x="473" y="96">Assessment of Learning</text><text class="sh" x="35" y="130">Purpose</text><text class="cell" x="175" y="128">Improve and shape ongoing learning;</text><text class="cell" x="175" y="146">diagnose misconceptions and adapt moves</text><text class="cell" x="473" y="128">Evaluate cumulative mastery; certify</text><text class="cell" x="473" y="146">learning and assign formal grades</text><text class="sh" x="35" y="190">Timing</text><text class="cell" x="175" y="188">During the learning process; continuous</text><text class="cell" x="175" y="206">and embedded in day-to-day lessons</text><text class="cell" x="473" y="188">At the end of a topic, unit, term,</text><text class="cell" x="473" y="206">semester, or academic school year</text><text class="sh" x="35" y="250">Stakes</text><text class="cell" x="175" y="248">Low stakes; no penalty for errors;</text><text class="cell" x="175" y="266">encourages student risk-taking</text><text class="cell" x="473" y="248">High stakes; determines report cards,</text><text class="cell" x="473" y="266">promotion, certificates, and awards</text><text class="sh" x="35" y="310">Feedback</text><text class="cell" x="175" y="310">Descriptive, qualitative, specific</text><text class="cell" x="175" y="328">feedforward pointing to next steps</text><text class="cell" x="473" y="310">Evaluative; scores, letter grades</text><text class="cell" x="473" y="328">or marks comparing performance</text><text class="sh" x="35" y="375">Primary Users</text><text class="cell" x="175" y="375">Students (to self-monitor) and</text><text class="cell" x="175" y="393">teachers (to adjust pedagogy)</text><text class="cell" x="473" y="375">Parents, school administrators,</text><text class="cell" x="473" y="393">education boards, and policy-makers</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Key distinctions between formative and summative assessment</text><text id="label-caption" class="small" x="24" y="440">Formative assessment fosters learning; summative measures cumulative achievement.</text><text class="wm" x="768" y="455" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
