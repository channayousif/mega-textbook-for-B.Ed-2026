<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of nested scopes: test, measurement, assessment and evaluation</title><desc id="d">Concept map showing test as a tool within measurement, measurement as quantitative data within assessment, and assessment as information interpreted within educational evaluation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-boxes"><rect class="panel" x="40" y="55" width="700" height="85" rx="8"/><text class="h" x="56" y="82">1. Educational Evaluation (Broadest Scope)</text><text class="cell" x="56" y="104">Qualitative judgment of worth, value or adequacy; making promotion and curriculum decisions</text><text class="cell" x="56" y="122">Example: Deciding whether a student meets Sindh curriculum standards for Class 7 promotion</text><line class="stroke" x1="390" y1="140" x2="390" y2="160" marker-end="url(#arrow)"/><rect class="panel-b" x="70" y="160" width="640" height="85" rx="8"/><text class="sh" x="86" y="188">2. Educational Assessment (Evidence-Gathering Scope)</text><text class="cell" x="86" y="210">All systematic methods of collecting student learning data (dialogue, work samples, tests)</text><text class="cell" x="86" y="228">Example: Reviewing science quiz answers, notebook work, and lab observations together</text><line class="stroke" x1="390" y1="245" x2="390" y2="265" marker-end="url(#arrow)"/><rect class="panel-a" x="90" y="265" width="600" height="80" rx="8"/><text class="sh" x="106" y="293">3. Measurement (Quantitative Dimension)</text><text class="cell" x="106" y="315">Assigning numbers to student performance according to explicit scoring rules</text><text class="cell" x="106" y="333">Example: Calculating a score of 38 marks out of 50 (76%) on a written test</text><line class="stroke" x1="390" y1="345" x2="390" y2="365" marker-end="url(#arrow)"/><rect class="panel-c" x="90" y="365" width="600" height="80" rx="8"/><text class="sh" x="106" y="393">4. Test (Specific Instrument)</text><text class="cell" x="106" y="413">A standardized instrument administered under uniform conditions</text><text class="cell" x="106" y="431">Example: A 25-item paper-and-pencil test on plant biology given to Class 6</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Nested scopes of measurement, test, assessment and evaluation</text><text id="label-caption" class="small" x="24" y="468">Each inner level supplies evidence to the broader educational decision process above it.</text><text class="wm" x="768" y="488" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
