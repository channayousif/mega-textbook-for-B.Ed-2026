<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">When to use norm-referenced versus criterion-referenced frames</title><desc id="d">Table outlining the appropriate educational contexts, benefits, and limitations of norm-referenced and criterion-referenced assessment interpretations.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><rect class="bg" x="0" y="0" width="780" height="470"/><g id="layer-table"><rect class="panel" x="24" y="55" width="732" height="360" rx="8"/><rect class="panel-a" x="24" y="55" width="732" height="50" rx="8"/><line class="frame" x1="24" y1="105" x2="756" y2="105"/><line class="frame" x1="24" y1="175" x2="756" y2="175"/><line class="frame" x1="24" y1="250" x2="756" y2="250"/><line class="frame" x1="24" y1="330" x2="756" y2="330"/><line class="frame" x1="160" y1="55" x2="160" y2="415"/><line class="frame" x1="458" y1="55" x2="458" y2="415"/><text class="h" x="35" y="85">Feature</text><text class="h" x="175" y="78">Norm-Referenced Frame</text><text class="small" x="175" y="96">Peer Comparison Lens</text><text class="h" x="473" y="78">Criterion-Referenced Frame</text><text class="small" x="473" y="96">Standards Mastery Lens</text><text class="sh" x="35" y="130">Best Used For</text><text class="cell" x="175" y="128">Competitive selection, fixed quotas,</text><text class="cell" x="175" y="146">merit awards, and candidate ranking</text><text class="cell" x="473" y="128">Classroom learning diagnosis, competency</text><text class="cell" x="473" y="146">mastery, and licensing examinations</text><text class="sh" x="35" y="200">Core Benefit</text><text class="cell" x="175" y="198">Spreads scores across a distribution,</text><text class="cell" x="175" y="216">clearly separating highest from lowest</text><text class="cell" x="473" y="198">Informs exactly what learning targets</text><text class="cell" x="473" y="216">pupils reached and where gaps remain</text><text class="sh" x="35" y="275">Key Limitation</text><text class="cell" x="175" y="273">Cannot show if essential skills were</text><text class="cell" x="175" y="291">mastered; fosters unhelpful peer rivalry</text><text class="cell" x="473" y="273">Setting valid performance standards</text><text class="cell" x="473" y="291">(cut scores) requires rigorous criteria</text><text class="sh" x="35" y="355">Example</text><text class="cell" x="175" y="353">MDCAT entrance test or provincial</text><text class="cell" x="175" y="371">competitive examinations for fixed seats</text><text class="cell" x="473" y="353">Sindh Teaching Licence Examination,</text><text class="cell" x="473" y="371">driving test, or competency checklist</text></g><g id="layer-labels"><text id="label-title" class="h" x="24" y="34">Choosing between norm-referenced and criterion-referenced frames</text><text id="label-caption" class="small" x="24" y="440">Teachers should prioritise criterion referencing for day-to-day classroom teaching.</text><text class="wm" x="768" y="455" text-anchor="end" aria-hidden="true">textbook.com.pk</text></g></svg>
