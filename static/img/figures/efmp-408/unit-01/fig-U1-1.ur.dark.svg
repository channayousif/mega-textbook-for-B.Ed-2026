<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آزمائش، پیمائش، تشخیص اور جائزے کے اندرونی دائروں کا تصوراتی خاکہ</title><desc id="d">تصوراتی خاکہ جو پیمائش کے اندر آزمائش کو ایک آلے کے طور پر، تشخیص کے اندر پیمائش کو مقداری اعداد و شمار کے طور پر، اور تعلیمی جائزے کے اندر تشخیص کو تشریح شدہ معلومات کے طور پر ظاہر کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671}
.bg { fill: var(--bg); }
.panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
.panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; }
.panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; }
.panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; }
.stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; }
.frame { stroke: var(--ink); stroke-width: 2; fill: none; }
text { font-size: 14px; fill: var(--ink); }
.h { font-size: 16px; font-weight: 700; fill: var(--ink); }
.sh { font-size: 14px; font-weight: 600; fill: var(--ink); }
.body { font-size: 14px; fill: var(--ink); }
.cell { font-size: 13px; fill: var(--ink); }
.small { font-size: 13px; fill: var(--muted); }
.wm { fill: var(--wm); font-size: 11px; }
.ah { fill: var(--ink); }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="500"/><g id="layer-boxes"><rect class="panel" x="40" y="55" width="700" height="85" rx="8"/><text class="h" x="724" y="82" text-anchor="end">1. تعلیمی جائزہ (سب سے وسیع دائرہ کار)</text><text class="cell" x="724" y="104" text-anchor="end">معیار، افادیت یا موزونیت کا قدری فیصلہ؛ اگلی جماعت میں ترقی اور نصابی فیصلے</text><text class="cell" x="724" y="122" text-anchor="end">مثال: یہ فیصلہ کرنا کہ آیا طالب علم ساتویں جماعت کے سندھ نصابی معیارات پر پورا اترتا ہے</text><line class="stroke" x1="390" y1="140" x2="390" y2="160" marker-end="url(#arrow)"/><rect class="panel-b" x="70" y="160" width="640" height="85" rx="8"/><text class="sh" x="694" y="188" text-anchor="end">2. تعلیمی تشخیص (شواہد اکٹھا کرنے کا دائرہ)</text><text class="cell" x="694" y="210" text-anchor="end">سیکھنے کے اعداد و شمار جمع کرنے کے تمام منظم طریقے (مکالمہ، کام کے نمونے، امتحانات)</text><text class="cell" x="694" y="228" text-anchor="end">مثال: سائنس کوئز کے جوابات، کاپیوں کا کام اور لیب مشاہدات کا بیک وقت معائنہ</text><line class="stroke" x1="390" y1="245" x2="390" y2="265" marker-end="url(#arrow)"/><rect class="panel-a" x="90" y="265" width="600" height="80" rx="8"/><text class="sh" x="674" y="293" text-anchor="end">3. پیمائش (مقداری پہلو)</text><text class="cell" x="674" y="315" text-anchor="end">طے شدہ اصولوں کے مطابق طلبہ کی کارکردگی کو عددی نمبر تفویض کرنا</text><text class="cell" x="674" y="333" text-anchor="end">مثال: تحریری ٹیسٹ میں 50 میں سے 38 نمبر (76 فیصد) کا عددی حساب لگانا</text><line class="stroke" x1="390" y1="345" x2="390" y2="365" marker-end="url(#arrow)"/><rect class="panel-c" x="90" y="365" width="600" height="80" rx="8"/><text class="sh" x="674" y="393" text-anchor="end">4. آزمائش / ٹیسٹ (مخصوص آلہ)</text><text class="cell" x="674" y="413" text-anchor="end">یکساں حالات میں منعقد کیا جانے والا ایک معیاری امتحانی آلہ</text><text class="cell" x="674" y="431" text-anchor="end">مثال: پودوں کے حیاتیاتی علم پر چھٹی جماعت کو دیا جانے والا 25 سوالات کا پرچہ</text></g><g id="layer-labels"><text id="label-title" class="h" x="756" y="34" text-anchor="end">آزمائش، پیمائش، تشخیص اور جائزے کے اندرونی دائرے</text><text id="label-caption" class="small" x="756" y="468" text-anchor="end">ہر اندرونی سطح اپنے سے اوپر کے وسیع تر تعلیمی فیصلے کے لیے شواہد فراہم کرتی ہے۔</text><text class="wm" x="24" y="468" text-anchor="start" font-family="system-ui, sans-serif" aria-hidden="true">textbook.com.pk</text></g></svg>
