<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five digital citizen rights with matching responsibilities</title><desc id="d">Table of five digital citizen rights, each with its matching responsibility and one classroom example.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">Rights arrive tied to responsibilities</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="240" y1="52" x2="240" y2="432"/><line class="grid" x1="500" y1="52" x2="500" y2="432"/><line class="grid" x1="16" y1="92" x2="764" y2="92"/><line class="grid" x1="16" y1="152" x2="764" y2="152"/><line class="grid" x1="16" y1="212" x2="764" y2="212"/><line class="grid" x1="16" y1="272" x2="764" y2="272"/><line class="grid" x1="16" y1="332" x2="764" y2="332"/><line class="grid" x1="16" y1="392" x2="764" y2="392"/><rect class="frame" x="16" y="52" width="748" height="380"/><text class="h" x="128" y="77" text-anchor="middle">A citizen's right</text><text class="h" x="370" y="77" text-anchor="middle">The matching responsibility</text><text class="h" x="632" y="77" text-anchor="middle">One classroom example</text><text class="body" x="26" y="118" font-weight="600">to learn and express</text><text class="body" x="26" y="134" font-weight="600">yourself online</text><text class="body" x="252" y="126">to express yourself without harming others</text><text class="body" x="512" y="118">disagree with a view,</text><text class="body" x="512" y="134">not mock the person</text><text class="body" x="26" y="178" font-weight="600">to keep your data private</text><text class="body" x="252" y="172">to respect others' data as you</text><text class="body" x="252" y="188">want yours respected</text><text class="body" x="512" y="178">do not forward a classmate's</text><text class="body" x="512" y="194">photo without asking</text><text class="body" x="26" y="238" font-weight="600">to access information</text><text class="body" x="252" y="232">to check before you share</text><text class="body" x="512" y="232">verify a forwarded claim</text><text class="body" x="512" y="248">before passing it on</text><text class="body" x="26" y="298" font-weight="600">to be free from harassment</text><text class="body" x="252" y="292">to report harassment</text><text class="body" x="252" y="308">you witness</text><text class="body" x="512" y="292">screenshot and tell a teacher</text><text class="body" x="512" y="308">instead of laughing along</text><text class="body" x="26" y="358" font-weight="600">to use school devices</text><text class="body" x="252" y="352">to use them for</text><text class="body" x="252" y="368">learning purposes</text><text class="body" x="512" y="358">the lab computer is not</text><text class="body" x="512" y="374">for personal chats</text><text class="small" x="390" y="424" text-anchor="middle">Read each row across: the right you hold, the duty it brings, and what it looks like in class.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
