<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ ڈیجیٹل شہری حقوق کا جدول، ذمہ داریوں کے ساتھ</title><desc id="d">پانچ ڈیجیٹل شہری حقوق کا جدول، ہر ایک کے ساتھ اس کی ذمہ داری اور ایک کلاس روم مثال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">حقوق ذمہ داریوں کے ساتھ آتے ہیں</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="540" y1="52" x2="540" y2="432"/><line class="grid" x1="280" y1="52" x2="280" y2="432"/><line class="grid" x1="764" y1="92" x2="16" y2="92"/><line class="grid" x1="764" y1="152" x2="16" y2="152"/><line class="grid" x1="764" y1="212" x2="16" y2="212"/><line class="grid" x1="764" y1="272" x2="16" y2="272"/><line class="grid" x1="764" y1="332" x2="16" y2="332"/><line class="grid" x1="764" y1="392" x2="16" y2="392"/><rect class="frame" x="16" y="52" width="748" height="380"/><text class="h" x="652" y="77" text-anchor="middle">شہری کا حق</text><text class="h" x="410" y="77" text-anchor="middle">متعلقہ ذمہ داری</text><text class="h" x="148" y="77" text-anchor="middle">ایک کلاس روم مثال</text><text class="body" x="754" y="118" font-weight="600" text-anchor="end">سیکھنے اور اظہار</text><text class="body" x="754" y="134" font-weight="600" text-anchor="end">کرنے کا حق</text><text class="body" x="528" y="126" text-anchor="end">ایسا اظہار جو دوسروں کو نقصان نہ پہنچائے</text><text class="body" x="268" y="118" text-anchor="end">رائے سے اختلاف کریں،</text><text class="body" x="268" y="134" text-anchor="end">شخص کا مذاق نہ اڑائیں</text><text class="body" x="754" y="178" font-weight="600" text-anchor="end">اپنا ڈیٹا نجی رکھنے کا حق</text><text class="body" x="528" y="172" text-anchor="end">دوسروں کے ڈیٹے کا وہی احترام</text><text class="body" x="528" y="188" text-anchor="end">کریں جو اپنے لیے چاہتے ہیں</text><text class="body" x="268" y="178" text-anchor="end">کسی ساتھی کی تصویر بغیر</text><text class="body" x="268" y="194" text-anchor="end">پوچھے آگے نہ بھیجیں</text><text class="body" x="754" y="238" font-weight="600" text-anchor="end">معلومات تک رسائی کا حق</text><text class="body" x="528" y="232" text-anchor="end">شیئر سے پہلے جانچنا</text><text class="body" x="268" y="232" text-anchor="end">آگے بھیجے دعوے کی تصدیق</text><text class="body" x="268" y="248" text-anchor="end">کر کے آگے بڑھیں</text><text class="body" x="754" y="298" font-weight="600" text-anchor="end">ہراسانی سے پاک ہونے کا حق</text><text class="body" x="528" y="292" text-anchor="end">دیکھی ہوئی ہراسانی</text><text class="body" x="528" y="308" text-anchor="end">کی اطلاع دینا</text><text class="body" x="268" y="292" text-anchor="end">اسکرین شاٹ لیں اور استاد کو بتائیں،</text><text class="body" x="268" y="308" text-anchor="end">ساتھ ہنسنے کے بجائے</text><text class="body" x="754" y="358" font-weight="600" text-anchor="end">اسکول ڈیوائسیں استعمال کرنے کا حق</text><text class="body" x="528" y="352" text-anchor="end">انہیں تعلیمی</text><text class="body" x="528" y="368" text-anchor="end">مقصد کے لیے استعمال کرنا</text><text class="body" x="268" y="358" text-anchor="end">لیب کمپیوٹر ذاتی</text><text class="body" x="268" y="374" text-anchor="end">گپ شپ کے لیے نہیں</text><text class="small" x="390" y="424" text-anchor="middle">ہر قطار پڑھیں: آپ کا حق، اس کی ذمہ داری، اور کلاس میں اس کی شکل۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
