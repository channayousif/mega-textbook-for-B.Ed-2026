<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six situations with the netiquette rule for each</title><desc id="d">Table of six situations with the netiquette rule for each and why it matters.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">Netiquette: six situations, six rules</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="206" y1="52" x2="206" y2="432"/><line class="grid" x1="466" y1="52" x2="466" y2="432"/><line class="grid" x1="16" y1="92" x2="764" y2="92"/><line class="grid" x1="16" y1="152" x2="764" y2="152"/><line class="grid" x1="16" y1="212" x2="764" y2="212"/><line class="grid" x1="16" y1="272" x2="764" y2="272"/><line class="grid" x1="16" y1="332" x2="764" y2="332"/><line class="grid" x1="16" y1="392" x2="764" y2="392"/><rect class="frame" x="16" y="52" width="748" height="380"/><text class="h" x="111" y="77" text-anchor="middle">Situation</text><text class="h" x="336" y="77" text-anchor="middle">The netiquette rule</text><text class="h" x="615" y="77" text-anchor="middle">Why it matters</text><text class="body" x="26" y="118" font-weight="600">writing an email</text><text class="body" x="218" y="112">greet, state the matter,</text><text class="body" x="218" y="128">sign your name</text><text class="body" x="478" y="112">an unnamed message</text><text class="body" x="478" y="128">reads as a demand</text><text class="body" x="26" y="178" font-weight="600">a class chat</text><text class="body" x="218" y="172">keep it about the lesson,</text><text class="body" x="218" y="188">use school hours</text><text class="body" x="478" y="172">what you type at midnight</text><text class="body" x="478" y="188">arrives instantly, forever</text><text class="body" x="26" y="238" font-weight="600">replying when angry</text><text class="body" x="218" y="232">wait, then write; or</text><text class="body" x="218" y="248">draft and delete</text><text class="body" x="478" y="232">heat writes things</text><text class="body" x="478" y="248">calm would not</text><text class="body" x="26" y="298" font-weight="600">a discussion forum</text><text class="body" x="218" y="292">respond to the idea,</text><text class="body" x="218" y="308">not the person</text><text class="body" x="478" y="292">disagreement survives,</text><text class="body" x="478" y="308">insults end the discussion</text><text class="body" x="26" y="358" font-weight="600">forwarding messages</text><text class="body" x="218" y="352">check first,</text><text class="body" x="218" y="368">then forward</text><text class="body" x="478" y="352">your name carries what</text><text class="body" x="478" y="368">you pass on</text><text class="body" x="26" y="418" font-weight="600">using capitals</text><text class="body" x="218" y="418">avoid whole messages in capitals</text><text class="body" x="478" y="418">capitals read as shouting</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
