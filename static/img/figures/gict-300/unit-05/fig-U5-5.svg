<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the safe-assignment workflow</title><desc id="d">Flowchart of the safe-assignment workflow: note in your own words, compare with the source, paraphrase again if still close, then cite - with a side box noting that direct words need quotation marks plus citation.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .note{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The safe-assignment workflow</text><text class="small" x="390" y="64" text-anchor="middle">Four steps from reading a source to an honest summary</text><rect class="panel" x="30" y="180" width="150" height="80"/><text class="body" x="105" y="210" text-anchor="middle" font-weight="600">take notes in</text><text class="body" x="105" y="230" text-anchor="middle" font-weight="600">your own words</text><rect class="panel" x="215" y="180" width="150" height="80"/><text class="body" x="290" y="204" text-anchor="middle" font-weight="600">compare your text</text><text class="body" x="290" y="224" text-anchor="middle" font-weight="600">with the source</text><text class="small" x="290" y="246" text-anchor="middle">does the skeleton show?</text><rect class="panel" x="400" y="180" width="150" height="80"/><text class="body" x="475" y="204" text-anchor="middle" font-weight="600">still close?</text><text class="body" x="475" y="224" text-anchor="middle" font-weight="600">paraphrase again</text><text class="small" x="475" y="246" text-anchor="middle">until only the idea is borrowed</text><rect class="panel-b" x="585" y="180" width="150" height="80"/><text class="body" x="660" y="210" text-anchor="middle" font-weight="600">cite the</text><text class="body" x="660" y="230" text-anchor="middle" font-weight="600">source</text><line class="stroke" x1="180" y1="220" x2="207" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="365" y1="220" x2="392" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="550" y1="220" x2="577" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="475" y1="260" x2="290" y2="296" marker-end="url(#arrow)"/><text class="small" x="360" y="292" text-anchor="middle">back if the skeleton still shows</text><rect class="note" x="470" y="330" width="280" height="64"/><text class="body" x="610" y="354" text-anchor="middle" font-weight="600">for direct words:</text><text class="body" x="610" y="374" text-anchor="middle">quotation marks plus citation</text><path class="stroke" d="M 660 260 V 330" fill="none" marker-end="url(#arrow)"/><text class="small" x="390" y="440" text-anchor="middle">The test: a reader can tell, at every sentence, which words and ideas are yours and which are borrowed.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
