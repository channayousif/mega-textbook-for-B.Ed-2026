<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ: ڈیجیٹل شہریت درمیان میں، تین شاخیں</title><desc id="d">تصوراتی نقشہ: ڈیجیٹل شہریت درمیان میں اور تین شاخیں - احترام، تعلیم اور تحفظ - ہر ایک کے ساتھ دو مثالیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .center{fill:var(--a4-fill);stroke:var(--a4);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">ڈیجیٹل شہریت کے پہلو</text><text class="small" x="390" y="64" text-anchor="middle">حقوق اور ذمہ داریاں، ساتھ ساتھ</text><ellipse class="center" cx="390" cy="255" rx="115" ry="48"/><text class="body" x="390" y="249" text-anchor="middle" font-weight="600">ڈیجیٹل</text><text class="body" x="390" y="269" text-anchor="middle" font-weight="600">شہریت</text><rect class="panel-a" x="535" y="120" width="205" height="90"/><text class="body" x="638" y="148" text-anchor="middle" font-weight="600">احترام</text><text class="small" x="638" y="170" text-anchor="middle">ڈیجیٹل آداب</text><text class="small" x="638" y="188" text-anchor="middle">ڈیجیٹل رسائی</text><rect class="panel-b" x="287" y="95" width="205" height="86"/><text class="body" x="390" y="123" text-anchor="middle" font-weight="600">تعلیم</text><text class="small" x="390" y="145" text-anchor="middle">ڈیجیٹل خواندگی</text><text class="small" x="390" y="163" text-anchor="middle">ڈیجیٹل مواصلات</text><rect class="panel-c" x="40" y="120" width="205" height="90"/><text class="body" x="143" y="148" text-anchor="middle" font-weight="600">تحفظ</text><text class="small" x="143" y="170" text-anchor="middle">حقوق و ذمہ داریاں،</text><text class="small" x="143" y="188" text-anchor="middle">سیکیورٹی، ڈیجیٹل صحت</text><line class="stroke" x1="560" y1="190" x2="480" y2="226" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="181" x2="390" y2="197" marker-end="url(#arrow)"/><line class="stroke" x1="220" y1="190" x2="300" y2="226" marker-end="url(#arrow)"/><text class="small" x="390" y="400" text-anchor="middle">ہر حق ایک ذمہ داری کے ساتھ آتا ہے: اظہار کے ساتھ عدم نقصان،</text><text class="small" x="390" y="420" text-anchor="middle">رازداری کے ساتھ دوسروں کے ڈیٹے کا احترام، معلومات کے ساتھ ان کی جانچ۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
