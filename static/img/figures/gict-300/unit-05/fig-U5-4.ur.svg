<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین کونوں والا مثلث خاکہ</title><desc id="d">مثلث خاکہ تین کونوں کے ناموں کے ساتھ - پڑھنے والا، مقصد اور سیاق - اور نیچے لکھا: بھیجنے سے پہلے اپنا مسودہ تینوں کونوں سے پڑھیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">لہجے کی مثلث</text><text class="small" x="390" y="64" text-anchor="middle">بھیجنے سے پہلے اپنا مسودہ ہر کونے سے ایک بار جانچیں</text><polygon class="stroke" points="390,110 590,360 190,360" fill="none"/><rect class="panel-a" x="300" y="80" width="180" height="52"/><text class="body" x="390" y="102" text-anchor="middle" font-weight="600">پڑھنے والا</text><text class="small" x="390" y="122" text-anchor="middle">کون پڑھے گا، اور کس مزاج میں؟</text><rect class="panel-b" x="560" y="330" width="190" height="70"/><text class="body" x="655" y="356" text-anchor="middle" font-weight="600">مقصد</text><text class="small" x="655" y="376" text-anchor="middle">مجھے کیا چاہیے</text><text class="small" x="655" y="392" text-anchor="middle">کہ ہو؟</text><rect class="panel-c" x="30" y="330" width="190" height="70"/><text class="body" x="125" y="356" text-anchor="middle" font-weight="600">سیاق</text><text class="small" x="125" y="376" text-anchor="middle">کون سا ذریعہ، کیا وقت،</text><text class="small" x="125" y="392" text-anchor="middle">کیا پس منظر؟</text><text class="small" x="390" y="440" text-anchor="middle">جو مسودہ تینوں کونوں سے گزر جائے وہ عموما بھیجنے کے قابل ہوتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
