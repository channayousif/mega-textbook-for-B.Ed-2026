<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five cases of using sources</title><desc id="d">Table of five cases of using sources, each marked plagiarism or fine, with the reason why.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">Using sources: five verdicts</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="336" y1="52" x2="336" y2="412"/><line class="grid" x1="456" y1="52" x2="456" y2="412"/><line class="grid" x1="16" y1="92" x2="764" y2="92"/><line class="grid" x1="16" y1="160" x2="764" y2="160"/><line class="grid" x1="16" y1="228" x2="764" y2="228"/><line class="grid" x1="16" y1="296" x2="764" y2="296"/><line class="grid" x1="16" y1="364" x2="764" y2="364"/><rect class="frame" x="16" y="52" width="748" height="360"/><text class="h" x="176" y="77" text-anchor="middle">What you did</text><text class="h" x="396" y="77" text-anchor="middle">Verdict</text><text class="h" x="610" y="77" text-anchor="middle">Why</text><text class="body" x="26" y="120">copied a paragraph word for word,</text><text class="body" x="26" y="136">with citation and quotation marks</text><text class="body" x="348" y="128" font-weight="600">fine</text><text class="body" x="468" y="120">the words are clearly</text><text class="body" x="468" y="136">borrowed and sourced</text><text class="body" x="26" y="188">copied a paragraph changing</text><text class="body" x="26" y="204">some words, no citation</text><text class="body" x="348" y="196" font-weight="600">plagiarism</text><text class="body" x="468" y="188">the structure and ideas</text><text class="body" x="468" y="204">are another's</text><text class="body" x="26" y="256">paraphrased an idea fully in your</text><text class="body" x="26" y="272">own words, with citation</text><text class="body" x="348" y="264" font-weight="600">fine</text><text class="body" x="468" y="256">the idea is credited even</text><text class="body" x="468" y="272">though the words are yours</text><text class="body" x="26" y="324">used a diagram from a website</text><text class="body" x="26" y="340">with no source line</text><text class="body" x="348" y="332" font-weight="600">plagiarism</text><text class="body" x="468" y="332">images are work too</text><text class="body" x="26" y="392">resubmitted your own last year's</text><text class="body" x="26" y="408">essay as new work</text><text class="body" x="348" y="392" font-weight="600">self-</text><text class="body" x="348" y="408" font-weight="600">plagiarism</text><text class="body" x="468" y="392">presenting old work as</text><text class="body" x="468" y="408">new is dishonest</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
