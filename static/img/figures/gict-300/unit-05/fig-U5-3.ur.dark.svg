<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ صورتحالوں کا جدول اور ہر ایک کا نیٹکیٹ اصول</title><desc id="d">چھ صورتحالوں کا جدول: ہر ایک کا نیٹکیٹ اصول اور اس کی اہمیت۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">نیٹکیٹ: چھ صورتحالیں، چھ اصول</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="574" y1="52" x2="574" y2="432"/><line class="grid" x1="314" y1="52" x2="314" y2="432"/><line class="grid" x1="764" y1="92" x2="16" y2="92"/><line class="grid" x1="764" y1="152" x2="16" y2="152"/><line class="grid" x1="764" y1="212" x2="16" y2="212"/><line class="grid" x1="764" y1="272" x2="16" y2="272"/><line class="grid" x1="764" y1="332" x2="16" y2="332"/><line class="grid" x1="764" y1="392" x2="16" y2="392"/><rect class="frame" x="16" y="52" width="748" height="380"/><text class="h" x="669" y="77" text-anchor="middle">صورتحال</text><text class="h" x="444" y="77" text-anchor="middle">نیٹکیٹ اصول</text><text class="h" x="165" y="77" text-anchor="middle">اہمیت</text><text class="body" x="754" y="118" font-weight="600" text-anchor="end">ای میل لکھتے وقت</text><text class="body" x="562" y="112" text-anchor="end">سلام، معاملہ بیان کریں،</text><text class="body" x="562" y="128" text-anchor="end">اپنا نام لکھیں</text><text class="body" x="302" y="112" text-anchor="end">بے نام پیغام</text><text class="body" x="302" y="128" text-anchor="end">حکم لگتا ہے</text><text class="body" x="754" y="178" font-weight="600" text-anchor="end">کلاس چیٹ میں</text><text class="body" x="562" y="172" text-anchor="end">بات سبق پر رکھیں،</text><text class="body" x="562" y="188" text-anchor="end">اسکول اوقات استعمال کریں</text><text class="body" x="302" y="172" text-anchor="end">آدھی رات لکھی ہوئی بات</text><text class="body" x="302" y="188" text-anchor="end">فوراً اور ہمیشہ کے لیے پہنچتی ہے</text><text class="body" x="754" y="238" font-weight="600" text-anchor="end">غصے میں جواب دیتے وقت</text><text class="body" x="562" y="232" text-anchor="end">انتظار کریں پھر لکھیں؛ یا</text><text class="body" x="562" y="248" text-anchor="end">لکھ کر مٹا دیں</text><text class="body" x="302" y="232" text-anchor="end">غصہ وہ لکھواتا ہے</text><text class="body" x="302" y="248" text-anchor="end">جو سرد دماغ نہ لکھتا</text><text class="body" x="754" y="298" font-weight="600" text-anchor="end">بحث فورم میں</text><text class="body" x="562" y="292" text-anchor="end">بات کا جواب دیں،</text><text class="body" x="562" y="308" text-anchor="end">شخص کا نہیں</text><text class="body" x="302" y="292" text-anchor="end">اختلاف باقی رہتا ہے،</text><text class="body" x="302" y="308" text-anchor="end">گالی بحث ختم کر دیتی ہے</text><text class="body" x="754" y="358" font-weight="600" text-anchor="end">پیغام آگے بھیجتے وقت</text><text class="body" x="562" y="352" text-anchor="end">پہلے جانچیں،</text><text class="body" x="562" y="368" text-anchor="end">پھر آگے بھیجیں</text><text class="body" x="302" y="352" text-anchor="end">آپ کا نام وہ اٹھاتا ہے</text><text class="body" x="302" y="368" text-anchor="end">جو آپ آگے بھیجتے ہیں</text><text class="body" x="754" y="418" font-weight="600" text-anchor="end">کیپٹل لٹرز میں</text><text class="body" x="562" y="418" text-anchor="end">پورا پیغام کیپٹلز میں نہ لکھیں</text><text class="body" x="302" y="418" text-anchor="end">کیپٹلز چیخ لگتے ہیں</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
