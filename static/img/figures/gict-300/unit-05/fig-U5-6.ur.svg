<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ماخذ استعمال کرنے کی پانچ صورتوں کا جدول</title><desc id="d">ماخذ استعمال کرنے کی پانچ صورتوں کا جدول، ہر ایک پر سرقہ یا درست کا فیصلہ، وجہ کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">ماخذ کا استعمال: پانچ فیصلے</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="444" y1="52" x2="444" y2="412"/><line class="grid" x1="324" y1="52" x2="324" y2="412"/><line class="grid" x1="764" y1="92" x2="16" y2="92"/><line class="grid" x1="764" y1="160" x2="16" y2="160"/><line class="grid" x1="764" y1="228" x2="16" y2="228"/><line class="grid" x1="764" y1="296" x2="16" y2="296"/><line class="grid" x1="764" y1="364" x2="16" y2="364"/><rect class="frame" x="16" y="52" width="748" height="360"/><text class="h" x="604" y="77" text-anchor="middle">آپ نے کیا کیا</text><text class="h" x="384" y="77" text-anchor="middle">فیصلہ</text><text class="h" x="170" y="77" text-anchor="middle">وجہ</text><text class="body" x="754" y="120" text-anchor="end">پیراگراف لفظ بہ لفظ نقل کیا،</text><text class="body" x="754" y="136" text-anchor="end">حوالہ اور اقتباس کے نشانات کے ساتھ</text><text class="body" x="432" y="128" font-weight="600" text-anchor="end">درست</text><text class="body" x="312" y="120" text-anchor="end">الفاظ واضح طور پر</text><text class="body" x="312" y="136" text-anchor="end">ادھار اور ماخذ کے ساتھ ہیں</text><text class="body" x="754" y="188" text-anchor="end">پیراگراف نقل کیا، کچھ الفاظ</text><text class="body" x="754" y="204" text-anchor="end">بدل کر، بغیر حوالہ</text><text class="body" x="432" y="196" font-weight="600" text-anchor="end">سرقہ</text><text class="body" x="312" y="188" text-anchor="end">ڈھانچہ اور خیال</text><text class="body" x="312" y="204" text-anchor="end">کسی اور کے ہیں</text><text class="body" x="754" y="256" text-anchor="end">ایک خیال مکمل اپنے الفاظ میں</text><text class="body" x="754" y="272" text-anchor="end">بدلا، حوالہ کے ساتھ</text><text class="body" x="432" y="264" font-weight="600" text-anchor="end">درست</text><text class="body" x="312" y="256" text-anchor="end">خیال کا سہرا ملا حالانکہ</text><text class="body" x="312" y="272" text-anchor="end">الفاظ آپ کے ہیں</text><text class="body" x="754" y="324" text-anchor="end">ویب سائٹ کا خاکہ استعمال کیا</text><text class="body" x="754" y="340" text-anchor="end">بغیر ماخذ کی سطر</text><text class="body" x="432" y="332" font-weight="600" text-anchor="end">سرقہ</text><text class="body" x="312" y="332" text-anchor="end">تصاویر بھی محنت ہیں</text><text class="body" x="754" y="392" text-anchor="end">اپنا پرانا essay دوبارہ</text><text class="body" x="754" y="408" text-anchor="end">نیا کام بنا کر جمع کیا</text><text class="body" x="432" y="392" font-weight="600" text-anchor="end">خود</text><text class="body" x="432" y="408" font-weight="600" text-anchor="end">سرقہ</text><text class="body" x="312" y="392" text-anchor="end">پرانا کام نیا</text><text class="body" x="312" y="408" text-anchor="end">بتانا بے ایمانی ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
