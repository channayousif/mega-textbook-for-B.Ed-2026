<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A triangle diagram with three labelled corners</title><desc id="d">A triangle diagram with three labelled corners - the reader, the purpose and the context - and a caption to read your message through all three corners before sending.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The tone triangle</text><text class="small" x="390" y="64" text-anchor="middle">Check your draft once through each corner before sending</text><polygon class="stroke" points="390,110 190,360 590,360" fill="none"/><rect class="panel-a" x="300" y="80" width="180" height="52"/><text class="body" x="390" y="102" text-anchor="middle" font-weight="600">the reader</text><text class="small" x="390" y="122" text-anchor="middle">who will read this, and in what mood?</text><rect class="panel-b" x="30" y="330" width="190" height="70"/><text class="body" x="125" y="356" text-anchor="middle" font-weight="600">the purpose</text><text class="small" x="125" y="376" text-anchor="middle">what do I want</text><text class="small" x="125" y="392" text-anchor="middle">to happen?</text><rect class="panel-c" x="560" y="330" width="190" height="70"/><text class="body" x="655" y="356" text-anchor="middle" font-weight="600">the context</text><text class="small" x="655" y="376" text-anchor="middle">which channel, what time,</text><text class="small" x="655" y="392" text-anchor="middle">what history?</text><text class="small" x="390" y="440" text-anchor="middle">A draft that survives all three corners is usually fit to send.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
