<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">محفوظ assignments کے مراحل کا فلو چارٹ</title><desc id="d">محفوظ assignment کے مراحل: اپنے الفاظ میں نوٹ کریں، ماخذ سے موازنہ کریں، قریب ہو تو دوبارہ paraphrase کریں، پھر حوالہ دیں - اور ساتھ باکس: براہ راست الفاظ کے لیے اقتباس کے نشانات اور حوالہ دونوں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .note{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">محفوظ assignment کا طریقہ کار</text><text class="small" x="390" y="64" text-anchor="middle">ماخذ پڑھنے سے دیانتدار خلاصے تک چار مراحل</text><rect class="panel" x="600" y="180" width="150" height="80"/><text class="body" x="675" y="210" text-anchor="middle" font-weight="600">اپنے الفاظ میں</text><text class="body" x="675" y="230" text-anchor="middle" font-weight="600">نوٹ کریں</text><rect class="panel" x="415" y="180" width="150" height="80"/><text class="body" x="490" y="204" text-anchor="middle" font-weight="600">اپنا متن ماخذ</text><text class="body" x="490" y="224" text-anchor="middle" font-weight="600">سے موازنہ کریں</text><text class="small" x="490" y="246" text-anchor="middle">ڈھانچہ نظر آتا ہے؟</text><rect class="panel" x="230" y="180" width="150" height="80"/><text class="body" x="305" y="204" text-anchor="middle" font-weight="600">اب بھی قریب؟</text><text class="body" x="305" y="224" text-anchor="middle" font-weight="600">دوبارہ paraphrase کریں</text><text class="small" x="305" y="246" text-anchor="middle">جب تک صرف خیال ادھار ہو</text><rect class="panel-b" x="45" y="180" width="150" height="80"/><text class="body" x="120" y="210" text-anchor="middle" font-weight="600">حوالہ</text><text class="body" x="120" y="230" text-anchor="middle" font-weight="600">دیں</text><line class="stroke" x1="600" y1="220" x2="573" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="415" y1="220" x2="388" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="230" y1="220" x2="203" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="305" y1="260" x2="490" y2="296" marker-end="url(#arrow)"/><text class="small" x="420" y="292" text-anchor="middle">واپس، اگر ڈھانچہ اب بھی دکھے</text><rect class="note" x="30" y="330" width="280" height="64"/><text class="body" x="170" y="354" text-anchor="middle" font-weight="600">براہ راست الفاظ کے لیے:</text><text class="body" x="170" y="374" text-anchor="middle">اقتباس کے نشانات اور حوالہ</text><path class="stroke" d="M120 260 V330" fill="none" marker-end="url(#arrow)"/><text class="small" x="390" y="440" text-anchor="middle">جانچ: پڑھنے والا ہر جملے پر بتا سکے کون سے الفاظ اور خیال آپ کے ہیں اور کون سے ادھار۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
