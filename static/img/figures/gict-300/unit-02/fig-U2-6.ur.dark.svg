<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بوٹ کے مراحل کا فلو چارٹ</title><desc id="d">بوٹ کے مراحل کا فلو چارٹ: پاور بٹن دبانے سے، روم کی اسٹارٹ اپ ہدایات اور آپریٹنگ سسٹم کے ریم میں لوڈ ہونے کے راستے، ڈیسک ٹاپ کے ظاہر ہونے اور صارف کے ایپلیکیشن کھولنے تک۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.h{font-size:16px;font-weight:700;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.step{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.num{fill:var(--ink)}.numtext{font-size:13px;font-weight:700;fill:var(--bg)}.label{font-size:14px;font-weight:700;fill:var(--ink)}.note{font-size:11px;fill:var(--muted)}.rule{stroke:var(--ink);stroke-width:1.5;opacity:.3} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="58" text-anchor="middle">بوٹ کے مراحل</text><text class="muted" x="390" y="84" text-anchor="middle">کمپیوٹر آن کرنے سے سافٹ ویئر کھولنے تک</text><line class="rule" x1="742" y1="108" x2="38" y2="108"/><line class="stroke" x1="628" y1="199" x2="612" y2="199" marker-end="url(#arrow)"/><line class="stroke" x1="474" y1="199" x2="458" y2="199" marker-end="url(#arrow)"/><line class="stroke" x1="320" y1="199" x2="304" y2="199" marker-end="url(#arrow)"/><line class="stroke" x1="166" y1="199" x2="150" y2="199" marker-end="url(#arrow)"/><rect class="step" x="628" y="150" width="138" height="98" rx="12"/><circle class="num" cx="743" cy="173" r="14"/><text class="numtext" x="743" y="178" text-anchor="middle">1</text><text class="label" x="697" y="194" text-anchor="middle"><tspan x="697" text-anchor="end">پاور بٹن</tspan><tspan x="697" dy="19" text-anchor="end">دبایا جاتا ہے</tspan></text><text class="note" x="697" y="276" text-anchor="middle">کمپیوٹر چلاتی ہے</text><rect class="panel" x="474" y="150" width="138" height="98" rx="12"/><circle class="num" cx="589" cy="173" r="14"/><text class="numtext" x="589" y="178" text-anchor="middle">2</text><text class="label" x="543" y="194" text-anchor="middle"><tspan x="543" text-anchor="end">روم اسٹارٹ اپ</tspan><tspan x="543" dy="19" text-anchor="end">ہدایات چلاتی ہے</tspan></text><text class="note" x="543" y="276" text-anchor="middle">ضروری ہارڈ ویئر جانچتی ہے</text><rect class="step" x="320" y="150" width="138" height="98" rx="12"/><circle class="num" cx="435" cy="173" r="14"/><text class="numtext" x="435" y="178" text-anchor="middle">3</text><text class="label" x="389" y="194" text-anchor="middle"><tspan x="389" text-anchor="end">آپریٹنگ سسٹم</tspan><tspan x="389" dy="19" text-anchor="end">ریم میں لوڈ ہوتا ہے</tspan></text><text class="note" x="389" y="276" text-anchor="middle">پروگراموں کو چلنے کے لیے تیار کرتا ہے</text><rect class="panel" x="166" y="150" width="138" height="98" rx="12"/><circle class="num" cx="281" cy="173" r="14"/><text class="numtext" x="281" y="178" text-anchor="middle">4</text><text class="label" x="235" y="194" text-anchor="middle"><tspan x="235" text-anchor="end">ڈیسک ٹاپ اور سیٹنگز</tspan><tspan x="235" dy="19" text-anchor="end">ظاہر ہوتی ہیں</tspan></text><text class="note" x="235" y="276" text-anchor="middle">صارف کے استعمال کے لیے تیار</text><rect class="step" x="12" y="150" width="138" height="98" rx="12"/><circle class="num" cx="127" cy="173" r="14"/><text class="numtext" x="127" y="178" text-anchor="middle">5</text><text class="label" x="81" y="194" text-anchor="middle"><tspan x="81" text-anchor="end">صارف ایپلیکیشن</tspan><tspan x="81" dy="19" text-anchor="end">کھولتا ہے</tspan></text><text class="note" x="81" y="276" text-anchor="middle">کام شروع ہوتا ہے</text><path class="stroke" d="M691 340 v24 h-609 v-24"/><text class="muted" x="390" y="394" text-anchor="middle">ہر مرحلہ اگلے مرحلے سے پہلے مکمل ہونا چاہیے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
