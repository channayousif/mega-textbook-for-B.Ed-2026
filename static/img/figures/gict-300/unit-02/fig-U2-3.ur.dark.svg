<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار سطحی اسٹوریج اہرام: اوپر سی پی یو رجسٹر سے نیچے کلاؤڈ اسٹوریج تک</title><desc id="d">چار سطحی اسٹوریج اہرام، اوپر سی پی یو رجسٹر سے نیچے کلاؤڈ اسٹوریج تک، تیروں سے ظاہر ہے کہ گنجائش بڑھنے پر رفتار اور لاگت کم ہوتی جاتی ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .yes { fill: var(--ink); } .no { fill: var(--muted); } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="45" text-anchor="middle">اسٹوریج کی درجہ بندی</text><text class="small" x="390" y="66" text-anchor="middle">اوپر سے نیچے رفتار، لاگت اور گنجائش بدلتی ہے</text><line class="stroke" x1="675" y1="382" x2="675" y2="96" marker-end="url(#arrow)"/><text class="body" x="704" y="239" text-anchor="middle" transform="rotate(-90 76 239)">تیز، مہنگا فی یونٹ</text><line class="stroke" x1="105" y1="96" x2="105" y2="382" marker-end="url(#arrow)"/><text class="body" x="76" y="239" text-anchor="middle" transform="rotate(90 704 239)">بڑا، سستا فی یونٹ</text><polygon class="panel" points="438,92 342,92 317,150 463,150"/><text class="sh" x="390" y="117" text-anchor="middle">سی پی یو رجسٹر:</text><text class="body" x="390" y="137" text-anchor="middle">سب سے چھوٹا، تیز ترین</text><polygon class="panel" points="470,160 310,160 280,225 500,225"/><text class="h" x="390" y="187" text-anchor="middle">ریم: ورکنگ میموری،</text><text class="body" x="390" y="210" text-anchor="middle">بجلی بند ہونے پر مٹ جاتی ہے</text><polygon class="panel" points="512,235 268,235 235,302 545,302"/><text class="h" x="390" y="263" text-anchor="middle">ایس ایس ڈی اور ہارڈ ڈسک:</text><text class="body" x="390" y="287" text-anchor="middle">فائلیں رکھتی ہے</text><polygon class="panel" points="558,312 222,312 180,385 600,385"/><text class="h" x="390" y="342" text-anchor="middle">کلاؤڈ اور بیک اپ اسٹوریج:</text><text class="body" x="390" y="367" text-anchor="middle">سب سے بڑا، پہنچ میں سب سے سست</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
