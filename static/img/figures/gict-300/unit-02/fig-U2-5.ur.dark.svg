<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سسٹم سافٹ ویئر اور ایپلیکیشن سافٹ ویئر کا موازنہ</title><desc id="d">سسٹم سافٹ ویئر اور ایپلیکیشن سافٹ ویئر کا موازنہ: مقصد، مثالیں، کب چلتے ہیں، کس کے ساتھ کام کرتے ہیں، اور ہٹانے پر کیا ہوتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.3} .app-head{stroke-dasharray:7 4} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="764" y="29" text-anchor="end">سسٹم سافٹ ویئر اور ایپلیکیشن سافٹ ویئر</text><text class="small muted" x="764" y="45" text-anchor="end">ہر قطار پڑھیں: ہر قسم کیا کرتی ہے، کب چلتی ہے، اور کیا چاہتی ہے۔</text><rect class="panel" x="584" y="58" width="180" height="54" rx="5"/><rect class="panel-a" x="300" y="58" width="284" height="54" rx="5"/><rect class="panel-b app-head" x="16" y="58" width="284" height="54" rx="5"/><text class="h" x="674" y="90" text-anchor="middle">خصوصیت</text><text class="h" x="442" y="90" text-anchor="middle">سسٹم سافٹ ویئر</text><text class="h" x="158" y="90" text-anchor="middle">ایپلیکیشن سافٹ ویئر</text><rect class="panel" x="16" y="112" width="748" height="315"/><rect class="grid" x="16" y="112" width="748" height="315"/><line class="grid" x1="584" y1="112" x2="584" y2="427"/><line class="grid" x1="300" y1="112" x2="300" y2="427"/><line class="grid" x1="764" y1="175" x2="16" y2="175"/><line class="grid" x1="764" y1="238" x2="16" y2="238"/><line class="grid" x1="764" y1="301" x2="16" y2="301"/><line class="grid" x1="764" y1="364" x2="16" y2="364"/><text class="body" x="748" y="148" text-anchor="end">مقصد</text><text class="body" x="442" y="140" text-anchor="middle"><tspan x="442" text-anchor="end">مشین خود کو</tspan><tspan x="442" dy="18" text-anchor="end">چلاتی اور سنبھالتی ہے</tspan></text><text class="body" x="158" y="140" text-anchor="middle"><tspan x="158" text-anchor="end">صارف کے کام</tspan><tspan x="158" dy="18" text-anchor="end">کرتی ہے</tspan></text><text class="body" x="748" y="211" text-anchor="end">مثالیں</text><text class="body" x="442" y="203" text-anchor="middle"><tspan x="442" text-anchor="end">ونڈوز، لینکس، اینڈرائیڈ</tspan><tspan x="442" dy="18" text-anchor="end">فون کی سیٹنگز</tspan></text><text class="body" x="158" y="203" text-anchor="middle"><tspan x="158" text-anchor="end">ورڈ پروسیسر، اسپریڈ شیٹ</tspan><tspan x="158" dy="18" text-anchor="end">براؤزر، فوٹو ایڈیٹر</tspan></text><text class="body" x="748" y="274" text-anchor="end">کب چلتی ہے</text><text class="body" x="442" y="266" text-anchor="middle"><tspan x="442" text-anchor="end">بجلی آن سے</tspan><tspan x="442" dy="18" text-anchor="end">بجلی آف تک</tspan></text><text class="body" x="158" y="266" text-anchor="middle"><tspan x="158" text-anchor="end">صرف جب صارف</tspan><tspan x="158" dy="18" text-anchor="end">کھولے</tspan></text><text class="body" x="748" y="337" text-anchor="end">کس کے ساتھ کام</text><text class="body" x="442" y="337" text-anchor="middle">براہ راست ہارڈ ویئر</text><text class="body" x="158" y="337" text-anchor="middle">آپریٹنگ سسٹم کے ذریعے</text><text class="body" x="748" y="400" text-anchor="end">ہٹا دیں تو</text><text class="body" x="442" y="392" text-anchor="middle"><tspan x="442" text-anchor="end">مشین چلنا</tspan><tspan x="442" dy="18" text-anchor="end">بند ہو جاتی ہے</tspan></text><text class="body" x="158" y="392" text-anchor="middle"><tspan x="158" text-anchor="end">ایک کام</tspan><tspan x="158" dy="18" text-anchor="end">ختم ہو جاتا ہے</tspan></text><text class="small muted" x="764" y="448" text-anchor="end">ٹھوس اور ہٹی ہوئی سرخیاں تحریری لیبل کو مضبوط کرتی ہیں، صرف رنگ کا فرق نہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
