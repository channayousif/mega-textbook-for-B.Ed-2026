<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of eight communication items</title><desc id="d">Table of eight communication items sorted into hardware and software, each with what it does.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">Communication hardware and software at a glance</text><rect class="cellhdr" x="16" y="58" width="748" height="42"/><line class="grid" x1="246" y1="58" x2="246" y2="438"/><line class="grid" x1="426" y1="58" x2="426" y2="438"/><line class="grid" x1="16" y1="100" x2="764" y2="100"/><line class="grid" x1="16" y1="142" x2="764" y2="142"/><line class="grid" x1="16" y1="184" x2="764" y2="184"/><line class="grid" x1="16" y1="226" x2="764" y2="226"/><line class="grid" x1="16" y1="268" x2="764" y2="268"/><line class="grid" x1="16" y1="310" x2="764" y2="310"/><line class="grid" x1="16" y1="352" x2="764" y2="352"/><line class="grid" x1="16" y1="394" x2="764" y2="394"/><rect class="frame" x="16" y="58" width="748" height="380"/><text class="h" x="131" y="84" text-anchor="middle">Item</text><text class="h" x="336" y="84" text-anchor="middle">Hardware or software</text><text class="h" x="595" y="84" text-anchor="middle">What it does</text><text class="body" x="28" y="126" font-weight="600">network interface card</text><text class="body" x="258" y="126">hardware</text><text class="body" x="438" y="126">the machine doorway onto the network</text><text class="body" x="28" y="168" font-weight="600">switch</text><text class="body" x="258" y="168">hardware</text><text class="body" x="438" y="161">forwards messages to the right</text><text class="body" x="438" y="177">machine in the lab</text><text class="body" x="28" y="210" font-weight="600">router</text><text class="body" x="258" y="210">hardware</text><text class="body" x="438" y="203">connects the school network</text><text class="body" x="438" y="219">to the internet</text><text class="body" x="28" y="252" font-weight="600">Wi-Fi access point</text><text class="body" x="258" y="252">hardware</text><text class="body" x="438" y="245">serves wireless devices</text><text class="body" x="438" y="261">in range</text><text class="body" x="28" y="294" font-weight="600">cable or fibre</text><text class="body" x="258" y="294">hardware</text><text class="body" x="438" y="294">carries the signal</text><text class="body" x="28" y="336" font-weight="600">protocol</text><text class="body" x="258" y="336">software rules</text><text class="body" x="438" y="329">the shared rules machines</text><text class="body" x="438" y="345">follow to talk</text><text class="body" x="28" y="378" font-weight="600">browser and email client</text><text class="body" x="258" y="378">software</text><text class="body" x="438" y="378">request pages and send mail</text><text class="body" x="28" y="413">network settings in the OS</text><text class="body" x="258" y="413">software</text><text class="body" x="438" y="407">hold the address and password</text><text class="body" x="438" y="423">the machine joins with</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
