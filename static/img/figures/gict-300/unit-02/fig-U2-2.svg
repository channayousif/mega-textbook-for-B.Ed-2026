<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of eight common devices sorted into input, output and storage families</title><desc id="d">Table of eight common devices sorted into input, output and storage families, each with what it does and one school use.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.42} .cell{font-size:13px;fill:var(--ink)} .family{font-size:13px;font-weight:700;fill:var(--ink)} .note{font-size:13px;fill:var(--muted)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="20" y="27">Common devices in a school lab</text><text class="muted note" x="20" y="45">Read across each row: device, family, function, and one school use.</text><rect class="panel" x="20" y="58" width="740" height="360" rx="4"/><rect class="ink" x="20" y="58" width="740" height="40" rx="4"/><rect class="ink" x="20" y="84" width="740" height="14"/><g class="grid"><line x1="165" y1="58" x2="165" y2="418"/><line x1="270" y1="58" x2="270" y2="418"/><line x1="505" y1="58" x2="505" y2="418"/><line x1="20" y1="98" x2="760" y2="98"/><line x1="20" y1="138" x2="760" y2="138"/><line x1="20" y1="178" x2="760" y2="178"/><line x1="20" y1="218" x2="760" y2="218"/><line x1="20" y1="258" x2="760" y2="258"/><line x1="20" y1="298" x2="760" y2="298"/><line x1="20" y1="338" x2="760" y2="338"/><line x1="20" y1="378" x2="760" y2="378"/></g><g fill="var(--bg)" font-size="15" font-weight="700"><text x="32" y="83">Device</text><text x="177" y="83">Family</text><text x="282" y="83">What it does</text><text x="517" y="83">One school use</text></g><g dominant-baseline="middle"><text class="cell" x="32" y="118">Keyboard</text><text class="family" x="177" y="118">Input</text><text class="cell" x="282" y="118">Types text and commands</text><text class="cell" x="517" y="118">Typing exam questions</text><text class="cell" x="32" y="158">Mouse</text><text class="family" x="177" y="158">Input</text><text class="cell" x="282" y="158">Points and clicks</text><text class="cell" x="517" y="158">Navigating the desktop</text><text class="cell" x="32" y="198">Scanner</text><text class="family" x="177" y="198">Input</text><text class="cell" x="282" y="198">Converts paper to image</text><text class="cell" x="517" y="198">Saving old records</text><text class="cell" x="32" y="238">Webcam</text><text class="family" x="177" y="238">Input</text><text class="cell" x="282" y="238">Captures video</text><text class="cell" x="517" y="238">Recording lesson practice</text><text class="cell" x="32" y="278">Monitor</text><text class="family" x="177" y="278">Output</text><text class="cell" x="282" y="278">Displays results</text><text class="cell" x="517" y="278">Showing a lesson video</text><text class="cell" x="32" y="318">Printer</text><text class="family" x="177" y="318">Output</text><text class="cell" x="282" y="318">Prints on paper</text><text class="cell" x="517" y="318">Printing parent notices</text><text class="cell" x="32" y="358">Speakers</text><text class="family" x="177" y="358">Output</text><text class="cell" x="282" y="358">Plays sound</text><text class="cell" x="517" y="358">Language listening lab</text><text class="cell" x="32" y="398">USB flash drive</text><text class="family" x="177" y="398">Storage</text><text class="cell" x="282" y="398">Keeps files portable</text><text class="cell" x="517" y="398">Carrying marks sheets</text></g><text class="muted note" x="20" y="440">Family names are written in every row, so the table remains clear without colour.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
