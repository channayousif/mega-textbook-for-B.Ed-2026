<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing system software and application software</title><desc id="d">Table comparing system software and application software across purpose, examples, when they run, what they work with, and what happens if each is removed.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.3} .app-head{stroke-dasharray:7 4} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="16" y="29">System software and application software</text><text class="small muted" x="16" y="45">Read each row across: what each type does, when it runs, and what it needs.</text><rect class="panel" x="16" y="58" width="180" height="54" rx="5"/><rect class="panel-a" x="196" y="58" width="284" height="54" rx="5"/><rect class="panel-b app-head" x="480" y="58" width="284" height="54" rx="5"/><text class="h" x="106" y="90" text-anchor="middle">Property</text><text class="h" x="338" y="90" text-anchor="middle">System software</text><text class="h" x="622" y="90" text-anchor="middle">Application software</text><rect class="panel" x="16" y="112" width="748" height="315"/><rect class="grid" x="16" y="112" width="748" height="315"/><line class="grid" x1="196" y1="112" x2="196" y2="427"/><line class="grid" x1="480" y1="112" x2="480" y2="427"/><line class="grid" x1="16" y1="175" x2="764" y2="175"/><line class="grid" x1="16" y1="238" x2="764" y2="238"/><line class="grid" x1="16" y1="301" x2="764" y2="301"/><line class="grid" x1="16" y1="364" x2="764" y2="364"/><text class="body" x="32" y="148">Purpose</text><text class="body" x="338" y="140" text-anchor="middle"><tspan x="338">Runs and manages</tspan><tspan x="338" dy="18">the machine itself</tspan></text><text class="body" x="622" y="140" text-anchor="middle"><tspan x="622">Does tasks</tspan><tspan x="622" dy="18">for the user</tspan></text><text class="body" x="32" y="211">Examples</text><text class="body" x="338" y="203" text-anchor="middle"><tspan x="338">Windows, Linux, Android</tspan><tspan x="338" dy="18">Phone settings</tspan></text><text class="body" x="622" y="203" text-anchor="middle"><tspan x="622">Word processor, spreadsheet</tspan><tspan x="622" dy="18">Browser, photo editor</tspan></text><text class="body" x="32" y="274">Runs when</text><text class="body" x="338" y="266" text-anchor="middle"><tspan x="338">From power on</tspan><tspan x="338" dy="18">to power off</tspan></text><text class="body" x="622" y="266" text-anchor="middle"><tspan x="622">Only when the user</tspan><tspan x="622" dy="18">opens it</tspan></text><text class="body" x="32" y="337">Works with</text><text class="body" x="338" y="337" text-anchor="middle">Hardware directly</text><text class="body" x="622" y="337" text-anchor="middle">Through the operating system</text><text class="body" x="32" y="400">Remove it</text><text class="body" x="338" y="392" text-anchor="middle"><tspan x="338">Machine stops</tspan><tspan x="338" dy="18">working</tspan></text><text class="body" x="622" y="392" text-anchor="middle"><tspan x="622">One task</tspan><tspan x="622" dy="18">disappears</tspan></text><text class="small muted" x="16" y="448">The solid and dashed headers reinforce the written category labels, not a colour-only distinction.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
