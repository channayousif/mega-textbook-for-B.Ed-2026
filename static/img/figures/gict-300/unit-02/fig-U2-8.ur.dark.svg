<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آٹھ مواصلاتی چیزوں کا جدول</title><desc id="d">آٹھ مواصلاتی چیزوں کا جدول، ہارڈ ویئر اور سافٹ ویئر میں، ہر ایک کے ساتھ اس کا کام۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">مواصلات کا ہارڈ ویئر اور سافٹ ویئر ایک نظر میں</text><rect class="cellhdr" x="16" y="58" width="748" height="42"/><line class="grid" x1="534" y1="58" x2="534" y2="438"/><line class="grid" x1="354" y1="58" x2="354" y2="438"/><line class="grid" x1="764" y1="100" x2="16" y2="100"/><line class="grid" x1="764" y1="142" x2="16" y2="142"/><line class="grid" x1="764" y1="184" x2="16" y2="184"/><line class="grid" x1="764" y1="226" x2="16" y2="226"/><line class="grid" x1="764" y1="268" x2="16" y2="268"/><line class="grid" x1="764" y1="310" x2="16" y2="310"/><line class="grid" x1="764" y1="352" x2="16" y2="352"/><line class="grid" x1="764" y1="394" x2="16" y2="394"/><rect class="frame" x="16" y="58" width="748" height="380"/><text class="h" x="649" y="84" text-anchor="middle">چیز</text><text class="h" x="444" y="84" text-anchor="middle">ہارڈ ویئر یا سافٹ ویئر</text><text class="h" x="185" y="84" text-anchor="middle">کیا کرتی ہے</text><text class="body" x="752" y="126" font-weight="600" text-anchor="end">نیٹ ورک انٹرفیس کارڈ</text><text class="body" x="522" y="126" text-anchor="end">ہارڈ ویئر</text><text class="body" x="342" y="126" text-anchor="end">مشین کا نیٹ ورک کا دروازہ</text><text class="body" x="752" y="168" font-weight="600" text-anchor="end">سوئچ</text><text class="body" x="522" y="168" text-anchor="end">ہارڈ ویئر</text><text class="body" x="342" y="161" text-anchor="end">پیغامات لیب کی درست</text><text class="body" x="342" y="177" text-anchor="end">مشین تک بھیجتا ہے</text><text class="body" x="752" y="210" font-weight="600" text-anchor="end">روٹر</text><text class="body" x="522" y="210" text-anchor="end">ہارڈ ویئر</text><text class="body" x="342" y="203" text-anchor="end">اسکول کے نیٹ ورک کو</text><text class="body" x="342" y="219" text-anchor="end">انٹرنیٹ سے جوڑتا ہے</text><text class="body" x="752" y="252" font-weight="600" text-anchor="end">وائی فائی ایکسیس پوائنٹ</text><text class="body" x="522" y="252" text-anchor="end">ہارڈ ویئر</text><text class="body" x="342" y="245" text-anchor="end">وائرلیس ڈیوائسوں کو خدمت دیتا ہے</text><text class="body" x="342" y="261" text-anchor="end">حد کے اندر</text><text class="body" x="752" y="294" font-weight="600" text-anchor="end">کیبل یا فائبر</text><text class="body" x="522" y="294" text-anchor="end">ہارڈ ویئر</text><text class="body" x="342" y="294" text-anchor="end">سگنل لے جاتی ہے</text><text class="body" x="752" y="336" font-weight="600" text-anchor="end">پروٹوکول</text><text class="body" x="522" y="336" text-anchor="end">سافٹ ویئر قواعد</text><text class="body" x="342" y="329" text-anchor="end">مشینوں کے مشترکہ قواعد</text><text class="body" x="342" y="345" text-anchor="end">بات چیت کے لیے</text><text class="body" x="752" y="378" font-weight="600" text-anchor="end">براؤزر اور ای میل کلائنٹ</text><text class="body" x="522" y="378" text-anchor="end">سافٹ ویئر</text><text class="body" x="342" y="378" text-anchor="end">صفحات مانگتے اور میل بھیجتے ہیں</text><text class="body" x="752" y="413" text-anchor="end">آپریٹنگ سسٹم کی نیٹ ورک سیٹنگز</text><text class="body" x="522" y="413" text-anchor="end">سافٹ ویئر</text><text class="body" x="342" y="407" text-anchor="end">ایڈریس اور پاس ورڈ رکھتی ہیں</text><text class="body" x="342" y="423" text-anchor="end">جن سے مشین جڑتی ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
