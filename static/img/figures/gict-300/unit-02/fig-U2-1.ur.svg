<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ: ہارڈ ویئر درمیان میں، پانچ شاخیں</title><desc id="d">تصوراتی نقشہ: ہارڈ ویئر درمیان میں اور پانچ شاخیں: ان پٹ، آؤٹ پٹ اور اسٹوریج ڈیوائسیں ٹھوس خانوں میں، اور پروسیسنگ و مواصلات ہٹی ہوئی خانوں میں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.h{font-size:16px;font-weight:700;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}text{font-size:15px;fill:var(--ink)}.link{stroke:var(--line);stroke-width:2.5;fill:none}.centre{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3}.dashed{stroke:var(--muted);stroke-dasharray:8 6} </style><rect class="bg" x="0" y="0" width="780" height="470"/><path class="link" d="M390 187 L390 110"/><path class="link" d="M500 234 L535 234"/><path class="link" d="M280 234 L245 234"/><path class="link" d="M468 279 L512 350"/><path class="link" d="M312 279 L268 350"/><rect class="panel" x="275" y="35" width="230" height="75" rx="12"/><text class="h" x="390" y="67" text-anchor="middle">ان پٹ ڈیوائسیں</text><text x="390" y="91" text-anchor="middle">(ڈیٹا اندر)</text><rect class="panel" x="535" y="194" width="210" height="80" rx="12"/><text class="h" x="640" y="227" text-anchor="middle">آؤٹ پٹ ڈیوائسیں</text><text x="640" y="251" text-anchor="middle">(نتائج باہر)</text><rect class="panel" x="35" y="194" width="210" height="80" rx="12"/><text class="h" x="140" y="227" text-anchor="middle">اسٹوریج ڈیوائسیں</text><text x="140" y="251" text-anchor="middle">(ڈیٹا محفوظ)</text><rect class="panel dashed" x="455" y="350" width="230" height="75" rx="12"/><text class="h" x="570" y="382" text-anchor="middle">پروسیسنگ</text><text x="570" y="406" text-anchor="middle">(سی پی یو)</text><rect class="panel dashed" x="95" y="350" width="230" height="75" rx="12"/><text class="h" x="210" y="382" text-anchor="middle">مواصلات</text><text x="210" y="406" text-anchor="middle">(رابطہ)</text><ellipse class="centre" cx="390" cy="240" rx="110" ry="53"/><text class="h" x="390" y="247" text-anchor="middle">ہارڈ ویئر</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
