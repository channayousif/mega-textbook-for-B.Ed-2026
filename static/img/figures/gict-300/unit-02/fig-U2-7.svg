<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a school lab network</title><desc id="d">Diagram of a school lab network: client computers and a printer connect to a switch, the switch connects to a router, the router to the internet line, and a Wi-Fi access point serves wireless devices.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .ah{fill:var(--ink)} .aha{fill:var(--a1)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle">How a school lab's computers connect</text><text class="small" x="390" y="66" text-anchor="middle">The chain from pupil machines to the internet, and the devices that share it</text><rect class="panel" x="20" y="170" width="150" height="70"/><text class="body" x="95" y="200" text-anchor="middle" font-weight="600">lab computers</text><text class="body" x="95" y="220" text-anchor="middle">(clients)</text><text class="small" x="95" y="262" text-anchor="middle">the machines pupils use</text><rect class="panel-a" x="230" y="170" width="130" height="70"/><text class="body" x="295" y="200" text-anchor="middle" font-weight="600">switch</text><text class="body" x="295" y="220" text-anchor="middle">forwards in the lab</text><text class="small" x="295" y="262" text-anchor="middle">sends each message to</text><text class="small" x="295" y="278" text-anchor="middle">the right machine</text><rect class="panel-b" x="420" y="170" width="130" height="70"/><text class="body" x="485" y="200" text-anchor="middle" font-weight="600">router</text><text class="body" x="485" y="220" text-anchor="middle">joins to internet</text><text class="small" x="485" y="262" text-anchor="middle">the boundary between</text><text class="small" x="485" y="278" text-anchor="middle">the lab and outside</text><rect class="panel" x="610" y="170" width="150" height="70"/><text class="body" x="685" y="200" text-anchor="middle" font-weight="600">modem or</text><text class="body" x="685" y="220" text-anchor="middle">internet line</text><text class="small" x="685" y="262" text-anchor="middle">where the signal</text><text class="small" x="685" y="278" text-anchor="middle">enters the building</text><rect class="panel" x="230" y="340" width="130" height="60"/><text class="body" x="295" y="365" text-anchor="middle" font-weight="600">printer</text><text class="body" x="295" y="385" text-anchor="middle">shared by all</text><rect class="panel" x="420" y="340" width="150" height="60"/><text class="body" x="495" y="365" text-anchor="middle" font-weight="600">Wi-Fi access point</text><text class="body" x="495" y="385" text-anchor="middle">serves wireless devices</text><line class="stroke" x1="170" y1="205" x2="222" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="360" y1="205" x2="412" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="550" y1="205" x2="602" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="295" y1="240" x2="295" y2="332" marker-end="url(#arrow)"/><polyline class="stroke" points="340,240 340,310 412,310"/><line class="stroke" x1="440" y1="310" x2="460" y2="310"/><line class="stroke" x1="495" y1="310" x2="495" y2="332" marker-end="url(#arrow)"/><text class="small" x="390" y="430" text-anchor="middle">Every device gets an IP address; shared rules (protocols) let them take turns.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
