<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ریم، روم اور سیکنڈری اسٹوریج کا موازنہ</title><desc id="d">ریم، روم اور سیکنڈری اسٹوریج کا موازنہ: کیا رکھتی ہیں، بجلی بند ہونے پر بچتی ہیں یا نہیں، رفتار، توسیع اور عام سائز۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.32} .mark{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="764" y="29" text-anchor="end">ریم، روم اور سیکنڈری اسٹوریج: موازنہ</text><rect class="panel-a" x="540" y="48" width="224" height="56" rx="5"/><rect class="panel-a" x="372" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="204" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="16" y="48" width="188" height="56" rx="5"/><text class="h" x="652" y="80" text-anchor="middle">خصوصیت</text><text class="h" x="456" y="80" text-anchor="middle">ریم</text><text class="h" x="288" y="80" text-anchor="middle">روم</text><text class="h" x="110" y="72" text-anchor="middle"><tspan x="110" text-anchor="end">سیکنڈری</tspan><tspan x="110" dy="17" text-anchor="end">اسٹوریج</tspan></text><rect class="panel" x="16" y="104" width="748" height="325"/><rect class="grid" x="16" y="104" width="748" height="325"/><line class="grid" x1="540" y1="104" x2="540" y2="429"/><line class="grid" x1="372" y1="104" x2="372" y2="429"/><line class="grid" x1="204" y1="104" x2="204" y2="429"/><line class="grid" x1="764" y1="169" x2="16" y2="169"/><line class="grid" x1="764" y1="234" x2="16" y2="234"/><line class="grid" x1="764" y1="299" x2="16" y2="299"/><line class="grid" x1="764" y1="364" x2="16" y2="364"/><text class="body" x="748" y="140" text-anchor="end">کیا رکھتی ہے</text><text class="body" x="456" y="131" text-anchor="middle"><tspan x="456" text-anchor="end">پروگرام اور ڈیٹا</tspan><tspan x="456" dy="17" text-anchor="end">استعمال کے وقت</tspan></text><text class="body" x="288" y="131" text-anchor="middle"><tspan x="288" text-anchor="end">اسٹارٹ اپ</tspan><tspan x="288" dy="17" text-anchor="end">ہدایات</tspan></text><text class="body" x="110" y="140" text-anchor="middle">محفوظ فائلیں</text><text class="body" x="748" y="198" text-anchor="end"><tspan x="748" text-anchor="end">بجلی بند ہونے پر</tspan><tspan x="748" dy="17" text-anchor="end">بچتی ہے</tspan></text><path class="mark" d="M465 188 L447 206 M447 188 L465 206"/><text class="small muted" x="456" y="224" text-anchor="middle">نہیں</text><path class="mark" d="M297 198 L291 204 L278 189"/><text class="small muted" x="288" y="224" text-anchor="middle">ہاں</text><path class="mark" d="M119 198 L113 204 L100 189"/><text class="small muted" x="110" y="224" text-anchor="middle">ہاں</text><text class="body" x="748" y="270" text-anchor="end">رفتار</text><text class="body" x="456" y="261" text-anchor="middle"><tspan x="456" text-anchor="end">تینوں میں</tspan><tspan x="456" dy="17" text-anchor="end">تیز ترین</tspan></text><text class="body" x="288" y="270" text-anchor="middle">تیز</text><text class="body" x="110" y="270" text-anchor="middle">مندی</text><text class="body" x="748" y="326" text-anchor="end"><tspan x="748" text-anchor="end">کیا صارف</tspan><tspan x="748" dy="17" text-anchor="end">بڑھا سکتا ہے</tspan></text><text class="body" x="456" y="335" text-anchor="middle">ہاں</text><text class="body" x="288" y="335" text-anchor="middle">عام طور پر نہیں</text><text class="body" x="110" y="335" text-anchor="middle">ہاں</text><text class="body" x="748" y="391" text-anchor="end"><tspan x="748" text-anchor="end">عام سائز</tspan><tspan x="748" dy="17" text-anchor="end">اسکول کمپیوٹر میں</tspan></text><text class="body" x="456" y="400" text-anchor="middle">4 تا 16 گیگابائٹ</text><text class="body" x="288" y="400" text-anchor="middle">چند میگابائٹ</text><text class="body" x="110" y="391" text-anchor="middle"><tspan x="110" text-anchor="end">256 گیگابائٹ</tspan><tspan x="110" dy="17" text-anchor="end">تا 2 ٹیرابائٹ</tspan></text><text class="small muted" x="764" y="449" text-anchor="end">ہر قطار پڑھ کر تینوں قسموں کی میموری اور اسٹوریج کا موازنہ کریں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
