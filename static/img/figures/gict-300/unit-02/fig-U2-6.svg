<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the boot sequence from pressing the power button</title><desc id="d">Flowchart of the boot sequence from pressing the power button, through ROM start-up instructions and the operating system loading into RAM, to the desktop appearing and the user opening an application.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.h{font-size:16px;font-weight:700;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none}.step{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5}.num{fill:var(--ink)}.numtext{font-size:13px;font-weight:700;fill:var(--bg)}.label{font-size:14px;font-weight:700;fill:var(--ink)}.note{font-size:11px;fill:var(--muted)}.rule{stroke:var(--ink);stroke-width:1.5;opacity:.3} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="58" text-anchor="middle">Boot sequence</text><text class="muted" x="390" y="84" text-anchor="middle">From switching on the computer to opening software</text><line class="rule" x1="38" y1="108" x2="742" y2="108"/><line class="stroke" x1="152" y1="199" x2="168" y2="199" marker-end="url(#arrow)"/><line class="stroke" x1="306" y1="199" x2="322" y2="199" marker-end="url(#arrow)"/><line class="stroke" x1="460" y1="199" x2="476" y2="199" marker-end="url(#arrow)"/><line class="stroke" x1="614" y1="199" x2="630" y2="199" marker-end="url(#arrow)"/><rect class="step" x="14" y="150" width="138" height="98" rx="12"/><circle class="num" cx="37" cy="173" r="14"/><text class="numtext" x="37" y="178" text-anchor="middle">1</text><text class="label" x="83" y="194" text-anchor="middle"><tspan x="83">Power button</tspan><tspan x="83" dy="19">pressed</tspan></text><text class="note" x="83" y="276" text-anchor="middle">Starts the computer</text><rect class="panel" x="168" y="150" width="138" height="98" rx="12"/><circle class="num" cx="191" cy="173" r="14"/><text class="numtext" x="191" y="178" text-anchor="middle">2</text><text class="label" x="237" y="194" text-anchor="middle"><tspan x="237">ROM runs start-up</tspan><tspan x="237" dy="19">instructions</tspan></text><text class="note" x="237" y="276" text-anchor="middle">Checks essential hardware</text><rect class="step" x="322" y="150" width="138" height="98" rx="12"/><circle class="num" cx="345" cy="173" r="14"/><text class="numtext" x="345" y="178" text-anchor="middle">3</text><text class="label" x="391" y="194" text-anchor="middle"><tspan x="391">Operating system</tspan><tspan x="391" dy="19">loads into RAM</tspan></text><text class="note" x="391" y="276" text-anchor="middle">Prepares programs to run</text><rect class="panel" x="476" y="150" width="138" height="98" rx="12"/><circle class="num" cx="499" cy="173" r="14"/><text class="numtext" x="499" y="178" text-anchor="middle">4</text><text class="label" x="545" y="194" text-anchor="middle"><tspan x="545">Desktop and settings</tspan><tspan x="545" dy="19">appear</tspan></text><text class="note" x="545" y="276" text-anchor="middle">Ready for user input</text><rect class="step" x="630" y="150" width="138" height="98" rx="12"/><circle class="num" cx="653" cy="173" r="14"/><text class="numtext" x="653" y="178" text-anchor="middle">5</text><text class="label" x="699" y="194" text-anchor="middle"><tspan x="699">User opens an</tspan><tspan x="699" dy="19">application</tspan></text><text class="note" x="699" y="276" text-anchor="middle">Begins a task</text><path class="stroke" d="M89 340v24h609v-24"/><text class="muted" x="390" y="394" text-anchor="middle">Each numbered stage must finish before the next stage begins.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
