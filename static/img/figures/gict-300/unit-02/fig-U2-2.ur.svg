<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">آٹھ عام ڈیوائسوں کا جدول: ان پٹ، آؤٹ پٹ اور اسٹوریج خاندانوں میں</title><desc id="d">آٹھ عام ڈیوائسوں کا جدول، ان پٹ، آؤٹ پٹ اور اسٹوریج خاندانوں میں، ہر ایک کے ساتھ اس کا کام اور ایک اسکول استعمال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.42} .cell{font-size:13px;fill:var(--ink)} .family{font-size:13px;font-weight:700;fill:var(--ink)} .note{font-size:13px;fill:var(--muted)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="760" y="27" text-anchor="end">اسکول لیب کی عام ڈیوائسیں</text><text class="muted note" x="760" y="45" text-anchor="end">ہر قطار پڑھیں: ڈیوائس، خاندان، کام، اور ایک اسکول استعمال۔</text><rect class="panel" x="20" y="58" width="740" height="360" rx="4"/><rect class="ink" x="20" y="58" width="740" height="40" rx="4"/><rect class="ink" x="20" y="84" width="740" height="14"/><g class="grid"><line x1="615" y1="58" x2="615" y2="418"/><line x1="510" y1="58" x2="510" y2="418"/><line x1="275" y1="58" x2="275" y2="418"/><line x1="760" y1="98" x2="20" y2="98"/><line x1="760" y1="138" x2="20" y2="138"/><line x1="760" y1="178" x2="20" y2="178"/><line x1="760" y1="218" x2="20" y2="218"/><line x1="760" y1="258" x2="20" y2="258"/><line x1="760" y1="298" x2="20" y2="298"/><line x1="760" y1="338" x2="20" y2="338"/><line x1="760" y1="378" x2="20" y2="378"/></g><g fill="var(--bg)" font-size="15" font-weight="700"><text x="748" y="83" text-anchor="end">ڈیوائس</text><text x="603" y="83" text-anchor="end">خاندان</text><text x="498" y="83" text-anchor="end">کیا کرتی ہے</text><text x="263" y="83" text-anchor="end">ایک اسکول استعمال</text></g><g dominant-baseline="middle"><text class="cell" x="748" y="118" text-anchor="end">کی بورڈ</text><text class="family" x="603" y="118" text-anchor="end">ان پٹ</text><text class="cell" x="498" y="118" text-anchor="end">متن اور احکام ٹائپ کرتی ہے</text><text class="cell" x="263" y="118" text-anchor="end">امتحانی سوالات لکھنا</text><text class="cell" x="748" y="158" text-anchor="end">ماؤس</text><text class="family" x="603" y="158" text-anchor="end">ان پٹ</text><text class="cell" x="498" y="158" text-anchor="end">اشارہ اور کلک کرتی ہے</text><text class="cell" x="263" y="158" text-anchor="end">ڈیسک ٹاپ پر چلنا</text><text class="cell" x="748" y="198" text-anchor="end">اسکینر</text><text class="family" x="603" y="198" text-anchor="end">ان پٹ</text><text class="cell" x="498" y="198" text-anchor="end">کاغذ کو تصویر بنا دیتا ہے</text><text class="cell" x="263" y="198" text-anchor="end">پرانے ریکارڈ محفوظ کرنا</text><text class="cell" x="748" y="238" text-anchor="end">ویب کیم</text><text class="family" x="603" y="238" text-anchor="end">ان پٹ</text><text class="cell" x="498" y="238" text-anchor="end">ویڈیو بناتا ہے</text><text class="cell" x="263" y="238" text-anchor="end">سبق کی مشق ریکارڈ کرنا</text><text class="cell" x="748" y="278" text-anchor="end">مانیٹر</text><text class="family" x="603" y="278" text-anchor="end">آؤٹ پٹ</text><text class="cell" x="498" y="278" text-anchor="end">نتائج دکھاتی ہے</text><text class="cell" x="263" y="278" text-anchor="end">سبق کی ویڈیو دکھانا</text><text class="cell" x="748" y="318" text-anchor="end">پرنٹر</text><text class="family" x="603" y="318" text-anchor="end">آؤٹ پٹ</text><text class="cell" x="498" y="318" text-anchor="end">کاغذ پر چھاپتا ہے</text><text class="cell" x="263" y="318" text-anchor="end">والدین کے نوٹس چھاپنا</text><text class="cell" x="748" y="358" text-anchor="end">اسپیکر</text><text class="family" x="603" y="358" text-anchor="end">آؤٹ پٹ</text><text class="cell" x="498" y="358" text-anchor="end">آواز چلاتی ہے</text><text class="cell" x="263" y="358" text-anchor="end">زبان سننے کی لیب</text><text class="cell" x="748" y="398" text-anchor="end">یو ایس بی فلیش ڈرائیو</text><text class="family" x="603" y="398" text-anchor="end">اسٹوریج</text><text class="cell" x="498" y="398" text-anchor="end">فائلیں ساتھ لے جانے کے قابل رکھتی ہے</text><text class="cell" x="263" y="398" text-anchor="end">نمبر شیٹیں لے جانا</text></g><text class="muted note" x="760" y="440" text-anchor="end">ہر قطار میں خاندان کا نام لکھا ہے، اس لیے جدول بغیر رنگ کے بھی واضح ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
