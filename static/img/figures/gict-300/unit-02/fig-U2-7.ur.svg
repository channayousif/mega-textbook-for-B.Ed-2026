<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اسکول لیب کے نیٹ ورک کا خاکہ</title><desc id="d">اسکول لیب کے نیٹ ورک کا خاکہ: کسٹمر کمپیوٹر اور پرنٹر سوئچ سے جڑے ہیں، سوئچ روٹر سے، روٹر انٹرنیٹ لائن سے، اور وائی فائی ایکسیس پوائنٹ وائرلیس ڈیوائسوں کو خدمت دیتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .ah{fill:var(--ink)} .aha{fill:var(--a1)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle">اسکول لیب کے کمپیوٹر آپس میں کیسے جڑتے ہیں</text><text class="small" x="390" y="66" text-anchor="middle">طالب علموں کی مشینوں سے انٹرنیٹ تک کا سلسلہ، اور اسے بانٹنے والی ڈیوائسیں</text><rect class="panel" x="610" y="170" width="150" height="70"/><text class="body" x="685" y="200" text-anchor="middle" font-weight="600">لیب کے کمپیوٹر</text><text class="body" x="685" y="220" text-anchor="middle">(کسٹمر)</text><text class="small" x="685" y="262" text-anchor="middle">طالب علموں کی مشینیں</text><rect class="panel-a" x="420" y="170" width="130" height="70"/><text class="body" x="485" y="200" text-anchor="middle" font-weight="600">سوئچ</text><text class="body" x="485" y="220" text-anchor="middle">لیب کے اندر آگے بھیجتا ہے</text><text class="small" x="485" y="262" text-anchor="middle">ہر پیغام درست مشین</text><text class="small" x="485" y="278" text-anchor="middle">کو بھیجتا ہے</text><rect class="panel-b" x="230" y="170" width="130" height="70"/><text class="body" x="295" y="200" text-anchor="middle" font-weight="600">روٹر</text><text class="body" x="295" y="220" text-anchor="middle">انٹرنیٹ سے جوڑتا ہے</text><text class="small" x="295" y="262" text-anchor="middle">لیب اور باہر کے درمیان</text><text class="small" x="295" y="278" text-anchor="middle">سرحد</text><rect class="panel" x="20" y="170" width="150" height="70"/><text class="body" x="95" y="200" text-anchor="middle" font-weight="600">موڈیم یا</text><text class="body" x="95" y="220" text-anchor="middle">انٹرنیٹ لائن</text><text class="small" x="95" y="262" text-anchor="middle">جہاں سگنل عمارت</text><text class="small" x="95" y="278" text-anchor="middle">میں داخل ہوتا ہے</text><rect class="panel" x="420" y="340" width="130" height="60"/><text class="body" x="485" y="365" text-anchor="middle" font-weight="600">پرنٹر</text><text class="body" x="485" y="385" text-anchor="middle">سب کے لیے مشترکہ</text><rect class="panel" x="210" y="340" width="150" height="60"/><text class="body" x="285" y="365" text-anchor="middle" font-weight="600">وائی فائی ایکسیس پوائنٹ</text><text class="body" x="285" y="385" text-anchor="middle">وائرلیس ڈیوائسوں کو خدمت دیتا ہے</text><line class="stroke" x1="610" y1="205" x2="558" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="420" y1="205" x2="368" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="230" y1="205" x2="178" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="485" y1="240" x2="485" y2="332" marker-end="url(#arrow)"/><polyline class="stroke" points="440,240 440,310 368,310"/><line class="stroke" x1="340" y1="310" x2="320" y2="310"/><line class="stroke" x1="285" y1="310" x2="285" y2="332" marker-end="url(#arrow)"/><text class="small" x="390" y="430" text-anchor="middle">ہر ڈیوائس کو آئی پی ایڈریس ملتا ہے؛ مشترکہ قواعد (پروٹوکول) باری باری چلنے دیتے ہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
