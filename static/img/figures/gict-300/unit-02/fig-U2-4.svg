<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing RAM, ROM and secondary storage</title><desc id="d">Table comparing RAM, ROM and secondary storage across what they hold, whether they survive power off, speed, expandability and typical size.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.32} .mark{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="16" y="29">RAM, ROM and secondary storage: a comparison</text><rect class="panel-a" x="16" y="48" width="224" height="56" rx="5"/><rect class="panel-a" x="240" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="408" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="576" y="48" width="188" height="56" rx="5"/><text class="h" x="128" y="80" text-anchor="middle">Property</text><text class="h" x="324" y="80" text-anchor="middle">RAM</text><text class="h" x="492" y="80" text-anchor="middle">ROM</text><text class="h" x="670" y="72" text-anchor="middle"><tspan x="670">Secondary</tspan><tspan x="670" dy="17">storage</tspan></text><rect class="panel" x="16" y="104" width="748" height="325"/><rect class="grid" x="16" y="104" width="748" height="325"/><line class="grid" x1="240" y1="104" x2="240" y2="429"/><line class="grid" x1="408" y1="104" x2="408" y2="429"/><line class="grid" x1="576" y1="104" x2="576" y2="429"/><line class="grid" x1="16" y1="169" x2="764" y2="169"/><line class="grid" x1="16" y1="234" x2="764" y2="234"/><line class="grid" x1="16" y1="299" x2="764" y2="299"/><line class="grid" x1="16" y1="364" x2="764" y2="364"/><text class="body" x="32" y="140">What it holds</text><text class="body" x="324" y="131" text-anchor="middle"><tspan x="324">programs and data</tspan><tspan x="324" dy="17">while in use</tspan></text><text class="body" x="492" y="131" text-anchor="middle"><tspan x="492">start-up</tspan><tspan x="492" dy="17">instructions</tspan></text><text class="body" x="670" y="140" text-anchor="middle">saved files</text><text class="body" x="32" y="198"><tspan x="32">Survives power</tspan><tspan x="32" dy="17">off</tspan></text><path class="mark" d="M315 188 L333 206 M333 188 L315 206"/><text class="small muted" x="324" y="224" text-anchor="middle">no</text><path class="mark" d="M483 198 L489 204 L502 189"/><text class="small muted" x="492" y="224" text-anchor="middle">yes</text><path class="mark" d="M661 198 L667 204 L680 189"/><text class="small muted" x="670" y="224" text-anchor="middle">yes</text><text class="body" x="32" y="270">Speed</text><text class="body" x="324" y="261" text-anchor="middle"><tspan x="324">fastest of</tspan><tspan x="324" dy="17">the three</tspan></text><text class="body" x="492" y="270" text-anchor="middle">fast</text><text class="body" x="670" y="270" text-anchor="middle">slower</text><text class="body" x="32" y="326"><tspan x="32">Can the user</tspan><tspan x="32" dy="17">add more</tspan></text><text class="body" x="324" y="335" text-anchor="middle">yes</text><text class="body" x="492" y="335" text-anchor="middle">not normally</text><text class="body" x="670" y="335" text-anchor="middle">yes</text><text class="body" x="32" y="391"><tspan x="32">Typical size in</tspan><tspan x="32" dy="17">a school PC</tspan></text><text class="body" x="324" y="400" text-anchor="middle">4 to 16 GB</text><text class="body" x="492" y="400" text-anchor="middle">a few MB</text><text class="body" x="670" y="391" text-anchor="middle"><tspan x="670">256 GB</tspan><tspan x="670" dy="17">to 2 TB</tspan></text><text class="small muted" x="16" y="449">Read each row across to compare the three types of computer memory and storage.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
