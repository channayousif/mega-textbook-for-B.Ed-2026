<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A four-level storage pyramid from CPU registers at the narrow top to cloud storage at the wide base</title><desc id="d">A four-level storage pyramid from CPU registers at the narrow top to cloud storage at the wide base, with arrows showing speed and cost falling as capacity rises.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a { stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } .yes { fill: var(--ink); } .no { fill: var(--muted); } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="45" text-anchor="middle">Storage hierarchy</text><text class="small" x="390" y="66" text-anchor="middle">Speed, cost and capacity change from top to base</text><line class="stroke" x1="105" y1="382" x2="105" y2="96" marker-end="url(#arrow)"/><text class="body" x="76" y="239" text-anchor="middle" transform="rotate(-90 76 239)">faster, costlier per unit</text><line class="stroke" x1="675" y1="96" x2="675" y2="382" marker-end="url(#arrow)"/><text class="body" x="704" y="239" text-anchor="middle" transform="rotate(90 704 239)">larger, cheaper per unit</text><polygon class="panel" points="342,92 438,92 463,150 317,150"/><text class="sh" x="390" y="117" text-anchor="middle">CPU registers:</text><text class="body" x="390" y="137" text-anchor="middle">smallest, fastest</text><polygon class="panel" points="310,160 470,160 500,225 280,225"/><text class="h" x="390" y="187" text-anchor="middle">RAM: working memory,</text><text class="body" x="390" y="210" text-anchor="middle">wiped at power off</text><polygon class="panel" points="268,235 512,235 545,302 235,302"/><text class="h" x="390" y="263" text-anchor="middle">SSD and hard disk:</text><text class="body" x="390" y="287" text-anchor="middle">keeps files</text><polygon class="panel" points="222,312 558,312 600,385 180,385"/><text class="h" x="390" y="342" text-anchor="middle">cloud and backup storage:</text><text class="body" x="390" y="367" text-anchor="middle">largest, slowest to reach</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
