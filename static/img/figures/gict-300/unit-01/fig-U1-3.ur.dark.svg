<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">حسابی سنگ میل کی ٹائم لائن: قدیم گنتارا سے</title><desc id="d">حسابی سنگ میل کی ٹائم لائن: قدیم گنتارا سے میکانکی کیلکولیٹر، پنچ کارڈ مشینوں اور ENIAC کے راستے ذاتی کمپیوٹر اور اسمارٹ فون تک۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .note{font-size:13px;fill:var(--muted)} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="390" y="35" text-anchor="middle">حسابی اوزاروں سے جدید کمپیوٹر تک</text><text class="muted" x="390" y="58" text-anchor="middle">وقت کے ساتھ کمپیوٹر الیکٹرانک، چھوٹے اور ذاتی ہوتے گئے۔</text><line class="stroke" x1="740" y1="250" x2="40" y2="250" marker-end="url(#arrow)"/><text class="muted" x="740" y="280" text-anchor="end">پہلے</text><text class="muted" x="40" y="280" text-anchor="start">آج</text><line class="stroke" x1="712" y1="176" x2="712" y2="250"/><line class="stroke" x1="712" y1="240" x2="712" y2="260"/><line class="stroke" x1="584" y1="176" x2="584" y2="250"/><line class="stroke" x1="584" y1="240" x2="584" y2="260"/><line class="stroke" x1="454" y1="250" x2="454" y2="312"/><line class="stroke" x1="454" y1="240" x2="454" y2="260"/><line class="stroke" x1="326" y1="176" x2="326" y2="250"/><line class="stroke" x1="326" y1="240" x2="326" y2="260"/><line class="stroke" x1="196" y1="250" x2="196" y2="312"/><line class="stroke" x1="196" y1="240" x2="196" y2="260"/><line class="stroke" x1="68" y1="176" x2="68" y2="250"/><line class="stroke" x1="68" y1="240" x2="68" y2="260"/><rect class="panel" x="660" y="84" width="104" height="92" rx="10"/><text class="h" x="712" y="110" text-anchor="middle">گنتارا</text><text x="712" y="131" text-anchor="middle">(قدیم)</text><text class="note" x="712" y="156" text-anchor="middle">گنتی کے لیے تیلیاں</text><rect class="panel" x="520" y="76" width="128" height="100" rx="10"/><text class="h" x="584" y="102" text-anchor="middle">میکانکی</text><text class="h" x="584" y="121" text-anchor="middle">کیلکولیٹر</text><text x="584" y="142" text-anchor="middle">(1600 کی دہائی)</text><text class="note" x="584" y="163" text-anchor="middle">حساب کے لیے گیئر</text><rect class="panel" x="400" y="312" width="108" height="104" rx="10"/><text class="h" x="454" y="338" text-anchor="middle">پنچ کارڈ</text><text class="h" x="454" y="357" text-anchor="middle">مشینیں</text><text x="454" y="378" text-anchor="middle">(1890 کی دہائی)</text><text class="note" x="454" y="399" text-anchor="middle">سوراخ ڈیٹا محفوظ کرتے ہیں</text><rect class="panel" x="270" y="84" width="112" height="92" rx="10"/><text class="h" x="326" y="115" text-anchor="middle">ENIAC</text><text x="326" y="137" text-anchor="middle">(1946)</text><text class="note" x="326" y="158" text-anchor="middle">الیکٹرانک کمپیوٹنگ</text><rect class="panel" x="130" y="312" width="132" height="104" rx="10"/><text class="h" x="196" y="338" text-anchor="middle">ذاتی</text><text class="h" x="196" y="357" text-anchor="middle">کمپیوٹر</text><text x="196" y="378" text-anchor="middle">(1970-80 کی دہائی)</text><text class="note" x="196" y="399" text-anchor="middle">گھر اور اسکول میں استعمال</text><rect class="panel" x="16" y="84" width="104" height="92" rx="10"/><text class="h" x="68" y="110" text-anchor="middle">اسمارٹ فون</text><text x="68" y="131" text-anchor="middle">(2007 سے)</text><text class="note" x="68" y="156" text-anchor="middle">جیب میں کمپیوٹر</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
