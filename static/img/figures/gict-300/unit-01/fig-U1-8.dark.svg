<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five fields, education, health, agriculture, banking and government</title><desc id="d">Table of five fields, education, health, agriculture, banking and government, each with what ICT does there and one Pakistani example.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="16" y="34">ICT across everyday fields in Pakistan</text><rect class="panel" x="16" y="58" width="748" height="346" rx="4"/><rect class="bg" x="18" y="106" width="744" height="296"/><line class="grid" x1="158" y1="58" x2="158" y2="404"/><line class="grid" x1="488" y1="58" x2="488" y2="404"/><line class="grid" x1="16" y1="106" x2="764" y2="106"/><line class="grid" x1="16" y1="166" x2="764" y2="166"/><line class="grid" x1="16" y1="226" x2="764" y2="226"/><line class="grid" x1="16" y1="286" x2="764" y2="286"/><line class="grid" x1="16" y1="346" x2="764" y2="346"/><text class="h" x="30" y="87">Field</text><text class="h" x="176" y="87">What ICT does there</text><text class="h" x="506" y="79">One Pakistan</text><text class="h" x="506" y="96">example</text><text class="sh" x="30" y="137">Education</text><text class="body" x="176" y="131">Lessons, records and training</text><text class="body" x="506" y="126">Online lecture platforms</text><text class="body" x="506" y="147">School record software</text><text class="sh" x="30" y="197">Health</text><text class="body" x="176" y="191">Patient records, telemedicine</text><text class="body" x="176" y="212">and equipment</text><text class="body" x="506" y="197">Video consultation services</text><text class="sh" x="30" y="257">Agriculture</text><text class="body" x="176" y="251">Weather advisories and market prices</text><text class="body" x="506" y="247">Advisory SMS services</text><text class="body" x="506" y="268">for growers</text><text class="sh" x="30" y="317">Banking</text><text class="body" x="176" y="311">ATMs and mobile wallets</text><text class="body" x="506" y="307">Branchless banking agents</text><text class="sh" x="30" y="377">Government</text><text class="body" x="176" y="371">Online forms and identity records</text><text class="body" x="506" y="367">e-filing and online</text><text class="body" x="506" y="388">passport tracking</text><text class="small muted" x="16" y="427">ICT helps people access information, services and records.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
