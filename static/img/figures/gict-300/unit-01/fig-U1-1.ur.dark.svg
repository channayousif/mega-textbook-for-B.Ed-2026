<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ: کمپیوٹر خواندگی درمیان میں، پانچ مہارت کی شاخیں</title><desc id="d">تصوراتی نقشہ: کمپیوٹر خواندگی درمیان میں اور پانچ مہارت کی شاخیں: ڈیوائس چلانا، فائلیں سنبھالنا، دستاویزات بنانا، معلومات ڈھونڈنا اور جانچنا، اور رابطہ کرتے ہوئے محفوظ رہنا۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="muted" x="390" y="32" text-anchor="middle">کمپیوٹر خواندگی کی پانچ جڑی ہوئی مہارتیں</text><g class="stroke"><line x1="548" y1="95" x2="470" y2="190"/><line x1="232" y1="95" x2="310" y2="190"/><line x1="560" y1="240" x2="510" y2="235"/><line x1="220" y1="245" x2="270" y2="240"/><line x1="390" y1="365" x2="390" y2="280"/></g><rect class="panel" x="548" y="65" width="190" height="60" rx="12"/><text x="643" y="101" text-anchor="middle">ڈیوائس چلانا</text><rect class="panel" x="42" y="65" width="190" height="60" rx="12"/><text x="137" y="92" text-anchor="middle">معلومات ڈھونڈنا</text><text x="137" y="111" text-anchor="middle">اور جانچنا</text><rect class="panel" x="560" y="210" width="185" height="60" rx="12"/><text x="652.5" y="246" text-anchor="middle">فائلیں سنبھالنا</text><rect class="panel-a" x="270" y="190" width="240" height="90" rx="24"/><text class="h ink" x="390" y="228" text-anchor="middle">کمپیوٹر خواندگی</text><text class="muted" x="390" y="251" text-anchor="middle">عملی ڈیجیٹل مہارتیں</text><rect class="panel" x="40" y="215" width="180" height="60" rx="12"/><text x="130" y="251" text-anchor="middle">دستاویزات بنانا</text><rect class="panel" x="280" y="365" width="220" height="60" rx="12"/><text x="390" y="392" text-anchor="middle">رابطہ کرنا اور</text><text x="390" y="411" text-anchor="middle">محفوظ رہنا</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
