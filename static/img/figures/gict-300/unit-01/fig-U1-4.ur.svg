<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کمپیوٹر کی پانچ نسلوں کا جدول، ہر ایک کے سال، بنیادی ٹیکنالوجی اور مثال</title><desc id="d">کمپیوٹر کی پانچ نسلوں کا جدول، ہر ایک کے سال، بنیادی ٹیکنالوجی اور مثال کے ساتھ، ویکیوم ٹیوب والے ENIAC سے آج کے مصنوعی ذہانت کے نظاموں تک۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:16px;font-weight:700;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.42} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="756" y="30" text-anchor="end">کمپیوٹر کی نسلیں</text><text class="muted" x="24" y="30" text-anchor="start" font-size="13">بنیادی ٹیکنالوجی اور مثالی مشین</text><rect class="panel" x="24" y="48" width="732" height="350" rx="4"/><rect class="panel-a" x="24" y="48" width="732" height="60" rx="4"/><line class="grid" x1="646" y1="48" x2="646" y2="398"/><line class="grid" x1="501" y1="48" x2="501" y2="398"/><line class="grid" x1="216" y1="48" x2="216" y2="398"/><line class="grid" x1="756" y1="108" x2="24" y2="108"/><line class="grid" x1="756" y1="166" x2="24" y2="166"/><line class="grid" x1="756" y1="224" x2="24" y2="224"/><line class="grid" x1="756" y1="282" x2="24" y2="282"/><line class="grid" x1="756" y1="340" x2="24" y2="340"/><text class="h" x="701" y="84" text-anchor="middle">نسل</text><text class="h" x="573.5" y="84" text-anchor="middle">سال</text><text class="h" x="358.5" y="84" text-anchor="middle">بنیادی ٹیکنالوجی</text><text class="h" x="120" y="84" text-anchor="middle">مثال</text><text class="body ink" x="701" y="141" text-anchor="middle" font-weight="700">پہلی</text><text class="body" x="573.5" y="141" text-anchor="middle">1940-1950 کی دہائی</text><text class="body" x="358.5" y="141" text-anchor="middle">ویکیوم ٹیوبیں</text><text class="body" x="120" y="141" text-anchor="middle">ENIAC</text><text class="body ink" x="701" y="199" text-anchor="middle" font-weight="700">دوسری</text><text class="body" x="573.5" y="199" text-anchor="middle">1950-1960 کی دہائی</text><text class="body" x="358.5" y="199" text-anchor="middle">ٹرانزسٹر</text><text class="body" x="120" y="199" text-anchor="middle">IBM 1401</text><text class="body ink" x="701" y="257" text-anchor="middle" font-weight="700">تیسری</text><text class="body" x="573.5" y="257" text-anchor="middle">1960-1970 کی دہائی</text><text class="body" x="358.5" y="257" text-anchor="middle">انٹیگریٹڈ سرکٹس</text><text class="body" x="120" y="257" text-anchor="middle">IBM System/360</text><text class="body ink" x="701" y="315" text-anchor="middle" font-weight="700">چوتھی</text><text class="body" x="573.5" y="315" text-anchor="middle">1970 کی دہائی سے آج تک</text><text class="body" x="358.5" y="315" text-anchor="middle">مائیکرو پروسیسر</text><text class="body" x="120" y="315" text-anchor="middle">IBM PC اور Apple II</text><text class="body ink" x="701" y="371" text-anchor="middle" font-weight="700">پانچویں</text><text class="body" x="573.5" y="371" text-anchor="middle">زمانہ حال اور مستقبل</text><text class="body" x="358.5" y="363" text-anchor="middle"><tspan x="358.5" dy="0" text-anchor="end">مصنوعی ذہانت اور</tspan><tspan x="358.5" dy="18" text-anchor="end">بہت بڑے پیمانے کا انٹیگریشن</tspan></text><text class="body" x="120" y="371" text-anchor="middle">جدید AI نظام</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
