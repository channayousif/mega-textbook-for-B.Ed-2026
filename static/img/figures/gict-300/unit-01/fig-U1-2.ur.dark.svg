<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ روزمرہ اسکول کاموں کا جدول</title><desc id="d">پانچ روزمرہ اسکول کاموں کا جدول، ہر کام کے ساتھ اس کی ضرورت کی ڈیوائس، فائل سنبھالنے اور معلوماتی مہارتیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .h{font-size:15px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.35} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="764" y="29" text-anchor="end">روزمرہ اسکول کے کام اور متعلقہ آئی سی ٹی مہارتیں</text><rect class="panel-a" x="540" y="48" width="224" height="56" rx="5"/><rect class="panel-a" x="372" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="204" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="16" y="48" width="188" height="56" rx="5"/><text class="h" x="652" y="80" text-anchor="middle">کام</text><text class="h" x="456" y="72" text-anchor="middle"><tspan x="456" text-anchor="end">ڈیوائس</tspan><tspan x="456" dy="17" text-anchor="end">مہارت</tspan></text><text class="h" x="288" y="64" text-anchor="middle"><tspan x="288" text-anchor="end">فائل اور دستاویز</tspan><tspan x="288" dy="17" text-anchor="end">مہارت</tspan></text><text class="h" x="110" y="72" text-anchor="middle"><tspan x="110" text-anchor="end">معلومات</tspan><tspan x="110" dy="17" text-anchor="end">مہارت</tspan></text><rect class="panel" x="540" y="104" width="224" height="325"/><rect class="grid" x="16" y="104" width="748" height="325"/><line class="grid" x1="540" y1="104" x2="540" y2="429"/><line class="grid" x1="372" y1="104" x2="372" y2="429"/><line class="grid" x1="204" y1="104" x2="204" y2="429"/><line class="grid" x1="764" y1="169" x2="16" y2="169"/><line class="grid" x1="764" y1="234" x2="16" y2="234"/><line class="grid" x1="764" y1="299" x2="16" y2="299"/><line class="grid" x1="764" y1="364" x2="16" y2="364"/><text class="body" x="652" y="131" text-anchor="middle"><tspan x="652" text-anchor="end">اسپریڈ شیٹ میں</tspan><tspan x="652" dy="17" text-anchor="end">حاضری درج کرنا</tspan></text><text class="body" x="456" y="131" text-anchor="middle"><tspan x="456" text-anchor="end">کی بورڈ اور</tspan><tspan x="456" dy="17" text-anchor="end">ماؤس استعمال کرنا</tspan></text><text class="body" x="288" y="131" text-anchor="middle"><tspan x="288" text-anchor="end">ڈیٹا درج کر کے</tspan><tspan x="288" dy="17" text-anchor="end">ورک بک محفوظ کرنا</tspan></text><text class="body" x="110" y="131" text-anchor="middle"><tspan x="110" text-anchor="end">نام اور کل تعداد</tspan><tspan x="110" dy="17" text-anchor="end">جانچنا</tspan></text><text class="body" x="652" y="196" text-anchor="middle"><tspan x="652" text-anchor="end">فائل دفتر کو</tspan><tspan x="652" dy="17" text-anchor="end">ای میل کرنا</tspan></text><text class="body" x="456" y="196" text-anchor="middle"><tspan x="456" text-anchor="end">کی بورڈ اور</tspan><tspan x="456" dy="17" text-anchor="end">کنکشن استعمال کرنا</tspan></text><text class="body" x="288" y="196" text-anchor="middle"><tspan x="288" text-anchor="end">درست فائل</tspan><tspan x="288" dy="17" text-anchor="end">منسلک کرنا</tspan></text><text class="body" x="110" y="196" text-anchor="middle"><tspan x="110" text-anchor="end">دفتری ای میل</tspan><tspan x="110" dy="17" text-anchor="end">پتہ استعمال کرنا</tspan></text><text class="body" x="652" y="261" text-anchor="middle"><tspan x="652" text-anchor="end">آن لائن سبق کی</tspan><tspan x="652" dy="17" text-anchor="end">ویڈیو ڈھونڈنا</tspan></text><text class="body" x="456" y="261" text-anchor="middle"><tspan x="456" text-anchor="end">براؤزر اور اسپیکر</tspan><tspan x="456" dy="17" text-anchor="end">استعمال کرنا</tspan></text><text class="body" x="288" y="261" text-anchor="middle"><tspan x="288" text-anchor="end">ویڈیو لنک کھول کر</tspan><tspan x="288" dy="17" text-anchor="end">محفوظ کرنا</tspan></text><text class="body" x="110" y="261" text-anchor="middle"><tspan x="110" text-anchor="end">سرچ کر کے ذریعہ</tspan><tspan x="110" dy="17" text-anchor="end">جانچنا</tspan></text><text class="body" x="652" y="319" text-anchor="middle"><tspan x="652" text-anchor="end">ورڈ پروسیسر میں</tspan><tspan x="652" dy="17" text-anchor="end">والدین کا نوٹس تیار کرنا</tspan></text><text class="body" x="456" y="326" text-anchor="middle"><tspan x="456" text-anchor="end">کی بورڈ اور</tspan><tspan x="456" dy="17" text-anchor="end">ماؤس استعمال کرنا</tspan></text><text class="body" x="288" y="326" text-anchor="middle"><tspan x="288" text-anchor="end">نوٹس کی ترتیب اور</tspan><tspan x="288" dy="17" text-anchor="end">محفوظ کرنا</tspan></text><text class="body" x="110" y="326" text-anchor="middle"><tspan x="110" text-anchor="end">قارئین اور تفصیلات</tspan><tspan x="110" dy="17" text-anchor="end">جانچنا</tspan></text><text class="body" x="652" y="384" text-anchor="middle"><tspan x="652" text-anchor="end">امتحانی ریکارڈ یو ایس بی</tspan><tspan x="652" dy="17" text-anchor="end">ڈرائیو پر محفوظ کرنا</tspan></text><text class="body" x="456" y="391" text-anchor="middle"><tspan x="456" text-anchor="end">یو ایس بی پورٹ اور</tspan><tspan x="456" dy="17" text-anchor="end">اسٹوریج ڈرائیو استعمال کرنا</tspan></text><text class="body" x="288" y="391" text-anchor="middle"><tspan x="288" text-anchor="end">بیک اپ کاپی کر کے</tspan><tspan x="288" dy="17" text-anchor="end">نام دینا</tspan></text><text class="body" x="110" y="391" text-anchor="middle"><tspan x="110" text-anchor="end">تصدیق کرنا کہ ریکارڈ</tspan><tspan x="110" dy="17" text-anchor="end">مکمل ہیں</tspan></text><text class="small muted" x="764" y="449" text-anchor="end">ہر قطار پڑھ کر بتائیں کہ ایک کام کے لیے کون سی مہارتیں درکار ہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
