<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of the five computer generations with years, core technology and an example machine for each</title><desc id="d">Table of the five computer generations with years, core technology and an example machine for each, from vacuum-tube ENIAC to present-day artificial intelligence systems.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.h{font-size:16px;font-weight:700;fill:var(--ink)}.body{font-size:14px;fill:var(--ink)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)}.grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.42} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="24" y="30">Computer generations</text><text class="muted" x="756" y="30" text-anchor="end" font-size="13">Core technology and example machine</text><rect class="panel" x="24" y="48" width="732" height="350" rx="4"/><rect class="panel-a" x="24" y="48" width="732" height="60" rx="4"/><line class="grid" x1="134" y1="48" x2="134" y2="398"/><line class="grid" x1="279" y1="48" x2="279" y2="398"/><line class="grid" x1="564" y1="48" x2="564" y2="398"/><line class="grid" x1="24" y1="108" x2="756" y2="108"/><line class="grid" x1="24" y1="166" x2="756" y2="166"/><line class="grid" x1="24" y1="224" x2="756" y2="224"/><line class="grid" x1="24" y1="282" x2="756" y2="282"/><line class="grid" x1="24" y1="340" x2="756" y2="340"/><text class="h" x="79" y="84" text-anchor="middle">Generation</text><text class="h" x="206.5" y="84" text-anchor="middle">Years</text><text class="h" x="421.5" y="84" text-anchor="middle">Core technology</text><text class="h" x="660" y="84" text-anchor="middle">Example</text><text class="body ink" x="79" y="141" text-anchor="middle" font-weight="700">First</text><text class="body" x="206.5" y="141" text-anchor="middle">1940s-1950s</text><text class="body" x="421.5" y="141" text-anchor="middle">vacuum tubes</text><text class="body" x="660" y="141" text-anchor="middle">ENIAC</text><text class="body ink" x="79" y="199" text-anchor="middle" font-weight="700">Second</text><text class="body" x="206.5" y="199" text-anchor="middle">1950s-1960s</text><text class="body" x="421.5" y="199" text-anchor="middle">transistors</text><text class="body" x="660" y="199" text-anchor="middle">IBM 1401</text><text class="body ink" x="79" y="257" text-anchor="middle" font-weight="700">Third</text><text class="body" x="206.5" y="257" text-anchor="middle">1960s-1970s</text><text class="body" x="421.5" y="257" text-anchor="middle">integrated circuits</text><text class="body" x="660" y="257" text-anchor="middle">IBM System/360</text><text class="body ink" x="79" y="315" text-anchor="middle" font-weight="700">Fourth</text><text class="body" x="206.5" y="315" text-anchor="middle">1970s-present</text><text class="body" x="421.5" y="315" text-anchor="middle">microprocessors</text><text class="body" x="660" y="315" text-anchor="middle">IBM PC and Apple II</text><text class="body ink" x="79" y="371" text-anchor="middle" font-weight="700">Fifth</text><text class="body" x="206.5" y="371" text-anchor="middle">present and future</text><text class="body" x="421.5" y="363" text-anchor="middle"><tspan x="421.5" dy="0">artificial intelligence and</tspan><tspan x="421.5" dy="18">very large scale integration</tspan></text><text class="body" x="660" y="371" text-anchor="middle">modern AI systems</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
