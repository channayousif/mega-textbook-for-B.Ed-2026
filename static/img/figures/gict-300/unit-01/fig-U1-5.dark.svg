<svg viewBox="0 0 780 470" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg"><title id="t">Table comparing analog, digital and hybrid computers</title><desc id="d">Table comparing analog, digital and hybrid computers by the signal they work with, how they answer, and one example of each.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: var(--ink); } .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .ink { fill: var(--ink); } .muted { fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; } .body { font-size: 14px; fill: var(--ink); } .type { font-size: 15px; font-weight: 700; fill: var(--ink); } .subtitle { font-size: 14px; } .header { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .type-cell { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="28" y="38">Three ways computers handle information</text><text class="muted subtitle" x="28" y="62">Compare the kind of signal, the method, and a familiar example.</text><rect class="header" x="28" y="88" width="724" height="72" rx="6"/><rect class="panel" x="28" y="160" width="724" height="73"/><rect class="panel" x="28" y="233" width="724" height="73"/><rect class="panel" x="28" y="306" width="724" height="73"/><rect class="type-cell" x="28" y="160" width="137" height="73"/><rect class="type-cell" x="28" y="233" width="137" height="73"/><rect class="type-cell" x="28" y="306" width="137" height="73"/><path class="grid" d="M165 88V379M415 88V379M592 88V379M28 160H752M28 233H752M28 306H752"/><text class="h" x="96.5" y="130" text-anchor="middle">Type</text><text class="h" x="290" y="120" text-anchor="middle">Signal it</text><text class="h" x="290" y="140" text-anchor="middle">works with</text><text class="h" x="503.5" y="120" text-anchor="middle">How it</text><text class="h" x="503.5" y="140" text-anchor="middle">answers</text><text class="h" x="672" y="130" text-anchor="middle">Example</text><text class="type" x="96.5" y="202" text-anchor="middle">Analog</text><text class="body" x="290" y="191" text-anchor="middle">Continuous physical</text><text class="body" x="290" y="212" text-anchor="middle">quantity</text><text class="body" x="503.5" y="202" text-anchor="middle">By measuring</text><text class="body" x="672" y="202" text-anchor="middle">Slide rule</text><text class="type" x="96.5" y="275" text-anchor="middle">Digital</text><text class="body" x="290" y="264" text-anchor="middle">Discrete 0s</text><text class="body" x="290" y="285" text-anchor="middle">and 1s</text><text class="body" x="503.5" y="275" text-anchor="middle">By counting exactly</text><text class="body" x="672" y="264" text-anchor="middle">Laptop and</text><text class="body" x="672" y="285" text-anchor="middle">smartphone</text><text class="type" x="96.5" y="348" text-anchor="middle">Hybrid</text><text class="body" x="290" y="337" text-anchor="middle">Measures analog, then</text><text class="body" x="290" y="358" text-anchor="middle">converts to digital</text><text class="body" x="503.5" y="337" text-anchor="middle">By measuring,</text><text class="body" x="503.5" y="358" text-anchor="middle">then counting</text><text class="body" x="672" y="337" text-anchor="middle">Hospital patient</text><text class="body" x="672" y="358" text-anchor="middle">monitor</text><text class="muted subtitle" x="28" y="412">A hybrid computer links a measured signal with exact digital processing.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
