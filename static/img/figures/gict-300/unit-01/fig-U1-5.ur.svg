<svg viewBox="0 0 780 470" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg"><title id="t">اینالاگ، ڈیجیٹل اور ہائبرڈ کمپیوٹروں کا موازنہ</title><desc id="d">اینالاگ، ڈیجیٹل اور ہائبرڈ کمپیوٹروں کا موازنہ: جس سگنل پر کام کرتے ہیں، کیسے جواب دیتے ہیں، اور ہر ایک کی ایک مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} text { font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif; fill: var(--ink); } .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .ink { fill: var(--ink); } .muted { fill: var(--muted); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; } .body { font-size: 14px; fill: var(--ink); } .type { font-size: 15px; font-weight: 700; fill: var(--ink); } .subtitle { font-size: 14px; } .header { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .type-cell { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="752" y="38" text-anchor="end">معلومات سنبھالنے کے تین طریقے</text><text class="muted subtitle" x="752" y="62" text-anchor="end">سگنل کی قسم، طریقہ اور ایک عام مثال کا موازنہ کریں۔</text><rect class="header" x="28" y="88" width="724" height="72" rx="6"/><rect class="panel" x="28" y="160" width="724" height="73"/><rect class="panel" x="28" y="233" width="724" height="73"/><rect class="panel" x="28" y="306" width="724" height="73"/><rect class="type-cell" x="615" y="160" width="137" height="73"/><rect class="type-cell" x="615" y="233" width="137" height="73"/><rect class="type-cell" x="615" y="306" width="137" height="73"/><path class="grid" d="M615 88 V379 M365 88 V379 M188 88 V379 M752 160 H28 M752 233 H28 M752 306 H28"/><text class="h" x="683.5" y="130" text-anchor="middle">قسم</text><text class="h" x="490" y="120" text-anchor="middle">جس سگنل پر</text><text class="h" x="490" y="140" text-anchor="middle">کام کرتا ہے</text><text class="h" x="276.5" y="120" text-anchor="middle">کیسے</text><text class="h" x="276.5" y="140" text-anchor="middle">جواب دیتا ہے</text><text class="h" x="108" y="130" text-anchor="middle">مثال</text><text class="type" x="683.5" y="202" text-anchor="middle">اینالاگ</text><text class="body" x="490" y="191" text-anchor="middle">مسلسل طبیعی</text><text class="body" x="490" y="212" text-anchor="middle">مقدار</text><text class="body" x="276.5" y="202" text-anchor="middle">پیمائش سے</text><text class="body" x="108" y="202" text-anchor="middle">سلائیڈ رول</text><text class="type" x="683.5" y="275" text-anchor="middle">ڈیجیٹل</text><text class="body" x="490" y="264" text-anchor="middle">الگ الگ صفر</text><text class="body" x="490" y="285" text-anchor="middle">اور ایک</text><text class="body" x="276.5" y="275" text-anchor="middle">بالکل درست گنتی سے</text><text class="body" x="108" y="264" text-anchor="middle">لیپ ٹاپ اور</text><text class="body" x="108" y="285" text-anchor="middle">اسمارٹ فون</text><text class="type" x="683.5" y="348" text-anchor="middle">ہائبرڈ</text><text class="body" x="490" y="337" text-anchor="middle">اینالاگ ناپتا ہے، پھر</text><text class="body" x="490" y="358" text-anchor="middle">ڈیجیٹل میں بدلتا ہے</text><text class="body" x="276.5" y="337" text-anchor="middle">پیمائش سے،</text><text class="body" x="276.5" y="358" text-anchor="middle">پھر گنتی سے</text><text class="body" x="108" y="337" text-anchor="middle">ہسپتال کی مریض</text><text class="body" x="108" y="358" text-anchor="middle">نگرانی مشین</text><text class="muted subtitle" x="752" y="412" text-anchor="end">ہائبرڈ کمپیوٹر ناپی ہوئی سگنل کو درست ڈیجیٹل پروسیسنگ سے جوڑتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
