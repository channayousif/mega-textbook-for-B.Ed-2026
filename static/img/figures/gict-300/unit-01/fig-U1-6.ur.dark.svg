<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سپر کمپیوٹر سے اندرونی کمپیوٹر تک پانچ سیڑھیاں</title><desc id="d">سپر کمپیوٹر سے اندرونی کمپیوٹر تک پانچ سیڑھیاں، ہر سیڑھی پر طبقے کا نام اور استعمال کی ایک سطر۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .line{stroke:var(--ink);stroke-width:2;fill:none} text{fill:var(--ink)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="716" y="43" text-anchor="end">کمپیوٹر کے طبقے، حجم اور طاقت</text><text class="small" x="716" y="67" text-anchor="end">اوپر بڑے مشترکہ نظام، نیچے چھوٹے مخصوص نظام</text><path class="line" d="M726 88 H710 M726 88 V420 H101" stroke-dasharray="5 5"/><text class="small" x="726" y="82" text-anchor="end">زیادہ گنجائش</text><text class="small" x="94" y="425" text-anchor="end">زیادہ مخصوص</text><rect class="panel" x="380" y="92" width="330" height="60" rx="8"/><circle class="ink" cx="686" cy="122" r="13"/><text x="686" y="127" text-anchor="middle" font-size="13" fill="var(--bg)">1</text><text class="h" x="662" y="118" text-anchor="end">سپر کمپیوٹر</text><text class="muted" x="662" y="139" font-size="13" text-anchor="end">قومی سطح پر موسم اور تحقیق</text><rect class="panel" x="315" y="154" width="330" height="60" rx="8"/><circle class="ink" cx="621" cy="184" r="13"/><text x="621" y="189" text-anchor="middle" font-size="13" fill="var(--bg)">2</text><text class="h" x="597" y="180" text-anchor="end">مین فریم</text><text class="muted" x="597" y="201" font-size="13" text-anchor="end">بینک اور ایئرلائن ریکارڈ</text><rect class="panel" x="250" y="216" width="330" height="60" rx="8"/><circle class="ink" cx="556" cy="246" r="13"/><text x="556" y="251" text-anchor="middle" font-size="13" fill="var(--bg)">3</text><text class="h" x="532" y="242" text-anchor="end">منی کمپیوٹر</text><text class="muted" x="532" y="263" font-size="13" text-anchor="end">درمیانی اداروں کے نظام</text><rect class="panel" x="185" y="278" width="330" height="60" rx="8"/><circle class="ink" cx="491" cy="308" r="13"/><text x="491" y="313" text-anchor="middle" font-size="13" fill="var(--bg)">4</text><text class="h" x="467" y="304" text-anchor="end">مائیکرو کمپیوٹر</text><text class="muted" x="467" y="325" font-size="13" text-anchor="end">ڈیسک ٹاپ، لیپ ٹاپ، ٹیبلٹ، اسمارٹ فون</text><rect class="panel" x="120" y="340" width="330" height="60" rx="8"/><circle class="ink" cx="426" cy="370" r="13"/><text x="426" y="375" text-anchor="middle" font-size="13" fill="var(--bg)">5</text><text class="h" x="402" y="366" text-anchor="end">اندرونی کمپیوٹر</text><text class="muted" x="402" y="387" font-size="13" text-anchor="end">کسی دوسری مشین کے اندر لگا</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
