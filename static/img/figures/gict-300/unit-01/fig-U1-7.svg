<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with computers and the internet at the centre</title><desc id="d">Concept map with computers and the internet at the centre, branches to communication, education, work and services, shopping and banking, entertainment, and a dashed side box listing the challenges of digital divide, misinformation and screen time.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .link{stroke:var(--ink);stroke-width:2.5;fill:none} .challenge{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5} .label{font-size:15px;font-weight:600;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><path class="link" d="M300 188 L215 116"/><path class="link" d="M390 178 L390 85"/><path class="link" d="M480 188 L565 116"/><path class="link" d="M296 271 L235 342"/><path class="link" d="M484 273 L554 351"/><path class="link" d="M512 230 L545 230"/><rect class="panel" x="35" y="65" width="180" height="52" rx="10"/><text class="label" x="125" y="96" text-anchor="middle">communication</text><rect class="panel" x="290" y="25" width="200" height="60" rx="10"/><text class="label" x="390" y="60" text-anchor="middle">education</text><rect class="panel" x="565" y="65" width="180" height="52" rx="10"/><text class="label" x="655" y="96" text-anchor="middle">work and services</text><rect class="panel" x="25" y="342" width="210" height="56" rx="10"/><text class="label" x="130" y="376" text-anchor="middle">shopping and banking</text><rect class="panel" x="554" y="351" width="191" height="52" rx="10"/><text class="label" x="649.5" y="382" text-anchor="middle">entertainment</text><ellipse class="center" cx="390" cy="230" rx="122" ry="54"/><text class="h" x="390" y="224" text-anchor="middle">Computers and</text><text class="h" x="390" y="246" text-anchor="middle">the internet</text><rect class="challenge" x="545" y="180" width="210" height="100" rx="10"/><text class="h" x="560" y="205">Challenges</text><text class="small" x="560" y="229">digital divide</text><text class="small" x="560" y="250">misinformation</text><text class="small" x="560" y="271">screen time</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
