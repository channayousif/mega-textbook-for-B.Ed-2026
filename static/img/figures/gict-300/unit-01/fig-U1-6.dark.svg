<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A five-step ladder from supercomputer down to embedded computer</title><desc id="d">A five-step ladder from supercomputer down to embedded computer, each step naming the class and one line about where it is used.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .line{stroke:var(--ink);stroke-width:2;fill:none} text{fill:var(--ink)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="64" y="43">Computer classes, size and power</text><text class="small" x="64" y="67">Larger shared systems at the top, smaller specialised systems at the bottom</text><path class="line" d="M54 88H70M54 88V420H679" stroke-dasharray="5 5"/><text class="small" x="54" y="82">larger capacity</text><text class="small" x="768" y="425" text-anchor="end">more specialised</text><rect class="panel" x="70" y="92" width="330" height="60" rx="8"/><circle class="ink" cx="94" cy="122" r="13"/><text x="94" y="127" text-anchor="middle" font-size="13" fill="var(--bg)">1</text><text class="h" x="118" y="118">Supercomputer</text><text class="muted" x="118" y="139" font-size="13">weather and research at national scale</text><rect class="panel" x="135" y="154" width="330" height="60" rx="8"/><circle class="ink" cx="159" cy="184" r="13"/><text x="159" y="189" text-anchor="middle" font-size="13" fill="var(--bg)">2</text><text class="h" x="183" y="180">Mainframe</text><text class="muted" x="183" y="201" font-size="13">bank and airline records</text><rect class="panel" x="200" y="216" width="330" height="60" rx="8"/><circle class="ink" cx="224" cy="246" r="13"/><text x="224" y="251" text-anchor="middle" font-size="13" fill="var(--bg)">3</text><text class="h" x="248" y="242">Minicomputer</text><text class="muted" x="248" y="263" font-size="13">medium company systems</text><rect class="panel" x="265" y="278" width="330" height="60" rx="8"/><circle class="ink" cx="289" cy="308" r="13"/><text x="289" y="313" text-anchor="middle" font-size="13" fill="var(--bg)">4</text><text class="h" x="313" y="304">Microcomputer</text><text class="muted" x="313" y="325" font-size="13">desktop, laptop, tablet, smartphone</text><rect class="panel" x="330" y="340" width="330" height="60" rx="8"/><circle class="ink" cx="354" cy="370" r="13"/><text x="354" y="375" text-anchor="middle" font-size="13" fill="var(--bg)">5</text><text class="h" x="378" y="366">Embedded computer</text><text class="muted" x="378" y="387" font-size="13">fixed inside another device</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
