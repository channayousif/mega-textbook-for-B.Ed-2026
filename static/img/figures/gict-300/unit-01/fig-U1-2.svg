<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five everyday school tasks</title><desc id="d">Table of five everyday school tasks, each matched to the device, file-handling and information skills it needs.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2}.panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .h{font-size:15px;font-weight:700;fill:var(--ink)}.body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)}.wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.35} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="16" y="29">Everyday school tasks: matching ICT skills</text><rect class="panel-a" x="16" y="48" width="224" height="56" rx="5"/><rect class="panel-a" x="240" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="408" y="48" width="168" height="56" rx="5"/><rect class="panel-a" x="576" y="48" width="188" height="56" rx="5"/><text class="h" x="128" y="80" text-anchor="middle">Task</text><text class="h" x="324" y="72" text-anchor="middle"><tspan x="324">Device</tspan><tspan x="324" dy="17">skill</tspan></text><text class="h" x="492" y="64" text-anchor="middle"><tspan x="492">File and document</tspan><tspan x="492" dy="17">skill</tspan></text><text class="h" x="670" y="72" text-anchor="middle"><tspan x="670">Information</tspan><tspan x="670" dy="17">skill</tspan></text><rect class="panel" x="16" y="104" width="224" height="325"/><rect class="grid" x="16" y="104" width="748" height="325"/><line class="grid" x1="240" y1="104" x2="240" y2="429"/><line class="grid" x1="408" y1="104" x2="408" y2="429"/><line class="grid" x1="576" y1="104" x2="576" y2="429"/><line class="grid" x1="16" y1="169" x2="764" y2="169"/><line class="grid" x1="16" y1="234" x2="764" y2="234"/><line class="grid" x1="16" y1="299" x2="764" y2="299"/><line class="grid" x1="16" y1="364" x2="764" y2="364"/><text class="body" x="128" y="131" text-anchor="middle"><tspan x="128">Enter attendance</tspan><tspan x="128" dy="17">in a spreadsheet</tspan></text><text class="body" x="324" y="131" text-anchor="middle"><tspan x="324">Use keyboard and</tspan><tspan x="324" dy="17">mouse</tspan></text><text class="body" x="492" y="131" text-anchor="middle"><tspan x="492">Enter data and</tspan><tspan x="492" dy="17">save workbook</tspan></text><text class="body" x="670" y="131" text-anchor="middle"><tspan x="670">Check names and</tspan><tspan x="670" dy="17">totals</tspan></text><text class="body" x="128" y="196" text-anchor="middle"><tspan x="128">Email the file</tspan><tspan x="128" dy="17">to the office</tspan></text><text class="body" x="324" y="196" text-anchor="middle"><tspan x="324">Use keyboard and</tspan><tspan x="324" dy="17">network connection</tspan></text><text class="body" x="492" y="196" text-anchor="middle"><tspan x="492">Attach the correct</tspan><tspan x="492" dy="17">file</tspan></text><text class="body" x="670" y="196" text-anchor="middle"><tspan x="670">Use the office</tspan><tspan x="670" dy="17">email address</tspan></text><text class="body" x="128" y="261" text-anchor="middle"><tspan x="128">Find a lesson</tspan><tspan x="128" dy="17">video online</tspan></text><text class="body" x="324" y="261" text-anchor="middle"><tspan x="324">Use browser and</tspan><tspan x="324" dy="17">speakers</tspan></text><text class="body" x="492" y="261" text-anchor="middle"><tspan x="492">Open and save</tspan><tspan x="492" dy="17">the video link</tspan></text><text class="body" x="670" y="261" text-anchor="middle"><tspan x="670">Search and judge</tspan><tspan x="670" dy="17">the source</tspan></text><text class="body" x="128" y="319" text-anchor="middle"><tspan x="128">Prepare a parent notice</tspan><tspan x="128" dy="17">in a word processor</tspan></text><text class="body" x="324" y="326" text-anchor="middle"><tspan x="324">Use keyboard and</tspan><tspan x="324" dy="17">mouse</tspan></text><text class="body" x="492" y="326" text-anchor="middle"><tspan x="492">Format and save</tspan><tspan x="492" dy="17">the notice</tspan></text><text class="body" x="670" y="326" text-anchor="middle"><tspan x="670">Check audience and</tspan><tspan x="670" dy="17">details</tspan></text><text class="body" x="128" y="384" text-anchor="middle"><tspan x="128">Back up exam records</tspan><tspan x="128" dy="17">to a USB drive</tspan></text><text class="body" x="324" y="391" text-anchor="middle"><tspan x="324">Use USB port and</tspan><tspan x="324" dy="17">storage drive</tspan></text><text class="body" x="492" y="391" text-anchor="middle"><tspan x="492">Copy and name</tspan><tspan x="492" dy="17">the backup</tspan></text><text class="body" x="670" y="391" text-anchor="middle"><tspan x="670">Verify records are</tspan><tspan x="670" dy="17">complete</tspan></text><text class="small muted" x="16" y="449">Read each row across to identify the skills needed for one task.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
