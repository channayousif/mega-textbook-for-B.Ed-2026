<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ شعبوں کا جدول: تعلیم، صحت، زراعت، بینکاری اور حکومت</title><desc id="d">پانچ شعبوں کا جدول، تعلیم، صحت، زراعت، بینکاری اور حکومت، ہر ایک کے ساتھ آئی سی ٹی کا کام اور ایک پاکستانی مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)}.ink{fill:var(--ink)}.muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)}.small{font-size:13px;fill:var(--muted)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .wm{fill:var(--wm);font-size:11px}.ah{fill:var(--ink)} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="764" y="34" text-anchor="end">پاکستان میں روزمرہ شعبوں میں آئی سی ٹی</text><rect class="panel" x="16" y="58" width="748" height="346" rx="4"/><rect class="bg" x="18" y="106" width="744" height="296"/><line class="grid" x1="622" y1="58" x2="622" y2="404"/><line class="grid" x1="292" y1="58" x2="292" y2="404"/><line class="grid" x1="764" y1="106" x2="16" y2="106"/><line class="grid" x1="764" y1="166" x2="16" y2="166"/><line class="grid" x1="764" y1="226" x2="16" y2="226"/><line class="grid" x1="764" y1="286" x2="16" y2="286"/><line class="grid" x1="764" y1="346" x2="16" y2="346"/><text class="h" x="750" y="87" text-anchor="end">شعبہ</text><text class="h" x="604" y="87" text-anchor="end">وہاں آئی سی ٹی کیا کرتی ہے</text><text class="h" x="274" y="79" text-anchor="end">ایک پاکستانی</text><text class="h" x="274" y="96" text-anchor="end">مثال</text><text class="sh" x="750" y="137" text-anchor="end">تعلیم</text><text class="body" x="604" y="131" text-anchor="end">اسباق، ریکارڈ اور تربیت</text><text class="body" x="274" y="126" text-anchor="end">آن لائن لیکچر پلیٹ فارم</text><text class="body" x="274" y="147" text-anchor="end">اسکول ریکارڈ سافٹ ویئر</text><text class="sh" x="750" y="197" text-anchor="end">صحت</text><text class="body" x="604" y="191" text-anchor="end">مریض ریکارڈ، ٹیلی میڈیسن</text><text class="body" x="604" y="212" text-anchor="end">اور آلات</text><text class="body" x="274" y="197" text-anchor="end">ویڈیو مشاورت کی سہولت</text><text class="sh" x="750" y="257" text-anchor="end">زراعت</text><text class="body" x="604" y="251" text-anchor="end">موسمی مشورے اور منڈی کی قیمتیں</text><text class="body" x="274" y="247" text-anchor="end">مشورے کی ایس ایم ایس سہولت</text><text class="body" x="274" y="268" text-anchor="end">کسانوں کے لیے</text><text class="sh" x="750" y="317" text-anchor="end">بینکاری</text><text class="body" x="604" y="311" text-anchor="end">اے ٹی ایم اور موبائل والٹ</text><text class="body" x="274" y="307" text-anchor="end">برانچ کے بغیر بینکاری ایجنٹ</text><text class="sh" x="750" y="377" text-anchor="end">حکومت</text><text class="body" x="604" y="371" text-anchor="end">آن لائن فارم اور شناختی ریکارڈ</text><text class="body" x="274" y="367" text-anchor="end">ای فائلنگ اور آن لائن</text><text class="body" x="274" y="388" text-anchor="end">پاسپورٹ ٹریکنگ</text><text class="small muted" x="764" y="427" text-anchor="end">آئی سی ٹی لوگوں کو معلومات، خدمات اور ریکارڈ تک رسائی دیتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
