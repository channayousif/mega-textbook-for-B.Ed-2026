<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Timeline of computing milestones from the ancient abacus</title><desc id="d">Timeline of computing milestones from the ancient abacus, through mechanical calculators, punched-card machines and ENIAC, to the personal computer and the smartphone.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .note{font-size:13px;fill:var(--muted)} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h ink" x="390" y="35" text-anchor="middle">From calculating tools to modern computers</text><text class="muted" x="390" y="58" text-anchor="middle">Computers became electronic, smaller and more personal over time.</text><line class="stroke" x1="40" y1="250" x2="740" y2="250" marker-end="url(#arrow)"/><text class="muted" x="40" y="280">EARLIER</text><text class="muted" x="740" y="280" text-anchor="end">TODAY</text><line class="stroke" x1="68" y1="176" x2="68" y2="250"/><line class="stroke" x1="68" y1="240" x2="68" y2="260"/><line class="stroke" x1="196" y1="176" x2="196" y2="250"/><line class="stroke" x1="196" y1="240" x2="196" y2="260"/><line class="stroke" x1="326" y1="250" x2="326" y2="312"/><line class="stroke" x1="326" y1="240" x2="326" y2="260"/><line class="stroke" x1="454" y1="176" x2="454" y2="250"/><line class="stroke" x1="454" y1="240" x2="454" y2="260"/><line class="stroke" x1="584" y1="250" x2="584" y2="312"/><line class="stroke" x1="584" y1="240" x2="584" y2="260"/><line class="stroke" x1="712" y1="176" x2="712" y2="250"/><line class="stroke" x1="712" y1="240" x2="712" y2="260"/><rect class="panel" x="16" y="84" width="104" height="92" rx="10"/><text class="h" x="68" y="110" text-anchor="middle">Abacus</text><text x="68" y="131" text-anchor="middle">(ancient)</text><text class="note" x="68" y="156" text-anchor="middle">Beads for counting</text><rect class="panel" x="132" y="76" width="128" height="100" rx="10"/><text class="h" x="196" y="102" text-anchor="middle">Mechanical</text><text class="h" x="196" y="121" text-anchor="middle">calculators</text><text x="196" y="142" text-anchor="middle">(1600s)</text><text class="note" x="196" y="163" text-anchor="middle">Gears for arithmetic</text><rect class="panel" x="272" y="312" width="108" height="104" rx="10"/><text class="h" x="326" y="338" text-anchor="middle">Punched-card</text><text class="h" x="326" y="357" text-anchor="middle">machines</text><text x="326" y="378" text-anchor="middle">(1890s)</text><text class="note" x="326" y="399" text-anchor="middle">Holes record data</text><rect class="panel" x="398" y="84" width="112" height="92" rx="10"/><text class="h" x="454" y="115" text-anchor="middle">ENIAC</text><text x="454" y="137" text-anchor="middle">(1946)</text><text class="note" x="454" y="158" text-anchor="middle">Electronic computing</text><rect class="panel" x="518" y="312" width="132" height="104" rx="10"/><text class="h" x="584" y="338" text-anchor="middle">Personal</text><text class="h" x="584" y="357" text-anchor="middle">computer</text><text x="584" y="378" text-anchor="middle">(1970s-80s)</text><text class="note" x="584" y="399" text-anchor="middle">Home and school use</text><rect class="panel" x="660" y="84" width="104" height="92" rx="10"/><text class="h" x="712" y="110" text-anchor="middle">Smartphone</text><text x="712" y="131" text-anchor="middle">(2007-)</text><text class="note" x="712" y="156" text-anchor="middle">Computer in pocket</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
