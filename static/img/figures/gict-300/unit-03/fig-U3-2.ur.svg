<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ اقسام کے آپریٹنگ سسٹم کا جدول</title><desc id="d">پانچ اقسام کے آپریٹنگ سسٹم کا جدول، ہر ایک کا طریقہ کار اور ایک مثال کے ساتھ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">آپریٹنگ سسٹم کی پانچ اقسام</text><text class="body" x="390" y="58" text-anchor="middle" font-size="13">ایک ہی کام، مختلف وعدوں کے مطابق</text><rect class="cellhdr" x="16" y="72" width="748" height="40"/><line class="grid" x1="630" y1="72" x2="630" y2="436"/><line class="grid" x1="310" y1="72" x2="310" y2="436"/><line class="grid" x1="764" y1="112" x2="16" y2="112"/><line class="grid" x1="764" y1="171" x2="16" y2="171"/><line class="grid" x1="764" y1="230" x2="16" y2="230"/><line class="grid" x1="764" y1="289" x2="16" y2="289"/><line class="grid" x1="764" y1="348" x2="16" y2="348"/><rect class="frame" x="16" y="72" width="748" height="364"/><text class="h" x="697" y="97" text-anchor="middle">قسم</text><text class="h" x="470" y="97" text-anchor="middle">کیسے کام کرتا ہے</text><text class="h" x="163" y="97" text-anchor="middle">ایک مثال</text><text class="body" x="752" y="140" font-weight="600" text-anchor="end">بیچ</text><text class="body" x="618" y="133" text-anchor="end">کام اکٹھے کر کے باری باری،</text><text class="body" x="618" y="149" text-anchor="end">بغیر صارف کی مداخلت چلائے جاتے ہیں</text><text class="body" x="298" y="140" text-anchor="end">ابتدائی تنخواہ حساب</text><text class="body" x="752" y="199" font-weight="600" text-anchor="end">ٹائم شیئرنگ</text><text class="body" x="618" y="192" text-anchor="end">کئی پروگرام یا صارف پروسیسر</text><text class="body" x="618" y="208" text-anchor="end">تیز باریوں میں شیئر کرتے ہیں</text><text class="body" x="298" y="192" text-anchor="end">کالج دفتر کا کمپیوٹر</text><text class="body" x="298" y="208" text-anchor="end">پانچ کام چلاتا ہوا</text><text class="body" x="752" y="258" font-weight="600" text-anchor="end">ریئل ٹائم</text><text class="body" x="618" y="251" text-anchor="end">سخت وقت کی حد میں</text><text class="body" x="618" y="267" text-anchor="end">جواب دینا لازم</text><text class="body" x="298" y="251" text-anchor="end">مریض نگرانی مشین یا</text><text class="body" x="298" y="267" text-anchor="end">ایئر بیگ کنٹرولر</text><text class="body" x="752" y="317" font-weight="600" text-anchor="end">ڈسٹریبیوٹڈ</text><text class="body" x="618" y="310" text-anchor="end">ایک نظام کئی جڑی ہوئی</text><text class="body" x="618" y="326" text-anchor="end">مشینوں پر پھیلا ہوا</text><text class="body" x="298" y="310" text-anchor="end">یونیورسٹی ریکارڈ نظام</text><text class="body" x="298" y="326" text-anchor="end">کئی سروروں پر</text><text class="body" x="752" y="376" font-weight="600" text-anchor="end">موبائل</text><text class="body" x="618" y="369" text-anchor="end">ٹچ فون کے لیے بنایا گیا:</text><text class="body" x="618" y="385" text-anchor="end">چھوٹی اسکرین اور محدود بیٹری</text><text class="body" x="298" y="376" text-anchor="end">اسکول ٹیبلٹ پر اینڈرائیڈ</text><text class="body" x="390" y="424" text-anchor="middle" font-size="13">وعدے: انصاف (ٹائم شیئرنگ)، رفتار (ریئل ٹائم)، پیمانہ (ڈسٹریبیوٹڈ)، برداشت (موبائل)۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
