<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایپلیکیشن سے ہارڈ ویئر تک چار تہیں</title><desc id="d">ایپلیکیشن سے ہارڈ ویئر تک چار تہیں: اوپر ایپلیکیشنیں، پھر شیل اور یوٹیلیٹیز، پھر موٹے بارڈر والا کرنل، اور نیچے ہارڈ ویئر۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .kernel{fill:var(--a3-fill);stroke:var(--ink);stroke-width:4} .panel-c{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">نظام کی چار تہیں</text><text class="small" x="390" y="64" text-anchor="middle">ایپلیکیشن مانگتی ہے؛ کرنل فیصلہ کرتا ہے؛ ہارڈ ویئر عمل کرتا ہے</text><rect class="panel" x="120" y="86" width="540" height="62"/><text class="body" x="390" y="112" text-anchor="middle" font-weight="600">ایپلیکیشنیں</text><text class="small" x="390" y="132" text-anchor="middle">ورڈ پروسیسر، براؤزر، اسپریڈ شیٹ</text><rect class="panel-a" x="120" y="162" width="540" height="62"/><text class="body" x="390" y="188" text-anchor="middle" font-weight="600">شیل اور سسٹم یوٹیلیٹیز</text><text class="small" x="390" y="208" text-anchor="middle">جو حصے آپ دیکھتے اور دباتے ہیں: ڈیسک ٹاپ، فائل ونڈو، سیٹنگز</text><rect class="kernel" x="120" y="238" width="540" height="62"/><text class="body" x="390" y="264" text-anchor="middle" font-weight="600">کرنل (مرکز)</text><text class="small" x="390" y="284" text-anchor="middle">شیڈولنگ، میموری، ڈیوائسیں، سسٹم کالز</text><rect class="panel-c" x="120" y="314" width="540" height="62"/><text class="body" x="390" y="340" text-anchor="middle" font-weight="600">ہارڈ ویئر</text><text class="small" x="390" y="360" text-anchor="middle">پروسیسر، میموری، ڈسک، ڈیوائسیں</text><line class="stroke" x1="390" y1="148" x2="390" y2="154" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="224" x2="390" y2="230" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="300" x2="390" y2="306" marker-end="url(#arrow)"/><line class="stroke" x1="100" y1="117" x2="100" y2="269" marker-end="url(#arrow)"/><text class="small" x="80" y="196" text-anchor="end">سسٹم</text><text class="small" x="80" y="214" text-anchor="end">کالز</text><text class="small" x="390" y="416" text-anchor="middle">کرنل سب سے موٹے بارڈر میں ہے: سب کچھ اسی پر کھڑا ہے۔</text><text class="small" x="390" y="438" text-anchor="middle">لینکس سخت معنوں میں کرنل کا نام ہے؛ مکمل آپریٹنگ سسٹم اسے شیل اور یوٹیلیٹیز کے ساتھ ملاتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
