<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ: آپریٹنگ سسٹم درمیان میں، چار شاخیں</title><desc id="d">تصوراتی نقشہ: آپریٹنگ سسٹم درمیان میں اور چار شاخیں: ہارڈ ویئر وسائل کا انتظام، صارف انٹرفیس، ایپلیکیشنوں کو جگہ دینا، اور فائلوں و ڈیوائسوں کا انتظام۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">آپریٹنگ سسٹم کیا کرتا ہے</text><text class="small" x="390" y="64" text-anchor="middle">چار کام، ایک خاموش منتظم</text><ellipse class="center" cx="390" cy="255" rx="105" ry="48"/><text class="body" x="390" y="249" text-anchor="middle" font-weight="600">آپریٹنگ</text><text class="body" x="390" y="269" text-anchor="middle" font-weight="600">سسٹم</text><rect class="panel" x="535" y="105" width="185" height="64"/><text class="body" x="628" y="131" text-anchor="middle" font-weight="600">ہارڈ ویئر وسائل</text><text class="body" x="628" y="151" text-anchor="middle" font-weight="600">کا انتظام</text><text class="small" x="628" y="185" text-anchor="middle">پروسیسر، میموری، ڈسک</text><rect class="panel" x="60" y="105" width="185" height="64"/><text class="body" x="153" y="131" text-anchor="middle" font-weight="600">صارف انٹرفیس</text><text class="body" x="153" y="151" text-anchor="middle" font-weight="600">فراہم کرتا ہے</text><text class="small" x="153" y="185" text-anchor="middle">ڈیسک ٹاپ، ونڈوز، اشارے</text><rect class="panel" x="535" y="330" width="185" height="64"/><text class="body" x="628" y="356" text-anchor="middle" font-weight="600">ایپلیکیشنوں</text><text class="body" x="628" y="376" text-anchor="middle" font-weight="600">کو جگہ دیتا ہے</text><text class="small" x="628" y="412" text-anchor="middle">ہر ایپ پہلے اسی سے مانگتی ہے</text><rect class="panel" x="60" y="330" width="185" height="64"/><text class="body" x="153" y="356" text-anchor="middle" font-weight="600">فائلیں اور ڈیوائسیں</text><text class="body" x="153" y="376" text-anchor="middle" font-weight="600">منتظم رکھتا ہے</text><text class="small" x="153" y="412" text-anchor="middle">موضوعات 3.2 اور 3.3</text><line class="stroke" x1="595" y1="169" x2="480" y2="222" marker-end="url(#arrow)"/><line class="stroke" x1="185" y1="169" x2="300" y2="222" marker-end="url(#arrow)"/><line class="stroke" x1="595" y1="330" x2="480" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="185" y1="330" x2="300" y2="288" marker-end="url(#arrow)"/><text class="small" x="390" y="452" text-anchor="middle">ٹائم شیئرنگ: ایک پروسیسر، کئی پروگرام، تیز باریاں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
