<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five everyday input/output requests</title><desc id="d">Table of five everyday input/output requests, what the operating system does for each, and what the user notices.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">Everyday requests and what the OS does</text><rect class="cellhdr" x="16" y="58" width="748" height="40"/><line class="grid" x1="216" y1="58" x2="216" y2="428"/><line class="grid" x1="516" y1="58" x2="516" y2="428"/><line class="grid" x1="16" y1="98" x2="764" y2="98"/><line class="grid" x1="16" y1="162" x2="764" y2="162"/><line class="grid" x1="16" y1="226" x2="764" y2="226"/><line class="grid" x1="16" y1="290" x2="764" y2="290"/><line class="grid" x1="16" y1="354" x2="764" y2="354"/><rect class="frame" x="16" y="58" width="748" height="370"/><text class="h" x="116" y="83" text-anchor="middle">Request</text><text class="h" x="366" y="83" text-anchor="middle">What the OS does</text><text class="h" x="640" y="83" text-anchor="middle">What you notice</text><text class="body" x="28" y="126" font-weight="600">print a page</text><text class="body" x="228" y="119">queues the job, translates via the</text><text class="body" x="228" y="135">driver, spools it to the printer</text><text class="body" x="528" y="126">pages appear in order</text><text class="body" x="28" y="190" font-weight="600">open a file</text><text class="body" x="228" y="183">finds the path in the file system,</text><text class="body" x="228" y="199">asks the disk driver to read</text><text class="body" x="528" y="190">the document appears</text><text class="body" x="28" y="254" font-weight="600">save to a USB drive</text><text class="body" x="228" y="247">writes via the USB driver in</text><text class="body" x="228" y="263">small buffered pieces</text><text class="body" x="528" y="254">the progress bar fills</text><text class="body" x="28" y="318" font-weight="600">type on the keyboard</text><text class="body" x="228" y="311">the keyboard driver reports</text><text class="body" x="228" y="327">each key press</text><text class="body" x="528" y="318">letters appear on screen</text><text class="body" x="28" y="382" font-weight="600">plug in a new device</text><text class="body" x="228" y="375">loads and installs the</text><text class="body" x="228" y="391">matching driver</text><text class="body" x="528" y="375">the installing message,</text><text class="body" x="528" y="391">then the device works</text><text class="body" x="390" y="424" text-anchor="middle" font-size="13">Every row follows the same chain: application, OS, driver, device.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
