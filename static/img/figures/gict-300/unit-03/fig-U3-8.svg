<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four kernel functions</title><desc id="d">Table of four kernel functions with a plain-language description of each and where the idea appeared earlier in the unit.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="46" text-anchor="middle" font-size="16">The kernel's four functions</text><rect class="cellhdr" x="16" y="70" width="748" height="42"/><line class="grid" x1="206" y1="70" x2="206" y2="400"/><line class="grid" x1="516" y1="70" x2="516" y2="400"/><line class="grid" x1="16" y1="112" x2="764" y2="112"/><line class="grid" x1="16" y1="181" x2="764" y2="181"/><line class="grid" x1="16" y1="250" x2="764" y2="250"/><line class="grid" x1="16" y1="319" x2="764" y2="319"/><rect class="frame" x="16" y="70" width="748" height="330"/><text class="h" x="111" y="96" text-anchor="middle">Function</text><text class="h" x="361" y="96" text-anchor="middle">What it does in plain words</text><text class="h" x="640" y="96" text-anchor="middle">Where you met it</text><text class="body" x="28" y="142" font-weight="600">Scheduling</text><text class="body" x="218" y="135">decides which process runs</text><text class="body" x="218" y="151">next and for how long</text><text class="body" x="528" y="142">Topic 3.2, process states</text><text class="body" x="28" y="211" font-weight="600">Memory management</text><text class="body" x="218" y="204">gives each process its address</text><text class="body" x="218" y="220">space and keeps them apart</text><text class="body" x="528" y="211">Unit 2, RAM and the</text><text class="body" x="528" y="227">storage hierarchy</text><text class="body" x="28" y="280" font-weight="600">Device control</text><text class="body" x="218" y="273">supervises all drivers and</text><text class="body" x="218" y="289">all device traffic</text><text class="body" x="528" y="280">Topic 3.3, the</text><text class="body" x="528" y="296">input/output chain</text><text class="body" x="28" y="349" font-weight="600">System calls</text><text class="body" x="218" y="342">the guarded doorways applications</text><text class="body" x="218" y="358">use to request every service</text><text class="body" x="528" y="349">every print, save and open</text><text class="body" x="528" y="365">you have ever done</text><text class="body" x="390" y="436" text-anchor="middle" font-size="13">Applications never touch hardware directly: they ask, and the kernel decides.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
