<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of process states</title><desc id="d">Flowchart of process states: a new process becomes ready, is scheduled into running, may be descheduled back to ready, or blocked into waiting until input or output completes, and eventually terminates.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The life of a process</text><text class="small" x="390" y="64" text-anchor="middle">One processor, rapid turns: the OS moves every program through these states</text><rect class="panel" x="30" y="200" width="120" height="56"/><text class="body" x="90" y="233" text-anchor="middle" font-weight="600">new</text><rect class="panel-a" x="215" y="200" width="120" height="56"/><text class="body" x="275" y="233" text-anchor="middle" font-weight="600">ready</text><rect class="panel-b" x="420" y="200" width="130" height="56"/><text class="body" x="485" y="233" text-anchor="middle" font-weight="600">running</text><rect class="panel-c" x="420" y="360" width="130" height="56"/><text class="body" x="485" y="386" text-anchor="middle" font-weight="600">waiting</text><text class="body" x="485" y="404" text-anchor="middle" font-size="12">(blocked)</text><rect class="panel" x="630" y="200" width="120" height="56"/><text class="body" x="690" y="233" text-anchor="middle" font-weight="600">terminated</text><line class="stroke" x1="150" y1="228" x2="207" y2="228" marker-end="url(#arrow)"/><line class="stroke" x1="335" y1="228" x2="412" y2="228" marker-end="url(#arrow)"/><text class="small" x="373" y="216" text-anchor="middle">scheduled</text><line class="stroke" x1="470" y1="256" x2="320" y2="300" marker-end="url(#arrow)"/><text class="small" x="360" y="290" text-anchor="middle">descheduled</text><line class="stroke" x1="500" y1="256" x2="500" y2="352" marker-end="url(#arrow)"/><text class="small" x="560" y="310">starts I/O</text><line class="stroke" x1="440" y1="388" x2="300" y2="270" marker-end="url(#arrow)"/><text class="small" x="330" y="350" text-anchor="middle">I/O done</text><line class="stroke" x1="550" y1="228" x2="622" y2="228" marker-end="url(#arrow)"/><text class="small" x="588" y="216" text-anchor="middle">ends</text><text class="small" x="390" y="452" text-anchor="middle">Too many processes wanting turns means a smaller slice for each: the slow machine.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
