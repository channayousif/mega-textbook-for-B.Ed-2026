<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with the operating system at the centre and four branches</title><desc id="d">Concept map with the operating system at the centre and four branches: managing hardware resources, providing the user interface, hosting applications, and keeping files and devices in order.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">What the operating system does</text><text class="small" x="390" y="64" text-anchor="middle">Four jobs, one quiet manager</text><ellipse class="center" cx="390" cy="255" rx="105" ry="48"/><text class="body" x="390" y="249" text-anchor="middle" font-weight="600">Operating</text><text class="body" x="390" y="269" text-anchor="middle" font-weight="600">system</text><rect class="panel" x="60" y="105" width="185" height="64"/><text class="body" x="152" y="131" text-anchor="middle" font-weight="600">manages hardware</text><text class="body" x="152" y="151" text-anchor="middle" font-weight="600">resources</text><text class="small" x="152" y="185" text-anchor="middle">processor, memory, disk</text><rect class="panel" x="535" y="105" width="185" height="64"/><text class="body" x="627" y="131" text-anchor="middle" font-weight="600">provides the</text><text class="body" x="627" y="151" text-anchor="middle" font-weight="600">user interface</text><text class="small" x="627" y="185" text-anchor="middle">desktop, windows, gestures</text><rect class="panel" x="60" y="330" width="185" height="64"/><text class="body" x="152" y="356" text-anchor="middle" font-weight="600">hosts</text><text class="body" x="152" y="376" text-anchor="middle" font-weight="600">applications</text><text class="small" x="152" y="412" text-anchor="middle">every app asks it first</text><rect class="panel" x="535" y="330" width="185" height="64"/><text class="body" x="627" y="356" text-anchor="middle" font-weight="600">keeps files and</text><text class="body" x="627" y="376" text-anchor="middle" font-weight="600">devices in order</text><text class="small" x="627" y="412" text-anchor="middle">topics 3.2 and 3.3</text><line class="stroke" x1="185" y1="169" x2="300" y2="222" marker-end="url(#arrow)"/><line class="stroke" x1="595" y1="169" x2="480" y2="222" marker-end="url(#arrow)"/><line class="stroke" x1="185" y1="330" x2="300" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="595" y1="330" x2="480" y2="288" marker-end="url(#arrow)"/><text class="small" x="390" y="452" text-anchor="middle">Time sharing: one processor, many programs, rapid turns.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
