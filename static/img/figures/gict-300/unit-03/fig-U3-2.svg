<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five operating system types</title><desc id="d">Table of five operating system types with how each works and one example use of each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">Five types of operating system</text><text class="body" x="390" y="58" text-anchor="middle" font-size="13">The same functions, tuned to different promises</text><rect class="cellhdr" x="16" y="72" width="748" height="40"/><line class="grid" x1="150" y1="72" x2="150" y2="436"/><line class="grid" x1="470" y1="72" x2="470" y2="436"/><line class="grid" x1="16" y1="112" x2="764" y2="112"/><line class="grid" x1="16" y1="171" x2="764" y2="171"/><line class="grid" x1="16" y1="230" x2="764" y2="230"/><line class="grid" x1="16" y1="289" x2="764" y2="289"/><line class="grid" x1="16" y1="348" x2="764" y2="348"/><rect class="frame" x="16" y="72" width="748" height="364"/><text class="h" x="83" y="97" text-anchor="middle">Type</text><text class="h" x="310" y="97" text-anchor="middle">How it works</text><text class="h" x="617" y="97" text-anchor="middle">One example use</text><text class="body" x="28" y="140" font-weight="600">Batch</text><text class="body" x="162" y="133">jobs collected and run one after</text><text class="body" x="162" y="149">another without user interaction</text><text class="body" x="482" y="140">early payroll processing</text><text class="body" x="28" y="199" font-weight="600">Time-sharing</text><text class="body" x="162" y="192">many programs or users share the</text><text class="body" x="162" y="208">processor in quick turns</text><text class="body" x="482" y="192">a college office computer</text><text class="body" x="482" y="208">running five tasks</text><text class="body" x="28" y="258" font-weight="600">Real-time</text><text class="body" x="162" y="251">must respond within a strict</text><text class="body" x="162" y="267">time limit</text><text class="body" x="482" y="251">a patient monitor or</text><text class="body" x="482" y="267">an airbag controller</text><text class="body" x="28" y="317" font-weight="600">Distributed</text><text class="body" x="162" y="310">one system spread across several</text><text class="body" x="162" y="326">connected machines</text><text class="body" x="482" y="310">a university records system</text><text class="body" x="482" y="326">on many servers</text><text class="body" x="28" y="376" font-weight="600">Mobile</text><text class="body" x="162" y="369">designed for touch phones with</text><text class="body" x="162" y="385">a small screen and limited battery</text><text class="body" x="482" y="376">Android on a school tablet</text><text class="body" x="390" y="424" text-anchor="middle" font-size="13">Promises: fairness (time-sharing), speed (real-time), scale (distributed), endurance (mobile).</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
