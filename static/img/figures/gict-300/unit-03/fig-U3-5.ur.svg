<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ان پٹ آؤٹ پٹ درخواست کے سفر کا خاکہ</title><desc id="d">ان پٹ آؤٹ پٹ درخواست کے سفر کا خاکہ: ایپلیکیشن سے آپریٹنگ سسٹم کے راستے ڈرائیور سے ہو کر ڈیوائس تک، اور واپسی پر مکمل ہونے کی اطلاع۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">پرنٹ درخواست کا سفر</text><text class="small" x="390" y="64" text-anchor="middle">کلک اور چھپے ہوئے صفحے کے درمیان چار کڑیاں</text><rect class="panel" x="595" y="150" width="160" height="80"/><text class="body" x="675" y="182" text-anchor="middle" font-weight="600">ایپلیکیشن</text><text class="small" x="675" y="204" text-anchor="middle">پرنٹ کی درخواست</text><rect class="panel-a" x="395" y="150" width="160" height="80"/><text class="body" x="475" y="182" text-anchor="middle" font-weight="600">آپریٹنگ سسٹم</text><text class="small" x="475" y="204" text-anchor="middle">قبول کر کے قطار میں لگاتا ہے</text><rect class="panel-b" x="195" y="150" width="160" height="80"/><text class="body" x="275" y="182" text-anchor="middle" font-weight="600">ڈرائیور</text><text class="small" x="275" y="204" text-anchor="middle">ڈیوائس کی زبان میں بدلتا ہے</text><rect class="panel-c" x="25" y="150" width="130" height="80"/><text class="body" x="90" y="182" text-anchor="middle" font-weight="600">ڈیوائس</text><text class="small" x="90" y="204" text-anchor="middle">صفحہ چھاپتی ہے</text><line class="stroke" x1="595" y1="190" x2="563" y2="190" marker-end="url(#arrow)"/><line class="stroke" x1="395" y1="190" x2="363" y2="190" marker-end="url(#arrow)"/><line class="stroke" x1="195" y1="190" x2="163" y2="190" marker-end="url(#arrow)"/><path class="stroke" d="M90 235 V320 H475 V238" fill="none" marker-end="url(#arrow)"/><text class="small" x="280" y="312" text-anchor="middle">مکمل: حالت کی اطلاع واپس</text><text class="small" x="390" y="370" text-anchor="middle">بفر سفر کے دوران ڈیٹا رکھتی ہے؛ اسپولنگ پورے کام قطار میں لگاتی ہے تاکہ تین اساتذہ</text><text class="small" x="390" y="388" text-anchor="middle">ایک ساتھ پرنٹ دبائیں اور صفحات پھر بھی ترتیب سے نکلیں۔</text><text class="small" x="390" y="430" text-anchor="middle">تشخیص کی سیڑھی: ڈیوائس، ڈرائیور، یا ایپلیکیشن - کندھے چڑھانے سے پہلے کڑی کا نام لیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
