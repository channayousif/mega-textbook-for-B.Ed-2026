<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فائل کے تین شناختی اوصاف کا خاکہ</title><desc id="d">فائل کے تین شناختی اوصاف کا خاکہ: نام اور ایکسٹینشن، فولڈر کا راستہ، اور سائز و تاریخیں کا میٹا ڈیٹا۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">فائل کسے کہتے ہیں</text><text class="small" x="390" y="64" text-anchor="middle">تین شناختی اوصاف، آپریٹنگ سسٹم کے ریکارڈ میں</text><rect class="panel" x="300" y="190" width="180" height="90"/><path class="stroke" d="M410 205 h-30 l-10 10 v28 h40 z" fill="none"/><path class="stroke" d="M380 205 v10 h-10" fill="none"/><text class="body" x="390" y="262" text-anchor="middle" font-weight="600">ایک فائل</text><rect class="panel-a" x="510" y="80" width="230" height="86"/><text class="body" x="625" y="106" text-anchor="middle" font-weight="600">نام اور ایکسٹینشن</text><text class="body" x="625" y="128" text-anchor="middle">results-2026.xlsx</text><text class="small" x="625" y="150" text-anchor="middle">کا نام اور اس کی قسم</text><rect class="panel-b" x="40" y="80" width="230" height="86"/><text class="body" x="155" y="106" text-anchor="middle" font-weight="600">فولڈر کا راستہ</text><text class="body" x="155" y="128" text-anchor="middle">Records/Exams/Term-1</text><text class="small" x="155" y="150" text-anchor="middle">فائل ٹری میں کہاں رہتی ہے</text><rect class="panel-c" x="275" y="340" width="230" height="86"/><text class="body" x="390" y="366" text-anchor="middle" font-weight="600">میٹا ڈیٹا</text><text class="body" x="390" y="388" text-anchor="middle">سائز، بننے کی تاریخ، تبدیلی کی تاریخ</text><text class="small" x="390" y="410" text-anchor="middle">او ایس کے رکھے ہوئے حقائق</text><line class="stroke" x1="570" y1="166" x2="465" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="210" y1="166" x2="315" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="280" x2="390" y2="332" marker-end="url(#arrow)"/><text class="small" x="390" y="452" text-anchor="middle">ڈیلیٹ کرنے سے فائل کا ریکارڈ انڈیکس سے ہٹ جاتا ہے؛ جگہ دوبارہ استعمال کے لیے نشان زد ہو جاتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
