<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four stacked layers from applications to hardware</title><desc id="d">Four stacked layers from applications at the top, through the shell and utilities, to the kernel drawn with a thicker border, down to the hardware at the bottom.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .kernel{fill:var(--a3-fill);stroke:var(--ink);stroke-width:4} .panel-c{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The four layers of the system</text><text class="small" x="390" y="64" text-anchor="middle">Applications ask; the kernel decides; the hardware acts</text><rect class="panel" x="120" y="86" width="540" height="62"/><text class="body" x="390" y="112" text-anchor="middle" font-weight="600">applications</text><text class="small" x="390" y="132" text-anchor="middle">word processor, browser, spreadsheet</text><rect class="panel-a" x="120" y="162" width="540" height="62"/><text class="body" x="390" y="188" text-anchor="middle" font-weight="600">shell and system utilities</text><text class="small" x="390" y="208" text-anchor="middle">the parts you see and click: desktop, file window, settings</text><rect class="kernel" x="120" y="238" width="540" height="62"/><text class="body" x="390" y="264" text-anchor="middle" font-weight="600">kernel (the core)</text><text class="small" x="390" y="284" text-anchor="middle">scheduling, memory, devices, system calls</text><rect class="panel-c" x="120" y="314" width="540" height="62"/><text class="body" x="390" y="340" text-anchor="middle" font-weight="600">hardware</text><text class="small" x="390" y="360" text-anchor="middle">processor, memory, disk, devices</text><line class="stroke" x1="390" y1="148" x2="390" y2="154" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="224" x2="390" y2="230" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="300" x2="390" y2="306" marker-end="url(#arrow)"/><line class="stroke" x1="680" y1="117" x2="680" y2="269" marker-end="url(#arrow)"/><text class="small" x="700" y="196" >system</text><text class="small" x="700" y="214">calls</text><text class="small" x="390" y="416" text-anchor="middle">The kernel is drawn with the thickest border: everything stands on it.</text><text class="small" x="390" y="438" text-anchor="middle">"Linux" strictly names a kernel; a full operating system bundles it with shell and utilities.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
