<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of an input/output request flowing through the chain</title><desc id="d">Diagram of an input/output request flowing from the application to the operating system, through the driver to the device, with a return arrow reporting completion.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The journey of a print request</text><text class="small" x="390" y="64" text-anchor="middle">Four links between a click and a printed page</text><rect class="panel" x="25" y="150" width="160" height="80"/><text class="body" x="105" y="182" text-anchor="middle" font-weight="600">application</text><text class="small" x="105" y="204" text-anchor="middle">asks to print</text><rect class="panel-a" x="225" y="150" width="160" height="80"/><text class="body" x="305" y="182" text-anchor="middle" font-weight="600">operating system</text><text class="small" x="305" y="204" text-anchor="middle">accepts and queues</text><rect class="panel-b" x="425" y="150" width="160" height="80"/><text class="body" x="505" y="182" text-anchor="middle" font-weight="600">driver</text><text class="small" x="505" y="204" text-anchor="middle">translates to the device</text><rect class="panel-c" x="625" y="150" width="130" height="80"/><text class="body" x="690" y="182" text-anchor="middle" font-weight="600">device</text><text class="small" x="690" y="204" text-anchor="middle">prints the page</text><line class="stroke" x1="185" y1="190" x2="217" y2="190" marker-end="url(#arrow)"/><line class="stroke" x1="385" y1="190" x2="417" y2="190" marker-end="url(#arrow)"/><line class="stroke" x1="585" y1="190" x2="617" y2="190" marker-end="url(#arrow)"/><path class="stroke" d="M 690 235 V 320 H 305 V 238" fill="none" marker-end="url(#arrow)"/><text class="small" x="500" y="312" text-anchor="middle">done: status reported back</text><text class="small" x="390" y="370" text-anchor="middle">Buffers hold data in transit; spooling queues whole jobs so three teachers</text><text class="small" x="390" y="388" text-anchor="middle">can click Print at once and the pages still come out in order.</text><text class="small" x="390" y="430" text-anchor="middle">Diagnostic ladder: device, driver, or application - name the rung before you shrug.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
