<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کرنل کے چار کاموں کا جدول</title><desc id="d">کرنل کے چار کاموں کا جدول، ہر ایک کی سادہ زبان میں وضاحت اور یونٹ میں جہاں یہ تصور پہلے آیا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="46" text-anchor="middle" font-size="16">کرنل کے چار کام</text><rect class="cellhdr" x="16" y="70" width="748" height="42"/><line class="grid" x1="574" y1="70" x2="574" y2="400"/><line class="grid" x1="264" y1="70" x2="264" y2="400"/><line class="grid" x1="764" y1="112" x2="16" y2="112"/><line class="grid" x1="764" y1="181" x2="16" y2="181"/><line class="grid" x1="764" y1="250" x2="16" y2="250"/><line class="grid" x1="764" y1="319" x2="16" y2="319"/><rect class="frame" x="16" y="70" width="748" height="330"/><text class="h" x="669" y="96" text-anchor="middle">کام</text><text class="h" x="419" y="96" text-anchor="middle">سادہ الفاظ میں کیا کرتا ہے</text><text class="h" x="140" y="96" text-anchor="middle">جہاں آپ سے ملا</text><text class="body" x="752" y="142" font-weight="600" text-anchor="end">شیڈولنگ</text><text class="body" x="562" y="135" text-anchor="end">طے کرتا ہے کہ کون سی پروسیس</text><text class="body" x="562" y="151" text-anchor="end">اگلی چلے اور کتنی دیر</text><text class="body" x="252" y="142" text-anchor="end">موضوع 3.2، پروسیس کی حالتیں</text><text class="body" x="752" y="211" font-weight="600" text-anchor="end">میموری کا انتظام</text><text class="body" x="562" y="204" text-anchor="end">ہر پروسیس کو اس کا ایڈریس</text><text class="body" x="562" y="220" text-anchor="end">اسپیس دیتا ہے اور الگ رکھتا ہے</text><text class="body" x="252" y="211" text-anchor="end">یونٹ 2، ریم اور</text><text class="body" x="252" y="227" text-anchor="end">اسٹوریج کی درجہ بندی</text><text class="body" x="752" y="280" font-weight="600" text-anchor="end">ڈیوائس کا انتظام</text><text class="body" x="562" y="273" text-anchor="end">تمام ڈرائیوروں اور تمام</text><text class="body" x="562" y="289" text-anchor="end">ڈیوائس ٹریفک کی نگرانی</text><text class="body" x="252" y="280" text-anchor="end">موضوع 3.3،</text><text class="body" x="252" y="296" text-anchor="end">ان پٹ آؤٹ پٹ زنجیر</text><text class="body" x="752" y="349" font-weight="600" text-anchor="end">سسٹم کالز</text><text class="body" x="562" y="342" text-anchor="end">محفوظ دروازے جن سے ایپلیکیشنیں</text><text class="body" x="562" y="358" text-anchor="end">ہر خدمت مانگتی ہیں</text><text class="body" x="252" y="349" text-anchor="end">ہر پرنٹ، محفوظ اور کھولنے</text><text class="body" x="252" y="365" text-anchor="end">کا کام جو آپ نے کیا</text><text class="body" x="390" y="436" text-anchor="middle" font-size="13">ایپلیکیشنیں کبھی براہ راست ہارڈ ویئر نہیں چھوتیں: وہ مانگتی ہیں، اور کرنل فیصلہ کرتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
