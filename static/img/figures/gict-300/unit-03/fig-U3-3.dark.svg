<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a file shown with its three identifying features</title><desc id="d">Diagram of a file shown with its three identifying features: the name with extension, the folder path, and the metadata of size and dates.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">What makes a file a file</text><text class="small" x="390" y="64" text-anchor="middle">Three identifying features, kept by the operating system</text><rect class="panel" x="300" y="190" width="180" height="90"/><path class="stroke" d="M 370 205 h 30 l 10 10 v 28 h -40 z" fill="none"/><path class="stroke" d="M 400 205 v 10 h 10" fill="none"/><text class="body" x="390" y="262" text-anchor="middle" font-weight="600">a file</text><rect class="panel-a" x="40" y="80" width="230" height="86"/><text class="body" x="155" y="106" text-anchor="middle" font-weight="600">name and extension</text><text class="body" x="155" y="128" text-anchor="middle">results-2026.xlsx</text><text class="small" x="155" y="150" text-anchor="middle">what it is called and what kind</text><rect class="panel-b" x="510" y="80" width="230" height="86"/><text class="body" x="625" y="106" text-anchor="middle" font-weight="600">folder path</text><text class="body" x="625" y="128" text-anchor="middle">Records/Exams/Term-1</text><text class="small" x="625" y="150" text-anchor="middle">where it lives in the tree</text><rect class="panel-c" x="275" y="340" width="230" height="86"/><text class="body" x="390" y="366" text-anchor="middle" font-weight="600">metadata</text><text class="body" x="390" y="388" text-anchor="middle">size, created date, modified date</text><text class="small" x="390" y="410" text-anchor="middle">the facts the OS keeps about it</text><line class="stroke" x1="210" y1="166" x2="315" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="570" y1="166" x2="465" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="280" x2="390" y2="332" marker-end="url(#arrow)"/><text class="small" x="390" y="452" text-anchor="middle">Deleting a file removes its record from the index; the space is marked reusable.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
