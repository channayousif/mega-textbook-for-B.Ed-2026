<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پروسیس کی حالتوں کا فلو چارٹ</title><desc id="d">پروسیس کی حالتوں کا فلو چارٹ: نئی پروسیس تیار ہوتی ہے، شیڈول ہو کر چلتی ہے، واپس تیار ہو سکتی ہے، یا ان پٹ آؤٹ پٹ مکمل ہونے تک انتظار میں رہتی ہے، اور آخر میں ختم ہو جاتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">پروسیس کی زندگی</text><text class="small" x="390" y="64" text-anchor="middle">ایک پروسیسر، تیز باریاں: او ایس ہر پروگرام کو ان حالتوں سے گزارتا ہے</text><rect class="panel" x="630" y="200" width="120" height="56"/><text class="body" x="690" y="233" text-anchor="middle" font-weight="600">نئی</text><rect class="panel-a" x="445" y="200" width="120" height="56"/><text class="body" x="505" y="233" text-anchor="middle" font-weight="600">تیار</text><rect class="panel-b" x="230" y="200" width="130" height="56"/><text class="body" x="295" y="233" text-anchor="middle" font-weight="600">چلتی</text><rect class="panel-c" x="230" y="360" width="130" height="56"/><text class="body" x="295" y="386" text-anchor="middle" font-weight="600">انتظار</text><text class="body" x="295" y="404" text-anchor="middle" font-size="12">(بلاک)</text><rect class="panel" x="30" y="200" width="120" height="56"/><text class="body" x="90" y="233" text-anchor="middle" font-weight="600">ختم</text><line class="stroke" x1="630" y1="228" x2="573" y2="228" marker-end="url(#arrow)"/><line class="stroke" x1="445" y1="228" x2="368" y2="228" marker-end="url(#arrow)"/><text class="small" x="407" y="216" text-anchor="middle">شیڈول</text><line class="stroke" x1="310" y1="256" x2="460" y2="300" marker-end="url(#arrow)"/><text class="small" x="420" y="290" text-anchor="middle">واپس</text><line class="stroke" x1="280" y1="256" x2="280" y2="352" marker-end="url(#arrow)"/><text class="small" x="220" y="310" text-anchor="end">ان پٹ آؤٹ پٹ شروع</text><line class="stroke" x1="340" y1="388" x2="480" y2="270" marker-end="url(#arrow)"/><text class="small" x="450" y="350" text-anchor="middle">ان پٹ آؤٹ پٹ مکمل</text><line class="stroke" x1="230" y1="228" x2="158" y2="228" marker-end="url(#arrow)"/><text class="small" x="192" y="216" text-anchor="middle">اختتام</text><text class="small" x="390" y="452" text-anchor="middle">کئی پروسیسیں باری مانگیں تو ہر ایک کو چھوٹا حصہ ملتا ہے: سست مشین۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
