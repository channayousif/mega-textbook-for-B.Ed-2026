<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ روزمرہ ان پٹ آؤٹ پٹ درخواستوں کا جدول</title><desc id="d">پانچ روزمرہ ان پٹ آؤٹ پٹ درخواستوں کا جدول، ہر ایک کے لیے آپریٹنگ سسٹم کیا کرتا ہے اور صارف کیا محسوس کرتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">روزمرہ درخواستیں اور او ایس کا کام</text><rect class="cellhdr" x="16" y="58" width="748" height="40"/><line class="grid" x1="564" y1="58" x2="564" y2="428"/><line class="grid" x1="264" y1="58" x2="264" y2="428"/><line class="grid" x1="764" y1="98" x2="16" y2="98"/><line class="grid" x1="764" y1="162" x2="16" y2="162"/><line class="grid" x1="764" y1="226" x2="16" y2="226"/><line class="grid" x1="764" y1="290" x2="16" y2="290"/><line class="grid" x1="764" y1="354" x2="16" y2="354"/><rect class="frame" x="16" y="58" width="748" height="370"/><text class="h" x="664" y="83" text-anchor="middle">درخواست</text><text class="h" x="414" y="83" text-anchor="middle">او ایس کیا کرتا ہے</text><text class="h" x="140" y="83" text-anchor="middle">آپ کیا دیکھتے ہیں</text><text class="body" x="752" y="126" font-weight="600" text-anchor="end">صفحہ پرنٹ کرنا</text><text class="body" x="552" y="119" text-anchor="end">کام قطار میں لگاتا ہے، ڈرائیور سے</text><text class="body" x="552" y="135" text-anchor="end">بدل کر پرنٹر تک بھیجتا ہے</text><text class="body" x="252" y="126" text-anchor="end">صفحات ترتیب سے نکلتے ہیں</text><text class="body" x="752" y="190" font-weight="600" text-anchor="end">فائل کھولنا</text><text class="body" x="552" y="183" text-anchor="end">فائل سسٹم میں راستہ ڈھونڈتا ہے،</text><text class="body" x="552" y="199" text-anchor="end">ڈسک ڈرائیور سے پڑھنے کو کہتا ہے</text><text class="body" x="252" y="190" text-anchor="end">دستاویز ظاہر ہوتی ہے</text><text class="body" x="752" y="254" font-weight="600" text-anchor="end">یو ایس بی ڈرائیو پر محفوظ کرنا</text><text class="body" x="552" y="247" text-anchor="end">یو ایس بی ڈرائیور سے چھوٹے چھوٹے</text><text class="body" x="552" y="263" text-anchor="end">بفر ٹکڑوں میں لکھتا ہے</text><text class="body" x="252" y="254" text-anchor="end">پروگریس بار بھرتی ہے</text><text class="body" x="752" y="318" font-weight="600" text-anchor="end">کی بورڈ پر ٹائپ کرنا</text><text class="body" x="552" y="311" text-anchor="end">کی بورڈ ڈرائیور ہر دبے</text><text class="body" x="552" y="327" text-anchor="end">حرف کی اطلاع دیتا ہے</text><text class="body" x="252" y="318" text-anchor="end">حروف اسکرین پر آتے ہیں</text><text class="body" x="752" y="382" font-weight="600" text-anchor="end">نئی ڈیوائس لگانا</text><text class="body" x="552" y="375" text-anchor="end">متعلقہ ڈرائیور لوڈ</text><text class="body" x="552" y="391" text-anchor="end">اور انسٹال کرتا ہے</text><text class="body" x="252" y="375" text-anchor="end">انسٹال ہونے کا پیغام،</text><text class="body" x="252" y="391" text-anchor="end">پھر ڈیوائس چل جاتی ہے</text><text class="body" x="390" y="424" text-anchor="middle" font-size="13">ہر قطار ایک ہی زنجیر چلتی ہے: ایپلیکیشن، او ایس، ڈرائیور، ڈیوائس۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
