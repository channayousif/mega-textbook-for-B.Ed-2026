<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ورچوئل اور اگمنٹڈ رئیلٹی کا موازنہ</title><desc id="d">ورچوئل اور اگمنٹڈ رئیلٹی کا موازنہ: ہر ایک کیا کرتی ہے، سیکھنے والے کو کیا چاہیے، ایک کلاس روم استعمال، اور بڑی رکاوٹ۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">VR ڈبوتی ہے؛ AR لیبل لگاتی ہے</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="584" y1="64" x2="584" y2="414"/><line class="grid" x1="284" y1="64" x2="284" y2="414"/><line class="grid" x1="764" y1="106" x2="16" y2="106"/><line class="grid" x1="764" y1="178" x2="16" y2="178"/><line class="grid" x1="764" y1="250" x2="16" y2="250"/><line class="grid" x1="764" y1="322" x2="16" y2="322"/><line class="grid" x1="764" y1="394" x2="16" y2="394"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="674" y="91" text-anchor="middle">خصوصیت</text><text class="h" x="434" y="91" text-anchor="middle">ورچوئل رئیلٹی</text><text class="h" x="150" y="91" text-anchor="middle">اگمنٹڈ رئیلٹی</text><text class="body" x="752" y="140" font-weight="600" text-anchor="end">کیا کرتی ہے</text><text class="body" x="572" y="133" text-anchor="end">دنیا کو بنائی ہوئی</text><text class="body" x="572" y="149" text-anchor="end">دنیا سے بدل دیتی ہے</text><text class="body" x="272" y="133" text-anchor="end">حقیقی دنیا میں ڈیجیٹل</text><text class="body" x="272" y="149" text-anchor="end">چیزیں شامل کرتی ہے</text><text class="body" x="752" y="212" font-weight="600" text-anchor="end">سیکھنے والے کو کیا چاہیے</text><text class="body" x="572" y="212" text-anchor="end">ہیڈ سیٹ اور صاف محفوظ جگہ</text><text class="body" x="272" y="212" text-anchor="end">فون یا ٹیبلٹ کیمرہ</text><text class="body" x="752" y="284" font-weight="600" text-anchor="end">ایک کلاس روم استعمال</text><text class="body" x="572" y="277" text-anchor="end">ورچوئل تاریخی شہر</text><text class="body" x="572" y="293" text-anchor="end">میں سیر کرنا</text><text class="body" x="272" y="277" text-anchor="end">حقیقی لیب کے سامان</text><text class="body" x="272" y="293" text-anchor="end">پر لیبل لگانا</text><text class="body" x="752" y="356" font-weight="600" text-anchor="end">بڑی رکاوٹ</text><text class="body" x="572" y="349" text-anchor="end">ڈیوائسوں کی قیمت اور</text><text class="body" x="572" y="365" text-anchor="end">شیئرڈ ہیڈ سیٹس</text><text class="body" x="272" y="349" text-anchor="end">چھوٹی اسکرین اور</text><text class="body" x="272" y="365" text-anchor="end">ڈیوائس پکڑے رکھنا</text><text class="small" x="390" y="420" text-anchor="middle">پاکستانی اسکول کے لیے حقیقی راستہ موجودہ فونوں پر AR ہے۔</text><text class="small" x="390" y="438" text-anchor="middle">سبق کے منصوبے کے بغیر خریداری وہ چیز ہے جس سے انکار کرنا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
