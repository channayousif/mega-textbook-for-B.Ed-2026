<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five online communication tools</title><desc id="d">Table of five online communication tools, what each is best for, and one classroom use.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">Communication tools: match, do not just master</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="206" y1="64" x2="206" y2="414"/><line class="grid" x1="476" y1="64" x2="476" y2="414"/><line class="grid" x1="16" y1="106" x2="764" y2="106"/><line class="grid" x1="16" y1="171" x2="764" y2="171"/><line class="grid" x1="16" y1="236" x2="764" y2="236"/><line class="grid" x1="16" y1="301" x2="764" y2="301"/><line class="grid" x1="16" y1="366" x2="764" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="111" y="91" text-anchor="middle">Tool</text><text class="h" x="341" y="91" text-anchor="middle">What it is best for</text><text class="h" x="620" y="91" text-anchor="middle">One classroom use</text><text class="body" x="28" y="142" font-weight="600">email</text><text class="body" x="218" y="135">formal, record-keeping</text><text class="body" x="218" y="151">communication</text><text class="body" x="488" y="142">sending the term report to parents</text><text class="body" x="28" y="207" font-weight="600">instant messaging</text><text class="body" x="218" y="200">quick questions inside</text><text class="body" x="218" y="216">a group</text><text class="body" x="488" y="207">class group announcements</text><text class="body" x="28" y="272" font-weight="600">video meeting</text><text class="body" x="218" y="265">live teaching and meetings</text><text class="body" x="218" y="281">across distance</text><text class="body" x="488" y="272">remote parent meeting</text><text class="body" x="28" y="337" font-weight="600">discussion forum</text><text class="body" x="218" y="330">extended written discussion,</text><text class="body" x="218" y="346">every voice heard</text><text class="body" x="488" y="337">weekly homework questions</text><text class="body" x="28" y="402" font-weight="600">learning platform</text><text class="body" x="218" y="395">structured courses with</text><text class="body" x="218" y="411">materials and tracking</text><text class="body" x="488" y="402">the school's assignment portal</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
