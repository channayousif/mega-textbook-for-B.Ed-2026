<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ویب سائٹ جانچنے کا فلو چارٹ</title><desc id="d">ویب سائٹ جانچنے کا فلو چارٹ: ڈومین پڑھیں، طے کریں کہ وہ دعوے کے مطابق ہے یا نہیں؛ نہیں تو بند کریں اور جانا ہوا پتہ استعمال کریں؛ ہاں تو پیڈ لاک اور مواد جانچیں، پھر سائٹ استعمال کریں - اور ایسے صفحے پر پاس ورڈ کبھی نہ لکھیں جس پر آپ خود نہیں پہنچے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .decision{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">بھروسے سے پہلے ویب سائٹ کی جانچ</text><text class="small" x="390" y="64" text-anchor="middle">ڈومین حقیقت ہے؛ ڈیزائن مفت ہے</text><rect class="panel" x="580" y="110" width="170" height="64"/><text class="body" x="665" y="136" text-anchor="middle" font-weight="600">آپ کو ایک صفحہ</text><text class="body" x="665" y="154" text-anchor="middle" font-weight="600">یا لنک ملتا ہے</text><rect class="panel-a" x="330" y="110" width="200" height="64"/><text class="body" x="430" y="136" text-anchor="middle" font-weight="600">ڈومین پڑھیں:</text><text class="body" x="430" y="154" text-anchor="middle" font-weight="600">یہ سائٹ اصل میں کس کی ہے؟</text><polygon class="decision" points="430,220 310,270 430,320 550,270"/><text class="body" x="430" y="265" text-anchor="middle" font-weight="600">کیا ڈومین</text><text class="body" x="430" y="283" text-anchor="middle" font-weight="600">دعوے کے مطابق ہے؟</text><rect class="panel" x="20" y="150" width="220" height="86"/><text class="body" x="130" y="178" text-anchor="middle" font-weight="600">نہیں: بند کریں، اور</text><text class="body" x="130" y="196" text-anchor="middle" font-weight="600">جانا ہوا پتہ خود</text><text class="body" x="130" y="214" text-anchor="middle" font-weight="600">لکھیں یا بک مارک سے جائیں</text><rect class="panel-a" x="20" y="330" width="220" height="70"/><text class="body" x="130" y="356" text-anchor="middle" font-weight="600">ہاں: پیڈ لاک اور</text><text class="body" x="130" y="374" text-anchor="middle" font-weight="600">صفحے کی مانگ جانچیں</text><line class="stroke" x1="580" y1="142" x2="538" y2="142" marker-end="url(#arrow)"/><line class="stroke" x1="430" y1="174" x2="430" y2="212" marker-end="url(#arrow)"/><line class="stroke" x1="310" y1="270" x2="248" y2="220" marker-end="url(#arrow)"/><text class="small" x="268" y="236" text-anchor="end">no</text><line class="stroke" x1="310" y1="270" x2="248" y2="332" marker-end="url(#arrow)"/><text class="small" x="268" y="296" text-anchor="end">ہاں</text><text class="small" x="390" y="412" text-anchor="middle">ایسے صفحے پر پاس ورڈ کبھی نہ لکھیں جس پر آپ خود نہیں پہنچے۔</text><text class="small" x="390" y="434" text-anchor="middle">پیڈ لاک کا مطلب کنکشن خفیہ ہے - نہ کہ سائٹ دیانتدار ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
