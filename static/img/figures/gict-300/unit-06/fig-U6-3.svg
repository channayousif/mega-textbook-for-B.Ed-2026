<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart for evaluating a website</title><desc id="d">Flowchart for evaluating a website: read the domain, decide whether it matches what it claims, if no close it and use a known address, if yes check the padlock and content, then use the site without entering passwords on pages you did not reach yourself.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .decision{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">Evaluating a website before trusting it</text><text class="small" x="390" y="64" text-anchor="middle">The domain is the fact; design is free</text><rect class="panel" x="30" y="110" width="170" height="64"/><text class="body" x="115" y="136" text-anchor="middle" font-weight="600">you find a page</text><text class="body" x="115" y="154" text-anchor="middle" font-weight="600">or a link</text><rect class="panel-a" x="250" y="110" width="200" height="64"/><text class="body" x="350" y="136" text-anchor="middle" font-weight="600">read the domain:</text><text class="body" x="350" y="154" text-anchor="middle" font-weight="600">who is this site really?</text><polygon class="decision" points="350,220 470,270 350,320 230,270"/><text class="body" x="350" y="265" text-anchor="middle" font-weight="600">is the domain</text><text class="body" x="350" y="283" text-anchor="middle" font-weight="600">what it claims?</text><rect class="panel" x="540" y="150" width="220" height="86"/><text class="body" x="650" y="178" text-anchor="middle" font-weight="600">no: close it, and go by</text><text class="body" x="650" y="196" text-anchor="middle" font-weight="600">a known address you</text><text class="body" x="650" y="214" text-anchor="middle" font-weight="600">type or bookmarked</text><rect class="panel-a" x="540" y="330" width="220" height="70"/><text class="body" x="650" y="356" text-anchor="middle" font-weight="600">yes: check the padlock</text><text class="body" x="650" y="374" text-anchor="middle" font-weight="600">and the page's demands</text><line class="stroke" x1="200" y1="142" x2="242" y2="142" marker-end="url(#arrow)"/><line class="stroke" x1="350" y1="174" x2="350" y2="212" marker-end="url(#arrow)"/><line class="stroke" x1="470" y1="270" x2="532" y2="220" marker-end="url(#arrow)"/><text class="small" x="512" y="236">no</text><line class="stroke" x1="470" y1="270" x2="532" y2="332" marker-end="url(#arrow)"/><text class="small" x="512" y="296">yes</text><text class="small" x="390" y="412" text-anchor="middle">Never type a password into a page you did not reach yourself.</text><text class="small" x="390" y="434" text-anchor="middle">The padlock means the connection is encrypted - not that the site is honest.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
