<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table comparing virtual reality and augmented reality</title><desc id="d">Table comparing virtual reality and augmented reality across what each does, what the learner needs, one classroom use, and the main constraint.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">VR immerses; AR annotates</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="196" y1="64" x2="196" y2="414"/><line class="grid" x1="496" y1="64" x2="496" y2="414"/><line class="grid" x1="16" y1="106" x2="764" y2="106"/><line class="grid" x1="16" y1="178" x2="764" y2="178"/><line class="grid" x1="16" y1="250" x2="764" y2="250"/><line class="grid" x1="16" y1="322" x2="764" y2="322"/><line class="grid" x1="16" y1="394" x2="764" y2="394"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="106" y="91" text-anchor="middle">Property</text><text class="h" x="346" y="91" text-anchor="middle">Virtual reality</text><text class="h" x="630" y="91" text-anchor="middle">Augmented reality</text><text class="body" x="28" y="140" font-weight="600">What it does</text><text class="body" x="208" y="133">replaces the world with a</text><text class="body" x="208" y="149">generated one</text><text class="body" x="508" y="133">adds digital objects to</text><text class="body" x="508" y="149">the real one</text><text class="body" x="28" y="212" font-weight="600">What the learner needs</text><text class="body" x="208" y="212">a headset and a safe clear space</text><text class="body" x="508" y="212">a phone or tablet camera</text><text class="body" x="28" y="284" font-weight="600">One classroom use</text><text class="body" x="208" y="277">walk through a virtual</text><text class="body" x="208" y="293">historical city</text><text class="body" x="508" y="277">label the parts of real</text><text class="body" x="508" y="293">lab equipment</text><text class="body" x="28" y="356" font-weight="600">Main constraint</text><text class="body" x="208" y="349">cost of devices and</text><text class="body" x="208" y="365">shared headsets</text><text class="body" x="508" y="349">smaller screens and</text><text class="body" x="508" y="365">holding the device</text><text class="small" x="390" y="420" text-anchor="middle">For a Pakistani school, the realistic entry is AR on existing phones.</text><text class="small" x="390" y="438" text-anchor="middle">A purchase without a lesson plan is the thing to refuse.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
