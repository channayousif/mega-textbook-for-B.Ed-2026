<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ویب درخواست کے سفر کا خاکہ</title><desc id="d">ویب درخواست کے سفر کا خاکہ: براؤزر انٹرنیٹ کے راستے صفحات مانگتا ہے، ویب سرور صفحات رکھتا ہے، صفحہ واپس آتا ہے؛ سرچ انجن ایک الگ سائٹ ہے جو دوسری سائٹیں ڈھونڈتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .note{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">ویب درخواست کا سفر</text><text class="small" x="390" y="64" text-anchor="middle">براؤزر آپ کو لے جاتا ہے؛ سرچ انجن خود ایک سائٹ ہے جو دوسری سائٹیں ڈھونڈتی ہے</text><rect class="note" x="250" y="90" width="280" height="56"/><text class="body" x="390" y="114" text-anchor="middle" font-weight="600">سرچ انجن (سائٹیں ڈھونڈنے والی سائٹ)</text><text class="small" x="390" y="134" text-anchor="middle">یہ صفحات تجویز کرتی ہے؛ یہ براؤزر نہیں</text><line class="stroke" x1="440" y1="146" x2="540" y2="196" marker-end="url(#arrow)"/><rect class="panel-a" x="570" y="200" width="170" height="80"/><text class="body" x="655" y="228" text-anchor="middle" font-weight="600">براؤزر</text><text class="small" x="655" y="250" text-anchor="middle">صفحات مانگتا ہے،</text><text class="small" x="655" y="266" text-anchor="middle">پھر انہیں بناتا ہے</text><rect class="panel" x="305" y="200" width="170" height="80"/><text class="body" x="390" y="228" text-anchor="middle" font-weight="600">انٹرنیٹ</text><text class="small" x="390" y="250" text-anchor="middle">درخواست لے جاتا ہے</text><text class="small" x="390" y="266" text-anchor="middle">درست سرور تک</text><rect class="panel-b" x="40" y="200" width="170" height="80"/><text class="body" x="125" y="228" text-anchor="middle" font-weight="600">ویب سرور</text><text class="small" x="125" y="250" text-anchor="middle">صفحات رکھتا ہے،</text><text class="small" x="125" y="266" text-anchor="middle">مانگا گیا صفحہ بھیجتا ہے</text><line class="stroke" x1="570" y1="240" x2="483" y2="240" marker-end="url(#arrow)"/><line class="stroke" x1="305" y1="240" x2="218" y2="240" marker-end="url(#arrow)"/><path class="stroke" d="M125 280 V350 H655 V290" fill="none" marker-end="url(#arrow)"/><text class="small" x="390" y="340" text-anchor="middle">صفحہ واپس آتا ہے اور براؤزر اسے آپ کی اسکرین پر بناتا ہے</text><text class="small" x="390" y="412" text-anchor="middle">ایک انٹرنیٹ، ایک فون، ایک لفظ: فرق صرف یہ جاننے میں ہے کہ کون سا اوزار کون سا کام کرتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
