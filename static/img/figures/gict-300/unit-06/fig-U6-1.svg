<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the journey of a web request</title><desc id="d">Diagram of the journey of a web request: the browser asks for pages across the internet, the web server holds the pages, the page arrives back; a search engine is a separate site that finds other sites.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .note{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The journey of a web request</text><text class="small" x="390" y="64" text-anchor="middle">The browser carries you; the search engine is itself a site that finds other sites</text><rect class="note" x="250" y="90" width="280" height="56"/><text class="body" x="390" y="114" text-anchor="middle" font-weight="600">search engine (a site that finds sites)</text><text class="small" x="390" y="134" text-anchor="middle">it offers pages; it is not the browser</text><line class="stroke" x1="340" y1="146" x2="240" y2="196" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="200" width="170" height="80"/><text class="body" x="125" y="228" text-anchor="middle" font-weight="600">browser</text><text class="small" x="125" y="250" text-anchor="middle">asks for pages,</text><text class="small" x="125" y="266" text-anchor="middle">then draws them</text><rect class="panel" x="305" y="200" width="170" height="80"/><text class="body" x="390" y="228" text-anchor="middle" font-weight="600">internet</text><text class="small" x="390" y="250" text-anchor="middle">carries the request</text><text class="small" x="390" y="266" text-anchor="middle">to the right server</text><rect class="panel-b" x="570" y="200" width="170" height="80"/><text class="body" x="655" y="228" text-anchor="middle" font-weight="600">web server</text><text class="small" x="655" y="250" text-anchor="middle">holds the pages,</text><text class="small" x="655" y="266" text-anchor="middle">sends the one asked for</text><line class="stroke" x1="210" y1="240" x2="297" y2="240" marker-end="url(#arrow)"/><line class="stroke" x1="475" y1="240" x2="562" y2="240" marker-end="url(#arrow)"/><path class="stroke" d="M 655 280 V 350 H 125 V 290" fill="none" marker-end="url(#arrow)"/><text class="small" x="390" y="340" text-anchor="middle">the page arrives back, and the browser draws it on your screen</text><text class="small" x="390" y="412" text-anchor="middle">Same internet, same phone, same word: the difference is knowing which tool does which job.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
