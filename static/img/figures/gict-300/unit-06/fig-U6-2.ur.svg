<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ آن لائن مواصلاتی اوزاروں کا جدول</title><desc id="d">پانچ آن لائن مواصلاتی اوزاروں کا جدول: ہر ایک کس کام کے لیے بہتر ہے اور ایک کلاس روم استعمال۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">مواصلاتی اوزار: ملازم کریں، صرف سیکھنا کافی نہیں</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="574" y1="64" x2="574" y2="414"/><line class="grid" x1="304" y1="64" x2="304" y2="414"/><line class="grid" x1="764" y1="106" x2="16" y2="106"/><line class="grid" x1="764" y1="171" x2="16" y2="171"/><line class="grid" x1="764" y1="236" x2="16" y2="236"/><line class="grid" x1="764" y1="301" x2="16" y2="301"/><line class="grid" x1="764" y1="366" x2="16" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="669" y="91" text-anchor="middle">اوزار</text><text class="h" x="439" y="91" text-anchor="middle">کس کام کے لیے بہتر</text><text class="h" x="160" y="91" text-anchor="middle">ایک کلاس روم استعمال</text><text class="body" x="752" y="142" font-weight="600" text-anchor="end">ای میل</text><text class="body" x="562" y="135" text-anchor="end">رسمی، ریکارڈ رکھنے والی</text><text class="body" x="562" y="151" text-anchor="end">مواصلت</text><text class="body" x="292" y="142" text-anchor="end">والدین کو ٹرم رپورٹ بھیجنا</text><text class="body" x="752" y="207" font-weight="600" text-anchor="end">فوری پیغام رسانی</text><text class="body" x="562" y="200" text-anchor="end">گروپ کے اندر فوری</text><text class="body" x="562" y="216" text-anchor="end">سوالات</text><text class="body" x="292" y="207" text-anchor="end">کلاس گروپ کے اعلانات</text><text class="body" x="752" y="272" font-weight="600" text-anchor="end">ویڈیو میٹنگ</text><text class="body" x="562" y="265" text-anchor="end">زندہ تدریس اور میٹنگیں</text><text class="body" x="562" y="281" text-anchor="end">فاصلے پار</text><text class="body" x="292" y="272" text-anchor="end">دور سے والدین کی میٹنگ</text><text class="body" x="752" y="337" font-weight="600" text-anchor="end">بحث فورم</text><text class="body" x="562" y="330" text-anchor="end">طویل تحریری بحث،</text><text class="body" x="562" y="346" text-anchor="end">ہر آواز سنائی دیتی ہے</text><text class="body" x="292" y="337" text-anchor="end">ہفتہ وار ہوم ورک سوالات</text><text class="body" x="752" y="402" font-weight="600" text-anchor="end">لرننگ پلیٹ فارم</text><text class="body" x="562" y="395" text-anchor="end">مواد اور سراغ کے ساتھ</text><text class="body" x="562" y="411" text-anchor="end">منظم کورسز</text><text class="body" x="292" y="402" text-anchor="end">اسکول کا assignment پورٹل</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
