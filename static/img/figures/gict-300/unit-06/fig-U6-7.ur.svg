<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بلاک چین کا خاکہ: جڑے ہوئے ریکارڈ بلاکس</title><desc id="d">خاکہ: بلاک چین چار جڑے بلاکس، ہر بلاک پچھلے بلاک کی مہر اٹھائے، اور نیچے لکھا: ایک پرانا ریکارڈ بدلیں تو ہر بعد کی مہر ٹوٹ جاتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .recline{stroke:var(--muted);stroke-width:1.5} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">بلاک چین: بلاکس، مہریں، زنجیر</text><text class="small" x="390" y="64" text-anchor="middle">ہر بلاک پچھلے بلاک کے مواد سے نکلی مہر اٹھائے ہوتا ہے</text><rect class="panel-a" x="590" y="150" width="160" height="130"/><text class="body" x="670" y="176" text-anchor="middle" font-weight="600">بلاک 1</text><line class="recline" x1="730" y1="196" x2="610" y2="196"/><text class="small" x="670" y="216" text-anchor="middle">ریکارڈ: اندراج ا</text><text class="small" x="670" y="234" text-anchor="middle">ریکارڈ: اندراج ب</text><line class="recline" x1="730" y1="250" x2="610" y2="250"/><text class="small" x="670" y="270" text-anchor="middle">مہر: 7f3a...</text><rect class="panel-b" x="405" y="150" width="160" height="130"/><text class="body" x="485" y="176" text-anchor="middle" font-weight="600">بلاک 2</text><line class="recline" x1="545" y1="196" x2="425" y2="196"/><text class="small" x="485" y="216" text-anchor="middle">ریکارڈ: اندراج ج</text><text class="small" x="485" y="234" text-anchor="middle">ریکارڈ: اندراج د</text><line class="recline" x1="545" y1="250" x2="425" y2="250"/><text class="small" x="485" y="270" text-anchor="middle">مہر: b92c... (7f3a سے)</text><rect class="panel-c" x="220" y="150" width="160" height="130"/><text class="body" x="300" y="176" text-anchor="middle" font-weight="600">بلاک 3</text><line class="recline" x1="360" y1="196" x2="240" y2="196"/><text class="small" x="300" y="216" text-anchor="middle">ریکارڈ: اندراج ے</text><text class="small" x="300" y="234" text-anchor="middle">ریکارڈ: اندراج ف</text><line class="recline" x1="360" y1="250" x2="240" y2="250"/><text class="small" x="300" y="270" text-anchor="middle">مہر: 44de... (b92c سے)</text><rect class="panel-d" x="35" y="150" width="160" height="130"/><text class="body" x="115" y="176" text-anchor="middle" font-weight="600">بلاک 4</text><line class="recline" x1="175" y1="196" x2="55" y2="196"/><text class="small" x="115" y="216" text-anchor="middle">ریکارڈ: اندراج گ</text><text class="small" x="115" y="234" text-anchor="middle">ریکارڈ: اندراج ح</text><line class="recline" x1="175" y1="250" x2="55" y2="250"/><text class="small" x="115" y="270" text-anchor="middle">مہر: e01f... (44de سے)</text><line class="stroke" x1="590" y1="215" x2="573" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="405" y1="215" x2="388" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="220" y1="215" x2="203" y2="215" marker-end="url(#arrow)"/><text class="small" x="390" y="330" text-anchor="middle">ایک پرانا ریکارڈ بدلیں تو اس کی مہر بدل جاتی ہے -</text><text class="small" x="390" y="350" text-anchor="middle">جس سے ہر بعد کی مہر ٹوٹ جاتی ہے، اور ہر نقل رکھنے والا یہ ٹوٹ دیکھ سکتا ہے۔</text><text class="small" x="390" y="400" text-anchor="middle">بلاک چین اس لیجر ڈیزائن کا نام ہے؛ بٹ کوائن اس کی ایک ایپلیکیشن ہے، ڈیزائن خود نہیں۔</text><text class="small" x="390" y="422" text-anchor="middle">دیانتدار سوال: کیا اس ریکارڈ کو اس کی ضرورت ہے؟ اس میں کس کا اعتماد کا مسئلہ ہے؟</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
