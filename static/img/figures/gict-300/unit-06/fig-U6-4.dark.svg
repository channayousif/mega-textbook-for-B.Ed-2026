<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five safe-browsing checks</title><desc id="d">Table of five safe-browsing checks with what each tells you and what it does not tell you.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">Five checks - and what each one cannot tell you</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="216" y1="64" x2="216" y2="414"/><line class="grid" x1="496" y1="64" x2="496" y2="414"/><line class="grid" x1="16" y1="106" x2="764" y2="106"/><line class="grid" x1="16" y1="171" x2="764" y2="171"/><line class="grid" x1="16" y1="236" x2="764" y2="236"/><line class="grid" x1="16" y1="301" x2="764" y2="301"/><line class="grid" x1="16" y1="366" x2="764" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="116" y="91" text-anchor="middle">Check</text><text class="h" x="356" y="91" text-anchor="middle">What it tells you</text><text class="h" x="630" y="91" text-anchor="middle">What it does NOT tell you</text><text class="body" x="28" y="142" font-weight="600">reading the domain</text><text class="body" x="228" y="142">who really owns the site</text><text class="body" x="508" y="135">nothing about how pretty</text><text class="body" x="508" y="151">the page looks</text><text class="body" x="28" y="207" font-weight="600">the padlock</text><text class="body" x="228" y="207">the connection is encrypted</text><text class="body" x="508" y="207">whether the site itself is honest</text><text class="body" x="28" y="272" font-weight="600">judging the content</text><text class="body" x="228" y="265">whether the page's demands</text><text class="body" x="228" y="281">are plausible</text><text class="body" x="508" y="272">nothing about the design quality</text><text class="body" x="28" y="337" font-weight="600">using a known address</text><text class="body" x="228" y="337">you are at the real site</text><text class="body" x="508" y="337">what you choose to type there</text><text class="body" x="28" y="402" font-weight="600">browser warnings</text><text class="body" x="228" y="395">the site is known to be</text><text class="body" x="228" y="411">dangerous</text><text class="body" x="508" y="395">that an unlisted site</text><text class="body" x="508" y="411">is safe</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
