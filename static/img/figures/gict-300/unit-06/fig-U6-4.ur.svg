<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ محفوظ براؤزنگ جانچوں کا جدول</title><desc id="d">پانچ محفوظ براؤزنگ جانچوں کا جدول: ہر ایک کیا بتاتی ہے اور کیا نہیں بتاتی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">پانچ جانچیں - اور ہر ایک کیا نہیں بتاتی</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="564" y1="64" x2="564" y2="414"/><line class="grid" x1="284" y1="64" x2="284" y2="414"/><line class="grid" x1="764" y1="106" x2="16" y2="106"/><line class="grid" x1="764" y1="171" x2="16" y2="171"/><line class="grid" x1="764" y1="236" x2="16" y2="236"/><line class="grid" x1="764" y1="301" x2="16" y2="301"/><line class="grid" x1="764" y1="366" x2="16" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="664" y="91" text-anchor="middle">جانچ</text><text class="h" x="424" y="91" text-anchor="middle">کیا بتاتی ہے</text><text class="h" x="150" y="91" text-anchor="middle">کیا نہیں بتاتی</text><text class="body" x="752" y="142" font-weight="600" text-anchor="end">ڈومین پڑھنا</text><text class="body" x="552" y="142" text-anchor="end">سائٹ اصل میں کس کی ہے</text><text class="body" x="272" y="135" text-anchor="end">صفحہ کتنا بھی</text><text class="body" x="272" y="151" text-anchor="end">خوبصورت لگتا ہے، کچھ نہیں</text><text class="body" x="752" y="207" font-weight="600" text-anchor="end">پیڈ لاک</text><text class="body" x="552" y="207" text-anchor="end">کنکشن خفیہ ہے</text><text class="body" x="272" y="207" text-anchor="end">سائٹ خود دیانتدار ہے یا نہیں</text><text class="body" x="752" y="272" font-weight="600" text-anchor="end">مواد کا جائزہ</text><text class="body" x="552" y="265" text-anchor="end">صفحے کی مانگ</text><text class="body" x="552" y="281" text-anchor="end">قابل قبول ہے یا نہیں</text><text class="body" x="272" y="272" text-anchor="end">ڈیزائن کے معیار کے بارے میں کچھ نہیں</text><text class="body" x="752" y="337" font-weight="600" text-anchor="end">جانا ہوا پتہ استعمال کرنا</text><text class="body" x="552" y="337" text-anchor="end">آپ اصل سائٹ پر ہیں</text><text class="body" x="272" y="337" text-anchor="end">وہاں آپ کیا لکھتے ہیں</text><text class="body" x="752" y="402" font-weight="600" text-anchor="end">براؤزر کی وارننگ</text><text class="body" x="552" y="395" text-anchor="end">سائٹ کے خطرناک ہونے</text><text class="body" x="552" y="411" text-anchor="end">کا پتہ ہے</text><text class="body" x="272" y="395" text-anchor="end">کہ غیر فہرست شدہ سائٹ</text><text class="body" x="272" y="411" text-anchor="end">محفوظ ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
