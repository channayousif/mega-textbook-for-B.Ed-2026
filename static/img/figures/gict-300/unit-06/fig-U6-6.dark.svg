<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of AI and IoT uses in education</title><desc id="d">Table of AI and IoT uses in education with one school use and the caution for each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">AI and IoT in education: uses and cautions</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="226" y1="52" x2="226" y2="412"/><line class="grid" x1="500" y1="52" x2="500" y2="412"/><line class="grid" x1="16" y1="92" x2="764" y2="92"/><line class="grid" x1="16" y1="157" x2="764" y2="157"/><line class="grid" x1="16" y1="222" x2="764" y2="222"/><line class="grid" x1="16" y1="287" x2="764" y2="287"/><line class="grid" x1="16" y1="352" x2="764" y2="352"/><rect class="frame" x="16" y="52" width="748" height="360"/><text class="h" x="121" y="77" text-anchor="middle">Technology</text><text class="h" x="363" y="77" text-anchor="middle">One school use</text><text class="h" x="632" y="77" text-anchor="middle">The caution</text><text class="body" x="26" y="120" font-weight="600">AI drafting tools</text><text class="body" x="238" y="113">quiz and worksheet drafts</text><text class="body" x="238" y="129">in minutes</text><text class="body" x="512" y="113">fluent errors: a teacher must</text><text class="body" x="512" y="129">review every fact</text><text class="body" x="26" y="185" font-weight="600">AI translation</text><text class="body" x="238" y="185">bilingual material support</text><text class="body" x="512" y="178">nuance can drift:</text><text class="body" x="512" y="194">check key terms</text><text class="body" x="26" y="250" font-weight="600">IoT attendance device</text><text class="body" x="238" y="243">automatic staff and</text><text class="body" x="238" y="259">pupil records</text><text class="body" x="512" y="243">biometric data is sensitive:</text><text class="body" x="512" y="259">strictest handling</text><text class="body" x="26" y="315" font-weight="600">IoT water or power sensor</text><text class="body" x="238" y="308">tank levels and bills without</text><text class="body" x="238" y="324">site visits</text><text class="body" x="512" y="308">sensors fail silently:</text><text class="body" x="512" y="324">keep a manual check</text><text class="small" x="390" y="400" text-anchor="middle">UNESCO's rule for AI in education: enhance human capacity rather than replace it,</text><text class="small" x="390" y="416" text-anchor="middle">with human accountability for outcomes.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
