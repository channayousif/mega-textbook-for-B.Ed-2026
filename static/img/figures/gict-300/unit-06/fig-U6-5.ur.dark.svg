<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ: ابھرتے ٹیکنالوجی درمیان میں، چار شاخیں</title><desc id="d">تصوراتی نقشہ: ابھرتے ٹیکنالوجی درمیان میں اور چار شاخیں: مصنوعی ذہانت، انٹرنیٹ آف تھنگز، بلاک چین، اور ورچوئل و اگمنٹڈ رئیلٹی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .center{fill:var(--panel);stroke:var(--ink);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">ابھرتے ٹیکنالوجی کا خاندان</text><text class="small" x="390" y="64" text-anchor="middle">چاروں کا ایک ہی سوال: یہ اس سبق کے لیے کیا کرتی ہے، اس قیمت پر، ان احتیاطوں کے ساتھ؟</text><ellipse class="center" cx="390" cy="255" rx="115" ry="46"/><text class="body" x="390" y="249" text-anchor="middle" font-weight="600">ابھرتی</text><text class="body" x="390" y="269" text-anchor="middle" font-weight="600">ٹیکنالوجیاں</text><rect class="panel-a" x="535" y="110" width="215" height="74"/><text class="body" x="643" y="136" text-anchor="middle" font-weight="600">مصنوعی ذہانت</text><text class="small" x="643" y="158" text-anchor="middle">وہ نظام جو نمونے سیکھتے</text><text class="small" x="643" y="174" text-anchor="middle">اور پیش گوئی کرتے ہیں</text><rect class="panel-b" x="30" y="110" width="215" height="74"/><text class="body" x="138" y="130" text-anchor="middle" font-weight="600">انٹرنیٹ آف تھنگز</text><text class="small" x="138" y="152" text-anchor="middle">وہ چیزیں جو محسوس</text><text class="small" x="138" y="168" text-anchor="middle">کرتی اور جڑتی ہیں</text><rect class="panel-c" x="535" y="330" width="215" height="74"/><text class="body" x="643" y="356" text-anchor="middle" font-weight="600">بلاک چین</text><text class="small" x="643" y="378" text-anchor="middle">وہ ریکارڈ جو خاموشی سے</text><text class="small" x="643" y="394" text-anchor="middle">بدلنے کے خلاف ہیں</text><rect class="panel-d" x="30" y="330" width="215" height="74"/><text class="body" x="138" y="350" text-anchor="middle" font-weight="600">ورچوئل اور</text><text class="body" x="138" y="368" text-anchor="middle" font-weight="600">اگمنٹڈ رئیلٹی</text><text class="small" x="138" y="390" text-anchor="middle">دنیائیں جہاں آپ جاتے ہیں یا اوپر چڑھاتے ہیں</text><line class="stroke" x1="555" y1="184" x2="480" y2="224" marker-end="url(#arrow)"/><line class="stroke" x1="225" y1="184" x2="300" y2="224" marker-end="url(#arrow)"/><line class="stroke" x1="555" y1="330" x2="480" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="225" y1="330" x2="300" y2="288" marker-end="url(#arrow)"/><text class="small" x="390" y="440" text-anchor="middle">ہر ایک کام انسان سے سسٹم کو دیتی ہے - اور کوئی ذمہ داری نہیں دیتی۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
