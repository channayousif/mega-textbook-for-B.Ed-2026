<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تعلیم میں AI اور IoT کے استعمال کا جدول</title><desc id="d">تعلیم میں AI اور IoT کے استعمال کا جدول: ہر ایک کا ایک اسکول استعمال اور احتیاط۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="38" text-anchor="middle" font-size="16">تعلیم میں AI اور IoT: استعمال اور احتیاط</text><rect class="cellhdr" x="16" y="52" width="748" height="40"/><line class="grid" x1="554" y1="52" x2="554" y2="412"/><line class="grid" x1="280" y1="52" x2="280" y2="412"/><line class="grid" x1="764" y1="92" x2="16" y2="92"/><line class="grid" x1="764" y1="157" x2="16" y2="157"/><line class="grid" x1="764" y1="222" x2="16" y2="222"/><line class="grid" x1="764" y1="287" x2="16" y2="287"/><line class="grid" x1="764" y1="352" x2="16" y2="352"/><rect class="frame" x="16" y="52" width="748" height="360"/><text class="h" x="659" y="77" text-anchor="middle">ٹیکنالوجی</text><text class="h" x="417" y="77" text-anchor="middle">ایک اسکول استعمال</text><text class="h" x="148" y="77" text-anchor="middle">احتیاط</text><text class="body" x="754" y="120" font-weight="600" text-anchor="end">AI ڈرافٹنگ اوزار</text><text class="body" x="542" y="113" text-anchor="end">منٹوں میں کوئز اور</text><text class="body" x="542" y="129" text-anchor="end">ورک شیٹ ڈرافٹ</text><text class="body" x="268" y="113" text-anchor="end">رواں غلطیاں: استاد ہر</text><text class="body" x="268" y="129" text-anchor="end">حقیقت خود جانچے</text><text class="body" x="754" y="185" font-weight="600" text-anchor="end">AI ترجمہ</text><text class="body" x="542" y="185" text-anchor="end">دو لسانی مواد کی مدد</text><text class="body" x="268" y="178" text-anchor="end">باریکی بدل سکتی ہے:</text><text class="body" x="268" y="194" text-anchor="end">اہم الفاظ جانچیں</text><text class="body" x="754" y="250" font-weight="600" text-anchor="end">IoT حاضری ڈیوائس</text><text class="body" x="542" y="243" text-anchor="end">عملے اور شاگردوں کے</text><text class="body" x="542" y="259" text-anchor="end">خودکار ریکارڈ</text><text class="body" x="268" y="243" text-anchor="end">بائیو میٹرک ڈیٹا حساس ہے:</text><text class="body" x="268" y="259" text-anchor="end">سخت ترین احتیاط</text><text class="body" x="754" y="315" font-weight="600" text-anchor="end">IoT پانی یا بجلی سینسر</text><text class="body" x="542" y="308" text-anchor="end">بغیر جگہ کا دورہ کیے ٹینک</text><text class="body" x="542" y="324" text-anchor="end">کی سطح اور بل</text><text class="body" x="268" y="308" text-anchor="end">سینسر خاموشی سے فیل ہوتے ہیں:</text><text class="body" x="268" y="324" text-anchor="end">دستی جانچ برقرار رکھیں</text><text class="small" x="390" y="400" text-anchor="middle">یونیسکو کا اصول: AI انسانی صلاحیت بڑھائے، بدلے نہ کرے،</text><text class="small" x="390" y="416" text-anchor="middle">اور نتائج کی ذمہ داری انسان پر رہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
