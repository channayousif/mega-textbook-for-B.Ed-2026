<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a blockchain as linked blocks of records</title><desc id="d">Diagram of a blockchain as four linked blocks of records, each carrying the previous block's seal, with a caption that changing one old record breaks every later seal.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} .recline{stroke:var(--muted);stroke-width:1.5} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">A blockchain: blocks, seals, chain</text><text class="small" x="390" y="64" text-anchor="middle">Each block carries a seal derived from the previous block's contents</text><rect class="panel-a" x="30" y="150" width="160" height="130"/><text class="body" x="110" y="176" text-anchor="middle" font-weight="600">block 1</text><line class="recline" x1="50" y1="196" x2="170" y2="196"/><text class="small" x="110" y="216" text-anchor="middle">record: entry A</text><text class="small" x="110" y="234" text-anchor="middle">record: entry B</text><line class="recline" x1="50" y1="250" x2="170" y2="250"/><text class="small" x="110" y="270" text-anchor="middle">seal: 7f3a...</text><rect class="panel-b" x="215" y="150" width="160" height="130"/><text class="body" x="295" y="176" text-anchor="middle" font-weight="600">block 2</text><line class="recline" x1="235" y1="196" x2="355" y2="196"/><text class="small" x="295" y="216" text-anchor="middle">record: entry C</text><text class="small" x="295" y="234" text-anchor="middle">record: entry D</text><line class="recline" x1="235" y1="250" x2="355" y2="250"/><text class="small" x="295" y="270" text-anchor="middle">seal: b92c... (from 7f3a)</text><rect class="panel-c" x="400" y="150" width="160" height="130"/><text class="body" x="480" y="176" text-anchor="middle" font-weight="600">block 3</text><line class="recline" x1="420" y1="196" x2="540" y2="196"/><text class="small" x="480" y="216" text-anchor="middle">record: entry E</text><text class="small" x="480" y="234" text-anchor="middle">record: entry F</text><line class="recline" x1="420" y1="250" x2="540" y2="250"/><text class="small" x="480" y="270" text-anchor="middle">seal: 44de... (from b92c)</text><rect class="panel-d" x="585" y="150" width="160" height="130"/><text class="body" x="665" y="176" text-anchor="middle" font-weight="600">block 4</text><line class="recline" x1="605" y1="196" x2="725" y2="196"/><text class="small" x="665" y="216" text-anchor="middle">record: entry G</text><text class="small" x="665" y="234" text-anchor="middle">record: entry H</text><line class="recline" x1="605" y1="250" x2="725" y2="250"/><text class="small" x="665" y="270" text-anchor="middle">seal: e01f... (from 44de)</text><line class="stroke" x1="190" y1="215" x2="207" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="375" y1="215" x2="392" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="215" x2="577" y2="215" marker-end="url(#arrow)"/><text class="small" x="390" y="330" text-anchor="middle">Change one old record and its seal changes -</text><text class="small" x="390" y="350" text-anchor="middle">which breaks every later seal, and every copy-holder can see the break.</text><text class="small" x="390" y="400" text-anchor="middle">"Blockchain" names this ledger design; bitcoin is one application of it, not the design itself.</text><text class="small" x="390" y="422" text-anchor="middle">The honest question: does this record need one? Whose trust problem does it have?</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
