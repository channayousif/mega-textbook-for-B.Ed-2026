<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with emerging technologies at the centre and four branches</title><desc id="d">Concept map with emerging technologies at the centre and four branches: artificial intelligence, the Internet of Things, blockchain, and virtual and augmented reality.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .center{fill:var(--panel);stroke:var(--ink);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The emerging-technology family</text><text class="small" x="390" y="64" text-anchor="middle">Same closing question for all four: what does it do for this lesson, at this cost, with these cautions?</text><ellipse class="center" cx="390" cy="255" rx="115" ry="46"/><text class="body" x="390" y="249" text-anchor="middle" font-weight="600">Emerging</text><text class="body" x="390" y="269" text-anchor="middle" font-weight="600">technologies</text><rect class="panel-a" x="30" y="110" width="215" height="74"/><text class="body" x="137" y="136" text-anchor="middle" font-weight="600">artificial intelligence</text><text class="small" x="137" y="158" text-anchor="middle">systems that learn patterns</text><text class="small" x="137" y="174" text-anchor="middle">and predict</text><rect class="panel-b" x="535" y="110" width="215" height="74"/><text class="body" x="642" y="130" text-anchor="middle" font-weight="600">Internet of Things</text><text class="small" x="642" y="152" text-anchor="middle">objects that sense</text><text class="small" x="642" y="168" text-anchor="middle">and connect</text><rect class="panel-c" x="30" y="330" width="215" height="74"/><text class="body" x="137" y="356" text-anchor="middle" font-weight="600">blockchain</text><text class="small" x="137" y="378" text-anchor="middle">records that resist</text><text class="small" x="137" y="394" text-anchor="middle">silent tampering</text><rect class="panel-d" x="535" y="330" width="215" height="74"/><text class="body" x="642" y="350" text-anchor="middle" font-weight="600">virtual and</text><text class="body" x="642" y="368" text-anchor="middle" font-weight="600">augmented reality</text><text class="small" x="642" y="390" text-anchor="middle">worlds you visit or overlay</text><line class="stroke" x1="225" y1="184" x2="300" y2="224" marker-end="url(#arrow)"/><line class="stroke" x1="555" y1="184" x2="480" y2="224" marker-end="url(#arrow)"/><line class="stroke" x1="225" y1="330" x2="300" y2="288" marker-end="url(#arrow)"/><line class="stroke" x1="555" y1="330" x2="480" y2="288" marker-end="url(#arrow)"/><text class="small" x="390" y="440" text-anchor="middle">Each moves a task from people to systems - and none of them moves responsibility.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
