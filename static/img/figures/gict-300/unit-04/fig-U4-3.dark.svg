<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of how a digital footprint grows</title><desc id="d">Diagram of a person at the centre with eight arrows showing how a digital footprint grows: posts, comments, profile details, searches, locations, purchases, messages and app activity.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .center{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">How a digital footprint grows</text><text class="small" x="390" y="62" text-anchor="middle">Solid boxes: your active footprint. Dashed boxes: the passive part you never chose.</text><circle class="center" cx="390" cy="250" r="52"/><circle cx="390" cy="234" r="14" class="ink"/><path class="stroke" d="M 366 276 a 24 24 0 0 1 48 0" fill="none"/><text class="body" x="390" y="326" text-anchor="middle" font-weight="600">you</text><rect class="panel-a" x="30" y="100" width="170" height="52"/><text class="body" x="115" y="122" text-anchor="middle">posts and photos</text><rect class="panel-a" x="30" y="180" width="170" height="52"/><text class="body" x="115" y="202" text-anchor="middle">comments and likes</text><rect class="panel-a" x="30" y="260" width="170" height="52"/><text class="body" x="115" y="282" text-anchor="middle">profile details</text><rect class="panel-a" x="30" y="340" width="170" height="52"/><text class="body" x="115" y="362" text-anchor="middle">reviews you write</text><rect class="panel-b" x="580" y="100" width="170" height="52" stroke-dasharray="7 5"/><text class="body" x="665" y="122" text-anchor="middle">your searches</text><rect class="panel-b" x="580" y="180" width="170" height="52" stroke-dasharray="7 5"/><text class="body" x="665" y="202" text-anchor="middle">locations visited</text><rect class="panel-b" x="580" y="260" width="170" height="52" stroke-dasharray="7 5"/><text class="body" x="665" y="282" text-anchor="middle">purchases</text><rect class="panel-b" x="580" y="340" width="170" height="52" stroke-dasharray="7 5"/><text class="body" x="665" y="356" text-anchor="middle">app activity and</text><text class="body" x="665" y="374" text-anchor="middle">contact lists</text><line class="stroke" x1="200" y1="126" x2="330" y2="222" marker-end="url(#arrow)"/><line class="stroke" x1="200" y1="206" x2="332" y2="238" marker-end="url(#arrow)"/><line class="stroke" x1="200" y1="286" x2="332" y2="256" marker-end="url(#arrow)"/><line class="stroke" x1="200" y1="366" x2="330" y2="274" marker-end="url(#arrow)"/><line class="stroke" x1="580" y1="126" x2="450" y2="222" marker-end="url(#arrow)"/><line class="stroke" x1="580" y1="206" x2="448" y2="238" marker-end="url(#arrow)"/><line class="stroke" x1="580" y1="286" x2="448" y2="256" marker-end="url(#arrow)"/><line class="stroke" x1="580" y1="366" x2="450" y2="274" marker-end="url(#arrow)"/><text class="small" x="390" y="430" text-anchor="middle">The passive part is collected, merged and profiled - and you see almost none of it.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
