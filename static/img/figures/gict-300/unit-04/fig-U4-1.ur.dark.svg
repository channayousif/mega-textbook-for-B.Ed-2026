<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ: سائبر دھمکیوں کے گرد تین شاخیں</title><desc id="d">تصوراتی نقشہ: سائبر دھمکیاں درمیان میں اور تین شاخیں: ملویئر یعنی وائرس، رینسم ویئر اور اسپائی ویئر؛ فشنگ یعنی جعلی پیغامات اور سائٹیں؛ اور سوشل انجینئرنگ یعنی آپ سے بات کر کے دھوکہ دینا۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">سائبر دھمکیوں کی تین اقسام</text><text class="small" x="390" y="64" text-anchor="middle">زیادہ تر حملے پھیل کر کیے جاتے ہیں؛ یہ بے احتیاط کو پکڑتے ہیں، منتخب کو نہیں</text><ellipse class="center" cx="390" cy="255" rx="110" ry="50"/><text class="body" x="390" y="249" text-anchor="middle" font-weight="600">سائبر</text><text class="body" x="390" y="269" text-anchor="middle" font-weight="600">دھمکیاں</text><rect class="panel" x="540" y="130" width="200" height="86"/><text class="body" x="640" y="158" text-anchor="middle" font-weight="600">ملویئر</text><text class="small" x="640" y="180" text-anchor="middle">وائرس، رینسم ویئر،</text><text class="small" x="640" y="196" text-anchor="middle">اسپائی ویئر</text><rect class="panel" x="290" y="90" width="200" height="70"/><text class="body" x="390" y="118" text-anchor="middle" font-weight="600">فشنگ</text><text class="small" x="390" y="140" text-anchor="middle">جعلی پیغامات اور سائٹیں</text><rect class="panel" x="30" y="130" width="210" height="86"/><text class="body" x="135" y="158" text-anchor="middle" font-weight="600">سوشل انجینئرنگ</text><text class="small" x="135" y="180" text-anchor="middle">آپ سے بات یا دھوکہ</text><text class="small" x="135" y="196" text-anchor="middle">(سافٹ ویئر کی ضرورت نہیں)</text><line class="stroke" x1="580" y1="196" x2="488" y2="228" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="160" x2="390" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="200" y1="196" x2="292" y2="228" marker-end="url(#arrow)"/><text class="small" x="390" y="400" text-anchor="middle">دفاع عادات ہیں: اپ ڈیٹ رکھیں، ٹیپ سے پہلے جانچیں، سرکاری اسٹور سے انسٹال کریں، بیک اپ مشین سے دور رکھیں۔</text><text class="small" x="390" y="420" text-anchor="middle">سی آئی اے تینی کا تحفظ: رازداری، درستگی، دستیابی۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
