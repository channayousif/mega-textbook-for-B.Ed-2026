<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ اقسام کے اسکول ڈیٹا کا جدول</title><desc id="d">پانچ اقسام کے اسکول ڈیٹا کا جدول: ہر ایک کے لیے جائز طور پر کون مانگ سکتا ہے اور ہر ایک کی ذمہ داری کیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">اسکول ڈیٹا: کون مانگ سکتا ہے، اور کیا ذمہ داری اس کے ساتھ ہے</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="544" y1="64" x2="544" y2="414"/><line class="grid" x1="314" y1="64" x2="314" y2="414"/><line class="grid" x1="764" y1="106" x2="16" y2="106"/><line class="grid" x1="764" y1="171" x2="16" y2="171"/><line class="grid" x1="764" y1="236" x2="16" y2="236"/><line class="grid" x1="764" y1="301" x2="16" y2="301"/><line class="grid" x1="764" y1="366" x2="16" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="654" y="91" text-anchor="middle">اسکول کا ڈیٹا</text><text class="h" x="429" y="91" text-anchor="middle">کون مانگ سکتا ہے</text><text class="h" x="165" y="91" text-anchor="middle">ذمہ داری</text><text class="body" x="752" y="142" font-weight="600" text-anchor="end">شاگردوں کے نام اور نمبر</text><text class="body" x="532" y="135" text-anchor="end">اسکول اور تعلیمی</text><text class="body" x="532" y="151" text-anchor="end">حکام</text><text class="body" x="302" y="135" text-anchor="end">رسائی صرف ان عملے تک</text><text class="body" x="302" y="151" text-anchor="end">جنہیں ضرورت ہے</text><text class="body" x="752" y="207" font-weight="600" text-anchor="end">شاگردوں کی تصاویر</text><text class="body" x="532" y="200" text-anchor="end">اسکول، والدین کی</text><text class="body" x="532" y="216" text-anchor="end">اجازت سے</text><text class="body" x="302" y="200" text-anchor="end">اجازت کے بغیر کبھی</text><text class="body" x="302" y="216" text-anchor="end">شائع نہیں</text><text class="body" x="752" y="272" font-weight="600" text-anchor="end">والدین کے رابطہ نمبر</text><text class="body" x="532" y="272" text-anchor="end">اسکول، اپنے استعمال کے لیے</text><text class="body" x="302" y="265" text-anchor="end">وینڈر یا ایپس کو</text><text class="body" x="302" y="281" text-anchor="end">نہیں دیے جائیں</text><text class="body" x="752" y="337" font-weight="600" text-anchor="end">عملے کے ریکارڈ</text><text class="body" x="532" y="337" text-anchor="end">اسکول انتظامیہ</text><text class="body" x="302" y="337" text-anchor="end">محفوظ رکھیں، کم سے کم نقل</text><text class="body" x="752" y="402" font-weight="600" text-anchor="end">صحت یا بائیو میٹرک نوٹس</text><text class="body" x="532" y="395" text-anchor="end">اسکول اور صحت</text><text class="body" x="532" y="411" text-anchor="end">ماہرین</text><text class="body" x="302" y="395" text-anchor="end">حساس ڈیٹا:</text><text class="body" x="302" y="411" text-anchor="end">سخت ترین احتیاط</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
