<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five threats with how each reaches you</title><desc id="d">Table of five threats with how each reaches you and the practice that stops each one.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">Threats and the habit that stops each</text><rect class="cellhdr" x="16" y="58" width="748" height="40"/><line class="grid" x1="156" y1="58" x2="156" y2="428"/><line class="grid" x1="436" y1="58" x2="436" y2="428"/><line class="grid" x1="16" y1="98" x2="764" y2="98"/><line class="grid" x1="16" y1="162" x2="764" y2="162"/><line class="grid" x1="16" y1="226" x2="764" y2="226"/><line class="grid" x1="16" y1="290" x2="764" y2="290"/><line class="grid" x1="16" y1="354" x2="764" y2="354"/><rect class="frame" x="16" y="58" width="748" height="370"/><text class="h" x="86" y="83" text-anchor="middle">Threat</text><text class="h" x="296" y="83" text-anchor="middle">How it reaches you</text><text class="h" x="600" y="83" text-anchor="middle">The practice that stops it</text><text class="body" x="28" y="126" font-weight="600">virus</text><text class="body" x="168" y="126">infected attachments and downloads</text><text class="body" x="448" y="119">do not open unexpected attachments;</text><text class="body" x="448" y="135">scan downloads</text><text class="body" x="28" y="190" font-weight="600">ransomware</text><text class="body" x="168" y="183">phishing links and</text><text class="body" x="168" y="199">malicious downloads</text><text class="body" x="448" y="183">keep software updated;</text><text class="body" x="448" y="199">back up files offline</text><text class="body" x="28" y="254" font-weight="600">spyware</text><text class="body" x="168" y="247">fake apps and</text><text class="body" x="168" y="263">shady installs</text><text class="body" x="448" y="247">install only from</text><text class="body" x="448" y="263">official stores</text><text class="body" x="28" y="318" font-weight="600">phishing</text><text class="body" x="168" y="311">convincing fake</text><text class="body" x="168" y="327">messages</text><text class="body" x="448" y="311">check sender address and link</text><text class="body" x="448" y="327">before tapping</text><text class="body" x="28" y="382" font-weight="600">social engineering</text><text class="body" x="168" y="375">calls and messages that</text><text class="body" x="168" y="391">pressure you</text><text class="body" x="448" y="375">verify the asker through</text><text class="body" x="448" y="391">a known channel</text><text class="small" x="390" y="424" text-anchor="middle">Every row: the habit is something a person does, not something a box does.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
