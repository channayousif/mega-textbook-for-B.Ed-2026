<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five passwords and habits with a verdict</title><desc id="d">Table of five passwords and habits with a verdict and reason for each.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">Judging passwords and habits</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="286" y1="64" x2="286" y2="414"/><line class="grid" x1="406" y1="64" x2="406" y2="414"/><line class="grid" x1="16" y1="106" x2="764" y2="106"/><line class="grid" x1="16" y1="171" x2="764" y2="171"/><line class="grid" x1="16" y1="236" x2="764" y2="236"/><line class="grid" x1="16" y1="301" x2="764" y2="301"/><line class="grid" x1="16" y1="366" x2="764" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="151" y="91" text-anchor="middle">Password or habit</text><text class="h" x="346" y="91" text-anchor="middle">Verdict</text><text class="h" x="585" y="91" text-anchor="middle">Why</text><text class="body" x="28" y="142" font-weight="600">school123</text><text class="body" x="298" y="142">weak</text><text class="body" x="418" y="135">dictionary word plus digits,</text><text class="body" x="418" y="151">tried first by attackers</text><text class="body" x="28" y="207" font-weight="600">Shakeel2010</text><text class="body" x="298" y="207">weak</text><text class="body" x="418" y="200">a name plus a birth year,</text><text class="body" x="418" y="216">guessable from your footprint</text><text class="body" x="28" y="272" font-weight="600">Pk!9#mQ2vLxz</text><text class="body" x="298" y="272">strong</text><text class="body" x="418" y="265">twelve characters, mixed types,</text><text class="body" x="418" y="281">no words</text><text class="body" x="28" y="337" font-weight="600">a unique password per account</text><text class="body" x="298" y="337">strong habit</text><text class="body" x="418" y="337">one phished site unlocks nothing else</text><text class="body" x="28" y="402" font-weight="600">the same password everywhere</text><text class="body" x="298" y="402">dangerous habit</text><text class="body" x="418" y="395">one leak opens</text><text class="body" x="418" y="411">every door</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
