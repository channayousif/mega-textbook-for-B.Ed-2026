<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ دھمکیوں کا جدول اور ہر ایک تک پہنچنے کا راستہ</title><desc id="d">پانچ دھمکیوں کا جدول: ہر ایک آپ تک کیسے پہنچتی ہے اور کون سی عادت اسے روکتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" font-size="16">دھمکیاں اور ہر ایک کو روکنے والی عادت</text><rect class="cellhdr" x="16" y="58" width="748" height="40"/><line class="grid" x1="624" y1="58" x2="624" y2="428"/><line class="grid" x1="344" y1="58" x2="344" y2="428"/><line class="grid" x1="764" y1="98" x2="16" y2="98"/><line class="grid" x1="764" y1="162" x2="16" y2="162"/><line class="grid" x1="764" y1="226" x2="16" y2="226"/><line class="grid" x1="764" y1="290" x2="16" y2="290"/><line class="grid" x1="764" y1="354" x2="16" y2="354"/><rect class="frame" x="16" y="58" width="748" height="370"/><text class="h" x="694" y="83" text-anchor="middle">دھمکی</text><text class="h" x="484" y="83" text-anchor="middle">آپ تک کیسے پہنچتی ہے</text><text class="h" x="180" y="83" text-anchor="middle">روکنے والی عادت</text><text class="body" x="752" y="126" font-weight="600" text-anchor="end">وائرس</text><text class="body" x="612" y="126" text-anchor="end">متاثر اٹیچمنٹ اور ڈاؤن لوڈ</text><text class="body" x="332" y="119" text-anchor="end">غیر متوقع اٹیچمنٹ نہ کھولیں؛</text><text class="body" x="332" y="135" text-anchor="end">ڈاؤن لوڈ اسکین کریں</text><text class="body" x="752" y="190" font-weight="600" text-anchor="end">رینسم ویئر</text><text class="body" x="612" y="183" text-anchor="end">فشنگ لنک اور</text><text class="body" x="612" y="199" text-anchor="end">نقصان دہ ڈاؤن لوڈ</text><text class="body" x="332" y="183" text-anchor="end">سافٹ ویئر اپ ڈیٹ رکھیں؛</text><text class="body" x="332" y="199" text-anchor="end">فائلیں آف لائن محفوظ کریں</text><text class="body" x="752" y="254" font-weight="600" text-anchor="end">اسپائی ویئر</text><text class="body" x="612" y="247" text-anchor="end">جعلی ایپس اور</text><text class="body" x="612" y="263" text-anchor="end">مشکوک انسٹال</text><text class="body" x="332" y="247" text-anchor="end">صرف سرکاری اسٹور</text><text class="body" x="332" y="263" text-anchor="end">سے انسٹال کریں</text><text class="body" x="752" y="318" font-weight="600" text-anchor="end">فشنگ</text><text class="body" x="612" y="311" text-anchor="end">قائل کرنے والے جعلی</text><text class="body" x="612" y="327" text-anchor="end">پیغامات</text><text class="body" x="332" y="311" text-anchor="end">بھیجنے والے کا پتہ اور لنک</text><text class="body" x="332" y="327" text-anchor="end">ٹیپ سے پہلے جانچیں</text><text class="body" x="752" y="382" font-weight="600" text-anchor="end">سوشل انجینئرنگ</text><text class="body" x="612" y="375" text-anchor="end">کال اور پیغام جو</text><text class="body" x="612" y="391" text-anchor="end">آپ کو جلدی میں ڈالیں</text><text class="body" x="332" y="375" text-anchor="end">مانگنے والے کی تصدیق کسی</text><text class="body" x="332" y="391" text-anchor="end">جانے بوجھنے ذریعے سے کریں</text><text class="small" x="390" y="424" text-anchor="middle">ہر قطار: عادت وہ ہے جو انسان کرتا ہے، جو مشین نہیں کرتی۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
