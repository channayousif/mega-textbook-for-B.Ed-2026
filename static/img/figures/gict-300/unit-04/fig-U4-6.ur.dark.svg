<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ پاس ورڈ اور عادتوں کا جدول، فیصلے کے ساتھ</title><desc id="d">پانچ پاس ورڈ اور عادتوں کا جدول، ہر ایک پر فیصلہ اور وجہ کے ساتھ۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">پاس ورڈ اور عادتوں کا جائزہ</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="494" y1="64" x2="494" y2="414"/><line class="grid" x1="374" y1="64" x2="374" y2="414"/><line class="grid" x1="764" y1="106" x2="16" y2="106"/><line class="grid" x1="764" y1="171" x2="16" y2="171"/><line class="grid" x1="764" y1="236" x2="16" y2="236"/><line class="grid" x1="764" y1="301" x2="16" y2="301"/><line class="grid" x1="764" y1="366" x2="16" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="629" y="91" text-anchor="middle">پاس ورڈ یا عادت</text><text class="h" x="434" y="91" text-anchor="middle">فیصلہ</text><text class="h" x="195" y="91" text-anchor="middle">وجہ</text><text class="body" x="752" y="142" font-weight="600" text-anchor="end">school123</text><text class="body" x="482" y="142" text-anchor="end">کمزور</text><text class="body" x="362" y="135" text-anchor="end">لغت کا لفظ اور ہندسے،</text><text class="body" x="362" y="151" text-anchor="end">حملہ آور سب سے پہلے یہی آزماتے ہیں</text><text class="body" x="752" y="207" font-weight="600" text-anchor="end">Shakeel2010</text><text class="body" x="482" y="207" text-anchor="end">کمزور</text><text class="body" x="362" y="200" text-anchor="end">نام اور پیدائشی سال،</text><text class="body" x="362" y="216" text-anchor="end">آپ کے فوٹ پرنٹ سے اندازہ ہو سکتا ہے</text><text class="body" x="752" y="272" font-weight="600" text-anchor="end">Pk!9#mQ2vLx</text><text class="body" x="482" y="272" text-anchor="end">مضبوط</text><text class="body" x="362" y="265" text-anchor="end">بارہ حروف، ملے جلے اقسام،</text><text class="body" x="362" y="281" text-anchor="end">کوئی لفظ نہیں</text><text class="body" x="752" y="337" font-weight="600" text-anchor="end">ہر اکاؤنٹ کا الگ پاس ورڈ</text><text class="body" x="482" y="337" text-anchor="end">اچھی عادت</text><text class="body" x="362" y="337" text-anchor="end">ایک فش شدہ سائٹ کچھ اور نہیں کھولتی</text><text class="body" x="752" y="402" font-weight="600" text-anchor="end">ہر جگہ ایک ہی پاس ورڈ</text><text class="body" x="482" y="402" text-anchor="end">خطرناک عادت</text><text class="body" x="362" y="395" text-anchor="end">ایک لیک ہر</text><text class="body" x="362" y="411" text-anchor="end">دروازہ کھول دیتا ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
