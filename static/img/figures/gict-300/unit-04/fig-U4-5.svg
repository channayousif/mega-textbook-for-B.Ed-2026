<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of multi-factor authentication</title><desc id="d">Flowchart of multi-factor authentication: password checked, a code requested on the phone, code entered, both factors accepted, and access granted.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">How multi-factor authentication works</text><text class="small" x="390" y="64" text-anchor="middle">Something you know, plus something you have</text><rect class="panel" x="30" y="180" width="130" height="70"/><text class="body" x="95" y="208" text-anchor="middle" font-weight="600">user enters</text><text class="body" x="95" y="228" text-anchor="middle" font-weight="600">password</text><rect class="panel" x="200" y="180" width="130" height="70"/><text class="body" x="265" y="208" text-anchor="middle" font-weight="600">system checks</text><text class="body" x="265" y="228" text-anchor="middle" font-weight="600">it is correct</text><rect class="panel-a" x="370" y="180" width="150" height="70"/><text class="body" x="445" y="203" text-anchor="middle" font-weight="600">second factor</text><text class="body" x="445" y="223" text-anchor="middle" font-weight="600">requested: a code</text><text class="body" x="445" y="240" text-anchor="middle" font-weight="600">on the phone</text><rect class="panel" x="560" y="180" width="130" height="70"/><text class="body" x="625" y="208" text-anchor="middle" font-weight="600">user enters</text><text class="body" x="625" y="228" text-anchor="middle" font-weight="600">the code</text><rect class="panel-b" x="290" y="340" width="200" height="64"/><text class="body" x="390" y="366" text-anchor="middle" font-weight="600">both factors accepted,</text><text class="body" x="390" y="386" text-anchor="middle" font-weight="600">access granted</text><line class="stroke" x1="160" y1="215" x2="192" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="330" y1="215" x2="362" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="520" y1="215" x2="552" y2="215" marker-end="url(#arrow)"/><path class="stroke" d="M 625 250 V 300 H 396 V 332" fill="none" marker-end="url(#arrow)"/><text class="small" x="445" y="130" text-anchor="middle">factor one: something you know</text><text class="small" x="445" y="150" text-anchor="middle">factor two: something you have (the phone)</text><text class="small" x="390" y="428" text-anchor="middle">A phished password alone opens nothing: the attacker still needs your phone.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
