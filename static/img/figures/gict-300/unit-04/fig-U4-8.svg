<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five kinds of school data</title><desc id="d">Table of five kinds of school data with who may legitimately ask for each and the handling duty each carries.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">School data: who may ask, and what duty it carries</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="236" y1="64" x2="236" y2="414"/><line class="grid" x1="466" y1="64" x2="466" y2="414"/><line class="grid" x1="16" y1="106" x2="764" y2="106"/><line class="grid" x1="16" y1="171" x2="764" y2="171"/><line class="grid" x1="16" y1="236" x2="764" y2="236"/><line class="grid" x1="16" y1="301" x2="764" y2="301"/><line class="grid" x1="16" y1="366" x2="764" y2="366"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="126" y="91" text-anchor="middle">Data a school holds</text><text class="h" x="351" y="91" text-anchor="middle">Who may ask for it</text><text class="h" x="615" y="91" text-anchor="middle">Handling duty</text><text class="body" x="28" y="142" font-weight="600">pupil names and marks</text><text class="body" x="248" y="135">the school and education</text><text class="body" x="248" y="151">authorities</text><text class="body" x="478" y="135">access limited to staff</text><text class="body" x="478" y="151">who need it</text><text class="body" x="28" y="207" font-weight="600">pupil photographs</text><text class="body" x="248" y="200">the school, with parent</text><text class="body" x="248" y="216">permission</text><text class="body" x="478" y="200">never published without</text><text class="body" x="478" y="216">consent</text><text class="body" x="28" y="272" font-weight="600">parent contact numbers</text><text class="body" x="248" y="272">the school, for its own use</text><text class="body" x="478" y="265">not shared with vendors</text><text class="body" x="478" y="281">or apps</text><text class="body" x="28" y="337" font-weight="600">staff records</text><text class="body" x="248" y="337">the school administration</text><text class="body" x="478" y="337">kept secure, minimal copies</text><text class="body" x="28" y="402" font-weight="600">health or biometric notes</text><text class="body" x="248" y="395">the school and health</text><text class="body" x="248" y="411">professionals</text><text class="body" x="478" y="395">sensitive data:</text><text class="body" x="478" y="411">strictest handling</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
