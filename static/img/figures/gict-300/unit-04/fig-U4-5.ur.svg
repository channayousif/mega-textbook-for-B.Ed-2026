<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ملٹی فیکٹر تصدیق کا فلو چارٹ</title><desc id="d">ملٹی فیکٹر تصدیق کا فلو چارٹ: پاس ورڈ جانچا جاتا ہے، فون پر کوڈ مانگا جاتا ہے، کوڈ درج ہوتا ہے، دونوں فیکٹر قبول ہوتے ہیں، اور رسائی مل جاتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">ملٹی فیکٹر تصدیق کیسے کام کرتی ہے</text><text class="small" x="390" y="64" text-anchor="middle">وہ چیزیں جو آپ جانتے ہیں، اور وہ جو آپ کے پاس ہے</text><rect class="panel" x="620" y="180" width="130" height="70"/><text class="body" x="685" y="208" text-anchor="middle" font-weight="600">صارف درج کرتا ہے</text><text class="body" x="685" y="228" text-anchor="middle" font-weight="600">پاس ورڈ</text><rect class="panel" x="450" y="180" width="130" height="70"/><text class="body" x="515" y="208" text-anchor="middle" font-weight="600">سسٹم جانچتا ہے</text><text class="body" x="515" y="228" text-anchor="middle" font-weight="600">کہ درست ہے</text><rect class="panel-a" x="260" y="180" width="150" height="70"/><text class="body" x="335" y="203" text-anchor="middle" font-weight="600">دوسرا فیکٹر مانگا:</text><text class="body" x="335" y="223" text-anchor="middle" font-weight="600">فون پر ایک کوڈ</text><text class="body" x="335" y="240" text-anchor="middle" font-weight="600"></text><rect class="panel" x="90" y="180" width="130" height="70"/><text class="body" x="155" y="208" text-anchor="middle" font-weight="600">صارف درج کرتا ہے</text><text class="body" x="155" y="228" text-anchor="middle" font-weight="600">کوڈ</text><rect class="panel-b" x="290" y="340" width="200" height="64"/><text class="body" x="390" y="366" text-anchor="middle" font-weight="600">دونوں فیکٹر قبول،</text><text class="body" x="390" y="386" text-anchor="middle" font-weight="600">رسائی مل گئی</text><line class="stroke" x1="620" y1="215" x2="588" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="215" x2="418" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="260" y1="215" x2="228" y2="215" marker-end="url(#arrow)"/><path class="stroke" d="M155 250 V300 H384 V332" fill="none" marker-end="url(#arrow)"/><text class="small" x="335" y="130" text-anchor="middle">پہلا فیکٹر: وہ جو آپ جانتے ہیں</text><text class="small" x="335" y="150" text-anchor="middle">دوسرا فیکٹر: وہ جو آپ کے پاس ہے (فون)</text><text class="small" x="390" y="428" text-anchor="middle">فش شدہ پاس ورڈ اکیلا کچھ نہیں کھولتا: حملہ آور کو آپ کا فون بھی چاہیے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
