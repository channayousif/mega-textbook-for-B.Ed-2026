<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ فوٹ پرنٹ نشانیوں کا جدول: فعال اور غیر فعال</title><desc id="d">چھ فوٹ پرنٹ نشانیوں کا جدول، فعال اور غیر فعال میں، ہر ایک کے ساتھ کون اسے دیکھ سکتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">چھ نشانیاں: فعال یا غیر فعال؟</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="514" y1="64" x2="514" y2="414"/><line class="grid" x1="364" y1="64" x2="364" y2="414"/><line class="grid" x1="764" y1="106" x2="16" y2="106"/><line class="grid" x1="764" y1="163" x2="16" y2="163"/><line class="grid" x1="764" y1="220" x2="16" y2="220"/><line class="grid" x1="764" y1="277" x2="16" y2="277"/><line class="grid" x1="764" y1="334" x2="16" y2="334"/><line class="grid" x1="764" y1="391" x2="16" y2="391"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="639" y="91" text-anchor="middle">نشانی</text><text class="h" x="439" y="91" text-anchor="middle">فعال یا غیر فعال</text><text class="h" x="190" y="91" text-anchor="middle">کون دیکھ سکتا ہے</text><text class="body" x="752" y="140" font-weight="600" text-anchor="end">آپ کی ڈالی تصویر</text><text class="body" x="502" y="140" text-anchor="end">فعال</text><text class="body" x="352" y="133" text-anchor="end">کوئی بھی، پرائیویسی</text><text class="body" x="352" y="149" text-anchor="end">سیٹنگز کے مطابق</text><text class="body" x="752" y="197" font-weight="600" text-anchor="end">آپ کا لکھا تبصرہ</text><text class="body" x="502" y="197" text-anchor="end">فعال</text><text class="body" x="352" y="190" text-anchor="end">پلیٹ فارم اور</text><text class="body" x="352" y="206" text-anchor="end">اس کے قارئین</text><text class="body" x="752" y="254" font-weight="600" text-anchor="end">آپ کی پروفائل تفصیل</text><text class="body" x="502" y="254" text-anchor="end">فعال</text><text class="body" x="352" y="247" text-anchor="end">پلیٹ فارم اور</text><text class="body" x="352" y="263" text-anchor="end">اکثر اشتہار باز</text><text class="body" x="752" y="311" font-weight="600" text-anchor="end">آپ کی سرچ ہسٹری</text><text class="body" x="502" y="311" text-anchor="end">غیر فعال</text><text class="body" x="352" y="311" text-anchor="end">سرچ انجن اور آپ کی دیکھی سائٹیں</text><text class="body" x="752" y="368" font-weight="600" text-anchor="end">آپ کا مقام ڈیٹا</text><text class="body" x="502" y="368" text-anchor="end">غیر فعال</text><text class="body" x="352" y="368" text-anchor="end">ایپس اور ان کے ساتھی</text><text class="body" x="752" y="412" font-weight="600" text-anchor="end">ایپ کی اپ لوڈ کی رابطہ فہرست</text><text class="body" x="502" y="412" text-anchor="end">غیر فعال</text><text class="body" x="352" y="412" text-anchor="end">ایپ اور جس سے شیئر کرے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
