<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a pupil record with four questions radiating out</title><desc id="d">Diagram of a pupil record at the centre with four questions radiating out: who collected it and why, where it is stored, who can see it, and how long it is kept, plus a dashed side box noting children cannot consent for themselves.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center{fill:var(--a4-fill);stroke:var(--a4);stroke-width:3} .note{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">Four questions for any pupil record</text><text class="small" x="390" y="64" text-anchor="middle">Personal data belongs to the person it describes; the school is a caretaker</text><rect class="center" x="300" y="200" width="180" height="80"/><text class="body" x="390" y="232" text-anchor="middle" font-weight="600">pupil record</text><text class="small" x="390" y="256" text-anchor="middle">name, marks, photo, contacts</text><rect class="panel" x="40" y="110" width="200" height="62"/><text class="body" x="140" y="136" text-anchor="middle" font-weight="600">who collected it</text><text class="body" x="140" y="156" text-anchor="middle" font-weight="600">and why?</text><rect class="panel" x="540" y="110" width="200" height="62"/><text class="body" x="640" y="136" text-anchor="middle" font-weight="600">where is it</text><text class="body" x="640" y="156" text-anchor="middle" font-weight="600">stored?</text><rect class="panel" x="40" y="330" width="200" height="62"/><text class="body" x="140" y="356" text-anchor="middle" font-weight="600">who can</text><text class="body" x="140" y="376" text-anchor="middle" font-weight="600">see it?</text><rect class="panel" x="540" y="330" width="200" height="62"/><text class="body" x="640" y="356" text-anchor="middle" font-weight="600">how long is</text><text class="body" x="640" y="376" text-anchor="middle" font-weight="600">it kept?</text><line class="stroke" x1="240" y1="141" x2="292" y2="212" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="141" x2="488" y2="212" marker-end="url(#arrow)"/><line class="stroke" x1="240" y1="361" x2="292" y2="272" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="361" x2="488" y2="272" marker-end="url(#arrow)"/><rect class="note" x="230" y="418" width="320" height="40"/><text class="small" x="390" y="443" text-anchor="middle">the child cannot consent for themselves: the duty is heavier</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
