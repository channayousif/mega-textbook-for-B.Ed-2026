<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with cyber threats at the centre and three branches</title><desc id="d">Concept map with cyber threats at the centre and three branches: malware including viruses, ransomware and spyware; phishing with fake messages and sites; and social engineering, meaning talking or tricking you.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .center{fill:var(--a3-fill);stroke:var(--a3);stroke-width:3} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .ah{fill:var(--ink)} .wm{fill:var(--wm);font-size:11px} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">The three families of cyber threats</text><text class="small" x="390" y="64" text-anchor="middle">Most attacks are cast wide; they catch the careless, not the chosen</text><ellipse class="center" cx="390" cy="255" rx="110" ry="50"/><text class="body" x="390" y="249" text-anchor="middle" font-weight="600">Cyber</text><text class="body" x="390" y="269" text-anchor="middle" font-weight="600">threats</text><rect class="panel" x="40" y="130" width="200" height="86"/><text class="body" x="140" y="158" text-anchor="middle" font-weight="600">malware</text><text class="small" x="140" y="180" text-anchor="middle">virus, ransomware,</text><text class="small" x="140" y="196" text-anchor="middle">spyware</text><rect class="panel" x="290" y="90" width="200" height="70"/><text class="body" x="390" y="118" text-anchor="middle" font-weight="600">phishing</text><text class="small" x="390" y="140" text-anchor="middle">fake messages and sites</text><rect class="panel" x="540" y="130" width="210" height="86"/><text class="body" x="645" y="158" text-anchor="middle" font-weight="600">social engineering</text><text class="small" x="645" y="180" text-anchor="middle">talking or tricking you</text><text class="small" x="645" y="196" text-anchor="middle">(no software needed)</text><line class="stroke" x1="200" y1="196" x2="292" y2="228" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="160" x2="390" y2="196" marker-end="url(#arrow)"/><line class="stroke" x1="580" y1="196" x2="488" y2="228" marker-end="url(#arrow)"/><text class="small" x="390" y="400" text-anchor="middle">Defences are habits: update, verify before you tap, install from official stores, back up away from the device.</text><text class="small" x="390" y="420" text-anchor="middle">Protecting the CIA triad: confidentiality, integrity, availability.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
