<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six footprint traces sorted into active and passive</title><desc id="d">Table of six footprint traces sorted into active and passive, each with who can see it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .cellhdr{fill:var(--panel)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.25} .frame{stroke:var(--ink);stroke-width:2;fill:none} .wm{fill:var(--wm);font-size:11px} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="44" text-anchor="middle" font-size="16">Six traces: active or passive?</text><rect class="cellhdr" x="16" y="64" width="748" height="42"/><line class="grid" x1="266" y1="64" x2="266" y2="414"/><line class="grid" x1="416" y1="64" x2="416" y2="414"/><line class="grid" x1="16" y1="106" x2="764" y2="106"/><line class="grid" x1="16" y1="163" x2="764" y2="163"/><line class="grid" x1="16" y1="220" x2="764" y2="220"/><line class="grid" x1="16" y1="277" x2="764" y2="277"/><line class="grid" x1="16" y1="334" x2="764" y2="334"/><line class="grid" x1="16" y1="391" x2="764" y2="391"/><rect class="frame" x="16" y="64" width="748" height="350"/><text class="h" x="141" y="91" text-anchor="middle">Trace</text><text class="h" x="341" y="91" text-anchor="middle">Active or passive</text><text class="h" x="590" y="91" text-anchor="middle">Who can see it</text><text class="body" x="28" y="140" font-weight="600">a photo you post</text><text class="body" x="278" y="140">active</text><text class="body" x="428" y="133">anyone, depending on</text><text class="body" x="428" y="149">privacy settings</text><text class="body" x="28" y="197" font-weight="600">a comment you write</text><text class="body" x="278" y="197">active</text><text class="body" x="428" y="190">the platform and</text><text class="body" x="428" y="206">its readers</text><text class="body" x="28" y="254" font-weight="600">your profile details</text><text class="body" x="278" y="254">active</text><text class="body" x="428" y="247">the platform and</text><text class="body" x="428" y="263">often advertisers</text><text class="body" x="28" y="311" font-weight="600">your search history</text><text class="body" x="278" y="311">passive</text><text class="body" x="428" y="311">the search engine and sites you visit</text><text class="body" x="28" y="368" font-weight="600">your location data</text><text class="body" x="278" y="368">passive</text><text class="body" x="428" y="368">apps and their partners</text><text class="body" x="28" y="412" font-weight="600">contacts uploaded by an app</text><text class="body" x="278" y="412">passive</text><text class="body" x="428" y="412">the app and whoever it shares with</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
