<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">رکاوٹیں اور انہیں توڑنے والے سوالات</title><desc id="d">جدول جس میں ہر رکاوٹ، اسے ظاہر کرنے والا جماعتی جملہ، اور اسے روکنے والا ایک سوال درج ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} text{font-size:11px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="630" y="16" width="134" height="50" fill="var(--a1-fill)"/><rect x="330" y="16" width="300" height="50" fill="var(--a1-fill)"/><rect x="16" y="16" width="314" height="50" fill="var(--a1-fill)"/><text class="h" x="697" y="46" text-anchor="middle">رکاوٹ</text><text class="h" x="480" y="46" text-anchor="middle">جملہ جس سے ظاہر ہوتی ہے</text><text class="h" x="173" y="46" text-anchor="middle">ایک سوال جو اسے روکتا ہے</text><line x1="16" y1="66" x2="764" y2="66" stroke="var(--ink)" stroke-width="2"/><line x1="630" y1="16" x2="630" y2="454" stroke="var(--ink)" stroke-width="1.5"/><line x1="330" y1="16" x2="330" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="697" y="103" text-anchor="middle">خود مرکزیت</text><text x="615" y="95" text-anchor="end">"مجھے اسی طرح پڑھایا گیا اور میں ٹھیک رہا،</text><text x="615" y="113" text-anchor="end">تو یہ طریقہ درست ہے"</text><text x="315" y="95" text-anchor="end">"کیا یہ بات ایسے استاد کو قائل کرے گی</text><text x="315" y="113" text-anchor="end">جس کے نتائج مختلف ہیں؟"</text><line x1="16" y1="128" x2="764" y2="128" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="166" text-anchor="middle">خود تصدیقی تلاش</text><text x="615" y="157" text-anchor="end">"میں صرف ان طلبہ کو دیکھتا ہوں جو</text><text x="615" y="175" text-anchor="end">میری بات ثابت کرتے ہیں"</text><text x="315" y="157" text-anchor="end">"ایسا طالب علم کیسا نظر آئے گا</text><text x="315" y="175" text-anchor="end">جو اس سے اختلاف کرتا ہو؟"</text><line x1="16" y1="193" x2="764" y2="193" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="231" text-anchor="middle">گروہی مطابقت</text><text x="615" y="222" text-anchor="end">"میں خاموش رہا کیونکہ باقی تمام</text><text x="615" y="240" text-anchor="end">لوگ متفق تھے"</text><text x="315" y="222" text-anchor="end">"اگر کسی اور نے ابھی تک بات نہ کی ہوتی</text><text x="315" y="240" text-anchor="end">تو آپ اس بارے میں کیا کہتے؟"</text><line x1="16" y1="258" x2="764" y2="258" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="296" text-anchor="middle">خواہش پر مبنی سوچ</text><text x="615" y="287" text-anchor="end">"اگر میں کم ہوم ورک دوں تو بھی</text><text x="615" y="305" text-anchor="end">نتائج پہلے جیسے ہی رہیں گے"</text><text x="315" y="287" text-anchor="end">"کون سے شواہد آپ کو اپنی رائے</text><text x="315" y="305" text-anchor="end">تبدیل کرنے پر آمادہ کریں گے؟"</text><line x1="16" y1="323" x2="764" y2="323" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="361" text-anchor="middle">غیر جانچا گیا مفروضہ</text><text x="615" y="352" text-anchor="end">"یہ طلبہ گروہی کام نہیں</text><text x="615" y="370" text-anchor="end">سنبھال سکتے"</text><text x="315" y="352" text-anchor="end">"آپ ان کی تیاری کے بارے میں</text><text x="315" y="370" text-anchor="end">کیا فرض کر رہے ہیں؟"</text><line x1="16" y1="388" x2="764" y2="388" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="426" text-anchor="middle">معاشرتی مرکزیت</text><text x="615" y="417" text-anchor="end">"ہم نے اس اسکول میں ہمیشہ</text><text x="615" y="435" text-anchor="end">اسی طرح کیا ہے"</text><text x="315" y="417" text-anchor="end">"کون سی دلیل تب بھی درست رہے گی</text><text x="315" y="435" text-anchor="end">اگر کسی نے پہلے ایسا نہ کیا ہو؟"</text><rect x="16" y="66" width="748" height="388" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>