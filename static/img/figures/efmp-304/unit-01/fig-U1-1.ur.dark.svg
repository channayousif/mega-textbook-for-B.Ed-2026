<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">سوچ اور اس کے افعال</title><desc id="d">ایک تصوراتی خاکہ جس کے مرکز میں 'سوچ' اور اس سے نکلنے والے ذہنی افعال دکھائے گئے ہیں، اور تنقیدی سوچ کو دیگر تمام افعال کی جانچ کرنے والی شاخ کے طور پر دکھایا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted);text-anchor:middle} .ah{fill:var(--ink)} .eval{stroke:var(--a3);stroke-width:3;fill:none}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="are" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--a3)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="92" ry="48" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h" x="390" y="230">سوچ</text><text class="m" x="390" y="252">ذہنی افعال</text><rect class="panel" x="600" y="40" width="150" height="60" rx="6"/><text class="h" x="675" y="76">یاد رکھنا</text><rect class="panel" x="30" y="40" width="150" height="60" rx="6"/><text class="h" x="105" y="76">تصور کرنا</text><rect class="panel" x="600" y="370" width="150" height="60" rx="6"/><text class="h" x="675" y="406">یقین کرنا</text><rect class="panel" x="30" y="370" width="150" height="60" rx="6"/><text class="h" x="105" y="406">فیصلہ کرنا</text><rect class="panel" x="315" y="410" width="150" height="50" rx="6"/><text class="h" x="390" y="440">استدلال کرنا</text><line class="link" x1="475" y1="195" x2="615" y2="95" marker-end="url(#ar)"/><line class="link" x1="305" y1="195" x2="165" y2="95" marker-end="url(#ar)"/><line class="link" x1="475" y1="275" x2="615" y2="375" marker-end="url(#ar)"/><line class="link" x1="305" y1="275" x2="165" y2="375" marker-end="url(#ar)"/><line class="link" x1="390" y1="285" x2="390" y2="405" marker-end="url(#ar)"/><rect x="280" y="95" width="220" height="56" rx="28" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2.5"/><text class="h" x="390" y="120" fill="var(--a3)">تنقیدی سوچ</text><text class="m" x="390" y="140" fill="var(--a3)">دوسروں کی جانچ کرتی ہے</text><line class="eval" x1="390" y1="151" x2="390" y2="185" marker-end="url(#are)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>