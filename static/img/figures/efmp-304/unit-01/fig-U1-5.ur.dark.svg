<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تنقیدی سوچ میں رکاوٹیں</title><desc id="d">ایک تصوراتی خاکہ جس کے مرکز میں 'تنقیدی سوچ میں رکاوٹیں' ہیں، جن کے چار مآخذ اور ہر ایک کی دو دو مثالیں شاخوں کی صورت میں دکھائی گئی ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted);text-anchor:middle} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="95" ry="50" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="3"/><text class="h" x="390" y="230" fill="var(--a3)">تنقیدی سوچ میں</text><text class="h" x="390" y="252" fill="var(--a3)">رکاوٹیں</text><rect class="panel" x="550" y="30" width="200" height="90" rx="6"/><text class="h" x="650" y="55">ذات سے</text><text x="650" y="80">خود مرکزیت: میری رائے ہی فطری ہے</text><text class="m" x="650" y="102">خود تصدیقی تلاش</text><rect class="panel" x="30" y="30" width="200" height="90" rx="6"/><text class="h" x="130" y="55">گروہ سے</text><text x="130" y="80">گروہی مطابقت: سب کے ساتھ چلنا</text><text class="m" x="130" y="102">خاموشی زیادہ محفوظ لگتی ہے</text><rect class="panel" x="550" y="340" width="200" height="90" rx="6"/><text class="h" x="650" y="365">خواہش سے</text><text x="650" y="390">خواہش پر مبنی سوچ: جو چاہیں مان لیں</text><text class="m" x="650" y="412">اس سے کام آسان محسوس ہوتا ہے</text><rect class="panel" x="30" y="340" width="200" height="90" rx="6"/><text class="h" x="130" y="365">مفروضے سے</text><text x="130" y="390">غیر جانچے گئے مفروضات</text><text class="m" x="130" y="412">دلیل ان کہی بات پر قائم ہوتی ہے</text><line class="link" x1="470" y1="195" x2="560" y2="125" marker-end="url(#ar)"/><line class="link" x1="310" y1="195" x2="220" y2="125" marker-end="url(#ar)"/><line class="link" x1="470" y1="275" x2="560" y2="345" marker-end="url(#ar)"/><line class="link" x1="310" y1="275" x2="220" y2="345" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>