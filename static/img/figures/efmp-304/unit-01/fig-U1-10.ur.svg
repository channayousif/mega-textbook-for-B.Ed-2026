<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استاد بطور تنقیدی مفکر</title><desc id="d">ایک خاکہ جس میں ورکشاپ، درسی کتاب اور ساتھی استاد سے موصول ہونے والے دعوے کو ایک ہی تنقیدی جانچ سے گزارتے ہوئے دکھایا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .c{text-anchor:middle}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="560" y="30" width="190" height="70" rx="6"/><text class="h c" x="655" y="55">ورکشاپ</text><text class="m c" x="655" y="80">"نتائج میں ۳۰ فیصد اضافہ"</text><rect class="panel" x="560" y="140" width="190" height="70" rx="6"/><text class="h c" x="655" y="165">درسی کتاب</text><text class="m c" x="655" y="190">"بچے خود دریافت کر کے سیکھتے ہیں"</text><rect class="panel" x="560" y="250" width="190" height="70" rx="6"/><text class="h c" x="655" y="275">ساتھی استاد</text><text class="m c" x="655" y="300">"یہ طریقہ میری کلاس میں خوب چلا"</text><line class="link" x1="560" y1="65" x2="495" y2="155" marker-end="url(#ar)"/><line class="link" x1="560" y1="175" x2="495" y2="175" marker-end="url(#ar)"/><line class="link" x1="560" y1="285" x2="495" y2="195" marker-end="url(#ar)"/><rect class="panel" x="280" y="105" width="210" height="140" rx="8" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2.5"/><text class="h c" x="385" y="135" fill="var(--a1)">وہی ایک تنقیدی جانچ</text><text class="c" x="385" y="165">کیا یہ واضح ہے؟ کیا یہ درست ہے؟</text><text class="c" x="385" y="190">کیا یہ میرے طلبہ سے متعلق ہے؟</text><text class="m c" x="385" y="215">کیا شواہد پرکھ پر پورا اترتے ہیں؟</text><line class="link" x1="280" y1="145" x2="215" y2="90" marker-end="url(#ar)"/><text class="c" x="245" y="105" font-weight="700" fill="var(--a1)">کامیاب</text><rect class="panel" x="25" y="45" width="190" height="85" rx="6" fill="var(--a1-fill)"/><text class="h c" x="120" y="75">اپنا لیجیے</text><text class="m c" x="120" y="98">شواہد پورے اترتے ہیں اور</text><text class="m c" x="120" y="116">میری کلاس کے موافق ہیں</text><line class="link" x1="280" y1="205" x2="215" y2="260" marker-end="url(#ar)"/><text class="c" x="245" y="245" font-weight="700" fill="var(--a3)">ناکام</text><rect class="panel" x="25" y="225" width="190" height="85" rx="6" fill="var(--a3-fill)"/><text class="h c" x="120" y="255">ترمیم کیجیے یا چھوڑ دیجیے</text><text class="m c" x="120" y="278">شواہد کمزور، مبہم یا</text><text class="m c" x="120" y="296">غیر متعلق ہیں</text><rect class="panel" x="150" y="375" width="480" height="45" rx="6" fill="var(--panel)"/><text class="h c" x="390" y="403">ذریعہ فیصلہ نہیں کرتا - شواہد فیصلہ کرتے ہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>