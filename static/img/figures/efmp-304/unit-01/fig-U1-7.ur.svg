<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فیصلہ سازی کا راستہ: دلیل ہے یا نہیں؟</title><desc id="d">ایک فلو چارٹ جو فیصلہ سازی کا راستہ دکھاتا ہے جس سے کسی استدلال کو دلیل، محض دعوی یا وضاحت کے طور پر درجہ بند کیا جاتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .c{text-anchor:middle} .badge{font-size:11px;font-weight:700;fill:var(--a3)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="590" y="30" width="160" height="60" rx="6" fill="var(--a1-fill)"/><text class="h c" x="670" y="65">ایک متن لیجیے</text><line class="link" x1="590" y1="60" x2="550" y2="60" marker-end="url(#ar)"/><rect class="panel" x="370" y="25" width="180" height="70" rx="6"/><text class="c" x="460" y="52">کیا یہ کسی بات کے سچ</text><text class="c" x="460" y="74">ہونے کا دعوی کرتا ہے؟</text><line class="link" x1="460" y1="95" x2="460" y2="155" marker-end="url(#ar)"/><text class="badge c" x="475" y="130">نہیں</text><rect class="panel" x="370" y="160" width="180" height="65" rx="6" fill="var(--a3-fill)"/><text class="h c" x="460" y="185">بیان نہیں ہے</text><text class="m c" x="460" y="207">(جیسے سوال یا حکم)</text><line class="link" x1="370" y1="60" x2="330" y2="60" marker-end="url(#ar)"/><text class="badge c" x="350" y="50">ہاں</text><rect class="panel" x="150" y="25" width="180" height="70" rx="6"/><text class="c" x="240" y="52">کیا اس کی کوئی</text><text class="c" x="240" y="74">وجہ دی گئی ہے؟</text><line class="link" x1="240" y1="95" x2="240" y2="155" marker-end="url(#ar)"/><text class="badge c" x="255" y="130">نہیں</text><rect class="panel" x="150" y="160" width="180" height="65" rx="6" fill="var(--a3-fill)"/><text class="h c" x="240" y="185">محض دعوی</text><text class="m c" x="240" y="207">(صرف دعوی، بغیر وجہ کے)</text><line class="link" x1="150" y1="60" x2="60" y2="60" marker-end="url(#ar)"/><text class="badge c" x="105" y="50">ہاں</text><line class="link" x1="60" y1="60" x2="60" y2="280"/><line class="link" x1="60" y1="280" x2="470" y2="280"/><line class="link" x1="470" y1="280" x2="470" y2="310" marker-end="url(#ar)"/><rect class="panel" x="370" y="315" width="200" height="75" rx="6"/><text class="c" x="470" y="342">کیا وجہ اس دعوے کی</text><text class="c" x="470" y="364">تائید کے لیے دی گئی ہے؟</text><line class="link" x1="370" y1="352" x2="290" y2="352" marker-end="url(#ar)"/><text class="badge c" x="330" y="342">نہیں</text><rect class="panel" x="110" y="320" width="180" height="65" rx="6" fill="var(--a3-fill)"/><text class="h c" x="200" y="345">وضاحت</text><text class="m c" x="200" y="367">(وجہ صرف یہ بتاتی ہے کہ کیسے ہوا)</text><line class="link" x1="470" y1="390" x2="470" y2="415" marker-end="url(#ar)"/><text class="badge c" x="490" y="405">ہاں</text><rect class="panel" x="350" y="415" width="240" height="50" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2.5"/><text class="h c" x="470" y="438" fill="var(--a1)">دلیل (ARGUMENT)</text><text class="m c" x="470" y="455">(دعوی + تائید کرنے والی وجہ)</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>