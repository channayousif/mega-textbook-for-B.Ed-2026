<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تنقیدی سوچ کے حامل شخص کی خصوصیات</title><desc id="d">جدول جس میں تنقیدی سوچ کے حامل شخص کی ہر خصوصیت کا اس کے الٹ کے ساتھ تقابل کیا گیا ہے، اور ہر ایک کے لیے جماعت کی ایک سطر کی نشانی دی گئی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} text{font-size:10.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="590" y="16" width="174" height="45" fill="var(--a1-fill)"/><rect x="290" y="16" width="300" height="45" fill="var(--a1-fill)"/><rect x="16" y="16" width="274" height="45" fill="var(--a1-fill)"/><text class="h" x="677" y="43" text-anchor="middle">تنقیدی سوچ کا حامل شخص</text><text class="h" x="440" y="43" text-anchor="middle">جماعت میں یہ کیسا نظر آتا ہے</text><text class="h" x="153" y="43" text-anchor="middle">اس کے برعکس رویہ</text><line x1="16" y1="61" x2="764" y2="61" stroke="var(--ink)" stroke-width="2"/><line x1="590" y1="16" x2="590" y2="454" stroke="var(--ink)" stroke-width="1.5"/><line x1="290" y1="16" x2="290" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="677" y="93" text-anchor="middle">شواہد کے لیے آمادہ</text><text x="575" y="86" text-anchor="end">"اعداد و شمار بتاتے ہیں طریقہ کام نہیں کر رہا،</text><text x="575" y="103" text-anchor="end">اس لیے میں اسے تبدیل کروں گا"</text><text x="275" y="86" text-anchor="end">"میں نے ہمیشہ اسی طرح کیا ہے،</text><text x="275" y="103" text-anchor="end">اس لیے یہ درست ہی ہوگا"</text><line x1="16" y1="124" x2="764" y2="124" stroke="var(--ink)" stroke-width="1"/><text class="h" x="677" y="157" text-anchor="middle">مخالف آراء میں منصفانہ</text><text x="575" y="150" text-anchor="end">"مجھے پہلے دوسرے فریق کا سب سے</text><text x="575" y="167" text-anchor="end">مضبوط موقف سننے دیں"</text><text x="275" y="150" text-anchor="end">"میں صرف ان لوگوں کی سنتا ہوں جو</text><text x="275" y="167" text-anchor="end">پہلے ہی مجھ سے متفق ہیں"</text><line x1="16" y1="188" x2="764" y2="188" stroke="var(--ink)" stroke-width="1"/><text class="h" x="677" y="221" text-anchor="middle">دعووں میں واضح و معین</text><text x="575" y="214" text-anchor="end">"ایک مدت میں اوقاف کی غلطیاں</text><text x="575" y="231" text-anchor="end">ایک چوتھائی کم ہو گئیں"</text><text x="275" y="214" text-anchor="end">"اگلے سال نتائج میں</text><text x="275" y="231" text-anchor="end">بہتری آ جائے گی"</text><line x1="16" y1="252" x2="764" y2="252" stroke="var(--ink)" stroke-width="1"/><text class="h" x="677" y="285" text-anchor="middle">لاعلمی کا اعتراف</text><text x="575" y="278" text-anchor="end">"میرے پاس کوئی ثبوت نہیں - آئیے</text><text x="575" y="295" text-anchor="end">فیصلہ کرنے سے پہلے دیکھ لیتے ہیں"</text><text x="275" y="278" text-anchor="end">"مجھے یقین ہے میں ٹھیک ہوں،</text><text x="275" y="295" text-anchor="end">چاہے میں نے جانچا نہ ہو"</text><line x1="16" y1="316" x2="764" y2="316" stroke="var(--ink)" stroke-width="1"/><text class="h" x="677" y="349" text-anchor="middle">فیصلے سے پہلے سوالات</text><text x="575" y="342" text-anchor="end">"اس کے شواہد کیا ہیں اور کیا یہ</text><text x="575" y="359" text-anchor="end">میرے طلبہ کے لیے موزوں ہے؟"</text><text x="275" y="342" text-anchor="end">"میں اسے اپنا لوں گا کیونکہ</text><text x="275" y="359" text-anchor="end">مقرر پر اعتماد لگ رہا تھا"</text><line x1="16" y1="380" x2="764" y2="380" stroke="var(--ink)" stroke-width="1"/><text class="h" x="677" y="413" text-anchor="middle">نئے حقائق پر نظرثانی</text><text x="575" y="406" text-anchor="end">"نئی تشخیص نے میری سابقہ</text><text x="575" y="423" text-anchor="end">سمجھ کو بدل دیا ہے"</text><text x="275" y="406" text-anchor="end">"میں ہر اس بات کو رد کرتا ہوں جو</text><text x="275" y="423" text-anchor="end">میری رائے سے میل نہیں کھاتی"</text><rect x="16" y="61" width="748" height="393" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>