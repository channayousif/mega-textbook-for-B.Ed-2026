<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Critical thinking is and is not</title><desc id="d">Table comparing what critical thinking is and what it is not across four rows, using short plain phrases.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="16" y="16" width="748" height="438" fill="none" stroke="var(--ink)" stroke-width="2"/><line x1="16" y1="76" x2="764" y2="76" stroke="var(--ink)" stroke-width="2"/><line x1="170" y1="16" x2="170" y2="454" stroke="var(--ink)" stroke-width="2"/><line x1="470" y1="16" x2="470" y2="454" stroke="var(--ink)" stroke-width="2"/><text class="h" x="320" y="52" text-anchor="middle">Critical thinking IS</text><text class="h" x="617" y="52" text-anchor="middle">Critical thinking is NOT</text><line x1="16" y1="146" x2="764" y2="146" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="93" y="116" text-anchor="middle">what it does</text><text x="320" y="110" text-anchor="middle">judges reasoning against</text><text x="320" y="130" text-anchor="middle">clear standards</text><text x="617" y="120" text-anchor="middle">finding fault with people</text><line x1="16" y1="216" x2="764" y2="216" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="93" y="186" text-anchor="middle">how it decides</text><text x="320" y="180" text-anchor="middle">applies clarity, accuracy,</text><text x="320" y="200" text-anchor="middle">relevance, depth, logic</text><text x="617" y="190" text-anchor="middle">doubting everything</text><line x1="16" y1="286" x2="764" y2="286" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="93" y="256" text-anchor="middle">who it is</text><text x="320" y="250" text-anchor="middle">a skill that can</text><text x="320" y="270" text-anchor="middle">be trained</text><text x="617" y="260" text-anchor="middle">a fixed personality trait</text><line x1="16" y1="356" x2="764" y2="356" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="93" y="326" text-anchor="middle">classroom marker</text><text x="320" y="320" text-anchor="middle">"what is the evidence,</text><text x="320" y="340" text-anchor="middle">and does it support that?"</text><line x1="16" y1="426" x2="764" y2="426" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="93" y="396" text-anchor="middle">a hook</text><text x="320" y="390" text-anchor="middle">short opening question</text><text x="320" y="410" text-anchor="middle">sets up the topic</text><text x="617" y="400" text-anchor="middle">a long reading list</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>