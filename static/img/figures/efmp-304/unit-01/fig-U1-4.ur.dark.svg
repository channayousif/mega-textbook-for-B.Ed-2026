<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عادت کے تحت فیصلہ بمقابلہ معیارات کے تحت فیصلہ</title><desc id="d">ایک خاکہ جس میں تدریسی فیصلہ دو بار دکھایا گیا ہے: ایک بار عادت کے تحت اور دوسری بار معیارات کے مطابق، اور دونوں نتائج آمنے سامنے ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:13.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .c{text-anchor:middle}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="410" y="20" width="340" height="42" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h c" x="580" y="47" fill="var(--a3)">عادت کے تحت فیصلہ</text><rect class="panel" x="30" y="20" width="340" height="42" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="200" y="47" fill="var(--a1)">معیارات پر پرکھ کر فیصلہ</text><rect class="panel" x="430" y="85" width="300" height="85" rx="6"/><text class="h c" x="580" y="110">۱. دعوی سننا</text><text class="c" x="580" y="132">"سرگرمی پر مبنی تعلم بہتر ہے"</text><text class="m c" x="580" y="152">قبول کرنا کیونکہ سننے میں اچھا لگا</text><rect class="panel" x="50" y="85" width="300" height="85" rx="6"/><text class="h c" x="200" y="110">۱. دعوی سننا</text><text class="c" x="200" y="132">"سرگرمی پر مبنی تعلم بہتر ہے"</text><text class="m c" x="200" y="152">پوچھنا: اس کے شواہد کیا ہیں؟</text><line class="link" x1="580" y1="170" x2="580" y2="195" marker-end="url(#ar)"/><line class="link" x1="200" y1="170" x2="200" y2="195" marker-end="url(#ar)"/><rect class="panel" x="430" y="200" width="300" height="85" rx="6"/><text class="h c" x="580" y="225">۲. فوراً فیصلہ کرنا</text><text class="c" x="580" y="247">اختیار کرنا کیونکہ بولنے والا پر اعتماد تھا</text><text class="m c" x="580" y="267">کوئی مزید جانچ نہیں</text><rect class="panel" x="50" y="200" width="300" height="85" rx="6"/><text class="h c" x="200" y="225">۲. معیارات پر پرکھنا</text><text class="c" x="200" y="247">کیا یہ واضح، درست اور متعلق ہے؟</text><text class="m c" x="200" y="267">فیصلے سے پہلے ثبوت کی جانچ</text><line class="link" x1="580" y1="285" x2="580" y2="310" marker-end="url(#ar)"/><line class="link" x1="200" y1="285" x2="200" y2="310" marker-end="url(#ar)"/><rect class="panel" x="430" y="315" width="300" height="100" rx="6" fill="var(--a3-fill)"/><text class="h c" x="580" y="342">۳. نتیجہ</text><text class="c" x="580" y="367">مصروف کلاس، برائے نام سیکھنا -</text><text class="m c" x="580" y="392">دعوی مبہم اور غیر مصدقہ تھا</text><rect class="panel" x="50" y="315" width="300" height="100" rx="6" fill="var(--a1-fill)"/><text class="h c" x="200" y="342">۳. نتیجہ</text><text class="c" x="200" y="367">صرف تب اپنانا جب شواہد درست ہوں،</text><text class="m c" x="200" y="392">اور اپنی کلاس کے مطابق ڈھالنا</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>