<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تنقیدی سوچ کے معیارات</title><desc id="d">جدول جس میں تنقیدی سوچ کے آٹھوں معیارات، ایک ناکام مثال، اور اسی دعوے کی کامیاب نئی صورت پیش کی گئی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} text{font-size:11px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="654" y="16" width="110" height="50" fill="var(--a1-fill)"/><rect x="344" y="16" width="310" height="50" fill="var(--a1-fill)"/><rect x="16" y="16" width="328" height="50" fill="var(--a1-fill)"/><text class="h" x="709" y="40" text-anchor="middle">معیار</text><text class="h" x="499" y="32" text-anchor="middle">ناکام مثال</text><text class="m" x="499" y="50" text-anchor="middle">(دعوی جو پورا نہیں اترتا)</text><text class="h" x="180" y="32" text-anchor="middle">کامیاب نئی صورت</text><text class="m" x="180" y="50" text-anchor="middle">(اسی دعوے کی اصلاح)</text><line x1="16" y1="66" x2="764" y2="66" stroke="var(--ink)" stroke-width="2"/><line x1="654" y1="16" x2="654" y2="454" stroke="var(--ink)" stroke-width="1.5"/><line x1="344" y1="16" x2="344" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="709" y="98" text-anchor="middle">واضح</text><text x="640" y="98" text-anchor="end">"یہ کلاس الفاظ والے سوالات حل نہیں کر سکتی"</text><text x="330" y="90" text-anchor="end">"آدھی سے کم کلاس دو مرحلوں والے</text><text x="330" y="106" text-anchor="end">الفاظ کے سوالات حل کر سکتی ہے"</text><line x1="16" y1="116" x2="764" y2="116" stroke="var(--ink)" stroke-width="1"/><text class="h" x="709" y="146" text-anchor="middle">درست</text><text x="640" y="146" text-anchor="end">"نتائج بہتر ہو جائیں گے"</text><text x="330" y="138" text-anchor="end">"ایک ہی مدت میں اوقاف کی غلطیاں</text><text x="330" y="154" text-anchor="end">ایک چوتھائی کم ہو گئیں"</text><line x1="16" y1="165" x2="764" y2="165" stroke="var(--ink)" stroke-width="1"/><text class="h" x="709" y="195" text-anchor="middle">معین</text><text x="640" y="195" text-anchor="end">"انہیں بہتر پڑھائیں"</text><text x="330" y="187" text-anchor="end">"لکھائی کے ہر سبق کے آغاز پر پانچ منٹ کا</text><text x="330" y="203" text-anchor="end">اغلاط کی جانچ کا وقفہ رکھیں"</text><line x1="16" y1="214" x2="764" y2="214" stroke="var(--ink)" stroke-width="1"/><text class="h" x="709" y="244" text-anchor="middle">متعلقہ</text><text x="640" y="244" text-anchor="end">"ناشتہ کرنے والے بچے اچھا پڑھتے ہیں"</text><text x="330" y="236" text-anchor="end">"مشکل کی اصل وجہ کسروں کے فہم کی</text><text x="330" y="252" text-anchor="end">کمی ہے، نہ کہ ناشتہ"</text><line x1="16" y1="262" x2="764" y2="262" stroke="var(--ink)" stroke-width="1"/><text class="h" x="709" y="292" text-anchor="middle">گہرا</text><text x="640" y="292" text-anchor="end">"وہ اس لیے ناکام ہوئے کہ دہرائی نہیں کی"</text><text x="330" y="284" text-anchor="end">"وہ ناکام ہوئے کیونکہ تدریس نے سابقہ</text><text x="330" y="300" text-anchor="end">علم کو فرض کیا جو ان کے پاس نہ تھا"</text><line x1="16" y1="311" x2="764" y2="311" stroke="var(--ink)" stroke-width="1"/><text class="h" x="709" y="341" text-anchor="middle">منطقی</text><text x="640" y="333" text-anchor="end">"وہ اچھی استانی ہیں، اس لیے ان کے</text><text x="640" y="349" text-anchor="end">نتائج اچھے ہی ہوں گے"</text><text x="330" y="333" text-anchor="end">"نتائج اچھے ہیں، اور ایک ممکنہ وجہ ان کی</text><text x="330" y="349" text-anchor="end">واضح اور آسان وضاحتیں ہیں"</text><line x1="16" y1="360" x2="764" y2="360" stroke="var(--ink)" stroke-width="1"/><text class="h" x="709" y="390" text-anchor="middle">منصفانہ</text><text x="640" y="390" text-anchor="end">"گروہی کام یہاں کبھی کامیاب نہیں ہوتا"</text><text x="330" y="382" text-anchor="end">"میری کلاس میں گروہی کام ڈھانچہ نہ دینے</text><text x="330" y="398" text-anchor="end">سے ناکام ہوا - میں دوبارہ کوشش کروں گی"</text><line x1="16" y1="408" x2="764" y2="408" stroke="var(--ink)" stroke-width="1"/><text class="h" x="709" y="438" text-anchor="middle">وسیع</text><text x="640" y="438" text-anchor="end">"واحد طریقہ براہِ راست تدریس ہے"</text><text x="330" y="430" text-anchor="end">"براہِ راست تدریس مفید ہے؛ لیکن مجھے</text><text x="330" y="446" text-anchor="end">رہنمائی والی تحقیقی سرگرمی بھی آزمانے دیں"</text><rect x="16" y="66" width="748" height="388" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>