<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تنقیدی سوچ: کیا ہے اور کیا نہیں</title><desc id="d">چار قطاروں پر مشتمل جدول جس میں مختصر اور سادہ جملوں میں واضح کیا گیا ہے کہ تنقیدی سوچ کیا ہے اور کیا نہیں ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="16" y="16" width="748" height="438" fill="none" stroke="var(--ink)" stroke-width="2"/><line x1="16" y1="76" x2="764" y2="76" stroke="var(--ink)" stroke-width="2"/><line x1="390" y1="16" x2="390" y2="454" stroke="var(--ink)" stroke-width="2"/><text class="h" x="577" y="52" text-anchor="middle" fill="var(--a1)">تنقیدی سوچ یہ ہے</text><text class="h" x="203" y="52" text-anchor="middle" fill="var(--a3)">تنقیدی سوچ یہ نہیں ہے</text><line x1="16" y1="165" x2="764" y2="165" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="577" y="112" text-anchor="middle">واضح معیارات کے مطابق</text><text class="h" x="577" y="138" text-anchor="middle">استدلال کو پرکھنا</text><text x="203" y="125" text-anchor="middle">لوگوں میں کیڑے نکالنا</text><line x1="16" y1="260" x2="764" y2="260" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="577" y="202" text-anchor="middle">ایسی مہارت جسے</text><text class="h" x="577" y="228" text-anchor="middle">سکھایا اور سیکھا جا سکتا ہے</text><text x="203" y="215" text-anchor="middle">ایک پیدائشی یا جامد ذاتی وصف</text><line x1="16" y1="355" x2="764" y2="355" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="577" y="297" text-anchor="middle">وضاحت، صحت، مطابقت،</text><text class="h" x="577" y="323" text-anchor="middle">گہرائی اور منطق کی جانچ</text><text x="203" y="310" text-anchor="middle">ہر بات پر بلاوجہ شک کرنا</text><text class="h" x="577" y="392" text-anchor="middle">"شواہد کیا ہیں، اور کیا وہ</text><text class="h" x="577" y="418" text-anchor="middle">اس کی تائید کرتے ہیں؟"</text><text x="203" y="405" text-anchor="middle">صرف مطالعے کی لمبی فہرست</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>