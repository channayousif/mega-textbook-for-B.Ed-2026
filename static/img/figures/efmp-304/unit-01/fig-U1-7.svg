<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Is this an argument? decision path</title><desc id="d">A flowchart showing a decision path that classifies a piece of reasoning as an argument, a mere claim or an explanation.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:13px;font-weight:700} .m{font-size:12px;fill:var(--muted);text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .yes{fill:var(--a1)} .no{fill:var(--a3)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="250" y="16" width="280" height="60" rx="6"/><text class="h" x="390" y="50">Take a piece of text</text><polygon points="390,76 440,110 390,144 340,110" class="dia"/><text class="h" x="390" y="107">Does it assert</text><text class="h" x="390" y="123">something is true?</text><line x1="340" y1="110" x2="120" y2="110" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="no" x="230" y="98">no</text><rect x="20" y="150" width="200" height="60" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h" x="120" y="178" fill="var(--a3)">not a statement</text><text x="120" y="196">(a question, an order)</text><line x1="440" y1="110" x2="560" y2="110" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="yes" x="500" y="98">yes</text><polygon points="560,110 610,144 560,178 510,144" class="dia"/><text class="h" x="560" y="141">Is a reason</text><text class="h" x="560" y="157">given?</text><line x1="510" y1="144" x2="320" y2="290" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="no" x="390" y="210">no</text><rect x="220" y="290" width="200" height="60" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h" x="320" y="318" fill="var(--a2)">mere claim</text><text x="320" y="336">(assertion, no reason)</text><line x1="610" y1="144" x2="670" y2="144" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="yes" x="640" y="132">yes</text><polygon points="670,178 720,212 670,246 620,212" class="dia"/><text class="h" x="670" y="209">Is the reason meant</text><text class="h" x="670" y="225">to support it?</text><line x1="620" y1="212" x2="520" y2="300" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="no" x="560" y="270">no</text><rect x="420" y="300" width="200" height="60" rx="6" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h" x="520" y="328" fill="var(--a4)">explanation</text><text x="520" y="346">(reason only accounts</text><text x="520" y="362">for how it came to be)</text><line x1="720" y1="212" x2="720" y2="300" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="yes" x="740" y="260">yes</text><rect x="620" y="380" width="150" height="60" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="695" y="408" fill="var(--a1)">ARGUMENT</text><text x="695" y="426">(claim + supporting</text><text x="695" y="442">reason)</text><line x1="720" y1="360" x2="720" y2="378" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>