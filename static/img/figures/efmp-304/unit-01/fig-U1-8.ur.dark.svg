<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">استدلال کی اکائیوں کا تجزیہ</title><desc id="d">جدول جس میں ایک پیراگراف کا بیان، دعوی، مسئلہ اور دلیل میں تجزیہ کیا گیا ہے اور ہر سطر میں ہو بہو الفاظ درج ہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="630" y="16" width="134" height="60" fill="var(--a1-fill)"/><rect x="16" y="16" width="614" height="60" fill="var(--a1-fill)"/><text class="h" x="697" y="43" text-anchor="middle">استدلال کی</text><text class="h" x="697" y="61" text-anchor="middle">اکائی</text><text class="h" x="323" y="38" text-anchor="middle">پیراگراف کے اصل الفاظ</text><text class="m" x="323" y="58" text-anchor="middle">"ورکشاپ ٹرینرز کہتے ہیں کہ ان کا طریقہ نتائج میں ۳۰ فیصد اضافہ کرتا ہے، اس لیے ہر اسکول کو اسے اپنانا چاہیے۔"</text><line x1="16" y1="76" x2="764" y2="76" stroke="var(--ink)" stroke-width="2"/><line x1="630" y1="16" x2="630" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="697" y="125" text-anchor="middle">بیان</text><text x="610" y="115" text-anchor="end">پورا جملہ کسی بات کے سچ ہونے کا دعوی کرتا ہے:</text><text class="m" x="610" y="135" text-anchor="end">جی ہاں - یہ بتاتا ہے کہ معاملہ کیا ہے</text><line x1="16" y1="165" x2="764" y2="165" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="215" text-anchor="middle">دعوی</text><text x="610" y="205" text-anchor="end">"ان کا طریقہ نتائج میں ۳۰ فیصد اضافہ کرتا ہے"</text><text class="m" x="610" y="225" text-anchor="end">وہ دعوی جسے ثبوت کی ضرورت ہے</text><line x1="16" y1="260" x2="764" y2="260" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="310" text-anchor="middle">مسئلہ</text><text x="610" y="300" text-anchor="end">"کیا ہر اسکول کو اسے اپنانا چاہیے؟"</text><text class="m" x="610" y="320" text-anchor="end">ایک سوال جس پر لوگ معقول اختلاف کر سکتے ہیں</text><line x1="16" y1="355" x2="764" y2="355" stroke="var(--ink)" stroke-width="1"/><text class="h" x="697" y="405" text-anchor="middle">دلیل</text><text x="610" y="395" text-anchor="end">دعوے کو سہارا دینے کے لیے ایک وجہ پیش کی گئی ہے:</text><text class="m" x="610" y="415" text-anchor="end">جی ہاں - "نتائج میں اضافہ" کو اپنانے کی وجہ کے طور پر پیش کیا گیا ہے</text><rect x="16" y="76" width="748" height="378" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>