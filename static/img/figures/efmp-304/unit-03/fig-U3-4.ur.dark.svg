<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">صداقت والا نمونہ اور اس کا صداقت سے خالی جڑواں</title><desc id="d">صداقت والا ایک استنتاجی نمونہ، جسے پریمیسز، استنتاج کی لکیر اور نتیجے کی صورت میں دکھایا گیا ہے، اور اس کے ساتھ اس کا صداقت سے خالی جڑواں، جس میں واحد بدلا ہوا جزو نمایاں کیا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780"/>
   <rect class="bg" x="0" y="0" width="780" height="470"/>
   <rect x="410" y="30" width="340" height="160" rx="6" class="b1"/>
   <text class="sh" x="580" y="60" text-anchor="middle" direction="rtl">صداقت والی: اثباتی صورت</text>
   <text x="580" y="100" text-anchor="middle" direction="rtl">اگر استاد غیر حاضر ہو</text>
   <text x="580" y="120" text-anchor="middle" direction="rtl">تو پیریڈ خالی ہوتا ہے۔</text>
   <text x="580" y="150" text-anchor="middle" direction="rtl">استاد غیر حاضر ہے۔</text>
   <text x="580" y="175" text-anchor="middle" direction="rtl">لہٰذا پیریڈ خالی ہے۔</text>
   <rect x="30" y="30" width="340" height="160" rx="6" class="b3"/>
   <text class="sh" x="200" y="60" text-anchor="middle" direction="rtl">صداقت سے خالی: تالی کا اثبات</text>
   <text x="200" y="100" text-anchor="middle" direction="rtl">اگر استاد غیر حاضر ہو</text>
   <text x="200" y="120" text-anchor="middle" direction="rtl">تو پیریڈ خالی ہوتا ہے۔</text>
   <text x="200" y="150" text-anchor="middle" direction="rtl">پیریڈ خالی ہے۔</text>
   <text x="200" y="175" text-anchor="middle" direction="rtl">لہٰذا استاد غیر حاضر ہے۔</text>
   <rect x="30" y="230" width="720" height="60" rx="6" class="panel"/>
   <text class="m" x="390" y="263" text-anchor="middle" direction="rtl">واحد بدلا ہوا جزو دوسری پریمیس ہے: &quot;P&quot; کی جگہ &quot;Q&quot; آ جاتا ہے، اور ربط ٹوٹ جاتا ہے۔</text>
   <text class="wm" x="10" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>