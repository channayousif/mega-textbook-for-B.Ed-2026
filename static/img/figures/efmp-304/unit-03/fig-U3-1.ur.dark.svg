<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">استنتاجی بمقابلہ استقرائی</title><desc id="d">جدول جو استنتاجی اور استقرائی دلیلوں کا چار قطاروں میں موازنہ کرتا ہے: پریمیسز کیا کرنے کا دعوی کرتی ہیں، اچھی دلیل کس چیز کی ضمانت دیتی ہے، اس کی ناکامی کیسی دکھائی دیتی ہے، اور کون سی کسوٹی لاگو ہوتی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="820"/>
   <rect class="bg" x="0" y="0" width="820" height="470"/>
   <rect class="panel" x="16" y="16" width="788" height="44" rx="4"/>
   <text class="h" x="690" y="44" text-anchor="middle" direction="rtl">پہلو</text>
   <text class="h" x="416" y="44" text-anchor="middle" direction="rtl">استنتاجی دلیل</text>
   <text class="h" x="148" y="44" text-anchor="middle" direction="rtl">استقرائی دلیل</text>
   <text class="sh" x="690" y="104" text-anchor="middle" direction="rtl">پریمیسز کا دعوی</text>
   <text x="416" y="104" text-anchor="middle" direction="rtl">نتیجے کی ضمانت</text>
   <text x="148" y="104" text-anchor="middle" direction="rtl">نتیجے کو غالب بنانا</text>
   <text class="sh" x="690" y="188" text-anchor="middle" direction="rtl">اچھی دلیل کیا دیتی ہے</text>
   <text x="416" y="178" text-anchor="middle" direction="rtl">لزوم</text>
   <text class="m" x="416" y="202" text-anchor="middle" direction="rtl">(پریمیسز درست ہوں تو نتیجہ لازماً نکلتا ہے)</text>
   <text x="148" y="178" text-anchor="middle" direction="rtl">غالب امکان</text>
   <text class="m" x="148" y="202" text-anchor="middle" direction="rtl">(پریمیسز درست ہوں تو نتیجہ غالباً درست ہے)</text>
   <text class="sh" x="690" y="268" text-anchor="middle" direction="rtl">ناکامی کیسی دکھتی ہے</text>
   <text x="416" y="258" text-anchor="middle" direction="rtl">صداقت سے خالی</text>
   <text class="m" x="416" y="282" text-anchor="middle" direction="rtl">(ربط ٹوٹ جاتا ہے)</text>
   <text x="148" y="258" text-anchor="middle" direction="rtl">کمزور</text>
   <text class="m" x="148" y="282" text-anchor="middle" direction="rtl">(پریمیسز نتیجے کو سہارا نہیں دیتیں)</text>
   <text class="sh" x="690" y="350" text-anchor="middle" direction="rtl">لاگو ہونے والی کسوٹی</text>
   <text x="416" y="350" text-anchor="middle" direction="rtl">صداقت</text>
   <text x="148" y="350" text-anchor="middle" direction="rtl">مضبوطی</text>
   <text class="wm" x="10" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>