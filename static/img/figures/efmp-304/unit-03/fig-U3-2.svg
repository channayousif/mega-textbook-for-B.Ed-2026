<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Which kind of argument?</title><desc id="d">Flowchart for deciding whether an argument is deductive or inductive.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780"/><rect class="bg" x="0" y="0" width="780" height="520"/>
   <rect x="240" y="30" width="300" height="60" rx="6" class="panel"/>
   <text class="sh c" x="390" y="65">Start with the argument</text>
   <line class="line" x1="390" y1="90" x2="390" y2="130"/>
   <polygon points="385,130 395,130 390,140" fill="var(--ink)"/>
   <rect x="240" y="140" width="300" height="80" rx="6" fill="none" stroke="var(--line)" stroke-width="2"/>
   <text class="sh c" x="390" y="170">Do the premises claim</text>
   <text class="sh c" x="390" y="190">to GUARANTEE the conclusion?</text>
   <line class="line" x1="390" y1="220" x2="390" y2="260"/>
   <line class="line" x1="390" y1="220" x2="190" y2="260"/>
   <line class="line" x1="390" y1="220" x2="590" y2="260"/>
   <text class="sh" x="390" y="240">Yes</text>
   <text class="sh" x="590" y="240">No</text>
   <rect x="90" y="260" width="200" height="60" rx="6" class="b1"/>
   <text class="sh c" x="190" y="285">Deductive</text>
   <text class="m c" x="190" y="305">test: validity</text>
   <rect x="490" y="260" width="200" height="60" rx="6" class="b2"/>
   <text class="sh c" x="590" y="285">Inductive</text>
   <text class="m c" x="590" y="305">test: strength</text><text class="wm" x="770" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>