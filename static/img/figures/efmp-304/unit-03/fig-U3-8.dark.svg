<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Judging an argument</title><desc id="d">Flowchart for judging an argument: classify first, then apply the matching test.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="780"/><rect class="bg" x="0" y="0" width="780" height="520"/>
   <rect x="240" y="30" width="300" height="60" rx="6" class="panel"/>
   <text class="sh c" x="390" y="65">Take an argument</text>
   <line class="line" x1="390" y1="90" x2="390" y2="130"/>
   <rect x="240" y="130" width="300" height="60" rx="6" class="panel"/>
   <text class="sh c" x="390" y="165">Classify it</text>
   <line class="line" x1="390" y1="190" x2="390" y2="230"/>
   <line class="line" x1="390" y1="230" x2="190" y2="270"/>
   <line class="line" x1="390" y1="230" x2="590" y2="270"/>
   <rect x="90" y="270" width="200" height="60" rx="6" class="b1"/>
   <text class="sh c" x="190" y="295">Deductive</text>
   <text class="m c" x="190" y="315">check validity</text>
   <rect x="490" y="270" width="200" height="60" rx="6" class="b2"/>
   <text class="sh c" x="590" y="295">Inductive</text>
   <text class="m c" x="590" y="315">check strength</text>
   <line class="line" x1="190" y1="330" x2="190" y2="370"/>
   <line class="line" x1="590" y1="330" x2="590" y2="370"/>
   <rect x="90" y="370" width="200" height="60" rx="6" class="b3"/>
   <text class="sh c" x="190" y="395">Sound?</text>
   <text class="m c" x="190" y="415">valid + true premises</text>
   <rect x="490" y="370" width="200" height="60" rx="6" class="b4"/>
   <text class="sh c" x="590" y="395">Cogent?</text>
   <text class="m c" x="590" y="415">strong + true premises</text><text class="wm" x="770" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>