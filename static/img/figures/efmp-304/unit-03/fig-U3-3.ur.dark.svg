<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">استنتاجی نمونے</title><desc id="d">چار استنتاجی نمونوں کا جدول: زمرہ جاتی قیاس، اثباتی صورت (modus ponens)، نفی کی صورت (modus tollens) اور سلسلہ وار دلیل، ہر ایک کے ساتھ اسکول کی ایک مثال اور وہ ملتا جلتا مغالطہ جس سے اسے خلط ملط کیا جاتا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="880"/>
   <rect class="bg" x="0" y="0" width="880" height="520"/>
   <rect class="panel" x="16" y="16" width="848" height="44" rx="4"/>
   <text class="h" x="765" y="44" text-anchor="middle" direction="rtl">نمونہ</text>
   <text class="h" x="550" y="44" text-anchor="middle" direction="rtl">اسکول کی مثال</text>
   <text class="h" x="300" y="44" text-anchor="middle" direction="rtl">ملتا جلتا مغالطہ</text>
   <text class="sh" x="765" y="110" text-anchor="middle" direction="rtl">زمرہ جاتی قیاس</text>
   <text x="550" y="110" text-anchor="middle" direction="rtl">تمام الف، ب ہیں۔ ج، الف ہے۔ لہٰذا ج، ب ہے۔</text>
   <text x="300" y="110" text-anchor="middle" direction="rtl">حدِ اوسط میں تالی کا اثبات</text>
   <text class="sh" x="765" y="182" text-anchor="middle" direction="rtl">اثباتی صورت</text>
   <text class="m" x="765" y="204" text-anchor="middle" direction="rtl">(modus ponens)</text>
   <text x="550" y="190" text-anchor="middle" direction="rtl">اگر P تو Q۔ P۔ لہٰذا Q۔</text>
   <text x="300" y="190" text-anchor="middle" direction="rtl">تالی کا اثبات</text>
   <text class="sh" x="765" y="262" text-anchor="middle" direction="rtl">نفی کی صورت</text>
   <text class="m" x="765" y="284" text-anchor="middle" direction="rtl">(modus tollens)</text>
   <text x="550" y="270" text-anchor="middle" direction="rtl">اگر P تو Q۔ Q نہیں۔ لہٰذا P نہیں۔</text>
   <text x="300" y="270" text-anchor="middle" direction="rtl">مقدم کی نفی</text>
   <text class="sh" x="765" y="350" text-anchor="middle" direction="rtl">سلسلہ وار دلیل</text>
   <text x="550" y="350" text-anchor="middle" direction="rtl">اگر P تو Q۔ اگر Q تو R۔ لہٰذا اگر P تو R۔</text>
   <text x="300" y="342" text-anchor="middle" direction="rtl">ٹوٹا ہوا سلسلہ</text>
   <text class="m" x="300" y="364" text-anchor="middle" direction="rtl">(سلسلے کے مقدم کی نفی)</text>
   <text class="wm" x="10" y="510" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>