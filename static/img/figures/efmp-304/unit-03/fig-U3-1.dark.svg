<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Deductive against inductive</title><desc id="d">Table comparing deductive and inductive arguments across four rows.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="820"/><rect class="bg" x="0" y="0" width="820" height="470"/>
   <rect class="panel" x="16" y="16" width="788" height="44" rx="4"/>
   <text class="h c" x="142" y="44">Feature</text>
   <text class="h c" x="404" y="44">DEDUCTIVE ARGUMENT</text>
   <text class="h c" x="672" y="44">INDUCTIVE ARGUMENT</text>
   <text class="sh" x="28" y="104">What the premises claim</text>
   <text class="c" x="404" y="104">guarantee the conclusion</text>
   <text class="c" x="672" y="104">make the conclusion probable</text>
   <text class="sh" x="28" y="188">What a good one gives</text>
   <text class="c" x="404" y="188">necessity (if premises true, conclusion must follow)</text>
   <text class="c" x="672" y="188">probability (if premises true, conclusion is likely)</text>
   <text class="sh" x="28" y="268">What failure looks like</text>
   <text class="c" x="404" y="268">invalid (link breaks)</text>
   <text class="c" x="672" y="268">weak (premises do not support conclusion)</text>
   <text class="sh" x="28" y="350">The test that applies</text>
   <text class="c" x="404" y="350">validity</text>
   <text class="c" x="672" y="350">strength</text><text class="wm" x="810" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>