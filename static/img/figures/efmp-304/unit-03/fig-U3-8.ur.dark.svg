   <rect x="490" y="270" width="200" height="60" rx="6" class="b1"/>
   <text class="sh" x="590" y="295" text-anchor="middle" direction="rtl">استنتاجی</text>
   <text class="m" x="590" y="315" text-anchor="middle" direction="rtl">صداقت جانچیں</text>
   <rect x="90" y="270" width="200" height="60" rx="6" class="b2"/>
   <text class="sh" x="190" y="295" text-anchor="middle" direction="rtl">استقرائی</text>
   <text class="m" x="190" y="315" text-anchor="middle" direction="rtl">مضبوطی جانچیں</text>
   <line class="line" x1="590" y1="330" x2="590" y2="370"/>
