<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four terms in one grid</title><desc id="d">Grid of valid/invalid against true/false premises, with sound and unsound located in it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="820"/><rect class="bg" x="0" y="0" width="820" height="470"/>
   <rect class="panel" x="16" y="16" width="788" height="44" rx="4"/>
   <text class="h c" x="404" y="44">DEDUCTIVE</text>
   <rect class="panel" x="16" y="70" width="788" height="30" rx="2"/>
   <text class="sh c" x="204" y="90">Premises true</text>
   <text class="sh c" x="604" y="90">Premises false</text>
   <text class="sh" x="28" y="150">Valid</text>
   <rect x="120" y="120" width="280" height="60" rx="6" class="b1"/>
   <text class="sh c" x="260" y="145">SOUND</text>
   <text class="m c" x="260" y="165">rely on it</text>
   <rect x="420" y="120" width="380" height="60" rx="6" class="b3"/>
   <text class="sh c" x="610" y="145">Valid but UNSOUND</text>
   <text class="m c" x="610" y="165">false premise undermines it</text>
   <text class="sh" x="28" y="240">Invalid</text>
   <rect x="120" y="210" width="280" height="60" rx="6" class="b3"/>
   <text class="sh c" x="260" y="235">Invalid</text>
   <text class="m c" x="260" y="255">link breaks</text>
   <rect x="420" y="210" width="380" height="60" rx="6" class="b3"/>
   <text class="sh c" x="610" y="235">Invalid</text>
   <text class="m c" x="610" y="255">link breaks</text>
   <rect x="16" y="300" width="788" height="44" rx="4" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/>
   <text class="h c" x="404" y="328">INDUCTIVE PARALLEL</text>
   <rect class="panel" x="16" y="350" width="788" height="30" rx="2"/>
   <text class="sh c" x="204" y="370">Premises true</text>
   <text class="sh c" x="604" y="370">Premises false</text>
   <text class="sh" x="28" y="430">Strong</text>
