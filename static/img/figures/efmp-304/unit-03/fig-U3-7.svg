   <text class="sh c" x="610" y="425">Strong but UNCOGENT</text>
   <text class="m c" x="610" y="445">false premise undermines it</text><text class="wm" x="810" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>