<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Types of inductive reasoning</title><desc id="d">Concept map with inductive reasoning at the centre and four branches: generalisation, analogy, causal inference, prediction.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="880"/><rect class="bg" x="0" y="0" width="880" height="520"/>
   <rect x="340" y="220" width="200" height="80" rx="8" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/>
   <text class="h c" x="440" y="265">Inductive reasoning</text>
   <line class="line" x1="440" y1="300" x2="440" y2="340"/>
   <line class="line" x1="440" y1="300" x2="140" y2="340"/>
   <line class="line" x1="440" y1="300" x2="740" y2="340"/>
   <line class="line" x1="440" y1="300" x2="140" y2="160"/>
   <line class="line" x1="440" y1="300" x2="740" y2="160"/>
   <rect x="40" y="340" width="200" height="70" rx="6" class="b2"/>
   <text class="sh c" x="140" y="370">Generalisation</text>
   <text class="m c" x="140" y="390">more cases, more varied</text>
   <rect x="640" y="340" width="200" height="70" rx="6" class="b3"/>
   <text class="sh c" x="740" y="370">Analogy</text>
   <text class="m c" x="740" y="390">relevant similarity</text>
   <rect x="40" y="160" width="200" height="70" rx="6" class="b4"/>
   <text class="sh c" x="140" y="190">Causal inference</text>
   <text class="m c" x="140" y="210">rule out alternatives</text>
   <rect x="640" y="160" width="200" height="70" rx="6" class="b1"/>
   <text class="sh c" x="740" y="190">Prediction</text>
   <text class="m c" x="740" y="210">stable trend</text><text class="wm" x="870" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>