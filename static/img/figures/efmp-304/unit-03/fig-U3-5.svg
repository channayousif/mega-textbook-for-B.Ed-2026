<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Inductive patterns</title><desc id="d">Table of four inductive patterns with what makes each stronger and weaker.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="880"/><rect class="bg" x="0" y="0" width="880" height="520"/>
   <rect class="panel" x="16" y="16" width="848" height="44" rx="4"/>
   <text class="h c" x="130" y="44">Pattern</text>
   <text class="h c" x="380" y="44">Makes it stronger</text>
   <text class="h c" x="640" y="44">Makes it weaker</text>
   <text class="sh" x="28" y="110">Generalisation</text>
   <text class="c" x="380" y="110">more cases, varied, no counter-example</text>
   <text class="c" x="640" y="110">few cases, all alike, hasty</text>
   <text class="sh" x="28" y="190">Analogy</text>
   <text class="c" x="380" y="190">many relevant similarities, few differences</text>
   <text class="c" x="640" y="190">a relevant difference breaks the comparison</text>
   <text class="sh" x="28" y="270">Causal inference</text>
   <text class="c" x="380" y="270">consistent, cause precedes effect, no alternative</text>
   <text class="c" x="640" y="270">an alternative cause explains the association</text>
   <text class="sh" x="28" y="350">Prediction</text>
   <text class="c" x="380" y="350">long, consistent trend, nothing changed</text>
   <text class="c" x="640" y="350">short trend, circumstances have changed</text><text class="wm" x="870" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>