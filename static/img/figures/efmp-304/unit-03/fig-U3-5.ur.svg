<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">استقرائی نمونے</title><desc id="d">چار استقرائی نمونوں کا جدول: تعمیم، تمثیل، سببی استنباط اور پیش گوئی، ہر ایک کے ساتھ یہ کہ اسے کیا زیادہ مضبوط اور کیا زیادہ کمزور بناتا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .b1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .b2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .b3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .b4{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} .line{stroke:var(--line);stroke-width:2}</style><rect class="bg" x="0" y="0" width="880"/>
   <rect class="bg" x="0" y="0" width="880" height="520"/>
   <rect class="panel" x="16" y="16" width="848" height="44" rx="4"/>
   <text class="h" x="765" y="44" text-anchor="middle" direction="rtl">نمونہ</text>
   <text class="h" x="500" y="44" text-anchor="middle" direction="rtl">کیا اسے مضبوط بناتا ہے</text>
   <text class="h" x="240" y="44" text-anchor="middle" direction="rtl">کیا اسے کمزور بناتا ہے</text>
   <text class="sh" x="765" y="110" text-anchor="middle" direction="rtl">تعمیم</text>
   <text x="500" y="100" text-anchor="middle" direction="rtl">زیادہ مثالیں، متنوع،</text>
   <text x="500" y="124" text-anchor="middle" direction="rtl">کوئی جوابی مثال نہیں</text>
   <text x="240" y="100" text-anchor="middle" direction="rtl">کم مثالیں، سب ایک جیسی،</text>
   <text x="240" y="124" text-anchor="middle" direction="rtl">جلد بازی</text>
   <text class="sh" x="765" y="190" text-anchor="middle" direction="rtl">تمثیل</text>
   <text x="500" y="180" text-anchor="middle" direction="rtl">بہت سی متعلقہ مماثلتیں،</text>
   <text x="500" y="204" text-anchor="middle" direction="rtl">کم اختلافات</text>
   <text x="240" y="180" text-anchor="middle" direction="rtl">کوئی متعلقہ اختلاف</text>
   <text x="240" y="204" text-anchor="middle" direction="rtl">موازنے کو توڑ دیتا ہے</text>
   <text class="sh" x="765" y="270" text-anchor="middle" direction="rtl">سببی استنباط</text>
   <text x="500" y="260" text-anchor="middle" direction="rtl">مسلسل تعلق، سبب اثر سے پہلے،</text>
   <text x="500" y="284" text-anchor="middle" direction="rtl">کوئی متبادل سبب نہیں</text>
   <text x="240" y="260" text-anchor="middle" direction="rtl">کوئی متبادل سبب</text>
   <text x="240" y="284" text-anchor="middle" direction="rtl">اس تعلق کی وضاحت کر دیتا ہے</text>
   <text class="sh" x="765" y="350" text-anchor="middle" direction="rtl">پیش گوئی</text>
   <text x="500" y="340" text-anchor="middle" direction="rtl">طویل، مسلسل رجحان،</text>
   <text x="500" y="364" text-anchor="middle" direction="rtl">کچھ نہیں بدلا</text>
   <text x="240" y="340" text-anchor="middle" direction="rtl">مختصر رجحان،</text>
   <text x="240" y="364" text-anchor="middle" direction="rtl">حالات بدل چکے ہیں</text>
   <text class="wm" x="10" y="510" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>