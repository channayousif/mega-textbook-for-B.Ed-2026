<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">بیانیہ سے تاملی تحریر کی طرف</title><desc id="d">ایک خاکہ جو بیانیہ سے تاملی تحریر کی طرف پیش قدمی تیروں سے جڑے تین خانوں میں دکھاتا ہے: کیا ہوا، 'کیوں' شامل کریں، میں نے کیا فرض کیا، شہادت کے مقابل پرکھیں، کیا بدلتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M780,0 L770,5 L780,10 z" class="ah"/></marker></defs><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">بیانیہ سے تاملی تحریر کی طرف</text><rect x="750" y="150" width="130" height="80" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="6"/><text class="sh" x="685" y="180" text-anchor="middle">کیا</text><text class="sh" x="685" y="198" text-anchor="middle">ہوا</text><text class="small" x="685" y="220" text-anchor="middle">بیان</text><line class="stroke" x1="620" y1="190" x2="600" y2="190" marker-end="url(#arrow)"/><rect x="590" y="150" width="130" height="80" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="sh" x="525" y="180" text-anchor="middle">شامل</text><text class="sh" x="525" y="198" text-anchor="middle">کریں کیوں</text><text class="small" x="525" y="220" text-anchor="middle">استدلال</text><line class="stroke" x1="460" y1="190" x2="440" y2="190" marker-end="url(#arrow)"/><rect x="430" y="150" width="130" height="80" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2" rx="6"/><text class="sh" x="365" y="180" text-anchor="middle">میں نے</text><text class="sh" x="365" y="198" text-anchor="middle">کیا فرض کیا</text><text class="small" x="365" y="220" text-anchor="middle">مفروضے</text><line class="stroke" x1="300" y1="190" x2="280" y2="190" marker-end="url(#arrow)"/><rect x="270" y="150" width="120" height="80" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="210" y="175" text-anchor="middle">پرکھیں</text><text class="sh" x="210" y="193" text-anchor="middle">شہادت پر</text><text class="small" x="210" y="220" text-anchor="middle">تصدیق</text><line class="stroke" x1="150" y1="190" x2="130" y2="190" marker-end="url(#arrow)"/><rect x="120" y="150" width="100" height="80" fill="var(--a1)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="70" y="180" text-anchor="middle" fill="var(--ink)">کیا</text><text class="sh" x="70" y="198" text-anchor="middle" fill="var(--ink)">کیا بدلتا ہے</text><text class="small" x="70" y="220" text-anchor="middle" fill="var(--ink)">عمل</text><text class="small" x="760" y="100" text-anchor="end">گہرائی بڑھتی ہے</text><line class="stroke" x1="760" y1="105" x2="760" y2="260" marker-end="url(#arrow)"/><text class="small" x="760" y="275" text-anchor="end">سطح</text><text class="small" x="760" y="100" text-anchor="end">گہرائی</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
