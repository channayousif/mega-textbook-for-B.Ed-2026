<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three levels of journal writing</title><desc id="d">Table showing three levels of journal writing.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">Three levels of journal writing</text><rect x="50" y="60" width="220" height="40" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="270" y="60" width="230" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="500" y="60" width="230" height="40" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="160" y="85" text-anchor="middle">Descriptive</text><text class="sh" x="385" y="85" text-anchor="middle">Assumption</text><text class="sh" x="615" y="85" text-anchor="middle">Evidence-tested</text><rect x="50" y="100" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="270" y="100" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="500" y="100" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="118">Focus</text><text x="160" y="140" text-anchor="middle">What happened</text><text x="160" y="157" text-anchor="middle" class="small">events and actions</text><text x="385" y="140" text-anchor="middle">What I assumed</text><text x="385" y="157" text-anchor="middle" class="small">beliefs behind actions</text><text x="615" y="140" text-anchor="middle">What the evidence shows</text><text x="615" y="157" text-anchor="middle" class="small">tested against data</text><rect x="50" y="165" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="270" y="165" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="500" y="165" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="183">Question</text><text x="160" y="205" text-anchor="middle">What did I do?</text><text x="160" y="222" text-anchor="middle" class="small">chronological account</text><text x="385" y="205" text-anchor="middle">Why did I think that?</text><text x="385" y="222" text-anchor="middle" class="small">uncovering beliefs</text><text x="615" y="205" text-anchor="middle">Is my view supported?</text><text x="615" y="222" text-anchor="middle" class="small">checking against facts</text><rect x="50" y="230" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="270" y="230" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="500" y="230" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="248">Depth</text><text x="160" y="270" text-anchor="middle">Surface</text><text x="160" y="287" text-anchor="middle" class="small">description only</text><text x="385" y="270" text-anchor="middle">Intermediate</text><text x="385" y="287" text-anchor="middle" class="small">identifies assumptions</text><text x="615" y="270" text-anchor="middle">Deep</text><text x="615" y="287" text-anchor="middle" class="small">challenges and refines</text><rect x="50" y="295" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="270" y="295" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="500" y="295" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="313">Outcome</text><text x="160" y="335" text-anchor="middle">Record of events</text><text x="160" y="352" text-anchor="middle" class="small">limited learning</text><text x="385" y="335" text-anchor="middle">Awareness of beliefs</text><text x="385" y="352" text-anchor="middle" class="small">some insight</text><text x="615" y="335" text-anchor="middle">Changed understanding</text><text x="615" y="352" text-anchor="middle" class="small">actionable learning</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
