<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">زندہ جریدہ بمقابلہ مرتا جریدہ</title><desc id="d">ایک جدول جو زندہ رہنے والے اور مرتے ہوئے جریدے کا چار قطاروں میں موازنہ کرتا ہے: شکل (مستقل نمونہ بمقابلہ بدلتی ہوئی)، شیڈول (مقرر دن بمقابلہ جب وقت ملے)، رابطے (واپسی کا تیر موجود بمقابلہ ہر اندراج الگ تھلگ)، اور ریکارڈ (تاریخ اور عنوان کے ساتھ بمقابلہ بغیر تاریخ و عنوان)۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">زندہ جریدہ بمقابلہ مرتا جریدہ</text><rect x="730" y="60" width="330" height="40" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="400" y="60" width="350" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="565" y="85" text-anchor="middle">زندہ جریدہ</text><text class="sh" x="225" y="85" text-anchor="middle">مرتا جریدہ</text><rect x="730" y="100" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="400" y="100" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="720" y="118">شکل</text><text x="565" y="135" text-anchor="middle">مستقل ڈھانچہ</text><text x="565" y="152" text-anchor="middle" class="small">ہر اندراج میں یکساں حصے</text><text x="225" y="135" text-anchor="middle">بدلتا یا بغیر ڈھانچے</text><text x="225" y="152" text-anchor="middle" class="small">ہر بار مختلف</text><rect x="730" y="165" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="400" y="165" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="720" y="183">شیڈول</text><text x="565" y="200" text-anchor="middle">مقرر دن اور وقت</text><text x="565" y="217" text-anchor="middle" class="small">ہفتے میں محفوظ</text><text x="225" y="200" text-anchor="middle">جب وقت ہو</text><text x="225" y="217" text-anchor="middle" class="small">آسانی سے مؤخر</text><rect x="730" y="230" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="400" y="230" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="720" y="248">رابطے</text><text x="565" y="265" text-anchor="middle">اندراجات میں موجود</text><text x="565" y="282" text-anchor="middle" class="small">پرانی تحریر حوالہ دیتے ہوئے</text><text x="225" y="265" text-anchor="middle">غائب</text><text x="225" y="282" text-anchor="middle" class="small">ہر اندراج الگ تھلگ</text><rect x="730" y="295" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="400" y="295" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="720" y="313">ریکارڈ</text><text x="565" y="330" text-anchor="middle">تاریخ و عنوان والا</text><text x="565" y="347" text-anchor="middle" class="small">واضح حوالہ جات</text><text x="225" y="330" text-anchor="middle">بغیر تاریخ و عنوان</text><text x="225" y="347" text-anchor="middle" class="small">بعد میں تلاش مشکل</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
