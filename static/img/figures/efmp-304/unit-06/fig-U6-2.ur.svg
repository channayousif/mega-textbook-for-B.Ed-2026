<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">تاملی جریدہ اور اس کے ہمسائے</title><desc id="d">ایک خاکہ جو مرکز میں تاملی جریدہ دکھاتا ہے اور چار تیر اس کی طرف اشارہ کرتے ہیں: ڈائری (خام مواد دیتی ہے - کیا ہوا)، سبقی منصوبہ (جریدے کی دریافتیں لیتا ہے - آگے کیا آزمانا ہے)، اسکیم آف ورک (سیاق دیتی ہے - ٹرم میں کہاں)، اور واقعاتی رپورٹ (جانچنے کے لیے ایک مخصوص واقعہ دیتی ہے)۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M780,0 L770,5 L780,10 z" class="ah"/></marker></defs><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">تاملی جریدہ اور اس کے ہمسائے</text><rect x="500" y="180" width="220" height="80" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" rx="8"/><text class="h" x="390" y="210" text-anchor="middle">تاملی</text><text class="h" x="390" y="232" text-anchor="middle">جریدہ</text><rect x="520" y="55" width="260" height="60" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="6"/><text class="sh" x="390" y="78" text-anchor="middle">ڈائری</text><text class="small" x="390" y="98" text-anchor="middle">خام مواد فراہم کرتی ہے</text><line class="stroke" x1="390" y1="115" x2="390" y2="180" marker-end="url(#arrow)"/><rect x="520" y="320" width="260" height="60" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="390" y="343" text-anchor="middle">سبقی منصوبہ</text><text class="small" x="390" y="363" text-anchor="middle">درافتیں لیتا ہے</text><line class="stroke" x1="390" y1="320" x2="390" y2="260" marker-end="url(#arrow)"/><rect x="740" y="175" width="200" height="70" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="sh" x="640" y="200" text-anchor="middle">اسکیم آف ورک</text><text class="small" x="640" y="220" text-anchor="middle">سیاق فراہم کرتی ہے</text><line class="stroke" x1="540" y1="210" x2="500" y2="220" marker-end="url(#arrow)"/><rect x="240" y="175" width="200" height="70" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2" rx="6"/><text class="sh" x="140" y="200" text-anchor="middle">واقعاتی رپورٹ</text><text class="small" x="140" y="220" text-anchor="middle">واقعہ فراہم کرتی ہے</text><line class="stroke" x1="240" y1="210" x2="280" y2="220" marker-end="url(#arrow)"/><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
