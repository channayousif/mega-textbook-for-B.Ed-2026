<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The course through-line</title><desc id="d">Concept map showing the course through-line.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The course through-line</text><rect x="230" y="180" width="320" height="90" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" rx="8"/><text class="h" x="390" y="210" text-anchor="middle">Did I reason well</text><text class="h" x="390" y="232" text-anchor="middle">about my own teaching?</text><text class="small" x="390" y="258" text-anchor="middle">The central question of the course</text><line class="stroke" x1="230" y1="225" x2="140" y2="150"/><rect x="30" y="70" width="220" height="60" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="140" y="95" text-anchor="middle">Critical thinking</text><text class="small" x="140" y="115" text-anchor="middle">standards, arguments, logic</text><rect x="30" y="135" width="65" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="62" y="153" text-anchor="middle">Standards</text><rect x="100" y="135" width="65" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="132" y="153" text-anchor="middle">Arguments</text><rect x="170" y="135" width="65" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="202" y="153" text-anchor="middle">Logic</text><line class="stroke" x1="550" y1="225" x2="640" y2="150"/><rect x="530" y="70" width="220" height="60" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="sh" x="640" y="95" text-anchor="middle">Reflective practice</text><text class="small" x="640" y="115" text-anchor="middle">process, cycle, journal</text><rect x="530" y="135" width="65" height="28" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="562" y="153" text-anchor="middle">Process</text><rect x="600" y="135" width="65" height="28" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="632" y="153" text-anchor="middle">Cycle</text><rect x="670" y="135" width="65" height="28" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="702" y="153" text-anchor="middle">Journal</text><text class="small" x="390" y="350" text-anchor="middle" fill="var(--muted)">Both strands answer the central question</text><text class="small" x="390" y="368" text-anchor="middle" fill="var(--muted)">from different angles</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
