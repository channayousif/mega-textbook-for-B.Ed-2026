<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Surviving vs dying journal</title><desc id="d">Table comparing surviving and dying journals.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">Surviving vs dying journal</text><rect x="50" y="60" width="330" height="40" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="380" y="60" width="350" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="215" y="85" text-anchor="middle">Surviving journal</text><text class="sh" x="555" y="85" text-anchor="middle">Dying journal</text><rect x="50" y="100" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="100" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="118">Format</text><text x="215" y="135" text-anchor="middle">Consistent structure</text><text x="215" y="152" text-anchor="middle" class="small">same sections each entry</text><text x="555" y="135" text-anchor="middle">Varying or no structure</text><text x="555" y="152" text-anchor="middle" class="small">different each time</text><rect x="50" y="165" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="165" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="183">Schedule</text><text x="215" y="200" text-anchor="middle">Fixed day and time</text><text x="215" y="217" text-anchor="middle" class="small">protected in the week</text><text x="555" y="200" text-anchor="middle">When there is time</text><text x="555" y="217" text-anchor="middle" class="small">easily postponed</text><rect x="50" y="230" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="230" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="248">Links</text><text x="215" y="265" text-anchor="middle">Present across entries</text><text x="215" y="282" text-anchor="middle" class="small">references to earlier writing</text><text x="555" y="265" text-anchor="middle">Absent</text><text x="555" y="282" text-anchor="middle" class="small">each entry stands alone</text><rect x="50" y="295" width="330" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="295" width="350" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="60" y="313">Record</text><text x="215" y="330" text-anchor="middle">Dated and titled</text><text x="215" y="347" text-anchor="middle" class="small">clear reference points</text><text x="555" y="330" text-anchor="middle">Undated or untitled</text><text x="555" y="347" text-anchor="middle" class="small">hard to find later</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
