<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The life of a reflective journal</title><desc id="d">Flowchart showing journal lifecycle with failure points.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The life of a reflective journal</text><rect x="40" y="60" width="160" height="55" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="120" y="85" text-anchor="middle">Start structure</text><text class="small" x="120" y="102" text-anchor="middle">Choose a format</text><line class="stroke" x1="200" y1="87" x2="250" y2="87" marker-end="url(#arrow)"/><rect x="260" y="60" width="160" height="55" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="6"/><text class="sh" x="340" y="85" text-anchor="middle">Build routine</text><text class="small" x="340" y="102" text-anchor="middle">Set a schedule</text><polygon points="340,115 400,150 340,185 280,150" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="small" x="340" y="147" text-anchor="middle">Loss of</text><text class="small" x="340" y="160" text-anchor="middle">time?</text><rect x="420" y="130" width="120" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="small" x="480" y="154" text-anchor="middle">Write less often</text><text x="420" y="145" class="small" fill="var(--a3)">yes</text><line class="stroke" x1="340" y1="185" x2="340" y2="220" marker-end="url(#arrow)"/><text x="350" y="205" class="small" fill="var(--a1)">no</text><polygon points="340,220 400,255 340,290 280,255" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="small" x="340" y="252" text-anchor="middle">Loss of</text><text class="small" x="340" y="265" text-anchor="middle">purpose?</text><rect x="420" y="235" width="120" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="small" x="480" y="259" text-anchor="middle">Look back at</text><text class="small" x="480" y="272" text-anchor="middle">earlier entries</text><text x="420" y="250" class="small" fill="var(--a3)">yes</text><line class="stroke" x1="340" y1="290" x2="340" y2="320" marker-end="url(#arrow)"/><text x="350" y="310" class="small" fill="var(--a1)">no</text><polygon points="340,320 400,355 340,390 280,355" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="small" x="340" y="352" text-anchor="middle">Loss of</text><text class="small" x="340" y="365" text-anchor="middle">honesty?</text><rect x="420" y="335" width="120" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="small" x="480" y="359" text-anchor="middle">Write for self</text><text class="small" x="480" y="372" text-anchor="middle">not for others</text><text x="420" y="350" class="small" fill="var(--a3)">yes</text><line class="stroke" x1="340" y1="390" x2="340" y2="420" marker-end="url(#arrow)"/><text x="350" y="410" class="small" fill="var(--a1)">no</text><rect x="260" y="415" width="160" height="40" fill="var(--a1)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="340" y="440" text-anchor="middle" fill="var(--ink)">Sustain</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
