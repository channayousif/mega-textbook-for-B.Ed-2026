<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">تاملی جریدے کی زندگی</title><desc id="d">ایک بہاؤ خاکہ جو تاملی جریدے کی زندگی دکھاتا ہے: ایک ڈھانچے سے آغاز، ایک معمول بنانا، تینوں ناکامی کے مقامات کی پیشگی تیاری (وقت کا نقصان، مقصد کا نقصان، صداقت کا نقصان)، اور پوری ٹرم تک جاری رکھنا۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M780,0 L770,5 L780,10 z" class="ah"/></marker></defs><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">تاملی جریدے کی زندگی</text><rect x="580" y="60" width="160" height="55" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="660" y="85" text-anchor="middle">ڈھانچہ شروع کریں</text><text class="small" x="660" y="102" text-anchor="middle">شکل منتخب کریں</text><line class="stroke" x1="580" y1="87" x2="530" y2="87" marker-end="url(#arrow)"/><rect x="360" y="60" width="160" height="55" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="6"/><text class="sh" x="440" y="85" text-anchor="middle">معمول بنائیں</text><text class="small" x="440" y="102" text-anchor="middle">شیڈول طے کریں</text><polygon points="440,115 380,150 440,185 500,150" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="small" x="440" y="147" text-anchor="middle">نقصان</text><text class="small" x="440" y="160" text-anchor="middle">وقت کا؟</text><rect x="240" y="130" width="120" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="small" x="300" y="154" text-anchor="middle">کم لکھیں</text><text x="240" y="145" class="small" fill="var(--a3)">ہاں</text><line class="stroke" x1="440" y1="185" x2="440" y2="220" marker-end="url(#arrow)"/><text x="430" y="205" class="small" fill="var(--a1)">نہیں</text><polygon points="440,220 380,255 440,290 500,255" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="small" x="440" y="252" text-anchor="middle">نقصان</text><text class="small" x="440" y="265" text-anchor="middle">مقصد کا؟</text><rect x="240" y="235" width="120" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="small" x="300" y="259" text-anchor="middle">پیچھے دیکھیں</text><text class="small" x="300" y="272" text-anchor="middle">پرانے اندراجات پر</text><text x="240" y="250" class="small" fill="var(--a3)">ہاں</text><line class="stroke" x1="440" y1="290" x2="440" y2="320" marker-end="url(#arrow)"/><text x="430" y="310" class="small" fill="var(--a1)">نہیں</text><polygon points="440,320 380,355 440,390 500,355" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="small" x="440" y="352" text-anchor="middle">نقصان</text><text class="small" x="440" y="365" text-anchor="middle">صداقت کا؟</text><rect x="240" y="335" width="120" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="small" x="300" y="359" text-anchor="middle">اپنے لیے لکھیں</text><text class="small" x="300" y="372" text-anchor="middle">دوسروں کے لیے نہیں</text><text x="240" y="350" class="small" fill="var(--a3)">ہاں</text><line class="stroke" x1="440" y1="390" x2="440" y2="420" marker-end="url(#arrow)"/><text x="430" y="410" class="small" fill="var(--a1)">نہیں</text><rect x="360" y="415" width="160" height="40" fill="var(--a1)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="440" y="440" text-anchor="middle" fill="var(--ink)">جاری رکھیں</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
