<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">مقصد کے لحاظ سے جریدے کے اشارے</title><desc id="d">جریدے کے اشاروں کا جدول جو مقصد کے لحاظ سے ترتیب دیا گیا ہے: ابتدائی اشارے (کس بات نے مجھے حیران کیا، کس نے مایوس کیا، میں نے کیا فرض کیا)، گہرائی کے اشارے (اس کی حمایت میں کون سی شہادت ہے، کوئی ساتھی کیا کہتا، کوئی طالب علم کیا کہتا)، اور کورس کی سطح کے اشارے (میں نے کہاں کوئی معیار لاگو کیا، کہاں کوئی مرحلہ چھوڑا، کہاں اپنی رائے بدلی)۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">مقصد کے لحاظ سے جریدے کے اشارے</text><rect x="750" y="50" width="720" height="38" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="4"/><text class="sh" x="390" y="74" text-anchor="middle">ابتدائی اشارے</text><rect x="750" y="88" width="720" height="75" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="4"/><text class="small" x="730" y="108">آج کے سبق میں کس بات نے مجھے حیران کیا؟</text><text class="small" x="730" y="125">کس لمحے کو میں دوبارہ کروں اور کس کو بدلوں؟</text><text class="small" x="730" y="142">سبق کے آغاز اور اخیر میں مجھے کیا محسوس ہوا؟</text><rect x="750" y="173" width="720" height="38" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="4"/><text class="sh" x="390" y="197" text-anchor="middle">گہرائی کے اشارے</text><rect x="750" y="211" width="720" height="90" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="4"/><text class="small" x="730" y="231">میں اپنے سیکھنے والوں کے بارے میں کیا فرض کر رہا تھا؟</text><text class="small" x="730" y="248">آج کس کی آواز میں نے نہ سنی اور کیوں؟</text><text class="small" x="730" y="265">کوئی ساتھی اس سبق کے بارے میں کیا کہے گا؟</text><text class="small" x="730" y="282">کون سی نظریہ یا مطالعہ اس واقعے سے جڑتی ہے؟</text><rect x="750" y="311" width="720" height="38" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="sh" x="390" y="335" text-anchor="middle">کورس کی سطح کے اشارے</text><rect x="750" y="349" width="720" height="90" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="4"/><text class="small" x="730" y="369">یہ واقعہ کورس کے سیکھنے کے نتائج سے کیسے جڑتا ہے؟</text><text class="small" x="730" y="386">اس اندراج میں اپنے استاد کی کون سی رائے پر غور کروں؟</text><text class="small" x="730" y="403">اس یونٹ کے آغاز سے میری سوچ کیسے بدلی ہے؟</text><text class="small" x="730" y="420">اگلے جلسے سے پہلے میں کیا ایک اقدام کروں گا؟</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
