<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">تاملی جریدہ یہ چار چیزیں نہیں</title><desc id="d">ایک جدول جو تاملی جریدے کا ان چار چیزوں سے موازنہ کرتا ہے جو وہ نہیں ہے: ڈائری (واقعات ریکارڈ کرتی ہے)، سبقی منصوبہ (تدریس کی تیاری کرتا ہے)، اسکیم آف ورک (نصاب کا احاطہ نقشہ بند کرتی ہے)، واقعاتی رپورٹ (کسی واقعے کی دستاویز بناتی ہے)، اور ہر ایک کے ساتھ درج ہے کہ وہ کیا کرتی ہے اور کیا نہیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">تاملی جریدہ یہ چار چیزیں نہیں</text><rect x="750" y="50" width="180" height="36" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="570" y="50" width="250" height="36" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="320" y="50" width="290" height="36" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="660" y="72" text-anchor="middle">تاملی جریدہ نہیں ہے...</text><text class="sh" x="445" y="72" text-anchor="middle">یہ کیا کرتی ہے</text><text class="sh" x="175" y="72" text-anchor="middle">تاملی جریدہ اس کی جگہ کیا کرتا ہے</text><rect x="750" y="86" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="570" y="86" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="320" y="86" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="660" y="112" text-anchor="middle">ڈائری</text><text x="445" y="110" text-anchor="middle">ذاتی واقعات</text><text x="445" y="127" text-anchor="middle" class="small">اور جذبات ریکارڈ</text><text x="445" y="142" text-anchor="middle" class="small">کرتی ہیں بغیر تجزیے کے</text><text x="175" y="110" text-anchor="middle">پیشہ ورانہ واقعات کا</text><text x="175" y="127" text-anchor="middle" class="small">تجزیہ کرتا ہے سیکھنے</text><text x="175" y="142" text-anchor="middle" class="small">اور بہتری کے لیے</text><rect x="750" y="151" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="570" y="151" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="320" y="151" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="660" y="177" text-anchor="middle">سبقی منصوبہ</text><text x="445" y="175" text-anchor="middle">ارادے رکھتا ہے</text><text x="445" y="192" text-anchor="middle" class="small">تدریس سے پہلے</text><text x="445" y="207" text-anchor="middle" class="small">کہ کیا ہوگا</text><text x="175" y="175" text-anchor="middle">جاچتا ہے کیا ہوا</text><text x="175" y="192" text-anchor="middle" class="small">تدریس کے بعد</text><text x="175" y="207" text-anchor="middle" class="small">اور کیوں ہوا</text><rect x="750" y="216" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="570" y="216" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="320" y="216" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="660" y="242" text-anchor="middle">اسکیم آف ورک</text><text x="445" y="240" text-anchor="middle">نصاب نقشہ بند</text><text x="445" y="257" text-anchor="middle" class="small">کرتا ہے مواد کا</text><text x="445" y="272" text-anchor="middle" class="small">ایک ٹرم یا سال میں</text><text x="175" y="240" text-anchor="middle">انفرادی تدریسی واقعات</text><text x="175" y="257" text-anchor="middle" class="small">کی گہرائی سے</text><text x="175" y="272" text-anchor="middle" class="small">جانچ کرتا ہے</text><rect x="750" y="281" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="570" y="281" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="320" y="281" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="660" y="307" text-anchor="middle">واقعاتی رپورٹ</text><text x="445" y="305" text-anchor="middle">حقائق ریکارڈ کرتی</text><text x="445" y="322" text-anchor="middle" class="small">ہے کسی مخصوص واقعے کے</text><text x="445" y="337" text-anchor="middle" class="small">احتساب کے لیے</text><text x="175" y="305" text-anchor="middle">واقعات کا تجزیہ</text><text x="175" y="322" text-anchor="middle" class="small">کرتا ہے ذاتی پیشہ</text><text x="175" y="337" text-anchor="middle" class="small">ورانہ ترقی کے لیے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
