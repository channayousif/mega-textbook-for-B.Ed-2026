<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">جریدہ نویسی کی تین سطحیں</title><desc id="d">ایک جدول جو ایک ہی واقعے پر جریدے کے تین اندراج تین سطحوں پر دکھاتا ہے: بیانیہ (کیا ہوا اور میں نے کیسا محسوس کیا)، مفروضے کے ساتھ تاملی (کیا ہوا اور میں نے کیا فرض کیا)، شہادت پر پرکھے ہوئے مفروضے کے ساتھ تاملی (کیا ہوا، میں نے کیا فرض کیا، شہادت اس کی حمایت کرتی ہے یا نہیں، اور کیا بدلتا ہے)۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">جریدہ نویسی کی تین سطحیں</text><rect x="510" y="60" width="220" height="40" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="50" y="60" width="230" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="50" y="60" width="230" height="40" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="620" y="85" text-anchor="middle">بیانیہ</text><text class="sh" x="395" y="85" text-anchor="middle">مفروضہ</text><text class="sh" x="165" y="85" text-anchor="middle">شہادت پر پرکھا ہوا</text><rect x="510" y="100" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="100" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="100" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="520" y="118">مرکز</text><text x="620" y="140" text-anchor="middle">کیا ہوا</text><text x="620" y="157" text-anchor="middle" class="small">واقعات اور اعمال</text><text x="395" y="140" text-anchor="middle">میں نے کیا فرض کیا</text><text x="395" y="157" text-anchor="middle" class="small">اعمال کے پیچھے عقیدے</text><text x="165" y="140" text-anchor="middle">شہادت کیا دکھاتی ہے</text><text x="165" y="157" text-anchor="middle" class="small">اعداد پر پرکھی گئی</text><rect x="510" y="165" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="165" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="165" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="520" y="183">سوال</text><text x="620" y="205" text-anchor="middle">میں نے کیا کیا؟</text><text x="620" y="222" text-anchor="middle" class="small">تاریخی بیان</text><text x="395" y="205" text-anchor="middle">میں نے ایسا کیوں سوچا؟</text><text x="395" y="222" text-anchor="middle" class="small">عقیدے کھولنا</text><text x="165" y="205" text-anchor="middle">کیا میرے خیال کی حمایت ہے؟</text><text x="165" y="222" text-anchor="middle" class="small">حقائق سے جانچنا</text><rect x="510" y="230" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="230" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="230" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="520" y="248">گہرائی</text><text x="620" y="270" text-anchor="middle">سطحی</text><text x="620" y="287" text-anchor="middle" class="small">صرف بیان</text><text x="395" y="270" text-anchor="middle">درمیانی</text><text x="395" y="287" text-anchor="middle" class="small">مفروضے پہچانتا ہے</text><text x="165" y="270" text-anchor="middle">گہرا</text><text x="165" y="287" text-anchor="middle" class="small">چیلنج کرتا اور بہتر بناتا ہے</text><rect x="510" y="295" width="220" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="295" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="295" width="230" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="small" x="520" y="313">نتیجہ</text><text x="620" y="335" text-anchor="middle">واقعات کا ریکارڈ</text><text x="620" y="352" text-anchor="middle" class="small">محدود سیکھ</text><text x="395" y="335" text-anchor="middle">عقیدے کا احساس</text><text x="395" y="352" text-anchor="middle" class="small">کچھ بصیرت</text><text x="165" y="335" text-anchor="middle">بدلی ہوئی سمجھ</text><text x="165" y="352" text-anchor="middle" class="small">عملی سیکھ</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
