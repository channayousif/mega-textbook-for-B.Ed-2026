<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">From descriptive to reflective writing</title><desc id="d">Diagram showing the move from descriptive to reflective.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">From descriptive to reflective writing</text><rect x="30" y="150" width="130" height="80" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="6"/><text class="sh" x="95" y="180" text-anchor="middle">What</text><text class="sh" x="95" y="198" text-anchor="middle">happened</text><text class="small" x="95" y="220" text-anchor="middle">Description</text><line class="stroke" x1="160" y1="190" x2="180" y2="190" marker-end="url(#arrow)"/><rect x="190" y="150" width="130" height="80" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="sh" x="255" y="180" text-anchor="middle">Add</text><text class="sh" x="255" y="198" text-anchor="middle">why</text><text class="small" x="255" y="220" text-anchor="middle">Reasoning</text><line class="stroke" x1="320" y1="190" x2="340" y2="190" marker-end="url(#arrow)"/><rect x="350" y="150" width="130" height="80" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2" rx="6"/><text class="sh" x="415" y="180" text-anchor="middle">What I</text><text class="sh" x="415" y="198" text-anchor="middle">assumed</text><text class="small" x="415" y="220" text-anchor="middle">Assumptions</text><line class="stroke" x1="480" y1="190" x2="500" y2="190" marker-end="url(#arrow)"/><rect x="510" y="150" width="120" height="80" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="570" y="175" text-anchor="middle">Test against</text><text class="sh" x="570" y="193" text-anchor="middle">evidence</text><text class="small" x="570" y="220" text-anchor="middle">Verification</text><line class="stroke" x1="630" y1="190" x2="650" y2="190" marker-end="url(#arrow)"/><rect x="660" y="150" width="100" height="80" fill="var(--a1)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="710" y="180" text-anchor="middle" fill="var(--ink)">What</text><text class="sh" x="710" y="198" text-anchor="middle" fill="var(--ink)">changes</text><text class="small" x="710" y="220" text-anchor="middle" fill="var(--ink)">Action</text><text class="small" x="20" y="100" text-anchor="start">Depth increases</text><line class="stroke" x1="20" y1="105" x2="20" y2="260" marker-end="url(#arrow)"/><text class="small" x="20" y="275" text-anchor="start">Surface</text><text class="small" x="20" y="100" text-anchor="start">Deep</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
