<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Journal prompts by purpose</title><desc id="d">Table of prompts arranged by purpose.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Journal prompts by purpose</text><rect x="30" y="50" width="720" height="38" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="4"/><text class="sh" x="390" y="74" text-anchor="middle">Starting prompts</text><rect x="30" y="88" width="720" height="75" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="4"/><text class="small" x="50" y="108">What happened in today's lesson that surprised me?</text><text class="small" x="50" y="125">Which moment would I want to repeat and which would I change?</text><text class="small" x="50" y="142">What did I feel at the start and at the end of the lesson?</text><rect x="30" y="173" width="720" height="38" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="4"/><text class="sh" x="390" y="197" text-anchor="middle">Deepening prompts</text><rect x="30" y="211" width="720" height="90" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="4"/><text class="small" x="50" y="231">What assumption was I making about my learners?</text><text class="small" x="50" y="248">Whose voice did I not hear today and why?</text><text class="small" x="50" y="265">What would a colleague say about this lesson?</text><text class="small" x="50" y="282">What theory or reading connects to this event?</text><rect x="30" y="311" width="720" height="38" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="sh" x="390" y="335" text-anchor="middle">Course-level prompts</text><rect x="30" y="349" width="720" height="90" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="4"/><text class="small" x="50" y="369">How does this event connect to the course learning outcomes?</text><text class="small" x="50" y="386">What feedback from my tutor should I address in this entry?</text><text class="small" x="50" y="403">How has my thinking changed since the start of this unit?</text><text class="small" x="50" y="420">What one action will I take before the next session?</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
