<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">کورس کا مرکزی دھاگہ</title><desc id="d">ایک تصوری خاکہ جو کورس کا مرکزی دھاگا دکھاتا ہے: تنقیدی سوچ (معیارات، دلیلیں، منطق) تاملی مشق (عمل، چکر، جریدہ) میں شامل ہوتی ہے، اور دونوں اس سوال میں ملتی ہیں کہ 'کیا میں نے اپنی تدریس کے بارے میں اچھا استدلال کیا؟'</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .sh{font-size:12px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="780" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">کورس کا مرکزی دھاگہ</text><rect x="550" y="180" width="320" height="90" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" rx="8"/><text class="h" x="390" y="210" text-anchor="middle">کیا میں نے اچھا</text><text class="h" x="390" y="232" text-anchor="middle">استدلال کیا اپنی تدریس پر؟</text><text class="small" x="390" y="258" text-anchor="middle">کورس کا مرکزی سوال</text><line class="stroke" x1="550" y1="225" x2="640" y2="150"/><rect x="750" y="70" width="220" height="60" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="640" y="95" text-anchor="middle">تنقیدی سوچ</text><text class="small" x="640" y="115" text-anchor="middle">معیارات، دلیلیں، منطق</text><rect x="750" y="135" width="65" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="718" y="153" text-anchor="middle">معیارات</text><rect x="680" y="135" width="65" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="648" y="153" text-anchor="middle">دلیلیں</text><rect x="610" y="135" width="65" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="578" y="153" text-anchor="middle">منطق</text><line class="stroke" x1="230" y1="225" x2="140" y2="150"/><rect x="250" y="70" width="220" height="60" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="sh" x="140" y="95" text-anchor="middle">تاملی مشق</text><text class="small" x="140" y="115" text-anchor="middle">عمل، چکر، جریدہ</text><rect x="250" y="135" width="65" height="28" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="218" y="153" text-anchor="middle">عمل</text><rect x="180" y="135" width="65" height="28" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="148" y="153" text-anchor="middle">چکر</text><rect x="110" y="135" width="65" height="28" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="78" y="153" text-anchor="middle">جریدہ</text><text class="small" x="390" y="350" text-anchor="middle" fill="var(--muted)">دونوں دھاگے مرکزی سوال کا جواب دیتے ہیں</text><text class="small" x="390" y="368" text-anchor="middle" fill="var(--muted)">مختلف زاویوں سے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
