<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A reflective journal is not these four things</title><desc id="d">Table comparing a reflective journal against four things it is not.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">A reflective journal is not these four things</text><rect x="30" y="50" width="180" height="36" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="210" y="50" width="250" height="36" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="460" y="50" width="290" height="36" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="120" y="72" text-anchor="middle">A journal is not...</text><text class="sh" x="335" y="72" text-anchor="middle">What it does</text><text class="sh" x="605" y="72" text-anchor="middle">What a journal does instead</text><rect x="30" y="86" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="210" y="86" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="460" y="86" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="120" y="112" text-anchor="middle">Diary</text><text x="335" y="110" text-anchor="middle">Records personal</text><text x="335" y="127" text-anchor="middle" class="small">events and feelings</text><text x="335" y="142" text-anchor="middle" class="small">without analysis</text><text x="605" y="110" text-anchor="middle">Analyses professional</text><text x="605" y="127" text-anchor="middle" class="small">events for learning</text><text x="605" y="142" text-anchor="middle" class="small">and improvement</text><rect x="30" y="151" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="210" y="151" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="460" y="151" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="120" y="177" text-anchor="middle">Lesson plan</text><text x="335" y="175" text-anchor="middle">Sets out intentions</text><text x="335" y="192" text-anchor="middle" class="small">before teaching</text><text x="335" y="207" text-anchor="middle" class="small">what will happen</text><text x="605" y="175" text-anchor="middle">Reviews what happened</text><text x="605" y="192" text-anchor="middle" class="small">after teaching and</text><text x="605" y="207" text-anchor="middle" class="small">why it happened</text><rect x="30" y="216" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="210" y="216" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="460" y="216" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="120" y="242" text-anchor="middle">Scheme of work</text><text x="335" y="240" text-anchor="middle">Maps curriculum</text><text x="335" y="257" text-anchor="middle" class="small">content across</text><text x="335" y="272" text-anchor="middle" class="small">a term or year</text><text x="605" y="240" text-anchor="middle">Explores individual</text><text x="605" y="257" text-anchor="middle" class="small">teaching episodes</text><text x="605" y="272" text-anchor="middle" class="small">in depth</text><rect x="30" y="281" width="180" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="210" y="281" width="250" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="460" y="281" width="290" height="65" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="120" y="307" text-anchor="middle">Incident report</text><text x="335" y="305" text-anchor="middle">Records facts of</text><text x="335" y="322" text-anchor="middle" class="small">a specific event</text><text x="335" y="337" text-anchor="middle" class="small">for accountability</text><text x="605" y="305" text-anchor="middle">Interprets events</text><text x="605" y="322" text-anchor="middle" class="small">for personal</text><text x="605" y="337" text-anchor="middle" class="small">professional growth</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
