<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تجربے سے سیکھنے تک - دو راستے</title><desc id="d">ایک خاکہ جو تجربے کو غور و فکر سے گزر کر سیکھنے تک پہنچتا دکھاتا ہے (بنیادی راستہ)، اور اس کے ساتھ ایک بائی پاس راستہ کھنچا ہے جس پر 'پندرہ سال، ایک بار' لکھا ہے اور جو سیکھنے کے بجائے دہرائی تک لے جاتا ہے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="560" y="180" width="160" height="60" rx="6"/><text class="sh" x="640" y="215" text-anchor="middle" direction="rtl">تجربہ</text><line class="stroke" x1="560" y1="210" x2="460" y2="210" marker-end="url(#arrow)"/><text class="small" x="510" y="195" text-anchor="middle" direction="rtl">(بنیادی راستہ)</text><rect class="panel-b" x="290" y="180" width="160" height="60" rx="6"/><text class="sh" x="370" y="215" text-anchor="middle" direction="rtl">غور و فکر</text><line class="stroke" x1="290" y1="210" x2="200" y2="210" marker-end="url(#arrow)"/><rect class="panel-a" x="50" y="180" width="140" height="60" rx="6"/><text class="sh" x="120" y="215" text-anchor="middle" direction="rtl">سیکھنا</text><path class="stroke" d="M 640,180 C 640,80 120,80 120,180" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text class="sh" x="380" y="70" text-anchor="middle" fill="var(--a3)" direction="rtl">15 سال، ایک بار</text><rect class="panel-c" x="50" y="100" width="140" height="50" rx="6"/><text class="sh" x="120" y="130" text-anchor="middle" direction="rtl">دہرائی</text><text class="small" x="380" y="128" text-anchor="middle" fill="var(--muted)" direction="rtl">بائی پاس راستہ</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
