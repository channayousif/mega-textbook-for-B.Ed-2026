<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Each stage of the reflective cycle</title><desc id="d">Table of each stage with question, output, and how skipped.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Each stage of the reflective cycle</text><rect x="30" y="50" width="120" height="36" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="150" y="50" width="200" height="36" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="350" y="50" width="170" height="36" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="520" y="50" width="230" height="36" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="sh" x="90" y="72" text-anchor="middle">Stage</text><text class="sh" x="250" y="72" text-anchor="middle">Question</text><text class="sh" x="435" y="72" text-anchor="middle">Output</text><text class="sh" x="635" y="72" text-anchor="middle">How skipped</text><rect x="30" y="86" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="150" y="86" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="350" y="86" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="520" y="86" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="90" y="112" text-anchor="middle">Description</text><text x="250" y="110" text-anchor="middle">What happened?</text><text x="250" y="127" text-anchor="middle" class="small">Factual account</text><text x="435" y="110" text-anchor="middle">Clear record</text><text x="435" y="127" text-anchor="middle" class="small">of the event</text><text x="635" y="110" text-anchor="middle">Memory is selective</text><text x="635" y="127" text-anchor="middle" class="small">details are lost</text><rect x="30" y="146" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="150" y="146" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="350" y="146" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="520" y="146" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="90" y="172" text-anchor="middle">Analysis</text><text x="250" y="170" text-anchor="middle">Why did it happen?</text><text x="250" y="187" text-anchor="middle" class="small">Causes, factors</text><text x="435" y="170" text-anchor="middle">Explanations</text><text x="435" y="187" text-anchor="middle" class="small">and understanding</text><text x="635" y="170" text-anchor="middle">Jumping to action</text><text x="635" y="187" text-anchor="middle" class="small">without understanding</text><rect x="30" y="206" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="150" y="206" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="350" y="206" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="520" y="206" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="90" y="232" text-anchor="middle">Alternatives</text><text x="250" y="230" text-anchor="middle">What else could</text><text x="250" y="244" text-anchor="middle">I have done?</text><text x="435" y="230" text-anchor="middle">Range of options</text><text x="435" y="244" text-anchor="middle" class="small">identified</text><text x="635" y="230" text-anchor="middle">Sticking to first idea</text><text x="635" y="244" text-anchor="middle" class="small">no alternatives explored</text><rect x="30" y="266" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="150" y="266" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="350" y="266" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="520" y="266" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="90" y="292" text-anchor="middle">Trial</text><text x="250" y="290" text-anchor="middle">What will I try?</text><text x="250" y="307" text-anchor="middle" class="small">Test the alternative</text><text x="435" y="290" text-anchor="middle">New practice</text><text x="435" y="307" text-anchor="middle" class="small">attempted</text><text x="635" y="290" text-anchor="middle">No follow-through</text><text x="635" y="307" text-anchor="middle" class="small">ideas stay on paper</text><rect x="30" y="326" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="150" y="326" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="350" y="326" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="520" y="326" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="90" y="352" text-anchor="middle">Re-examination</text><text x="250" y="350" text-anchor="middle">What was learned?</text><text x="250" y="367" text-anchor="middle" class="small">Review the outcome</text><text x="435" y="350" text-anchor="middle">Lessons drawn</text><text x="435" y="367" text-anchor="middle" class="small">for future practice</text><text x="635" y="350" text-anchor="middle">Moving on too quickly</text><text x="635" y="367" text-anchor="middle" class="small">no review of results</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
