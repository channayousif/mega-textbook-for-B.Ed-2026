<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What experience alone gives and withholds</title><desc id="d">Table showing what experience alone gives and what it withholds.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle">What experience alone gives and withholds</text><rect x="50" y="70" width="330" height="40" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="380" y="70" width="350" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="215" y="95" text-anchor="middle">Experience alone gives</text><text class="sh" x="555" y="95" text-anchor="middle">Experience withholds</text><rect x="50" y="110" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="110" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="215" y="140" text-anchor="middle">Routine handling of familiar situations</text><text x="215" y="158" text-anchor="middle" class="small">(pattern recognition, habit)</text><text x="555" y="140" text-anchor="middle">New strategies for unfamiliar situations</text><text x="555" y="158" text-anchor="middle" class="small">(innovation, adaptation)</text><rect x="50" y="170" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="170" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="215" y="200" text-anchor="middle">Confidence in what has worked before</text><text x="215" y="218" text-anchor="middle" class="small">(self-assurance)</text><text x="555" y="200" text-anchor="middle">Awareness of one's own limitations</text><text x="555" y="218" text-anchor="middle" class="small">(blind spots, gaps in knowledge)</text><rect x="50" y="230" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="230" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="215" y="260" text-anchor="middle">Familiarity with established routines</text><text x="215" y="278" text-anchor="middle" class="small">(comfort, speed)</text><text x="555" y="260" text-anchor="middle">Adaptation to changing circumstances</text><text x="555" y="278" text-anchor="middle" class="small">(flexibility, responsiveness)</text><rect x="50" y="290" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="380" y="290" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="215" y="320" text-anchor="middle">Habitual responses and settled practice</text><text x="215" y="338" text-anchor="middle" class="small">(automaticity)</text><text x="555" y="320" text-anchor="middle">Deliberate problem-solving and analysis</text><text x="555" y="338" text-anchor="middle" class="small">(critical thinking, reasoning)</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
