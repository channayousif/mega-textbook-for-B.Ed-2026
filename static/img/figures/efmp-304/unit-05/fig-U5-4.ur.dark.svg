<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تاملی چکر کا ہر مرحلہ</title><desc id="d">چکر کے ہر مرحلے کا جدول تین کالموں کے ساتھ: وہ سوال جو وہ پوچھتا ہے، وہ پیداوار جو وہ دیتا ہے، اور اس کے چھوٹنے کا مخصوص انداز۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle" direction="rtl">تاملی چکر کا ہر مرحلہ</text><rect x="630" y="50" width="120" height="36" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="430" y="50" width="200" height="36" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="260" y="50" width="170" height="36" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="30" y="50" width="230" height="36" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="sh" x="690" y="72" text-anchor="middle" direction="rtl">مرحلہ</text><text class="sh" x="530" y="72" text-anchor="middle" direction="rtl">سوال</text><text class="sh" x="345" y="72" text-anchor="middle" direction="rtl">پیداوار</text><text class="sh" x="145" y="72" text-anchor="middle" direction="rtl">کیسے چھوٹتا ہے</text><rect x="630" y="86" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="430" y="86" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="260" y="86" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="30" y="86" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="690" y="112" text-anchor="middle" direction="rtl">بیان</text><text x="530" y="110" text-anchor="middle" direction="rtl">کیا ہوا؟</text><text x="530" y="127" text-anchor="middle" class="small" direction="rtl">حقائق پر مبنی بیان</text><text x="345" y="110" text-anchor="middle" direction="rtl">واضح ریکارڈ</text><text x="345" y="127" text-anchor="middle" class="small" direction="rtl">(واقعے کا)</text><text x="145" y="110" text-anchor="middle" direction="rtl">یادداشت چن کر یاد رکھتی ہے</text><text x="145" y="127" text-anchor="middle" class="small" direction="rtl">تفصیلات کھو جاتی ہیں</text><rect x="630" y="146" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="430" y="146" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="260" y="146" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="30" y="146" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="690" y="172" text-anchor="middle" direction="rtl">تجزیہ</text><text x="530" y="170" text-anchor="middle" direction="rtl">یہ کیوں ہوا؟</text><text x="530" y="187" text-anchor="middle" class="small" direction="rtl">اسباب، عوامل</text><text x="345" y="170" text-anchor="middle" direction="rtl">وضاحتیں</text><text x="345" y="187" text-anchor="middle" class="small" direction="rtl">اور سمجھ</text><text x="145" y="170" text-anchor="middle" direction="rtl">سیدھا عمل پر کود جانا</text><text x="145" y="187" text-anchor="middle" class="small" direction="rtl">سمجھے بغیر</text><rect x="630" y="206" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="430" y="206" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="260" y="206" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="30" y="206" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="690" y="232" text-anchor="middle" direction="rtl">متبادل</text><text x="530" y="226" text-anchor="middle" direction="rtl">میں اور کیا</text><text x="530" y="250" text-anchor="middle" direction="rtl">کر سکتا تھا؟</text><text x="345" y="226" text-anchor="middle" direction="rtl">کئی اختیارات</text><text x="345" y="248" text-anchor="middle" class="small" direction="rtl">پہچانے گئے</text><text x="145" y="226" text-anchor="middle" direction="rtl">پہلے خیال پر اڑے رہنا</text><text x="145" y="248" text-anchor="middle" class="small" direction="rtl">کوئی متبادل نہیں ٹٹولا</text><rect x="630" y="266" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="430" y="266" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="260" y="266" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="30" y="266" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="690" y="292" text-anchor="middle" direction="rtl">آزمائش</text><text x="530" y="290" text-anchor="middle" direction="rtl">میں کیا آزماؤں گا؟</text><text x="530" y="307" text-anchor="middle" class="small" direction="rtl">متبادل کو آزمانا</text><text x="345" y="290" text-anchor="middle" direction="rtl">نئی مشق</text><text x="345" y="307" text-anchor="middle" class="small" direction="rtl">آزمائی گئی</text><text x="145" y="290" text-anchor="middle" direction="rtl">عمل درآمد نہیں</text><text x="145" y="307" text-anchor="middle" class="small" direction="rtl">خیالات کاغذ پر رہ جاتے ہیں</text><rect x="630" y="326" width="120" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="430" y="326" width="200" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="260" y="326" width="170" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="30" y="326" width="230" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text class="sh" x="690" y="352" text-anchor="middle" direction="rtl">دوبارہ جانچ</text><text x="530" y="350" text-anchor="middle" direction="rtl">کیا سیکھا؟</text><text x="530" y="367" text-anchor="middle" class="small" direction="rtl">نتیجے کا جائزہ</text><text x="345" y="350" text-anchor="middle" direction="rtl">اخذ کیے گئے سبق</text><text x="345" y="367" text-anchor="middle" class="small" direction="rtl">آئندہ مشق کے لیے</text><text x="145" y="350" text-anchor="middle" direction="rtl">بہت جلد آگے بڑھ جانا</text><text x="145" y="367" text-anchor="middle" class="small" direction="rtl">نتائج کا جائزہ نہیں</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
