<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Experience into learning - two routes</title><desc id="d">Diagram showing experience passing through reflection into learning (main route) with a bypass route labelled fifteen years, once leading to repetition.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="60" y="180" width="160" height="60" rx="6"/><text class="sh" x="140" y="215" text-anchor="middle">Experience</text><line class="stroke" x1="220" y1="210" x2="320" y2="210" marker-end="url(#arrow)"/><text class="small" x="270" y="195" text-anchor="middle">(main route)</text><rect class="panel-b" x="330" y="180" width="160" height="60" rx="6"/><text class="sh" x="410" y="215" text-anchor="middle">Reflection</text><line class="stroke" x1="490" y1="210" x2="580" y2="210" marker-end="url(#arrow)"/><rect class="panel-a" x="590" y="180" width="140" height="60" rx="6"/><text class="sh" x="660" y="215" text-anchor="middle">Learning</text><path class="stroke" d="M 140,180 C 140,80 660,80 660,180" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text class="sh" x="400" y="70" text-anchor="middle" fill="var(--a3)">15 years, once</text><rect class="panel-c" x="590" y="100" width="140" height="50" rx="6"/><text class="sh" x="660" y="130" text-anchor="middle">Repetition</text><text class="small" x="400" y="110" text-anchor="middle" fill="var(--muted)">bypass route</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
