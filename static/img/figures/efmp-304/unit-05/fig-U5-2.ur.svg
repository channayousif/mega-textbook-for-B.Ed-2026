<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">صرف تجربہ کیا دیتا ہے اور کیا نہیں دیتا</title><desc id="d">ایک جدول جو دکھاتا ہے کہ صرف تجربہ کیا دیتا ہے (معمول، اعتماد، شناسائی) اور کیا نہیں دیتا (نئی حکمتِ عملیاں، اپنی حدود کا شعور، بدلے ہوئے حالات سے مطابقت)، چار قطاروں میں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="40" text-anchor="middle" direction="rtl">صرف تجربہ کیا دیتا ہے اور کیا نہیں دیتا</text><rect x="400" y="70" width="330" height="40" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="50" y="70" width="350" height="40" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="565" y="95" text-anchor="middle" direction="rtl">صرف تجربہ کیا دیتا ہے</text><text class="sh" x="225" y="95" text-anchor="middle" direction="rtl">تجربہ کیا نہیں دیتا</text><rect x="400" y="110" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="110" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="565" y="140" text-anchor="middle" direction="rtl">جانے پہچانے حالات سے معمول کے مطابق نمٹنا</text><text x="565" y="158" text-anchor="middle" class="small" direction="rtl">(انداز کی پہچان، عادت)</text><text x="225" y="140" text-anchor="middle" direction="rtl">انجانے حالات کے لیے نئی حکمتِ عملیاں</text><text x="225" y="158" text-anchor="middle" class="small" direction="rtl">(جدت، مطابقت)</text><rect x="400" y="170" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="170" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="565" y="200" text-anchor="middle" direction="rtl">اس پر اعتماد جو پہلے کام آیا</text><text x="565" y="218" text-anchor="middle" class="small" direction="rtl">(خود اعتمادی)</text><text x="225" y="200" text-anchor="middle" direction="rtl">اپنی حدود کا شعور</text><text x="225" y="218" text-anchor="middle" class="small" direction="rtl">(اندھے گوشے، علم میں خلا)</text><rect x="400" y="230" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="230" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="565" y="260" text-anchor="middle" direction="rtl">طے شدہ معمولات سے شناسائی</text><text x="565" y="278" text-anchor="middle" class="small" direction="rtl">(سہولت، رفتار)</text><text x="225" y="260" text-anchor="middle" direction="rtl">بدلتے حالات سے مطابقت</text><text x="225" y="278" text-anchor="middle" class="small" direction="rtl">(لچک، بروقت ردِعمل)</text><rect x="400" y="290" width="330" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><rect x="50" y="290" width="350" height="60" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="565" y="320" text-anchor="middle" direction="rtl">عادتاً ردِعمل اور جمی ہوئی مشق</text><text x="565" y="338" text-anchor="middle" class="small" direction="rtl">(خودکاری)</text><text x="225" y="320" text-anchor="middle" direction="rtl">سوچ سمجھ کر مسئلہ حل کرنا اور تجزیہ</text><text x="225" y="338" text-anchor="middle" class="small" direction="rtl">(تنقیدی سوچ، استدلال)</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
