<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Theoretical strands feeding reflective practice</title><desc id="d">Concept map with centre Reflective practice and 3 branches.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">Theoretical strands feeding reflective practice</text><rect x="280" y="190" width="220" height="70" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" rx="6"/><text class="h" x="390" y="220" text-anchor="middle">Reflective</text><text class="h" x="390" y="240" text-anchor="middle">practice</text><line class="stroke-a" x1="280" y1="225" x2="160" y2="130"/><rect x="40" y="90" width="240" height="80" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="sh" x="160" y="115" text-anchor="middle">Experiential learning</text><text class="small" x="160" y="132" text-anchor="middle">Dewey, Kolb</text><text x="160" y="155" text-anchor="middle">Contributes the cycle</text><line class="stroke-a" x1="390" y1="190" x2="390" y2="100"/><rect x="270" y="55" width="240" height="80" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="6"/><text class="sh" x="390" y="80" text-anchor="middle">Reflective consciousness</text><text class="small" x="390" y="97" text-anchor="middle">Schön</text><text x="390" y="120" text-anchor="middle">Contributes reflection-in-action</text><line class="stroke-a" x1="500" y1="225" x2="620" y2="320"/><rect x="500" y="280" width="240" height="80" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="sh" x="620" y="305" text-anchor="middle">Critical reflection</text><text class="small" x="620" y="322" text-anchor="middle">Brookfield, Freire</text><text x="620" y="345" text-anchor="middle">Contributes examination of assumptions</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
