<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تاملی نمونوں کا موازنہ</title><desc id="d">ایک جدول جو نمونوں کا آمنے سامنے موازنہ کرتا ہے: مرحلے، ہر ایک کس کام کے لیے اچھا ہے، وقت کے لحاظ سے اس کی قیمت، وہ عام طور پر کیا چھوڑ دیتا ہے، اور وہ سیاق جس سے وہ آیا (Kolb/Gibbs: تعلیم اور نرسنگ؛ Brookfield: تعلیمِ بالغان؛ Schön: پیشہ ورانہ مشق)۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width="2"} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width="2"} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width="2"} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width="2"} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width="2"} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle" direction="rtl">تاملی نمونوں کا موازنہ</text><rect x="660" y="50" width="90" height="36" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="520" y="50" width="140" height="36" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="390" y="50" width="130" height="36" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="290" y="50" width="100" height="36" fill="var(--a4-fill)" st