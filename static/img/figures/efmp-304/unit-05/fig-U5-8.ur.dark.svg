<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک واقعہ، دو نمونے</title><desc id="d">ایک خاکہ جو ایک ہی واقعے کو متوازی طور پر دو نمونوں میں داخل ہوتا دکھاتا ہے (بائیں طرف Gibbs، دائیں طرف Brookfield)، اور ہر ایک ایک مختلف نظر آنے والی دریافت پیدا کرتا ہے: Gibbs ایک مخصوص منصوبۂ عمل دیتا ہے؛ Brookfield ایک چیلنج شدہ مفروضہ دیتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle" direction="rtl">ایک واقعہ، دو نمونے</text><rect x="310" y="55" width="160" height="50" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" rx="6"/><text class="sh" x="390" y="85" text-anchor="middle" direction="rtl">واقعہ</text><line class="stroke" x1="330" y1="105" x2="170" y2="170" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="105" x2="610" y2="170" marker-end="url(#arrow)"/><rect x="40" y="175" width="260" height="230" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="h" x="170" y="200" text-anchor="middle" direction="rtl">Gibbs (6 مرحلے)</text><rect x="55" y="215" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="233" text-anchor="middle" direction="rtl">1. بیان</text><rect x="55" y="248" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="266" text-anchor="middle" direction="rtl">2. جذبات</text><rect x="55" y="281" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="299" text-anchor="middle" direction="rtl">3. جانچ</text><rect x="55" y="314" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="332" text-anchor="middle" direction="rtl">4. تجزیہ</text><rect x="55" y="347" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="365" text-anchor="middle" direction="rtl">5. نتیجہ</text><rect x="55" y="375" width="230" height="22" fill="var(--a1)" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="390" text-anchor="middle" fill="var(--ink)" direction="rtl">6. منصوبۂ عمل</text><rect x="480" y="175" width="260" height="230" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="h" x="610" y="200" text-anchor="middle" direction="rtl">Brookfield (4 عدسے)</text><rect x="495" y="215" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="237" text-anchor="middle" direction="rtl">1. خود نوشت (اپنا تجربہ)</text><rect x="495" y="255" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="277" text-anchor="middle" direction="rtl">2. طلبہ کی آنکھیں (سیکھنے والے کا نقطۂ نظر)</text><rect x="495" y="295" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="317" text-anchor="middle" direction="rtl">3. ساتھیوں کے تاثرات (ہم پیشہ افراد کی رائے)</text><rect x="495" y="335" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="357" text-anchor="middle" direction="rtl">4. نظریاتی مواد (تحقیق اور مطالعہ)</text><rect x="495" y="375" width="230" height="22" fill="var(--a3)" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="390" text-anchor="middle" fill="var(--ink)" direction="rtl">چیلنج شدہ مفروضہ</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
