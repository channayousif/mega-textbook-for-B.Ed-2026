<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The reflective cycle</title><desc id="d">Flowchart of the reflective cycle as a closed loop.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">The reflective cycle</text><text class="small" x="390" y="250" text-anchor="middle">Continuous improvement</text><ellipse cx="390" cy="90" rx="90" ry="32" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="390" y="95" text-anchor="middle">Description</text><line class="stroke" x1="455" y1="112" x2="510" y2="170" marker-end="url(#arrow)"/><ellipse cx="530" cy="190" rx="85" ry="32" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="530" y="195" text-anchor="middle">Analysis</text><line class="stroke" x1="530" y1="222" x2="530" y2="275" marker-end="url(#arrow)"/><ellipse cx="530" cy="300" rx="105" ry="32" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="530" y="305" text-anchor="middle">Alternatives and decision</text><line class="stroke" x1="465" y1="322" x2="410" y2="348" marker-end="url(#arrow)"/><ellipse cx="390" cy="370" rx="70" ry="32" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="sh" x="390" y="375" text-anchor="middle">Trial</text><path class="stroke" d="M 320,370 C 200,370 180,220 180,220" marker-end="url(#arrow)"/><text class="small" x="180" y="400" text-anchor="middle">What was learned</text><ellipse cx="250" cy="190" rx="95" ry="32" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="250" y="195" text-anchor="middle">Re-examination</text><line class="stroke" x1="285" y1="160" x2="335" y2="118" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
