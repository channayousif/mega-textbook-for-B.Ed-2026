<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تاملی چکر</title><desc id="d">تاملی چکر کا بہاؤ خاکہ ایک بند حلقے کے طور پر: بیان، تجزیہ، متبادل، فیصلہ، آزمائش، دوبارہ جانچ، اور واپسی کے تیر پر لکھا ہے 'کیا سیکھا اور آگے کیا آزمانا ہے'۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle" direction="rtl">تاملی چکر</text><text class="small" x="390" y="250" text-anchor="middle" direction="rtl">مسلسل بہتری</text><ellipse cx="390" cy="90" rx="90" ry="32" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="390" y="95" text-anchor="middle" direction="rtl">بیان</text><line class="stroke" x1="325" y1="112" x2="270" y2="170" marker-end="url(#arrow)"/><ellipse cx="250" cy="190" rx="85" ry="32" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="250" y="195" text-anchor="middle" direction="rtl">تجزیہ</text><line class="stroke" x1="250" y1="222" x2="250" y2="275" marker-end="url(#arrow)"/><ellipse cx="250" cy="300" rx="105" ry="32" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="250" y="305" text-anchor="middle" direction="rtl">متبادل اور فیصلہ</text><line class="stroke" x1="315" y1="322" x2="370" y2="348" marker-end="url(#arrow)"/><ellipse cx="390" cy="370" rx="70" ry="32" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="sh" x="390" y="375" text-anchor="middle" direction="rtl">آزمائش</text><path class="stroke" d="M 460,370 C 580,370 600,220 600,220" marker-end="url(#arrow)"/><text class="small" x="600" y="400" text-anchor="middle" direction="rtl">کیا سیکھا</text><ellipse cx="530" cy="190" rx="95" ry="32" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="530" y="195" text-anchor="middle" direction="rtl">دوبارہ جانچ</text><line class="stroke" x1="495" y1="160" x2="445" y2="118" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
