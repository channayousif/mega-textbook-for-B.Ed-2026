<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">خیالات کہاں سے آئے</title><desc id="d">ایک زمانی خاکہ جو دکھاتا ہے کہ تاملی مشق کے پیچھے کے خیالات کہاں سے آئے: Dewey (1933، تعلیم، تاملی فکر)، Schön (1983، پیشہ ورانہ مشق، عمل کے دوران غور و فکر)، Kolb (1984، تجرباتی تعلم، چکر)، Boud et al. (1985/2013، غور و فکر بطور تجربے کو سیکھنے میں بدلنا)، Brookfield (1995/2017، تنقیدی غور و فکر، چار عدسے)، اور ہر نقطے پر وہ میدان درج ہے جس سے وہ نکلا۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle" direction="rtl">خیالات کہاں سے آئے</text><line class="stroke" x1="720" y1="230" x2="60" y2="230"/><circle cx="660" cy="230" r="8" fill="var(--a1)"/><rect x="600" y="120" width="120" height="70" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="4"/><text class="sh" x="660" y="145" text-anchor="middle">Dewey</text><text class="small" x="660" y="160" text-anchor="middle">1933</text><text class="small" x="660" y="183" text-anchor="middle" direction="rtl">تعلیم</text><circle cx="540" cy="230" r="8" fill="var(--a2)"/><rect x="480" y="280" width="120" height="70" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="4"/><text class="sh" x="540" y="305" text-anchor="middle">Schön</text><text class="small" x="540" y="320" text-anchor="middle">1983</text><text class="small" x="540" y="343" text-anchor="middle" direction="rtl">پیشہ ورانہ مشق</text><circle cx="410" cy="230" r="8" fill="var(--a3)"/><rect x="350" y="120" width="120" height="70" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="4"/><text class="sh" x="410" y="145" text-anchor="middle">Kolb</text><text class="small" x="410" y="160" text-anchor="middle">1984</text><text class="small" x="410" y="183" text-anchor="middle" direction="rtl">تجرباتی تعلم</text><circle cx="280" cy="230" r="8" fill="var(--a4)"/><rect x="220" y="280" width="120" height="70" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2" rx="4"/><text class="sh" x="280" y="305" text-anchor="middle">Boud et al.</text><text class="small" x="280" y="320" text-anchor="middle">1985</text><text class="small" x="280" y="343" text-anchor="middle" direction="rtl">غور و فکر</text><circle cx="140" cy="230" r="8" fill="var(--a1)"/><rect x="80" y="120" width="120" height="70" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="4"/><text class="sh" x="140" y="145" text-anchor="middle">Brookfield</text><text class="small" x="140" y="160" text-anchor="middle">1995</text><text class="small" x="140" y="183" text-anchor="middle" direction="rtl">تنقیدی غور و فکر</text><text class="small" x="660" y="255" text-anchor="middle">1933</text><text class="small" x="540" y="255" text-anchor="middle">1983</text><text class="small" x="410" y="255" text-anchor="middle">1984</text><text class="small" x="280" y="255" text-anchor="middle">1985</text><text class="small" x="140" y="255" text-anchor="middle">1995</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
