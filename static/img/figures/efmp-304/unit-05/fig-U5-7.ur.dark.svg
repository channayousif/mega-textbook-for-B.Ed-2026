<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تاملی نمونوں کا موازنہ</title><desc id="d">ایک جدول جو نمونوں کا آمنے سامنے موازنہ کرتا ہے: مرحلے، ہر ایک کس کام کے لیے اچھا ہے، وقت کے لحاظ سے اس کی قیمت، وہ عام طور پر کیا چھوڑ دیتا ہے، اور وہ سیاق جس سے وہ آیا (Kolb/Gibbs: تعلیم اور نرسنگ؛ Brookfield: تعلیمِ بالغان؛ Schön: پیشہ ورانہ مشق)۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:10.5px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle" direction="rtl">تاملی نمونوں کا موازنہ</text><rect x="660" y="50" width="90" height="36" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><rect x="560" y="50" width="100" height="36" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><rect x="430" y="50" width="130" height="36" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><rect x="310" y="50" width="120" height="36" fill="var(--a4-fill)" stroke=