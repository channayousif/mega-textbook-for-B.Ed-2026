<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One incident, two models</title><desc id="d">Diagram showing one incident entering two models in parallel.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="30" text-anchor="middle">One incident, two models</text><rect x="310" y="55" width="160" height="50" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" rx="6"/><text class="sh" x="390" y="85" text-anchor="middle">The incident</text><line class="stroke" x1="330" y1="105" x2="170" y2="170" marker-end="url(#arrow)"/><line class="stroke" x1="450" y1="105" x2="610" y2="170" marker-end="url(#arrow)"/><rect x="40" y="175" width="260" height="230" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="6"/><text class="h" x="170" y="200" text-anchor="middle">Gibbs (6 stages)</text><rect x="55" y="215" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="233" text-anchor="middle">1. Description</text><rect x="55" y="248" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="266" text-anchor="middle">2. Feelings</text><rect x="55" y="281" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="299" text-anchor="middle">3. Evaluation</text><rect x="55" y="314" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="332" text-anchor="middle">4. Analysis</text><rect x="55" y="347" width="230" height="28" fill="none" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="365" text-anchor="middle">5. Conclusion</text><rect x="55" y="375" width="230" height="22" fill="var(--a1)" stroke="var(--a1)" stroke-width="1.5" rx="3"/><text class="small" x="170" y="390" text-anchor="middle" fill="var(--ink)">6. Action plan</text><rect x="480" y="175" width="260" height="230" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2" rx="6"/><text class="h" x="610" y="200" text-anchor="middle">Brookfield (4 lenses)</text><rect x="495" y="215" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="231" text-anchor="middle">1. Autobiographical</text><text class="small" x="610" y="245" text-anchor="middle">(own experience)</text><rect x="495" y="255" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="271" text-anchor="middle">2. Students' eyes</text><text class="small" x="610" y="285" text-anchor="middle">(learner perspective)</text><rect x="495" y="295" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="311" text-anchor="middle">3. Colleagues' views</text><text class="small" x="610" y="325" text-anchor="middle">(peer feedback)</text><rect x="495" y="335" width="230" height="35" fill="none" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="351" text-anchor="middle">4. Theoretical literature</text><text class="small" x="610" y="365" text-anchor="middle">(research and reading)</text><rect x="495" y="375" width="230" height="22" fill="var(--a3)" stroke="var(--a3)" stroke-width="1.5" rx="3"/><text class="small" x="610" y="390" text-anchor="middle" fill="var(--ink)">Challenged assumption</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
