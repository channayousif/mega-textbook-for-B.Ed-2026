<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Where the ideas came from</title><desc id="d">Timeline showing origins of reflective practice ideas.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">Where the ideas came from</text><line class="stroke" x1="60" y1="230" x2="720" y2="230"/><circle cx="120" cy="230" r="8" fill="var(--a1)"/><rect x="60" y="120" width="120" height="70" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2" rx="4"/><text class="sh" x="120" y="145" text-anchor="middle">Dewey</text><text class="small" x="120" y="162" text-anchor="middle">1933</text><text class="small" x="120" y="178" text-anchor="middle">Education</text><circle cx="240" cy="230" r="8" fill="var(--a2)"/><rect x="180" y="280" width="120" height="70" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2" rx="4"/><text class="sh" x=