<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">تاملی سال اور دہرایا ہوا سال</title><desc id="d">ایک جدول جو تدریس کے ایک ہی سال کو دو طرح گزارے جانے کا موازنہ کرتا ہے: ایک تاملی سال (کیا آزمایا گیا، کیا ہوا، کیا بدلا، کیا سیکھا) اور ایک دہرایا ہوا سال (کیا کیا گیا، کیا ہوا، اگلی بار بھی کیا ویسا ہی کیا جائے گا)، ٹرم بہ ٹرم۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="20" width="740" height="36" rx="4"/><text class="h" x="740" y="44" text-anchor="end">تاملی سال</text><text class="h" x="380" y="44" text-anchor="end">دہرایا ہوا سال</text><rect class="panel-a" x="400" y="64" width="360" height="100" rx="6"/><text x="740" y="90" text-anchor="end">ٹرم 1: نیا طریقہ آزمایا۔</text><text x="740" y="110" text-anchor="end">طلبہ کو مشکل ہوئی۔ وجہ ملی:</text><text x="740" y="130" text-anchor="end">پیشگی علم کی کمی۔ منصوبہ بدلا۔</text><text class="small" x="740" y="152" text-anchor="end">سیکھا: پہلے پیشگی علم جانچیں</text><rect class="panel-b" x="20" y="64" width="360" height="100" rx="6"/><text x="360" y="90" text-anchor="end">ٹرم 1: نیا طریقہ آزمایا۔</text><text x="360" y="110" text-anchor="end">طلبہ کو مشکل ہوئی۔ الزام انہیں دیا۔</text><text x="360" y="130" text-anchor="end">اگلے سال بھی وہی منصوبہ۔</text><text class="small" x="360" y="152" text-anchor="end">کچھ نہ سیکھا: معمول جاری ہے</text><rect class="panel-a" x="400" y="172" width="360" height="100" rx="6"/><text x="740" y="198" text-anchor="end">ٹرم 2: بدلا ہوا طریقہ اپنایا۔</text><text x="740" y="218" text-anchor="end">نتیجہ بہتر۔ کیا کام آیا اور کیوں،</text><text x="740" y="238" text-anchor="end">اگلی بار کے لیے لکھ لیا۔</text><text class="small" x="740" y="260" text-anchor="end">سیکھا: شہادت کی بنیاد پر بہتری</text><rect class="panel-b" x="20" y="172" width="360" height="100" rx="6"/><text x="360" y="198" text-anchor="end">ٹرم 2: پھر وہی طریقہ۔</text><text x="360" y="218" text-anchor="end">وہی نتیجہ۔ کوئی نوٹ نہیں۔</text><text x="360" y="238" text-anchor="end">اگلے سال بھی یہی کریں گے۔</text><text class="small" x="360" y="260" text-anchor="end">کچھ نہ سیکھا: تجربہ جانچا نہیں</text><rect class="panel-a" x="400" y="280" width="360" height="100" rx="6"/><text x="740" y="306" text-anchor="end">ٹرم 3: بہتر بنایا ہوا طریقہ۔</text><text x="740" y="326" text-anchor="end">ساتھی کو بتایا۔ جریدے میں لکھا:</text><text x="740" y="346" text-anchor="end">تین ٹرم کی بڑھوتری۔</text><text class="small" x="740" y="368" text-anchor="end">سیکھا: علم جمع کیا اور بانٹا</text><rect class="panel-b" x="20" y="280" width="360" height="100" rx="6"/><text x="360" y="306" text-anchor="end">ٹرم 3: پھر وہی طریقہ۔</text><text x="360" y="326" text-anchor="end">وہی نتیجہ۔ "میں نے ہمیشہ</text><text x="360" y="346" text-anchor="end">اسی طرح کیا ہے۔"</text><text class="small" x="360" y="368" text-anchor="end">کچھ نہ سیکھا: ایک سال تین بار</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
