<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three concentric layers of reflection</title><desc id="d">Three concentric layers: reflective thinking at the centre, the reflective process as the middle ring, and reflective practice as the outer ring, with what is added at each layer labelled.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="panel-c" cx="390" cy="235" rx="350" ry="210"/><text class="h" x="390" y="40" text-anchor="middle">Reflective practice</text><text class="small" x="390" y="58" text-anchor="middle">The process made habitual across a career</text><ellipse class="panel-b" cx="390" cy="235" rx="240" ry="150"/><text class="h" x="390" y="100" text-anchor="middle">Reflective process</text><text class="small" x="390" y="118" text-anchor="middle">Thinking made into a sequence of stages</text><ellipse class="panel-a" cx="390" cy="235" rx="130" ry="90"/><text class="h" x="390" y="228" text-anchor="middle">Reflective</text><text class="h" x="390" y="248" text-anchor="middle">thinking</text><text class="sh" x="60" y="170">+ noticing:</text><text class="small" x="60" y="188">"I saw something"</text><text class="sh" x="60" y="280">+ structure:</text><text class="small" x="60" y="298">a method, not a mood</text><text class="sh" x="500" y="400">+ sustainability:</text><text class="small" x="500" y="418">a professional stance</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
