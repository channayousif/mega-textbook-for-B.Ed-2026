<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Description against reflection</title><desc id="d">Table comparing description and reflection across four paired rows about the same lesson: what each says happened, why it happened, what to try next, and how to know it worked, with what the second does that the first does not noted.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="20" width="240" height="36" rx="4"/><text class="h" x="140" y="43" text-anchor="middle">Description says</text><rect class="panel-b" x="270" y="20" width="240" height="36" rx="4"/><text class="h" x="390" y="43" text-anchor="middle">Reflection says</text><rect class="panel-a" x="520" y="20" width="240" height="36" rx="4"/><text class="h" x="640" y="43" text-anchor="middle">What reflection adds</text><rect class="panel-a" x="20" y="64" width="240" height="80" rx="4"/><text x="40" y="92">The pupils did not</text><text x="40" y="110">understand the lesson.</text><text x="40" y="128">I explained again.</text><rect class="panel-b" x="270" y="64" width="240" height="80" rx="4"/><text x="290" y="92">The pupils did not</text><text x="290" y="110">understand. I assumed</text><text x="290" y="128">they had the prerequisite.</text><rect class="panel-a" x="520" y="64" width="240" height="80" rx="4"/><text x="540" y="92">Names the cause:</text><text x="540" y="110">missing prerequisite,</text><text x="540" y="128">not "pupils are weak"</text><rect class="panel-b" x="20" y="152" width="240" height="80" rx="4"/><text x="40" y="180">They still did not</text><text x="40" y="198">understand. I felt</text><text x="40" y="216">frustrated.</text><rect class="panel-a" x="270" y="152" width="240" height="80" rx="4"/><text x="290" y="180">They still did not</text><text x="290" y="198">understand. The last test</text><text x="290" y="216">only checked recall.</text><rect class="panel-b" x="520" y="152" width="240" height="80" rx="4"/><text x="540" y="180">Tests the assumption</text><text x="540" y="198">against evidence:</text><text x="540" y="216">test was unreliable proxy</text><rect class="panel-a" x="20" y="240" width="240" height="80" rx="4"/><text x="40" y="268">I will explain it</text><text x="40" y="286">again next time.</text><text x="40" y="304">I will try harder.</text><rect class="panel-b" x="270" y="240" width="240" height="80" rx="4"/><text x="290" y="268">I will check the</text><text x="290" y="286">prerequisite before I</text><text x="290" y="304">start, and use a better check.</text><rect class="panel-a" x="520" y="240" width="240" height="80" rx="4"/><text x="540" y="268">Specific, evidence-</text><text x="540" y="286">based plan, not a</text><text x="540" y="304">vague resolution</text><rect class="panel-b" x="20" y="328" width="240" height="80" rx="4"/><text x="40" y="356">No success criterion.</text><text x="40" y="374">Assumes it will be fine.</text><text x="40" y="392">Moves on.</text><rect class="panel-a" x="270" y="328" width="240" height="80" rx="4"/><text x="290" y="356">I will know it worked if</text><text x="290" y="374">the pupils who scored</text><text x="290" y="392">below 40 percent improve.</text><rect class="panel-b" x="520" y="328" width="240" height="80" rx="4"/><text x="540" y="356">Clear, testable success</text><text x="540" y="374">criterion. Reflection</text><text x="540" y="392">closes the loop.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
