<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">بیان اور تامل کا موازنہ</title><desc id="d">ایک جدول جو ایک ہی سبق کے بارے میں بیان اور غور و فکر کا چار جوڑا قطاروں میں موازنہ کرتا ہے: ہر ایک کے مطابق کیا ہوا، کیوں ہوا، آگے کیا آزمانا ہے، اور کیسے معلوم ہوگا کہ وہ کام آیا، اور ساتھ یہ درج ہے کہ دوسرا وہ کیا کرتا ہے جو پہلا نہیں کرتا۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="520" y="20" width="240" height="36" rx="4"/><text class="h" x="640" y="43" text-anchor="middle">بیان کیا کہتا ہے</text><rect class="panel-b" x="270" y="20" width="240" height="36" rx="4"/><text class="h" x="390" y="43" text-anchor="middle">تامل کیا کہتا ہے</text><rect class="panel-a" x="20" y="20" width="240" height="36" rx="4"/><text class="h" x="140" y="43" text-anchor="middle">تامل کا اضافہ</text><rect class="panel-a" x="520" y="64" width="240" height="80" rx="4"/><text x="740" y="92" text-anchor="end">طلبہ سبق</text><text x="740" y="110" text-anchor="end">نہیں سمجھے۔</text><text x="740" y="128" text-anchor="end">میں نے پھر سمجھایا۔</text><rect class="panel-b" x="270" y="64" width="240" height="80" rx="4"/><text x="490" y="92" text-anchor="end">طلبہ نہیں سمجھے۔</text><text x="490" y="110" text-anchor="end">میں نے فرض کیا تھا</text><text x="490" y="128" text-anchor="end">کہ انہیں پیشگی علم تھا۔</text><rect class="panel-a" x="20" y="64" width="240" height="80" rx="4"/><text x="240" y="92" text-anchor="end">وجہ کا نام:</text><text x="240" y="110" text-anchor="end">پیشگی علم کی کمی،</text><text x="240" y="128" text-anchor="end">نہ کہ "طلبہ کمزور ہیں"</text><rect class="panel-b" x="520" y="152" width="240" height="80" rx="4"/><text x="740" y="180" text-anchor="end">وہ پھر بھی</text><text x="740" y="198" text-anchor="end">نہیں سمجھے۔ میں</text><text x="740" y="216" text-anchor="end">مایوس ہوا۔</text><rect class="panel-a" x="270" y="152" width="240" height="80" rx="4"/><text x="490" y="180" text-anchor="end">وہ پھر بھی</text><text x="490" y="198" text-anchor="end">نہیں سمجھے۔ پچھلے ٹیسٹ</text><text x="490" y="216" text-anchor="end">نے صرف یادداشت جانچی۔</text><rect class="panel-b" x="20" y="152" width="240" height="80" rx="4"/><text x="240" y="180" text-anchor="end">مفروضے کو جانچتا ہے</text><text x="240" y="198" text-anchor="end">شہادت کی روشنی میں:</text><text x="240" y="216" text-anchor="end">ٹیسٹ ناقابلِ اعتبار اشارہ تھا</text><rect class="panel-a" x="520" y="240" width="240" height="80" rx="4"/><text x="740" y="268" text-anchor="end">اگلی بار میں</text><text x="740" y="286" text-anchor="end">پھر سمجھاؤں گا۔</text><text x="740" y="304" text-anchor="end">زیادہ کوشش کروں گا۔</text><rect class="panel-b" x="270" y="240" width="240" height="80" rx="4"/><text x="490" y="268" text-anchor="end">میں آغاز سے پہلے</text><text x="490" y="286" text-anchor="end">پیشگی علم جانچوں گا</text><text x="490" y="304" text-anchor="end">اور بہتر جانچ کروں گا۔</text><rect class="panel-a" x="20" y="240" width="240" height="80" rx="4"/><text x="240" y="268" text-anchor="end">مخصوص، شہادت پر</text><text x="240" y="286" text-anchor="end">مبنی منصوبہ،</text><text x="240" y="304" text-anchor="end">مبہم ارادہ نہیں</text><rect class="panel-b" x="520" y="328" width="240" height="80" rx="4"/><text x="740" y="356" text-anchor="end">کامیابی کی کسوٹی نہیں۔</text><text x="740" y="374" text-anchor="end">فرض ہے کہ ٹھیک ہو جائے گا۔</text><text x="740" y="392" text-anchor="end">آگے بڑھ جاتا ہے۔</text><rect class="panel-a" x="270" y="328" width="240" height="80" rx="4"/><text x="490" y="356" text-anchor="end">معلوم ہوگا کہ کام آیا اگر</text><text x="490" y="374" text-anchor="end">40 فی صد سے کم نمبر</text><text x="490" y="392" text-anchor="end">لینے والے طلبہ بہتر کریں۔</text><rect class="panel-b" x="20" y="328" width="240" height="80" rx="4"/><text x="240" y="356" text-anchor="end">واضح، قابلِ جانچ</text><text x="240" y="374" text-anchor="end">کامیابی کی کسوٹی۔ تامل</text><text x="240" y="392" text-anchor="end">چکر مکمل کرتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
