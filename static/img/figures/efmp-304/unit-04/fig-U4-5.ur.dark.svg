<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">مکمل تاملی عمل</title><desc id="d">تاملی عمل کا بہاؤ خاکہ: ٹوٹی ہوئی توقع سے بیان، پھر شہادت کے مقابل تجزیہ، پھر متبادل، پھر فیصلہ، پھر آزمائش، پھر دوبارہ جانچ، اور دوبارہ جانچ سے بیان کی طرف واپس جانے والا ایک تیر۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel-a" x="580" y="40" width="180" height="60" rx="8"/><text class="h" x="670" y="65" text-anchor="middle">ٹوٹی ہوئی</text><text class="h" x="670" y="82" text-anchor="middle">توقع</text><line class="stroke" x1="580" y1="70" x2="540" y2="70" marker-end="url(#arrow)"/><rect class="panel-b" x="400" y="40" width="140" height="60" rx="8"/><text class="h" x="470" y="65" text-anchor="middle">بیان</text><text class="small" x="470" y="82" text-anchor="middle">کیا ہوا؟</text><line class="stroke" x1="400" y1="70" x2="360" y2="70" marker-end="url(#arrow)"/><rect class="panel-c" x="200" y="40" width="160" height="60" rx="8"/><text class="h" x="280" y="65" text-anchor="middle">شہادت کی روشنی میں</text><text class="h" x="280" y="82" text-anchor="middle">تجزیہ</text><line class="stroke" x1="200" y1="70" x2="160" y2="70" marker-end="url(#arrow)"/><rect class="panel-a" x="20" y="140" width="160" height="60" rx="8"/><text class="h" x="100" y="165" text-anchor="middle">متبادل</text><text class="small" x="100" y="182" text-anchor="middle">اور کیا کام آ سکتا ہے؟</text><line class="stroke" x1="100" y1="200" x2="100" y2="240" marker-end="url(#arrow)"/><rect class="panel-b" x="100" y="240" width="180" height="60" rx="8"/><text class="h" x="190" y="265" text-anchor="middle">فیصلہ اور</text><text class="h" x="190" y="282" text-anchor="middle">آزمائش</text><line class="stroke" x1="280" y1="270" x2="320" y2="270" marker-end="url(#arrow)"/><rect class="panel-c" x="320" y="240" width="180" height="60" rx="8"/><text class="h" x="410" y="265" text-anchor="middle">دوبارہ جانچ</text><text class="small" x="410" y="282" text-anchor="middle">کام آیا؟ کیا سیکھا؟</text><path class="stroke-a" d="M500 270 C630 270 630 130 670 130" fill="none" marker-end="url(#arrow)"/><text class="small" x="620" y="120" text-anchor="middle">واپسی کا تیر:</text><text class="small" x="620" y="135" text-anchor="middle">دریافت واپس لائیں</text><text class="wm" x="12" y="460" aria-hidden="true" text-anchor="start">textbook.com.pk</text></svg>
