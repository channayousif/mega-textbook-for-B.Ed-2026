<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Activities that promote reflection</title><desc id="d">Diagram showing activities arranged by what they require: a solo reflection journal (solitude) for technical level, peer discussion (a colleague) for contextual, action research with pupils (a class) for dialectical, and reading theory (a text) for all levels.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="40" y="70">Technical</text><text class="h" x="40" y="180">Contextual</text><text class="h" x="40" y="290">Dialectical</text><text class="h" x="40" y="400">All levels</text><rect class="panel-a" x="160" y="40" width="400" height="60" rx="8"/><text x="180" y="65">Solo reflection journal</text><text class="small" x="180" y="83">Requires: solitude. What it produces: structured self-review.</text><rect class="panel-b" x="160" y="150" width="400" height="60" rx="8"/><text x="180" y="175">Peer discussion (critical friend)</text><text class="small" x="180" y="193">Requires: a colleague. What it produces: a different reading.</text><rect class="panel-c" x="160" y="260" width="400" height="60" rx="8"/><text x="180" y="285">Action research with pupils</text><text class="small" x="180" y="303">Requires: a class. What it produces: evidence from practice.</text><rect class="panel-d" x="160" y="370" width="400" height="60" rx="8"/><text x="180" y="395">Reading theory (Brookfield, Boud)</text><text class="small" x="180" y="413">Requires: a text. What it produces: names for what you assumed.</text><line class="stroke-a" x1="560" y1="70" x2="620" y2="70" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="180" x2="620" y2="180" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="290" x2="620" y2="290" marker-end="url(#arrow)"/><line class="stroke-a" x1="560" y1="400" x2="620" y2="400" marker-end="url(#arrow)"/><rect class="panel-a" x="620" y="40" width="140" height="60" rx="8"/><text class="small" x="690" y="65" text-anchor="middle">Private</text><text class="small" x="690" y="80" text-anchor="middle">reflection</text><rect class="panel-b" x="620" y="150" width="140" height="60" rx="8"/><text class="small" x="690" y="175" text-anchor="middle">Challenged</text><text class="small" x="690" y="190" text-anchor="middle">by others</text><rect class="panel-c" x="620" y="260" width="140" height="60" rx="8"/><text class="small" x="690" y="285" text-anchor="middle">Systematic</text><text class="small" x="690" y="300" text-anchor="middle">inquiry</text><rect class="panel-d" x="620" y="370" width="140" height="60" rx="8"/><text class="small" x="690" y="395" text-anchor="middle">All levels</text><text class="small" x="690" y="410" text-anchor="middle">reached</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
