<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The same year experienced twice</title><desc id="d">Table comparing the same year of teaching experienced twice: a reflective year against a repeated year, term by term.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:15px;font-weight:700;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="20" width="740" height="36" rx="4"/><text class="h" x="40" y="44">Reflective year</text><text class="h" x="400" y="44">Repeated year</text><rect class="panel-a" x="20" y="64" width="360" height="100" rx="6"/><text x="40" y="90">Term 1: New method tried.</text><text x="40" y="110">Pupils struggled. Cause found:</text><text x="40" y="130">prerequisite missing. Plan changed.</text><text class="small" x="40" y="152">Learning: check prerequisites first</text><rect class="panel-b" x="400" y="64" width="360" height="100" rx="6"/><text x="420" y="90">Term 1: New method tried.</text><text x="420" y="110">Pupils struggled. Blamed pupils.</text><text x="420" y="130">Same plan for next year.</text><text class="small" x="420" y="152">No learning: routine continues</text><rect class="panel-a" x="20" y="172" width="360" height="100" rx="6"/><text x="40" y="198">Term 2: Adapted method used.</text><text x="40" y="218">Better result. Recorded what</text><text x="40" y="238">worked and why for next time.</text><text class="small" x="40" y="260">Learning: evidence-based refinement</text><rect class="panel-b" x="400" y="172" width="360" height="100" rx="6"/><text x="420" y="198">Term 2: Same method again.</text><text x="420" y="218">Same result. No note made.</text><text x="420" y="238">Will do the same next year.</text><text class="small" x="420" y="260">No learning: experience not examined</text><rect class="panel-a" x="20" y="280" width="360" height="100" rx="6"/><text x="40" y="306">Term 3: Refined method.</text><text x="40" y="326">Shared with colleague. Journal</text><text x="40" y="346">entry: three terms of growth.</text><text class="small" x="40" y="368">Learning: accumulated and shared</text><rect class="panel-b" x="400" y="280" width="360" height="100" rx="6"/><text x="420" y="306">Term 3: Same method again.</text><text x="420" y="326">Same result. "I have always</text><text x="420" y="346">done it this way."</text><text class="small" x="420" y="368">No learning: one year, three times</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
