<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Reflective thinking, process and practice compared</title><desc id="d">Table comparing reflective thinking, the reflective process and reflective practice across four rows: what each names, its scope in time, what it adds to the previous layer, and a one-line marker of each.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .body{font-size:14px;fill:var(--ink);} .small{font-size:13px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="20" width="740" height="40" rx="6"/><text class="h" x="40" y="46">What it names</text><text class="h" x="220" y="46">Scope in time</text><text class="h" x="380" y="46">What it adds</text><text class="h" x="580" y="46">Marker</text><rect class="panel" x="20" y="68" width="740" height="90" rx="6"/><text class="sh" x="40" y="92">Reflective thinking</text><text class="body" x="40" y="112">Stepping back from an</text><text class="body" x="40" y="130">experience to learn from it</text><text class="body" x="220" y="105">A single moment</text><text class="body" x="220" y="125">or incident</text><text class="muted" x="380" y="105">The noticing:</text><text class="muted" x="380" y="125">"I saw something"</text><text class="small" x="580" y="105">"The pupils were</text><text class="small" x="580" y="122">confused. I should have</text><text class="small" x="580" y="139">used objects."</text><rect class="panel-b" x="20" y="166" width="740" height="90" rx="6"/><text class="sh" x="40" y="190">Reflective process</text><text class="body" x="40" y="210">Thinking made into a</text><text class="body" x="40" y="228">sequence of stages</text><text class="body" x="220" y="205">Across the cycle:</text><text class="body" x="220" y="225">description to re-examination</text><text class="muted" x="380" y="205">Structure:</text><text class="muted" x="380" y="225">a method, not a mood</text><text class="small" x="580" y="205">"I think the task was</text><text class="small" x="580" y="222">too open. Next time I will</text><text class="small" x="580" y="239">give a specific question."</text><rect class="panel-c" x="20" y="264" width="740" height="90" rx="6"/><text class="sh" x="40" y="288">Reflective practice</text><text class="body" x="40" y="308">The process made habitual</text><text class="body" x="40" y="326">across a career</text><text class="body" x="220" y="305">Across a term,</text><text class="body" x="220" y="325">a career</text><text class="muted" x="380" y="305">Sustainability:</text><text class="muted" x="380" y="325">a professional stance</text><text class="small" x="580" y="305">"Every Friday I write one</text><text class="small" x="580" y="322">thing that surprised me.</text><text class="small" x="580" y="339">Since September."</text><text class="small" x="40" y="380">Each layer contains the one before it and adds something: thinking notices, the process structures, practice sustains.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
