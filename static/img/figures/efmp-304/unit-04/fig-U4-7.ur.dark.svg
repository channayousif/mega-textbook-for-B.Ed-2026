<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">تامل کی تین سطحیں</title><desc id="d">تامل کی تین اقسام (فنی، سیاقی، جدلیاتی) کا جدول، ہر ایک کی ایک قطار، جس میں وہ سوال جو وہ پوچھتی ہے، وہ تبدیلی جو وہ پیدا کر سکتی ہے، اور ایک سطری مثال درج ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="640" y="20" width="120" height="40" rx="4"/><text class="h" x="700" y="45" text-anchor="middle">سطح</text><rect class="panel-b" x="380" y="20" width="250" height="40" rx="4"/><text class="h" x="505" y="45" text-anchor="middle">اس کا سوال</text><rect class="panel-c" x="190" y="20" width="180" height="40" rx="4"/><text class="h" x="280" y="45" text-anchor="middle">اس سے آنے والی تبدیلی</text><rect class="panel-a" x="20" y="20" width="160" height="40" rx="4"/><text class="h" x="100" y="45" text-anchor="middle">مثال</text><rect class="panel-a" x="640" y="68" width="120" height="100" rx="4"/><text class="h" x="700" y="105" text-anchor="middle">فنی</text><text class="small" x="700" y="125" text-anchor="middle">کیا تکنیک</text><text class="small" x="700" y="140" text-anchor="middle">کام آئی؟</text><rect class="panel-b" x="380" y="68" width="250" height="100" rx="4"/><text x="610" y="100" text-anchor="end">کیا حکمتِ عملی کام آئی،</text><text x="610" y="118" text-anchor="end">اور اسے بہتر کیسے کروں؟</text><text class="small" x="610" y="140" text-anchor="end">اس کے اپنے ہدف کے لحاظ سے</text><text class="small" x="610" y="155" text-anchor="end">تاثیر جانچتا ہے</text><rect class="panel-c" x="190" y="68" width="180" height="100" rx="4"/><text x="350" y="100" text-anchor="end">موجودہ منصوبوں پر</text><text x="350" y="118" text-anchor="end">بہتر عمل۔ تکنیک</text><text x="350" y="136" text-anchor="end">سنوارتا ہے، منصوبہ نہیں۔</text><rect class="panel-a" x="20" y="68" width="160" height="100" rx="4"/><text x="160" y="100" text-anchor="end">"گروہی کام میں ٹائمر</text><text x="160" y="118" text-anchor="end">اور واضح ہدایات</text><text x="160" y="136" text-anchor="end">استعمال کروں گا۔"</text><rect class="panel-b" x="640" y="176" width="120" height="100" rx="4"/><text class="h" x="700" y="213" text-anchor="middle">سیاقی</text><text class="small" x="700" y="233" text-anchor="middle">اور کیا</text><text class="small" x="700" y="248" text-anchor="middle">ہو رہا ہے؟</text><rect class="panel-c" x="380" y="176" width="250" height="100" rx="4"/><text x="610" y="208" text-anchor="end">اس تکنیک کے گرد کیا ہو رہا ہے</text><text x="610" y="226" text-anchor="end">جو مجھے نظر نہیں آیا؟</text><text x="610" y="244" text-anchor="end">کون سیکھ رہا ہے، کون نہیں؟</text><rect class="panel-a" x="190" y="176" width="180" height="100" rx="4"/><text x="350" y="208" text-anchor="end">صورت حال کی سمجھ</text><text x="350" y="226" text-anchor="end">بدلتی ہے۔ اکثر</text><text x="350" y="244" text-anchor="end">مداخلت بھی بدل جاتی ہے۔</text><rect class="panel-b" x="20" y="176" width="160" height="100" rx="4"/><text x="160" y="208" text-anchor="end">"خاموش طلبہ نظر سے</text><text x="160" y="226" text-anchor="end">اوجھل تھے۔ میں جواب</text><text x="160" y="244" text-anchor="end">دینے والوں کو پڑھاتا رہا۔"</text><rect class="panel-c" x="640" y="284" width="120" height="100" rx="4"/><text class="h" x="700" y="321" text-anchor="middle">جدلیاتی</text><text class="small" x="700" y="341" text-anchor="middle">میں کیا مفروضے</text><text class="small" x="700" y="356" text-anchor="middle">قائم کر رہا ہوں؟</text><rect class="panel-a" x="380" y="284" width="250" height="100" rx="4"/><text x="610" y="316" text-anchor="end">کون سے عقائد، اقدار یا اختیار</text><text x="610" y="334" text-anchor="end">کے تعلقات معمول کی نظر بناتے ہیں؟</text><text x="610" y="352" text-anchor="end">کس کے مفادات پورے ہوتے ہیں؟</text><rect class="panel-b" x="190" y="284" width="180" height="100" rx="4"/><text x="350" y="316" text-anchor="end">پیشہ ورانہ شناخت</text><text x="350" y="334" text-anchor="end">بدل سکتی ہے۔ تکنیک کے</text><text x="350" y="352" text-anchor="end">پیچھے مفروضہ جانچتا ہے۔</text><rect class="panel-c" x="20" y="284" width="160" height="100" rx="4"/><text x="160" y="316" text-anchor="end">"خاموشی کو اطمینان سمجھا۔</text><text x="160" y="334" text-anchor="end">یہ میرے تدریسی مخاطب</text><text x="160" y="352" text-anchor="end">کے بارے میں کیا بتاتا ہے؟"</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
