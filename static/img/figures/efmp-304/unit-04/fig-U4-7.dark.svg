<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three types of reflection</title><desc id="d">Table of the three types of reflection (technical, contextual, dialectical), one row each, with the question it asks, the kind of change it can produce, and a one-line example.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:13px;fill:var(--ink);} .h{font-size:14px;font-weight:700;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="20" width="120" height="40" rx="4"/><text class="h" x="80" y="45" text-anchor="middle">Level</text><rect class="panel-b" x="150" y="20" width="250" height="40" rx="4"/><text class="h" x="275" y="45" text-anchor="middle">Question it asks</text><rect class="panel-c" x="410" y="20" width="180" height="40" rx="4"/><text class="h" x="500" y="45" text-anchor="middle">Change it produces</text><rect class="panel-a" x="600" y="20" width="160" height="40" rx="4"/><text class="h" x="680" y="45" text-anchor="middle">Example</text><rect class="panel-a" x="20" y="68" width="120" height="100" rx="4"/><text class="h" x="80" y="105" text-anchor="middle">Technical</text><text class="small" x="80" y="125" text-anchor="middle">did the technique</text><text class="small" x="80" y="140" text-anchor="middle">work?</text><rect class="panel-b" x="150" y="68" width="250" height="100" rx="4"/><text x="162" y="91">Did the strategy work, and how</text><text x="162" y="108">can I make it work better?</text><text class="small" x="162" y="125">Judges effectiveness against</text><text class="small" x="162" y="142">its own goal</text><rect class="panel-c" x="410" y="68" width="180" height="100" rx="4"/><text x="422" y="91">Better execution of</text><text x="422" y="108">existing plans.</text><text x="422" y="125">Refines technique,</text><text x="422" y="142">not the plan.</text><rect class="panel-a" x="600" y="68" width="160" height="100" rx="4"/><text x="612" y="91">"I will use a</text><text x="612" y="108">timer and clearer</text><text x="612" y="125">instructions for</text><text x="612" y="142">group work."</text><rect class="panel-b" x="20" y="176" width="120" height="100" rx="4"/><text class="h" x="80" y="213" text-anchor="middle">Contextual</text><text class="small" x="80" y="233" text-anchor="middle">what else is</text><text class="small" x="80" y="248" text-anchor="middle">going on?</text><rect class="panel-c" x="150" y="176" width="250" height="100" rx="4"/><text x="162" y="199">What is going on around this</text><text x="162" y="216">technique that I have not been</text><text x="162" y="233">seeing? Who is learning, who</text><text x="162" y="250">is not?</text><rect class="panel-a" x="410" y="176" width="180" height="100" rx="4"/><text x="422" y="199">Changed understanding</text><text x="422" y="216">of the situation.</text><text x="422" y="233">Often leads to</text><text x="422" y="250">different</text><text x="422" y="267">intervention.</text><rect class="panel-b" x="600" y="176" width="160" height="100" rx="4"/><text x="612" y="199">"The quiet pupils</text><text x="612" y="216">have been</text><text x="612" y="233">invisible. I</text><text x="612" y="250">taught to the ones</text><text x="612" y="267">who answer."</text><rect class="panel-c" x="20" y="284" width="120" height="120" rx="4"/><text class="h" x="80" y="321" text-anchor="middle">Dialectical</text><text class="small" x="80" y="341" text-anchor="middle">what assumptions</text><text class="small" x="80" y="356" text-anchor="middle">am I making?</text><rect class="panel-a" x="150" y="284" width="250" height="120" rx="4"/><text x="162" y="307">What beliefs, values or power</text><text x="162" y="324">relations are shaping what I</text><text x="162" y="341">see as normal? Whose interests</text><text x="162" y="358">served?</text><rect class="panel-b" x="410" y="284" width="180" height="120" rx="4"/><text x="422" y="307">Can change</text><text x="422" y="324">professional</text><text x="422" y="341">identity. Questions</text><text x="422" y="358">the assumption</text><text x="422" y="375">beneath the</text><text x="422" y="392">technique.</text><rect class="panel-c" x="600" y="284" width="160" height="120" rx="4"/><text x="612" y="307">"I assumed quiet</text><text x="612" y="324">means content.</text><text x="612" y="341">What does that say</text><text x="612" y="358">about who I teach</text><text x="612" y="375">for?"</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
