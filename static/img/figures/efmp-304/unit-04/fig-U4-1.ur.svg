<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">تامل کی تین پرتوں کا موازنہ</title><desc id="d">ایک جدول جو تاملی سوچ، تاملی عمل اور تاملی مشق کا چار قطاروں میں موازنہ کرتا ہے: ہر ایک کس چیز کا نام ہے، وقت کے لحاظ سے اس کا دائرہ، وہ پچھلی پرت میں کیا اضافہ کرتی ہے، اور ہر ایک کی ایک سطری نشانی۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);} .ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:15px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:13px;font-weight:600;fill:var(--ink);} .body{font-size:13px;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="20" y="20" width="740" height="40" rx="6"/><text class="h" x="740" y="46" text-anchor="end">کس چیز کا نام ہے</text><text class="h" x="560" y="46" text-anchor="end">وقت کا دائرہ</text><text class="h" x="400" y="46" text-anchor="end">کیا اضافہ ہے</text><text class="h" x="200" y="46" text-anchor="end">نشانی</text><rect class="panel" x="20" y="68" width="740" height="90" rx="6"/><text class="sh" x="740" y="92" text-anchor="end">تاملی سوچ</text><text class="body" x="740" y="112" text-anchor="end">تجربے سے پیچھے ہٹ کر</text><text class="body" x="740" y="130" text-anchor="end">اس سے سیکھنا</text><text class="body" x="560" y="105" text-anchor="end">ایک لمحہ</text><text class="body" x="560" y="125" text-anchor="end">یا واقعہ</text><text class="muted" x="400" y="105" text-anchor="end">توجہ دینا:</text><text class="muted" x="400" y="125" text-anchor="end">"مجھے کچھ نظر آیا"</text><text class="small" x="200" y="105" text-anchor="end">"طلبہ الجھن میں تھے۔</text><text class="small" x="200" y="122" text-anchor="end">مجھے مجسم اشیا</text><text class="small" x="200" y="139" text-anchor="end">استعمال کرنی چاہیے تھیں۔"</text><rect class="panel-b" x="20" y="166" width="740" height="90" rx="6"/><text class="sh" x="740" y="190" text-anchor="end">تاملی عمل</text><text class="body" x="740" y="210" text-anchor="end">سوچ کو مرحلوں کی</text><text class="body" x="740" y="228" text-anchor="end">ترتیب میں ڈھالنا</text><text class="body" x="560" y="205" text-anchor="end">پورے چکر میں:</text><text class="body" x="560" y="225" text-anchor="end">بیان سے دوبارہ جانچ تک</text><text class="muted" x="400" y="205" text-anchor="end">ڈھانچا:</text><text class="muted" x="400" y="225" text-anchor="end">طریقہ، محض کیفیت نہیں</text><text class="small" x="200" y="205" text-anchor="end">"کام بہت کھلا تھا۔</text><text class="small" x="200" y="222" text-anchor="end">اگلی بار میں ایک</text><text class="small" x="200" y="239" text-anchor="end">مخصوص سوال دوں گا۔"</text><rect class="panel-c" x="20" y="264" width="740" height="90" rx="6"/><text class="sh" x="740" y="288" text-anchor="end">تاملی مشق</text><text class="body" x="740" y="308" text-anchor="end">پورے پیشہ ورانہ سفر میں</text><text class="body" x="740" y="326" text-anchor="end">عمل کو عادت بنانا</text><text class="body" x="560" y="305" text-anchor="end">ایک ٹرم،</text><text class="body" x="560" y="325" text-anchor="end">پورا پیشہ ورانہ سفر</text><text class="muted" x="400" y="305" text-anchor="end">تسلسل:</text><text class="muted" x="400" y="325" text-anchor="end">پیشہ ورانہ رویہ</text><text class="small" x="200" y="305" text-anchor="end">"ہر جمعہ ایک حیران</text><text class="small" x="200" y="322" text-anchor="end">کرنے والی بات لکھتا ہوں۔</text><text class="small" x="200" y="339" text-anchor="end">ستمبر سے یہ جاری ہے۔"</text><text class="small" x="740" y="380" text-anchor="end">ہر پرت پچھلی کو سمیٹ کر اضافہ کرتی ہے: سوچ توجہ دلاتی ہے، عمل ترتیب دیتا ہے، مشق تسلسل دیتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
