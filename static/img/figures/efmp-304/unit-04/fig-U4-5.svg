<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The reflective process end to end</title><desc id="d">Flowchart of the reflective process: disrupted expectation leading to description, then analysis against evidence, then alternatives, then decision, then trial, then re-examination, with an arrow returning from re-examination to description.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} text{font-size:13px;fill:var(--ink);text-anchor:middle;} .h{font-size:14px;font-weight:700;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel-a" x="20" y="40" width="180" height="60" rx="8"/><text class="h" x="110" y="65">Disrupted</text><text class="h" x="110" y="82">expectation</text><line class="stroke" x1="200" y1="70" x2="240" y2="70" marker-end="url(#arrow)"/><rect class="panel-b" x="240" y="40" width="140" height="60" rx="8"/><text class="h" x="310" y="65">Description</text><text class="small" x="310" y="82">What happened?</text><line class="stroke" x1="380" y1="70" x2="420" y2="70" marker-end="url(#arrow)"/><rect class="panel-c" x="420" y="40" width="160" height="60" rx="8"/><text class="h" x="500" y="65">Analysis against</text><text class="h" x="500" y="82">evidence</text><line class="stroke" x1="580" y1="70" x2="620" y2="70" marker-end="url(#arrow)"/><rect class="panel-a" x="600" y="140" width="160" height="60" rx="8"/><text class="h" x="680" y="165">Alternatives</text><text class="small" x="680" y="182">What else could work?</text><line class="stroke" x1="680" y1="200" x2="680" y2="240" marker-end="url(#arrow)"/><rect class="panel-b" x="500" y="240" width="180" height="60" rx="8"/><text class="h" x="590" y="265">Decision and</text><text class="h" x="590" y="282">trial</text><line class="stroke" x1="500" y1="270" x2="460" y2="270" marker-end="url(#arrow)"/><rect class="panel-c" x="280" y="240" width="180" height="60" rx="8"/><text class="h" x="370" y="265">Re-examination</text><text class="small" x="370" y="282">Did it work? What learned?</text><path class="stroke-a" d="M280,270 C150,270 150,130 110,130" fill="none" marker-end="url(#arrow)"/><text class="small" x="160" y="120">Return arrow:</text><text class="small" x="160" y="135">carry finding back</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
