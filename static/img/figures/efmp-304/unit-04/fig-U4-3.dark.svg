<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What reflection is claimed to buy</title><desc id="d">Concept map showing what reflection is claimed to buy: better instructional decisions, greater adaptability, improved problem-solving and professional growth, each branch marked with the evidence status of the claim (strong, moderate, limited, asserted).</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .muted{fill:var(--muted);} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2;} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:14px;fill:var(--ink);} .h{font-size:16px;font-weight:700;fill:var(--ink);} .sh{font-size:14px;font-weight:600;fill:var(--ink);} .small{font-size:12px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="520"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel" x="280" y="210" width="220" height="100" rx="8"/><text class="h" x="390" y="250" text-anchor="middle">Reflection</text><text class="small" x="390" y="270" text-anchor="middle">is claimed to buy</text><rect class="panel-a" x="40" y="40" width="220" height="80" rx="8"/><text class="sh" x="150" y="70" text-anchor="middle">Better instructional</text><text class="sh" x="150" y="90" text-anchor="middle">decisions</text><text class="small" x="150" y="108" text-anchor="middle">evidence: strong</text><line class="stroke-a" x1="260" y1="80" x2="280" y2="230" marker-end="url(#arrow)"/><rect class="panel-b" x="520" y="40" width="220" height="80" rx="8"/><text class="sh" x="630" y="70" text-anchor="middle">Greater</text><text class="sh" x="630" y="90" text-anchor="middle">adaptability</text><text class="small" x="630" y="108" text-anchor="middle">evidence: moderate</text><line class="stroke" x1="520" y1="80" x2="500" y2="230" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="380" width="220" height="80" rx="8"/><text class="sh" x="150" y="410" text-anchor="middle">Improved</text><text class="sh" x="150" y="430" text-anchor="middle">problem-solving</text><text class="small" x="150" y="448" text-anchor="middle">evidence: plausible</text><line class="stroke" x1="260" y1="420" x2="280" y2="290" marker-end="url(#arrow)"/><rect class="panel-d" x="520" y="380" width="220" height="80" rx="8"/><text class="sh" x="630" y="410" text-anchor="middle">Professional</text><text class="sh" x="630" y="430" text-anchor="middle">growth</text><text class="small" x="630" y="448" text-anchor="middle">evidence: asserted</text><line class="stroke" x1="520" y1="420" x2="500" y2="290" marker-end="url(#arrow)"/><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
