<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">تامل کو فروغ دینے والی سرگرمیاں</title><desc id="d">ایک خاکہ جو سرگرمیوں کو اس بنیاد پر ترتیب دیتا ہے کہ ہر ایک کو کیا درکار ہے: اکیلے رکھا جانے والا تاملی جریدہ (تنہائی) فنی سطح کے لیے، ساتھیوں سے گفتگو (ایک ساتھی) سیاقی کے لیے، طلبہ کے ساتھ ایکشن ریسرچ (ایک جماعت) جدلیاتی کے لیے، اور نظریہ پڑھنا (ایک متن) تمام سطحوں کے لیے۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg);}.ink{fill:var(--ink);} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none;} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none;} .muted{fill:var(--muted);} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2;} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2;} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2;} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2;} text{font-size:12px;fill:var(--ink);} .h{font-size:13px;font-weight:700;fill:var(--ink);} .small{font-size:11px;fill:var(--muted);} .wm{fill:var(--wm);font-size:11px;} .ah{fill:var(--ink);} </style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="740" y="70" text-anchor="end">فنی</text><text class="h" x="740" y="180" text-anchor="end">سیاقی</text><text class="h" x="740" y="290" text-anchor="end">جدلیاتی</text><text class="h" x="740" y="400" text-anchor="end">تمام سطحیں</text><rect class="panel-a" x="220" y="40" width="400" height="60" rx="8"/><text x="600" y="65" text-anchor="end">اکیلے تاملی جریدہ لکھنا</text><text class="small" x="600" y="83" text-anchor="end">درکار: تنہائی۔ حاصل: منظم خود جائزہ۔</text><rect class="panel-b" x="220" y="150" width="400" height="60" rx="8"/><text x="600" y="175" text-anchor="end">ساتھی سے گفتگو (تنقیدی دوست)</text><text class="small" x="600" y="193" text-anchor="end">درکار: ساتھی۔ حاصل: ایک مختلف تعبیر۔</text><rect class="panel-c" x="220" y="260" width="400" height="60" rx="8"/><text x="600" y="285" text-anchor="end">طلبہ کے ساتھ ایکشن ریسرچ</text><text class="small" x="600" y="303" text-anchor="end">درکار: جماعت۔ حاصل: عملی شہادت۔</text><rect class="panel-d" x="220" y="370" width="400" height="60" rx="8"/><text x="600" y="395" text-anchor="end">نظریہ پڑھنا (Brookfield، Boud)</text><text class="small" x="600" y="413" text-anchor="end">درکار: متن۔ حاصل: اپنے مفروضوں کے نام۔</text><line class="stroke-a" x1="220" y1="70" x2="160" y2="70" marker-end="url(#arrow)"/><line class="stroke" x1="220" y1="180" x2="160" y2="180" marker-end="url(#arrow)"/><line class="stroke" x1="220" y1="290" x2="160" y2="290" marker-end="url(#arrow)"/><line class="stroke-a" x1="220" y1="400" x2="160" y2="400" marker-end="url(#arrow)"/><rect class="panel-a" x="20" y="40" width="140" height="60" rx="8"/><text class="small" x="90" y="65" text-anchor="middle">ذاتی</text><text class="small" x="90" y="80" text-anchor="middle">تامل</text><rect class="panel-b" x="20" y="150" width="140" height="60" rx="8"/><text class="small" x="90" y="175" text-anchor="middle">دوسروں کی طرف</text><text class="small" x="90" y="190" text-anchor="middle">سے سوالات</text><rect class="panel-c" x="20" y="260" width="140" height="60" rx="8"/><text class="small" x="90" y="285" text-anchor="middle">منظم</text><text class="small" x="90" y="300" text-anchor="middle">تحقیق</text><rect class="panel-d" x="20" y="370" width="140" height="60" rx="8"/><text class="small" x="90" y="395" text-anchor="middle">تمام سطحوں</text><text class="small" x="90" y="410" text-anchor="middle">تک رسائی</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
