<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Argument against explanation, compared on four rows</title><desc id="d">Table comparing an argument and an explanation across four rows: what each takes for granted, what each is trying to achieve, what question each answers, and the test that separates them.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="820" height="470"/><rect class="panel" x="16" y="16" width="788" height="44" rx="4"/><text class="h c" x="142" y="44">Reading a piece of school prose</text><text class="h c" x="404" y="44">ARGUMENT</text><text class="h c" x="672" y="44">EXPLANATION</text><line class="grid" x1="16" y1="16" x2="804" y2="16"/><line class="grid" x1="16" y1="60" x2="804" y2="60"/><line class="grid" x1="16" y1="140" x2="804" y2="140"/><line class="grid" x1="16" y1="228" x2="804" y2="228"/><line class="grid" x1="16" y1="300" x2="804" y2="300"/><line class="grid" x1="16" y1="392" x2="804" y2="392"/><line class="grid" x1="268" y1="16" x2="268" y2="392"/><line class="grid" x1="540" y1="16" x2="540" y2="392"/><rect x="16" y="16" width="788" height="376" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="sh" x="28" y="104">What it takes for granted</text><text class="c" x="404" y="96">nothing about the conclusion:</text><text class="c" x="404" y="113">the conclusion is in dispute</text><text class="c" x="672" y="96">the thing explained:</text><text class="c" x="672" y="113">both sides already accept it</text><text class="sh" x="28" y="188">What it is trying to achieve</text><text class="c" x="404" y="180">acceptance of a claim</text><text class="c" x="404" y="197">you might otherwise doubt</text><text class="c" x="672" y="180">understanding of something</text><text class="c" x="672" y="197">you already grant</text><text class="sh" x="28" y="268">What question it answers</text><text class="c" x="404" y="268">"why should I accept this?"</text><text class="c" x="672" y="268">"why did this happen?"</text><text class="sh" x="28" y="350">The test that separates them</text><text class="c" x="404" y="342">the supported statement is</text><text class="c" x="404" y="359">NOT granted by the audience</text><text class="c" x="672" y="342">the supported statement IS</text><text class="c" x="672" y="359">granted by the audience</text><rect x="16" y="404" width="788" height="44" rx="4" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="28" y="432">Indicator words such as "because" appear in both, so they are a clue and never the test.</text><text class="wm" x="808" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>