<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار مختصر اسکولی عبارتوں کی جدول: دلیل، وضاحت، بیانیہ اور دعوی</title><desc id="d">چار مختصر اسکولی عبارتوں کی جدول: دلیل، وضاحت، بیانیہ اور دعوی۔ ہر ایک کے ساتھ درجہ بندی کی وجہ اور فیصلہ کن سوال دیا گیا ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><g transform="translate(900 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="900" height="470"/><rect x="16" y="16" width="868" height="34" rx="4" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="209" y="39" transform="translate(418 0) scale(-1 1)" text-anchor="middle">اسکولی زندگی کی مختصر عبارت</text><text class="h c" x="477" y="39" transform="translate(954 0) scale(-1 1)" text-anchor="middle">قسم</text><text class="h c" x="718" y="39" transform="translate(1436 0) scale(-1 1)" text-anchor="middle">وجہ اور فیصلہ کن سوال</text><text x="28" y="81" transform="translate(56 0) scale(-1 1)" text-anchor="end">«نصاب دیر سے مکمل ہوا، اور دیر سے</text><text x="28" y="99" transform="translate(56 0) scale(-1 1)" text-anchor="end">تکمیل نتائج گراتی ہے، اس لیے اگلے سال</text><text x="28" y="117" transform="translate(56 0) scale(-1 1)" text-anchor="end">پہلے شروع کرنا ہوگا۔»</text><rect x="410" y="79" width="134" height="32" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="477" y="100" transform="translate(954 0) scale(-1 1)" text-anchor="middle">دلیل</text><text class="m" x="564" y="81" transform="translate(1128 0) scale(-1 1)" text-anchor="start">دو بیان «پہلے شروع کرنا ہوگا»</text><text class="m" x="564" y="99" transform="translate(1128 0) scale(-1 1)" text-anchor="start">کی حمایت میں ہیں۔</text><text class="sh" x="564" y="117" transform="translate(1128 0) scale(-1 1)" text-anchor="start">حمایت یافتہ دعوی متنازع؟ ہاں۔</text><line class="grid" x1="16" y1="140" x2="884" y2="140"/><text x="28" y="171" transform="translate(56 0) scale(-1 1)" text-anchor="end">«نتائج گرے کیونکہ نصاب دیر سے</text><text x="28" y="189" transform="translate(56 0) scale(-1 1)" text-anchor="end">مکمل ہوا۔»</text><rect x="410" y="169" width="134" height="32" rx="6" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h c" x="477" y="190" transform="translate(954 0) scale(-1 1)" text-anchor="middle">وضاحت</text><text class="m" x="564" y="171" transform="translate(1128 0) scale(-1 1)" text-anchor="start">نتائج گرنے پر اختلاف نہیں؛</text><text class="m" x="564" y="189" transform="translate(1128 0) scale(-1 1)" text-anchor="start">فقرہ سبب بتاتا ہے۔</text><text class="sh" x="564" y="207" transform="translate(1128 0) scale(-1 1)" text-anchor="start">پہلے سے تسلیم شدہ؟ ہاں۔</text><line class="grid" x1="16" y1="230" x2="884" y2="230"/><text x="28" y="261" transform="translate(56 0) scale(-1 1)" text-anchor="end">«ہال میں 2 چلتے پنکھے اور 4 ایسے</text><text x="28" y="279" transform="translate(56 0) scale(-1 1)" text-anchor="end">ہیں جو نہیں گھومتے۔»</text><rect x="410" y="259" width="134" height="32" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h c" x="477" y="280" transform="translate(954 0) scale(-1 1)" text-anchor="middle">بیانیہ</text><text class="m" x="564" y="261" transform="translate(1128 0) scale(-1 1)" text-anchor="start">حالت کی خبر دیتا ہے؛</text><text class="m" x="564" y="279" transform="translate(1128 0) scale(-1 1)" text-anchor="start">کوئی متنازع دعوی نہیں۔</text><text class="sh" x="564" y="297" transform="translate(1128 0) scale(-1 1)" text-anchor="start">کسی بات کی حمایت؟ نہیں۔</text><line class="grid" x1="16" y1="320" x2="884" y2="320"/><text x="28" y="351" transform="translate(56 0) scale(-1 1)" text-anchor="end">«جماعت 1 میں گھر کا کام بے فائدہ ہے۔»</text><rect x="410" y="349" width="134" height="32" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h c" x="477" y="370" transform="translate(954 0) scale(-1 1)" text-anchor="middle">دعوی</text><text class="m" x="564" y="351" transform="translate(1128 0) scale(-1 1)" text-anchor="start">متنازع دعوی جس کے لیے</text><text class="m" x="564" y="369" transform="translate(1128 0) scale(-1 1)" text-anchor="start">کچھ پیش نہیں کیا گیا۔</text><text class="sh" x="564" y="387" transform="translate(1128 0) scale(-1 1)" text-anchor="start">کوئی حمایت؟ نہیں۔</text><rect x="16" y="16" width="868" height="394" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><line class="grid" x1="402" y1="16" x2="402" y2="410"/><line class="grid" x1="552" y1="16" x2="552" y2="410"/><text class="sh" x="28" y="436" transform="translate(56 0) scale(-1 1)" text-anchor="end">صرف پہلی قطار کے مقدمات کی نتیجے کی حمایت جانچ سکتے ہیں۔ باقی تین میں جانچنے کو مقدمات نہیں۔</text></g><text class="wm" x="888" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
