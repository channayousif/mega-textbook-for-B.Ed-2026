<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار اقسام کی جدول: ہر قطار میں روز گھر کا کام دینے کے ایک ہی دعوے کی حمایت الگ قسم سے کی گئی ہے، اور پیش کردہ حمایت اور مخصوص کمزوری درج ہیں</title><desc id="d">چار اقسام کی جدول: ہر قطار میں روز گھر کا کام دینے کے ایک ہی دعوے کی حمایت الگ قسم سے کی گئی ہے، اور پیش کردہ حمایت اور مخصوص کمزوری درج ہیں۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><g transform="translate(900 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="900" height="470"/><rect x="16" y="16" width="868" height="56" rx="4" class="panel"/><text class="h" x="28" y="40" transform="translate(56 0) scale(-1 1)" text-anchor="end">ایک دعوی: «گھر کا کام روز دینا چاہیے۔»</text><text class="m" x="28" y="62" transform="translate(56 0) scale(-1 1)" text-anchor="end">ایک نتیجہ، چار دلائل۔ ہر قطار کی الگ کمزوری ہے۔</text><rect x="16" y="72" width="868" height="32" rx="0" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="111" y="93" transform="translate(222 0) scale(-1 1)" text-anchor="middle">قسم</text><text class="h c" x="416" y="93" transform="translate(832 0) scale(-1 1)" text-anchor="middle">استاد کے الفاظ میں دلیل</text><text class="h c" x="755" y="93" transform="translate(1510 0) scale(-1 1)" text-anchor="middle">مخصوص کمزوری</text><text class="h c" x="111" y="146" transform="translate(222 0) scale(-1 1)" text-anchor="middle">شواہد سے</text><text x="218" y="136" transform="translate(436 0) scale(-1 1)" text-anchor="start">«روز کام دینے والے سیکشن کے وسط مدتی</text><text x="218" y="154" transform="translate(436 0) scale(-1 1)" text-anchor="start">نمبر 11 زیادہ تھے۔»</text><text class="m" x="638" y="136" transform="translate(1276 0) scale(-1 1)" text-anchor="start">سیکشنوں میں کام کے علاوہ بھی</text><text class="m" x="638" y="154" transform="translate(1276 0) scale(-1 1)" text-anchor="start">فرق تھے</text><line class="grid" x1="16" y1="180" x2="884" y2="180"/><text class="h c" x="111" y="222" transform="translate(222 0) scale(-1 1)" text-anchor="middle">تشبیہ سے</text><text x="218" y="212" transform="translate(436 0) scale(-1 1)" text-anchor="start">«روز مشق کرنے والا کھلاڑی بہتر کھیلتا ہے۔</text><text x="218" y="230" transform="translate(436 0) scale(-1 1)" text-anchor="start">شاگرد مختلف نہیں۔»</text><text class="m" x="638" y="212" transform="translate(1276 0) scale(-1 1)" text-anchor="start">ہنر کی مشق اور گھر کی تحریری</text><text class="m" x="638" y="230" transform="translate(1276 0) scale(-1 1)" text-anchor="start">مشق ایک چیز نہیں</text><line class="grid" x1="16" y1="256" x2="884" y2="256"/><text class="h c" x="111" y="298" transform="translate(222 0) scale(-1 1)" text-anchor="middle">سند سے</text><text x="218" y="288" transform="translate(436 0) scale(-1 1)" text-anchor="start">«ضلعی افسر نے سربراہوں سے کہا کہ روز</text><text x="218" y="306" transform="translate(436 0) scale(-1 1)" text-anchor="start">گھر کا کام نتائج بہتر کرتا ہے۔»</text><text class="m" x="638" y="288" transform="translate(1276 0) scale(-1 1)" text-anchor="start">سنی بات ہے، اصل قول نہیں،</text><text class="m" x="638" y="306" transform="translate(1276 0) scale(-1 1)" text-anchor="start">اور افسر محقق نہیں</text><line class="grid" x1="16" y1="332" x2="884" y2="332"/><text class="h c" x="111" y="374" transform="translate(222 0) scale(-1 1)" text-anchor="middle">پالیسی کی دلیل</text><text x="218" y="364" transform="translate(436 0) scale(-1 1)" text-anchor="start">«ہم دے سکتے ہیں، والدین چاہتے ہیں،</text><text x="218" y="382" transform="translate(436 0) scale(-1 1)" text-anchor="start">اور کچھ نہ کرنا ممکن نہیں۔»</text><text class="m" x="638" y="364" transform="translate(1276 0) scale(-1 1)" text-anchor="start">امکان ثابت ہے، متبادلوں سے</text><text class="m" x="638" y="382" transform="translate(1276 0) scale(-1 1)" text-anchor="start">بہتر ہونا نہیں</text><rect x="16" y="16" width="868" height="392" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><line class="grid" x1="206" y1="72" x2="206" y2="408"/><line class="grid" x1="626" y1="72" x2="626" y2="408"/><text class="sh" x="28" y="436" transform="translate(56 0) scale(-1 1)" text-anchor="end">اعداد مقدمے کی قسم ہیں، قوت کا نشان نہیں: اعداد اوپر والی قطار میں ہیں۔</text></g><text class="wm" x="888" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
