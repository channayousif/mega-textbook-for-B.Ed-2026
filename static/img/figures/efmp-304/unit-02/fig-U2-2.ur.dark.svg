<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">دلیل کی کلاسیکی شکل: دو مقدمات افقی استنتاجی لکیر کے اوپر اور نتیجہ نیچے</title><desc id="d">دلیل کی کلاسیکی شکل: دو مقدمات افقی استنتاجی لکیر کے اوپر اور نتیجہ نیچے۔ اساتذہ کے کمرے کی مثال میں ریاضی کا پرچہ نصاب سے باہر ہونے کی بنا پر جماعت کو دوبارہ پرچہ دینے کی اجازت کا نتیجہ نکالا گیا ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g transform="translate(780 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h c" x="390" y="34" transform="translate(780 0) scale(-1 1)" text-anchor="middle">کلاسیکی شکل: مقدمات لکیر کے اوپر، نتیجہ نیچے</text><rect x="90" y="56" width="600" height="62" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="106" y="80" transform="translate(212 0) scale(-1 1)" text-anchor="end">مقدمہ 1</text><text x="106" y="102" transform="translate(212 0) scale(-1 1)" text-anchor="end">پرچہ نصاب کی اجازت سے زیادہ مشکل تھا۔</text><rect x="90" y="128" width="600" height="62" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="106" y="152" transform="translate(212 0) scale(-1 1)" text-anchor="end">مقدمہ 2</text><text x="106" y="174" transform="translate(212 0) scale(-1 1)" text-anchor="end">نصاب سے باہر کا پرچہ پڑھائے گئے مواد کو نہیں ناپتا۔</text><line x1="70" y1="214" x2="710" y2="214" stroke="var(--ink)" stroke-width="4"/><text class="m" x="695" y="207" transform="translate(1390 0) scale(-1 1)" text-anchor="end">استنتاج:</text><text class="m" x="695" y="235" transform="translate(1390 0) scale(-1 1)" text-anchor="end">کیا قدم درست ہے؟</text><rect x="90" y="240" width="600" height="62" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="106" y="264" transform="translate(212 0) scale(-1 1)" text-anchor="end">نتیجہ</text><text x="106" y="286" transform="translate(212 0) scale(-1 1)" text-anchor="end">جماعت کو دوبارہ پرچہ دینے کی اجازت ملنی چاہیے۔</text><line x1="390" y1="190" x2="390" y2="212" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><line x1="390" y1="216" x2="390" y2="238" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><rect x="90" y="326" width="600" height="104" rx="6" class="panel"/><text class="h" x="106" y="352" transform="translate(212 0) scale(-1 1)" text-anchor="end">اس شکل میں کیوں لکھیں؟</text><text x="106" y="376" transform="translate(212 0) scale(-1 1)" text-anchor="end">1. مقدمہ 1 مان کر بھی مقدمہ 2 مسترد کر سکتے ہیں۔</text><text x="106" y="398" transform="translate(212 0) scale(-1 1)" text-anchor="end">2. دونوں مان کر بھی نتیجے تک قدم پر سوال کر سکتے ہیں۔</text><text x="106" y="420" transform="translate(212 0) scale(-1 1)" text-anchor="end">3. صفحے کی ترتیب، دلیل کی ترتیب نہیں۔</text></g><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
