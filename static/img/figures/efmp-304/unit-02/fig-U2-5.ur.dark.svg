<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشے کے مرکز میں دلیل کی اقسام اور چار شاخیں ہیں: شواہد سے دلیل، تشبیہ سے دلیل، سند سے دلیل اور پالیسی کی دلیل</title><desc id="d">تصوراتی نقشے کے مرکز میں دلیل کی اقسام اور چار شاخیں ہیں: شواہد سے دلیل، تشبیہ سے دلیل، سند سے دلیل اور پالیسی کی دلیل۔ ہر شاخ پر پیش کردہ حمایت اور مخصوص کمزوری لکھی ہے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g transform="translate(880 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="880" height="520"/><ellipse cx="440" cy="260" rx="104" ry="52" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h c" x="440" y="254" transform="translate(880 0) scale(-1 1)" text-anchor="middle">دلیل کی</text><text class="h c" x="440" y="274" transform="translate(880 0) scale(-1 1)" text-anchor="middle">اقسام</text><rect x="20" y="24" width="260" height="124" rx="8" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h" x="34" y="50" transform="translate(68 0) scale(-1 1)" text-anchor="end">شواہد سے</text><text class="m" x="34" y="74" transform="translate(68 0) scale(-1 1)" text-anchor="end">پیشکش: تعدادیں، ریکارڈ،</text><text class="m" x="34" y="90" transform="translate(68 0) scale(-1 1)" text-anchor="end">پیمائشیں</text><text x="34" y="116" transform="translate(68 0) scale(-1 1)" text-anchor="end">کمزوری: شواہد دعوے</text><text x="34" y="132" transform="translate(68 0) scale(-1 1)" text-anchor="end">سے متعلق نہ ہوں</text><line x1="260" y1="92" x2="350" y2="222" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><rect x="600" y="24" width="260" height="124" rx="8" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h" x="614" y="50" transform="translate(1228 0) scale(-1 1)" text-anchor="end">تشبیہ سے</text><text class="m" x="614" y="74" transform="translate(1228 0) scale(-1 1)" text-anchor="end">پیشکش: آسان معاملے</text><text class="m" x="614" y="90" transform="translate(1228 0) scale(-1 1)" text-anchor="end">کا فیصلہ</text><text x="614" y="116" transform="translate(1228 0) scale(-1 1)" text-anchor="end">کمزوری: متعلقہ فرق</text><text x="614" y="132" transform="translate(1228 0) scale(-1 1)" text-anchor="end">تقابل توڑ دے</text><line x1="600" y1="92" x2="530" y2="222" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><rect x="20" y="372" width="260" height="124" rx="8" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h" x="34" y="398" transform="translate(68 0) scale(-1 1)" text-anchor="end">سند سے</text><text class="m" x="34" y="422" transform="translate(68 0) scale(-1 1)" text-anchor="end">پیشکش: اہل ماخذ</text><text class="m" x="34" y="438" transform="translate(68 0) scale(-1 1)" text-anchor="end">کا بیان</text><text x="34" y="464" transform="translate(68 0) scale(-1 1)" text-anchor="end">کمزوری: شعبے سے باہر</text><text x="34" y="480" transform="translate(68 0) scale(-1 1)" text-anchor="end">یا مفاد رکھنے والا ہو</text><line x1="260" y1="404" x2="350" y2="300" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><rect x="600" y="372" width="260" height="124" rx="8" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="614" y="398" transform="translate(1228 0) scale(-1 1)" text-anchor="end">پالیسی کی دلیل</text><text class="m" x="614" y="422" transform="translate(1228 0) scale(-1 1)" text-anchor="end">پیشکش: ممکن، قابل قدر،</text><text class="m" x="614" y="438" transform="translate(1228 0) scale(-1 1)" text-anchor="end">متبادل بدتر</text><text x="614" y="464" transform="translate(1228 0) scale(-1 1)" text-anchor="end">کمزوری: امکان کو</text><text x="614" y="480" transform="translate(1228 0) scale(-1 1)" text-anchor="end">جواز سمجھ لیا جائے</text><line x1="600" y1="404" x2="530" y2="300" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><text class="m c" x="440" y="330" transform="translate(880 0) scale(-1 1)" text-anchor="middle">تیر باہر کو جاتے ہیں:</text><text class="m c" x="440" y="346" transform="translate(880 0) scale(-1 1)" text-anchor="middle">ہر شاخ دعوے کی حمایت کا ایک طریقہ ہے</text></g><text class="wm" x="868" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
