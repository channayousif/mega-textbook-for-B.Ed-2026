<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The rhetorical triangle, with the audience corner moved three ways</title><desc id="d">The rhetorical triangle drawn with speaker, audience and subject at the three corners and the message at the centre, showing that the same leave request takes a different shape when the audience corner changes from head teacher to colleague to parent.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="470"/><text class="h c" x="300" y="30">The rhetorical triangle</text><polygon points="300,60 500,390 100,390" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="212" y="36" width="176" height="34" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h c" x="300" y="58">SPEAKER</text><rect x="12" y="396" width="176" height="34" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h c" x="100" y="418">AUDIENCE</text><rect x="412" y="396" width="176" height="34" rx="6" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h c" x="500" y="418">SUBJECT</text><ellipse cx="300" cy="258" rx="92" ry="48" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="300" y="252">THE MESSAGE</text><text class="m c" x="300" y="272">held by all three</text><line x1="300" y1="72" x2="300" y2="208" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><line x1="150" y1="384" x2="238" y2="288" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><line x1="450" y1="384" x2="362" y2="288" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="h" x="612" y="30">Move the audience corner:</text><rect x="600" y="46" width="208" height="96" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="612" y="70">to the HEAD TEACHER</text><text class="m" x="612" y="94">can grant the leave</text><text class="h" x="612" y="122">so: an ARGUMENT</text><rect x="600" y="158" width="208" height="96" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="612" y="182">to the COLLEAGUE</text><text class="m" x="612" y="206">can only agree to cover</text><text class="h" x="612" y="234">so: a REQUEST and an offer</text><rect x="600" y="270" width="208" height="96" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="612" y="294">to the PARENTS</text><text class="m" x="612" y="318">can grant nothing</text><text class="h" x="612" y="346">so: an ANNOUNCEMENT</text><text class="m" x="600" y="408">Same fact, same three days.</text><text class="m" x="600" y="426">Only the audience moved.</text><text class="wm" x="808" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>