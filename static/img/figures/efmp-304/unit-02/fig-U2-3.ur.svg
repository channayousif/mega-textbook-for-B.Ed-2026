<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بلاغتی مثلث کے تین کونوں پر متکلم، سامع اور موضوع، اور مرکز میں پیغام ہے</title><desc id="d">بلاغتی مثلث کے تین کونوں پر متکلم، سامع اور موضوع، اور مرکز میں پیغام ہے۔ رخصت کی ایک ہی درخواست سامع کے سربراہ، ساتھی یا والدین ہونے سے مختلف شکل لیتی ہے۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><g transform="translate(820 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="820" height="470"/><text class="h c" x="300" y="30" transform="translate(600 0) scale(-1 1)" text-anchor="middle">بلاغتی مثلث</text><polygon points="300,60 500,390 100,390" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="212" y="36" width="176" height="34" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h c" x="300" y="58" transform="translate(600 0) scale(-1 1)" text-anchor="middle">متکلم</text><rect x="12" y="396" width="176" height="34" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h c" x="100" y="418" transform="translate(200 0) scale(-1 1)" text-anchor="middle">سامع</text><rect x="412" y="396" width="176" height="34" rx="6" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h c" x="500" y="418" transform="translate(1000 0) scale(-1 1)" text-anchor="middle">موضوع</text><ellipse cx="300" cy="258" rx="92" ry="48" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="300" y="252" transform="translate(600 0) scale(-1 1)" text-anchor="middle">پیغام</text><text class="m c" x="300" y="272" transform="translate(600 0) scale(-1 1)" text-anchor="middle">تینوں پر قائم</text><line x1="300" y1="72" x2="300" y2="208" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><line x1="150" y1="384" x2="238" y2="288" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><line x1="450" y1="384" x2="362" y2="288" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="h" x="612" y="30" transform="translate(1224 0) scale(-1 1)" text-anchor="end">سامع کا کونا بدلیں:</text><rect x="600" y="46" width="208" height="96" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="612" y="70" transform="translate(1224 0) scale(-1 1)" text-anchor="end">سربراہِ مدرسہ کے لیے</text><text class="m" x="612" y="94" transform="translate(1224 0) scale(-1 1)" text-anchor="end">رخصت منظور کر سکتا ہے</text><text class="h" x="612" y="122" transform="translate(1224 0) scale(-1 1)" text-anchor="end">اس لیے: دلیل</text><rect x="600" y="158" width="208" height="96" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="612" y="182" transform="translate(1224 0) scale(-1 1)" text-anchor="end">ساتھی کے لیے</text><text class="m" x="612" y="206" transform="translate(1224 0) scale(-1 1)" text-anchor="end">صرف کام سنبھال سکتا ہے</text><text class="h" x="612" y="234" transform="translate(1224 0) scale(-1 1)" text-anchor="end">اس لیے: درخواست اور پیشکش</text><rect x="600" y="270" width="208" height="96" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh" x="612" y="294" transform="translate(1224 0) scale(-1 1)" text-anchor="end">والدین کے لیے</text><text class="m" x="612" y="318" transform="translate(1224 0) scale(-1 1)" text-anchor="end">کچھ منظور نہیں کر سکتے</text><text class="h" x="612" y="346" transform="translate(1224 0) scale(-1 1)" text-anchor="end">اس لیے: اعلان</text><text class="m" x="600" y="408" transform="translate(1200 0) scale(-1 1)" text-anchor="end">حقیقت وہی، 3 دن وہی۔</text><text class="m" x="600" y="426" transform="translate(1200 0) scale(-1 1)" text-anchor="end">صرف سامع بدلا۔</text></g><text class="wm" x="808" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
