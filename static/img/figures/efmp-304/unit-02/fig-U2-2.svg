<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The classical form of an argument, filled in</title><desc id="d">The classical form of an argument drawn as two premises stacked above a horizontal inference bar with the conclusion beneath it, filled in with a staffroom argument that a mathematics paper went beyond the syllabus so the class should re-sit it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h c" x="390" y="34">Classical form: premises above the line, conclusion below</text><rect x="90" y="56" width="600" height="62" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="106" y="80">PREMISE 1</text><text x="106" y="102">The paper was harder than the syllabus allows.</text><rect x="90" y="128" width="600" height="62" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="sh" x="106" y="152">PREMISE 2</text><text x="106" y="174">A paper beyond the syllabus does not measure what was taught.</text><line x1="70" y1="214" x2="710" y2="214" stroke="var(--ink)" stroke-width="4"/><text class="m" x="718" y="210">the inference:</text><text class="m" x="718" y="226">is this step good?</text><rect x="90" y="240" width="600" height="62" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="106" y="264">CONCLUSION</text><text x="106" y="286">The class should be allowed to sit the paper again.</text><line x1="390" y1="190" x2="390" y2="212" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><line x1="390" y1="216" x2="390" y2="238" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><rect x="90" y="326" width="600" height="104" rx="6" class="panel"/><text class="h" x="106" y="352">Why set it out this way</text><text x="106" y="376">1. You can accept premise 1 and still reject premise 2.</text><text x="106" y="398">2. You can accept both and still question the step to the conclusion.</text><text x="106" y="420">3. Order on the page is not order in the argument.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>