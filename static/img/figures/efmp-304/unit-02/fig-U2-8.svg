<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four short school passages classified</title><desc id="d">Table of four short school passages, one labelled argument, one explanation, one description and one assertion, each with a column giving the reason for the label and the question that settles it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="900" height="470"/><rect x="16" y="16" width="868" height="34" rx="4" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="209" y="39">A short passage from school life</text><text class="h c" x="477" y="39">What it is</text><text class="h c" x="718" y="39">The reason, and the question that settles it</text><text x="28" y="81">"The syllabus was finished late, and late</text><text x="28" y="99">completion lowers results, so we must</text><text x="28" y="117">start earlier next year."</text><rect x="410" y="79" width="134" height="32" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="477" y="100">ARGUMENT</text><text class="m" x="564" y="81">two statements are offered in support</text><text class="m" x="564" y="99">of "we must start earlier".</text><text class="sh" x="564" y="117">Is the supported claim in dispute? Yes.</text><line class="grid" x1="16" y1="140" x2="884" y2="140"/><text x="28" y="171">"Results fell because the syllabus was</text><text x="28" y="189">finished late."</text><rect x="410" y="169" width="134" height="32" rx="6" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h c" x="477" y="190">EXPLANATION</text><text class="m" x="564" y="171">nobody disputes that results fell;</text><text class="m" x="564" y="189">the clause accounts for it.</text><text class="sh" x="564" y="207">Already granted? Yes.</text><line class="grid" x1="16" y1="230" x2="884" y2="230"/><text x="28" y="261">"The hall has two working fans and four</text><text x="28" y="279">that do not turn."</text><rect x="410" y="259" width="134" height="32" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h c" x="477" y="280">DESCRIPTION</text><text class="m" x="564" y="261">reports a state of affairs;</text><text class="m" x="564" y="279">no claim is in dispute.</text><text class="sh" x="564" y="297">Anything being supported? No.</text><line class="grid" x1="16" y1="320" x2="884" y2="320"/><text x="28" y="351">"Homework in grade 1 is pointless."</text><rect x="410" y="349" width="134" height="32" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h c" x="477" y="370">ASSERTION</text><text class="m" x="564" y="351">a disputed claim with nothing</text><text class="m" x="564" y="369">offered for it.</text><text class="sh" x="564" y="387">Any support present? None.</text><rect x="16" y="16" width="868" height="394" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><line class="grid" x1="402" y1="16" x2="402" y2="410"/><line class="grid" x1="552" y1="16" x2="552" y2="410"/><text class="sh" x="28" y="436">Only the first row can be asked whether its premises support its conclusion. The other three have no premises to test.</text><text class="wm" x="888" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>