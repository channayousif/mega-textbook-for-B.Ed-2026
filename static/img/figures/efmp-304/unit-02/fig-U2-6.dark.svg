<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One claim about homework argued four ways, one row per argument type</title><desc id="d">Table with one row for each of the four argument types, showing the same claim that homework should be set daily argued four ways, with the support offered and the characteristic failure of each row.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="900" height="470"/><rect x="16" y="16" width="868" height="56" rx="4" class="panel"/><text class="h" x="28" y="40">One claim: "Homework should be set daily."</text><text class="m" x="28" y="62">The same conclusion, argued four ways. Each row fails in its own way.</text><rect x="16" y="72" width="868" height="32" rx="0" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="111" y="93">TYPE</text><text class="h c" x="416" y="93">The argument as a teacher would say it</text><text class="h c" x="755" y="93">Characteristic failure</text><text class="h c" x="111" y="146">from evidence</text><text x="218" y="136">"The section that set daily homework scored</text><text x="218" y="154">eleven marks higher in the mid-term."</text><text class="m" x="638" y="136">the two sections differed in more</text><text class="m" x="638" y="154">than homework</text><line class="grid" x1="16" y1="180" x2="884" y2="180"/><text class="h c" x="111" y="222">from analogy</text><text x="218" y="212">"A cricketer who practises daily plays better.</text><text x="218" y="230">Pupils are no different."</text><text class="m" x="638" y="212">practice of a skill is not the same</text><text class="m" x="638" y="230">as written exercises at home</text><line class="grid" x1="16" y1="256" x2="884" y2="256"/><text class="h c" x="111" y="298">from authority</text><text x="218" y="288">"The district officer told the heads that daily</text><text x="218" y="306">homework raises results."</text><text class="m" x="638" y="288">reported, not quoted, and the</text><text class="m" x="638" y="306">officer is not a researcher</text><line class="grid" x1="16" y1="332" x2="884" y2="332"/><text class="h c" x="111" y="374">policy argument</text><text x="218" y="364">"We can set it, parents want it, and doing</text><text x="218" y="382">nothing is not an option."</text><text class="m" x="638" y="364">proves it is possible, not that</text><text class="m" x="638" y="382">it is better than alternatives</text><rect x="16" y="16" width="868" height="392" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><line class="grid" x1="206" y1="72" x2="206" y2="408"/><line class="grid" x1="626" y1="72" x2="626" y2="408"/><text class="sh" x="28" y="436">Numbers are a kind of premise, not a mark of strength: the top row is the one with figures in it.</text><text class="wm" x="888" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>