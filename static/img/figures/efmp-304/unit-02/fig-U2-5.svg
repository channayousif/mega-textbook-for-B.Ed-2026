<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Types of argument, with what each offers and how each fails</title><desc id="d">A concept map with types of argument at the centre and four branches, for argument from evidence, argument from analogy, argument from authority and policy argument, each branch labelled with what it offers as support and with its characteristic failure.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="520"/><ellipse cx="440" cy="260" rx="104" ry="52" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h c" x="440" y="254">TYPES OF</text><text class="h c" x="440" y="274">ARGUMENT</text><rect x="20" y="24" width="260" height="124" rx="8" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h" x="34" y="50">FROM EVIDENCE</text><text class="m" x="34" y="74">offers: counts, records,</text><text class="m" x="34" y="90">measurements</text><text x="34" y="116">fails when: the evidence</text><text x="34" y="132">does not bear on the claim</text><line x1="260" y1="92" x2="350" y2="222" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><rect x="600" y="24" width="260" height="124" rx="8" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="h" x="614" y="50">FROM ANALOGY</text><text class="m" x="614" y="74">offers: a judgement from</text><text class="m" x="614" y="90">an easier case</text><text x="614" y="116">fails when: a relevant</text><text x="614" y="132">difference breaks it</text><line x1="600" y1="92" x2="530" y2="222" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><rect x="20" y="372" width="260" height="124" rx="8" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h" x="34" y="398">FROM AUTHORITY</text><text class="m" x="34" y="422">offers: what a qualified</text><text class="m" x="34" y="438">source asserts</text><text x="34" y="464">fails when: outside its</text><text x="34" y="480">field, or not disinterested</text><line x1="260" y1="404" x2="350" y2="300" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><rect x="600" y="372" width="260" height="124" rx="8" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h" x="614" y="398">POLICY ARGUMENT</text><text class="m" x="614" y="422">offers: feasible, worth it,</text><text class="m" x="614" y="438">alternatives worse</text><text x="614" y="464">fails when: feasibility is</text><text x="614" y="480">treated as justification</text><line x1="600" y1="404" x2="530" y2="300" stroke="var(--line)" stroke-width="2" marker-start="url(#ar)"/><text class="m c" x="440" y="330">arrows run outward:</text><text class="m c" x="440" y="346">each branch is one way to support a claim</text><text class="wm" x="868" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>