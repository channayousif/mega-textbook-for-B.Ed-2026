<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Locating the conclusion of a passage</title><desc id="d">A flowchart for locating a conclusion, running from indicator words through the test of asking what the passage is trying to get the reader to accept, then to the support relation, ending in the conclusion or in a finding that nothing is supported.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .dia{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="520"/><rect class="panel" x="300" y="14" width="236" height="44" rx="6"/><text class="h c" x="418" y="42">Take a passage</text><line x1="418" y1="58" x2="418" y2="76" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><polygon points="418,78 540,124 418,170 296,124" class="dia"/><text class="h c" x="418" y="118">Any indicator word?</text><text class="m c" x="418" y="136">"therefore", "so", "because"</text><line x1="296" y1="124" x2="200" y2="124" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="m" x="222" y="114">no</text><line x1="540" y1="124" x2="636" y2="124" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="m" x="556" y="114">yes</text><rect x="636" y="100" width="172" height="48" rx="6" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="2"/><text class="sh c" x="722" y="120">note it as a clue</text><text class="m c" x="722" y="138">do not trust it yet</text><rect x="20" y="100" width="180" height="48" rx="6" class="panel"/><text class="m c" x="110" y="120">no clue available</text><text class="m c" x="110" y="138">go straight to the test</text><line x1="722" y1="148" x2="722" y2="196" stroke="var(--line)" stroke-width="2"/><line x1="110" y1="148" x2="110" y2="196" stroke="var(--line)" stroke-width="2"/><line x1="110" y1="196" x2="722" y2="196" stroke="var(--line)" stroke-width="2"/><line x1="418" y1="196" x2="418" y2="216" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><rect x="226" y="218" width="384" height="56" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="3"/><text class="h c" x="418" y="242">THE TEST</text><text class="c" x="418" y="262">"What is this trying to get me to accept?"</text><line x1="418" y1="274" x2="418" y2="294" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><polygon points="418,296 568,344 418,392 268,344" class="dia"/><text class="h c" x="418" y="338">Is any other statement</text><text class="h c" x="418" y="356">offered to support it?</text><line x1="568" y1="344" x2="650" y2="420" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="m" x="586" y="394">yes</text><rect x="560" y="422" width="248" height="56" rx="6" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="h c" x="684" y="446">THAT IS THE CONCLUSION</text><text class="m c" x="684" y="466">the rest are its premises</text><line x1="268" y1="344" x2="186" y2="420" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="m" x="212" y="394">no</text><rect x="20" y="422" width="248" height="56" rx="6" fill="var(--a2-fill)" stroke="var(--a2)" stroke-width="2"/><text class="h c" x="144" y="446">NOTHING IS SUPPORTED</text><text class="m c" x="144" y="466">assertion, description or notice</text><line x1="418" y1="392" x2="418" y2="420" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/><text class="m c" x="418" y="410">cannot tell</text><rect x="296" y="422" width="236" height="56" rx="6" fill="var(--a4-fill)" stroke="var(--a4)" stroke-width="2"/><text class="h c" x="414" y="446">UNDECIDABLE</text><text class="m c" x="414" y="466">say so, and what would settle it</text><text class="wm" x="808" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>