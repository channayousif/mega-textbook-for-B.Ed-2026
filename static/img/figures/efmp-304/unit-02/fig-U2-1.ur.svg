<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار قطاروں میں دلیل اور وضاحت کا تقابل: ہر ایک کیا تسلیم شدہ سمجھتی ہے، کیا حاصل کرنا چاہتی ہے، کس سوال کا جواب دیتی ہے، اور دونوں میں فرق کرنے والی کسوٹی</title><desc id="d">چار قطاروں میں دلیل اور وضاحت کا تقابل: ہر ایک کیا تسلیم شدہ سمجھتی ہے، کیا حاصل کرنا چاہتی ہے، کس سوال کا جواب دیتی ہے، اور دونوں میں فرق کرنے والی کسوٹی۔</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><g transform="translate(820 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="820" height="470"/><rect class="panel" x="16" y="16" width="788" height="44" rx="4"/><text class="h c" x="142" y="44" transform="translate(284 0) scale(-1 1)" text-anchor="middle">اسکولی متن کا مطالعہ</text><text class="h c" x="404" y="44" transform="translate(808 0) scale(-1 1)" text-anchor="middle">دلیل</text><text class="h c" x="672" y="44" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">وضاحت</text><line class="grid" x1="16" y1="16" x2="804" y2="16"/><line class="grid" x1="16" y1="60" x2="804" y2="60"/><line class="grid" x1="16" y1="140" x2="804" y2="140"/><line class="grid" x1="16" y1="228" x2="804" y2="228"/><line class="grid" x1="16" y1="300" x2="804" y2="300"/><line class="grid" x1="16" y1="392" x2="804" y2="392"/><line class="grid" x1="268" y1="16" x2="268" y2="392"/><line class="grid" x1="540" y1="16" x2="540" y2="392"/><rect x="16" y="16" width="788" height="376" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="sh" x="28" y="104" transform="translate(56 0) scale(-1 1)" text-anchor="end">کیا تسلیم شدہ ہے؟</text><text class="c" x="404" y="96" transform="translate(808 0) scale(-1 1)" text-anchor="middle">نتیجے کو تسلیم نہیں کیا گیا:</text><text class="c" x="404" y="113" transform="translate(808 0) scale(-1 1)" text-anchor="middle">نتیجہ متنازع ہے</text><text class="c" x="672" y="96" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">جس بات کی وضاحت ہو:</text><text class="c" x="672" y="113" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">دونوں پہلے ہی تسلیم کرتے ہیں</text><text class="sh" x="28" y="188" transform="translate(56 0) scale(-1 1)" text-anchor="end">مقصد کیا ہے؟</text><text class="c" x="404" y="180" transform="translate(808 0) scale(-1 1)" text-anchor="middle">ایسا دعوی قبول کروانا</text><text class="c" x="404" y="197" transform="translate(808 0) scale(-1 1)" text-anchor="middle">جس پر ورنہ شک ہو</text><text class="c" x="672" y="180" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">ایسی بات سمجھانا</text><text class="c" x="672" y="197" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">جو پہلے سے تسلیم ہو</text><text class="sh" x="28" y="268" transform="translate(56 0) scale(-1 1)" text-anchor="end">کس سوال کا جواب؟</text><text class="c" x="404" y="268" transform="translate(808 0) scale(-1 1)" text-anchor="middle">«میں اسے کیوں قبول کروں؟»</text><text class="c" x="672" y="268" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">«یہ کیوں ہوا؟»</text><text class="sh" x="28" y="350" transform="translate(56 0) scale(-1 1)" text-anchor="end">فرق کی کسوٹی</text><text class="c" x="404" y="342" transform="translate(808 0) scale(-1 1)" text-anchor="middle">حمایت یافتہ بیان سامع کو</text><text class="c" x="404" y="359" transform="translate(808 0) scale(-1 1)" text-anchor="middle">پہلے سے تسلیم نہیں</text><text class="c" x="672" y="342" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">حمایت یافتہ بیان سامع کو</text><text class="c" x="672" y="359" transform="translate(1344 0) scale(-1 1)" text-anchor="middle">پہلے سے تسلیم ہے</text><rect x="16" y="404" width="788" height="44" rx="4" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="28" y="432" transform="translate(56 0) scale(-1 1)" text-anchor="end">«کیونکہ» دونوں میں آتا ہے، اس لیے سراغ ہے، کسوٹی ہرگز نہیں۔</text></g><text class="wm" x="808" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
