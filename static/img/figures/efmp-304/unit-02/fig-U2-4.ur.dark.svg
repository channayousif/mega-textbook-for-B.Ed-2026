<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ جوڑوں کی جدول: ہر قطار میں ایک معلوماتی اور ایک مسئلے کا اسکولی سوال، اور ان سے کیا طے ہو سکتا ہے اور کیا نہیں، اس کے خانے</title><desc id="d">پانچ جوڑوں کی جدول: ہر قطار میں ایک معلوماتی اور ایک مسئلے کا اسکولی سوال، اور ان سے کیا طے ہو سکتا ہے اور کیا نہیں، اس کے خانے۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700;fill:var(--ink)} .sh{font-size:11px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><g transform="translate(900 0) scale(-1 1)"><rect class="bg" x="0" y="0" width="900" height="470"/><rect x="16" y="16" width="868" height="40" rx="4" class="panel"/><text class="h c" x="138" y="42" transform="translate(276 0) scale(-1 1)" text-anchor="middle">معلوماتی سوال</text><text class="h c" x="396" y="42" transform="translate(792 0) scale(-1 1)" text-anchor="middle">مسئلے کا سوال</text><text class="h c" x="618" y="42" transform="translate(1236 0) scale(-1 1)" text-anchor="middle">جانچ سے طے ہوتا ہے</text><text class="h c" x="794" y="42" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">اس طرح طے نہیں ہوتا کیونکہ</text><text class="c" x="138" y="85" transform="translate(276 0) scale(-1 1)" text-anchor="middle">7-B میں کتنے شاگرد</text><text class="c" x="138" y="103" transform="translate(276 0) scale(-1 1)" text-anchor="middle">ہیں؟</text><text class="c" x="396" y="85" transform="translate(792 0) scale(-1 1)" text-anchor="middle">کیا 7-B کو دو حصوں میں</text><text class="c" x="396" y="103" transform="translate(792 0) scale(-1 1)" text-anchor="middle">بانٹنا چاہیے؟</text><text class="c m" x="618" y="94" transform="translate(1236 0) scale(-1 1)" text-anchor="middle">حاضری رجسٹر</text><text class="c m" x="794" y="94" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">«چاہیے» فیصلہ مانگتا ہے</text><line class="grid" x1="16" y1="124" x2="884" y2="124"/><text class="c" x="138" y="153" transform="translate(276 0) scale(-1 1)" text-anchor="middle">سرکلر کس تاریخ کو</text><text class="c" x="138" y="171" transform="translate(276 0) scale(-1 1)" text-anchor="middle">آیا؟</text><text class="c" x="396" y="153" transform="translate(792 0) scale(-1 1)" text-anchor="middle">کیا سرکلر</text><text class="c" x="396" y="171" transform="translate(792 0) scale(-1 1)" text-anchor="middle">معقول تھا؟</text><text class="c m" x="618" y="162" transform="translate(1236 0) scale(-1 1)" text-anchor="middle">وصولی کی مہر</text><text class="c m" x="794" y="153" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">«معقول» کی تعریف</text><text class="c m" x="794" y="171" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">درکار ہے</text><line class="grid" x1="16" y1="192" x2="884" y2="192"/><text class="c" x="138" y="221" transform="translate(276 0) scale(-1 1)" text-anchor="middle">سائنس کے کتنے</text><text class="c" x="138" y="239" transform="translate(276 0) scale(-1 1)" text-anchor="middle">پیریڈ ہیں؟</text><text class="c" x="396" y="221" transform="translate(792 0) scale(-1 1)" text-anchor="middle">کیا سائنس کے پیریڈ</text><text class="c" x="396" y="239" transform="translate(792 0) scale(-1 1)" text-anchor="middle">زیادہ ہوں؟</text><text class="c m" x="618" y="230" transform="translate(1236 0) scale(-1 1)" text-anchor="middle">نظام الاوقات</text><text class="c m" x="794" y="221" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">سائنس کو باقی مضامین</text><text class="c m" x="794" y="239" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">کے مقابل تولنا ہے</text><line class="grid" x1="16" y1="260" x2="884" y2="260"/><text class="c" x="138" y="289" transform="translate(276 0) scale(-1 1)" text-anchor="middle">گزشتہ سال کامیابی کی</text><text class="c" x="138" y="307" transform="translate(276 0) scale(-1 1)" text-anchor="middle">شرح کیا تھی؟</text><text class="c" x="396" y="298" transform="translate(792 0) scale(-1 1)" text-anchor="middle">کیا ہماری تدریس اچھی ہے؟</text><text class="c m" x="618" y="298" transform="translate(1236 0) scale(-1 1)" text-anchor="middle">نتائج کی فہرست</text><text class="c m" x="794" y="289" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">«اچھی» متنازع</text><text class="c m" x="794" y="307" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">لفظ ہے</text><line class="grid" x1="16" y1="328" x2="884" y2="328"/><text class="c" x="138" y="357" transform="translate(276 0) scale(-1 1)" text-anchor="middle">کیا جمعرات کی ڈیوٹی</text><text class="c" x="138" y="375" transform="translate(276 0) scale(-1 1)" text-anchor="middle">فہرست میں ہے؟</text><text class="c" x="396" y="366" transform="translate(792 0) scale(-1 1)" text-anchor="middle">کیا ڈیوٹی کی تقسیم منصفانہ ہے؟</text><text class="c m" x="618" y="366" transform="translate(1236 0) scale(-1 1)" text-anchor="middle">ڈیوٹی فہرست</text><text class="c m" x="794" y="357" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">«منصفانہ» فیصلہ ہے،</text><text class="c m" x="794" y="375" transform="translate(1588 0) scale(-1 1)" text-anchor="middle">گنتی نہیں</text><rect x="16" y="16" width="868" height="380" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><line class="grid" x1="260" y1="16" x2="260" y2="396"/><line class="grid" x1="532" y1="16" x2="532" y2="396"/><line class="grid" x1="704" y1="16" x2="704" y2="396"/><rect x="16" y="410" width="868" height="40" rx="4" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="28" y="435" transform="translate(56 0) scale(-1 1)" text-anchor="end">دلائل مسئلے کے سوال کے خانے کے لیے ہیں۔ اسے حقیقت کا سوال بنانا اسکولی استدلال کو غلط رخ دیتا ہے۔</text></g><text class="wm" x="888" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
