<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Information questions paired with issue questions</title><desc id="d">Table of five paired school questions, one information question and one issue question in each row, with a column for what each kind of question can settle and a column for what it cannot.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25} text{font-size:13px;fill:var(--ink)} .h{font-size:13px;font-weight:700;fill:var(--ink)} .sh{font-size:12px;font-weight:600;fill:var(--ink)} .m{font-size:12px;fill:var(--muted)} .c{text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="900" height="470"/><rect x="16" y="16" width="868" height="40" rx="4" class="panel"/><text class="h c" x="138" y="42">INFORMATION QUESTION</text><text class="h c" x="396" y="42">ISSUE QUESTION</text><text class="h c" x="618" y="42">Settled by checking</text><text class="h c" x="794" y="42">Not settled that way because</text><text class="c" x="138" y="85">How many pupils are in</text><text class="c" x="138" y="103">7-B?</text><text class="c" x="396" y="85">Should 7-B be split in</text><text class="c" x="396" y="103">two?</text><text class="c m" x="618" y="94">the attendance register</text><text class="c m" x="794" y="94">"should" needs a judgement</text><line class="grid" x1="16" y1="124" x2="884" y2="124"/><text class="c" x="138" y="153">What date did the</text><text class="c" x="138" y="171">circular arrive?</text><text class="c" x="396" y="153">Was the circular</text><text class="c" x="396" y="171">reasonable?</text><text class="c m" x="618" y="162">the dispatch stamp</text><text class="c m" x="794" y="153">"reasonable" has to be</text><text class="c m" x="794" y="171">defined</text><line class="grid" x1="16" y1="192" x2="884" y2="192"/><text class="c" x="138" y="221">How many periods go to</text><text class="c" x="138" y="239">science?</text><text class="c" x="396" y="221">Should science have more</text><text class="c" x="396" y="239">periods?</text><text class="c m" x="618" y="230">the timetable</text><text class="c m" x="794" y="221">it weighs science</text><text class="c m" x="794" y="239">against the rest</text><line class="grid" x1="16" y1="260" x2="884" y2="260"/><text class="c" x="138" y="289">What were last year's</text><text class="c" x="138" y="307">pass rates?</text><text class="c" x="396" y="298">Is our teaching good?</text><text class="c m" x="618" y="298">the result sheet</text><text class="c m" x="794" y="289">"good" is the contested</text><text class="c m" x="794" y="307">word</text><line class="grid" x1="16" y1="328" x2="884" y2="328"/><text class="c" x="138" y="357">Is Thursday duty in the</text><text class="c" x="138" y="375">roster?</text><text class="c" x="396" y="366">Is the duty share fair?</text><text class="c m" x="618" y="366">the duty roster</text><text class="c m" x="794" y="357">"fair" is a judgement,</text><text class="c m" x="794" y="375">not a count</text><rect x="16" y="16" width="868" height="380" rx="4" fill="none" stroke="var(--ink)" stroke-width="2"/><line class="grid" x1="260" y1="16" x2="260" y2="396"/><line class="grid" x1="532" y1="16" x2="532" y2="396"/><line class="grid" x1="704" y1="16" x2="704" y2="396"/><rect x="16" y="410" width="868" height="40" rx="4" fill="var(--a1-fill)" stroke="var(--a1)" stroke-width="2"/><text class="sh" x="28" y="435">Arguments belong to the right-hand column. An issue question dressed as a factual one is where school reasoning goes wrong.</text><text class="wm" x="888" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>