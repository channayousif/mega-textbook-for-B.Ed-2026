<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five algebra vocabulary terms</title><desc id="d">Table of five algebra vocabulary terms with a plain meaning and a classroom example for each.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="150" y="82" text-anchor="middle">Term</text><text class="h" x="420" y="82" text-anchor="middle">What it means</text><text class="h" x="640" y="82" text-anchor="middle">Classroom example</text><line class="grid" x1="280" y1="56" x2="280" y2="416"/><line class="grid" x1="540" y1="56" x2="540" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="224" x2="760" y2="224"/><line class="grid" x1="30" y1="288" x2="760" y2="288"/><line class="grid" x1="30" y1="352" x2="760" y2="352"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="150" y="122" text-anchor="middle">Variable</text><text class="body" x="292" y="122">a letter for a quantity that can change</text><text class="body" x="552" y="122">t, the number of triangles</text><text class="sh" x="150" y="186" text-anchor="middle">Coefficient</text><text class="body" x="292" y="186">the number multiplying the variable</text><text class="body" x="552" y="186">the 2 in 2t + 1; the 30 in 500 + 30k</text><text class="sh" x="150" y="250" text-anchor="middle">Term</text><text class="body" x="292" y="250">a part of an expression, split by + or -</text><text class="body" x="552" y="250">2t and 1, the two terms of 2t + 1</text><text class="sh" x="150" y="314" text-anchor="middle">Expression</text><text class="body" x="292" y="314">a rule from variables and numbers;</text><text class="body" x="292" y="334">nothing is claimed equal</text><text class="body" x="552" y="314">2t + 1, the matchstick rule;</text><text class="body" x="552" y="334">500 + 30k, the van cost rule</text><text class="sh" x="150" y="378" text-anchor="middle">Equation</text><text class="body" x="292" y="378">a claim that two expressions are equal</text><text class="body" x="292" y="398">for some value of the variable</text><text class="body" x="552" y="378">2t + 1 = 41 asks: how many</text><text class="body" x="552" y="398">triangles need 41 sticks?</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
