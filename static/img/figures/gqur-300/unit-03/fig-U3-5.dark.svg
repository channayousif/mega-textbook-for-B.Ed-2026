<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of algebra in problem solving</title><desc id="d">Concept map of algebra in problem solving with a central node and four panels: translate, solve, interpret, and decide, linked back to the four-step strategy.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="46" text-anchor="middle">Algebra in problem solving</text><ellipse class="panel" cx="390" cy="235" rx="120" ry="50"/><text class="h" x="390" y="230" text-anchor="middle">Algebra in</text><text class="h" x="390" y="252" text-anchor="middle">problem solving</text><rect class="panel-a" x="290" y="80" width="200" height="64" rx="10"/><text class="sh" x="390" y="106" text-anchor="middle">1. Translate</text><text class="small" x="390" y="128" text-anchor="middle">write the situation as an expression</text><rect class="panel-b" x="540" y="203" width="200" height="64" rx="10"/><text class="sh" x="640" y="229" text-anchor="middle">2. Solve</text><text class="small" x="640" y="251" text-anchor="middle">use the balance method</text><rect class="panel-c" x="290" y="326" width="200" height="64" rx="10"/><text class="sh" x="390" y="352" text-anchor="middle">3. Interpret</text><text class="small" x="390" y="374" text-anchor="middle">put the answer back into the situation</text><rect class="panel-d" x="40" y="203" width="200" height="64" rx="10"/><text class="sh" x="140" y="229" text-anchor="middle">4. Decide</text><text class="small" x="140" y="251" text-anchor="middle">state what to do</text><line class="stroke" x1="430" y1="144" x2="480" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="262" x2="490" y2="300" marker-end="url(#arrow)"/><line class="stroke" x1="350" y1="326" x2="300" y2="272" marker-end="url(#arrow)"/><line class="stroke" x1="240" y1="208" x2="290" y2="170" marker-end="url(#arrow)"/><text class="small" x="390" y="430" text-anchor="middle">This loop is Unit 1's four-step strategy (understand, plan, carry out, look back) with algebra as the plan step's sharpest tool.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
