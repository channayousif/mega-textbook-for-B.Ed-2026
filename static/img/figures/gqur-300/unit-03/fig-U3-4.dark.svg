<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the inequality sign flip on two number lines</title><desc id="d">Diagram of two number lines: x greater than 4 shaded to the right, and after multiplying by negative 2, the inequality flips to less than negative 8 shaded to the left.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .yes { fill: var(--ink); } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">Multiplying by a negative turns the number line around</text><text class="sh" x="80" y="100">x &gt; 4</text><line class="stroke" x1="60" y1="160" x2="720" y2="160"/><g class="grid"><line x1="60" y1="152" x2="60" y2="168"/><line x1="226" y1="152" x2="226" y2="168"/><line x1="392" y1="152" x2="392" y2="168"/><line x1="558" y1="152" x2="558" y2="168"/><line x1="720" y1="152" x2="720" y2="168"/></g><text class="small" x="60" y="186" text-anchor="middle">-10</text><text class="small" x="226" y="186" text-anchor="middle">-5</text><text class="small" x="392" y="186" text-anchor="middle">0</text><text class="small" x="558" y="186" text-anchor="middle">5</text><text class="small" x="720" y="186" text-anchor="middle">10</text><circle class="bg" cx="525" cy="160" r="7" stroke="var(--ink)" stroke-width="2.5"/><line class="stroke-a" x1="532" y1="160" x2="740" y2="160" stroke-width="6"/><text class="small" x="525" y="140" text-anchor="middle">4</text><text class="small" x="640" y="126" text-anchor="middle">everything to the right of 4</text><text class="sh" x="390" y="248" text-anchor="middle">multiply both sides by -2</text><text class="small" x="390" y="272" text-anchor="middle">the whole picture turns around: 5 becomes -10, 6 becomes -12, and "greater than" becomes "less than"</text><text class="sh" x="80" y="330">-2x &lt; -8</text><line class="stroke" x1="60" y1="390" x2="720" y2="390"/><g class="grid"><line x1="60" y1="382" x2="60" y2="398"/><line x1="226" y1="382" x2="226" y2="398"/><line x1="392" y1="382" x2="392" y2="398"/><line x1="558" y1="382" x2="558" y2="398"/><line x1="720" y1="382" x2="720" y2="398"/></g><text class="small" x="60" y="416" text-anchor="middle">-10</text><text class="small" x="226" y="416" text-anchor="middle">-5</text><text class="small" x="392" y="416" text-anchor="middle">0</text><text class="small" x="558" y="416" text-anchor="middle">5</text><text class="small" x="720" y="416" text-anchor="middle">10</text><circle class="bg" cx="124" cy="390" r="7" stroke="var(--ink)" stroke-width="2.5"/><line class="stroke-a" x1="40" y1="390" x2="117" y2="390" stroke-width="6"/><text class="small" x="124" y="370" text-anchor="middle">-8</text><text class="small" x="240" y="356" text-anchor="middle">everything to the left of -8</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
