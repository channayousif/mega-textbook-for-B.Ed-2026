<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">الجبرا کی پانچ اصطلاحوں کا جدول</title><desc id="d">الجبرا کی پانچ اصطلاحوں کا جدول: ہر ایک کا سادہ مطلب اور کلاس روم کی ایک مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="630" y="82" text-anchor="middle">اصطلاح</text><text class="h" x="360" y="82" text-anchor="middle">مطلب</text><text class="h" x="140" y="82" text-anchor="middle">کلاس روم کی مثال</text><line class="grid" x1="500" y1="56" x2="500" y2="416"/><line class="grid" x1="240" y1="56" x2="240" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="224" x2="20" y2="224"/><line class="grid" x1="750" y1="288" x2="20" y2="288"/><line class="grid" x1="750" y1="352" x2="20" y2="352"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="630" y="122" text-anchor="middle">متغیر</text><text class="body" x="488" y="122" text-anchor="end">بدل سکنے والی مقدار کے لیے ایک حرف</text><text class="body" x="228" y="122" text-anchor="end">t، مثلثوں کی تعداد</text><text class="sh" x="630" y="186" text-anchor="middle">عددِ ضرب</text><text class="body" x="488" y="186" text-anchor="end">متغیر کے ساتھ ضرب دیا گیا عدد</text><text class="body" x="228" y="186" text-anchor="end">2t میں 2؛ 500 + 30k میں 30</text><text class="sh" x="630" y="250" text-anchor="middle">رکن</text><text class="body" x="488" y="250" text-anchor="end">اثر کا حصہ، جمع یا تفریق سے الگ</text><text class="body" x="228" y="250" text-anchor="end">2t + 1 کے دو رکن: 2t اور 1</text><text class="sh" x="630" y="314" text-anchor="middle">اثر</text><text class="body" x="488" y="314" text-anchor="end">متغیروں اور اعداد سے بنا قاعدہ؛</text><text class="body" x="488" y="334" text-anchor="end">برابر ہونے کا دعویٰ نہیں</text><text class="body" x="228" y="314" text-anchor="end">2t + 1، تیلیوں کا قاعدہ؛</text><text class="body" x="228" y="334" text-anchor="end">500 + 30k، وین کے خرچ کا قاعدہ</text><text class="sh" x="630" y="378" text-anchor="middle">مساوات</text><text class="body" x="488" y="378" text-anchor="end">دعویٰ کہ کسی قیمت پر دو اثر</text><text class="body" x="488" y="398" text-anchor="end">برابر ہیں</text><text class="body" x="228" y="378" text-anchor="end">2t + 1 = 41 پوچھتا ہے:</text><text class="body" x="228" y="398" text-anchor="end">کتنے مثلثوں کے لیے 41 تیلیاں؟</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
