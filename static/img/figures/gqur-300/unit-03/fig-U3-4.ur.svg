<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منفی سے ضرب دینے پر عددی لکیر پلٹ جاتی ہے</title><desc id="d">دو عددی لکیروں کا خاکہ: x بڑا ہے 4 سے، دائیں طرف سائیں؛ منفی 2 سے ضرب دینے کے بعد نابرابری پلٹ کر چھوٹا ہو جاتی ہے منفی 8 سے، بائیں طرف سائیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .yes { fill: var(--ink); } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">منفی سے ضرب دینے پر عددی لکیر پلٹ جاتی ہے</text><text class="sh" x="700" y="100" text-anchor="end">x &gt; 4</text><line class="stroke" x1="720" y1="160" x2="60" y2="160"/><g class="grid"><line x1="720" y1="152" x2="720" y2="168"/><line x1="554" y1="152" x2="554" y2="168"/><line x1="388" y1="152" x2="388" y2="168"/><line x1="222" y1="152" x2="222" y2="168"/><line x1="60" y1="152" x2="60" y2="168"/></g><text class="small" x="720" y="186" text-anchor="middle">-10</text><text class="small" x="554" y="186" text-anchor="middle">-5</text><text class="small" x="388" y="186" text-anchor="middle">0</text><text class="small" x="222" y="186" text-anchor="middle">5</text><text class="small" x="60" y="186" text-anchor="middle">10</text><circle class="bg" cx="255" cy="160" r="7" stroke="var(--ink)" stroke-width="2.5"/><line class="stroke-a" x1="248" y1="160" x2="40" y2="160" stroke-width="6"/><text class="small" x="255" y="140" text-anchor="middle">4</text><text class="small" x="140" y="126" text-anchor="middle">4 کے دائیں طرف سب کچھ</text><text class="sh" x="390" y="248" text-anchor="middle">دونوں طرف منفی 2 سے ضرب دیں</text><text class="small" x="390" y="272" text-anchor="middle">پوری تصویر پلٹ جاتی ہے: 5 بن جاتا ہے منفی 10، 6 بن جاتا ہے منفی 12، اور "بڑا" بن جاتا ہے "چھوٹا"</text><text class="sh" x="700" y="330" text-anchor="end">-2x &lt; -8</text><line class="stroke" x1="720" y1="390" x2="60" y2="390"/><g class="grid"><line x1="720" y1="382" x2="720" y2="398"/><line x1="554" y1="382" x2="554" y2="398"/><line x1="388" y1="382" x2="388" y2="398"/><line x1="222" y1="382" x2="222" y2="398"/><line x1="60" y1="382" x2="60" y2="398"/></g><text class="small" x="720" y="416" text-anchor="middle">-10</text><text class="small" x="554" y="416" text-anchor="middle">-5</text><text class="small" x="388" y="416" text-anchor="middle">0</text><text class="small" x="222" y="416" text-anchor="middle">5</text><text class="small" x="60" y="416" text-anchor="middle">10</text><circle class="bg" cx="656" cy="390" r="7" stroke="var(--ink)" stroke-width="2.5"/><line class="stroke-a" x1="740" y1="390" x2="663" y2="390" stroke-width="6"/><text class="small" x="656" y="370" text-anchor="middle">-8</text><text class="small" x="520" y="356" text-anchor="middle">منفی 8 کے بائیں طرف سب کچھ</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
