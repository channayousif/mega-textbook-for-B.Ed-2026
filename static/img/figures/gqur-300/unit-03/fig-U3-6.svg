<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table translating five everyday phrase patterns into algebra</title><desc id="d">Table translating five everyday phrase patterns into algebra, each with a fare or budget example.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="230" y="82" text-anchor="middle">The everyday phrase</text><text class="h" x="600" y="82" text-anchor="middle">The algebra it becomes</text><line class="grid" x1="440" y1="56" x2="440" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="224" x2="760" y2="224"/><line class="grid" x1="30" y1="288" x2="760" y2="288"/><line class="grid" x1="30" y1="352" x2="760" y2="352"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="body" x="42" y="112">a fixed amount plus a rate per item:</text><text class="small" x="42" y="132">"60 rupees to start, then 15 per kilometre"</text><text class="body" x="600" y="122" text-anchor="middle">60 + 15k</text><text class="body" x="42" y="176">the total splits into equal groups:</text><text class="small" x="42" y="196">"240 pupils placed in groups of 15"</text><text class="body" x="600" y="186" text-anchor="middle">240 / 15 = g</text><text class="body" x="42" y="240">one quantity is so much more than another:</text><text class="small" x="42" y="260">"the van carries 12 more than the bus"</text><text class="body" x="600" y="250" text-anchor="middle">v = b + 12</text><text class="body" x="42" y="304">the total is a rate times a quantity:</text><text class="small" x="42" y="324">"notebooks at 80 rupees each"</text><text class="body" x="600" y="314" text-anchor="middle">cost = 80n</text><text class="body" x="42" y="368">from what amount onwards:</text><text class="small" x="42" y="388">"when does Printer B stop being cheaper?"</text><text class="body" x="600" y="378" text-anchor="middle">2,000 + 15n = 1,200 + 25n</text><text class="small" x="390" y="440" text-anchor="middle">Read the situation, pick the shape, write the rule.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
