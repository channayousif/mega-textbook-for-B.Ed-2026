<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">لکیری مساوات کا حل: ترازو کا طریقہ</title><desc id="d">لکیری مساوات حل کرنے کا فلو چارٹ: سادہ کریں، متغیر والے رکن کو الگ کریں، متغیر کو الگ کریں، پھر substitution سے جانچیں، ناکام ہو تو واپس پہلے مرحلے پر۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">لکیری مساوات کا حل: ترازو کا طریقہ</text><text class="body" x="390" y="88" text-anchor="middle">مثال: 60 + 15k = 195</text><rect class="panel-a" x="585" y="140" width="165" height="120" rx="10"/><text class="sh" x="668" y="172" text-anchor="middle">1. سادہ کریں</text><text class="small" x="668" y="196" text-anchor="middle">بریکٹ کھولیں، ہم جنس</text><text class="small" x="668" y="214" text-anchor="middle">رکن ملائیں</text><text class="small" x="668" y="240" text-anchor="middle">یہاں کچھ نہیں کرنا</text><rect class="panel-b" x="400" y="140" width="165" height="120" rx="10"/><text class="sh" x="483" y="172" text-anchor="middle">2. متغیر والا رکن</text><text class="sh" x="483" y="190" text-anchor="middle">الگ کریں</text><text class="small" x="483" y="214" text-anchor="middle">دونوں طرف سے 60 تفریق</text><text class="small" x="483" y="232" text-anchor="middle">15k = 135</text><rect class="panel-c" x="215" y="140" width="165" height="120" rx="10"/><text class="sh" x="298" y="172" text-anchor="middle">3. متغیر کو</text><text class="sh" x="298" y="190" text-anchor="middle">الگ کریں</text><text class="small" x="298" y="214" text-anchor="middle">دونوں طرف 15 سے تقسیم</text><text class="small" x="298" y="232" text-anchor="middle">k = 9</text><rect class="panel" x="30" y="140" width="165" height="120" rx="10"/><text class="sh" x="113" y="172" text-anchor="middle">4. جانچیں</text><text class="small" x="113" y="196" text-anchor="middle">اصل مساوات میں رکھ کر</text><text class="small" x="113" y="214" text-anchor="middle">دیکھیں:</text><text class="small" x="113" y="240" text-anchor="middle">60 + 15 ضرب 9 = 195 درست</text><line class="stroke" x1="585" y1="200" x2="571" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="400" y1="200" x2="386" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="215" y1="200" x2="201" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M35 260 L35 330 L668 330 L668 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="352" y="322" text-anchor="middle">جانچ ناکام ہو تو مرحلہ 1 پر واپس جائیں</text><text class="body" x="390" y="392" text-anchor="middle">جو کچھ کریں، دونوں طرف کریں: پورا طریقہ یہی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
