<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک ہی معطیات، دو کہانیاں</title><desc id="d">ایک ہی سروے معطیات کے دو بار چارٹ: اشتہار والا نسخہ 80 سے شروع ہونے والی محور سے 6 نکاتی فرق بڑا دکھاتا ہے، دیانتدار نسخہ صفر سے شروع ہونے والی محور سے فرق کو تقریباً مٹا دیتا ہے۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">ایک ہی معطیات، دو کہانیاں</text><rect class="panel-a" x="410" y="80" width="330" height="300" rx="10"/><text class="sh" x="575" y="108" text-anchor="middle">اشتہار والا (محور 80 سے)</text><line class="stroke" x1="690" y1="330" x2="450" y2="330"/><rect class="panel" x="590" y="258" width="60" height="72"/><rect class="panel" x="490" y="312" width="60" height="18"/><text class="small" x="620" y="250" text-anchor="middle">ہمارا 88</text><text class="small" x="520" y="304" text-anchor="middle">مقابلے کا 82</text><text class="small" x="575" y="362" text-anchor="middle">6 نکات کے فرق سے ایک بلند فتح</text><rect class="panel-b" x="40" y="80" width="330" height="300" rx="10"/><text class="sh" x="205" y="108" text-anchor="middle">دیانتدار نسخہ (محور صفر سے)</text><line class="stroke" x1="320" y1="330" x2="80" y2="330"/><rect class="panel" x="220" y="172" width="60" height="158"/><rect class="panel" x="120" y="182" width="60" height="148"/><text class="small" x="250" y="164" text-anchor="middle">ہمارا 88</text><text class="small" x="150" y="174" text-anchor="middle">مقابلے کا 82</text><text class="small" x="205" y="362" text-anchor="middle">تقریباً برابر اونچائی - دیانتدار تصویر</text><text class="body" x="390" y="416" text-anchor="middle">دونوں چارٹ حساب کے لحاظ سے درست ہیں؛ فرق کے بارے میں صرف ایک دیانتدار ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
