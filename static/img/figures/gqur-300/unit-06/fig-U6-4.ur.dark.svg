<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عددی دعوے سے پوچھے جانے والے پانچ سوالات کا جدول</title><desc id="d">میڈیا کے عددی دعوے سے پوچھے جانے والے پانچ سوالات کا جدول، ہر ایک کے ساتھ اشتہار کی مثال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="560" y="82" text-anchor="middle">پوچھنے کا سوال</text><text class="h" x="240" y="82" text-anchor="middle">اشتہار کی مثال</text><line class="grid" x1="370" y1="56" x2="370" y2="416"/><line class="grid" x1="750" y1="152" x2="20" y2="152"/><line class="grid" x1="750" y1="216" x2="20" y2="216"/><line class="grid" x1="750" y1="280" x2="20" y2="280"/><line class="grid" x1="750" y1="344" x2="20" y2="344"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="body" x="738" y="108" text-anchor="end">1. ذریعہ کیا ہے؟</text><text class="small" x="358" y="100" text-anchor="end">کس نے گنا، اور گننے کا خرچ کس نے اٹھایا؟</text><text class="small" x="358" y="120" text-anchor="end">"برانڈ کا اپنا سروے"</text><text class="body" x="738" y="184" text-anchor="end">2. بنیاد کیا ہے؟</text><text class="small" x="358" y="176" text-anchor="end">88 فیصد کتنے لوگوں کا، کیسے چنے گئے؟</text><text class="small" x="358" y="196" text-anchor="end">"ایک کانفرنس کے 50 ڈاکٹروں میں سے"</text><text class="body" x="738" y="248" text-anchor="end">3. موازنہ کیا ہے؟</text><text class="small" x="358" y="248" text-anchor="end">"تیز ترین بڑھتا" - کب سے، کس کے مقابلے؟</text><text class="body" x="738" y="312" text-anchor="end">4. اکائی کیا ہے؟</text><text class="small" x="358" y="312" text-anchor="end">"صرف 2,000 ماہانہ" - کتنی قسطوں میں؟</text><text class="body" x="738" y="376" text-anchor="end">5. کیا چھوٹا ہے؟</text><text class="small" x="358" y="368" text-anchor="end">"50 فیصد زیادہ پھل" - کس سے زیادہ؟</text><text class="small" x="358" y="388" text-anchor="end">وہ بنیاد جو دعویٰ چپکے سے چھوڑ دیتا ہے</text><text class="small" x="390" y="440" text-anchor="middle">سچا دعویٰ سوالوں سے گزر جاتا ہے؛ بناوٹی دعویٰ نہیں گزرتا۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
