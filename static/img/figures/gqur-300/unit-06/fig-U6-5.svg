<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map of decision-making with data</title><desc id="d">Concept map of decision-making with data: a central decision node with four panels - question, evidence, options, trade-off - linked back to the four-step strategy.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="46" text-anchor="middle">Making the decision</text><ellipse class="panel" cx="390" cy="235" rx="95" ry="48"/><text class="h" x="390" y="242" text-anchor="middle">Decision</text><rect class="panel-a" x="290" y="80" width="200" height="64" rx="10"/><text class="sh" x="390" y="106" text-anchor="middle">1. Question</text><text class="small" x="390" y="128" text-anchor="middle">what must be decided, by when?</text><rect class="panel-b" x="540" y="203" width="200" height="64" rx="10"/><text class="sh" x="640" y="229" text-anchor="middle">2. Evidence</text><text class="small" x="640" y="251" text-anchor="middle">which numbers bear on it, from where?</text><rect class="panel-c" x="290" y="326" width="200" height="64" rx="10"/><text class="sh" x="390" y="352" text-anchor="middle">3. Options</text><text class="small" x="390" y="374" text-anchor="middle">what could be done, at what cost?</text><rect class="panel-d" x="40" y="203" width="200" height="64" rx="10"/><text class="sh" x="140" y="229" text-anchor="middle">4. Trade-off</text><text class="small" x="140" y="251" text-anchor="middle">what is gained and given up?</text><line class="stroke" x1="430" y1="144" x2="480" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="262" x2="490" y2="300" marker-end="url(#arrow)"/><line class="stroke" x1="350" y1="326" x2="300" y2="272" marker-end="url(#arrow)"/><line class="stroke" x1="240" y1="208" x2="290" y2="170" marker-end="url(#arrow)"/><text class="small" x="390" y="430" text-anchor="middle">Unit 1's four-step strategy grown up: the plan step became options and trade-offs.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
