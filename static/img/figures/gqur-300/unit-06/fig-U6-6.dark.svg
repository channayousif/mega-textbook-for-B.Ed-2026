<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five education and society indicators</title><desc id="d">Table of five education and society indicators with what each measures and what it can miss, anchored with Sindh census figures.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="150" y="82" text-anchor="middle">Indicator</text><text class="h" x="400" y="82" text-anchor="middle">What it measures</text><text class="h" x="630" y="82" text-anchor="middle">What it can miss</text><line class="grid" x1="280" y1="56" x2="280" y2="416"/><line class="grid" x1="510" y1="56" x2="510" y2="416"/><line class="grid" x1="30" y1="152" x2="760" y2="152"/><line class="grid" x1="30" y1="216" x2="760" y2="216"/><line class="grid" x1="30" y1="280" x2="760" y2="280"/><line class="grid" x1="30" y1="344" x2="760" y2="344"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="150" y="108" text-anchor="middle">Literacy rate</text><text class="body" x="292" y="100">the percent of persons 10 and above</text><text class="body" x="292" y="120">who can read (Sindh 2023: 57.54)</text><text class="small" x="522" y="108">a nine-year-old who cannot read is</text><text class="small" x="522" y="128">not counted in this rate at all</text><text class="sh" x="150" y="184" text-anchor="middle">Out-of-school rate</text><text class="body" x="292" y="184">children 5-16 not in school</text><text class="body" x="292" y="200" text-anchor="start">(Sindh 2023: 46.29)</text><text class="small" x="522" y="184">where the children are - a district</text><text class="small" x="522" y="204">average hides its own map</text><text class="sh" x="150" y="248" text-anchor="middle">Pupil-teacher ratio</text><text class="body" x="292" y="248">pupils per teacher in a school</text><text class="small" x="522" y="248">a good average can hide a class of 80</text><text class="small" x="522" y="268">and three of 20</text><text class="sh" x="150" y="312" text-anchor="middle">Enrolment rate</text><text class="body" x="292" y="312">the percent of an age group enrolled</text><text class="small" x="522" y="312">enrolled does not mean attending</text><text class="sh" x="150" y="376" text-anchor="middle">Attendance rate</text><text class="body" x="292" y="368">the percent of enrolled pupils</text><text class="body" x="292" y="388">present on a normal day</text><text class="small" x="522" y="376">a single day's count can be an</text><text class="small" x="522" y="396">unusual day</text><text class="small" x="390" y="440" text-anchor="middle">Each indicator answers one question and hides another - read the base with the number.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
