<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ایک کونہ، تین سوالات: اطراف، رقبہ، حجم</title><desc id="d">ایک کلاس روم کے کونے کا خاکہ تین طرح: اطراف کی پیمائش کے لیے باڑ کی لکیر، رقبے کے لیے فرش کا قالین، اور حجم کے لیے پانی کا ٹینک، ہر ایک پر اس کا بُعد اور اکائی لکھی ہوئی۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">ایک کونہ، تین سوالات</text><rect class="panel-a" x="530" y="90" width="210" height="240" rx="10"/><rect class="stroke" x="575" y="130" width="120" height="90" fill="none" stroke-width="6"/><text class="sh" x="635" y="254" text-anchor="middle">اطراف (پیریمیٹر)</text><text class="small" x="635" y="278" text-anchor="middle">حد، ایک بُعدی،</text><text class="small" x="635" y="298" text-anchor="middle">میٹر میں ناپی جاتی ہے</text><text class="small" x="635" y="318" text-anchor="middle">"کتنا اسکرٹنگ؟"</text><rect class="panel-b" x="285" y="90" width="210" height="240" rx="10"/><rect class="panel" x="330" y="130" width="120" height="90"/><g class="stroke" stroke-width="1" opacity="0.5"><line x1="410" y1="130" x2="410" y2="220"/><line x1="370" y1="130" x2="370" y2="220"/><line x1="330" y1="130" x2="330" y2="220"/><line x1="450" y1="160" x2="330" y2="160"/><line x1="450" y1="190" x2="330" y2="190"/></g><text class="sh" x="390" y="254" text-anchor="middle">رقبہ</text><text class="small" x="390" y="278" text-anchor="middle">احاطہ، دو بُعدی،</text><text class="small" x="390" y="298" text-anchor="middle">مربع میٹر میں</text><text class="small" x="390" y="318" text-anchor="middle">"کتنی ٹائلیں؟"</text><rect class="panel-c" x="40" y="90" width="210" height="240" rx="10"/><rect class="panel" x="95" y="130" width="100" height="90"/><line class="stroke" x1="195" y1="130" x2="215" y2="112" stroke-width="2"/><line class="stroke" x1="95" y1="130" x2="115" y2="112" stroke-width="2"/><line class="stroke" x1="215" y1="112" x2="115" y2="112" stroke-width="2"/><line class="stroke" x1="215" y1="112" x2="215" y2="202" stroke-width="2"/><line class="stroke" x1="215" y1="202" x2="195" y2="220" stroke-width="2"/><text class="sh" x="145" y="254" text-anchor="middle">حجم</text><text class="small" x="145" y="278" text-anchor="middle">بھرائی، تین بُعدی،</text><text class="small" x="145" y="298" text-anchor="middle">مکعب میٹر یا لیٹر میں</text><text class="small" x="145" y="318" text-anchor="middle">"کتنا پانی؟"</text><text class="body" x="390" y="386" text-anchor="middle">وہی کونہ تین مختلف سوالوں کا جواب دیتا ہے؛</text><text class="body" x="390" y="410" text-anchor="middle">انہیں ملانا مہنگا ہے: اسکرٹنگ مربع میٹر سے نہیں خریدی جاتی۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
