<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین میٹری سیڑھیوں کا جدول</title><desc id="d">لمبائی، کمیت اور گنجائش کی میٹری سیڑھیوں کا جدول، تبدیلی کے مراحل اور ہر گروپ کے نیچے بازار کی مثال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">تین میٹری سیڑھیاں</text><text class="body" x="390" y="74" text-anchor="middle">ہر قدم دس کی کسی طاقت سے ضرب یا تقسیم ہے۔</text><rect class="panel-a" x="520" y="100" width="230" height="290" rx="10"/><text class="sh" x="635" y="128" text-anchor="middle">لمبائی</text><text class="body" x="635" y="160" text-anchor="middle">1 کلومیٹر = 1,000 میٹر</text><text class="body" x="635" y="188" text-anchor="middle">1 میٹر = 100 سینٹی میٹر</text><text class="body" x="635" y="216" text-anchor="middle">1 سینٹی میٹر = 10 ملی میٹر</text><text class="small" x="635" y="262" text-anchor="middle">بازار کی مثال:</text><text class="small" x="635" y="284" text-anchor="middle">کپڑا میٹر سے بکتا ہے،</text><text class="small" x="635" y="302" text-anchor="middle">سینٹی میٹر میں کٹتا ہے</text><rect class="panel-b" x="275" y="100" width="230" height="290" rx="10"/><text class="sh" x="390" y="128" text-anchor="middle">کمیت</text><text class="body" x="390" y="160" text-anchor="middle">1 کلوگرام = 1,000 گرام</text><text class="body" x="390" y="188" text-anchor="middle">1 گرام = 1,000 ملی گرام</text><text class="small" x="390" y="262" text-anchor="middle">بازار کی مثال:</text><text class="small" x="390" y="284" text-anchor="middle">چینی کلوگرام سے بکتی ہے،</text><text class="small" x="390" y="302" text-anchor="middle">ترکیبیں گرام میں</text><rect class="panel-c" x="30" y="100" width="230" height="290" rx="10"/><text class="sh" x="145" y="128" text-anchor="middle">گنجائش</text><text class="body" x="145" y="160" text-anchor="middle">1 لیٹر = 1,000 ملی لیٹر</text><text class="small" x="145" y="262" text-anchor="middle">بازار کی مثال:</text><text class="small" x="145" y="284" text-anchor="middle">دودھ لیٹر سے بکتا ہے،</text><text class="small" x="145" y="302" text-anchor="middle">دوائی ملی لیٹر میں</text><text class="small" x="390" y="440" text-anchor="middle">کلو- کا مطلب ہزار، سینٹی- سو واں، ملی- ہزار واں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
