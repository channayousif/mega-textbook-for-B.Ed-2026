<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of six measurement formulas</title><desc id="d">Table of six measurement formulas with the formula in symbols and one worked classroom example for each.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="185" y="82" text-anchor="middle">Quantity</text><text class="h" x="400" y="82" text-anchor="middle">Formula</text><text class="h" x="630" y="82" text-anchor="middle">Worked classroom example</text><line class="grid" x1="330" y1="56" x2="330" y2="416"/><line class="grid" x1="510" y1="56" x2="510" y2="416"/><line class="grid" x1="30" y1="152" x2="760" y2="152"/><line class="grid" x1="30" y1="216" x2="760" y2="216"/><line class="grid" x1="30" y1="280" x2="760" y2="280"/><line class="grid" x1="30" y1="344" x2="760" y2="344"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="185" y="108" text-anchor="middle">Rectangle perimeter</text><text class="body" x="400" y="108" text-anchor="middle">2 x (length + width)</text><text class="small" x="522" y="100">a classroom 8 m by 6 m needs</text><text class="small" x="522" y="120">28 m of skirting</text><text class="sh" x="185" y="184" text-anchor="middle">Rectangle area</text><text class="body" x="400" y="184" text-anchor="middle">length x width</text><text class="small" x="522" y="176">the same classroom has</text><text class="small" x="522" y="196">48 square metres of floor</text><text class="sh" x="185" y="248" text-anchor="middle">Triangle area</text><text class="body" x="400" y="248" text-anchor="middle">(base x height) / 2</text><text class="small" x="522" y="240">base 1.2 m, height 0.8 m:</text><text class="small" x="522" y="260">0.48 square metres</text><text class="sh" x="185" y="312" text-anchor="middle">Circle circumference</text><text class="body" x="400" y="312" text-anchor="middle">2 x pi x radius</text><text class="small" x="522" y="304">radius 4 m: 25.12 m of border</text><text class="sh" x="185" y="376" text-anchor="middle">Circle area</text><text class="body" x="400" y="376" text-anchor="middle">pi x radius squared</text><text class="small" x="522" y="368">radius 4 m: 50.24 square metres</text><text class="sh" x="185" y="404" text-anchor="middle">Box volume</text><text class="body" x="400" y="404" text-anchor="middle">length x width x height</text><text class="small" x="522" y="396">2 m by 1 m by 1.5 m holds</text><text class="small" x="522" y="412">3 cubic metres</text><text class="small" x="630" y="440" text-anchor="middle">pi is about 3.14; 1 cubic metre is 1,000 litres.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
