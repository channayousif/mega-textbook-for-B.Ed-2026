<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of four basic shapes with their defining properties</title><desc id="d">Diagram of four basic shapes - rectangle, square, triangle and circle - each with its defining property written beneath.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="50" text-anchor="middle">The basic shapes and what defines them</text><rect class="panel-a" x="40" y="110" width="150" height="100" fill="none"/><text class="sh" x="115" y="248" text-anchor="middle">Rectangle</text><text class="small" x="115" y="274" text-anchor="middle">four right angles,</text><text class="small" x="115" y="294" text-anchor="middle">opposite sides equal</text><rect class="panel-b" x="240" y="110" width="100" height="100" fill="none"/><text class="sh" x="290" y="248" text-anchor="middle">Square</text><text class="small" x="290" y="274" text-anchor="middle">four right angles,</text><text class="small" x="290" y="294" text-anchor="middle">all sides equal</text><polygon class="panel-c" points="490,110 440,210 540,210" fill="none"/><text class="sh" x="490" y="248" text-anchor="middle">Triangle</text><text class="small" x="490" y="274" text-anchor="middle">three sides,</text><text class="small" x="490" y="294" text-anchor="middle">angles sum to 180 degrees</text><circle class="panel-d" cx="670" cy="160" r="52" fill="none"/><line class="stroke" x1="670" y1="160" x2="722" y2="160"/><text class="small" x="696" y="150" text-anchor="middle">radius</text><text class="sh" x="670" y="248" text-anchor="middle">Circle</text><text class="small" x="670" y="274" text-anchor="middle">every point the same</text><text class="small" x="670" y="294" text-anchor="middle">distance from the centre</text><text class="body" x="390" y="368" text-anchor="middle">Measurement always lands on a shape:</text><text class="body" x="390" y="392" text-anchor="middle">the shape's defining property names the length you must measure.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
