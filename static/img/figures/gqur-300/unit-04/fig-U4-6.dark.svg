<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five school measurement tasks</title><desc id="d">Table of five school measurement tasks with what each buys, its unit, and its formula or method.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="150" y="82" text-anchor="middle">Task</text><text class="h" x="350" y="82" text-anchor="middle">What it buys</text><text class="h" x="500" y="82" text-anchor="middle">Unit</text><text class="h" x="650" y="82" text-anchor="middle">Formula or method</text><line class="grid" x1="270" y1="56" x2="270" y2="416"/><line class="grid" x1="420" y1="56" x2="420" y2="416"/><line class="grid" x1="560" y1="56" x2="560" y2="416"/><line class="grid" x1="30" y1="152" x2="760" y2="152"/><line class="grid" x1="30" y1="216" x2="760" y2="216"/><line class="grid" x1="30" y1="280" x2="760" y2="280"/><line class="grid" x1="30" y1="344" x2="760" y2="344"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="body" x="42" y="108">Skirting for a classroom</text><text class="body" x="350" y="108" text-anchor="middle">boundary</text><text class="body" x="490" y="108" text-anchor="middle">metres</text><text class="small" x="572" y="108">2 x (length + width)</text><text class="body" x="42" y="184">Tiles for a verandah</text><text class="body" x="350" y="184" text-anchor="middle">cover</text><text class="body" x="490" y="184" text-anchor="middle">square metres</text><text class="small" x="572" y="184">length x width, then tiles/m2</text><text class="body" x="42" y="248">Water for a tank</text><text class="body" x="350" y="248" text-anchor="middle">fill</text><text class="body" x="490" y="248" text-anchor="middle">litres</text><text class="small" x="572" y="248">L x W x H x 1,000</text><text class="body" x="42" y="312">Shelf-length for books</text><text class="body" x="350" y="312" text-anchor="middle">fill of a row</text><text class="body" x="490" y="312" text-anchor="middle">metres</text><text class="small" x="572" y="312">books x spine width / shelf</text><text class="body" x="42" y="376">Paint for a wall</text><text class="body" x="350" y="376" text-anchor="middle">cover</text><text class="body" x="490" y="376" text-anchor="middle">square metres, then litres</text><text class="small" x="572" y="376">length x height, then / 10</text><text class="small" x="390" y="440" text-anchor="middle">Name what the task buys before reaching for the tape.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
