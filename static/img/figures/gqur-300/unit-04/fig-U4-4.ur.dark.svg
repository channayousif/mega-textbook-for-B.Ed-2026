<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چھ پیمائشی فارمولوں کا جدول</title><desc id="d">چھ پیمائشی فارمولوں کا جدول: علامتوں میں فارمولا اور ہر ایک کی حل شدہ کلاس روم کی مثال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="595" y="82" text-anchor="middle">مقدار</text><text class="h" x="380" y="82" text-anchor="middle">فارمولا</text><text class="h" x="150" y="82" text-anchor="middle">کلاس روم کی حل شدہ مثال</text><line class="grid" x1="450" y1="56" x2="450" y2="416"/><line class="grid" x1="270" y1="56" x2="270" y2="416"/><line class="grid" x1="750" y1="152" x2="20" y2="152"/><line class="grid" x1="750" y1="216" x2="20" y2="216"/><line class="grid" x1="750" y1="280" x2="20" y2="280"/><line class="grid" x1="750" y1="344" x2="20" y2="344"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="595" y="108" text-anchor="middle">مستطیل کے اطراف</text><text class="body" x="380" y="108" text-anchor="middle">2 ضرب (لمبائی جمع چوڑائی)</text><text class="small" x="258" y="100" text-anchor="end">8 بہ 6 میٹر کلاس روم کو</text><text class="small" x="258" y="120" text-anchor="end">28 میٹر اسکرٹنگ چاہیے</text><text class="sh" x="595" y="184" text-anchor="middle">مستطیل کا رقبہ</text><text class="body" x="380" y="184" text-anchor="middle">لمبائی ضرب چوڑائی</text><text class="small" x="258" y="176" text-anchor="end">اسی کلاس روم کا فرش</text><text class="small" x="258" y="196" text-anchor="end">48 مربع میٹر</text><text class="sh" x="595" y="248" text-anchor="middle">مثلث کا رقبہ</text><text class="body" x="380" y="248" text-anchor="middle">(اساس ضرب اونچائی) تقسیم 2</text><text class="small" x="258" y="240" text-anchor="end">اساس 1.2 میٹر، اونچائی 0.8 میٹر:</text><text class="small" x="258" y="260" text-anchor="end">0.48 مربع میٹر</text><text class="sh" x="595" y="312" text-anchor="middle">دائرے کا محیط</text><text class="body" x="380" y="312" text-anchor="middle">2 ضرب پای ضرب نصف قطر</text><text class="small" x="258" y="304" text-anchor="end">نصف قطر 4 میٹر: 25.12 میٹر بارڈر</text><text class="sh" x="595" y="376" text-anchor="middle">دائرے کا رقبہ</text><text class="body" x="380" y="376" text-anchor="middle">پای ضرب نصف قطر کا مربع</text><text class="small" x="258" y="368" text-anchor="end">نصف قطر 4 میٹر: 50.24 مربع میٹر</text><text class="sh" x="595" y="404" text-anchor="middle">ڈبے کا حجم</text><text class="body" x="380" y="404" text-anchor="middle">لمبائی ضرب چوڑائی ضرب اونچائی</text><text class="small" x="258" y="396" text-anchor="end">2 بہ 1 بہ 1.5 میٹر</text><text class="small" x="258" y="412" text-anchor="end">3 مکعب میٹر سمیٹتا ہے</text><text class="small" x="150" y="440" text-anchor="middle">پای تقریباً 3.14 ہے؛ 1 مکعب میٹر 1,000 لیٹر ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
