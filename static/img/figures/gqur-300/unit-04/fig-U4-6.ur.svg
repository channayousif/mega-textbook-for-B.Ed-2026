<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ اسکولی پیمائشی کاموں کا جدول</title><desc id="d">پانچ اسکولی پیمائشی کاموں کا جدول: ہر ایک کیا خریدتا ہے، اس کی اکائی، اور اس کا فارمولا یا طریقہ۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="630" y="82" text-anchor="middle">کام</text><text class="h" x="430" y="82" text-anchor="middle">کیا خریدتا ہے</text><text class="h" x="280" y="82" text-anchor="middle">اکائی</text><text class="h" x="130" y="82" text-anchor="middle">فارمولا یا طریقہ</text><line class="grid" x1="510" y1="56" x2="510" y2="416"/><line class="grid" x1="360" y1="56" x2="360" y2="416"/><line class="grid" x1="220" y1="56" x2="220" y2="416"/><line class="grid" x1="750" y1="152" x2="20" y2="152"/><line class="grid" x1="750" y1="216" x2="20" y2="216"/><line class="grid" x1="750" y1="280" x2="20" y2="280"/><line class="grid" x1="750" y1="344" x2="20" y2="344"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="body" x="738" y="108" text-anchor="end">کلاس روم کا اسکرٹنگ</text><text class="body" x="430" y="108" text-anchor="middle">حد</text><text class="body" x="290" y="108" text-anchor="middle">میٹر</text><text class="small" x="208" y="108" text-anchor="end">2 ضرب (لمبائی جمع چوڑائی)</text><text class="body" x="738" y="184" text-anchor="end">برآمدے کی ٹائلیں</text><text class="body" x="430" y="184" text-anchor="middle">احاطہ</text><text class="body" x="290" y="184" text-anchor="middle">مربع میٹر</text><text class="small" x="208" y="184" text-anchor="end">لمبائی ضرب چوڑائی، پھر فی مربع میٹر ٹائلیں</text><text class="body" x="738" y="248" text-anchor="end">ٹینک کا پانی</text><text class="body" x="430" y="248" text-anchor="middle">بھرائی</text><text class="body" x="290" y="248" text-anchor="middle">لیٹر</text><text class="small" x="208" y="242" text-anchor="end">لمبائی ضرب چوڑائی ضرب اونچائی،</text><text class="small" x="208" y="258" text-anchor="end">ضرب 1,000</text><text class="body" x="738" y="312" text-anchor="end">کتابوں کی شیلف لمبائی</text><text class="body" x="430" y="312" text-anchor="middle">قطار کی بھرائی</text><text class="body" x="290" y="312" text-anchor="middle">میٹر</text><text class="small" x="208" y="306" text-anchor="end">کتابیں ضرب جلد کی موٹائی،</text><text class="small" x="208" y="322" text-anchor="end">تقسیم شیلف لمبائی پر</text><text class="body" x="738" y="376" text-anchor="end">دیوار کی پینٹ</text><text class="body" x="430" y="376" text-anchor="middle">احاطہ</text><text class="body" x="290" y="376" text-anchor="middle">مربع میٹر، پھر لیٹر</text><text class="small" x="208" y="376" text-anchor="end">لمبائی ضرب اونچائی، پھر 10 پر تقسیم</text><text class="small" x="390" y="440" text-anchor="middle">پیمائش کے آلے تک ہاتھ بڑھانے سے پہلے بتائیں کہ کام کیا خریدتا ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
