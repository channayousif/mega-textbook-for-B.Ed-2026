<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار بنیادی اشکال اور ان کی تعریفی خصوصیات</title><desc id="d">چار بنیادی اشکال کا خاکہ - مستطیل، مربع، مثلث اور دائرہ - ہر ایک کے نیچے اس کی تعریفی خصوصیت لکھی ہوئی۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .panel-d { fill: var(--a4-fill); stroke: var(--a4); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="50" text-anchor="middle">بنیادی اشکال اور ان کی پہچان</text><rect class="panel-a" x="590" y="110" width="150" height="100" fill="none"/><text class="sh" x="665" y="248" text-anchor="middle">مستطیل</text><text class="small" x="665" y="274" text-anchor="middle">چار قائمہ زاویے،</text><text class="small" x="665" y="294" text-anchor="middle">سامنے کی باتیں برابر</text><rect class="panel-b" x="440" y="110" width="100" height="100" fill="none"/><text class="sh" x="490" y="248" text-anchor="middle">مربع</text><text class="small" x="490" y="274" text-anchor="middle">چار قائمہ زاویے،</text><text class="small" x="490" y="294" text-anchor="middle">تمام اطراف برابر</text><polygon class="panel-c" points="290,110 340,210 240,210" fill="none"/><text class="sh" x="290" y="248" text-anchor="middle">مثلث</text><text class="small" x="290" y="274" text-anchor="middle">تین اطراف، زاویوں</text><text class="small" x="290" y="294" text-anchor="middle">کا مجموعہ 180 ڈگری</text><circle class="panel-d" cx="110" cy="160" r="52" fill="none"/><line class="stroke" x1="110" y1="160" x2="58" y2="160"/><text class="small" x="84" y="150" text-anchor="middle">نصف قطر</text><text class="sh" x="110" y="248" text-anchor="middle">دائرہ</text><text class="small" x="110" y="274" text-anchor="middle">ہر نقطہ مرکز سے</text><text class="small" x="110" y="294" text-anchor="middle">ایک ہی فاصلے پر</text><text class="body" x="390" y="368" text-anchor="middle">پیمائش ہمیشہ کسی شکل پر اترتی ہے:</text><text class="body" x="390" y="392" text-anchor="middle">شکل کی تعریفی خصوصیت وہ لمبائی بتاتی ہے جو ناپنی ہوتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
