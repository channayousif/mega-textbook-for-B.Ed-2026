<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار مرحلوں میں ایک حقیقی پیمائشی کام</title><desc id="d">حقیقی پیمائشی کام کا فلو چارٹ: اکائی کا انتخاب کریں، ناپیں، حساب کریں، پھر معقولیت جانچیں، جانچ ناکام ہو تو واپس جائیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">چار مرحلوں میں ایک حقیقی پیمائشی کام</text><rect class="panel-a" x="590" y="140" width="160" height="120" rx="10"/><text class="sh" x="670" y="176" text-anchor="middle">1. انتخاب کریں</text><text class="small" x="670" y="200" text-anchor="middle">کام کیا خریدتا ہے:</text><text class="small" x="670" y="218" text-anchor="middle">حد، احاطہ یا بھرائی؟</text><rect class="panel-b" x="405" y="140" width="160" height="120" rx="10"/><text class="sh" x="485" y="176" text-anchor="middle">2. ناپیں</text><text class="small" x="485" y="200" text-anchor="middle">کون سی لمبائیاں،</text><text class="small" x="485" y="218" text-anchor="middle">کس اوزار سے</text><rect class="panel-c" x="220" y="140" width="160" height="120" rx="10"/><text class="sh" x="300" y="176" text-anchor="middle">3. حساب کریں</text><text class="small" x="300" y="200" text-anchor="middle">کون سا فارمولا،</text><text class="small" x="300" y="218" text-anchor="middle">اکائی ساتھ</text><rect class="panel" x="35" y="140" width="160" height="120" rx="10"/><text class="sh" x="115" y="176" text-anchor="middle">4. جانچیں</text><text class="small" x="115" y="200" text-anchor="middle">گول اعداد سے اندازہ:</text><text class="small" x="115" y="218" text-anchor="middle">جواب فٹ بیٹھتا ہے؟</text><line class="stroke" x1="590" y1="200" x2="571" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="405" y1="200" x2="386" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="220" y1="200" x2="201" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M35 260 L35 330 L670 330 L670 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="353" y="322" text-anchor="middle">جانچ ناکام ہو تو واپس اسی مرحلے پر جائیں جس نے ناکامی بتائی</text><text class="body" x="390" y="392" text-anchor="middle">لکھ کر پیش کرنے پر یہ چار مراحل وہ رپورٹ بن جاتے ہیں جو ساتھی دوبارہ جانچ سکے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
