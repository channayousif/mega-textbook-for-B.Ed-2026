<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five display types</title><desc id="d">Table of five display types with what each shows best and one pitfall for each.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="170" y="82" text-anchor="middle">Display</text><text class="h" x="400" y="82" text-anchor="middle">What it shows best</text><text class="h" x="630" y="82" text-anchor="middle">One pitfall</text><line class="grid" x1="320" y1="56" x2="320" y2="416"/><line class="grid" x1="510" y1="56" x2="510" y2="416"/><line class="grid" x1="30" y1="152" x2="760" y2="152"/><line class="grid" x1="30" y1="216" x2="760" y2="216"/><line class="grid" x1="30" y1="280" x2="760" y2="280"/><line class="grid" x1="30" y1="344" x2="760" y2="344"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="170" y="108" text-anchor="middle">Frequency table</text><text class="body" x="332" y="108">exact counts, nothing hidden</text><text class="small" x="522" y="108">hard to see patterns at a glance</text><text class="sh" x="170" y="184" text-anchor="middle">Bar chart</text><text class="body" x="332" y="184">comparing categories side by side</text><text class="small" x="522" y="184">a truncated axis exaggerates small differences</text><text class="sh" x="170" y="248" text-anchor="middle">Pie chart</text><text class="body" x="332" y="248">shares of one whole</text><text class="small" x="522" y="248">meaningless unless the whole is one thing</text><text class="sh" x="170" y="312" text-anchor="middle">Line graph</text><text class="body" x="332" y="312">change over time</text><text class="small" x="522" y="312">implies continuity between points that may not exist</text><text class="sh" x="170" y="376" text-anchor="middle">Pictograph</text><text class="body" x="332" y="376">counts as icons, friendly to young readers</text><text class="small" x="522" y="376">without a stated key, every icon misleads</text><text class="small" x="390" y="440" text-anchor="middle">Reading a display means reading its construction, not just its impression.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
