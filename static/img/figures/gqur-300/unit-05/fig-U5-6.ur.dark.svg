<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ تشریحی سوالات کا جدول</title><desc id="d">کسی بھی شماریات سے پوچھے جانے والے پانچ تشریحی سوالات کا جدول، ہر ایک کے ساتھ اس کی اہمیت۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="580" y="82" text-anchor="middle">پوچھنے کا سوال</text><text class="h" x="250" y="82" text-anchor="middle">کیوں اہم ہے</text><line class="grid" x1="410" y1="56" x2="410" y2="416"/><line class="grid" x1="750" y1="152" x2="20" y2="152"/><line class="grid" x1="750" y1="216" x2="20" y2="216"/><line class="grid" x1="750" y1="280" x2="20" y2="280"/><line class="grid" x1="750" y1="344" x2="20" y2="344"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="body" x="738" y="108" text-anchor="end">1. کس نے جمع کیا؟</text><text class="small" x="398" y="100" text-anchor="end">مفاد وابستہ فریق یا غیر جانبدار دفتر؟</text><text class="small" x="398" y="120" text-anchor="end">جمع کرنے والے کا مقصد اس کی جھلک بدلتا ہے</text><text class="body" x="738" y="184" text-anchor="end">2. کیسے جمع کیا؟</text><text class="small" x="398" y="184" text-anchor="end">طریقہ طے کرتا ہے کہ عدد کیا دعویٰ کر سکتا ہے</text><text class="body" x="738" y="248" text-anchor="end">3. کس سے موازنہ؟</text><text class="small" x="398" y="240" text-anchor="end">پچھلے سال؟ مقابلے سے؟ قومی رقم سے؟</text><text class="small" x="398" y="260" text-anchor="end">موازنہ کے بغیر عدد قائل کرتا ہے، بتاتا نہیں</text><text class="body" x="738" y="312" text-anchor="end">4. بنیاد کیا ہے؟</text><text class="small" x="398" y="304" text-anchor="end">57.54 فیصد کس کا؟</text><text class="small" x="398" y="324" text-anchor="end">بنیاد بدلی تو عدد بدلا (10 سال سے اوپر بمقابلہ تمام عمر)</text><text class="body" x="738" y="376" text-anchor="end">5. کیا چھوٹا ہے؟</text><text class="small" x="398" y="368" text-anchor="end">اوسط کے پیچھے کا فرق: مرد 64.23 بمقابلہ خواتین 50.21،</text><text class="small" x="398" y="388" text-anchor="end">اور 46.29 فیصد اسکول سے باہر شرح جو سرخی چھوڑ دیتی ہے</text><text class="small" x="390" y="440" text-anchor="middle">سچا دعویٰ پانچوں سوالوں سے آسانی سے گزر جاتا ہے - سب سے پوچھیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
