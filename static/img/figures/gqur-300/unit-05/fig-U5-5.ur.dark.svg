<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نقطہ خاکہ: تین اوسط ایک کلاس میں</title><desc id="d">11 نمبروں کے نقطہ خاکے کا ڈایاگرام: حسابی اوسط 60 پر، درمیانی قدر 62 پر اور عاد 70 پر گھیرے ہوئے، تینوں اوسط الگ جگہوں پر۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .yes { fill: var(--ink); } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } .dash { stroke: var(--a2); stroke-width: 2; stroke-dasharray: 6,4; fill: none; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="50" text-anchor="middle">تین اوسط، ایک کلاس</text><text class="small" x="390" y="76" text-anchor="middle">11 طلبہ کے نمبر: 20، 45، 50، 55، 60، 62، 62، 70، 70، 70، 96</text><line class="stroke" x1="720" y1="340" x2="60" y2="340"/><g class="grid"><line x1="720" y1="332" x2="720" y2="348"/><line x1="570" y1="332" x2="570" y2="348"/><line x1="420" y1="332" x2="420" y2="348"/><line x1="270" y1="332" x2="270" y2="348"/><line x1="120" y1="332" x2="120" y2="348"/></g><text class="small" x="720" y="368" text-anchor="middle">20</text><text class="small" x="570" y="368" text-anchor="middle">40</text><text class="small" x="420" y="368" text-anchor="middle">60</text><text class="small" x="270" y="368" text-anchor="middle">80</text><text class="small" x="120" y="368" text-anchor="middle">100</text><circle class="yes" cx="720" cy="316" r="7"/><circle class="yes" cx="532" cy="316" r="7"/><circle class="yes" cx="495" cy="316" r="7"/><circle class="yes" cx="458" cy="316" r="7"/><circle class="yes" cx="420" cy="316" r="7"/><circle class="yes" cx="405" cy="316" r="7"/><circle class="yes" cx="405" cy="294" r="7"/><circle class="yes" cx="345" cy="316" r="7"/><circle class="yes" cx="345" cy="294" r="7"/><circle class="yes" cx="345" cy="272" r="7"/><circle class="yes" cx="150" cy="316" r="7"/><line class="dash" x1="420" y1="120" x2="420" y2="340"/><text class="sh" x="428" y="112" text-anchor="start">حسابی اوسط = 60</text><line class="dash" x1="405" y1="150" x2="405" y2="340"/><text class="sh" x="397" y="142" text-anchor="end">درمیانی قدر = 62</text><circle cx="345" cy="294" r="26" style="stroke: var(--a3); stroke-width: 2.5; fill: none"/><text class="sh" x="255" y="250" text-anchor="middle">عاد = 70</text><line class="stroke" x1="325" y1="270" x2="285" y2="254" stroke="var(--a3)" stroke-width="2"/><text class="body" x="390" y="412" text-anchor="middle">تینوں اوسط الگ جگہوں پر ہیں کیونکہ وہ الگ سوالوں کے جواب ہیں۔</text><text class="small" x="390" y="436" text-anchor="middle">حسابی اوسط درمیانی سے نیچے، درمیانی عاد سے نیچے: کم نمبروں کی لمبی دم اوسط کو نیچے کھینچتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
