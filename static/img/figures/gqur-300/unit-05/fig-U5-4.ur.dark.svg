<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ ڈسپلے اقسام کا جدول</title><desc id="d">پانچ ڈسپلے اقسام کا جدول: ہر ایک کیا بہترین دکھاتا ہے اور اس کی ایک کمزوری۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="610" y="82" text-anchor="middle">ڈسپلے</text><text class="h" x="380" y="82" text-anchor="middle">کیا بہترین دکھاتا ہے</text><text class="h" x="150" y="82" text-anchor="middle">ایک کمزوری</text><line class="grid" x1="460" y1="56" x2="460" y2="416"/><line class="grid" x1="270" y1="56" x2="270" y2="416"/><line class="grid" x1="750" y1="152" x2="20" y2="152"/><line class="grid" x1="750" y1="216" x2="20" y2="216"/><line class="grid" x1="750" y1="280" x2="20" y2="280"/><line class="grid" x1="750" y1="344" x2="20" y2="344"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="610" y="108" text-anchor="middle">تعدد جدول</text><text class="body" x="448" y="108" text-anchor="end">درست گنتی، کچھ چھپا نہیں</text><text class="small" x="258" y="108" text-anchor="end">نظر آنے والا نمونہ نظر نہیں آتا</text><text class="sh" x="610" y="184" text-anchor="middle">بار چارٹ</text><text class="body" x="448" y="184" text-anchor="end">اقسام کا ساتھ ساتھ موازنہ</text><text class="small" x="258" y="184" text-anchor="end">کٹا ہوا محور چھوٹے فرق کو بڑا دکھاتا ہے</text><text class="sh" x="610" y="248" text-anchor="middle">پائی چارٹ</text><text class="body" x="448" y="248" text-anchor="end">ایک پورے کے حصے</text><text class="small" x="258" y="248" text-anchor="end">پوری ایک چیز نہ ہو تو بے معنی</text><text class="sh" x="610" y="312" text-anchor="middle">لکیر گراف</text><text class="body" x="448" y="312" text-anchor="end">وقت کے ساتھ تبدیلی</text><text class="small" x="258" y="312" text-anchor="end">نقطوں کے بیچ تسلسل دکھاتا ہے جو موجود نہ ہو</text><text class="sh" x="610" y="376" text-anchor="middle">تصویری جدول</text><text class="body" x="448" y="376" text-anchor="end">تصویروں میں گنتی، چھوٹے قاری کے لیے</text><text class="small" x="258" y="376" text-anchor="end">کلید نہ ہو تو ہر تصویر دھوکہ دیتی ہے</text><text class="small" x="390" y="440" text-anchor="middle">ڈسپلے پڑھنے کا مطلب اس کی ساخت پڑھنا ہے، صرف تاثر نہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
