<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram for choosing a display</title><desc id="d">Diagram for choosing a display: comparing categories leads to a bar chart, parts of a whole to a pie chart, and change over time to a line graph, each with a school example.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="50" text-anchor="middle">Choosing the display</text><rect class="panel" x="230" y="80" width="320" height="60" rx="10"/><text class="sh" x="390" y="106" text-anchor="middle">What does the reader need to compare?</text><text class="small" x="390" y="128" text-anchor="middle">the question picks the picture</text><line class="stroke" x1="300" y1="140" x2="150" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="140" x2="390" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="480" y1="140" x2="630" y2="200" marker-end="url(#arrow)"/><rect class="panel-a" x="40" y="204" width="220" height="200" rx="10"/><text class="sh" x="150" y="232" text-anchor="middle">Comparing categories</text><rect class="stroke" x="80" y="250" width="14" height="80" fill="none"/><rect class="stroke" x="110" y="280" width="14" height="50" fill="none"/><rect class="stroke" x="140" y="300" width="14" height="30" fill="none"/><line class="stroke" x1="70" y1="330" x2="170" y2="330" stroke-width="1.5"/><text class="small" x="150" y="356" text-anchor="middle">Bar chart</text><text class="small" x="150" y="378" text-anchor="middle">"which travel mode is most common?"</text><rect class="panel-b" x="280" y="204" width="220" height="200" rx="10"/><text class="sh" x="390" y="232" text-anchor="middle">Parts of one whole</text><circle class="stroke" cx="390" cy="290" r="40" fill="none"/><line class="stroke" x1="390" y1="290" x2="430" y2="290" stroke-width="1.5"/><line class="stroke" x1="390" y1="290" x2="355" y2="315" stroke-width="1.5"/><text class="small" x="390" y="356" text-anchor="middle">Pie chart</text><text class="small" x="390" y="378" text-anchor="middle">"what share of the class walks?"</text><rect class="panel-c" x="520" y="204" width="220" height="200" rx="10"/><text class="sh" x="630" y="232" text-anchor="middle">Change over time</text><polyline class="stroke" points="560,330 590,310 620,320 650,280 680,295 710,260" stroke-width="2"/><line class="stroke" x1="550" y1="335" x2="720" y2="335" stroke-width="1.5"/><text class="small" x="630" y="356" text-anchor="middle">Line graph</text><text class="small" x="630" y="378" text-anchor="middle">"how did attendance change?"</text><text class="body" x="390" y="440" text-anchor="middle">The display is the sentence the data speaks - choose it for the question, not for decoration.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
