<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a dot plot with mean, median and mode</title><desc id="d">Diagram of a dot plot of 11 class marks with the mean at 60, the median at 62 and the mode circled at 70, showing the three averages in different places.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .yes { fill: var(--ink); } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } .dash { stroke: var(--a2); stroke-width: 2; stroke-dasharray: 6,4; fill: none; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="50" text-anchor="middle">Three averages, one class</text><text class="small" x="390" y="76" text-anchor="middle">Marks of 11 pupils: 20, 45, 50, 55, 60, 62, 62, 70, 70, 70, 96</text><line class="stroke" x1="60" y1="340" x2="720" y2="340"/><g class="grid"><line x1="60" y1="332" x2="60" y2="348"/><line x1="210" y1="332" x2="210" y2="348"/><line x1="360" y1="332" x2="360" y2="348"/><line x1="510" y1="332" x2="510" y2="348"/><line x1="660" y1="332" x2="660" y2="348"/></g><text class="small" x="60" y="368" text-anchor="middle">20</text><text class="small" x="210" y="368" text-anchor="middle">40</text><text class="small" x="360" y="368" text-anchor="middle">60</text><text class="small" x="510" y="368" text-anchor="middle">80</text><text class="small" x="660" y="368" text-anchor="middle">100</text><circle class="yes" cx="60" cy="316" r="7"/><circle class="yes" cx="172" cy="316" r="7"/><circle class="yes" cx="210" cy="316" r="7"/><circle class="yes" cx="247" cy="316" r="7"/><circle class="yes" cx="285" cy="316" r="7"/><circle class="yes" cx="300" cy="316" r="7"/><circle class="yes" cx="300" cy="294" r="7"/><circle class="yes" cx="360" cy="316" r="7"/><circle class="yes" cx="360" cy="294" r="7"/><circle class="yes" cx="360" cy="272" r="7"/><circle class="yes" cx="660" cy="316" r="7"/><line class="dash" x1="360" y1="120" x2="360" y2="340"/><text class="sh" x="360" y="112" text-anchor="middle">mean = 60</text><line class="dash" x1="300" y1="150" x2="300" y2="340"/><text class="sh" x="300" y="142" text-anchor="middle">median = 62</text><circle class="stroke" cx="360" cy="294" r="26" stroke="var(--a3)" stroke-width="2.5" fill="none"/><text class="sh" x="452" y="252" text-anchor="middle">mode = 70</text><line class="stroke" x1="388" y1="262" x2="424" y2="248" stroke="var(--a3)" stroke-width="2"/><text class="body" x="390" y="412" text-anchor="middle">The three averages sit in different places because they answer different questions.</text><text class="small" x="390" y="436" text-anchor="middle">Mean below median below mode: a long tail of low marks pulls the mean down.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
