<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of square numbers as growing tile grids</title><desc id="d">Diagram of square numbers 1 to 25 drawn as growing tile grids, with sides 1 to 5 above and areas 1 to 25 below, and paired arrows naming squaring and square root.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .tile { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">Square numbers are genuinely squares</text><text class="small" x="111" y="150" text-anchor="middle">side 1</text><rect class="tile" x="100" y="200" width="22" height="22"/><text class="sh" x="111" y="270" text-anchor="middle">1</text><text class="small" x="249" y="150" text-anchor="middle">side 2</text><rect class="tile" x="227" y="178" width="22" height="22"/><rect class="tile" x="249" y="178" width="22" height="22"/><rect class="tile" x="227" y="200" width="22" height="22"/><rect class="tile" x="249" y="200" width="22" height="22"/><text class="sh" x="249" y="270" text-anchor="middle">4</text><text class="small" x="398" y="150" text-anchor="middle">side 3</text><rect class="tile" x="354" y="156" width="22" height="22"/><rect class="tile" x="376" y="156" width="22" height="22"/><rect class="tile" x="398" y="156" width="22" height="22"/><rect class="tile" x="354" y="178" width="22" height="22"/><rect class="tile" x="376" y="178" width="22" height="22"/><rect class="tile" x="398" y="178" width="22" height="22"/><rect class="tile" x="354" y="200" width="22" height="22"/><rect class="tile" x="376" y="200" width="22" height="22"/><rect class="tile" x="398" y="200" width="22" height="22"/><text class="sh" x="398" y="270" text-anchor="middle">9</text><text class="small" x="547" y="150" text-anchor="middle">side 4</text><rect class="tile" x="481" y="134" width="22" height="22"/><rect class="tile" x="503" y="134" width="22" height="22"/><rect class="tile" x="525" y="134" width="22" height="22"/><rect class="tile" x="547" y="134" width="22" height="22"/><rect class="tile" x="481" y="156" width="22" height="22"/><rect class="tile" x="503" y="156" width="22" height="22"/><rect class="tile" x="525" y="156" width="22" height="22"/><rect class="tile" x="547" y="156" width="22" height="22"/><rect class="tile" x="481" y="178" width="22" height="22"/><rect class="tile" x="503" y="178" width="22" height="22"/><rect class="tile" x="525" y="178" width="22" height="22"/><rect class="tile" x="547" y="178" width="22" height="22"/><rect class="tile" x="481" y="200" width="22" height="22"/><rect class="tile" x="503" y="200" width="22" height="22"/><rect class="tile" x="525" y="200" width="22" height="22"/><rect class="tile" x="547" y="200" width="22" height="22"/><text class="sh" x="547" y="270" text-anchor="middle">16</text><text class="small" x="708" y="150" text-anchor="middle">side 5</text><rect class="tile" x="608" y="112" width="22" height="22"/><rect class="tile" x="630" y="112" width="22" height="22"/><rect class="tile" x="652" y="112" width="22" height="22"/><rect class="tile" x="674" y="112" width="22" height="22"/><rect class="tile" x="696" y="112" width="22" height="22"/><rect class="tile" x="608" y="134" width="22" height="22"/><rect class="tile" x="630" y="134" width="22" height="22"/><rect class="tile" x="652" y="134" width="22" height="22"/><rect class="tile" x="674" y="134" width="22" height="22"/><rect class="tile" x="696" y="134" width="22" height="22"/><rect class="tile" x="608" y="156" width="22" height="22"/><rect class="tile" x="630" y="156" width="22" height="22"/><rect class="tile" x="652" y="156" width="22" height="22"/><rect class="tile" x="674" y="156" width="22" height="22"/><rect class="tile" x="696" y="156" width="22" height="22"/><rect class="tile" x="608" y="178" width="22" height="22"/><rect class="tile" x="630" y="178" width="22" height="22"/><rect class="tile" x="652" y="178" width="22" height="22"/><rect class="tile" x="674" y="178" width="22" height="22"/><rect class="tile" x="696" y="178" width="22" height="22"/><rect class="tile" x="608" y="200" width="22" height="22"/><rect class="tile" x="630" y="200" width="22" height="22"/><rect class="tile" x="652" y="200" width="22" height="22"/><rect class="tile" x="674" y="200" width="22" height="22"/><rect class="tile" x="696" y="200" width="22" height="22"/><text class="sh" x="708" y="270" text-anchor="middle">25</text><line class="stroke-a" x1="111" y1="160" x2="111" y2="254" marker-end="url(#arrow)"/><line class="stroke-a" x1="708" y1="160" x2="708" y2="254" marker-end="url(#arrow)"/><text class="small" x="180" y="212">squared:</text><text class="small" x="180" y="230">side to area</text><text class="small" x="640" y="212">square root:</text><text class="small" x="640" y="230">area to side</text><text class="body" x="390" y="330" text-anchor="middle">An 8-by-8 floor holds exactly 64 tiles, so the square root of 64 is 8.</text><text class="body" x="390" y="354" text-anchor="middle">7 x 7 = 49 and 8 x 8 = 64 bracket the square root of 50: it lies between 7 and 8.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
