<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the number system as nested panels</title><desc id="d">Diagram of the number system as nested panels: whole numbers sit inside integers, which sit inside rational numbers, with example numbers 7, -4, three quarters, and 0.75 placed in their correct regions.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-c" x="60" y="80" width="600" height="320" rx="14"/><text class="sh" x="360" y="112" text-anchor="middle">Rational numbers</text><text class="body" x="540" y="150">3/4</text><text class="body" x="576" y="150">0.75</text><text class="small" x="540" y="176">every fraction has a</text><text class="small" x="540" y="194">decimal name</text><rect class="panel-b" x="110" y="210" width="380" height="160" rx="12"/><text class="sh" x="300" y="238" text-anchor="middle">Integers</text><text class="body" x="440" y="280">-4</text><rect class="panel-a" x="150" y="260" width="180" height="84" rx="10"/><text class="sh" x="240" y="294" text-anchor="middle">Whole numbers</text><text class="body" x="240" y="322" text-anchor="middle">7</text><text class="h" x="390" y="48" text-anchor="middle">The number family tree</text><text class="small" x="696" y="428">0 counts as a whole number</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
