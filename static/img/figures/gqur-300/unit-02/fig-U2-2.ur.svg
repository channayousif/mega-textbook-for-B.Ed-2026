<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">کسروں اور اعشاریوں کے ساتھ چار عملوں کا جدول</title><desc id="d">چار عملوں کا جدول: کسروں اور اعشاریوں کے ساتھ ہر ایک کی میٹر کی ایک مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="620" y="82" text-anchor="middle">عمل</text><text class="h" x="340" y="82" text-anchor="middle">کسروں کے ساتھ</text><text class="h" x="130" y="82" text-anchor="middle">اعشاریوں کے ساتھ</text><line class="grid" x1="490" y1="56" x2="490" y2="416"/><line class="grid" x1="220" y1="56" x2="220" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="264" x2="20" y2="264"/><line class="grid" x1="750" y1="368" x2="20" y2="368"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="620" y="116" text-anchor="middle">جمع</text><text class="body" x="340" y="116" text-anchor="middle">1/2 میٹر + 1/4 میٹر = 3/4 میٹر</text><text class="body" x="130" y="116" text-anchor="middle">0.5 + 0.25 = 0.75</text><text class="sh" x="620" y="220" text-anchor="middle">تفریق</text><text class="body" x="340" y="220" text-anchor="middle">1 میٹر - 1/4 میٹر = 3/4 میٹر</text><text class="body" x="130" y="220" text-anchor="middle">1.00 - 0.25 = 0.75</text><text class="sh" x="620" y="324" text-anchor="middle">ضرب</text><text class="body" x="340" y="324" text-anchor="middle">1/2 کا آدھا = 1/4 میٹر</text><text class="body" x="130" y="324" text-anchor="middle">0.5 ضرب 0.5 = 0.25</text><text class="sh" x="620" y="404" text-anchor="middle">تقسیم</text><text class="body" x="340" y="404" text-anchor="middle">1/2 میٹر پر 1/4 میٹر = 2 لمبائیاں</text><text class="body" x="130" y="404" text-anchor="middle">0.50 تقسیم 0.25 = 2</text><text class="small" x="390" y="440" text-anchor="middle">کپڑے کی وہی میٹر، دو علامتیں: ہر کسر کا ایک اعشاری نام ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
