<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اعداد کا خاندانی شجرہ</title><desc id="d">اعدادی نظام کا خاکہ: تمام اعداد صحيح اعداد کے اندر، صحيح اعداد ناطق اعداد کے اندر، مثالیں 7، منفی 4، تین چوتھائی اور 0.75 اپنی درست جگہوں پر۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-c" x="120" y="80" width="600" height="320" rx="14"/><text class="sh" x="420" y="112" text-anchor="middle">ناطق اعداد</text><text class="body" x="240" y="150" text-anchor="end">3/4</text><text class="body" x="204" y="150" text-anchor="end">0.75</text><text class="small" x="240" y="176" text-anchor="end">ہر کسر کا ایک</text><text class="small" x="240" y="194" text-anchor="end">اعشاری نام ہوتا ہے</text><rect class="panel-b" x="290" y="210" width="380" height="160" rx="12"/><text class="sh" x="480" y="238" text-anchor="middle">صحيح اعداد</text><text class="body" x="340" y="280" text-anchor="end">-4</text><rect class="panel-a" x="450" y="260" width="180" height="84" rx="10"/><text class="sh" x="540" y="294" text-anchor="middle">تمام اعداد</text><text class="body" x="540" y="322" text-anchor="middle">7</text><text class="h" x="390" y="48" text-anchor="middle">اعداد کا خاندانی شجرہ</text><text class="small" x="84" y="428" text-anchor="end">0 کو تمام عدد گنا جاتا ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
