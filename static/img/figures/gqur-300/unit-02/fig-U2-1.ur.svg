<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">اعداد کا خاندانی شجرہ</title><desc id="d">اعدادی نظام کا خاکہ: تمام اعداد صحيح اعداد کے اندر، صحيح اعداد ناطق اعداد کے اندر، مثالیں 7، منفی 4، تین چوتھائی اور 0.75 اپنی درست جگہوں پر۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-c" x="120" y="80" width="600" height="320" rx="14"/><text class="sh" x="420" y="112" text-anchor="middle">ناطق اعداد</text><text class="body" x="240" y="150" text-anchor="end">3/4</text><text class="body" x="204" y="150" text-anchor="end">0.75</text><text class="small" x="240" y="176" text-anchor="end">ہر کسر کا ایک</text><text class="small" x="240" y="194" text-anchor="end">اعشاری نام ہوتا ہے</text><rect class="panel-b" x="290" y="210" width="380" height="160" rx="12"/><text class="sh" x="480" y="238" text-anchor="middle">صحيح اعداد</text><text class="body" x="340" y="280" text-anchor="end">-4</text><rect class="panel-a" x="450" y="260" width="180" height="84" rx="10"/><text class="sh" x="540" y="294" text-anchor="middle">تمام اعداد</text><text class="body" x="540" y="322" text-anchor="middle">7</text><text class="h" x="390" y="48" text-anchor="middle">اعداد کا خاندانی شجرہ</text><text class="small" x="84" y="428" text-anchor="end">0 کو تمام عدد گنا جاتا ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
