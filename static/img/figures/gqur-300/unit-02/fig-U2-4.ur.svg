<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">فیصد کی چار صورتحالوں کا جدول</title><desc id="d">فیصد کی چار صورتحالوں کا جدول: ہر ایک کا سوال اور روپوں میں ایک حل شدہ مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="600" y="82" text-anchor="middle">صورت حال</text><text class="h" x="350" y="82" text-anchor="middle">کیا پوچھتا ہے</text><text class="h" x="135" y="82" text-anchor="middle">حل شدہ روپے کی مثال</text><line class="grid" x1="460" y1="56" x2="460" y2="416"/><line class="grid" x1="250" y1="56" x2="250" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="264" x2="20" y2="264"/><line class="grid" x1="750" y1="368" x2="20" y2="368"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="600" y="116" text-anchor="middle">کسی مقدار کا</text><text class="sh" x="600" y="134" text-anchor="middle">فیصد</text><text class="body" x="448" y="116" text-anchor="end">پورے کا بتایا ہوا</text><text class="body" x="448" y="136" text-anchor="end">حصہ لیں</text><text class="body" x="238" y="116" text-anchor="end">2,000 روپے فیس کا 15 فیصد</text><text class="body" x="238" y="136" text-anchor="end">300 روپے ہے</text><text class="sh" x="600" y="220" text-anchor="middle">فیصد اضافہ</text><text class="body" x="448" y="220" text-anchor="end">اصل کو بتایے ہوئے حصے</text><text class="body" x="448" y="240" text-anchor="end">سے بڑھائیں</text><text class="body" x="238" y="220" text-anchor="end">1,200 روپے کا بل 10 فیصد بڑھ کر</text><text class="body" x="238" y="240" text-anchor="end">1,320 ہو جاتا ہے</text><text class="sh" x="600" y="324" text-anchor="middle">فیصد کمی</text><text class="body" x="448" y="324" text-anchor="end">اصل کو بتایے ہوئے حصے</text><text class="body" x="448" y="344" text-anchor="end">سے گھٹائیں</text><text class="body" x="238" y="324" text-anchor="end">500 روپے کی قمیض 20 فیصد رعایت</text><text class="body" x="238" y="344" text-anchor="end">پر 400 روپے</text><text class="sh" x="600" y="404" text-anchor="middle">الٹا فیصد</text><text class="body" x="448" y="396" text-anchor="end">معلوم تبدیلی سے پہلے کی</text><text class="body" x="448" y="416" text-anchor="end">اصل قیمت معلوم کریں</text><text class="body" x="238" y="396" text-anchor="end">10 فیصد اضافے کے بعد فیس 2,200 ہے</text><text class="body" x="238" y="416" text-anchor="end">تو پہلے 2,000 تھی</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
