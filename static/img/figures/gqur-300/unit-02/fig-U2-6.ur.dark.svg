<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">عمل کا انتخاب: کل کیا کام کرتی ہے؟</title><desc id="d">لفظی مسئلے میں عمل کا انتخاب کرنے کا فلو چارٹ: صورت حال پڑھیں، کل کے کام سے ضرب، تقسیم یا جمع و تفریق کا فیصلہ کریں، پھر معقولیت جانچیں۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">عمل کا انتخاب: کل کیا کام کرتی ہے؟</text><rect class="panel-a" x="290" y="66" width="200" height="58" rx="10"/><text class="sh" x="390" y="90" text-anchor="middle">صورت حال پڑھیں</text><text class="small" x="390" y="110" text-anchor="middle">کیا دیا گیا، کیا پوچھا گیا</text><polygon class="panel" points="390,150 270,196 390,242 510,196"/><text class="sh" x="390" y="190" text-anchor="middle">کیا کل برابر گروہوں</text><text class="sh" x="390" y="208" text-anchor="middle">کو ملاتی ہے؟</text><rect class="panel-b" x="40" y="166" width="160" height="60" rx="10"/><text class="sh" x="120" y="192" text-anchor="middle">ضرب</text><text class="small" x="120" y="212" text-anchor="middle">20 ڈبے، ہر ایک میں 12 چاک</text><line class="stroke" x1="270" y1="196" x2="206" y2="196" marker-end="url(#arrow)"/><text class="small" x="238" y="186" text-anchor="middle">ہاں</text><line class="stroke" x1="390" y1="242" x2="390" y2="274" marker-end="url(#arrow)"/><text class="small" x="368" y="264" text-anchor="end">نہیں</text><rect class="panel" x="240" y="278" width="300" height="56" rx="10"/><text class="sh" x="390" y="302" text-anchor="middle">کیا کل برابر گروہوں میں بٹتی ہے؟</text><text class="small" x="390" y="322" text-anchor="middle">(یا کسی رقم سے بدلتی ہے؟)</text><rect class="panel-c" x="580" y="360" width="160" height="60" rx="10"/><text class="sh" x="660" y="386" text-anchor="middle">تقسیم</text><text class="small" x="660" y="406" text-anchor="middle">240 طلبہ کو 15 کے گروپوں میں</text><line class="stroke" x1="490" y1="334" x2="620" y2="360" marker-end="url(#arrow)"/><text class="small" x="580" y="352" text-anchor="middle">ہاں</text><rect class="panel" x="140" y="360" width="200" height="60" rx="10"/><text class="sh" x="240" y="386" text-anchor="middle">جمع یا تفریق</text><text class="small" x="240" y="406" text-anchor="middle">2,000 فیس 200 بڑھ جاتی ہے</text><line class="stroke" x1="290" y1="334" x2="260" y2="360" marker-end="url(#arrow)"/><text class="small" x="240" y="352" text-anchor="middle">نہیں</text><rect class="panel-a" x="20" y="360" width="80" height="60" rx="10"/><text class="sh" x="60" y="384" text-anchor="middle">جانچیں</text><text class="small" x="60" y="404" text-anchor="middle">کیا معقول</text><text class="small" x="60" y="418" text-anchor="middle">ہے؟</text><line class="stroke" x1="140" y1="390" x2="106" y2="390" marker-end="url(#arrow)"/><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
