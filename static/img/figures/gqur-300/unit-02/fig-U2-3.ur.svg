<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">نسبت، تناسب اور فیصد کو جوڑنے والا مثلث خاکہ</title><desc id="d">مثلث خاکہ جو نسبت، تناسب اور فیصد کو کونوں پر جوڑتا ہے، ہر ایک کی ایک سطری مثال کے ساتھ، یہ دکھاتے ہوئے کہ یہ ایک مربوط خیال ہیں۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><polygon class="panel" points="390,90 620,380 160,380"/><rect class="panel-a" x="300" y="60" width="180" height="70" rx="10"/><text class="sh" x="390" y="88" text-anchor="middle">نسبت</text><text class="small" x="390" y="112" text-anchor="middle">6 چمچ چینی بہ 4 چمچ پتی</text><rect class="panel-b" x="510" y="350" width="230" height="70" rx="10"/><text class="sh" x="625" y="378" text-anchor="middle">تناسب</text><text class="small" x="625" y="402" text-anchor="middle">6 بہ 4 برابر ہے 18 بہ 12</text><rect class="panel-c" x="40" y="350" width="230" height="70" rx="10"/><text class="sh" x="155" y="378" text-anchor="middle">فیصد</text><text class="small" x="155" y="402" text-anchor="middle">سو میں سے نسبت: 100 میں سے 75</text><line class="stroke" x1="450" y1="130" x2="550" y2="345" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="330" y1="130" x2="230" y2="345" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="505" y1="385" x2="275" y2="385" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="h" x="390" y="40" text-anchor="middle">ایک خیال، تین علامتیں</text><text class="small" x="390" y="446" text-anchor="middle">ہر طرف ایک علامت کو دوسری میں بدلتی ہے: نسبت سادہ کریں، تناسب جانچیں، فی سو نام بدلیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
