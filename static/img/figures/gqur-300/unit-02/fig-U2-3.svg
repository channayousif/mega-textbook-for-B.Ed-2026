<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Triangle diagram linking ratio, proportion and percentage</title><desc id="d">Triangle diagram linking ratio, proportion and percentage at its corners, each with a one-line example, showing they are one connected idea.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><polygon class="panel" points="390,90 160,380 620,380"/><rect class="panel-a" x="300" y="60" width="180" height="70" rx="10"/><text class="sh" x="390" y="88" text-anchor="middle">Ratio</text><text class="small" x="390" y="112" text-anchor="middle">6 spoons sugar to 4 spoons tea</text><rect class="panel-b" x="40" y="350" width="230" height="70" rx="10"/><text class="sh" x="155" y="378" text-anchor="middle">Proportion</text><text class="small" x="155" y="402" text-anchor="middle">6 to 4 equals 18 to 12</text><rect class="panel-c" x="510" y="350" width="230" height="70" rx="10"/><text class="sh" x="625" y="378" text-anchor="middle">Percentage</text><text class="small" x="625" y="402" text-anchor="middle">a ratio out of 100: 75 per 100</text><line class="stroke" x1="330" y1="130" x2="230" y2="345" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="450" y1="130" x2="550" y2="345" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line class="stroke" x1="275" y1="385" x2="505" y2="385" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text class="h" x="390" y="40" text-anchor="middle">One idea in three notations</text><text class="small" x="390" y="446" text-anchor="middle">Every side converts one notation into another: simplify a ratio, check a proportion, rename per hundred.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
