<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the estimation ladder on a number line</title><desc id="d">Diagram of the estimation ladder: a number line showing exact count, rounded estimate, and order-of-magnitude brackets, each with a classroom use case.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><line class="stroke" x1="60" y1="330" x2="720" y2="330"/><g class="grid"><line x1="60" y1="322" x2="60" y2="338"/><line x1="192" y1="322" x2="192" y2="338"/><line x1="324" y1="322" x2="324" y2="338"/><line x1="456" y1="322" x2="456" y2="338"/><line x1="588" y1="322" x2="588" y2="338"/><line x1="720" y1="322" x2="720" y2="338"/></g><text class="small" x="60" y="358" text-anchor="middle">0</text><text class="small" x="192" y="358" text-anchor="middle">200</text><text class="small" x="324" y="358" text-anchor="middle">400</text><text class="small" x="456" y="358" text-anchor="middle">600</text><text class="small" x="588" y="358" text-anchor="middle">800</text><text class="small" x="720" y="358" text-anchor="middle">1000</text><path class="stroke-a" d="M 126 250 L 126 226 L 720 226 L 720 250" fill="none"/><text class="sh" x="418" y="216" text-anchor="middle">Order of magnitude: "a few hundred"</text><text class="small" x="418" y="244" text-anchor="middle">head-count at a mela</text><path class="stroke-a" d="M 324 300 L 324 276 L 390 276 L 390 300" fill="none"/><text class="sh" x="418" y="268" text-anchor="middle">Rounded estimate: "about 450"</text><text class="small" x="418" y="296" text-anchor="middle">market budget</text><circle class="yes" cx="349" cy="330" r="7"/><line class="stroke" x1="349" y1="323" x2="349" y2="384"/><text class="sh" x="349" y="404" text-anchor="middle">Exact count: 438</text><text class="small" x="349" y="424" text-anchor="middle">marks register</text><text class="h" x="390" y="70" text-anchor="middle">The estimation ladder</text><text class="body" x="390" y="98" text-anchor="middle">Climb to the widest rung that still serves the decision:</text><text class="body" x="390" y="120" text-anchor="middle">exact count, rounded estimate, or order of magnitude.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
