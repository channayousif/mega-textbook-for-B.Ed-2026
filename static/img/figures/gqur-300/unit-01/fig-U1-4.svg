<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four estimation strategies</title><desc id="d">Table of four estimation strategies with the method in one column and a classroom example in the other.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="190" y="82" text-anchor="middle">Strategy</text><text class="h" x="470" y="82" text-anchor="middle">What you do</text><text class="h" x="660" y="82" text-anchor="middle">Classroom example</text><line class="grid" x1="330" y1="56" x2="330" y2="416"/><line class="grid" x1="560" y1="56" x2="560" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="264" x2="760" y2="264"/><line class="grid" x1="30" y1="368" x2="760" y2="368"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="180" y="116" text-anchor="middle">Grouping</text><text class="body" x="342" y="108">count one section, then multiply</text><text class="body" x="342" y="128">by the number of sections</text><text class="body" x="572" y="108">about 40 pupils per section</text><text class="body" x="572" y="128">times 20 sections is about 800</text><text class="sh" x="180" y="220" text-anchor="middle">Rounding</text><text class="body" x="342" y="212">replace awkward numbers with</text><text class="body" x="342" y="232">nearby friendly ones</text><text class="body" x="572" y="212">348 pupils is about 350,</text><text class="body" x="572" y="232">so 35 packets of 10 worksheets</text><text class="sh" x="180" y="324" text-anchor="middle">Front-end digits</text><text class="body" x="342" y="316">compute with the leading digit</text><text class="body" x="342" y="336">only, for a quick size check</text><text class="body" x="572" y="316">4,850 plus 3,120 rupees</text><text class="body" x="572" y="336">is "about 4,000 plus 3,000"</text><text class="sh" x="180" y="404" text-anchor="middle">Compatible</text><text class="sh" x="180" y="422" text-anchor="middle">numbers</text><text class="body" x="342" y="396">choose nearby numbers that</text><text class="body" x="342" y="416">divide or multiply cleanly</text><text class="body" x="572" y="396">47 x 52 becomes 50 x 50,</text><text class="body" x="572" y="416">which is 2,500</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
