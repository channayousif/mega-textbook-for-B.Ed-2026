<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">منطقی استدلال کے چار طریقوں کا جدول</title><desc id="d">منطقی استدلال کے چار طریقوں کا جدول: ہر ایک کی ایک جملے میں وضاحت اور روزمرہ کی ایک مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="610" y="82" text-anchor="middle">طریقہ</text><text class="h" x="350" y="82" text-anchor="middle">ایک جملے میں</text><text class="h" x="130" y="82" text-anchor="middle">روزمرہ مثال</text><line class="grid" x1="470" y1="56" x2="470" y2="416"/><line class="grid" x1="240" y1="56" x2="240" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="264" x2="20" y2="264"/><line class="grid" x1="750" y1="368" x2="20" y2="368"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="610" y="116" text-anchor="middle">نمونہ</text><text class="sh" x="610" y="134" text-anchor="middle">پہچاننا</text><text class="body" x="458" y="116" text-anchor="end">دیکھیں کیا دہرایا یا بڑھتا ہے،</text><text class="body" x="458" y="136" text-anchor="end">اور اسی سے اگلی جانچ کریں</text><text class="body" x="228" y="116" text-anchor="end">ہر نیا تیلیوں کا مثلث 2 تیلیاں</text><text class="body" x="228" y="136" text-anchor="end">جوڑتا ہے، تو اگلا اندازہ لگائیں</text><text class="sh" x="610" y="220" text-anchor="middle">اگر-تو</text><text class="sh" x="610" y="238" text-anchor="middle">استدلال</text><text class="body" x="458" y="220" text-anchor="end">دو دیے گئے حقائق نتیجہ پر</text><text class="body" x="458" y="240" text-anchor="end">مجبور کرتے ہیں</text><text class="body" x="228" y="220" text-anchor="end">اگر وین میں 30 نشستیں ہیں اور 34</text><text class="body" x="228" y="240" text-anchor="end">بچے ہیں تو ایک سفر کافی نہیں</text><text class="sh" x="610" y="324" text-anchor="middle">استنباط</text><text class="body" x="458" y="324" text-anchor="end">عمومی قاعدے کو کسی خاص</text><text class="body" x="458" y="344" text-anchor="end">موقع پر لاگو کریں</text><text class="body" x="228" y="324" text-anchor="end">ہر مفرد عدد کے بالکل دو عاد ہوتے</text><text class="body" x="228" y="344" text-anchor="end">ہیں، تو 17 کے دو عاد ہیں</text><text class="sh" x="610" y="404" text-anchor="middle">حذف</text><text class="body" x="458" y="396" text-anchor="end">اختیارات کو اس طرح ختم کریں</text><text class="body" x="458" y="416" text-anchor="end">کہ ایک باقی رہے</text><text class="body" x="228" y="396" text-anchor="end">نہ الماری، نہ تختہ، نہ ادھار:</text><text class="body" x="228" y="416" text-anchor="end">کتاب گم ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
