<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four logical-reasoning moves</title><desc id="d">Table of four logical-reasoning moves with a one-sentence description and an everyday example for each.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="170" y="82" text-anchor="middle">The move</text><text class="h" x="430" y="82" text-anchor="middle">In one sentence</text><text class="h" x="650" y="82" text-anchor="middle">Everyday example</text><line class="grid" x1="310" y1="56" x2="310" y2="416"/><line class="grid" x1="540" y1="56" x2="540" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="264" x2="760" y2="264"/><line class="grid" x1="30" y1="368" x2="760" y2="368"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="170" y="116" text-anchor="middle">Spot the</text><text class="sh" x="170" y="134" text-anchor="middle">pattern</text><text class="body" x="322" y="116">find what repeats or grows,</text><text class="body" x="322" y="136">and let it predict the next</text><text class="body" x="552" y="116">each new matchstick triangle</text><text class="body" x="552" y="136">adds 2 sticks, so predict on</text><text class="sh" x="170" y="220" text-anchor="middle">If-then</text><text class="sh" x="170" y="238" text-anchor="middle">reasoning</text><text class="body" x="322" y="220">two stated facts force a</text><text class="body" x="322" y="240">conclusion that must hold</text><text class="body" x="552" y="220">if the van seats 30 and 34</text><text class="body" x="552" y="240">signed up, one trip is not enough</text><text class="sh" x="170" y="324" text-anchor="middle">Deduction</text><text class="body" x="322" y="324">apply a general rule to a</text><text class="body" x="322" y="344">particular case</text><text class="body" x="552" y="324">every prime number has exactly</text><text class="body" x="552" y="344">two factors, so 17 has two</text><text class="sh" x="170" y="404" text-anchor="middle">Elimination</text><text class="body" x="322" y="396">rule out options until</text><text class="body" x="322" y="416">one remains</text><text class="body" x="552" y="396">not the cupboard, not the shelf,</text><text class="body" x="552" y="416">not borrowed: the book is lost</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
