<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تخمینے کا زینہ: عددی لکیر پر تین سیڑھیاں</title><desc id="d">تخمینے کا زینہ: ایک عددی لکیر جو درست گنتی، گول کردہ تخمینہ اور مقدارِ رتبہ کے خانے دکھاتی ہے، ہر ایک کے ساتھ کلاس روم کی ایک مثال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .yes { fill: var(--ink); } .no { fill: var(--muted); } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><line class="stroke" x1="720" y1="330" x2="60" y2="330"/><g class="grid"><line x1="720" y1="322" x2="720" y2="338"/><line x1="588" y1="322" x2="588" y2="338"/><line x1="456" y1="322" x2="456" y2="338"/><line x1="324" y1="322" x2="324" y2="338"/><line x1="192" y1="322" x2="192" y2="338"/><line x1="60" y1="322" x2="60" y2="338"/></g><text class="small" x="720" y="358" text-anchor="middle">0</text><text class="small" x="588" y="358" text-anchor="middle">200</text><text class="small" x="456" y="358" text-anchor="middle">400</text><text class="small" x="324" y="358" text-anchor="middle">600</text><text class="small" x="192" y="358" text-anchor="middle">800</text><text class="small" x="60" y="358" text-anchor="middle">1000</text><path class="stroke-a" d="M654 250 L654 226 L60 226 L60 250" fill="none"/><text class="sh" x="362" y="216" text-anchor="middle">مقدارِ رتبہ: "چند سو"</text><text class="small" x="362" y="244" text-anchor="middle">میلے میں لوگوں کی گنتی</text><path class="stroke-a" d="M456 300 L456 276 L390 276 L390 300" fill="none"/><text class="sh" x="362" y="268" text-anchor="middle">گول کردہ تخمینہ: "تقریباً 450"</text><text class="small" x="362" y="296" text-anchor="middle">بازار کا بجٹ</text><circle class="yes" cx="431" cy="330" r="7"/><line class="stroke" x1="431" y1="323" x2="431" y2="384"/><text class="sh" x="431" y="404" text-anchor="middle">درست گنتی: 438</text><text class="small" x="431" y="424" text-anchor="middle">مارک رجسٹر</text><text class="h" x="390" y="70" text-anchor="middle">تخمینے کا زینہ</text><text class="body" x="390" y="98" text-anchor="middle">اس چوڑی ترین سیڑھی تک چڑھیں جو فیصلے کے کام آئے:</text><text class="body" x="390" y="120" text-anchor="middle">درست گنتی، گول کردہ تخمینہ، یا مقدارِ رتبہ۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
