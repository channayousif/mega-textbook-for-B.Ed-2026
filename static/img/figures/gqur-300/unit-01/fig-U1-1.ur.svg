<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تصوراتی نقشہ جس کے مرکز میں مقداری استدلال ہے</title><desc id="d">تصوراتی نقشہ جس کے مرکز میں مقداری استدلال ہے اور تین شاخیں ہیں: اعداد پر اعتماد، سیاق و سباق میں استدلال، اور ریاضی کے ذریعے اظہار، ہر ایک کے ساتھ ایک اسکول کی مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .yes { fill: var(--ink); } .no { fill: var(--muted); } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="530" y="62" width="210" height="96" rx="10"/><text class="sh" x="635" y="90" text-anchor="middle">اعداد پر اعتماد</text><text class="small" x="635" y="112" text-anchor="middle">مارک شیٹ پڑھنا،</text><text class="small" x="635" y="130" text-anchor="middle">قیمتوں کا موازنہ</text><rect class="panel-b" x="40" y="62" width="210" height="96" rx="10"/><text class="sh" x="145" y="90" text-anchor="middle">سیاق و سباق میں استدلال</text><text class="small" x="145" y="112" text-anchor="middle">اسکول کا بجٹ،</text><text class="small" x="145" y="130" text-anchor="middle">کلاس کا سروے</text><rect class="panel-c" x="285" y="360" width="210" height="92" rx="10"/><text class="sh" x="390" y="386" text-anchor="middle">ریاضی کے ذریعے</text><text class="sh" x="390" y="404" text-anchor="middle">اظہار</text><text class="small" x="390" y="426" text-anchor="middle">والدین کو نتیجہ سمجھانا</text><line class="stroke" x1="565" y1="150" x2="480" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="215" y1="150" x2="300" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="360" x2="390" y2="290" marker-end="url(#arrow)"/><ellipse class="panel" cx="390" cy="235" rx="118" ry="52"/><text class="h" x="390" y="236" text-anchor="middle">مقداری استدلال</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
