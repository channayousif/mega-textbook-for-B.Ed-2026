<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تخمینے کی چار حکمت عملیوں کا جدول</title><desc id="d">تخمینے کی چار حکمت عملیوں کا جدول: ایک ستون میں طریقہ اور دوسرے میں کلاس روم کی مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="590" y="82" text-anchor="middle">حکمت عملی</text><text class="h" x="310" y="82" text-anchor="middle">آپ کیا کرتے ہیں</text><text class="h" x="120" y="82" text-anchor="middle">کلاس روم کی مثال</text><line class="grid" x1="450" y1="56" x2="450" y2="416"/><line class="grid" x1="220" y1="56" x2="220" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="264" x2="20" y2="264"/><line class="grid" x1="750" y1="368" x2="20" y2="368"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="600" y="116" text-anchor="middle">گروہ بندی</text><text class="body" x="438" y="108" text-anchor="end">ایک حصہ گنیں، پھر حصوں کی</text><text class="body" x="438" y="128" text-anchor="end">تعداد سے ضرب دیں</text><text class="body" x="208" y="108" text-anchor="end">فی حصہ تقریباً 40 طلبہ</text><text class="body" x="208" y="128" text-anchor="end">ضرب 20 حصے، یعنی تقریباً 800</text><text class="sh" x="600" y="220" text-anchor="middle">گول کرنا</text><text class="body" x="438" y="212" text-anchor="end">مشکل اعداد کو قریبی آسان</text><text class="body" x="438" y="232" text-anchor="end">اعداد سے بدلیں</text><text class="body" x="208" y="212" text-anchor="end">348 طلبہ تقریباً 350،</text><text class="body" x="208" y="232" text-anchor="end">تو 10 پر مشتمل 35 پیکٹ</text><text class="sh" x="600" y="324" text-anchor="middle">سابقہ ہندسے</text><text class="body" x="438" y="316" text-anchor="end">صرف پہلے ہندسے سے حساب کریں،</text><text class="body" x="438" y="336" text-anchor="end">جلدی سے اندازے کے لیے</text><text class="body" x="208" y="316" text-anchor="end">4,850 جمع 3,120 روپے</text><text class="body" x="208" y="336" text-anchor="end">یعنی "تقریباً 4,000 جمع 3,000"</text><text class="sh" x="600" y="404" text-anchor="middle">آسان اعداد</text><text class="body" x="438" y="396" text-anchor="end">قریبی ایسے اعداد چنیں جو</text><text class="body" x="438" y="416" text-anchor="end">صاف تقسیم یا ضرب ہوں</text><text class="body" x="208" y="396" text-anchor="end">47 ضرب 52 بن جاتا ہے 50 ضرب 50،</text><text class="body" x="208" y="416" text-anchor="end">جو 2,500 ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
