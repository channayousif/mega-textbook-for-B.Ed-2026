<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ اسکولی کاموں کی درجہ بندی کا جدول</title><desc id="d">پانچ اسکولی کاموں کی درجہ بندی کا جدول کہ انہیں مقداری استدلال کی ضرورت ہے یا نہیں، ہر خانے میں ایک وجہ کے ساتھ۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .yes { fill: var(--ink); } .no { fill: var(--muted); } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="620" y="82" text-anchor="middle">اسکولی کام</text><text class="h" x="375" y="82" text-anchor="middle">مقداری استدلال کی ضرورت</text><text class="h" x="140" y="82" text-anchor="middle">ضرورت نہیں</text><line class="grid" x1="490" y1="56" x2="490" y2="416"/><line class="grid" x1="260" y1="56" x2="260" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="224" x2="20" y2="224"/><line class="grid" x1="750" y1="288" x2="20" y2="288"/><line class="grid" x1="750" y1="352" x2="20" y2="352"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="body" x="738" y="122" text-anchor="end">داخلے کے اعداد سے</text><text class="body" x="738" y="140" text-anchor="end">گروپوں کا حجم طے کرنا</text><path class="yes" d="M384 116 l-5 6 l-10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="375" y="146" text-anchor="middle">تقسیم کرو، باقی دیکھو</text><path class="no" d="M149 114 l-12 12 M137 114 l12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="140" y="146" text-anchor="middle">غلط تقسیم طلبہ کو ناکام کرتی ہے</text><text class="body" x="738" y="186" text-anchor="end">مارک شیٹ پڑھ کر طے کرنا</text><text class="body" x="738" y="204" text-anchor="end">کہ کسے مدد چاہیے</text><path class="yes" d="M384 180 l-5 6 l-10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="375" y="210" text-anchor="middle">موازنہ کرو، نمونہ ڈھونڈو</text><path class="no" d="M149 178 l-12 12 M137 178 l12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="140" y="210" text-anchor="middle">صرف نمبر کافی نہیں</text><text class="body" x="738" y="250" text-anchor="end">دو کتاب فراہم کرنے والوں کا</text><text class="body" x="738" y="268" text-anchor="end">فی طالبِ علم لاگت پر موازنہ</text><path class="yes" d="M384 244 l-5 6 l-10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="375" y="274" text-anchor="middle">فی کس شرح فیصلہ کرتی ہے</text><path class="no" d="M149 242 l-12 12 M137 242 l12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="140" y="274" text-anchor="middle">کل رقم دھوکہ دیتی ہے</text><text class="body" x="738" y="324" text-anchor="end">اسکول کے بجٹ کی ایک سطر جانچنا</text><path class="yes" d="M384 308 l-5 6 l-10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="375" y="338" text-anchor="middle">خرچ منصوبے سے میل کھاتا ہے</text><path class="no" d="M149 306 l-12 12 M137 306 l12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="140" y="338" text-anchor="middle">ایک نظر بتا نہیں سکتی</text><text class="body" x="738" y="378" text-anchor="end">صبح کا اعلان</text><text class="body" x="738" y="396" text-anchor="end">لکھنا</text><path class="no" d="M384 372 l-12 12 M372 372 l12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="375" y="402" text-anchor="middle">الفاظ، اعداد نہیں</text><path class="yes" d="M149 372 l-5 6 l-10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="140" y="402" text-anchor="middle">سادہ لکھائی کی مہارت</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
