<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Barriers to critical thinking grouped by source</title><desc id="d">A concept map placing "barriers to critical thinking" at the centre with four branches showing where each barrier comes from and two examples of each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:11px;fill:var(--muted);text-anchor:middle} .wm{fill:var(--wm);font-size:11px}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse cx="390" cy="235" rx="120" ry="52" fill="var(--a3-fill)" stroke="var(--a3)" stroke-width="3"/><text class="h" x="390" y="232">barriers to</text><text class="h" x="390" y="252">critical thinking</text><rect class="panel" x="24" y="30" width="160" height="90" rx="6"/><text class="h" x="104" y="58">from the self</text><text x="104" y="82">egocentrism: my</text><text x="104" y="98">view is the natural one</text><text x="104" y="114">self-confirming search</text><rect class="panel" x="600" y="30" width="160" height="90" rx="6"/><text class="h" x="680" y="58">from the group</text><text x="680" y="82">group conformity:</text><text x="680" y="98">go along with the room</text><text x="680" y="114">silence feels safer</text><rect class="panel" x="24" y="350" width="160" height="90" rx="6"/><text class="h" x="104" y="378">from the wish</text><text x="104" y="402">wishful thinking:</text><text x="104" y="418">believe what you want true</text><text x="104" y="434">makes the work feel light</text><rect class="panel" x="600" y="350" width="160" height="90" rx="6"/><text class="h" x="680" y="378">from the assumption</text><text x="680" y="402">unexamined assumptions</text><text x="680" y="418">the argument rests on</text><text x="680" y="434">something not stated</text><line class="link" x1="240" y1="175" x2="170" y2="125" marker-end="url(#ar)"/><line class="link" x1="540" y1="175" x2="610" y2="125" marker-end="url(#ar)"/><line class="link" x1="240" y1="300" x2="170" y2="350" marker-end="url(#ar)"/><line class="link" x1="540" y1="300" x2="610" y2="350" marker-end="url(#ar)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>