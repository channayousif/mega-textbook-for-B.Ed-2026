<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Critical thinking is and is not</title><desc id="d">Table comparing what critical thinking is and what it is not across four rows, using short plain phrases.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .grid{stroke:var(--ink);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="16" y="16" width="748" height="438" fill="none" stroke="var(--ink)" stroke-width="2"/><line x1="16" y1="76" x2="764" y2="76" stroke="var(--ink)" stroke-width="2"/><line x1="390" y1="16" x2="390" y2="454" stroke="var(--ink)" stroke-width="2"/><text class="h" x="203" y="52" text-anchor="middle">Critical thinking IS</text><text class="h" x="577" y="52" text-anchor="middle">Critical thinking is NOT</text><line x1="16" y1="150" x2="764" y2="150" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="30" y="118">what it does</text><text x="400" y="112">judges reasoning against</text><text x="400" y="132">clear standards</text><text x="30" y="220">what it needs</text><text x="400" y="214">a piece of reasoning</text><text x="400" y="234">to examine</text><text class="h" x="30" y="192">how it decides</text><text x="400" y="186">applies clarity, accuracy,</text><text x="400" y="204">relevance, depth, logic</text><text class="h" x="30" y="304">classroom marker</text><text x="400" y="298">"what is the evidence,</text><text x="400" y="316">and does it support that?"</text><text class="h" x="30" y="276">who it is</text><text x="400" y="270">a skill that can</text><text x="400" y="288">be trained</text><text x="30" y="380">a hook</text><text x="400" y="374">short opening question</text><text x="400" y="392">sets up the topic</text><line x1="16" y1="340" x2="764" y2="340" stroke="var(--ink)" stroke-width="1.5"/><line x1="16" y1="410" x2="764" y2="410" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="203" y="118" text-anchor="middle" fill="var(--a1)"/><rect x="180" y="90" width="230" height="50" fill="none"/><text x="577" y="112" text-anchor="middle">finding fault with people</text><text x="577" y="214" text-anchor="middle">doubting everything</text><text x="577" y="270" text-anchor="middle">a fixed personality trait</text><text x="577" y="374" text-anchor="middle">a long reading list</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>