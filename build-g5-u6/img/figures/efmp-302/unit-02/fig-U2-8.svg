<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One plagiarism dilemma worked through the four steps</title><desc id="d">Diagram of one plagiarism dilemma worked through the four steps - Empathy, Context, Reflect and Action - with the two competing goods named in the Reflect panel.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .p{fill:var(--panel);stroke:var(--ink);stroke-width:2} .pr{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .num{fill:var(--a2)} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="780" height="100%"/><text class="m" x="390" y="14" text-anchor="middle"><tspan x="390" dy="0">Ayesha submits an essay that is</tspan><tspan x="390" dy="20">not her own work, three weeks</tspan><tspan x="390" dy="20">before the board examination.</tspan></text><rect class="p" x="20" y="50" width="366" height="150" rx="6"/><text class="h" x="36" y="78">1 Empathy</text><text x="36" y="94"><tspan x="36" dy="0">A father dead in</tspan><tspan x="36" dy="20">January.</tspan></text><text x="36" y="114"><tspan x="36" dy="0">Results collapsed</tspan><tspan x="36" dy="20">since.</tspan></text><text x="36" y="134"><tspan x="36" dy="0">A guide book on sale</tspan><tspan x="36" dy="20">at the gate.</tspan></text><text class="m" x="36" y="162"><tspan x="36" dy="0">What does this week</tspan><tspan x="36" dy="20">look like</tspan></text><text class="m" x="36" y="180"><tspan x="36" dy="0">from where she is</tspan><tspan x="36" dy="20">standing?</tspan></text><rect class="p" x="394" y="50" width="366" height="150" rx="6"/><text class="h" x="410" y="78">2 Context</text><text x="410" y="94"><tspan x="410" dy="0">First offence. Rule is zero and</tspan><tspan x="410" dy="20">report.</tspan></text><text x="410" y="114"><tspan x="410" dy="0">Head under results</tspan><tspan x="410" dy="20">pressure.</tspan></text><text x="410" y="134"><tspan x="410" dy="0">Not yet known: what changed at</tspan><tspan x="410" dy="20">home.</tspan></text><text class="m" x="410" y="162"><tspan x="410" dy="0">Establish the facts</tspan><tspan x="410" dy="20">before</tspan></text><text class="m" x="410" y="190">deciding, not after.</text><rect class="pr" x="20" y="212" width="366" height="150" rx="6"/><text class="h" x="36" y="240">3 Reflect</text><text x="36" y="256"><tspan x="36" dy="0">Honesty in</tspan><tspan x="36" dy="20">assessment, owed to</tspan></text><text x="36" y="276"><tspan x="36" dy="0">every other pupil</tspan><tspan x="36" dy="20">and the board.</tspan></text><text x="36" y="296"><tspan x="36" dy="0">Duty of care, owed to a grieving</tspan><tspan x="36" dy="20">child.</tspan></text><text class="m" x="36" y="324"><tspan x="36" dy="0">The school's results</tspan><tspan x="36" dy="20">pressure is a</tspan></text><text class="m" x="36" y="342"><tspan x="36" dy="0">pressure, not one of her</tspan><tspan x="36" dy="20">obligations.</tspan></text><rect class="p" x="394" y="212" width="366" height="150" rx="6"/><text class="h" x="410" y="240">4 Action</text><text x="410" y="256"><tspan x="410" dy="0">Mark stands at zero:</tspan><tspan x="410" dy="20">the work</tspan></text><text x="410" y="286">is not Ayesha's.</text><text x="410" y="296"><tspan x="410" dy="0">Report made: the rule is not hers</tspan><tspan x="410" dy="20">to waive.</tspan></text><text class="m" x="410" y="324"><tspan x="410" dy="0">Speak to Ayesha</tspan><tspan x="410" dy="20">first, so she is</tspan></text><text class="m" x="410" y="342"><tspan x="410" dy="0">not ambushed. Pastoral care,</tspan><tspan x="410" dy="20">separately.</tspan></text><text class="m" x="390" y="372" text-anchor="middle"><tspan x="390" dy="0">The decision costs something. It</tspan><tspan x="390" dy="20">is defensible because the cost</tspan><tspan x="390" dy="20">falls where it belongs.</tspan></text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
