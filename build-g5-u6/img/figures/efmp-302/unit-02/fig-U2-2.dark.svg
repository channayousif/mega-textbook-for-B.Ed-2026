<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What each party entrusts to a teacher</title><desc id="d">Concept map with trust at the centre and four branches showing what pupils, parents, the state and colleagues each entrust to a teacher, with an example breach on each branch.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .core{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .link{stroke:var(--line);stroke-width:2;fill:none} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="100%"/><line class="link" x1="330" y1="145" x2="230" y2="100" marker-end="url(#ar)"/><line class="link" x1="450" y1="145" x2="550" y2="100" marker-end="url(#ar)"/><line class="link" x1="330" y1="285" x2="230" y2="330" marker-end="url(#ar)"/><line class="link" x1="450" y1="285" x2="550" y2="330" marker-end="url(#ar)"/><ellipse class="core" cx="390" cy="215" rx="86" ry="52"/><text class="h" x="390" y="212" text-anchor="middle">TRUST</text><text class="m" x="390" y="236" text-anchor="middle">extended, not given</text><rect class="panel" x="24" y="40" width="250" height="86" rx="6"/><text class="h" x="36" y="64">Pupils entrust</text><text x="36" y="76"><tspan x="36" dy="0">their learning and</tspan><tspan x="36" dy="20">safety</tspan></text><text class="m" x="36" y="100"><tspan x="36" dy="0">breach: a confidence</tspan><tspan x="36" dy="20">repeated</tspan></text><rect class="panel" x="506" y="40" width="250" height="86" rx="6"/><text class="h" x="518" y="64">Parents entrust</text><text x="518" y="86">their children</text><text class="m" x="518" y="100"><tspan x="518" dy="0">breach: a report</tspan><tspan x="518" dy="20">that misleads</tspan></text><rect class="panel" x="24" y="316" width="250" height="86" rx="6"/><text class="h" x="36" y="340">The state entrusts</text><text x="36" y="352"><tspan x="36" dy="0">its curriculum and</tspan><tspan x="36" dy="20">marks</tspan></text><text class="m" x="36" y="376"><tspan x="36" dy="0">breach: a mark</tspan><tspan x="36" dy="20">nobody earned</tspan></text><rect class="panel" x="506" y="316" width="250" height="86" rx="6"/><text class="h" x="518" y="340">Colleagues entrust</text><text x="518" y="352"><tspan x="518" dy="0">the profession's</tspan><tspan x="518" dy="20">standing</tspan></text><text class="m" x="518" y="376"><tspan x="518" dy="0">breach: one</tspan><tspan x="518" dy="20">teacher's misconduct</tspan></text><text class="m" x="390" y="420" text-anchor="middle"><tspan x="390" dy="0">Built slowly by ordinary reliable</tspan><tspan x="390" dy="20">acts. Spent invisibly. Destroyed</tspan><tspan x="390" dy="20">in one.</tspan></text><text class="wm" x="768" y="510" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
