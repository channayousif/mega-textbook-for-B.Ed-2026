<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four-step ethical decision framework, drawn as a loop</title><desc id="d">Flowchart of the four-step ethical decision framework drawn as a loop - Empathy, Context, Reflect, Action - with each station carrying its guiding question and the return arrow labelled what did this teach me for next time.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .st{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .flow{stroke:var(--a2);stroke-width:2.5;fill:none} .back{stroke:var(--a1);stroke-width:2.5;stroke-dasharray:6 4;fill:none} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700} .m{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="100%"/><rect class="st" x="40" y="56" width="200" height="86" rx="8"/><text class="h" x="140" y="84" text-anchor="middle">1 Empathy</text><text class="m" x="140" y="96" text-anchor="middle"><tspan x="140" dy="0">Who is affected, and</tspan><tspan x="140" dy="20">what</tspan></text><text class="m" x="140" y="114" text-anchor="middle"><tspan x="140" dy="0">does this look like</tspan><tspan x="140" dy="20">to them?</tspan></text><rect class="st" x="540" y="56" width="200" height="86" rx="8"/><text class="h" x="640" y="84" text-anchor="middle">2 Context</text><text class="m" x="640" y="96" text-anchor="middle"><tspan x="640" dy="0">What are the facts,</tspan><tspan x="640" dy="20">rules</tspan></text><text class="m" x="640" y="124" text-anchor="middle">and constraints?</text><rect class="st" x="540" y="250" width="200" height="86" rx="8"/><text class="h" x="640" y="278" text-anchor="middle">3 Reflect</text><text class="m" x="640" y="290" text-anchor="middle"><tspan x="640" dy="0">Weigh obligations,</tspan><tspan x="640" dy="20">not</tspan></text><text class="m" x="640" y="308" text-anchor="middle"><tspan x="640" dy="0">comfort. Name what</tspan><tspan x="640" dy="20">competes.</tspan></text><rect class="st" x="40" y="250" width="200" height="86" rx="8"/><text class="h" x="140" y="278" text-anchor="middle">4 Action</text><text class="m" x="140" y="300" text-anchor="middle">Decide, do it,</text><text class="m" x="140" y="318" text-anchor="middle">and close the loop.</text><line class="flow" x1="240" y1="99" x2="535" y2="99" marker-end="url(#a)"/><line class="flow" x1="640" y1="142" x2="640" y2="245" marker-end="url(#a)"/><line class="flow" x1="540" y1="293" x2="245" y2="293" marker-end="url(#a)"/><path class="back" d="M140 250 L140 196 L140 147" marker-end="url(#c)"/><text class="m" x="158" y="178"><tspan x="158" dy="0">what did this teach</tspan><tspan x="158" dy="20">me</tspan></text><text class="m" x="158" y="206">for next time?</text><text class="m" x="390" y="360" text-anchor="middle"><tspan x="390" dy="0">A loop, not a line. A decision</tspan><tspan x="390" dy="20">never reviewed cannot teach you</tspan><tspan x="390" dy="20">anything.</tspan></text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
