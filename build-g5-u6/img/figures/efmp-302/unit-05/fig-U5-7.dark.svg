<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three regions: control, influence, and neither</title><desc id="d">Concentric circles diagram showing what a teacher controls, what they can influence, and the third region of what they do not control, with a note that most frustration comes from effort spent in that third region.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .r3{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .r2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .r1{fill:var(--a1-fill);stroke:var(--a1);stroke-width:3} .lb{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} text{font-size:11.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .n{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="880" height="100%"/><rect class="r3" x="20" y="24" width="480" height="380" rx="8"/><text class="n" x="36" y="38"><tspan x="36" dy="0">Third region: what you do not</tspan><tspan x="36" dy="20">control</tspan></text><text class="m" x="36" y="48"><tspan x="36" dy="0">pay scales . class size . the</tspan><tspan x="36" dy="20">electricity supply . the</tspan><tspan x="36" dy="20">examination system</tspan></text><ellipse class="r2" cx="260" cy="248" rx="200" ry="130"/><text class="n" x="260" y="140" text-anchor="middle"><tspan x="260" dy="0">Second region: what you can</tspan><tspan x="260" dy="20">influence</tspan></text><text class="m" x="260" y="160" text-anchor="middle"><tspan x="260" dy="0">a colleague's practice . a head's</tspan><tspan x="260" dy="20">decision</tspan></text><text class="m" x="260" y="186" text-anchor="middle">a departmental habit</text><ellipse class="r1" cx="260" cy="272" rx="140" ry="76"/><text class="n" x="260" y="230" text-anchor="middle"><tspan x="260" dy="0">First region: what</tspan><tspan x="260" dy="20">you control</tspan></text><text class="m" x="260" y="250" text-anchor="middle"><tspan x="260" dy="0">how you prepare . how you speak to</tspan><tspan x="260" dy="20">a pupil</tspan></text><text class="m" x="260" y="266" text-anchor="middle"><tspan x="260" dy="0">the first ten minutes . what you</tspan><tspan x="260" dy="20">read</tspan></text><text class="m" x="260" y="292" text-anchor="middle">who you ask for help</text><rect class="lb" x="530" y="60" width="330" height="96" rx="6"/><text class="h" x="542" y="74"><tspan x="542" dy="0">Where frustration</tspan><tspan x="542" dy="20">comes from</tspan></text><text class="m" x="542" y="96"><tspan x="542" dy="0">Most professional frustration is</tspan><tspan x="542" dy="20">effort spent in the</tspan></text><text class="m" x="542" y="114"><tspan x="542" dy="0">THIRD region: arguing with a pay</tspan><tspan x="542" dy="20">scale, or waiting</tspan></text><text class="m" x="542" y="132"><tspan x="542" dy="0">for a class size to change before</tspan><tspan x="542" dy="20">teaching well.</tspan></text><rect class="lb" x="530" y="176" width="330" height="114" rx="6"/><text class="h" x="542" y="190"><tspan x="542" dy="0">And the opposite</tspan><tspan x="542" dy="20">failure</tspan></text><text class="m" x="542" y="212"><tspan x="542" dy="0">Naming the third region accurately</tspan><tspan x="542" dy="20">is not the same</tspan></text><text class="m" x="542" y="230"><tspan x="542" dy="0">as being excused by it. The</tspan><tspan x="542" dy="20">characteristic failure of</tspan></text><text class="m" x="542" y="248"><tspan x="542" dy="0">an experienced teacher in a hard</tspan><tspan x="542" dy="20">system is to use a</tspan></text><text class="m" x="542" y="266"><tspan x="542" dy="0">true judgement about region three</tspan><tspan x="542" dy="20">to justify doing</tspan></text><text class="m" x="530" y="286"><tspan x="530" dy="0">nothing in region</tspan><tspan x="530" dy="20">one.</tspan></text><rect class="lb" x="530" y="310" width="330" height="72" rx="6"/><text class="h" x="542" y="324"><tspan x="542" dy="0">The three regions exhaust the</tspan><tspan x="542" dy="20">situation</tspan></text><text class="m" x="542" y="346"><tspan x="542" dy="0">Every part of a teacher's working</tspan><tspan x="542" dy="20">life sits in exactly</tspan></text><text class="m" x="542" y="364"><tspan x="542" dy="0">one of them. There is no fourth</tspan><tspan x="542" dy="20">place to stand.</tspan></text><text class="m" x="20" y="406"><tspan x="20" dy="0">The regions are not fixed. A</tspan><tspan x="20" dy="20">teacher who builds standing over a</tspan><tspan x="20" dy="20">term moves items from the third</tspan><tspan x="20" dy="20">region into the second.</tspan></text><text class="wm" x="868" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
