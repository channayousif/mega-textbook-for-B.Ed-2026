<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Six parties, and the gap between what they want and what they measure</title><desc id="d">Concept map of a teacher surrounded by six parties making demands - pupils, parents, head, district, examination system and the public - each link labelled with what that party wants and what it actually measures.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ctr{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .n{fill:var(--panel);stroke:var(--a2);stroke-width:2} .ng{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .e{stroke:var(--a2);stroke-width:2;fill:none} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12.5px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a2)"/></marker></defs><rect class="bg" x="0" y="0" width="920" height="100%"/><rect class="ctr" x="370" y="200" width="160" height="60" rx="8"/><text class="h" x="450" y="226" text-anchor="middle">The teacher</text><text class="m" x="450" y="236" text-anchor="middle"><tspan x="450" dy="0">one person, six</tspan><tspan x="450" dy="20">demands</tspan></text><rect class="n" x="20" y="30" width="250" height="60" rx="6"/><text class="h" x="32" y="50">Pupils</text><text class="m" x="32" y="58"><tspan x="32" dy="0">want: to understand, and to be</tspan><tspan x="32" dy="20">treated fairly</tspan></text><text class="m" x="32" y="74"><tspan x="32" dy="0">measure: whether the lesson was</tspan><tspan x="32" dy="20">bearable</tspan></text><path class="e" d="M370 214 L278 90" marker-end="url(#a)"/><rect class="n" x="630" y="30" width="250" height="60" rx="6"/><text class="h" x="642" y="50">Parents</text><text class="m" x="642" y="58"><tspan x="642" dy="0">want: their child to</tspan><tspan x="642" dy="20">progress</tspan></text><text class="m" x="642" y="74"><tspan x="642" dy="0">measure: the marks,</tspan><tspan x="642" dy="20">and the report</tspan></text><path class="e" d="M530 214 L622 90" marker-end="url(#a)"/><rect class="n" x="20" y="120" width="250" height="60" rx="6"/><text class="h" x="32" y="140">The head teacher</text><text class="m" x="32" y="148"><tspan x="32" dy="0">wants: a school that runs, and no</tspan><tspan x="32" dy="20">complaints</tspan></text><text class="m" x="32" y="164"><tspan x="32" dy="0">measure: whether you cause</tspan><tspan x="32" dy="20">problems</tspan></text><path class="e" d="M370 222 L278 172" marker-end="url(#a)"/><rect class="ng" x="630" y="120" width="250" height="60" rx="6"/><text class="h" x="642" y="140">The district office</text><text class="m" x="642" y="148"><tspan x="642" dy="0">wants: compliance and returns on</tspan><tspan x="642" dy="20">time</tspan></text><text class="m" x="642" y="164"><tspan x="642" dy="0">measure: the paperwork, never the</tspan><tspan x="642" dy="20">teaching</tspan></text><path class="e" d="M530 222 L622 172" marker-end="url(#a)"/><rect class="ng" x="20" y="290" width="250" height="60" rx="6"/><text class="h" x="32" y="300"><tspan x="32" dy="0">The examination</tspan><tspan x="32" dy="20">system</tspan></text><text class="m" x="32" y="318"><tspan x="32" dy="0">wants: candidates</tspan><tspan x="32" dy="20">who can pass</tspan></text><text class="m" x="32" y="334"><tspan x="32" dy="0">measure: one paper,</tspan><tspan x="32" dy="20">on one day</tspan></text><path class="e" d="M370 248 L278 300" marker-end="url(#a)"/><rect class="ng" x="630" y="290" width="250" height="60" rx="6"/><text class="h" x="642" y="310">The wider public</text><text class="m" x="642" y="318"><tspan x="642" dy="0">wants: teachers to be respected</tspan><tspan x="642" dy="20">and effective</tspan></text><text class="m" x="642" y="334"><tspan x="642" dy="0">measure: the aggregate result, in</tspan><tspan x="642" dy="20">the newspaper</tspan></text><path class="e" d="M530 248 L622 300" marker-end="url(#a)"/><rect class="ng" x="300" y="390" width="300" height="34" rx="5"/><text class="m" x="450" y="401" text-anchor="middle"><tspan x="450" dy="0">Shaded: what is measured differs</tspan><tspan x="450" dy="20">most from what is wanted</tspan></text><text class="m" x="30" y="404"><tspan x="30" dy="0">No party is unreasonable on its</tspan><tspan x="30" dy="20">own. The load is that six of them</tspan><tspan x="30" dy="20">arrive at one person, and four</tspan><tspan x="30" dy="20">measure</tspan></text><text class="m" x="30" y="442"><tspan x="30" dy="0">something other than what they say</tspan><tspan x="30" dy="20">they want.</tspan></text><text class="wm" x="908" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
