<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Where the professional and personal digital lives overlap</title><desc id="d">Diagram of overlapping professional and personal digital regions, with the crossing cases labelled - private messages from pupils, parents on personal accounts, personal posts visible to the school, and after-hours class groups.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .pro{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5;fill-opacity:0.75} .per{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5;fill-opacity:0.75} .cs{fill:var(--panel);stroke:var(--a3);stroke-width:2} text{font-size:11.5px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .s{font-size:11px} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="880" height="100%"/><ellipse class="pro" cx="290" cy="150" rx="210" ry="110"/><ellipse class="per" cx="470" cy="150" rx="210" ry="110"/><text class="h" x="160" y="90" text-anchor="middle">Professional</text><text class="m" x="160" y="112" text-anchor="middle">class groups</text><text class="m" x="160" y="130" text-anchor="middle">school accounts</text><text class="m" x="160" y="148" text-anchor="middle">shared resources</text><text class="h" x="600" y="90" text-anchor="middle">Personal</text><text class="m" x="600" y="112" text-anchor="middle">private accounts</text><text class="m" x="600" y="130" text-anchor="middle">personal messaging</text><text class="m" x="600" y="148" text-anchor="middle">family and friends</text><text class="h" x="380" y="126" text-anchor="middle">The overlap</text><text class="m" x="380" y="146" text-anchor="middle">where the</text><text class="m" x="380" y="164" text-anchor="middle">rules are needed</text><rect class="cs" x="20" y="290" width="410" height="54" rx="5"/><text class="s" x="32" y="302"><tspan x="32" dy="0">A pupil sends a</tspan><tspan x="32" dy="20">private message</tspan></text><text class="m" x="32" y="322"><tspan x="32" dy="0">Rule: reply on the class channel,</tspan><tspan x="32" dy="20">never privately. Tell a colleague.</tspan></text><rect class="cs" x="450" y="290" width="410" height="54" rx="5"/><text class="s" x="462" y="302"><tspan x="462" dy="0">A parent asks to join a personal</tspan><tspan x="462" dy="20">account</tspan></text><text class="m" x="462" y="322"><tspan x="462" dy="0">Rule: decline, and name the</tspan><tspan x="462" dy="20">official channel instead.</tspan></text><rect class="cs" x="20" y="354" width="410" height="54" rx="5"/><text class="s" x="32" y="366"><tspan x="32" dy="0">A personal post is visible to the</tspan><tspan x="32" dy="20">school community</tspan></text><text class="m" x="32" y="376"><tspan x="32" dy="0">Rule: assume every pupil and</tspan><tspan x="32" dy="20">parent will see it, because they</tspan><tspan x="32" dy="20">can.</tspan></text><rect class="cs" x="450" y="354" width="410" height="54" rx="5"/><text class="s" x="462" y="366"><tspan x="462" dy="0">The class group runs</tspan><tspan x="462" dy="20">after hours</tspan></text><text class="m" x="462" y="386"><tspan x="462" dy="0">Rule: state the hours you answer,</tspan><tspan x="462" dy="20">in writing, at the start.</tspan></text><text class="m" x="20" y="410"><tspan x="20" dy="0">The overlap is not avoidable and</tspan><tspan x="20" dy="20">does not need to be. What it needs</tspan><tspan x="20" dy="20">is a rule decided in advance,</tspan><tspan x="20" dy="20">because deciding case by case,</tspan></text><text class="m" x="20" y="448"><tspan x="20" dy="0">at speed, in a message thread, is</tspan><tspan x="20" dy="20">how boundaries are lost.</tspan></text><text class="wm" x="868" y="490" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
