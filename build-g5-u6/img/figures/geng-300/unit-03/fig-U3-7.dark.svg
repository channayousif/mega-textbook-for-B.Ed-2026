<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Conversational moves for professional talk</title><desc id="d">Table comparing conversational moves for small talk, networking and professional dialogue with the move and an example phrase for each situation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="220" height="70"/><text class="h" x="110" y="32" text-anchor="middle">Situation</text><text class="small" x="110" y="54" text-anchor="middle">where you are speaking</text><rect class="panel-b" x="220" y="0" width="280" height="70"/><text class="h" x="360" y="32" text-anchor="middle">The move</text><text class="small" x="360" y="54" text-anchor="middle">what you aim to do</text><rect class="panel-c" x="500" y="0" width="280" height="70"/><text class="h" x="640" y="32" text-anchor="middle">Example phrase</text><text class="small" x="640" y="54" text-anchor="middle">one way to say it</text><rect class="panel" x="0" y="70" width="220" height="130"/><text class="sh" x="110" y="140" text-anchor="middle">Small talk</text><rect class="panel" x="0" y="200" width="220" height="130"/><text class="sh" x="110" y="270" text-anchor="middle">Networking</text><rect class="panel" x="0" y="330" width="220" height="130"/><text class="sh" x="110" y="400" text-anchor="middle">Professional dialogue</text><text class="body" x="360" y="112" text-anchor="middle">open gently, find</text><text class="body" x="360" y="132" text-anchor="middle">common ground</text><text class="small" x="360" y="168" text-anchor="middle">keep it light and open</text><text class="body" x="360" y="242" text-anchor="middle">introduce yourself,</text><text class="body" x="360" y="262" text-anchor="middle">exchange value</text><text class="small" x="360" y="298" text-anchor="middle">be curious about them</text><text class="body" x="360" y="372" text-anchor="middle">state purpose, listen,</text><text class="body" x="360" y="392" text-anchor="middle">build agreement</text><text class="small" x="360" y="428" text-anchor="middle">be clear and respectful</text><text class="body" x="640" y="112" text-anchor="middle">What brought you</text><text class="body" x="640" y="132" text-anchor="middle">to this event?</text><text class="body" x="640" y="242" text-anchor="middle">Tell me about the</text><text class="body" x="640" y="262" text-anchor="middle">work you enjoy most.</text><text class="body" x="640" y="372" text-anchor="middle">My aim today is to</text><text class="body" x="640" y="392" text-anchor="middle">agree next steps.</text><line class="grid" x1="220" y1="0" x2="220" y2="470"/><line class="grid" x1="500" y1="0" x2="500" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="200" x2="780" y2="200"/><line class="grid" x1="0" y1="330" x2="780" y2="330"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
