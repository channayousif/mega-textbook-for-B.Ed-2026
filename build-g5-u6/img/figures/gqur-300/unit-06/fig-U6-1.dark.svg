<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of building a monthly budget</title><desc id="d">Flowchart of building a monthly budget: income, fixed costs, variable costs, savings, review, looping to next month's plan.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">A monthly budget in five parts</text><rect class="panel-a" x="30" y="140" width="130" height="120" rx="10"/><text class="sh" x="95" y="176" text-anchor="middle">1. Income</text><text class="small" x="95" y="200" text-anchor="middle">all money coming</text><text class="small" x="95" y="218" text-anchor="middle">in this month</text><rect class="panel-b" x="185" y="140" width="130" height="120" rx="10"/><text class="sh" x="250" y="170" text-anchor="middle">2. Fixed</text><text class="sh" x="250" y="188" text-anchor="middle">costs</text><text class="small" x="250" y="210" text-anchor="middle">rent, instalments:</text><text class="small" x="250" y="228" text-anchor="middle">they do not change</text><rect class="panel-c" x="340" y="140" width="130" height="120" rx="10"/><text class="sh" x="405" y="170" text-anchor="middle">3. Savings</text><text class="small" x="405" y="196" text-anchor="middle">set aside before</text><text class="small" x="405" y="214" text-anchor="middle">spending,</text><text class="small" x="405" y="232" text-anchor="middle">not after</text><rect class="panel" x="495" y="140" width="130" height="120" rx="10"/><text class="sh" x="560" y="170" text-anchor="middle">4. Variable</text><text class="sh" x="560" y="188" text-anchor="middle">costs</text><text class="small" x="560" y="210" text-anchor="middle">food, transport:</text><text class="small" x="560" y="228" text-anchor="middle">what is left to spend</text><rect class="panel-a" x="650" y="140" width="120" height="120" rx="10"/><text class="sh" x="710" y="176" text-anchor="middle">5. Review</text><text class="small" x="710" y="200" text-anchor="middle">plan vs actual</text><text class="small" x="710" y="218" text-anchor="middle">at month end</text><line class="stroke" x1="160" y1="200" x2="179" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="315" y1="200" x2="334" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="470" y1="200" x2="489" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="625" y1="200" x2="644" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M 710 260 L 710 330 L 95 330 L 95 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="402" y="322" text-anchor="middle">the review feeds next month's plan</text><text class="body" x="390" y="392" text-anchor="middle">Savings before spending: what is left after spending is usually nothing.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
