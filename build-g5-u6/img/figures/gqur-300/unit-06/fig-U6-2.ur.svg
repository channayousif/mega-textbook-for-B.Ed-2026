<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">چار مالی اصطلاحات کا جدول</title><desc id="d">چار مالی اصطلاحات کا جدول: ہر ایک کیا ناپتی ہے اور روپوں میں ایک حل شدہ مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="620" y="82" text-anchor="middle">اصطلاح</text><text class="h" x="390" y="82" text-anchor="middle">کیا ناپتی ہے</text><text class="h" x="155" y="82" text-anchor="middle">حل شدہ مثال</text><line class="grid" x1="490" y1="56" x2="490" y2="416"/><line class="grid" x1="280" y1="56" x2="280" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="264" x2="20" y2="264"/><line class="grid" x1="750" y1="368" x2="20" y2="368"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="620" y="116" text-anchor="middle">منافع</text><text class="body" x="478" y="116" text-anchor="end">کل آمدنی منہا کل لاگت</text><text class="small" x="268" y="108" text-anchor="end">7,200 - 5,600 = 1,600 روپے،</text><text class="small" x="268" y="128" text-anchor="end">لاگت کا تقریباً 28.6 فیصد</text><text class="sh" x="620" y="220" text-anchor="middle">نقصان</text><text class="body" x="478" y="220" text-anchor="end">لاگت آمدنی سے زیادہ</text><text class="small" x="268" y="212" text-anchor="end">آمدنی 3,600 بمقابلہ لاگت 5,600:</text><text class="small" x="268" y="232" text-anchor="end">نقصان 2,000، تقریباً 35.7 فیصد</text><text class="sh" x="620" y="324" text-anchor="middle">سودِ سادہ</text><text class="body" x="478" y="316" text-anchor="end">اصل رقم کا مقررہ فیصد</text><text class="body" x="478" y="336" text-anchor="end">فی سال</text><text class="small" x="268" y="316" text-anchor="end">10,000 روپے 5 فیصد پر 3 سال میں</text><text class="small" x="268" y="336" text-anchor="end">1,500 روپے کمانے ہیں</text><text class="sh" x="620" y="404" text-anchor="middle">بجٹ</text><text class="body" x="478" y="396" text-anchor="end">پیسہ آنے سے پہلے</text><text class="body" x="478" y="416" text-anchor="end">اس کا منصوبہ</text><text class="small" x="268" y="396" text-anchor="end">25,000 آمدنی: 12,000 مقررہ، 3,000 بچت،</text><text class="small" x="268" y="416" text-anchor="end">10,000 بدلنے والے اخراجات</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
