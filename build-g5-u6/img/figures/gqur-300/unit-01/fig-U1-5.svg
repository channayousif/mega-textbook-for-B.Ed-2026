<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the four-step problem-solving strategy</title><desc id="d">Flowchart of the four-step problem-solving strategy: understand, plan, carry out, and look back, with a loop back to understand when the check fails.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="30" y="150" width="160" height="110" rx="10"/><text class="sh" x="110" y="188" text-anchor="middle">1. Understand</text><text class="small" x="110" y="212" text-anchor="middle">what is asked,</text><text class="small" x="110" y="230" text-anchor="middle">what is given</text><rect class="panel-b" x="215" y="150" width="160" height="110" rx="10"/><text class="sh" x="295" y="188" text-anchor="middle">2. Make a plan</text><text class="small" x="295" y="212" text-anchor="middle">choose a method</text><text class="small" x="295" y="230" text-anchor="middle">or a model</text><rect class="panel-c" x="400" y="150" width="160" height="110" rx="10"/><text class="sh" x="480" y="188" text-anchor="middle">3. Carry out</text><text class="small" x="480" y="212" text-anchor="middle">compute carefully,</text><text class="small" x="480" y="230" text-anchor="middle">keep the units</text><rect class="panel" x="585" y="150" width="160" height="110" rx="10"/><text class="sh" x="665" y="188" text-anchor="middle">4. Look back</text><text class="small" x="665" y="212" text-anchor="middle">check the answer</text><text class="small" x="665" y="230" text-anchor="middle">against the question</text><line class="stroke" x1="190" y1="205" x2="209" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="375" y1="205" x2="394" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="205" x2="579" y2="205" marker-end="url(#arrow)"/><path class="stroke" d="M 745 260 L 745 330 L 110 330 L 110 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="427" y="322" text-anchor="middle">if the check fails, return to step 1</text><text class="h" x="390" y="80" text-anchor="middle">A four-step problem-solving strategy</text><text class="body" x="390" y="108" text-anchor="middle">Understand, plan, carry out, look back - and loop until the</text><text class="body" x="390" y="128" text-anchor="middle">answer survives the real-world check.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
