<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of one classroom corner as perimeter, area and volume</title><desc id="d">Diagram of one classroom corner shown three ways: a fence line for perimeter, a floor carpet for area, and a water tank for volume, each labelled with its dimension and unit.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">One corner, three questions</text><rect class="panel-a" x="40" y="90" width="210" height="240" rx="10"/><rect class="stroke" x="85" y="130" width="120" height="90" fill="none" stroke-width="6"/><text class="sh" x="145" y="254" text-anchor="middle">Perimeter</text><text class="small" x="145" y="278" text-anchor="middle">the boundary, one-dimensional,</text><text class="small" x="145" y="298" text-anchor="middle">measured in metres</text><text class="small" x="145" y="318" text-anchor="middle">"how much skirting?"</text><rect class="panel-b" x="285" y="90" width="210" height="240" rx="10"/><rect class="panel" x="330" y="130" width="120" height="90"/><g class="stroke" stroke-width="1" opacity="0.5"><line x1="370" y1="130" x2="370" y2="220"/><line x1="410" y1="130" x2="410" y2="220"/><line x1="450" y1="130" x2="450" y2="220"/><line x1="330" y1="160" x2="450" y2="160"/><line x1="330" y1="190" x2="450" y2="190"/></g><text class="sh" x="390" y="254" text-anchor="middle">Area</text><text class="small" x="390" y="278" text-anchor="middle">the cover, two-dimensional,</text><text class="small" x="390" y="298" text-anchor="middle">measured in square metres</text><text class="small" x="390" y="318" text-anchor="middle">"how many tiles?"</text><rect class="panel-c" x="530" y="90" width="210" height="240" rx="10"/><rect class="panel" x="585" y="130" width="100" height="90"/><line class="stroke" x1="585" y1="130" x2="565" y2="112" stroke-width="2"/><line class="stroke" x1="685" y1="130" x2="665" y2="112" stroke-width="2"/><line class="stroke" x1="565" y1="112" x2="665" y2="112" stroke-width="2"/><line class="stroke" x1="565" y1="112" x2="565" y2="202" stroke-width="2"/><line class="stroke" x1="565" y1="202" x2="585" y2="220" stroke-width="2"/><text class="sh" x="635" y="254" text-anchor="middle">Volume</text><text class="small" x="635" y="278" text-anchor="middle">the fill, three-dimensional,</text><text class="small" x="635" y="298" text-anchor="middle">in cubic metres or litres</text><text class="small" x="635" y="318" text-anchor="middle">"how much water?"</text><text class="body" x="390" y="386" text-anchor="middle">The same corner answers three different questions;</text><text class="body" x="390" y="410" text-anchor="middle">confusing them is expensive: skirting is not bought by the square metre.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
