<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of metric unit ladders for length, mass and capacity</title><desc id="d">Table of metric unit ladders for length, mass and capacity with conversion steps and a market example under each group.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">The three metric ladders</text><text class="body" x="390" y="74" text-anchor="middle">Every step multiplies or divides by a power of ten.</text><rect class="panel-a" x="30" y="100" width="230" height="290" rx="10"/><text class="sh" x="145" y="128" text-anchor="middle">Length</text><text class="body" x="145" y="160" text-anchor="middle">1 kilometre = 1,000 metres</text><text class="body" x="145" y="188" text-anchor="middle">1 metre = 100 centimetres</text><text class="body" x="145" y="216" text-anchor="middle">1 centimetre = 10 millimetres</text><text class="small" x="145" y="262" text-anchor="middle">market example:</text><text class="small" x="145" y="284" text-anchor="middle">cloth sold by the metre,</text><text class="small" x="145" y="302" text-anchor="middle">cut in centimetres</text><rect class="panel-b" x="275" y="100" width="230" height="290" rx="10"/><text class="sh" x="390" y="128" text-anchor="middle">Mass</text><text class="body" x="390" y="160" text-anchor="middle">1 kilogram = 1,000 grams</text><text class="body" x="390" y="188" text-anchor="middle">1 gram = 1,000 milligrams</text><text class="small" x="390" y="262" text-anchor="middle">market example:</text><text class="small" x="390" y="284" text-anchor="middle">sugar sold by the kilogram,</text><text class="small" x="390" y="302" text-anchor="middle">recipes in grams</text><rect class="panel-c" x="520" y="100" width="230" height="290" rx="10"/><text class="sh" x="635" y="128" text-anchor="middle">Capacity</text><text class="body" x="635" y="160" text-anchor="middle">1 litre = 1,000 millilitres</text><text class="small" x="635" y="262" text-anchor="middle">market example:</text><text class="small" x="635" y="284" text-anchor="middle">milk sold by the litre,</text><text class="small" x="635" y="302" text-anchor="middle">medicine in millilitres</text><text class="small" x="390" y="440" text-anchor="middle">kilo- means a thousand, centi- a hundredth, milli- a thousandth.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
