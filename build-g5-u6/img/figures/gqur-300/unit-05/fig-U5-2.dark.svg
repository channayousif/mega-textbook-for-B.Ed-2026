<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of three data collection methods</title><desc id="d">Table of three data collection methods with what each is, what it suits, and a school example.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="140" y="82" text-anchor="middle">Method</text><text class="h" x="330" y="82" text-anchor="middle">What it is</text><text class="h" x="520" y="82" text-anchor="middle">What it suits</text><text class="h" x="665" y="82" text-anchor="middle">School example</text><line class="grid" x1="240" y1="56" x2="240" y2="416"/><line class="grid" x1="420" y1="56" x2="420" y2="416"/><line class="grid" x1="590" y1="56" x2="590" y2="416"/><line class="grid" x1="30" y1="176" x2="760" y2="176"/><line class="grid" x1="30" y1="296" x2="760" y2="296"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="140" y="116" text-anchor="middle">Observation</text><text class="body" x="252" y="112">watch and note what</text><text class="body" x="252" y="132">actually happens</text><text class="body" x="432" y="112">behaviour you can see:</text><text class="body" x="432" y="132">arrivals, queues, use</text><text class="small" x="602" y="112">arrival times at the gate</text><text class="small" x="602" y="132">for one week</text><text class="sh" x="140" y="236" text-anchor="middle">Survey</text><text class="body" x="252" y="232">ask people a fixed set</text><text class="body" x="252" y="252">of questions</text><text class="body" x="432" y="232">opinions and choices:</text><text class="body" x="432" y="252">preferences, reasons</text><text class="small" x="602" y="232">forty pupils, one question,</text><text class="small" x="602" y="252">three choices</text><text class="sh" x="140" y="356" text-anchor="middle">Records</text><text class="body" x="252" y="352">use what is already</text><text class="body" x="252" y="372">written down</text><text class="body" x="432" y="352">the past: attendance,</text><text class="body" x="432" y="372">marks, accounts</text><text class="small" x="602" y="352">last term's attendance</text><text class="small" x="602" y="372">registers</text><text class="small" x="390" y="440" text-anchor="middle">The method must match the question - a survey cannot watch a gate.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
