<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">تین طریقوں سے معطیات جمع کرنے کا جدول</title><desc id="d">تین طریقوں سے معطیات جمع کرنے کا جدول: ہر ایک کیا ہے، کس سوال کے لیے موزوں ہے، اور اسکول کی ایک مثال۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="640" y="82" text-anchor="middle">طریقہ</text><text class="h" x="450" y="82" text-anchor="middle">کیا ہے</text><text class="h" x="260" y="82" text-anchor="middle">کس کے لیے</text><text class="h" x="115" y="82" text-anchor="middle">اسکول کی مثال</text><line class="grid" x1="540" y1="56" x2="540" y2="416"/><line class="grid" x1="360" y1="56" x2="360" y2="416"/><line class="grid" x1="190" y1="56" x2="190" y2="416"/><line class="grid" x1="750" y1="176" x2="20" y2="176"/><line class="grid" x1="750" y1="296" x2="20" y2="296"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="640" y="116" text-anchor="middle">مشاہدہ</text><text class="body" x="528" y="112" text-anchor="end">دیکھیں اور نوٹ کریں</text><text class="body" x="528" y="132" text-anchor="end">جو واقعی ہوتا ہے</text><text class="body" x="348" y="112" text-anchor="end">دکھائی دینے والا رویہ:</text><text class="body" x="348" y="132" text-anchor="end">آمد، قطاریں، استعمال</text><text class="small" x="178" y="112" text-anchor="end">ایک ہفتے دروازے پر</text><text class="small" x="178" y="132" text-anchor="end">آنے کے اوقات</text><text class="sh" x="640" y="236" text-anchor="middle">سروے</text><text class="body" x="528" y="232" text-anchor="end">مقررہ سوالات پوچھیں</text><text class="body" x="528" y="252" text-anchor="end">اور جواب لکھیں</text><text class="body" x="348" y="232" text-anchor="end">رائے اور انتخاب:</text><text class="body" x="348" y="252" text-anchor="end">پسند، وجوہات</text><text class="small" x="178" y="232" text-anchor="end">چالیس طلبہ، ایک سوال،</text><text class="small" x="178" y="252" text-anchor="end">تین اختیار</text><text class="sh" x="640" y="356" text-anchor="middle">رجسٹر</text><text class="body" x="528" y="352" text-anchor="end">جو پہلے سے لکھا ہے</text><text class="body" x="528" y="372" text-anchor="end">اسے استعمال کریں</text><text class="body" x="348" y="352" text-anchor="end">ماضی: حاضری، نمبر،</text><text class="body" x="348" y="372" text-anchor="end">کھاتے</text><text class="small" x="178" y="352" text-anchor="end">پچھلے سمسٹر کے</text><text class="small" x="178" y="372" text-anchor="end">حاضری رجسٹر</text><text class="small" x="390" y="440" text-anchor="middle">طریقہ سوال سے میل کھائے - سروے دروازے کی نگرانی نہیں کر سکتا۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
