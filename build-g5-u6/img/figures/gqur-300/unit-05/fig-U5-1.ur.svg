<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">معطیات کے چکر کا فلو چارٹ</title><desc id="d">معطیات کے چکر کا فلو چارٹ: سوال کریں، جمع کریں، منظم کریں، خلاصہ کریں، تشریح کریں، اور نئے سوال کی طرف واپسی۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">معطیات کا چکر</text><rect class="panel-a" x="620" y="140" width="130" height="120" rx="10"/><text class="sh" x="685" y="176" text-anchor="middle">1. سوال</text><text class="small" x="685" y="200" text-anchor="middle">ہم کیا جاننا</text><text class="small" x="685" y="218" text-anchor="middle">چاہتے ہیں؟</text><rect class="panel-b" x="465" y="140" width="130" height="120" rx="10"/><text class="sh" x="530" y="176" text-anchor="middle">2. جمع کریں</text><text class="small" x="530" y="200" text-anchor="middle">مشاہدہ، سروے،</text><text class="small" x="530" y="218" text-anchor="middle">رجسٹر</text><rect class="panel-c" x="310" y="140" width="130" height="120" rx="10"/><text class="sh" x="375" y="176" text-anchor="middle">3. منظم کریں</text><text class="small" x="375" y="200" text-anchor="middle">گنتی،</text><text class="small" x="375" y="218" text-anchor="middle">تعدد جدول</text><rect class="panel" x="155" y="140" width="130" height="120" rx="10"/><text class="sh" x="220" y="176" text-anchor="middle">4. خلاصہ کریں</text><text class="small" x="220" y="200" text-anchor="middle">کل، اوسط،</text><text class="small" x="220" y="218" text-anchor="middle">فیصد</text><rect class="panel-a" x="10" y="140" width="120" height="120" rx="10"/><text class="sh" x="70" y="176" text-anchor="middle">5. تشریح کریں</text><text class="small" x="70" y="200" text-anchor="middle">معطیات کا کیا</text><text class="small" x="70" y="218" text-anchor="middle">جواب دیتا ہے؟</text><line class="stroke" x1="620" y1="200" x2="601" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="465" y1="200" x2="446" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="310" y1="200" x2="291" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="155" y1="200" x2="136" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M70 260 L70 330 L685 330 L685 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="378" y="322" text-anchor="middle">جواب عام طور پر ایک نیا سوال جنم دیتا ہے</text><text class="body" x="390" y="392" text-anchor="middle">خام معطیات خود کچھ نہیں بتاتے؛ ترتیب ہی جواب دیتی ہے۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
