<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One lesson read through three theoretical lenses</title><desc id="d">A concept map with one lesson at the centre and three branches showing the behaviourist, cognitivist and constructivist reading of it, each labelled with the management move it implies.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .stroke-b{stroke:var(--a2);stroke-width:2;fill:none} .stroke-c{stroke:var(--a3);stroke-width:2;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><ellipse cx="390" cy="235" rx="120" ry="65" class="panel"/><text class="h" x="390" y="225" text-anchor="middle">One lesson:</text><text class="body" x="390" y="248" text-anchor="middle">a new letter-sound</text><rect class="panel-a" x="40" y="40" width="220" height="120" rx="10"/><text class="sh" x="150" y="75" text-anchor="middle">Behaviourist reading</text><text class="body" x="150" y="100" text-anchor="middle">Learning is a change</text><text class="body" x="150" y="120" text-anchor="middle">in visible behaviour</text><text class="small" x="150" y="145" text-anchor="middle">Management move: drill the sound</text><rect class="panel-b" x="40" y="310" width="220" height="120" rx="10"/><text class="sh" x="150" y="345" text-anchor="middle">Cognitivist reading</text><text class="body" x="150" y="370" text-anchor="middle">Learning is reorganising</text><text class="body" x="150" y="390" text-anchor="middle">mental structures</text><text class="small" x="150" y="415" text-anchor="middle">Management move: activate prior words</text><rect class="panel-c" x="520" y="175" width="220" height="120" rx="10"/><text class="sh" x="630" y="210" text-anchor="middle">Constructivist reading</text><text class="body" x="630" y="235" text-anchor="middle">Learning is building</text><text class="body" x="630" y="255" text-anchor="middle">personal meaning</text><text class="small" x="630" y="280" text-anchor="middle">Management move: sort and explain</text><line class="stroke-a" x1="260" y1="100" x2="290" y2="220" marker-end="url(#arrow)"/><line class="stroke-b" x1="260" y1="370" x2="290" y2="250" marker-end="url(#arrow)"/><line class="stroke-c" x1="520" y1="235" x2="500" y2="235" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
