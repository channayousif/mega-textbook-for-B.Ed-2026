<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How a community member is invited into a lesson</title><desc id="d">Flowchart showing how a community member is invited into a lesson: identify a need, find a community member, make first contact, plan the visit together, host the visit, follow up with thanks and feedback.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">The six phases of a community visit</text><rect class="panel-a" x="40" y="60" width="200" height="80" rx="6"/><text class="sh" x="140" y="90" text-anchor="middle">1. Identify</text><text class="small" x="140" y="112" text-anchor="middle">a need from the curriculum</text><rect class="panel-b" x="290" y="60" width="200" height="80" rx="6"/><text class="sh" x="390" y="90" text-anchor="middle">2. Find</text><text class="small" x="390" y="112" text-anchor="middle">a community member</text><rect class="panel-c" x="540" y="60" width="200" height="80" rx="6"/><text class="sh" x="640" y="90" text-anchor="middle">3. First contact</text><text class="small" x="640" y="112" text-anchor="middle">a specific invitation</text><rect class="panel-d" x="40" y="200" width="200" height="80" rx="6"/><text class="sh" x="140" y="230" text-anchor="middle">4. Plan together</text><text class="small" x="140" y="252" text-anchor="middle">the session, the roles</text><rect class="panel-a" x="290" y="200" width="200" height="80" rx="6"/><text class="sh" x="390" y="230" text-anchor="middle">5. Host the visit</text><text class="small" x="390" y="252" text-anchor="middle">introduce, set expectations</text><rect class="panel-b" x="540" y="200" width="200" height="80" rx="6"/><text class="sh" x="640" y="230" text-anchor="middle">6. Follow up</text><text class="small" x="640" y="252" text-anchor="middle">thank-you, reflection</text><line class="stroke" x1="240" y1="100" x2="288" y2="100" marker-end="url(#arrow)"/><line class="stroke" x1="490" y1="100" x2="538" y2="100" marker-end="url(#arrow)"/><line class="stroke" x1="640" y1="140" x2="640" y2="198" marker-end="url(#arrow)"/><line class="stroke" x1="540" y1="240" x2="492" y2="240" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="280" x2="390" y2="328" marker-end="url(#arrow)"/><rect class="panel-c" x="250" y="330" width="280" height="80" rx="6"/><text class="sh" x="390" y="360" text-anchor="middle">The match between person</text><text class="sh" x="390" y="382" text-anchor="middle">and topic is what makes it work</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
