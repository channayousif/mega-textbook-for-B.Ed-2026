<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Respectful-relations moves and the message each sends</title><desc id="d">Table showing respectful-relations moves and the message each sends: using a pupil's name sends 'you matter', listening without interrupting sends 'your thinking matters', correcting privately sends 'your dignity matters'.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="240" height="70"/><text class="h" x="120" y="30" text-anchor="middle">The move</text><text class="small" x="120" y="52" text-anchor="middle">what the teacher does</text><rect class="panel-b" x="240" y="0" width="540" height="70"/><text class="h" x="510" y="30" text-anchor="middle">The message it sends</text><text class="small" x="510" y="52" text-anchor="middle">what the pupil hears</text><rect class="panel" x="0" y="70" width="240" height="80"/><text class="sh" x="120" y="105" text-anchor="middle">Using a pupil's name</text><rect class="panel" x="0" y="150" width="240" height="80"/><text class="sh" x="120" y="185" text-anchor="middle">Listening without</text><text class="sh" x="120" y="205" text-anchor="middle">interrupting</text><rect class="panel" x="0" y="230" width="240" height="80"/><text class="sh" x="120" y="265" text-anchor="middle">Correcting privately</text><rect class="panel" x="0" y="310" width="240" height="80"/><text class="sh" x="120" y="345" text-anchor="middle">Acknowledging effort</text><rect class="panel" x="0" y="390" width="240" height="80"/><text class="sh" x="120" y="425" text-anchor="middle">Giving choices</text><text class="body" x="510" y="115" text-anchor="middle">you matter as a person,</text><text class="body" x="510" y="135" text-anchor="middle">not as a seat number</text><text class="body" x="510" y="195" text-anchor="middle">your thinking matters,</text><text class="body" x="510" y="215" text-anchor="middle">even when unfinished</text><text class="body" x="510" y="275" text-anchor="middle">your dignity matters more</text><text class="body" x="510" y="295" text-anchor="middle">than the correction</text><text class="body" x="510" y="355" text-anchor="middle">the attempt matters,</text><text class="body" x="510" y="375" text-anchor="middle">not just the outcome</text><text class="body" x="510" y="435" text-anchor="middle">you have a voice in</text><text class="body" x="510" y="455" text-anchor="middle">what happens here</text><line class="grid" x1="240" y1="0" x2="240" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="150" x2="780" y2="150"/><line class="grid" x1="0" y1="230" x2="780" y2="230"/><line class="grid" x1="0" y1="310" x2="780" y2="310"/><line class="grid" x1="0" y1="390" x2="780" y2="390"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
