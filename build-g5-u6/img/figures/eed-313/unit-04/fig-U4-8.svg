<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Unexpected-event decision aid</title><desc id="d">Diagram showing an unexpected-event decision aid for a teacher alone in a classroom: a flow chart with three branches - safety first, then learning, then relationship.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">Unexpected-event decision aid</text><ellipse class="panel-a" cx="390" cy="120" rx="200" ry="60"/><text class="h" x="390" y="115" text-anchor="middle">Is anyone in danger?</text><text class="small" x="390" y="140" text-anchor="middle">safety first</text><line class="stroke" x1="390" y1="180" x2="390" y2="218" marker-end="url(#arrow)"/><ellipse class="panel-b" cx="390" cy="260" rx="200" ry="60"/><text class="h" x="390" y="255" text-anchor="middle">Can the lesson continue?</text><text class="small" x="390" y="280" text-anchor="middle">learning second</text><line class="stroke" x1="390" y1="320" x2="390" y2="358" marker-end="url(#arrow)"/><ellipse class="panel-c" cx="390" cy="400" rx="200" ry="60"/><text class="h" x="390" y="395" text-anchor="middle">What does this tell you about</text><text class="h" x="390" y="417" text-anchor="middle">the classroom's culture?</text><text class="small" x="390" y="440" text-anchor="middle">relationship third</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
