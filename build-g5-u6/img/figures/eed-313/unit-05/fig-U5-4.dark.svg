<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The seven closing misconceptions and the evidence against each</title><desc id="d">Table listing the seven closing misconceptions and the evidence against each: the best-managed classroom is teacher-controlled vs the evidence that pupil engagement matters more; the quietest classrooms are best managed vs the evidence that intellectual demand matters more; and so on.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:13px;fill:var(--ink)} .h{font-size:14px;font-weight:700;fill:var(--ink)} .sh{font-size:13px;font-weight:600;fill:var(--ink)} .body{font-size:12px;fill:var(--ink)} .small{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="340" height="50"/><text class="h" x="170" y="22" text-anchor="middle">The misconception</text><text class="small" x="170" y="40" text-anchor="middle">what the course asks you to leave behind</text><rect class="panel-b" x="340" y="0" width="440" height="50"/><text class="h" x="560" y="22" text-anchor="middle">The evidence against it</text><text class="small" x="560" y="40" text-anchor="middle">what the course has shown</text><rect class="panel" x="0" y="50" width="340" height="55"/><text class="body" x="170" y="75" text-anchor="middle">The best-managed classroom is</text><text class="body" x="170" y="92" text-anchor="middle">one where the teacher is in control</text><rect class="panel" x="0" y="105" width="340" height="55"/><text class="body" x="170" y="130" text-anchor="middle">The quietest classrooms are</text><text class="body" x="170" y="147" text-anchor="middle">the best managed</text><rect class="panel" x="0" y="160" width="340" height="55"/><text class="body" x="170" y="185" text-anchor="middle">The goal of management is</text><text class="body" x="170" y="202" text-anchor="middle">peace and discipline</text><rect class="panel" x="0" y="215" width="340" height="55"/><text class="body" x="170" y="240" text-anchor="middle">Management relies on threats</text><text class="body" x="170" y="257" text-anchor="middle">and punishment</text><rect class="panel" x="0" y="270" width="340" height="55"/><text class="body" x="170" y="295" text-anchor="middle">Classrooms are homogeneous</text><rect class="panel" x="0" y="325" width="340" height="55"/><text class="body" x="170" y="350" text-anchor="middle">Each class has fixed content</text><text class="body" x="170" y="367" text-anchor="middle">that must be taught</text><rect class="panel" x="0" y="380" width="340" height="55"/><text class="body" x="170" y="405" text-anchor="middle">The same content must be taught</text><text class="body" x="170" y="422" text-anchor="middle">to every student in one class</text><text class="body" x="560" y="75" text-anchor="middle">pupil engagement matters</text><text class="body" x="560" y="92" text-anchor="middle">more than teacher control</text><text class="body" x="560" y="130" text-anchor="middle">intellectual demand matters</text><text class="body" x="560" y="147" text-anchor="middle">more than silence</text><text class="body" x="560" y="185" text-anchor="middle">the goal is learning;</text><text class="body" x="560" y="202" text-anchor="middle">discipline is reactive</text><text class="body" x="560" y="240" text-anchor="middle">consequences are restorative,</text><text class="body" x="560" y="257" text-anchor="middle">not punitive</text><text class="body" x="560" y="295" text-anchor="middle">every classroom is diverse;</text><text class="body" x="560" y="312" text-anchor="middle">differentiation is the response</text><text class="body" x="560" y="350" text-anchor="middle">curriculum decisions are</text><text class="body" x="560" y="367" text-anchor="middle">management acts</text><text class="body" x="560" y="405" text-anchor="middle">differentiation adjusts the route</text><text class="body" x="560" y="422" text-anchor="middle">without lowering the target</text><line class="grid" x1="340" y1="0" x2="340" y2="470"/><line class="grid" x1="0" y1="50" x2="780" y2="50"/><line class="grid" x1="0" y1="105" x2="780" y2="105"/><line class="grid" x1="0" y1="160" x2="780" y2="160"/><line class="grid" x1="0" y1="215" x2="780" y2="215"/><line class="grid" x1="0" y1="270" x2="780" y2="270"/><line class="grid" x1="0" y1="325" x2="780" y2="325"/><line class="grid" x1="0" y1="380" x2="780" y2="380"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
