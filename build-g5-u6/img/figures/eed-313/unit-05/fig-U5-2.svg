<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The peer-critique protocol</title><desc id="d">Table showing the peer-critique protocol: three columns headed 'clarity', 'consistency', and 'coverage', each with two guiding questions a reviewer asks of the plan.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">The peer-critique protocol</text><rect class="panel-a" x="0" y="60" width="260" height="70"/><text class="h" x="130" y="90" text-anchor="middle">Clarity</text><text class="small" x="130" y="112" text-anchor="middle">can you state it?</text><rect class="panel-b" x="260" y="60" width="260" height="70"/><text class="h" x="390" y="90" text-anchor="middle">Consistency</text><text class="small" x="390" y="112" text-anchor="middle">does it match?</text><rect class="panel-c" x="520" y="60" width="260" height="70"/><text class="h" x="650" y="90" text-anchor="middle">Coverage</text><text class="small" x="650" y="112" text-anchor="middle">is anything missing?</text><rect class="panel" x="0" y="130" width="260" height="320"/><text class="body" x="130" y="180" text-anchor="middle">Can I state the</text><text class="body" x="130" y="200" text-anchor="middle">philosophy in one</text><text class="body" x="130" y="220" text-anchor="middle">sentence?</text><text class="body" x="130" y="280" text-anchor="middle">Can I identify</text><text class="body" x="130" y="300" text-anchor="middle">the theory it draws</text><text class="body" x="130" y="320" text-anchor="middle">on?</text><rect class="panel" x="260" y="130" width="260" height="320"/><text class="body" x="390" y="180" text-anchor="middle">Does the curriculum</text><text class="body" x="390" y="200" text-anchor="middle">decision match the</text><text class="body" x="390" y="220" text-anchor="middle">philosophy?</text><text class="body" x="390" y="280" text-anchor="middle">Does the routine set</text><text class="body" x="390" y="300" text-anchor="middle">match the constraint</text><text class="body" x="390" y="320" text-anchor="middle">the plan names?</text><rect class="panel" x="520" y="130" width="260" height="320"/><text class="body" x="650" y="180" text-anchor="middle">Does the plan address</text><text class="body" x="650" y="200" text-anchor="middle">all four layers</text><text class="body" x="650" y="220" text-anchor="middle">(theory, curriculum,</text><text class="body" x="650" y="240" text-anchor="middle">routines, care)?</text><text class="body" x="650" y="300" text-anchor="middle">Does it name the</text><text class="body" x="650" y="320" text-anchor="middle">constraint it is</text><text class="body" x="650" y="340" text-anchor="middle">designed for?</text><line class="grid" x1="260" y1="60" x2="260" y2="470"/><line class="grid" x1="520" y1="60" x2="520" y2="470"/><line class="grid" x1="0" y1="130" x2="780" y2="130"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
