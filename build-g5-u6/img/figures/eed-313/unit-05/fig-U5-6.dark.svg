<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What to look for at each layer of a plan</title><desc id="d">Table showing what to look for at each layer of a plan: for philosophy, can you state it in one sentence; for curriculum, does it match the philosophy; for routines, do they fit the constraint; for care, are consequences restorative.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="160" height="70"/><text class="h" x="80" y="30" text-anchor="middle">Layer</text><text class="small" x="80" y="52" text-anchor="middle">the part of the plan</text><rect class="panel-b" x="160" y="0" width="300" height="70"/><text class="h" x="310" y="30" text-anchor="middle">What to look for</text><text class="small" x="310" y="52" text-anchor="middle">the review question</text><rect class="panel-c" x="460" y="0" width="320" height="70"/><text class="h" x="620" y="30" text-anchor="middle">A strong plan does this</text><text class="small" x="620" y="52" text-anchor="middle">what you want to see</text><rect class="panel" x="0" y="70" width="160" height="90"/><text class="sh" x="80" y="115" text-anchor="middle">Philosophy</text><rect class="panel" x="0" y="160" width="160" height="90"/><text class="sh" x="80" y="205" text-anchor="middle">Curriculum</text><rect class="panel" x="0" y="250" width="160" height="90"/><text class="sh" x="80" y="295" text-anchor="middle">Routines</text><rect class="panel" x="0" y="340" width="160" height="90"/><text class="sh" x="80" y="385" text-anchor="middle">Care</text><text class="body" x="310" y="115" text-anchor="middle">Can you state it in</text><text class="body" x="310" y="135" text-anchor="middle">one sentence?</text><text class="body" x="310" y="205" text-anchor="middle">Does it match the</text><text class="body" x="310" y="225" text-anchor="middle">philosophy?</text><text class="body" x="310" y="295" text-anchor="middle">Do they fit the</text><text class="body" x="310" y="315" text-anchor="middle">constraint named?</text><text class="body" x="310" y="385" text-anchor="middle">Are consequences</text><text class="body" x="310" y="405" text-anchor="middle">restorative?</text><text class="body" x="620" y="115" text-anchor="middle">A clear, examinable</text><text class="body" x="620" y="135" text-anchor="middle">statement of belief</text><text class="body" x="620" y="205" text-anchor="middle">Content, order, pace</text><text class="body" x="620" y="225" text-anchor="middle">aligned to the belief</text><text class="body" x="620" y="295" text-anchor="middle">Routines designed for</text><text class="body" x="620" y="315" text-anchor="middle">the room described</text><text class="body" x="620" y="385" text-anchor="middle">Consequences that</text><text class="body" x="620" y="405" text-anchor="middle">rebuild relationship</text><line class="grid" x1="160" y1="0" x2="160" y2="470"/><line class="grid" x1="460" y1="0" x2="460" y2="470"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="160" x2="780" y2="160"/><line class="grid" x1="0" y1="250" x2="780" y2="250"/><line class="grid" x1="0" y1="340" x2="780" y2="340"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
