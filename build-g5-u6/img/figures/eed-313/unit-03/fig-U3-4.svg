<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">How a collaborative task is set up, run and closed</title><desc id="d">Flowchart showing how a collaborative task is set up, run and closed: assign roles, set the task, monitor participation, close with a whole-class share, and reflect on how the group worked.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">The three phases of a collaborative task</text><rect class="panel-a" x="40" y="60" width="700" height="100" rx="8"/><text class="h" x="390" y="95" text-anchor="middle">Set up</text><text class="body" x="390" y="120" text-anchor="middle">assign roles (reader, writer, reporter, timekeeper)</text><text class="body" x="390" y="140" text-anchor="middle">state the task, check understanding, set a time bound</text><line class="stroke" x1="390" y1="160" x2="390" y2="198" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="200" width="700" height="100" rx="8"/><text class="h" x="390" y="235" text-anchor="middle">Run</text><text class="body" x="390" y="260" text-anchor="middle">groups work; teacher monitors participation,</text><text class="body" x="390" y="280" text-anchor="middle">checks every role is being filled, supports where needed</text><line class="stroke" x1="390" y1="300" x2="390" y2="338" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="340" width="700" height="100" rx="8"/><text class="h" x="390" y="375" text-anchor="middle">Close</text><text class="body" x="390" y="400" text-anchor="middle">whole-class share, reflect on how the group worked,</text><text class="body" x="390" y="420" text-anchor="middle">pack away, link to the next lesson</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
