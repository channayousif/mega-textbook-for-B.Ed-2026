# Supabase local development config (Spec 002 — Authentication & Roles).
#
# Written by hand rather than `supabase init` because the CLI is not installed in
# this environment. If you later run `supabase init`, keep the [auth] settings below —
# they encode spec requirements, not defaults.
#
# NOTE: this file governs the LOCAL stack only. The hosted project's equivalent
# settings live in the Supabase dashboard and are documented in quickstart.md §1.
# The RLS/e2e tests are what actually guarantee these behaviours in production.

project_id = "bed-mega-textbook"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

# Catches outbound mail locally so email-confirmation and password-reset flows
# can be exercised without a real mail provider.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
# FR-013 — return-to-origin after sign-in/sign-up. Must also be registered for
# the Vercel preview and production domains in the hosted project (quickstart.md §1.4).
additional_redirect_urls = [
  "http://localhost:3000",
  "https://textbook.com.pk",
]
# FR-011a — long-lived, auto-refreshing sessions that survive browser restarts.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# FR-009 — no self-service admin; signups are allowed but role is coerced by the
# handle_new_user trigger allowlist, never trusted from client metadata.
enable_signup = true

[auth.email]
enable_signup = true
# FR-002 (T007a) — email confirmation is REQUIRED. Sign-in must be refused until
# the address is verified. Verified by tests/rls/email-confirmation.test.mjs.
enable_confirmations = true
double_confirm_changes = true

# IX.1 — Google OAuth and email/password are the only providers in v1.
# Secrets come from the environment; never commit real values.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
