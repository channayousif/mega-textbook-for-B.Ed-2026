<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The three learning theories compared</title><desc id="d">Table comparing behaviourism, cognitivism and constructivism against what each says learning is, what the teacher does, and a classroom example.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="420"/><rect class="panel-a" x="0" y="0" width="180" height="70"/><text class="h" x="90" y="30" text-anchor="middle">Behaviourism</text><text class="small" x="90" y="52" text-anchor="middle">learning as response</text><rect class="panel-b" x="180" y="0" width="200" height="70"/><text class="h" x="280" y="30" text-anchor="middle">Cognitivism</text><text class="small" x="280" y="52" text-anchor="middle">learning as structure</text><rect class="panel-c" x="380" y="0" width="200" height="70"/><text class="h" x="480" y="30" text-anchor="middle">Constructivism</text><text class="small" x="480" y="52" text-anchor="middle">learning as meaning</text><rect class="panel" x="580" y="0" width="200" height="70"/><text class="h" x="680" y="40" text-anchor="middle">Theory</text><rect class="panel" x="580" y="70" width="200" height="110"/><text class="body" x="680" y="105" text-anchor="middle">What learning</text><text class="body" x="680" y="125" text-anchor="middle">is</text><rect class="panel" x="580" y="180" width="200" height="110"/><text class="body" x="680" y="215" text-anchor="middle">What the</text><text class="body" x="680" y="235" text-anchor="middle">teacher does</text><rect class="panel" x="580" y="290" width="200" height="110"/><text class="body" x="680" y="325" text-anchor="middle">A classroom</text><text class="body" x="680" y="345" text-anchor="middle">example</text><text class="body" x="90" y="115" text-anchor="middle">A change in</text><text class="body" x="90" y="135" text-anchor="middle">observable behaviour</text><text class="body" x="90" y="225" text-anchor="middle">Model the response,</text><text class="body" x="90" y="245" text-anchor="middle">reinforce, practise</text><text class="body" x="90" y="335" text-anchor="middle">Drill a letter-sound</text><text class="body" x="90" y="355" text-anchor="middle">until it is automatic</text><text class="body" x="280" y="115" text-anchor="middle">Reorganising</text><text class="body" x="280" y="135" text-anchor="middle">mental structures</text><text class="body" x="280" y="225" text-anchor="middle">Activate prior</text><text class="body" x="280" y="245" text-anchor="middle">knowledge, make patterns</text><text class="body" x="280" y="265" text-anchor="middle">visible</text><text class="body" x="280" y="335" text-anchor="middle">Group known words</text><text class="body" x="280" y="355" text-anchor="middle">by letter-sound pattern</text><text class="body" x="480" y="115" text-anchor="middle">The learner building</text><text class="body" x="480" y="135" text-anchor="middle">their own understanding</text><text class="body" x="480" y="225" text-anchor="middle">Design the task and</text><text class="body" x="480" y="245" text-anchor="middle">social conditions</text><text class="body" x="480" y="335" text-anchor="middle">Pairs sort picture cards</text><text class="body" x="480" y="355" text-anchor="middle">and explain their grouping</text><line class="grid" x1="180" y1="0" x2="180" y2="400"/><line class="grid" x1="380" y1="0" x2="380" y2="400"/><line class="grid" x1="580" y1="0" x2="580" y2="400"/><line class="grid" x1="0" y1="70" x2="780" y2="70"/><line class="grid" x1="0" y1="180" x2="580" y2="180"/><line class="grid" x1="0" y1="290" x2="580" y2="290"/><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
