<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The classroom observation cycle</title><desc id="d">A five-step observation cycle: decide what to look for, record what you saw, separate observation from inference, ask why it might be happening, plan one change to try, then begin the next observation.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)}</style><rect class="bg" x="0" y="0" width="780" height="420"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><text class="h" x="390" y="35" text-anchor="middle">The observation cycle</text><rect class="panel-a" x="40" y="70" width="180" height="90" rx="10"/><text class="body" x="130" y="105" text-anchor="middle">1. Decide what</text><text class="body" x="130" y="125" text-anchor="middle">to look for</text><text class="small" x="130" y="148" text-anchor="middle">choose one focus</text><rect class="panel-b" x="280" y="70" width="180" height="90" rx="10"/><text class="body" x="370" y="105" text-anchor="middle">2. Record what</text><text class="body" x="370" y="125" text-anchor="middle">you saw (left column)</text><text class="small" x="370" y="148" text-anchor="middle">evidence only</text><rect class="panel-c" x="520" y="70" width="200" height="90" rx="10"/><text class="body" x="620" y="105" text-anchor="middle">3. Separate observation</text><text class="body" x="620" y="125" text-anchor="middle">from inference (right column)</text><text class="small" x="620" y="148" text-anchor="middle">what it might mean</text><rect class="panel-d" x="150" y="220" width="200" height="90" rx="10"/><text class="body" x="250" y="255" text-anchor="middle">4. Ask why it might</text><text class="body" x="250" y="275" text-anchor="middle">be happening</text><text class="small" x="250" y="298" text-anchor="middle">tentative explanation</text><rect class="panel-a" x="420" y="220" width="200" height="90" rx="10"/><text class="body" x="520" y="255" text-anchor="middle">5. Plan one change</text><text class="body" x="520" y="275" text-anchor="middle">to try</text><text class="small" x="520" y="298" text-anchor="middle">a grounded adjustment</text><line class="stroke" x1="220" y1="115" x2="280" y2="115" marker-end="url(#arrow)"/><line class="stroke" x1="460" y1="115" x2="520" y2="115" marker-end="url(#arrow)"/><line class="stroke" x1="620" y1="160" x2="620" y2="190"/><line class="stroke" x1="620" y1="190" x2="350" y2="190"/><line class="stroke" x1="350" y1="190" x2="350" y2="220" marker-end="url(#arrow)"/><line class="stroke" x1="350" y1="265" x2="420" y2="265" marker-end="url(#arrow)"/><line class="stroke" x1="420" y1="340" x2="100" y2="340"/><line class="stroke" x1="100" y1="340" x2="100" y2="160" marker-end="url(#arrow)"/><text class="small" x="260" y="380" text-anchor="middle">then begin the next observation</text><text class="wm" x="768" y="410" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
