<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Two teaching plans traced back to two philosophies</title><desc id="d">Table comparing two teaching plans traced back to two philosophies: a transmission-plan with teacher explanation then practice, and a construction-plan with a problem then group investigation.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="390" height="75"/><text class="h" x="195" y="30" text-anchor="middle">A transmission-plan</text><text class="small" x="195" y="52" text-anchor="middle">learning is the transfer of knowledge from teacher to pupil</text><rect class="panel-b" x="390" y="0" width="390" height="75"/><text class="h" x="585" y="30" text-anchor="middle">A construction-plan</text><text class="small" x="585" y="52" text-anchor="middle">learning is the pupil's active construction of meaning</text><rect class="panel" x="0" y="75" width="130" height="95"/><text class="sh" x="65" y="115" text-anchor="middle">The philosophy</text><rect class="panel" x="0" y="170" width="130" height="95"/><text class="sh" x="65" y="210" text-anchor="middle">What the teacher</text><text class="sh" x="65" y="230" text-anchor="middle">does first</text><rect class="panel" x="0" y="265" width="130" height="95"/><text class="sh" x="65" y="305" text-anchor="middle">What the pupils do</text><rect class="panel" x="0" y="360" width="130" height="95"/><text class="sh" x="65" y="395" text-anchor="middle">What success</text><text class="sh" x="65" y="415" text-anchor="middle">looks like</text><text class="body" x="260" y="120" text-anchor="middle">Knowledge is transferred</text><text class="body" x="260" y="140" text-anchor="middle">from teacher to pupil</text><text class="body" x="260" y="210" text-anchor="middle">Explains the idea</text><text class="body" x="260" y="230" text-anchor="middle">clearly at the board</text><text class="body" x="260" y="305" text-anchor="middle">Practise the procedure</text><text class="body" x="260" y="325" text-anchor="middle">the teacher showed</text><text class="body" x="260" y="395" text-anchor="middle">Pupils reproduce the</text><text class="body" x="260" y="415" text-anchor="middle">procedure accurately</text><text class="body" x="520" y="120" text-anchor="middle">Meaning is built</text><text class="body" x="520" y="140" text-anchor="middle">by the learner</text><text class="body" x="520" y="210" text-anchor="middle">Poses a problem</text><text class="body" x="520" y="230" text-anchor="middle">that needs the idea</text><text class="body" x="520" y="305" text-anchor="middle">Investigate in groups</text><text class="body" x="520" y="325" text-anchor="middle">and explain their thinking</text><text class="body" x="520" y="395" text-anchor="middle">Pupils explain why the</text><text class="body" x="520" y="415" text-anchor="middle">idea works, not just how</text><line class="grid" x1="130" y1="0" x2="130" y2="470"/><line class="grid" x1="390" y1="0" x2="390" y2="470"/><line class="grid" x1="0" y1="75" x2="780" y2="75"/><line class="grid" x1="0" y1="170" x2="780" y2="170"/><line class="grid" x1="0" y1="265" x2="780" y2="265"/><line class="grid" x1="0" y1="360" x2="780" y2="360"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
