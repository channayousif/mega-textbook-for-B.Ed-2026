<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Multigrade and overcrowded classroom tactics</title><desc id="d">Table comparing multigrade and overcrowded classroom tactics with the constraint each addresses: peer tutoring, activity corners, whole-class anchors, and structured routines.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="0" y="0" width="200" height="75"/><text class="h" x="100" y="30" text-anchor="middle">Tactic</text><text class="small" x="100" y="52" text-anchor="middle">the management move</text><rect class="panel-b" x="200" y="0" width="310" height="75"/><text class="h" x="355" y="30" text-anchor="middle">The constraint it addresses</text><text class="small" x="355" y="52" text-anchor="middle">what reality it responds to</text><rect class="panel-c" x="510" y="0" width="270" height="75"/><text class="h" x="645" y="30" text-anchor="middle">When it works best</text><text class="small" x="645" y="52" text-anchor="middle">the condition that makes it pay off</text><rect class="panel" x="0" y="75" width="200" height="95"/><text class="sh" x="100" y="125" text-anchor="middle">Peer tutoring</text><rect class="panel" x="0" y="170" width="200" height="95"/><text class="sh" x="100" y="220" text-anchor="middle">Activity corners</text><rect class="panel" x="0" y="265" width="200" height="95"/><text class="sh" x="100" y="315" text-anchor="middle">Whole-class anchors</text><rect class="panel" x="0" y="360" width="200" height="95"/><text class="sh" x="100" y="410" text-anchor="middle">Structured routines</text><text class="body" x="355" y="115" text-anchor="middle">one grade must work alone</text><text class="body" x="355" y="135" text-anchor="middle">while the teacher teaches another</text><text class="body" x="355" y="210" text-anchor="middle">the teacher cannot be in two</text><text class="body" x="355" y="230" text-anchor="middle">places at once</text><text class="body" x="355" y="305" text-anchor="middle">sixty pupils cannot each have</text><text class="body" x="355" y="325" text-anchor="middle">an individual task</text><text class="body" x="355" y="395" text-anchor="middle">sixty pupils improvising the same</text><text class="body" x="355" y="415" text-anchor="middle">transition produces chaos</text><text class="body" x="645" y="115" text-anchor="middle">when the tutor has mastered</text><text class="body" x="645" y="135" text-anchor="middle">the material and the role is clear</text><text class="body" x="645" y="210" text-anchor="middle">when the corner task is self-checking</text><text class="body" x="645" y="230" text-anchor="middle">and the teacher can step away</text><text class="body" x="645" y="305" text-anchor="middle">when the teacher needs one point</text><text class="body" x="645" y="325" text-anchor="middle">of focus for the whole room</text><text class="body" x="645" y="395" text-anchor="middle">when the routine is practised</text><text class="body" x="645" y="415" text-anchor="middle">until it runs without reminders</text><line class="grid" x1="200" y1="0" x2="200" y2="470"/><line class="grid" x1="510" y1="0" x2="510" y2="470"/><line class="grid" x1="0" y1="75" x2="780" y2="75"/><line class="grid" x1="0" y1="170" x2="780" y2="170"/><line class="grid" x1="0" y1="265" x2="780" y2="265"/><line class="grid" x1="0" y1="360" x2="780" y2="360"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
