<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The plan-motivate-teach-assess cycle</title><desc id="d">Flowchart of the four-stage cycle: plan the lesson, motivate the learners, teach the content, assess understanding, with the management decision named at each stage and a return arrow from assess back to plan.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .ah-a{fill:var(--a1)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-a"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="30" y="170" width="150" height="130" rx="8"/><text class="h" x="105" y="210" text-anchor="middle">Plan</text><text class="body" x="105" y="240" text-anchor="middle">decide the target,</text><text class="body" x="105" y="260" text-anchor="middle">activities, materials</text><text class="small" x="105" y="285" text-anchor="middle">clear target</text><rect class="panel-b" x="220" y="170" width="150" height="130" rx="8"/><text class="h" x="295" y="210" text-anchor="middle">Motivate</text><text class="body" x="295" y="240" text-anchor="middle">create the want</text><text class="body" x="295" y="260" text-anchor="middle">to learn first</text><text class="small" x="295" y="285" text-anchor="middle">relevance</text><rect class="panel-c" x="410" y="170" width="150" height="130" rx="8"/><text class="h" x="485" y="210" text-anchor="middle">Teach</text><text class="body" x="485" y="240" text-anchor="middle">deliver content in</text><text class="body" x="485" y="260" text-anchor="middle">paced cycles</text><text class="small" x="485" y="285" text-anchor="middle">pacing and participation</text><rect class="panel-d" x="600" y="170" width="150" height="130" rx="8"/><text class="h" x="675" y="210" text-anchor="middle">Assess</text><text class="body" x="675" y="240" text-anchor="middle">check whether the</text><text class="body" x="675" y="260" text-anchor="middle">target was met</text><text class="small" x="675" y="285" text-anchor="middle">evidence</text><line class="stroke" x1="180" y1="235" x2="218" y2="235" marker-end="url(#arrow)"/><line class="stroke" x1="370" y1="235" x2="408" y2="235" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="235" x2="598" y2="235" marker-end="url(#arrow)"/><path class="stroke-a" d="M675,300 Q675,400,390,400 Q105,400,105,320" fill="none" marker-end="url(#arrow-a)"/><text class="small" x="390" y="430" text-anchor="middle">next lesson</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
