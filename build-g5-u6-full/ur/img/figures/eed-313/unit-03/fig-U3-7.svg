<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A literacy-block layout</title><desc id="d">Diagram of a literacy-block layout: a reading corner with cushions, a shared-text area on the mat, a writing area with clipboards, and a response area, with arrows showing the flow between them.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">The literacy-block layout</text><rect class="panel-a" x="40" y="60" width="300" height="170" rx="8"/><text class="h" x="190" y="100" text-anchor="middle">Reading corner</text><text class="body" x="190" y="130" text-anchor="middle">cushions, book boxes,</text><text class="body" x="190" y="150" text-anchor="middle">independent reading,</text><text class="body" x="190" y="170" text-anchor="middle">reading record</text><text class="small" x="190" y="200" text-anchor="middle">quiet, self-selected</text><rect class="panel-b" x="440" y="60" width="300" height="170" rx="8"/><text class="h" x="590" y="100" text-anchor="middle">Shared-text area</text><text class="body" x="590" y="130" text-anchor="middle">on the mat, big book,</text><text class="body" x="590" y="150" text-anchor="middle">shared reading,</text><text class="body" x="590" y="170" text-anchor="middle">teacher-led</text><text class="small" x="590" y="200" text-anchor="middle">whole-class focus</text><rect class="panel-c" x="40" y="270" width="300" height="170" rx="8"/><text class="h" x="190" y="310" text-anchor="middle">Writing area</text><text class="body" x="190" y="340" text-anchor="middle">clipboards, exercise books,</text><text class="body" x="190" y="360" text-anchor="middle">independent writing,</text><text class="body" x="190" y="380" text-anchor="middle">teacher conferences</text><text class="small" x="190" y="410" text-anchor="middle">focused, productive</text><rect class="panel-d" x="440" y="270" width="300" height="170" rx="8"/><text class="h" x="590" y="310" text-anchor="middle">Response area</text><text class="body" x="590" y="340" text-anchor="middle">pair share, discussion,</text><text class="body" x="590" y="360" text-anchor="middle">response journals,</text><text class="body" x="590" y="380" text-anchor="middle">group reflection</text><text class="small" x="590" y="410" text-anchor="middle">collaborative, reflective</text><line class="stroke" x1="340" y1="145" x2="438" y2="145" marker-end="url(#arrow)"/><line class="stroke" x1="190" y1="230" x2="190" y2="268" marker-end="url(#arrow)"/><line class="stroke" x1="590" y1="230" x2="590" y2="268" marker-end="url(#arrow)"/><line class="stroke" x1="340" y1="355" x2="438" y2="355" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
