<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The circles of community around one classroom</title><desc id="d">Concept map showing the circles of community around one classroom: the classroom at the centre, then the school, then the parents and families, then the local community, each linked by labelled relationships.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="panel-a" cx="390" cy="235" rx="100" ry="55"/><text class="h" x="390" y="230" text-anchor="middle">The</text><text class="h" x="390" y="252" text-anchor="middle">classroom</text><ellipse class="panel-b" cx="390" cy="235" rx="200" ry="110"/><text class="small" x="390" y="130" text-anchor="middle">The school - headteacher, colleagues, support staff</text><ellipse class="panel-c" cx="390" cy="235" rx="300" ry="165"/><text class="small" x="390" y="75" text-anchor="middle">Parents and families</text><ellipse class="panel-d" cx="390" cy="235" rx="370" ry="210"/><text class="small" x="390" y="30" text-anchor="middle">The local community</text><text class="body" x="220" y="380" text-anchor="middle">managed directly</text><text class="body" x="220" y="400" text-anchor="middle">by the teacher</text><text class="body" x="560" y="380" text-anchor="middle">managed through</text><text class="body" x="560" y="400" text-anchor="middle">collaboration</text><text class="body" x="220" y="100" text-anchor="middle">managed through</text><text class="body" x="220" y="120" text-anchor="middle">communication</text><text class="body" x="560" y="100" text-anchor="middle">managed through</text><text class="body" x="560" y="120" text-anchor="middle">partnership</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
