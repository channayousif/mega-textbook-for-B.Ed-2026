<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The four units converging on one philosophy</title><desc id="d">Concept map connecting the four units: Unit 1 theories and definition at the centre, with branches to Unit 2 curriculum and differentiation, Unit 3 routines and time, Unit 4 community and care, all converging on 'my classroom management philosophy'.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><ellipse class="panel-a" cx="390" cy="235" rx="160" ry="60"/><text class="h" x="390" y="230" text-anchor="middle">My classroom</text><text class="h" x="390" y="252" text-anchor="middle">management philosophy</text><rect class="panel-b" x="30" y="30" width="220" height="100" rx="6"/><text class="sh" x="140" y="60" text-anchor="middle">Unit 1</text><text class="body" x="140" y="85" text-anchor="middle">Theories and definition</text><text class="small" x="140" y="105" text-anchor="middle">what learning is</text><text class="small" x="140" y="120" text-anchor="middle">what management is</text><rect class="panel-c" x="530" y="30" width="220" height="100" rx="6"/><text class="sh" x="640" y="60" text-anchor="middle">Unit 2</text><text class="body" x="640" y="85" text-anchor="middle">Curriculum and differentiation</text><text class="small" x="640" y="105" text-anchor="middle">the plan, the route</text><text class="small" x="640" y="120" text-anchor="middle">the adjustment</text><rect class="panel-d" x="30" y="350" width="220" height="100" rx="6"/><text class="sh" x="140" y="380" text-anchor="middle">Unit 3</text><text class="body" x="140" y="405" text-anchor="middle">Routines and time</text><text class="small" x="140" y="425" text-anchor="middle">the machinery that</text><text class="small" x="140" y="440" text-anchor="middle">carries the plan</text><rect class="panel-a" x="530" y="350" width="220" height="100" rx="6"/><text class="sh" x="640" y="380" text-anchor="middle">Unit 4</text><text class="body" x="640" y="405" text-anchor="middle">Community and care</text><text class="small" x="640" y="425" text-anchor="middle">the relationships that</text><text class="small" x="640" y="440" text-anchor="middle">make it work</text><line class="stroke" x1="180" y1="130" x2="320" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="600" y1="130" x2="460" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="180" y1="350" x2="320" y2="285" marker-end="url(#arrow)"/><line class="stroke" x1="600" y1="350" x2="460" y2="285" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
