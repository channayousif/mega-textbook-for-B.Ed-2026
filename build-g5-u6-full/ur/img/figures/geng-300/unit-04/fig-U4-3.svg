<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Adapting a message for a cultural audience</title><desc id="d">Flowchart showing adapting a message for a different cultural audience: identify the audience, analyse the cultural dimension, choose the strategy, adapt the message, check for clarity, then deliver.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">Adapting a message for a cultural audience</text><rect class="panel-a" x="230" y="50" width="320" height="50" rx="8"/><text class="sh" x="390" y="76" text-anchor="middle">1. Identify the audience</text><text class="small" x="390" y="92" text-anchor="middle">who will read it and where they are</text><line class="stroke" x1="390" y1="100" x2="390" y2="114" marker-end="url(#arrow)"/><rect class="panel-b" x="230" y="114" width="320" height="50" rx="8"/><text class="sh" x="390" y="140" text-anchor="middle">2. Analyse the cultural dimension</text><text class="small" x="390" y="156" text-anchor="middle">context, directness, face, power</text><line class="stroke" x1="390" y1="164" x2="390" y2="178" marker-end="url(#arrow)"/><rect class="panel-c" x="230" y="178" width="320" height="50" rx="8"/><text class="sh" x="390" y="204" text-anchor="middle">3. Choose the strategy</text><text class="small" x="390" y="220" text-anchor="middle">register, tone and level of detail</text><line class="stroke" x1="390" y1="228" x2="390" y2="242" marker-end="url(#arrow)"/><rect class="panel-d" x="230" y="242" width="320" height="50" rx="8"/><text class="sh" x="390" y="268" text-anchor="middle">4. Adapt the message</text><text class="small" x="390" y="284" text-anchor="middle">words, examples, structure, politeness</text><line class="stroke" x1="390" y1="292" x2="390" y2="306" marker-end="url(#arrow)"/><rect class="panel-a" x="230" y="306" width="320" height="50" rx="8"/><text class="sh" x="390" y="332" text-anchor="middle">5. Check for clarity</text><text class="small" x="390" y="348" text-anchor="middle">would the new reader understand it</text><line class="stroke" x1="390" y1="356" x2="390" y2="370" marker-end="url(#arrow)"/><rect class="panel-c" x="230" y="370" width="320" height="50" rx="8"/><text class="sh" x="390" y="396" text-anchor="middle">6. Deliver</text><text class="small" x="390" y="412" text-anchor="middle">send the adapted message and follow up</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
