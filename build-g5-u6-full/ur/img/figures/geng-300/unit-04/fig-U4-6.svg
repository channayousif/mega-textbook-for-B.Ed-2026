<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Register and tone shifts across contexts</title><desc id="d">Table comparing register and tone shifts across professional and informal contexts: formal professional, informal professional, formal social and informal social, each with an example phrase.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">Register and tone shifts across contexts</text><rect class="panel-a" x="0" y="50" width="170" height="58"/><text class="h" x="85" y="76" text-anchor="middle">Context</text><text class="small" x="85" y="96" text-anchor="middle">the situation</text><rect class="panel-b" x="170" y="50" width="270" height="58"/><text class="h" x="305" y="76" text-anchor="middle">Register</text><text class="small" x="305" y="96" text-anchor="middle">level of formality</text><rect class="panel-c" x="440" y="50" width="340" height="58"/><text class="h" x="610" y="76" text-anchor="middle">Example phrase</text><text class="small" x="610" y="96" text-anchor="middle">how it sounds</text><rect class="panel-a" x="0" y="108" width="170" height="90"/><text class="sh" x="85" y="148" text-anchor="middle">Formal</text><text class="sh" x="85" y="170" text-anchor="middle">professional</text><rect class="panel" x="170" y="108" width="270" height="90"/><text class="body" x="305" y="142" text-anchor="middle">formal; full sentences;</text><text class="body" x="305" y="162" text-anchor="middle">no contractions; title</text><text class="body" x="305" y="182" text-anchor="middle">plus surname</text><rect class="panel" x="440" y="108" width="340" height="90"/><text class="body" x="610" y="142" text-anchor="middle">Dear Mr Khan, I am writing to</text><text class="body" x="610" y="162" text-anchor="middle">request a meeting to discuss</text><text class="body" x="610" y="182" text-anchor="middle">the term assessment schedule.</text><rect class="panel-b" x="0" y="198" width="170" height="90"/><text class="sh" x="85" y="238" text-anchor="middle">Informal</text><text class="sh" x="85" y="260" text-anchor="middle">professional</text><rect class="panel" x="170" y="198" width="270" height="90"/><text class="body" x="305" y="232" text-anchor="middle">semi-formal; first name;</text><text class="body" x="305" y="252" text-anchor="middle">contractions allowed;</text><text class="body" x="305" y="272" text-anchor="middle">friendly but work-appropriate</text><rect class="panel" x="440" y="198" width="340" height="90"/><text class="body" x="610" y="232" text-anchor="middle">Hi Sara, can you send me the</text><text class="body" x="610" y="252" text-anchor="middle">draft when you get a chance?</text><text class="body" x="610" y="272" text-anchor="middle">Thanks a lot.</text><rect class="panel-c" x="0" y="288" width="170" height="90"/><text class="sh" x="85" y="328" text-anchor="middle">Formal social</text><rect class="panel" x="170" y="288" width="270" height="90"/><text class="body" x="305" y="322" text-anchor="middle">formal; respectful;</text><text class="body" x="305" y="342" text-anchor="middle">ceremony-aware; polite</text><text class="body" x="305" y="362" text-anchor="middle">distance maintained</text><rect class="panel" x="440" y="288" width="340" height="90"/><text class="body" x="610" y="322" text-anchor="middle">We are pleased to welcome you</text><text class="body" x="610" y="342" text-anchor="middle">to the ceremony and wish</text><text class="body" x="610" y="362" text-anchor="middle">we every success.</text><rect class="panel-d" x="0" y="378" width="170" height="80"/><text class="sh" x="85" y="412" text-anchor="middle">Informal social</text><rect class="panel" x="170" y="378" width="270" height="80"/><text class="body" x="305" y="412" text-anchor="middle">casual; everyday speech;</text><text class="body" x="305" y="432" text-anchor="middle">warm; first name or</text><text class="body" x="305" y="450" text-anchor="middle">nickname</text><rect class="panel" x="440" y="378" width="340" height="80"/><text class="body" x="610" y="412" text-anchor="middle">Come over when you are free,</text><text class="body" x="610" y="432" text-anchor="middle">no rush at all. Bring the</text><text class="body" x="610" y="450" text-anchor="middle">kids too.</text><line class="grid" x1="170" y1="50" x2="170" y2="458"/><line class="grid" x1="440" y1="50" x2="440" y2="458"/><line class="grid" x1="0" y1="108" x2="780" y2="108"/><line class="grid" x1="0" y1="198" x2="780" y2="198"/><line class="grid" x1="0" y1="288" x2="780" y2="288"/><line class="grid" x1="0" y1="378" x2="780" y2="378"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
