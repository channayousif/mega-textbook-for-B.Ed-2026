<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Intercultural communication and its dimensions</title><desc id="d">Concept map showing intercultural communication at the centre with branches to high-context communication, low-context communication, directness, politeness, face-saving strategies and cultural awareness.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">Intercultural communication and its dimensions</text><ellipse class="panel-a" cx="390" cy="240" rx="150" ry="58"/><text class="h" x="390" y="233" text-anchor="middle">Intercultural</text><text class="h" x="390" y="255" text-anchor="middle">communication</text><rect class="panel-b" x="40" y="50" width="200" height="70" rx="6"/><text class="sh" x="140" y="82" text-anchor="middle">High-context</text><text class="small" x="140" y="104" text-anchor="middle">communication</text><rect class="panel-c" x="540" y="50" width="200" height="70" rx="6"/><text class="sh" x="640" y="82" text-anchor="middle">Low-context</text><text class="small" x="640" y="104" text-anchor="middle">communication</text><rect class="panel-d" x="40" y="360" width="200" height="70" rx="6"/><text class="sh" x="140" y="392" text-anchor="middle">Face-saving</text><text class="small" x="140" y="414" text-anchor="middle">strategies</text><rect class="panel-a" x="540" y="360" width="200" height="70" rx="6"/><text class="sh" x="640" y="392" text-anchor="middle">Cultural</text><text class="small" x="640" y="414" text-anchor="middle">awareness</text><rect class="panel-b" x="300" y="130" width="180" height="56" rx="6"/><text class="sh" x="390" y="156" text-anchor="middle">Directness</text><text class="small" x="390" y="174" text-anchor="middle">how open the message is</text><rect class="panel-c" x="300" y="280" width="180" height="56" rx="6"/><text class="sh" x="390" y="306" text-anchor="middle">Politeness</text><text class="small" x="390" y="324" text-anchor="middle">respect shown to the reader</text><line class="stroke" x1="180" y1="120" x2="310" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="600" y1="120" x2="470" y2="195" marker-end="url(#arrow)"/><line class="stroke" x1="180" y1="360" x2="310" y2="295" marker-end="url(#arrow)"/><line class="stroke" x1="600" y1="360" x2="470" y2="295" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="186" x2="390" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="296" x2="390" y2="336" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
