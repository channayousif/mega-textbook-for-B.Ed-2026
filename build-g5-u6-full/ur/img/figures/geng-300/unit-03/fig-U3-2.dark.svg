<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Anxiety-confidence curve for stage fright</title><desc id="d">Diagram showing the anxiety-confidence curve and strategies for managing stage fright. Anxiety is plotted against preparation. High anxiety and low confidence occur with little preparation; as preparation grows, anxiety falls and confidence rises. Strategies are marked along the curve.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><line class="stroke" x1="110" y1="60" x2="110" y2="400"/><line class="stroke" x1="110" y1="400" x2="740" y2="400"/><line class="grid" x1="245" y1="60" x2="245" y2="400"/><line class="grid" x1="380" y1="60" x2="380" y2="400"/><line class="grid" x1="510" y1="60" x2="510" y2="400"/><line class="grid" x1="640" y1="60" x2="640" y2="400"/><path d="M110,90 C260,120 420,260 720,390" stroke="var(--a3)" stroke-width="3" fill="none"/><path d="M110,390 C260,360 420,220 720,90" stroke="var(--a2)" stroke-width="3" fill="none"/><rect class="panel-c" x="120" y="62" width="90" height="26" rx="4"/><text class="sh" x="165" y="80" text-anchor="middle">Anxiety</text><rect class="panel-b" x="640" y="62" width="90" height="26" rx="4"/><text class="sh" x="685" y="80" text-anchor="middle">Confidence</text><text class="h" x="165" y="434" text-anchor="middle">Little</text><text class="small" x="165" y="452" text-anchor="middle">preparation</text><text class="h" x="720" y="434" text-anchor="middle">Thorough</text><text class="small" x="720" y="452" text-anchor="middle">preparation</text><text class="muted" x="40" y="80" text-anchor="middle" transform="rotate(-90,40,80)">High</text><text class="muted" x="40" y="395" text-anchor="middle" transform="rotate(-90,40,395)">Low</text><circle cx="175" cy="120" r="5" fill="var(--a3)"/><rect class="panel" x="188" y="100" width="150" height="46" rx="5"/><text class="sh" x="263" y="120" text-anchor="middle">Deep breathing</text><text class="small" x="263" y="138" text-anchor="middle">calm the body</text><circle cx="320" cy="235" r="5" fill="var(--a3)"/><rect class="panel" x="188" y="218" width="150" height="46" rx="5"/><text class="sh" x="263" y="238" text-anchor="middle">Positive self-talk</text><text class="small" x="263" y="256" text-anchor="middle">reframe nerves</text><circle cx="500" cy="255" r="5" fill="var(--a2)"/><rect class="panel" x="510" y="235" width="150" height="46" rx="5"/><text class="sh" x="585" y="255" text-anchor="middle">Rehearse aloud</text><text class="small" x="585" y="273" text-anchor="middle">build familiarity</text><circle cx="660" cy="150" r="5" fill="var(--a2)"/><rect class="panel" x="560" y="100" width="170" height="46" rx="5"/><text class="sh" x="645" 