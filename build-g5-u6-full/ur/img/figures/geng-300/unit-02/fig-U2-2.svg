<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart showing the SQ4R reading strategy step by step</title><desc id="d">Flowchart showing the SQ4R reading strategy step by step: survey, question, read, recite, review, reflect.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">The SQ4R reading strategy</text><rect class="panel-a" x="190" y="60" width="400" height="50" rx="8"/><text class="sh" x="390" y="85" text-anchor="middle">1. Survey</text><text class="small" x="390" y="103" text-anchor="middle">skim headings, images and summaries</text><line class="stroke" x1="390" y1="110" x2="390" y2="126" marker-end="url(#arrow)"/><rect class="panel-b" x="190" y="126" width="400" height="50" rx="8"/><text class="sh" x="390" y="151" text-anchor="middle">2. Question</text><text class="small" x="390" y="169" text-anchor="middle">turn each heading into a question</text><line class="stroke" x1="390" y1="176" x2="390" y2="192" marker-end="url(#arrow)"/><rect class="panel-c" x="190" y="192" width="400" height="50" rx="8"/><text class="sh" x="390" y="217" text-anchor="middle">3. Read</text><text class="small" x="390" y="235" text-anchor="middle">read each part to answer your questions</text><line class="stroke" x1="390" y1="242" x2="390" y2="258" marker-end="url(#arrow)"/><rect class="panel-d" x="190" y="258" width="400" height="50" rx="8"/><text class="sh" x="390" y="283" text-anchor="middle">4. Recite</text><text class="small" x="390" y="301" text-anchor="middle">say the key points in your own words</text><line class="stroke" x1="390" y1="308" x2="390" y2="324" marker-end="url(#arrow)"/><rect class="panel-a" x="190" y="324" width="400" height="50" rx="8"/><text class="sh" x="390" y="349" text-anchor="middle">5. Review</text><text class="small" x="390" y="367" text-anchor="middle">go back over the whole passage</text><line class="stroke" x1="390" y1="374" x2="390" y2="390" marker-end="url(#arrow)"/><rect class="panel-b" x="190" y="390" width="400" height="50" rx="8"/><text class="sh" x="390" y="415" text-anchor="middle">6. Reflect</text><text class="small" x="390" y="433" text-anchor="middle">connect ideas to what you already know</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
