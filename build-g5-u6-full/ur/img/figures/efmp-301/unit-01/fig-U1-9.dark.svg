<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 356" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Four classroom observations and what to look at instead</title><desc id="d">A three-column table setting four classroom observations against the usual staff-room reading and what psychology suggests a teacher look at instead.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .hd{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.key{fill:var(--a2-fill);stroke:var(--a2);stroke-width:1.5}.c{font-size:12.5px}.q{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="758" height="356"/><rect class="hd" x="14" y="14" width="232" height="56" rx="4"/><text x="130.0" y="46.5" text-anchor="middle" class="h" font-size="12.5">what you see</text><rect class="hd" x="256" y="14" width="178" height="56" rx="4"/><text x="345.0" y="46.5" text-anchor="middle" class="h" font-size="12.5">the usual reading</text><rect class="key" x="444" y="14" width="300" height="56" rx="4"/><text x="594.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">what psychology suggests looking</text><text x="594.0" y="54.0" text-anchor="middle" class="h" font-size="12.5">at</text><rect class="hd" x="14" y="80" width="232" height="54" rx="4"/><text x="130.0" y="104.0" text-anchor="middle" class="q">the class copies neatly and</text><text x="130.0" y="120.0" text-anchor="middle" class="q">cannot answer</text><rect class="cell" x="256" y="80" width="178" height="54" rx="4"/><text x="345.0" y="112.0" text-anchor="middle" class="c">they were careless</text><rect class="key" x="444" y="80" width="300" height="54" rx="4"/><text x="594.0" y="104.0" text-anchor="middle" class="c">copying and understanding compete for the</text><text x="594.0" y="120.0" text-anchor="middle" class="c">same attention</text><rect class="hd" x="14" y="144" width="232" height="54" rx="4"/><text x="130.0" y="176.0" text-anchor="middle" class="q">nobody asks a question</text><rect class="cell" x="256" y="144" width="178" height="54" rx="4"/><text x="345.0" y="176.0" text-anchor="middle" class="c">they understood</text><rect class="key" x="444" y="144" width="300" height="54" rx="4"/><text x="594.0" y="168.0" text-anchor="middle" class="c">whether it is safe to be wrong out loud</text><text x="594.0" y="184.0" text-anchor="middle" class="c">in this room</text><rect class="hd" x="14" y="208" width="232" height="54" rx="4"/><text x="130.0" y="232.0" text-anchor="middle" class="q">a pupil disrupts after ten</text><text x="130.0" y="248.0" text-anchor="middle" class="q">minutes</text><rect class="cell" x="256" y="208" width="178" height="54" rx="4"/><text x="345.0" y="240.0" text-anchor="middle" class="c">poor discipline</text><rect class="key" x="444" y="208" width="300" height="54" rx="4"/><text x="594.0" y="232.0" text-anchor="middle" class="c">whether the task is startable, or already</text><text x="594.0" y="248.0" text-anchor="middle" class="c">finished</text><rect class="hd" x="14" y="272" width="232" height="54" rx="4"/><text x="130.0" y="296.0" text-anchor="middle" class="q">marks improve but understanding</text><text x="130.0" y="312.0" text-anchor="middle" class="q">does not</text><rect class="cell" x="256" y="272" width="178" height="54" rx="4"/><text x="345.0" y="304.0" text-anchor="middle" class="c">progress</text><rect class="key" x="444" y="272" width="300" height="54" rx="4"/><text x="594.0" y="304.0" text-anchor="middle" class="c">what the assessment actually rewards</text><text class="wm" x="746" y="346" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
