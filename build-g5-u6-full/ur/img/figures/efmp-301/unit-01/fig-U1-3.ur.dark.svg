<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif" direction="rtl"><title id="t">تعلیمی نفسیات کیسے ایک شعبہ بنی</title><desc id="d">پانچ مرحلوں کی ایک دائیں سے بائیں ٹائم لائن جو دکھاتی ہے کہ تعلیمی نفسیات کیسے صرف تجربے سے نتیجہ نکالنے سے اپنے طریقوں والے شعبے تک پہنچی۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .ax{stroke:var(--ink);stroke-width:2.5;fill:none}.ah{fill:var(--ink)}.dot{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2.5}.tk{stroke:var(--a4);stroke-width:2}.st{font-size:12.5px}.cap{font-size:13px;fill:var(--muted);font-style:italic}</style><rect class="bg" x="0" y="0" width="900" height="362"/><defs><marker id="m3u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><path class="ax" d="M870 232 L34 232" marker-end="url(#m3u)"/><line class="tk" x1="790" y1="232" x2="790" y2="200"/><circle class="dot" cx="790" cy="232" r="9"/><text x="790" y="170" text-anchor="middle" class="st">اساتذہ صرف تجربے سے</text><text x="790" y="186" text-anchor="middle" class="st">نتیجہ نکالتے ہیں</text><line class="tk" x1="610" y1="232" x2="610" y2="248"/><circle class="dot" cx="610" cy="232" r="9"/><text x="610" y="278" text-anchor="middle" class="st">نفسیات فلسفے سے الگ ہو</text><text x="610" y="294" text-anchor="middle" class="st">کر پیمائش شروع کرتی ہے</text><line class="tk" x1="430" y1="232" x2="430" y2="200"/><circle class="dot" cx="430" cy="232" r="9"/><text x="430" y="154" text-anchor="middle" 