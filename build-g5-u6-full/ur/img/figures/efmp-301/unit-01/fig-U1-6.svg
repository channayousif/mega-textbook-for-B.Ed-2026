<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 382" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The dimensions along which learners in one class differ</title><desc id="d">A concept map with two pupils, same lesson, different outcomes at the centre, branching to readiness and prior knowledge, motivation and interest, and language and home background, each with three sub-labels, and a note that none of these is the same as ability.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .core{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}.br{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2}.lk{stroke:var(--a1);stroke-width:2.5;fill:none}.ah{fill:var(--a1)}.sub{font-size:12.5px;fill:var(--muted)}.note{font-size:13px;fill:var(--a3);font-style:italic}</style><rect class="bg" x="0" y="0" width="840" height="382"/><defs><marker id="m6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><g class="lk"><path d="M427 116 L142 168" marker-end="url(#m6)"/><path d="M427 116 L420 168" marker-end="url(#m6)"/><path d="M427 116 L698 168" marker-end="url(#m6)"/></g><rect class="core" x="255" y="26" width="344" height="84" rx="6"/><text x="427" y="58" text-anchor="middle" class="h" font-size="16">two pupils, same lesson,</text><text x="427" y="80" text-anchor="middle" class="h" font-size="16">different outcomes</text><rect class="br" x="14" y="174" width="256" height="148" rx="6"/><text x="142" y="200" text-anchor="middle" class="h" font-size="14">readiness and prior</text><text x="142" y="217" text-anchor="middle" class="h" font-size="14">knowledge</text><text x="142" y="246" text-anchor="middle" class="sub">what they already know</text><text x="142" y="263" text-anchor="middle" class="sub">gaps from earlier years</text><text x="142" y="280" text-anchor="middle" class="sub">what they are ready for next</text><rect class="br" x="292" y="174" width="256" height="148" rx="6"/><text x="420" y="200" text-anchor="middle" class="h" font-size="14">motivation and interest</text><text x="420" y="229" text-anchor="middle" class="sub">why bother</text><text x="420" y="246" text-anchor="middle" class="sub">expectation of success</text><text x="420" y="263" text-anchor="middle" class="sub">what the task is for</text><rect class="br" x="570" y="174" width="256" height="148" rx="6"/><text x="698" y="200" text-anchor="middle" class="h" font-size="14">language and home</text><text x="698" y="217" text-anchor="middle" class="h" font-size="14">background</text><text x="698" y="246" text-anchor="middle" class="sub">language of school vs home</text><text x="698" y="263" text-anchor="middle" class="sub">study space and time</text><text x="698" y="280" text-anchor="middle" class="sub">who can help after school</text><text x="427" y="352" text-anchor="middle" class="note">none of these is the same as ability</text><text class="wm" x="828" y="372" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
