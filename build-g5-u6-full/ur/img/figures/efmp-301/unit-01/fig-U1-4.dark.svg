<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The two-way relationship between psychology and education</title><desc id="d">A diagram of two panels, psychology and education, joined by two arrows running in opposite directions - psychology gives theories of learning, memory and motivation, methods for gathering evidence, and a language for describing learners, while education gives back real conditions to test theories in, problems no laboratory poses, and findings that fail outside the laboratory.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .pl{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}.ar1{stroke:var(--a1);stroke-width:3;fill:none}.ah1{fill:var(--a1)}.ar2{stroke:var(--a3);stroke-width:3;fill:none}.ah2{fill:var(--a3)}.lb{font-size:13px}.tag{font-size:13px;font-weight:700}.t1{fill:var(--a1)}.t2{fill:var(--a3)}</style><rect class="bg" x="0" y="0" width="820" height="380"/><defs><marker id="m4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah1"/></marker></defs><defs><marker id="m4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah2"/></marker></defs><rect class="pl" x="20" y="150" width="176" height="128" rx="6"/><text x="108" y="220" text-anchor="middle" class="h" font-size="18">psychology</text><rect class="pl" x="624" y="150" width="176" height="128" rx="6"/><text x="712" y="220" text-anchor="middle" class="h" font-size="18">education</text><path class="ar1" d="M200 186 L618 186" marker-end="url(#m4)"/><path class="ar2" d="M620 246 L202 246" marker-end="url(#m4b)"/><text x="410" y="176" text-anchor="middle" class="tag t1">gives</text><text x="410" y="62" text-anchor="middle" class="lb">theories of learning, memory</text><text x="410" y="79" text-anchor="middle" class="lb">and motivation</text><text x="410" y="96" text-anchor="middle" class="lb">methods for gathering evidence</text><text x="410" y="113" text-anchor="middle" class="lb">a language for describing learners</text><text x="410" y="268" text-anchor="middle" class="tag t2">gives back</text><text x="410" y="300" text-anchor="middle" class="lb">real conditions to test in</text><text x="410" y="317" text-anchor="middle" class="lb">problems no laboratory poses</text><text x="410" y="334" text-anchor="middle" class="lb">findings that fail outside the lab</text><text class="wm" x="808" y="370" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
