<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One paragraph analysed into statement, claim, issue and argument</title><desc id="d">Table analysing one paragraph of text into its statement, claim, issue and argument, with the exact words entered in each row.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="16" y="16" width="130" height="60" fill="var(--a1-fill)"/><rect x="146" y="16" width="618" height="60" fill="var(--a1-fill)"/><text class="h" x="81" y="40" text-anchor="middle">Unit</text><text class="h" x="81" y="58" text-anchor="middle">of reasoning</text><text class="h" x="455" y="40" text-anchor="middle">The exact words from the paragraph</text><text class="m" x="455" y="58" text-anchor="middle">"Workshop trainers say their method raises results by 30 per cent, so every school should adopt it."</text><line x1="16" y1="76" x2="764" y2="76" stroke="var(--ink)" stroke-width="2"/><line x1="146" y1="16" x2="146" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="81" y="116">statement</text><text x="156" y="102">the whole sentence asserts</text><text x="156" y="118">something is true</text><text class="m" x="156" y="140">yes - it says something</text><text class="m" x="156" y="156">about what is the case</text><line x1="16" y1="170" x2="764" y2="170" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="210">claim</text><text x="156" y="196">"their method raises results</text><text x="156" y="212">by 30 per cent"</text><text class="m" x="156" y="234">the assertion that needs</text><text class="m" x="156" y="250">support</text><line x1="16" y1="264" x2="764" y2="264" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="304">issue</text><text x="156" y="290">"should every school</text><text x="156" y="306">adopt it?"</text><text class="m" x="156" y="328">a question people can</text><text class="m" x="156" y="344">reasonably disagree on</text><line x1="16" y1="358" x2="764" y2="358" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="408">argument</text><text x="156" y="384">the claim is supported</text><text x="156" y="400">by a reason meant to</text><text x="156" y="416">back it up</text><text class="m" x="156" y="438">yes - "raises results" is</text><text class="m" x="156" y="454">offered as the reason to adopt</text><rect x="16" y="76" width="748" height="378" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>