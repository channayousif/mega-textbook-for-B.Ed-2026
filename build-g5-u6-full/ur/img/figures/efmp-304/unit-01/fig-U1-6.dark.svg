<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Each barrier with its revealing sentence and interrupting question</title><desc id="d">Table listing each barrier with the classroom sentence that reveals it and one question that interrupts it.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="16" y="16" width="130" height="50" fill="var(--a1-fill)"/><rect x="146" y="16" width="350" height="50" fill="var(--a1-fill)"/><rect x="496" y="16" width="268" height="50" fill="var(--a1-fill)"/><text class="h" x="81" y="40" text-anchor="middle">Barrier</text><text class="h" x="321" y="32" text-anchor="middle">A sentence that</text><text class="h" x="321" y="50" text-anchor="middle">reveals it</text><text class="h" x="630" y="32" text-anchor="middle">One question that</text><text class="h" x="630" y="50" text-anchor="middle">interrupts it</text><line x1="16" y1="66" x2="764" y2="66" stroke="var(--ink)" stroke-width="2"/><line x1="146" y1="16" x2="146" y2="454" stroke="var(--ink)" stroke-width="1.5"/><line x1="496" y1="16" x2="496" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="81" y="100">egocentrism</text><text x="156" y="94">"I was taught this way and I</text><text x="156" y="110">turned out fine, so it is sound"</text><text x="506" y="94">"Would it convince a teacher</text><text x="506" y="110">whose results are different?"</text><line x1="16" y1="124" x2="764" y2="124" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="158">self-confirming search</text><text x="156" y="152">"I only notice the pupils who</text><text x="156" y="168">prove my point"</text><text x="506" y="152">"What would a pupil who</text><text x="506" y="168">disagrees look like?"</text><line x1="16" y1="182" x2="764" y2="182" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="216">group conformity</text><text x="156" y="210">"I stayed silent because</text><text x="156" y="226">everyone else agreed"</text><text x="506" y="210">"What would you say if no one</text><text x="506" y="226">else had spoken yet?"</text><line x1="16" y1="240" x2="764" y2="240" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="274">wishful thinking</text><text x="156" y="268">"If I set less homework,</text><text x="156" y="284">results will stay the same"</text><text x="506" y="268">"What evidence would make</text><text x="506" y="284">you change your mind?"</text><line x1="16" y1="302" x2="764" y2="302" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="336">unexamined assumption</text><text x="156" y="330">"These pupils cannot manage</text><text x="156" y="346">group work"</text><text x="506" y="330">"What are you assuming</text><text x="506" y="346">about their preparation?"</text><line x1="16" y1="360" x2="764" y2="360" stroke="var(--ink)" stroke-width="1"/><text class="h" x="81" y="394">sociocentrism</text><text x="156" y="388">"We have always done it</text><text x="156" y="404">this way in this school"</text><text x="506" y="388">"What reason would hold even</text><text x="506" y="404">if no one had done it before?"</text><rect x="16" y="66" width="748" height="388" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>