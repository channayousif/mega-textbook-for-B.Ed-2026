<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ روزمرہ جملوں کو الجبرا میں بدلنے کا جدول</title><desc id="d">پانچ روزمرہ جملوں کو الجبرا میں بدلنے کا جدول، ہر ایک کے ساتھ کرایہ یا بجٹ کی مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="550" y="82" text-anchor="middle">روزمرہ جملہ</text><text class="h" x="180" y="82" text-anchor="middle">الجبرا جو بنتا ہے</text><line class="grid" x1="340" y1="56" x2="340" y2="416"/><line class="grid" x1="750" y1="160" x2="20" y2="160"/><line class="grid" x1="750" y1="224" x2="20" y2="224"/><line class="grid" x1="750" y1="288" x2="20" y2="288"/><line class="grid" x1="750" y1="352" x2="20" y2="352"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="body" x="738" y="112" text-anchor="end">مقررہ رقم جمع فی چیز شرح:</text><text class="small" x="738" y="132" text-anchor="end">"60 روپے شروع میں، پھر 15 فی کلومیٹر"</text><text class="body" x="180" y="122" text-anchor="middle">60 + 15k</text><text class="body" x="738" y="176" text-anchor="end">کل برابر گروہوں میں بٹتی ہے:</text><text class="small" x="738" y="196" text-anchor="end">"240 طلبہ کو 15 کے گروپوں میں"</text><text class="body" x="180" y="186" text-anchor="middle">240 / 15 = g</text><text class="body" x="738" y="240" text-anchor="end">ایک مقدار دوسری سے اتنی زیادہ:</text><text class="small" x="738" y="260" text-anchor="end">"وین بس سے 12 زیادہ بیٹھتی ہے"</text><text class="body" x="180" y="250" text-anchor="middle">v = b + 12</text><text class="body" x="738" y="304" text-anchor="end">کل شرح ضرب مقدار ہے:</text><text class="small" x="738" y="324" text-anchor="end">"کاپیاں 80 روپے فی کاپی"</text><text class="body" x="180" y="314" text-anchor="middle">خرچ = 80n</text><text class="body" x="738" y="368" text-anchor="end">کس مقدار سے آگے:</text><text class="small" x="738" y="388" text-anchor="end">"پرنٹر B کب سستا رہنا بند کرتا ہے؟"</text><text class="body" x="180" y="378" text-anchor="middle">2,000 + 15n = 1,200 + 25n</text><text class="small" x="390" y="440" text-anchor="middle">صورت حال پڑھیں، شکل پہچانیں، قاعدہ لکھیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
