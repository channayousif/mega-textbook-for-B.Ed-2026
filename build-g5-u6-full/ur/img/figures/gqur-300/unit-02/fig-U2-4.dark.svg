<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four percentage situations</title><desc id="d">Table of four percentage situations with the question each asks and a worked rupee example for each.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="180" y="82" text-anchor="middle">Situation</text><text class="h" x="430" y="82" text-anchor="middle">What it asks</text><text class="h" x="645" y="82" text-anchor="middle">Worked rupee example</text><line class="grid" x1="320" y1="56" x2="320" y2="416"/><line class="grid" x1="530" y1="56" x2="530" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="264" x2="760" y2="264"/><line class="grid" x1="30" y1="368" x2="760" y2="368"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="180" y="116" text-anchor="middle">Percentage of</text><text class="sh" x="180" y="134" text-anchor="middle">a quantity</text><text class="body" x="332" y="116">take a named share</text><text class="body" x="332" y="136">of the whole</text><text class="body" x="542" y="116">15 percent of a 2,000 rupee fee</text><text class="body" x="542" y="136">is 300 rupees</text><text class="sh" x="180" y="220" text-anchor="middle">Percentage</text><text class="sh" x="180" y="238" text-anchor="middle">increase</text><text class="body" x="332" y="220">grow the original by</text><text class="body" x="332" y="240">a named share</text><text class="body" x="542" y="220">a 1,200 rupee bill rising by</text><text class="body" x="542" y="240">10 percent becomes 1,320</text><text class="sh" x="180" y="324" text-anchor="middle">Percentage</text><text class="sh" x="180" y="342" text-anchor="middle">decrease</text><text class="body" x="332" y="324">shrink the original by</text><text class="body" x="332" y="344">a named share</text><text class="body" x="542" y="324">a 500 rupee shirt at 20 percent</text><text class="body" x="542" y="344">off costs 400 rupees</text><text class="sh" x="180" y="404" text-anchor="middle">Reverse</text><text class="sh" x="180" y="422" text-anchor="middle">percentage</text><text class="body" x="332" y="396">find the original before</text><text class="body" x="332" y="416">a known change</text><text class="body" x="542" y="396">after a 10 percent rise the fee is</text><text class="body" x="542" y="416">2,200, so it was 2,000</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
