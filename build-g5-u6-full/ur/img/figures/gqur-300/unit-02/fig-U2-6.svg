<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart for choosing the operation in a word problem</title><desc id="d">Flowchart for choosing the operation in a word problem: read the situation, decide between multiply, divide, or add and subtract using what the total does, then check reasonableness.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="42" text-anchor="middle">Choosing the operation: what does the total do?</text><rect class="panel-a" x="290" y="66" width="200" height="58" rx="10"/><text class="sh" x="390" y="90" text-anchor="middle">Read the situation</text><text class="small" x="390" y="110" text-anchor="middle">what is given, what is asked</text><polygon class="panel" points="390,150 510,196 390,242 270,196"/><text class="sh" x="390" y="190" text-anchor="middle">Does the total combine</text><text class="sh" x="390" y="208" text-anchor="middle">equal groups?</text><rect class="panel-b" x="580" y="166" width="160" height="60" rx="10"/><text class="sh" x="660" y="192" text-anchor="middle">Multiply</text><text class="small" x="660" y="212" text-anchor="middle">20 boxes of 12 chalks</text><line class="stroke" x1="510" y1="196" x2="574" y2="196" marker-end="url(#arrow)"/><text class="small" x="542" y="186" text-anchor="middle">yes</text><line class="stroke" x1="390" y1="242" x2="390" y2="274" marker-end="url(#arrow)"/><text class="small" x="408" y="264">no</text><rect class="panel" x="240" y="278" width="300" height="56" rx="10"/><text class="sh" x="390" y="302" text-anchor="middle">Does the total break into equal groups?</text><text class="small" x="390" y="322" text-anchor="middle">(or does it change by an amount?)</text><rect class="panel-c" x="40" y="360" width="160" height="60" rx="10"/><text class="sh" x="120" y="386" text-anchor="middle">Divide</text><text class="small" x="120" y="406" text-anchor="middle">240 pupils into groups of 15</text><line class="stroke" x1="290" y1="334" x2="160" y2="360" marker-end="url(#arrow)"/><text class="small" x="200" y="352" text-anchor="middle">yes</text><rect class="panel" x="440" y="360" width="200" height="60" rx="10"/><text class="sh" x="540" y="386" text-anchor="middle">Add or subtract</text><text class="small" x="540" y="406" text-anchor="middle">a 2,000 fee rises by 200</text><line class="stroke" x1="490" y1="334" x2="520" y2="360" marker-end="url(#arrow)"/><text class="small" x="530" y="352" text-anchor="middle">no</text><rect class="panel-a" x="680" y="360" width="80" height="60" rx="10"/><text class="sh" x="720" y="384" text-anchor="middle">Check</text><text class="small" x="720" y="404" text-anchor="middle">is it</text><text class="small" x="720" y="418" text-anchor="middle">reasonable?</text><line class="stroke" x1="640" y1="390" x2="674" y2="390" marker-end="url(#arrow)"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
