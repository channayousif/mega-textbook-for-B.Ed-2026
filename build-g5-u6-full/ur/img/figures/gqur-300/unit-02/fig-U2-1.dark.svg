<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of the number system as nested panels</title><desc id="d">Diagram of the number system as nested panels: whole numbers sit inside integers, which sit inside rational numbers, with example numbers 7, -4, three quarters, and 0.75 placed in their correct regions.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-c" x="60" y="80" width="600" height="320" rx="14"/><text class="sh" x="360" y="112" text-anchor="middle">Rational numbers</text><text class="body" x="540" y="150">3/4</text><text class="body" x="576" y="150">0.75</text><text class="small" x="540" y="176">every fraction has a</text><text class="small" x="540" y="194">decimal name</text><rect class="panel-b" x="110" y="210" width="380" height="160" rx="12"/><text class="sh" x="300" y="238" text-anchor="middle">Integers</text><text class="body" x="440" y="280">-4</text><rect class="panel-a" x="150" y="260" width="180" height="84" rx="10"/><text class="sh" x="240" y="294" text-anchor="middle">Whole numbers</text><text class="body" x="240" y="322" text-anchor="middle">7</text><text class="h" x="390" y="48" text-anchor="middle">The number family tree</text><text class="small" x="84" y="428" text-anchor="start">0 counts as a whole number</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
