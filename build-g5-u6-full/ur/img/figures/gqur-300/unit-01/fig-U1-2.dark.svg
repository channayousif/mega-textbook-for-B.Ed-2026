<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table classifying five school tasks by whether they need quantitative reasoning</title><desc id="d">Table classifying five school tasks by whether they need quantitative reasoning, with a reason in each cell.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .yes { fill: var(--ink); } .no { fill: var(--muted); } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="160" y="82" text-anchor="middle">School task</text><text class="h" x="405" y="82" text-anchor="middle">Needs quantitative reasoning</text><text class="h" x="640" y="82" text-anchor="middle">Does not need it</text><line class="grid" x1="290" y1="56" x2="290" y2="416"/><line class="grid" x1="520" y1="56" x2="520" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="224" x2="760" y2="224"/><line class="grid" x1="30" y1="288" x2="760" y2="288"/><line class="grid" x1="30" y1="352" x2="760" y2="352"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="body" x="42" y="122">Plan group sizes from</text><text class="body" x="42" y="140">enrolment data</text><path class="yes" d="M 396 116 l 5 6 l 10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="405" y="146" text-anchor="middle">divide, check remainder</text><path class="no" d="M 631 114 l 12 12 M 643 114 l -12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="640" y="146" text-anchor="middle">a wrong split fails pupils</text><text class="body" x="42" y="186">Read a class marksheet and</text><text class="body" x="42" y="204">decide who needs support</text><path class="yes" d="M 396 180 l 5 6 l 10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="405" y="210" text-anchor="middle">compare, find the pattern</text><path class="no" d="M 631 178 l 12 12 M 643 178 l -12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="640" y="210" text-anchor="middle">marks alone are not enough</text><text class="body" x="42" y="250">Compare two textbook</text><text class="body" x="42" y="268">suppliers on cost per pupil</text><path class="yes" d="M 396 244 l 5 6 l 10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="405" y="274" text-anchor="middle">unit rate decides</text><path class="no" d="M 631 242 l 12 12 M 643 242 l -12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="640" y="274" text-anchor="middle">totals mislead</text><text class="body" x="42" y="324">Check a school budget line</text><path class="yes" d="M 396 308 l 5 6 l 10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="405" y="338" text-anchor="middle">does spend match plan</text><path class="no" d="M 631 306 l 12 12 M 643 306 l -12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="640" y="338" text-anchor="middle">a glance cannot tell</text><text class="body" x="42" y="378">Write a morning</text><text class="body" x="42" y="396">announcement</text><path class="no" d="M 396 372 l 12 12 M 408 372 l -12 12" stroke="var(--muted)" stroke-width="2.5" fill="none"/><text class="small" x="405" y="402" text-anchor="middle">wording, not numbers</text><path class="yes" d="M 631 372 l 5 6 l 10 -12" stroke="var(--ink)" stroke-width="2.5" fill="none"/><text class="small" x="640" y="402" text-anchor="middle">plain writing skill</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
