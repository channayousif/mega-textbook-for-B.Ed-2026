<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">پانچ تعلیمی و سماجی اشاریوں کا جدول</title><desc id="d">پانچ تعلیمی و سماجی اشاریوں کا جدول: ہر ایک کیا ناپتا ہے اور کیا چھوڑ سکتا ہے، سندھ کی مردم شماری کے اعداد کے ساتھ۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="20" y="56" width="730" height="40"/><text class="h" x="630" y="82" text-anchor="middle">اشاریہ</text><text class="h" x="380" y="82" text-anchor="middle">کیا ناپتا ہے</text><text class="h" x="150" y="82" text-anchor="middle">کیا چھوڑ سکتا ہے</text><line class="grid" x1="500" y1="56" x2="500" y2="416"/><line class="grid" x1="270" y1="56" x2="270" y2="416"/><line class="grid" x1="750" y1="152" x2="20" y2="152"/><line class="grid" x1="750" y1="216" x2="20" y2="216"/><line class="grid" x1="750" y1="280" x2="20" y2="280"/><line class="grid" x1="750" y1="344" x2="20" y2="344"/><rect class="stroke" x="20" y="56" width="730" height="360" fill="none"/><text class="sh" x="630" y="108" text-anchor="middle">خواندگی کی شرح</text><text class="body" x="488" y="100" text-anchor="end">10 سال سے اوپر پڑھ سکنے والوں</text><text class="body" x="488" y="120" text-anchor="end">کا فیصد (سندھ 2023: 57.54)</text><text class="small" x="258" y="108" text-anchor="end">نو سال کا بچہ جو پڑھ نہیں سکتا</text><text class="small" x="258" y="128" text-anchor="end">اس شرح میں گنا ہی نہیں جاتا</text><text class="sh" x="630" y="184" text-anchor="middle">اسکول سے باہر شرح</text><text class="body" x="488" y="184" text-anchor="end">5-16 سال کے بچے جو اسکول میں نہیں</text><text class="body" x="488" y="200" text-anchor="end">(سندھ 2023: 46.29)</text><text class="small" x="258" y="184" text-anchor="end">بچے کہاں ہیں - ضلع کی اوسط</text><text class="small" x="258" y="204" text-anchor="end">اپنا نقشہ چھپاتی ہے</text><text class="sh" x="630" y="248" text-anchor="middle">طلبہ معلم تناسب</text><text class="body" x="488" y="248" text-anchor="end">فی معلم طلبہ کی تعداد</text><text class="small" x="258" y="248" text-anchor="end">اچھی اوسط 80 طلبہ کی ایک کلاس اور</text><text class="small" x="258" y="268" text-anchor="end">20 کی تین کلاسیں چھپا سکتی ہے</text><text class="sh" x="630" y="312" text-anchor="middle">داخلے کی شرح</text><text class="body" x="488" y="312" text-anchor="end">کسی عمر کے گروپ میں داخلہ لینے والوں کا فیصد</text><text class="small" x="258" y="312" text-anchor="end">داخلہ لینا حاضری دینا نہیں</text><text class="sh" x="630" y="376" text-anchor="middle">حاضری کی شرح</text><text class="body" x="488" y="368" text-anchor="end">داخلہ لینے والوں میں سے عام دن</text><text class="body" x="488" y="388" text-anchor="end">حاضر طلبہ کا فیصد</text><text class="small" x="258" y="376" text-anchor="end">ایک دن کی گنتی غیر معمولی</text><text class="small" x="258" y="396" text-anchor="end">دن ہو سکتی ہے</text><text class="small" x="390" y="440" text-anchor="middle">ہر اشاریہ ایک سوال کا جواب دیتا اور دوسرا چھپاتا ہے - بنیاد کو عدد کے ساتھ پڑھیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
