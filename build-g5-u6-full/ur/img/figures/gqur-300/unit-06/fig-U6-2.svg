<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of four financial terms</title><desc id="d">Table of four financial terms with what each measures and a worked rupee example.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="160" y="82" text-anchor="middle">Term</text><text class="h" x="390" y="82" text-anchor="middle">What it measures</text><text class="h" x="625" y="82" text-anchor="middle">Worked rupee example</text><line class="grid" x1="290" y1="56" x2="290" y2="416"/><line class="grid" x1="500" y1="56" x2="500" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="264" x2="760" y2="264"/><line class="grid" x1="30" y1="368" x2="760" y2="368"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="160" y="116" text-anchor="middle">Profit</text><text class="body" x="302" y="116">takings minus total costs</text><text class="small" x="512" y="108">7,200 - 5,600 = 1,600 rupees,</text><text class="small" x="512" y="128">about 28.6 percent of costs</text><text class="sh" x="160" y="220" text-anchor="middle">Loss</text><text class="body" x="302" y="220">costs above takings</text><text class="small" x="512" y="212">takings 3,600 against costs 5,600:</text><text class="small" x="512" y="232">loss 2,000, about 35.7 percent</text><text class="sh" x="160" y="324" text-anchor="middle">Simple interest</text><text class="body" x="302" y="316">a fixed percent of the original</text><text class="body" x="302" y="336">amount per year</text><text class="small" x="512" y="316">10,000 rupees at 5 percent for 3 years</text><text class="small" x="512" y="336">earns 1,500 rupees</text><text class="sh" x="160" y="404" text-anchor="middle">Budget</text><text class="body" x="302" y="396">a plan for money before</text><text class="body" x="302" y="416">it arrives</text><text class="small" x="512" y="396">25,000 in: 12,000 fixed, 3,000 saved,</text><text class="small" x="512" y="416">10,000 variable</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
