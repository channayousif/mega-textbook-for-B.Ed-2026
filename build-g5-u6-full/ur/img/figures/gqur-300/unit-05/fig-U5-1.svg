<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of the data cycle</title><desc id="d">Flowchart of the data cycle: pose a question, collect, organize, summarize, interpret, with a loop back to a new question.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">The data cycle</text><rect class="panel-a" x="30" y="140" width="130" height="120" rx="10"/><text class="sh" x="95" y="176" text-anchor="middle">1. Question</text><text class="small" x="95" y="200" text-anchor="middle">what do we</text><text class="small" x="95" y="218" text-anchor="middle">want to know?</text><rect class="panel-b" x="185" y="140" width="130" height="120" rx="10"/><text class="sh" x="250" y="176" text-anchor="middle">2. Collect</text><text class="small" x="250" y="200" text-anchor="middle">observation,</text><text class="small" x="250" y="218" text-anchor="middle">survey, records</text><rect class="panel-c" x="340" y="140" width="130" height="120" rx="10"/><text class="sh" x="405" y="176" text-anchor="middle">3. Organize</text><text class="small" x="405" y="200" text-anchor="middle">tallies,</text><text class="small" x="405" y="218" text-anchor="middle">frequency table</text><rect class="panel" x="495" y="140" width="130" height="120" rx="10"/><text class="sh" x="560" y="176" text-anchor="middle">4. Summarize</text><text class="small" x="560" y="200" text-anchor="middle">totals, averages,</text><text class="small" x="560" y="218" text-anchor="middle">percentages</text><rect class="panel-a" x="650" y="140" width="120" height="120" rx="10"/><text class="sh" x="710" y="176" text-anchor="middle">5. Interpret</text><text class="small" x="710" y="200" text-anchor="middle">what does the</text><text class="small" x="710" y="218" text-anchor="middle">data answer?</text><line class="stroke" x1="160" y1="200" x2="179" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="315" y1="200" x2="334" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="470" y1="200" x2="489" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="625" y1="200" x2="644" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M 710 260 L 710 330 L 95 330 L 95 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="402" y="322" text-anchor="middle">the answer usually poses a new question</text><text class="body" x="390" y="392" text-anchor="middle">Raw data answers nothing by itself; the cycle's order does the answering.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
