<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five interpretation questions</title><desc id="d">Table of five interpretation questions to ask of any statistic, each with why it matters.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="200" y="82" text-anchor="middle">The question to ask</text><text class="h" x="530" y="82" text-anchor="middle">Why it matters</text><line class="grid" x1="370" y1="56" x2="370" y2="416"/><line class="grid" x1="30" y1="152" x2="760" y2="152"/><line class="grid" x1="30" y1="216" x2="760" y2="216"/><line class="grid" x1="30" y1="280" x2="760" y2="280"/><line class="grid" x1="30" y1="344" x2="760" y2="344"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="body" x="42" y="108">1. Who collected it?</text><text class="small" x="382" y="100">an interested party or a neutral office?</text><text class="small" x="382" y="120">the collector's purpose shapes the framing</text><text class="body" x="42" y="184">2. How was it collected?</text><text class="small" x="382" y="184">method decides what the number can honestly claim</text><text class="body" x="42" y="248">3. Compared to what?</text><text class="small" x="382" y="240">last year? a rival? the national figure?</text><text class="small" x="382" y="260">a number without its comparison persuades, not informs</text><text class="body" x="42" y="312">4. What is the base?</text><text class="small" x="382" y="304">57.54 percent of whom?</text><text class="small" x="382" y="324">change the base, change the number (10+ vs all ages)</text><text class="body" x="42" y="376">5. What is missing?</text><text class="small" x="382" y="368">the gap behind the average: male 64.23 vs female 50.21,</text><text class="small" x="382" y="388">the 46.29 percent out-of-school rate the headline omits</text><text class="small" x="390" y="440" text-anchor="middle">A truthful claim survives all five easily - ask them of everything.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
