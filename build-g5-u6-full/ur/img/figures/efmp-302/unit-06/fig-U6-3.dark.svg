<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three stages, and what changes between them</title><desc id="d">Timeline of a teaching career across the preservice, new teacher and experienced teacher stages, with each transition labelled by what changes and each stage labelled with what it most needs.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .s1{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2.5} .s2{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2.5} .s3{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .nd{fill:var(--panel);stroke:var(--muted);stroke-width:1.5} .tr{fill:none;stroke:var(--a4);stroke-width:2.5} text{font-size:12px;fill:var(--ink)} .h{font-size:13px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .t{font-size:11.5px;font-weight:700;fill:var(--a4)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a4)"/></marker></defs><rect class="bg" x="0" y="0" width="900" height="100%"/><line class="ax" x1="30" y1="230" x2="870" y2="230"/><rect class="s1" x="40" y="100" width="220" height="80" rx="6"/><text class="h" x="150" y="130" text-anchor="middle">Preservice</text><text class="m" x="150" y="142" text-anchor="middle"><tspan x="150" dy="0">learning to teach,</tspan><tspan x="150" dy="20">while</tspan></text><text class="m" x="150" y="158" text-anchor="middle"><tspan x="150" dy="0">nobody depends on</tspan><tspan x="150" dy="20">you yet</tspan></text><rect class="s2" x="340" y="100" width="220" height="80" rx="6"/><text class="h" x="450" y="130" text-anchor="middle">New teacher</text><text class="m" x="450" y="142" text-anchor="middle"><tspan x="450" dy="0">responsible for a</tspan><tspan x="450" dy="20">class</tspan></text><text class="m" x="450" y="168" text-anchor="middle">from the first day</text><rect class="s3" x="640" y="100" width="220" height="80" rx="6"/><text class="h" x="750" y="130" text-anchor="middle">Experienced teacher</text><text class="m" x="750" y="142" text-anchor="middle"><tspan x="750" dy="0">competent, and able</tspan><tspan x="750" dy="20">to</tspan></text><text class="m" x="750" y="158" text-anchor="middle"><tspan x="750" dy="0">choose what to get</tspan><tspan x="750" dy="20">better at</tspan></text><path class="tr" d="M266 140 L334 140" marker-end="url(#a)"/><text class="t" x="300" y="122" text-anchor="middle">from observing</text><text class="t" x="300" y="106" text-anchor="middle">to being responsible</text><path class="tr" d="M566 140 L634 140" marker-end="url(#a)"/><text class="t" x="600" y="122" text-anchor="middle">from surviving</text><text class="t" x="600" y="106" text-anchor="middle">to choosing</text><line class="ax" x1="150" y1="180" x2="150" y2="224" stroke-width="1.5"/><line class="ax" x1="450" y1="180" x2="450" y2="224" stroke-width="1.5"/><line class="ax" x1="750" y1="180" x2="750" y2="224" stroke-width="1.5"/><rect class="nd" x="40" y="252" width="220" height="56" rx="5"/><text class="h" x="150" y="274" text-anchor="middle">Most needs</text><text class="m" x="150" y="286" text-anchor="middle"><tspan x="150" dy="0">practice with real</tspan><tspan x="150" dy="20">pupils, early</tspan></text><rect class="nd" x="340" y="252" width="220" height="56" rx="5"/><text class="h" x="450" y="274" text-anchor="middle">Most needs</text><text class="m" x="450" y="286" text-anchor="middle"><tspan x="450" dy="0">a named colleague to</tspan><tspan x="450" dy="20">ask</tspan></text><rect class="nd" x="640" y="252" width="220" height="56" rx="5"/><text class="h" x="750" y="274" text-anchor="middle">Most needs</text><text class="m" x="750" y="286" text-anchor="middle"><tspan x="750" dy="0">a reason not to</tspan><tspan x="750" dy="20">coast</tspan></text><text class="m" x="30" y="322"><tspan x="30" dy="0">The two transitions are where</tspan><tspan x="30" dy="20">teachers are lost: the first</tspan><tspan x="30" dy="20">because responsibility arrives all</tspan><tspan x="30" dy="20">at once, the second because</tspan></text><text class="m" x="30" y="340"><tspan x="30" dy="0">competence removes the pressure</tspan><tspan x="30" dy="20">that drove improvement, and</tspan><tspan x="30" dy="20">nothing replaces it unless the</tspan><tspan x="30" dy="20">teacher chooses it.</tspan></text><text class="wm" x="888" y="432" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
