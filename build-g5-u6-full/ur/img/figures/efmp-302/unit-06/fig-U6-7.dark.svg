<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">A one-page professional development plan</title><desc id="d">Diagram of a one-page development plan with six blocks - the gap, the evidence for it, one goal, the activity, the evidence of change, and the review date - annotated one goal not five, and evidence decided now.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .pg{fill:none;stroke:var(--ink);stroke-width:2.5} .b{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .bg2{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .note{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .ld{stroke:var(--a3);stroke-width:1.8;fill:none} text{font-size:11.5px;fill:var(--ink)} .n{font-size:12.5px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a3)"/></marker></defs><rect class="bg" x="0" y="0" width="880" height="100%"/><rect class="pg" x="30" y="30" width="520" height="400" rx="4"/><text class="m" x="42" y="42"><tspan x="42" dy="0">One page. If it needs two, the</tspan><tspan x="42" dy="20">plan is too big.</tspan></text><rect class="bg2" x="50" y="64" width="480" height="56" rx="5"/><text class="n" x="62" y="76"><tspan x="62" dy="0">1 The gap, stated</tspan><tspan x="62" dy="20">specifically</tspan></text><text class="m" x="62" y="96"><tspan x="62" dy="0">not "assessment" but "I cannot</tspan><tspan x="62" dy="20">tell mid-lesson who is lost"</tspan></text><rect class="bg2" x="50" y="128" width="480" height="56" rx="5"/><text class="n" x="62" y="140"><tspan x="62" dy="0">2 The evidence that the gap is</tspan><tspan x="62" dy="20">real</tspan></text><text class="m" x="62" y="150"><tspan x="62" dy="0">last term's results, or a</tspan><tspan x="62" dy="20">colleague's observation, not a</tspan><tspan x="62" dy="20">feeling</tspan></text><rect class="b" x="50" y="192" width="480" height="56" rx="5"/><text class="n" x="62" y="204"><tspan x="62" dy="0">3 One goal for the</tspan><tspan x="62" dy="20">year</tspan></text><text class="m" x="62" y="224"><tspan x="62" dy="0">written so you could tell whether</tspan><tspan x="62" dy="20">you met it</tspan></text><rect class="b" x="50" y="256" width="480" height="56" rx="5"/><text class="n" x="62" y="268"><tspan x="62" dy="0">4 The activity that</tspan><tspan x="62" dy="20">addresses it</tspan></text><text class="m" x="62" y="288"><tspan x="62" dy="0">chosen against the six principles,</tspan><tspan x="62" dy="20">not against what is on offer</tspan></text><rect class="b" x="50" y="320" width="480" height="56" rx="5"/><text class="n" x="62" y="332"><tspan x="62" dy="0">5 The evidence that would show</tspan><tspan x="62" dy="20">change</tspan></text><text class="m" x="62" y="352"><tspan x="62" dy="0">the same measure as block 2, so</tspan><tspan x="62" dy="20">the two can be compared</tspan></text><rect class="bg2" x="50" y="384" width="480" height="34" rx="5"/><text class="n" x="62" y="406">6 The review date</text><path class="ld" x1="0" d="M534 220 L600 220" marker-end="url(#a)"/><rect class="note" x="606" y="196" width="250" height="48" rx="5"/><text class="n" x="618" y="218">One, not five.</text><text class="m" x="618" y="226"><tspan x="618" dy="0">Five goals is a list of regrets by</tspan><tspan x="618" dy="20">March.</tspan></text><path class="ld" d="M534 348 L600 348" marker-end="url(#a)"/><rect class="note" x="606" y="324" width="250" height="48" rx="5"/><text class="n" x="618" y="336"><tspan x="618" dy="0">Decided now, not in</tspan><tspan x="618" dy="20">March.</tspan></text><text class="m" x="618" y="354"><tspan x="618" dy="0">Evidence chosen later always</tspan><tspan x="618" dy="20">flatters.</tspan></text><text class="m" x="606" y="76"><tspan x="606" dy="0">Blocks 1, 2 and 6</tspan><tspan x="606" dy="20">are what make it</tspan></text><text class="m" x="606" y="94"><tspan x="606" dy="0">checkable. Blocks 3, 4 and 5 are</tspan><tspan x="606" dy="20">what</tspan></text><text class="m" x="606" y="112"><tspan x="606" dy="0">make it a plan</tspan><tspan x="606" dy="20">rather than a wish.</tspan></text><text class="m" x="606" y="140"><tspan x="606" dy="0">Most plans fail at 2 and 5: no</tspan><tspan x="606" dy="20">baseline,</tspan></text><text class="m" x="606" y="158"><tspan x="606" dy="0">and no agreed way to</tspan><tspan x="606" dy="20">tell.</tspan></text><text class="wm" x="868" y="502" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
