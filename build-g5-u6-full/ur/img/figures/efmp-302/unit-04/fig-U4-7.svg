<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Where standards bite across a teaching career</title><desc id="d">Timeline of a teaching career marking where standards are applied - admission, certification, licensing, probation, periodic appraisal, promotion and renewal - each labelled with who applies it and what is at stake.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ax{stroke:var(--ink);stroke-width:3;fill:none} .st{fill:var(--a1);stroke:none} .c{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .cg{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .cr{fill:var(--panel);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4} text{font-size:11.5px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:10.5px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><rect class="bg" x="0" y="0" width="920" height="100%"/><line class="ax" x1="30" y1="215" x2="890" y2="215"/><g class="st"><circle cx="90" cy="215" r="6"/><circle cx="215" cy="215" r="6"/><circle cx="340" cy="215" r="6"/><circle cx="465" cy="215" r="6"/><circle cx="590" cy="215" r="6"/><circle cx="715" cy="215" r="6"/><circle cx="840" cy="215" r="6"/></g><rect class="c" x="22" y="96" width="136" height="80" rx="5"/><text class="h" x="90" y="118" text-anchor="middle">Admission</text><text class="m" x="90" y="136" text-anchor="middle">to teacher education</text><text class="m" x="90" y="144" text-anchor="middle"><tspan x="90" dy="0">applied by: the</tspan><tspan x="90" dy="20">institution</tspan></text><text class="m" x="90" y="170" text-anchor="middle">at stake: entry</text><rect class="c" x="147" y="254" width="136" height="80" rx="5"/><text class="h" x="215" y="276" text-anchor="middle">Certification</text><text class="m" x="215" y="294" text-anchor="middle">on completion</text><text class="m" x="215" y="302" text-anchor="middle"><tspan x="215" dy="0">applied by: the</tspan><tspan x="215" dy="20">awarding body</tspan></text><text class="m" x="215" y="318" text-anchor="middle"><tspan x="215" dy="0">at stake: the</tspan><tspan x="215" dy="20">qualification</tspan></text><rect class="cr" x="272" y="96" width="136" height="80" rx="5"/><text class="h" x="340" y="118" text-anchor="middle">Licensing</text><text class="m" x="340" y="136" text-anchor="middle">where required</text><text class="m" x="340" y="144" text-anchor="middle"><tspan x="340" dy="0">applied by: the</tspan><tspan x="340" dy="20">state</tspan></text><text class="m" x="340" y="160" text-anchor="middle"><tspan x="340" dy="0">at stake: the right</tspan><tspan x="340" dy="20">to teach</tspan></text><rect class="c" x="397" y="254" width="136" height="80" rx="5"/><text class="h" x="465" y="276" text-anchor="middle">Probation</text><text class="m" x="465" y="294" text-anchor="middle">and confirmation</text><text class="m" x="465" y="302" text-anchor="middle"><tspan x="465" dy="0">applied by: the</tspan><tspan x="465" dy="20">employer</tspan></text><text class="m" x="465" y="328" text-anchor="middle">at stake: the post</text><rect class="cg" x="522" y="96" width="136" height="80" rx="5"/><text class="h" x="590" y="118" text-anchor="middle">Periodic appraisal</text><text class="m" x="590" y="136" text-anchor="middle">recurring</text><text class="m" x="590" y="154" text-anchor="middle">applied by: the head</text><text class="m" x="590" y="160" text-anchor="middle"><tspan x="590" dy="0">at stake: standing,</tspan><tspan x="590" dy="20">and pay</tspan></text><rect class="c" x="647" y="254" width="136" height="80" rx="5"/><text class="h" x="715" y="276" text-anchor="middle">Promotion</text><text class="m" x="715" y="294" text-anchor="middle">or transfer</text><text class="m" x="715" y="302" text-anchor="middle"><tspan x="715" dy="0">applied by: the</tspan><tspan x="715" dy="20">system</tspan></text><text class="m" x="715" y="318" text-anchor="middle"><tspan x="715" dy="0">at stake: the next</tspan><tspan x="715" dy="20">role</tspan></text><rect class="cr" x="772" y="96" width="136" height="80" rx="5"/><text class="h" x="840" y="118" text-anchor="middle">Re-licensing</text><text class="m" x="840" y="136" text-anchor="middle">where it exists</text><text class="m" x="840" y="144" text-anchor="middle"><tspan x="840" dy="0">applied by: the</tspan><tspan x="840" dy="20">state</tspan></text><text class="m" x="840" y="160" text-anchor="middle"><tspan x="840" dy="0">at stake: continuing</tspan><tspan x="840" dy="20">to teach</tspan></text><line class="ax" x1="90" y1="176" x2="90" y2="209" stroke-width="1.5"/><line class="ax" x1="215" y1="221" x2="215" y2="250" stroke-width="1.5"/><line class="ax" x1="340" y1="176" x2="340" y2="209" stroke-width="1.5"/><line class="ax" x1="465" y1="221" x2="465" y2="250" stroke-width="1.5"/><line class="ax" x1="590" y1="176" x2="590" y2="209" stroke-width="1.5"/><line class="ax" x1="715" y1="221" x2="715" y2="250" stroke-width="1.5"/><line class="ax" x1="840" y1="176" x2="840" y2="209" stroke-width="1.5"/><text class="m" x="30" y="16"><tspan x="30" dy="0">Dashed boxes are applied only</tspan><tspan x="30" dy="20">where a jurisdiction requires</tspan><tspan x="30" dy="20">them; the rest apply almost</tspan><tspan x="30" dy="20">everywhere.</tspan></text><text class="m" x="30" y="34"><tspan x="30" dy="0">One document is used seven times</tspan><tspan x="30" dy="20">by six different parties, each</tspan><tspan x="30" dy="20">wanting something different from</tspan><tspan x="30" dy="20">it.</tspan></text><text class="m" x="30" y="352"><tspan x="30" dy="0">That is why the same standard</tspan><tspan x="30" dy="20">reads as guidance at admission and</tspan><tspan x="30" dy="20">as a threat at appraisal. Nothing</tspan><tspan x="30" dy="20">about the words changed; the stake</tspan><tspan x="30" dy="20">did.</tspan></text><text class="wm" x="908" y="464" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
