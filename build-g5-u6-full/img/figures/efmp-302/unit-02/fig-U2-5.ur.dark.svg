<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ریسٹ کے چار اجزاء، اور ہر ایک پر ناکامی</title><desc id="d">ریسٹ کے چار اجزاء کا بہاؤ نقشہ: حساسیت، فیصلہ، محرک اور کردار، ترتیب کے ساتھ، اور ہر مرحلے سے ناکامی کی ایک شاخ نیچے گرتی ہوئی ایک ہی نتیجے کے خانے تک جاتی ہے جس پر لکھا ہے کوئی اخلاقی عمل نہیں۔</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .step{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2.5} .out{fill:var(--panel);stroke:var(--ink);stroke-width:2.5} .flow{stroke:var(--a1);stroke-width:2.5;fill:none} .fail{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4;fill:none} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--a1)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="100%"/><rect class="step" x="600" y="40" width="160" height="72" rx="6"/><text class="h" x="680" y="70" text-anchor="middle">1 اخلاقی</text><text class="h" x="680" y="88" text-anchor="middle">حساسیت</text><text class="m" x="680" y="96" text-anchor="middle"><tspan x="680" dy="0">محسوس کرنا کہ یہ</tspan><tspan x="680" dy="20">اخلاقی ہے</tspan></text><rect class="step" x="410" y="40" width="160" height="72" rx="6"/><text class="h" x="490" y="70" text-anchor="middle">2 اخلاقی</text><text class="h" x="490" y="88" text-anchor="middle">فیصلہ</text><text class="m" x="490" y="96" text-anchor="middle"><tspan x="490" dy="0">طے کرنا کہ درست کیا</tspan><tspan x="490" dy="20">ہے</tspan></text><rect class="step" x="220" y="40" width="160" height="72" rx="6"/><text class="h" x="300" y="70" text-anchor="middle">3 اخلاقی</text><text class="h" x="300" y="88" text-anchor="middle">محرک</text><text class="m" x="300" y="106" text-anchor="middle">باقی سب پر اسے چننا</text><rect class="step" x="30" y="40" width="160" height="72" rx="6"/><text class="h" x="110" y="70" text-anchor="middle">4 اخلاقی</text><text class="h" x="110" y="88" text-anchor="middle">کردار</text><text class="m" x="110" y="106" text-anchor="middle">اسے کر گزرنا</text><line class="flow" x1="600" y1="76" x2="575" y2="76" marker-end="url(#a)"/><line class="flow" x1="410" y1="76" x2="385" y2="76" marker-end="url(#a)"/><line class="flow" x1="220" y1="76" x2="195" y2="76" marker-end="url(#a)"/><path class="fail" d="M680 112 L680 190 L440 190 L440 296" marker-end="url(#b)"/><path class="fail" d="M490 112 L490 214 L410 214 L410 296" marker-end="url(#b)"/><path class="fail" d="M300 112 L300 214 L370 214 L370 296" marker-end="url(#b)"/><path class="fail" d="M110 112 L110 190 L340 190 L340 296" marker-end="url(#b)"/><text class="m" x="764" y="150" text-anchor="end">محسوس ہی نہ کیا</text><text class="m" x="574" y="150" text-anchor="end">غلط فیصلہ کیا</text><text class="m" x="384" y="140" text-anchor="end"><tspan x="384" dy="0">کوئی اور چیز بھاری</tspan><tspan x="384" dy="20">پڑی</tspan></text><text class="m" x="194" y="150" text-anchor="end">تکمیل نہ کر سکا</text><rect class="out" x="240" y="300" width="300" height="66" rx="6"/><text class="h" x="390" y="332" text-anchor="middle">کوئی اخلاقی عمل نہیں</text><text class="m" x="390" y="344" text-anchor="middle"><tspan x="390" dy="0">وہی نتیجہ، چار مختلف</tspan><tspan x="390" dy="20">راستوں سے</tspan></text><text class="m" x="390" y="380" text-anchor="middle"><tspan x="390" dy="0">چاروں کا کامیاب ہونا</tspan><tspan x="390" dy="20">ضروری ہے۔ علاج ہر</tspan><tspan x="390" dy="20">مرحلے پر مختلف ہے۔</tspan></text><text class="wm" x="768" y="470" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
