<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 650" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">What happens to a pupil's unplanned question in two kinds of lesson</title><desc id="d">A flowchart. A pupil asks an unplanned question. In an industrial lesson the steps are: does it fit today's script, no so hold it for later, the class returns to the plan, the question is set aside. In an inquiry lesson the steps are: what thinking does it open up, the class investigates it together, new ideas and questions appear, the lesson bends to follow it.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .box { fill: var(--bg); stroke: var(--ink); stroke-width: 2; } .head { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2.5; } .start { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; } .arw { stroke: var(--a1); stroke-width: 2.5; fill: none; } .ah { fill: var(--a1); } text { font-size: 15px; fill: var(--ink); } .h { font-weight: 700; font-size: 16px; } .wm{fill:var(--wm);font-size:11px} text{font-size:16px;fill:var(--ink)} .h,.head,.q,.c{font-size:18px;fill:var(--ink)} .m,.w,.cap,.rel,.note{font-size:14px;fill:var(--ink)} .wm{font-size:11px;fill:var(--wm)}</style><defs><marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="820" height="100%"/><rect class="start" x="270" y="20" width="280" height="54" rx="6"/><text class="h" x="410" y="42" text-anchor="middle"><tspan x="410" dy="0">a pupil asks an</tspan><tspan x="410" dy="20">unplanned question</tspan></text><g class="arw"><path d="M360 74 L215 112" marker-end="url(#a6)"/><path d="M460 74 L605 112" marker-end="url(#a6)"/></g><rect class="head" x="55" y="116" width="320" height="44" rx="6"/><text class="h" x="215" y="144" text-anchor="middle">industrial lesson</text><rect class="head" x="445" y="116" width="320" height="44" rx="6"/><text class="h" x="605" y="144" text-anchor="middle">inquiry lesson</text><g class="arw"><path d="M215 214 L215 250" marker-end="url(#a6)"/><path d="M215 320 L215 356" marker-end="url(#a6)"/><path d="M215 426 L215 462" marker-end="url(#a6)"/><path d="M605 214 L605 250" marker-end="url(#a6)"/><path d="M605 320 L605 356" marker-end="url(#a6)"/><path d="M605 426 L605 462" marker-end="url(#a6)"/></g><rect class="box" x="55" y="176" width="320" height="40" rx="6"/><text x="215" y="191" text-anchor="middle"><tspan x="215" dy="0">does it fit today's</tspan><tspan x="215" dy="20">script?</tspan></text><rect class="box" x="55" y="282" width="320" height="40" rx="6"/><text x="215" y="297" text-anchor="middle"><tspan x="215" dy="0">no, so hold it for</tspan><tspan x="215" dy="20">later</tspan></text><rect class="box" x="55" y="388" width="320" height="40" rx="6"/><text x="215" y="403" text-anchor="middle"><tspan x="215" dy="0">the class returns to</tspan><tspan x="215" dy="20">the plan</tspan></text><rect class="box" x="55" y="464" width="320" height="52" rx="6"/><text x="215" y="486" text-anchor="middle"><tspan x="215" dy="0">the question is set</tspan><tspan x="215" dy="20">aside</tspan></text><rect class="box" x="445" y="176" width="320" height="40" rx="6"/><text x="605" y="191" text-anchor="middle"><tspan x="605" dy="0">what thinking does</tspan><tspan x="605" dy="20">it open up?</tspan></text><rect class="box" x="445" y="282" width="320" height="40" rx="6"/><text x="605" y="287" text-anchor="middle"><tspan x="605" dy="0">the class</tspan><tspan x="605" dy="20">investigates it</tspan><tspan x="605" dy="20">together</tspan></text><rect class="box" x="445" y="388" width="320" height="40" rx="6"/><text x="605" y="403" text-anchor="middle"><tspan x="605" dy="0">new ideas and</tspan><tspan x="605" dy="20">questions appear</tspan></text><rect class="box" x="445" y="464" width="320" height="52" rx="6"/><text x="605" y="486" text-anchor="middle"><tspan x="605" dy="0">the lesson bends to</tspan><tspan x="605" dy="20">follow it</tspan></text><text class="wm" x="808" y="640" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
