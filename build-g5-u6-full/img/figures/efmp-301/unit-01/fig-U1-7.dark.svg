<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 292" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Three differences, what each looks like, and what it does not mean</title><desc id="d">A four-column table setting three differences - readiness and prior knowledge, motivation and interest, and language and home background - against what each looks like in class, what it does not mean about the pupil, and a first thing a teacher could try.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .muted{fill:var(--muted)} text{font-size:15px;fill:var(--ink)} .h{font-weight:700} .wm{fill:var(--wm);font-size:11px} .hd{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}.cell{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}.key{fill:var(--a1-fill);stroke:var(--a1);stroke-width:1.5}.c{font-size:12.5px}.q{font-size:12.5px;fill:var(--muted)}</style><rect class="bg" x="0" y="0" width="852" height="292"/><rect class="hd" x="14" y="14" width="176" height="56" rx="4"/><text x="102.0" y="46.5" text-anchor="middle" class="h" font-size="12.5">difference</text><rect class="hd" x="200" y="14" width="190" height="56" rx="4"/><text x="295.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">what it looks like in</text><text x="295.0" y="54.0" text-anchor="middle" class="h" font-size="12.5">class</text><rect class="hd" x="400" y="14" width="178" height="56" rx="4"/><text x="489.0" y="39.0" text-anchor="middle" class="h" font-size="12.5">what it does NOT</text><text x="489.0" y="54.0" text-anchor="middle" class="h" font-size="12.5">mean</text><rect class="key" x="588" y="14" width="250" height="56" rx="4"/><text x="713.0" y="46.5" text-anchor="middle" class="h" font-size="12.5">a first thing to try</text><rect class="hd" x="14" y="80" width="176" height="54" rx="4"/><text x="102.0" y="104.0" text-anchor="middle" class="q">readiness and prior</text><text x="102.0" y="120.0" text-anchor="middle" class="q">knowledge</text><rect class="cell" x="200" y="80" width="190" height="54" rx="4"/><text x="295.0" y="104.0" text-anchor="middle" class="c">copies but cannot start</text><text x="295.0" y="120.0" text-anchor="middle" class="c">alone</text><rect class="cell" x="400" y="80" width="178" height="54" rx="4"/><text x="489.0" y="112.0" text-anchor="middle" class="c">that the pupil is slow</text><rect class="key" x="588" y="80" width="250" height="54" rx="4"/><text x="713.0" y="104.0" text-anchor="middle" class="c">find the missing earlier step</text><text x="713.0" y="120.0" text-anchor="middle" class="c">before reteaching today’s</text><rect class="hd" x="14" y="144" width="176" height="54" rx="4"/><text x="102.0" y="168.0" text-anchor="middle" class="q">motivation and</text><text x="102.0" y="184.0" text-anchor="middle" class="q">interest</text><rect class="cell" x="200" y="144" width="190" height="54" rx="4"/><text x="295.0" y="168.0" text-anchor="middle" class="c">finishes fast and drifts,</text><text x="295.0" y="184.0" text-anchor="middle" class="c">or stops trying</text><rect class="cell" x="400" y="144" width="178" height="54" rx="4"/><text x="489.0" y="168.0" text-anchor="middle" class="c">that the pupil does not</text><text x="489.0" y="184.0" text-anchor="middle" class="c">care</text><rect class="key" x="588" y="144" width="250" height="54" rx="4"/><text x="713.0" y="168.0" text-anchor="middle" class="c">change what the task demands, up</text><text x="713.0" y="184.0" text-anchor="middle" class="c">or down</text><rect class="hd" x="14" y="208" width="176" height="54" rx="4"/><text x="102.0" y="232.0" text-anchor="middle" class="q">language and home</text><text x="102.0" y="248.0" text-anchor="middle" class="q">background</text><rect class="cell" x="200" y="208" width="190" height="54" rx="4"/><text x="295.0" y="232.0" text-anchor="middle" class="c">silent aloud but strong</text><text x="295.0" y="248.0" text-anchor="middle" class="c">on paper</text><rect class="cell" x="400" y="208" width="178" height="54" rx="4"/><text x="489.0" y="232.0" text-anchor="middle" class="c">that the pupil has not</text><text x="489.0" y="248.0" text-anchor="middle" class="c">understood</text><rect class="key" x="588" y="208" width="250" height="54" rx="4"/><text x="713.0" y="232.0" text-anchor="middle" class="c">let them show understanding in</text><text x="713.0" y="248.0" text-anchor="middle" class="c">another form first</text><text class="wm" x="840" y="282" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
