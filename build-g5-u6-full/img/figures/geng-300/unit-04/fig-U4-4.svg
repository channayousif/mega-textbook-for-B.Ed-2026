<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The writing process from draft to final version</title><desc id="d">Diagram showing the writing process from drafting to final version: plan, draft, revise, edit, final version, arranged in a cycle with forward arrows and a loop back from revise to draft.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">The writing process</text><rect class="panel-a" x="315" y="40" width="150" height="60" rx="8"/><text class="sh" x="390" y="66" text-anchor="middle">Plan</text><text class="small" x="390" y="86" text-anchor="middle">purpose and audience</text><rect class="panel-b" x="467" y="151" width="150" height="60" rx="8"/><text class="sh" x="542" y="177" text-anchor="middle">Draft</text><text class="small" x="542" y="197" text-anchor="middle">get ideas down</text><rect class="panel-c" x="409" y="329" width="150" height="60" rx="8"/><text class="sh" x="484" y="355" text-anchor="middle">Revise</text><text class="small" x="484" y="375" text-anchor="middle">rethink structure</text><rect class="panel-d" x="221" y="329" width="150" height="60" rx="8"/><text class="sh" x="296" y="355" text-anchor="middle">Edit</text><text class="small" x="296" y="375" text-anchor="middle">grammar, word choice</text><rect class="panel-a" x="163" y="151" width="150" height="60" rx="8"/><text class="sh" x="238" y="177" text-anchor="middle">Final version</text><text class="small" x="238" y="197" text-anchor="middle">polished and complete</text><line class="stroke" x1="465" y1="80" x2="490" y2="150" marker-end="url(#arrow)"/><line class="stroke" x1="510" y1="211" x2="490" y2="325" marker-end="url(#arrow)"/><line class="stroke" x1="409" y1="359" x2="375" y2="359" marker-end="url(#arrow)"/><line class="stroke" x1="221" y1="345" x2="210" y2="215" marker-end="url(#arrow)"/><line class="stroke" x1="238" y1="151" x2="316" y2="85" marker-end="url(#arrow)"/><path class="stroke" d="M 430,329 C 380,275 430,200 500,175" marker-end="url(#arrow)"/><text class="small" x="395" y="245" text-anchor="middle">loop back</text><text class="small" x="395" y="263" text-anchor="middle">to improve</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
