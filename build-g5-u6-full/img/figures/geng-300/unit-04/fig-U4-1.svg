<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Professional writing formats compared</title><desc id="d">Table comparing professional writing formats: email, memo, report and letter, each with structure and tone notes.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="34" text-anchor="middle">Professional writing formats compared</text><rect class="panel-a" x="0" y="50" width="150" height="58"/><text class="h" x="75" y="76" text-anchor="middle">Format</text><text class="small" x="75" y="96" text-anchor="middle">the document type</text><rect class="panel-b" x="150" y="50" width="310" height="58"/><text class="h" x="305" y="76" text-anchor="middle">Structure</text><text class="small" x="305" y="96" text-anchor="middle">the parts in order</text><rect class="panel-c" x="460" y="50" width="320" height="58"/><text class="h" x="620" y="76" text-anchor="middle">Tone notes</text><text class="small" x="620" y="96" text-anchor="middle">how it reads to the reader</text><rect class="panel-a" x="0" y="108" width="150" height="90"/><text class="sh" x="75" y="150" text-anchor="middle">Email</text><text class="small" x="75" y="172" text-anchor="middle">digital message</text><text class="small" x="75" y="190" text-anchor="middle">sent online</text><rect class="panel" x="150" y="108" width="310" height="90"/><text class="body" x="305" y="146" text-anchor="middle">subject line, greeting,</text><text class="body" x="305" y="166" text-anchor="middle">concise body, closing,</text><text class="body" x="305" y="186" text-anchor="middle">signature block</text><rect class="panel" x="460" y="108" width="320" height="90"/><text class="body" x="620" y="146" text-anchor="middle">direct, polite, brief;</text><text class="body" x="620" y="166" text-anchor="middle">action-oriented; adapts</text><text class="body" x="620" y="186" text-anchor="middle">to reader status</text><rect class="panel-a" x="0" y="198" width="150" height="90"/><text class="sh" x="75" y="240" text-anchor="middle">Memo</text><text class="small" x="75" y="262" text-anchor="middle">internal note</text><text class="small" x="75" y="280" text-anchor="middle">within an organisation</text><rect class="panel" x="150" y="198" width="310" height="90"/><text class="body" x="305" y="236" text-anchor="middle">To, From, Date, Subject</text><text class="body" x="305" y="256" text-anchor="middle">header; opening purpose;</text><text class="body" x="305" y="276" text-anchor="middle">discussion; action close</text><rect class="panel" x="460" y="198" width="320" height="90"/><text class="body" x="620" y="236" text-anchor="middle">factual, neutral;</text><text class="body" x="620" y="256" text-anchor="middle">no pleasantries;</text><text class="body" x="620" y="276" text-anchor="middle">colleague to colleague</text><rect class="panel-a" x="0" y="288" width="150" height="90"/><text class="sh" x="75" y="330" text-anchor="middle">Report</text><text class="small" x="75" y="352" text-anchor="middle">findings and</text><text class="small" x="75" y="370" text-anchor="middle">recommendations</text><rect class="panel" x="150" y="288" width="310" height="90"/><text class="body" x="305" y="326" text-anchor="middle">title page; contents;</text><text class="body" x="305" y="346" text-anchor="middle">introduction; findings;</text><text class="body" x="305" y="366" text-anchor="middle">conclusion; recommendations</text><rect class="panel" x="460" y="288" width="320" height="90"/><text class="body" x="620" y="326" text-anchor="middle">objective, formal;</text><text class="body" x="620" y="346" text-anchor="middle">evidence-led;</text><text class="body" x="620" y="366" text-anchor="middle">impersonal authority</text><rect class="panel-a" x="0" y="378" width="150" height="80"/><text class="sh" x="75" y="412" text-anchor="middle">Letter</text><text class="small" x="75" y="434" text-anchor="middle">formal written</text><text class="small" x="75" y="452" text-anchor="middle">correspondence</text><rect class="panel" x="150" y="378" width="310" height="80"/><text class="body" x="305" y="412" text-anchor="middle">sender address; date;</text><text class="body" x="305" y="432" text-anchor="middle">recipient address;</text><text class="body" x="305" y="452" text-anchor="middle">salutation; body; sign-off</text><rect class="panel" x="460" y="378" width="320" height="80"/><text class="body" x="620" y="412" text-anchor="middle">formal, respectful,</text><text class="body" x="620" y="432" text-anchor="middle">measured; courteous</text><text class="body" x="620" y="452" text-anchor="middle">closing for the occasion</text><line class="grid" x1="150" y1="50" x2="150" y2="458"/><line class="grid" x1="460" y1="50" x2="460" y2="458"/><line class="grid" x1="0" y1="108" x2="780" y2="108"/><line class="grid" x1="0" y1="198" x2="780" y2="198"/><line class="grid" x1="0" y1="288" x2="780" y2="288"/><line class="grid" x1="0" y1="378" x2="780" y2="378"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
