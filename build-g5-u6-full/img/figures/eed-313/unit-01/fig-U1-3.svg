<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Classroom floor plan showing management features</title><desc id="d">A classroom floor plan annotated with the physical features that carry management weight: sightlines from the teacher, traffic paths, the display wall and the resource corner.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .sight{stroke:var(--a2);stroke-width:1.5;fill:none;stroke-dasharray:4 3}</style><rect class="bg" x="0" y="0" width="780" height="470"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="panel" x="40" y="60" width="700" height="340"/><text class="h" x="390" y="40" text-anchor="middle">Classroom floor plan</text><rect class="panel-a" x="60" y="80" width="120" height="60"/><text class="body" x="120" y="115" text-anchor="middle">Display wall</text><circle cx="620" cy="110" r="20" class="panel-c"/><text class="body" x="620" y="115" text-anchor="middle">T</text><text class="small" x="620" y="155" text-anchor="middle">Teacher's usual</text><text class="small" x="620" y="172" text-anchor="middle">standing position</text><rect class="panel-b" x="640" y="320" width="80" height="60"/><text class="body" x="680" y="355" text-anchor="middle">Resource</text><text class="body" x="680" y="372" text-anchor="middle">corner</text><rect x="200" y="200" width="60" height="40" class="panel" rx="3"/><rect x="280" y="200" width="60" height="40" class="panel" rx="3"/><rect x="360" y="200" width="60" height="40" class="panel" rx="3"/><rect x="200" y="280" width="60" height="40" class="panel" rx="3"/><rect x="280" y="280" width="60" height="40" class="panel" rx="3"/><rect x="360" y="280" width="60" height="40" class="panel" rx="3"/><text class="small" x="310" y="265" text-anchor="middle">pupil benches</text><line class="sight" x1="620" y1="110" x2="230" y2="220"/><line class="sight" x1="620" y1="110" x2="310" y2="220"/><line class="sight" x1="620" y1="110" x2="390" y2="220"/><line class="sight" x1="620" y1="110" x2="230" y2="300"/><line class="sight" x1="620" y1="110" x2="310" y2="300"/><line class="sight" x1="620" y1="110" x2="390" y2="300"/><text class="small" x="450" y="305" text-anchor="middle">sightlines from teacher to each bench</text><path class="stroke" d="M120 320 C200 400, 500 400, 640 350" marker-end="url(#arrow)"/><text class="small" x="390" y="420" text-anchor="middle">main traffic path: door to resource corner to groups</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
