<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Low-resource environment audit</title><desc id="d">A low-resource environment audit table: what to look for, why it matters, what a Pakistani government-school teacher can change this week, and a first step, for each of physical displays, seating and the social environment.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} text{font-size:15px;fill:var(--ink)} .h{font-size:16px;font-weight:700;fill:var(--ink)} .body{font-size:14px;fill:var(--ink)} .small{font-size:13px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><rect class="bg" x="0" y="0" width="780" height="400"/><rect class="panel-a" x="0" y="0" width="180" height="60"/><text class="h" x="90" y="25" text-anchor="middle">What to look for</text><text class="small" x="90" y="45" text-anchor="middle">the feature</text><rect class="panel-b" x="180" y="0" width="180" height="60"/><text class="h" x="270" y="25" text-anchor="middle">Why it matters</text><text class="small" x="270" y="45" text-anchor="middle">the management weight</text><rect class="panel-c" x="360" y="0" width="220" height="60"/><text class="h" x="470" y="25" text-anchor="middle">What you can change</text><text class="small" x="470" y="45" text-anchor="middle">this week (no budget)</text><rect class="panel" x="580" y="0" width="200" height="60"/><text class="h" x="680" y="25" text-anchor="middle">A first step</text><text class="small" x="680" y="45" text-anchor="middle">try tomorrow</text><rect class="panel" x="0" y="60" width="180" height="110"/><text class="body" x="90" y="100" text-anchor="middle">Physical</text><text class="body" x="90" y="120" text-anchor="middle">displays</text><rect class="panel" x="0" y="170" width="180" height="110"/><text class="body" x="90" y="210" text-anchor="middle">Seating</text><rect class="panel" x="0" y="280" width="180" height="110"/><text class="body" x="90" y="315" text-anchor="middle">Social</text><text class="body" x="90" y="335" text-anchor="middle">environment</text><text class="body" x="270" y="100" text-anchor="middle">Signals what the</text><text class="body" x="270" y="120" text-anchor="middle">room values; makes</text><text class="body" x="270" y="140" text-anchor="middle">learning visible</text><text class="body" x="270" y="210" text-anchor="middle">Shapes who talks</text><text class="body" x="270" y="230" text-anchor="middle">to whom; enables</text><text class="body" x="270" y="250" text-anchor="middle">or blocks group work</text><text class="body" x="270" y="315" text-anchor="middle">Determines whether</text><text class="body" x="270" y="335" text-anchor="middle">every pupil is safe</text><text class="body" x="270" y="355" text-anchor="middle">to be wrong</text><text class="body" x="470" y="100" text-anchor="middle">Use scrap paper,</text><text class="body" x="470" y="120" text-anchor="middle">old exam sheets;</text><text class="body" x="470" y="140" text-anchor="middle">pupil-made work</text><text class="body" x="470" y="210" text-anchor="middle">Turn benches to</text><text class="body" x="470" y="230" text-anchor="middle">face each other</text><text class="body" x="470" y="250" text-anchor="middle">for discussion days</text><text class="body" x="470" y="315" text-anchor="middle">State and practise</text><text class="body" x="470" y="335" text-anchor="middle">one norm: a wrong</text><text class="body" x="470" y="355" text-anchor="middle">answer is useful</text><text class="body" x="680" y="100" text-anchor="middle">Pin one piece of</text><text class="body" x="680" y="120" text-anchor="middle">pupil work to</text><text class="body" x="680" y="140" text-anchor="middle">the wall today</text><text class="body" x="680" y="210" text-anchor="middle">Try clusters for</text><text class="body" x="680" y="230" text-anchor="middle">one activity this</text><text class="body" x="680" y="250" text-anchor="middle">week</text><text class="body" x="680" y="315" text-anchor="middle">Name the norm</text><text class="body" x="680" y="335" text-anchor="middle">and model it in</text><text class="body" x="680" y="355" text-anchor="middle">the first session</text><line class="grid" x1="180" y1="0" x2="180" y2="390"/><line class="grid" x1="360" y1="0" x2="360" y2="390"/><line class="grid" x1="580" y1="0" x2="580" y2="390"/><line class="grid" x1="0" y1="60" x2="780" y2="60"/><line class="grid" x1="0" y1="170" x2="780" y2="170"/><line class="grid" x1="0" y1="280" x2="780" y2="280"/><text class="wm" x="768" y="390" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
