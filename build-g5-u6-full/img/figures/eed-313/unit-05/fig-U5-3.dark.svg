<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The presenting-and-improving cycle</title><desc id="d">Flowchart of the presenting-and-improving cycle: present the plan, peers give structured feedback using the protocol, the author identifies the most useful feedback, revises the plan, and presents the revision.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="35" text-anchor="middle">The presenting-and-improving cycle</text><rect class="panel-a" x="40" y="70" width="700" height="70" rx="6"/><text class="sh" x="390" y="100" text-anchor="middle">1. Present the plan</text><text class="small" x="390" y="122" text-anchor="middle">philosophy, constraint, four layers</text><line class="stroke" x1="390" y1="140" x2="390" y2="168" marker-end="url(#arrow)"/><rect class="panel-b" x="40" y="170" width="700" height="70" rx="6"/><text class="sh" x="390" y="200" text-anchor="middle">2. Peers give structured feedback</text><text class="small" x="390" y="222" text-anchor="middle">clarity, consistency, coverage</text><line class="stroke" x1="390" y1="240" x2="390" y2="268" marker-end="url(#arrow)"/><rect class="panel-c" x="40" y="270" width="700" height="70" rx="6"/><text class="sh" x="390" y="300" text-anchor="middle">3. Identify the most useful feedback</text><text class="small" x="390" y="322" text-anchor="middle">listen, ask, decide what to act on</text><line class="stroke" x1="390" y1="340" x2="390" y2="368" marker-end="url(#arrow)"/><rect class="panel-d" x="40" y="370" width="340" height="70" rx="6"/><text class="sh" x="210" y="400" text-anchor="middle">4. Revise the plan</text><text class="small" x="210" y="422" text-anchor="middle">name the feedback, show the change</text><rect class="panel-a" x="400" y="370" width="340" height="70" rx="6"/><text class="sh" x="570" y="400" text-anchor="middle">5. Present the revision</text><text class="small" x="570" y="422" text-anchor="middle">explain the reasoning</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
