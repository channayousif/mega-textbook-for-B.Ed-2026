<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">One objective differentiated three ways</title><desc id="d">Diagram showing one curriculum objective differentiated three ways for a mixed-ability class: a core task for all, a scaffolded version for pupils who need support, and an extended version for pupils who are ready.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .ink{fill:var(--ink)} .stroke{stroke:var(--ink);stroke-width:2.5;fill:none} .stroke-a{stroke:var(--a1);stroke-width:2;fill:none} .stroke-b{stroke:var(--a3);stroke-width:2;fill:none} .muted{fill:var(--muted)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} .panel-a{fill:var(--a1-fill);stroke:var(--a1);stroke-width:2} .panel-b{fill:var(--a2-fill);stroke:var(--a2);stroke-width:2} .panel-c{fill:var(--a3-fill);stroke:var(--a3);stroke-width:2} .panel-d{fill:var(--a4-fill);stroke:var(--a4);stroke-width:2} text{font-size:14px;fill:var(--ink)} .h{font-size:15px;font-weight:700;fill:var(--ink)} .sh{font-size:14px;font-weight:600;fill:var(--ink)} .body{font-size:13px;fill:var(--ink)} .small{font-size:12px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px} .ah{fill:var(--ink)} .grid{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:0.25}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="260" y="30" width="260" height="100" rx="8"/><text class="h" x="390" y="60" text-anchor="middle">The learning target is the same</text><text class="body" x="390" y="85" text-anchor="middle">Class 4 mathematics: pupils will be able to</text><text class="body" x="390" y="105" text-anchor="middle">add two-digit numbers with carrying</text><rect class="panel-b" x="260" y="190" width="260" height="90" rx="8"/><text class="h" x="390" y="220" text-anchor="middle">Core task - for all</text><text class="body" x="390" y="245" text-anchor="middle">every pupil works on two-digit addition</text><text class="body" x="390" y="265" text-anchor="middle">with the same target</text><line class="stroke" x1="390" y1="130" x2="390" y2="188" marker-end="url(#arrow)"/><rect class="panel-c" x="30" y="360" width="300" height="90" rx="8"/><text class="h" x="180" y="390" text-anchor="middle">Scaffolded version</text><text class="body" x="180" y="415" text-anchor="middle">number line and a worked example</text><text class="small" x="180" y="440" text-anchor="middle">for pupils who need support</text><rect class="panel-d" x="450" y="360" width="300" height="90" rx="8"/><text class="h" x="600" y="390" text-anchor="middle">Extended version</text><text class="body" x="600" y="415" text-anchor="middle">word problem with extra information</text><text class="small" x="600" y="440" text-anchor="middle">for pupils who are ready</text><line class="stroke-a" x1="310" y1="280" x2="180" y2="358" marker-end="url(#arrow)"/><line class="stroke-b" x1="470" y1="280" x2="600" y2="358" marker-end="url(#arrow)"/><text class="small" x="390" y="330" text-anchor="middle">same target - different route</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
