<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of a real measurement task</title><desc id="d">Flowchart of a real measurement task: choose the unit, measure, compute, then check reasonableness, looping back if the check fails.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">A real measurement task in four moves</text><rect class="panel-a" x="30" y="140" width="160" height="120" rx="10"/><text class="sh" x="110" y="176" text-anchor="middle">1. Choose</text><text class="small" x="110" y="200" text-anchor="middle">what does the task buy:</text><text class="small" x="110" y="218" text-anchor="middle">boundary, cover or fill?</text><rect class="panel-b" x="215" y="140" width="160" height="120" rx="10"/><text class="sh" x="295" y="176" text-anchor="middle">2. Measure</text><text class="small" x="295" y="200" text-anchor="middle">which lengths,</text><text class="small" x="295" y="218" text-anchor="middle">with what tool</text><rect class="panel-c" x="400" y="140" width="160" height="120" rx="10"/><text class="sh" x="480" y="176" text-anchor="middle">3. Compute</text><text class="small" x="480" y="200" text-anchor="middle">which formula,</text><text class="small" x="480" y="218" text-anchor="middle">units attached</text><rect class="panel" x="585" y="140" width="160" height="120" rx="10"/><text class="sh" x="665" y="176" text-anchor="middle">4. Check</text><text class="small" x="665" y="200" text-anchor="middle">round-number estimate:</text><text class="small" x="665" y="218" text-anchor="middle">does the answer fit?</text><line class="stroke" x1="190" y1="200" x2="209" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="375" y1="200" x2="394" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="560" y1="200" x2="579" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M 745 260 L 745 330 L 110 330 L 110 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="427" y="322" text-anchor="middle">if the check fails, return to the move the failure names</text><text class="body" x="390" y="392" text-anchor="middle">Written out, the four moves are the report a colleague can re-check.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
