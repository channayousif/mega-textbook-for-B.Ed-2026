<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ڈسپلے کے انتخاب کا خاکہ</title><desc id="d">ڈسپلے کے انتخاب کا خاکہ: اقسام کا موازنہ بار چارٹ کی طرف، ایک پورے کے حصے پائی چارٹ کی طرف، اور وقت کے ساتھ تبدیلی لکیر گراف کی طرف، ہر ایک کے ساتھ اسکول کی مثال۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="50" text-anchor="middle">ڈسپلے کا انتخاب</text><rect class="panel" x="230" y="80" width="320" height="60" rx="10"/><text class="sh" x="390" y="106" text-anchor="middle">قاری کو کیا موازنہ کرنا ہے؟</text><text class="small" x="390" y="128" text-anchor="middle">سوال تصویر چنتا ہے</text><line class="stroke" x1="480" y1="140" x2="630" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="140" x2="390" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="300" y1="140" x2="150" y2="200" marker-end="url(#arrow)"/><rect class="panel-a" x="520" y="204" width="220" height="200" rx="10"/><text class="sh" x="630" y="232" text-anchor="middle">اقسام کا موازنہ</text><rect class="stroke" x="686" y="250" width="14" height="80" fill="none"/><rect class="stroke" x="656" y="280" width="14" height="50" fill="none"/><rect class="stroke" x="626" y="300" width="14" height="30" fill="none"/><line class="stroke" x1="710" y1="330" x2="610" y2="330" stroke-width="1.5"/><text class="small" x="630" y="356" text-anchor="middle">بار چارٹ</text><text class="small" x="630" y="378" text-anchor="middle">"کون سا سفر کا طریقہ سب سے عام ہے؟"</text><rect class="panel-b" x="280" y="204" width="220" height="200" rx="10"/><text class="sh" x="390" y="232" text-anchor="middle">ایک پورے کے حصے</text><circle class="stroke" cx="390" cy="290" r="40" fill="none"/><line class="stroke" x1="390" y1="290" x2="350" y2="290" stroke-width="1.5"/><line class="stroke" x1="390" y1="290" x2="425" y2="315" stroke-width="1.5"/><text class="small" x="390" y="356" text-anchor="middle">پائی چارٹ</text><text class="small" x="390" y="378" text-anchor="middle">"کلاس کا کتنا حصہ پیدل چلتا ہے؟"</text><rect class="panel-c" x="40" y="204" width="220" height="200" rx="10"/><text class="sh" x="150" y="232" text-anchor="middle">وقت کے ساتھ تبدیلی</text><polyline class="stroke" points="220,330 190,310 160,320 130,280 100,295 70,260" stroke-width="2"/><line class="stroke" x1="230" y1="335" x2="60" y2="335" stroke-width="1.5"/><text class="small" x="150" y="356" text-anchor="middle">لکیر گراف</text><text class="small" x="150" y="378" text-anchor="middle">"حاضری کیسے بدلی؟"</text><text class="body" x="390" y="440" text-anchor="middle">ڈسپلے وہ جملہ ہے جو معطیات بولتے ہیں - سوال کے لیے چنیں، سجاوٹ کے لیے نہیں۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
