<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Concept map with quantitative reasoning at the centre and three branches</title><desc id="d">Concept map with quantitative reasoning at the centre and three branches: confidence with numbers, reasoning in context, and communicating with mathematics, each with a school example.</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } .yes { fill: var(--ink); } .no { fill: var(--muted); } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel-a" x="40" y="62" width="210" height="96" rx="10"/><text class="sh" x="145" y="90" text-anchor="middle">Confidence with numbers</text><text class="small" x="145" y="112" text-anchor="middle">reading a marksheet,</text><text class="small" x="145" y="130" text-anchor="middle">comparing prices</text><rect class="panel-b" x="530" y="62" width="210" height="96" rx="10"/><text class="sh" x="635" y="90" text-anchor="middle">Reasoning in context</text><text class="small" x="635" y="112" text-anchor="middle">a school budget,</text><text class="small" x="635" y="130" text-anchor="middle">a class survey</text><rect class="panel-c" x="285" y="360" width="210" height="92" rx="10"/><text class="sh" x="390" y="386" text-anchor="middle">Communicating with</text><text class="sh" x="390" y="404" text-anchor="middle">mathematics</text><text class="small" x="390" y="426" text-anchor="middle">explaining a result to a parent</text><line class="stroke" x1="215" y1="150" x2="300" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="565" y1="150" x2="480" y2="205" marker-end="url(#arrow)"/><line class="stroke" x1="390" y1="360" x2="390" y2="290" marker-end="url(#arrow)"/><ellipse class="panel" cx="390" cy="235" rx="118" ry="52"/><text class="h" x="390" y="228" text-anchor="middle">Quantitative</text><text class="h" x="390" y="250" text-anchor="middle">reasoning</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
