<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of the four operations with fractions and decimals</title><desc id="d">Table of the four operations with one worked metre-example each for fractions and for decimals.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="160" y="82" text-anchor="middle">Operation</text><text class="h" x="440" y="82" text-anchor="middle">With fractions</text><text class="h" x="650" y="82" text-anchor="middle">With decimals</text><line class="grid" x1="290" y1="56" x2="290" y2="416"/><line class="grid" x1="560" y1="56" x2="560" y2="416"/><line class="grid" x1="30" y1="160" x2="760" y2="160"/><line class="grid" x1="30" y1="264" x2="760" y2="264"/><line class="grid" x1="30" y1="368" x2="760" y2="368"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="sh" x="160" y="116" text-anchor="middle">Addition</text><text class="body" x="440" y="116" text-anchor="middle">1/2 m + 1/4 m = 3/4 m</text><text class="body" x="650" y="116" text-anchor="middle">0.5 + 0.25 = 0.75</text><text class="sh" x="160" y="220" text-anchor="middle">Subtraction</text><text class="body" x="440" y="220" text-anchor="middle">1 m - 1/4 m = 3/4 m</text><text class="body" x="650" y="220" text-anchor="middle">1.00 - 0.25 = 0.75</text><text class="sh" x="160" y="324" text-anchor="middle">Multiplication</text><text class="body" x="440" y="324" text-anchor="middle">1/2 of 1/2 m = 1/4 m</text><text class="body" x="650" y="324" text-anchor="middle">0.5 x 0.5 = 0.25</text><text class="sh" x="160" y="404" text-anchor="middle">Division</text><text class="body" x="440" y="404" text-anchor="middle">1/2 m split by 1/4 m = 2 lengths</text><text class="body" x="650" y="404" text-anchor="middle">0.50 / 0.25 = 2</text><text class="small" x="390" y="440" text-anchor="middle">Same metre of cloth, two notations: every fraction has a decimal name.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
