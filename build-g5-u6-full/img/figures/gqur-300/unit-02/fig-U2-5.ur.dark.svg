<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">مربع اعداد واقعی مربع ہیں</title><desc id="d">مربع اعداد 1 سے 25 بڑھتے ہوئے ٹائل گرڈوں کے طور پر، اوپر ضلع 1 سے 5 اور نیچے رقبہ 1 سے 25، اور مربع اور جذر کے نام سے جوڑی تیر۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .stroke-a{ stroke: var(--a1); stroke-width: 2; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .tile { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 1.2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">مربع اعداد واقعی مربع ہیں</text><text class="small" x="669" y="150" text-anchor="middle">ضلع 1</text><rect class="tile" x="658" y="200" width="22" height="22"/><text class="sh" x="669" y="270" text-anchor="middle">1</text><text class="small" x="531" y="150" text-anchor="middle">ضلع 2</text><rect class="tile" x="531" y="178" width="22" height="22"/><rect class="tile" x="509" y="178" width="22" height="22"/><rect class="tile" x="531