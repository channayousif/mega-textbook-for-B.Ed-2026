<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Table of five questions to ask of a numeric claim</title><desc id="d">Table of five questions to ask of a numeric claim in media, each with an advertisement example.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="30" y="56" width="730" height="40"/><text class="h" x="220" y="82" text-anchor="middle">The question to ask</text><text class="h" x="540" y="82" text-anchor="middle">Advertisement example</text><line class="grid" x1="410" y1="56" x2="410" y2="416"/><line class="grid" x1="30" y1="152" x2="760" y2="152"/><line class="grid" x1="30" y1="216" x2="760" y2="216"/><line class="grid" x1="30" y1="280" x2="760" y2="280"/><line class="grid" x1="30" y1="344" x2="760" y2="344"/><rect class="stroke" x="30" y="56" width="730" height="360" fill="none"/><text class="body" x="42" y="108">1. What is the source?</text><text class="small" x="422" y="100">who counted, and who paid for the counting?</text><text class="small" x="422" y="120">"a survey run by the brand itself"</text><text class="body" x="42" y="184">2. What is the base?</text><text class="small" x="422" y="176">88 percent of how many, chosen how?</text><text class="small" x="422" y="196">"of 50 dentists at one conference"</text><text class="body" x="42" y="248">3. What is the comparison?</text><text class="small" x="422" y="248">"fastest-growing" - since when, against whom?</text><text class="body" x="42" y="312">4. What is the unit?</text><text class="small" x="422" y="312">"only 2,000 a month" - for how many months?</text><text class="body" x="42" y="376">5. What is missing?</text><text class="small" x="422" y="368">"50 percent more fruit" - more than what?</text><text class="small" x="422" y="388">the base the claim quietly omits</text><text class="small" x="390" y="440" text-anchor="middle">A truthful claim survives the questions; a manufactured one does not.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
