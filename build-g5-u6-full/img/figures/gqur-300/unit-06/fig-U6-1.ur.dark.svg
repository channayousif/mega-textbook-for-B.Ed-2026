<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">ماہانہ بجٹ کے پانچ حصوں کا فلو چارٹ</title><desc id="d">ماہانہ بجٹ بنانے کا فلو چارٹ: آمدنی، مقررہ اخراجات، بچت، بدلنے والے اخراجات، جائزہ، اور اگلے مہینے کے منصوبے کی طرف واپسی۔</desc><style> :root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">ماہانہ بجٹ کے پانچ حصے</text><rect class="panel-a" x="620" y="140" width="130" height="120" rx="10"/><text class="sh" x="685" y="176" text-anchor="middle">1. آمدنی</text><text class="small" x="685" y="200" text-anchor="middle">اس مہینے آنے</text><text class="small" x="685" y="218" text-anchor="middle">والا سب پیسہ</text><rect class="panel-b" x="465" y="140" width="130" height="120" rx="10"/><text class="sh" x="530" y="170" text-anchor="middle">2. مقررہ</text><text class="sh" x="530" y="188" text-anchor="middle">اخراجات</text><text class="small" x="530" y="210" text-anchor="middle">کرایہ، قسطیں:</text><text class="small" x="530" y="228" text-anchor="middle">یہ نہیں بدلتے</text><rect class="panel-c" x="310" y="140" width="130" height="120" rx="10"/><text class="sh" x="375" y="176" text-anchor="middle">3. بچت</text><text class="small" x="375" y="200" text-anchor="middle">خرچ سے پہلے</text><text class="small" x="375" y="218" text-anchor="middle">رکھیں، بعد</text><text class="small" x="375" y="236" text-anchor="middle">میں نہیں</text><rect class="panel" x="155" y="140" width="130" height="120" rx="10"/><text class="sh" x="220" y="170" text-anchor="middle">4. بدلنے والے</text><text class="sh" x="220" y="188" text-anchor="middle">اخراجات</text><text class="small" x="220" y="210" text-anchor="middle">کھانا، سفر:</text><text class="small" x="220" y="228" text-anchor="middle">جو خرچ کے لیے بچا ہے</text><rect class="panel-a" x="10" y="140" width="120" height="120" rx="10"/><text class="sh" x="70" y="176" text-anchor="middle">5. جائزہ</text><text class="small" x="70" y="200" text-anchor="middle">منصوبہ بمقابلہ</text><text class="small" x="70" y="218" text-anchor="middle">حقیقت، مہینے کے آخر میں</text><line class="stroke" x1="620" y1="200" x2="601" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="465" y1="200" x2="446" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="310" y1="200" x2="291" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="155" y1="200" x2="136" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M70 260 L70 330 L685 330 L685 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="378" y="322" text-anchor="middle">جائزہ اگلے مہینے کے منصوبے کو کھلاتا ہے</text><text class="body" x="390" y="392" text-anchor="middle">بچت خرچ سے پہلے: خرچ کے بعد جو بچتا ہے وہ عام طور پر کچھ نہیں ہوتا۔</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
