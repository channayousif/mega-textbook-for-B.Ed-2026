<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of two bar charts of the same data</title><desc id="d">Diagram of two bar charts of the same survey data: the advertised version with an axis starting at 80 exaggerates a 6-point difference, the honest version with an axis from zero shows it nearly vanishing.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .grid { stroke: var(--ink); stroke-width: 1.5; fill: none; opacity: 0.25; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">Same data, two stories</text><rect class="panel-a" x="40" y="80" width="330" height="300" rx="10"/><text class="sh" x="205" y="108" text-anchor="middle">As advertised (axis starts at 80)</text><line class="stroke" x1="90" y1="330" x2="330" y2="330"/><rect class="panel" x="130" y="258" width="60" height="72"/><rect class="panel" x="230" y="312" width="60" height="18"/><text class="small" x="160" y="250" text-anchor="middle">ours 88</text><text class="small" x="260" y="304" text-anchor="middle">rival 82</text><text class="small" x="205" y="362" text-anchor="middle">a towering victory - from a 6-point gap</text><rect class="panel-b" x="410" y="80" width="330" height="300" rx="10"/><text class="sh" x="575" y="108" text-anchor="middle">The honest version (axis from 0)</text><line class="stroke" x1="460" y1="330" x2="700" y2="330"/><rect class="panel" x="500" y="172" width="60" height="158"/><rect class="panel" x="600" y="182" width="60" height="148"/><text class="small" x="530" y="164" text-anchor="middle">ours 88</text><text class="small" x="630" y="174" text-anchor="middle">rival 82</text><text class="small" x="575" y="362" text-anchor="middle">nearly the same height - the honest picture</text><text class="body" x="390" y="416" text-anchor="middle">Both charts are arithmetically correct; only one is honest about the difference.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
