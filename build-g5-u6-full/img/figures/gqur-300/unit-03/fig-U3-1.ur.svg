<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', system-ui, sans-serif"><title id="t">بڑھتے ہوئے تیلیوں کے مثلثوں کے نمونے کا خاکہ</title><desc id="d">بڑھتے ہوئے تیلیوں کے مثلثوں کا نمونہ، مراحل 1 سے 4 جو 3، 5، 7 اور 9 تیلیاں لیتے ہیں، ساتھ لکھا قاعدہ: دو ضرب مثلثوں کی تعداد جمع ایک۔</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .stick { stroke: var(--ink); stroke-width: 3; } text { font-size: 14px; fill: var(--ink); } .h { font-size: 15px; font-weight: 700; fill: var(--ink); } .sh { font-size: 13px; font-weight: 600; fill: var(--ink); } .body { font-size: 13px; fill: var(--ink); } .small { font-size: 12px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">ایک مثلث، پھر مزید: نمونہ اور اس کا قاعدہ</text><polygon class="stick" points="685,140 720,200 650,200" fill="none"/><text class="sh" x="685" y="232" text-anchor="middle">1 مثلث</text><text class="small" x="685" y="252" text-anchor="middle">3 تیلیاں</text><polygon class="stick" points="525,140 560,200 490,200" fill="none"/><polygon class="stick" points="455,140 490,200 420,200" fill="none"/><text class="sh" x="490" y="232" text-anchor="middle">2 مثلث</text><text class="small" x="490" y="252" text-anchor="middle">5 تیلیاں</text><polygon class="stick" points="305,140 340,200 270,200" fill="none"/><polygon class="stick" points="235,140 270,200 200,200" fill="none"/><polygon class="stick" points="165,140 200,200 130,200" fill="none"/><text class="sh" x="235" y="232" text-anchor="middle">3 مثلث</text><text class="small" x="235" y="252" text-anchor="middle">7 تیلیاں</text><polygon class="stick" points="595,320 630,380 560,380" fill="none"/><polygon class="stick" points="525,320 560,380 490,380" fill="none"/><polygon class="stick" points="455,320 490,380 420,380" fill="none"/><polygon class="stick" points="385,320 420,380 350,380" fill="none"/><text class="sh" x="490" y="412" text-anchor="middle">4 مثلث</text><text class="small" x="490" y="432" text-anchor="middle">9 تیلیاں</text><rect class="panel" x="40" y="300" width="220" height="120" rx="10"/><text class="sh" x="150" y="330" text-anchor="middle">قاعدہ</text><text class="body" x="150" y="358" text-anchor="middle">تیلیاں = 2 ضرب مثلث + 1</text><text class="small" x="150" y="384" text-anchor="middle">ہر نیا مثلث ایک طرف شیئر کرتا ہے،</text><text class="small" x="150" y="402" text-anchor="middle">اس لیے صرف 2 تیلیاں جوڑتا ہے</text><text class="wm" x="12" y="460" text-anchor="start" aria-hidden="true">textbook.com.pk</text></svg>
