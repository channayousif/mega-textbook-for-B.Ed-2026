<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Diagram of a growing matchstick triangle pattern</title><desc id="d">Diagram of a growing matchstick triangle pattern, stages 1 to 4 using 3, 5, 7 and 9 sticks, with the rule two times the number of triangles plus one written beside.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .stick { stroke: var(--ink); stroke-width: 3; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } </style><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="48" text-anchor="middle">One triangle, then more: the pattern and its rule</text><polygon class="stick" points="95,140 60,200 130,200" fill="none"/><text class="sh" x="95" y="232" text-anchor="middle">1 triangle</text><text class="small" x="95" y="252" text-anchor="middle">3 sticks</text><polygon class="stick" points="255,140 220,200 290,200" fill="none"/><polygon class="stick" points="325,140 290,200 360,200" fill="none"/><text class="sh" x="290" y="232" text-anchor="middle">2 triangles</text><text class="small" x="290" y="252" text-anchor="middle">5 sticks</text><polygon class="stick" points="475,140 440,200 510,200" fill="none"/><polygon class="stick" points="545,140 510,200 580,200" fill="none"/><polygon class="stick" points="615,140 580,200 650,200" fill="none"/><text class="sh" x="545" y="232" text-anchor="middle">3 triangles</text><text class="small" x="545" y="252" text-anchor="middle">7 sticks</text><polygon class="stick" points="185,320 150,380 220,380" fill="none"/><polygon class="stick" points="255,320 220,380 290,380" fill="none"/><polygon class="stick" points="325,320 290,380 360,380" fill="none"/><polygon class="stick" points="395,320 360,380 430,380" fill="none"/><text class="sh" x="290" y="412" text-anchor="middle">4 triangles</text><text class="small" x="290" y="432" text-anchor="middle">9 sticks</text><rect class="panel" x="520" y="300" width="220" height="120" rx="10"/><text class="sh" x="630" y="330" text-anchor="middle">The rule</text><text class="body" x="630" y="358" text-anchor="middle">sticks = 2 x triangles + 1</text><text class="small" x="630" y="384" text-anchor="middle">each new triangle shares one side,</text><text class="small" x="630" y="402" text-anchor="middle">so it adds only 2 sticks</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
