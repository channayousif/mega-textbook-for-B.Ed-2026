<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Flowchart of solving a linear equation</title><desc id="d">Flowchart of solving a linear equation: simplify, isolate the variable term, isolate the variable, then check by substitution, looping back if the check fails.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .ink { fill: var(--ink); } .stroke { stroke: var(--ink); stroke-width: 2.5; fill: none; } .muted { fill: var(--muted); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2; } .panel-a { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 2; } .panel-b { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2; } .panel-c { fill: var(--a3-fill); stroke: var(--a3); stroke-width: 2; } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .sh { font-size: 14px; font-weight: 600; fill: var(--ink); } .body { font-size: 14px; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--ink); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="60" text-anchor="middle">Solving a linear equation: the balance method</text><text class="body" x="390" y="88" text-anchor="middle">Example thread: 60 + 15k = 195</text><rect class="panel-a" x="30" y="140" width="165" height="120" rx="10"/><text class="sh" x="112" y="172" text-anchor="middle">1. Simplify</text><text class="small" x="112" y="196" text-anchor="middle">clear brackets, join</text><text class="small" x="112" y="214" text-anchor="middle">like terms on each side</text><text class="small" x="112" y="240" text-anchor="middle">nothing to do here</text><rect class="panel-b" x="215" y="140" width="165" height="120" rx="10"/><text class="sh" x="297" y="172" text-anchor="middle">2. Isolate the</text><text class="sh" x="297" y="190" text-anchor="middle">variable term</text><text class="small" x="297" y="214" text-anchor="middle">subtract 60 both sides</text><text class="small" x="297" y="232" text-anchor="middle">15k = 135</text><rect class="panel-c" x="400" y="140" width="165" height="120" rx="10"/><text class="sh" x="482" y="172" text-anchor="middle">3. Isolate the</text><text class="sh" x="482" y="190" text-anchor="middle">variable</text><text class="small" x="482" y="214" text-anchor="middle">divide both sides by 15</text><text class="small" x="482" y="232" text-anchor="middle">k = 9</text><rect class="panel" x="585" y="140" width="165" height="120" rx="10"/><text class="sh" x="667" y="172" text-anchor="middle">4. Check</text><text class="small" x="667" y="196" text-anchor="middle">substitute into the</text><text class="small" x="667" y="214" text-anchor="middle">original equation:</text><text class="small" x="667" y="240" text-anchor="middle">60 + 15 x 9 = 195 true</text><line class="stroke" x1="195" y1="200" x2="209" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="380" y1="200" x2="394" y2="200" marker-end="url(#arrow)"/><line class="stroke" x1="565" y1="200" x2="579" y2="200" marker-end="url(#arrow)"/><path class="stroke" d="M 745 260 L 745 330 L 112 330 L 112 268" fill="none" marker-end="url(#arrow)"/><text class="small" x="428" y="322" text-anchor="middle">a failed check sends you back to step 1</text><text class="body" x="390" y="392" text-anchor="middle">Whatever you do, do it to both sides: that is the whole method.</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
