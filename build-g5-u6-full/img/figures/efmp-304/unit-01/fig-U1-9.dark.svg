<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Characteristics of a critical thinker against their opposites</title><desc id="d">Table comparing each characteristic of a critical thinker against its opposite, with a one-line classroom marker for each.</desc><style>:root{--bg:#1b1b1d;--panel:#24282a;--ink:#e7ece9;--muted:#9aa7a2;--line:#38c6a4;--a1:#38c6a4;--a1-fill:#1f302c;--a2:#2f91d6;--a2-fill:#1e2931;--a3:#f0bd9f;--a3-fill:#33251c;--a4:#c387cd;--a4-fill:#2c212e;--wm:#6b7671} .bg{fill:var(--bg)} text{font-size:12px;fill:var(--ink)} .h{font-size:12px;font-weight:700} .m{font-size:11px;fill:var(--muted)} .wm{fill:var(--wm);font-size:11px}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect x="16" y="16" width="170" height="50" fill="var(--a1-fill)"/><rect x="186" y="16" width="310" height="50" fill="var(--a1-fill)"/><rect x="496" y="16" width="268" height="50" fill="var(--a1-fill)"/><text class="h" x="101" y="40" text-anchor="middle">Critical thinker</text><text class="h" x="341" y="32" text-anchor="middle">What that looks like</text><text class="h" x="341" y="50" text-anchor="middle">in a classroom</text><text class="h" x="630" y="40" text-anchor="middle">The opposite</text><line x1="16" y1="66" x2="764" y2="66" stroke="var(--ink)" stroke-width="2"/><line x1="186" y1="16" x2="186" y2="454" stroke="var(--ink)" stroke-width="1.5"/><line x1="496" y1="16" x2="496" y2="454" stroke="var(--ink)" stroke-width="1.5"/><text class="h" x="101" y="100">open to evidence</text><text x="196" y="94">the data shows my method</text><text x="196" y="110">is not working - I will change it</text><text x="506" y="94">I have always done it this</text><text x="506" y="110">way, so it must be right</text><line x1="16" y1="124" x2="764" y2="124" stroke="var(--ink)" stroke-width="1"/><text class="h" x="101" y="158">fair to opposing views</text><text x="196" y="152">let me hear the strongest</text><text x="196" y="168">version of the other side first</text><text x="506" y="152">I only listen to people</text><text x="506" y="168">who already agree with me</text><line x1="16" y1="182" x2="764" y2="182" stroke="var(--ink)" stroke-width="1"/><text class="h" x="101" y="216">precise in claims</text><text x="196" y="210">punctuation errors fell</text><text x="196" y="226">by a quarter over one term</text><text x="506" y="210">results will improve</text><text x="506" y="226">a lot next year</text><line x1="16" y1="240" x2="764" y2="240" stroke="var(--ink)" stroke-width="1"/><text class="h" x="101" y="274">willing to say I do not know</text><text x="196" y="268">I have no evidence either</text><text x="196" y="284">way - let us look first</text><text x="506" y="268">I am sure I am right</text><text x="506" y="284">even though I have not checked</text><line x1="16" y1="302" x2="764" y2="302" stroke="var(--ink)" stroke-width="1"/><text class="h" x="101" y="336">questions before deciding</text><text x="196" y="330">what is the evidence and</text><text x="196" y="346">does it fit my pupils</text><text x="506" y="330">I will adopt it because</text><text x="506" y="346">the speaker sounded confident</text><line x1="16" y1="360" x2="764" y2="360" stroke="var(--ink)" stroke-width="1"/><text class="h" x="101" y="394">revises with new facts</text><text x="196" y="388">the new assessment changes</text><text x="196" y="404">what I thought I knew</text><text x="506" y="388">I ignore anything that does</text><text x="506" y="404">not fit my first view</text><rect x="16" y="66" width="748" height="388" fill="none" stroke="var(--ink)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>