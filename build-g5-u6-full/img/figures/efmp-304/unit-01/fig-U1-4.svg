<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">The same decision made twice: by habit and against the standards</title><desc id="d">A diagram showing the same teaching decision made twice, once by habit and once against the standards, with the two outcomes side by side.</desc><style>:root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--ink);stroke-width:2} text{font-size:13px;fill:var(--ink);text-anchor:middle} .h{font-size:14px;font-weight:700} .m{font-size:12px;fill:var(--muted);text-anchor:middle} .wm{fill:var(--wm);font-size:11px} .bad{stroke:var(--a3);fill:var(--a3-fill)} .good{stroke:var(--a1);fill:var(--a1-fill)}</style><rect class="bg" x="0" y="0" width="780" height="470"/><rect class="panel" x="16" y="16" width="364" height="60" rx="6"/><text class="h" x="198" y="52">Decide by habit</text><rect class="panel" x="400" y="16" width="364" height="60" rx="6"/><text class="h" x="582" y="52">Decide against the standards</text><rect class="bad" x="30" y="100" width="340" height="100" rx="6"/><text class="h" x="200" y="135" fill="var(--a3)">1. Hear the claim</text><text x="200" y="160">"activity-based learning</text><text x="200" y="178">is better"</text><text class="m" x="200" y="194">accept because it sounds right</text><rect class="good" x="416" y="100" width="340" height="100" rx="6"/><text class="h" x="586" y="135" fill="var(--a1)">1. Hear the claim</text><text x="586" y="160">"activity-based learning</text><text x="586" y="178">is better"</text><text class="m" x="586" y="194">ask: what is the evidence?</text><rect class="bad" x="30" y="220" width="340" height="100" rx="6"/><text class="h" x="200" y="255" fill="var(--a3)">2. Decide at once</text><text x="200" y="280">adopt it because the</text><text x="200" y="298">speaker was confident</text><text class="m" x="200" y="314">no further check</text><rect class="good" x="416" y="220" width="340" height="100" rx="6"/><text class="h" x="586" y="255" fill="var(--a1)">2. Run it past the standards</text><text x="586" y="280">is it clear, accurate,</text><text x="586" y="298">relevant to my pupils?</text><text class="m" x="586" y="314">evidence before deciding</text><rect class="bad" x="30" y="340" width="340" height="100" rx="6"/><text class="h" x="200" y="375" fill="var(--a3)">3. Outcome</text><text x="200" y="400">busy lesson, little learning -</text><text x="200" y="418">the claim was vague and unchecked</text><rect class="good" x="416" y="340" width="340" height="100" rx="6"/><text class="h" x="586" y="375" fill="var(--a1)">3. Outcome</text><text x="586" y="400">adopt only if evidence -</text><text x="586" y="418">holds up, and adapt to my class</text><line x1="200" y1="200" x2="200" y2="218" stroke="var(--a3)" stroke-width="2"/><line x1="586" y1="200" x2="586" y2="218" stroke="var(--a1)" stroke-width="2"/><line x1="200" y1="320" x2="200" y2="338" stroke="var(--a3)" stroke-width="2"/><line x1="586" y1="320" x2="586" y2="338" stroke="var(--a1)" stroke-width="2"/><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>