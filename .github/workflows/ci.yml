name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two jobs talk to the SAME Supabase project: `rls` (test:rls) and `e2e` both
# create real users, classes and submissions there. Two of them in flight at once
# race on shared rows - which is exactly how three overlapping runs (two `main`
# pushes plus a PR) collided on the RLS suite's fixture join codes and left
# stranded classes behind, taking `main` red until they were purged by hand.
#
# So those two jobs, and only those two, serialize on one group with `queue: max`
# so a second one genuinely queues. The default, `queue: single`, holds at most
# ONE pending entry and cancels it the moment a third joins the group. On
# 2026-09-14 that silently dropped main's run for 18adacc when a PR push landed
# behind it, leaving a merge commit with no CI verdict at all and
# scripts/deploy-prod.sh holding that SHA forever. `queue: max` keeps up to 100
# waiting in FIFO order instead, so nothing is dropped.
#
# `cancel-in-progress` is deliberately absent, not merely false: it cannot be
# combined with queueing, and cancelling mid-suite is what strands fixture rows
# in the first place. A queued job waits rather than killing the one holding
# the database.
#
# Content fast lane (owner, 2026-10-17). The group used to sit on the whole
# workflow, so every crew content PR waited ~20 min per run behind every other
# run: 23 runs deep, about 7 hours. `build` (every content gate, unit tests and
# the two-locale build) touches no database, so it now runs outside the group
# and in parallel. A PR whose files are ALL content (see `changes`) skips `rls`
# and `e2e`; a skipped job does not fail the run. Every push to `main` still
# runs everything, so scripts/deploy-prod.sh, which deploys only a main SHA whose
# ci.yml run succeeded, is gated exactly as before. `e2e` reuses `build`'s
# output instead of rebuilding while it holds the database.

jobs:
  # Decides whether this run needs the Supabase suites. Content-only means every
  # changed file is course content, its Urdu mirror, figures, specs or records;
  # anything else (src/, scripts/, config, catalog, supabase/, workflows,
  # package files, UI translations) runs the full suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      video: ${{ steps.classify.outputs.video }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then { echo "app=true"; echo "video=true"; } >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          # video-studio/ is a separate sub-project (ADR-0031): it gets its own job below and,
          # touching neither the app nor the database, does not by itself trigger rls/e2e.
          if echo "$changed" | grep -q '^video-studio/'; then echo "video=true" >> "$GITHUB_OUTPUT"; else echo "video=false" >> "$GITHUB_OUTPUT"; fi
          content='^(docs|licence|guides|history|specs|video-studio)/|^i18n/[^/]+/docusaurus-plugin-content-docs[^/]*/|^static/img/figures/'
          other=$(echo "$changed" | grep -Ev "$content" || true)
          if [ -n "$other" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            { echo "Full suite: non-content files changed:"; echo "$other" | head -20; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Content-only PR: rls and e2e skipped (they run on the main push)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Figure geometry: text overlapping text, spilling out of its panel, or past the
  # viewBox (scripts/measure-figure-text.mjs). Only SVGs this change adds or edits
  # are measured, so the corpus's existing collisions (specs/gaps.md) never turn an
  # unrelated PR red. Runs on content-only PRs too, which is where figures change.
  figure-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: svgs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "base=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          n=$(git diff --name-only --diff-filter=AM "$BASE...HEAD" -- static/img/figures | grep -c '\.svg$' || true)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - if: steps.svgs.outputs.count > 0
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.svgs.outputs.count > 0
        run: npm ci && npx playwright install --with-deps chromium
      - if: steps.svgs.outputs.count > 0
        name: Measure changed figure SVGs
        run: node scripts/measure-figure-text.mjs --changed ${{ steps.svgs.outputs.base }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Build gate: block on missing metadata / EN<->UR parity / glossary refs / weighting (FR-009, SC-007)
      - name: Validate content
        run: npm run validate:content

      # Pipeline gate: tracker completeness, content-spec approval, terminology conformance
      # (Spec 006 FR-016a/b/c, SC-007) — runs after content-shape validation, before build.
      - name: Pipeline gate (tracker, content-spec, terminology)
        env:
          CONTENT_REVIEW_PUBLIC_KEY: ${{ secrets.CONTENT_REVIEW_PUBLIC_KEY }}
        run: npm run check:pipeline-gate

      # Depth gate: for every unit whose content-spec subsection carries a `### Sub-topic
      # checklist`, checks concept coverage, the required index.mdx blocks, the formative
      # floor, the reading-minutes band, and coverage↔sources consistency (Spec 007 FR-012,
      # SC-004/SC-007). Units without a checklist are grandfathered/skipped.
      - name: Depth gate (concept coverage, required blocks, formative floor)
        run: npm run check:depth-gate

      # Figure marker gate: for every new-shape (per-topic) unit, checks that every topic file
      # carries ≥1 well-formed unique FIGURE marker and that the marker set matches the
      # specs/content/<course>/figures/unit-NN.md manifest both ways (Spec 008 FR-012–014).
      # Legacy units (no topic-*.mdx) are skipped.
      - name: Figure marker gate
        run: npm run check:figures

      - name: Docs/code sync gate (shared constants, style-guide freeze marker, CI coverage)
        run: npm run check:docs-sync

      - name: Figure dark-variant freshness
        run: npm run figures:variants:check


      # Publication-state report (Spec 010 FR-032; ADR-0026). Now BLOCKING, because
      # every publication notice is derived from it and docusaurus.config.ts refuses
      # to build without a current one.
      #
      # It is generated first because `static/content-status.json` is gitignored, so
      # a fresh checkout has none. That means the CI run of `--check` proves the
      # generator runs cleanly against this tree and that every tracker row it reads
      # is well formed - it does NOT prove a committed report is current, because
      # there is no committed report. The staleness protection that matters lives in
      # two other places: `--check` locally, inside the CONTENT_GATES tier, catches
      # a stale working-tree report before commit; and the config's own tracker-digest
      # assertion catches one at build time, which is the case that could actually
      # mislead a reader.
      - name: Content status report
        run: node scripts/report-content-status.mjs && npm run check:content-status

      # Zero em dash in authored content (Constitution Art. III.9) - docs/, guides/,
      # i18n/, specs/content/. history/ is exempt as an immutable record.
      - name: No em dash in content
        run: npm run check:no-em-dash

      # No answer keys / private marking material in public content (FR-012, SC-010, T028)
      - name: Answer-key safety check
        run: npm run check:no-answer-keys

      # Concept-graph gate: coverage, orphans, prerequisite cycles, assessment
      # linkage (Feature 016, style guide v4.0). Opt-in per unit.
      - name: Concept-graph gate
        run: npm run check:concept-graph

      # Bloom band gate: every authored `*(Level)*` tag sits inside the band its unit
      # spec declares. Nothing compared the two until three breaches had reached G3.
      - name: Bloom band gate
        run: npm run check:bloom-bands

      # Open-access source floor (D-2026-0013, G-2026-17). Opt-in per course via
      # `open_access_floor` in its content-spec. This is the control the owner's
      # ruling assumed existed when it accepted authoring EFMP-304 against seven
      # print-only monographs.
      - name: Open-access source floor
        run: npm run check:source-floor

      # Licence track (Feature 024): registry closure, front matter, degree
      # cross-link resolution, depth by coverage, practice shape, Urdu parity.
      - name: Licence track gate
        run: npm run check:licence

      - name: Licence reverse-link map freshness
        run: npm run licence:map:check

      # Adding a course is content-only — zero platform-code change (FR-005, SC-006, T034)
      - name: Add-course content-only check
        run: npm run check:add-course

      # Video sub-project: no media or consent record is ever tracked (ADR-0031, owner rule 2026-10-25)
      - name: No media in video-studio
        run: node scripts/check-no-media-in-video-studio.mjs

      # Same zero-em-dash rule for the video sub-project. Invoked with --scan-dir rather than by
      # widening the gate's default roots: check-no-em-dash.mjs is a bound review-evidence input,
      # so editing it would reopen every unit's G2/G3 evidence.
      - name: No em dash in video-studio
        run: node scripts/check-no-em-dash.mjs --scan-dir video-studio

      # Validator fixture tests (T013/T014/T032/T033)
      - name: Unit tests
        run: npm test

      - name: Agent review evidence tests
        run: npm run test:review

      # Static build for both locales (FR-001)
      - name: Build (en + ur)
        env:
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
        run: npm run build

      # e2e serves this exact build rather than rebuilding while it holds the database.
      - name: Keep the build for e2e
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build/
          retention-days: 1

      # No answer keys leaked into the built output either (T028)
      - name: Answer-key safety check (built output)
        run: npm run check:no-answer-keys

      # Service-role key must never reach src/ or the built output (Spec 002,
      # Constitution Art. V.1) — release-blocking if it ever does.
      - name: Service-role key safety check
        run: npm run check:no-service-key

      # Lighthouse budget: a11y ≥ 0.9, FCP < 2.5s Slow-4G, total weight budget (SC-002, T038).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun || echo "::warning::Lighthouse budget not met"

  # Video sub-project (ADR-0031): its own lockfile, typecheck and unit tests. No render here:
  # renders run on Kaggle (VS-ADR-0011), never in CI.
  video-studio:
    needs: [changes]
    if: needs.changes.outputs.video == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: node --import tsx --test tests/*.test.ts

  rls:
    # Waits for `build`, like `e2e`: when the build fails the run is red anyway, and an
    # RLS suite started beside it only burns runner minutes and holds the shared-supabase
    # queue for others (owner, 2026-10-18, after cancelling such runs by hand).
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: shared-supabase
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Spec 002 SC-004 evidence — the RLS access-control matrix. Negative
      # cases are mandatory; treat a missing/skipped one as a failing gate,
      # per rls-matrix-results.md. Runs against the live self-hosted instance
      # (ADR-0006) — repo secrets, not a mocked or ephemeral database.
      - name: RLS access-control tests
        env:
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:rls

  e2e:
    # Browser e2e (T012/T022/T023/T027, plus Spec 002's auth-*.spec.ts) — needs
    # a real build + browser host deps, which the sandbox lacks; GitHub Actions
    # ubuntu provides them. Search e2e needs the production build's index, so
    # we serve the build rather than the dev server. The auth specs need the
    # same three secrets as the RLS job above — without them they `test.skip`
    # rather than fail, so a missing secret silently drops coverage instead of
    # loudly breaking the build. Watch the job summary for skip counts.
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    concurrency:
      group: shared-supabase
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the build job's output
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build/
      # `docusaurus serve` loads docusaurus.config.ts, which refuses to start without
      # the gitignored static/content-status.json. The build job generated its own;
      # this job reuses the build, not that checkout, so it generates it too.
      - name: Content status report (needed to load the site config)
        run: node scripts/report-content-status.mjs
      - name: Install Playwright + browser deps
        run: npx playwright install --with-deps chromium
      - name: Run e2e (against served build)
        env:
          PW_WEBSERVER: npm run serve -- --port 3000
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e
      # Traces/screenshots only exist when a test fails (playwright.config.ts
      # `retain-on-failure`/`only-on-failure`) — upload them so a CI-specific
      # failure is actually debuggable instead of guesswork from log text alone.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
