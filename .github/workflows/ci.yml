name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every run of this workflow talks to the SAME Supabase project: `test:rls` and
# `test:e2e` both create real users, classes and submissions there. Two runs in
# flight at once therefore race on shared rows - which is exactly how three
# overlapping runs (two `main` pushes plus a PR) collided on the RLS suite's
# fixture join codes and left stranded classes behind, taking `main` red until
# they were purged by hand.
#
# Serialize on one group so a second run queues instead of racing - and use
# `queue: max` so that it genuinely queues. The default, `queue: single`, holds
# at most ONE pending run and cancels it the moment a third run joins the
# group. On 2026-09-14 that silently dropped main's run for 18adacc when a PR
# push landed behind it, leaving a merge commit with no CI verdict at all and
# scripts/deploy-prod.sh holding that SHA forever. `queue: max` keeps up to 100
# runs waiting in FIFO order instead, so nothing is dropped.
#
# `cancel-in-progress` is deliberately absent, not merely false: it cannot be
# combined with queueing, and cancelling mid-suite is what strands fixture rows
# in the first place. A queued run waits rather than killing the one holding
# the database.
concurrency:
  group: shared-supabase
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Build gate: block on missing metadata / EN<->UR parity / glossary refs / weighting (FR-009, SC-007)
      - name: Validate content
        run: npm run validate:content

      # Pipeline gate: tracker completeness, content-spec approval, terminology conformance
      # (Spec 006 FR-016a/b/c, SC-007) — runs after content-shape validation, before build.
      - name: Pipeline gate (tracker, content-spec, terminology)
        env:
          CONTENT_REVIEW_PUBLIC_KEY: ${{ secrets.CONTENT_REVIEW_PUBLIC_KEY }}
        run: npm run check:pipeline-gate

      # Depth gate: for every unit whose content-spec subsection carries a `### Sub-topic
      # checklist`, checks concept coverage, the required index.mdx blocks, the formative
      # floor, the reading-minutes band, and coverage↔sources consistency (Spec 007 FR-012,
      # SC-004/SC-007). Units without a checklist are grandfathered/skipped.
      - name: Depth gate (concept coverage, required blocks, formative floor)
        run: npm run check:depth-gate

      # Figure marker gate: for every new-shape (per-topic) unit, checks that every topic file
      # carries ≥1 well-formed unique FIGURE marker and that the marker set matches the
      # specs/content/<course>/figures/unit-NN.md manifest both ways (Spec 008 FR-012–014).
      # Legacy units (no topic-*.mdx) are skipped.
      - name: Figure marker gate
        run: npm run check:figures

      - name: Docs/code sync gate (shared constants, style-guide freeze marker, CI coverage)
        run: npm run check:docs-sync

      - name: Figure dark-variant freshness
        run: npm run figures:variants:check


      # Content/figure status report (Spec 010, FR-032) - informational only, never
      # blocking: reuses the depth-gate and figure-manifest logic above via shared
      # modules (scripts/lib/), so it cannot drift from either gate.
      - name: Content status report
        run: npm run check:content-status || echo "::warning::content-status report failed"

      # Zero em dash in authored content (Constitution Art. III.9) - docs/, guides/,
      # i18n/, specs/content/. history/ is exempt as an immutable record.
      - name: No em dash in content
        run: npm run check:no-em-dash

      # No answer keys / private marking material in public content (FR-012, SC-010, T028)
      - name: Answer-key safety check
        run: npm run check:no-answer-keys

      # Concept-graph gate: coverage, orphans, prerequisite cycles, assessment
      # linkage (Feature 016, style guide v4.0). Opt-in per unit.
      - name: Concept-graph gate
        run: npm run check:concept-graph

      # Adding a course is content-only — zero platform-code change (FR-005, SC-006, T034)
      - name: Add-course content-only check
        run: npm run check:add-course

      # Validator fixture tests (T013/T014/T032/T033)
      - name: Unit tests
        run: npm test

      - name: Agent review evidence tests
        run: npm run test:review

      # Static build for both locales (FR-001)
      - name: Build (en + ur)
        env:
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
        run: npm run build

      # No answer keys leaked into the built output either (T028)
      - name: Answer-key safety check (built output)
        run: npm run check:no-answer-keys

      # Service-role key must never reach src/ or the built output (Spec 002,
      # Constitution Art. V.1) — release-blocking if it ever does.
      - name: Service-role key safety check
        run: npm run check:no-service-key

      # Spec 002 SC-004 evidence — the RLS access-control matrix. Negative
      # cases are mandatory; treat a missing/skipped one as a failing gate,
      # per rls-matrix-results.md. Runs against the live self-hosted instance
      # (ADR-0006) — repo secrets, not a mocked or ephemeral database.
      - name: RLS access-control tests
        env:
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:rls

      # Lighthouse budget: a11y ≥ 0.9, FCP < 2.5s Slow-4G, total weight budget (SC-002, T038).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun || echo "::warning::Lighthouse budget not met"

  e2e:
    # Browser e2e (T012/T022/T023/T027, plus Spec 002's auth-*.spec.ts) — needs
    # a real build + browser host deps, which the sandbox lacks; GitHub Actions
    # ubuntu provides them. Search e2e needs the production build's index, so
    # we serve the build rather than the dev server. The auth specs need the
    # same three secrets as the RLS job above — without them they `test.skip`
    # rather than fail, so a missing secret silently drops coverage instead of
    # loudly breaking the build. Watch the job summary for skip counts.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - name: Build
        env:
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Install Playwright + browser deps
        run: npx playwright install --with-deps chromium
      - name: Run e2e (against served build)
        env:
          PW_WEBSERVER: npm run serve -- --port 3000
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e
      # Traces/screenshots only exist when a test fails (playwright.config.ts
      # `retain-on-failure`/`only-on-failure`) — upload them so a CI-specific
      # failure is actually debuggable instead of guesswork from log text alone.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
