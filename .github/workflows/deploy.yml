name: Deploy (GitHub Pages fallback)

# Vercel is the primary host (vercel.json); this workflow is the free GitHub Pages
# fallback (research R9). Enable Pages in repo Settings → Pages (source: GitHub Actions),
# and set `url`/`baseUrl` in docusaurus.config.ts to the Pages URL before first deploy.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - name: Build
        env:
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
