name: Deploy (GitHub Pages fallback)

# Production is the self-hosted origin (www.a2ahs.com on the project's own
# server, deployed by scripts/deploy-prod.sh via cron — pull-based, CI-gated).
# This workflow is only the never-enabled GitHub Pages fallback (research R9);
# it 404s on every run because Pages was never turned on in repo settings, so
# the push trigger is disabled to stop failing every merge to main. Manual
# dispatch is kept in case Pages is ever actually set up (enable Pages in
# Settings → Pages first, and set `url`/`baseUrl` in docusaurus.config.ts).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - name: Build
        env:
          DOCUSAURUS_SUPABASE_URL: ${{ secrets.DOCUSAURUS_SUPABASE_URL }}
          DOCUSAURUS_SUPABASE_ANON_KEY: ${{ secrets.DOCUSAURUS_SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
