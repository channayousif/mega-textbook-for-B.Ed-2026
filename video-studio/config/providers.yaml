# Which provider each stage uses. v1 = all manual (constitution V: subscriptions only).
# Switching a stage to an API provider requires an ADR and, if it bills, a constitution amendment.
version: 1

voice:
  active: manual-import
  available:
    manual-import: { mode: manual, rights_note: "Owner-approved Urdu WAV/MP3 from licensed source; see VS-ADR-0009" }
    manual-ai-studio: { mode: manual, open_url: "https://aistudio.google.com/generate-speech", rights_note: "Generated by owner in Google AI Studio (Gemini TTS); terms as checked in spike T013b" }   # verify URL at build time
    human-narrator:   { mode: manual, rights_note: "Recorded by named narrator; written consent in brand/consents/" }
    gemini-tts-api:   { mode: api, enabled: false, needs: [GEMINI_API_KEY], note: "free tier possible; separate data terms" }

video:            # B-roll
  active: manual-flow
  available:
    manual-flow: { mode: manual, open_url: "https://labs.google/fx/tools/flow", model: "select-current-available-model", credits_per_clip: null, rights_note: "Generated by owner in Google Flow under Google AI Pro terms" }
    veo-api:     { mode: api, enabled: false, needs: [GEMINI_API_KEY], note: "pay per second - needs constitution amendment" }
    longcat:     { mode: manual, enabled: false, note: "pending OQ1 / VS-ADR-0004" }

image:
  active: manual-gemini
  available:
    manual-gemini:  { mode: manual, open_url: "https://gemini.google.com/app", rights_note: "Generated by owner in Gemini app under Google AI Pro terms" }
    manual-chatgpt: { mode: manual, open_url: "https://chatgpt.com/", rights_note: "Generated by owner in ChatGPT under Plus terms" }
    agy-gemini:     { mode: local, enabled: false, command: "node ../scripts/generate-illustration.mjs", rights_note: "Generated by Claude via Gemini agy under root ADR-0029; serial, local, never in CI" }
    gemini-image-api: { mode: api, enabled: false }

compute:          # where align / render / audit / stills run (VS-ADR-0011)
  active: kaggle
  available:
    kaggle: { mode: remote, accelerator: "gpu-t4x2", internet: true, dataset_visibility: private,
              token: "~/.kaggle/kaggle.json (never in the repo)", weekly_gpu_hours_note: "about 30 h/week; verify at spike time",
              final_encoder: x264, preview_encoder: nvenc, note: "free tier; no billing account" }
    kaggle-cpu: { mode: remote, accelerator: none, note: "fallback when GPU quota is spent; slower alignment" }
    local:  { mode: local, note: "owner's own PC only; never the production server (2 CPU, live site)" }

publish:
  active: manual
  available:
    manual:          { mode: manual }
    youtube-api:     { mode: api, enabled: false, needs: [GOOGLE_OAUTH_CLIENT], note: "free quota; OQ3" }
    meta-graph-api:  { mode: api, enabled: false, needs: [META_APP, IG_BUSINESS_ACCOUNT] }

claude_cli:       # run Claude Code jobs from the Studio (VS-ADR-0007)
  enabled: false
  binary: claude
  allowed_commands: ["/video-harvest", "/video-new", "/video-publish"]
  allowed_agents: ["pedagogy-reviewer", "urdu-language-reviewer", "brand-qa-reviewer"]
