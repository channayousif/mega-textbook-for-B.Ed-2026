# Brand bible - single source of truth for look and sound.
# Locked keys (marked LOCK) change only via an ADR. TODO values are filled during Phase 1.
# Path rule: "assets/..." resolves against $MEDIA_ROOT/brand-assets/ (media is never in git);
# "repo:..." resolves against the parent repo root.
version: 1
status: draft            # draft → locked (after Checkpoint 1)

channel:
  name_ur: "میگا ٹیکسٹ بک"          # TODO confirm with owner
  name_en: "Mega Textbook"
  handle: "@textbookpk"              # use approved by owner 2026-10-26; TODO reserve on each platform
  tagline_ur: "استاد بننے کا سفر، آسان اردو میں"   # TODO approve
  site: "https://textbook.com.pk"
  site_ur: "https://textbook.com.pk/ur/"

format:                  # LOCK
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 52
  min_seconds: 40
  max_seconds: 60
  safe_zone: { top: 250, bottom: 420, sides: 60 }
  pace_words_per_minute: 150        # calibrate after voice casting

colors:                  # pre-filled 2026-10-26 from the site: src/css/custom.css (--ifm-color-primary ramp)
                         # and scripts/lib/figure-palette.mjs LIGHT_TOKENS. Owner confirms before lock.
  primary: "#1f6f5c"                # --ifm-color-primary / figure a1 (6.02:1 on white)
  primary_dark: "#154b3e"           # --ifm-color-primary-darkest
  accent: "#b8551d"                 # figure a3; active caption word, highlights
  secondary: "#15476b"              # figure a2
  background: "#ffffff"             # figure bg
  panel: "#eef3f1"                  # figure panel
  ink: "#132a24"                    # figure ink
  muted: "#566b65"                  # figure muted
  success: "#1f6f5c"
  warning: "#b8551d"

typography:              # LOCK after Phase 1
  urdu_display: { family: "Noto Nastaliq Urdu", weight: 700, file: "assets/fonts/NotoNastaliqUrdu-Bold.ttf" }   # not on the site; fetch OFL Bold at build time
  urdu_body:    { family: "Noto Nastaliq Urdu", weight: 400, file: "repo:static/fonts/NotoNastaliqUrdu-Regular.woff2" }   # the site's own self-hosted copy (OFL)
  latin:        { family: "Inter", weight: 600, file: "assets/fonts/Inter-SemiBold.ttf" }   # URLs only
  captions: { size_px: 68, line_height: 1.9, max_words_per_line: 4, max_lines: 2, stroke_px: 6 }
  digits: "western"                 # "western" (123) or "urdu" (۱۲۳)

logo:
  full: "repo:static/img/logo.svg"     # the site's only logo; use on social platforms approved by owner 2026-10-26
  mark: "repo:static/img/favicon.svg"  # square mark; approved by owner 2026-10-26

sets:                    # backgrounds drawn once, reused
  classroom: { file: "assets/sets/classroom.png", description: "Bright Sindh government-school classroom, green board, ceramic-tile floor, window light, potted plant, flat 2D illustration" }
  staffroom: { file: "assets/sets/staffroom.png", description: "Teachers' staffroom, shelves of books, tea cups, warm light" }
  studio:    { file: "assets/sets/studio.png",    description: "Plain brand-colour backdrop with subtle pattern for diagrams" }

art_style:               # LOCK - appended to every image/B-roll prompt
  prompt_suffix: >-
    flat 2D vector illustration, soft cel shading, clean outlines, warm natural light,
    palette of deep teal green #1f6f5c, burnt orange #b8551d and white with pale sage #eef3f1,
    South Asian (Sindh, Pakistan) setting and people, modest everyday clothing,
    friendly educational explainer style, no text, no letters, no logos, no watermarks
  negative: "photorealistic, 3D render, text, captions, subtitles, logos, distorted hands, extra fingers"

characters:              # LOCK after Checkpoint 1 - details in characters/*.md
  ustani:
    sheet: "characters/ustani-farzana.md"
    display_name_ur: "استانی فرزانہ"
    role: "host - experienced teacher educator; explains"
    voice: { card: "voices/ustani.md", status: "locked 2026-10-27, cleared" }   # VS-ADR-0013: consented narrator, consent narrator-02
    style_prompt: "Speak in clear standard Urdu like a warm, confident teacher educator; moderate pace; friendly and encouraging."
    puppet_dir: "assets/cast/ustani"
  shagird:
    sheet: "characters/shagird-bilal.md"
    display_name_ur: "بلال"
    role: "co-host - B.Ed student / licence aspirant; asks questions, gives the CTA"
    voice: { card: "voices/shagird.md", status: "locked 2026-10-27, cleared" } # VS-ADR-0012: owner voice, consent narrator-01
    style_prompt: "Speak in natural conversational Urdu like a curious, upbeat young trainee teacher; slightly faster pace."
    puppet_dir: "assets/cast/shagird"

audio:
  music_bed: "assets/audio/bed-01.wav"        # TODO royalty-free or self-made; record licence in assets/README.md
  music_duck_db: -18
  sting: "assets/audio/sting.wav"
  target_lufs: -14
  true_peak_db: -1
  line_gap_ms: 150

cta_templates:           # Claude chooses one; text must remain within 6 seconds
  - id: full-chapter
    text_ur: "پورا سبق مفت پڑھیں، اردو اور انگریزی میں - لنک نیچے ہے۔"
  - id: licence-prep
    text_ur: "ٹیچنگ لائسنس کی مکمل تیاری مفت - textbook.com.pk پر۔"
  - id: save-share
    text_ur: "یہ ویڈیو اپنے ساتھی استاد کو بھیجیں، اور مکمل سبق ویب سائٹ پر دیکھیں۔"

series:                  # optional recurring formats
  - { key: "ek-minute", name_ur: "ایک منٹ میں", description: "one concept explained in under a minute" }
  - { key: "licence-tip", name_ur: "لائسنس ٹِپ", description: "STEDA licence exam concept" }
  - { key: "myth-fact", name_ur: "غلط فہمی یا حقیقت؟", description: "common classroom myth corrected" }

pronunciation_lexicon:   # T015, verified by VS-003 rounds 6-7 (results-round7-review.csv)
  # Owner rule 2026-10-27: a `gloss: true` term is spoken in Urdu, then in English, on first use in an
  # episode: "<term>، یعنی <en>،". Captions keep the English in Latin letters; the TTS handoff speaks
  # `deva` and `en_deva` (Chatterbox reads Devanagari; izafat joined, never "-ए-"). `term`/`en` come
  # from the term bank specs/content/terminology.csv. risk: low = heard right 3 of 3 takes; medium =
  # a sound slips in some takes; high = wrong in every take, whatever the spelling (the gloss carries it).
  # `say` is an Urdu-script respelling for a TTS that reads Urdu script.
  - { term: "مثبت تقویت", en: "Positive Reinforcement", deva: "मुस्बत तक़वियत", en_deva: "पॉज़िटिव रीइन्फ़ोर्समेंट", gloss: true, risk: low, tested: "r7 t01: 3/3" }
  - { term: "اضطراب", en: "Anxiety", deva: "इज़्तिराब", en_deva: "ऐंग्ज़ायटी", gloss: true, risk: high, tested: "r7 t02: heard as استراب 3/3" }
  - { term: "معیارِ جانچ", en: "Rubric", deva: "मेयारे जाँच", en_deva: "रूब्रिक", gloss: true, risk: low, tested: "r7 t03: 3/3" }
  - { term: "ضابطہ اخلاق", en: "Code of Ethical Conduct", deva: "ज़ाब्तए अख़लाक़", en_deva: "कोड ऑफ़ एथिकल कंडक्ट", gloss: true, risk: medium, tested: "r7 t04: 1/3 heard as ذات اخلاق" }
  - { term: "خود انضباطی", en: "Self-Regulation", deva: "ख़ुद इन्ज़िबाती", en_deva: "सेल्फ़ रेगुलेशन", gloss: true, risk: high, tested: "r7 t05: heard as انجیباتی 3/3" }
  - { term: "ڈیجیٹل پیشہ واریت", en: "Digital Professionalism", deva: "डिजिटल पेशावारियत", en_deva: "डिजिटल प्रोफ़ेशनलिज़्म", gloss: true, risk: low, tested: "r7 t06: 3/3" }
  - { term: "طرزِ تعلم", en: "Learning Style", deva: "तर्ज़े तअल्लुम", en_deva: "लर्निंग स्टाइल", gloss: true, risk: low, tested: "r7 t07: 3/3" }
  - { term: "ترقی پذیر ذہنیت", en: "Growth Mindset", deva: "तरक़्क़ी-पज़ीर ज़ेहनियत", en_deva: "ग्रोथ माइंडसेट", gloss: true, risk: medium, tested: "r7 t08: ذ heard as ج 2/3" }
  - { term: "تعلیمی نفسیات", en: "Educational Psychology", deva: "तालीमी नफ़सियात", en_deva: "एजुकेशनल साइकोलॉजी", gloss: true, risk: low, tested: "r7 t09: 3/3" }
  - { term: "تعمیریت", en: "Constructivism", deva: "तामीरियत", en_deva: "कंस्ट्रक्टिविज़्म", gloss: true, risk: low, tested: "r7 t10: 3/3" }
  - { term: "باطنی محرک", en: "Intrinsic Motivation", deva: "बातिनी मुहर्रिक", en_deva: "इंट्रिंसिक मोटिवेशन", gloss: true, risk: low, tested: "r7 t11: 3/3" }
  - { term: "خارجی محرک", en: "Extrinsic Motivation", deva: "ख़ारिजी मुहर्रिक", en_deva: "एक्सट्रिंसिक मोटिवेशन", gloss: true, risk: medium, tested: "r7 t12: heard as مہرلک 3/3" }
  - { term: "ادراکی نشوونما", en: "Cognitive Development", deva: "इदराकी नशोनुमा", en_deva: "कॉग्निटिव डेवलपमेंट", gloss: true, risk: low, tested: "r7 t13: 3/3" }
  - { term: "انفرادی اختلافات", en: "Individual Differences", deva: "इन्फ़िरादी इख़्तिलाफ़ात", en_deva: "इंडिविजुअल डिफ़रेंसेज़", gloss: true, risk: low, tested: "r7 t14: 3/3" }
  - { term: "تشکیلی تشخیص", en: "Formative Assessment", deva: "तश्कीली तशख़ीस", en_deva: "फ़ॉर्मेटिव असेसमेंट", gloss: true, risk: low, tested: "r7 t15: 3/3" }
  - { term: "مجموعی جائزہ", en: "Summative Assessment", deva: "मजमूई जाइज़ा", en_deva: "समेटिव असेसमेंट", gloss: true, risk: low, tested: "r7 t16: 3/3" }
  - { term: "تدریسیات", en: "Pedagogy", deva: "तदरीसियात", en_deva: "पेडागॉजी", gloss: true, risk: low, tested: "r7 t17: 3/3" }
  - { term: "حکمتِ تدریس", en: "Teaching Strategy", deva: "हिकमते तदरीस", en_deva: "टीचिंग स्ट्रैटेजी", gloss: true, risk: low, tested: "r7 t18: 3/3" }
  - { term: "جماعتی انتظام", en: "Classroom Management", deva: "जमाअती इंतिज़ाम", en_deva: "क्लासरूम मैनेजमेंट", gloss: true, risk: low, tested: "r7 t19: 3/3" }
  - { term: "نتیجہ ہائے تعلم", en: "Learning Outcome", deva: "नतीजा हाए तअल्लुम", en_deva: "लर्निंग आउटकम", gloss: true, risk: low, tested: "r7 t20: 3/3" }
  - { term: "قلیل مدتی یادداشت", en: "Short-Term Memory", deva: "क़लील मुद्दती याददाश्त", en_deva: "शॉर्ट टर्म मेमोरी", gloss: true, risk: medium, tested: "r7 t21: ق heard as ک 3/3" }
  - { term: "مراہقت", en: "Adolescence", deva: "मुराहिक़त", en_deva: "एडोलेसेंस", gloss: true, risk: low, tested: "r7 t22: 3/3" }
  - { term: "مابعد ادراک", en: "Metacognition", deva: "माबाद इदराक", en_deva: "मेटाकॉग्निशन", gloss: true, risk: low, tested: "r7 t23: 3/3" }
  - { term: "معاونتی تدریس", en: "Scaffolding", deva: "मुआविनती तदरीस", en_deva: "स्कैफ़ोल्डिंग", gloss: true, risk: low, tested: "r7 t24: 3/3" }
  - { term: "علاقہ ہائے قربی نشوونما", en: "Zone of Proximal Development", deva: "इलाक़ा हाए क़ुर्बी नशोनुमा", en_deva: "ज़ोन ऑफ़ प्रॉक्सिमल डेवलपमेंट", gloss: true, risk: low, tested: "r7 t25: 3/3" }
  - { term: "تنقیدی سوچ", en: "Critical Thinking", deva: "तन्क़ीदी सोच", en_deva: "क्रिटिकल थिंकिंग", gloss: true, risk: low, tested: "r7 t26: 3/3" }
  - { term: "شمولیتی تعلیم", en: "Inclusive Education", deva: "शुमूलियती तालीम", en_deva: "इन्क्लूसिव एजुकेशन", gloss: true, risk: low, tested: "r7 t27: 3/3" }
  - { term: "تاملی مشق", en: "Reflective Practice", deva: "तअम्मुली मश्क़", en_deva: "रिफ़्लेक्टिव प्रैक्टिस", gloss: true, risk: medium, tested: "r7 t28: heard as تعملی مشک 3/3" }
  - { term: "اخلاقی مخمصہ", en: "Ethical Dilemma", deva: "अख़लाक़ी मख़मसा", en_deva: "एथिकल डिलेमा", gloss: true, risk: medium, tested: "r7 t29: خ heard as ک 3/3" }
  - { term: "طالب علم", deva: "तालिबे इल्म", gloss: false, risk: low, tested: "r6: heard right in 8 of 9 respelled takes (तालिब-ए-इल्म gave طالب اے علم)" }
  - { term: "تحریکِ علی گڑھ", en: "Aligarh Movement", deva: "तहरीके अली गढ़", gloss: false, risk: low, tested: "r6 u19r 3/3; joined अलीगढ़ is heard as علیگرد, so no English gloss" }
  - { term: "STEDA", say: "اسٹیڈا", gloss: false, note: "always spoken, written in Latin on screen; deva untested" }

publishing:
  utm: "utm_source={platform}&utm_medium=shorts&utm_campaign={episode_id}"
  hashtags_base: ["#ٹیچر_ٹریننگ", "#BEd", "#TeachingLicence", "#Sindh", "#اردو"]
  ai_disclosure_ur: "اس ویڈیو میں AI سے بنائی گئی آواز اور تصاویر شامل ہیں۔"
