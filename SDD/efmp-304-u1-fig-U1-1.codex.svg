<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="t">Thinking and its functions</title><desc id="d">A concept map placing "thinking" at the centre with its functions branching off and critical thinking marked as the branch that evaluates the others.</desc><style> :root{--bg:#ffffff;--panel:#eef3f1;--ink:#132a24;--muted:#566b65;--line:#1f6f5c;--a1:#1f6f5c;--a1-fill:#e6efed;--a2:#15476b;--a2-fill:#e6ebf0;--a3:#b8551d;--a3-fill:#f0e9e5;--a4:#7b3886;--a4-fill:#ede7ee;--wm:#8b9a95} .bg { fill: var(--bg); } .panel { fill: var(--panel); stroke: var(--ink); stroke-width: 2.5; } .link { stroke: var(--line); stroke-width: 2.5; fill: none; } .critical-link { stroke: var(--a2); stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; } .core { fill: var(--a1-fill); stroke: var(--a1); stroke-width: 3; } .critical { fill: var(--a2-fill); stroke: var(--a2); stroke-width: 2.5; stroke-dasharray: 7 5; } .ink { fill: var(--ink); } .muted { fill: var(--muted); } text { font-size: 15px; fill: var(--ink); } .h { font-size: 16px; font-weight: 700; fill: var(--ink); } .small { font-size: 13px; fill: var(--muted); } .wm { fill: var(--wm); font-size: 11px; } .ah { fill: var(--line); } .ah-critical { fill: var(--a2); } </style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="critical-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-critical"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="470"/><text class="h" x="390" y="28" text-anchor="middle">Functions of thinking</text><line class="link" x1="322" y1="190" x2="204" y2="118" marker-end="url(#arrow)"/><line class="link" x1="390" y1="170" x2="390" y2="112" marker-end="url(#arrow)"/><line class="link" x1="458" y1="190" x2="576" y2="118" marker-end="url(#arrow)"/><line class="link" x1="322" y1="250" x2="238" y2="328" marker-end="url(#arrow)"/><line class="link" x1="458" y1="250" x2="542" y2="328" marker-end="url(#arrow)"/><line class="critical-link" x1="390" y1="270" x2="390" y2="342" marker-end="url(#critical-arrow)"/><rect class="panel" x="28" y="66" width="176" height="58" rx="10"/><text class="h" x="116" y="101" text-anchor="middle">Remembering</text><rect class="panel" x="292" y="54" width="196" height="58" rx="10"/><text class="h" x="390" y="89" text-anchor="middle">Imagining</text><rect class="panel" x="576" y="66" width="176" height="58" rx="10"/><text class="h" x="664" y="101" text-anchor="middle">Believing</text><rect class="panel" x="58" y="328" width="180" height="58" rx="10"/><text class="h" x="148" y="363" text-anchor="middle">Deciding</text><rect class="panel" x="542" y="328" width="180" height="58" rx="10"/><text class="h" x="632" y="363" text-anchor="middle">Reasoning</text><ellipse class="core" cx="390" cy="220" rx="94" ry="51"/><text class="h ink" x="390" y="215" text-anchor="middle">Thinking</text><text class="small muted" x="390" y="238" text-anchor="middle">uses several functions</text><path class="critical" d="M282 342 H498 L518 362 V410 L498 430 H282 L262 410 V362 Z"/><text class="h" x="390" y="375" text-anchor="middle">Critical thinking</text><text class="small muted" x="390" y="399" text-anchor="middle">evaluates the other functions</text><text class="small muted" x="390" y="447" text-anchor="middle">Dashed branch: evaluation role</text><text class="wm" x="768" y="460" text-anchor="end" aria-hidden="true">textbook.com.pk</text></svg>
